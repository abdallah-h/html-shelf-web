<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- minimum-scale=1: a page wider than the phone must never zoom the whole WebView out -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1">
<meta name="theme-color" content="#1B1F3B">
<title>رفّ المشاريع</title>
<link rel="icon" href="icons/icon-96.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--accent:#E0A458;--night:#1B1F3B;--bg:#F4F2EC;--card:#fff;--ink:#23243A;--muted:#7F7B70;--line:#E6E1D5;
    --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
  @media (prefers-color-scheme:dark){:root{--bg:#12131D;--card:#1D1F2D;--ink:#ECE9E1;--muted:#9B978C;--line:#2B2E40}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
  body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .grid>*,.row>*{min-width:0}
  header{background:radial-gradient(120% 140% at 100% 0%,#3A3F7A 0%,var(--night) 60%);color:#fff;padding:calc(20px + var(--sat)) 18px 22px;border-radius:0 0 26px 26px}
  header{position:relative}
  .cloudBtn{position:absolute;top:calc(16px + var(--sat));inset-inline-end:14px;border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;background:rgba(255,255,255,.14);color:#fff}
  .cloudBtn.err{background:#D9534F}
  #cloudBody p{margin:4px 8px 12px;color:var(--muted);font-size:14px}
  #cloudBody .btn{display:block;width:100%;text-align:center;margin-top:8px}
  header h1{margin:0;font-size:24px}header .sub{opacity:.75;font-size:14px;margin-top:2px}
  /* search + category chips stay on screen while the grid scrolls */
  /* stuck under the status bar; once the header has scrolled away a strip in the page colour sits behind the status bar */
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:41;opacity:0;transition:opacity .15s}
  body.scrolled::before{opacity:1}
  .bar{position:sticky;top:var(--sat);z-index:40;background:var(--bg);padding:10px 14px 6px}
  .search input{width:100%;font:inherit;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);color:var(--ink);outline:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 13px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#1B1F3B;font-weight:600}
  .netb{position:absolute;bottom:8px;inset-inline-end:8px;font-size:12px;background:rgba(0,0,0,.28);color:#fff;padding:2px 7px;border-radius:99px}
  .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.18)}.prog i{display:block;height:100%;background:#fff;opacity:.9}
  .info small.hit{color:var(--ink);opacity:.8}.info small.hit mark{background:var(--accent);color:#1B1F3B;border-radius:4px;padding:0 2px}
  .stat{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}.stat b{white-space:nowrap}
  .changes{margin:0 8px 8px;padding-inline-start:20px;font-size:14px;line-height:1.7}
  .fav{position:absolute;top:8px;inset-inline-start:10px;font-size:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .proj.arc{opacity:.85}.proj.arc .cover{filter:grayscale(.55)}
  .sec{grid-column:1/-1;margin:6px 4px 0;font-size:14px;color:var(--muted);font-weight:600}
  .listbar{grid-column:1/-1;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
  .listbar b{flex:1;min-width:0;padding-inline-start:6px}.listbar button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:6px 8px;border-radius:10px}
  .chip.new{border-style:dashed;color:var(--muted)}
  .lists{padding:0 6px 8px}.sheet-card .lists button{padding:10px}
  .sheet-card{max-height:85vh;overflow-y:auto}
  .emojis{display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px 8px}
  .sheet-card .emojis button{display:inline-block;width:auto;font-size:24px;padding:6px 8px}
  main{padding:8px 14px calc(96px + var(--sab))}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .proj{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
  .proj:active{transform:scale(.97)}
  .cover{height:96px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
  .cover .tag{position:absolute;bottom:8px;inset-inline-start:8px;font-size:11px;background:rgba(0,0,0,.28);color:#fff;padding:2px 8px;border-radius:99px}
  .info{padding:10px 12px 12px}
  .info b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.35}
  .info small{color:var(--muted);font-size:12px;display:block;margin-top:4px}
  .more{position:absolute;top:6px;inset-inline-end:6px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(0,0,0,.25);color:#fff;font-size:18px;line-height:1}
  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  .restore{grid-column:1/-1;text-align:center}.restore button{font:inherit;border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:10px}
  .fab{position:fixed;inset-inline-start:18px;bottom:calc(20px + var(--sab));z-index:50;border:0;border-radius:18px;padding:14px 20px;font:inherit;font-weight:700;background:var(--accent);color:#1B1F3B;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .btn{font:inherit;border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:#1B1F3B;font-weight:600;cursor:pointer}
  /* viewer: the bar slides away while reading (scrolling down) and comes back on scrolling up */
  #viewer{position:fixed;inset:0;z-index:100;background:var(--bg);--vbh:calc(52px + var(--sat))}
  #viewer.hidden{display:none}
  .vbar{position:absolute;top:0;left:0;right:0;z-index:2;height:var(--vbh);box-sizing:border-box;background:var(--night);color:#fff;padding:calc(6px + var(--sat)) 8px 6px;display:flex;align-items:center;gap:6px;transition:transform .2s}
  #viewer.full .vbar{transform:translateY(-100%)}
  .vbar button{border:0;background:transparent;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%}
  .vbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #frame{position:absolute;left:0;right:0;top:var(--vbh);bottom:var(--sab);width:100%;height:calc(100% - var(--vbh) - var(--sab));border:0;background:#fff}
  #viewer.full #frame{top:var(--sat);height:calc(100% - var(--sat) - var(--sab))}
  .search{display:flex;gap:8px}.search input{flex:1;min-width:0}
  .sortBtn{flex:none;font:inherit;font-size:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;width:46px}
  .opts{display:flex;flex-wrap:wrap;gap:8px;padding:0 6px 10px}.sheet-card .opts button{width:auto;display:inline-block;border:1px solid var(--line);border-radius:99px;padding:8px 14px}
  .sheet-card .opts button.on{background:var(--accent);border-color:var(--accent);color:#1B1F3B;font-weight:600}
  .sheet-card h4{margin:6px 8px;font-size:13px;color:var(--muted)}
  /* compact list view */
  .grid.list{grid-template-columns:1fr;gap:8px}
  .grid.list .proj{flex-direction:row;min-height:68px;border-radius:16px}
  .grid.list .cover{width:68px;height:auto;min-height:68px;flex:none;font-size:30px}
  .grid.list .cover .tag,.grid.list .netb{display:none}
  .grid.list .info{flex:1;min-width:0;align-self:center;padding:8px 12px;padding-inline-end:44px}
  .grid.list .more{top:50%;transform:translateY(-50%);background:transparent;color:var(--muted)}
  .grid.list .fav{top:4px;inset-inline-start:4px;font-size:13px}
  .grid.list .sec,.grid.list .listbar,.grid.list .restore,.grid.list .empty{grid-column:1/-1}
  .sheet{position:fixed;inset:0;z-index:150;background:rgba(10,12,24,.5);display:flex;align-items:flex-end}
  .sheet.hidden,.cloudBtn.hidden,.dlg-btns .btn.hidden,#dlgTitle.hidden,.lists.hidden,.emojis.hidden,.sheet-card button.hidden,.dlg.hidden,.toast.hidden,#dlgInput.hidden{display:none}
  .sheet-card{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:16px 14px calc(16px + var(--sab))}
  .sheet-card h3{margin:4px 6px 10px;font-size:16px}
  .sheet-card button{display:block;width:100%;text-align:start;font:inherit;border:0;background:transparent;color:var(--ink);padding:13px 10px;border-radius:12px}
  .sheet-card button.danger{color:#D9534F}
  /* in-app dialog (never focus() its buttons) */
  .dlg{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,12,24,.55)}
  .dlg-card{width:100%;max-width:360px;background:var(--card);border-radius:22px;padding:22px 20px 16px;text-align:center}
  .dlg-card p{color:var(--muted);margin:0 0 16px}.dlg-btns{display:flex;gap:10px}.dlg-btns .btn{flex:1}
  .dlg-btns .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  #dlgInput{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-bottom:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sab));background:#23243A;color:#fff;padding:10px 16px;border-radius:12px;z-index:300;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>📚 رفّ المشاريع</h1>
  <button class="cloudBtn hidden" id="cloudBtn">☁️ حفظ في جوجل</button>
  <div class="sub" id="count"></div>
</header>
<div class="bar"><div class="search"><input id="q" type="search" placeholder="🔍 ابحث في مشاريعك…" autocomplete="off"><button class="sortBtn" id="sortBtn" aria-label="ترتيب وعرض">⇅</button></div><div class="chips" id="chips"></div></div>
<main><div class="grid" id="grid"></div></main>
<button class="fab" id="addBtn">＋ إضافة مشروع</button>
<input type="file" id="file" accept=".html,.htm,text/html" multiple hidden>
<input type="file" id="fileUpd" accept=".html,.htm,text/html" hidden>

<div id="viewer" class="hidden">
  <div class="vbar"><button id="vBack" aria-label="رجوع">→</button><span id="vTitle"></span><button id="vReload" aria-label="إعادة تحميل">⟳</button></div>
  <iframe id="frame" title="project" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; autoplay"></iframe>
</div>

<div class="sheet hidden" id="sheet"><div class="sheet-card">
  <h3 id="shTitle"></h3>
  <button id="shOpen">▶️ فتح</button>
  <button id="shShare">📤 مشاركة</button>
  <button id="shFav"></button>
  <button id="shLists">📂 إضافة لقائمة…</button>
  <div class="lists hidden" id="shListsBox"></div>
  <button id="shIcon">🎨 تغيير الأيقونة</button>
  <div class="emojis hidden" id="shEmojis"></div>
  <button id="shTag">🏷️ تغيير التصنيف</button>
  <button id="shUpdate">🔄 تحديث بنسخة أحدث</button>
  <button id="shVersions"></button>
  <button id="shReset">↩️ رجوع للنسخة الأصلية</button>
  <button id="shRename">✏️ إعادة تسمية</button>
  <button id="shPin">📌 إضافة للشاشة الرئيسية</button>
  <button id="shArchive">🗄️ نقل للأرشيف</button>
</div></div>

<div class="sheet hidden" id="sortSheet"><div class="sheet-card">
  <h3>⇅ ترتيب وعرض</h3>
  <h4>الترتيب (المفضلة دايمًا الأول)</h4><div class="opts" id="sortOpts"></div>
  <h4>العرض</h4><div class="opts" id="viewOpts"></div>
  <h4>⚡ توفير المعالج (للجهاز ده بس)</h4><div class="opts" id="liteOpts"></div>
  <p style="margin:0 8px 8px;font-size:13px;color:var(--muted)">بيوقّف الحركات اللي بتلف على طول وتأثيرات الزجاج المغبّش جوّه المشاريع — المحتوى زي ما هو، والجهاز يشتغل أخف.</p>
  <button id="infoBtn" class="btn ghost" style="display:block;width:100%;margin-top:6px;background:transparent;color:var(--ink);border:1px solid var(--line)">🗂️ التخزين وحول التطبيق</button>
</div></div>

<div class="sheet hidden" id="infoSheet"><div class="sheet-card"><h3>🗂️ التخزين وحول التطبيق</h3><div id="infoBody"></div></div></div>

<div class="sheet hidden" id="arcSheet"><div class="sheet-card">
  <h3 id="arTitle"></h3>
  <button id="arOpen">▶️ فتح</button>
  <button id="arRestore"></button>
  <button id="arShare">📤 مشاركة</button>
  <button id="arDelete" class="danger">🗑️ حذف نهائي</button>
</div></div>

<div class="sheet hidden" id="cloudSheet"><div class="sheet-card"><h3>☁️ النسخ الاحتياطي على Google Drive</h3><div id="cloudBody"></div></div></div>

<div class="dlg hidden" id="dlg" role="dialog" aria-modal="true">
  <div class="dlg-card"><div id="dlgIc" style="font-size:28px"></div><h3 id="dlgTitle" style="margin:6px 0"></h3><p id="dlgBody"></p>
    <input id="dlgInput" class="hidden">
    <div class="dlg-btns"><button class="btn ghost" id="dlgNo"></button><button class="btn" id="dlgOk"></button></div></div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="projects/projects.js"></script>
<script src="js/version.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== built-in projects (shipped in www/projects) ===== */
const BUILTIN=window.SHELF_PROJECTS||[];   // www/projects/projects.js, generated by npm run projects

/* ===== settings (localStorage): hidden built-ins, renames ===== */
const LS="shelf:v1";
/* archived: {id: when} (archive instead of delete) · gone: built-ins deleted from the archive · lists: [{id,name,items:[id]}] */
const META0=()=>({hidden:[],gone:[],archived:{},lists:[],names:{},icons:{},tags:{},fav:[],opened:{},dataT:{},
  pos:{},openCount:{},sort:"recent",view:"grid",setT:0,
  lite:null});   // lite: null = automatic (on in a browser, off in the Android app)
const liteOn=()=>meta.lite==null?!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()):!!meta.lite;
// what "shelf settings" means for the Drive backup (js/cloud.js) — the rest is per-phone (positions, open times…)
const SETTINGS_KEYS=["archived","gone","lists","names","icons","tags","fav","sort","view"];
const settingsOf=m=>{const o={};SETTINGS_KEYS.forEach(k=>o[k]=m[k]);return o;};
let settingsSig=null;
function loadMeta(){let m;try{m=Object.assign(META0(),JSON.parse(localStorage.getItem(LS)||"{}"));}catch(e){m=META0();}
  // before 1.3 "removed" built-ins were hidden → they are archived now
  if(m.hidden.length){m.hidden.forEach(id=>{if(!m.archived[id])m.archived[id]=Date.now();});m.hidden=[];}
  return m;}
function saveMeta(){
  const sig=JSON.stringify(settingsOf(meta));
  if(sig!==settingsSig){if(settingsSig!==null){meta.setT=Date.now();if(window.ShelfCloud)ShelfCloud.changed();}settingsSig=sig;}
  try{localStorage.setItem(LS,JSON.stringify(meta));}catch(e){}}
let meta=loadMeta();settingsSig=JSON.stringify(settingsOf(meta));
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());

/* ===== user-added files (IndexedDB — files can be several MB) ===== */
let dbP=null;
const infoOf=f=>({id:f.id,pid:f.pid,title:f.title,size:f.size||(f.html||"").length,added:f.added,updatedAt:f.updatedAt});
function db(){if(!dbP)dbP=new Promise((res,rej)=>{const r=indexedDB.open("shelf",2);
  r.onupgradeneeded=()=>{const d=r.result,t=r.transaction;
    if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"});
    if(!d.objectStoreNames.contains("info")){const info=d.createObjectStore("info",{keyPath:"id"});   // v1 → v2: index existing files once
      t.objectStore("files").openCursor().onsuccess=e=>{const c=e.target.result;if(c){info.put(infoOf(c.value));c.continue();}};}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbP;}
async function tx(mode,fn,stores){const d=await db();stores=stores||["files"];return new Promise((res,rej)=>{const t=d.transaction(stores,mode);
  const r=fn(...stores.map(n=>t.objectStore(n)));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});}
const allFiles=()=>tx("readonly",s=>s.getAll()).catch(()=>[]);            // full records (HTML) — avoid
const allInfo=()=>tx("readonly",s=>s.getAll(),["info"]).catch(()=>[]);    // light: id, pid, title, size, dates
const getFile=id=>tx("readonly",s=>s.get(id));
const putFile=f=>tx("readwrite",(fs,is)=>{fs.put(f);is.put(infoOf(f));},["files","info"]);
const delFile=id=>tx("readwrite",(fs,is)=>{fs.delete(id);is.delete(id);},["files","info"]);

/* ===== looks: stable colour + icon per title ===== */
const PALETTE=[["#5B6CFF","#8E5BFF"],["#FF7A59","#FFB347"],["#1FB58F","#3AD6C5"],["#E0457B","#FF8FB1"],["#2E86DE","#54C0FF"],["#7D5BA6","#C38DF0"],["#D49A2A","#F2CC60"],["#3B4A6B","#6E83B0"]];
const ICONS=["📘","🧩","🎯","💡","🗂️","🚀","🎨","🧭","📊","🛠️"];
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return Math.abs(h);}
const fmtSize=b=>!b?"0":b>1048576?(b/1048576).toFixed(1)+" م.ب":Math.max(1,Math.round(b/1024))+" ك.ب";

let items=[],archivedItems=[],versions=[],allProjects=[];
const isArc=id=>!!meta.archived[id];
const vidFor=(pid,t)=>"v:"+pid.replace(/:/g,"_")+"_"+t;   // old versions live in the same IndexedDB store
async function load(){
  let all=await allInfo();
  // a built-in shipped in a newer version than this device's own copy of it (an update made here, or one synced from
  // another device): the shipped version wins and the device copy goes to the archive as an old version. Drive sync
  // then removes that copy from the backup, so every device on the account ends up on the shipped version.
  let retired=0;
  for(const f of all.filter(f=>f.id.startsWith("b:"))){const b=BUILTIN.find(x=>x.id===f.id);
    if(!b||!b.rev||(f.added||0)>=b.rev)continue;
    const old=await getFile(f.id);if(!old)continue;
    await putFile({id:vidFor(f.id,old.added||Date.now()),pid:f.id,title:old.title,html:old.html,size:old.size,added:old.added||Date.now()});
    await delFile(f.id);retired++;}
  if(retired){all=await allInfo();if(window.ShelfCloud)ShelfCloud.changed();setTimeout(()=>toast("📦 "+retired+" مشروع اتحدّث لنسخة التطبيق الجديدة — النسخة القديمة في الأرشيف"),900);}
  const user=all.filter(f=>f.id.startsWith("u:")),upd={};
  all.forEach(f=>{if(f.id.startsWith("b:"))upd[f.id]=f;});
  allProjects=BUILTIN.filter(b=>!meta.gone.includes(b.id)).map(b=>({...b,builtin:true,updated:upd[b.id]?upd[b.id].added:0}))
    .concat(user.sort((a,b)=>b.added-a.added).map(f=>({id:f.id,title:f.title,size:f.size,added:f.added,updated:f.updatedAt||0,tag:"مُضاف"})));
  allProjects.forEach((it,i)=>{it.order=i;if(meta.names[it.id])it.title=meta.names[it.id];if(meta.icons[it.id])it.icon=meta.icons[it.id];if(meta.tags[it.id])it.tag=meta.tags[it.id];});
  const known=new Set(allProjects.map(p=>p.id));
  versions=all.filter(f=>f.id.startsWith("v:")&&known.has(f.pid)).map(f=>({id:f.id,pid:f.pid,title:f.title,size:f.size,added:f.added}))
    .sort((a,b)=>b.added-a.added);
  items=allProjects.filter(p=>!isArc(p.id));
  archivedItems=allProjects.filter(p=>isArc(p.id)).sort((a,b)=>meta.archived[b.id]-meta.archived[a.id]);
  // favourites first, then most recently opened, then shelf order
  const fav=id=>meta.fav.includes(id)?1:0;
  const by={recent:(a,b)=>(meta.opened[b.id]||0)-(meta.opened[a.id]||0),name:(a,b)=>a.title.localeCompare(b.title,"ar"),
    added:(a,b)=>(b.added||0)-(a.added||0),count:(a,b)=>(meta.openCount[b.id]||0)-(meta.openCount[a.id]||0)}[meta.sort]||(()=>0);

/* files from the picker or from Android "Open with / Share" → shelf. Same title + size = same project → ask to replace */
function titleOf(html,name){const m=html.match(/<title[^>]*>([^<]*)<\/title>/i);
  const t=m&&m[1].replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();
  return t||String(name||"مشروع").replace(/\.x?html?$/i,"").replace(/[-_]+/g," ");}
/* store a newer version of an existing project — same id, so name/icon/favourite/saved data all stay */
const MAX_VERSIONS=10;
async function saveVersion(id,html,name,size){
  const old=await getFile(id).catch(()=>null);const now=Date.now();
  // the version being replaced → archive (restorable); newest MAX_VERSIONS per project are kept
  const curHtml=old?old.html:await htmlOf(id);
  if(curHtml!=null){
    try{await putFile({id:vidFor(id,now),pid:id,title:old?old.title:(proj(id)||{}).title,html:curHtml,size:old?old.size:curHtml.length,added:now});}catch(e){}
    const mine=(await allInfo()).filter(f=>f.id.startsWith("v:")&&f.pid===id).sort((a,b)=>b.added-a.added);
    for(const f of mine.slice(MAX_VERSIONS))await delFile(f.id);
  }
  const rec=id.startsWith("b:")?{id,title:titleOf(html,name),html,size,added:now}
    :{id,title:titleOf(html,name),html,size,added:old?old.added:now,updatedAt:now};
  try{await putFile(rec);return true;}catch(e){toast("تعذّر حفظ "+name+" — المساحة ممتلئة؟");return false;}}
async function importFiles(list){
  let n=0,last=null;const user=await allInfo();
  for(const f of list){
    if(!/<(html|body|head|div|p|script|!doctype)/i.test(f.html)){toast("«"+f.name+"» مش ملف HTML");continue;}
    const title=titleOf(f.html,f.name),size=f.size||f.html.length;
    const norm=t=>String(t||"").trim().toLowerCase();
    const dup=user.find(u=>u.id.startsWith("u:")&&norm(u.title)===norm(title))||
      BUILTIN.find(b=>!meta.gone.includes(b.id)&&(norm(b.title)===norm(title)||norm(b.srcTitle)===norm(title)));
    let id="u:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(dup){const v=await mzConfirm({icon:"🔄",title:"«"+(meta.names[dup.id]||dup.title)+"» موجود بالفعل",body:"تحدّثه بالنسخة دي؟ النسخة الحالية هتروح الأرشيف، وبياناتك جوّه المشروع هتفضل زي ما هي.",ok:"تحديث",cancel:"إضافة كنسخة جديدة"});
      if(v)id=dup.id;}
    if(dup&&id===dup.id){if(await saveVersion(id,f.html,f.name,size)){n++;last=id;}continue;}
    try{await putFile({id,title,html:f.html,size,added:Date.now()});n++;last=id;}catch(err){toast("تعذّر حفظ "+f.name+" — المساحة ممتلئة؟");}
  }
  if(n&&window.ShelfCloud)ShelfCloud.changed();
  if(n){toast(n===1?"تمام ✅":`تمام — ${n} ملفات ✅`);chip="*";$("q").value="";await load();}
  return last;
}

/* ===== share a project / an old version as an .html file ===== */
async function shareProject(id){
  const v=id.startsWith("v:")?versions.find(x=>x.id===id):null,it=v?proj(v.pid):proj(id);
  const html=await htmlOf(id);if(html==null){toast("الملف مش موجود");return;}
  const name=String(it.title).replace(/[\\/:*?"<>|]+/g," ").trim().slice(0,80)+".html";
  const SI=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.ShareImport;
  try{
    if(SI){await SI.shareFile({name,content:html});return;}
    const file=new File([html],name,{type:"text/html"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:it.title});return;}
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){if(!/abort|cancel/i.test(String(e)))toast("تعذّرت المشاركة");}}

  if(sheetId){closeSheet();return true;}
  if(arcId){closeArcSheet();return true;}
  if(!$("infoSheet").classList.contains("hidden")){$("infoSheet").classList.add("hidden");return true;}
  if(!$("sortSheet").classList.contains("hidden")){$("sortSheet").classList.add("hidden");return true;}
  if(!$("cloudSheet").classList.contains("hidden")){$("cloudSheet").classList.add("hidden");return true;}
  if(viewing){try{if($("frame").contentWindow.__shelfBack())return true;}catch(e){}
    if(viewing.site&&siteDepth>1){siteBack=true;try{$("frame").contentWindow.history.back();return true;}catch(e){}}
    closeViewer();return true;}
  if(chip!=="*"||$("q").value){chip="*";$("q").value="";render();scrollTo({top:0});return true;}
  return false;}

/* ===== Google Drive backup (js/cloud.js) ===== */
let metaT=null;
/* when each saved item of each project last changed / was deleted ("shelf:keyt") — lets the backup merge two devices
   item by item instead of the newer device overwriting the whole project */
const KT="shelf:keyt";let keyT;try{keyT=JSON.parse(localStorage.getItem(KT)||"{}");}catch(e){keyT={};}keyT.t=keyT.t||{};keyT.d=keyT.d||{};
let ktT=null;const saveKT=()=>{clearTimeout(ktT);ktT=setTimeout(()=>{try{localStorage.setItem(KT,JSON.stringify(keyT));}catch(e){}},400);};
window.shelfChanged=(id,k,gone)=>{if(id.startsWith("v:"))return;  // an old version opened for a look: not backed up
  const now=Date.now();meta.dataT[id]=now;
  if(k!=null){const t=keyT.t[id]=keyT.t[id]||{},d=keyT.d[id]=keyT.d[id]||{};if(gone){delete t[k];d[k]=now;}else{t[k]=now;delete d[k];}saveKT();}
  clearTimeout(metaT);metaT=setTimeout(saveMeta,400);if(window.ShelfCloud)ShelfCloud.changed();};
window.ShelfHost={
  dataPids(){const s=new Set();for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const m=k&&k.match(/^p:([^:]+:[^:]+):/);if(m&&!m[1].startsWith("v:"))s.add(m[1]);}return [...s];},
  localData(pid){const P="p:"+pid+":",keys={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(P))keys[k.slice(P.length)]=localStorage.getItem(k);}
    return {keys,t:meta.dataT[pid]||0,kt:keyT.t[pid]||{},del:keyT.d[pid]||{}};},
  applyData(pid,keys,t,kt,del){const P="p:"+pid+":";Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k));
    for(const k in keys)try{localStorage.setItem(P+k,keys[k]);}catch(e){}
    if(kt)keyT.t[pid]=kt;if(del)keyT.d[pid]=del;saveKT();
    meta.dataT[pid]=t;saveMeta();if(viewing&&viewing.id===pid)openProject(pid);},
  stampData(pid,t){meta.dataT[pid]=t;saveMeta();},
  title(pid){const it=proj(pid)||BUILTIN.find(x=>x.id===pid);return it?(meta.names[pid]||it.title):pid;},
  userFiles:async()=>(await allInfo()).filter(f=>f.id.startsWith("u:")||f.id.startsWith("b:")),   // b: = newer version of a built-in
  fileHtml:async id=>{const f=await getFile(id);return f?f.html:"";},
  async dropFile(id){await delFile(id);await load();},
  async addUserFile(rec){await putFile(rec);await load();},
  wasRemoved:pid=>!!(window.ShelfCloud&&ShelfCloud._state().pendingDel.includes(pid)),
  hasProject:pid=>!!proj(pid),
  settings(){
    // settings made before backups covered them (or before signing in) have no time yet: date them now, unless this
    // shelf is still untouched — a fresh install / new computer must take the account's settings, not overwrite them
    if(!meta.setT&&JSON.stringify(settingsOf(meta))!==JSON.stringify(settingsOf(META0()))){meta.setT=Date.now();saveMeta();}
    return {t:meta.setT||0,data:settingsOf(meta)};},
  async applySettings(data,t){SETTINGS_KEYS.forEach(k=>{if(data[k]!==undefined)meta[k]=data[k];});meta.setT=t;
    settingsSig=JSON.stringify(settingsOf(meta));try{localStorage.setItem(LS,JSON.stringify(meta));}catch(e){}await load();},
  versionList:async()=>(await allInfo()).filter(f=>f.id.startsWith("v:")),
  async addVersion(rec){await putFile(rec);await load();}
};
const fmtAgo=t=>{if(!t)return "لسه";const m=Math.round((Date.now()-t)/60000);return m<1?"دلوقتي":m<60?"من "+m+" دقيقة":new Date(t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"});};
function cloudUI(){const C=window.ShelfCloud;if(!C||!C.available)return;const i=C.info(),b=$("cloudBtn");b.classList.remove("hidden");

    :`<p>الحساب: <b>${esc(i.email)}</b><br>آخر حفظ: ${esc(fmtAgo(i.lastSync))}${i.state==="error"?"<br>⚠️ "+esc(cloudErr(i.error)):""}</p>

  /Failed to fetch|NetworkError|network/i.test(e)?"مفيش نت — هيحفظ لوحده لما النت يرجع":/403/.test(e)?"Google Drive مش متفعّل للتطبيق (إعداد Google Cloud)":/10:|DEVELOPER_ERROR|authorize-failed/.test(e)?"تسجيل الدخول مش متجهّز لنسخة التطبيق دي (إعداد Google Cloud)":e;}

const CHANGES=[
  ["1.9","نسخ جديدة من «الدليل الشامل للمحاسبة» و«NetSuite TF Reference» — بتحلّ محل النسخ القديمة على كل الأجهزة، والقديمة موجودة في الأرشيف."],
  ["1.8","بحث جوّه محتوى كل المشاريع، شريط تقدّم القراءة، علامة 🌐 للمشاريع اللي محتاجة نت، شاشة التخزين، دمج البيانات بين الأجهزة عنصر بعنصر، إصلاح عرض دليل العتاد والمحاسبة على الموبايل، تصدير Word بدون نت، وتثبيت النسخة الويب كتطبيق على الكمبيوتر."],
  ["1.7","مشاريع المواقع متعددة الصفحات — CV Forge."],
  ["1.6","وضع توفير المعالج."],
  ["1.5","حفظ الملفات، الطباعة، العمل بدون نت، الرجوع جوّه المشروع، القراءة بملء الشاشة، الترتيب والعرض، اختصارات الشاشة الرئيسية."],
  ["1.3","المشاركة، الأرشيف، النسخ القديمة، القوائم."],
  ["1.2","كل المشاريع + الحفظ في Google Drive."]];
const VER=window.SHELF_VERSION||{name:"?",code:0};
function changesHtml(n){return `<ul class="changes">${CHANGES.slice(0,n).map(([v,t])=>`<li><b>${v}</b> — ${esc(t)}</li>`).join("")}</ul>`;}
async function renderInfo(){
  const info=await allInfo(),sum=a=>a.reduce((s,f)=>s+(f.size||0),0);
  const added=info.filter(f=>f.id.startsWith("u:")),upd=info.filter(f=>f.id.startsWith("b:")),vers=info.filter(f=>f.id.startsWith("v:"));
  const per={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),m=k&&k.match(/^p:([^:]+:[^:]+):/);if(m)per[m[1]]=(per[m[1]]||0)+(k.length+(localStorage.getItem(k)||"").length)*2;}
  const dataTotal=Object.values(per).reduce((a,b)=>a+b,0),top=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,4);
  let est="";try{const e=await navigator.storage.estimate();est=fmtSize(e.usage||0);}catch(e){}
  const row=(l,v)=>`<div class="stat"><span>${l}</span><b>${v}</b></div>`;
  $("infoBody").innerHTML=
    row("📥 مشاريع ضفتها",added.length+" · "+fmtSize(sum(added)))+row("🔄 نسخ أحدث من المدمجة",upd.length+" · "+fmtSize(sum(upd)))+
    row("🕘 نسخ قديمة في الأرشيف",vers.length+" · "+fmtSize(sum(vers)))+row("💾 بياناتك جوّه المشاريع",Object.keys(per).length+" مشروع · "+fmtSize(dataTotal))+
    top.map(([id,b])=>row("　• "+esc((proj(id)||{title:id}).title),fmtSize(b))).join("")+(est?row("📦 إجمالي اللي التطبيق مستخدمه",est):"")+
    `<button class="btn ghost" data-clean="2" style="display:block;width:100%;margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--line)">🧹 احتفظ بآخر نسختين قديمتين لكل مشروع بس</button>
     <button class="btn ghost" data-clean="0" style="display:block;width:100%;margin-top:8px;background:transparent;color:#D9534F;border:1px solid var(--line)">🗑️ امسح كل النسخ القديمة</button>
     <h4 style="margin:16px 8px 4px">ℹ️ حول التطبيق</h4>`+row("الإصدار",esc(VER.name)+" ("+VER.code+")"+(VER.built?" · "+VER.built:""))+row("المشاريع",allProjects.length+" ("+BUILTIN.length+" مدمج)")+
    `<h4 style="margin:12px 8px 4px">✨ الجديد</h4>`+changesHtml(4);}
$("infoBtn").onclick=async()=>{$("sortSheet").classList.add("hidden");await renderInfo();$("infoSheet").classList.remove("hidden");};
$("infoSheet").onclick=async e=>{if(e.target.id==="infoSheet"){$("infoSheet").classList.add("hidden");return;}
  const b=e.target.closest("[data-clean]");if(!b)return;const keep=+b.dataset.clean;
  if(!await mzConfirm({icon:"🧹",title:keep?"تمسح النسخ القديمة الزيادة؟":"تمسح كل النسخ القديمة؟",body:keep?"هيفضل آخر نسختين لكل مشروع.":"مش هتقدر ترجّع أي نسخة قديمة بعد كده.",ok:"امسح"}))return;
  const by={};for(const f of await allInfo())if(f.id.startsWith("v:"))(by[f.pid]=by[f.pid]||[]).push(f);
  let n=0;for(const pid in by)for(const f of by[pid].sort((a,b)=>b.added-a.added).slice(keep)){await delFile(f.id);n++;}
  await load();await renderInfo();toast("اتمسحت "+n+" نسخة");if(window.ShelfCloud)ShelfCloud.changed();};
// "what's new" once per device after an update
setTimeout(()=>{if(VER.name==="?"||meta.seenVer===VER.name)return;const first=!meta.seenVer;meta.seenVer=VER.name;saveMeta();
  if(!first)mzConfirm({icon:"✨",title:"الجديد في الإصدار "+VER.name,body:CHANGES[0][0]===VER.name?CHANGES[0][1]:"تحسينات وإصلاحات.",ok:"تمام",alert:true});},1200);

/* ===== web: install as an app + work offline (sw.js) — not in the Android app ===== */
if(!NATIVE&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

window.MZApp={back:goBack,confirm:mzConfirm,alerts:()=>[]};
// ask Android not to evict IndexedDB (the user's added files) when storage runs low
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
/* Android "Open with / Share → رفّ المشاريع" (ShareImportPlugin.java) */
const shareImport=()=>window.Capacitor&&Capacitor.Plugins?Capacitor.Plugins.ShareImport:null;
async function takeShared(){const SI=shareImport();if(!SI)return;
  try{const r=await SI.take();
    if(r.files&&r.files.length){closeViewer();const id=await importFiles(r.files);if(id&&r.files.length===1)openProject(id);}
    else if(r.open&&proj(r.open)){if(viewing)closeViewer();openProject(r.open);}}catch(e){}}  // home-screen shortcut
load().then(()=>{takeShared();const SI=shareImport();if(SI)SI.addListener("shared",takeShared);});
</script>
<script src="js/native.js"></script>
<script src="js/web-config.js"></script>
<script src="js/cloud.js"></script>
<script>if(window.ShelfCloud){ShelfCloud.onChange(cloudUI);cloudUI();}</script>
</body>
</html>
