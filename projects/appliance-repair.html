{c:1,q:"عند انفجار مكثف وتناثر سائله في العين، الإجراء الصحيح:",o:["غسل بماء جارٍ 15 دقيقة والتوجه للطوارئ","مسحها بمنديل","وضع قطرة مطهرة","الانتظار ومراقبة الأعراض"],a:0,e:"سائل المكثف قد يكون كاويًا، والغسل المطول الفوري يقلل الضرر بشكل حاسم.",r:"36.5"},
{c:1,q:"اختبار زر TEST في القاطع التفاضلي يجب أن يتم:",o:["شهريًا","سنويًا","مرة عند التركيب فقط","كل خمس سنوات"],a:0,e:"الاختبار الدوري يضمن أن الآلية الميكانيكية لم تعلق، وهي تعلق فعلًا مع طول عدم الاستخدام.",r:"1.8"},
{c:1,q:"في نظام تأريض TT، الاعتماد الأساسي في الحماية يكون على:",o:["القاطع التفاضلي RCD","القاطع المصغر","الفيوز","مانع الصواعق"],a:0,e:"مقاومة الأرضي في TT عالية نسبيًا فلا يرتفع تيار العطل كفاية ليفصل القاطع العادي.",r:"28.1"},
{c:1,q:"حساس العادم في السخان الغازي وظيفته:",o:["منع تراكم أول أكسيد الكربون داخل المكان","توفير الغاز","قياس حرارة الماء","تشغيل المروحة"],a:0,e:"إلغاؤه سبب موثق لوفيات اختناق، لأن أول أكسيد الكربون بلا لون ولا رائحة.",r:"27.4"},
{c:1,q:"أعراض التسمم بأول أكسيد الكربون تُخطئ تشخيصها عادة على أنها:",o:["إنفلونزا (صداع ودوار وغثيان)","حساسية جلدية","تسمم غذائي حاد","إجهاد عضلي"],a:0,e:"التشابه مع الإنفلونزا هو سبب تأخر الإنقاذ، ولذلك يوصى بكاشف CO في أي مكان به جهاز غازي.",r:"27.5"},
{c:1,q:"لماذا تُعد مجففات الملابس من أكثر الأجهزة تسببًا في حرائق المنازل؟",o:["تراكم الوبر القابل للاشتعال على العنصر وفي المسار","ارتفاع قدرتها","دوران الحلة السريع","استخدام موتور قوي"],a:0,e:"الوبر مادة شديدة الاشتعال، وتراكمه يرفع الحرارة ويشعل الجهاز؛ لذا تنظيف الفلتر بعد كل دورة إلزامي.",r:"5.5.1"},
{c:1,q:"إذا انصهر الفيوز الحراري في مجفف الملابس فالإجراء الصحيح:",o:["البحث عن سبب ارتفاع الحرارة أولًا ثم استبداله","استبداله مباشرة","تجاوزه بسلك","تركيب فيوز بدرجة حرارة أعلى"],a:0,e:"الفيوز أدى وظيفته. استبداله دون معالجة الانسداد أو المروحة يعيد الخطر خلال أيام.",r:"5.5.1"},
{c:1,q:"في نظام الطاقة الشمسية، خطورة التيار المستمر (DC) مقارنة بالمتردد:",o:["قوسه الكهربائي لا ينطفئ تلقائيًا فيسبب حريقًا","جهده أعلى دائمًا","يسبب صعقًا أقوى","لا فرق"],a:0,e:"AC يمر بالصفر 100 مرة/ثانية فينطفئ القوس؛ DC مستمر فيستمر القوس ويشعل الوصلات الرخوة.",r:"19.5"},
{c:1,q:"ربط مولد بالمنزل دون مفتاح تحويل متبادل الإقفال قد يؤدي إلى:",o:["إرسال جهد للشبكة الخارجية وقتل عمال الصيانة","توفير في الوقود","تلف المولد فقط","انخفاض الجهد"],a:0,e:"الجهد يرتد عبر المحول إلى خطوط الشارع بجهد مرتفع، وهو خطر موثق على العاملين.",r:"19.6"},
{c:1,q:"تشغيل مولد داخل جراج مغلق خطر بسبب:",o:["أول أكسيد الكربون القاتل","الضوضاء","الاهتزاز","ارتفاع الحرارة فقط"],a:0,e:"العادم يملأ المكان بغاز قاتل بلا رائحة خلال دقائق، وقد قتل عائلات كاملة.",r:"19.6"},
{c:1,q:"بطارية ليثيوم منتفخة يجب:",o:["عدم شحنها والتخلص منها بأمان فورًا","شحنها ببطء","ثقبها لتفريغ الغاز","ضغطها لإعادتها لشكلها"],a:0,e:"الانتفاخ دليل تحلل داخلي؛ الشحن أو الثقب قد يؤدي إلى حرارة جامحة واشتعال فوري.",r:"13.4"},
{c:1,q:"في الحمام، ما المنطقة التي يُسمح فيها بجهد 12 فولت فقط؟",o:["Zone 0 داخل الحوض/الدُش نفسه","Zone 1","Zone 2","خارج المناطق"],a:0,e:"داخل الحوض هو أخطر موضع ممكن، لذا يقتصر على جهد منخفض جدًا وحماية IPX7.",r:"26.3"},
{c:1,q:"مبدأ عام صحيح عند الشك أثناء الإصلاح:",o:["التوقف واستدعاء متخصص","المحاولة والتعلم من الخطأ","سؤال شخص غير متخصص","تشغيل الجهاز لرؤية ما يحدث"],a:0,e:"الشك نفسه سبب كافٍ للتوقف؛ لا يوجد جهاز تساوي قيمته إصبعًا أو حياة.",r:"10"},

/* ===== 2. أساسيات الكهرباء ===== */
{c:2,q:"سخان قدرته 2000 وات على 220 فولت يسحب تيارًا مقداره:",o:["9.1 أمبير تقريبًا","4.4 أمبير","18 أمبير","2 أمبير"],a:0,e:"I = P ÷ V = 2000 ÷ 220 ≈ 9.1 أمبير.",r:"1.2"},
{c:2,q:"مقاومة عنصر تسخين قدرته 1500 وات على 220 فولت تساوي تقريبًا:",o:["32 أوم","15 أوم","150 أوم","7 أوم"],a:0,e:"R = V² ÷ P = 48400 ÷ 1500 ≈ 32 أوم. هذه الصيغة هي اختبارك السريع لأي عنصر تسخين.",r:"1.2"},
{c:2,q:"القيمة العظمى لجهد 220 فولت متردد تساوي:",o:["311 فولت","220 فولت","156 فولت","440 فولت"],a:0,e:"القيمة العظمى = RMS × 1.414. لهذا يُقاس المكثف بعد التقويم بحوالي 300-320 فولت DC.",r:"1.3"},
{c:2,q:"في التوصيل على التوازي:",o:["الجهد واحد على كل العناصر والتيار يتوزع","التيار واحد والجهد يتوزع","كلاهما ثابت","كلاهما يتوزع"],a:0,e:"لهذا تُوصل أجهزة المنزل على التوازي: كل جهاز يحصل على 220 كاملة ويعمل باستقلال.",r:"1.5"},
{c:2,q:"الجهد بين طورين في نظام ثلاثي الطور 220/380 يساوي:",o:["380 فولت (220 × 1.732)","220 فولت","440 فولت","660 فولت"],a:0,e:"المعامل √3 = 1.732 هو العلاقة بين جهد الطور وجهد الخط.",r:"1.6"},
{c:2,q:"وظيفة سلك الأرضي في التشغيل الطبيعي:",o:["لا يفعل شيئًا — دوره يظهر عند العطل فقط","يحمل جزءًا من التيار","يخفض الجهد","يقلل الاستهلاك"],a:0,e:"عند ملامسة الحي لجسم الجهاز، يوفر الأرضي مسارًا يرفع التيار فيفصل القاطع.",r:"1.7"},
{c:2,q:"عند قياس الجهد بين المتعادل والأرضي في تركيب سليم تتوقع:",o:["أقل من 5 فولت","220 فولت","110 فولت","380 فولت"],a:0,e:"وجود 220 بين المتعادل والأرضي يعني خطأ توصيل خطرًا. وقراءة صفر بين الحي والأرضي تعني أرضيًا غير موصول.",r:"1.7"},
{c:2,q:"لماذا لا يُعتمد على لون السلك في التركيبات القديمة؟",o:["الألوان غير موثوقة ويجب القياس بالأفوميتر","لأن الألوان تبهت","لأن القياس أسرع","لأن الألوان تختلف بالحرارة"],a:0,e:"التركيبات المحلية القديمة كثيرًا ما تستخدم ألوانًا عشوائية؛ القياس هو الحكم الوحيد.",r:"1.4"},
{c:2,q:"معامل القدرة (PF) لحمل مقاوم بحت مثل السخان يساوي تقريبًا:",o:["1","0.5","0.7","0"],a:0,e:"الأحمال المقاومة لا تسبب إزاحة طور، بينما الموتورات تعطي 0.6-0.85 متأخرًا.",r:"22.3"},
{c:2,q:"التوافقيات في الشبكة تسبب مشكلة خاصة في سلك:",o:["المتعادل — التوافقية الثالثة تتجمع فيه","الأرضي","الطور الأول فقط","كابل الإنارة"],a:0,e:"في الأحمال غير الخطية، لا تُلغى التوافقيات الفردية في المتعادل بل تتجمع فيسخن أكثر من الأطوار.",r:"22.2"},
{c:2,q:"لقياس أحمال غير خطية (SMPS، LED) بدقة يجب استخدام أفوميتر:",o:["True RMS","تناظري","بمدى يدوي","بدقة 3 خانات"],a:0,e:"الأفوميتر العادي يفترض موجة جيبية، وقد يخطئ بنسبة تصل إلى 40% مع الأحمال النبضية.",r:"22.2"},
{c:2,q:"سقوط الجهد المسموح عمومًا لدوائر القوة:",o:["5% تقريبًا","0.5%","15%","20%"],a:0,e:"3% للإنارة و5% للقوة؛ تجاوزه يجعل الموتور يسحب تيارًا أعلى ويسخن.",r:"28.2"},
{c:2,q:"حمل 20 أمبير على مسافة 40 مترًا بكابل 4 مم². سقوط الجهد تقريبًا:",o:["7 فولت","2 فولت","15 فولت","25 فولت"],a:0,e:"(2 × 40 × 20 × 0.0175) ÷ 4 = 7 فولت، أي 3.2% وهي نسبة مقبولة.",r:"28.2"},
{c:2,q:"القاعدة الصحيحة للتنسيق بين الكابل والقاطع:",o:["تيار الحمل ≤ تيار القاطع ≤ قدرة تحمل الكابل","تيار القاطع أكبر من الكابل دائمًا","الكابل يُختار بعد التركيب","لا علاقة بينهما"],a:0,e:"القاطع يحمي الكابل لا الجهاز؛ قاطع أكبر من سعة الكابل يعني احتراق الكابل قبل الفصل.",r:"28.3"},
{c:2,q:"مقطع الكابل المناسب لدائرة برايز عامة بقاطع 16 أمبير:",o:["2.5 مم²","1.0 مم²","0.75 مم²","1.5 مم²"],a:0,e:"2.5 مم² تتحمل نحو 19-21 أمبير، وهو ما يناسب قاطع 16 أمبير.",r:"6.1"},
{c:2,q:"رابطة تكافؤ الجهد (Equipotential Bonding) هدفها:",o:["إزالة فرق الجهد بين الأجزاء المعدنية","تقوية الأرضي فقط","تقليل الاستهلاك","منع الصدأ"],a:0,e:"بدونها قد ينشأ فرق جهد خطر بين ماسورة مياه وجسم جهاز، خاصة في الحمامات.",r:"28.4"},
{c:2,q:"وحدة قياس السعة الكهربائية:",o:["الفاراد","الهنري","الأوم","الويبر"],a:0,e:"الفاراد وحدة كبيرة جدًا عمليًا، لذا تُستخدم الميكروفاراد والنانوفاراد والبيكوفاراد.",r:"3.2"},
{c:2,q:"تردد الشبكة الكهربائية في مصر ومعظم الشرق الأوسط وأوروبا:",o:["50 هرتز","60 هرتز","100 هرتز","25 هرتز"],a:0,e:"50 هرتز عند 220-240 فولت، بينما أمريكا واليابان 60 هرتز عند 110-120 فولت.",r:"1.3"},
{c:2,q:"جهاز 1.5 حصان يعادل تقريبًا:",o:["1120 وات","750 وات","2000 وات","500 وات"],a:0,e:"الحصان الميكانيكي = 746 وات، فـ1.5 حصان ≈ 1119 وات. ⚠️ هذا لا يطابق «حصان» المكيفات في السوق، فهو تصنيف تجاري للسعة التبريدية لا لقدرة الموتور.",r:"ملحق ي"},
{c:2,q:"الطن التبريدي (Ton of Refrigeration) يعادل:",o:["12000 BTU/hr","3000 BTU/hr","24000 BTU/hr","1000 BTU/hr"],a:0,e:"الطن التبريدي = 12000 BTU/hr ≈ 3.5 كيلو وات تبريد. ⚠️ لا تخلطه بـ«الحصان» التجاري: مكيف 12000 BTU يُباع في مصر باسم 1.5 حصان.",r:"ملحق ي"},
{c:7,q:"مكيف يُباع في السوق المصري باسم «1.5 حصان» سعته الفعلية تقريبًا:",o:["12000 BTU/hr","18000 BTU/hr","9000 BTU/hr","24000 BTU/hr"],a:0,e:"التصنيف التجاري: 1.5 حصان ≈ 12000، 2.25 حصان ≈ 18000، 3 حصان ≈ 24000 BTU/hr. اعتمد دائمًا على رقم BTU في لوحة البيانات لا على كلمة «حصان».",r:"ملحق ي"},
{c:2,q:"استهلاك مكيف 1500 وات يعمل 6 ساعات يوميًا لمدة 30 يومًا:",o:["270 كيلو وات ساعة","45 كيلو وات ساعة","900 كيلو وات ساعة","27 كيلو وات ساعة"],a:0,e:"(1500 × 6 × 30) ÷ 1000 = 270 kWh.",r:"23.1"},
{c:2,q:"إذا استمر عداد الكهرباء في الدوران بعد فصل كل القواطع فهذا يعني:",o:["تسريب أو توصيل خارج اللوحة أو عداد معطوب","استهلاك طبيعي","خطأ في القراءة دائمًا","حمل الاستعداد"],a:0,e:"مع فصل كل الأحمال يجب أن يتوقف العداد تمامًا؛ استمراره يستوجب تحقيقًا.",r:"23.3"},
{c:2,q:"أكبر مستهلكي الكهرباء في المنزل عادة:",o:["سخان المياه والمكيف","الراوتر والتلفزيون","اللمبات","الشواحن"],a:0,e:"أجهزة التسخين والتبريد تتصدر دائمًا لأنها تحوّل طاقة كبيرة لساعات طويلة.",r:"23.2"},
{c:2,q:"في نظام TN-C، لماذا لا يُستخدم القاطع التفاضلي؟",o:["لأن المتعادل والأرضي سلك واحد فلا يمكن قياس فرق التيار","لأنه غالي","لأنه بطيء","لأنه غير متوفر"],a:0,e:"دمج المسارين يجعل RCD غير قادر على اكتشاف التسريب، ولذلك يُعد النظام قديمًا وخطرًا.",r:"28.1"},
{c:2,q:"مقاومة قطب التأريض المنزلي المقبولة:",o:["أقل من 5 أوم ويفضل أقل من 1","أقل من 100 أوم","أقل من 50 أوم","لا حد لها"],a:0,e:"كلما قلت المقاومة زاد تيار العطل وأسرع الفصل. أكثر من 10 أوم يعني تأريضًا غير فعال.",r:"17.4"},
{c:2,q:"قياس مقاومة حلقة العطل (Loop Impedance) يحدد:",o:["هل سيفصل القاطع في الزمن المطلوب","استهلاك الجهاز","جودة العزل","معامل القدرة"],a:0,e:"تيار العطل المتوقع = 230 ÷ مقاومة الحلقة، ويجب أن يفوق تيار الفصل اللحظي للقاطع.",r:"28.5"},
{c:2,q:"عند قياس المقاومة بالأفوميتر يجب أن تكون الدائرة:",o:["مفصولة تمامًا عن أي جهد","تحت الجهد الكامل","موصلة بنصف الجهد","لا فرق"],a:0,e:"وجود جهد يعطي قراءة خاطئة وقد يتلف الأفوميتر.",r:"2.3"},
{c:2,q:"في اختبار الاستمرارية، القراءة OL أو «1» تعني:",o:["الدائرة مفتوحة/مقطوعة","الدائرة مقصورة","القراءة صفر","الجهاز سليم"],a:0,e:"OL تعني Over Limit أي مقاومة لا نهائية عمليًا، وهي دليل انقطاع.",r:"2.3"},
{c:2,q:"مقاومة العزل المقبولة بين أطراف التغذية وجسم الجهاز:",o:["أكثر من 1 ميجا أوم (ويفضل أكثر من 10)","أكثر من 1 كيلو أوم","أكثر من 100 أوم","أي قيمة"],a:0,e:"أقل من 0.5 ميجا أوم يعني تسريبًا يجعل الجهاز غير آمن للتسليم.",r:"17.2"},
{c:2,q:"لماذا يُستخدم جهد 500 فولت في اختبار العزل بالميجر؟",o:["لأن العزل قد ينهار عند جهد التشغيل رغم سلامته عند 9 فولت","لأنه أسرع","لتوفير البطارية","لأنه معيار عشوائي"],a:0,e:"الأفوميتر يختبر بجهد ضئيل لا يكشف ضعف العزل الحقيقي تحت جهد التشغيل.",r:"17.1"},

/* ===== 3. الأدوات والقياس ===== */
{c:3,q:"أخطر خطأ يدمر الأفوميتر ويعرضك للخطر:",o:["قياس التيار بالتوازي على مصدر جهد","قياس الجهد بالتوازي","قياس المقاومة على دائرة مفصولة","استخدام مدى أعلى"],a:0,e:"وضع التيار يمثل مقاومة شبه صفرية؛ وضعه عبر 220 فولت يعني قصرًا مباشرًا.",r:"2.3"},
{c:3,q:"قياس التيار بالأفوميتر يتطلب توصيله:",o:["على التوالي مع الحمل","على التوازي","بين الحي والأرضي","بين الطرفين والجسم"],a:0,e:"يجب فتح الدائرة وإدخال الأفوميتر ليمر التيار من خلاله.",r:"2.3"},
{c:3,q:"لقياس التيار دون قطع الدائرة تستخدم:",o:["الكلامب ميتر","الميجر","جهاز ESR","مولد الإشارة"],a:0,e:"الكلامب يقيس المجال المغناطيسي حول السلك دون تلامس كهربائي.",r:"2.2"},
{c:3,q:"جهاز ESR يُستخدم للكشف عن:",o:["المكثفات التالفة غالبًا دون فكها","المقاومات المحترقة","الترانزستورات المقصورة","الملفات المفتوحة"],a:0,e:"كثير من المكثفات تعطي سعة صحيحة وهي تالفة فعليًا بسبب ارتفاع مقاومتها الداخلية.",r:"2.2"},
{c:3,q:"مكثف 470 ميكروفاراد سليم يُتوقع أن يكون ESR له:",o:["أقل من 0.3 أوم","حوالي 5 أوم","حوالي 50 أوم","صفر تمامًا"],a:0,e:"كلما زادت السعة قلّ ESR المقبول؛ ارتفاعه دليل جفاف الإلكتروليت.",r:"3.2"},
{c:3,q:"محول العزل (Isolation Transformer) وظيفته الأساسية:",o:["فصل الجهاز عن أرضي المبنى لمنع الصعق أثناء القياس","رفع الجهد","تنعيم الجهد","تقليل الاستهلاك"],a:0,e:"يجعل خرجه عائمًا، فلا يكتمل مسار التيار عبر جسمك إلى الأرض.",r:"2.2"},
{c:3,q:"استخدام لمبة تنجستن 100 وات على التوالي مع جهاز بعد الإصلاح يفيد في:",o:["كشف القصر بأمان قبل التشغيل الكامل","تسريع الإحماء","قياس القدرة","تحسين معامل القدرة"],a:0,e:"إضاءة قوية مستمرة تعني قصرًا؛ وميض قصير ثم خفوت يعني شحن مكثفات طبيعيًا.",r:"32.1"},

{c:4,q:"قنطرة التقويم تحتوي على:",o:["4 دايودات في علبة واحدة","ترانزستورين","مكثفين","ملف ومكثف"],a:0,e:"لها طرفا دخل AC وطرفا خرج + و−، وتُفحص كأربعة دايودات منفصلة.",r:"3.4"},
{c:4,q:"عند استبدال فيوز، ما الذي يجب أن يتطابق بالضبط؟",o:["التيار والنوع (سريع/بطيء)","اللون","الطول فقط","الشركة المصنعة"],a:0,e:"الفيوز هو الاستثناء الوحيد الذي لا يجوز فيه أي زيادة أو تغيير نوع.",r:"20.1"},
{c:4,q:"عند استبدال ترانزستور بمكافئ صحيح، الخطأ الشائع القاتل:",o:["اختلاف ترتيب الأرجل (Pinout)","اختلاف اللون","اختلاف الشركة","اختلاف تاريخ الإنتاج"],a:0,e:"نفس العلبة قد تحمل ترتيبًا مختلفًا للأرجل، فينتج قصر فوري عند التشغيل.",r:"20.2"},
{c:4,q:"في داتاشيت الموسفت، ماذا يعني Rds(on)؟",o:["مقاومة التوصيل — كلما قلّت قلّت السخونة","الجهد الأقصى","التيار الأقصى","زمن التبديل"],a:0,e:"ارتفاعها عن قيمة الداتاشيت مؤشر قوي على أن القطعة مقلدة أو تالفة جزئيًا.",r:"20.2"},
{c:4,q:"اختبار سريع لكشف قطعة إلكترونية مقلدة:",o:["مسح الطباعة بالأسيتون — الأصلية محفورة بالليزر ولا تُمسح","وزنها باليد","النظر للون","قياس الطول"],a:0,e:"كثير من المقلد يُعاد طبعه فوق رقم آخر، فيظهر عند المسح.",r:"20.3"},
{c:4,q:"ما الذي يُمنع إعادة استخدامه من بوردات تالفة؟",o:["المكثفات الإلكتروليتية والفيوزات","المقاومات","الموصلات","الملفات"],a:0,e:"عمر المكثف الافتراضي مستهلك بالفعل، والفيوز قد يكون تعرض لإجهاد غير مرئي.",r:"20.4"},

/* ===== 5. البوردات ومصادر الطاقة ===== */
{c:5,q:"الأقسام الأربعة لأي بورد تحكم حديث:",o:["القدرة، التحكم، المدخلات، المخرجات","الإدخال، الإخراج، الذاكرة، المعالج","التقويم، التنعيم، التضخيم، الحماية","التغذية، الشاشة، الأزرار، الصوت"],a:0,e:"تحديد القسم الذي يقع فيه العطل يختصر ساعات من التشخيص العشوائي.",r:"4.1"},
{c:5,q:"ما النسبة التقريبية لأعطال البوردات التي تقع في قسم القدرة؟",o:["أكثر من 60%","حوالي 10%","حوالي 25%","أقل من 5%"],a:0,e:"لذلك يُعد إتقان مصدر الطاقة أعلى عائد وقت في تعلم الصيانة.",r:"4.3"},
{c:5,q:"ترتيب مراحل مصدر الطاقة النبضي الصحيح:",o:["فيوز ← MOV ← NTC ← فلتر ← قنطرة ← مكثف رئيسي ← موسفت ← محول ← تقويم الخرج","قنطرة ← فيوز ← محول ← موسفت","محول ← فيوز ← قنطرة ← مكثف","فيوز ← محول ← موسفت ← قنطرة"],a:0,e:"الحماية أولًا، ثم التقويم والتنعيم، ثم التقطيع عالي التردد، ثم العزل والتقويم النهائي.",r:"4.3"},
{c:5,q:"الجهد المتوقع على المكثف الرئيسي في SMPS يعمل على 220 فولت:",o:["290-320 فولت DC","220 فولت DC","12 فولت","400 فولت"],a:0,e:"القيمة العظمى للموجة (220×1.414) مطروحًا منها بعض السقوط، وهي جهد مميت.",r:"4.3"},
{c:5,q:"مصدر طاقة بلا خرج والفيوز سليم. أول ما تفحصه:",o:["مقاومة البدء ومكثف تغذية المتحكم","المحول","دايودات الخرج","الحمل"],a:0,e:"غياب الفيوز المحترق يستبعد القصر الكبير، ويوجه الشك لدائرة بدء التشغيل.",r:"4.3"},
{c:5,q:"فيوز محترق وأسود اللون في SMPS يشير إلى:",o:["قصر كبير: موسفت أو قنطرة تقويم مقصورة","حمل زائد بسيط","عمر الفيوز","تذبذب الجهد"],a:0,e:"السواد يعني تيارًا هائلًا لحظيًا، وهو نمط القصر لا الحمل الزائد.",r:"4.3"},
{c:5,q:"صفير أو تكتكة متكررة من مصدر الطاقة تعني عادة:",o:["حماية تعمل بسبب قصر في الخرج أو مكثف تالف","تشغيل طبيعي","تردد منخفض","حمل خفيف"],a:0,e:"المصدر يحاول البدء ثم يفصل ويعيد المحاولة، وهو نمط «Hiccup» المعروف.",r:"4.3"},
{c:5,q:"خرج مصدر الطاقة أعلى من المطلوب. الإجراء الفوري:",o:["الفصل فورًا وفحص TL431 والأوبتوكابلر","تركه ليستقر","توصيل حمل أكبر","خفض جهد الدخل"],a:0,e:"الجهد الزائد يدمر كل الدائرة التالية خلال ثوانٍ.",r:"4.3"},
{c:5,q:"مصدر طاقة يعمل باردًا ويفشل بعد التسخين. أول شك:",o:["مكثف إلكتروليتي يتغير أداؤه بالحرارة","المحول","الفيوز","المقاومة"],a:0,e:"يمكن تأكيده باستخدام بخاخ التبريد على المكثفات أثناء ظهور العطل.",r:"30.2"},
{c:5,q:"الخط الأبيض أو الشق المرسوم على بورد SMPS يفصل بين:",o:["الجانب الساخن والجانب البارد","المدخلات والمخرجات","التحكم والقدرة","الرقمي والتناظري"],a:0,e:"عبور هذا الحد بأداة موصلة أثناء التشغيل خطر مباشر على حياتك.",r:"4.3"},
{c:5,q:"أول خطوة قبل أي قياس على بورد مصدر طاقة:",o:["الفصل وتفريغ المكثف الرئيسي والتأكد بالقياس","قياس الجهد على الخرج","فك المحول","تسخين البورد"],a:0,e:"المكثف قد يحتفظ بـ300 فولت لساعات إذا كانت مقاومة التفريغ تالفة.",r:"4.3"},
{c:5,q:"لحام بارد يظهر بصريًا على شكل:",o:["حلقة داكنة متشققة حول رجل المكون","بقعة لامعة","سطح مخروطي أملس","لون فضي موحد"],a:0,e:"يشيع في المكونات الثقيلة كالمحولات والموصلات بسبب الاهتزاز والتمدد الحراري.",r:"4.4"},
{c:5,q:"سبب واقعي شائع لقصر البوردات يغفل عنه الفنيون:",o:["الحشرات والنمل والصراصير داخل الجهاز","المجال المغناطيسي","الضوء","الضوضاء"],a:0,e:"أجسام الحشرات موصلة جزئيًا وتسبب قصورًا متقطعة يصعب تفسيرها.",r:"4.4"},
{c:5,q:"الرمز Q أو T على البورد يشير إلى:",o:["ترانزستور","مقاومة","مكثف","ملف"],a:0,e:"R مقاومة، C مكثف، L ملف، D دايود، U دائرة متكاملة، RY ريلاي، F فيوز.",r:"4.5"},
{c:5,q:"TP على البورد تعني:",o:["نقطة اختبار Test Point","محول","ترانزستور","نقطة أرضي"],a:0,e:"المصنعون يضعونها عمدًا لتسهيل القياس، فابحث عنها أولًا.",r:"4.5"},
{c:5,q:"ترتيب الشك الصحيح عند أي عطل يبدأ بـ:",o:["الفيشة والبريزة والسلك","المتحكم","المكثفات","الريلايات"],a:0,e:"القاعدة: الأرخص والأسهل أولًا. البدء بافتراض تلف البورد أغلى وأقل الاحتمالات إحصائيًا.",r:"4.7"},
{c:5,q:"لماذا يجب تصوير البورد قبل الفك؟",o:["لتوثيق مواضع الموصلات والمكونات عند إعادة التركيب","لأرشفة العمل فقط","لإرسالها للعميل","لقياس الأبعاد"],a:0,e:"إجراء بسيط يوفر ساعات من الحيرة، خصوصًا مع الموصلات المتشابهة.",r:"4.5"},
{c:5,q:"لإصلاح مسار نحاسي مقطوع:",o:["كشط الطلاء الأخضر ولحام سلك لف بين الطرفين","وضع قصدير فوق الشق","لصقه بغراء موصل","استبدال البورد"],a:0,e:"يجب بعدها إعادة طلاء المنطقة لحمايتها من الرطوبة والتآكل.",r:"4.8"},
{c:5,q:"عند اقتلاع Pad نحاسي مع المكون:",o:["كشط المسار المتصل ولحام سلك رفيع ثم تثبيته بإيبوكسي","إعادة لحام المكون في الهواء","تجاهل الأمر","استبدال البورد"],a:0,e:"التثبيت الميكانيكي ضروري لأن الوصلة الجديدة ضعيفة أمام الشد.",r:"31.1"},
{c:5,q:"في إعادة تكوير BGA، الخطأ الذي يشقق الوصلات:",o:["التبريد المفاجئ بتيار هواء بارد","التسخين المسبق","استخدام الفلكس","التبريد التدريجي"],a:0,e:"الملف الحراري يشمل تبريدًا تدريجيًا؛ الصدمة الحرارية تكسر الوصلات مباشرة.",r:"31.3"},
{c:5,q:"في الملف الحراري للحام الخالي من الرصاص، درجة الذروة التقريبية:",o:["230-245 درجة مئوية","180 درجة","300 درجة","150 درجة"],a:0,e:"مع تسخين مسبق ونقع قبلها، وتبريد تدريجي بعدها.",r:"31.3"},
{c:5,q:"عند تعرض بورد للماء، أخطر ما يدمره:",o:["مرور التيار في الماء ثم التآكل الناتج","الماء نفسه","البرودة","الضغط"],a:0,e:"لذلك أول إجراء هو فصل التغذية والبطارية فورًا، لا محاولة التشغيل.",r:"14.1"},
{c:5,q:"لماذا يُعد الأرز طريقة سيئة لتجفيف جهاز مبلل؟",o:["غير فعال ويترك نشاءً وغبارًا في الموصلات","لأنه رطب","لأنه يسبب صدأ","لأنه يوصل الكهرباء"],a:0,e:"الأفضل غمر البورد في كحول 99% ثم تجفيفه بهواء دافئ لا يتجاوز 50 درجة.",r:"14.1"},
{c:5,q:"مياه البحر أو المشروبات السكرية أخطر على البورد لأنها:",o:["تستمر في التآكل والتوصيل بعد الجفاف","أثقل وزنًا","أعلى حرارة","تسبب رائحة"],a:0,e:"الأملاح والسكر تبقى موصلة وتأكل النحاس، فالغسل الكامل بالكحول إلزامي.",r:"14.1"},
{c:5,q:"الطلاء العازل (Conformal Coating) على بورد وحدة مكيف خارجية دوره:",o:["الحماية من الرطوبة والغبار","تحسين التبريد","العزل الحراري","الزينة"],a:0,e:"يجب كشطه قبل اللحام وإعادته بعد الإصلاح، وإلا عادت الرطوبة.",r:"14.3"},
{c:5,q:"ما الذي يجب ألا يُطلى بالطلاء العازل؟",o:["الموصلات ونقاط الاختبار والمشتتات","المقاومات","المكثفات","المسارات"],a:0,e:"طلاؤها يمنع القياس والتوصيل ويعيق أي إصلاح لاحق.",r:"14.3"},
{c:5,q:"عند استبدال بورد رئيسي في جهاز حديث قد تحتاج:",o:["نقل ذاكرة EEPROM أو برمجة البورد بموديل الجهاز","تغيير السلك","تعديل الفيوز","تركيب مكثف إضافي"],a:0,e:"بعض الشركات تربط البورد ببيانات الموديل، فلا يعمل بورد من جهاز آخر.",r:"15.5"},
{c:5,q:"أعراض فساد بيانات EEPROM تشبه:",o:["تلف البورد: عمل عشوائي أو كود بلا معنى أو نسيان الإعدادات","انقطاع التغذية","احتراق الفيوز","تلف الموتور"],a:0,e:"الحل يبدأ بإعادة ضبط المصنع، وإن فشلت فبرمجة الذاكرة بملف صحيح.",r:"15.5"},
{c:5,q:"سبب شائع لأعطال متقطعة في البوردات المعرضة للاهتزاز:",o:["لحام بارد في أرجل المكونات الثقيلة","تلف المتحكم","ضعف التغذية","تشويش"],a:0,e:"إعادة لحام أرجل المحول والموصلات والريلايات تحل نسبة كبيرة من هذه الأعطال.",r:"30.4"},
{c:5,q:"عند الشك في قصر على خط تغذية، الأداة الأنسب:",o:["مصدر جهد بحد تيار مع تحسس الحرارة","الميجر","مولد الإشارة","الكلامب"],a:0,e:"يمنع تدمير المكونات ويجعل المكون المقصور يسخن فتحدده باللمس أو بالكاميرا الحرارية.",r:"32.7"},

/* ===== 6. الموتورات والإنفرتر ===== */
{c:6,q:"في موتور بثلاثة أطراف، أكبر قراءة مقاومة تكون بين:",o:["طرفي البدء والتشغيل","المشترك والتشغيل","المشترك والبدء","أي طرف والجسم"],a:0,e:"القاعدة: مقاومة البدء + مقاومة التشغيل = المقاومة الكبرى. وأصغر قراءة هي ملف التشغيل.",r:"11.2"},
{c:6,q:"لعكس اتجاه دوران موتور حث أحادي الطور:",o:["اعكس أطراف ملف البدء فقط","اعكس أطراف ملف التشغيل","اعكس الحي والمتعادل","غيّر المكثف"],a:0,e:"عكس الملفين معًا لا يغير شيئًا؛ المطلوب عكس علاقة الطور بين الملفين.",r:"11.2"},
{c:6,q:"موتور يقرأ OL وهو ساخن. الاستنتاج الصحيح:",o:["انتظر حتى يبرد وأعد القياس — قد تكون الحماية الحرارية عاملة","الملف محروق حتمًا","المكثف تالف","القياس خاطئ"],a:0,e:"خطأ شائع جدًا: الحكم بحرق موتور وهو مجرد ساخن والـKlixon مفتوح مؤقتًا.",r:"11.2"},
{c:6,q:"موتور Shaded Pole يوجد عادة في:",o:["مراوح المبخر في الثلاجة والشفاطات","الغسالات","المكانس","المثاقب"],a:0,e:"بسيط ورخيص بلا مكثف ولا فحمات، ويُستبدل عادة ولا يُصلح.",r:"11.3"},
{c:6,q:"أفضل اختبار عملي لموتور BLDC مفصول:",o:["إدارة المحور يدويًا وقياس الجهد المولّد على وضع AC mV","قياس المقاومة للجسم فقط","توصيله بـ220 مباشرة","قياس السعة"],a:0,e:"ظهور جهد مولّد يثبت سلامة المغناطيس واللفات معًا. ⚠️ لا تُوصل موتور BLDC بـ220 أبدًا.",r:"11.4"},
{c:6,q:"في موتور BLDC سليم، المقاومات بين الأسلاك الثلاثة يجب أن تكون:",o:["متساوية تقريبًا بفارق أقل من 10%","مختلفة تمامًا","صفرًا","OL"],a:0,e:"الاختلاف الكبير يعني قصرًا بين اللفات، وOL يعني ملفًا مقطوعًا.",r:"11.4"},
{c:6,q:"معظم ما يُسمى «أعطال الموتورات» يكون في الحقيقة:",o:["ميكانيكيًا: بيرنج أو جلبة جافة","في الملفات","في المتحكم","في التغذية"],a:0,e:"الصرير والخشونة عند التدوير اليدوي مؤشرات مباشرة يجب فحصها قبل الحكم على الكهرباء.",r:"11.7"},
{c:6,q:"سرعة موتور بقطبين على تردد 25 هرتز:",o:["1500 لفة/دقيقة","3000 لفة/دقيقة","750 لفة/دقيقة","1200 لفة/دقيقة"],a:0,e:"السرعة = (120 × التردد) ÷ الأقطاب = (120 × 25) ÷ 2 = 1500.",r:"12.1"},
{c:6,q:"قاعدة V/f في الإنفرتر تعني:",o:["تغيير الجهد مع التردد بنسبة ثابتة للحفاظ على العزم","تثبيت الجهد دائمًا","تثبيت التردد","رفع الجهد فقط"],a:0,e:"عدم الالتزام بها يؤدي إلى إشباع الملفات وسخونة الموتور وفقد العزم.",r:"12.2"},
{c:6,q:"وحدة IPM في بورد الإنفرتر تحتوي على:",o:["ستة ترانزستورات IGBT مع دوائر حماية","محول ومكثف","معالجًا وذاكرة","أربعة دايودات فقط"],a:0,e:"ثلاثة أزرع لكل طور من أطوار الموتور الثلاثة.",r:"12.3"},
{c:6,q:"عند فحص وحدة IPM بوضع الدايود، القراءة السليمة بين (−) و U/V/W:",o:["0.3-0.5 فولت في كل حالة","صفر","OL","1.5 فولت"],a:0,e:"قراءة صفر تعني قصرًا، وقراءة OL تعني ذراعًا مفتوحًا. والقراءات يجب أن تكون متقاربة.",r:"12.3"},
{c:6,q:"السبب شبه الدائم لاحتراق وحدة IPM:",o:["ارتفاع الحرارة بسبب مشتت أو مروحة متسخة","الرطوبة","الاهتزاز","الغبار على الشاشة"],a:0,e:"استبدال الوحدة دون معالجة التبريد يعني احتراق البديلة خلال دقائق.",r:"12.3"},
{c:6,q:"جهد حلقة الوصل DC في بورد إنفرتر يعمل على 220:",o:["300-330 فولت DC","220 فولت","12 فولت","600 فولت"],a:0,e:"وهو جهد مميت يستوجب التفريغ والتحقق قبل أي لمس.",r:"12.4"},
{c:6,q:"العلامة الحقيقية لجهاز إنفرتر فعلي:",o:["الكمبروسر لا يتوقف بل يبطئ، ويرتفع تياره تدريجيًا","صوته منخفض","سعره أعلى","شاشته رقمية"],a:0,e:"بعض الأجهزة تُسوَّق كإنفرتر وهي مجرد تحكم بمراحل ثابتة.",r:"12.5"},
{c:6,q:"لماذا يوفر الإنفرتر طاقة مقارنة بالتشغيل التقليدي؟",o:["يتجنب تيار البدء المتكرر ويعمل بسرعة تناسب الحمل","يستخدم موتورًا أصغر","يعمل ساعات أقل","يخفض الجهد"],a:0,e:"التشغيل والإطفاء المتكرر يهدر طاقة كبيرة في كل بداية.",r:"12.1"},
{c:6,q:"موتور خطوي (Stepper) يهتز ولا يدور. السبب الأرجح:",o:["سلك مقطوع في أحد الملفين أو درايفر تالف","التغذية زائدة","الحمل خفيف","البرمجة صحيحة"],a:0,e:"فقدان أحد الأطوار يمنع تسلسل الخطوات فيهتز في مكانه.",r:"11.5"},
{c:6,q:"موتور ثلاثي الطور: لعكس اتجاه الدوران:",o:["بادل أي طورين","اعكس الثلاثة","غيّر التردد","اعكس الأرضي"],a:0,e:"تبديل طورين يعكس تسلسل المجال الدوّار.",r:"11.6"},
{c:6,q:"طريقة البدء Star-Delta تهدف إلى:",o:["تقليل تيار البدء ثم التشغيل بالقدرة الكاملة","زيادة العزم","تقليل الضوضاء","توفير الأسلاك"],a:0,e:"النجمة تعطي جهدًا أقل على كل ملف عند البدء، ثم يتحول للدلتا للتشغيل.",r:"11.6"},
{c:6,q:"لماذا لا يُستخدم WD-40 كمزيّت دائم للجلب؟",o:["ليس زيت تشحيم دائم ويتبخر تاركًا السطح جافًا","لأنه غالي","لأنه يوصل الكهرباء","لأنه يذيب البلاستيك"],a:0,e:"الأنسب زيت ماكينات خفيف؛ والبيرنج المغلق يُستبدل ولا يُشحّم.",r:"11.7"},
{c:6,q:"خلاط يعمل بضعف متزايد مع شرر شديد. السبب:",o:["الفحمات (الكربون) مستهلكة","المكثف","المفتاح","الملف محروق"],a:0,e:"أشهر عطل في الموتورات اليونيفرسال، ويُستبدل الفحمتان معًا دائمًا.",r:"5.2"},
{c:6,q:"عند تنظيف الكوميتيتر (المبدّل) في موتور بفحمات:",o:["سنفرة ناعمة جدًا وتشحيط بين الشرائح","مبرد خشن","ماء وصابون","لا يُنظف"],a:0,e:"الخشونة تتلف السطح والنحاس المتبقي بين الشرائح يسبب قصرًا.",r:"5.2"},
{c:6,q:"موتور يسخن ويفصل بعد دقائق رغم سلامته الكهربائية:",o:["تهوية مسدودة أو حمل زائد يفعّل الحماية الحرارية","تغذية منخفضة","المفتاح تالف","الأرضي مفصول"],a:0,e:"معالجة السبب أهم من استبدال الموتور؛ فالحماية تعمل كما ينبغي.",r:"11.2"},
{c:6,q:"موتور يعمل بضعف رغم سلامته والمكثف جديد. سبب يجب فحصه:",o:["سقوط الجهد بسبب كابل رفيع أو طويل","لون السلك","نوع القاطع","نوع الفيوز"],a:0,e:"سقوط الجهد يرفع التيار المسحوب ويسخن الموتور، وهو سبب متكرر لاحتراقه.",r:"28.2"},
{c:6,q:"في مكيف إنفرتر، الكمبروسر لا يدور والتغذية سليمة. الشك الأول:",o:["وحدة IPM أو دائرة القيادة على بورد الإنفرتر","الريموت","الفلاتر","حساس الغرفة"],a:0,e:"يُفحص IPM كما يُفحص الموسفت بعد تفريغ حلقة DC.",r:"12.4"},
{c:6,q:"كود حماية تيار زائد (OC) يتكرر بعد استبدال IPM. السبب الأرجح:",o:["الموتور نفسه مقصور أو التبريد لم يُعالَج","الريموت","الفلتر","الأرضي"],a:0,e:"لا يُستبدل مكون قدرة قبل التأكد من الحمل ومن نظام التبريد.",r:"12.4"},
{c:6,q:"طلمبة مياه تطنّ ولا تدور. الفحص الأول:",o:["المكثف ثم محاولة تدوير المروحة الخلفية بمفك","الملف","المفتاح","الأرضي"],a:0,e:"الصدأ قد يوقف الطلمبة بعد فترة سكون، وتدويرها يدويًا يكشف ذلك سريعًا.",r:"18.1"},
{c:6,q:"طلمبة تعمل وتتوقف باستمرار في نظام ضغط. السبب الأرجح:",o:["تسريب في الشبكة أو خزان الضغط فقد الهواء","الملف","المكثف","العوامة"],a:0,e:"كل انخفاض ضغط بسيط يعيد تشغيل الطلمبة، وهو ما يستهلك كهرباء ويقصّر عمرها.",r:"18.1"},
{c:6,q:"موتور بوابة يفتح ولا يغلق. السبب الأشهر:",o:["حساس الأشعة (Photocell) متسخ أو غير محاذٍ","المكثف","الريموت","الجيربوكس"],a:0,e:"الحساس يمنع الغلق عند وجود عائق، واتساخه يُقرأ كعائق دائم.",r:"18.6"},
{c:6,q:"لماذا يجب ضبط حساسية عزم موتور البوابة بدقة؟",o:["لأن العزم الزائد سبب موثق لحوادث قاتلة للأطفال","لتوفير الطاقة","لتقليل الضوضاء","لإطالة عمر السير"],a:0,e:"يجب اختبار أن البوابة ترتد فورًا عند مقاومة بسيطة.",r:"18.6"},
{c:6,q:"مقاومة العزل المطلوبة بين أي سلك في موتور والجسم:",o:["أكبر من 10 ميجا أوم عمليًا","حوالي 1 كيلو أوم","حوالي 100 أوم","صفر"],a:0,e:"أي قراءة منخفضة تعني تسريبًا يجعل الجهاز خطرًا ويُفصل القاطع التفاضلي.",r:"11.4"}

/* ===== 7. التبريد والتكييف ===== */
{c:7,q:"ترتيب دورة التبريد الصحيح:",o:["ضاغط ← مكثف ← جهاز تمدد ← مبخر","مبخر ← ضاغط ← جهاز تمدد ← مكثف","ضاغط ← مبخر ← مكثف ← جهاز تمدد","مكثف ← ضاغط ← مبخر ← جهاز تمدد"],a:0,e:"الضاغط يرفع الضغط، المكثف يطرد الحرارة، جهاز التمدد يخفض الضغط، المبخر يمتص الحرارة.",r:"25.4"},
{c:7,q:"نقطة انخفاض الضغط في الدورة تحدث عند:",o:["الأنبوبة الشعرية أو صمام التمدد","الضاغط","المكثف","خط السحب"],a:0,e:"هذا الانخفاض المفاجئ هو ما يجعل السائل يتبخر ويمتص الحرارة في المبخر.",r:"25.4"},
{c:7,q:"«الحرارة الزائدة» (Superheat) تعني:",o:["كم سُخِّن الغاز فوق نقطة تبخره","كم بُرِّد السائل","حرارة الضاغط","حرارة الغرفة"],a:0,e:"مؤشر على صحة التمدد؛ ويقابله Subcooling كمؤشر على كفاية الشحنة.",r:"25.4"},
{c:7,q:"ضغط منخفض جدًا في جانب السحب مع ضغط مرتفع منخفض يشير إلى:",o:["انسداد في الشعرية أو الفلتر","زيادة شحنة","حمل حراري كبير","صمامات ضاغط تالفة"],a:0,e:"غالبًا يظهر تجمد موضعي عند نقطة الانسداد.",r:"25.5"},
{c:7,q:"ارتفاع شديد في الضغط العالي مع كندنسر متسخ يعني:",o:["فشل طرد الحرارة وتفعيل حماية الضغط","نقص شحنة","انسداد الشعرية","صمام معكوس"],a:0,e:"لهذا يعد تنظيف الكندنسر وفحص مروحته أول خطوة في أعطال «لا يبرد».",r:"25.5"},
{c:7,q:"ضغط سحب مرتفع مع ضغط طرد منخفض يدل غالبًا على:",o:["صمامات الضاغط تالفة — الضاغط لا يضغط","نقص فريون","انسداد","حمل زائد"],a:0,e:"الضاغط في هذه الحالة يُستبدل؛ لا فائدة من إضافة غاز.",r:"25.5"},
{c:7,q:"لماذا يُعد التفريغ (Vacuum) إلزاميًا قبل الشحن؟",o:["إزالة الرطوبة التي تجمّد الشعرية وتنتج أحماضًا تدمر الضاغط","تسريع الشحن","تنظيف الأنابيب","اختبار التسريب"],a:0,e:"يُوصى بالتفريغ إلى 500 ميكرون على الأقل، والرطوبة أخطر من الهواء نفسه.",r:"25.6"},
{c:7,q:"عند فتح دائرة التبريد لأي إصلاح يجب:",o:["استبدال الفلتر المجفف","إعادة استخدامه بعد التنظيف","تجاهله","تركيب فلتر أكبر"],a:0,e:"الفلتر القديم مشبع بالرطوبة وسيطلقها في الدائرة الجديدة.",r:"25.6"},
{c:7,q:"لماذا يُمنع خلط R22 مع R410A؟",o:["ضغطاهما وزيتاهما مختلفان ويدمر الخليط الضاغط","لاختلاف اللون","لاختلاف السعر","لا مانع"],a:0,e:"ضغط تشغيل R410A أعلى من R22 بنحو 50-60%، وزيته مختلف (POE مقابل المعدني)، وخراطيم R22 قد تنفجر معه.",r:"25.2"},
{c:7,q:"الغازات القابلة للاشتعال بين ما يلي:",o:["R600a و R290","R134a و R410A","R22 و R404A","R410A فقط"],a:0,e:"R32 قابل للاشتعال بدرجة منخفضة (تصنيف A2L) وينتشر بسرعة في المكيفات الجديدة.",r:"25.2"},
{c:7,q:"الحروق الباردة من الفريون السائل تحدث لأنه:",o:["يتبخر فورًا ويجمّد الجلد والعين خلال ثوانٍ","حمضي","ساخن","سام"],a:0,e:"لذلك النظارة والقفاز إلزاميان عند العمل على الدائرة.",r:"25.3"},

{c:7,q:"ثلاجة: الكمبروسر يحاول العمل ويفصل مع صوت كليك متكرر. الشك الأول:",o:["ريلاي البدء أو PTC","الثيرموستات","الديفروست","المروحة"],a:0,e:"يليه مكثف البدء ثم احتمال أن يكون الكمبروسر عالقًا ميكانيكيًا.",r:"5.4"},

{c:7,q:"الفريزر يبرد والثلاجة لا تبرد. السبب الأشهر:",o:["عطل في نظام الديفروست يسد مجرى الهواء بالثلج","نقص غاز","الكمبروسر ضعيف","الثيرموستات"],a:0,e:"يليه توقف مروحة المبخر التي تدفع الهواء البارد للأسفل.",r:"5.4"},
{c:7,q:"تراكم ثلج كثيف على الجدار الخلفي في ثلاجة No Frost يستوجب فحص:",o:["سخان الديفروست والبيميتال والفيوز الحراري والمؤقت","الكمبروسر","المكثف","الباب"],a:0,e:"هذه السلسلة الأربعة هي منظومة الإذابة، وأي حلقة فيها تعطل الدورة كلها.",r:"5.4"},
{c:7,q:"مياه تتجمع داخل درج الثلاجة أو على الأرضية. السبب الأشهر:",o:["مجرى تصريف الديفروست مسدود","تسريب مياه من الشبكة","الباب مفتوح","الغاز ناقص"],a:0,e:"يُنظف بسلك مرن وماء ساخن، وهو من أسهل الإصلاحات وأكثرها تكرارًا.",r:"5.4"},

{c:7,q:"مكيف: الوحدة الداخلية تعمل والخارجية لا تعمل. الفحص الأول:",o:["مكثف الكمبروسر/المروحة ثم الكونتاكتور","الريموت","الفلاتر","حساس الغرفة"],a:0,e:"المكثفات أكثر القطع تلفًا في المكيفات التقليدية وأرخصها استبدالًا.",r:"5.7"},
{c:7,q:"مكيف يعمل ولا يبرد. أول ما تفحصه دائمًا:",o:["الفلاتر ونظافة المبادلات","الغاز","الكمبروسر","البورد"],a:0,e:"الفلاتر المتسخة تخفض التدفق فتقلل التبريد وقد تجمّد الملف، وهي أرخص وأسرع فحص.",r:"5.7"},
{c:7,q:"تسريب ماء من الوحدة الداخلية للمكيف. السبب الأشهر:",o:["انسداد حوض أو خرطوم التصريف","تسريب غاز","الكمبروسر","المروحة"],a:0,e:"ويليه تجمد الملف بسبب فلتر متسخ أو نقص فريون، فيسيل الثلج عند الذوبان.",r:"5.7"},
{c:7,q:"رائحة كريهة من المكيف سببها عادة:",o:["عفن متراكم على المبخر","الغاز","الموتور","الكابل"],a:0,e:"يُعالج بالتنظيف بمعقم مخصص وضمان تصريف جيد للرطوبة.",r:"5.7"},
{c:7,q:"في مكيف إنفرتر، سلك الاتصال S بين الوحدتين يُتوقع أن يقرأ:",o:["جهدًا متذبذبًا حوالي 20-60 فولت DC (قراءة تقريبية)","220 فولت AC","صفرًا","12 فولت ثابتة"],a:0,e:"الإشارة رقمية، والأفوميتر يعطي متوسطًا مضللًا؛ التأكد الحقيقي بالأوسيلوسكوب.",r:"15.4"},
{c:7,q:"كود فشل اتصال بين الوحدتين. أول ما تفحصه:",o:["الأسلاك وترتيب التوصيل والأرضي","البورد الخارجي","الكمبروسر","الفلاتر"],a:0,e:"سبعون بالمئة من أعطال الاتصال سببها موصل مؤكسد أو سلك مقطوع أو ترتيب خاطئ.",r:"15.3"},
{c:7,q:"لا يوجد 220 فولت واصلة للوحدة الخارجية في مكيف تقليدي. الاستنتاج:",o:["البورد الداخلي أو ريلايه لا يعطي الأمر","الكمبروسر تالف","الغاز ناقص","الفلتر مسدود"],a:0,e:"التغذية للوحدة الخارجية تمر عبر البورد الداخلي في معظم التصميمات.",r:"15.4"},
{c:7,q:"صمام عكس الاتجاه (4-Way Valve) وظيفته:",o:["تبديل الدورة للتدفئة في المكيفات الحارة/الباردة","تنظيم الضغط","تصفية الغاز","قياس الحرارة"],a:0,e:"عند تعلقه يعمل الجهاز في وضع واحد فقط.",r:"5.7"},
{c:7,q:"كولدير مياه لا يسخن. الفحص الأشهر:",o:["الفيوز الحراري","المكثف","المروحة","الضاغط"],a:0,e:"وأما قسم التبريد فيعتمد على كمبروسر صغير أو خلية بلتيير حسب الموديل.",r:"18.2"},
{c:7,q:"صيانة كولدير المياه الأهم صحيًا:",o:["تعقيم الخزان كل 3-6 أشهر","تغيير المكثف","تشحيم المروحة","تنظيف الشاشة"],a:0,e:"إهماله مشكلة صحية لا فنية، إذ يتكوّن غشاء بكتيري داخل الخزان.",r:"18.2"},
{c:7,q:"دورية غسل مبخر ومكثف المكيف الموصى بها:",o:["كل 6 أشهر","كل 5 سنوات","مرة عند التركيب","شهريًا"],a:0,e:"أما الفلاتر فكل أسبوعين في موسم الاستخدام.",r:"9"},
{c:7,q:"قبل أي عمل على ثلاجة يجب:",o:["قراءة نوع الغاز من لوحة البيانات","فصل الباب","إفراغ المحتويات فقط","قياس الحرارة"],a:0,e:"وجود R600a يعني غازًا قابلًا للانفجار ويغيّر كل قواعد العمل.",r:"25.1"},

{c:8,q:"طريقة اختبار حساس الضغط في الغسالة:",o:["النفخ في الخرطوم وسماع الكليكات المتتالية","قياس السعة","قياس الجهد فقط","هزّه"],a:0,e:"كل كليك يمثل مستوى تبديل؛ غيابها يعني تلف الحساس.",r:"5.5"},
{c:8,q:"غسالة لا تدور حلتها. الفحص الأول:",o:["فحمات الموتور والسير","السخان","الصمام","الفلتر"],a:0,e:"ثم التاكو ثم ترياك أو إنفرتر الموتور على البورد.",r:"5.5"},
{c:8,q:"وظيفة التاكو (Tacho) في الغسالة:",o:["إخبار البورد بسرعة الموتور الفعلية","تسخين الماء","قياس المنسوب","قفل الباب"],a:0,e:"مقاومته عادة 50-200 أوم؛ تلفه يمنع العصر أو يجعل السرعة عشوائية.",r:"5.5"},
{c:8,q:"غسالة تفصل قاطع المنزل. المتهم الأول:",o:["السخان مسرّب للجسم","الموتور","القفل","الصمام"],a:0,e:"يُقاس بين طرف السخان وجسمه: أي قراءة أقل من 1 ميجا أوم تعني تسريبًا خطرًا.",r:"5.5"},
{c:8,q:"صوت عالٍ من الغسالة عند العصر تحديدًا. السبب الأشهر:",o:["البيرنج (الرومان بلي) تالف","السير","الصمام","البورد"],a:0,e:"ويليه جسم غريب بين الحلة والدرام، أو أثقال خرسانية مفكوكة.",r:"5.5"},
{c:8,q:"غسالة لا تسخن الماء. تسلسل الفحص:",o:["السخان ← NTC ← ريلاي السخان على البورد","الموتور ← السير","الصمام ← الفلتر","القفل ← الباب"],a:0,e:"قياس مقاومة السخان (20-35 أوم) يحسم الأمر سريعًا.",r:"5.5"},
{c:8,q:"مقاومة طلمبة تصريف غسالة السليمة:",o:["150-220 أوم","5 أوم","3 كيلو أوم","صفر"],a:0,e:"أما صمام الماء فمقاومته 3-5 كيلو أوم لأنه ملف رفيع وطويل.",r:"7"},
{c:8,q:"غسالة تتحرك من مكانها أثناء العصر. الأسباب:",o:["أرجل غير مستوية أو مسامير النقل لم تُفك أو حمولة غير موزعة","السخان","الصمام","البورد"],a:0,e:"مسامير النقل تُفك عند التركيب؛ نسيانها يدمر الممتصات والبيرنج.",r:"ملحق ك"},
{c:8,q:"كود 4E أو IE في الغسالات يعني عادة:",o:["مشكلة في دخول الماء","مشكلة تصريف","مشكلة تسخين","مشكلة موتور"],a:0,e:"تُفحص سلسلة: المحبس ← فلتر الخرطوم ← الصمام ← حساس الضغط.",r:"ملحق د-1"},
{c:8,q:"كود 5E أو OE أو F05 يعني عادة:",o:["فشل التصريف","فشل الملء","فشل التسخين","خطأ باب"],a:0,e:"يبدأ الفحص دائمًا من فلتر الطلمبة قبل أي شيء آخر.",r:"ملحق د-1"},
{c:8,q:"كود UE أو UB في الغسالات يشير إلى:",o:["عدم اتزان الحمولة","دخول ماء","تسخين","اتصال"],a:0,e:"قد يكون سببه حمولة غير موزعة أو بيرنج أو أرجل غير مستوية.",r:"ملحق د-1"},
{c:8,q:"«وضع الاختبار» (Test Mode) في الأجهزة مفيد لأنه:",o:["يشغّل كل مكون على حدة فيعزل العطل في دقائق","يعيد ضبط المصنع","يحذف الأكواد","يزيد السرعة"],a:0,e:"يُدخل عادة بضغط مطول على زرين معًا، ويختلف حسب الموديل.",r:"ملحق د-4"},
{c:8,q:"مجفف ملابس يدور ولا يسخن. الشك الأول:",o:["الفيوز الحراري","السير","المكثف","البورد"],a:0,e:"يليه عنصر التسخين ثم الثيرموستات ثم ريلاي البورد.",r:"5.5.1"},
{c:8,q:"مجفف يسخن ولا تدور حلته. السبب:",o:["السير مقطوع أو بكرة الشد","الفيوز الحراري","الحساس","الفلتر"],a:0,e:"صوت الموتور مع ثبات الحلة علامة مميزة لانقطاع السير.",r:"5.5.1"},
{c:8,q:"ملابس تخرج مبللة من المجفف رغم انتهاء الدورة:",o:["مسار الهواء مسدود أو حساس الرطوبة متسخ","الموتور ضعيف","السير","الباب"],a:0,e:"المجفف يعتمد على تدفق الهواء لطرد الرطوبة، وانسداده يبطل عمله كليًا.",r:"5.5.1"},
{c:8,q:"نوع المدخنة الصحيح لمجفف الملابس:",o:["معدنية صلبة قصيرة بأقل عدد أكواع","بلاستيكية مرنة","رقائقية طويلة","بلا مدخنة"],a:0,e:"المرنة والبلاستيكية تحتجز الوبر وتزيد خطر الحريق بشدة.",r:"5.5.1"},
{c:8,q:"غسالة أطباق لا تنظف جيدًا. السبب الأشهر:",o:["أذرع الرش مسدودة ببقايا الطعام","السخان","الطلمبة","الباب"],a:0,e:"تُفك الأذرع وتُنظف فتحاتها بإبرة، مع تنظيف الفلاتر أسبوعيًا.",r:"5.6"},
{c:8,q:"إهمال ملح غسالة الأطباق يؤدي إلى:",o:["ترسبات جيرية تدمر السخان","رائحة فقط","بطء الدورة","تسريب"],a:0,e:"جهاز التليين يحتاج ملحًا مخصصًا، ووظيفته منع عسر الماء من ترسيب الجير.",r:"5.6"},
{c:8,q:"شاشة LED: صوت موجود وشاشة سوداء. الاختبار الحاسم:",o:["تسليط كشاف قوي على الشاشة — ظهور صورة باهتة يؤكد عطل الإضاءة الخلفية","قياس الجهد فقط","تغيير الكابل","إعادة الضبط"],a:0,e:"اختبار بسيط جدًا يفصل بين عطل الإضاءة وعطل معالجة الصورة.",r:"5.9"},
{c:8,q:"شاشة تعمل ثم تنطفئ بعد ثوانٍ. السبب الأشهر:",o:["ليدة محترقة في شريط الإضاءة تفعّل الحماية","البورد الرئيسي","الكابل","الريموت"],a:0,e:"ارتفاع جهد السلسلة بسبب الليدة المفتوحة يفعّل حماية دائرة الإضاءة.",r:"5.9"},
{c:8,q:"شاشة لا يوجد بها أي ضوء ولا ليد استعداد. الشك الأول:",o:["بورد القدرة — فيوز ومكثفات منتفخة","بورد T-CON","الباناميل","الريموت"],a:0,e:"غياب ليد الاستعداد يعني أن جهد الاستعداد نفسه مفقود.",r:"5.9"},
{c:8,q:"خطوط عمودية أو صورة مشوهة في الشاشة تشير غالبًا إلى:",o:["بورد T-CON أو كابل LVDS","بورد القدرة","السماعات","الريموت"],a:0,e:"أما الخطوط الأفقية والبقع فغالبًا في الباناميل نفسه وإصلاحه غير اقتصادي.",r:"5.9"},
{c:8,q:"مكنسة كهربائية ضعيفة الشفط. ترتيب الفحص:",o:["الحاوية ← الفلتر ← انسداد الخرطوم","الموتور ← الفحمات","السلك ← المفتاح","البورد"],a:0,e:"تشغيل المكنسة بفلتر مسدود يسخّن الموتور ويؤدي لاحقًا إلى احتراقه.",r:"5.10"},
{c:8,q:"سبب شائع لعطل مكنسة لا تعمل نهائيًا:",o:["كسر في السلك عند آلية اللف التلقائي","الفلتر","الحاوية","الفرشاة"],a:0,e:"يُكشف بتحريك السلك أثناء قياس الاستمرارية.",r:"5.10"},
{c:8,q:"سخان إندكشن يفصل بعد ثوانٍ من التشغيل:",o:["مروحة التبريد متوقفة أو فتحات مسدودة","الإناء غير مناسب","الجهد منخفض","الحساس ممتاز"],a:0,e:"ارتفاع الحرارة هو السبب الأول لاحتراق الـIGBT في هذه الأجهزة.",r:"5.11"},
{c:8,q:"سخان إندكشن لا يتعرف على الإناء:",o:["الإناء غير مغناطيسي أو حساس الكشف تالف","الفيوز","المروحة","الشاشة"],a:0,e:"الإندكشن يعمل فقط مع القيعان الحديدية القابلة للمغنطة.",r:"5.11"},
{c:8,q:"فرن كهربائي يسحب تيارًا عاليًا يستوجب:",o:["التأكد من مقطع السلك والبريزة والقاطع المخصص","استخدام وصلة عادية","تقليل الاستخدام","لا شيء"],a:0,e:"الأفران تسحب 10-16 أمبير، ووصلة عادية قد تنصهر تحت الحمل.",r:"5.11"},

/* ===== 9. الأجهزة الحرارية والصغيرة والسخانات ===== */
{c:9,q:"جهاز حراري: اللمبة تضيء لكنه لا يسخن. الاستنتاج:",o:["عنصر التسخين مقطوع","السلك مقطوع","الفيوز الحراري","المفتاح"],a:0,e:"إضاءة اللمبة تثبت وصول التغذية، فالعطل بعدها في العنصر نفسه.",r:"5.1"},
{c:9,q:"جهاز حراري يسخن ولا يتوقف أبدًا:",o:["الثيرموستات ملتصق — خطر حريق، أوقف الاستخدام","العنصر ضعيف","الفيوز","السلك"],a:0,e:"هذا العطل تحديدًا يتحول إلى حريق إن استمر الاستخدام.",r:"5.1"},
{c:9,q:"السبب الأول لأعطال الأجهزة الحرارية الصغيرة:",o:["كسر السلك عند نقطة انثنائه بجوار الجهاز أو الفيشة","تلف العنصر","تلف الثيرموستات","تلف اللمبة"],a:0,e:"يُكتشف بتحريك السلك أثناء قياس الاستمرارية ومراقبة تقطع القراءة.",r:"5.1"},
{c:9,q:"عند فحص عنصر تسخين، الاختبار الأهم بعد قياس مقاومته:",o:["قياس العزل بين طرفه وجسم الجهاز — يجب OL","قياس الطول","فحص اللون","قياس الوزن"],a:0,e:"أي قراءة أقل من 1 ميجا أوم تعني تسريبًا يجعل الجهاز غير آمن.",r:"2.3"},
{c:9,q:"السبب الأول لاحتراق عنصر سخان المياه:",o:["الترسبات الجيرية التي تعزله فيسخن","الجهد المرتفع","الاستخدام الكثير","الرطوبة"],a:0,e:"إزالة الترسبات دوريًا تطيل عمر العنصر وترفع كفاءة السخان.",r:"5.1"},
{c:9,q:"صمام الأمان في سخان الخزان إن انسد:",o:["يشكّل خطر انفجار حقيقي للخزان","يقلل التسخين","يسبب تسريبًا","لا يؤثر"],a:0,e:"يجب اختباره سنويًا مع فحص الأنود المغنيسيومي.",r:"26.6"},
{c:9,q:"لماذا يُضبط سخان المياه على 60 درجة تحديدًا؟",o:["أقل يشجع بكتيريا الليجيونيلا وأعلى يهدر طاقة ويسبب حروقًا","لتوفير الكهرباء فقط","لتقليل الترسبات فقط","بلا سبب"],a:0,e:"توازن بين السلامة الميكروبية والحرارية وكفاءة الطاقة.",r:"26.6"},
{c:9,q:"سخان شاور لحظي لا يسخن رغم جريان الماء. الشك الأول:",o:["مفتاح التدفق (Flow Switch)","العنصر","الثيرموستات","البورد"],a:0,e:"يتعطل بالترسبات، وقد يمنعه ضعف ضغط المياه من العمل أصلًا.",r:"26.4"},
{c:9,q:"سخان شاور يفصل القاطع التفاضلي. الإجراء الصحيح:",o:["إيقاف الجهاز فورًا — تسريب من العنصر إلى الماء","تركيب قاطع أقل حساسية","إعادة التشغيل","تجاهل الأمر"],a:0,e:"هذا أخطر عطل ممكن في المنزل ويجب ألا يُستخدم الجهاز حتى الفحص الكامل.",r:"26.4"},
{c:9,q:"جهاز 6000 وات يسحب تقريبًا ويحتاج كابلًا:",o:["27 أمبير و6 مم² على الأقل","10 أمبير و1.5 مم²","15 أمبير و2.5 مم²","40 أمبير و10 مم²"],a:0,e:"6000 ÷ 220 ≈ 27 أمبير، وهو ما يستوجب مقطعًا 6 مم² وقاطعًا مخصصًا.",r:"26.2"},
{c:9,q:"شرط أساسي لتركيب سخان لحظي في حمام:",o:["أرضي فعّال مقاس + قاطع تفاضلي 30 مللي أمبير","بريزة عادية قوية","مفتاح داخل الحمام","لا شروط"],a:0,e:"إن لم يتوفرا فلا يُركّب الجهاز مطلقًا مهما ألح العميل.",r:"26.2"},
{c:9,q:"في الأجهزة الغازية، اللهب ينطفئ عند ترك الزر. السبب:",o:["المزدوج الحراري (Thermocouple) متسخ أو تالف","الغاز ناقص","الشعلة مسدودة","الشرارة ضعيفة"],a:0,e:"يجب أن يعطي أكثر من 15 مللي فولت وهو ساخن، وإلا لم يفتح صمام الأمان.",r:"27.3"},
{c:9,q:"لهب أصفر بدل الأزرق في موقد غاز يعني:",o:["احتراق غير كامل وإنتاج أول أكسيد كربون","غازًا أفضل","حرارة أعلى","توفيرًا"],a:0,e:"غالبًا فتحات الشعلة مسدودة أو نسبة الهواء خاطئة.",r:"27.3"},
{c:9,q:"شرارة إشعال مستمرة لا تتوقف في البوتاجاز:",o:["رطوبة على الأزرار أو مفتاح إشعال ملتصق","نقص غاز","قطب مكسور","بطارية ضعيفة"],a:0,e:"شائع جدًا بعد تنظيف السطح بالماء دون تجفيف.",r:"27.3"},
{c:9,q:"ماكينة قهوة: ضغط ضعيف أو لا يخرج ماء. السبب رقم 1:",o:["الترسبات الجيرية","المضخة محترقة","الثيرموستات","البورد"],a:0,e:"إزالة الترسبات كل 1-3 أشهر تمنع 80% من أعطال هذه الأجهزة.",r:"18.3"},
{c:9,q:"قلاية هوائية لا تعمل عند إغلاق الدرج:",o:["مفتاح الأمان الصغير في الدرج","العنصر","المروحة","الحساس"],a:0,e:"وهو أشهر عطل فيها، ويُفحص بالاستمرارية عند الضغط عليه.",r:"18.4"},
{c:9,q:"سبب انصهار الفيوز الحراري في القلاية أو الشواية:",o:["تراكم الدهون في مجرى الهواء يرفع الحرارة","استخدام مفرط","جهد عالٍ","مروحة قوية"],a:0,e:"التنظيف الدوري لمجرى الهواء يمنع العطل ويقي من الحريق.",r:"18.4"},
{c:9,q:"مرطّب الهواء لا يخرج بخارًا. الفحص الأول:",o:["ترسبات على القرص المذبذب — نظّفه بالخل","الموتور","الفلتر","المروحة"],a:0,e:"القرص فوق الصوتي حساس جدًا لأي طبقة جير تمنع اهتزازه.",r:"35"},
{c:9,q:"ميزان رقمي يعطي قراءات خاطئة بعد حمل زائد:",o:["خلية الحمل (Load Cell) تعرضت للتشوه","البطارية","الشاشة","الأزرار"],a:0,e:"الرطوبة على البورد سبب شائع آخر لهذه الأعطال.",r:"35"},
{c:9,q:"راوتر يفصل ويعيد التشغيل باستمرار. المتهم الأول:",o:["محول التغذية الخارجي ومكثفاته","المعالج","الهوائي","الكابل"],a:0,e:"محولات الراوترات رخيصة وتجف مكثفاتها سريعًا، واستبدالها يحل العطل غالبًا.",r:"35"},
{c:9,q:"جرس باب لا يعمل. المتهم الأول:",o:["زر الجرس الخارجي المتآكل من المطر","المحول","السماعة","السلك"],a:0,e:"يليه المحول الصغير الذي يتغذى منه النظام.",r:"35"},
{c:9,q:"ماكينة حلاقة لا تعمل إلا موصولة بالشاحن:",o:["البطارية انتهى عمرها","الموتور","المفتاح","الشفرة"],a:0,e:"تُستبدل بلحام نقطي، ويُمنع اللحام المباشر على خلية الليثيوم.",r:"35"},
{c:9,q:"الخطر الرئيسي في الشواحن المقلدة الرخيصة:",o:["عزل غير كافٍ بين 220 والخرج قد يصعقك عبر جهازك","بطء الشحن","حرارة بسيطة","كابل قصير"],a:0,e:"هذه الفئة تحديدًا سببت وفيات موثقة، خاصة عند الاستخدام أثناء الشحن.",r:"5.12"},
{c:9,q:"مكواة بخارية لا تخرج بخارًا:",o:["فوهة مسدودة بالجير","العنصر","الثيرموستات","المفتاح"],a:0,e:"يُعالج بمحلول إزالة ترسبات وتنظيف الفتحات.",r:"35"},
{c:9,q:"UPS يصفر باستمرار وزمن احتياطه قصير:",o:["البطارية انتهى عمرها (2-4 سنوات)","الإنفرتر","المروحة","الشاحن"],a:0,e:"البطارية هي المكون الاستهلاكي وسبب 80% من أعطال الـUPS.",r:"5.13"},
{c:9,q:"مثبت الجهد (Stabilizer) العطل الأشهر فيه:",o:["ريلاي محترق","المحول","الشاشة","المفتاح"],a:0,e:"الريلايات تعمل آلاف المرات يوميًا في المناطق ذات الجهد المتذبذب فتتآكل نقاطها.",r:"5.13"},
{c:9,q:"لماذا لا يُوصل مكيف أو ثلاجة إنفرتر بـUPS شبه جيبي؟",o:["الموجة المشوهة قد تدمر بورد الإنفرتر","لضعف القدرة فقط","لأنه أبطأ","لا مانع"],a:0,e:"الأجهزة الحساسة تحتاج موجة جيبية نقية حصرًا.",r:"22.4"},
{c:9,q:"الفرق بين مثبت الجهد ومانع الصواعق (SPD):",o:["المثبت يعالج التذبذب البطيء و SPD يمتص القفزات اللحظية","لا فرق","المثبت أقوى","SPD للإنارة فقط"],a:0,e:"وظيفتان مختلفتان وقد تحتاج الاثنين معًا في المناطق المعرضة للصواعق.",r:"22.4"},
{c:9,q:"لمبة LED ترفرف عند الإطفاء أو التشغيل:",o:["دِمَر غير متوافق أو حث من سلك مجاور","العمر الافتراضي","الجهد العالي","الحرارة"],a:0,e:"يُحل غالبًا بمكثف أو مقاومة موازية أو باستخدام دِمَر متوافق مع LED.",r:"6.4"},

<script>/* ============ محرك ماركداون مصغّر (يعمل بلا إنترنت) ============ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inl(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\(#([^)]+)\)/g,'<a href="#/doc/$2" class="xref">$1</a>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(\d+(?:\.\d+)?)\s*(فولت|أمبير|أوم|وات|هرتز|ميجا أوم|كيلو أوم|مللي أمبير|مللي فولت|ميكروفاراد|درجة مئوية|مم²|كيلو وات ساعة)/g,'<span class="val">$1 $2</span>');
  return s;
}
let SUBN=0;
function mdToHtml(md){
  const L=md.split('\n');let o=[],i=0;
  const flush=st=>{while(st.length)o.push(st.pop());};
  while(i<L.length){
    let l=L[i];
    if(/^<a id=/.test(l)){o.push(l);i++;continue;}
    if(/^```/.test(l)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i])){b.push(esc(L[i]));i++;}i++;o.push('<div class="pw"><button class="cpy" type="button">نسخ</button><pre class="blk">'+b.join('\n')+'</pre></div>');continue;}
    let h=l.match(/^(#{1,4})\s+(.*)$/);
    if(h){const lv=h[1].length;const sid=lv===3?` id="sub-${SUBN++}"`:'';o.push(`<h${lv}${sid} class="hd h${lv}">${inl(h[2])}</h${lv}>`);i++;continue;}
    if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const hd=row(l);i+=2;let bd=[];
      while(i<L.length&&/^\s*\|/.test(L[i])){bd.push(row(L[i]));i++;}
      o.push('<div class="tw"><table><thead><tr>'+hd.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+
        bd.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;}
    if(/^\s*>/.test(l)){let b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++;}
      o.push('<blockquote>'+mdToHtml(b.join('\n'))+'</blockquote>');continue;}
    if(/^\s*(-|\*|\d+\.)\s+/.test(l)){
      const ord=/^\s*\d+\./.test(l);let items=[];
      while(i<L.length&&/^\s*(-|\*|\d+\.)\s+/.test(L[i])){items.push(L[i].replace(/^\s*(-|\*|\d+\.)\s+/,''));i++;}
      o.push(`<${ord?'ol':'ul'}>`+items.map(x=>'<li>'+inl(x)+'</li>').join('')+`</${ord?'ol':'ul'}>`);continue;}
    if(/^\s*---+\s*$/.test(l)){o.push('<hr>');i++;continue;}
    if(!l.trim()){i++;continue;}
    let p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\s*\||\s*>|\s*(-|\*|\d+\.)\s|```|\s*---+\s*$|<a id=)/.test(L[i])){p.push(L[i]);i++;}
    o.push('<p>'+inl(p.join(' '))+'</p>');
  }
  return o.join('\n');
}

/* ============ تقسيم الوثيقة إلى أقسام ============ */
const RAW=document.getElementById('doc-src').textContent;
function buildSections(md){
  const lines=md.split('\n');let secs=[],cur=null,pendingId=null;
  for(let i=0;i<lines.length;i++){
    const a=lines[i].match(/^<a id="([^"]+)"><\/a>/);
    if(a){pendingId=a[1];continue;}
    const h=lines[i].match(/^##\s+(?!#)(.*)$/);
    if(h){if(cur)secs.push(cur);
      cur={id:pendingId||('s'+secs.length),title:h[1].trim(),body:[],subs:[]};pendingId=null;continue;}
    if(cur){
      const s3=lines[i].match(/^###\s+(?!#)(.*)$/);
      if(s3)cur.subs.push(s3[1].trim());
      cur.body.push(lines[i]);
    }
  }
  if(cur)secs.push(cur);
  return secs;
}

function vSearch(term){
  const t=term.trim();if(t.length<2){view.innerHTML='<p class="empty">اكتب كلمتين على الأقل.</p>';return;}
  const res=[];
  SECS.forEach(s=>{
    if(s.title.includes(t)) res.push({id:s.id,title:s.title,snip:'— عنوان القسم —',hit:1});
    s.subs.forEach(x=>{if(x.includes(t)&&res.length<60)res.push({id:s.id,title:s.title,snip:'قسم فرعي: '+x,hit:1});});
    const body=s.body.join('\n');let k=0,p=0;
    while((p=body.indexOf(t,p))>-1&&k<3){
      res.push({id:s.id,title:s.title,snip:body.slice(Math.max(0,p-70),p+90)});k++;p+=t.length;}
  });
  res.sort((x,y)=>(y.hit||0)-(x.hit||0));
  const bq=QB.filter(q=>q.q.includes(t)||q.e.includes(t)).slice(0,8);
  const bb=BOOKS.filter(b=>b.t.includes(t)||b.au.includes(t)||b.ideas.some(x=>x.includes(t)));
  view.innerHTML=`<h2 class="sec-h">نتائج البحث عن «${esc(t)}»</h2>
   ${res.length?`<h3 class="rs">في الدليل (${res.length})</h3>`+res.slice(0,30).map(r=>`<a class="hit" href="#/doc/${r.id}?q=${encodeURIComponent(t)}"><b>${r.title}</b><p>…${esc(r.snip).replace(new RegExp(t,'g'),'<mark>'+t+'</mark>')}…</p></a>`).join(''):''}

const CALCS=[
{id:'ohm',t:'قانون أوم والقدرة',d:'أدخل قيمتين واترك الباقي فارغًا.',
 f:[['V','الجهد (فولت)'],['I','التيار (أمبير)'],['R','المقاومة (أوم)']],
 run:v=>{let{V,I,R}=v;
   if(V&&I){R=V/I;}else if(V&&R){I=V/R;}else if(I&&R){V=I*R;}else return null;
   return [['الجهد',V.toFixed(2)+' فولت'],['التيار',I.toFixed(3)+' أمبير'],['المقاومة',R.toFixed(2)+' أوم'],['القدرة',(V*I).toFixed(1)+' وات']];}},
{id:'heat',t:'عنصر التسخين',d:'أدخل القدرة لتعرف المقاومة المتوقعة عند القياس.',
 f:[['P','القدرة (وات)'],['V','الجهد (افتراضي 220)']],
 run:v=>{const V=v.V||220,P=v.P;if(!P)return null;
   return [['المقاومة المتوقعة',(V*V/P).toFixed(1)+' أوم'],['التيار',(P/V).toFixed(2)+' أمبير'],
   ['ملاحظة','قراءة OL = العنصر مقطوع. اختبر العزل للجسم أيضًا: يجب OL']];}},
{id:'cap',t:'⚠️ تفريغ المكثف بأمان',d:'الطاقة المخزنة وزمن التفريغ وقدرة المقاومة المطلوبة.',
 f:[['C','السعة (ميكروفاراد)'],['V','الجهد على المكثف (فولت)'],['R','مقاومة التفريغ (أوم، مثال 10000)']],
 run:v=>{if(!v.C||!v.V)return null;
   const C=v.C*1e-6,E=0.5*C*v.V*v.V,r=[['الطاقة المخزنة',E<1?(E*1000).toFixed(0)+' مللي جول':E.toFixed(2)+' جول'],
   ['الخطورة',(E>=10||(v.V>=1000&&E>=0.5))?'🚨 قاتلة محتملة — لا تقترب بلا تفريغ وقياس':(E>=1||v.V>=400)?'⚠️ خطرة — صدمة قوية وحروق':v.V>50?'⚠️ صدمة مؤلمة':'منخفضة — لكن افرّغ دائمًا']];
   if(v.R){const tau=v.R*C,Ipk=v.V/v.R,Ppk=v.V*v.V/v.R;
     r.push(['ثابت الزمن τ = RC',tau<1?(tau*1000).toFixed(0)+' مللي ثانية':tau.toFixed(2)+' ثانية'],
     ['زمن الوصول لأقل من 1% (5τ)',(5*tau)<1?(5*tau*1000).toFixed(0)+' مللي ثانية':(5*tau).toFixed(1)+' ثانية'],
     ['الجهد المتبقي بعد 5τ',(v.V*Math.exp(-5)).toFixed(1)+' فولت'],
     ['تيار التفريغ اللحظي',Ipk<1?(Ipk*1000).toFixed(0)+' مللي أمبير':Ipk.toFixed(2)+' أمبير'],
     ['القدرة اللحظية على المقاومة',Ppk.toFixed(1)+' وات — اختر مقاومة 5 وات على الأقل ولا تُبقِها لأكثر من 5τ']);}
   r.push(['إلزامي','قِس الجهد بالأفوميتر بعد التفريغ — لا تفترض']);
   return r;}},
{id:'vd',t:'سقوط الجهد ومقطع الكابل',d:'نحاس، دائرة أحادي الطور.',
 f:[['I','التيار (أمبير)'],['L','طول الكابل (متر)'],['A','المقطع (مم²)'],['V','الجهد (افتراضي 220)']],
 run:v=>{const V=v.V||220;if(!v.I||!v.L||!v.A)return null;
   const vd=(2*v.L*v.I*0.0175)/v.A, pc=vd/V*100;
   const need=(2*v.L*v.I*0.0175)/(V*0.05);
   return [['سقوط الجهد',vd.toFixed(2)+' فولت'],['النسبة',pc.toFixed(2)+'%'],
   ['الحكم',pc<=3?'✓ مقبول للإنارة والقوة':pc<=5?'✓ مقبول للقوة فقط (يتجاوز 3% للإنارة)':'✗ غير مقبول — كبّر المقطع'],
   ['أقل مقطع لحد 5%',need.toFixed(2)+' مم² (اختر المقاس القياسي الأعلى)']];}},
{id:'kwh',t:'الاستهلاك والتكلفة',d:'لتشخيص فاتورة مرتفعة أو مقارنة أجهزة.',
 f:[['P','القدرة (وات)'],['H','ساعات يوميًا'],['D','عدد الأيام (افتراضي 30)'],['C','سعر الكيلو وات ساعة']],
 run:v=>{const D=v.D||30;if(!v.P||!v.H)return null;
   const k=v.P*v.H*D/1000;
   const r=[['الاستهلاك',k.toFixed(1)+' كيلو وات ساعة'],['التيار المسحوب',(v.P/220).toFixed(2)+' أمبير']];
   if(v.C)r.push(['التكلفة',(k*v.C).toFixed(2)]);
   return r;}},
{id:'rpm',t:'سرعة الموتور',d:'لأنظمة الإنفرتر وموتورات الحث.',
 f:[['F','التردد (هرتز)'],['P','عدد الأقطاب (2, 4, 6…)']],
 run:v=>{if(!v.F||!v.P)return null;
   const s=120*v.F/v.P;
   return [['السرعة التزامنية',Math.round(s)+' لفة/دقيقة'],['السرعة الفعلية تقريبًا (انزلاق 4%)',Math.round(s*0.96)+' لفة/دقيقة']];}},
{id:'btu',t:'سعة المكيف المطلوبة',d:'تقدير أولي — يزداد مع الشمس وعدد الأشخاص.',
 f:[['A','مساحة الغرفة (م²)'],['S','عوامل إضافية: 0 عادي، 1 شمس قوية أو ازدحام']],
 run:v=>{if(!v.A)return null;
   const b=v.A*600*(v.S?1.25:1);
   return [['السعة المطلوبة',Math.round(b/1000)*1000+' BTU/hr'],['بالطن التبريدي',(b/12000).toFixed(2)+' طن'],
   ['الأقرب تجاريًا (السوق المصري)',b<=9000?'1 حصان (9000 BTU)':b<=12000?'1.5 حصان (12000 BTU)':b<=18000?'2.25 حصان (18000 BTU)':b<=24000?'3 حصان (24000 BTU)':b<=30000?'4 حصان (30000 BTU)':'5 حصان (36000 BTU) أو أكثر'],
   ['تنبيه','اختر برقم BTU على اللوحة لا بكلمة «حصان»']];}},
{id:'conv',t:'تحويل الوحدات',d:'أدخل قيمة في أي حقل.',
 f:[['HP','حصان ميكانيكي'],['BTU','BTU/hr'],['F','فهرنهايت'],['PSI','PSI'],['AWG','AWG']],
 run:v=>{const r=[];
   if(v.HP)r.push(['حصان → وات',(v.HP*746).toFixed(0)+' وات']);
   if(v.BTU)r.push(['BTU/hr → وات',(v.BTU*0.293).toFixed(0)+' وات'],['BTU/hr → طن تبريد',(v.BTU/12000).toFixed(2)]);
   if(v.F!==undefined&&v.F!=='')r.push(['فهرنهايت → مئوية',((v.F-32)*5/9).toFixed(1)+' درجة مئوية']);
   if(v.PSI)r.push(['PSI → بار',(v.PSI*0.0689).toFixed(3)+' بار']);
   if(v.AWG){const mm=Math.PI*Math.pow(0.127*Math.pow(92,(36-v.AWG)/39),2)/4;r.push(['AWG → مم²',mm.toFixed(2)+' مم²']);}
   return r.length?r:null;}}
];

  <p class="lead">ثماني حاسبات مبنية على صيغ الدليل. النتائج إرشادية — القيمة المعتمدة دائمًا في وثائق الصانع وكود بلدك.</p>
  <div class="calcs">${CALCS.map(c=>`<div class="calc" data-c="${c.id}">

    <button class="btn primary go">احسب</button>
    <div class="calc-r" hidden></div></div>`).join('')}</div>`;

let FC=null;
function vCards(cat){
  const pool=(cat&&cat!=='all'?QB.filter(q=>q.c==+cat):[...QB]).sort(()=>Math.random()-.5);
  if(!cat){
    view.innerHTML=`<h2 class="sec-h">البطاقات السريعة</h2>
    <p class="lead">مراجعة سريعة بلا خيارات: اقرأ السؤال، استحضر الإجابة، ثم اكشفها. الأنسب قبل الامتحان أو قبل زيارة ميدانية.</p>
    <div class="cards">${Object.entries(CATS).map(([k,v])=>`<a class="card" href="#/cards/${k}"><h3>${v}</h3><p>${QB.filter(q=>q.c==+k).length} بطاقة</p></a>`).join('')}
    <a class="card" href="#/cards/all"><h3>الكل مختلطًا</h3><p>${QB.length} بطاقة</p></a></div>`;return;
  }

function drawCard(){
  const q=FC.pool[FC.n];
  view.innerHTML=`<div class="fc-wrap">
    <a class="back" href="#/cards">→ كل المجموعات</a>
    <div class="fc-bar"><i style="width:${(FC.n+1)/FC.pool.length*100}%"></i></div>
    <div class="fc-n">${FC.n+1} / ${FC.pool.length} · ${CATS[q.c]}</div>
    <div class="fc"><p class="fc-q">${q.q}</p>
      <div class="fc-a" hidden><b>${q.o[q.a]}</b><p>${q.e}</p><span class="q-ref">${q.r||''}</span></div>
      <button class="btn primary" id="rev">اكشف الإجابة</button></div>
    <div class="fc-nav"><button class="btn" id="pv" ${FC.n===0?'disabled':''}>السابقة</button>
    <button class="btn" id="nx">${FC.n===FC.pool.length-1?'إعادة من البداية':'التالية'}</button></div>
    <p class="kbd">اختصارات: مسافة = كشف · ← → = تنقل</p></div>`;
  const rev=()=>{view.querySelector('.fc-a').hidden=false;view.querySelector('#rev').style.display='none';};
  $('#rev').onclick=rev;
  $('#nx').onclick=()=>{FC.n=FC.n===FC.pool.length-1?0:FC.n+1;drawCard();};
  $('#pv').onclick=()=>{if(FC.n>0){FC.n--;drawCard();}};
  window.__fc={rev,next:()=>$('#nx').click(),prev:()=>$('#pv').click()};
  window.scrollTo(0,0);
}

function vSaved(){
  const bm=[...ST.bmk].map(id=>SECS.find(s=>s.id===id)).filter(Boolean);
  const wrong=QB.filter(q=>q.i in ST.answered&&!ST.answered[q.i]);
  const ans=Object.keys(ST.answered).length,ok=Object.values(ST.answered).filter(Boolean).length;
  const byCat=Object.entries(CATS).map(([k,v])=>{
    const t=QB.filter(q=>q.c==+k),d=t.filter(q=>q.i in ST.answered),g=d.filter(q=>ST.answered[q.i]);
    return {v,n:t.length,d:d.length,g:g.length};});
  view.innerHTML=`<h2 class="sec-h">تقدمي</h2>
   <div class="meta">${[['أقسام قرأتها',ST.read.size+' / '+SECS.length],['أسئلة أجبتها',ans+' / '+QB.length],['نسبة الصواب',ans?Math.round(ok/ans*100)+'%':'—'],['فصول محفوظة',bm.length]].map(([k,v])=>`<div><i>${k}</i><b>${v}</b></div>`).join('')}</div>
   <h3 class="rs">الأداء حسب المجال</h3>
   <div class="perf">${byCat.map(c=>`<div class="pf"><span>${c.v}</span>
     <div class="bar"><i style="width:${c.d?c.g/c.d*100:0}%"></i></div>

   ${wrong.length?`<h3 class="rs">أسئلة أخطأت فيها (${wrong.length})</h3>
     <a class="btn primary" href="#/retry">راجعها الآن</a>`:'<p class="empty">لا أخطاء مسجلة بعد.</p>'}
   ${bm.length?`<h3 class="rs">فصول حفظتها</h3><div class="chips">${bm.map(s=>`<a class="chip" href="#/doc/${s.id}">${s.title}</a>`).join('')}</div>`:''}
   <h3 class="rs">إدارة البيانات</h3>
   <div class="hero-cta"><button class="btn" id="exp">تصدير تقدمي (JSON)</button><button class="btn" id="clr">مسح كل التقدم</button></div>`;
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({read:[...ST.read],answered:ST.answered,bmk:[...ST.bmk],date:new Date().toISOString()},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='تقدمي-مرجع-الصيانة.json';a.click();};
  $('#clr').onclick=()=>{if(confirm('سيُمسح كل تقدمك. متأكد؟')){ST.read.clear();ST.answered={};ST.bmk.clear();store.save();updReadout();buildNav('');vSaved();}};
  window.scrollTo(0,0);

function vRetry(){
  const wrong=QB.filter(q=>q.i in ST.answered&&!ST.answered[q.i]);
  if(!wrong.length){view.innerHTML='<p class="empty">لا أسئلة خاطئة للمراجعة.</p>';return;}
  wrong.forEach(q=>delete ST.answered[q.i]);store.save();updReadout();
  view.innerHTML=`<div class="doc"><a class="back" href="#/saved">→ تقدمي</a>
    <h2 class="doc-h">مراجعة الأخطاء</h2>
    <p class="lead">${wrong.length} سؤالًا أخطأت فيها سابقًا. أجب مرة أخرى.</p>
    ${wrong.map(q=>qCard(q)).join('')}</div>`;
  bindQ();window.scrollTo(0,0);
}

/* ============ الامتحان المؤقت ============ */
let EX=null;
function vExam(go){
  if(!go){
    view.innerHTML=`<h2 class="sec-h">امتحان محاكاة</h2>
    <p class="lead">30 سؤالًا عشوائيًا من كل المجالات، 20 دقيقة، النتيجة في النهاية بلا كشف فوري. النجاح 70%.</p>
    <div class="hero-cta"><a class="btn primary" href="#/exam/go">ابدأ الامتحان</a></div>`;return;}
  const pool=[...QB].sort(()=>Math.random()-.5).slice(0,30);
  EX={pool,ans:{},end:Date.now()+20*60*1000};
  view.innerHTML=`<div class="doc"><div class="exam-top"><span id="clock" class="clock">20:00</span>
    <button class="btn primary" id="submit">تسليم</button></div>
    <h2 class="doc-h">امتحان محاكاة — 30 سؤالًا</h2>
    ${pool.map((q,n)=>`<div class="q ex" data-x="${n}"><p class="q-t"><span class="qn">${n+1}</span> ${q.q}</p>
      <div class="q-o">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div></div>`).join('')}
    <button class="btn primary wide" id="submit2">تسليم الامتحان</button></div>`;
  view.querySelectorAll('.q.ex').forEach(el=>{
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      el.querySelectorAll('.opt').forEach(x=>x.classList.remove('pick'));
      b.classList.add('pick');EX.ans[el.dataset.x]=+b.dataset.j;});
  });
  const tick=setInterval(()=>{
    const L=Math.max(0,EX.end-Date.now());
    const c=$('#clock');if(!c){clearInterval(tick);return;}
    c.textContent=String(Math.floor(L/60000)).padStart(2,'0')+':'+String(Math.floor(L%60000/1000)).padStart(2,'0');
    if(L<120000)c.classList.add('low');
    if(L<=0){clearInterval(tick);finishExam();}
  },500);
  const fin=()=>{clearInterval(tick);finishExam();};
  $('#submit').onclick=fin;$('#submit2').onclick=fin;
  window.scrollTo(0,0);
}
function finishExam(){
  const p=EX.pool;let ok=0;
  p.forEach((q,n)=>{const a=EX.ans[n];if(a===q.a)ok++;if(a!==undefined)ST.answered[q.i]=a===q.a;});
  store.save();updReadout();
  const pct=Math.round(ok/p.length*100);
  const weak={};p.forEach((q,n)=>{if(EX.ans[n]!==q.a)weak[q.c]=(weak[q.c]||0)+1;});
  const worst=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,3);
  view.innerHTML=`<div class="doc"><div class="result ${pct>=70?'pass':'fail'}">
    <b>${pct}%</b><span>${ok} من ${p.length} إجابة صحيحة</span>
    <i>${pct>=90?'ممتاز — مستوى محترف':pct>=70?'ناجح — راجع نقاط الضعف':'يحتاج مراجعة — ابدأ بالمجالات أدناه'}</i></div>
    ${worst.length?`<h3 class="rs">أكثر مجالات أخطائك</h3><div class="chips">${worst.map(([c,n])=>`<a class="chip" href="#/quiz/${c}">${CATS[c]} — ${n} خطأ</a>`).join('')}</div>`:''}
    <h3 class="rs">مراجعة الإجابات</h3>
    ${p.map((q,n)=>{const a=EX.ans[n];const good=a===q.a;
      return `<div class="q done"><p class="q-t"><span class="qn ${good?'g':'b'}">${n+1}</span> ${q.q}</p>
      <div class="q-o">${q.o.map((o,j)=>`<button class="opt${j===q.a?' right':(j===a?' wrong':'')}" disabled>${o}</button>`).join('')}</div>
      <div class="q-e"><p>${q.e}</p><span class="q-ref">${q.r||''}</span></div></div>`;}).join('')}
    <div class="hero-cta"><a class="btn primary" href="#/exam">امتحان جديد</a><a class="btn" href="#/saved">تقدمي</a></div></div>`;
  window.scrollTo(0,0);
}

function openSOS(){
  const el=document.createElement('div');el.className='sos-panel';el.id='sospanel';
  el.innerHTML=`<div class="sos-box" role="dialog" aria-modal="true" aria-label="إجراءات الطوارئ">
    <div class="sos-h"><b>إجراءات الطوارئ الفورية</b><button aria-label="إغلاق">×</button></div>
    ${SOS.map(x=>`<details><summary>${x.t}</summary><ol>${x.s.map(y=>`<li>${y}</li>`).join('')}</ol></details>`).join('')}
    <details><summary>☎ قبل أن تحتاجها</summary><ol>
      <li>اعرف موقع القاطع الرئيسي واكتبه على لافتة</li><li>طفاية CO₂ سارية الصلاحية في متناول اليد</li>
      <li>أرقام الطوارئ ملصقة على الحائط</li><li>لا تعمل على الكهرباء وحدك في المنزل</li></ol></details>
    </div>`;
  document.body.appendChild(el);
  const close=()=>el.remove();
  el.querySelector('button').onclick=close;
  el.onclick=e=>{if(e.target===el)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
}

function flashTerm(t){
  const w=document.createTreeWalker(view,NodeFilter.SHOW_TEXT);const hits=[];let n;
  while(n=w.nextNode())if(n.nodeValue.includes(t))hits.push(n);
  hits.slice(0,20).forEach(node=>{
    const i=node.nodeValue.indexOf(t);if(i<0)return;
    const mid=node.splitText(i);mid.splitText(t.length);
    const m=document.createElement('mark');m.className='flash';
    mid.parentNode.replaceChild(m,mid);m.appendChild(mid);});
  if(hits[0])hits[0].parentElement?.scrollIntoView({block:'center'});
}
/* ============ التوجيه ============ */
function route(){
  const h=location.hash.replace(/^#\//,'')||'home';
  const [a,b]=h.split('/');
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.r===a;t.classList.toggle('on',on);on?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current');});
  if(a==='doc'){const [id,qq]=(b||'').split('?q=');vDoc(id);if(qq)flashTerm(decodeURIComponent(qq));}
  else if(a==='books')vBooks();
  else if(a==='book')vBook(b);
  else if(a==='quiz')vQuiz(b);
  else if(a==='cards')vCards(b);
  else if(a==='exam')vExam(b);
  else if(a==='tools')vTools();
  else if(a==='saved')vSaved();
  else if(a==='help')vHelp();
  else if(a==='retry')vRetry();
  else if(a==='search')vSearch(decodeURIComponent(b||''));
  else vHome();
  document.querySelectorAll('.cpy').forEach(btn=>btn.onclick=()=>{
    const t=btn.nextElementSibling.textContent;
    navigator.clipboard?.writeText(t).then(()=>{btn.textContent='✓ نُسخ';setTimeout(()=>btn.textContent='نسخ',1400);});});
  document.querySelectorAll('.nv').forEach(n=>n.classList.toggle('cur',n.getAttribute('href')==='#/doc/'+b));
  if(window.innerWidth<900)document.body.classList.remove('nav-open');
}
window.addEventListener('hashchange',route);

/* شريط تقدم القراءة وزر العودة لأعلى */
window.addEventListener('scroll',()=>{
  const h=document.documentElement;
  const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100;
  const bar=document.getElementById('rprog');if(bar)bar.style.width=p+'%';
  const top=document.getElementById('totop');if(top)top.classList.toggle('show',h.scrollTop>500);
},{passive:true});

/* اختصارات لوحة المفاتيح */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(e.target.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();document.getElementById('gsearch').focus();return;}
  if(typing)return;
  if(location.hash.startsWith('#/cards/')&&window.__fc){
    if(e.key===' '){e.preventDefault();window.__fc.rev();}
    if(e.key==='ArrowLeft'){window.__fc.next();}
    if(e.key==='ArrowRight'){window.__fc.prev();}
    return;}
  const cur=SECS.findIndex(s=>'#/doc/'+s.id===location.hash);
  if(cur>-1){
    if(e.key==='ArrowLeft'&&SECS[cur+1])location.hash='#/doc/'+SECS[cur+1].id;
    if(e.key==='ArrowRight'&&SECS[cur-1])location.hash='#/doc/'+SECS[cur-1].id;}
});
