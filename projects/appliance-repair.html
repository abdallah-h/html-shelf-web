<a id="ch12"></a>

## الفصل 12: تقنية الإنفرتر و VFD

### 12.1 لماذا الإنفرتر؟

الموتور التقليدي يعمل بسرعة ثابتة: **إما 100% أو 0%**. الثلاجة التقليدية تشتغل بكامل قوتها ثم تفصل ثم تشتغل — إهدار طاقة وتذبذب حرارة وصوت.

الإنفرتر يغيّر **تردد** التيار المغذي للموتور، فيغيّر سرعته باستمرار:

```
سرعة الموتور (لفة/دقيقة) = (120 × التردد) ÷ عدد الأقطاب
```
عند 50 هرتز وموتور بقطبين: 3000 لفة. عند 25 هرتز: 1500 لفة.

**النتيجة:** توفير 30-50% طاقة، ثبات حراري، هدوء، عمر أطول للكمبروسر.

### 12.2 كيف يعمل بورد الإنفرتر

```
220V AC
   ↓
[فلتر EMI] → [قنطرة تقويم] → [مكثف كبير 450V] → 310V DC (حلقة الوصل DC Bus)
   ↓
[6 ترانزستورات IGBT في 3 أزرع] ← يتحكم فيها معالج بإشارات PWM
   ↓
3 مخارج (U, V, W) → موجة شبه جيبية متغيرة التردد والجهد
   ↓
[الموتور BLDC / الحث]
```

**PWM (تعديل عرض النبضة):** المعالج يفتح ويغلق الـIGBT آلاف المرات في الثانية بأزمنة متغيرة، فينتج متوسط جهد يشبه الموجة الجيبية.

**قاعدة V/f:** الجهد يجب أن يتغير مع التردد بنسبة ثابتة للحفاظ على العزم وتفادي إشباع الملفات.

### 12.3 وحدة IPM / IGBT Module

في الأجهزة الحديثة الترانزستورات الستة مدمجة في **وحدة واحدة (IPM = Intelligent Power Module)** بها دوائر حماية داخلية.

**الفحص (على وضع الدايود، والبورد مفصول ومكثفه مفرَّغ):**
```
الطرف الأسود على (−) والأحمر على U ثم V ثم W:
   يجب قراءة 0.3-0.5V في كل حالة (دايودات الجسم)
الطرف الأحمر على (+) والأسود على U ثم V ثم W:
   يجب قراءة 0.3-0.5V أيضًا
قراءة 0 (قصر) في أي منها → الوحدة تالفة ✗
قراءة OL في أي منها → ذراع مفتوح ✗
القراءات يجب أن تكون متقاربة — أي شذوذ يعني تلفًا
```

**⚠️ سبب الاحتراق شبه الدائم:** ارتفاع الحرارة (مروحة/مشتت متسخ)، أو موتور مقصور، أو ارتفاع جهد. **استبدال الوحدة دون معالجة السبب = احتراق البديلة خلال دقائق.**

### 12.4 أعطال أنظمة الإنفرتر

| العَرَض | السبب المحتمل |
|---|---|
| الجهاز يعمل لكن الكمبروسر/الموتور لا يدور | IPM تالف ← دائرة القيادة (Driver) ← الموتور |
| يبدأ الدوران ثم يتوقف فورًا مع كود خطأ | حماية تيار زائد (OC) ← موتور مقصور ← حساس تيار |
| كود خطأ متعلق بحلقة DC | المكثف الكبير جاف ← قنطرة التقويم ← جهد مدخل منخفض |
| يعمل بضعف أو باهتزاز | ملف موتور غير متوازن ← إشارة PWM ناقصة على طور واحد |
| احتراق متكرر بعد الإصلاح | ⭐ لم يُعالج السبب الجذري: تبريد، جهد، أو موتور مسرّب |
| لا يعمل بعد انقطاع كهرباء مفاجئ | حماية داخلية — افصل من البريزة 10 دقائق ثم أعد |

**قياسات مرجعية على بورد إنفرتر سليم:**
- حلقة DC: 300-330 فولت DC (⚠️ خطر مميت).
- تغذية المعالج: 5V أو 3.3V.
- تغذية دوائر القيادة: 15V لكل ذراع.
- خرج U-V-W إلى الموتور: يقرأه الأفوميتر كجهد AC متغير حسب السرعة (قراءة تقريبية فقط).

### 12.5 الفرق بين الإنفرتر الحقيقي والمزيف تسويقيًا

بعض الأجهزة تُسوَّق كـ"إنفرتر" وهي مجرد تحكم بمراحل. العلامة الحقيقية: **الكمبروسر لا يتوقف نهائيًا** بل يبطئ فقط، ويرتفع أمبير التشغيل تدريجيًا لا فجأة.

## الفصل 13: البطاريات وأجهزة الليثيوم

### 13.1 أنواع البطاريات

| النوع | الجهد/خلية | الاستخدام | التحذيرات |
|---|---|---|---|
| **رصاص حمضي (SLA/AGM)** | 2.0V (12V = 6 خلايا) | UPS، إنذار، طاقة شمسية | غاز هيدروجين — تهوية؛ حمض كاوٍ |
| **ليثيوم أيون (Li-ion)** | 3.7V اسمي | لابتوب، موبايل، عدد لاسلكية | ⚠️ خطر حريق/انفجار |
| **ليثيوم بوليمر (LiPo)** | 3.7V | موبايلات، أجهزة نحيفة | ⚠️ ينتفخ عند التلف |
| **ليثيوم فوسفات (LiFePO4)** | 3.2V | طاقة شمسية، عربات | أأمن أنواع الليثيوم، عمر أطول |
| **NiMH** | 1.2V | بطاريات AA قابلة للشحن | آمنة نسبيًا |

### 13.2 قيم الليثيوم التي يجب حفظها (خلية 18650 مثالًا)

```
ممتلئة تمامًا      : 4.20V   (لا تتجاوزها أبدًا)
مريحة للتخزين     : 3.70-3.80V
فارغة (حد الفصل)   : 3.00V
⚠️ منطقة خطر      : أقل من 2.50V — الخلية تتلف
🚫 لا تشحنها      : أقل من 2.00V — قد تشتعل عند الشحن
```

### 13.3 دائرة الحماية BMS

كل حزمة ليثيوم يجب أن تحتوي **BMS (Battery Management System)** يقوم بـ:
- منع الشحن الزائد وتفريغها تحت الحد.
- الحد من التيار ومنع القصر.
- **الموازنة (Balancing)** بين الخلايا — أهم وظيفة.
- الفصل عند الحرارة الزائدة.

**العطل الشائع:** حزمة "ميتة" جهدها صفر على الأطراف — غالبًا الـBMS في وضع الحماية بسبب خلية واحدة هابطة، والحزمة نفسها سليمة. الحل: قياس كل خلية على حدة عبر نقاط الموازنة.

**تشخيص حزمة بطارية:**
```
1. قِس جهد الحزمة الكلي على الأطراف
2. قِس كل خلية على حدة من موصل الموازنة
3. اختلاف أكثر من 0.10V بين الخلايا = عدم توازن
4. خلية أقل من 2.5V = تالفة، استبدلها (وباقي الحزمة قد يكون سليمًا)
5. قارن السعة الفعلية بالمعلنة باختبار تفريغ
```

### 13.4 ⚠️ سلامة الليثيوم — ليست مبالغة

**لا تفعل أبدًا:**
- 🚫 تشحن بطارية **منتفخة** — تخلص منها فورًا وبأمان.
- 🚫 تثقب أو تضغط أو تلحم مباشرة على خلية ليثيوم (استخدم لحام نقطي أو خلايا بألسنة جاهزة).
- 🚫 تترك جهازًا يشحن على السرير أو الأريكة أو بلا مراقبة طوال الليل مع شواحن مجهولة.
- 🚫 تخلط خلايا بأعمار أو سعات مختلفة في حزمة واحدة.
- 🚫 تستخدم شاحنًا غير مخصص للنوع (شاحن رصاص على ليثيوم = حريق).
- 🚫 تُطفئ حريق ليثيوم أيون بكمية ماء قليلة — الماء القليل لا يكفي لإيقاف التفاعل. المطلوب ماء بكميات كبيرة جدًا للتبريد، أو طفاية مخصصة لبطاريات الليثيوم، والأفضل الإخلاء والاتصال بالدفاع المدني. (طفاية Class D مصممة للمعادن القابلة للاشتعال مثل الليثيوم المعدني، لا لبطاريات الليثيوم أيون.)

**علامات خطر:** انتفاخ، سخونة غير طبيعية، رائحة حلوة/كيميائية، تغير لون الغلاف، تفريغ سريع مفاجئ.

**التخزين الآمن:** عند 40-60% شحن، في مكان بارد، وفي كيس مقاوم للحريق (LiPo bag) للحزم الكبيرة.

### 13.5 أعطال دوائر الشحن

| العَرَض | السبب |
|---|---|
| لا يشحن نهائيًا | كابل/منفذ الشحن (⭐ الأشهر — أتربة أو أرجل مكسورة) ← IC الشحن ← BMS في حماية |
| يشحن ببطء شديد | كابل رديء ← شاحن ضعيف ← منفذ متسخ ← بطارية متدهورة |
| يسخن أثناء الشحن | ⚠️ IC شحن تالف ← بطارية متدهورة — أوقف الاستخدام |
| النسبة تقفز أو تهبط فجأة | فقدان معايرة عداد الشحن ← خلية ضعيفة |
| يعمل بالشاحن فقط | البطارية انتهى عمرها |

**تنظيف منفذ الشحن:** افصل الجهاز، استخدم عود أسنان خشبي وكحول أيزوبروبيل. **لا تستخدم دبوسًا معدنيًا.**

## الفصل 14: إنقاذ البوردات المبتلّة ومعالجة التآكل

### 14.1 بروتوكول الطوارئ لجهاز وقع في الماء

**الدقائق الأولى تحدد النتيجة.** الماء نفسه لا يدمر البورد — **التيار المار في الماء** هو الذي يدمره، والتآكل بعدها.

```
[0] افصل الكهرباء / انزع البطارية فورًا — لا تجرب تشغيله "علشان تشوف"
[1] لا تهزّه ولا تنفخ فيه بقوة (تدفع الماء لأماكن أعمق)
[2] فكّه بالكامل بأسرع ما يمكن
[3] اغمر البورد في كحول أيزوبروبيل 99% (يزيح الماء ويجفف)
[4] فرشاة ناعمة + حمام موجات فوق صوتية إن توفر
[5] تجفيف كامل 24-48 ساعة (هواء دافئ ≤ 50°م، لا مجفف شعر ساخن مباشر)
[6] افحص بصريًا بالعدسة قبل التشغيل
[7] شغّل بمصدر جهد محدود التيار وراقب الحرارة
```

**🚫 خرافة الأرز:** الأرز لا يجفف بكفاءة، ويترك غبارًا ونشاءً داخل الموصلات. الكحول أو مجفف الرطوبة (Desiccant) أفضل بمراحل.

**⭐ الأخطر: مياه البحر أو المشروبات السكرية.** الملح والسكر يستمران في التآكل والتوصيل بعد الجفاف. غسل كامل بالكحول إلزامي.

### 14.2 علاج التآكل والصدأ الأخضر

| نوع التآكل | العلاج |
|---|---|
| أخضر/أزرق (أكسيد نحاس) | كحول 99% + فرشاة + فلكس، ثم إعادة تقصير النقاط |
| أبيض متبلور (تسريب مكثف) | يجب استبدال المكثف أولًا، فالسائل قلوي ويستمر في الأكل |
| صدأ بني على الأرجل | فرشاة زجاجية (Fiberglass Pen) ثم إعادة لحام |
| تآكل أكل المسار النحاسي | إصلاح المسار بسلك لف + لحام + طلاء عازل |

**⚠️ التآكل يزحف تحت الـICs** ولا يظهر بالعين. إن استمر العطل بعد التنظيف، ارفع الـIC وافحص تحته.

### 14.3 الطلاء العازل (Conformal Coating)

طبقة شفافة تحمي البورد من الرطوبة والغبار — موجودة أصلًا في بوردات الغسالات والمكيفات الخارجية.

- **قبل اللحام:** يجب كشطه أو إذابته (بعضه يذوب بالكحول، وبعضه يحتاج مذيبًا خاصًا أو حرارة).
- **بعد الإصلاح:** أعد الطلاء — وإلا ستعود الرطوبة. يمكن استخدام ورنيش إلكتروني بخاخ أو طلاء أكريليك مخصص.
- **⚠️ لا تطلِ:** الموصلات، نقاط الاختبار، المشتتات الحرارية، أرجل الريلايات.

### 14.4 الوقاية من الرطوبة أصلًا

- بوردات الوحدات الخارجية للمكيفات: تأكد من إحكام صندوقها وحشواتها المطاطية.
- الغسالات: كثير من الأعطال سببها بخار يتكثف على البورد — تحقق من مسار الهواء والحشوات.
- في المناطق الساحلية: الطلاء العازل + فحص دوري للتآكل ضروريان.

## الفصل 15: الاتصال الرقمي بين البوردات

### 15.1 لماذا يفشل الأفوميتر هنا

في الأجهزة الحديثة، البوردات تتكلم مع بعضها **برسائل رقمية** لا بجهود ثابتة. إشارة تتغير آلاف المرات في الثانية سيقرأها الأفوميتر كمتوسط لا معنى له (مثلًا 2.5V وهي في الحقيقة تتأرجح بين 0 و 5).

> ⭐ **قاعدة:** إذا وجدت قراءة غريبة "بين بين" على سلك بيانات، فأنت بحاجة **أوسيلوسكوب** لا أفوميتر.

### 15.2 البروتوكولات التي ستقابلها

| البروتوكول | الأسلاك | أين تجده |
|---|---|---|
| **UART / Serial** | TX, RX, GND | بين البورد الرئيسي ولوحة العرض |
| **I²C** | SDA, SCL, GND | الحساسات، ذاكرة EEPROM، ساعة RTC |
| **SPI** | MOSI, MISO, SCK, CS | الذاكرات، الشاشات |
| **1-Wire** | سلك واحد + أرضي | بعض حساسات الحرارة |
| **اتصال المكيف الداخلي/الخارجي** | غالبًا سلك واحد فوق خط التغذية | نقل الأوامر وكودات الخطأ |
| **CAN Bus** | CAN-H, CAN-L | الأجهزة الفاخرة والسيارات |

### 15.3 تشخيص خط اتصال معطوب

```
[1] افحص الأسلاك والموصلات أولًا — 70% من أعطال الاتصال سببها موصل مؤكسد أو سلك مقطوع
[2] تحقق من وجود أرضي مشترك بين البوردين (ضروري جدًا لأي اتصال)
[3] قِس مقاومات الرفع (Pull-up) على خطي I2C — عادة 4.7 كيلو أوم إلى التغذية
[4] بالأوسيلوسكوب: يجب رؤية نبضات مربعة نظيفة
    - خط مسطح على 0 أو 5 دائمًا = لا يوجد اتصال
    - نبضات مشوهة/مستديرة = تشويش أو مقاومة رفع خاطئة أو سلك طويل
[5] اعزل الطرفين: افصل أحد البوردين وانظر هل بقيت النبضات
```

### 15.4 حالة عملية: المكيف الإنفرتر

الوحدة الداخلية والخارجية متصلتان بـ3 أو 4 أسلاك: (L، N، أرضي، وسلك اتصال S).

| القياس | الدلالة |
|---|---|
| L-N = 220V AC عند الوحدة الخارجية | التغذية تصل ✓ |
| لا يوجد 220 على الخارجية | ⭐ البورد الداخلي لا يعطي الأمر — ريلاي أو البورد نفسه |
| سلك S يقرأ جهدًا متذبذبًا حوالي 20-60V DC | الاتصال يعمل (قراءة تقريبية فقط) |
| S يقرأ 0 أو جهدًا ثابتًا | انقطاع الاتصال — كود خطأ عادة E1/E5 حسب الماركة |

**⚠️ خطأ التركيب الشائع:** ترتيب الأسلاك بين الوحدتين مختلف عن المصنع، أو الأرضي غير موصول — يسبب أكواد اتصال متكررة وتشويشًا.

### 15.5 ذاكرة EEPROM وبيانات الجهاز

كثير من الأجهزة تخزن الإعدادات وسجل الأعطال في EEPROM صغيرة (24C02/24C16).
- **عند استبدال بورد رئيسي:** بعض الماركات تتطلب نقل الـEEPROM من البورد القديم أو برمجة البورد الجديد بموديل الجهاز.
- **الأعطال التي تشبه تلف البورد وهي فساد بيانات:** الجهاز يعمل عشوائيًا، أو يعرض كودًا لا معنى له، أو ينسى الإعدادات. الحل: إعادة ضبط المصنع، وإن فشلت فبرمجة EEPROM بملف صحيح.

## الفصل 16: الأوسيلوسكوب عمليًا

### 16.1 متى تحتاجه فعلًا

الأفوميتر يخبرك **بوجود** الجهد. الأوسيلوسكوب يخبرك **بشكله وترددها ونظافته**. تحتاجه في:
- أعطال مصادر الطاقة المتقطعة (تموّج زائد Ripple).
- خطوط الاتصال الرقمي.
- إشارة التاكو والـPWM.
- البلورة والنبضة الزمنية.
- إشارات الحساسات النبضية.

### 16.2 الإعداد الآمن

```
⚠️ قبل أي قياس على الجانب الساخن (المتصل بـ220):
   استخدم محول عزل (Isolation Transformer) على الجهاز تحت الفحص
   بدونه: أرضي الأوسيلوسكوب متصل بأرضي المبنى → قصر وشرارة وتلف
⚠️ استخدم بروب على وضع 10x لقياس الجهود العالية
⚠️ لا توصّل مشبك الأرضي إلا بنقطة أرضي حقيقية للدائرة
```

### 16.3 أشكال الموجات المتوقعة

| النقطة | الشكل المتوقع | ما يعنيه الشذوذ |
|---|---|---|
| مدخل 220V AC | موجة جيبية 50Hz | تشوه = مشكلة في الشبكة |
| بعد قنطرة التقويم مباشرة | نبضات كاملة الموجة 100Hz | نصف موجة فقط = دايود تالف |
| على المكثف الرئيسي | خط شبه مستقيم عند 310V | تموّج كبير (> 10V) = المكثف جاف |
| Gate الموسفت في SMPS | نبضات مربعة 20-100 kHz | لا نبضات = المتحكم لا يعمل |
| Drain الموسفت | نبضات مع قمة رنين | قمة عالية جدًا = دائرة Snubber تالفة |
| خرج 12V/5V | خط مستقيم | تموّج > 100 مللي فولت = مكثف خرج تالف |
| البلورة | موجة جيبية بتردد المتحكم | خط مسطح = المتحكم ميت أو البلورة تالفة |
| إشارة التاكو (غسالة) | موجة جيبية يزيد ترددها مع السرعة | لا إشارة = التاكو تالف |
| PWM لموتور أو سخان | مربعات متغيرة العرض | ثابتة = التحكم لا يعمل |

### 16.4 قياس التموّج (Ripple) — أهم قياس عملي

```
اضبط الأوسيلوسكوب على AC Coupling
ضع البروب على خرج التغذية (مثلًا 12V)
اقرأ Vpp (الجهد من القمة للقاع)

مقبول:  < 50-100 mVpp على خطوط 5V و 3.3V
مقبول:  < 150 mVpp على خط 12V
⚠️ أكثر من 500 mVpp = مكثف تالف حتمًا، وهذا يسبب:
   - أعطال عشوائية وإعادة تشغيل
   - خطوط على الشاشة
   - أوامر خاطئة من المتحكم
```

**⭐ هذا العطل تحديدًا هو الذي يجعل جهازًا "يعمل أحيانًا" ويحيّر الفنيين** — والأفوميتر يقرأ 12.0V سليمة تمامًا.

### 16.5 اختيار أوسيلوسكوب

| المستوى | المواصفة | كافٍ لـ |
|---|---|---|
| مبتدئ | جهاز جيب 20 MHz قناة واحدة | SMPS، PWM، تموّج |
| متوسط | 100 MHz قناتان | الاتصال الرقمي، معظم الصيانة |
| متقدم | 200 MHz+ 4 قنوات مع فك ترميز البروتوكولات | تحليل I2C/SPI/UART |

## الفصل 17: اختبار العزل والتأريض احترافيًا

### 17.1 لماذا الأفوميتر لا يكفي

الأفوميتر يختبر بجهد 3-9 فولت. العزل قد يكون سليمًا عند 9 فولت وينهار تمامًا عند 220 أو 500 فولت. لهذا يوجد **جهاز الميجر (Insulation Tester / Megger)**.

### 17.2 اختبار مقاومة العزل بالميجر

```
الجهد المستخدم: 500V DC للأجهزة المنزلية (250V للدوائر الحساسة)

الخطوات:
1. افصل الجهاز تمامًا عن الكهرباء
2. ⚠️ افصل أو تجاوز أي إلكترونيات حساسة (بوردات، مكثفات X/Y)
   — 500 فولت سيدمرها
3. اقصر الحي والمتعادل معًا
4. ضع طرف الميجر عليهما والطرف الآخر على الأرضي/الجسم
5. اضغط الاختبار لمدة دقيقة واقرأ

القراءة:
   > 100 ميجا أوم  → ممتاز
   1 - 100 ميجا أوم → مقبول
   0.5 - 1 ميجا أوم → مشبوه، راقبه
   < 0.5 ميجا أوم  → ✗ فاشل، الجهاز غير آمن
```

**معايير شائعة:** الحد الأدنى للتركيبات الجديدة عادة 1 ميجا أوم، ويفضّل أكثر من 2.

### 17.3 اختبار استمرارية موصل الأرضي (Earth Bond)

يتحقق أن كل جزء معدني في الجهاز موصول فعلًا بطرف الأرضي:
```
قِس بين طرف الأرضي في الفيشة وأي جزء معدني مكشوف
يجب أن تقرأ أقل من 0.1 أوم
قراءة أعلى = الأرضي غير فعال ✗
```

### 17.4 اختبار مقاومة قطب التأريض

يقاس بجهاز Earth Resistance Tester بطريقة الثلاث نقاط.
```
منزلي:            < 5 أوم   (المثالي < 1)
تركيبات حساسة:    < 1 أوم
> 10 أوم:         التأريض غير فعال — يحتاج معالجة (إضافة أقطاب، تحسين التربة)
```

### 17.5 اختبار القاطع التفاضلي (RCD Tester)

جهاز مخصص يحقن تيار تسريب معلومًا ويقيس زمن الفصل:
```
عند 30 مللي أمبير:  يجب أن يفصل خلال < 300 مللي ثانية
عند 150 مللي أمبير: يجب أن يفصل خلال < 40 مللي ثانية
عند 15 مللي أمبير:  يجب ألا يفصل (وإلا فهو حساس زيادة ويسبب فصلًا مزعجًا)
```

### 17.6 قائمة اختبار السلامة قبل تسليم أي جهاز مُصلَح

```
□ اختبار استمرارية الأرضي        < 0.1 Ω
□ اختبار مقاومة العزل بـ500V     > 1 MΩ
□ فحص بصري: لا أسلاك مكشوفة، لا حواف حادة على الأسلاك
□ كل الأسلاك مثبتة بمشابك ولا تلامس أجزاء ساخنة أو متحركة
□ الغطاء مغلق وكل البراغي في مكانها
□ اختبار وظيفي كامل تحت الحمل مع مراقبة الحرارة 15 دقيقة
□ قياس التيار المسحوب ومقارنته باللوحة
□ لا رائحة، لا صوت غير طبيعي، لا سخونة موضعية
```

## الفصل 18: أجهزة إضافية

### 18.1 طلمبة المياه ونظام العوامة

**المكونات:** موتور حث + مكثف + عوامة كهربائية (Float Switch) + مفتاح ضغط (Pressure Switch) في أنظمة الضغط + مفتاح حماية الجفاف.

| العطل | السبب |
|---|---|
| لا تعمل نهائيًا | ⭐ العوامة (أشهر عطل — نقاطها تتآكل) ← المكثف ← الملف |
| تطنّ ولا تدور | المكثف ← الطلمبة عالقة بالصدأ (أدر المروحة الخلفية بمفك) |
| تعمل ولا ترفع ماء | فقدت التشريب (Priming) ← صمام عدم رجوع ← دفّاعة (Impeller) مكسورة ← تسريب هواء في السحب |
| تشتغل وتقف باستمرار | ⭐ **تسريب في الشبكة** أو خزان الضغط فقد الهواء ← مفتاح ضغط سيئ الضبط |
| تفصل القاطع | تسريب في الملف بسبب الرطوبة — شائع جدًا في الطلمبات المكشوفة |

**⚠️ الحماية من الدوران الجاف:** الطلمبة التي تعمل بلا ماء تحترق خلال دقائق. تأكد من عمل حساس الجفاف.

### 18.2 كولدير المياه (المبرد/السخان)

- **قسم التبريد:** إما كمبروسر صغير (مثل الثلاجة) أو **خلية بلتيير (Peltier)** كهروحرارية.
- **قسم التسخين:** عنصر + ثيرموستات + فيوز حراري.
- **الأعطال:** لا يبرد (غاز/كمبروسر/بلتيير)، لا يسخن (⭐ الفيوز الحراري غالبًا)، تسريب من الخزان أو الصنبور.
- **الصيانة:** تعقيم الخزان كل 3-6 أشهر؛ إهماله مشكلة صحية لا فنية.

### 18.3 ماكينة القهوة الإسبريسو

**المكونات:** مضخة اهتزازية (Vibration Pump) + غلاية/ثيرموبلوك + ثيرموستات + صمام ثلاثي + فيوز حراري + بورد تحكم.

| العطل | السبب |
|---|---|
| ⭐ لا يخرج ماء / ضغط ضعيف | **الترسبات الجيرية** — السبب رقم 1 بفارق كبير |
| صوت المضخة عالٍ بلا ماء | هواء محبوس — شغّل البخار لتفريغه ← فلتر مسدود |
| لا تسخن | الفيوز الحراري ← الثيرموستات ← الثيرموبلوك |
| تسريب من الأسفل | الصمام الثلاثي ← جلد الفلتر ← وصلات داخلية |

**الصيانة الوقائية:** إزالة الترسبات (Descaling) كل 1-3 أشهر حسب عسر الماء. هذا يمنع 80% من أعطالها.

### 18.4 القلاية الهوائية والأجهزة الحرارية الذكية

- عنصر تسخين + مروحة قوية + حساس NTC + بورد + **مفتاح أمان في الدرج**.
- **الأعطال:** لا تعمل عند إغلاق الدرج (⭐ مفتاح الأمان الصغير — أشهر عطل)، لا تسخن (عنصر/فيوز حراري)، مروحة ضعيفة (بيرنج أو أتربة دهنية).
- **الصيانة:** تنظيف مجرى الهواء من الدهون — تراكمها يسبب سخونة زائدة ثم انصهار الفيوز الحراري.

### 18.5 ماكينة الخياطة

- موتور يونيفرسال + دواسة تحكم (Rheostat أو إلكترونية) + إضاءة + في الحديثة: موتور خطوي وبورد.
- **الأعطال:** الدواسة (⭐ الأكثر تلفًا)، سير الموتور، الفحمات، تراكم الوبر والزيت في الآلية.

### 18.6 موتور البوابة والباب الأوتوماتيكي

**المكونات:** موتور + جيربوكس + بورد تحكم + مفاتيح حد (Limit Switches) + حساس أشعة أمان (Photocell) + ريسيفر ريموت + بطارية احتياطية.

| العطل | السبب |
|---|---|
| ⭐ يفتح ولا يغلق | **حساس الأشعة (Photocell)** — متسخ أو غير محاذٍ أو معطّل |
| لا يستجيب للريموت | بطارية الريموت ← فقدان البرمجة ← هوائي الريسيفر |
| يتوقف في المنتصف | مفتاح الحد ← عائق ميكانيكي ← ضبط حساسية العزم |
| يتحرك بضعف أو يهتز | المكثف ← الجيربوكس ← الجهد منخفض |
| صوت طقطقة بلا حركة | مكثف تالف ← الموتور عالق |

**⚠️ سلامة:** ضبط حساسية العزم إلزامي — البوابات الأوتوماتيكية سببت وفيات أطفال. اختبر أنها ترتد عند مقاومة بسيطة.

### 18.7 الميكروويف — إعادة تأكيد

راجع القسم 5.8. **لا يُفتح لغير المتخصص المدرَّب على تفريغ المكثف عالي الجهد.**

## الفصل 19: الأنظمة الشمسية والمولدات

### 19.1 مكونات النظام الشمسي

```
[الألواح الشمسية] ── DC متغير حسب الشمس
        ↓
[منظم الشحن Charge Controller: PWM أو MPPT]
        ↓
[بنك البطاريات]
        ↓
[الإنفرتر] ── يحول DC إلى 220V AC
        ↓
[لوحة التوزيع] ── الأحمال
```

### 19.2 PWM مقابل MPPT

| | PWM | MPPT |
|---|---|---|
| المبدأ | يوصل اللوح بالبطارية مباشرة تقريبًا | يتتبع نقطة القدرة العظمى ويحوّل الجهد |
| الكفاءة | 70-80% | 93-98% |
| جهد اللوح | يجب أن يقارب جهد البطارية | يقبل جهدًا أعلى بكثير |
| السعر | رخيص | أغلى |
| المناسب | أنظمة صغيرة بسيطة | أي نظام جدي |

### 19.3 أنواع الإنفرتر — فرق يهم أجهزتك

| النوع | شكل الموجة | مناسب لـ |
|---|---|---|
| **موجة مربعة** | مربعة | لمبات فقط — لا يُستخدم اليوم |
| **شبه جيبية (Modified Sine)** | مدرجة | أحمال مقاومة بسيطة |
| **جيبية نقية (Pure Sine)** | جيبية نظيفة | ⭐ **إلزامي** للثلاجات، المكيفات، الموتورات، الأجهزة الطبية، الأجهزة الحساسة |

> ⚠️ **الموجة شبه الجيبية تُتلف الموتورات والأجهزة الإلكترونية على المدى الطويل** — تسبب سخونة وطنينًا وأعطال بوردات. لا توفّر فيها.

### 19.4 حسابات سريعة

```
حجم البنك (أمبير-ساعة) = (الاستهلاك اليومي بالوات-ساعة × أيام الاستقلالية)
                          ÷ (جهد البنك × عمق التفريغ × كفاءة الإنفرتر)

مثال: 2000 وات-ساعة يوميًا، بنك 24V، عمق تفريغ 50% (رصاص)، كفاءة 0.85
     = 2000 ÷ (24 × 0.5 × 0.85) ≈ 196 أمبير-ساعة

قدرة الألواح ≈ الاستهلاك اليومي ÷ ساعات الذروة الشمسية (4-5 ساعات عادة)
     = 2000 ÷ 4.5 ≈ 450 وات (أضف 25% احتياطي → 550-600 وات)
```

### 19.5 أعطال شائعة

| العطل | السبب |
|---|---|
| النظام لا ينتج شيئًا | قاطع DC ← فيوز الألواح ← دايود الحماية ← وصلة MC4 محترقة |
| إنتاج أقل من المتوقع | ⭐ **ألواح متسخة أو مظللة جزئيًا** ← زاوية خاطئة ← لوح واحد ضعيف يخفض السلسلة كلها |
| الإنفرتر يفصل تحت الحمل | بطاريات ضعيفة ← كابل رفيع (سقوط جهد) ← حمل أعلى من القدرة |
| البطاريات تنفد سريعًا | انتهاء العمر ← منظم شحن غير مضبوط ← عدم توازن الخلايا |
| صوت طنين من الأجهزة | ⭐ إنفرتر شبه جيبي — استبدله بجيبي نقي |

**⚠️ سلامة DC:** التيار المستمر لا ينطفئ قوسه الكهربائي تلقائيًا كالمتردد — قوس DC خطر حريق حقيقي. استخدم قواطع ووصلات مصنّفة DC فقط، وشدّ الوصلات جيدًا.

### 19.6 المولدات (Generators) و ATS

- **مفتاح التحويل الأوتوماتيكي (ATS):** يفصل المنزل عن الشبكة قبل توصيل المولد.
- ⚠️ **الأهم على الإطلاق:** يجب أن يكون التحويل **متبادل الإقفال (Interlocked)** — توصيل المولد بينما الشبكة موصولة يرسل 220 فولت إلى الشارع وقد **يقتل عمال الصيانة**. هذا ليس تحذيرًا نظريًا.
- **تأريض المولد إلزامي.**
- ⚠️ **لا تشغّل مولدًا داخل مكان مغلق أو جراج أو قرب نافذة** — أول أكسيد الكربون قاتل وبلا رائحة.
- **الصيانة:** تشغيل تجريبي شهري تحت حمل، تغيير الزيت، فحص شمعة الإشعال والفلتر، تفريغ الوقود القديم.

## الفصل 20: اختيار البدائل وكشف القطع المقلدة

### 20.1 قواعد استبدال المكونات

| المكون | ما يجب أن يتطابق | ما يجوز أن يزيد | ما يجب ألا يقل |
|---|---|---|---|
| مقاومة | القيمة (Ω) | الوات | الوات |
| مكثف | السعة (±10%) | الجهد، الحرارة (105°) | الجهد |
| دايود | النوع (سريع/شوتكي/عادي) | التيار، الجهد العكسي | كلاهما |
| ترانزستور/موسفت | التخطيط والقطبية | Vds، Id | Vds، Id، سرعة التبديل |
| فيوز | ⚠️ التيار **بالضبط** والنوع (سريع/بطيء) | لا شيء | لا شيء |
| ريلاي | جهد الملف، ترتيب النقاط | تيار النقاط | تيار النقاط |
| NTC | القيمة عند 25° و Beta | — | — |

**⚠️ الفيوز استثناء مطلق:** لا تكبّره أبدًا ولا تستبدل السريع بالبطيء أو العكس.

### 20.2 قراءة الداتاشيت — ما تبحث عنه

**للموسفت:**
- `Vdss` جهد التحمل (يجب أن يفوق أعلى جهد في الدائرة بـ30% على الأقل).
- `Id` أقصى تيار.
- `Rds(on)` مقاومة التوصيل — كلما قلّت قلّت السخونة.
- `Vgs(th)` جهد بدء التوصيل — ⚠️ موسفت المنطق (Logic Level) لا يتبادل مع العادي.
- `Qg` شحنة البوابة — أعلى = تبديل أبطأ وسخونة أكثر في التطبيقات السريعة.

**للترانزستور BJT:** `Vceo`, `Ic`, `hFE`, `Pd`, والتخطيط (Pinout يختلف بين الطُرز حتى بنفس العلبة!).

**⭐ خطأ شائع:** استبدال ترانزستور بمكافئ صحيح لكن **بترتيب أرجل مختلف** → قصر فوري. تحقق دائمًا من التخطيط.

### 20.3 كشف القطع المقلدة

سوق قطع الغيار مليء بالمقلد، خصوصًا موسفتات القدرة والـICs الشهيرة.

| المؤشر | التفصيل |
|---|---|
| **الطباعة** | المقلد: حروف باهتة، غير محاذية، تُمسح بالأسيتون أو الكحول (الأصلي محفور بالليزر) |
| **الوزن** | القطعة المقلدة أخف — الشريحة الداخلية أصغر أو غائبة |
| **السعر** | أرخص بكثير من السوق = علامة إنذار |
| **العلبة** | لون مختلف قليلًا، حواف غير حادة، أثر إعادة تجميع |
| **الأداء** | تسخن بشدة تحت حمل عادي، أو تفشل خلال أيام |
| **قياس Rds(on)** | أعلى بكثير من الداتاشيت = مقلد |
| **الأرجل** | لمعان غير طبيعي أو آثار لحام قديم = قطعة مستعملة معاد بيعها |

**اختبار الأسيتون:** امسح الطباعة بقطنة وأسيتون. الأصلية لا تتأثر، والمقلدة تُمسح وقد يظهر تحتها رقم آخر.

**نصيحة:** اشترِ من موزعين معتمدين للمكونات الحرجة (موسفتات القدرة، ICs التحكم). القطع الرخيصة تكلفك بورد كامل.

### 20.4 تفكيك القطع من بوردات تالفة (Harvesting)

مصدر ممتاز ومجاني للمكونات: بوردات قديمة.
- استخدم هوت إير لسحب مجموعات كاملة.
- اختبر كل قطعة قبل الاستخدام.
- ⚠️ **لا تعِد استخدام:** المكثفات الإلكتروليتية (عمرها الافتراضي مستهلك) ولا الفيوزات ولا القطع من بورد احترق فيه قسم القدرة.

## الفصل 21: الهندسة العكسية للبورد

عندما لا تجد Service Manual — وهذا هو الوضع الطبيعي — ارسم الدائرة بنفسك.

### 21.1 المنهجية

```
[1] صوّر الوجهين بدقة عالية وإضاءة جيدة
[2] اعكس صورة الوجه السفلي أفقيًا في أي برنامج
    → الآن الصورتان متطابقتان في الاتجاه ويمكن مطابقة الأرجل
[3] حدّد أولًا المعالم الكبرى:
    - مدخل 220 والفيوز
    - المحول والمكثف الكبير → قسم القدرة
    - المتحكم والبلورة → قسم التحكم
    - الريلايات/الترياكات → المخارج
    - الموصلات → سمّها بما تتصل به فعلًا
[4] ارسم الأرضي أولًا
    ضع الأفوميتر على الاستمرارية، ثبّت طرفًا على الأرضي
    وامسح كل الأرجل — كل ما يصفر هو أرضي. لوّنه على الصورة
[5] ثم خطوط التغذية (5V, 12V, 3.3V) بنفس الطريقة بلون آخر
[6] ثم تتبع كل مكون على حدة وسجّل توصيلاته في جدول
[7] ارسم المخطط النهائي على ورق أو ببرنامج (KiCad, EasyEDA)
```

### 21.2 حيل تسريع العمل

- **ابحث عن رقم الـIC + كلمة datasheet** — تخطيط أرجله يكشف نصف الدائرة فورًا.
- **الدوائر متكررة:** ستجد نفس دائرة SMPS ونفس دائرة قيادة الريلاي في مئات البوردات. تعرّف على الأنماط.
- **راجع أمثلة التطبيق (Typical Application Circuit)** في الداتاشيت — المصنّعون ينسخونها كما هي غالبًا.
- **الطبقات الداخلية:** البورد متعدد الطبقات لا يمكن تتبعه بصريًا — اعتمد على الاستمرارية فقط.
- **لوّن الصور رقميًا** بألوان مختلفة لكل شبكة (Net). أداة بسيطة كالرسام تكفي.

### 21.3 تحديد وظيفة مكون مجهول

| الدليل | الاستنتاج |
|---|---|
| متصل بالمتحكم عبر مقاومة صغيرة | خط إشارة/تحكم |
| متصل مباشرة بأرجل موصل خارجي | حساس أو حمل |
| بجواره مكثف صغير للأرضي | خط تغذية أو ترشيح |
| ملحق بمشتت حراري | قدرة (موسفت/منظم/دايود قدرة) |
| بعده أوبتوكابلر | عزل بين قسمين |

## الفصل 22: جودة الكهرباء والتوافقيات

### 22.1 المشاكل الخمس في جودة الكهرباء

| المشكلة | الوصف | الأثر على الأجهزة |
|---|---|---|
| **هبوط الجهد (Sag/Brownout)** | انخفاض مؤقت | الموتورات تسحب تيارًا أعلى وتسخن؛ البوردات تُعاد تشغيلها |
| **ارتفاع الجهد (Surge/Spike)** | قفزة مفاجئة (صواعق، فصل أحمال كبيرة) | ⭐ **قاتل البوردات رقم 1** |
| **التوافقيات (Harmonics)** | تشوه شكل الموجة | سخونة المحولات والمتعادل، أخطاء عشوائية |
| **انقطاع لحظي** | جزء من الثانية | إعادة تشغيل، فقدان إعدادات |
| **عدم اتزان الأطوار** | في الثلاثي الطور | احتراق الموتورات |

### 22.2 التوافقيات — لماذا يجب أن تعرفها

الأجهزة غير الخطية (SMPS، LED، إنفرتر، دِمَرات) لا تسحب تيارًا جيبيًا، بل نبضات. تجميع مئات هذه الأجهزة ينتج **توافقيات** تشوّه الشبكة.

**الأثر العملي:**
- **سلك المتعادل يسخن** أكثر من الأطوار — لأن التوافقية الثالثة تتجمع فيه ولا تلغى.
- المحولات تسخن وتفقد كفاءتها.
- قواطع تفصل بلا سبب واضح.
- أجهزة قياس تعطي قراءات خاطئة.

**⭐ نتيجة مهمة للفني:** استخدم أفوميتر **True RMS** فقط. الأفوميتر العادي يعطي قراءات خاطئة بنسبة تصل إلى 40% على أحمال غير خطية.

### 22.3 معامل القدرة

```
معامل القدرة (PF) = القدرة الفعلية (kW) ÷ القدرة الظاهرية (kVA)
```
- الأحمال المقاومة (سخان، لمبة تنجستن): PF ≈ 1.
- الموتورات والمحولات: PF = 0.6-0.85 (متأخر).
- **الأثر:** PF منخفض يعني تيارًا أعلى لنفس القدرة → كابلات أسخن وفواتير أعلى (في التعرفة التجارية).
- **التصحيح:** مكثفات موازية (Capacitor Bank) — تُستخدم في المنشآت لا المنازل عادة.

### 22.4 الحماية العملية لأجهزتك

| الوسيلة | الحماية | التكلفة |
|---|---|---|
| **مانع الصواعق (SPD)** في اللوحة | الارتفاعات المفاجئة لكل المنزل | متوسطة — **أفضل استثمار حماية** |
| **مثبت جهد (Stabilizer)** | تذبذب الجهد للجهاز الواحد | منخفضة |
| **حامي الجهد الإلكتروني** | يفصل عند خروج الجهد عن نطاق آمن | منخفضة — ممتاز للثلاجات والمكيفات |
| **UPS بموجة جيبية نقية** | انقطاع + تنظيم | عالية |
| **UPS Online (Double Conversion)** | عزل كامل عن الشبكة | الأعلى — للأجهزة الحرجة |

> ⚠️ **لا تُوصِّل جهاز إنفرتر (ثلاجة/مكيف) بـUPS شبه جيبي أو مثبت رخيص** — قد يدمر بورده. جيبي نقي أو لا شيء.

## الفصل 23: حساب الاستهلاك وتشخيص الفاتورة العالية

### 23.1 الحساب الأساسي

```
الاستهلاك (كيلو وات ساعة) = (القدرة بالوات × ساعات التشغيل) ÷ 1000
التكلفة = كيلو وات ساعة × سعر الشريحة
```

**مثال:** مكيف 1500 وات يعمل 6 ساعات يوميًا لمدة 30 يومًا:
```
(1500 × 6 × 30) ÷ 1000 = 270 كيلو وات ساعة شهريًا
```

### 23.2 استهلاك تقريبي للأجهزة الشائعة

| الجهاز | القدرة | ملاحظة |
|---|---|---|
| مكيف 1.5 حصان | 1100-1500 W | الإنفرتر يوفر 30-50% |
| سخان مياه | 1500-3000 W | ⭐ من أكبر المستهلكين |
| ثلاجة | 100-250 W | لكنها تعمل 24 ساعة |
| غسالة (دورة ساخنة) | 2000 W | السخان هو المستهلك الأساسي |
| مكواة | 1000-2000 W | |
| فرن كهربائي | 2000-3000 W | |
| لمبة LED | 7-15 W | |
| تلفزيون LED | 50-150 W | |
| لابتوب | 45-90 W | |
| راوتر | 5-10 W | يعمل 24 ساعة |

### 23.3 تشخيص فاتورة مرتفعة فجأة

```
[1] استبعد الخطأ الإداري: قارن قراءة العداد الفعلية بالفاتورة
[2] اختبار العداد الصامت:
    افصل كل الأحمال من القواطع → العداد يجب أن يتوقف تمامًا
    إن استمر يدور → تسريب أو سرقة أو عداد معطوب
[3] عزل الدوائر: أعد القواطع واحدًا واحدًا وراقب سرعة العداد
[4] الأجهزة المشتبهة الأولى:
    ⭐ سخان المياه (ثيرموستات ملتصق = يسخن 24 ساعة)
    ⭐ الثلاجة (جلد باب تالف أو غاز ناقص = تعمل باستمرار)
    ⭐ مكيف بفلاتر متسخة أو ناقص غاز
    ⭐ طلمبة مياه تعمل بسبب تسريب في الشبكة
[5] قِس التيار الفعلي بالكلامب ميتر على كل دائرة
[6] استهلاك الاستعداد (Standby): مجموع الأجهزة في الاستعداد
    قد يصل إلى 5-10% من الفاتورة
```

### 23.4 قياس استهلاك جهاز فعليًا

استخدم **عداد بريزة (Plug-in Energy Meter)** — رخيص ويعطي القدرة الآنية والاستهلاك التراكمي. أفضل أداة لكشف "الجهاز المتهم".

### 23.5 توفير فعلي (بترتيب العائد)

1. رفع درجة المكيف 2° = توفير 10-20%.
2. عزل خزان السخان وضبط حرارته على 55-60° بدل الأقصى.
3. تنظيف فلاتر المكيف وشبكة الثلاجة.
4. غسيل بماء بارد بدل ساخن.
5. استبدال اللمبات بـLED.
6. إصلاح جلد أبواب الثلاجة.
7. فصل الأجهزة من الاستعداد.

## الفصل 24: الجانب المهني — من الهواية إلى الاحتراف

### 24.1 ميزانية العدّة على ثلاثة مستويات

**المستوى 1 — البداية:**
أفوميتر رقمي جيد، كاوية بمنظم، قصدير وفلكس، شفاط قصدير، مفكات دقيقة، كماشات، كشاف رأس، عدسة، جهاز فحص مكونات LCR-T4.

**المستوى 2 — الاحتراف الجزئي:**
أضف: محطة هوت إير، جهاز ESR، مصدر جهد متغير بحد تيار، كلامب ميتر True RMS، محول عزل، مقياس حرارة IR، حصيرة عمل مضادة للاستاتيك، منظم أدوات ومكونات.

**المستوى 3 — الورشة الكاملة:**
أضف: أوسيلوسكوب 100 MHz، ميجر 500V، جهاز اختبار RCD، فاريك، مجهر لحام أو كاميرا، حمام موجات فوق صوتية، مخزون مكونات منظم، مبرمج EEPROM.

### 24.2 تنظيم المكونات

- صناديق بأقسام مع ملصقات بالقيمة.
- مكثفات مرتبة بالسعة والجهد، مقاومات بالقيمة.
- سجل بسيط (ورقي أو Excel) بما لديك — يوفر ساعات بحث.

### 24.3 نموذج استلام جهاز

```
─────────────────────────────────────────
        إيصال استلام جهاز للصيانة
─────────────────────────────────────────
رقم الإيصال: ______   التاريخ: ______
اسم العميل: ____________  الهاتف: ______
الجهاز: ______  الماركة: ______  الموديل: ______
الرقم التسلسلي: ______________
─────────────────────────────────────────
العطل كما وصفه العميل:
_________________________________________
الحالة الظاهرية عند الاستلام (خدوش/كسور/أجزاء ناقصة):
_________________________________________
الملحقات المستلمة: □ سلك  □ ريموت  □ أخرى: ______
─────────────────────────────────────────
□ تم إبلاغ العميل أن رسوم الكشف ______ تُدفع حتى لو رفض الإصلاح
□ الأجهزة غير المستلمة خلال ____ يومًا لا نتحمل مسؤوليتها
□ الجهاز قد يكون تعرض لمحاولة إصلاح سابقة: نعم / لا
─────────────────────────────────────────
تقدير مبدئي: ______  |  توقيع العميل: ______
─────────────────────────────────────────
```

### 24.4 تسعير الإصلاح

```
سعر الإصلاح = (تكلفة القطع × هامش) + (ساعات العمل × أجر الساعة) + مصاريف
```
**اعتبارات:**
- **رسم كشف** ثابت يُخصم من قيمة الإصلاح عند الموافقة.
- **قاعدة الـ50%:** إن تجاوزت التكلفة 50% من سعر جهاز جديد، أبلغ العميل بصراحة أن الاستبدال أوفر. هذه النصيحة تبني سمعة أفضل من ربح صفقة واحدة.
- سعّر خبرتك لا وقتك فقط — التشخيص السريع نتيجة سنوات، لا دقائق.

### 24.5 الضمان وحدوده

**اضمن:** القطعة التي استبدلتها والعمل المتعلق بها — عادة 1-3 أشهر.
**لا تضمن:** أعطالًا جديدة في أجزاء أخرى، أو جهازًا قديمًا متهالكًا، أو أضرارًا من سوء الاستخدام أو تقلبات الجهد.
**اكتب حدود الضمان صراحة** على الإيصال — يمنع 90% من الخلافات.

### 24.6 أخلاقيات المهنة

- **لا تستبدل قطعًا سليمة** لرفع الفاتورة.
- **أعطِ القطع المستبدلة للعميل** — يبني ثقة فورية.
- **اعترف بحدودك:** "هذا يحتاج متخصصًا آخر" أجدى من محاولة فاشلة تدمر الجهاز.
- **لا تسلّم جهازًا غير آمن** حتى لو "يعمل" — اختبار العزل والأرضي مسؤوليتك.
- **وثّق بالصور** قبل وبعد.

### 24.7 مسار التعلم المقترح

```
الشهر 1-2 : السلامة + الأفوميتر + المكونات الأساسية + اللحام
الشهر 3-4 : الأجهزة الحرارية والموتورات البسيطة (مروحة، خلاط، مكواة)
الشهر 5-6 : مصادر الطاقة SMPS — الفصل الأهم على الإطلاق
الشهر 7-9 : الأجهزة الكبيرة (غسالة، ثلاجة) وأكواد الأخطاء
الشهر 10-12: الإنفرتر والأوسيلوسكوب والهندسة العكسية
مستمر     : تفكيك أجهزة تالفة للتدريب، وقراءة الداتاشيت
```

**⭐ أفضل تمرين:** اشترِ أجهزة تالفة رخيصة من محلات الخردة وفككها وأصلحها بلا ضغط. الخطأ فيها مجاني.

## الفصل 25: غازات التبريد وأساسيات دورة التبريد

### 25.1 ⚠️ تحذير حرج: غاز R600a قابل للاشتعال

**كل الثلاجات المنتَجة تقريبًا بعد 2010 تستخدم R600a (آيزوبيوتين) — وهو غاز قابل للاشتعال والانفجار.**

هذا ليس تحذيرًا نظريًا: انفجارات ثلاجات أثناء الصيانة أودت بحياة فنيين وأحرقت شققًا.

| ما يجب أن تعرفه عن R600a | التفصيل |
|---|---|
| حد الاشتعال | 1.8% - 8.4% في الهواء — نسبة صغيرة جدًا تكفي |
| مصدر الإشعال | ⭐ **شرارة الريلاي أو المفتاح** أو لهب اللحام أو حتى كهرباء ساكنة |
| الكمية في الثلاجة | صغيرة (50-80 جرام) لكنها كافية لملء مطبخ صغير بخليط قابل للانفجار |
| الرائحة | ضعيفة جدًا — قد لا تشمها |
| أثقل من الهواء | يتجمع عند الأرضية وخلف الجهاز |

**قواعد التعامل الإجبارية:**
```
🚫 لا تلحم ولا تستخدم أي لهب قبل التأكد من تفريغ الغاز بالكامل
🚫 لا تشغّل أي مفتاح كهربائي أو مثقاب في مكان يُشتبه بتسرب فيه
🚫 لا تدخّن ولا تسمح بأي مصدر لهب في نطاق العمل
✅ افتح النوافذ وهوّ المكان جيدًا قبل وأثناء العمل
✅ استخدم كاشف تسرب مخصص للغازات القابلة للاشتعال
✅ استخدم عدة وأدوات مصنفة للاستخدام مع الغازات القابلة للاشتعال
✅ ابحث عن ملصق التحذير البرتقالي/الأحمر على ضاغط الثلاجة قبل أي عمل
```

> **قبل أي عمل على ثلاجة: اقرأ نوع الغاز من لوحة البيانات.** إن وجدت R600a أو R290 (بروبان) أو R1270، فأنت أمام غاز قابل للاشتعال، وأي عمل على الدائرة يحتاج فنيًا مدربًا ومعتمدًا.

### 25.2 جدول غازات التبريد

| الغاز | الاستخدام | قابل للاشتعال؟ | ملاحظات |
|---|---|---|---|
| **R600a** (آيزوبيوتين) | ثلاجات حديثة | ⚠️ **نعم — شديد** | الأكثر شيوعًا الآن |
| **R290** (بروبان) | مبردات، مكيفات صغيرة | ⚠️ **نعم — شديد** | |
| **R134a** | ثلاجات قديمة نسبيًا، سيارات | لا | يُستبدل تدريجيًا |
| **R22** | مكيفات قديمة | لا | ⚠️ محظور دوليًا (يستنزف الأوزون) |
| **R410A** | مكيفات حديثة | لا | ضغط عالٍ جدًا — عدة مختلفة تمامًا |
| **R32** | مكيفات جديدة | ⚠️ **قابل للاشتعال بدرجة منخفضة (A2L)** | ينتشر بسرعة |
| **R404A / R507** | تبريد تجاري | لا | |

**⚠️ لا تخلط الغازات أبدًا.** كل غاز له ضغط وزيت مختلف. خلط R22 مع R410A مثلًا يدمر الضاغط ويخلق ضغطًا خطرًا.

**⚠️ ضغط تشغيل R410A أعلى من R22 بنحو 50-60%** — لا تستخدم مانيفولد أو خراطيم R22 معه، فقد تنفجر.

### 25.3 مخاطر عامة في دوائر التبريد

- **الحروق الباردة (Frostbite):** الفريون السائل يتبخر فورًا ويجمّد الجلد والعين خلال ثوانٍ. **نظارة وقفاز إلزاميان.**
- **الاختناق:** الغازات أثقل من الهواء وتزيح الأكسجين في الأماكن المغلقة.
- **الغازات السامة عند الاحتراق:** لا تلحم قرب فريون — ينتج فوسجين وحمض هيدروفلوريك.
- **الضغط:** لا تسخّن أسطوانة غاز ولا تملأها فوق 80%.
- **البيئة والقانون:** تفريغ الفريون في الجو محظور قانونيًا في معظم الدول ويستوجب غرامات.

### 25.4 دورة التبريد — ما يجب أن يفهمه كل فني كهربائي

حتى لو لن تنفذ أعمال التبريد، فهم الدورة يمنعك من استبدال بورد سليم بسبب عطل ميكانيكي.

```
الضغط والحرارة عبر الدورة:

[الضاغط] ──── غاز ساخن عالي الضغط (70-90°م) ────→ [المكثف/الكندنسر]
    ↑                                                      │
    │                                            يطرد الحرارة للخارج
    │                                                      ↓
غاز بارد منخفض الضغط                            سائل دافئ عالي الضغط
    │                                                      │
    │                                                      ↓
[المبخر] ←──── سائل بارد منخفض الضغط ────── [الأنبوبة الشعرية / صمام التمدد]
    │                                          ⭐ نقطة انخفاض الضغط
يمتص الحرارة من الداخل = التبريد
```

**المصطلحان اللذان يفسران كل شيء:**
- **التبريد الفائق (Subcooling):** كم بُرِّد السائل تحت نقطة تكثفه. مؤشر على شحنة كافية.
- **الحرارة الزائدة (Superheat):** كم سُخِّن الغاز فوق نقطة تبخره. مؤشر على تمدد صحيح.

### 25.5 التشخيص بالضغوط (قراءة سريعة)

| القراءة | الضغط المنخفض | الضغط المرتفع | التشخيص |
|---|---|---|---|
| نقص شحنة | منخفض | منخفض | تسريب — ابحث عنه، لا تشحن فقط |
| زيادة شحنة | مرتفع | مرتفع | ⚠️ خطر على الضاغط |
| انسداد في الشعرية/الفلتر | ⭐ منخفض جدًا (قد يصل لتفريغ) | منخفض | ثلج عند نقطة الانسداد |
| كندنسر متسخ / مروحة متوقفة | مرتفع | ⭐ مرتفع جدًا | حماية الضغط تفصل |
| صمامات الضاغط تالفة | مرتفع | منخفض | الضاغط لا يضغط — يستبدل |
| حمل حراري كبير | مرتفع | مرتفع | ليس عطلًا — الغرفة حارة جدًا |

### 25.6 أعمال التبريد الأساسية (للمعرفة لا للتنفيذ بلا تدريب)

| العملية | الغرض | لماذا تحتاج تدريبًا |
|---|---|---|
| **كشف التسرب** | إيجاد مصدر النقص | صابون، كاشف إلكتروني، صبغة UV |
| **التفريغ (Vacuum)** | إزالة الهواء والرطوبة | ⭐ الرطوبة تجمّد الشعرية وتنتج أحماضًا تدمر الضاغط. تفريغ إلى 500 ميكرون على الأقل |
| **الشحن بالوزن** | إضافة الكمية الصحيحة | الوزن مكتوب على لوحة البيانات بالجرام — الشحن بالتخمين يدمر الجهاز |
| **اللحام النحاسي** | إصلاح التسريب | يحتاج نيتروجين أثناء اللحام لمنع الأكسدة الداخلية |
| **استبدال الفلتر المجفف** | مع كل فتح للدائرة | إلزامي — الفلتر القديم مشبع برطوبة |

> ⚠️ **في معظم الدول، شحن وتفريغ الفريون يتطلب رخصة قانونية.** الجزء الكهربائي مفتوح لك — الجزء الميكانيكي له تخصصه.

## الفصل 26: ⚠️ سخانات المياه اللحظية والشاور الكهربائي

> ### 🚨 هذه الفئة تحديدًا هي الأكثر تسببًا في الوفيات الكهربائية المنزلية.
> ماء + 220 فولت + إنسان عارٍ حافٍ في حمام رطب = أسوأ سيناريو ممكن.

### 26.1 كيف يعمل

```
مدخل ماء بارد
      ↓
[مفتاح تدفق / حساس ضغط] ← لا يسخّن إلا والماء يجري (حماية أساسية)
      ↓
[عنصر تسخين قوي 3000-9000 وات] داخل أنبوب أو غرفة
      ↓
[ثيرموستات + فيوز حراري]
      ↓
ماء ساخن للشاور
```

### 26.2 متطلبات السلامة غير القابلة للتفاوض

```
✅ أرضي فعّال مقاس ومختبر (< 0.1 Ω) — بدونه الجهاز قنبلة
✅ قاطع تفاضلي RCD بحساسية 30 مللي أمبير مخصص لدائرة الحمام
✅ كابل بمقطع مناسب: جهاز 6000 وات يسحب 27 أمبير → كابل 6 مم² على الأقل
✅ قاطع مخصص لهذا الجهاز وحده — لا يشاركه أي حمل آخر
✅ رابطة تكافؤ جهد (Equipotential Bonding) لكل معدن في الحمام:
   المواسير، حامل الشاور، مصرف الأرضية، هيكل الباب
✅ مفتاح فصل خارج الحمام أو من نوع سحب حبل معزول
✅ درجة حماية IPX4 على الأقل حسب موقعه من الشاور
🚫 لا بريزة عادية داخل منطقة الرش إطلاقًا
```

### 26.3 مناطق الحمام (Bathroom Zones) — قاعدة عالمية

| المنطقة | التعريف | المسموح |
|---|---|---|
| **Zone 0** | داخل حوض الاستحمام/الدُش نفسه | 12V فقط، IPX7 |
| **Zone 1** | فوق الحوض حتى 2.25 متر | IPX4، سخانات معتمدة فقط |
| **Zone 2** | 60 سم حول Zone 1 | IPX4، لا بريزات |
| **خارج المناطق** | ما بعد ذلك | بريزات مسموحة مع RCD |

### 26.4 الأعطال الشائعة

| العَرَض | السبب |
|---|---|
| لا يسخن والماء يجري | ⭐ **مفتاح التدفق (Flow Switch)** — الأشهر، يتعطل بالترسبات ← الفيوز الحراري ← العنصر |
| يسخن أحيانًا فقط | ضغط الماء منخفض لا يشغّل مفتاح التدفق ← ترسبات |
| الماء ساخن جدًا ولا ينضبط | الثيرموستات ← معدل التدفق منخفض جدًا |
| يفصل القاطع التفاضلي | ⚠️ ⭐ **تسريب من العنصر إلى الماء — خطر مميت. أوقف الجهاز فورًا ولا تستخدمه** |
| صعقة خفيفة أو "نمنمة" عند اللمس | ⚠️ **حالة طوارئ** — افصل القاطع ولا تستحم حتى الفحص الكامل |
| تسريب ماء داخل الجهاز | ⚠️ خطر قصر وصعق — لا تُشغّله |

### 26.5 اختبار السلامة الإجباري بعد أي إصلاح

```
□ مقاومة العزل بين العنصر والجسم/الماء بـ500V ....... > 1 MΩ
□ استمرارية الأرضي لكل جزء معدني .................... < 0.1 Ω
□ اختبار زر TEST في القاطع التفاضلي .................. يفصل فورًا
□ اختبار الفصل الفعلي بجهاز RCD Tester ............... < 300 ms
□ لا تسريب مائي عند أقصى ضغط
□ الجهاز لا يسخّن إطلاقًا بلا تدفق ماء (اختبر مفتاح التدفق)
□ قياس التيار الفعلي ومقارنته باللوحة
```

> **قاعدة قاطعة:** إذا كان الحمام بلا أرضي فعّال أو بلا RCD، **لا تركّب سخانًا لحظيًا مطلقًا** — أيًا كان إلحاح العميل. عالج التأريض أولًا.

### 26.6 السخان ذو الخزان — مخاطر مختلفة

- **صمام الأمان (T&P Valve):** انسداده = خطر انفجار الخزان حرفيًا. اختبره سنويًا.
- **الأنود المغنيسيومي:** يتآكل بدلًا من الخزان — استبدله كل 2-3 سنوات.
- **الترسبات الجيرية:** تعزل العنصر فيسخن ويحترق، وتقلل السعة الفعلية.
- **ضبط الحرارة على 60°م:** أقل يشجع بكتيريا الليجيونيلا، وأعلى يهدر طاقة ويسبب حروقًا.

## الفصل 27: الأجهزة الغازية ذات التحكم الكهربائي

### 27.1 لماذا يعنيك هذا كفني كهرباء

البوتاجاز والسخان الغازي والفرن الغازي بها **دوائر كهربائية للإشعال والأمان**، وأعطالها تُنسب خطأً للغاز أو العكس.

### 27.2 منظومة الأمان الغازي

```
[صمام الغاز الكهرومغناطيسي] ← لا يفتح إلا بوجود إشارة أمان
            ↑
[المزدوج الحراري Thermocouple] ← يولد ~20-30 مللي فولت عند تسخينه باللهب
            ↑
        [اللهب]
```

**المبدأ:** لا لهب → لا حرارة → لا جهد من المزدوج → الصمام يغلق تلقائيًا. هذا ما يمنع تسرب الغاز عند انطفاء اللهب.

### 27.3 التشخيص

| العَرَض | السبب |
|---|---|
| **اللهب ينطفئ عند ترك الزر** | ⭐ **المزدوج الحراري** — إما متسخ، أو بعيد عن اللهب، أو تالف. قِس خرجه: يجب > 15 mV ساخنًا |
| **لا شرارة إشعال** | ⭐ بطارية (في الأنواع البطارية) ← وحدة الإشعال (Ignition Module) ← قطب الشرارة متسخ أو متشقق ← رطوبة |
| **شرارة مستمرة لا تتوقف** | مفتاح الإشعال ملتصق ← رطوبة على الأزرار (شائع بعد التنظيف) |
| **لهب أصفر بدل الأزرق** | ⚠️ احتراق غير كامل → **أول أكسيد كربون**. فتحات الشعلة مسدودة أو نسبة الهواء خاطئة |
| **رائحة غاز** | 🚨 **طوارئ — لا تشغّل أي مفتاح كهربائي، افتح النوافذ، أغلق المحبس، اخرج، اتصل بالطوارئ من الخارج** |
| **الفرن لا يحافظ على الحرارة** | صمام الحرارة ← الثيرموستات ← المروحة |

### 27.4 السخان الغازي اللحظي

- **مفتاح تدفق مائي** يبدأ التشغيل + **مروحة سحب** + **حساس عادم**.
- **⚠️ حساس العادم (Flue Sensor) لا يُلغى أبدًا** — دوره منع تراكم أول أكسيد الكربون داخل المنزل. تعطيله قتل عائلات كاملة.
- **مدخنة العادم:** يجب أن تخرج للهواء الطلق وبميل صحيح ودون انسداد.
- **تركيب سخان غازي في حمام مغلق بلا تهوية = خطر موت اختناقًا.**

### 27.5 كاشف أول أكسيد الكربون

> 💡 **أوصِ كل عميل لديه أي جهاز غازي بتركيب كاشف CO.** ثمنه زهيد، وهو الشيء الوحيد الذي ينبّهك لغاز لا لون له ولا رائحة ولا طعم. الأعراض (صداع، دوار، غثيان) تُخطئ تشخيصها كأنها إنفلونزا حتى فوات الأوان.

## الفصل 28: أنظمة التأريض وحسابات الكابلات

### 28.1 أنظمة التأريض العالمية

| النظام | الوصف | أين يُستخدم |
|---|---|---|
| **TN-S** | أرضي منفصل تمامًا عن المتعادل من المصدر | الأفضل والأأمن |
| **TN-C-S (PME)** | مشترك ثم ينفصل عند المدخل | شائع في التوزيع الحديث |
| **TN-C** | المتعادل والأرضي سلك واحد (PEN) | ⚠️ قديم وخطر — لا يُستخدم مع RCD |
| **TT** | أرضي المستهلك قطب مستقل عن المصدر | شائع في المناطق الريفية والمباني ذات الأقطاب المستقلة — **يعتمد كليًا على RCD** |
| **IT** | لا أرضي مباشر للمصدر | مستشفيات، صناعات حرجة |

**⚠️ في نظام TT:** مقاومة الأرضي عالية نسبيًا، فالقاطع العادي قد لا يفصل عند تسريب. **القاطع التفاضلي ليس اختياريًا هنا — هو خط الحماية الوحيد.**

### 28.2 حساب مقطع الكابل

ثلاثة معايير يجب أن تتحقق **كلها**:

**(1) قدرة التحمل الحراري (Ampacity):**

| المقطع (مم²) | التيار المسموح تقريبًا (نحاس، مثبت في مواسير) |
|---|---|
| 1.0 | 11 A |
| 1.5 | 14-16 A |
| 2.5 | 19-21 A |
| 4 | 25-28 A |
| 6 | 32-36 A |
| 10 | 44-50 A |
| 16 | 60-68 A |
| 25 | 80-90 A |

⚠️ تُخفَّض هذه القيم بمعاملات: الحرارة المحيطة، التجميع (عدة كابلات معًا)، العزل الحراري.

**(2) سقوط الجهد:**
```
سقوط الجهد (فولت) = (2 × الطول × التيار × ρ) ÷ المقطع
     ρ للنحاس ≈ 0.0175 Ω·مم²/م

الحد المسموح: 3% للإنارة، 5% للقوة (من 220V = 6.6V و 11V)
```
**مثال:** حمل 20 أمبير على مسافة 40 متر بكابل 4 مم²:
```
(2 × 40 × 20 × 0.0175) ÷ 4 = 7 فولت = 3.2% ✓ مقبول للقوة
بكابل 2.5 مم² لكان: 11.2 فولت = 5.1% ✗ غير مقبول
```

**⭐ لماذا يهم؟** سقوط الجهد يجعل الموتور يسحب تيارًا أعلى ويسخن ويحترق. كثير من "أعطال الموتورات المتكررة" سببها كابل رفيع أو طويل.

**(3) حماية قصر الدائرة:** الكابل يجب أن يتحمل تيار القصر حتى يفصل القاطع.

### 28.3 التنسيق بين القاطع والكابل

```
تيار الحمل  ≤  تيار القاطع  ≤  قدرة تحمل الكابل
```
**مثال صحيح:** حمل 18A → قاطع 20A → كابل 4 مم² (28A) ✓
**مثال خطأ قاتل:** كابل 1.5 مم² مع قاطع 32A ← الكابل يحترق ويشتعل قبل أن يفصل القاطع

### 28.4 رابطة تكافؤ الجهد (Equipotential Bonding)

توصيل كل الأجزاء المعدنية (مواسير المياه، الغاز، هيكل المبنى) بنقطة أرضي واحدة، فلا يوجد فرق جهد بينها.
- **إلزامية في الحمامات والمطابخ.**
- بدونها قد تنشأ فروق جهد خطرة بين ماسورة وجهاز.

### 28.5 قياس مقاومة حلقة العطل (Loop Impedance)

يقيس المسار الكامل الذي يسلكه تيار العطل. يحدد هل سيفصل القاطع في الزمن المطلوب.
```
تيار العطل المتوقع = 230 ÷ مقاومة الحلقة
يجب أن يفوق تيار الفصل اللحظي للقاطع
مثال: قاطع 20A نوع B يفصل لحظيًا عند 5×20 = 100A
      → مقاومة الحلقة يجب أن تكون < 230÷100 = 2.3 Ω
```

## الفصل 29: الأجهزة الذكية وإنترنت الأشياء (IoT)

### 29.1 بنية الجهاز الذكي

```
[الجهاز الأساسي] ── نفس المكونات التقليدية
        │
[البورد الرئيسي MCU]
        │
[موديول اتصال] ── Wi-Fi (ESP32/ESP8266) أو Bluetooth أو Zigbee
        │
[الراوتر المنزلي] ── [الإنترنت] ── [سحابة الشركة] ── [تطبيق الموبايل]
```

**⭐ نقطة حاسمة للتشخيص:** الجهاز الذكي فيه **سلسلتان مستقلتان** — سلسلة التشغيل الميكانيكية/الكهربائية، وسلسلة الاتصال. **عطل الاتصال لا يعني عطل الجهاز، والعكس صحيح.**

### 29.2 أعطال تبدو ميكانيكية وهي برمجية

| العَرَض | السبب الحقيقي |
|---|---|
| الغسالة لا تبدأ رغم أن كل شيء سليم | تحديث فيرموير عالق ← الجهاز ينتظر أمر السحابة |
| المكيف يغيّر إعداداته وحده | ⭐ جدولة (Schedule) في التطبيق نساها المستخدم ← حساب مشترك مع شخص آخر |
| الجهاز يعمل من التطبيق ولا يعمل من لوحته | لوحة الأزرار/الشاشة معطلة، والاتصال سليم |
| يعمل من اللوحة ولا يستجيب للتطبيق | موديول الواي فاي أو الشبكة أو السحابة |
| يفقد الاتصال دوريًا | ⭐ إشارة ضعيفة ← الراوتر على 5 جيجا فقط (معظم الأجهزة تدعم 2.4 فقط) ← تغيير كلمة الواي فاي |
| توقف الجهاز عن العمل بعد سنوات | ⚠️ الشركة أوقفت خدمة السحابة (End of Support) |

### 29.3 خطوات تشخيص جهاز ذكي

```
[1] افصل الذكاء واختبر الأساسي:
    شغّل الجهاز من لوحته يدويًا — هل يعمل؟
    نعم → المشكلة في الاتصال فقط
    لا  → عطل عادي، شخّصه بالطريقة التقليدية

[2] إن كانت المشكلة في الاتصال:
    □ الراوتر يبث 2.4 جيجا هرتز؟ (⭐ السبب الأول)
    □ اسم الشبكة يحتوي رموزًا خاصة أو عربية؟ (يفشل الاقتران)
    □ عزل العملاء (Client Isolation) مفعّل في الراوتر؟
    □ الجهاز داخل نطاق إشارة جيد؟
    □ الشبكة ممتلئة (حد أجهزة الراوتر)؟
    □ تحديث تطبيق الموبايل والفيرموير
    □ إعادة ضبط الاقتران (Reset Pairing) وإعادة الإعداد

[3] إعادة ضبط المصنع للموديول (لا للجهاز كله)
    عادة ضغط مطول على زر معين — راجع دليل الموديل
```

### 29.4 الخصوصية والأمان — نصائح تقولها للعميل

- **غيّر كلمة المرور الافتراضية** لأي جهاز ذكي أو كاميرا. الكاميرات المخترقة معظمها بكلمة المصنع.
- ضع الأجهزة الذكية على **شبكة ضيوف منفصلة** عن أجهزة العمل والبيانات.
- حدّث الفيرموير دوريًا — الثغرات تُصلح بالتحديثات.
- ⚠️ **الجهاز الذكي يجمع بيانات استخدام.** أخبر العميل بذلك بصراحة عند التركيب.
- **اعتبار الاعتماد على السحابة:** إذا توقفت خدمة الشركة، تفقد الوظائف الذكية. فضّل الأجهزة التي تعمل محليًا (Local Control) أو تدعم Matter.

### 29.5 عند استبدال بورد في جهاز ذكي

- قد يحتاج **إعادة ربط بالحساب** وإدخال الرقم التسلسلي.
- بعض الشركات تربط البورد بالجهاز برمجيًا — بورد من جهاز آخر قد لا يعمل.
- احتفظ ببيانات الحساب الأصلية للعميل قبل الفك.

## الفصل 30: الأعطال المتقطعة — منهجية الاستفزاز

العطل المتقطع أصعب أنواع الأعطال: الجهاز يعمل عندك ويفشل عند العميل. الحل ليس الانتظار، بل **إجبار العطل على الظهور**.

### 30.1 لماذا تحدث الأعطال المتقطعة

| السبب | نسبته التقريبية |
|---|---|
| ⭐ **لحام بارد/متشقق** | الأعلى بفارق كبير |
| موصل مؤكسد أو رخو | عالٍ |
| مكثف يتغير أداؤه بالحرارة | عالٍ |
| شرخ شعري في مسار البورد | متوسط |
| مكون شبه تالف يفشل تحت الحمل فقط | متوسط |
| تمدد حراري يفتح وصلة | متوسط |
| رطوبة/تكثّف موسمي | متوسط |
| تشويش كهرومغناطيسي من جهاز آخر | منخفض |

### 30.2 أدوات الاستفزاز الأربع

**1. الاستفزاز الحراري — بخاخ التبريد (Freeze Spray):**
```
شغّل الجهاز حتى يظهر العطل
رشّ المكونات واحدًا واحدًا برشة قصيرة
إذا عاد الجهاز للعمل فجأة عند مكون معين ← وجدت المتهم
```
**بديل اقتصادي:** بخاخ منظف لوحات مفاتيح مقلوبًا، أو عود قطن مبلل بكحول.

**2. الاستفزاز الحراري العكسي — مسدس الهواء الساخن (على حرارة منخفضة 100-150°م):**
```
سخّن منطقة صغيرة بلطف
إذا ظهر العطل عند تسخين منطقة معينة ← المكون يفشل ساخنًا
⚠️ لا تتجاوز 150°م ولا تسخن المكونات البلاستيكية
```

**3. الاستفزاز الميكانيكي:**
```
مع تشغيل الجهاز (⚠️ بحذر شديد وبأداة عازلة):
اضغط برفق على أجزاء مختلفة من البورد بعصا خشبية
انقر بلطف على المكونات الكبيرة والموصلات
حرّك الكابلات والموصلات
أي تغير في السلوك ← وجدت الوصلة الرخوة
```

**4. الاستفزاز الكهربائي:**
```
غيّر جهد الدخل بفاريك من 180 إلى 250 فولت
شغّل الجهاز تحت حمل كامل بدل الفارغ
شغّله لساعات متواصلة مع مراقبة (Burn-in Test)
```

### 30.3 التسجيل والمراقبة

للأعطال النادرة جدًا:
- **مسجل بيانات (Data Logger)** أو أوسيلوسكوب برقمي بوضع Single Trigger لالتقاط اللحظة.
- **كاميرا ترصد** لوحة الجهاز وتسجل وقت العطل.
- **اسأل العميل بدقة:** هل يحدث في وقت معين؟ عند تشغيل جهاز آخر؟ في الطقس الرطب؟ بعد ساعة من التشغيل؟ الإجابات تختصر ساعات.

### 30.4 قاعدة اللحام الوقائي

إذا لم تجد شيئًا بعد كل ذلك، وكان العطل يتوافق مع نمط "لحام بارد":
```
أعد لحام كل المكونات الثقيلة والموصلات على البورد:
  - أرجل المحول
  - أرجل الموصلات (كونكتورات)
  - أرجل الريلايات
  - أرجل المكثفات الكبيرة
  - المكونات ذات المشتت الحراري
استخدم فلكس وأضف قصديرًا جديدًا
⭐ هذا يحل نسبة كبيرة من الأعطال المتقطعة دون تشخيص دقيق
```

## الفصل 31: الإصلاح الميكانيكي للبوردات

### 31.1 إصلاح Pad مقلوع

عند سحب مكون بحرارة زائدة قد ينقلع النحاس (Pad) معه.

```
[1] اكشط طبقة الحماية الخضراء عن المسار المتصل بالـPad
[2] نظّف بالكحول
[3] الحم سلك لف رفيع (0.1-0.2 مم) على المسار المكشوف
[4] وصّل السلك برجل المكون الجديد
[5] ثبّت المنطقة بغراء إيبوكسي أو UV mask للحماية من الشد
[6] أعد طلاء المنطقة
```
**بديل احترافي:** أطقم Pad إصلاح جاهزة (BGA Repair Kit) تُلصق بإيبوكسي.

### 31.2 إصلاح Via مقطوع

الـVia هو الثقب المعدني الذي يربط طبقات البورد.
```
نظّف الثقب من القصدير
أدخل سلكًا رفيعًا يمر من الوجه للوجه
الحمه من الجانبين
اقطع الزائد
```

### 31.3 التعامل مع BGA

الـBGA هو IC بكرات لحام تحته لا تُرى ولا تُلحم يدويًا.

| العملية | التفصيل |
|---|---|
| **Reflow** | إعادة تسخين حتى تنصهر الكرات وتلتحم مجددًا. حل مؤقت غالبًا |
| **Reball** | إزالة الكرات القديمة وتركيب كرات جديدة بقالب (Stencil). حل دائم |
| **Replace** | استبدال الشريحة كليًا |

**ملف حراري تقريبي للحام الخالي من الرصاص:**
```
تسخين مسبق ... 150-180°م لمدة 60-90 ثانية
نقع (Soak) ... 180-200°م لمدة 60-90 ثانية
ذروة ......... 230-245°م لمدة 20-40 ثانية
تبريد ........ تدريجي، لا تعرّضه لتيار هواء بارد
```
⚠️ **التبريد المفاجئ يشقق الوصلات.** الصبر جزء من العملية.

**متى تستحق المحاولة؟** عندما يكون البديل غير متاح أو باهظًا. معدل النجاح متوسط بدون معدات احترافية.

### 31.4 استخدام شريط الكابتون والحماية الحرارية

- **شريط كابتون (Kapton):** يتحمل 260°م — يحمي المكونات المجاورة أثناء الهوت إير.
- **رقائق ألومنيوم** لتغطية المناطق الحساسة.
- **معجون حراري ماص (Heat Sink Compound)** لعزل مكونات قريبة.
- ⚠️ احمِ **البطاريات والمكثفات البلاستيكية والموصلات** — تنصهر بسرعة.

### 31.5 إصلاح موصل مكسور

- **موصل شريط مسطح (FFC):** إذا تلفت أطرافه، يمكن قص جزء صغير وإعادة كشط النهايات (إن سمح الطول).
- **موصل USB/شحن مقلوع:** يُستبدل بالكامل مع فحص المسارات تحته — غالبًا تُقلع معه.
- **تدعيم ميكانيكي:** بعد لحام أي موصل يتعرض للشد، ثبّته بغراء إيبوكسي أو UV — لكن **لا تغطِّ الأرجل** حتى تسمح بإصلاح لاحق.

## الفصل 32: اصنع أدواتك بنفسك

### 32.1 لمبة الاختبار على التوالي (Dim Bulb Tester) ⭐

**أهم أداة يمكنك صنعها، وتحميك من انفجار الجهاز بعد الإصلاح.**

```
       ┌── [لمبة تنجستن 60-100 وات] ──┐
220V ──┤                               ├── [البريزة التي يوصل بها الجهاز]
       └───────────────────────────────┘
       (اللمبة على التوالي مع الحي فقط)
```
**قراءة النتيجة:**
- اللمبة تضيء بقوة **وتستمر** → قصر في الجهاز، لا تشغّله على 220 مباشرة.
- تضيء لحظة ثم **تخفت** → شحن المكثفات طبيعي، الجهاز على الأرجح سليم.
- لا تضيء إطلاقًا → لا يمر تيار (فيوز/دائرة مفتوحة).

⚠️ استخدم لمبة تنجستن قديمة، لا LED (لا تعمل كمقاومة محدودة).

### 32.2 محمّل وهمي (Dummy Load)

لاختبار مصدر طاقة تحت حمل حقيقي:
- مقاومات قدرة (مثلًا 10 أوم / 50 وات) مثبتة على مشتت حراري.
- أو لمبات سيارة 12V (رخيصة وتُظهر الحمل بصريًا).
- **الفائدة:** كثير من مصادر الطاقة تعطي جهدًا سليمًا بلا حمل وتنهار تحته.

### 32.3 محول عزل من محولين

```
[220V] → [محول 220/24V] → [محول 24/220V معكوس] → [220V معزول]
```
- الخرج معزول تمامًا عن أرضي المبنى.
- ⚠️ القدرة محدودة بأصغر المحولين، والجهد ينخفض قليلًا تحت الحمل.
- يُستخدم عند العمل بالأوسيلوسكوب على الجانب الساخن.

### 32.4 كاشف تسريب/جهد بسيط

مقاومة 1 ميجا أوم + LED بين نقطة القياس والأرضي — كاشف بدائي لكنه مفيد للفحص السريع.

### 32.5 حامل بورد (PCB Holder)

مشابك تمساح مثبتة على قاعدة خشبية ثقيلة، أو مشبك تثبيت من ورشة نجارة. اليد الثالثة تضاعف جودة اللحام.

### 32.6 صندوق مكونات مرجعي

اجمع من بوردات تالفة: مقاومات شائعة، مكثفات سيراميك، دايودات، ترانزستورات، موصلات، براغي. رتّبها ووثّقها — 70% من الإصلاحات ستجد قطعتها عندك.

### 32.7 بنك اختبار جهد

مصدر جهد متغير مع **حد تيار (Current Limit)** — يمكن شراؤه رخيصًا أو بناؤه من وحدة تغذية لابتوب + وحدة Buck Converter بشاشة.
**الاستخدام الذهبي:** اضبط الحد على 100 مللي أمبير وغذِّ البورد. إذا وصل التيار للحد فورًا، هناك قصر — وستشعر بالمكون المقصور ساخنًا بإصبعك دون تدمير أي شيء.

## الفصل 33: التخلص الآمن من النفايات

### 33.1 لماذا يهم

النفايات الإلكترونية تحتوي رصاصًا وزئبقًا وكادميومًا وأحماضًا. رميها في القمامة العادية يلوث المياه الجوفية، وفي كثير من الدول مخالفة قانونية.

| النوع | الخطر | التخلص الصحيح |
|---|---|---|
| **بطاريات ليثيوم** | ⚠️ حريق في شاحنات القمامة (حوادث موثقة كثيرة) | مراكز تجميع مخصصة، بأقطاب معزولة بشريط |
| **بطاريات رصاص** | رصاص وحمض | يُعاد تدويرها — محلات البطاريات تشتريها |
| **مكثفات قديمة (قبل 1980)** | قد تحتوي PCBs سامة | تعامل معها كنفاية خطرة |
| **لمبات فلورسنت/نيون** | ⚠️ زئبق | لا تكسرها — مراكز مخصصة |
| **غاز الفريون** | تدمير أوزون واحتباس حراري | استرجاع بجهاز Recovery — التفريغ للجو محظور |
| **زيت الضاغط** | ملوّث | جمع منفصل |
| **بوردات إلكترونية** | معادن ثقيلة + معادن ثمينة | معيدو تدوير معتمدون |
| **شاشات CRT** | ⚠️ رصاص في الزجاج + أنبوب مفرّغ ينفجر عند الكسر | مراكز مخصصة فقط |

### 33.2 ممارسات جيدة في الورشة

- افصل النفايات بحاويات مسماة.
- **اعزل أقطاب أي بطارية** بشريط لاصق قبل التخزين أو الرمي.
- احفظ القصدير والفلكس المستهلك ونظّف مكان العمل — غبار الرصاص يتراكم.
- **اغسل يديك بعد كل جلسة لحام** — خصوصًا قبل الأكل.
- خزّن المذيبات والكحول بعيدًا عن الحرارة وفي حاويات محكمة.
- بِع خردة النحاس والألومنيوم — دخل إضافي وتقليل نفايات.

## الفصل 34: المعايير وعلامات الاعتماد

### 34.1 المعايير التي ستقابلها

| المعيار | ماذا يغطي |
|---|---|
| **IEC 60335** | ⭐ سلامة الأجهزة المنزلية — المرجع العالمي الأساسي |
| **IEC 60364 / BS 7671** | التركيبات الكهربائية في المباني |
| **IEC 61000** | التوافق الكهرومغناطيسي (EMC) |
| **IPC-A-610** | ⭐ معايير قبول اللحام والتجميع الإلكتروني — المرجع لجودة اللحام |
| **IPC J-STD-001** | متطلبات اللحام |
| **NFPA 70E** | السلامة الكهربائية في مكان العمل |
| **RoHS** | تقييد المواد الخطرة (الرصاص، الزئبق، الكادميوم) |
| **WEEE** | إدارة النفايات الإلكترونية |

### 34.2 جدول IP كامل (درجة الحماية)

**IP = الرقم الأول (صلب) + الرقم الثاني (سوائل)**

| الرقم الأول | الحماية من الأجسام الصلبة |
|---|---|
| 0 | لا حماية |
| 1 | أجسام > 50 مم (اليد) |
| 2 | > 12.5 مم (الإصبع) |
| 3 | > 2.5 مم (أدوات) |
| 4 | > 1 مم (أسلاك) |
| 5 | غبار محدود |
| 6 | مانع للغبار تمامًا |

| الرقم الثاني | الحماية من الماء |
|---|---|
| 0 | لا حماية |
| 1 | تنقيط رأسي |
| 2 | تنقيط بميل 15° |
| 3 | رذاذ بزاوية 60° |
| 4 | رذاذ من كل الاتجاهات |
| 5 | نفاثات ماء منخفضة الضغط |
| 6 | نفاثات قوية |
| 7 | الغمر حتى 1 متر / 30 دقيقة |
| 8 | الغمر المستمر (بشروط الصانع) |
| 9K | نفاثات ساخنة عالية الضغط |

**أمثلة تطبيقية:** وحدة مكيف خارجية عادةً IP24 · لمبة حمام IP44 · كشاف خارجي IP65 · جهاز غاطس IP68.

### 34.3 العلامات على الأجهزة

| العلامة | المعنى |
|---|---|
| **CE** | مطابقة أوروبية — ⚠️ توجد علامات مزيفة بحروف متقاربة أو نسب خاطئة؛ الشائع أن معناها «China Export» خرافة، فالعلامة المزيفة ببساطة تزوير. تحقق من إعلان المطابقة وبيانات الصانع |
| **UKCA** | المكافئ البريطاني |
| **UL / ETL** | اعتماد أمريكي — تحقق من رقم الملف |
| **⧈ (مربع داخل مربع)** | عزل مزدوج (Class II) — لا يحتاج أرضي |
| **⏚** | نقطة تأريض |
| **♻ / سلة مشطوبة** | لا تُرمى في القمامة العادية |
| **⚡ في مثلث** | تحذير جهد خطر |
| **رمز اللهب** | ⚠️ غاز قابل للاشتعال (R600a/R290) |

### 34.4 كشف الأجهزة المقلدة

- **لوحة بيانات ناقصة أو بأخطاء إملائية.**
- **سلك خفيف جدًا** مقارنة بالقدرة المعلنة (⭐ أوضح علامة).
- **وزن أخف** من المتوقع — نحاس أقل في المحول والموتور.
- **لا يوجد أرضي في جهاز Class I.**
- **علامات اعتماد بلا رقم ملف** أو غير قابلة للتحقق.
- **السعر أقل بكثير** من السوق.

> ⚠️ **الشواحن ووصلات الكهرباء المقلدة** أخطر ما في هذه الفئة — عزل غير كافٍ بين 220 والخرج، وأسلاك بمقطع أقل من المعلن تشتعل تحت الحمل.

## الفصل 35: أجهزة صغيرة متبقية

| الجهاز | المكونات | العطل الأشهر |
|---|---|---|
| **ماكينة الحلاقة** | بطارية + موتور صغير + دائرة شحن | ⭐ البطارية (NiMH/ليثيوم) — تُستبدل بلحام نقطي |
| **محطة البخار / المكواة البخارية** | مضخة + غلاية + ثيرموستات + فيوز حراري | ⭐ الترسبات الجيرية تسد المضخة |
| **المرطّب (Humidifier)** | مذبذب فوق صوتي أو عنصر تسخين + مروحة | ⭐ ترسبات على القرص المذبذب — نظّفه بالخل |
| **منقي الهواء** | مروحة + فلاتر + حساس جودة هواء | فلتر مسدود ← حساس متسخ بالغبار |
| **الميزان الرقمي** | خلايا حمل (Load Cells) + ADC | ⭐ خلية حمل تالفة بعد الحمل الزائد ← رطوبة على البورد |
| **المكواة البخارية اليدوية** | نفس المكواة + مضخة صغيرة | فوهة مسدودة بالجير |
| **فرشاة الأسنان الكهربائية** | شحن حثي + بطارية + موتور | البطارية ← تسريب ماء إلى الداخل |
| **الشواية الكهربائية** | عنصر + ثيرموستات + فيوز حراري | ⭐ الفيوز الحراري بسبب تراكم الدهون |
| **الخلاط اليدوي / الهاند بلندر** | موتور يونيفرسال + مفتاح | ⭐ المفتاح (استخدام مبلل) ← الفحمات |
| **الجهاز اللاسلكي (مثقاب/مكنسة)** | بطارية + BMS + موتور BLDC غالبًا | ⭐ خلية واحدة هابطة في الحزمة |
| **الراوتر / المودم** | SMPS صغير + معالج | ⭐ محول التغذية الخارجي (مكثفاته) — لا الراوتر نفسه |
| **كاميرا المراقبة** | حساس + IR LEDs + تغذية PoE أو 12V | ⭐ التغذية ← رطوبة داخل العدسة ← كابل مقطوع |
| **جرس الباب / الإنترفون** | محول صغير + مفتاح + سماعة | ⭐ زر الجرس (تآكل من المطر) ← المحول |

## الفصل 36: الطوارئ — ماذا تفعل في اللحظة

### 36.1 اشتعال جهاز كهربائي

```
[1] لا تستخدم الماء إطلاقًا
[2] افصل الكهرباء من القاطع الرئيسي إن كان الوصول آمنًا
[3] استخدم طفاية CO₂ أو مسحوق جاف من مسافة 2-3 متر عند القاعدة
[4] إن كان الحريق أكبر من طفاية واحدة: اخرج فورًا وأغلق الباب خلفك
[5] اتصل بالدفاع المدني من الخارج
[6] لا تعد للداخل لأي سبب
```
**⚠️ دخان الأجهزة الإلكترونية سام** — البلاستيك المحترق يطلق غازات قاتلة خلال أنفاس قليلة.

### 36.2 صعق كهربائي

```
[1] لا تلمس المصاب وهو متصل بالتيار
[2] افصل الكهرباء من القاطع (الأسرع والأأمن)
[3] إن تعذّر: أبعده بجسم عازل جاف (خشب، بلاستيك سميك) وأنت واقف على مادة عازلة
[4] اتصل بالإسعاف فورًا
[5] تحقق من التنفس والنبض — ابدأ CPR إن كنت مدربًا
[6] ⭐ حتى لو بدا المصاب بخير: يجب فحصه طبيًا — اضطراب نظم القلب قد يظهر بعد ساعات
[7] الحروق الكهربائية أعمق مما تبدو — الجرح الظاهر صغير والتلف الداخلي كبير
```

### 36.3 رائحة غاز

```
🚫 لا تشغّل ولا تطفئ أي مفتاح كهربائي (الشرارة تشعل)
🚫 لا تستخدم الموبايل داخل المكان
✅ افتح النوافذ والأبواب
✅ أغلق محبس الغاز الرئيسي
✅ أخرج الجميع
✅ اتصل بالطوارئ من خارج المبنى
```

### 36.4 تسريب ماء على جهاز يعمل

```
[1] افصل من القاطع لا من الفيشة (لمس الفيشة المبتلة خطر)
[2] لا تلمس الجهاز ولا الماء قبل التأكد من الفصل
[3] جفف تمامًا 24-48 ساعة قبل أي محاولة تشغيل
[4] لا تعِد التشغيل قبل اختبار العزل بالميجر
```

### 36.5 مكثف انفجر أثناء العمل

```
[1] ابتعد وهوّ المكان — الأبخرة مهيجة للرئة
[2] لا تلمس السائل المتناثر — قد يكون كاويًا
[3] إن أصاب العين: اغسلها بماء جارٍ 15 دقيقة واذهب للطوارئ
[4] نظّف المكان بقفازات ثم تخلص من المخلفات بأمان
```

### 36.6 محتويات صندوق إسعافات الورشة

```
□ ضمادات معقمة وشاش لحروق
□ جل حروق (لا زبدة ولا معجون أسنان)
□ محلول غسيل عيون
□ قفازات نيتريل
□ مقص وشريط لاصق طبي
□ أرقام الطوارئ ملصقة على الحائط
□ طفاية CO₂ سارية الصلاحية ومختبرة
□ ⭐ لافتة بموقع القاطع الرئيسي — يجب أن يعرفه كل من في المكان
```

## الفصل 38: المكتبة المرجعية — الكتب التي تبني الفني

> **ملاحظة منهجية:** ما يلي وصف تفصيلي لكل كتاب — منهجه، ما يغطيه، ما ستخرج به فعليًا، نقاط قوته وضعفه، وكيف تقرأه. هذا **دليل إلى الكتب لا بديل عنها**؛ النصوص نفسها ملك مؤلفيها ويجب اقتناؤها من مصادرها الشرعية. الهدف أن تعرف بالضبط أي كتاب تحتاجه الآن، ومن أين تبدأ فيه، وما الذي تتخطاه.

**بنية الكتاب:** مقسّم إلى خمس تجارب كبرى متدرجة، كل واحدة تبني على سابقتها. يبدأ بلمس بطارية بلسانك لتشعر بالتيار حرفيًا، ثم قصر بطارية عبر فيوز لترى الانصهار، ثم حرق مقاومة عمدًا لتفهم معنى "قدرة بالوات". ينتقل بعدها لبناء دوائر فعلية: جرس إنذار، قفل رقمي، مؤقت، ثم مشروع بمنطق رقمي.

**ما ستخرج به فعليًا:**
- حسّ فيزيائي بالجهد والتيار والمقاومة لا تعطيه المعادلات وحدها.
- إتقان اللحام من الصفر (فصل كامل عملي).
- فهم عملي للمكثف والملف والريلاي والترانزستور من خلال بنائها لا حفظها.
- الانتقال من اللوح التجريبي (Breadboard) إلى بورد ملحوم فعلي.

**نقاط قوته:** أفضل كتاب على الإطلاق لكسر حاجز الخوف. الصور ممتازة والشرح إنساني بلا استعلاء.
**نقاط ضعفه:** لا يعمّق النظرية. لن يعلمك تحليل دائرة أو قراءة داتاشيت بعمق.
**كيف تقرأه:** ⭐ **لا تقرأه — نفّذه.** اشترِ عدة المكونات المرافقة ونفّذ كل تجربة بيدك. قراءته دون تنفيذ تهدر 80% من قيمته.
**يقابل في دليلنا:** الفصلين 2 و3.

### 38.2 القسم الثاني: التشخيص والإصلاح

#### 📕 How to Diagnose and Fix Everything Electronic — Michael Jay Geier

| | |

| **المستوى** | مبتدئ إلى متوسط |
| **الناشر** | McGraw-Hill/TAB |

**بنيته:** يبدأ بفلسفة الإصلاح ولماذا "الأشياء تفشل"، ثم الأدوات وعدة العمل، ثم السلامة، ثم فصول عن أنواع الأعطال (كهربائية، ميكانيكية، حرارية، متقطعة)، ثم **منهجية التشخيص المنظمة**، ثم فصول عن اللحام والفك والتركيب، وفصول تطبيقية على فئات أجهزة (صوتيات، شاشات، أجهزة رقمية، مصادر طاقة).

**ما ستخرج به فعليًا:**
- ⭐ **عقلية التشخيص** — كيف تقسّم الجهاز لأقسام وتعزل العطل، وهي المهارة التي تفصل الفني عن مستبدل القطع.

**ضعفه:** لا يغطي الأجهزة المنزلية الكبيرة (غسالات، ثلاجات) ولا الأحمال العالية.
**كيف تقرأه:** ⭐ **اقرأه كاملًا بالترتيب — هذا استثناء.** فصول المنهجية هي جوهره ولا تُقرأ متفرقة.

2. **الأجهزة جهازًا جهازًا:** غسالات، مجففات، غسالات أطباق، ثلاجات وفريزرات، أفران ومواقد، ميكروويف، مكيفات، مبردات مياه، تخلص من النفايات، صانعات ثلج. كل جهاز يُعرض بنفس البنية: مبدأ العمل → المكونات → إجراءات الفك خطوة بخطوة → فحص كل مكون → جدول تشخيص شامل → مخطط الأسلاك.

- **إجراءات الفك والتركيب المصورة** لكل جهاز — أين المسامير المخفية وكيف تُرفع اللوحة.
- **قراءة مخططات الأسلاك (Wiring Diagrams)** الخاصة بالأجهزة، وهي مهارة نادرة ومهمة.
- فصول التبريد الأساسية والسلامة.

**قوته:** لا منافس له في مجاله. عملي بالكامل ومكتوب بواسطة فني ومدرّب.
**ضعفه:** موجّه للسوق الأمريكي (110 فولت، موديلات أمريكية) — المبادئ واحدة لكن التفاصيل تختلف. لا يغطي الإلكترونيات على مستوى المكون بعمق.
**كيف تقرأه:** ⭐ اقرأ القسم الأول كاملًا، ثم افتح فصل الجهاز الذي أمامك فقط. الكتاب مصمم لهذا الاستخدام.

### 38.4 القسم الرابع: الموتورات وأنظمة التحكم

#### 📗 Electric Motors and Drives — Austin Hughes & Bill Drury

| | |

**بنيته:** يبدأ بمبادئ تحويل الطاقة الكهرومغناطيسية، ثم موتور DC وتحكمه، ثم الإلكترونيات الطاقية (المقومات، المحولات، الإنفرترات)، ثم موتور الحث بالتفصيل، ثم **التحكم بتغيير التردد (VFD)** والتحكم الشعاعي (Vector Control)، ثم الموتورات المتزامنة والمغناطيس الدائم والخطوية.

**ما ستخرج به فعليًا:**
- ⭐ فهم حقيقي لكيفية عمل **الإنفرتر** — لماذا V/f ثابتة، ولماذا يسخن الموتور عند الترددات المنخفضة، ولماذا لا تُشغّل موتور إنفرتر على 220 مباشرة.

**كيف تقرأه:** ⭐ **الفصول عن موتور الحث والإنفرتر ضرورية لأي فني يعمل على مكيفات أو غسالات إنفرتر.** تقابل الفصلين 11 و12 في دليلنا.

**كيف تقرأه:** بالترتيب، مع رسم كل دائرة بيدك. الفهم يأتي من الرسم لا القراءة.

#### 📗 Electrical Motor Controls for Integrated Systems — Rockis & Mazur

#### 📗 Refrigeration and Air Conditioning Technology — Whitman, Johnson, Tomczyk, Silberstein

| | |
|---|---|

**بنيته:** مقسّم إلى وحدات (Units) قصيرة مركّزة، عشرات منها:
1. **الأساسيات:** الحرارة والضغط والمادة، قوانين الغازات، دورة التبريد.
2. **السلامة والأدوات:** أدوات التبريد، المانيفولد، مضخة التفريغ، أدوات اللحام.
3. **المكونات:** الضواغط بأنواعها، المكثفات، المبخرات، أجهزة التمدد (شعرية، TXV، إلكترونية)، الصمامات، المجففات.
4. **الكهرباء والتحكم:** أساسيات الكهرباء لفنيي التبريد، الموتورات، دوائر التحكم، مخططات الأسلاك، أجهزة التحكم الإلكترونية.
5. **التطبيقات:** تبريد منزلي، تجاري، أنظمة تكييف سكنية، أنظمة مركزية، مضخات حرارية، أنظمة إنفرتر.
6. **التشخيص:** استكشاف الأعطال بالضغوط، الشحن الصحيح، كشف التسرب، التفريغ، الاسترجاع.

**ما ستخرج به فعليًا:**

- **مخططات أسلاك أنظمة التكييف** وقراءتها.
- فهم Superheat و Subcooling وكيفية استخدامهما لضبط الشحنة.
- التعامل مع الغازات الجديدة والقابلة للاشتعال.

**قوته:** الوحدات القصيرة تجعله سهل الهضم رغم ضخامته. مصور بغزارة ومحدّث باستمرار.
**ضعفه:** ضخم وغالي، وموجّه للسوق الأمريكي في بعض التفاصيل التنظيمية.
**كيف تقرأه:** ⭐ اقرأ وحدات الأساسيات والسلامة، ثم وحدات الكهرباء والتحكم (تخدمك مباشرة كفني كهربائي)، ثم افتح وحدة النظام الذي تعمل عليه.

2. ابحث عن: `[الموديل] service manual` أو `[الموديل] schematic diagram`.

## ملحق د: أكواد الأخطاء الشائعة حسب الماركة

> ⚠️ الأكواد تختلف بين الموديلات حتى داخل الماركة الواحدة. استخدم الجدول للاسترشاد، وتحقق دائمًا بـ: `[الماركة] [الموديل] [الكود] error`.

### د-1: الغسالات الأوتوماتيك

| الماركة | كود عدم دخول الماء | كود عدم التصريف | كود عدم التسخين | كود الموتور | كود الاتزان/العصر | كود الباب |
|---|---|---|---|---|---|---|
| **سامسونج** | 4E / 4C | 5E / 5C | HE / HC | 3E / 3C | UE / UB | DE / DC |
| **LG** | IE | OE | HE | LE | UE | dE |
| **بوش / سيمنز** | E16, F16 | E18, F18 | F19, F20 | F21 | F23 | F01 |
| **بيكو / آركيلك** | H1 | H5 | H2 | H7 | — | E01 |
| **إنديست / أريستون** | F01-H2O | F05 | F07 | F01, F02 | — | F17 |
| **إلكترولوكس / زانوسي** | E11 | E21 | E61 | E51 | — | E40 |
| **وايت بوينت / توشيبا** | E1 | E2 | E5 | E3 | E4 | dr |
| **شارب / هيتاشي** | E1 | E2 | E5 | E7 | UE | dE |

**المعنى العملي لكل مجموعة:**

| المجموعة | افحص بهذا الترتيب |
|---|---|
| **لا يدخل ماء** | محبس المياه → فلتر خرطوم الدخول → صمام الماء → حساس الضغط → البورد |
| **لا يصرّف** | ⭐ فلتر الطلمبة → خرطوم التصريف مثنيّ/مسدود → الطلمبة → حساس الضغط |
| **لا يسخن** | السخان (قياس المقاومة) → NTC → ريلاي السخان على البورد |
| **عطل موتور** | ⭐ الفحمات → السير → التاكو → ترياك/إنفرتر الموتور |
| **عدم اتزان** | حمولة غير موزعة → أرجل غير مستوية → مسامير النقل لم تُفك → البيرنج → الأثقال |
| **الباب** | ⭐ قفل الباب (PTC) → وصلاته → البورد |

### د-2: المكيفات

| الماركة | فشل الاتصال داخلي/خارجي | حساس درجة حرارة الغرفة | حساس الملف الداخلي | حماية الكمبروسر/التيار | مروحة داخلية |
|---|---|---|---|---|---|
| **LG** | CH05 | CH01 | CH02 | CH04 / CH10 | CH06 |
| **سامسونج** | E1 / E101 | E121 | E122 | E458 / E463 | E154 |
| **جري / Gree** | E6 | F1 | F2 | H3 / E5 | — |
| **ميديا / كاريير** | E1 / E0 | E5 | E6 | P4 / P8 | E3 |
| **شارب** | E1 | E2 | E3 | E4 | E5 |
| **يونيون إير / فريش** | E1 | E2 | E3 | E4 / P1 | E5 |
| **دايكن** | U4 | A5/U0 | — | L5 / E6 | A6 |

**المعنى العملي:**

| المجموعة | افحص بهذا الترتيب |
|---|---|
| **فشل الاتصال** | ⭐ الأسلاك بين الوحدتين → ترتيب التوصيل → الأرضي → بورد داخلي → بورد خارجي |
| **حساس** | فك الحساس وقِس مقاومته وقارنها بمنحنى NTC → الموصل → البورد |
| **حماية تيار/ضغط** | نقص أو زيادة فريون → كندنسر متسخ → مروحة خارجية → مكثف → كمبروسر ضعيف |
| **مروحة** | ⭐ الموتور (BLDC غالبًا) → موصل التغذية → البورد |

### د-3: الثلاجات (No Frost)

| العرض/الكود العام | المعنى | افحص |
|---|---|---|
| كود حساس (rd, E1, F1) | حساس حرارة مفتوح أو مقصور | NTC الفريزر/الثلاجة/الديفروست |
| كود ديفروست (dH, Ed) | فشل دورة الإذابة | ⭐ سخان الديفروست → البيميتال → الفيوز الحراري → البورد |
| كود مروحة (FF, E5) | مروحة المبخر لا تدور | ثلج يعيقها → الموتور → التغذية |
| كود اتصال (CF, Er) | فشل بين بورد العرض والرئيسي | كابل الشريط المسطح → موصل مؤكسد |
| كود إنفرتر (IC, CE) | الكمبروسر لا يستجيب | بورد الإنفرتر → ملفات الكمبروسر → IPM |

### د-4: كيف تدخل وضع التشخيص

معظم الأجهزة بها **وضع اختبار (Test/Service Mode)** يشغّل كل مكون على حدة — أسرع طريقة للتشخيص.
- عادة: الضغط المطول على زرين معًا (مثلًا Temp + Spin) أثناء التشغيل.
- ابحث: `[الموديل] test mode` أو `[الموديل] diagnostic mode`.
- في الوضع هذا يمكنك تشغيل الطلمبة، الصمام، السخان، الموتور فرادى — يعزل العطل في دقائق.

**قواعد قراءة المخطط:**

**صيغ يومية:**
```
مقاومة عنصر تسخين      = 48400 ÷ القدرة بالوات   (على 220V)
التيار المتوقع          = القدرة ÷ 220
سعة المكيف المطلوبة     ≈ مساحة الغرفة (م²) × 600 BTU  (تقدير أولي)

القيمة العظمى لـ AC    = RMS × 1.414

الاستهلاك (kWh)        = (الوات × الساعات) ÷ 1000

## ملحق ك: أسئلة يسألها العملاء — إجابات جاهزة

| السؤال | الإجابة المختصرة |
|---|---|
| "هل الإصلاح يستاهل ولا أشتري جديد؟" | إذا تجاوزت التكلفة 50% من سعر جهاز جديد، أو الجهاز تجاوز 70% من عمره الافتراضي، فالاستبدال أوفر. |
| "ليه العطل رجع تاني؟" | إما لم يُعالج السبب الجذري (حرارة، جهد، رطوبة)، أو القطعة البديلة رديئة، أو هناك عطل ثانٍ مصاحب. |
| "هل أحتاج مثبت جهد؟" | إن كان جهد منطقتك يخرج عن 200-240 فولت أو ينقطع كثيرًا، نعم — خاصة للثلاجة والمكيف والشاشة. |
| "إيه الفرق بين المثبت ومانع الصواعق؟" | المثبت يعالج التذبذب البطيء. مانع الصواعق (SPD) يمتص القفزات اللحظية. وظيفتان مختلفتان، وقد تحتاج الاثنين. |
| "الجهاز بيدّي كهربا خفيفة، طبيعي؟" | ⚠️ **لا. أوقف استخدامه فورًا** — هذا تسريب وقد يقتل. يحتاج فحص عزل وتأريض. |
| "هل الإنفرتر يستاهل فرق السعر؟" | نعم للاستخدام الكثيف (المكيف أكثر من 6 ساعات يوميًا) — يسترد الفرق خلال 2-3 سنوات. لكن بورده أغلى في الإصلاح. |
| "كل قد إيه أنضف فلاتر المكيف؟" | كل أسبوعين في موسم الاستخدام. هذا وحده يوفر 10-15% كهرباء ويطيل عمر الجهاز. |
| "أطفي المكيف لما أخرج ولا أسيبه؟" | إن كان خروجًا أقل من ساعتين، ارفع الحرارة بدل الإطفاء. أكثر من ذلك، أطفئه. |
| "الغسالة بتنقل من مكانها، ليه؟" | الأرجل غير مستوية، أو مسامير النقل لم تُفك عند التركيب، أو الحمولة غير موزعة، أو الأثقال مفكوكة. |
| "ليه فاتورتي زادت فجأة؟" | راجع [الفصل 23](#ch23) — أشهر الأسباب: ثيرموستات سخان ملتصق، ثلاجة بجلد باب تالف، تسريب في شبكة المياه يشغّل الطلمبة. |
| "هل أقدر أصلح ده بنفسي؟" | إن كان فلترًا أو تنظيفًا أو استبدال بطارية أو سلك خارجي — نعم. أي شيء يتطلب فتح الجهاز وهو موصول بالكهرباء — لا. |
| "الميكروويف بيشرّر من جوه" | افصله ولا تستخدمه. غالبًا غطاء الويف جايد محترق — ويحتاج متخصصًا. |

الصيانة الناجحة ليست حفظ أعطال، بل **منهج تفكير**: افهم كيف يُفترض أن يعمل الجهاز، قارن بما يحدث فعلًا، وابحث عن نقطة الاختلاف. المكونات محدودة والمبادئ تتكرر — إذا أتقنت مصدر الطاقة والريلاي والحساس والموتور، تكون قد فهمت 90% من كل جهاز منزلي.

وقبل كل ذلك: **السلامة ليست فصلًا في الدليل، بل شرط لكل سطر فيه.**
