<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1B2026">
<title>مرجع صيانة الأجهزة الكهربائية والبوردات</title>
<meta name="description" content="مرجع تعليمي تفاعلي عربي: 56 فصلًا وملحقًا، 370 سؤالًا بشرح، 36 كتابًا مرجعيًا، 8 حاسبات ميدانية، بطاقات مراجعة وامتحان محاكاة وإجراءات طوارئ.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/21729ecdf27f.css" rel="stylesheet">
<style>/* لوحة أداة قياس: ورق رمادي بارد، لوحة فحمية، كهرماني تحذيري، نحاسي للمسارات، أخضر LCD للأرقام */
:root{
  --hh:58px;
  --paper:#E9EBEF; --card:#FFFFFF; --ink:#171A1F; --panel:#1B2026; --panel2:#252C34;
  --mute:#5C6672; --line:#CFD5DD; --amber:#E8A317; --copper:#B4703F; --lcd:#0F9D7A; --red:#C0392B;
  --fs:16px;
}
body.dark{--paper:#12161A;--card:#1A2027;--ink:#E4E8ED;--panel:#0D1114;--panel2:#1A2027;--mute:#8B95A1;--line:#2C343D;--lcd:#3FD1A8;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{overflow-x:clip;max-width:100%}
body{background:var(--paper);color:var(--ink);font:var(--fs)/1.75 "IBM Plex Sans Arabic","Noto Sans Arabic","Noto Kufi Arabic","Droid Arabic Naskh","Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif;direction:rtl}
.mono,code,pre,.val,b,.ro-i b{font-family:"IBM Plex Mono","DejaVu Sans Mono","Noto Sans Mono",ui-monospace,"Courier New",monospace;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}

/* الرأس */
header{position:sticky;top:0;z-index:50;background:var(--panel);color:#E9EBEF;border-bottom:3px solid var(--amber)}
.hbar{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1500px;margin:0 auto}
.brand{font-weight:700;letter-spacing:-.3px;white-space:nowrap;font-size:1.02rem}
.brand i{color:var(--amber);font-style:normal}
#gsearch{flex:1;min-width:80px;background:#0D1114;border:1px solid #333C46;color:#E9EBEF;border-radius:3px;padding:8px 12px;font:inherit;font-size:.9rem}
#gsearch:focus{outline:2px solid var(--amber);outline-offset:1px}
.tabs{display:flex;gap:2px}
.tab{padding:7px 13px;font-size:.87rem;border-radius:3px;color:#A8B2BE;white-space:nowrap}
.tab:hover{background:#2A323B;color:#fff}
.tab.on{background:var(--amber);color:#14171A;font-weight:600}
.iconbtn{background:#2A323B;border:0;color:#E9EBEF;width:34px;height:34px;border-radius:3px;cursor:pointer;font-size:1rem}
#menu{display:none}
/* شاشة القياس — العنصر المميز */
#readout{display:flex;gap:0;background:#0A0E11;border:1px solid #2C343D;border-radius:3px;overflow:hidden}
.ro-i{display:flex;flex-direction:column;align-items:center;padding:3px 13px;border-left:1px solid #2C343D}
.ro-i:last-child{border-left:0}
.ro-i b{color:var(--lcd);font-size:.95rem;line-height:1.2;text-shadow:0 0 8px rgba(63,209,168,.35)}
.ro-i i{font-style:normal;font-size:.62rem;color:#6B7683;letter-spacing:.5px}

/* التخطيط */
.wrap{display:grid;grid-template-columns:290px 1fr;max-width:1500px;margin:0 auto;gap:0;align-items:start}
aside{position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow-y:auto;border-left:1px solid var(--line);padding:14px 10px 40px;background:var(--card)}
#navsearch{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);font:inherit;font-size:.85rem;margin-bottom:10px}
.nv{display:flex;gap:9px;align-items:baseline;padding:6px 9px;border-radius:3px;font-size:.87rem;line-height:1.5;color:var(--mute)}
.nv:hover{background:var(--paper);color:var(--ink)}
.nv.cur{background:var(--panel);color:#fff}
.nv.cur .nv-k{color:var(--amber)}
.nv.done .nv-t::after{content:" ✓";color:var(--lcd);font-size:.75em}
.nv-k{font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;font-size:.72rem;color:var(--copper);min-width:20px;text-align:center;flex:none}
main{padding:26px 34px 90px;min-width:0;max-width:920px}

/* الواجهة الرئيسية */
.hero{padding:34px 0 24px;border-bottom:1px solid var(--line);margin-bottom:30px}
.hero-tag{display:inline-block;font-size:.7rem;letter-spacing:2.5px;color:var(--copper);border:1px solid var(--copper);padding:3px 11px;border-radius:2px;margin-bottom:18px}
.hero h1{font-size:clamp(1.9rem,4.6vw,3.1rem);line-height:1.18;font-weight:700;letter-spacing:-1px}
.hero-2{color:var(--copper)}
.hero-p{color:var(--mute);margin-top:14px;max-width:60ch;font-size:1.02rem}
.hero-stats{display:flex;gap:30px;margin:26px 0 22px;flex-wrap:wrap}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:1.7rem;color:var(--lcd);line-height:1}
.hero-stats i{font-style:normal;font-size:.75rem;color:var(--mute);letter-spacing:.5px;margin-top:3px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-block;padding:10px 20px;border:1px solid var(--line);border-radius:3px;font-size:.9rem;background:var(--card);cursor:pointer;color:inherit;font-family:inherit}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#14171A;font-weight:600}
.warn-strip{background:rgba(232,163,23,.14);border-right:4px solid var(--amber);padding:13px 16px;border-radius:3px;font-size:.92rem;margin-bottom:34px}
.sec-h{font-size:1.05rem;letter-spacing:.5px;color:var(--mute);text-transform:none;margin:36px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--line);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;transition:.15s}
.card:hover{border-color:var(--copper);transform:translateY(-2px)}
.card h3{font-size:.98rem;margin-bottom:5px;overflow-wrap:anywhere}
.card p{font-size:.83rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:5px 11px;font-size:.78rem;color:var(--mute)}
.chip:hover{border-color:var(--copper);color:var(--ink)}

/* الوثيقة */
.doc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.doc-n{font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;font-size:.72rem;color:var(--copper);letter-spacing:1px}
.mini{background:none;border:1px solid var(--line);border-radius:3px;padding:4px 10px;font:inherit;font-size:.78rem;cursor:pointer;color:var(--mute)}
.doc-h{overflow-wrap:anywhere;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.25;margin-bottom:22px;letter-spacing:-.6px;padding-bottom:12px;border-bottom:2px solid var(--copper)}
.doc h3,.hd.h3{font-size:1.22rem;margin:34px 0 12px;padding-right:12px;border-right:3px solid var(--amber);line-height:1.4}
.doc h4,.hd.h4{font-size:1.02rem;margin:24px 0 9px;color:var(--copper)}
.doc p{margin:12px 0}
.doc ul,.doc ol{margin:12px 26px 12px 0}
.doc li{margin:5px 0}
code{background:var(--paper);padding:1px 5px;border-radius:2px;font-size:.87em;border:1px solid var(--line)}
.val{color:var(--lcd);font-weight:600;font-size:.94em;white-space:nowrap}
body:not(.dark) .val{color:#0A7A5E}
pre.blk{background:var(--panel);color:#D6DCE3;padding:15px 17px;border-radius:4px;overflow-x:auto;font-size:.8rem;line-height:1.7;margin:16px 0;border-right:3px solid var(--copper);white-space:pre;direction:rtl;unicode-bidi:plaintext;text-align:right;tab-size:2}
blockquote{border-right:4px solid var(--amber);background:rgba(232,163,23,.1);padding:11px 16px;margin:16px 0;border-radius:0 3px 3px 0}
blockquote p{margin:5px 0}
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{background:var(--panel);color:#E9EBEF;text-align:right;padding:9px 12px;font-weight:600;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:rgba(0,0,0,.022)}
body.dark tbody tr:nth-child(even){background:rgba(255,255,255,.022)}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.xref{color:var(--copper);border-bottom:1px dotted var(--copper)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:.86rem}
.pager a{color:var(--copper)}
.back{font-size:.83rem;color:var(--copper);display:inline-block;margin-bottom:14px}

/* الأسئلة */
.qbox{margin-top:40px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:4px}
.qbox h4{margin:0 0 12px;color:var(--copper)}
.q{border:1px solid var(--line);border-radius:4px;padding:15px;margin:12px 0;background:var(--card)}
.q-t{font-weight:600;margin-bottom:11px!important;line-height:1.6}
.q-o{display:grid;gap:6px}
.opt{text-align:right;padding:9px 13px;border:1px solid var(--line);border-radius:3px;background:var(--paper);font:inherit;font-size:.89rem;cursor:pointer;color:inherit;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--copper)}
.opt:disabled{cursor:default;opacity:.75}
.opt.right{background:rgba(15,157,122,.16);border-color:var(--lcd);opacity:1;font-weight:600}
.opt.wrong{background:rgba(192,57,43,.12);border-color:var(--red);opacity:1}
.q-e{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:.88rem}
.q-verdict{display:block;margin-bottom:5px}
.q-verdict.ok{color:var(--lcd)}.q-verdict.no{color:var(--red)}
.q-ref{font-size:.75rem;color:var(--mute);font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace}
.q-cats .bar{height:3px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden}
.q-cats .bar i{display:block;height:100%;background:var(--lcd)}

/* المكتبة */
.lead{color:var(--mute);max-width:70ch;margin-bottom:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.fl{padding:6px 14px;border:1px solid var(--line);background:var(--card);border-radius:20px;font:inherit;font-size:.82rem;cursor:pointer;color:var(--mute)}
.fl.on{background:var(--panel);color:#fff;border-color:var(--panel)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;position:relative;transition:.15s}
.bk:hover{border-color:var(--copper);transform:translateY(-2px)}
.bk.star{border-right:3px solid var(--amber)}
.bk.star::after{content:"★";position:absolute;top:12px;left:14px;color:var(--amber)}
.bk-lvl{font-size:.67rem;letter-spacing:1px;color:var(--copper);margin-bottom:6px}
.bk h3{font-size:.96rem;line-height:1.4;margin-bottom:4px;overflow-wrap:anywhere}
.bk-au{font-size:.8rem;color:var(--mute)}
.bk-au.big{font-size:.95rem;margin-bottom:18px}
.bk-m{font-size:.82rem;color:var(--mute);margin-top:9px;line-height:1.6}
.bk-f{display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:.7rem;color:var(--mute)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px}
.meta div{background:var(--card);padding:11px 13px}
.meta i{display:block;font-style:normal;font-size:.68rem;color:var(--mute);letter-spacing:.5px;margin-bottom:2px}
.meta b{font-size:.88rem;font-family:inherit}
.cal{background:rgba(180,112,63,.1);border-right:3px solid var(--copper);padding:12px 15px;border-radius:0 3px 3px 0;margin-bottom:6px}
.cal b{display:block;font-size:.75rem;color:var(--copper);letter-spacing:1px;margin-bottom:3px;font-family:inherit}
ul.tick{list-style:none;margin-right:0!important}
ul.tick li{padding-right:22px;position:relative;margin:7px 0}
ul.tick li::before{content:"▸";position:absolute;right:0;color:var(--copper)}
ul.tick.out li::before{content:"✓";color:var(--lcd)}
ol.ideas{counter-reset:c;list-style:none;margin-right:0!important}
ol.ideas li{counter-increment:c;padding-right:34px;position:relative;margin:10px 0;line-height:1.7}
ol.ideas li::before{content:counter(c,decimal-leading-zero);position:absolute;right:0;top:2px;font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;font-size:.72rem;color:#fff;background:var(--panel);padding:1px 6px;border-radius:2px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.pc>div{padding:13px 15px;border-radius:4px;font-size:.87rem}
.pc-p{background:rgba(15,157,122,.1);border:1px solid rgba(15,157,122,.3)}
.pc-c{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.25)}
.pc b{display:block;margin-bottom:6px}
.pc ul{margin:0 18px 0 0}
.how{background:var(--panel);color:#E9EBEF;padding:15px 17px;border-radius:4px;margin:20px 0;border-right:3px solid var(--amber)}
.how b{display:block;color:var(--amber);font-size:.78rem;letter-spacing:1px;margin-bottom:4px;font-family:inherit}
.path{display:grid;gap:10px}
.pth{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.pth-n{font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;font-size:1.5rem;color:var(--copper);line-height:1;flex:none}
.pth b{display:block;font-family:inherit}
.pth i{font-style:normal;font-size:.72rem;color:var(--mute);letter-spacing:.5px}
.pth p{font-size:.83rem;color:var(--mute);margin-top:5px}

/* البحث */
.rs{font-size:.85rem;color:var(--mute);margin:22px 0 10px;letter-spacing:.5px}
.hit{display:block;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:11px 14px;margin-bottom:7px}
.hit:hover{border-color:var(--copper)}
.hit b{font-size:.9rem;font-family:inherit}
.hit p{font-size:.82rem;color:var(--mute);margin-top:3px}
mark{background:rgba(232,163,23,.4);color:inherit;padding:0 2px}
.empty{color:var(--mute);padding:40px 0;text-align:center}

@media(max-width:900px){
  #menu{display:block}
  .wrap{grid-template-columns:1fr}
  /* رأس من صفّين: الأدوات ثم شريط تبويبات قابل للسحب */
  .hbar{flex-wrap:wrap;padding:7px 10px;gap:8px;row-gap:7px}
  #menu{order:0}
  .brand{order:1;font-size:.82rem}
  #gsearch{order:2;flex:1 1 90px;font-size:.82rem;padding:7px 10px}
  #theme{order:3}
  #readout{order:4;display:flex;flex:1 0 100%;justify-content:space-around}
  .ro-i{padding:2px 8px}
  .tabs{order:5;flex:1 0 100%;overflow-x:auto;overscroll-behavior-x:contain;
        scrollbar-width:none;-ms-overflow-style:none;padding-bottom:1px;gap:4px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:6px 14px;font-size:.83rem}
  /* الدرج */
  aside{position:fixed;top:var(--hh);right:0;width:min(300px,84vw);height:calc(100dvh - var(--hh));
        z-index:45;transform:translateX(101%);transition:transform .22s ease;
        box-shadow:-10px 0 30px rgba(0,0,0,.3);will-change:transform}
  body.nav-open aside{transform:translateX(0)}
  body.nav-open{overflow:hidden}
  #scrim{position:fixed;inset:var(--hh) 0 0;background:rgba(0,0,0,.45);z-index:44;
         opacity:0;pointer-events:none;transition:opacity .22s}
  body.nav-open #scrim{opacity:1;pointer-events:auto}
  main{padding:16px 14px 80px;max-width:100%}
  .pc{grid-template-columns:1fr}
  .calc-f label{grid-template-columns:1fr 86px}
  .itoc ol{columns:1}
  .pf{grid-template-columns:1fr 64px 42px}
  .pf-n{display:none}
  .hero-stats{gap:20px}
  .hero-stats b{font-size:1.4rem}
  .exam-top{top:var(--hh)}
  .clock{font-size:1.15rem;padding:4px 12px}
  pre.blk{font-size:.72rem;padding:12px}
  table{font-size:.8rem}
  th,td{padding:7px 9px}
  #totop{bottom:16px;left:16px;width:40px;height:40px}
  .fc{padding:24px 18px;min-height:190px}
  .fc-q{font-size:1.04rem}
}
@media(max-width:420px){
  .brand{display:none}
  #gsearch{flex:1 1 120px}
  .hero h1{font-size:1.6rem}
  .result b{font-size:2.6rem}
}
@media print{header,aside,.pager,.qbox,.hero-cta{display:none}main{max-width:100%;padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ===== إضافات: شريط التقدم وزر أعلى ===== */
#rprog{position:fixed;top:0;right:0;height:3px;background:var(--lcd);z-index:99;width:0;transition:width .1s;box-shadow:0 0 8px rgba(63,209,168,.5)}
#totop{position:fixed;bottom:22px;left:22px;width:44px;height:44px;border-radius:50%;background:var(--panel);color:#fff;border:1px solid var(--copper);cursor:pointer;font-size:1.1rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#totop.show{opacity:1;pointer-events:auto}
#totop:hover{background:var(--copper)}

/* نسخ الكود */
.pw{position:relative}
.pw .cpy{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#D6DCE3;border-radius:3px;padding:3px 10px;font:inherit;font-size:.7rem;cursor:pointer;opacity:0;transition:.15s}
.pw:hover .cpy{opacity:1}
.pw .cpy:hover{background:var(--copper);border-color:var(--copper)}

/* فهرس داخل الفصل */
.itoc{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:11px 15px;margin-bottom:22px}
.itoc summary{cursor:pointer;font-size:.87rem;color:var(--copper);font-weight:600}
.itoc ol{margin:10px 20px 0 0;font-size:.85rem;columns:2;column-gap:26px}
.itoc li{margin:3px 0;break-inside:avoid}
.itoc a{color:var(--mute)}.itoc a:hover{color:var(--copper)}

/* الحاسبات */
.calcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.calc{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:17px;border-top:3px solid var(--copper)}
.calc h3{font-size:1rem;margin-bottom:3px}
.calc-d{font-size:.78rem;color:var(--mute);margin-bottom:12px}
.calc-f{display:grid;gap:8px;margin-bottom:12px}
.calc-f label{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:8px}
.calc-f span{font-size:.82rem;color:var(--mute)}
.calc-f input{padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;font-size:.88rem;text-align:center;width:100%}
.calc-f input:focus{outline:2px solid var(--amber);outline-offset:1px}
.calc-r{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:7px}
.calc-r div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.calc-r i{font-style:normal;font-size:.8rem;color:var(--mute)}
.calc-r b{font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;color:var(--lcd);font-size:.92rem;text-align:left}
body:not(.dark) .calc-r b{color:#0A7A5E}
.cerr{color:var(--red);font-size:.83rem}

/* البطاقات السريعة */
.fc-wrap{max-width:660px;margin:0 auto}
.fc-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:9px}
.fc-bar i{display:block;height:100%;background:var(--amber);transition:width .2s}
.fc-n{font-family:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;font-size:.73rem;color:var(--mute);margin-bottom:12px;letter-spacing:.5px}

## كيف تستخدم هذا الدليل

**هذا ليس كتابًا يُقرأ بالترتيب.** هو مرجع عمل. استخدمه هكذا:

| موقفك الآن | اذهب مباشرة إلى |
|---|---|
| مبتدئ تمامًا | [تحذير السلامة](#safety) ← [الفصل 1](#ch1) ← [الفصل 2](#ch2) ← [الفصل 3](#ch3) |
| أمامك جهاز معطل الآن | [فهرس الأجهزة](#dev-index) ثم [منهجية التشخيص 4.6](#ch4) |
| تعرف العَرَض ولا تعرف السبب | [الفهرس العكسي بالأعراض](#sym-index) |
| الجهاز يعطي كود خطأ | [ملحق د: أكواد الأخطاء](#ap-d) |
| تريد فحص مكون معين | [الفصل 3](#ch3) أو [بطاقة 4](#ap-h) |
| تريد التعلم بشكل منهجي | [الفصل 38: المكتبة ومسار القراءة](#ch38) |
| موقف طارئ الآن | [الفصل 36: الطوارئ](#ch36) |

### دليل الرموز المستخدمة

| الرمز | المعنى |
|---|---|
| ⚠️ | خطر على السلامة — اقرأ بعناية قبل التنفيذ |
| 🚫 | ممنوع تمامًا — لا استثناءات |
| 🚨 | حالة طوارئ فورية |
| ⭐ | السبب أو الحل الأكثر شيوعًا — ابدأ من هنا |
| ✅ | إجراء صحيح مطلوب |
| ❌ | معلومة خاطئة شائعة |
| ✗ | نتيجة قياس تعني أن المكون تالف |
| 💡 | نصيحة عملية |
| 🔍 | نقطة فحص بصري |
| 🔧 | ملاحظة مهنية |

### ⚖️ إخلاء مسؤولية

هذا الدليل مادة تعليمية عامة. الكهرباء تقتل، والأجهزة تختلف بين الموديلات والأسواق، واللوائح تختلف بين الدول.

- **أنت وحدك مسؤول عن سلامتك وسلامة من حولك ونتيجة عملك.**
- لا يغني هذا الدليل عن **دليل الخدمة الرسمي للموديل** ولا عن **الكود الكهربائي في بلدك**.
- الأعمال التي تتطلب ترخيصًا قانونيًا (التمديدات الثابتة، الثلاثي الطور، شحن الفريون، أعمال الغاز) **لا تُنفَّذ بدون ترخيص**.
- القيم والقياسات المذكورة **إرشادية** — القيمة المعتمدة دائمًا هي المذكورة في وثائق الصانع.
- عند أي شك: **توقف** ([الفصل 10](#ch10)).

## 🔎 الفهرس العكسي — من العَرَض إلى السبب

> ابدأ من العَرَض الذي تراه، لا من الجهاز.

### أعراض كهربائية عامة

| العَرَض | الأسباب مرتبة بالاحتمال | التفاصيل |
|---|---|---|
| **الجهاز ميت تمامًا** | ⭐ الفيشة/السلك → الفيوز → المفتاح → قسم القدرة في البورد | [ملحق ز-1](#ap-g) · [4.6](#ch4) |
| **القاطع العادي يفصل** | قصر (موسفت/قنطرة/ملف) → حمل زائد | [ملحق ز-2](#ap-g) · [6.2](#ch6) |
| **القاطع التفاضلي يفصل** | ⭐ تسريب: السخان → الموتور → رطوبة على البورد → مكثف Y | [ملحق ز-2](#ap-g) · [17](#ch17) |
| **صعقة أو "نمنمة" عند اللمس** | ⚠️ أرضي مفقود أو تسريب — أوقف الجهاز | [1.7](#ch1) · [17](#ch17) |
| **رائحة احتراق** | مقاومة/ملف/مكثف محترق → سلك ساخن → وصلة رخوة | [4.4](#ch4) · [36.1](#ch36) |
| **يعمل ثم يفصل بعد دقائق** | ⭐ حماية حرارية: تهوية مسدودة → مروحة متوقفة → حمل زائد | [3.9](#ch3) · [11.2](#ch11) |
| **يعمل أحيانًا ويفشل أحيانًا** | ⭐ لحام بارد → موصل مؤكسد → مكثف يتغير بالحرارة | [30](#ch30) |
| **يعمل باردًا ويفشل ساخنًا** | مكثف تالف → مكون شبه تالف | [30.2](#ch30) · [4.3](#ch4) |
| **الفيوز يحترق فورًا بعد الاستبدال** | ⚠️ قصر لم يُعالج — لا تكبّر الفيوز | [4.3](#ch4) · [37](#ch37) |
| **صوت صفير أو تكتكة من البورد** | قصر في الخرج → مكثف تالف → أوبتوكابلر | [4.3](#ch4) |
| **إعادة تشغيل عشوائية** | ⭐ تموّج زائد (مكثف جاف) → جهد غير مستقر | [16.4](#ch16) · [22](#ch22) |

### أعراض الموتورات

| العَرَض | السبب الأرجح | التفاصيل |
|---|---|---|
| **يطنّ ولا يدور** | ⭐ المكثف تالف → عالق ميكانيكيًا | [11.2](#ch11) · [5.3](#ch5) |
| **يدور ببطء أو بضعف** | مكثف ضعيف → بيرنج → سقوط جهد في الكابل | [11.7](#ch11) · [28.2](#ch28) |
| **شرر وضعف تدريجي** | ⭐ الفحمات مستهلكة | [5.2](#ch5) |
| **صرير أو هدير** | بيرنج/جلبة | [11.7](#ch11) |
| **يسخن بسرعة** | تهوية → حمل زائد → قصر بين اللفات | [11.2](#ch11) |
| **لا يدور نهائيًا في جهاز إنفرتر** | IPM → دائرة القيادة → الموتور | [12.3](#ch12) |

### أعراض التبريد والتسخين

| العَرَض | السبب الأرجح | التفاصيل |
|---|---|---|
| **لا يبرد والكمبروسر يعمل** | ⭐ فلاتر/كندنسر متسخ → نقص فريون → انسداد | [5.7](#ch5) · [25.5](#ch25) |
| **يبرد ثم يتوقف عن التبريد دوريًا** | ⭐ عطل ديفروست → تراكم ثلج | [5.4](#ch5) |
| **مياه على الأرضية** | ⭐ مجرى التصريف مسدود | [5.4](#ch5) · [5.7](#ch5) |
| **لا يسخن مع وجود كهرباء** | ⭐ الفيوز الحراري → العنصر → الثيرموستات | [5.1](#ch5) |
| **يسخن ولا يتوقف** | ⚠️ ثيرموستات ملتصق — خطر حريق | [5.1](#ch5) |

### أعراض المياه

| العَرَض | السبب الأرجح | التفاصيل |
|---|---|---|
| **لا يدخل ماء** | محبس → فلتر الخرطوم → صمام → حساس ضغط | [5.5](#ch5) |
| **لا يصرّف** | ⭐ فلتر الطلمبة → الطلمبة → خرطوم مثنيّ | [5.5](#ch5) |
| **يفيض أو يمتلئ باستمرار** | حساس الضغط أو خرطومه → صمام مقصور | [5.5](#ch5) |
| **تسريب ماء** | جلد الباب → خراطيم → صامولة السخان → أويل سيل | [5.5](#ch5) |

### أعراض الاتصال والذكاء

| العَرَض | السبب الأرجح | التفاصيل |
|---|---|---|
| **لا يستجيب للريموت** | بطارية → مستقبل IR → جرّب التشغيل اليدوي للتفريق | [5.7](#ch5) |
| **لا يستجيب للتطبيق فقط** | ⭐ الراوتر 5 جيجا → إشارة ضعيفة → السحابة | [29.2](#ch29) |
| **كود خطأ اتصال داخلي/خارجي** | ⭐ الأسلاك → الأرضي → البورد الداخلي | [15.4](#ch15) · [ملحق د-2](#ap-d) |
| **الجهاز يغيّر إعداداته وحده** | جدولة في التطبيق → حساب مشترك | [29.2](#ch29) |

## ⚠️ اقرأ هذا أولًا — تحذير السلامة

الكهرباء المنزلية (220 فولت) **تقتل**. تيار قدره 30 مللي أمبير فقط (0.03 أمبير) كافٍ لإيقاف القلب. لا تعتمد على "الخبرة" أو "الحظ".

**قواعد لا تُكسَر أبدًا:**

1. **افصل الجهاز من الكهرباء قبل أي فتح** — ليس مجرد إطفاء المفتاح، بل سحب الفيشة من البريزة.
2. **افترض أن كل سلك حي حتى تثبت العكس بالقياس** — قِس بالأفوميتر بنفسك، لا تصدق أحدًا.
3. **المكثفات تحتفظ بالشحنة بعد الفصل** — مكثف مصدر الطاقة (400V) ومكثف الميكروويف (2000V+) يمكن أن يصعقك بعد ساعات. فرّغها قبل اللمس.
4. **يد واحدة في العمل** — ضع يدك اليسرى في جيبك عند القياس على دائرة حية، حتى لا يمر التيار عبر صدرك.
5. **لا تعمل على أرضية رطبة أو وأنت مبلل** — ارتدِ حذاءً عازلًا، واستخدم سجادة مطاطية.
6. **لا تعمل بمفردك في الإصلاحات الخطرة** — يجب وجود شخص يستطيع فصل الكهرباء عنك.
7. **لا تُلغِ أبدًا وسيلة حماية** — الفيوز، الأرضي، القاطع التفاضلي. إذا احترق فيوز مرة أخرى، هناك عطل، لا تضع فيوز أكبر.

### أجهزة ممنوع على المبتدئ الاقتراب من داخلها

| الجهاز | السبب |
|---|---|
| **الميكروويف** | مكثف جهد عالٍ يخزن شحنة قاتلة + إشعاع الماغنترون. أعطاله يصلحها متخصص فقط. |
| **شاشات CRT القديمة** | أنبوب الصورة يخزن عشرات الآلاف من الفولت لأسابيع. |
| **الكاميرات/الفلاش وأجهزة الصعق** | مكثفات جهد عالٍ. |
| **السخانات وأجهزة التسخين المغمورة في الماء** | مزيج ماء + كهرباء. |
| **لوحة التوزيع الرئيسية للمنزل** | تخصص كهربائي مرخص. |

### كيف تفرّغ مكثفًا بأمان

استخدم مقاومة تفريغ (مثلًا 10 كيلو أوم / 5 وات) بأطراف معزولة، ضعها بين طرفي المكثف لمدة 10-30 ثانية، ثم **قِس الجهد بالأفوميتر للتأكد أنه صفر**. لا تُقصِّر أطراف المكثف بمفك — هذا يُتلف المكثف ويسبب شرارة خطيرة.

### الإسعاف عند الصعق

- **لا تلمس المصاب** وهو ملامس للكهرباء. افصل التيار من القاطع أولًا، أو أبعده بجسم عازل جاف (خشب، بلاستيك).
- اتصل بالإسعاف فورًا.
- إذا توقف التنفس، ابدأ إنعاش القلب والرئتين (CPR) إن كنت مدربًا.
- أي شخص تعرض لصعق من 220 فولت يجب أن يُفحص طبيًا حتى لو بدا بخير — اضطراب نظم القلب قد يظهر بعد ساعات.

## الفصل 1: أساسيات الكهرباء

### 1.1 الكميات الأربع الأساسية

| الكمية | الرمز | الوحدة | التشبيه المائي |
|---|---|---|---|
| الجهد (Voltage) | V | فولت (V) | ضغط الماء في الماسورة |
| التيار (Current) | I | أمبير (A) | كمية الماء المارّة |
| المقاومة (Resistance) | R | أوم (Ω) | ضيق الماسورة |
| القدرة (Power) | P | وات (W) | الشغل المنجز |

### 1.2 القوانين التي ستستخدمها يوميًا

```
قانون أوم:      V = I × R
                I = V / R
                R = V / I

القدرة:         P = V × I
                P = I² × R
                P = V² / R

في التيار المتردد:  P = V × I × cos φ   (معامل القدرة)
```

**أمثلة عملية:**
- سخان 2000 وات على 220 فولت: التيار = 2000 ÷ 220 = **9.1 أمبير**، ومقاومة عنصر التسخين = 220² ÷ 2000 = **24 أوم**. لو قِست العنصر ووجدته 24 أوم تقريبًا فهو سليم.
- لمبة 100 وات مقاومتها الساخنة = 220² ÷ 100 = 484 أوم (لكن الباردة أقل بكثير).

### 1.3 التيار المستمر (DC) والمتردد (AC)

**DC — تيار مستمر:**
- اتجاه ثابت وقيمة ثابتة.
- مصادره: البطاريات، محولات الشحن، مخرج مصدر الطاقة داخل الأجهزة.
- له قطبية: موجب (+) وسالب (−). عكس القطبية قد يدمر الدائرة.
- القيم الشائعة داخل البوردات: 3.3V, 5V, 12V, 24V, 310V (بعد التقويم).

**AC — تيار متردد:**
- يعكس اتجاهه دوريًا. في مصر ومعظم الشرق الأوسط: **220-240 فولت / 50 هرتز**.
- في أمريكا واليابان: 110-120 فولت / 60 هرتز.
- ليس له قطبية، لكن له **حي (Live/Phase)** و**متعادل (Neutral)** و**أرضي (Earth)**.

**قيم مهمة في AC:**
- 220V هي القيمة الفعالة (RMS). القيمة العظمى = 220 × 1.414 = **311 فولت**.
- لهذا يُقاس جهد المكثف بعد التقويم بحوالي 300-320 فولت DC، وهذا طبيعي.

### 1.4 الأسلاك الثلاثة ومعانيها

| السلك | اللون (النظام الأوروبي) | اللون (نظام قديم/محلي) | الوظيفة |
|---|---|---|---|
| الحي (Live/Phase) | بني | أحمر أو أسود | يحمل الجهد 220V |
| المتعادل (Neutral) | أزرق | أزرق أو أسود | مسار العودة، جهده ≈ 0 |
| الأرضي (Earth) | أصفر/أخضر مخطط | أصفر/أخضر | حماية — يصرّف التسريب للأرض |

> ⚠️ في التركيبات المحلية القديمة الألوان غير موثوقة إطلاقًا. **قِس دائمًا بالأفوميتر** ولا تعتمد على اللون.

**كيف تفرّق بينهما بالقياس:** ضع الأفوميتر على AC Voltage، الطرف الأسود على الأرضي، والأحمر على السلك المجهول. إذا قرأ ~220 فهو الحي، وإذا قرأ ~0 فهو المتعادل.

### 1.5 التوصيل على التوالي والتوازي

**التوالي (Series):** التيار واحد في كل العناصر، والجهد يتوزع.
```
R_total = R1 + R2 + R3
```
مثال: كسر في أي عنصر يقطع الدائرة كلها (مثل قدامى لمبات الكريسماس).

**التوازي (Parallel):** الجهد واحد على كل العناصر، والتيار يتوزع.
```
1/R_total = 1/R1 + 1/R2 + 1/R3
```
كل أجهزة المنزل موصّلة على التوازي — لهذا يعمل كل جهاز باستقلال عن الآخر.

### 1.6 النظام أحادي وثلاثي الطور

- **أحادي الطور (Single Phase):** حي + متعادل + أرضي = 220 فولت. للاستخدام المنزلي.
- **ثلاثي الطور (Three Phase):** 3 أطوار + متعادل + أرضي.
  - بين أي طور والمتعادل: 220 فولت.
  - بين أي طورين: **380 فولت** (220 × 1.732).
  - يُستخدم للمصاعد، المضخات الكبيرة، المكيفات المركزية، الورش.
  - ⚠️ خطورته مضاعفة، ولا يُعمل عليه إلا بترخيص وخبرة.

### 1.7 التأريض ولماذا هو مهم جدًا

الأرضي لا يفعل شيئًا في التشغيل الطبيعي — دوره يظهر عند العطل:

إذا لامس السلك الحي جسم الجهاز المعدني (غسالة، ثلاجة، سخان):
- **بدون أرضي:** جسم الجهاز يصبح حيًّا بـ220 فولت، وأول من يلمسه يُصعق.
- **مع أرضي:** التيار يجد مسارًا سهلًا للأرض، فيرتفع التيار فجأة ويفصل القاطع، ويصبح الجهاز آمنًا.

**اختبار وجود أرضي فعّال:** قِس الجهد AC بين الحي والأرضي — يجب أن يقرأ ~220V. ثم بين المتعادل والأرضي — يجب أن يقرأ أقل من 5 فولت. إن قرأ صفرًا بين الحي والأرضي، فالأرضي غير موصَّل.

### 1.8 وسائل الحماية

| الوسيلة | ماذا تحمي | كيف تعمل |
|---|---|---|
| **الفيوز (Fuse)** | الجهاز والأسلاك | سلك رفيع ينصهر عند زيادة التيار |
| **القاطع المصغر (MCB)** | الأسلاك من الحمل الزائد والقصر | يفصل ميكانيكيًا ومغناطيسيًا، وقابل لإعادة التشغيل |
| **القاطع التفاضلي (RCD / ELCB / RCCB)** | **الإنسان من الصعق** | يقارن التيار الداخل بالخارج، فإن اختلفا بأكثر من 30 مللي أمبير يفصل خلال 30 مللي ثانية |
| **MOV / مانع الصواعق** | البوردات من ارتفاع الجهد المفاجئ | مقاومة تنهار عند جهد معين فتقصّر الزيادة |
| **الفيوز الحراري (Thermal Fuse)** | من الحريق | ينصهر عند حرارة معينة (مثلًا 120°م) |

> 💡 القاطع التفاضلي (RCD/ELCB) هو **أهم استثمار في سلامة منزلك**. القاطع العادي لا يحميك من الصعق إطلاقًا، لأنه يفصل عند 10-30 أمبير بينما يقتلك 0.03 أمبير.

**اختبار الـRCD:** اضغط زر TEST عليه شهريًا — يجب أن يفصل فورًا.

### 1.9 قراءة لوحة بيانات الجهاز (Nameplate)

كل جهاز عليه ملصق يحمل معلومات حاسمة للصيانة:

```
Model: WM-8500          ← الموديل (ابحث به عن الـ Service Manual)
220-240V~ 50Hz          ← الجهد والتردد
2000W                   ← القدرة
9.1A                    ← التيار
IP24                    ← درجة الحماية من الغبار/الماء
Class I                 ← فئة العزل (I = يحتاج أرضي، II = عزل مزدوج ⧈)
S/N: ...                ← الرقم التسلسلي (يحدد نسخة البورد)
```

**فئات العزل:**
- **Class I:** له جسم معدني ويحتاج أرضي إجباريًا (غسالة، ثلاجة، فرن).
- **Class II (عزل مزدوج، رمزه مربع داخل مربع):** لا يحتاج أرضي (سشوار، شاحن، مثقاب).
- **Class III:** يعمل بجهد منخفض جدًا آمن (≤50V).

## الفصل 2: عدّة الصيانة والأدوات

### 2.1 الحد الأدنى للبداية

| الأداة | الاستخدام | ملاحظة الشراء |
|---|---|---|
| **أفوميتر رقمي (Digital Multimeter)** | القياس الأساسي لكل شيء | اختر واحدًا بتصنيف أمان **CAT III 600V** على الأقل |
| **كاوية لحام 40-60 وات بمنظم حرارة** | لحام المكونات | حرارة العمل 320-360°م |
| **قصدير 60/40 برصاص أو خالٍ من الرصاص** | | القصدير الرصاصي أسهل بكثير للمبتدئ |
| **شفاط قصدير (Solder Sucker) وضفيرة نحاس (Wick)** | فك المكونات | |
| **فلكس (Flux)** | تنظيف وتحسين اللحام | ضروري جدًا وليس رفاهية |
| **مجموعة مفكات دقيقة + مفكات عادية** | | تشمل رؤوس Torx و Hex |
| **كماشة قطع ومقص أسلاك وكاشطة عزل** | | |
| **كشاف/مصباح رأس + عدسة مكبرة** | فحص اللحامات والشقوق | |
| **قلم اختبار الجهد (Test Pen)** | كشف سريع للحي | للاسترشاد فقط، لا يُعتمد عليه للأمان |

### 2.2 أدوات المستوى المتوسط والمتقدم

| الأداة | الاستخدام |
|---|---|
| **محطة هوت إير (Hot Air Rework)** | فك وتركيب مكونات SMD |
| **جهاز قياس ESR** | كشف المكثفات التالفة **دون فكها** — أداة تشخيص خرافية |
| **جهاز فحص المكونات (LCR-T4 / Transistor Tester)** | يتعرف تلقائيًا على المكون ويعطي قيمه (رخيص جدًا وممتاز) |
| **أوسيلوسكوب (Oscilloscope)** | رؤية شكل الإشارة وترددها — لا غنى عنه لأعطال SMPS والتحكم |
| **مصدر جهد متغير (Bench Power Supply)** | تغذية البورد بجهد محدود لكشف القصر بأمان |
| **محول عزل (Isolation Transformer)** | ⭐ **أهم أداة أمان** عند العمل على بورد حي — يمنع الصعق عبر الأرض |
| **دياك/فاريك (Variac)** | رفع الجهد تدريجيًا لاختبار بورد بعد الإصلاح |
| **كاميرا حرارية أو مقياس حرارة IR** | كشف المكون الساخن أكثر من اللازم |
| **كلامب ميتر (Clamp Meter)** | قياس التيار دون قطع الدائرة |
| **مصدر تيار محدود / لمبة على التوالي** | حيلة قديمة: لمبة 100 وات على التوالي مع الجهاز — إذا أضاءت بقوة فهناك قصر |

### 2.3 استخدام الأفوميتر — الدليل العملي

#### أوضاع القياس والرموز

| الرمز | الوظيفة | متى تستخدمه |
|---|---|---|
| **V~ أو ACV** | جهد متردد | قياس 220 فولت، خرج المحول |
| **V⎓ أو DCV** | جهد مستمر | قياس خطوط البورد 5V/12V، البطاريات |
| **Ω** | المقاومة | قياس المقاومات، الملفات، عناصر التسخين |
| **🔊 (Continuity)** | اختبار الاستمرارية | ⭐ الأكثر استخدامًا — فحص الفيوز والأسلاك والقصر |
| **A⎓ / A~** | التيار | يجب توصيله **على التوالي** مع الحمل |
| **⊣⊢ (Diode)** | اختبار الدايود | فحص الدايودات والترانزستورات ووصلات أشباه الموصلات |
| **⊣⊦ (Capacitance)** | السعة | قياس المكثفات بالفاراد |
| **Hz** | التردد | |
| **hFE** | معامل تكبير الترانزستور | |

#### قواعد ذهبية للقياس

1. **قياس المقاومة والاستمرارية يكون على دائرة مفصولة تمامًا** — أي جهد موجود سيعطي قراءة خاطئة أو يتلف الجهاز.
2. **قياس الجهد يكون بالتوازي** (طرفا الأفوميتر على طرفي المكون).
3. **قياس التيار يكون بالتوالي** — يجب فتح الدائرة وإدخال الأفوميتر فيها. ⚠️ أشهر خطأ قاتل للأفوميتر: قياس التيار وأنت واضعه بالتوازي على 220 فولت — سيحترق الفيوز الداخلي أو ينفجر الجهاز.
4. **ابدأ دائمًا من أعلى مدى** إذا كان الأفوميتر يدويًا (Manual Range).
5. **قِس المكثفات بعد تفريغها فقط.**
6. **اختبر الأفوميتر نفسه أولًا:** لمّس الطرفين ببعض على وضع الاستمرارية — يجب أن يصفر.

#### الخطوات العملية الأكثر تكرارًا

**فحص فيوز:**
```
الوضع: Continuity 🔊
افصل الفيوز من مكانه ← ضع الطرفين على طرفيه
صفير + قراءة ~0 Ω  →  الفيوز سليم
لا صفير + OL / 1     →  الفيوز مقطوع  ✗
```

**فحص سلك أو كابل:**
```
الوضع: Continuity
افصل السلك تمامًا ← اختبر كل طرف مع مقابله
لا استمرارية → السلك مقطوع داخليًا (شائع جدًا عند مدخل الجهاز أو الفيشة)
حرّك السلك أثناء القياس — إذا تقطعت القراءة فهناك كسر متقطع
```

**فحص عنصر تسخين (سخان، مكواة، غلاية، فرن):**
```
الوضع: Ω
افصل الأطراف ← قِس بينهما
القراءة المتوقعة = 220² ÷ قدرة العنصر بالوات
مثال: عنصر 1500W  →  ~32 Ω
OL / لا نهاية  →  العنصر محروق ✗
```
ثم **الأهم — اختبار التسريب للجسم:**
```
الوضع: Ω على أعلى مدى
طرف على أحد أطراف العنصر ← طرف على جسم الجهاز المعدني
يجب أن تقرأ OL (لا نهاية)
أي قراءة أقل من 1 ميجا أوم = تسريب خطير، الجهاز غير آمن ✗
```

**فحص موتور أو ملف (Coil/Winding):**
```
الوضع: Ω
قياس مقاومة الملف: قيمة صغيرة (بضع أومات إلى مئات)
0 Ω تقريبًا  →  قصر داخلي بين اللفات ✗
OL           →  الملف مقطوع ✗
ثم قِس بين أي طرف والجسم: يجب OL — أي قراءة = تسريب ✗
```

**فحص دايود:**
```
الوضع: Diode ⊣⊢
الاتجاه الأمامي (الأحمر على الأنود): 0.4-0.7 فولت (سيليكون) أو 0.2-0.3 (شوتكي)
الاتجاه العكسي: OL
قراءة 0 في الاتجاهين  →  الدايود مقصور ✗
قراءة OL في الاتجاهين →  الدايود مفتوح ✗
```

**فحص مكثف إلكتروليتي:**
```
البصري أولًا: انتفاخ في الرأس، تسريب سائل بني، رفع من القاعدة → تالف ✗
الوضع: Capacitance
افصل المكثف (طرف واحد على الأقل) ← فرّغه ← قِس
القراءة يجب أن تكون ضمن ±20% من القيمة المكتوبة
⭐ لكن الأدق: قياس ESR — كثير من المكثفات تعطي سعة صحيحة وهي تالفة فعليًا
```

#### حيلة "قياس السقوط على الدايود" لتتبع القصر

على وضع الدايود، قِس الجهد بين خط التغذية والأرضي على البورد. إذا وجدت قراءة أقل من 0.05 فولت، فهناك مكون مقصور على هذا الخط. تحرك على طول الخط — أقل قراءة تكون عند المكون التالف.

### 2.4 عدة الحماية الشخصية

- نظارة أمان (شظايا اللحام والمكونات المنفجرة).
- قفازات عازلة عند العمل على جهد عالٍ.
- حذاء بنعل مطاطي وسجادة عازلة.
- تهوية جيدة أو شفاط أبخرة اللحام (أبخرة الفلكس ضارة للرئة).
- طفاية حريق من نوع CO₂ أو مسحوق جاف (**لا تستخدم الماء إطلاقًا على حريق كهربائي**).
- **سوار مضاد للكهرباء الساكنة (ESD)** عند لمس البوردات الرقمية — الشحنة الساكنة تدمر المعالجات دون أن تشعر.

## الفصل 3: المكونات الإلكترونية — الوظيفة والفحص

هذا الفصل هو مرجعك السريع. لكل مكون: ما يفعله، كيف تعرف أنه تالف، وكيف تختار البديل.

### 3.1 المقاومة (Resistor)

**الوظيفة:** تحديد التيار، تقسيم الجهد، تفريغ المكثفات، الاستشعار.

**القراءة بالألوان (4 حلقات):**

| اللون | الرقم | المضاعف | التفاوت |
|---|---|---|---|
| أسود | 0 | ×1 | — |
| بني | 1 | ×10 | ±1% |
| أحمر | 2 | ×100 | ±2% |
| برتقالي | 3 | ×1K | — |
| أصفر | 4 | ×10K | — |
| أخضر | 5 | ×100K | ±0.5% |
| أزرق | 6 | ×1M | ±0.25% |
| بنفسجي | 7 | ×10M | ±0.1% |
| رمادي | 8 | — | — |
| أبيض | 9 | — | — |
| ذهبي | — | ×0.1 | ±5% |
| فضي | — | ×0.01 | ±10% |

مثال: بني-أسود-أحمر-ذهبي = 1، 0، ×100 = **1000 أوم (1 كيلو) ±5%**

**على مقاومات SMD:** الرقم المكتوب مباشرة، مثل `103` = 10 × 10³ = 10 كيلو أوم. و`4R7` = 4.7 أوم. و`000` أو `0` = وصلة (Jumper).

**الفحص:** قِسها بعد فصل طرف واحد على الأقل (لتجنب تأثير الدائرة). الاسوداد أو التشقق علامة احتراق واضحة.

**⚠️ مهم:** المقاومة المحروقة **عرَض وليست سببًا**. ابحث دائمًا عن سبب احتراقها (غالبًا ترانزستور أو دايود مقصور بجوارها) وإلا ستحرق البديلة فورًا.

**البديل:** نفس القيمة، وقدرة (وات) مساوية أو أعلى.

### 3.2 المكثف (Capacitor)

**الوظيفة:** تنعيم الجهد، الترشيح، التمرير الترددي، التوقيت، بدء تشغيل الموتورات.

| النوع | الشكل | الاستخدام | القطبية |
|---|---|---|---|
| **إلكتروليتي** | أسطواني، له شريط سالب | تنعيم مصادر الطاقة | ⚠️ له قطبية |
| **سيراميك** | قرص أو SMD صغير | ترشيح الترددات العالية | لا |
| **فيلم/بولي إستر** | مستطيل أزرق أو أصفر | دوائر AC، مقاومة للجهد العالي | لا |
| **تانتالوم** | صغير برتقالي/SMD | دوائر رقمية | ⚠️ له قطبية، ينفجر عند العكس |
| **مكثف تشغيل الموتور (Run/Start)** | كبير في علبة معدنية | المراوح، الكمبروسر، الغسالات | لا |

**بيانات المكثف:** `470µF 25V 105°C`
- `470µF` = السعة
- `25V` = أقصى جهد (**البديل يجب أن يساوي أو يزيد، أبدًا لا يقل**)
- `105°C` = تحمّل الحرارة (**استخدم 105° دائمًا في مصادر الطاقة، لا 85°**)

**⭐ المكثفات الإلكتروليتية هي السبب رقم 1 لأعطال البوردات.** تجف مع الحرارة والزمن فتفقد سعتها ويرتفع ESR.

**علامات التلف:**
- انتفاخ الرأس (علامة + المحفورة تنبعج)
- تسرب سائل بني أو أبيض حول القاعدة
- ارتفاع المكثف عن سطح البورد
- صدأ أو تآكل حول أرجله
- **ESR مرتفع** (السبب الأخفى — قد يبدو المكثف سليمًا تمامًا بالعين)

**جدول ESR التقريبي للمكثف السليم:**

| السعة | ESR مقبول |
|---|---|
| 1-10 µF | أقل من 3 Ω |
| 22-100 µF | أقل من 1 Ω |
| 220-1000 µF | أقل من 0.3 Ω |
| 2200 µF فأكثر | أقل من 0.1 Ω |

> 💡 قاعدة عملية للفنيين: عند إصلاح مصدر طاقة، **غيّر كل المكثفات الإلكتروليتية دفعة واحدة**، حتى السليمة ظاهريًا. أرخص وأضمن من العودة بعد شهر.

**مكثف تشغيل الموتور (شائع في المراوح والغسالات والمكيفات):**
- القيمة بالميكروفاراد مطبوعة عليه (مثلًا 2.5µF, 35µF, 450V).
- عند تلفه: الموتور يطنّ ولا يدور، أو يدور ببطء، أو يحتاج دفعة يدوية.
- الفحص: قِس السعة بالأفوميتر. أقل من 80% من القيمة = يُستبدل.
- ⚠️ فرّغه قبل اللمس، وأبدله بنفس القيمة والجهد أو أعلى جهدًا.

### 3.3 الملف والمحول (Inductor & Transformer)

**الملف:** يقاوم تغير التيار، يُستخدم في الترشيح ودوائر التبديل.
**المحول:** يرفع أو يخفض جهد AC، ويوفر عزلًا كهربائيًا بين الابتدائي والثانوي.

**الفحص:**
```
1. مقاومة الابتدائي: عشرات إلى مئات الأومات (حسب الحجم)
2. مقاومة الثانوي: أقل بكثير عادة
3. بين الابتدائي والثانوي: يجب OL تمامًا (العزل)
4. بين أي ملف والقلب المعدني: يجب OL
5. مع التغذية: قِس جهد الخرج AC
```
**العطل الشائع:** الابتدائي مقطوع (OL) — غالبًا بسبب فيوز حراري داخلي مدفون في اللفات.

### 3.4 الدايود (Diode)

**الوظيفة:** يمرر التيار في اتجاه واحد. يُستخدم في التقويم والحماية.

| النوع | الاستخدام | السقوط الأمامي |
|---|---|---|
| قياسي (1N4007) | تقويم 220V | 0.7V |
| شوتكي | تبديل سريع، جهد منخفض | 0.2-0.3V |
| زينر | تثبيت جهد مرجعي | حسب النوع (3.3V, 5.1V, 12V...) |
| LED | إضاءة/بيان | 1.8-3.4V حسب اللون |
| قنطرة تقويم (Bridge) | تحويل AC إلى DC | 4 دايودات في علبة واحدة |

**الفحص:** كما شُرح في 2.3. الشريط على جسم الدايود = طرف الكاثود (السالب).

**قنطرة التقويم:** لها 4 أطراف — علامتا `~` للدخل AC، و`+` و`−` للخرج. اختبر كل دايود من الأربعة بين طرف AC و(+) ثم بين (−) وطرف AC.

### 3.5 الترانزستور (Transistor)

**الوظيفة:** تكبير الإشارة أو العمل كمفتاح إلكتروني (وهذا هو الاستخدام الأشيع في الأجهزة).

**BJT — ثنائي القطبية:** له 3 أطراف: القاعدة (B)، المجمّع (C)، الباعث (E). نوعان: NPN و PNP.

**الفحص كأنه دايودان:**
```
NPN (على وضع الدايود، الأحمر على B):
  B→C : 0.6-0.7V     B→E : 0.6-0.7V
  عكسيًا وبين C و E : OL
PNP: نفس الشيء لكن مع عكس الأطراف (الأسود على B)
أي قراءة قصر (0) بين أي طرفين = تالف ✗
```

**MOSFET:** له Gate (G)، Drain (D)، Source (S). يُستخدم بكثافة في مصادر الطاقة الحديثة والإنفرتر.
- بين D و S يوجد دايود داخلي (Body Diode) — يقرأ 0.4-0.6V في اتجاه واحد.
- بين G و S يجب أن يكون OL تمامًا. أي قراءة = تالف.
- **العطل الأشهر:** قصر تام بين الأطراف الثلاثة، وغالبًا مع انفجار مرئي.

**IGBT:** يجمع مزايا BJT و MOSFET، يُستخدم في الإندكشن والإنفرتر والمكيفات. يُفحص كالموسفت.

### 3.6 الثايرستور والترياك (SCR & TRIAC)

**الترياك:** مفتاح يتحكم في تيار AC — يُستخدم في **دِمَر الإضاءة، تحكم سرعة الموتور، سخانات الغسالات، الخلاطات**.
- 3 أطراف: MT1، MT2، Gate.
- **العطل الشائع:** قصر بين MT1 و MT2 → الحمل يعمل دائمًا ولا ينطفئ أبدًا (سخان يسخن طوال الوقت، موتور يدور على أعلى سرعة فقط).
- أو مفتوح → الحمل لا يعمل نهائيًا.
- **الفحص:** بين MT1 و MT2 يجب OL في الاتجاهين. أي استمرارية = تالف.

### 3.7 الأوبتوكابلر (Optocoupler / PC817)

**الوظيفة:** نقل إشارة بين دائرتين **مع عزل كهربائي تام** — أساسي في مصادر الطاقة (يعطي التغذية الراجعة من جانب الخرج المنخفض إلى المتحكم في جانب الـ220 الخطر).

**الفحص:** 4 أرجل. الجانب الأول LED (يُفحص كدايود: 1.1-1.3V أمامي)، الجانب الثاني ترانزستور ضوئي (OL في الاتجاهين بدون إضاءة).
- بين الجانبين: يجب OL تمامًا.
- **عطله يسبب:** خرج مرتفع جدًا أو منعدم، أو نبض/إعادة تشغيل مستمر في مصدر الطاقة.

### 3.8 الريلاي (Relay)

**الوظيفة:** مفتاح ميكانيكي يُشغَّل كهربائيًا — يفصل بين دائرة التحكم منخفضة الجهد ودائرة القدرة 220 فولت.

**أطرافه:** ملف (Coil) + نقاط تلامس: COM (مشترك)، NO (مفتوح عادة)، NC (مغلق عادة).

**الفحص:**
```
1. مقاومة الملف: 60-500 Ω تقريبًا (مكتوب جهده عليه: 5V, 12V, 24V)
   OL = الملف محروق ✗
2. النقاط في وضع الراحة: COM-NC استمرارية، COM-NO مفتوح
3. غذِّ الملف بجهده المقنن: يجب سماع "كليك" وانعكاس الحالة
4. إن سمعت الكليك ولم يعمل الحمل → النقاط محروقة/متآكلة ✗
```
**⭐ عطل شائع ومخادع:** الريلاي يُصدر صوت الطقطقة لكن نقاطه محترقة داخليًا فلا يمرر التيار. افتح غطاءه الشفاف وانظر — تجد النقاط سوداء.

### 3.9 حساسات الحرارة

| النوع | السلوك | الاستخدام |
|---|---|---|
| **NTC** | المقاومة **تقل** بارتفاع الحرارة | حساسات الثلاجة والمكيف والغسالة، والحد من تيار البدء في مصادر الطاقة |
| **PTC** | المقاومة **تزيد** بارتفاع الحرارة | حماية، بدء تشغيل كمبروسر الثلاجة |
| **مزدوج حراري (Thermocouple)** | يولّد جهدًا ضئيلًا | الأفران وأجهزة الحرارة العالية |
| **الثيرموستات الميكانيكي** | مفتاح يفتح/يغلق عند حرارة معينة | المكاوي، السخانات، الثلاجات القديمة |
| **الفيوز الحراري** | ينصهر نهائيًا عند حد معين | حماية من الحريق — **لا يُلغى أبدًا** |

**فحص NTC:** قِس مقاومته في حرارة الغرفة (قيمة شائعة 10 كيلو أوم عند 25°م)، ثم أمسكه بيدك أو قرّبه من مصدر دافئ — يجب أن **تنخفض** القراءة تدريجيًا. إن لم تتغير أو قرأت OL فهو تالف.

**فحص الفيوز الحراري:** استمرارية بسيطة. إذا انقطع، **ابحث عن سبب ارتفاع الحرارة** (مروحة متوقفة، فلتر مسدود، ثيرموستات تالف) قبل تركيب البديل.

### 3.10 الدوائر المتكاملة (ICs)

| النوع | مثال | الوظيفة |
|---|---|---|
| **منظمات الجهد الخطية** | 7805, 7812, LM317, AMS1117 | تثبيت 5V/12V/3.3V |
| **متحكمات SMPS** | UC3842, TL431, VIPer22A | التحكم في مصدر الطاقة |
| **المتحكم الدقيق (MCU)** | ATmega, STM8, PIC | "مخ" البورد — يشغل البرنامج |
| **ذاكرة EEPROM** | 24C02, 24C08 | تخزين الإعدادات والأعطال |
| **مشغلات الموتور** | IGBT modules, IPM | التحكم في الموتورات |

**فحص منظم 7805:**
```
له 3 أرجل: 1=دخل، 2=أرضي، 3=خرج
غذِّ الدخل بـ9-12 فولت ← يجب أن يخرج 5.00 فولت (±0.15)
إذا خرج 0 أو خرج نفس جهد الدخل → تالف ✗
إذا كان ساخنًا جدًا → هناك حمل مقصور بعده
```

**⚠️ عن الـMCU:** غالبًا لا يمكن استبداله لأنه مبرمج ببرنامج المصنع. إذا تلف، الحل هو **استبدال البورد كاملًا** أو شراء MCU مبرمج مسبقًا من مورد قطع الغيار.

### 3.11 البلورة (Crystal Oscillator)

تعطي النبضة الزمنية للمتحكم. عطلها يعني أن البورد **ميت تمامًا** رغم وجود التغذية.
**العلامة:** جهد التغذية سليم، لكن لا استجابة نهائيًا. تُفحص بالأوسيلوسكوب (يجب رؤية موجة جيبية) أو باستبدالها مباشرة.

## الفصل 4: البوردات الإلكترونية — البنية والعمل والتشخيص

### 4.1 ما هي البوردة ومم تتكون

البوردة (PCB) هي لوح عازل (فايبر جلاس FR4 غالبًا) مطبوع عليه مسارات نحاسية توصّل المكونات. البوردة في أي جهاز حديث تقوم بأربع وظائف مجتمعة:

```
┌─────────────────────────────────────────────────────┐
│  1. قسم القدرة (Power Section)                       │
│     يحوّل 220V AC إلى جهود منخفضة (5V, 12V, 3.3V)   │
├─────────────────────────────────────────────────────┤
│  2. قسم التحكم (Control Section)                     │
│     المتحكم MCU + الذاكرة + البلورة + دوائر Reset   │
├─────────────────────────────────────────────────────┤
│  3. قسم المدخلات (Inputs)                            │
│     الحساسات + الأزرار + مفاتيح الأمان               │
├─────────────────────────────────────────────────────┤
│  4. قسم المخرجات (Outputs / Drivers)                 │
│     ريلايات + ترياكات + موسفت → تشغيل الأحمال       │
└─────────────────────────────────────────────────────┘
```

**⭐ فهم هذا التقسيم هو نصف التشخيص.** كل عطل يقع في واحد من هذه الأقسام الأربعة، وتحديد القسم يوفر عليك ساعات.

### 4.2 أنواع البوردات في الأجهزة المنزلية

| النوع | الوظيفة | أمثلة |
|---|---|---|
| **بورد القدرة (Power Board)** | تحويل 220V إلى جهود التشغيل | كل جهاز إلكتروني |
| **البورد الرئيسي (Main/Mother Board)** | التحكم والمنطق | غسالة، ثلاجة إنفرتر، مكيف |
| **بورد العرض والأزرار (Display/Panel)** | واجهة المستخدم | لوحة الغسالة والميكروويف |
| **بورد الإنفرتر (Inverter Board)** | تحويل DC إلى AC متغير التردد للتحكم في سرعة الموتور | مكيفات وثلاجات وغسالات الإنفرتر |
| **بورد T-CON** | معالجة إشارة الصورة | الشاشات |
| **بورد التوصيل (Interface)** | نقل الإشارات فقط | بين الوحدة الداخلية والخارجية |

### 4.3 مصدر الطاقة النبضي (SMPS) — أهم قطعة تحتاج فهمها

**لماذا؟** لأن **أكثر من 60% من أعطال البوردات تكون في قسم القدرة**، وأغلبها قابل للإصلاح برخص.

#### تسلسل العمل خطوة بخطوة

```
220V AC
   ↓
[فيوز] ← الحماية الأولى
   ↓
[MOV / VDR] ← يمتص ارتفاعات الجهد
   ↓
[NTC] ← يحد من تيار الاندفاع اللحظي
   ↓
[فلتر EMI: ملف مزدوج + مكثفات X و Y] ← يمنع التشويش
   ↓
[قنطرة تقويم] ← تحول AC إلى DC نابض
   ↓
[مكثف رئيسي كبير 400V] ← ينعّم الجهد → ≈ 300-310V DC
   ↓
[موسفت التبديل + متحكم مثل UC3842] ← يقطّع الجهد بتردد 20-100 كيلو هرتز
   ↓
[محول عالي التردد] ← يخفض الجهد ويعزل تمامًا بين الجانبين
   ↓
[دايودات سريعة + مكثفات ترشيح] ← تقويم وتنعيم الخرج
   ↓
[TL431 + أوبتوكابلر] ← تغذية راجعة تحافظ على ثبات الخرج
   ↓
خرج نظيف: 12V, 5V, 3.3V
```

#### ⚠️ الجانب الساخن والجانب البارد

على البوردة يوجد **خط فاصل مرسوم** (شق أو خط أبيض) بين:
- **الجانب الساخن (Primary/Hot):** من مدخل 220 حتى المحول. **متصل مباشرة بالكهرباء — لمسه قاتل.**
- **الجانب البارد (Secondary/Cold):** بعد المحول. جهود منخفضة وآمنة نسبيًا.

> ⚠️ **لا تصل أرضي الأوسيلوسكوب بالجانب الساخن أبدًا دون محول عزل** — ستحدث شرارة وتدمر الجهاز وربما تُصعق.

#### أعطال SMPS وتشخيصها

| العَرَض | الأسباب المحتملة (بالترتيب) |
|---|---|
| **لا يوجد خرج نهائيًا + فيوز سليم** | مقاومة البدء (Startup Resistor) مقطوعة ← مكثف صغير 10-47µF على تغذية المتحكم جاف ← المتحكم تالف |
| **الفيوز محروق وأسود** | موسفت التبديل مقصور ← قنطرة تقويم مقصورة ← مكثف رئيسي منفجر |
| **صوت صفير/تكتكة متكررة** | قصر في الخرج ← مكثف خرج تالف ← أوبتوكابلر تالف ← حمل زائد |
| **الخرج موجود لكن أقل من المطلوب** | مكثفات الخرج جافة (ESR عالٍ) ← دايود خرج تالف |
| **الخرج أعلى من المطلوب** | ⚠️ خطر — TL431 أو الأوبتوكابلر تالف. افصل فورًا قبل أن يدمر باقي البورد |
| **يعمل ثم يفصل بعد ثوانٍ** | حماية تعمل بسبب حمل زائد ← مكثف تالف ← حرارة مفرطة |
| **يعمل باردًا ويفشل ساخنًا** | مكثف يتغير أداؤه بالحرارة — الشك الأول على المكثفات |

#### خطوات إصلاح SMPS عمليًا

```
1. افصل الجهاز ← فرّغ المكثف الكبير ← تأكد بالقياس أنه صفر
2. فحص بصري: انتفاخ مكثفات، سواد، شقوق، لحامات باردة، آثار حريق
3. اختبر الفيوز
4. اختبر قنطرة التقويم (4 دايودات)
5. اختبر موسفت التبديل (D-S-G)
6. اختبر مقاومة البدء (عادة 100K-470K) — تنقطع كثيرًا
7. قِس ESR لكل المكثفات الإلكتروليتية
8. اختبر الأوبتوكابلر و TL431
9. بعد الإصلاح: شغّل عبر لمبة 100 وات على التوالي أو فاريك
   - اللمبة تضيء بقوة وتستمر → لا يزال هناك قصر
   - تضيء لحظة ثم تخفت → سليم
```

### 4.4 الفحص البصري — أول 5 دقائق دائمًا

قبل أي قياس، افحص بعينيك وبالعدسة:

- 🔍 **انتفاخ أو تسريب المكثفات** — السبب الأول
- 🔍 **مناطق سوداء أو محروقة** — تتبع أثر الحريق لتصل للمكون الأصلي
- 🔍 **شقوق في البورد** (خصوصًا بعد سقوط الجهاز) — قد تقطع مسارًا نحاسيًا
- 🔍 **لحامات باردة/متشققة** — تظهر كحلقة داكنة حول رجل المكون. شائعة جدًا في المكونات الثقيلة (المحولات، الموصلات، الريلايات) بسبب اهتزاز الجهاز
- 🔍 **تآكل وصدأ أخضر** — من الرطوبة أو تسرب المكثف
- 🔍 **مسارات نحاسية محترقة أو منفصلة**
- 🔍 **حشرات وأتربة** — النمل والصراصير سبب واقعي شائع جدًا للقصر في البوردات
- 🔍 **رائحة الاحتراق** — شمّ البورد، الأنف أداة تشخيص حقيقية

**التنظيف:** كحول أيزوبروبيل 99% + فرشاة أسنان ناعمة، ثم تجفيف كامل قبل التشغيل.

### 4.5 قراءة البورد وتتبع المسارات

**رموز المكونات على البورد (Silkscreen):**

| الرمز | المكون |
|---|---|
| R | مقاومة |
| C | مكثف |
| L | ملف |
| D / ZD | دايود / دايود زينر |
| Q / T | ترانزستور |
| U / IC | دائرة متكاملة |
| F | فيوز |
| RY / K | ريلاي |
| J / CN / CON | موصل (كونكتور) |
| TP | نقطة اختبار (Test Point) |
| SW | مفتاح |
| X / Y | بلورة |

**تتبع مسار:** ضع الأفوميتر على الاستمرارية وابحث عن النقاط التي تصفر معًا. سجّل النتائج على ورقة أو ارسم مخططًا مبسطًا. هذه الطريقة تكشف لك الدائرة دون Service Manual.

**نقاط الاختبار (TP):** المصنّعون يضعونها عمدًا لتسهيل القياس — ابحث عنها أولًا.

**⭐ نصيحة ذهبية:** **صوّر البورد بالموبايل من الجانبين قبل فك أي شيء.** ستحتاج الصور عند إعادة التركيب.

### 4.6 منهجية تشخيص عطل بورد — خطوة بخطوة

```
[1] اجمع المعلومات
    ما العَرَض بالضبط؟ متى بدأ؟ هل سبقه صوت/رائحة/ارتفاع جهد؟
    هل حاول أحد إصلاحه من قبل؟ (ابحث عن آثار لحام غريبة)

[2] السلامة
    افصل ← فرّغ المكثفات ← تحقق بالقياس

[3] فحص بصري وشمّي شامل (5 دقائق)

[4] اختبر البسيط أولًا
    الفيشة ← السلك ← الفيوز ← المفاتيح ← الموصلات

[5] افحص التغذية
    هل تصل 220 إلى البورد؟
    هل تخرج الجهود المنخفضة (5V / 12V / 3.3V)؟
    ⭐ 80% من "البورد مات" سببه قسم القدرة فقط

[6] افحص المدخلات
    الحساسات، مفاتيح الأمان (باب الغسالة، غطاء المكنسة...)
    البورد يرفض العمل غالبًا لأن مفتاح أمان مفتوح، لا لأنه تالف

[7] افحص المخرجات
    هل يعطي البورد أمرًا للريلاي/الترياك؟ هل الحمل نفسه سليم؟
    ⭐ افصل الحمل واختبره منفصلًا — كثيرًا ما يكون الموتور هو التالف لا البورد

[8] العزل بالإحلال
    استبدل المكون المشكوك فيه أو افصله وراقب

[9] بعد الإصلاح: ابحث عن السبب الجذري
    لماذا احترق؟ ارتفاع جهد؟ حرارة؟ رطوبة؟ حمل زائد؟
    إن لم تعالج السبب سيتكرر العطل
```

### 4.7 قاعدة "الأرخص والأسهل أولًا"

رتّب شكوكك بهذا الترتيب دائمًا:

```
1. الفيشة والبريزة والسلك          ← أرخص وأسرع فحص
2. الفيوز
3. الموصلات (كونكتورات) المفكوكة أو المؤكسدة
4. مفاتيح الأمان والحساسات
5. المكثفات الإلكتروليتية
6. الريلايات والترياكات
7. أشباه الموصلات (موسفت، دايود، ترانزستور)
8. المتحكم MCU                     ← آخر شك وأصعب حل
```

> ❗ **لا تبدأ أبدًا من افتراض "البورد محروق"** — هذا أغلى حل وأقل الاحتمالات إحصائيًا.

### 4.8 اللحام وإعادة العمل

**الأساسيات:**
- حرارة الكاوية: 320-360°م للحام الرصاصي، 360-400°م للخالي من الرصاص.
- نظّف سن الكاوية باستمرار بإسفنجة مبللة أو سلك نحاسي.
- **سخّن الوصلة، لا القصدير** — ضع الكاوية على الرجل والمسار معًا لثانية، ثم أضف القصدير فيسيل عليهما.
- اللحام الجيد: مخروط لامع ناعم. اللحام السيئ: كرة باهتة مستديرة (لحام بارد).
- استخدم الفلكس بسخاء — يحدث فرقًا هائلًا.

**فك مكون:**
- ذو أرجل قليلة: شفاط قصدير أو ضفيرة نحاس.
- SMD صغير: كاوية بسنّين أو هوت إير عند 300-350°م.
- IC كبير أو BGA: هوت إير مع تسخين تدريجي وحماية المكونات المجاورة بشريط كابتون.

**إصلاح مسار مقطوع:** اكشط طبقة الحماية الخضراء على جانبي القطع بمشرط، ثم صِل بسلك نحاسي رفيع (سلك لف) والحمه في الطرفين.

**⚠️ حماية من الكهرباء الساكنة:** ارتدِ سوار ESD أو المس جسمًا معدنيًا مؤرضًا قبل لمس البورد، خصوصًا مع المتحكمات والذاكرة.

## الفصل 5: الأجهزة جهازًا جهازًا

### 5.1 الأجهزة الحرارية البسيطة (المكواة، الغلاية، السخان، التوستر، الدفاية)

**مبدأ العمل:** مقاومة تسخين + ثيرموستات يتحكم في الحرارة + فيوز حراري للحماية.

```
220V ← [فيوز حراري] ← [ثيرموستات] ← [عنصر التسخين] ← عودة
                 ↕
            [لمبة بيان]
```

| العطل | الفحص والسبب |
|---|---|
| لا يسخن نهائيًا، لا لمبة | السلك أو الفيشة مقطوعان ← الفيوز الحراري ← المفتاح |
| اللمبة تضيء ولا يسخن | عنصر التسخين مقطوع (قِسه: يجب أن يعطي مقاومة تتناسب مع قدرته) |
| يسخن بشدة ولا يتوقف | الثيرموستات ملتصق (مقصور) — **خطر حريق، أوقف الاستخدام فورًا** |
| يفصل قاطع المنزل | تسريب للجسم — قِس بين طرف العنصر والجسم، يجب OL |
| يعمل متقطعًا | كسر في السلك عند مدخل الجهاز (حرّك السلك أثناء القياس) |

**⭐ السبب الأول لأعطال هذه الأجهزة:** كسر السلك عند نقطة انثنائه بجوار الجهاز أو الفيشة.

**السخان الكهربائي (تسخين المياه) — نقاط أمان خاصة:**
- **الأرضي إجباري ولا تفاوض فيه.**
- فحص الأنود المغنيسيومي (يمنع تآكل الخزان) سنويًا.
- إزالة الترسبات الجيرية من العنصر — هي السبب الأول لاحتراقه.
- صمام الأمان (Pressure Relief) يجب أن يعمل — انسداده يعني خطر انفجار حقيقي.
- ⚠️ لا تفتح خزانًا مضغوطًا وهو ساخن.

### 5.2 الموتور اليونيفرسال (الخلاط، المفرمة، السشوار، المكنسة، المثقاب)

**مبدأ العمل:** موتور فرشاة (كربون) يعمل على AC و DC، عالي السرعة، عزمه عالٍ.

```
220V ← [مفتاح] ← [فحمة] ← [كوميتيتر] ← [ملف الأرمتير] ← [فحمة] ← [ملف الاستاتور] ← عودة
```

**الأعطال الشائعة مرتبة حسب التكرار:**

1. **الفحمات (الكربون) مستهلكة** — العَرَض: ضعف تدريجي، توقف، شرر شديد، رائحة. الحل: استبدال الفحمتين معًا. ⭐ **هذا أشيع عطل على الإطلاق.**
2. **الكوميتيتر (المبدّل) متسخ أو محروق** — نظّفه بورق سنفرة ناعم جدًا (1000) وشحّط بين شرائحه.
3. **الملف محروق** — رائحة احتراق واضحة، قصر أو انقطاع في القياس، تسريب للجسم.
4. **الرومان بلي (البيرنج) تالف** — صوت صرير، اهتزاز، الموتور ثقيل بالدوران يدويًا.
5. **الترياك/دائرة التحكم في السرعة** — يعمل على سرعة واحدة فقط أو لا يعمل.
6. **مفتاح الأمان** — الخلاط لا يعمل إذا لم يستقر الوعاء في مكانه (مفتاح صغير في القاعدة يتعطل كثيرًا).

**فحص الموتور:**
```
افصل الموتور من الدائرة
قِس بين طرفي الدخل: بضعة أومات إلى عشرات → سليم
OL → ملف مقطوع أو فحمة غير ملامسة
قِس بين أي طرف والجسم المعدني: يجب OL
أدر العمود يدويًا: يجب أن يدور بسلاسة دون خشونة
```

### 5.3 المروحة والشفاط

**مبدأ العمل:** موتور حث أحادي الطور بمكثف تشغيل.

| العطل | السبب الأرجح |
|---|---|
| **تطنّ ولا تدور، وتدور لو دفعتها بيدك** | ⭐ **مكثف التشغيل تالف** — العطل رقم 1 في المراوح |
| لا تعمل نهائيًا | فيوز حراري داخل الموتور ← السلك ← المفتاح |
| تدور ببطء | مكثف ضعيف ← بيرنج/جلبة جافة تحتاج تشحيم |
| تسخن وتفصل | ملف يقترب من التلف ← أتربة تسد التهوية |
| صوت عالٍ | جلبة/بيرنج تالف ← ريش غير متوازنة |

**استبدال المكثف:** اقرأ القيمة عليه (1.5µF، 2.5µF، 3.5µF شائعة) واشترِ نفسها بجهد 400V أو 450V. رخيص جدًا ويحل معظم أعطال المراوح.

### 5.4 الثلاجة والفريزر

#### كيف تعمل (دورة التبريد)

```
[الكمبروسر] يضغط غاز الفريون ← يصبح ساخنًا عالي الضغط
      ↓
[المكثف/الكندنسر] الشبكة الخلفية ← يتخلص من الحرارة ← يتحول لسائل
      ↓
[أنبوبة شعرية / صمام تمدد] ← يقل الضغط فجأة
      ↓
[المبخر/الإيفابوريتور] داخل الفريزر ← السائل يتبخر ← يمتص الحرارة = التبريد
      ↓
عودة للكمبروسر
```

#### المكونات الكهربائية

| المكون | الوظيفة | الفحص |
|---|---|---|
| **الكمبروسر** | قلب الجهاز | 3 أطراف: C (مشترك)، S (بدء)، R (تشغيل). قاعدة: C-S + C-R = S-R. أي طرف مع الجسم = OL |
| **الريلاي / PTC** | يوصل ملف البدء لحظات ثم يفصله | يهتز عند الرج (النوع القديم). PTC: مقاومة صغيرة باردًا |
| **حماية الأوفرلود (Overload)** | يفصل عند سخونة الكمبروسر | استمرارية باردًا |
| **الثيرموستات / الحساس NTC** | يقيس الحرارة ويأمر بالتشغيل | ميكانيكي: استمرارية على أعلى وضع. NTC: تتغير مقاومته بالحرارة |
| **مروحة المبخر (No Frost)** | توزيع الهواء البارد | 12V أو 220V حسب الموديل |
| **سخان الديفروست** | إذابة الثلج دوريًا | مقاومة 30-100 Ω |
| **مؤقت/بورد الديفروست** | يحدد دورات الإذابة | |
| **بيميتال / ثيرموستات الديفروست** | ينهي دورة الإذابة | يوصل عند البرودة، يفصل عند الدفء |
| **الفيوز الحراري** | حماية من ارتفاع حرارة سخان الديفروست | |

#### الأعطال الشائعة

| العَرَض | الأسباب المحتملة |
|---|---|
| **لا تعمل نهائيًا** | الكهرباء ← السلك ← الثيرموستات ← البورد ← ملف الكمبروسر محروق |
| **الكمبروسر يحاول ويفصل (كليك... كليك)** | ⭐ ريلاي البدء أو PTC تالف ← مكثف البدء ← الكمبروسر عالق ميكانيكيًا |
| **يعمل باستمرار ولا يبرد كفاية** | نقص فريون (تسريب) ← الكندنسر متسخ ← تراكم ثلج على المبخر ← جلد الباب تالف |
| **الفريزر يبرد والثلاجة لا** | ⭐ **عطل الديفروست** — الثلج يسد مجرى الهواء ← مروحة المبخر متوقفة |
| **تراكم ثلج كثيف على الجدار الخلفي (No Frost)** | سخان الديفروست ← البيميتال ← الفيوز الحراري ← المؤقت/البورد |
| **مياه على الأرضية أو داخل الدرج** | ⭐ **مجرى تصريف الديفروست مسدود** — نظّفه بسلك مرن وماء ساخن |
| **صوت عالٍ** | مروحة تلامس الثلج ← الكمبروسر على وشك التلف ← اهتزاز الأنابيب |
| **صدمة كهربائية خفيفة عند اللمس** | ⚠️ تسريب — تحقق من الأرضي فورًا وأوقف الاستخدام |

#### ثلاجات الإنفرتر

الكمبروسر يعمل بموتور DC بسرعات متغيرة عبر بورد إنفرتر. مميزاته: توفير طاقة وهدوء. عيوبه: **البورد باهظ الثمن وحساس لتقلبات الجهد**.
- استخدم **مثبت جهد (Stabilizer)** إجباريًا في المناطق ذات الجهد غير المستقر.
- عطل بورد الإنفرتر: الكمبروسر لا يدور نهائيًا رغم وجود التغذية، أو يعطي كود خطأ.
- تُفحص وحدة IPM (الموديول) على البورد كما يُفحص الموسفت.

> 🔧 **ملاحظة مهمة:** أعمال دائرة التبريد نفسها (شحن الفريون، اللحام، كشف التسريب) تحتاج معدات متخصصة ورخصة في كثير من الدول، لأن الفريون تحت ضغط عالٍ ومضر بيئيًا. الجزء الكهربائي هو ما يمكن للفني العادي إصلاحه.

### 5.5 الغسالة الأوتوماتيك

#### دورة العمل

```
[قفل الباب] → [ملء الماء عبر صمام كهربائي] → [حساس الضغط يوقف الملء]
→ [تسخين إن لزم] → [دوران الحلة ذهابًا وإيابًا] → [تصريف بالطلمبة]
→ [عصر بسرعة عالية] → [فتح القفل بعد التوقف]
```

#### المكونات ووظائفها

| المكون | الوظيفة | الفحص |
|---|---|---|
| **قفل الباب (Door Lock / PTC)** | يمنع التشغيل والباب مفتوح | استمرارية بعد التغذية. ⭐ **أكثر قطعة تتلف في الغسالات** |
| **صمام الماء (Solenoid Valve)** | يفتح دخول الماء | مقاومة الملف 3-5 كيلو أوم |
| **حساس الضغط (Pressure Switch)** | يقيس منسوب الماء بالهواء عبر خرطوم | انفخ في الخرطوم — يجب سماع كليكات متتالية |
| **السخان (Heating Element)** | تسخين الماء | 20-35 Ω. اختبر التسريب للجسم |
| **حساس الحرارة NTC** | قياس حرارة الماء | ~20 كيلو أوم في حرارة الغرفة (يختلف بالموديل) |
| **الموتور** | يونيفرسال (بفحمات) أو إنفرتر/BLDC | فحص الفحمات والملفات |
| **التاكو (Tacho Generator)** | يخبر البورد بسرعة الموتور | ملف صغير، مقاومته 50-200 Ω |
| **طلمبة التصريف** | إخراج الماء | 150-200 Ω. تنسد بالنقود والأزرار والشعر |
| **البورد الرئيسي** | إدارة كل شيء | |

#### الأعطال الشائعة

| العَرَض | الأسباب |
|---|---|
| **لا تعمل نهائيًا** | الكهرباء ← الفيوز ← ⭐ **قفل الباب** ← بورد القدرة |
| **لا تمتلئ بالماء** | محبس المياه مغلق ← فلتر الخرطوم مسدود ← صمام الماء تالف ← حساس الضغط |
| **تمتلئ باستمرار / تفيض** | ⭐ حساس الضغط أو خرطومه (مسدود بالصابون أو مثقوب) ← صمام ماء مقصور |
| **لا تصرّف الماء** | ⭐ **فلتر الطلمبة مسدود** (افحصه أولًا دائمًا) ← الطلمبة تالفة ← خرطوم التصريف مثنيّ |
| **لا تدور الحلة** | ⭐ فحمات الموتور ← السير مقطوع ← التاكو ← ترياك الموتور على البورد |
| **لا تعصر** | ماء متبقٍ (مشكلة تصريف) ← حمولة غير متزنة ← التاكو ← البيرنج |
| **لا تسخن** | السخان محروق ← NTC ← ريلاي السخان على البورد |
| **تفصل قاطع المنزل** | ⭐ **السخان مسرّب للجسم** (السبب الأشهر) ← الموتور ← رطوبة على البورد |
| **صوت عالٍ عند العصر** | ⭐ **البيرنج (الرومان بلي) تالف** ← جسم غريب بين الحلة والدرام ← الأثقال الخرسانية مفكوكة |
| **تسريب ماء** | جلدة الباب ← خراطيم ← صامولة السخان ← أويل سيل ← الحلة مشروخة |
| **تتوقف في منتصف البرنامج** | حساس حرارة ← البورد ← انقطاع كهرباء ← حماية حرارية للموتور |

**⭐ أكواد الأخطاء:** الغسالات الحديثة تعرض كودًا مثل E10, F05, 4E. **ابحث عن "موديل الغسالة + كود الخطأ"** — يوفر عليك ساعات تشخيص. الأكواد تختلف بين الماركات.

**نصيحة الصيانة الوقائية:** نظّف فلتر الطلمبة شهريًا، شغّل دورة ساخنة فارغة بالخل الأبيض شهريًا لإزالة الترسبات، اترك الباب مفتوحًا بعد الغسيل لمنع العفن.


### 5.5.1 مجفف الملابس (Dryer)

**مبدأ العمل:** موتور يدير الحلة ومروحة + عنصر تسخين (كهربائي) أو شعلة غاز + مسار هواء يمر بفلتر الوبر ويخرج للمدخنة أو يتكثف داخليًا.

```
هواء ← [عنصر تسخين] ← [الحلة الدوارة] ← [فلتر الوبر] ← [مروحة] ← خارج/مكثف
                            ↑
                    [ثيرموستات + فيوز حراري + حساس رطوبة]
```

**الأنواع:** تهوية خارجية (Vented) · تكثيف (Condenser) · مضخة حرارية (Heat Pump — الأكفأ والأحدث).

| العَرَض | السبب |
|---|---|
| **يدور ولا يسخن** | ⭐ **الفيوز الحراري** (الأشهر بفارق كبير) ← عنصر التسخين ← الثيرموستات ← ريلاي البورد |
| **يسخن ولا يدور** | ⭐ السير مقطوع ← بكرة الشد ← الموتور ← مكثف الموتور |
| **لا يعمل نهائيًا** | مفتاح الباب ← الفيوز الحراري ← السلك ← البورد |
| **الملابس تخرج مبللة رغم انتهاء الدورة** | ⭐ **مسار الهواء مسدود** ← حساس الرطوبة متسخ ← تحميل زائد |
| **يفصل بعد دقائق** | تهوية مسدودة → ارتفاع حرارة → الحماية تعمل |
| **صوت طحن أو صرير** | البكرات (Drum Rollers) ← منزلق الحلة ← بيرنج الموتور |
| **رائحة احتراق** | ⚠️ **وبر متراكم على العنصر — أوقف الجهاز فورًا** |

### ⚠️ خطر الحريق في المجففات

**مجففات الملابس من أكثر الأجهزة المنزلية تسببًا في حرائق المنازل عالميًا**، والسبب في الغالبية العظمى واحد: **تراكم الوبر (Lint)**.

```
✅ نظّف فلتر الوبر بعد كل دورة — بلا استثناء
✅ نظّف مجرى ومدخنة الخروج كل 6-12 شهرًا بالكامل
✅ استخدم مدخنة معدنية صلبة، لا بلاستيكية أو رقائقية مرنة
✅ تأكد أن المدخنة قصيرة وبأقل عدد أكواع ممكن
✅ افحص أن الهواء يخرج فعلًا من الفتحة الخارجية بقوة
🚫 لا تلغِ الفيوز الحراري إطلاقًا — إن انصهر فهناك سبب: نظّف المسار أولًا
🚫 لا تجفف قماشًا ملوثًا بزيوت أو مواد قابلة للاشتعال
🚫 لا تشغّل المجفف وأنت خارج المنزل أو نائم
```

**⭐ قاعدة تشخيصية:** إذا انصهر الفيوز الحراري، **لا تستبدله وحده**. الفيوز نجح في وظيفته — ابحث عن سبب ارتفاع الحرارة (انسداد المسار، مروحة ضعيفة، ثيرموستات تالف) وإلا سينصهر البديل خلال أيام أو يشتعل الجهاز.

### 5.6 غسالة الأطباق

مشابهة للغسالة في مبدأ التحكم، مع اختلافات:
- **مضخة دوران (Circulation Pump)** ترش الماء عبر الأذرع الدوارة.
- **أذرع الرش تنسد** ببقايا الطعام — أشهر سبب لضعف النظافة. فكّها ونظّف الفتحات بإبرة.
- **الفلاتر الثلاثية** يجب تنظيفها أسبوعيًا.
- **حساس التعكر (Turbidity Sensor)** يحدد قذارة الماء.
- **جهاز التليين (Water Softener)** يحتاج ملح مخصص — إهماله يسبب ترسبات تدمر السخان.
- **أعطال شائعة:** لا تصرّف (فلتر/طلمبة)، لا تسخن (السخان أو المضخة المدمجة)، تسريب (جلدة الباب أو حساس الفيضان في القاعدة).

### 5.7 المكيف (سبليت)

#### كيف يعمل

نفس دورة التبريد في الثلاجة، لكن موزعة على وحدتين:
- **الوحدة الداخلية:** المبخر + مروحة + بورد تحكم + حساسات + مستقبل ريموت.
- **الوحدة الخارجية:** الكمبروسر + المكثف + مروحة + المكثفات الكهربائية + الكونتاكتور/البورد.

#### المكونات الكهربائية

| المكون | ملاحظات |
|---|---|
| **مكثف الكمبروسر ومكثف المروحة** | ⭐ أكثر القطع تلفًا في المكيفات التقليدية. قيم شائعة: 35µF للكمبروسر، 2-4µF للمروحة |
| **الكونتاكتور** | ريلاي قدرة يشغل الكمبروسر (في الموديلات القديمة) |
| **حساسات الحرارة (NTC)** | حساس الغرفة، حساس الملف الداخلي، حساس الخارجي |
| **موتور السوينج (Stepper)** | يحرك الريشة |
| **البورد الداخلي** | يستقبل الريموت ويدير المنظومة |
| **بورد الإنفرتر (الخارجي)** | في مكيفات الإنفرتر — يتحكم في سرعة الكمبروسر |
| **صمام عكس الاتجاه (4-Way Valve)** | للتدفئة في المكيفات الحارّة/الباردة |

#### الأعطال الشائعة

| العَرَض | الأسباب |
|---|---|
| **لا يعمل نهائيًا** | القاطع ← الفيشة ← فيوز البورد ← بورد القدرة الداخلي |
| **لا يستجيب للريموت** | بطاريات الريموت ← مستقبل IR على الواجهة ← جرّب التشغيل بزر Manual للتفريق |
| **المروحة الداخلية تعمل والخارجية لا تعمل** | ⭐ مكثف الكمبروسر/المروحة ← الكونتاكتور ← حماية ضغط ← بورد خارجي |
| **يعمل ولا يبرد** | ⭐ **الفلاتر متسخة** (افحصها أولًا!) ← نقص فريون ← الكندنسر متسخ ← الكمبروسر ضعيف |
| **تسريب ماء من الوحدة الداخلية** | ⭐ **خرطوم/حوض التصريف مسدود** ← تجمد الملف بسبب اتساخ الفلتر أو نقص الفريون |
| **يفصل بعد دقائق** | حماية حرارية ← حساس تالف ← نقص/زيادة فريون ← جهد منخفض |
| **صوت أو اهتزاز** | ريشة المروحة مكسورة ← براغي مفكوكة ← بيرنج ← جسم غريب |
| **رائحة كريهة** | عفن على المبخر — نظّفه بمعقم مخصص |
| **كود خطأ على الشاشة** | ابحث بموديل الجهاز + الكود |

**⚠️ في مكيفات الإنفرتر:** التغذية للوحدة الخارجية تأتي **عبر البورد الداخلي**، وقياس الجهد بينهما بالأفوميتر العادي يعطي قراءات مضللة لأن الإشارة رقمية. تحتاج أوسيلوسكوب أو منهجية الشركة.

**الصيانة الوقائية:** نظّف الفلاتر كل أسبوعين، اغسل المبخر والكندنسر كل 6 أشهر، تأكد من ميل خرطوم التصريف.

### 5.8 الميكروويف — ⚠️ تحذير خاص

> ### 🚫 لا تفتح الميكروويف إن لم تكن متخصصًا مدربًا.
>
> **الأسباب:**
> - **المكثف عالي الجهد** يخزن شحنة بجهد يتجاوز **2000 فولت** وتبقى فيه بعد الفصل بساعات. لمسه **قاتل فورًا** — وقد قتل فنيين بالفعل.
> - **المحول عالي الجهد (HV Transformer)** يولد ~2000-4000 فولت.
> - **الماغنترون** يحتوي على عازل **بريليوم أوكسيد** — كسره واستنشاق غباره سامّ ومسبب للسرطان.
> - **تسرب الإشعاع** عند العبث بأقفال الباب أو تشوه الشبكة.

**ما يمكنك فعله بأمان:**
- تنظيف الداخل، استبدال الطبق الدوار والحلقة، استبدال لمبة الإضاءة (من الخارج).
- استبدال سلك الكهرباء.
- التأكد من أن الباب يغلق بإحكام ولا يوجد تشوه — **إن كان الباب متضررًا، توقف عن استخدام الجهاز نهائيًا**.

**علامات تستوجب التخلص من الجهاز أو الذهاب للمتخصص:**
- شرر أو أقواس كهربائية داخل التجويف (Arcing) — غالبًا غطاء الويف جايد (Waveguide Cover) محترق.
- الجهاز يعمل ولا يسخن — الماغنترون أو المحول أو الدايود عالي الجهد.
- رائحة احتراق أو صوت طنين غير معتاد.
- الباب لا يغلق بإحكام أو الأقفال مكسورة.
- يعمل والباب مفتوح — **خطر إشعاعي، افصله فورًا**.

### 5.9 الشاشات (LED / LCD)

**البوردات الرئيسية:**

| البورد | الوظيفة |
|---|---|
| **بورد القدرة (Power Supply)** | يحوّل 220V إلى 12V/24V + جهد الإضاءة الخلفية |
| **البورد الرئيسي (Main Board)** | معالجة الإشارة، المداخل HDMI/USB، النظام |
| **بورد T-CON** | يحول إشارة الفيديو لأوامر بيكسل |
| **شرائح LED الخلفية (Backlight)** | الإضاءة |

**تشخيص سريع:**

| العَرَض | التشخيص |
|---|---|
| **لا يوجد ضوء ولا ليد استعداد** | ⭐ بورد القدرة — افحص الفيوز والمكثفات المنتفخة |
| **ليد الاستعداد يضيء ولا تشتغل** | البورد الرئيسي ← جهد الاستعداد موجود لكن أمر التشغيل لا يصل |
| **صوت موجود وشاشة سوداء** | ⭐ **الإضاءة الخلفية (LED Backlight)** — سلّط كشافًا قويًا على الشاشة، إن رأيت صورة باهتة فالتشخيص مؤكد |
| **الصورة مقلوبة/مشوهة/خطوط عمودية** | بورد T-CON ← كابل LVDS ← الباناميل نفسه |
| **خطوط أفقية أو بقع** | غالبًا الباناميل — ⚠️ إصلاحه غير اقتصادي عادة |
| **الشاشة تعمل ثم تنطفئ بعد ثوانٍ** | ⭐ ليدة واحدة محترقة في الشريط تفعّل حماية الجهد |

**⭐ إصلاح الإضاءة الخلفية:** أشيع عطل في الشاشات الحديثة. يتطلب فك الباناميل بحذر شديد واستبدال شرائط LED. غير مناسب للمبتدئ (الباناميل هش جدًا وثمنه يعادل ثمن الشاشة).

### 5.10 المكنسة الكهربائية

| العطل | السبب |
|---|---|
| ضعف الشفط | ⭐ **الكيس/الحاوية ممتلئة ← الفلتر مسدود ← انسداد في الخرطوم** (بهذا الترتيب) |
| لا تعمل | السلك (خاصة عند آلية اللف التلقائي) ← المفتاح ← الفحمات |
| تسخن وتفصل | فلتر مسدود يمنع تبريد الموتور ← حماية حرارية |
| رائحة احتراق | الموتور أو حزام الفرشاة |
| صوت عالٍ | انسداد جزئي ← بيرنج الموتور |

**تنبيه:** استخدام المكنسة بدون فلتر يدمر الموتور. ولا تشفط أبدًا الماء أو الرماد الساخن أو المسحوق الناعم جدًا بمكنسة عادية.

### 5.11 الأفران الكهربائية وسخانات الإندكشن

**الفرن الكهربائي:**
- عناصر تسخين علوية وسفلية + مروحة (في الحمل الحراري) + ثيرموستات + مؤقت.
- **الأعطال:** عنصر محروق (يُرى فيه انتفاخ أو كسر)، ثيرموستات غير دقيق، فيوز حراري، بورد التحكم.
- ⚠️ الأفران تسحب تيارًا عاليًا (10-16 أمبير) — تأكد من أن السلك والبريزة مناسبان.

**سخان الإندكشن (Induction):**
- يعمل بملف يولد مجالًا مغناطيسيًا متغيرًا يسخّن قاع الإناء الحديدي مباشرة.
- المكونات الحساسة: **IGBT** (يحترق كثيرًا)، مكثف الرنين، مروحة التبريد، حساس حرارة.
- **الأعطال:** لا يتعرف على الإناء (حساس أو الإناء غير مغناطيسي)، يفصل بعد ثوانٍ (مروحة متوقفة/حرارة)، لا يعمل نهائيًا (IGBT مقصور — يُفحص كالموسفت).
- **الصيانة الوقائية:** نظّف مروحة التبريد وفتحات التهوية دوريًا — انسدادها هو السبب الأول لاحتراق الـIGBT.

### 5.12 الشواحن ومصادر الطاقة الصغيرة

- معظمها SMPS مصغّر (راجع 4.3).
- **الأعطال:** لا خرج (مقاومة البدء أو المكثف الصغير)، خرج ضعيف (مكثفات جافة)، سخونة زائدة.
- ⚠️ **الشواحن المقلدة الرخيصة خطر حقيقي** — كثير منها لا يحتوي عزلًا كافيًا بين 220 والخرج، وقد تصعقك عبر جهازك. اشترِ من مصدر موثوق.

### 5.13 المثبتات ومنظمات الجهد (Stabilizer) و UPS

**المثبت (Stabilizer):** يحافظ على 220 فولت عند تذبذب المصدر، عبر محول متعدد المآخذ وريلايات أو سيرفو.
- **الأعطال:** ريلاي محترق (الأشهر)، بورد التحكم، محول محروق.
- **ضروري** لحماية الثلاجات والمكيفات والشاشات في المناطق ذات الجهد غير المستقر.

**UPS:**
- **البطارية هي المكون الاستهلاكي** — عمرها 2-4 سنوات، وهي سبب 80% من الأعطال.
- علامات تلفها: زمن احتياطي قصير جدًا، انتفاخ البطارية، صفير مستمر.
- ⚠️ بطاريات الرصاص الحمضية تحتاج تهوية ولا تُثقب أو تُحرق.

## الفصل 6: التعامل مع كهرباء المنزل

### 6.1 لوحة التوزيع

```
عداد الكهرباء
   ↓
[القاطع الرئيسي] ← يفصل المنزل كله
   ↓
[القاطع التفاضلي RCD 30mA] ← حماية الأرواح
   ↓
┌────────┬────────┬────────┬────────┐
│ إنارة  │ برايز  │ مطبخ   │ مكيف   │  ← قواطع فرعية MCB
└────────┴────────┴────────┴────────┘
```

**مقاسات القواطع الشائعة:**

| الدائرة | القاطع | مقطع السلك |
|---|---|---|
| إنارة | 6-10 A | 1.5 مم² |
| برايز عامة | 16 A | 2.5 مم² |
| مطبخ / سخان | 20-25 A | 4 مم² |
| مكيف | 20-32 A | 4-6 مم² |
| رئيسي منزل | 40-63 A | 10-16 مم² |

> ⚠️ **لا تركّب قاطعًا أكبر من سعة السلك أبدًا.** القاطع يحمي السلك لا الجهاز. قاطع كبير على سلك رفيع = السلك يحترق قبل أن يفصل القاطع = حريق.

### 6.2 تشخيص مشاكل الكهرباء المنزلية

| المشكلة | الخطوات |
|---|---|
| **القاطع يفصل باستمرار** | 1) افصل كل الأجهزة على تلك الدائرة 2) أعد القاطع 3) وصّل الأجهزة واحدًا واحدًا 4) الجهاز الذي يُفصل عنده القاطع هو المتهم |
| **القاطع التفاضلي يفصل** | يعني **تسريب أرضي** — غالبًا سخان أو غسالة أو رطوبة في تمديد. نفس منهجية العزل |
| **بريزة لا تعمل** | افصل القاطع ← افتح البريزة ← ابحث عن سلك مفكوك أو محروق (شائع جدًا) |
| **البريزة ساخنة أو متغيرة اللون** | ⚠️ **خطر حريق فوري** — وصلة رخوة. افصل القاطع واستبدل البريزة |
| **اللمبات تخفت عند تشغيل جهاز** | حمل زائد على الدائرة ← وصلة رخوة ← مقطع سلك غير كافٍ |
| **صدمة خفيفة عند لمس جهاز** | ⚠️ **الأرضي مفقود أو هناك تسريب** — أوقف الجهاز وافحص التأريض |
| **رائحة بلاستيك محروق** | افصل الكهرباء فورًا وابحث عن المصدر — لا تؤجل |
| **صوت طقطقة من البريزة أو اللوحة** | شرارة داخلية — خطر حريق، افصل واستدعِ فنيًا |

### 6.3 قواعد التمديدات والوصلات

- **الوصلة الجيدة وصلة محكمة.** أكثر أسباب الحرائق الكهربائية هي وصلة رخوة تسخن تدريجيًا.
- استخدم **كلامات (Wago أو مرابط)** بدل لفّ الأسلاك ولصقها بشريط.
- لا تحمّل وصلة كهرباء (Extension) فوق طاقتها — اقرأ سعتها المكتوبة.
- **لا تربط وصلة بوصلة أخرى** (Daisy Chain).
- لا تمرر أسلاكًا تحت السجاد أو خلف الأثاث الثقيل.
- لا تخلط النحاس بالألومنيوم في وصلة مباشرة (تآكل جلفاني).
- افصل الأجهزة عالية القدرة عند السفر.

### 6.4 اللمبات والإضاءة

| المشكلة | السبب |
|---|---|
| لمبة LED ترفرف | دِمَر غير متوافق ← مصدر التغذية (Driver) داخل اللمبة |
| لمبة LED تحترق بسرعة | حرارة (كشاف مغلق بلا تهوية) ← جهد غير مستقر ← جودة رديئة |
| كشاف كامل لا يعمل | المفتاح ← الوصلات ← Driver الشريط |
| وميض خفيف بعد الإطفاء | مفتاح ذكي أو سلك مجاور يحرّض جهدًا — يُحل بمكثف/مقاومة موازية |

**⭐ ملاحظة مهمة:** كثير من لمبات LED تُرمى وهي سليمة — العطل في مصدر التغذية الصغير داخلها (مكثف أو مقاومة)، ويمكن إصلاحه. لكن ⚠️ كثير من هذه اللمبات **بلا عزل** ودائرتها متصلة مباشرة بالـ220 — لا تلمسها أثناء العمل.

## الفصل 8: الأخطاء العشرة الأكثر شيوعًا عند المبتدئين

1. **العمل والجهاز موصول بالكهرباء** — لا مبرر لهذا أبدًا في 95% من المهام.
2. **عدم تفريغ المكثفات** قبل اللمس.
3. **افتراض أن البورد تالف** قبل فحص السلك والفيوز والحساسات.
4. **استبدال الفيوز بأكبر منه** — أو بسلك نحاس. هذه وصفة حريق.
5. **إصلاح العَرَض دون السبب** — تغيير مقاومة محروقة دون معرفة ما أحرقها.
6. **عدم تصوير الجهاز قبل الفك** — ثم عدم معرفة مكان كل قطعة.
7. **إجبار القطع البلاستيكية** أثناء الفك — ابحث عن المسمار المخفي بدل الكسر.
8. **إهمال الحماية من الكهرباء الساكنة** عند لمس البوردات الرقمية.
9. **لحام بحرارة غير كافية** → لحام بارد يسبب عطلًا متقطعًا بعد أسابيع.
10. **تشغيل الجهاز بعد الإصلاح مباشرة على 220 كاملة** — استخدم لمبة على التوالي أو فاريك أولًا.

## الفصل 9: الصيانة الوقائية — جدول دوري

| الدورية | المهمة |
|---|---|
| **أسبوعيًا** | تنظيف فلتر غسالة الأطباق ← إفراغ حاوية المكنسة |
| **كل أسبوعين** | غسل فلاتر المكيف |
| **شهريًا** | فلتر طلمبة الغسالة ← اختبار زر TEST في القاطع التفاضلي ← فحص بصري للأسلاك والفيش |

## الفصل 10: متى تتوقف وتستدعي متخصصًا

توقف فورًا واستعن بمتخصص في هذه الحالات:

- ❌ أي عمل داخل **الميكروويف** أو شاشة CRT.
- ❌ أي عمل على **لوحة التوزيع الرئيسية** أو التمديدات الثابتة (يحتاج ترخيص في معظم الدول).
- ❌ أي عمل على **نظام ثلاثي الطور**.
- ❌ **شحن أو لحام دوائر الفريون** في الثلاجات والمكيفات.
- ❌ أجهزة **لا تزال في الضمان** — الفتح يلغي الضمان.
- ❌ عند وجود **ماء أو غاز** بجوار العطل.
- ❌ عندما لا تفهم الدائرة أو تشعر بعدم اليقين — **الشك نفسه سبب كافٍ للتوقف**.
- ❌ إذا كانت تكلفة الإصلاح تقترب من ثمن جهاز جديد.
- ❌ إذا كان الجهاز يشكّل **خطر حريق** (تسريب، سخونة غير مبررة، تشوه بالحرارة).

> **قاعدة نهائية:** لا يوجد جهاز قيمته تساوي إصبعًا أو حياة. إذا كان الشك موجودًا، أغلق الغطاء واتصل بمتخصص.

## الفصل 11: الموتورات الكهربائية بكل أنواعها

الموتور هو أكثر مكون يتكرر في الأجهزة، وفهم نوعه يحدد طريقة الفحص كليًا.

### 11.1 خريطة أنواع الموتورات

```
الموتورات
├── AC
│   ├── يونيفرسال (بفحمات) ── خلاط، مكنسة، سشوار، مثقاب، غسالات قديمة
│   ├── حث أحادي الطور (Induction)
│   │   ├── Shaded Pole ──────── مراوح صغيرة، شفاطات، مراوح الثلاجة
│   │   ├── Split Phase ───────── طلمبات، غسالات نصف أوتوماتيك
│   │   ├── Capacitor Start ───── طلمبات، كمبروسر (عزم بدء عالٍ)
│   │   └── Capacitor Run (PSC) ─ مراوح السقف، مراوح المكيف
│   ├── حث ثلاثي الطور ────────── مصاعد، مضخات صناعية، مكيفات مركزية
│   └── متزامن (Synchronous) ──── مؤقتات، موتور السوينج القديم
└── DC / إلكتروني
    ├── DC بفحمات ─────────────── لعب، مراوح 12V، مكانس السيارات
    ├── BLDC / PMSM ──────────── غسالات وثلاجات ومكيفات الإنفرتر
    └── Stepper ──────────────── ريشة المكيف، الطابعات، الصمامات
```

### 11.2 موتور الحث أحادي الطور — الأكثر شيوعًا في الأجهزة المنزلية

**فكرته:** المجال المغناطيسي في ملف واحد لا يستطيع بدء الدوران — يهتز فقط. لذلك يوجد **ملف بدء (Start)** مزاح 90° مع **مكثف** لخلق مجال دوّار يبدأ الحركة.

```
        ┌─── [ملف التشغيل Run] ───┐
220V ───┤                          ├─── متعادل
        └─ [مكثف] ─ [ملف البدء] ──┘
```

**تحديد أطراف موتور مجهول (3 أطراف):**
```
1. قِس المقاومة بين كل زوج من الأطراف الثلاثة → ستحصل على 3 قراءات
2. أكبر قراءة    = بين طرفي البدء والتشغيل (تجاهلها)
3. أصغر قراءة    = ملف التشغيل (Run) — سلك سميك، مقاومة قليلة
4. القراءة المتوسطة = ملف البدء (Start) — سلك رفيع، مقاومة أعلى
5. الطرف المشترك في أصغر وأوسط قراءة = المشترك (Common)
6. تحقق: مقاومة البدء + مقاومة التشغيل = المقاومة الكبرى ✓
```

**عكس اتجاه الدوران:** اعكس أطراف ملف البدء فقط (وليس التشغيل).

**أعطال موتور الحث:**

| العَرَض | السبب |
|---|---|
| يطنّ ولا يدور، يدور بدفعة يدوية | ⭐ المكثف تالف (السبب رقم 1) ← ملف البدء مقطوع |
| لا يعمل ولا يطنّ | تغذية ← فيوز حراري داخلي (Thermal Protector) مدفون في اللفات |
| يدور ببطء أو يسخن | مكثف ضعيف ← قصر جزئي بين اللفات ← حمل زائد ← جلبة/بيرنج جافة |
| يدور بالعكس | أطراف البدء معكوسة |
| يفصل بعد دقائق | الحماية الحرارية تعمل — تهوية مسدودة أو حمل زائد |
| صعقة عند اللمس | ⚠️ تسريب للجسم — قِس بين أي ملف والجسم، يجب OL |

**الحماية الحرارية الداخلية (Klixon):** قرص بيميتال داخل الموتور. إن كان الموتور ساخنًا سيقرأ OL — انتظر حتى يبرد وأعد القياس قبل أن تحكم بأنه محروق. **خطأ شائع جدًا: الحكم بحرق موتور وهو مجرد ساخن.**

### 11.3 موتور Shaded Pole (القطب المظلل)

بسيط ورخيص، بلا مكثف ولا فحمات — يستخدم حلقة نحاسية قصيرة لخلق إزاحة طور.
- **أماكنه:** مراوح المبخر في الثلاجة، الشفاطات، مراوح الميكروويف، مراوح التبريد الصغيرة.
- **العطل الوحيد تقريبًا:** الملف محروق أو الجلبة جافة. لا يُصلح عادة — يُستبدل.
- **الفحص:** مقاومة الملف عشرات إلى مئات الأومات + اختبار العزل للجسم + تدوير المحور يدويًا.

### 11.4 موتور BLDC / PMSM — موتور الإنفرتر

**الفكرة:** لا فحمات ولا كوميتيتر. المغناطيس الدائم في الدوّار، والبورد يقوم بالتبديل إلكترونيًا في 3 ملفات ثابتة.

```
[بورد الإنفرتر] ──3 أسلاك (U, V, W)── [الموتور]
                └─ حساسات Hall أو تقدير موضع بلا حساس (Sensorless)
```

**مميزاته:** صيانة شبه معدومة، كفاءة عالية، تحكم دقيق في السرعة.
**عيبه:** لا يعمل إطلاقًا بدون بورده، والبورد غالٍ.

**الفحص:**
```
1. قِس المقاومة بين كل زوج من الأسلاك الثلاثة (U-V, V-W, U-W)
   → يجب أن تكون القراءات الثلاث متساوية تقريبًا (فرق أقل من 10%)
   → اختلاف كبير = قصر بين اللفات ✗
   → OL في أي زوج = ملف مقطوع ✗
2. قِس بين أي سلك والجسم: يجب OL (> 10 ميجا أوم)
3. اختبار المولّد: افصل الموتور، ضع الأفوميتر على AC mV،
   أدر المحور بيدك بسرعة → يجب أن ترى جهدًا صغيرًا مولّدًا
   ⭐ هذا أفضل اختبار عملي — يثبت سلامة المغناطيس واللفات معًا
4. حساسات Hall (إن وجدت، 5 أسلاك): غذّها بـ5V وقِس الخرج
   أثناء الدوران البطيء → يجب أن يتناوب بين 0 و 5V
```

### 11.5 الموتور الخطوي (Stepper)

يدور بخطوات محددة بأمر رقمي. أماكنه: ريشة السوينج في المكيف، صمامات التمدد الإلكترونية، الطابعات.
- **الفحص:** عادة 4 أو 5 أسلاك. قِس المقاومة بين الأسلاك — يجب أن تجد ملفين متساويي المقاومة (وسلك مشترك في النوع Unipolar).
- **العطل:** يهتز ولا يدور (سلك مقطوع أو درايفر تالف)، أو لا يتحرك نهائيًا.

### 11.6 الموتور ثلاثي الطور

- 6 أطراف في صندوق التوصيل، تُوصل نجمة (Star/Y) أو دلتا (Δ).
- **نجمة:** جهد أقل على كل ملف، تيار بدء أقل — تُستخدم للبدء.
- **دلتا:** قدرة كاملة — للتشغيل. من هنا جاءت طريقة بدء **Star-Delta**.
- **الفحص:** المقاومات الثلاث متساوية + العزل للجسم بالميجر.
- **عكس الاتجاه:** بادل أي طورين.
- ⚠️ **العمل على الثلاثي الطور يحتاج ترخيصًا وخبرة — 380 فولت لا تسامح.**

### 11.7 البيرنج والجلب — الجزء الميكانيكي المهمل

معظم "أعطال الموتورات" ميكانيكية لا كهربائية.

| العلامة | التشخيص |
|---|---|
| صرير حاد | جفاف تزييت — شحّم أو استبدل |
| هدير أو خشونة عند التدوير اليدوي | بيرنج تالف |
| خلخلة جانبية في المحور | بيرنج مهترئ — يسبب احتكاك الدوّار بالثابت |
| آثار حكّ على الدوار | البيرنج تلف والموتور على وشك الاحتراق |

**تشحيم الجلب:** زيت ماكينات خفيف (لا شحم غليظ ولا WD-40 كمزيّت دائم). البيرنج المغلق يُستبدل ولا يُشحّم.
