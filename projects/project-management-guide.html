<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="دليل عربي شامل لإدارة المشاريع للمطورين: Agile وScrum وKanban، التقدير، بناء الفرق، والقرارات الإدارية — بالأمثلة والقوالب.">
<meta name="theme-color" content="#0E7C66">
<title>دليل إدارة المشاريع للمطورين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/a5a1e5b199a3.css" rel="stylesheet">
<script src="shelf-vendor:/cdnjs/marked/12.0.2/marked.min.js" onerror="window.__markedFailed=true"></script>
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#1B2733; --muted:#5B6B7B;
  --line:#E2E8EE; --accent:#0E7C66; --accent-soft:#E3F2EE;
  --amber:#DB9A2E; --amber-soft:#FBF1DE;
  --code-bg:#131A22; --code-ink:#DCE6F0;
  --shadow:0 1px 2px rgba(20,32,45,.05),0 8px 24px -12px rgba(20,32,45,.14);
  --radius:12px; --fs:16.5px;
}
[data-theme="dark"]{
  --bg:#0F151C; --surface:#161E27; --ink:#E7EDF3; --muted:#93A3B3;
  --line:#25303C; --accent:#3FBFA4; --accent-soft:#12352E;
  --amber:#E8B45A; --amber-soft:#33280F;
  --code-bg:#0B1016; --code-ink:#D5E0EA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  font-size:var(--fs); line-height:1.95;
  transition:background .25s,color .25s;
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- Top bar ---------- */
.topbar{
  position:fixed; inset-inline:0; top:0; z-index:50; height:60px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; padding:0 16px;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; background:none; border:none; padding:0; color:inherit; text-align:start}
.brand .logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),#0A5B4C);
  color:#fff;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;
}
.brand b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;line-height:1.2}
.topbar .spacer{flex:1}
.searchbox{position:relative;width:min(340px,36vw)}
.searchbox input{
  width:100%;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);padding:0 36px 0 52px;
  font:inherit;font-size:14px;outline:none;transition:border-color .15s;
}
.searchbox input:focus{border-color:var(--accent)}
.searchbox .icon{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:15px}
.searchbox .kbd{
  position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;direction:ltr;pointer-events:none;
}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;font-size:16px;
  display:grid;place-items:center;flex:none;font-family:inherit;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn:focus-visible,.searchbox input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fontctl{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.fontctl button{
  width:34px;height:38px;border:none;background:var(--surface);color:var(--ink);
  cursor:pointer;font-family:"IBM Plex Sans Arabic";font-weight:700;
}
.fontctl button:first-child{border-inline-end:1px solid var(--line);font-size:11px}
.fontctl button:last-child{font-size:16px}
.fontctl button:hover{color:var(--accent)}
#menuBtn{display:none}
.progress{position:fixed;top:60px;inset-inline:0;height:3px;z-index:49}
.progress i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--amber),var(--accent));
  transition:width .12s linear;
}

/* ---------- Layout ---------- */
.layout{display:flex;min-height:100vh;padding-top:63px}
.sidebar{
  width:308px;flex:none;position:sticky;top:63px;height:calc(100vh - 63px);
  overflow-y:auto;padding:20px 16px 40px;border-inline-end:1px solid var(--line);
  background:var(--surface);
}
.homebtn{
  display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);border-radius:10px;
  padding:8px 12px;margin-bottom:12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
.homebtn:hover,.homebtn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sidebar .sec-label{
  font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;
  margin:6px 6px 10px;
}
.sidebar .overall{margin:0 6px 14px;font-size:11.5px;color:var(--muted)}
.sidebar .overall .track{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.sidebar .overall .fill{
  height:100%;border-radius:5px;width:0;
  background:linear-gradient(90deg,var(--amber),var(--accent));
  transition:width .3s ease;
}
.ticket{
  display:block;width:100%;text-align:start;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;
  transition:border-color .15s, background .15s;position:relative;
}
.ticket:hover{border-color:var(--accent)}
.ticket .tid{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  color:var(--amber);background:var(--amber-soft);
  padding:1px 7px;border-radius:5px;display:inline-block;direction:ltr;
}
.ticket .tid.done{color:var(--accent);background:var(--accent-soft)}
.ticket .time{font-size:10.5px;color:var(--muted);float:inline-end;margin-top:2px}
.ticket .ttl{display:block;font-size:13.8px;font-weight:600;margin-top:5px;line-height:1.5}
.ticket .meta{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ticket.active{border-color:var(--accent);background:var(--accent-soft)}
.ticket.active::before{
  content:"";position:absolute;inset-inline-start:-1px;top:10px;bottom:10px;width:3px;
  background:var(--accent);border-radius:3px;
}
.subnav{margin:2px 6px 14px;padding-inline-start:10px;border-inline-start:2px solid var(--line)}
.subnav a{
  display:block;font-size:12.8px;color:var(--muted);text-decoration:none;
  padding:4px 8px;border-radius:6px;line-height:1.55;
}
.subnav a:hover{color:var(--accent);background:var(--accent-soft)}
.subnav a.on{color:var(--accent);font-weight:600}

/* ---------- Content ---------- */
.main{flex:1;min-width:0;display:flex;justify-content:center}
.page{width:min(860px,100%);padding:34px 34px 90px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page.enter .pagehead,.page.enter .md,.page.enter .cover{animation:fadeUp .3s ease both}
.pagehead{margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.pagehead .crumb{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  color:var(--accent);direction:ltr;display:inline-block;
  background:var(--accent-soft);padding:2px 10px;border-radius:6px;
}
.pagehead .rtime{font-size:12px;color:var(--muted);margin-inline-start:10px}
.pagehead h1{font-size:27px;line-height:1.55;margin:12px 0 4px;font-weight:700}
.pagehead p{margin:0;color:var(--muted);font-size:14px}
.pager{display:flex;gap:12px;margin-top:56px;padding-top:22px;border-top:1px solid var(--line)}
.pager:empty{display:none}
.pager a{
  flex:1;text-decoration:none;color:var(--ink);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 16px;background:var(--surface);
  transition:border-color .15s;
}
.pager a:hover{border-color:var(--accent)}
.pager a small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:3px}
.pager a b{font-size:14px;font-weight:600}
.pager a.next{text-align:end}
footer.credit{text-align:center;color:var(--muted);font-size:12px;margin-top:44px}
footer.credit .keys{font-family:"IBM Plex Mono",monospace;font-size:10.5px;direction:ltr;display:inline-block}

/* ---------- Cover ---------- */
.cover .hero{
  text-align:center;padding:34px 10px 30px;
}
.cover .hero .badge{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;direction:ltr;
  color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 14px;display:inline-block;
}
.cover .hero h1{font-size:32px;line-height:1.5;margin:16px auto 8px;max-width:600px;font-weight:700}
.cover .hero p{color:var(--muted);font-size:15px;max-width:560px;margin:0 auto}
.cover .herostats{
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 26px;
}
.cover .hstat{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 20px;font-size:12.5px;color:var(--muted);
}
.cover .hstat b{display:block;font-size:19px;color:var(--ink);font-family:"IBM Plex Mono",monospace;direction:ltr}
.cover .cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.cover .cta button{
  border:none;border-radius:11px;padding:12px 26px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
}
.cover .cta .go{background:var(--accent);color:#fff}
.cover .cta .go:hover{filter:brightness(1.08)}
.cover .cta .resume{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
.cover .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cover .pcard{
  text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:14px;padding:16px;font:inherit;cursor:pointer;position:relative;
  transition:border-color .15s, transform .15s;box-shadow:var(--shadow);
}
.cover .pcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.cover .pcard .tid{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;direction:ltr;
  color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:1px 7px;display:inline-block;
}
.cover .pcard .tid.done{color:var(--accent);background:var(--accent-soft)}
.cover .pcard .time{float:inline-end;font-size:10.5px;color:var(--muted);margin-top:3px}
.cover .pcard b{display:block;font-size:14.5px;margin-top:8px;line-height:1.6}
.cover .pcard span{display:block;font-size:11.8px;color:var(--muted);margin-top:4px;line-height:1.7}

/* ---------- Markdown ---------- */
.md h1{display:none}
.md h2{
  font-size:21.5px;font-weight:700;margin:46px 0 14px;line-height:1.6;
  padding-inline-start:14px;position:relative;scroll-margin-top:85px;
}
.md h2::before{
  content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:4px;
  border-radius:4px;background:linear-gradient(180deg,var(--amber),var(--accent));
}
.md h3{font-size:17.5px;font-weight:700;margin:32px 0 10px;scroll-margin-top:85px}
.md h4{font-size:16px;font-weight:700;margin:24px 0 8px;color:var(--accent)}
.md p{margin:0 0 14px}
.md ul,.md ol{padding-inline-start:26px;margin:0 0 16px}
.md li{margin-bottom:6px}
.md strong{font-weight:700}
.md a{color:var(--accent)}
.md hr{border:none;border-top:1px solid var(--line);margin:34px 0}
.md blockquote{
  margin:18px 0;padding:13px 18px;border-radius:10px;
  background:var(--amber-soft);border-inline-start:4px solid var(--amber);
}
.md blockquote p:last-child{margin-bottom:0}
.md code{
  font-family:"IBM Plex Mono",monospace;font-size:.86em;direction:ltr;unicode-bidi:embed;
  background:color-mix(in srgb,var(--ink) 8%,transparent);
  padding:2px 6px;border-radius:5px;
}
.md .codewrap{position:relative;margin:18px 0}
.md pre{
  background:var(--code-bg);color:var(--code-ink);
  border-radius:var(--radius);padding:18px 20px;overflow-x:auto;
  margin:0;box-shadow:var(--shadow);
  direction:ltr;text-align:left;
}
.md pre code{background:none;padding:0;font-size:13.2px;line-height:1.8;color:inherit}
.copybtn{
  position:absolute;top:10px;right:10px;z-index:2;
  font-family:"IBM Plex Sans Arabic";font-size:11px;font-weight:600;
  background:rgba(255,255,255,.09);color:#cfdae4;border:1px solid rgba(255,255,255,.18);
  border-radius:7px;padding:4px 10px;cursor:pointer;opacity:0;transition:opacity .15s;
}
.codewrap:hover .copybtn,.copybtn:focus-visible{opacity:1}
.copybtn.ok{background:var(--accent);border-color:var(--accent);color:#fff;opacity:1}
.md table{
  width:100%;border-collapse:collapse;margin:18px 0;font-size:14.3px;
  background:var(--surface);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);display:block;overflow-x:auto;white-space:normal;
}
.md thead th{
  background:color-mix(in srgb,var(--accent) 9%,var(--surface));
  color:var(--ink);font-weight:700;text-align:start;
  padding:11px 14px;border-bottom:2px solid var(--accent);white-space:nowrap;
}
.md td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.md tbody tr:last-child td{border-bottom:none}
.md tbody tr:nth-child(even){background:color-mix(in srgb,var(--ink) 2.5%,var(--surface))}
.md img{max-width:100%}
mark.flash{
  background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 2px;
  box-shadow:0 0 0 2px var(--amber-soft);
}

/* ---------- Search results ---------- */
.results{padding:6px 0}
.results .grouphead{
  display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:13px;font-weight:700;
}
.results .grouphead:first-child{margin-top:0}
.results .grouphead .gid{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:1px 7px;direction:ltr;
}
.results .grouphead .gc{font-size:11px;color:var(--muted);font-weight:500}
.results .hit{
  display:block;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);padding:12px 16px;margin-bottom:10px;cursor:pointer;
  transition:border-color .15s;text-align:start;width:100%;font:inherit;color:var(--ink);
}
.results .hit:hover,.results .hit.kbd-sel{border-color:var(--accent)}
.results .hit .snip{display:block;font-size:14px;color:var(--muted);line-height:1.8}
.results mark{background:var(--amber-soft);color:var(--amber);padding:0 2px;border-radius:3px;font-weight:700}
.results .none{color:var(--muted);text-align:center;padding:60px 0}

/* ---------- Back to top ---------- */
#topBtn{
  position:fixed;bottom:22px;inset-inline-start:22px;z-index:48;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--accent);font-size:18px;cursor:pointer;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;
}
#topBtn.show{opacity:1;pointer-events:auto}

/* ---------- Mobile ---------- */
.scrim{display:none}
@media (max-width:960px){
  #menuBtn{display:grid}
  .fontctl{display:none}
  .searchbox .kbd{display:none}
  .sidebar{
    position:fixed;inset-inline-start:0;top:63px;bottom:0;z-index:60;
    transform:translateX(100%);transition:transform .22s ease;
    box-shadow:var(--shadow);width:min(320px,86vw);
  }
  .sidebar.open{transform:translateX(0)}
  .scrim{
    display:block;position:fixed;inset:0;top:63px;z-index:55;
    background:rgba(10,16,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .page{padding:24px 18px 70px}
  .pagehead h1{font-size:22px}
  .cover .hero h1{font-size:24px}
  .searchbox{width:100%}
  .brand small{display:none}
  .brand b{display:none}
}


/* ---------- Interactive checklists inside code blocks ---------- */
.md pre .chk{
  cursor:pointer;user-select:none;display:inline-block;width:1.2em;
  color:#7f8fa0;transition:color .15s;
}
.md pre .chk:hover{color:var(--accent)}
.md pre .chk.on{color:#4ade80}
.md pre .chkline.done{opacity:.55;text-decoration:line-through}
.chkbar{
  display:flex;align-items:center;gap:10px;margin:0 0 -4px;padding:7px 14px;
  background:var(--accent-soft);border:1px solid var(--accent);border-bottom:none;
  border-radius:12px 12px 0 0;font-size:11.5px;color:var(--accent);font-weight:600;
}
.chkbar .rst{
  margin-inline-start:auto;border:none;background:transparent;color:var(--accent);
  font:inherit;font-size:11px;cursor:pointer;text-decoration:underline;opacity:.8;
}
.chkbar + pre{border-radius:0 0 12px 12px}

/* ---------- Heading anchor ---------- */
.md h2 .alink,.md h3 .alink{
  opacity:0;font-size:.62em;color:var(--muted);text-decoration:none;
  margin-inline-start:8px;cursor:pointer;vertical-align:middle;
}
.md h2:hover .alink,.md h3:hover .alink{opacity:1}
.md h2 .alink:hover,.md h3 .alink:hover{color:var(--accent)}

/* ---------- Calculator ---------- */
.calcwrap{
  border:1px solid var(--line);background:var(--surface);border-radius:14px;
  padding:18px;box-shadow:var(--shadow);margin-top:14px;
}
.calcwrap h3{margin:0 0 4px;font-size:16px;font-weight:700}
.calcwrap .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.calcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.calcgrid label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.calcgrid input{
  width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;outline:none;
  font-family:"IBM Plex Mono",monospace;direction:ltr;text-align:center;
}
.calcgrid input:focus{border-color:var(--accent)}
.calcout{
  margin-top:14px;padding:13px 16px;border-radius:11px;background:var(--accent-soft);
  color:var(--ink);font-size:14px;line-height:2;
}
.calcout b{color:var(--accent);font-family:"IBM Plex Mono",monospace;direction:ltr;display:inline-block}
.calcout .warn{color:var(--amber);font-weight:600}

/* ---------- Tools row on cover ---------- */
.toolrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 26px}
@media (max-width:700px){.toolrow{grid-template-columns:1fr}}
.toolcard{
  border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;
  box-shadow:var(--shadow);
}
.toolcard b{display:block;font-size:14.5px;margin-bottom:3px}
.toolcard span{display:block;font-size:12px;color:var(--muted);line-height:1.7}


/* ---------- Board v2 ---------- */
.bd-projbar,.bd-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bd-projbar .sp{flex:1}
.bd-projbar select,.bd-tools select,.bd-tools input[type=search]{
  height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);
  font:inherit;font-size:13px;padding:0 10px;outline:none;
}
.bd-projbar select{font-weight:700;min-width:170px}
.bd-tools input[type=search]{flex:1;min-width:140px}
.bd-projbar select:focus,.bd-tools select:focus,.bd-tools input:focus{border-color:var(--accent)}
.bd-btn{
  height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:0 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.bd-btn:hover{border-color:var(--accent);color:var(--accent)}
.bd-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.bd-btn.pri:hover{filter:brightness(1.07);color:#fff}
.bd-btn.danger:hover{border-color:#C64848;color:#C64848}
.bd-btn .kb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-inline-start:4px}

<script type="text/template" id="md-source"># الجزء الأول: الأساسيات — المنهجيات والمصطلحات والأدوات

دليل عملي يشرح منهجيات إدارة المشاريع اللي بيشتغل بيها المطورين في شركات البرمجيات، إزاي تتعلمها خطوة بخطوة، وإيه أفضل الأدوات المستخدمة في السوق.

---

## المحتويات

1. [ليه المطور لازم يفهم إدارة المشاريع؟](#ليه-المطور-لازم-يفهم-إدارة-المشاريع)
2. [المنهجيات الأساسية (Methodologies)](#المنهجيات-الأساسية)
   - Waterfall
   - Agile
   - Scrum
   - Kanban
   - Scrumban
   - Extreme Programming (XP)
   - Lean
   - SAFe
3. [المصطلحات اللي لازم تعرفها](#المصطلحات-الأساسية)
4. [دورة حياة الـ Task من أول ما تتكتب لحد ما تتسلم](#دورة-حياة-التاسك)
5. [أفضل الأدوات (Tools)](#أفضل-الأدوات)
6. [إزاي تتعلم؟ خطة تعلم عملية](#خطة-التعلم)
7. [نصائح عملية من واقع الشغل](#نصائح-عملية)

**الجزء الثاني — مشروع عملي كامل:** تحديد النطاق → التقسيم → التقدير والمواعيد → الـ Roadmap → التنفيذ على Jira → المخاطر → التقارير → الإطلاق

**الجزء الثالث — مستوى متقدم:** أطر الأولويات (MoSCoW/RICE) • حساب الـ Capacity بالساعات • ربط الإدارة بالـ Git والـ CI/CD • إدارة المشاريع كـ Freelancer • المقاييس وDORA • الفرق الـ Remote • التوثيق وADRs • أدوات الـ AI • أسئلة المقابلات • خريطة التطور المهني • قوالب جاهزة • مسرد موسّع • خطة 30 يوم

**الجزء الرابع — الشرح المبسط بالأمثلة:** المنهجيات بتشبيه المطعم • التقسيم بتشبيه تجهيز الشقة • 3 ورش تقسيم كاملة (متجر/شات/حجز دكاترة) • النقاط بشرح التيشيرتات • Sprint كامل يوم بيوم • جولة خطوة بخطوة جوه كل أداة (Trello/Jira/ClickUp/Linear/GitHub) • المصطلحات اللي بتتلخبط • مكتبة User Stories جاهزة • أسئلة المبتدئين • تمرين ختامي

**الجزء الخامس — بنبني شركة من الصفر:** شركة "سهلة" في 3 مراحل نمو (3 → 7 → 12 فرد) • ترتيب التعيينات الصح • التقسيم لـ Squads • توزيع الأدوار بالتفصيل (مين بيعمل إيه فعليًا) • مصفوفة RACI للقرارات • رحلة ميزة كاملة من فكرة العميل للإطلاق • جدول اجتماعات الشركة • أسئلة التقسيم وإجاباتها

**الجزء السادس — ما بعد الإطلاق والأزمات:** OKRs وربط تاسكك بأهداف الشركة • البيئات (Dev/Staging/Prod) وترقيم الإصدارات واستراتيجيات النشر الآمن • دليل الأزمات (الإنتاج وقع / المشروع متأخر / عضو أساسي ماشي) • أول 30 يوم في شغل جديد • مصادر التعلم (كتب ومواقع وقنوات) • Cheat Sheet مرجعي في صفحة واحدة

**الجزء السابع — قرارات الفريق والأفراد:** إمتى أعيّن (والبدائل الأرخص قبل التعيين) • تحليل نواقص الفريق بمصفوفة المهارات والاختناقات • Senior ولا Junior؟ • شروط وخطة تدريب المبتدئين (30-60-90) • إمتى وإزاي أتخلى عن حد (PIP والعلامات الحمراء) • إمتى أرقّي • لوحة قياس صحة الفريق

**الجزء الثامن — المرجع التكميلي:** Definition of Ready • الميزانية والتكاليف ومثلث القيود • الاعتماديات والمسار الحرج • التقدير الثلاثي PERT • خريطة أصحاب المصلحة • إدارة الديون التقنية كسياسة • الشغل مع فرق خارجية • إدارة الاجتماعات • جدول القرارات السريع

---

## ليه المطور لازم يفهم إدارة المشاريع؟

كتير من المطورين بيفتكروا إن إدارة المشاريع دي شغلانة الـ Project Manager بس، لكن الحقيقة إن:

- **90% من شركات البرمجيات** بتشتغل بمنهجية Agile أو مشتقاتها، ولو مش فاهمها هتحس إنك تايه في أول شغلانة.
- المطور اللي فاهم الـ Workflow بيقدر **يقدّر الوقت (Estimation)** صح، وده بيفرق جدًا في تقييمك.
- في المقابلات (Interviews) بيتسألوا كتير: "اشرح لي إزاي فريقك كان شغال بـ Scrum؟"
- لما تكبر في الكارير (Senior / Tech Lead) هتبقى أنت اللي بتقسّم الشغل وتدير الـ Sprint.

---

## المنهجيات الأساسية

### 1. Waterfall (الشلال) — النظام القديم

**الفكرة:** المشروع بيمشي في مراحل متتالية زي الشلال، كل مرحلة لازم تخلص قبل ما اللي بعدها تبدأ:

```
المتطلبات (Requirements)
        ↓
التصميم (Design)
        ↓
التطوير (Development)
        ↓
الاختبار (Testing)
        ↓
التسليم (Deployment)
        ↓
الصيانة (Maintenance)
```

**مميزاته:**
- واضح وبسيط، وكل مرحلة ليها مستندات (Documentation) كاملة.
- مناسب للمشاريع اللي متطلباتها ثابتة ومعروفة من الأول (مشاريع حكومية، أنظمة بنكية معينة).

**عيوبه:**
- لو العميل غيّر رأيه في النص، هترجع تاني لمرحلة قديمة والتكلفة بتبقى عالية جدًا.
- العميل مش بيشوف حاجة شغالة غير في الآخر خالص.
- مش مناسب لعالم الـ Startups والمنتجات اللي بتتغير بسرعة.

**متى تستخدمه:** مشاريع صغيرة بمتطلبات ثابتة 100%، أو مشاريع فيها قيود تعاقدية صارمة.

---

### 2. Agile (المنهجية الرشيقة) — الفلسفة الأم

**Agile مش أداة ولا نظام محدد — هي فلسفة وطريقة تفكير** اتكتبت في 2001 في وثيقة اسمها **Agile Manifesto** وبتقوم على 4 قيم:

1. **الأفراد والتفاعل** أهم من العمليات والأدوات.
2. **البرمجيات الشغالة** أهم من التوثيق الشامل.
3. **التعاون مع العميل** أهم من التفاوض على العقود.
4. **الاستجابة للتغيير** أهم من اتباع خطة جامدة.

**الفكرة العملية:** بدل ما تسلّم المشروع كله بعد 6 شهور، بتسلّم **أجزاء صغيرة شغالة** كل أسبوع أو أسبوعين، والعميل بيشوف ويعدّل وأنت بتتأقلم.

Scrum وKanban وXP كلهم **تطبيقات عملية (Frameworks)** لفلسفة Agile.

---

### 3. Scrum — الأكثر انتشارًا في السوق ⭐

ده النظام اللي **أغلب احتمال هتشتغل بيه** في أي شركة برمجيات. خليك مركز هنا كويس.

#### الأدوار (Roles)

| الدور | مسؤوليته |
|-------|----------|
| **Product Owner (PO)** | صوت العميل — بيحدد إيه اللي يتعمل وبأي أولوية، وبيدير الـ Product Backlog |
| **Scrum Master** | حارس العملية — بيشيل العوائق (Blockers) قدام الفريق وبيتأكد إن الكل ملتزم بالنظام |
| **Development Team** | الفريق اللي بينفذ (مطورين، Testers، Designers) — عادة من 3 لـ 9 أفراد |

#### الأحداث (Ceremonies / Events)

| الحدث | مدته | إيه اللي بيحصل فيه |
|-------|------|---------------------|
| **Sprint** | 1-4 أسابيع (الأشهر أسبوعين) | دورة العمل نفسها — الفريق بينفذ مجموعة Tasks متفق عليها |
| **Sprint Planning** | 2-4 ساعات | في بداية الـ Sprint: بنختار إيه اللي هيتنفذ وبنقدّر حجمه |
| **Daily Standup** | 15 دقيقة يوميًا | كل واحد بيقول: عملت إيه امبارح؟ هعمل إيه النهارده؟ في حاجة معطلاني؟ |
| **Sprint Review** | 1-2 ساعة | في نهاية الـ Sprint: بنعرض الشغل اللي خلص للـ Stakeholders |
| **Sprint Retrospective** | 1 ساعة | الفريق مع بعضه: إيه اللي مشي كويس؟ إيه اللي نحسّنه المرة الجاية؟ |
| **Backlog Refinement** | حسب الحاجة | تنضيف وتفصيل الـ Backlog وتقدير الـ Tasks الجاية |

#### المخرجات (Artifacts)

- **Product Backlog:** قايمة بكل اللي المنتج محتاجه، مرتبة بالأولوية.
- **Sprint Backlog:** الجزء اللي الفريق التزم بتنفيذه في الـ Sprint الحالي.
- **Increment:** المنتج الشغال بعد إضافة شغل الـ Sprint.

#### مثال أسبوع شغل حقيقي بـ Scrum

```
الإثنين (بداية Sprint):
  09:00 → Sprint Planning: الفريق يختار 15 تاسك من الـ Backlog
  
كل يوم:
  10:00 → Daily Standup (15 دقيقة واقفين)
  باقي اليوم → تطوير + Code Review + Testing

آخر خميس في الـ Sprint:
  11:00 → Sprint Review: عرض الشغل للـ Product Owner والعملاء
  13:00 → Retrospective: نتكلم بصراحة إيه اللي يتحسن
```

---

### 4. Kanban — التدفق المستمر

**الفكرة:** مفيش Sprints ولا مواعيد ثابتة — الشغل بيتحرك بشكل مستمر على **لوحة (Board)** مقسمة أعمدة:

```
| To Do | In Progress | Code Review | Testing | Done |
|  📋   |     🔨      |     👀      |   🧪    |  ✅  |
```

**المبادئ الأساسية:**
1. **Visualize the workflow:** كل الشغل مرئي على اللوحة.
2. **Limit WIP (Work In Progress):** حد أقصى للتاسكات في كل عمود (مثلًا: مينفعش يبقى في أكتر من 3 تاسكات In Progress) — ده بيمنع التشتت وبيكشف الاختناقات.
3. **Manage Flow:** بنقيس الوقت اللي التاسك بياخده من أول اللوحة لآخرها (Cycle Time) ونحاول نقلله.

**متى تستخدمه:**
- فرق الـ Support والـ Maintenance (شغل بييجي بشكل مستمر ومش متوقع).
- الفرق الصغيرة أو المشاريع الشخصية.
- لما الأولويات بتتغير يوميًا ومينفعش تلتزم بـ Sprint ثابت.

**الفرق بين Scrum و Kanban باختصار:**

| | Scrum | Kanban |
|---|-------|--------|
| الإيقاع | دورات ثابتة (Sprints) | تدفق مستمر |
| الأدوار | محددة (PO, SM, Team) | مفيش أدوار إلزامية |
| التغيير أثناء الشغل | ممنوع تغيير الـ Sprint بعد ما يبدأ | مسموح في أي وقت |
| القياس | Velocity (سرعة الفريق) | Cycle Time / Lead Time |
| الأنسب لـ | تطوير منتجات | Support وشغل مستمر |

---

### 5. Scrumban — الدمج بينهم

خليط عملي: بياخد **هيكل Scrum** (Standups + Retrospectives) مع **مرونة Kanban** (تدفق مستمر + WIP Limits). منتشر في الشركات المتوسطة اللي عايزة تنظيم من غير جمود.

---

### 6. Extreme Programming (XP)

منهجية Agile مركزة على **الجودة التقنية** نفسها، وممارساتها بقت Standard في الصنعة حتى لو الشركة مش بتقول إنها بتطبق XP:

- **TDD (Test-Driven Development):** تكتب الاختبار قبل الكود.
- **Pair Programming:** اتنين مطورين على جهاز واحد.
- **Continuous Integration (CI):** دمج الكود باستمرار مع اختبارات آلية.
- **Refactoring:** تحسين الكود باستمرار من غير تغيير سلوكه.
- **Small Releases:** إصدارات صغيرة ومتكررة.

---

### 7. Lean

جاي من صناعة السيارات (Toyota). فلسفته: **اقضِ على الهدر (Waste)** — أي حاجة مش بتضيف قيمة للعميل تتشال:
- كود مكتوب ومش مستخدم = هدر.
- اجتماعات مالهاش لازمة = هدر.
- انتظار الموافقات = هدر.

منه طلع مفهوم **MVP (Minimum Viable Product)** — أصغر نسخة من المنتج تقدر تختبر بيها الفكرة.

---

### 8. SAFe (Scaled Agile Framework)

لما الشركة تبقى ضخمة (مئات المطورين وعشرات الفرق) Scrum العادي مش بيكفي، فـ SAFe بينظم Agile على مستوى المؤسسة كلها. هتقابله في البنوك والشركات الكبيرة (Enterprise). معقد شوية ومش محتاج تتعمق فيه غير لو اشتغلت في بيئة كده.

---

## المصطلحات الأساسية

دي المصطلحات اللي هتسمعها كل يوم في الشغل:

| المصطلح | معناه |
|---------|-------|
| **User Story** | وصف لميزة من وجهة نظر المستخدم: "As a user, I want to reset my password so that I can regain access" |
| **Epic** | مجموعة User Stories كبيرة مرتبطة ببعض (مثلًا: "نظام الدفع الإلكتروني" كله) |
| **Task / Sub-task** | الشغل التقني الفعلي اللي بينفذ الـ Story |
| **Story Points** | وحدة تقدير حجم/تعقيد التاسك (مش وقت!) — عادة بأرقام فيبوناتشي: 1, 2, 3, 5, 8, 13 |
| **Planning Poker** | طريقة الفريق بيقدّر بيها الـ Story Points بشكل جماعي |
| **Velocity** | متوسط عدد الـ Points اللي الفريق بينجزها في الـ Sprint |
| **Backlog** | قايمة الشغل المستقبلي مرتبة بالأولوية |
| **Definition of Done (DoD)** | الشروط اللازمة عشان نقول إن التاسك "خلص" (الكود اتراجع + الاختبارات نجحت + اتنشر...) |
| **Acceptance Criteria** | شروط قبول الـ Story المحددة — إمتى نقول إن الميزة دي شغالة صح |
| **Blocker** | عائق مانعك تكمل شغلك |
| **Spike** | تاسك بحثي — وقت مخصص لاستكشاف حل تقني قبل الالتزام بيه |
| **Technical Debt** | "الديون التقنية" — حلول سريعة عملناها ولازم نرجع نصلحها |
| **Burndown Chart** | رسم بياني بيوضح الشغل المتبقي في الـ Sprint يوم بيوم |
| **Stakeholder** | أي حد ليه مصلحة في المشروع (العميل، الإدارة، المستخدمين) |
| **Grooming / Refinement** | جلسة تنضيف وتفصيل الـ Backlog |
| **Retrospective (Retro)** | اجتماع مراجعة أداء الفريق بعد كل Sprint |
| **Standup / Daily** | الاجتماع اليومي القصير |
| **Sprint Goal** | الهدف الرئيسي من الـ Sprint في جملة واحدة |
| **Capacity** | قدرة الفريق الفعلية في الـ Sprint (مع حساب الأجازات والاجتماعات) |
| **MVP** | أصغر نسخة قابلة للاستخدام من المنتج |
| **Milestone** | محطة رئيسية في المشروع (مثلًا: إطلاق النسخة التجريبية) |

---

## دورة حياة التاسك

عشان تفهم الصورة كاملة، دي رحلة التاسك من أولها لآخرها في شركة بتشتغل Scrum:

```
1. الفكرة
   الـ Product Owner بيكتب User Story في الـ Backlog
        ↓
2. Refinement
   الفريق بيناقشها ويحدد الـ Acceptance Criteria ويقدّر الـ Story Points
        ↓
3. Sprint Planning
   الـ Story بتتاخد في الـ Sprint وبتتقسم Tasks تقنية
        ↓
4. In Progress
   المطور بياخد التاسك، بيعمل Branch جديد، ويبدأ يكتب كود
        ↓
5. Code Review
   بيفتح Pull Request وزميل ليه بيراجع الكود
        ↓
6. Testing / QA
   الـ Tester بيتأكد إن الـ Acceptance Criteria متحققة
        ↓
7. Done ✅
   بيتدمج في الـ main branch وبيتنشر (حسب الـ Definition of Done)
        ↓
8. Sprint Review
   بيتعرض على الـ Stakeholders
```

**ملحوظة مهمة:** التاسك بيتربط دايمًا بالكود — يعني اسم الـ Branch والـ Commit بيبقى فيه رقم التاسك (مثلًا `PROJ-142-fix-login-bug`)، وده بيخلي أدوات زي Jira تتكامل مع GitHub تلقائيًا.

## أفضل الأدوات

### المقارنة السريعة

### التفاصيل

#### 1. Jira ⭐ — ملك السوق

- **الأكثر استخدامًا في شركات البرمجيات على مستوى العالم**، ولو هتتعلم أداة واحدة تحطها في الـ CV، خليها Jira.
- بيدعم Scrum وKanban بشكل كامل: Sprints، Backlogs، Story Points، Burndown Charts، Reports.
- تكامل قوي مع GitHub / GitLab / Bitbucket / Confluence / Slack.
- **عيبه:** واجهته تقيلة ومعقدة للمبتدئين، وبيبقى بطيء أحيانًا.
- **نصيحة:** اعمل حساب مجاني وجرّب تعمل مشروع Scrum وهمي — دي أسرع طريقة تتعلمه.

#### 2. Trello — أبسط بداية

- لوحة Kanban بسيطة: كروت بتسحبها بين أعمدة، وخلاص.
- ممتاز عشان **تفهم فكرة Kanban عمليًا** قبل ما تدخل في الأدوات المعقدة.
- من نفس الشركة الأم بتاعة Jira (Atlassian).
- **عيبه:** مش كافي لفرق البرمجيات الكبيرة — مفيش Sprints ولا تقارير متقدمة.

#### 3. ClickUp — السكينة السويسرية

- Tasks + Docs + Goals + Time Tracking + Whiteboards كله في أداة واحدة.
- Views متعددة: List, Board, Gantt, Calendar, Timeline.
- خطته المجانية من أسخى الخطط.
- **عيبه:** كتر الميزات ممكن يشتت، وفيه Learning Curve.

#### 4. Linear — المفضل عند الـ Startups 🚀

- سريع جدًا وواجهته من أجمل الواجهات، ومبني بعقلية المطورين (Keyboard Shortcuts لكل حاجة).
- بيكبر انتشاره بسرعة في شركات التقنية الحديثة.
- Cycles (نسخته من Sprints) + تكامل ممتاز مع GitHub.
- **عيبه:** أقل مرونة في التخصيص من Jira، ومش منتشر في الشركات الكبيرة القديمة.

#### 5. Azure DevOps — للبيئات الـ Enterprise

- مش بس إدارة مشاريع: Boards + Repos + CI/CD Pipelines + Test Plans في منظومة واحدة.
- منتشر جدًا في الشركات اللي شغالة .NET / Microsoft.

#### 6. GitHub Projects — لو شغلك كله على GitHub

- Boards وTables مربوطة مباشرة بالـ Issues والـ Pull Requests.
- مجاني وبسيط — اختيار ممتاز للمشاريع الشخصية والـ Open Source.

### طيب أختار إيه؟ 🤔

- **لسه بتتعلم؟** → ابدأ بـ **Trello** أو **GitHub Projects** لمشاريعك الشخصية.
- **عايز تجهز نفسك لسوق العمل؟** → اتعلم **Jira** (ده اللي هتلاقيه في أغلب الوظايف).
- **شغال في Startup أو بتبني واحدة؟** → **Linear** أو **ClickUp**.
- **بيئة Microsoft؟** → **Azure DevOps**.

## خطة التعلم

### المرحلة 1: الأساسيات النظرية (أسبوع - أسبوعين)

1. **اقرأ الـ Agile Manifesto** (صفحة واحدة): agilemanifesto.org
2. **اقرأ الـ Scrum Guide الرسمي** (حوالي 14 صفحة، متوفر بالعربي): scrumguides.org
3. اتفرج على شرح فيديو لـ Scrum وKanban على YouTube (في محتوى عربي كتير ممتاز — ابحث عن "شرح Scrum بالعربي").

### المرحلة 2: التطبيق العملي (أسبوعين - شهر)

4. **اعمل حساب مجاني على Trello** ونظّم بيه مشروعك الشخصي أو حتى مذاكرتك بنظام Kanban.
5. **اعمل حساب مجاني على Jira** وأنشئ مشروع Scrum وهمي:
   - اكتب 10 User Stories لتطبيق متخيل (مثلًا تطبيق توصيل أكل).
   - قسّمهم Epics وTasks.
   - اعمل Sprint وحرّك التاسكات على الـ Board.
6. لو بتشتغل على مشروع تخرج أو مشروع مع أصحابك: **طبّقوا Scrum بجد** — Daily قصير + Sprint أسبوعي + Retro.

### المرحلة 3: التعمق والشهادات (اختياري — شهر أو أكتر)

7. **كورسات مقترحة:**
   - "Agile with Atlassian Jira" على Coursera (مجاني بالتدقيق).
   - "Google Project Management Certificate" على Coursera (شامل ومعترف بيه).
   - كورسات Scrum.org المجانية (Open Assessments للتدريب).
8. **شهادات لو حابب توثّق معرفتك:**
   - **PSM I (Professional Scrum Master)** من Scrum.org — الأرخص والأكثر احترامًا (حوالي 200$، امتحان أونلاين).
   - **CSM** من Scrum Alliance — أغلى وبيحتاج كورس حضوري.
   - ملحوظة: كمطور، الشهادات دي **مش شرط** — الفهم العملي أهم بكتير.

### المرحلة 4: الاحتراف في الشغل

9. في أول شغلانة ليك: **راقب واسأل** — إزاي بيتعمل الـ Estimation؟ إيه الـ Definition of Done عندهم؟
10. شارك بفاعلية في الـ Retrospectives — دي أسرع طريقة تفهم بيها ديناميكية الفريق.

---

## نصائح عملية

1. **الـ Story Points مش ساعات** — هي مقياس نسبي للتعقيد. تاسك 8 نقط يعني ضعف تعقيد تاسك 4 نقط تقريبًا، مش 8 ساعات.

2. **متقولش "خلصت 90%"** — التاسك يا خلص يا لأ. الـ 10% الأخيرة هي اللي بتاخد نص الوقت دايمًا.

3. **قدّر بواقعية وضيف هامش** — المطورين المبتدئين دايمًا بيقدّروا أقل من الحقيقة. لو حاسس إن التاسك ياخد يوم، غالبًا هياخد يوم ونص.

4. **الـ Daily Standup مش تقرير للمدير** — هو تنسيق بين الفريق. لو في Blocker قوله فورًا، متستناش.

5. **قسّم التاسكات الكبيرة** — أي تاسك أكبر من يومين شغل، قسّمه. التاسكات الصغيرة أسهل في التقدير والمتابعة والمراجعة.

6. **اربط الكود بالتاسك دايمًا** — رقم التاسك في اسم الـ Branch وفي الـ Commit Message. ده مش رفاهية، ده بيوفر ساعات لما حد يرجع يفهم ليه الكود ده اتكتب.

7. **الـ Technical Debt سجّله** — لو عملت حل سريع، افتح تاسك في الـ Backlog باسمه. اللي مش متسجل بيتنسي وبينفجر بعدين.

8. **الأداة مش هي المنهجية** — شركة ممكن تستخدم Jira وتشتغل بفوضى كاملة، وشركة تستخدم ورق ملاحظات على حيطة وتكون Agile بجد. افهم الفلسفة الأول.

9. **الـ Retro مساحة أمان** — اتكلم بصراحة عن المشاكل من غير لوم شخصي. "الـ Deployment بياخد وقت طويل" أحسن من "فلان بيأخرنا".

10. **اتعلم تقول لأ بذكاء** — لو الـ Sprint مليان وحد عايز يضيف تاسك، السؤال الصح: "تمام، وإيه اللي نشيله بداله؟"

---

## خلاصة سريعة

- **المنهجية اللي لازم تتقنها:** Scrum (هي الأكثر انتشارًا)، وافهم Kanban كمان.
- **الأداة اللي لازم تتعلمها لسوق العمل:** Jira، وابدأ بـ Trello لو لسه في الأول.
- **أول 3 خطوات دلوقتي:**
  1. اقرأ الـ Scrum Guide (ساعة واحدة).
  2. اعمل Board على Trello لمشروعك الحالي.
  3. اعمل مشروع Scrum تجريبي على Jira المجاني.

# الجزء الثاني: مشروع عملي كامل من الصفر للتسليم 🛠️

هنطبّق كل اللي فات على مشروع حقيقي خطوة بخطوة: **تطبيق توصيل أكل اسمه "أكلة"** — فريق من 4 أفراد (2 مطورين، مصمم، Tester) والمطلوب نسخة أولى (MVP) خلال 3 شهور.

---

## الخطوة 1: تحديد نطاق المشروع (Project Scope)

قبل أي كود أو أداة، لازم تجاوب على الأسئلة دي وتكتبها في مستند (Project Charter):

| السؤال | الإجابة لمشروعنا |
|--------|-------------------|
| **إيه المشكلة اللي بنحلها؟** | الناس في المناطق الجديدة مش لاقية تطبيق توصيل بيغطيهم |
| **مين المستخدم؟** | سكان المناطق الجديدة + المطاعم الصغيرة |
| **إيه الـ MVP؟** | تصفح مطاعم + طلب + دفع كاش عند الاستلام + تتبع بسيط |
| **إيه اللي مش داخل النطاق (Out of Scope)؟** | الدفع الإلكتروني، تطبيق الطيار، الكوبونات — كله بعد الإطلاق |
| **الموعد النهائي (Deadline)؟** | 12 أسبوع من النهارده |
| **معايير النجاح؟** | 10 مطاعم مسجلة + 100 طلب ناجح في أول شهر |

> ⚠️ **أهم سطر في الجدول هو الـ Out of Scope** — تحديد اللي *مش* هتعمله بيحميك من الـ Scope Creep (تضخم المتطلبات) اللي بيغرق أغلب المشاريع.

---

## الخطوة 2: تقسيم المشروع (Work Breakdown)

بنقسم من فوق لتحت: **المشروع → Epics → User Stories → Tasks**

### الـ Epics بتاعتنا

```
🍔 مشروع "أكلة" MVP
├── Epic 1: نظام الحسابات (تسجيل ودخول)
├── Epic 2: تصفح المطاعم والمنيو
├── Epic 3: سلة المشتريات والطلب
├── Epic 4: تتبع الطلب
└── Epic 5: لوحة تحكم المطعم
```

### تفصيل Epic 2 كمثال (تصفح المطاعم)

| # | User Story | Story Points |
|---|-----------|:---:|
| S-01 | As a customer, I want to see a list of nearby restaurants so that I can choose where to order from | 5 |
| S-02 | As a customer, I want to search restaurants by name so that I find what I want quickly | 3 |
| S-03 | As a customer, I want to view a restaurant's menu with prices so that I can decide what to order | 5 |
| S-04 | As a customer, I want to filter by cuisine type so that I see relevant options | 3 |

### تفصيل Story واحدة (S-03) لـ Tasks تقنية

```
S-03: عرض منيو المطعم
├── [Backend] API endpoint: GET /restaurants/{id}/menu     (تقدير: يوم)
├── [Backend] Menu items database schema                    (نص يوم)
├── [Frontend] شاشة المنيو + عرض الأصناف                    (يوم ونص)
├── [Design] تصميم شاشة المنيو                              (نص يوم)
└── [QA] Test cases للمنيو (منيو فاضي، صور ناقصة...)        (نص يوم)
```

**والـ Acceptance Criteria بتاعتها:**
- ✅ المنيو بيعرض الأصناف مقسمة أقسام (مقبلات، رئيسي، حلو...)
- ✅ كل صنف ليه اسم وسعر وصورة (أو صورة افتراضية لو مفيش)
- ✅ لو المطعم مقفول تظهر علامة "مغلق الآن"
- ✅ الشاشة بتحمّل في أقل من ثانيتين

## الخطوة 3: التقدير وتحديد المواعيد (Estimation & Scheduling) ⏰

دي أهم خطوة والأكتر اللي الناس بتغلط فيها. اتبع الترتيب ده:

### 3.1 — قدّر كل الـ Stories بالـ Story Points

الفريق يقعد جلسة **Planning Poker**:
1. الـ PO يقرأ الـ Story.
2. كل واحد يختار رقم في سره (1, 2, 3, 5, 8, 13).
3. الكل يكشف في نفس الوقت.
4. لو في فرق كبير (واحد قال 2 وواحد قال 8) → يتناقشوا ليه، ويصوّتوا تاني.

**نتيجة تقدير مشروعنا كله:** مجموع الـ Backlog = **120 Story Point**

### 3.2 — احسب الـ Velocity المتوقعة

- فريقنا جديد، فهنبدأ بتقدير متحفظ: **20 Point لكل Sprint** (أسبوعين).
- بعد أول 2-3 Sprints هنعرف الـ Velocity الحقيقية ونعدّل.

### 3.3 — احسب عدد الـ Sprints

```
120 نقطة ÷ 20 نقطة/Sprint = 6 Sprints = 12 أسبوع ✅ (مطابق للـ Deadline)
```

> ⚠️ لو الحسبة طلعت 8 Sprints والـ Deadline بيسمح بـ 6 بس، عندك 3 حلول شرعية فقط:
> 1. **قلّل النطاق** (شيل Stories من الـ MVP) ← الأفضل غالبًا
> 2. **زوّد الفريق** (بحذر — الفرد الجديد بياخد وقت يتعلم)
> 3. **حرّك الـ Deadline**
>
> اللي **مش** حل: "هنشتغل بسرعة أكتر" — ده وهم بينتهي بجودة سيئة و Burnout.

### 3.4 — حط هامش أمان (Buffer)

القاعدة الذهبية: **خصص 15-20% من الوقت كهامش** للمفاجآت (Bugs، أجازات، متطلبات اتضحت متأخر). في مشروعنا: آخر Sprint (السادس) هيبقى **خفيف عمدًا** — تلميع (Polish) وإصلاح Bugs وتجهيز الإطلاق، مش ميزات جديدة.

### 3.5 — قواعد التقدير للمطور

| القاعدة | الشرح |
|---------|-------|
| **قدّر بالتشاؤم المعقول** | خد تقديرك الأولي واضرب في 1.5 — الأبحاث بتقول المطورين بيقدّروا أقل من الواقع بنسبة 30-50% |
| **التاسك أكبر من يومين؟ قسّمه** | التاسكات الكبيرة تقديرها دايمًا غلط |
| **احسب الشغل "الخفي"** | الـ Code Review والاجتماعات والـ Testing بياخدوا 30-40% من اليوم — يوم الشغل الفعلي = 5-6 ساعات كود مش 8 |
| **المجهول = Spike** | مش عارف التقنية دي هتاخد قد إيه؟ افتح Spike يوم واحد للبحث الأول، بعدين قدّر |

### الـ Roadmap بتاع مشروع "أكلة"

├────────────────────────────────────────────────────────────────┤

│ 🎯 Milestone: Demo داخلي — تصفح كامل شغال                     │
├────────────────────────────────────────────────────────────────┤
│ Sprint 3 (أسبوع 5-6)   │ السلة والطلب                          │
├────────────────────────────────────────────────────────────────┤

### قواعد ترتيب الشغل (بأي ميزة أبدأ؟)

1. **الاعتماديات الأول (Dependencies):** الحسابات قبل الطلب، لأن الطلب محتاج مستخدم مسجل.
2. **الأعلى خطورة الأول (Risk First):** لو في جزء تقني مش متأكد منه (مثلًا الخرائط والتتبع)، قدّمه — عشان لو فيه مشكلة تكتشفها بدري وقدامك وقت.
3. **الأعلى قيمة الأول (Value First):** بين حاجتين متساويين، ابدأ باللي المستخدم هيحس بيه أكتر.
4. **Milestone كل 2-4 أسابيع:** لازم يبقى فيه حاجة *تتشاف وتتلمس* بشكل دوري — ده بيحافظ على ثقة الـ Stakeholders ومعنويات الفريق.

## الخطوة 5: تنفيذ الـ Sprint الأول عمليًا (على Jira)

### إعداد المشروع (مرة واحدة)

1. أنشئ مشروع جديد → اختر **Scrum Template**.
2. عرّف الأعمدة: `To Do → In Progress → Code Review → QA → Done`.
3. اكتب الـ **Definition of Done** وعلّقها للفريق:
   - الكود اتراجع من زميل (Approved PR)
   - الاختبارات الآلية نجحت
   - الـ QA وافق على الـ Acceptance Criteria
   - اتدمج في main واتنشر على بيئة Staging
4. أدخل كل الـ Epics والـ Stories في الـ Backlog ورتّبهم بالأولوية.

### يوم Sprint Planning (الإثنين الأول)

```
09:00 - 09:15 │ الـ PO يشرح هدف الـ Sprint:
              │ "Sprint Goal: مستخدم يقدر يعمل حساب ويسجل دخول"
09:15 - 10:30 │ الفريق يسحب Stories من الـ Backlog (بحد أقصى 20 نقطة)
              │ ويقسّم كل Story لـ Tasks ويوزعوها
10:30 - 11:00 │ مراجعة أخيرة: "إحنا واثقين نقدر نخلص ده؟"
              │ لو لأ → شيل Story
```

### أسبوع الشغل النموذجي

| اليوم | الروتين |
|-------|---------|
| يوميًا 10:00 | Standup 15 دقيقة: عملت إيه / هعمل إيه / في Blocker؟ |
| يوميًا | كل مطور: ياخد تاسك → يعمل Branch باسم `AKLA-15-user-signup` → كود → PR → يحرك الكارت على الـ Board |
| الأربعاء | Backlog Refinement ساعة: تجهيز Stories الـ Sprint الجاي |
| آخر خميس | Sprint Review (عرض الشغل) + Retrospective |

### متابعة التقدم أثناء الـ Sprint

- **بص على الـ Burndown Chart يوميًا:** لو الخط الفعلي فوق الخط المثالي بكتير في نص الـ Sprint → في مشكلة، اتكلموا فيها في الـ Standup مش في آخر يوم.
- **قاعدة الـ WIP:** ممنوع مطور يبقى معاه أكتر من تاسكين In Progress — خلّص اللي في إيدك الأول.
- **Blocker عمره أكتر من يوم = تصعيد:** ميتساش في الـ Standup، الـ Scrum Master يتحرك فورًا.

من أول يوم، اعمل جدول بسيط اسمه **Risk Register** وراجعه كل Sprint:

|-------|:---:|:---:|-------------|
| API الخرائط أغلى من الميزانية | متوسط | عالي | Spike في Sprint 1 لتجربة بدائل مجانية (OpenStreetMap) |

**القاعدة:** الخطر اللي بتتكلم عنه بدري = مشكلة صغيرة. الخطر اللي بتتجاهله = كارثة في آخر أسبوع.

## الأخطاء العشرة القاتلة في إدارة المشاريع ❌

1. **البدء من غير Definition of Done** → كل واحد فاهم "خلصان" بطريقته.
2. **قبول Deadline من غير تقدير** → "ماشي هنخلص في شهر" قبل ما تقسّم الشغل أصلًا.
3. **Sprint مفتوح للإضافات** → كل يوم تاسك جديد ينط جوه، والـ Sprint عمره ما بيخلص.
4. **تجاهل الـ Velocity الحقيقية** → الفريق بينجز 15 نقطة وأنت مصمم تحط 25 كل مرة.
5. **مفيش Buffer** → الخطة مبنية على إن كل حاجة هتمشي مثالي (عمرها ما بتمشي مثالي).
6. **الاعتماديات مش محسوبة** → الـ Frontend واقف أسبوع مستني API محدش بدأ فيه.
7. **الـ Blockers بتتقال ومحدش بيتحرك** → الـ Standup بقى طقس شكلي.
8. **تأجيل الأجزاء الصعبة للآخر** → المفاجآت التقنية بتظهر وقت ما مفيش وقت.
9. **Demo أول مرة في آخر المشروع** → العميل يتفاجئ إن ده مش اللي كان متخيله.
10. **مفيش Retrospective** → نفس الأخطاء بتتكرر كل Sprint.

# الجزء الثالث: مستوى متقدم — تعمّق أكتر 🎓

## 1. أطر ترتيب الأولويات (Prioritization Frameworks)

لما يبقى عندك 50 تاسك وكلهم "مهمين"، إزاي تحدد تبدأ بإيه؟ دي الأطر اللي الشركات بتستخدمها فعليًا:

### MoSCoW — الأبسط والأكثر استخدامًا

| التصنيف | معناه | مثال من مشروع "أكلة" |
|---------|-------|----------------------|
| **M**ust have | من غيره المنتج ملوش لازمة | تصفح المطاعم، الطلب |
| **S**hould have | مهم جدًا بس ممكن نتأخر فيه شوية | تتبع الطلب على الخريطة |
| **C**ould have | لطيف لو لحقنا عليه | التقييمات والمفضلة |
| **W**on't have (now) | مش في النسخة دي نهائيًا | الدفع الإلكتروني، الكوبونات |

### RICE — لما عايز أرقام مش آراء

```
النتيجة = (Reach × Impact × Confidence) ÷ Effort

Reach      = كام مستخدم هيستفيد؟ (رقم شهري)
Impact     = التأثير عليهم (3 = ضخم، 2 = عالي، 1 = متوسط، 0.5 = قليل)
Confidence = قد إيه واثق في تقديراتك؟ (100% / 80% / 50%)
Effort     = كام شخص-شهر (Person-Month) هتاخد؟
```

**مثال:** ميزة "إعادة الطلب السابق بضغطة":
`(2000 مستخدم × 2 × 80%) ÷ 0.5 شهر = 6400` — مقابل ميزة "الوضع الليلي": `(3000 × 0.5 × 100%) ÷ 1 = 1500` → إعادة الطلب تكسب.

### مصفوفة Value vs Effort — للقرارات السريعة

```
                    قيمة عالية
                        │
      🏆 اعملها فورًا   │   📅 خطط لها كويس
      (Quick Wins)      │   (مشاريع كبيرة)
   ─────────────────────┼───────────────────── مجهود
      🤔 لو فضي وقت     │   🗑️ متعملهاش
      (Fill-ins)        │   (مضيعة وقت)
                        │
                    قيمة قليلة
```

---

## 2. حساب الـ Capacity بالساعات (التقدير التفصيلي)

الـ Story Points كويسة للصورة الكبيرة، لكن أحيانًا (خصوصًا مع عميل أو مدير بيسأل "هيخلص إمتى بالظبط؟") محتاج تحسب بالساعات:

### معادلة الـ Capacity الحقيقية

```
ساعات الفرد في الـ Sprint (أسبوعين):
  10 أيام عمل × 8 ساعات                    = 80 ساعة نظريًا
  - الاجتماعات (Standups + Planning + ...)  = -8 ساعات
  - Code Review لزمايلك                     = -6 ساعات
  - مقاطعات وأسئلة وSlack                   = -10 ساعات
  - Bugs طارئة من الإنتاج                   = -6 ساعات
  ─────────────────────────────────────────
  الصافي الواقعي                            ≈ 50 ساعة (يعني ~62%)
```

> 💡 **القاعدة الذهبية:** اعتبر إن يوم العمل = **5 ساعات كود فعلية** مش 8. أي خطة مبنية على 8 ساعات يومية هتفشل.

### مثال حساب فريق كامل لـ Sprint

| العضو | الأيام المتاحة | ملاحظات | الساعات الصافية |
|-------|:---:|---------|:---:|
| أحمد (Backend) | 10 | — | 50 |
| سارة (Frontend) | 8 | أجازة يومين | 40 |
| عمر (Full-stack) | 10 | نص وقته Support | 25 |
| **الإجمالي** | | | **115 ساعة** |

لو مجموع تقديرات التاسكات المرشحة للـ Sprint = 140 ساعة → **لازم تشيل تاسكات**. الالتزام بحاجة أكبر من الـ Capacity مش طموح، ده تخطيط فاشل.

## 3. ربط إدارة المشروع بالـ Git (Developer Workflow) 🔗

هنا بيتقابل عالم الإدارة مع عالم الكود — ودي الحتة اللي بتفرّق المطور المنظم:

### استراتيجية الـ Branches (GitHub Flow — الأبسط والأشهر)

```
main ────●──────●──────●──────●───→  (دايمًا شغال وجاهز للنشر)
          \    /  \    /
           ●──●    ●──●
        AKLA-15   AKLA-16
      (feature)  (bugfix)
```

**القواعد:**
1. `main` مقدس — عمرك ما تعمل Commit عليه مباشرة.
2. كل تاسك = Branch باسمه: `AKLA-15-user-signup`.
3. خلصت؟ افتح **Pull Request** واربطه بالتاسك.
4. Review + اختبارات آلية تنجح → Merge → التاسك يتحرك Done تلقائيًا.

### التكامل التلقائي بين Jira و GitHub

لو كتبت رقم التاسك في الـ Commit، السحر بيحصل لوحده:

```bash
git commit -m "AKLA-15 add signup form validation"
# → الـ Commit يظهر جوه التاسك في Jira تلقائيًا

git commit -m "AKLA-15 #done fix email validation"
# → التاسك يتحرك لعمود Done لوحده!
```

### قالب Pull Request محترف (انسخه واستخدمه)

```markdown
## التاسك
AKLA-15 — تسجيل مستخدم جديد

## إيه اللي اتغير؟
- إضافة شاشة التسجيل مع validation للإيميل والباسورد
- API endpoint جديد: POST /auth/signup

## إزاي تختبر؟
1. افتح /signup
2. جرّب إيميل غلط → لازم تظهر رسالة خطأ
3. جرّب بيانات صحيحة → يتم التوجيه للرئيسية

## Checklist
- [x] الاختبارات الآلية نجحت
- [x] جربت على Mobile
- [ ] محتاج مراجعة الـ error messages من الـ PO
```

### الـ CI/CD كجزء من الإدارة

الـ Definition of Done الاحترافية بتشمل Pipeline آلي:

```
Push الكود → Build → اختبارات آلية → Code Review بشري
     → Merge لـ main → نشر تلقائي على Staging
     → موافقة → نشر على Production
```

أدوات: **GitHub Actions** (الأسهل للبداية)، GitLab CI، Jenkins، Azure Pipelines.

## 4. إدارة مشروع لوحدك (Freelancer / Solo Developer) 👤

شغال Freelance أو بتبني مشروعك الشخصي؟ النظام بيتبسّط بس **مبيتلغيش**:

### النسخة المصغرة من Scrum لشخص واحد

| بدل | استخدم |
|-----|--------|
| Sprint Planning مع فريق | 30 دقيقة كل أحد: أحدد أهداف الأسبوع (3-5 تاسكات max) |
| Daily Standup | 5 دقايق الصبح: بكتب في Note "النهارده هخلص إيه؟" |
| Sprint Review | Demo للعميل كل أسبوع/أسبوعين (حتى لو فيديو قصير) |
| Retrospective | 15 دقيقة آخر الأسبوع: إيه اللي عطلني؟ أعمل إيه مختلف؟ |
| Jira | Trello أو Notion أو GitHub Projects — حاجة خفيفة |

### التعامل مع العميل في الـ Freelance (أهم جزء!)

1. **عقد/اتفاق مكتوب فيه النطاق بالتفصيل** — "موقع للشركة" جملة هتدمرك، لكن "5 صفحات: رئيسية، من نحن، خدمات، أعمال، تواصل — بدون لوحة تحكم" جملة بتحميك.
2. **قسّم الدفع على Milestones:** 30% مقدم → 40% عند نص الشغل (Demo) → 30% عند التسليم.
3. **سعّر التعديلات خارج النطاق من الأول:** "أي طلب خارج الاتفاق بيتسعّر ببند منفصل" — قولها في العقد مش وقت المشكلة.
4. **Demo أسبوعي حتى لو مطلبش:** العميل اللي بيشوف تقدم مستمر بيقلق أقل وبيدفع أسرع.
5. **قدّر الوقت واضرب في 2 للعميل:** لو خلصت بدري هتبقى بطل، لو اتأخرت عن وعدك هتبقى مشكلة — Under-promise, Over-deliver.

### قاعدة الـ Timeboxing للشغل الفردي

حدد وقت أقصى لكل تاسك قبل ما تبدأه: "هجرب أحل الـ Bug ده ساعتين — لو محلتوش بوقف وأدور على طريقة تانية أو أسأل". من غير الحدود دي، تاسك واحد ممكن ياكل أسبوعك.

## 5. المقاييس (Metrics) — إزاي تعرف إن الفريق ماشي صح 📊

### مقاييس الفريق الأساسية

| المقياس | بيقيس إيه | العلامة الصحية |
|---------|-----------|-----------------|
| **Velocity** | متوسط النقاط المنجزة لكل Sprint | ثابت أو بيزيد ببطء (التذبذب الشديد = مشكلة تقدير) |
| **Cycle Time** | من "In Progress" لـ "Done" | التاسك العادي: 1-3 أيام (أطول = تاسكات كبيرة أو Blockers) |
| **Sprint Completion %** | نسبة اللي اتخلص من اللي اتخطط | 80-95% (لو 100% دايمًا = بتخططوا أقل من قدرتكم) |
| **Escaped Bugs** | Bugs اكتشفها المستخدم بعد النشر | كل ما قلّت كل ما كان الـ QA أقوى |

### مقاييس DORA — المعيار العالمي لفرق التطوير

دي المقاييس الأربعة اللي بتقيس بيها Google وأمثالها كفاءة فرق التطوير:

1. **Deployment Frequency:** بتنشروا كل قد إيه؟ (الفرق الممتازة: يوميًا)
2. **Lead Time for Changes:** من كتابة الكود لوصوله للمستخدم؟ (الممتاز: أقل من يوم)
3. **Change Failure Rate:** نسبة النشرات اللي عملت مشاكل؟ (الممتاز: 0-15%)
4. **Time to Restore:** لو الإنتاج وقع، بترجعوه في قد إيه؟ (الممتاز: أقل من ساعة)

> ⚠️ **تحذير مهم:** المقاييس أدوات تشخيص مش أدوات تقييم أفراد. أول ما تقيّم مطور بعدد التاسكات أو الـ Commits، هيلعب بالأرقام والجودة هتنهار (Goodhart's Law: "لما المقياس يبقى هدف، بيبطل يكون مقياس كويس").

## 6. إدارة الفرق عن بعد (Remote Teams) 🌍

معظم الشغل دلوقتي Remote أو Hybrid، وده بيغير قواعد اللعبة:

### القواعد الذهبية

1. **Async-first (اللاتزامني أولًا):** متعتمدش إن الكل Online نفس الوقت. القرارات والنقاشات المهمة **تتكتب** (في التاسك نفسه أو Slack Thread) مش تتقال في مكالمة وتضيع.
2. **الكاميرا مش إلزامية بس الوضوح إلزامي:** Standup مكتوب في Slack كل صبح بيغني عن اجتماع لو الفريق موزع على Time Zones.

```
📝 قالب Standup المكتوب (كل واحد يكتبه 9 صباحًا بتوقيته):
✅ امبارح: خلصت AKLA-15 وفتحت PR
🎯 النهارده: هبدأ AKLA-18 (شاشة المنيو)
🚧 معطلني: مستني مراجعة الـ PR من أحمد
```

3. **Overlap Hours:** حددوا 3-4 ساعات يوميًا الكل فيها متاح للمكالمات السريعة.
4. **وثّق كأن اللي هيقرا مش موجود معاك:** التاسك لازم يكون فيه كل التفاصيل — Screenshots، لينكات، الـ Acceptance Criteria — عشان محدش يستنى إجابة سؤال 6 ساعات بسبب فرق التوقيت.
5. **اجتماع واحد اجتماعي أسبوعيًا:** 30 دقيقة من غير شغل — الفرق الـ Remote بتنهار اجتماعيًا قبل ما تنهار تقنيًا.

## 7. التوثيق (Documentation) — الجزء اللي الكل بيهمله 📝

المشروع المدار كويس = مشروع موثق كويس. الحد الأدنى المطلوب:

| المستند | فين | بيتحدث إمتى |
|---------|-----|-------------|
| **README.md** | في الـ Repo | إزاي تشغّل المشروع محليًا — أي مطور جديد لازم يشغّله في أقل من ساعة |
| **Project Charter** | Notion/Confluence | مرة في البداية + عند أي تغيير جوهري |
| **ADRs (Architecture Decision Records)** | في الـ Repo | عند كل قرار تقني كبير: "ليه اخترنا PostgreSQL مش MongoDB؟" — 10 سطور بتوفر جدال متكرر لسنين |
| **API Documentation** | Swagger/Postman | تلقائيًا مع الكود |
| **Onboarding Doc** | Notion/Confluence | كل ما ينضم حد جديد ويلاقي حاجة ناقصة، يضيفها |

**قالب ADR بسيط:**
```markdown
# ADR-003: استخدام PostgreSQL كقاعدة بيانات رئيسية
التاريخ: 2026-07-09 | الحالة: مقبول

## السياق
محتاجين قاعدة بيانات للطلبات والمستخدمين، فيها علاقات كتير.

## القرار
PostgreSQL.

## الأسباب
- بياناتنا علائقية بطبيعتها (طلب ← مستخدم ← مطعم)
- الفريق عنده خبرة فيها
- مجانية ومستقرة

## البدائل المرفوضة
- MongoDB: مرونة مش محتاجينها + هنخسر الـ Joins
```

## 9. أسئلة المقابلات الشخصية عن Agile وإدارة المشاريع 💼

الأسئلة دي بتتسأل فعليًا في مقابلات المطورين — جهّز إجاباتك:

1. **"اشرح لي إزاي كان فريقكم شغال؟"** → اوصف الـ Ceremonies بالتفصيل: مدة الـ Sprint، الـ Standup، إزاي كنتوا بتقدّروا.
2. **"إيه الفرق بين Scrum و Kanban وإمتى تختار كل واحد؟"** → (الإجابة في الجزء الأول من الدليل).
3. **"تاسك اكتشفت إنه أكبر بكتير من تقديره وأنت في نص الـ Sprint — تعمل إيه؟"** → الإجابة النموذجية: أبلّغ فورًا في الـ Standup (مش أستنى)، أناقش مع الـ PO: نقسّمه ونرحّل جزء، أو نشيل حاجة تانية من الـ Sprint.
4. **"الـ PO عايز يضيف ميزة عاجلة في نص الـ Sprint؟"** → الـ Sprint Scope محمي، لكن لو فعلًا عاجلة: نشيل حاجة بنفس الحجم بدالها — Trade-off مش إضافة.
5. **"إزاي بتقدّر المهام؟ وليه Story Points مش ساعات؟"** → النقاط نسبية وبتمتص فروق السرعة بين الأفراد، والفريق بيتفق عليها جماعيًا فبتبقى أدق على المدى الطويل.
6. **"احكيلي عن مرة مشروع اتأخر — إيه اللي حصل؟"** → استخدم صيغة STAR (Situation, Task, Action, Result) وركّز على الدرس المستفاد مش اللوم.

## 11. قوالب جاهزة تنسخها وتستخدمها 📋

### قالب User Story كامل

```markdown
## العنوان
As a [نوع المستخدم], I want to [الفعل] so that [القيمة/السبب]

## الوصف
تفاصيل إضافية + لينك التصميم على Figma

## Acceptance Criteria
- [ ] Given [الوضع الابتدائي] When [الفعل] Then [النتيجة المتوقعة]
- [ ] Given ... When ... Then ...

## ملاحظات تقنية
- الـ API endpoints المتأثرة
- أي اعتماديات على تاسكات تانية

## التقدير: __ نقطة | الأولوية: Must/Should/Could
```

### قالب أجندة Retrospective (ساعة واحدة)

```
1. (5 د)  تذكير: "مساحة أمان — بنناقش العملية مش الأشخاص"
2. (15 د) كل واحد يكتب على Sticky Notes (أو Miro):
          😊 إيه اللي مشي كويس؟
          😕 إيه اللي ضايقنا؟
          💡 إيه اللي نجربه؟
3. (15 د) تجميع المتشابه والتصويت على أهم 3 نقط
4. (20 د) مناقشة الـ 3 نقط → Action Items واضحة بمسؤول لكل واحدة
5. (5 د)  مراجعة Action Items بتاعة الـ Retro اللي فات — اتنفذت؟
```

### قالب رسالة تأخير للعميل/المدير (لأن التأخير بيحصل)

```
الموضوع: تحديث بخصوص [الميزة] — تعديل في الموعد

أثناء تنفيذ [الميزة]، اكتشفنا [السبب التقني باختصار وبدون تعقيد].

التأثير: التسليم هيتأخر من [التاريخ] لـ [التاريخ الجديد].

إيه اللي عملناه: [الإجراء — مثلًا: قسّمنا الشغل عشان نسلّم الجزء الأساسي في معاده].

البدائل المتاحة:
1. نسلّم نسخة مبسطة في الموعد الأصلي + الباقي بعدها بأسبوع
2. نلتزم بالنسخة الكاملة في الموعد الجديد

إيه اللي تفضله؟
```

> 💡 لاحظ الصيغة: **بدري + سبب واضح + حلول مقترحة**. التأخير اللي بيتقال قبلها بأسبوعين ومعاه بدائل = احترافية. اللي بيتقال يوم التسليم = كارثة ثقة.

## 12. مسرد مصطلحات إضافي (اللي هتسمعه في الاجتماعات)

| المصطلح | معناه |
|---------|-------|
| **Scope Creep** | تضخم المتطلبات تدريجيًا من غير تعديل الوقت/الميزانية — قاتل المشاريع الأول |
| **Bandwidth** | "معنديش Bandwidth" = مشغول ومفيش وقت |
| **Deliverable** | مخرج ملموس بيتسلم (كود، تصميم، تقرير) |
| **Dependency** | تاسك مستني تاسك تاني يخلص |
| **Critical Path** | سلسلة التاسكات اللي أي تأخير فيها بيأخر المشروع كله |
| **Timeboxing** | تحديد وقت أقصى ثابت للنشاط مهما كان |
| **Bus Factor** | لو فلان "خبطته أتوبيسة" المشروع يقف؟ (Bus Factor = 1 خطر — لازم المعرفة تتوزع) |
| **RACI** | مصفوفة المسؤوليات: Responsible (منفذ) / Accountable (مسؤول نهائيًا) / Consulted (يُستشار) / Informed (يُبلّغ) |
| **Post-mortem** | تحليل مكتوب بعد مشكلة كبيرة: إيه اللي حصل وإزاي نمنع تكراره — بدون لوم (Blameless) |
| **Stakeholder Management** | إدارة توقعات كل الأطراف المهتمة بالمشروع |
| **Feature Flag** | نشر ميزة "مطفية" وتشغيلها لاحقًا بضغطة — بيفصل النشر عن الإطلاق |
| **Hotfix** | إصلاح عاجل بيتنشر فورًا خارج الدورة العادية |
| **Regression** | ميزة كانت شغالة وباظت بسبب تعديل جديد |
| **Stand-down** | إلغاء حالة الطوارئ بعد حل مشكلة |
| **Runway** | (في الـ Startups) الوقت المتبقي قبل ما الفلوس تخلص — بيحدد أولويات كل حاجة |

# الجزء الرابع: الشرح المبسط جدًا — كل مفهوم بمثال من الحياة 🍕

الجزء ده معمول لو حسيت إن الكلام اللي فات تقيل — هنشرح كل حاجة تاني **كأنك عمرك ما سمعت عنها**، بتشبيهات من الحياة اليومية وأمثلة كتيرة جدًا.

---

## 1. المنهجيات بتشبيه المطعم 🍽️

تخيل إنك بتفتح مطعم وجالك زبون:

### Waterfall = مطعم الأفراح
الزبون بيطلب فرح كامل لـ 200 شخص بعد 3 شهور. بتقعدوا تتفقوا على **كل حاجة بالتفصيل من الأول**: المنيو كامل، الأصناف، الكميات. وبعدين تختفي 3 شهور وتظهر يوم الفرح بالأكل كله مرة واحدة.
- **المشكلة:** لو العروسة غيرت رأيها في النص وعايزة أكل إيطالي بدل شرقي... كارثة، لأنك اشتريت الخامات وجهزت كل حاجة.

### Agile = مطعم عادي
الزبون قاعد على الطرابيزة. بتجيب له **المقبلات الأول** (بعد 10 دقايق)، ياكل ويقولك رأيه: "الطحينة تحفة بس ناقصة ليمون". بتظبط، وتجيب الطبق الرئيسي، وهكذا. **كل شوية بتسلّم حاجة صغيرة وتاخد رأيه وتعدّل.**
- **الميزة:** لو مش عاجبه اتجاه الأكل، بتعرف بدري وتصلح — مش بعد ما الأكل كله يتقدم.

### Scrum = المطبخ المنظم بدورات
المطبخ بيشتغل بنظام: كل **ساعتين** (= Sprint) الشيف بيجمع الطباخين 5 دقايق الصبح (= Standup): "مين بيعمل إيه؟ في حاجة ناقصة من السوق؟" وفي آخر كل فترة بيراجعوا: "طلبات إيه اتأخرت النهارده وليه؟" (= Retrospective).

### Kanban = شباك الطلبات في مطعم برجر
شفت الشاشة اللي في المطاعم السريعة؟ الطلبات معلقة في صف: **"جديد → على النار → بيتغلف → جاهز"**. كل طلب بيتحرك من خانة لخانة، والطباخ **مش بيبدأ برجر جديد غير لما يخلص اللي في إيده** (= WIP Limit). مفيش "دورات" — الطلبات بتيجي وتتنفذ باستمرار.

---

## 2. Epic و Story و Task — التقسيم بالتشبيه 🏗️

تخيل إنك بتجهز شقة عروسين:

```
🏠 المشروع: "تجهيز الشقة"
│
├── 🛋️ Epic: "تجهيز الريسبشن"        ← هدف كبير (أسابيع)
│   │
│   ├── 📖 Story: "عايزين مكان قعدة مريح
│   │              نستقبل فيه الضيوف"    ← احتياج للإنسان (أيام)
│   │   │
│   │   ├── ✅ Task: نقيس المساحة           ← خطوة تنفيذية (ساعات)
│   │   ├── ✅ Task: نختار الأنتريه ونشتريه
│   │   ├── ✅ Task: التوصيل والتركيب
│   │   └── ✅ Task: تنجيد وتظبيط
│   │
│   └── 📖 Story: "عايزين إضاءة دافية للسهرات"
│       ├── ✅ Task: شراء أباجورات
│       └── ✅ Task: تركيب ديمر (Dimmer) للتحكم في الإضاءة
│
├── 🍳 Epic: "تجهيز المطبخ"
└── 🛏️ Epic: "تجهيز غرفة النوم"
```

**القاعدة السهلة للتفرقة:**
- **Epic** = فصل في كتاب (كبير، بياخد أسابيع)
- **Story** = صفحة (احتياج واحد واضح للمستخدم، بيخلص في Sprint واحد)
- **Task** = سطر (شغلانة تقنية محددة، ساعات ليوم أو اتنين)

### والفرق الجوهري بين Story و Task؟

- الـ **Story** مكتوبة بلغة **الإنسان/المستخدم**: "عايز أعمل كذا عشان أستفيد كذا" — أمك ممكن تفهمها.
- الـ **Task** مكتوبة بلغة **التقنية**: "نعمل Endpoint ونظبط الـ Database" — أمك مش هتفهمها 😄

## 3. ورشة تقسيم كاملة: 3 أمثلة من 3 تطبيقات مختلفة

### مثال 1: تطبيق متجر إلكتروني 🛒

**الـ Story:**
> As a customer, I want to add products to a shopping cart so that I can buy multiple items in one order.
> (كزبون، عايز أضيف منتجات لسلة المشتريات عشان أشتري أكتر من حاجة في طلب واحد)

**الـ Acceptance Criteria (شروط القبول):**
- ✅ لما أدوس "أضف للسلة" العداد اللي فوق يزيد فورًا
- ✅ لو ضفت نفس المنتج مرتين، الكمية تزيد مش يتكرر سطرين
- ✅ السلة تفضل محفوظة حتى لو قفلت التطبيق وفتحته تاني
- ✅ لو المنتج خلص من المخزن تظهر رسالة "غير متوفر" ومينفعش يضاف

**التقسيم لـ Tasks:**

| # | التاسك | النوع | تقدير |
|---|--------|------|:---:|
| 1 | تصميم Database: جدول `cart_items` (user_id, product_id, quantity) | Backend | 2 ساعة |
| 2 | API: `POST /cart/items` لإضافة منتج | Backend | 3 ساعات |
| 3 | API: `GET /cart` لعرض السلة | Backend | 2 ساعة |
| 4 | منطق "لو المنتج موجود زوّد الكمية" | Backend | 2 ساعة |
| 5 | التحقق من المخزون قبل الإضافة | Backend | 3 ساعات |
| 6 | زرار "أضف للسلة" + الأنيميشن + تحديث العداد | Frontend | 4 ساعات |
| 7 | شاشة السلة (عرض، حذف، تعديل كمية) | Frontend | 6 ساعات |
| 8 | حفظ السلة محليًا لغير المسجلين | Frontend | 3 ساعات |
| 9 | كتابة اختبارات (منتج خلصان، كميات سالبة...) | QA | 4 ساعات |

**لاحظ إزاي:** Story واحدة "بسيطة" طلعت 9 تاسكات و~29 ساعة شغل. **ده بالظبط ليه التقدير من غير تقسيم بيبقى كارثة.**

### مثال 2: تطبيق شات 💬

**الـ Story:**
> As a user, I want to see when my message was read so that I know the other person saw it.
> (كمستخدم، عايز أشوف علامة "تمت القراءة" عشان أعرف إن الطرف التاني شاف رسالتي)

**التقسيم:**
```
├── [Backend]  إضافة حقل read_at لجدول الرسايل
├── [Backend]  Event لما المستخدم يفتح المحادثة → تحديث read_at
├── [Backend]  إرسال إشعار real-time للطرف التاني (WebSocket)
├── [Frontend] عرض العلامة: ✓ اتبعتت / ✓✓ اتقرت
├── [Frontend] استقبال الـ WebSocket event وتحديث العلامة لايف
└── [QA]       حالات خاصة: جروبات؟ رسايل قديمة؟ النت قطع؟
```

### مثال 3: موقع حجز دكاترة 🩺

**Epic كامل متقسم:**
```
Epic: "حجز موعد مع دكتور"
│
├── Story 1: البحث عن دكتور بالتخصص والمنطقة       (5 نقط)
├── Story 2: عرض المواعيد المتاحة للدكتور            (8 نقط)
│            ← دي أصعب واحدة (تقويم + تعارضات) فخدت نقط أكتر
├── Story 3: تأكيد الحجز واستلام رسالة تأكيد          (5 نقط)
├── Story 4: إلغاء أو تعديل الحجز                     (3 نقط)
└── Story 5: تذكير قبل الموعد بيوم (SMS)              (3 نقط)
```

**تمرين ليك 💪:** خد أي تطبيق بتستخدمه (Instagram مثلًا) واختار ميزة واحدة (رفع Story) وحاول تقسّمها بنفس الطريقة. اعمل ده 3 مرات وهتلاقي نفسك بتفكر زي الـ Senior.

## 4. الـ Story Points بشرح "التيشيرتات" 👕

الناس بتتلخبط في النقاط لأنها **مش وقت**. أسهل طريقة تفهمها:

تخيل إنك بتقيّم شنط سفر بالحجم مش بالوزن بالجرام:

| النقط | المقاس | يعني إيه | مثال |
|:---:|:---:|----------|------|
| 1 | XS | تعديل تافه، عارف مكانه بالظبط | تغيير لون زرار أو نص رسالة |
| 2 | S | صغير وواضح | إضافة حقل جديد في فورم موجود |
| 3 | M | شغلانة عادية، مفيش مفاجآت متوقعة | شاشة عرض بسيطة بـ API جاهز |
| 5 | L | شغل معتبر، فيه شوية تفاصيل | فورم تسجيل كامل بـ validation |
| 8 | XL | كبير ومعقد، فيه أجزاء مش واضحة | نظام إشعارات real-time |
| 13 | XXL | 🚨 **كبير أوي — لازم يتقسم!** | "نظام الدفع" ← ده Epic مش Story |

**ليه نقط مش ساعات؟ المثال اللي بيوضح كل حاجة:**

سألت أحمد (Senior) وكريم (Junior): "المشوار من هنا للمهندسين بعيد؟"
- بالوقت: أحمد هيقول "20 دقيقة" (بعربيته)، كريم هيقول "ساعة" (بالمواصلات) — **اختلفوا!**
- بالنسبية: الاتنين هيتفقوا إن "المهندسين أبعد من الدقي بمرتين" — **اتفقوا!**

النقط بتقيس **حجم الشغلانة نفسها**، والوقت بيختلف حسب مين اللي هينفذ. وبعد كام Sprint بتعرف إن فريقك بينجز مثلًا 20 نقطة كل أسبوعين — وساعتها تقدر تحول لوقت.

**مشهد Planning Poker حقيقي:**
```
PO:    "Story: المستخدم يقدر يرفع صورة بروفايل"
الكل:  (يرفعوا كروت) → أحمد: 2 | سارة: 5 | عمر: 3
SM:    "سارة، ليه 5؟"
سارة:  "هو فاكرين الضغط والقص (Crop)؟ ده مش مكتوب بس أكيد مطلوب"
أحمد:  "معندناش مكتبة قص أصلًا... طب فعلًا 5"
الكل:  (تصويت تاني) → 5 | 5 | 5 ✅
```
**لاحظ:** قيمة الجلسة مش الرقم — قيمتها إن **سارة كشفت تفصيلة كانت هتظهر كمفاجأة** في نص الشغل.

## 6. جولة عملية جوه كل أداة — خطوة بخطوة 🔧

### Trello: أول Board ليك في 10 دقايق

**السيناريو:** هتنظم بيه مذاكرتك أو مشروع تخرجك.

```
الخطوة 1: trello.com → Sign up مجاني → Create Board باسم "مشروع التخرج"

الخطوة 2: اعمل 4 قوايم (Lists):
  📋 To Do  |  🔨 Doing  |  👀 Review  |  ✅ Done

الخطوة 3: ضيف كروت (Cards) في To Do:
  - "كتابة الفصل الأول"
  - "تصميم شاشة اللوجين"
  - "جمع الأبحاث المشابهة"

الخطوة 4: افتح أي كارت وضيف:
  - Description: تفاصيل المطلوب
  - Checklist: خطوات فرعية ✓
  - Due date: ديدلاين
  - Member: مين المسؤول (لو فريق)
  - Label: لون حسب النوع (أحمر=عاجل، أزرق=Backend...)

الخطوة 5 (القاعدة الوحيدة): 
  بدأت شغل في كارت؟ اسحبه لـ Doing
  ومش مسموح بأكتر من كارتين في Doing لكل شخص!
```
**خلاص، أنت كده بتطبق Kanban حقيقي.** البساطة دي هي قوة Trello.

### Jira: أول مشروع Scrum خطوة بخطوة

```
الخطوة 1: atlassian.com/software/jira → خطة Free (لحد 10 أشخاص)

الخطوة 2: Create Project → اختار Template: "Scrum"
  سمّيه "Akla" → هيدّي كل تاسك رقم تلقائي: AKLA-1, AKLA-2...

الخطوة 3: هتلاقي قدامك حتتين رئيسيتين:
  📚 Backlog: المخزن — كل الشغل المستقبلي
  🏃 Board: الشغل الحالي في الـ Sprint

الخطوة 4: املا الـ Backlog:
  Create Issue → النوع:
    🟪 Epic  → "نظام الحسابات"
    🟩 Story → "As a user, I want to sign up..."
             → واربطها بالـ Epic من خانة Parent
    🟦 Task  → الشغل التقني
    🟥 Bug   → المشاكل

الخطوة 5: لكل Story:
  - اكتب الـ Description والـ Acceptance Criteria
  - حط Story Points من خانة Estimate
  - رتّبها في الـ Backlog بالسحب (الأهم فوق)

الخطوة 6: ابدأ Sprint:
  من الـ Backlog → Create Sprint → اسحب جواه Stories بـ ~20 نقطة
  → دوس Start Sprint وحدد أسبوعين

الخطوة 7: يوميًا:
  افتح الـ Board واسحب التاسكات بين الأعمدة
  (To Do → In Progress → Done)

الخطوة 8: تابع التقدم:
  Reports → Burndown Chart
  الخط الرمادي = المثالي | الأحمر = الواقع
  الأحمر فوق الرمادي بكتير؟ = متأخرين، اتكلموا
```

### ClickUp: التنظيم الهرمي

قوة ClickUp في الهيكل — مناسب لو بتدير أكتر من مشروع:
```
Workspace (الشركة)
└── Space: "التطبيقات"
    └── Folder: "تطبيق أكلة"
        ├── List: "Sprint الحالي"
        ├── List: "Backlog"
        └── List: "Bugs"
```
وميزته القاتلة: **نفس التاسكات تشوفها بأشكال مختلفة بضغطة** — List (قايمة) / Board (كانبان) / Calendar (تقويم) / Gantt (خط زمني بالاعتماديات). المدير بيحب الـ Gantt والمطور بيحب الـ Board — والاتنين بيبصوا على نفس الداتا.

### Linear: سرعة الكيبورد

فلسفته: "متلمسش الماوس". كل حاجة باختصارات:
```
C          → تاسك جديد
Cmd/Ctrl+K → شريط أوامر لأي حاجة (زي Spotlight)
A          → إسناد التاسك لحد
1/2/3/4    → تحديد الأولوية (Urgent/High/Medium/Low)
```
- الـ Sprints عنده اسمها **Cycles** وبتتعمل أوتوماتيك كل أسبوعين.
- اللي مخلصش بيترحّل للـ Cycle الجاي **تلقائيًا** — مفيش قعدة ترحيل يدوي.
- تكامل GitHub سحري: تعمل Branch باسم التاسك → أول ما تفتح PR التاسك يتحرك "In Review" لوحده → أول ما يتدمج يبقى "Done" لوحده.

### GitHub Projects: لو مشروعك أصلًا على GitHub

```
الخطوة 1: من صفحة الـ Repo → تاب Projects → New Project → Board

الخطوة 2: كل تاسك = Issue عادية:
  New Issue → "Add login page" → هتاخد رقم #12

الخطوة 3: اربط الكود بالـ Issue:
  git commit -m "add login form, closes #12"
  → أول ما يتدمج، الـ Issue بتتقفل لوحدها! ✨

الخطوة 4: استخدم Labels: bug / enhancement / good-first-issue
  و Milestones: "v1.0" وحط فيها الـ Issues المطلوبة للإصدار
```
**مثالي لـ:** مشاريعك الشخصية والـ Open Source — كل حاجة في مكان واحد مجانًا.

### إيه الأداة المناسبة ليك دلوقتي؟ (شجرة قرار)

```
بتنظم حياتك/مذاكرتك؟            → Trello
مشروع برمجي شخصي على GitHub؟    → GitHub Projects
مشروع تخرج مع فريق صغير؟        → Trello أو ClickUp
بتجهز نفسك لسوق العمل؟          → اتعلم Jira (إجباري 😄)
Startup سريعة؟                   → Linear
شركة كبيرة Microsoft؟           → Azure DevOps
```

## 7. المصطلحات اللي بتتلخبط في بعضها — مرة واحدة وللأبد 🔄

### Backlog vs Sprint Backlog
- **Product Backlog** = تلاجة البيت كلها (كل الأكل الموجود)
- **Sprint Backlog** = الطبق اللي حطيته قدامك دلوقتي (اللي هتاكله فعلًا)

### Sprint Review vs Retrospective (أشهر لخبطة!)
- **Review** = بنعرض **المنتج** على بره (العميل/الإدارة): "بصوا عملنا إيه" → Demo
- **Retro** = بنراجع **نفسنا** جوه (الفريق بس): "اشتغلنا إزاي وإيه اللي نحسنه" → نقاش صريح

### Acceptance Criteria vs Definition of Done
- **Acceptance Criteria** = شروط خاصة **بالـ Story دي بس**: "زرار اللوجين يودّي على الرئيسية"
- **Definition of Done** = شروط عامة على **كل الشغل**: "أي تاسك لازم يتراجع كوده وتنجح اختباراته"
- يعني: كل Story ليها Acceptance Criteria مختلفة، لكن الـ DoD واحدة للكل.

### Velocity vs Capacity
- **Capacity** = قد إيه **متاح** (ساعات الفريق الفاضية) — بتتحسب قبل الـ Sprint
- **Velocity** = قد إيه **بيتنجز فعلًا** (متوسط النقاط) — بتتقاس بعد الـ Sprint

### Lead Time vs Cycle Time
- **Lead Time** = من لحظة ما الطلب **اتكتب** لحد التسليم (تجربة العميل)
- **Cycle Time** = من لحظة ما الشغل **بدأ** لحد التسليم (سرعة الفريق)
- بالتشبيه: طلبت بيتزا الساعة 3 ووصلت 4 → Lead Time ساعة. المطبخ بدأ يعملها 3:40 → Cycle Time 20 دقيقة.

### Bug vs Issue vs Ticket
كلهم تقريبًا نفس الحاجة بأسامي مختلفة حسب الأداة:
- **Issue** = أي بند شغل (في GitHub وLinear)
- **Ticket** = نفس المعنى (مصطلح قديم من أنظمة الدعم، ولسه شائع: "افتح تيكيت")
- **Bug** = نوع محدد منهم: حاجة كانت شغالة/مفروض تشتغل وباظت

## 8. أمثلة User Stories جاهزة لكل أنواع التطبيقات 📚

مكتبة تقتبس منها — لاحظ الصيغة الثابتة: **مين + عايز إيه + ليه**:

**تطبيق توصيل:**
- As a customer, I want to track my order on a map so that I know when it will arrive.
- As a restaurant owner, I want to mark items as sold out so that customers don't order unavailable food.
- As a delivery driver, I want to see the best route so that I deliver faster.

**تطبيق تعليمي:**
- As a student, I want to download lessons so that I can study offline.
- As a teacher, I want to see who watched my video so that I can follow up with absent students.
- As a parent, I want a weekly report of my child's progress so that I stay informed.

**تطبيق بنكي:**
- As a user, I want to freeze my card instantly so that I'm protected if I lose it.
- As a user, I want to receive a notification for every transaction so that I detect fraud early.

**لاحظ الفرق بين Story كويسة ووحشة:**

| ❌ وحشة | ✅ كويسة | ليه؟ |
|---------|---------|------|
| "نعمل صفحة بروفايل" | "As a user, I want to edit my profile picture and bio so that others recognize me" | الأولى مفيهاش مين ولا ليه — مش هتعرف تحدد Acceptance Criteria |
| "تحسين الأداء" | "As a user, I want the home screen to load in under 2 seconds so that I don't abandon the app" | الأولى مش قابلة للقياس — إمتى نقول خلصت؟ |
| "نظام الدفع" | (دي Epic! تتقسم لـ 6-7 Stories) | أكبر من إنها تخلص في Sprint |

## 9. أسئلة بتتسأل كتير من المبتدئين (FAQ) ❓

**س: أنا لسه بتعلم برمجة — أتعلم ده دلوقتي ولا بعدين؟**
ج: الأساسيات دلوقتي (يعني إيه Sprint وTask وStandup — يوم واحد قراءة)، والتعمق مع أول مشروع جماعي. بس متروحش أول شغلانة وأنت مش عارف يعني إيه Scrum.

**س: التاسك خد ضعف الوقت اللي قدرته — أنا فاشل؟**
ج: لأ، ده طبيعي جدًا خصوصًا في الأول. الفشل الحقيقي هو إنك **متبلغش** أول ما تحس إن التقدير هيتكسر. قول بدري = محترف. اسكت لآخر يوم = مشكلة.

**س: الـ Standup بيتحول لاجتماع ساعة عندنا — ده طبيعي؟**
ج: لأ، ده مرض شائع اسمه "Standup المتضخم". العلاج: أي نقاش أطول من دقيقة → "خلينا ناخدها بعد الاجتماع" (اسمها Parking Lot) ويكملها المعنيين بس.

**س: مين اللي بيكتب التاسكات — أنا ولا الـ PM؟**
ج: الاتنين. الـ PO/PM بيكتب الـ **Stories** (المطلوب من منظور المستخدم)، وأنت كمطور بتقسّمها لـ **Tasks** تقنية — لأنك أنت اللي عارف الشغل هيتعمل إزاي.

**س: شركتي بتقول إنها Agile بس مفيش لا Retro ولا Planning — إيه ده؟**
ج: اسمه ساخرًا "Agile بالاسم" أو Scrum-but ("بنعمل Scrum بس من غير..."). منتشر للأسف. استفيد باللي موجود، وطبّق المبادئ على شغلك الشخصي على الأقل (قسّم، قدّر، راجع نفسك).

**س: ممكن أستخدم أكتر من أداة مع بعض؟**
ج: أيوه ودي الطبيعي: **Jira** للتاسكات + **Slack** للكلام + **Confluence/Notion** للتوثيق + **Figma** للتصميم + **GitHub** للكود. المهم يكون في **مصدر حقيقة واحد** للتاسكات — مش تاسكات هنا وهنا وتتوه.

**س: إيه أول حاجة أعملها لو بقيت مسؤول عن مشروع بكرة الصبح؟**
ج: بالترتيب: (1) افهم الهدف والـ Deadline، (2) اكتب كل الشغل المعروف كـ Stories، (3) قدّر بسرعة مع الفريق، (4) اقسم على الـ Velocity — لو الحسبة مش طالعة قول ده **في أول يوم** مش آخر أسبوع، (5) ابدأ أول Sprint بالأهم.

---

## 10. تمرين ختامي متكامل: طبّق بنفسك دلوقتي ✍️

خد ورقة وقلم (أو افتح Trello) ونفّذ التمرين ده على **"تطبيق ملاحظات بسيط زي Google Keep"**:

```
1. اكتب Project Charter من 5 سطور
   (المشكلة؟ المستخدم؟ الـ MVP؟ إيه اللي بره النطاق؟)

2. قسّمه لـ 3 Epics
   (مثلًا: الحسابات / الملاحظات / التنظيم والبحث)

3. اكتب تحت كل Epic ثلاث User Stories بالصيغة الصحيحة

4. اختار Story واحدة واكتب لها:
   - 4 Acceptance Criteria
   - قسّمها لـ 5-7 Tasks تقنية

5. قدّر كل الـ Stories بالنقاط (1/2/3/5/8)

6. افرض إن Velocity بتاعتك 10 نقط أسبوعيًا
   → احسب: المشروع هياخد كام أسبوع؟

7. رتّب: إيه أول Sprint؟ (افتكر: الاعتماديات الأول!)
```

لو عملت التمرين ده كامل — مبروك، أنت فاهم إدارة المشاريع **عمليًا** أكتر من ناس كتير شغالة بيها سنين من غير ما تفهمها. 🏆

# الجزء الخامس: بنبني شركة من الصفر — الفريق والأدوار وطريقة الشغل 🏢

**السيناريو:** 3 أصدقاء قرروا يعملوا شركة ناشئة اسمها **"سهلة" (Sahla)** — منصة SaaS بتساعد المحلات الصغيرة تدير مخزونها ومبيعاتها. معاهم تمويل يكفي فريق لغاية 12 شخص لمدة سنة. هنمشي معاهم مرحلة بمرحلة: مين نعيّن؟ نقسّم الفريق إزاي؟ مين مسؤول عن إيه؟ والشغل بيمشي إزاي من الفكرة للإطلاق.

---

## المرحلة 1: الشركة بـ 3 أفراد (الشهور 0-3) 👥

في البداية **مفيش تقسيم رسمي** — الكل بيعمل كل حاجة، بس لازم يكون في **مالك واضح لكل منطقة** عشان القرارات متتعطلش:

| الشخص | اللقب | مسؤول نهائيًا عن |
|-------|------|-------------------|
| كريم | CEO | المنتج + العملاء + الفلوس + البيع |
| نور | CTO | كل القرارات التقنية + كتابة الكود |
| هبة | Product Designer | التصميم + أبحاث المستخدمين + بتساعد في الـ Frontend |

**طريقة الشغل في المرحلة دي:**
- **Kanban بسيط على Linear أو Trello** — مفيش Sprints رسمية، الأولويات بتتغير أسبوعيًا حسب كلام العملاء.
- اجتماع واحد أسبوعي (الإثنين، ساعة): إيه أهم 3 حاجات الأسبوع ده؟
- **قاعدة ذهبية للـ Startup المبكرة:** الهدف مش الكمال، الهدف تطلع نسخة لأول 10 عملاء بأسرع وقت وتسمع منهم.

---

## المرحلة 2: أول توسع — فريق 7 أفراد (الشهور 4-8) 👥👥

المنتج نجح مع أول 20 محل، والشغل بقى أكبر من 3 أشخاص. **ترتيب التعيينات مهم جدًا** — ده الترتيب الصح ولية:

```
التعيين 1 و 2: مطورين Full-stack     ← عنق الزجاجة الحالي هو سرعة التطوير
التعيين 3: QA Engineer                ← الـ Bugs بقت بتوصل للعملاء وبتكسر الثقة
التعيين 4: Customer Success           ← نور والـ CEO بيضيعوا نص وقتهم في دعم العملاء
```

> ⚠️ **خطأ شائع:** تعيين مديرين بدري. في المرحلة دي محدش لقبه "Manager" — الكل منفذ، والـ CTO لسه بيكتب كود.

### هيكل الفريق دلوقتي

```
كريم (CEO)
├── نور (CTO)
│   ├── أحمد (Full-stack Developer)
│   ├── سارة (Full-stack Developer)
│   └── عمر (QA Engineer)
├── هبة (Product Designer)
└── منى (Customer Success)
```

### طريقة الشغل اتطورت: Scrum خفيف

دلوقتي في فريق تطوير حقيقي، فبنعمل أول نظام رسمي:

| العنصر | القرار | ليه؟ |
|--------|--------|------|
| المنهجية | Scrum بـ Sprints أسبوعين | بقى في فريق يكفي، والعملاء محتاجين مواعيد متوقعة |
| مين الـ Product Owner؟ | كريم (CEO) مؤقتًا | هو الأقرب للعملاء — لحد ما نعيّن PM |
| مين الـ Scrum Master؟ | نور (CTO) بتلعب الدور | شركة صغيرة مش محتاجة SM متفرغ |
| الأداة | Linear | سريعة ومناسبة لحجمنا |
| Standup | يوميًا 10:00 (15 دقيقة) | الكل، حتى منى — عشان تنقل شكاوى العملاء |

---

## المرحلة 3: الشركة الكاملة — 12 فرد وتقسيم Squads (الشهور 9-12) 👥👥👥

وصلنا 150 عميل، وظهرت مشكلة جديدة: **الفريق الواحد الكبير بقى بطيء** — اجتماع الـ Planning بياخد 4 ساعات، والكل بيتكلم في كل حاجة. الحل المعتمد عالميًا (من Spotify وأمازون): **التقسيم لـ Squads صغيرة**.

### إيه هو الـ Squad؟

فريق صغير (4-6 أفراد) **مكتمل الأدوار** (فيه كل التخصصات اللي محتاجها) و**مسؤول عن منطقة واحدة من المنتج** من أولها لآخرها. زي مطعم صغير جوه فود كورت — عنده مطبخه وطباخينه ومنيوه، مش بيستنى حد من بره.

### تقسيمة شركة "سهلة" النهائية

```
                        كريم (CEO)
                            │
        ┌───────────────────┼───────────────────┐
        │                   │                   │
   نور (CTO)          ليلى (Product         منى (Head of
        │                Manager) 🆕          Customer Success)
        │                   │                   └── يوسف (Support) 🆕
        │      (بتشتغل مع الاتنين Squads)
        │
  ┌─────┴──────────────────────┐
  │                            │
🟦 Squad 1: "تجربة التاجر"    🟩 Squad 2: "المنصة والبيانات"
  مسؤول عن: كل اللي التاجر      مسؤول عن: الفواتير والتقارير
  بيشوفه (المخزون، البيع،        والـ API والبنية التحتية
  التطبيق)                       والأداء
  │                            │
  ├── أحمد (Tech Lead) ⬆️       ├── خالد (Senior Backend) 🆕
  ├── سارة (Frontend)           ├── ريم (Backend) 🆕
  ├── طارق (Backend) 🆕         ├── عمر (QA — بيخدم الاتنين)
  └── هبة (Designer —           └── سيف (DevOps) 🆕
       بتخدم الاتنين)
```
(🆕 = تعيين جديد | ⬆️ = ترقية داخلية)

### توزيع الأدوار بالتفصيل — مين بيعمل إيه فعليًا؟

| الدور | الشخص | مسؤولياته اليومية الفعلية |
|-------|-------|---------------------------|
| **CEO** | كريم | الرؤية والفلوس والشراكات — **مبقاش** يقرر تفاصيل الميزات (دي بقت شغلة ليلى) |
| **CTO** | نور | القرارات المعمارية الكبيرة، مراجعة الكود الحساس، تطوير المطورين — بتكتب كود 30% من وقتها بس |
| **Product Manager** | ليلى | تدير الـ Backlog للاتنين Squads، بتقابل عملاء أسبوعيًا، بتكتب الـ User Stories، بتقرر الأولويات |
| **Tech Lead (Squad 1)** | أحمد | بيقسّم الـ Stories لتاسكات، بيوزعها، بيراجع الكود، وبيكتب كود بنفسه 60% من وقته — **مش مدير، هو أول مطور في الفريق** |
| **Senior Backend (Squad 2)** | خالد | نفس دور أحمد في Squad 2 |
| **Frontend Dev** | سارة | تنفيذ الشاشات + مراجعة كود الـ Frontend |
| **Backend Devs** | طارق، ريم | تنفيذ الـ APIs والمنطق + الاختبارات |
| **QA** | عمر | Test Plans، اختبار يدوي وآلي، **صاحب قرار "يتنشر أو لا"** |
| **DevOps** | سيف | السيرفرات، الـ CI/CD، المراقبة (Monitoring)، الأمان |
| **Designer** | هبة | تصاميم الميزات قبل الـ Sprint بواحد على الأقل (بتشتغل Sprint قدام المطورين) |

### مصفوفة RACI — عشان "مين المسؤول؟" متبقاش خناقة

مثال على قرارات شائعة:

| القرار | Responsible (بينفذ) | Accountable (كلمته النهائية) | Consulted (رأيه بيتاخد) | Informed (بيتبلغ) |
|--------|:---:|:---:|:---:|:---:|
| نبني ميزة إيه الجاي؟ | ليلى | ليلى | العملاء، أحمد، خالد | الكل |
| هنبنيها **إزاي** تقنيًا؟ | المطور المنفذ | Tech Lead | نور (لو معماري) | ليلى |
| النسخة دي تتنشر النهارده؟ | سيف | عمر (QA) | Tech Lead | الكل |
| نعيّن مين؟ | نور | كريم | الفريق (مقابلات) | — |
| نغير قاعدة البيانات؟ | خالد | نور (CTO) | سيف | ليلى، كريم |

> 💡 **القاعدة:** لكل قرار **Accountable واحد بس**. لو اتنين "مسؤولين نهائيًا" عن نفس الحاجة = محدش مسؤول.
