## طريقة الشغل الكاملة: رحلة ميزة من الفكرة للعميل 🔄

خلينا نتابع ميزة حقيقية: **"تنبيه التاجر لما صنف يقرب يخلص من المخزون"** — من أول لحظة لآخر لحظة:

```
الأسبوع 0 — الاكتشاف
─────────────────────
• منى (Customer Success) لاحظت إن 15 عميل طلبوا نفس الحاجة
  → كتبتها في قناة #product-feedback على Slack
• ليلى (PM) جمعت الطلبات وقابلت 3 عملاء منهم:
  "طب لو التنبيه جالك، هتعمل إيه بعده؟" (بتفهم الاحتياج الحقيقي)
• قرار: الميزة تدخل الـ Roadmap — أولوية High (بمعادلة RICE)

الأسبوع 1 — التجهيز
─────────────────────
• ليلى كتبت الـ Epic والـ Stories:
    S-1: التاجر يحدد "حد أدنى" لكل صنف
    S-2: إشعار داخل التطبيق لما الكمية توصل للحد
    S-3: رسالة واتساب اختيارية للتنبيهات المهمة
• هبة (Design) عملت التصاميم على Figma وراجعتها مع ليلى وأحمد
• جلسة Refinement مع Squad 1: قدّروا الـ Stories (3 + 5 + 8 نقط)
  وطلع سؤال مهم: "الواتساب محتاج مزوّد خارجي وتكلفة"
  → قرار: S-3 تتأجل للـ Sprint اللي بعده + Spike لدراسة التكلفة

الأسبوع 2-3 — التنفيذ (Sprint)
─────────────────────
• Sprint Planning: Squad 1 سحب S-1 و S-2 (8 نقط من أصل 20 —
  الباقي Stories تانية من الـ Backlog)
• أحمد (Tech Lead) قسّم التاسكات ووزّعها:
    طارق  → Backend: حقل الحد الأدنى + منطق المقارنة + الـ Job الدوري
    سارة  → Frontend: شاشة الإعدادات + مكوّن الإشعارات
    أحمد  → Backend: نظام الإشعارات الداخلي (الجزء الأصعب — خده لنفسه)
• الشغل ماشي بالنظام المعتاد:
    Branch باسم التاسك → PR → مراجعة → عمر (QA) بيختبر → Done
• في الـ Standup يوم الأربعاء:
    طارق: "🚧 الـ Job الدوري ممكن يبطّئ الداتابيز مع عملاء كتار"
    → أحمد صعّدها لـ خالد (Squad 2 صاحب البنية التحتية)
    → اتفقوا على حل (Queue) في اجتماع 20 دقيقة بعد الـ Standup
    ← 👆 ده مثال التعاون بين الـ Squads: مشكلة بتعدي الحدود
       بتتحل بكلام مباشر، مش بفتح "طلب رسمي"

الأسبوع 4 — الإطلاق
─────────────────────
• عمر (QA) وافق ✅ → سيف (DevOps) نشر بـ Feature Flag
  (الميزة اتنشرت "مطفية")
• شغّلوها لـ 10 عملاء بس أول 3 أيام (Beta) → مفيش مشاكل
• شغّلوها للكل 🎉
• منى بعتت إيميل للعملاء اللي طلبوها: "طلبكم اتنفذ" ← ولاء رهيب
• ليلى بتتابع: كام تاجر فعّل التنبيهات؟ (قياس النجاح)
```

---

## إيقاع الاجتماعات للشركة كلها 📆

عشان الاجتماعات متاكلش اليوم، ده الجدول الكامل — لاحظ إن **المطور العادي عنده أقل من 4 ساعات اجتماعات في الأسبوع**:

| الاجتماع | مين | كل قد إيه | المدة |
|----------|-----|-----------|:---:|
| Standup (لكل Squad لوحده) | الـ Squad | يوميًا | 15 د |
| Sprint Planning | الـ Squad + ليلى | كل أسبوعين | 2 س |
| Refinement | الـ Squad + ليلى | أسبوعيًا | 1 س |
| Review + Retro | الـ Squad + ليلى | كل أسبوعين | 1.5 س |
| **Sync بين الـ Tech Leads** (أحمد + خالد + نور) | القيادة التقنية | أسبوعيًا | 30 د |
| **All-hands** (الشركة كلها): الأرقام والاتجاه والاحتفال | الكل | كل أسبوعين | 45 د |
| 1:1 (كل فرد مع مديره المباشر) | فردي | أسبوعيًا/أسبوعين | 30 د |

**وقنوات Slack منظمة بدل الفوضى:**
```
#squad-merchant     ← شغل Squad 1 اليومي
#squad-platform     ← شغل Squad 2 اليومي
#product-feedback   ← منى وليلى: طلبات وشكاوى العملاء
#incidents          ← 🚨 مشاكل الإنتاج بس (لو اترن هنا الكل يجري)
#releases           ← إعلانات النشر (تلقائية من الـ CI/CD)
#random             ← ميمز وهزار (مهم فعلًا للفريق 😄)
```

---

## قرارات التقسيم: ليه قسمنا كده بالذات؟ 🤔

دي الأسئلة اللي بتتسأل في أي شركة، وإجاباتها:

**ليه Squads حسب "منطقة المنتج" مش حسب "التخصص" (فريق Backend وفريق Frontend)؟**
لأن التقسيم بالتخصص بيخلق انتظار مستمر: الـ Frontend مستني الـ Backend، وكل ميزة محتاجة تنسيق بين فريقين. الـ Squad المكتمل بينفذ الميزة كاملة من غير ما يستنى حد. **القاعدة: قسّم بحيث أقل عدد ميزات يحتاج أكتر من فريق.**

**ليه الـ Designer والـ QA بيخدموا الاتنين Squads؟**
لأن حجم الشغل مش بيبرر واحد لكل Squad لسه. أول ما الشغل يزيد، هنعيّن تاني واحد — دي حالة اسمها **Shared Resource** وطبيعية في الشركات الصغيرة، بس لازم أولوياته تتحدد في الـ Planning عشان ميتشدش من هنا لهنا يوميًا.

**ليه معينّاش Project Manager وعيّنا Product Manager؟**
في فرق Agile الصغيرة، إدارة التنفيذ (مين بيعمل إيه إمتى) بتتوزع على الفريق نفسه والـ Tech Lead. اللي مش موجود ومحدش يقدر يعوضه هو **صوت العميل المتفرغ** — ودي شغلة الـ PM/PO. الشركات الأكبر بتحتاج الاتنين.

**إمتى نضيف Squad تالت؟**
لما Squad يعدّي 7-8 أفراد أو لما تظهر منطقة منتج جديدة كبيرة (مثلًا: "تطبيق للمشتري النهائي"). القاعدة الشهيرة من أمازون: **Two-Pizza Team** — الفريق اللي 2 بيتزا مش بيكفوه في الاجتماع، كبير أوي.

## لو الشركة دي أنت لوحدك ناويها 😄 (Bonus)

نفس الهيكل بينطبق عليك كأدوار بتلبسها في أوقات مختلفة:

```
الأحد صباحًا     → البس قبعة الـ PM: راجع الـ Backlog ورتّب أسبوعك
يوميًا           → البس قبعة المطور: نفّذ (وممنوع تغيّر الأولويات وأنت بتكوّد!)
قبل أي نشر      → البس قبعة الـ QA: اختبر بعقلية "عايز أكسره"
الخميس مساءً    → البس قبعة الـ CEO: بص للصورة الكبيرة — أنا رايح فين أصلًا؟
```
**أخطر فخ للـ Solo Founder:** تفضل لابس قبعة المطور 100% من الوقت — تصحى بعد 6 شهور بمنتج مثالي تقنيًا ومحدش عايزه. القبعات التانية مش رفاهية.

# الجزء السادس: ما بعد الإطلاق، الأزمات، والمرجع السريع 🧭

الأجزاء اللي فاتت غطت التخطيط والتنفيذ — الجزء ده بيغطي اللي محدش بيتكلم عنه: **إيه اللي بيحصل بعد الإطلاق؟ ولما الدنيا تولّع؟ ولما تدخل شغل جديد على نظام موجود بالفعل؟**

---

## 1. OKRs — إزاي الشركة بتحدد أهدافها وتربطها بشغلك اليومي 🎯

في شركة "سهلة" (من الجزء الخامس)، إزاي كريم (CEO) بيتأكد إن شغل الـ Squads اليومي بيخدم أهداف الشركة؟ بنظام **OKRs (Objectives & Key Results)** — النظام اللي بتستخدمه Google وأغلب الشركات الناشئة:

```
🎯 Objective (الهدف — طموح وملهم، مش رقمي):
   "نبقى الأداة اللي المحلات مش تقدر تستغنى عنها"

📏 Key Results (النتائج المفتاحية — أرقام تقيس النجاح):
   KR1: نسبة العملاء اللي بيستخدموا المنصة يوميًا تزيد من 40% لـ 65%
   KR2: نسبة إلغاء الاشتراكات (Churn) تنزل من 8% لـ 4% شهريًا
   KR3: متوسط تقييم الدعم الفني 4.5+ من 5
```

**وإزاي ده بيوصل لتاسكك أنت؟** سلسلة الربط:

```
OKR الشركة (ربع سنوي): "تقليل الـ Churn من 8% لـ 4%"
        ↓
ليلى (PM) بتسأل: ليه العملاء بيسيبونا؟ → البيانات بتقول:
"60% من اللي لغوا، عمرهم ما ظبطوا المخزون صح في أول أسبوع"
        ↓
Epic في الـ Roadmap: "تحسين تجربة أول أسبوع (Onboarding)"
        ↓
Story في الـ Sprint: "As a new merchant, I want a guided
setup wizard so that I configure my inventory correctly"
        ↓
تاسكك النهارده: "بناء الخطوة التانية من الـ Wizard"
```

**الفايدة ليك كمطور:** لما تفهم السلسلة دي، بتقدر تسأل السؤال الذهبي في أي Planning: *"إيه الـ KR اللي الـ Story دي بتخدمه؟"* — لو مفيش إجابة، يمكن الـ Story دي أصلًا مش مفروض تتعمل. **ده الفرق بين مطور بينفذ ومطور بيفكر.**

**قواعد OKRs السريعة:**
- 3-5 Objectives للشركة كل ربع سنة (Quarter)، مش أكتر.
- الـ KR لازم يكون رقم — "نحسّن التجربة" مش KR، "زمن التحميل أقل من ثانيتين" KR.
- تحقيق 70% من الـ KRs = ممتاز (لو بتحقق 100% دايمًا، يبقى أهدافك سهلة أوي).
- **OKRs ≠ تقييم الموظفين** — أول ما تربطهم بالمرتبات، الناس هتحط أهداف مضمونة وتقتل الطموح.

## 2. إدارة الإصدارات والبيئات (Releases & Environments) 🚀

جزء أساسي من إدارة أي مشروع برمجي ومحدش بيشرحه للمبتدئين:

### البيئات التلاتة (Environments)

```
💻 Development (Dev)
   جهازك أنت — تكسّر فيها براحتك
        ↓
🧪 Staging (نسخة طبق الأصل من الإنتاج)
   هنا الـ QA بيختبر، والـ PO بيشوف الـ Demo
   بيانات وهمية، لو وقعت محدش يتأثر
        ↓
🌍 Production (Prod)
   اللي العملاء الحقيقيين بيستخدموه
   مقدس — مفيش حاجة بتوصله غير بعد ما تعدي Staging
```

### ترقيم الإصدارات (Semantic Versioning)

هتشوف أرقام زي `v2.4.1` في كل حتة — دي مش عشوائية:

```
v 2 . 4 . 1
  │   │   └── Patch: إصلاح Bug بس (2.4.0 → 2.4.1)
  │   └────── Minor: ميزة جديدة بدون كسر القديم (2.4 → 2.5)
  └────────── Major: تغيير كبير بيكسر التوافق (2.x → 3.0)
```

### الـ Release Notes — إعلان الإصدار

مع كل نشر، بيتكتب ملخص (للفريق وأحيانًا للعملاء):

```markdown
## الإصدار v2.5.0 — 10 يوليو 2026

### ✨ جديد
- تنبيهات انخفاض المخزون (AKLA-45)

### 🔧 تحسينات
- شاشة التقارير أسرع 3 مرات

### 🐛 إصلاحات
- إصلاح خطأ في حساب الضريبة للفواتير المقسطة (AKLA-52)
```

### استراتيجيات النشر الآمن

| الاستراتيجية | الفكرة | إمتى |
|--------------|--------|------|
| **Feature Flags** | الميزة تتنشر "مطفية" وتتفتح بضغطة | الافتراضي لأي ميزة جديدة |
| **Canary Release** | النسخة الجديدة لـ 5% من المستخدمين الأول | التغييرات الكبيرة |
| **Blue-Green** | نسختين كاملتين، بتحوّل بينهم فورًا | لما الـ Rollback لازم يكون لحظي |

## 3. دليل الأزمات: لما الدنيا تولّع 🔥

إدارة المشاريع الحقيقية بتبان في الأزمات. دي أشهر 3 سيناريوهات وطريقة التصرف الاحترافية فيهم:

### الأزمة 1: الإنتاج وقع والعملاء بيتصلوا 🚨

ده اسمه **Incident** وليه بروتوكول عالمي:

```
الدقيقة 0-5: الإعلان
  □ رسالة في #incidents: "🚨 الموقع واقع — أنا Incident Commander"
  □ واحد بس بيقود (أول من اكتشف أو الأقدم) — الباقي بينفذ
  □ حد يتفرغ للتواصل: يحدّث صفحة الحالة/العملاء كل 30 دقيقة

الدقيقة 5-15: التشخيص
  □ السؤال الأول دايمًا: "إيه آخر حاجة اتغيرت؟"
    (آخر نشر؟ تحديث سيرفر؟) — 80% من الأعطال سببها آخر تغيير
  □ القرار السريع: نصلح ولا نرجّع (Rollback)؟
    → القاعدة: لو الإصلاح مش واضح في 15 دقيقة، Rollback فورًا
      وصلّح على رواقة

بعد الحل: الـ Post-mortem (خلال 48 ساعة)
  □ اجتماع بدون لوم (Blameless): إيه اللي حصل بالتسلسل الزمني؟
  □ السؤال مش "مين غلط؟" — السؤال "إيه في النظام سمح للغلط يوصل؟"
  □ Action Items تدخل الـ Backlog بأولوية عالية
    (مثلًا: "إضافة اختبار آلي يمنع تكرار ده")
```

> 💡 **درس مهني:** المطور اللي بيقول "أنا اللي عملت الـ Bug ده، ودي خطة إصلاحه" بيكسب احترام أضعاف اللي بيستخبى. الثقافة السليمة بتعاقب إخفاء المشاكل، مش ارتكابها.

### الأزمة 2: في نص المشروع اكتشفتوا إنكم هتتأخروا شهر 📉

```
❌ اللي بيحصل غلط عادةً:
   الفريق يستخبى ويقول "هنلحّق" → ضغط وسهر → جودة سيئة →
   Bugs أكتر → تأخير أطول → مفاجأة العميل في آخر أسبوع → كارثة ثقة

✅ البروتوكول الصح (أول ما الأرقام تبان):
   1. اجمع الحقايق: الـ Velocity الفعلية × الأسابيع المتبقية
      = هنخلّص كام نقطة؟ والمتبقي كام؟ (أرقام مش إحساس)
   2. جهّز 3 سيناريوهات قبل ما تروح للـ Stakeholder:
      أ. نفس الموعد بنطاق أقل (شيل الـ Should/Could haves)
      ب. نفس النطاق بموعد جديد (+4 أسابيع)
      ج. حل وسط: الأساسيات في الموعد + الباقي بعده بأسبوعين
   3. اعرضهم في اجتماع واحد صريح — وسيب القرار لصاحب القرار
```
**الدرس:** مهمتك مش إنك تمنع التأخير دايمًا (مستحيل) — مهمتك إن **محدش يتفاجئ**. التأخير المتشاف بدري قرار إداري، والمتخبي قنبلة.

### الأزمة 3: العضو الأساسي في الفريق قدّم استقالته 👋

خالد (الوحيد اللي فاهم نظام الفواتير) ماشي بعد شهر:

```
□ فورًا: احسب الـ Bus Factor — إيه الأجزاء اللي هو الوحيد الفاهمها؟
□ أسبوع 1-2: جلسات Knowledge Transfer متسجلة (فيديو) —
  خالد يشرح المعمارية والقرارات و"الألغام" المدفونة
□ أسبوع 2-4: Pair Programming — ريم تنفذ تاسكات الفواتير
  وخالد بيراجع (التسليم بالممارسة مش بالمحاضرات)
□ خالد يكتب/يحدّث الـ ADRs والتوثيق قبل ما يمشي
□ درس للمستقبل: قاعدة "مفيش منطقة ليها مالك واحد" —
  كل جزء حساس لازم اتنين على الأقل يعرفوه
```

## 4. أول 30 يوم في شغل جديد: بتنضم لنظام إدارة موجود 🚪

كل الدليل اتكلم عن بناء نظام من الصفر — بس في الواقع، أول شغلانة هتنضم فيها لنظام **موجود بالفعل**. دي خطة الانضمام الذكي:

### الأسبوع 1: راقب واكتب (متحكمش على حاجة)

```
□ اطلب Access لكل حاجة: Jira/Linear + Slack + الـ Repos + التوثيق
□ اقرا آخر 3 Sprints في الأداة: إيه أنواع التاسكات؟
  متوسط حجمها؟ مين بيعمل إيه؟
□ احضر كل الـ Ceremonies صامت ومركّز — ولاحظ:
  الـ Standup بياخد قد إيه؟ الناس بتقول Blockers بصراحة؟
□ اعمل مستند "أسئلتي" واكتب فيه كل حاجة مش فاهمها —
  واسأل في مواعيد مجمعة مش سؤال كل 10 دقايق
```

### الأسبوع 2: أول تاسك (الهدف: تلف الدورة كاملة)

```
□ اطلب تاسك صغير (نقطة أو 2) — الهدف مش تبهرهم بالحجم،
  الهدف تعدي بالدورة كاملة: تاسك → Branch → PR → Review → Deploy
□ أول PR ليك هيرجعلك بتعليقات كتير — ده طبيعي 100%،
  بيتعلموك ستايل الفريق مش بينتقدوك
□ اسأل عن الـ Definition of Done بتاعتهم واتبعها حرفيًا
```

### الأسبوع 3-4: ابدأ تساهم بشكل طبيعي

```
□ خد تاسكات بحجم طبيعي وقدّرها بنفسك في الـ Planning
□ ابدأ تراجع PRs لغيرك (أسرع طريقة تفهم الكود والناس)
□ في الـ Retro: شارك بملاحظة واحدة إيجابية —
  "عين جديدة" بتشوف حاجات القدام مبقوش يشوفوها
□ ⚠️ قاومة إغراء "النظام هنا غلط، في شركتي القديمة كنا..."
  — اكسب ثقة الأول، اقترح تحسينات بعد شهرين مش أسبوعين
```

## 5. مصادر التعلم — فين تكمل من هنا 📚

### كتب تستاهل وقتك (بالترتيب)

| الكتاب | ليه |
|--------|-----|
| **Scrum: The Art of Doing Twice the Work in Half the Time** — Jeff Sutherland | من مخترع Scrum نفسه، حكايات ممتعة مش كتاب جاف |
| **The Phoenix Project** | رواية (أيوه رواية!) عن إنقاذ مشروع تقني غرقان — هتشوف فيها كل شركة اشتغلت فيها 😄 |
| **Shape Up** — Basecamp (مجاني أونلاين: basecamp.com/shapeup) | منهجية بديلة لـ Scrum بتستخدمها شركات كتير — يفتح دماغك إن Scrum مش الطريقة الوحيدة |
| **The Mythical Man-Month** — Fred Brooks | كلاسيكية من 1975 ولسه صح: "إضافة ناس لمشروع متأخر بتأخره أكتر" |

### مصادر أونلاين

- **scrumguides.org** — الدليل الرسمي (متوفر بالعربي)
- **atlassian.com/agile** — مكتبة Atlassian: شروحات عملية ممتازة ومجانية لكل مفهوم
- **Mountain Goat Software (blog)** — Mike Cohn من أفضل من كتب عن التقدير والـ User Stories
- **يوتيوب بالعربي:** ابحث عن "Agile بالعربي" و"شرح Scrum" و"شرح Jira عملي" — في محتوى مصري وعربي ممتاز ومجاني
- **قناة Development That Pays** — فيديوهات قصيرة رسومية بتشرح Scrum vs Kanban ببساطة

### تدريب عملي مجاني

- **Scrum.org Open Assessments** — اختبارات مجانية تقيس فهمك (نفس نمط شهادة PSM)
- **ساهم في مشروع Open Source** — أفضل تدريب حقيقي: هتشتغل بـ Issues وMilestones وPRs مع فريق حقيقي موزع حول العالم

## 6. المرجع السريع — صفحة واحدة تلخص كل حاجة 📄

اطبعها أو احفظها — دي خلاصة الدليل كله:

```
╔═══════════════════════════════════════════════════════════╗
║              CHEAT SHEET — إدارة المشاريع للمطور           ║
╠═══════════════════════════════════════════════════════════╣
║                                                           ║
║ التسلسل الهرمي للشغل:                                     ║
║   مشروع → Epic (أسابيع) → Story (أيام) → Task (ساعات)     ║
║                                                           ║
║ صيغة الـ Story:                                           ║
║   As a [مين], I want [إيه] so that [ليه]                  ║
║                                                           ║
║ معادلة الجدول الزمني:                                     ║
║   مجموع النقاط ÷ Velocity = عدد الـ Sprints               ║
║   + Buffer %15-20 دايمًا                                  ║
║                                                           ║
║ يوم العمل الفعلي = 5 ساعات كود (مش 8)                    ║
║ التاسك > يومين؟ → قسّمه | Story = 13 نقطة؟ → دي Epic     ║
║                                                           ║
║ إيقاع Scrum (كل أسبوعين):                                 ║
║   Planning (2س) → Daily (15د يوميًا) → Refinement (1س)    ║
║   → Review (Demo) → Retro (تحسين)                         ║
║                                                           ║
║ الـ 3 أسئلة اليومية: عملت إيه؟ / هعمل إيه؟ / معطلني إيه؟ ║
║                                                           ║
║ سير التاسك:                                               ║
║   Branch باسم التاسك → Commit برقمه → PR → Review         ║
║   → QA → Merge → Deploy (بـ Feature Flag)                 ║
║                                                           ║
║ قواعد ذهبية:                                              ║
║   • Blocker يتقال فورًا مش يتخبى                          ║
║   • الـ Sprint محمي — إضافة = شيل حاجة بدالها             ║
║   • تأخير متشاف بدري = قرار | متخبي = كارثة               ║
║   • مفيش "خلصت 90%" — يا Done يا لأ                       ║
║   • Rollback أسرع من إصلاح متسرع                          ║
║                                                           ║
║ الأدوات: تعلّم Jira للوظيفة | Trello للبداية              ║
║          Linear للـ Startups | GitHub Projects لمشاريعك   ║
║                                                           ║
╚═══════════════════════════════════════════════════════════╝
```

## خلاصة الجزء السادس

لحد هنا اتغطت رحلة المشروع كاملة: من التخطيط والتنفيذ، لما بعد الإطلاق، للتصرف وقت الأزمات. الجزء الجاي بيدخل في أصعب نوع من القرارات — **قرارات الناس** (التعيين والتدريب والاستغناء)، والجزء اللي بعده مرجع تكميلي للمواضيع التخصصية.

# الجزء السابع: قرارات الفريق والأفراد — التعيين، التدريب، والاستغناء 🧑‍🤝‍🧑

أصعب قرارات الإدارة مش التقنية — هي قرارات **الناس**. الجزء ده بيجاوب بشكل عملي: إمتى أعيّن؟ إزاي أعرف الناقص عندي؟ أجيب Senior ولا أدرّب Junior؟ وإمتى وإزاي أتخلى عن حد؟ (هنكمل على مثال شركة "سهلة" من الجزء الخامس)

---

## 1. إمتى أعيّن حد جديد؟ ⏰

### القاعدة الأولى: التعيين آخر حل مش أول حل

قبل ما تفكر تعيّن، جرّب البدائل دي بالترتيب — لأن الموظف الجديد **بيبطّئ الفريق أول 2-3 شهور** (حد لازم يعلّمه) وتكلفته مش مرتبه بس:

```
الفريق مضغوط؟ اسأل بالترتيب:
1. نشيل شغل؟        → راجع الـ Backlog: في Stories ممكن تتشال أو تتأجل؟
                       (أرخص حل دايمًا: تقليل النطاق)
2. نوقف نزيف؟       → قد إيه من وقتنا رايح في Bugs وشغل يدوي متكرر؟
                       أتمتة أسبوع ممكن توفر مطور كامل
3. نستأجر مؤقت؟     → الضغط ده موسمي (مشروع واحد وخلاص)؟
                       → Freelancer/Contractor أحسن من تعيين دائم
4. طب نعيّن         → لو الإجابات فوق كلها "لأ"، يبقى فعلًا محتاج حد
```

### العلامات اللي بتقول "آن أوان التعيين" ✅

| العلامة | إزاي تقيسها |
|---------|-------------|
| **الضغط مستمر مش موسمي** | الفريق شغال فوق طاقته **3 شهور متتالية+** (مش أسبوعين قبل إطلاق) |
| **الـ Backlog بيكبر أسرع من الـ Velocity** | كل Sprint بيدخل شغل جديد أكتر من اللي بيخلص — الفجوة بتتسع |
| **في فلوس/طلب مثبت** | عملاء بيدفعوا ومستنيين ميزات — التأخير بقى بيكلف إيرادات فعلية |
| **حد بيعمل شغلتين** | زي نور (CTO) لما كانت بتعمل دعم فني نص الوقت — أغلى موظف بيعمل أرخص شغل |
| **Bus Factor = 1 في منطقة حرجة** | جزء أساسي من النظام واحد بس فاهمه |

### والعلامات اللي بتقول "استنى، متعيّنش" ❌

- الضغط سببه **سوء تنظيم** مش قلة ناس (اجتماعات كتير، أولويات بتتقلب يوميًا، مفيش Definition of Done) — التعيين هيضيف شخص للفوضى.
- التمويل يكفي المرتب **أقل من 12 شهر** قدام — تعيين حد وتسريحه بعد 6 شهور أسوأ من عدم تعيينه.
- "عايزين نكبر عشان نكبر" — العدد مش إنجاز. فريق 5 ممتازين بيغلب فريق 12 عاديين.

### حسبة التكلفة الحقيقية (اللي الناس بتنساها)

```
تكلفة الموظف الجديد ≠ المرتب

= المرتب
+ وقت التوظيف (مقابلات ومراجعة CVs — أسابيع من وقت الفريق)
+ أول 2-3 شهور إنتاجيته 30-50% + بياخد من وقت اللي بيدربه
+ أدوات وأجهزة وتأمينات
──────────────────────────────
≈ التكلفة الحقيقية سنة أولى = 1.3-1.5 × المرتب
```

## 2. إزاي أحدد النواقص في الفريق؟ (Skills Gap Analysis) 🔍

متعيّنش بالإحساس ("محتاجين حد كده") — اعمل التحليل ده مرة كل 3-6 شهور:

### الخطوة 1: مصفوفة المهارات (Skills Matrix)

اعمل جدول: المهارات المطلوبة للمنتج × أعضاء الفريق، وقيّم كل خانة:
**3 = خبير يعلّم غيره | 2 = يشتغل مستقل | 1 = يشتغل بمساعدة | 0 = لا**

مثال شركة "سهلة" (مرحلة الـ 7 أفراد):

| المهارة | نور | أحمد | سارة | عمر | ⚠️ التشخيص |
|---------|:---:|:---:|:---:|:---:|------------|
| Backend (Node.js) | 3 | 2 | 1 | 0 | ✅ مغطاة |
| Frontend (React) | 1 | 2 | 3 | 0 | ✅ مغطاة |
| قواعد البيانات والأداء | 3 | 1 | 0 | 0 | 🟡 نور لوحدها (Bus Factor=1) |
| DevOps / سيرفرات | 2 | 0 | 0 | 0 | 🔴 فجوة خطيرة |
| اختبار آلي | 0 | 1 | 0 | 2 | 🟡 ضعيفة |
| تطبيقات موبايل | 0 | 0 | 1 | 0 | 🔴 فجوة (بس هل محتاجينها؟) |

### الخطوة 2: اقرا المصفوفة صح

- **عمود فيه صفر أو واحد بس فوق الـ 2** = فجوة → قرار: تعيين أو تدريب أو Outsourcing.
- **مهارة معتمدة على شخص واحد (Bus Factor=1)** = قنبلة موقوتة → مش لازم تعيين، ممكن نقل معرفة داخلي.
- **قبل ما تقرر "فجوة":** اسأل — إحنا محتاجين المهارة دي في خطة السنة الجاية أصلًا؟ (الموبايل مثلًا ممكن مش أولوية).

### الخطوة 3: دوّر على الاختناقات (Bottlenecks) في الأداة نفسها

Jira/Linear بيقولك الناقص من غير ما تسأل حد:

```
افتح تقارير آخر 3 شهور وشوف:
• التاسكات بتقف في أنهي عمود أكتر؟
  → واقفة كتير في "Code Review"؟ = الـ Seniors قليلين
  → واقفة في "QA"؟ = محتاج Tester أو اختبار آلي
  → واقفة في "To Do" ومحدش بيسحبها؟ = تاسكات نوع معين
    (مثلًا DevOps) محدش عارف يعملها ← دي فجوتك
• مين اسمه بيتكرر في كل تاسك حرج؟ ← ده الشخص اللي محتاج
  حد جنبه (يتعيّن له مساعد أو يدرّب حد)
```

## 3. أعيّن Senior ولا أدرّب Junior؟ ⚖️

من أهم القرارات وأكترها غلطًا. الإجابة مش "أنهي أحسن" — الإجابة "أنهي مناسب لوضعك دلوقتي":

| | عيّن Senior 👨‍💼 | عيّن/درّب Junior 🌱 |
|---|---|---|
| **إمتى** | الفجوة في منطقة **حرجة ومستعجلة** (أمان، بنية تحتية، معمارية) | الشغل فيه **مهام متكررة واضحة** كتير وفي حد فاضي يدرّب |
| **الفريق الحالي** | كله Juniors ومحتاج حد يعلّمهم ويحط معايير | فيه Seniors مستقرين يستحملوا عبء التدريب |
| **الوقت** | محتاج إنتاجية **من الشهر الأول** | تستحمل 4-6 شهور استثمار قبل العائد |
| **الفلوس** | متوفرة (Senior = 2-3 أضعاف Junior) | محدودة |
| **الخطر** | ممكن يكون "خبرة سنة متكررة 10 مرات" — اختبر عمليًا | ممكن يمشي بعد ما يتعلم — قلل الخطر ببيئة كويسة ومسار نمو واضح |

**القاعدة الذهبية للنِسَب:** الفريق الصحي فيه Senior واحد على الأقل لكل 2-3 Juniors. فريق كله Juniors = كوارث تقنية متراكمة. فريق كله Seniors = غالي وبيتخانق على المعمارية 😄

**قاعدة "أول 5 تعيينات":** في الشركة الناشئة، أول 5 تعيينات لازم يكونوا **Mid/Senior يشتغلوا مستقلين** — مفيش رفاهية تدريب والشركة لسه بتحاول تعيش. الـ Juniors بيدخلوا في مرحلة الاستقرار (بعد الـ 10 أفراد تقريبًا).

## 4. إمتى وإزاي أدرّب مبتدئين؟ 🌱

### الشروط الثلاثة قبل ما تجيب Junior (لو واحد ناقص، أجّل)

```
□ في Mentor حقيقي متفرغ له 5+ ساعات أسبوعيًا (مش "اسأل لما تحتاج")
□ في شغل مناسب لمستواه (تاسكات صغيرة واضحة) — مش هترميه في
  الجزء الأعقد في النظام
□ في صبر مؤسسي: الإدارة فاهمة إن أول 3 شهور استثمار مش إنتاج
```

### خطة الـ 30-60-90 للمبتدئ الجديد

```
الشهر الأول: "يتعلم البيئة"
  • تاسكات 1-2 نقطة: Bugs بسيطة، تعديلات نصوص، اختبارات
  • Pair Programming مع الـ Mentor مرتين أسبوعيًا
  • 1:1 أسبوعي: "إيه اللي واقفلك؟" (المبتدئ بيتكسف يسأل — روح له أنت)
  • مقياس النجاح: بيسلّم PR نضيف وبيسأل أسئلة كويسة

الشهر الثاني: "يشتغل بمساعدة"
  • Stories صغيرة كاملة (3 نقط) لوحده مع مراجعة دقيقة
  • يبدأ يحضر الـ Refinement ويسمع إزاي بيتم التقدير
  • مقياس النجاح: تقديراته بدأت تقرب من الواقع

الشهر الثالث: "عضو منتج"
  • تاسكات عادية من الـ Sprint زي أي حد (بمراجعة عادية)
  • يبدأ يراجع PRs بسيطة لغيره (أسرع طريقة يتعلم)
  • مقياس النجاح: الفريق بيحس إنه "بيضيف" مش "بياخد"
  • ⚠️ لو بعد 3 شهور كاملة لسه محتاج مساعدة في كل خطوة →
    اجتماع صريح وخطة واضحة (شوف القسم الجاي)
```

### قواعد الـ Mentorship الفعال

- **اديله سمكة أول أسبوع، علّمه الصنارة بعدها:** في الأول جاوب مباشرة، بعدين حوّل لـ "جرّبت إيه؟ ولو أنا مش موجود هتعمل إيه؟"
- **مراجعة الكود = تعليم مش محكمة:** بدل "ده غلط" → "في طريقة أحسن، بص ليه..."
- **خلّيه يغلط غلطات آمنة:** يكسر Staging عادي جدًا — التعلم الحقيقي من الغلط، المهم يكون في حزام أمان (مفيش وصول مباشر للـ Production).
- **احتفل بأول Deploy ليه** قدام الكل — الانتماء بيتبني من اللحظات دي.

## 5. إمتى أتخلى عن حد؟ 😔 (أصعب قرار)

### أولًا: فرّق بين نوعين من المشاكل

| مشكلة أداء (Performance) 📉 | مشكلة سلوك (Behavior) ☠️ |
|------------------------------|---------------------------|
| شغله بطيء أو جودته ضعيفة | بيكذب، بيخبي مشاكل، بيقلل من زمايله، سام في التعامل |
| **بتتعالج غالبًا:** تدريب، نقل لدور أنسب، توقعات أوضح | **نادرًا بتتعالج:** وبتعدي زي المرض للفريق كله |
| خد وقتك في خطة تحسين | تحرّك أسرع بكتير |

### قبل قرار الاستغناء: اسأل نفسك الأول (بأمانة)

```
□ هو عارف أصلًا إن في مشكلة؟ (مفاجأته يوم الاستغناء = فشلك أنت
  كمدير — كان المفروض يسمعها في 1:1 من شهور)
□ التوقعات كانت واضحة ومكتوبة؟ ولا "المفروض يفهم لوحده"؟
□ المشكلة فيه هو ولا في النظام؟ (تاسكات مش واضحة، Mentor مشغول،
  أولويات بتتقلب يوميًا — النظام الباظ بيخلّي أحسن ناس شكلهم وحش)
□ جرّبنا نقله لدور تاني؟ (مطور Backend تعبان ممكن يكون QA ممتاز)
```

### خطة التحسين (PIP — Performance Improvement Plan)

لو مشكلة أداء، الخطوة العادلة قبل أي قرار:

```
1. اجتماع صريح ومحترم:
   "شغلك في النقط دي [أمثلة محددة بتواريخ] تحت المتوقع،
    وعايزين نساعدك توصل للمستوى ده [توقعات مكتوبة وقابلة للقياس]"
2. خطة 30-60 يوم مكتوبة:
   أهداف محددة (مثلًا: "تسليم تاسكاتك في تقديرها ± 30%،
   وPRs من غير Bugs حرجة") + دعم واضح (Mentor، تدريب)
3. متابعة أسبوعية مكتوبة — مش سرية ولا مفاجآت
4. النهاية بوضوح:
   تحسّن واستمر ✅ (وده بيحصل في نسبة كويسة من الحالات!)
   أو مفيش تحسن → قرار الاستغناء بقى عادل وموثق ومتوقع
```

### العلامات الحمراء اللي بتستدعي تحرك سريع 🚩

- **الـ "Brilliant Jerk":** شاطر تقنيًا جدًا بس بيهين زمايله ويرفض المراجعات — أخطر شخص في أي فريق. القاعدة المثبتة: **خسارته أرخص من خسارة الـ 3 كويسين اللي هيستقيلوا بسببه.**
- الكذب أو إخفاء مشاكل الإنتاج (كسر ثقة مش غلطة).
- "لأ" دائمة لأي شغل خارج راحته + تصفير للحماس في كل اجتماع.

### لو القرار اتاخد — نفّذه صح

- **بسرعة وبكرامة:** اجتماع خاص قصير ومباشر، مش تسويف شهور "عشان مكسوفين" — التسويف ظلم ليه (بيضيع وقته في مكان مش شايفه) وللفريق.
- **بدون تشهير:** للفريق تقول "فلان مكمّلش معانا ونشكره على مجهوده" — التفاصيل مش شغلهم.
- **راعي القانون والعقد:** فترة إخطار، مستحقات — استشير محاسب/محامي، الغلطة هنا غالية.
- **بعدها بأسبوع:** كلّم الفريق واسمع — الاستغناءات بتخض الناس، والصمت بيولّد إشاعات.

> 💡 **الحقيقة اللي بيقولها كل المديرين المخضرمين:** "عمري ما ندمت إني اتحركت بدري في قرار استغناء واضح — كل ندمي كان إني استنيت طويل."

## 6. الوش التاني للعملة: إمتى أرقّي حد؟ ⬆️

عشان متخسرش الكويسين وأنت مركّز في المشاكل:

**رقّي اللي بيعمل شغل المستوى الأعلى بالفعل** — الترقية اعتراف بواقع حاصل، مش رهان على المستقبل:
- أحمد بقى بيقسّم الـ Stories ويساعد زمايله من غير ما حد يطلب؟ → ده Tech Lead فعليًا، رسّمها.
- الـ Junior بقى بيسلّم مستقل وتقديراته مظبوطة؟ → Mid-level.

**وخد بالك من الفخ الشهير (Peter Principle):** أشطر مطور ≠ أحسن مدير — دي مهارة مختلفة تمامًا. الحل العصري: **مساران متوازيان** للترقي بنفس التقدير والمرتب:
```
مسار تقني (IC):  Junior → Mid → Senior → Staff/Principal Engineer
مسار إداري:      Senior → Tech Lead → Engineering Manager
```
اسأل الشخص نفسه عايز أنهي طريق — متفرضش الإدارة على مطور مبسوط بالكود.

## 7. لوحة قياس صحة الفريق — اكشف المشكلة قبل ما تكبر 🩺

راجع المؤشرات دي شهريًا، ودي أول إشارات إنك هتحتاج قرار من القرارات اللي فوق:

| المؤشر | صحي ✅ | إنذار 🚨 | القرار المرتبط |
|--------|---------|----------|----------------|
| ساعات العمل | طبيعية بثبات | سهر وويك إندات مستمرة 3 شهور+ | تعيين أو تقليل نطاق |
| الـ Velocity | ثابتة/بتزيد ببطء | بتنزل Sprint ورا التاني | دوّر على السبب: Burnout؟ ديون تقنية؟ شخص معطّل؟ |
| الـ Retro | نقاش حي وصريح | صمت أو نفس الشكاوى بتتكرر من غير حل | مشكلة ثقة — اتحرك قبل الاستقالات |
| توزيع المعرفة | كل منطقة يعرفها 2+ | Bus Factor=1 في مناطق حرجة | نقل معرفة أو تعيين |
| الـ 1:1s | بتحصل بانتظام وفيها كلام حقيقي | بتتلغي دايمًا "عشان الشغل" | 👈 دي بذرة كل المشاكل اللي فوق |
| دوران الموظفين | استقالة نادرة ومفهومة | 2+ استقالات في 6 شهور | Exit Interviews صريحة — في حاجة غلط جوهرية |

**الخيط اللي بيربط الجزء ده كله:** كل القرارات الصعبة (تعيين، استغناء، ترقية) بتبقى أسهل ألف مرة لو عندك **1:1 أسبوعي حقيقي** مع كل فرد — لأنك بتشوف المشكلة وهي بذرة، مش وهي شجرة.

# الجزء الثامن: المرجع التكميلي — مواضيع مهمة مالهاش مكان تاني 🧩

مواضيع بتقابلك في الشغل الحقيقي وبتفرق جدًا، بس مش بتتشرح عادة في كورسات Agile.

---

## 1. Definition of Ready — التوأم المنسي للـ Definition of Done ✅

الكل بيتكلم عن "إمتى نقول إن التاسك خلص؟" (DoD)، وبينسوا السؤال الأهم: **"إمتى نقول إن التاسك جاهز يبدأ أصلًا؟"**

أغلب التأخيرات سببها إن الفريق بدأ تاسك مش جاهز، فوقف في النص يستنى إجابة أو تصميم.

**قالب Definition of Ready — التاسك ميدخلش الـ Sprint إلا لو:**
```
□ الوصف واضح ومفهوم من غير ما تسأل اللي كتبه
□ الـ Acceptance Criteria مكتوبة ومتفق عليها
□ التصميم (لو محتاج) جاهز ومرفق
□ الاعتماديات معروفة ومحلولة (مش مستني API من فريق تاني)
□ اتقدّر بالنقاط من الفريق
□ صغير كفاية يخلص في Sprint واحد
□ فيه طريقة واضحة نختبره بيها
```

> 💡 القاعدة العملية: في الـ Planning، أي Story مش مستوفية الشروط دي **ترجع للـ Backlog** — مترحمش عليها وتاخدها "وهنشوف". دي أرخص "لأ" هتقولها في حياتك المهنية.

---

## 2. الميزانية والتكاليف — إدارة المشروع بالفلوس 💰

معظم الدلائل بتتكلم عن الوقت وبتنسى إن كل مشروع له تكلفة. الحد الأدنى اللي المطور أو الـ Lead لازم يفهمه:

### مثلث القيود الحديدي (Iron Triangle)

```
              النطاق (Scope)
                   /\
                  /  \
                 /    \
                /      \
        الوقت  /________\  التكلفة
       (Time)              (Cost)

   القاعدة: تقدر تثبّت اتنين بس — التالت لازم يتحرك
```
- عايز نفس النطاق في وقت أقل؟ → التكلفة تزيد (ناس أكتر).
- عايز نفس النطاق بتكلفة أقل؟ → الوقت يطول.
- عايز وقت أقل وتكلفة أقل؟ → **النطاق لازم يقل.**

مفيش خيار رابع، وأي حد بيوعدك بالتلاتة بيكذب أو بيضحي بالجودة (وهي الضلع الخفي في المثلث).

### أنواع التكاليف في مشروع برمجي

| النوع | أمثلة | ملحوظة |
|-------|-------|---------|
| **تكلفة الفريق** | المرتبات × المدة | عادة 70-85% من التكلفة الكلية |
| **البنية التحتية** | سيرفرات، قواعد بيانات، تخزين | بتزيد مع عدد المستخدمين |
| **خدمات وأدوات** | Jira، Figma، خدمات SMS/إشعارات، APIs خارجية | بتتنسى في التقديرات دايمًا |
| **تكلفة الفرصة** | إيه اللي مش بنعمله عشان بنعمل ده؟ | التكلفة الخفية الأهم |

### حساب تكلفة الميزة (Feature Costing) — مثال عملي

```
ميزة "تنبيهات المخزون" من مشروع "سهلة":
  التقدير: 16 نقطة
  Velocity الفريق: 20 نقطة / أسبوعين لفريق من 4
  → الميزة ≈ 80% من Sprint = ~6.4 أيام-فرد

  التكلفة التقريبية = 6.4 × (متوسط تكلفة اليوم للفرد)
  + تكلفة خدمة الإشعارات الشهرية

القرار: الميزة دي هتجيب عائد أكبر من تكلفتها؟
  لو 15 عميل طلبوها ومتوسط اشتراك العميل شهريًا كذا،
  وهتقلل الإلغاء بنسبة معينة → القرار بيبقى بالأرقام مش بالإحساس
```

**نصيحة للمطور:** لما تقول "الميزة دي هتاخد أسبوعين"، أنت فعليًا بتقول "هتكلف كذا". فهم ده بيخلي كلامك في الاجتماعات له وزن مختلف تمامًا.

## 3. الاعتماديات والمسار الحرج (Dependencies & Critical Path) 🔗

### أنواع الاعتماديات

| النوع | معناه | مثال |
|-------|-------|------|
| **Finish-to-Start** (الأشهر) | ب مش يبدأ قبل ما أ يخلص | الـ Frontend مستني الـ API |
| **Start-to-Start** | يبدأوا مع بعض | كتابة الاختبارات مع الكود |
| **اعتمادية خارجية** | مستني حد بره فريقك | موافقة قانونية، API طرف تالت |

### إيه هو المسار الحرج (Critical Path)؟

**أطول سلسلة تاسكات مترابطة في المشروع** — أي تأخير في أي تاسك فيها = تأخير للمشروع كله. أما التاسكات اللي بره المسار ده فعندها "فسحة" (Float/Slack).

**مثال مبسط:**
```
تصميم (3 أيام) → API (5 أيام) → واجهة (4 أيام) → اختبار (2 يوم)  = 14 يوم ← 🔴 المسار الحرج
                ↘ كتابة الوثائق (2 يوم) ─────────────────────────↗   (عندها 8 أيام فسحة)
```
لو الـ API اتأخر يوم → المشروع كله اتأخر يوم.
لو الوثائق اتأخرت يوم → مفيش تأثير على الإطلاق.

**ليه ده مهم ليك عمليًا؟**
1. **ركّز مراقبتك على المسار الحرج** — التاسكات دي هي اللي تسأل عنها في الـ Standup كل يوم.
2. **لو محتاج تسرّع المشروع**، مفيش فايدة من تسريع تاسك بره المسار الحرج — ده مجهود ضايع.
3. **الاعتماديات الخارجية تتبدأ بدري** — لو مستني موافقة أو حساب من شركة تانية، اطلبه من أول أسبوع مش لما تحتاجه.

### إزاي تدير الاعتماديات عمليًا

```
□ في الـ Planning: اسأل عن كل Story — "دي مستنية حاجة؟"
□ في أدوات زي Jira: استخدم "Blocked by / Blocks" لربط التاسكات
□ التاسك المعطّل يتعلّم بوسم 🚧 ويتراجع يوميًا مش أسبوعيًا
□ اعمل تاسك منفصل للاعتمادية الخارجية بمالك واسم وتاريخ
   ("متابعة موافقة البنك — مسؤول: كريم — deadline: 20/8")
```

## 4. التقدير الثلاثي (PERT) — لما يسألوك "إمتى بالظبط؟" 🎲

الـ Story Points ممتازة داخل الفريق، لكن لما العميل أو الإدارة يسألوا بالتاريخ، استخدم التقدير الثلاثي بدل رقم واحد متفائل:

```
O = التقدير المتفائل   (لو كل حاجة مشيت مظبوط)
M = التقدير الأرجح     (السيناريو الطبيعي)
P = التقدير المتشائم   (لو ظهرت مشاكل معقولة)

التقدير النهائي = (O + 4M + P) ÷ 6
```

**مثال:** ميزة الدفع الإلكتروني
```
O = 8 أيام | M = 12 يوم | P = 25 يوم  (لأن التكامل مع البنك مجهول)
التقدير = (8 + 48 + 25) ÷ 6 = 13.5 يوم ≈ أسبوعين ونص
```

**ليه ده أفضل؟** لأنه بيجبرك تفكر في السيناريو السيئ، وبيديك رقم واقعي بدل الرقم المتفائل اللي كلنا بنقوله تلقائيًا. وكمان الفرق الكبير بين O وP نفسه رسالة: **كل ما الفجوة اتسعت، كل ما المجهول أكتر → محتاج Spike قبل الالتزام.**

**وطريقة العرض الاحترافية:** بدل "هيخلص يوم 20"، قول **"هيخلص بين 18 و 26، والأرجح 21"** — الصدق في عدم اليقين بيبني ثقة أكتر من الدقة المزيفة.

## 5. خريطة أصحاب المصلحة (Stakeholder Mapping) 🗺️

مش كل الناس المهتمة بمشروعك تتعامل بنفس الطريقة. قسّمهم على محورين: **قد إيه عندهم سلطة** و **قد إيه مهتمين**:

```
              سلطة عالية
                   │
   🎯 اداره عن قرب │ 🤝 أرضيه وحافظ عليه
   (مهتم + سلطة)   │ (سلطة بس مش مهتم)
   → اجتماع دوري    │ → تقرير مختصر دوري
     ومشاركة القرار │   من غير تفاصيل
  ─────────────────┼─────────────────── اهتمام
   ℹ️ بلّغه بانتظام │ 👀 راقبه بأقل مجهود
   (مهتم بس بلا سلطة)│ (لا سلطة ولا اهتمام)
   → نشرة/إعلان     │ → مفيش تواصل دوري
                   │
              سلطة قليلة
```

**مثال من مشروع "سهلة":**
- **كريم (CEO)** = سلطة عالية + اهتمام عالي → اجتماع أسبوعي وقرارات مشتركة.
- **المستثمر** = سلطة عالية + اهتمام أقل بالتفاصيل → تقرير شهري بالأرقام بس.
- **التجار المستخدمين** = اهتمام عالي + سلطة قليلة → إعلانات الإصدارات وقنوات الفيدباك.
- **فريق المحاسبة الداخلي** = يتبلغوا لما حاجة تخصهم بس.

**الخطأ الشائع:** إغراق صاحب السلطة العالية بتفاصيل تقنية يومية (هيبطل يقرا)، أو إهمال المستخدمين المهتمين (هيتحولوا لمصدر شكاوى).

## 6. إدارة الديون التقنية كسياسة مش كشكوى 🏗️

كل المطورين بيشتكوا من الـ Technical Debt، وقليل اللي عندهم **نظام** للتعامل معها:

### صنّف الديون قبل ما تتكلم عنها

| النوع | المثال | التعامل |
|-------|--------|---------|
| **دين مقصود ومحسوب** | "هنعمل الحل السريع ده عشان نلحق الإطلاق، ونصلحه بعده" | ✅ مقبول — بشرط يتسجل بتاسك وتاريخ |
| **دين غير مقصود** | اتعلمنا طريقة أحسن بعد ما كتبنا الكود | طبيعي — يتصلح تدريجيًا |
| **دين متهور** | "مش فاضي أكتب اختبارات" بشكل دائم | 🚫 ده مش دين، ده إهمال |

### قاعدة الميزانية الثابتة (الحل العملي المثبت)

```
خصص نسبة ثابتة من كل Sprint للديون التقنية: 15-20%
  Sprint سعته 20 نقطة → 3-4 نقط تروح للتحسينات والإصلاحات
  
ليه ثابتة؟ لأن "هنصلحها لما نفضى" = مش هتتصلح أبدًا
```

### وإزاي تقنع الإدارة؟ **بلغة النتايج مش لغة الكود**
```
❌ "الكود ده وحش ومحتاج Refactoring"
✅ "الجزء ده بياخد مننا 3 أيام في كل ميزة جديدة بدل يوم،
    ولو صلحناه (5 أيام مرة واحدة) هنوفر ~40% من وقت
    تطوير أي ميزة تخصه بعد كده"
```

## 7. الشغل مع فرق خارجية أو Outsourcing 🤝

لو الشركة استعانت بشركة/فريق خارجي (شائع جدًا في السوق):

**القواعد الخمسة:**
1. **مصدر حقيقة واحد للتاسكات** — الفريق الخارجي يشتغل على **نفس الأداة** بتاعتك، مش Excel بيتبعت بالإيميل.
2. **Definition of Done مكتوبة ومتفق عليها من أول يوم** — الخلاف الأكبر دايمًا على "يعني إيه خلص".
3. **حد داخلي مسؤول عنهم بالاسم** (Point of Contact) — من غيره التواصل بيتوه.
4. **مراجعة الكود إلزامية من فريقك** — الكود اللي هتصونه بعدين لازم تكون شفته وأنت بتستلمه.
5. **تسليمات صغيرة ومتكررة** — كل أسبوعين شغل شغال، مش تسليمة واحدة بعد 3 شهور (لو المستوى وحش، تكتشفه بدري).

**علامات إنذار مبكر 🚩:** الردود بتتأخر، "خلصنا 90%" بتتكرر، الكود بييجي من غير اختبارات، أو رفض مشاركة الـ Repo أثناء العمل.

## 8. إزاي تدير اجتماع محترم (Facilitation) 🎤

المطور اللي بيعرف يدير اجتماع بيتنقل لمواقع قيادية أسرع. القواعد اللي بتفرق:

```
قبل الاجتماع:
  □ أجندة مكتوبة في الدعوة + النتيجة المطلوبة
    ("الهدف: نقرر نستخدم أنهي مزود دفع" — مش "نتكلم عن الدفع")
  □ مين لازم يحضر فعلًا؟ (الاجتماع اللي فيه 10 أشخاص واتنين بيتكلموا = هدر)
  □ المواد تتبعت قبلها بيوم عشان الكل يقرا

أثناء الاجتماع:
  □ ابدأ بالهدف في جملة، واختم بالقرارات
  □ نقاش خرج برة الموضوع؟ → "Parking Lot" — يتكتب جنب وناخده بعدين
  □ الصامتين اسألهم بالاسم — أحسن الأفكار عند الهادي غالبًا
  □ خلّي حد يكتب القرارات لايف والكل شايف

بعد الاجتماع (خلال ساعة):
  □ ملخص من 5 سطور: القرارات + Action Items
    (كل واحدة ليها مسؤول بالاسم وتاريخ) + النقط المؤجلة
  □ اللي مش موجود يقرا الملخص ويبقى عارف — مش يستنى حد يحكيله
```

**سؤال ذهبي قبل أي اجتماع تعمله:** *"ده ممكن يتحل برسالة مكتوبة؟"* — لو أيوه، اكتبها ووفّر ساعة من وقت 6 أشخاص.

## 9. جدول القرارات السريع — "الموقف ده أعمل فيه إيه؟" ⚡

مرجع سريع لأكتر المواقف تكرارًا:

| الموقف | القرار الصح |
|--------|-------------|
| تاسك طلع أكبر من تقديره | بلّغ فورًا في الـ Standup + قسّمه ورحّل جزء |
| الـ PO عايز ميزة في نص الـ Sprint | مقبول بشرط: شيل حاجة بنفس الحجم |
| تاسك مش واضح | ميدخلش Sprint — يرجع للـ Refinement (Definition of Ready) |
| مستني حاجة من فريق تاني | تاسك منفصل بمالك وتاريخ + تصعيد بعد يوم |
| الـ Sprint هيفشل (واضح في نصه) | اتكلم بدري، مش آخر يوم — راجع الالتزام مع الـ PO |
| Bug في الإنتاج أثناء Sprint | لو حرج: Hotfix فورًا + شيل تاسك مقابله. لو مش حرج: الـ Backlog |
| فيه خلاف تقني بين اتنين في الفريق | Timebox للنقاش (30 دقيقة) → لو مفيش اتفاق، الـ Tech Lead يقرر ونمشي |
| قدّرت غلط 3 Sprints ورا بعض | المشكلة في طريقة التقدير مش في الحظ — موضوع للـ Retro |
| العميل بيطلب تعديلات بلا حدود | ارجع للنطاق المكتوب: "ده خارج الاتفاق، نعمله في مرحلة تانية / بتسعير منفصل" |
| مطلوب منك تشتغل على 3 مشاريع مع بعض | اطلب ترتيب أولويات مكتوب من مدير واحد — تعدد الأسياد = فشل مضمون |

## خاتمة الدليل 🏁

الدليل ده غطى الرحلة كاملة في 8 أجزاء:

```
1️⃣ الأساسيات          → المنهجيات والمصطلحات والأدوات
2️⃣ مشروع عملي         → من تحديد النطاق للإطلاق
3️⃣ مستوى متقدم        → الأولويات والـ Capacity وGit والمقاييس
4️⃣ الشرح المبسط       → تشبيهات وأمثلة وورش تقسيم
5️⃣ بناء شركة          → الفريق والأدوار وطريقة الشغل
6️⃣ ما بعد الإطلاق     → OKRs والإصدارات والأزمات
7️⃣ قرارات الأفراد     → التعيين والتدريب والاستغناء
8️⃣ المرجع التكميلي    → التكاليف والاعتماديات والقرارات السريعة
```

**وأهم 5 حاجات لو نسيت كل حاجة تانية:**
1. **قسّم لحد ما التاسك يبقى أصغر من يومين.**
2. **قدّر بالنقاط، وخطط بالـ Velocity، وحط Buffer.**
3. **بلّغ عن المشاكل بدري — المفاجأة هي الكارثة، مش التأخير.**
4. **الـ Sprint محمي: أي إضافة = شيل حاجة مقابلها.**
5. **راجع نفسك كل فترة (Retro) — التحسين المستمر هو كل الحكاية.**

القراءة بتديك 20%، والتطبيق بيديك الـ 80%. اختار مشروع — أي مشروع — وابدأ من بكرة. بالتوفيق يا صاحبي 🚀

  const W = 600, H = 190, pad = 30;
  const x = d => pad + (d / days) * (W - pad * 2);
  const y = v => H - pad + 6 - (v / total) * (H - pad * 2);
  const today = Math.min(days, Math.floor((Date.now() - start) / DAY));
  let pts = [];
  for(let d = 0; d <= Math.max(0, today); d++){
    const cutoff = start + (d + 1) * DAY;
    const doneP = inSprint.filter(t => t.doneAt && t.doneAt < cutoff).reduce((s,t) => s + (+t.pts || 0), 0);
    pts.push(`${x(d).toFixed(1)},${y(total - doneP).toFixed(1)}`);
  }
  const grid = [0, .5, 1].map(f => `<line x1="${pad}" x2="${W-pad}" y1="${y(total*f)}" y2="${y(total*f)}" stroke="var(--line)" />
     <text x="${pad-6}" y="${y(total*f)+4}" font-size="10" fill="var(--muted)" text-anchor="end">${Math.round(total*f)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="bd-burn" dir="ltr" role="img" aria-label="Burndown chart">
    ${grid}
    <line x1="${x(0)}" y1="${y(total)}" x2="${x(days)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="5 5" />
    ${pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" />` : ''}
    ${pts.length ? `<circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="4.5" fill="var(--accent)" />` : ''}
    <text x="${pad}" y="${H-6}" font-size="10" fill="var(--muted)">Day 0</text>
    <text x="${W-pad}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">Day ${days}</text>
  </svg>
  <div class="bd-legend"><span><i style="border-top:2px dashed var(--muted)"></i> المثالي</span><span><i style="border-top:3px solid var(--accent)"></i> الفعلي</span></div>`;
}

/* ---------- الرسم الرئيسي ---------- */
const bF = {q:'', prio:'all', tag:''};
let bDrag = null;
function renderBoard(){
  const p = P();
  const all = p.tasks;
  const sumPts = a => a.reduce((s,t) => s + (+t.pts || 0), 0);
  const done = all.filter(t => t.col === 'done');
  const sprintTasks = all.filter(t => t.col !== 'backlog');
  const vel = p.history.length ? Math.round(p.history.reduce((s,h) => s + h.pts, 0) / p.history.length) : null;
  const allTags = [...new Set(all.flatMap(t => t.tags || []))].sort();
  const late = all.filter(t => t.col !== 'done' && dueState(t.due) === 'late').length;

  document.getElementById('pager').innerHTML = '';
  document.getElementById('pagehead').innerHTML =
    `<span class="crumb">BOARD</span><h1>📋 لوحة المهام</h1>
     <p>طبّق اللي بتتعلمه: مشاريع منفصلة، Sprints بهدف ومدة، Burndown حقيقي، والـ Velocity بتتحسب لوحدها.</p>`;

  let sprintHTML;
  if(p.sprint){
    const sp = p.sprint;
    const left = Math.ceil((new Date(sp.end + 'T23:59:59') - Date.now()) / DAY);
    sprintHTML = `
      <div class="bd-sprint">
        <div class="bd-sp-top">
          <div><span class="bd-sp-tag">SPRINT</span> <b>${escapeHtml(sp.name)}</b>
            <div class="bd-sp-goal">🎯 ${sp.goal ? escapeHtml(sp.goal) : '<i>من غير هدف — كل Sprint محتاج هدف في جملة واحدة</i>'}</div>
            <div class="bd-sp-dates">${fmtD(sp.start)} ← ${fmtD(sp.end)} · ${left >= 0 ? `فاضل <b>${left}</b> يوم` : '<b style="color:#C64848">انتهى وقته — اقفله واعمل Retro</b>'}</div>
          </div>
          <div class="bd-sp-act">
            <button class="bd-btn" id="bdEndSprint">🏁 إنهاء الـ Sprint</button>
          </div>
        </div>
        <div class="bd-sp-nums">
          <span>ملتزمين بـ <b>${sumPts(sprintTasks)}</b> نقطة</span>
          <span>اتنجز <b style="color:var(--accent)">${sumPts(done)}</b></span>
          ${vel ? `<span>متوسط الـ Velocity <b>${vel}</b> ${sumPts(sprintTasks) > vel * 1.2 ? '<em class="bd-warn">⚠️ ملتزمين بأكتر من قدرتكم</em>' : ''}</span>` : ''}
        </div>
        ${burndownSVG(p)}
      </div>`;
  } else {
    sprintHTML = `
      <div class="bd-sprint off">
        <b>مفيش Sprint شغال.</b> <span>اسحب التاسكات اللي هتلتزم بيها من الـ Backlog لـ "قايمة الشغل"، وابدأ Sprint بهدف واضح.</span>
        <div class="bd-sp-form">
          <input type="text" id="spName" placeholder="اسم الـ Sprint (مثلًا Sprint ${p.history.length + 1})" maxlength="40">
          <input type="text" id="spGoal" placeholder="الهدف في جملة واحدة" maxlength="120">
          <select id="spLen"><option value="7">أسبوع</option><option value="14" selected>أسبوعين</option><option value="21">3 أسابيع</option><option value="28">4 أسابيع</option></select>
          <button class="bd-btn pri" id="spStart">▶ ابدأ الـ Sprint</button>
        </div>
      </div>`;
  }

  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="bd-projbar">
      <select id="bdProj" aria-label="المشروع">
        ${board.projects.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>📁 ${escapeHtml(x.name)}</option>`).join('')}
        <option value="__new">＋ مشروع جديد…</option>
      </select>
      <button class="bd-btn" id="bdRename" title="إعادة تسمية">✏️</button>
      <button class="bd-btn" id="bdDelProj" title="حذف المشروع">🗑</button>
      <span class="sp"></span>
      <button class="bd-btn" id="bdCalc" title="احسب موعد التسليم من الـ Backlog والـ Velocity">🧮 موعد التسليم</button>
      <button class="bd-btn" id="bdExport">⬇️ تصدير</button>
      <button class="bd-btn" id="bdImport">⬆️ استيراد</button>
      <input type="file" id="bdFile" accept=".json" style="display:none">
    </div>
    ${sprintHTML}
    <div class="bd-tools">
      <button class="bd-btn pri" id="bdNew">＋ تاسك جديد <span class="kb">N</span></button>
      <input type="search" id="bdQ" placeholder="🔎 فلترة…" value="${escapeHtml(bF.q)}">
      <select id="bdPrio"><option value="all">كل الأولويات</option>
        ${Object.keys(PR_LBL).map(k => `<option value="${k}" ${bF.prio === k ? 'selected' : ''}>${PR_LBL[k]}</option>`).join('')}</select>
      ${allTags.length ? `<select id="bdTag"><option value="">كل الوسوم</option>${allTags.map(t => `<option ${bF.tag === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}</select>` : ''}
      <button class="bd-btn" id="bdClearDone">🧹 أرشفة الخالص</button>
    </div>
    <div class="bd-stats">
      <div class="bd-stat">الإجمالي <b>${all.length}</b></div>
      <div class="bd-stat">Backlog <b>${all.filter(t => t.col === 'backlog').length}</b> <small>(${sumPts(all.filter(t => t.col === 'backlog'))} pt)</small></div>
      <div class="bd-stat">شغال فيه <b>${all.filter(t => t.col === 'doing').length}</b></div>
      <div class="bd-stat">خلص <b>${done.length}</b></div>
      ${late ? `<div class="bd-stat late">متأخر <b>${late}</b></div>` : ''}
      ${p.history.length ? `<div class="bd-stat">Sprints خلصت <b>${p.history.length}</b></div>` : ''}
    </div>
    <div class="bd-board" id="bdBoard"></div>
    ${p.history.length ? `<details class="bd-hist"><summary>📈 سجل الـ Velocity (${p.history.length})</summary>
      ${velocityBars(p.history)}</details>` : ''}`;

  /* الأعمدة */
  const bb = c.querySelector('#bdBoard');
  const q = norm(stripMarks(bF.q.trim()));
  BCOLS.forEach((col, ci) => {
    const list = all.filter(t => t.col === col.id
        && (bF.prio === 'all' || t.prio === bF.prio)
        && (!bF.tag || (t.tags || []).includes(bF.tag))
        && (!q || norm(t.title + ' ' + (t.desc || '') + ' ' + (t.tags || []).join(' ')).includes(q)))
      .sort((a,b) => a.order - b.order);
    const total = all.filter(t => t.col === col.id).length;
    const el = document.createElement('div');
    el.className = 'bd-col';
    el.innerHTML = `<div class="bd-head"><span class="dot" style="background:${col.color}"></span>${col.name}
      <span class="cnt">${total}${col.wip ? '/' + col.wip : ''}</span>
      ${col.wip && total > col.wip ? '<span class="wip">فوق الـ WIP</span>' : ''}
      <button class="bd-add" data-col="${col.id}" title="إضافة هنا">＋</button></div>
      <div class="bd-body" data-col="${col.id}"></div>`;
    const body = el.querySelector('.bd-body');
    if(!list.length) body.innerHTML = `<div class="bd-empty">${(bF.q || bF.prio !== 'all' || bF.tag) ? 'مفيش نتايج' : 'فاضي — اسحب تاسك هنا'}</div>`;
    list.forEach(t => body.appendChild(cardNode(t, ci)));
    body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('over'); });
    body.addEventListener('dragleave', () => body.classList.remove('over'));
    body.addEventListener('drop', e => { e.preventDefault(); body.classList.remove('over'); if(bDrag) moveTaskTo(bDrag, col.id); });
    el.querySelector('.bd-add').onclick = () => openTaskModal(null, col.id);
    bb.appendChild(el);
  });

  /* الأحداث */
  const $c = s => c.querySelector(s);
  $c('#bdNew').onclick = () => openTaskModal(null, 'todo');
  $c('#bdQ').oninput = e => { bF.q = e.target.value; const pos = e.target.selectionStart; renderBoard();
    const n = document.getElementById('bdQ'); n.focus(); n.setSelectionRange(pos, pos); };
  $c('#bdQ').onkeydown = e => e.stopPropagation();
  $c('#bdPrio').onchange = e => { bF.prio = e.target.value; renderBoard(); };
  if($c('#bdTag')) $c('#bdTag').onchange = e => { bF.tag = e.target.value; renderBoard(); };
  $c('#bdClearDone').onclick = () => {
    const n = p.tasks.filter(t => t.col === 'done').length;
    if(!n) return gToast('مفيش تاسكات خالصة');
    const removed = p.tasks.filter(t => t.col === 'done');
    p.tasks = p.tasks.filter(t => t.col !== 'done');
    saveBoard(); renderBoard();
    gToast(`اتأرشف ${n} تاسك`, {label:'تراجع', fn:() => { p.tasks.push(...removed); saveBoard(); renderBoard(); }});
  };
  $c('#bdProj').onchange = e => {
    if(e.target.value === '__new'){
      const name = prompt('اسم المشروع الجديد:');
      if(name && name.trim()){ const np = newProject(name.trim().slice(0,40)); board.projects.push(np); board.active = np.id; }
    } else board.active = e.target.value;
    bF.q = ''; bF.tag = ''; bF.prio = 'all';
    saveBoard(); renderBoard();
  };
  $c('#bdRename').onclick = () => {
    const name = prompt('اسم المشروع:', p.name);
    if(name && name.trim()){ p.name = name.trim().slice(0,40); saveBoard(); renderBoard(); }
  };
  $c('#bdDelProj').onclick = () => {
    if(board.projects.length === 1) return gToast('لازم يفضل مشروع واحد على الأقل');
    if(!confirm(`تحذف مشروع "${p.name}" بكل تاسكاته (${p.tasks.length})؟`)) return;
    const idx = board.projects.indexOf(p);
    board.projects.splice(idx, 1); board.active = board.projects[0].id;
    saveBoard(); renderBoard();
    gToast('اتحذف المشروع', {label:'تراجع', fn:() => { board.projects.splice(idx, 0, p); board.active = p.id; saveBoard(); renderBoard(); }});
  };
  $c('#bdCalc').onclick = () => {
    const backlogPts = sumPts(all.filter(t => t.col !== 'done'));
    if(!backlogPts) return gToast('ضيف نقاط للتاسكات الأول عشان نحسب');
    window.__calcPrefill = {pts: backlogPts, vel: vel || 20, len: p.sprint ? Math.round((new Date(p.sprint.end) - new Date(p.sprint.start)) / DAY / 7) || 2 : 2};
    go(-1);
  };
  $c('#bdExport').onclick = () => {
    const blob = new Blob([JSON.stringify(board, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'board-' + todayStr() + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  $c('#bdImport').onclick = () => $c('#bdFile').click();
  $c('#bdFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(Array.isArray(d.projects) && d.projects.length) board = d;
        else if(Array.isArray(d.tasks)){                       /* ملف من اللوحة المنفصلة */
          const np = newProject('مستورد ' + todayStr());
          np.tasks = d.tasks.map(t => ({desc:'', tags:[], due:'', doneAt:null, ...t, pts: t.pts ? +t.pts : null}));
          np.seq = d.seq || np.tasks.length + 1;
          board.projects.push(np); board.active = np.id;
        } else throw 0;
        saveBoard(); renderBoard(); gToast('اتستوردت ✓');
      }catch(err){ gToast('الملف مش صحيح ❌'); }
    };
    r.readAsText(f);
  };
  if($c('#spStart')) $c('#spStart').onclick = () => {
    const len = +$c('#spLen').value;
    const start = todayStr();
    const end = new Date(Date.now() + (len - 1) * DAY).toISOString().slice(0,10);
    p.sprint = {name: $c('#spName').value.trim() || ('Sprint ' + (p.history.length + 1)), goal: $c('#spGoal').value.trim(), start, end};
    p.tasks.filter(t => t.col === 'done').forEach(t => { if(!t.doneAt || t.doneAt < Date.now() - DAY) t.doneAt = null; });
    saveBoard(); renderBoard(); gToast('بدأ الـ Sprint 🚀 — بالتوفيق');
  };
  ['#spName','#spGoal'].forEach(s => { if($c(s)) $c(s).onkeydown = e => e.stopPropagation(); });
  if($c('#bdEndSprint')) $c('#bdEndSprint').onclick = () => {
    const sp = p.sprint;
    const start = new Date(sp.start + 'T00:00:00').getTime();
    const doneNow = p.tasks.filter(t => t.col === 'done');
    const ptsDone = sumPts(doneNow.filter(t => !t.doneAt || t.doneAt >= start));
    const unfinished = p.tasks.filter(t => !['done','backlog'].includes(t.col)).length;
    if(!confirm(`إنهاء "${sp.name}"؟\n\n✅ اتنجز: ${ptsDone} نقطة (هتتسجل كـ Velocity)\n↩️ ${unfinished} تاسك مخلصش هيفضل مكانه للـ Sprint الجاي\n🗄 التاسكات الخالصة هتتأرشف`)) return;
    p.history.push({name: sp.name, goal: sp.goal, pts: ptsDone, end: todayStr()});
    p.tasks = p.tasks.filter(t => t.col !== 'done');
    p.sprint = null;
    saveBoard(); renderBoard();
    gToast(`اتسجل Velocity = ${ptsDone} ✓ — وقت الـ Retro: إيه اللي نحسّنه؟`);
  };
}

function velocityBars(hist){
  const max = Math.max(...hist.map(h => h.pts), 1);
  const avg = Math.round(hist.reduce((s,h) => s + h.pts, 0) / hist.length);
  return `<div class="bd-vel">${hist.slice(-10).map(h => `
    <div class="vrow"><span class="vn">${escapeHtml(h.name)}</span>
      <span class="vb"><i style="width:${(h.pts / max * 100).toFixed(0)}%"></i></span>
      <b>${h.pts}</b></div>`).join('')}
    <div class="vavg">المتوسط: <b>${avg}</b> نقطة / Sprint — استخدمه في التخطيط بدل التخمين</div></div>`;
}

function cardNode(t, ci){
  const d = document.createElement('div');
  const ds = t.col === 'done' ? '' : dueState(t.due);
  d.className = 'bd-card' + (t.col === 'done' ? ' done' : '') + (ds ? ' ' + ds : '');
  d.draggable = true; d.dataset.id = t.id; d.tabIndex = 0;
  d.innerHTML = `<div class="r1"><span class="id">${t.id}</span><span class="pr ${t.prio}">${PR_LBL[t.prio]}</span>
      ${t.pts ? `<span class="pt">${t.pts} pt</span>` : ''}</div>
    <div class="tt">${escapeHtml(t.title)}</div>
    ${t.desc ? `<div class="ds">${escapeHtml(t.desc)}</div>` : ''}
    <div class="meta">
      ${(t.tags || []).map(x => `<span class="tg">${escapeHtml(x)}</span>`).join('')}
      ${t.src ? `<span class="tg src">${t.src}</span>` : ''}
      ${t.due ? `<span class="du ${ds}">📅 ${fmtD(t.due)}${ds === 'late' ? ' · متأخر' : ''}</span>` : ''}
    </div>
    <div class="r3">
      ${ci > 0 ? `<button data-mv="-1" title="${BCOLS[ci-1].name}">→ ${BCOLS[ci-1].name}</button>` : ''}
      ${ci < BCOLS.length - 1 ? `<button data-mv="1" title="${BCOLS[ci+1].name}">${BCOLS[ci+1].name} ←</button>` : ''}
    </div>`;
  d.addEventListener('dragstart', () => { bDrag = t.id; d.classList.add('drag'); });
  d.addEventListener('dragend',   () => { bDrag = null; d.classList.remove('drag'); });
  d.addEventListener('click', e => { if(!e.target.closest('[data-mv]')) openTaskModal(t.id); });
  d.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.stopPropagation(); openTaskModal(t.id); } });
  d.querySelectorAll('[data-mv]').forEach(b => b.onclick = ev => { ev.stopPropagation(); moveTaskTo(t.id, BCOLS[ci + (+b.dataset.mv)].id); });
  return d;
}

function moveTaskTo(id, colId){
  const t = P().tasks.find(x => x.id === id);
  if(!t || t.col === colId) return;
  t.col = colId; t.order = Date.now();
  t.doneAt = colId === 'done' ? Date.now() : null;
  saveBoard(); renderBoard();
  const col = BCOLS.find(c => c.id === colId);
  if(colId === 'done') gToast('برافو! تاسك خلص 🎉');
  else if(col.wip && P().tasks.filter(x => x.col === colId).length > col.wip) gToast('⚠️ عديت حد الـ WIP — خلّص اللي في إيدك الأول');
}

/* ---------- مودال التاسك (إضافة / تعديل) ---------- */
let mState = null;
function openTaskModal(id, col){
  const p = P();
  const t = id ? p.tasks.find(x => x.id === id) : null;
  mState = {id, prio: t ? t.prio : 'med', pts: t ? t.pts : null};
  const ov = document.getElementById('tModal');
  ov.innerHTML = `
    <div class="tm" role="dialog" aria-modal="true" aria-label="${t ? 'تعديل تاسك' : 'تاسك جديد'}">
      <h3>${t ? 'تعديل ' + t.id : 'تاسك جديد'}</h3>
      <label>العنوان *</label>
      <input type="text" id="tmTitle" maxlength="140" value="${t ? escapeHtml(t.title) : ''}" placeholder="مثلًا: بناء شاشة تسجيل الدخول">
      <label>الوصف / Acceptance Criteria</label>
      <textarea id="tmDesc" maxlength="2000" placeholder="✅ لما المستخدم يدوس… يحصل…">${t ? escapeHtml(t.desc || '') : ''}</textarea>
      <div class="tm-row">
        <div><label>الأولوية</label><div class="tm-chips" id="tmPrio">
          ${Object.keys(PR_LBL).map(k => `<button data-p="${k}" class="bd-chip">${PR_LBL[k]}</button>`).join('')}</div></div>
        <div><label>النقاط</label><div class="tm-chips" id="tmPts">
          ${[1,2,3,5,8,13].map(n => `<button data-n="${n}" class="bd-chip">${n}</button>`).join('')}</div></div>
      </div>
      <div class="tm-hint" id="tmHint"></div>
      <div class="tm-row">
        <div><label>الوسوم (بفاصلة)</label><input type="text" id="tmTags" value="${t ? escapeHtml((t.tags || []).join(', ')) : ''}" placeholder="Backend, Bug"></div>
        <div><label>الموعد النهائي</label><input type="date" id="tmDue" value="${t ? (t.due || '') : ''}"></div>
      </div>
      <label>العمود</label>
      <select id="tmCol">${BCOLS.map(c => `<option value="${c.id}" ${(t ? t.col : (col || 'todo')) === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select>
      <div class="tm-btns">
        ${t ? '<button class="bd-btn danger" id="tmDel">🗑 حذف</button><button class="bd-btn" id="tmDup">نسخ</button>' : ''}
        <span class="sp"></span>
        <button class="bd-btn" id="tmCancel">إلغاء</button>
        <button class="bd-btn pri" id="tmSave">حفظ <span class="kb">Ctrl+Enter</span></button>
      </div>
    </div>`;
  ov.classList.add('on');
  const q = s => ov.querySelector(s);
  const sync = () => {
    ov.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === mState.prio));
    ov.querySelectorAll('[data-n]').forEach(b => b.classList.toggle('on', b.dataset.n == mState.pts));
    q('#tmHint').textContent = mState.pts == 13 ? '⚠️ 13 نقطة = غالبًا دي Epic مش Story — قسّمها لحاجات أصغر.' :
                               mState.pts == 8  ? '💡 8 نقط كبيرة — اتأكد إنها هتخلص في Sprint واحد.' : '';
  };
  ov.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { mState.prio = b.dataset.p; sync(); });
  ov.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { mState.pts = mState.pts == b.dataset.n ? null : +b.dataset.n; sync(); });
  sync();
  const close = () => { ov.classList.remove('on'); ov.innerHTML = ''; mState = null; };
  const save = () => {
    const title = q('#tmTitle').value.trim();
    if(!title){ q('#tmTitle').focus(); return; }
    const data = {title, desc: q('#tmDesc').value.trim(), prio: mState.prio, pts: mState.pts,

function runCalc(){
  const out = document.getElementById('calcOut');
  if(!out) return;
  const g = id => parseFloat((document.getElementById(id)||{}).value) || 0;
  const pts = g('cPts'), vel = g('cVel'), len = g('cLen'), buf = g('cBuf');
  if(pts <= 0 || vel <= 0 || len <= 0){
    out.innerHTML = 'دخّل أرقام صحيحة عشان الحسبة تشتغل.'; return;
  }
  const sprints = pts / vel;
  const weeksRaw = sprints * len;
  const weeks = weeksRaw * (1 + buf/100);
  const sprintsBuf = Math.ceil(weeks / len);
  const days = Math.round(weeks * 7);
  const end = new Date(Date.now() + days*86400000);
  const endStr = end.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
  const big = pts / vel > 12;
  out.innerHTML = `
    عدد الـ Sprints المطلوبة: <b>${sprints.toFixed(1)}</b> &nbsp;→&nbsp; مع هامش ${buf}%: <b>${sprintsBuf}</b> Sprint<br>
    المدة التقديرية: <b>${weeks.toFixed(1)}</b> أسبوع (≈ <b>${Math.round(weeks/4.33)}</b> شهر)<br>
    لو بدأت النهارده، التسليم المتوقع حوالي: <b>${endStr}</b>
    ${big ? '<br><span class="warn">⚠️ المشروع أطول من 6 شهور — قسّمه لمراحل (MVP أولًا) بدل خطة واحدة طويلة.</span>' : ''}
  `;
}

/* ---------- Clipboard helper ---------- */
function copyText(txt, cb){
  const done = () => cb && cb();
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    ta.remove();
  }
}

/* ---------- Interactive checklists (□ inside code blocks) ---------- */
const checkState = new Set();   /* keys: part|lineHash */
function hashLine(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return h;
}
function activateChecklists(scope){
  scope.querySelectorAll('pre').forEach(pre => {
    const raw = pre.textContent;
    if(!raw.includes('□')) return;
    const lines = raw.split('\n');
    const frag = document.createDocumentFragment();
    let total = 0;
    lines.forEach((ln, i) => {
      if(i) frag.appendChild(document.createTextNode('\n'));
      const idx = ln.indexOf('□');
      if(idx === -1){ frag.appendChild(document.createTextNode(ln)); return; }
      total++;
      const key = current + '|' + hashLine(ln.trim());
      const span = document.createElement('span');
      span.className = 'chkline';
      const box = document.createElement('span');
      box.className = 'chk';
      const on = checkState.has(key);
      box.textContent = on ? '☑' : '□';
      if(on){ box.classList.add('on'); span.classList.add('done'); }
      box.onclick = () => {
        const nowOn = !box.classList.contains('on');
        box.classList.toggle('on', nowOn);
        span.classList.toggle('done', nowOn);
        box.textContent = nowOn ? '☑' : '□';
        if(nowOn) checkState.add(key); else checkState.delete(key);
        updateChkBar(pre);
        saveProgress();
      };
      span.appendChild(document.createTextNode(ln.slice(0, idx)));
      span.appendChild(box);
      span.appendChild(document.createTextNode(ln.slice(idx+1)));
      frag.appendChild(span);
    });
    const code = pre.querySelector('code') || pre;
    code.innerHTML = '';
    code.appendChild(frag);
    if(total >= 2){
      const bar = document.createElement('div');
      bar.className = 'chkbar';
      bar.innerHTML = `<span>✅ قائمة تفاعلية — دوس على □ لتعليمها</span>
                       <span class="cnt"></span>
                       <button class="tobd" title="حوّل البنود اللي لسه ما اتعملتش لتاسكات على لوحة المهام">➕ للوحة</button>
                       <button class="rst">مسح</button>`;
      bar.querySelector('.tobd').onclick = () => {
        let added = 0;
        pre.querySelectorAll('.chkline').forEach(line => {
          if(line.classList.contains('done')) return;
          const title = line.textContent.replace(/[□☑]/g,'').replace(/\s+/g,' ').trim();
          if(title && addTask(title, {src: PART_META[current].id})) added++;
        });
        saveBoard();
        gToast(added ? `اتضاف ${added} تاسك للوحة ✓` : 'كل البنود دي موجودة على اللوحة أو خالصة', added > 0);
      };
      pre.parentNode.insertBefore(bar, pre);
      bar.querySelector('.rst').onclick = () => {
        pre.querySelectorAll('.chk.on').forEach(b => b.click());
      };
      updateChkBar(pre);
    }
  });
}
function updateChkBar(pre){
  const bar = pre.previousElementSibling;
  if(!bar || !bar.classList.contains('chkbar')) return;
  const all = pre.querySelectorAll('.chk').length;
  const on  = pre.querySelectorAll('.chk.on').length;
  bar.querySelector('.cnt').textContent = on + ' / ' + all;
  bar.querySelector('.cnt').style.fontFamily = 'IBM Plex Mono, monospace';
}

/* ---------- تحويل الروابط النصية (scrumguides.org …) لروابط قابلة للضغط ---------- */
function autolink(scope){
  const rx = /\b((?:https?:\/\/)?(?:[a-z0-9-]+\.)+(?:org|com|io|me|net|dev)(?:\/[\w\-./]*)?)/gi;
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT);
  const targets = []; let n;
  while((n = walker.nextNode())){
    if(n.parentNode.closest('pre, a, code')) continue;
    rx.lastIndex = 0;
    if(rx.test(n.textContent)) targets.push(n);
  }
  targets.forEach(node => {
    const frag = document.createDocumentFragment();
    let last = 0; const t = node.textContent; rx.lastIndex = 0; let m;
    while((m = rx.exec(t))){
      frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[1].startsWith('http') ? m[1] : 'https://' + m[1];
      a.textContent = m[1]; a.dir = 'ltr';
      frag.appendChild(a);
      last = m.index + m[1].length;
    }
    frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
  scope.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

/* ---------- Flash searched term ---------- */
function flashTerm(q){
  const c = document.getElementById('content');
  const walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
  const ql = norm(stripMarks(q));
  let firstMark = null, count = 0, node;
  const nodes = [];
  while((node = walker.nextNode())) nodes.push(node);
  for(const n of nodes){
    if(count >= 12) break;
    if(n.parentNode.closest('pre')) continue;
    const idx = norm(n.textContent).indexOf(ql);
    if(idx === -1) continue;
    const range = document.createRange();
    range.setStart(n, idx); range.setEnd(n, idx + q.length);
    const mark = document.createElement('mark');
    mark.className = 'flash';
    try{ range.surroundContents(mark); }catch(e){ continue; }
    if(!firstMark) firstMark = mark;
    count++;
  }
  if(firstMark) setTimeout(() => firstMark.scrollIntoView({block:'center'}), 60);
}

/* ---------- Mobile drawer ---------- */
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
document.getElementById('menuBtn').onclick = () => {
  sidebar.classList.toggle('open');
  scrim.classList.toggle('on', sidebar.classList.contains('open'));
};
scrim.onclick = closeDrawer;
function closeDrawer(){ sidebar.classList.remove('open'); scrim.classList.remove('on'); }

/* ---------- Search ---------- */
const searchInput = document.getElementById('search');
let searching = false, searchTimer = null, hitEls = [], hitSel = -1, lastQuery = '';
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 180);
});
function runSearch(){
  const q = searchInput.value.trim();
  if(q.length < 2){ if(searching){ exitSearch(); renderPage(); } return; }
  searching = true; lastQuery = q; hitSel = -1;
  const byPart = new Map();
  let total = 0;
  const ql = norm(stripMarks(q));
  normParts.forEach((ntxt, i) => {
    const txt = plainParts[i];
    /* نبحث في نسخة من غير تشكيل، ونحتفظ بخريطة للمواقع الأصلية */
    const map = []; let bare = '';
    for(let k=0;k<ntxt.length;k++){
      if(/[\u064B-\u065F\u0670\u0640]/.test(ntxt[k])) continue;
      map.push(k); bare += ntxt[k];
    }
    let idx = 0, found = 0; const arr = [];
    while((idx = bare.indexOf(ql, idx)) !== -1 && found < 3){
      const a = map[idx], z = map[idx + ql.length - 1] + 1;
      const s = Math.max(0, a - 60), e = Math.min(txt.length, z + 90);
      arr.push({text: txt.slice(s, e), rel: a - s, len: z - a});
      idx += ql.length; found++; total++;
    }
    if(arr.length) byPart.set(i, arr);
  });
  document.getElementById('pager').innerHTML = '';
  document.getElementById('pagehead').innerHTML =
    `<span class="crumb">SEARCH</span><h1>نتائج البحث عن «${escapeHtml(q)}»</h1><p>${total} نتيجة في ${byPart.size} أجزاء — Enter يفتح أول نتيجة</p>`;
  const c = document.getElementById('content');
  if(!total){
    c.innerHTML = `<div class="results"><div class="none">مفيش نتايج — جرّب كلمة تانية 🔎</div></div>`;
    hitEls = []; return;
  }
  let html = '<div class="results">';
  byPart.forEach((snips, i) => {
    const m = PART_META[i];
    html += `<div class="grouphead"><span class="gid">${m.id}</span> ${m.title} <span class="gc">(${snips.length})</span></div>`;
    snips.forEach(x => {
      const pre = escapeHtml(x.text.slice(0, x.rel));
      const hit = escapeHtml(x.text.slice(x.rel, x.rel + x.len));
      const post = escapeHtml(x.text.slice(x.rel + x.len));
      html += `<button class="hit" data-part="${i}"><span class="snip">…${pre}<mark>${hit}</mark>${post}…</span></button>`;
    });
  });
  html += '</div>';
  c.innerHTML = html;
  hitEls = Array.from(c.querySelectorAll('.hit'));
  hitEls.forEach(el => el.onclick = () => { pendingHighlight = lastQuery; go(+el.dataset.part); });
}
function exitSearch(){ searching = false; searchInput.value = ''; hitEls = []; hitSel = -1; }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault(); searchInput.focus(); searchInput.select(); return;
  }
  if(e.key === 'Escape'){
    if(searching){ exitSearch(); renderPage(); }
    searchInput.blur(); closeDrawer(); return;
  }
  const typing = document.activeElement === searchInput;
  if(typing){
    if(e.key === 'Enter' && hitEls.length){
      e.preventDefault();
      const el = hitEls[Math.max(0, hitSel)];
      pendingHighlight = lastQuery; go(+el.dataset.part);
    }
    if(e.key === 'ArrowDown' && hitEls.length){ e.preventDefault(); hitSel = Math.min(hitEls.length-1, hitSel+1); markSel(); }
    if(e.key === 'ArrowUp' && hitEls.length){ e.preventDefault(); hitSel = Math.max(0, hitSel-1); markSel(); }
    return;
  }
  if(current === BOARD){
    if(e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
      e.preventDefault(); openTaskModal(null, 'todo');
    }
    return;
  }
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key === 'ArrowLeft')  go(current + 1);            /* RTL: يسار = التالي */
  if(e.key === 'ArrowRight' && current > -1) go(current - 1); /* RTL: يمين = السابق */
});
function markSel(){
  hitEls.forEach((el,i) => el.classList.toggle('kbd-sel', i === hitSel));
  if(hitSel >= 0) hitEls[hitSel].scrollIntoView({block:'nearest'});
}

/* ---------- Init ---------- */
(async function init(){
  savedProgress = await loadProgress();
  await loadBoard();
  updateBoardCount();
  const hashMatch = location.hash.match(/^#p(\d+)$/);
  if(hashMatch){
    const i = parseInt(hashMatch[1], 10) - 1;
    if(i >= 0 && i < PARTS.length) current = i;
  } else if(location.hash === '#board'){
    current = BOARD;
  } else {
    current = -1; /* الغلاف */
  }
  renderPage();
})();
</script>
