     'Render it from a Suitelet with N/render: render.create(), setTemplateByScriptId, addRecord for the transaction, and addCustomDataSource for extra JSON (for example data from a search). The template then reads it through the alias you gave.'],
    ['Why does a template that looks fine fail to print?',
     'The output must be well-formed XHTML: an unclosed tag, an unescaped ampersand, or a null value used without ?has_content stops the render. Build in small steps and wrap optional fields.'],
    ['Which SuiteQL table holds the real GL impact?',
     'transactionaccountingline: account, debit, credit, amount and posting per line (one row per accounting book with Multi-Book). transactionline holds operational detail like item, quantity and quantityshiprecv.'],
    ['How do you get open invoice balances in SuiteQL?',
     'From transactionaccountingline.amountunpaid on posting, non-voided invoices, not from a status filter. Remember SuiteQL stores status as one letter (e.g. A), unlike saved searches (CustInvc:A).'],
    ['How does OAuth 2.0 machine-to-machine work in NetSuite?',
     'You upload a public certificate on OAuth 2.0 Client Credentials (M2M) Setup mapped to an entity, role and integration, then sign a JWT with the private key (certificate ID in kid, client ID as iss, scopes, aud = token endpoint) and exchange it for a roughly 60-minute access token. No client secret is sent in the token request.'],
    ['What breaks after a sandbox refresh and what do you do?',
     'Everything built only in the sandbox is overwritten by production, and integrations may now point at real partners. Commit work to SDF/Git first; afterwards repoint integrations and credentials to the sandbox account ID, disable jobs that call live systems, check email routing, redeploy and smoke test.'],
    ['What are a contract asset and a contract liability in ARM?',
     'Billed before earned is deferred revenue (a contract liability). Earned before billed is an unbilled receivable (a contract asset). Reclassification at period end nets them per arrangement so the balance sheet shows one net position per contract.'],
  ])
  + cat('🤖', 'AI & N/llm', [
    ['What is N/llm?',
     'The SuiteScript 2.1 server-side module that sends prompts to LLMs on OCI Generative AI. Main methods: generateText (chat), streamed variants, evaluatePrompt for Prompt Studio prompts, embed for vectors, createDocument for grounding data, and getRemainingFreeUsage for quota.'],
    ['How do you stop the model from inventing figures?',
     'Ground it: fetch the facts with SuiteQL, pass them with llm.createDocument, instruct it in the preamble to answer only from the documents and say when data is missing, use a low temperature, and have a person review the output.'],
    ['Would you let AI post transactions automatically?',
     'No. AI output is non-deterministic and can be wrong, so it writes to a draft field or staging record and a person approves. Amounts, tax and GL postings stay rule-based.'],
    ['What are the cost and governance concerns?',
     'Each call is expensive in governance (around 100 units for generation) and uses AI quota. Avoid per-record calls in big loops, cache results, batch or summarize, and monitor remaining free usage.'],
    ['What is Prompt Studio and why use it?',
     'A place to manage prompts centrally. Scripts call them with llm.evaluatePrompt and pass variables, so admins can improve wording without a code deployment.'],
    ['What is prompt injection in a NetSuite context?',
     'Text stored on records (customer notes, emails) can contain instructions that hijack the prompt. Treat record text as data, keep your instructions in the preamble, and validate the output before using it.'],
    ['Give two good AI use cases for a NetSuite client.',
     'Summarizing a customer or case history for a collector or agent, and suggesting a GL account or category for bill lines that a person confirms. Both save time while keeping a human in control.'],
  ])
  + cat('🧮', 'Saved Search Formulas', [
    ['How do you reference fields in a saved search formula?',
     'With braces: {amount}, {trandate}, joined fields like {customer.creditlimit}, and custom fields like {custbody_region}. On list fields {field} returns text; {field.id} returns the internal ID.'],
    ['Write a formula for days overdue that never goes negative.',
     'Formula (Numeric): GREATEST(TRUNC({today}) - {duedate}, 0).'],
    ['How do you build aging buckets in one search?',
     'Several Formula (Numeric) columns with summary type Sum, each CASE WHEN {today}-{duedate} BETWEEN 1 AND 30 THEN {amountremaining} ELSE 0 END (and so on), grouped by customer.'],
    ['How do you avoid divide-by-zero errors?',
     'Wrap the divisor in NULLIF(x, 0), e.g. ({amount} - {costestimate}) / NULLIF({amount}, 0).'],
    ['What does NVL do and when do you need it?',
     'Replaces null with a value, e.g. NVL({quantitycommitted}, 0). Without it, arithmetic with a null returns null and totals look wrong.'],
    ['DECODE vs CASE?',
     'DECODE maps exact values compactly (DECODE(x, 1, \'A\', 2, \'B\', \'Other\')); CASE handles ranges and complex conditions. Use CASE for anything beyond equality.'],
    ['How do you filter with a formula?',
     'Use a Formula (Numeric) criterion that returns 1 when the condition is true, e.g. CASE WHEN {amount} > {customer.creditlimit} THEN 1 ELSE 0 END, set to equal 1.'],
    ['When do you switch from a saved search to SuiteQL?',
     'When you need joins the search cannot express, very large or programmatic extracts, or precise control over GL lines (transactionaccountingline). Keep saved searches for user-maintained lists, dashboards and KPIs.'],
  ])
  + cat('🏦', 'Banking & Approvals', [
    ['Walk through bank reconciliation in current NetSuite.',
     'Import bank data (feeds or statement files), let Intelligent Transaction Matching auto-match, resolve exceptions on Match Bank Data (match, clear, exclude, add missing fees), then reconcile on Reconcile Account Statement until the difference is zero.'],
    ['What is Automated Cash Application?',
     'It creates customer payments from incoming bank lines and applies them to invoices, then matches and clears them, reducing manual cash posting.'],
    ['Why does NetSuite use Undeposited Funds?',
     'Payments wait there until a Deposit groups them, so the deposit equals the single line on the bank statement and reconciliation matches.'],
    ['How are vendor payment files produced?',
     'With the Electronic Bank Payments SuiteApp: payment batches generate bank-specific files for vendor payments, customer refunds or direct debits, with approval routing available for payments.'],
    ['What fraud controls do you put around payments?',
     'Separate vendor creation, bank-detail changes and payment approval; require approval and logging for bank-detail changes; use positive pay where the bank supports it; restrict who can release payment files.'],
    ['How do you turn on approvals for vendor bills or journal entries?',
     'Accounting Preferences > Approval Routing, then use the standard workflow or build a SuiteFlow workflow; SuiteApprovals can provide rule-based multi-level chains without custom workflows.'],
    ['Standard approval routing, SuiteApprovals or custom SuiteFlow — how do you choose?',
     'Start with standard routing for simple supervisor chains, SuiteApprovals for rule-based multi-level chains admins maintain, and custom SuiteFlow only for unusual routing or extra actions. Always enforce no self-approval and lock approved records.'],
    ['Reconciliation is off by 15 at month end. What do you do?',
     'Never force it. Look for a missing bank charge, a duplicate or mis-dated transaction, or a deposit grouped differently from the statement, fix the source transaction, and reconcile to exactly zero.'],
  ])
  + cat('🌙', 'Middle East Localization', [
    ['How does Egypt ETA e-invoicing work at a high level?',
     'The ERP builds a JSON document from each posted invoice, signs it with an eSeal certificate on a USB token or HSM, and submits it through the ETA API using OAuth 2.0 client credentials. ETA returns UUIDs and validates asynchronously, so you poll status and store the result.'],
    ['Does HTTP 202 from ETA mean the invoice is valid?',
     'No. 202 only means received for processing. You poll the submission status until it is valid or invalid, and handle rejections.'],
    ['Why is signing usually outside NetSuite?',
     'The eSeal sits on a physical USB token or HSM, so signing runs on a small signing service or agent that can reach it; NetSuite sends the document and receives the signed result.'],
    ['How would you architect ETA integration in NetSuite?',
     'Invoice afterSubmit writes a queue record; a Map/Reduce or middleware builds the JSON, calls the signing service, submits, polls with backoff, stores UUID/status/errors on the invoice, and routes repeated failures to a dead letter queue with a dashboard. In practice a certified connector usually does the heavy lifting.'],
    ['What master data must be right before ETA go-live?',
     'Customer tax registration numbers and addresses, registered item codes (EGS or GS1) and units on items, correct tax codes, and Arabic names where required.'],
    ['How does NetSuite support Saudi ZATCA?',
     'Through Oracle\'s Saudi Arabia E-Invoicing SuiteApp on the Electronic Invoicing SuiteApp: generate a CSR and key, get a compliance CSID, pass the checks, then obtain the production CSID.'],
    ['How do you print invoices in Arabic?',
     'Advanced PDF templates with dir="rtl" sections, a font with Arabic glyphs, and bilingual custom fields for names and addresses; test mixed Arabic/English and numbers carefully.'],
  ]);
};


PAGES.wbs = () => hero('Chapter 20d · Delivery', 'WBS & Project Management', 'Work Breakdown Structure for implementations, plus NetSuite project tasks, dependencies, and earned value', ['WBS','Project Management','Gantt','Earned Value']) + `
${sh2('🧩','What a WBS Is')}
<p>A <strong>Work Breakdown Structure</strong> is the hierarchical decomposition of total project scope into deliverable-oriented work packages. Each level breaks the parent into smaller, manageable, estimable, and assignable pieces. The rule: <strong>100% of scope</strong> must be captured, with no overlap between branches.</p>
${kv([
['Decomposition rule','Each parent = the sum of its children. Nothing in scope is missing; nothing is double-counted.'],
['Work package','The lowest WBS level — small enough to estimate hours, assign an owner, and track to done.'],
['8/80 rule','A work package should be no less than 8 hours and no more than 80 hours of effort.'],
['Deliverable-oriented','WBS describes outcomes (nouns/deliverables), not activities. Activities live in the schedule.'],
['WBS code','Hierarchical numbering: 1, 1.1, 1.1.1 — gives every element a unique, sortable identifier.'],
])}

${sh2('🗂️','Sample WBS for a NetSuite Implementation')}
${codeBlock('WBS Outline', `1.0  NetSuite Implementation
  1.1  Project Management
       1.1.1  Project Charter & SOW
       1.1.2  Project Plan & Schedule
       1.1.3  Status Reporting & Governance
       1.1.4  Risk & Issue Management (RAID)
  1.2  Discovery & Requirements
       1.2.1  Stakeholder Workshops
       1.2.2  As-Is Process Mapping
       1.2.3  Gap Analysis
       1.2.4  Business Requirements Doc (BRD)
  1.3  Solution Design
       1.3.1  Solution Design Document (SDD)
       1.3.2  Data Model & Custom Objects
       1.3.3  Integration Architecture
       1.3.4  Chart of Accounts Design
  1.4  Configuration
       1.4.1  Company & Subsidiary Setup
       1.4.2  Financial Configuration (COA, periods, tax)
       1.4.3  Item & Inventory Setup
       1.4.4  Customer/Vendor Master
       1.4.5  Forms, Roles & Permissions
  1.5  Development
       1.5.1  SuiteScript Customizations
       1.5.2  SuiteFlow Workflows
       1.5.3  Integrations (REST/SOAP)
       1.5.4  Custom Reports & Searches
  1.6  Data Migration
       1.6.1  Mapping & Cleansing
       1.6.2  Test Migration 1 & 2
       1.6.3  Reconciliation
  1.7  Testing
       1.7.1  System / Integration Testing
       1.7.2  User Acceptance Testing
       1.7.3  Regression & Performance
  1.8  Training & Change Management
       1.8.1  Training Materials
       1.8.2  Role-Based Sessions
  1.9  Deployment
       1.9.1  Cutover Plan
       1.9.2  Go-Live Execution
       1.9.3  Hypercare Support`, 'Deliverable-oriented WBS with hierarchical coding')}

${sh2('📊','WBS Dictionary')}
<p>Each work package gets a <strong>WBS dictionary</strong> entry — the contract for that piece of work:</p>
${tw(['Field','Example'],[
['WBS Code','1.6.2'],
['Work Package','Test Migration 1 & 2'],
['Description','Load all master and open-transaction data into Sandbox; validate counts and balances'],
['Deliverable','Validated migration with >99% pass rate and reconciliation report'],
['Owner','Data Migration Lead'],
['Effort Estimate','60 hours'],
['Dependencies','1.6.1 Mapping & Cleansing complete'],
['Acceptance Criteria','Trial balance matches legacy to the penny; sign-off obtained'],
])}

${sh2('📅','From WBS to Schedule')}
<p>The WBS defines <em>what</em>; the schedule defines <em>when</em> and <em>in what order</em>. Decompose each work package into scheduled activities with durations and dependencies:</p>
${tw(['Dependency Type','Meaning','Example'],[
['Finish-to-Start (FS)','B cannot start until A finishes','Config must finish before UAT starts'],
['Start-to-Start (SS)','B cannot start until A starts','Training prep starts when config starts'],
['Finish-to-Finish (FF)','B cannot finish until A finishes','Testing finishes when development finishes'],
['Start-to-Finish (SF)','B cannot finish until A starts','Rare — legacy support ends when new system starts'],
])}
${kv([
['Critical Path','The longest chain of dependent activities. It determines the minimum project duration. Slips here slip the whole project.'],
['Float / Slack','How long an activity can slip without delaying the project. Critical-path activities have zero float.'],
['Milestone','A zero-duration checkpoint marking a key event (Design Sign-Off, Go-Live).'],
['Baseline','The approved snapshot of scope/schedule/cost. Track actuals against it to measure variance.'],
])}

${sh2('💰','Earned Value Management (EVM)')}
<p>EVM objectively measures project health by comparing planned vs earned vs actual:</p>
${tw(['Metric','Formula','Tells You'],[
['Planned Value (PV)','Budgeted cost of work scheduled','What you planned to have done by now'],
['Earned Value (EV)','% complete × total budget','What you actually accomplished, in $'],
['Actual Cost (AC)','Real cost incurred','What it actually cost'],
['Schedule Variance (SV)','EV − PV','Negative = behind schedule'],
['Cost Variance (CV)','EV − AC','Negative = over budget'],
['Schedule Performance Index (SPI)','EV ÷ PV','< 1.0 = behind schedule'],
['Cost Performance Index (CPI)','EV ÷ AC','< 1.0 = over budget'],
['Estimate at Completion (EAC)','Budget ÷ CPI','Forecast final cost at current efficiency'],
])}
${codeBlock('EVM Worked Example', `Project budget: $200,000 over 10 weeks
At end of week 5:
  Planned Value (PV)  = 50% planned   = $100,000
  Earned Value  (EV)  = 40% complete  = $ 80,000
  Actual Cost   (AC)  = spent so far   = $ 90,000

Schedule Variance = EV - PV = 80,000 - 100,000 = -$20,000  (behind schedule)
Cost Variance     = EV - AC = 80,000 -  90,000 = -$10,000  (over budget)
SPI = EV/PV = 80,000/100,000 = 0.80  (getting 80c of work per planned $)
CPI = EV/AC = 80,000/ 90,000 = 0.89  (getting 89c of value per $ spent)
EAC = Budget/CPI = 200,000/0.89 = $224,720  (forecast overrun ~$25k)

Verdict: behind schedule AND over budget. Re-plan or rescope now.`, 'EVM reveals trouble early — before it shows up in the final invoice')}

${sh2('🛠️','NetSuite Project / PSA WBS Features')}
<p>NetSuite\'s project module supports a native WBS through <strong>Project Tasks</strong> with parent-child nesting and dependencies:</p>
${tw(['NetSuite Element','Role in WBS'],[
['Project (Job)','The top-level WBS node (level 1). Holds budget, dates, and the project P&L.'],
['Project Task','A WBS element. Tasks nest under tasks to form the hierarchy.'],
['Predecessor','Defines task dependencies (FS, SS, FF, SF) — drives the Gantt and critical path.'],
['Milestone Task','A zero-duration task marking a checkpoint.'],
['Resource Allocation','Assigns employees to tasks with planned hours — the resourcing layer of the WBS.'],
['Gantt Chart','Visual timeline of tasks, dependencies, and critical path inside NetSuite.'],
['% Complete','Per-task progress, rolling up to project level — feeds project status and EVM.'],
])}
${kv([
['Task hierarchy','Indent/outdent tasks to build parent-child WBS levels directly in the project record.'],
['Baseline & actuals','Set a baseline schedule; NetSuite tracks actual start/finish and hours vs plan.'],
['Charge-based billing','Tasks generate billable charges from logged time, linking the WBS to revenue.'],
['Project budgeting','Budget by task or category; compare planned vs actual cost for variance analysis.'],
])}

${sh2('🔄','Linking WBS to Delivery Methodology')}
${flow(
  ['1','Define WBS','Decompose scope to work packages (8/80 rule)','100% scope captured, coded, owned'],
  ['2','Build Schedule','Sequence activities with dependencies','Critical path and milestones identified'],
  ['3','Baseline','Approve scope, schedule, and cost','Measurement reference locked'],
  ['4','Execute & Track','Log progress and actuals per work package','% complete rolls up'],
  ['5','Measure (EVM)','Compute SV, CV, SPI, CPI weekly','Objective health signal'],
  ['6','Control','Re-plan, rescope, or escalate on variance','Corrective action before overrun']
)}
${note('s','✅','The Consultant\'s Edge','A WBS is your contract with reality. It prevents scope creep (every new ask must map to a work package or trigger a change request), makes estimates defensible, and turns "are we on track?" from opinion into math via EVM. Pair the delivery WBS with NetSuite project tasks when the client also wants to run the post-go-live project work in-system.')}
${note('w','💡','WBS vs Schedule vs Gantt','Keep them distinct: the WBS is the <em>scope hierarchy</em> (deliverables), the schedule adds <em>time and sequence</em> (activities + dependencies), and the Gantt is the <em>visualization</em>. Many projects fail because they jump straight to a Gantt without a disciplined WBS — and then discover missing scope mid-build.')}`;

PAGES.accounting = () => hero('Chapter 11e · Finance', 'Accounting & Debit/Credit Deep Dive', 'The complete double-entry mechanics for every transaction and how each ripples through the system', ['Double-Entry','GL','Sub-Ledgers','System Impact']) + `
${sh2('⚖️','The Foundation — Normal Balances')}
<p>Every posting obeys one rule: <strong>total debits = total credits</strong>. Whether an account increases on the debit or credit side depends on its type. Memorize this table — every transaction below derives from it.</p>
${tw(['Account Type','Increases On','Decreases On','Normal Balance','Statement'],[
['Asset','Debit','Credit','Debit','Balance Sheet'],
['Contra-Asset (e.g. Accum. Depr.)','Credit','Debit','Credit','Balance Sheet'],
['Liability','Credit','Debit','Credit','Balance Sheet'],
['Equity','Credit','Debit','Credit','Balance Sheet'],
['Revenue / Income','Credit','Debit','Credit','Income Statement'],
['Contra-Revenue (e.g. Sales Returns)','Debit','Credit','Debit','Income Statement'],
['COGS','Debit','Credit','Debit','Income Statement'],
['Expense','Debit','Credit','Debit','Income Statement'],
])}
${note('i','🧠','Memory Aid — DEAD CLIC','<strong>DEAD</strong>: Debits increase Expenses, Assets, Dividends/Draws. <strong>CLIC</strong>: Credits increase Liabilities, Income, Capital/Equity. If a transaction increases an asset, you debit it; to increase a liability or revenue, you credit it.')}

${sh2('💰','How a Transaction Flows Through the System')}
<p>A single NetSuite transaction touches more than the GL. Understanding the full ripple is what separates a functional consultant from a bookkeeper:</p>
${flow(
  ['1','Transaction Posts','User saves an invoice, bill, fulfillment, etc.','Generates the GL debit/credit pair(s)'],
  ['2','GL Impact','Account balances update in the General Ledger','Trial balance, P&L, Balance Sheet reflect it'],
  ['3','Sub-Ledger','A/R, A/P, or Inventory sub-ledger updates','Aging reports, vendor balances, stock value'],
  ['4','Dimensions','Department, Class, Location, Subsidiary tag the lines','Segment reporting becomes possible'],
  ['5','Period','Posting date determines the accounting period','Affects which month/quarter it lands in'],
  ['6','Downstream','Status changes, linked records, workflows fire','SO → Fulfillment → Invoice chain advances']
)}

${sh2('🛒','Order-to-Cash — Full Cycle with System Impact')}
${sh3('1. Sales Order (no GL impact)')}
<p>The SO is a commitment, not a financial event. <strong>No debit or credit posts.</strong> System impact: inventory may be <em>committed</em> (soft-reserved, reducing Available but not On-Hand), and the SO enters the fulfillment/billing pipeline.</p>

${sh3('2. Item Fulfillment — goods leave the building')}
${glGrid([['Item Fulfillment', [['Cost of Goods Sold','Inventory Asset']]]])}
${kv([
['Why this posting','You no longer own the goods, so the asset (Inventory) decreases — credit. The cost of those goods becomes an expense (COGS) — debit.'],
['Amount basis','Item cost per the costing method (FIFO/Average/Standard) — NOT the sales price.'],
['Sub-ledger impact','Inventory sub-ledger: On-Hand quantity decreases. Inventory valuation drops by the item cost.'],
['Reporting impact','COGS hits the P&L. Gross margin is not yet complete until the invoice posts revenue.'],
])}

${sh3('3. Invoice — bill the customer')}
${glGrid([['Invoice', [['Accounts Receivable','Revenue Account(s)']]]])}
${kv([
['Why this posting','Customer now owes you, so A/R (asset) increases — debit. You earned revenue — credit.'],
['Amount basis','Sales price (quantity × rate), plus tax to a tax liability account.'],
['Sub-ledger impact','A/R sub-ledger: customer balance increases. Appears on A/R Aging at current bucket.'],
['Reporting impact','Revenue hits the P&L. Now gross margin = Revenue − COGS is complete for this sale.'],
['Tax line','If taxable: DR A/R (gross) | CR Revenue (net) + CR Sales Tax Payable (liability).'],
])}

${sh3('4. Customer Payment — money received')}
${glGrid([['Customer Payment', [['Undeposited Funds','Accounts Receivable']]]])}
${kv([
['Why this posting','Cash-equivalent (Undeposited Funds asset) increases — debit. Customer owes less, so A/R decreases — credit.'],
['Why Undeposited Funds','It is a holding/clearing account between receiving payment and depositing at the bank. Bridges timing.'],
['Sub-ledger impact','A/R sub-ledger: invoice marked paid (or partially paid) via the apply sublist. Aging clears.'],
])}

${sh3('5. Bank Deposit — money hits the bank')}
${glGrid([['Bank Deposit', [['Bank Account','Undeposited Funds']]]])}
${kv([
['Why this posting','Cash in the bank (asset) increases — debit. Undeposited Funds holding account clears — credit.'],
['System impact','Bank account balance now matches what will appear on the bank statement, enabling reconciliation.'],
])}
${note('s','✅','Full OTC Balance Check','Across the cycle: Inventory ↓ (credit) → COGS ↑ (debit) → A/R ↑ then ↓ → Revenue ↑ (credit) → Undeposited Funds ↑ then ↓ → Bank ↑ (debit). Net economic result: Bank up by sales price, Inventory down by cost, profit = the difference flows to retained earnings at close.')}

${sh2('📦','Procure-to-Pay — Full Cycle with System Impact')}
${sh3('1. Purchase Order (no GL impact)')}
<p>Like the SO, a PO is a commitment. <strong>No posting.</strong> System impact: quantity appears as <em>On Order</em>, feeding demand planning and reorder logic.</p>

${sh3('2. Item Receipt — goods arrive')}
${glGrid([['Item Receipt', [['Inventory Asset','Inventory Received Not Billed']]]])}
${kv([
['Why this posting','You now own the goods, so Inventory (asset) increases — debit. You owe the vendor but no bill yet, so a liability (Inventory Received Not Billed, IRNB) increases — credit.'],
['Why IRNB','The bill has not arrived. IRNB is the system accrued-liability account (named Accrued Purchases in some accounts) that NetSuite uses when Advanced Receiving is enabled. It bridges receipt and bill.'],
['Sub-ledger impact','Inventory sub-ledger: On-Hand quantity increases at the receipt cost.'],
])}

${sh3('3. Vendor Bill — the invoice arrives')}
${glGrid([
['Vendor Bill (inventory, already received)', [['Inventory Received Not Billed','Accounts Payable']]],
['Vendor Bill (expense)', [['Expense Account','Accounts Payable']]],
])}
${kv([
['Inventory bill logic','With Advanced Receiving the bill debits IRNB and credits A/P, so IRNB nets to zero when billed value equals received value. Price or quantity differences stay in IRNB until handled: correct the receipt or bill, or use Match Bill to Receipt and run Post Vendor Bill Variances. Without Advanced Receiving the bill itself receives the goods: DR Inventory / CR A/P in one step.'],
['Expense bill logic','For non-inventory (rent, services): the expense (debit) hits the P&L directly, A/P (credit) records the obligation.'],
['Sub-ledger impact','A/P sub-ledger: vendor balance increases. Appears on A/P Aging.'],
])}

${sh3('4. Bill Payment — pay the vendor')}
${glGrid([['Bill Payment', [['Accounts Payable','Bank Account']]]])}
${kv([
['Why this posting','You owe less, so A/P (liability) decreases — debit. Cash leaves, so Bank (asset) decreases — credit.'],
['Sub-ledger impact','A/P sub-ledger: bill marked paid via apply sublist. Aging clears.'],
['Early-pay discount','With 2/10 terms: DR A/P (full) | CR Bank (net) + CR Purchase Discount (income/contra-expense).'],
])}
${note('w','💡','Reconcile IRNB Every Close','IRNB should equal goods received but not yet billed, plus any unresolved bill variances. Drift usually means receipts and bills at different prices or quantities, or manual JEs to the account. Review it with a saved search on the IRNB special account type, grouped by source PO, before every close.')}

${sh2('🏭','Manufacturing — WIP Flow with System Impact')}
${tw(['Stage','Debit','Credit','System Impact'],[
['Components issued','Work In Progress','Inventory Asset (components)','Component On-Hand ↓; WIP balance ↑'],
['Labor applied','Work In Progress','Wages Payable / Labor Clearing','Labor cost accumulates in WIP'],
['Overhead applied','Work In Progress','Overhead Clearing','Allocated OH builds the product cost'],
['Build completed','Finished Goods Inventory','Work In Progress','Assembly On-Hand ↑; WIP clears to FG'],
['Variance (unfavorable)','Manufacturing Variance','Work In Progress','Actual > standard; variance to P&L'],
['Variance (favorable)','Work In Progress','Manufacturing Variance','Actual < standard; credit reduces cost'],
])}
${note('i','🧠','WIP Is a Temporary Asset','Work In Progress is a balance-sheet asset that should trend toward zero as builds complete. A growing WIP balance signals stuck or unclosed work orders — a common audit and close issue.')}

${sh2('📈','Revenue Recognition (ARM) — Deferred Flow')}
${glGrid([
['At Invoice (obligation not satisfied)', [['Accounts Receivable','Deferred Revenue (LIABILITY)']]],
['Each Recognition Period', [['Deferred Revenue','Revenue Account']]],
])}
${kv([
['Why deferred first','Cash/A/R is collectible now, but revenue is not yet earned. Deferred Revenue is a liability — you owe the customer future service.'],
['Recognition','As you deliver (ratably or by milestone), you reduce the liability (debit Deferred) and book Revenue (credit).'],
['System impact','Deferred Revenue balance is a key SaaS metric. Recognition schedule generated by the ARM Revenue Plan.'],
])}

${sh2('💱','Foreign Exchange — Realized vs Unrealized')}
${glGrid([
['Unrealized (period-end revaluation)', [['Unrealized FX Gain/Loss','A/R, A/P, or Bank (or reverse)']]],
['Realized Gain (on settlement)', [['Bank (at payment rate)','A/R (at invoice rate) + Realized FX Gain']]],
['Realized Loss (on settlement)', [['Bank + Realized FX Loss','A/R (at invoice rate)']]],

${kv([

PAGES.arm = () => hero('Chapter 13 · Finance', 'Revenue Recognition (ARM)', 'ASC 606 / IFRS 15 — 5-step model, SSP allocation, and recognition schedules', ['ARM','ASC 606','IFRS 15','SaaS']) + `
${sh2('📐','5-Step Model → NetSuite')}
${tw(['Step','ASC 606 Requirement','NetSuite Component'],[
['1','Identify the contract','Sales Order or Invoice. Defines the arrangement boundary.'],
['2','Identify performance obligations','Revenue Elements within an ARM Arrangement. One per distinct good/service.'],
['3','Determine transaction price','Total invoice/contract amount, net of variable consideration.'],
['4','Allocate price to obligations','SSP-based: Allocated = (Item SSP ÷ Sum of all SSPs) × Contract Price.'],
['5','Recognize revenue','ARM Recognition Plan — auto-generates DR Deferred Revenue | CR Revenue.'],
])}
${sh2('🧮','SSP Allocation — Worked Example')}
${codeBlock('Accounting Math', `Contract: License + Implementation + Annual Support
Contract Price: $10,000 (includes a customer discount)

Standalone Selling Prices (SSPs) — from pricing analysis:
  Software License:         $6,000
  Implementation Services:  $3,000
  Annual Support:           $1,500
  Total SSP:               $10,500

Allocation (SSP ratio × Contract Price):
  License:     (6000/10500) × 10000 = $5,714.29  → point-in-time (delivery)
  Services:    (3000/10500) × 10000 = $2,857.14  → over-time (as rendered)
  Support:     (1500/10500) × 10000 = $1,428.57  → ratable / 12 months

Monthly support JE ($1,428.57 ÷ 12 = $119.05/month):
  DR Deferred Revenue  $119.05
  CR Support Revenue   $119.05

KEY: Allocation is by SSP ratio — NOT by invoice line prices.
Even if you invoice $5k/$5k, recognition is $5,714/$2,857.`, 'SSP allocation determines recognition amounts — not invoice prices')}
${sh2('📋','ARM GL Entries')}
${glGrid([
['Initial Invoice (obligation not yet satisfied)', [['Accounts Receivable (full invoice)','Deferred Revenue (LIABILITY)']]],

])}

${kv([

['Over-Time — Milestone','Recognition triggered by specific deliverable events defined in the contract.'],

  '<strong>Use External IDs in all integrations for upsert</strong> — prevents duplicate records on re-run. This is idempotency.',
  '<strong>Exponential backoff for all API retries</strong> — wait = delay × 2^attempt. Max 5 retries then dead letter queue.',
  '<strong>Use Map/Reduce for bulk operations</strong> — no cap on the total run, small per-invocation limits, automatic yielding between jobs.',

  '<strong>Never commit credentials or tokens to Git</strong> — use GitHub Secrets or a secrets manager. Rotate after any exposure.',
  '<strong>Run at least two full test data migrations</strong> — data is always messier than the client says. Budget 3× your cleansing estimate.',
  '<strong>Use SuiteQL for complex API queries</strong> — flexible multi-table joins and explicit paging (runSuiteQLPaged in scripts, limit/offset over REST).',

)}

PAGES.nsai = () => hero('Chapter 8b · SuiteScript', 'AI in NetSuite & N/llm', 'Generative AI from SuiteScript: methods, RAG with documents, Prompt Studio, cost and the controls a senior consultant puts around it', ['N/llm','GenAI','Prompt Studio','RAG']) + `
${sh2('🧠','What N/llm Is')}
<p>N/llm is the SuiteScript 2.1 module that sends prompts to large language models hosted on Oracle Cloud Infrastructure (OCI) Generative AI and returns the response to your script. It runs server-side only, and it is available only in some NetSuite regions, so check availability before you design around it.</p>
${tw(['Method (alias)','Purpose'],[
['llm.generateText (llm.chat)','Send a prompt (plus optional preamble, chat history and documents) and get text back'],
['llm.generateTextStreamed (llm.chatStreamed)','Same, streamed as it is generated'],
['llm.evaluatePrompt (llm.executePrompt)','Run a prompt managed in Prompt Studio, passing variables at call time'],
['llm.embed','Turn text into vector embeddings, e.g. for semantic search or similarity matching'],
['llm.createDocument','Wrap your own data as a document the model must answer from (RAG); answers can carry citations'],
['llm.getRemainingFreeUsage / getRemainingFreeEmbedUsage','Check the remaining monthly free quota for text generation / embeddings'],
])}
${sh2('💻','Example — Summarize a Customer for a Collector')}
${codeBlock('JavaScript — SuiteScript 2.1', `/**
 * @NApiVersion 2.1
 * @NScriptType Suitelet
 */
define(['N/llm','N/query','N/log'], (llm, query, log) => {
  const onRequest = (ctx) => {
    const id = ctx.request.parameters.custid;
    // 1. Pull facts with SuiteQL — the model must answer from THESE, not invent
    const rows = query.runSuiteQL({ query: \`
      SELECT t.tranid, t.trandate, t.duedate, tal.amountunpaid
      FROM transaction t JOIN transactionaccountingline tal ON tal.transaction = t.id
      WHERE t.entity = ? AND t.type = 'CustInvc' AND tal.amountunpaid <> 0\`, params: [id] }).asMappedResults();

    const facts = llm.createDocument({ id: 'open_invoices', data: JSON.stringify(rows) });

    const res = llm.generateText({
      preamble: 'You are an accounts receivable assistant. Use only the documents provided. If data is missing, say so.',
      prompt: 'Summarize this customer\\'s open balance and the oldest overdue invoice in 3 bullet points.',
      documents: [facts],
      modelParameters: { maxTokens: 300, temperature: 0.2 }
    });
    log.audit('Free usage left', llm.getRemainingFreeUsage());
    ctx.response.write(res.text);          // show to a person — never post it automatically
  };
  return { onRequest };
});`, 'Facts from SuiteQL → documents → low temperature → a human reads the result')}
${sh2('🎯','Good Use Cases')}
${kv([
['Summaries','Customer, vendor or case history condensed for a collector, buyer or support agent.'],
['Drafting','First drafts of collection emails, item descriptions or replies — always reviewed before sending.'],

${kv([

['Grounding','Feed facts through documents and tell the model to answer only from them. Low temperature for business text.'],
['Governance & cost','AI calls are expensive in governance (around 100 units for a generation call) and consume AI usage. Check the free quota, cache results, and never call per record in a large loop — batch or summarize.'],
['Determinism','The same prompt can return different text. Do not use AI where an exact, repeatable answer is required (tax, amounts, GL postings).'],

const exFmt = (v) => v ? Number(v).toLocaleString('en-US') : '';
// rows: [account, debit, credit, memo?]
function je(rows, caption){
  let dr = 0, cr = 0;
  const body = rows.map(r => {
    dr += r[1] || 0; cr += r[2] || 0;
    const acctCls = r[2] && !r[1] ? ' class="je-cr-acct"' : '';
    return '<tr><td' + acctCls + '>' + r[0] + '</td><td class="je-amt">' + exFmt(r[1]) + '</td><td class="je-amt">' + exFmt(r[2]) + '</td><td>' + (r[3] || '') + '</td></tr>';
  }).join('');
  const ok = Math.round(dr * 100) === Math.round(cr * 100);
  return '<table class="je"><thead><tr><th>Account</th><th class="je-amt">Debit</th><th class="je-amt">Credit</th><th>Why</th></tr></thead><tbody>' + body +
    '<tr class="je-total"><td>Total' + (ok ? '' : ' <span class="je-bad">UNBALANCED</span>') + '</td><td class="je-amt">' + exFmt(dr) + '</td><td class="je-amt">' + exFmt(cr) + '</td><td></td></tr></tbody></table>' +
    (caption ? '<div class="je-cap">' + caption + '</div>' : '');
}
let _exN = 0;
function ex(title, story, parts, result){

}

  ex('Delivery van — Depreciation & Disposal', 'NOS buys a van for <strong>240,000 EGP</strong>, life 5 years, no salvage → 240,000 ÷ 60 months = <strong>4,000 per month</strong>. After 2 years it is sold for 160,000.', [

PAGES.delexamples = function(){

  sh2('🔍','Discovery & Design') +

    tw(['#','Requirement','Fit / Gap','Solution','Effort'],[
      ['R1','Invoices must include 14% VAT','Fit','Tax codes & nexus (configuration)','Low'],
      ['R2','POs over 50,000 EGP need manager approval','Fit','Approval Routing / SuiteApprovals','Low'],
      ['R3','Invoices must be sent to the Egyptian Tax Authority (ETA)','Gap','Certified ETA connector + data setup','High'],
      ['R4','Invoice PDF in Arabic and English','Gap (small)','Advanced PDF template','Medium'],
      ['R5','Sales commission at 3% of collected cash','Gap','Saved search + script, or Incentive Compensation','Medium'],
    ])
  ], 'Two fits, three gaps. The gaps drive cost and risk, so they get detailed design and their own estimates.') +
  ex('Write one line of the BRD and the SDD', 'For R2 (PO approval):', [

    exLbl('SDD (how NetSuite will do it)'), '<div class="ex-story">"Enable Purchase Order approval routing. Rule: total &gt; 50,000 → approver = Operations Manager. Approved POs lock; rejected POs return to the buyer with a reason. Email on submit and on decision."</div>',
    exLbl('UAT test it maps to'), '<div class="ex-story">TC-PTP-04: PO for 60,000 goes to the manager; PO for 40,000 does not.</div>'

  sh2('📋','Planning & Estimation') +
  ex('A small WBS with hours', 'Break "Data Migration" into work packages (each 8–80 hours):', [
    tw(['WBS','Work package','Hours'],[
      ['4.1','Map legacy fields to NetSuite','24'],
      ['4.2','Cleanse customers and vendors (duplicates, tax IDs)','40'],
      ['4.3','Build CSV import templates','16'],

      ['4.5','Test migration 2 + reconciliation','24'],
      ['4.6','Cutover load + sign-off','16'],

  ex('Track progress with Earned Value', 'Week 8 of 16. Budget (BAC) 100,000. Planned work so far 50,000. Work actually done is worth 40,000. Money spent 50,000.', [
    tw(['Measure','Formula','Value','Meaning'],[

  ex('Manage a change request', 'In week 6 the client asks for a customer portal that was not in the SOW.', [
    exSteps(['Log CR-03 in the change log.', 'Estimate: 40 hours, +1 week, 4,000 USD.', 'Show impact: go-live moves 1 → 8 July, or the portal moves to phase 2.', 'Sponsor decides in the steering meeting; record the decision.', 'Update the baseline (scope, schedule, budget) only after approval.'])

  ex('RAID log entries', 'Keep risks, assumptions, issues and dependencies visible every week:', [

PAGES.webhooks = () => hero('Chapter 9d · APIs', 'Webhooks & Events', 'Receiving external events via RESTlet, the 5-second rule, and async processing', ['Webhooks','Events','Async','RESTlet']) + `
${sh2('📥','NetSuite Has No Native Outbound Webhooks')}
<p>NetSuite does not push events out of the box. You build the pattern: a <strong>RESTlet receives inbound webhooks</strong>, and for outbound, a <strong>User Event or Scheduled script calls external endpoints</strong>. The key discipline is acknowledging fast and processing slow.</p>
${sh2('⚡','The 5-Second Rule')}
${note('d','⚠️','Acknowledge Within 5 Seconds','Most webhook senders (Stripe, Shopify, etc.) retry if you do not return HTTP 200 within ~5 seconds. Never process inline. Return 200 immediately, write the payload to a queue Custom Record, then process asynchronously via N/task → Map/Reduce.')}
${sh2('🔄','Inbound Webhook Pattern')}
${flow(
  ['1','RESTlet receives POST','External system sends event payload','Validate signature/secret immediately'],
  ['2','Write to queue record','Save raw payload to customrecord_webhook_queue','Status = Pending, timestamp now'],
  ['3','Return HTTP 200','Respond before processing','Sender marks delivery successful'],
  ['4','Async process','Scheduled Map/Reduce drains the queue','Idempotent — check if already processed'],
  ['5','Mark complete / DLQ','Update status = Done, or move to Dead Letter Queue on failure','No silent data loss']
)}
${sh2('🔐','Securing Inbound Webhooks')}
${tw(['Method','How','Notes'],[
['Shared Secret','Sender includes a secret header; RESTlet validates it','Simple. Rotate periodically.'],
['HMAC Signature','Sender signs body with shared key; verify HMAC','Stripe/Shopify standard. Most secure.'],
['IP Allowlist','Only accept from known sender IPs','Defense in depth. IPs can change.'],
['Idempotency Key','Store sender\'s event ID; skip duplicates','Essential — webhooks are delivered at-least-once.'],
])}
${sh2('📤','Outbound Event Pattern')}
${kv([
['Trigger','User Event afterSubmit detects the change (e.g., SO status → Fulfilled).'],
['Queue','Write to an outbound queue record rather than calling the API inline (afterSubmit must stay fast).'],
['Deliver','Scheduled/Map-Reduce script reads the queue, calls the external endpoint via N/https.'],
['Retry','On failure: exponential backoff, increment attempt count, move to DLQ after max retries.'],
])}`;

PAGES.close = () => hero('Chapter 12 · Finance', 'Period Close Process', 'The 18-step month-end close, period statuses, and locking sequence', ['Period Close','Controls','Reporting']) + `
${sh2('📅','Month-End Close Checklist')}
${tw(['#','Owner','Area','Action'],[
['1','AR','Revenue','Post all SO → Fulfillment → Invoice. No open SOs past cutoff.'],
['2','AR','Cash','Apply all customer payments, create deposits, balance Undeposited Funds.'],
['3','AR','Review','Run A/R Aging. Review 60+ days. Record bad debt allowance.'],
['4','AP','Bills','Enter all vendor invoices. Accrue received-not-billed.'],
['5','AP','Payments','Run payment batch. Confirm cleared payments.'],
['6','AP','Expenses','Approve and post all employee expense reports.'],
['7','Inv','Receipts','Post all item receipts for the period.'],
['8','Inv','Counts','Post cycle counts. Approve inventory adjustments.'],
['9','Acctg','Prepaids','Amortize prepaid expenses per schedule.'],
['10','Acctg','Fixed Assets','Run FAM depreciation batch. Review disposals.'],
['11','Acctg','Accruals','Post accruals with reversing dates set.'],
['12','Acctg','ARM','Run revenue recognition JE batch.'],
['13','Treasury','Bank Recon','Reconcile every bank/CC account to exactly $0.00.'],
['14','Acctg','FX','Run currency revaluation for foreign balances.'],
['15','Acctg','IC','Post IC entries, reconcile IC A/R vs A/P per pair, run Eliminate Intercompany Transactions.'],
['16','Controller','Review','Trial balance review. Investigate variances.'],
['17','Controller','Statements','Generate P&L, Balance Sheet, Cash Flow.'],
['18','Controller','Lock & Close','Lock A/R → Lock A/P → Lock All → Close the period.'],
])}
${sh2('🔒','Period Status Reference')}
${tw(['Status','Allows'],[
['Open','All transactions can post.'],
['A/R Locked','No new or changed A/R transactions (invoices, payments, credits). Other areas still post.'],
['A/P Locked','No new or changed A/P transactions. Other areas still post.'],
['All Locked','Only users with the Override Period Restrictions permission can post or change GL-impacting transactions.'],
['Closed','No GL-impacting changes by anyone, administrators included. All prior periods must be closed first. Can be reopened with a recorded justification, which also reopens every later closed period.'],
])}
${note('d','⚠️','Close Sequence & Year End','Work the Period Close Checklist in order: Lock A/R → Lock A/P → Lock All → close tasks (revaluation, eliminations) → Close. There is no separate year-close step and no closing journal by default: once every period in the fiscal year is closed, NetSuite treats the year as closed and the balance sheet reports prior-year net income in Retained Earnings automatically, so income statement history stays viewable. Where local rules require real closing journals, the Period End Journal Entries feature can generate them. Reopening a closed period is possible but should be a controlled, audited exception.')}`;

${tw(['Method','Formula','Best For'],[
['Straight-Line','(Cost − Salvage) ÷ Useful Life','Most assets; even expense per period'],

  CR Fixed Asset (cost)         $50,000

 * @NApiVersion 2.x
 * @NModuleScope SameAccount
 * File: /SuiteScripts/lib/ns_utils.js
 */
define(['N/search','N/cache'], function(search, cache){

  function findByExternalId(type, extId){
    var r = search.create({
      type: type,
      filters: [['externalid','is', extId]],
      columns: ['internalid']
    }).run().getRange({start:0, end:1});
    return r.length ? r[0].getValue('internalid') : null;
  }

  function getConfig(key){
    var c = cache.getCache({name:'appConfig', scope: cache.Scope.PUBLIC});
    return c.get({
      key: key,
      loader: function(){
        var r = search.create({
          type:'customrecord_config',
          filters:[['custrecord_cfg_key','is', key]],
          columns:['custrecord_cfg_value']
        }).run().getRange({start:0,end:1});
        return r.length ? r[0].getValue('custrecord_cfg_value') : '';
      },
      ttl: 3600
    });
  }

  return { findByExternalId, getConfig };
});

${codeBlock('JavaScript — async task launch', `define(['N/record','N/task','N/log'], function(record, task, log){
  function afterSubmit(context){
    if(context.type !== context.UserEventType.CREATE) return;

      // 1. Queue the work (fast)

${codeBlock('JavaScript — classify & route errors', `define(['N/record','N/log','N/email'], function(record, log, email){

  function process(id){
    try {
      doRiskyOperation(id);
    } catch(e){
      if(e.name === 'SSS_USAGE_LIMIT_EXCEEDED'){
        throw e;                          // Not recoverable here: fails this key, reported in summarize

      } else if(e.name === 'INVALID_KEY_OR_REF' ||
                e.name === 'RCRD_DSNT_EXIST'){
        log.error('Data Error '+id, e.message);
        deadLetter(id, e.message, 'DATA');  // Skip, continue batch

        log.error('Permission '+id, e.message);
        alertAdmin('Permission failure on '+id, e);
        return {skipped:true};

      } else {
        log.error('Unknown '+id, e.name+': '+e.message+'\\n'+(e.stack||''));

// ─── SPA engine ─────────────────────────────────────────────────
let currentPage = null;

function buildNav(){
  const container = document.getElementById('nav-container');
  NAV.forEach(group => {
    const sec = document.createElement('div');
    sec.className = 'sb-section';
    sec.innerHTML = `<div class="sb-section-label">${group.g}</div>`;
    group.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'sb-item';
      el.dataset.page = item.id;
      const badge = item.tag === 'new'
        ? '<span class="sb-badge badge-new">NEW</span>'
        : item.tag === 'hot'
        ? '<span class="sb-badge badge-hot">HOT</span>'
        : '';
      el.innerHTML = `<div class="sb-item-dot"></div>${item.l}${badge}`;
      el.setAttribute('role','link');
      el.setAttribute('tabindex','0');
      el.onclick = () => goTo(item.id);
      el.onkeydown = (e) => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goTo(item.id); } };
      sec.appendChild(el);
    });
    container.appendChild(sec);
  });
}

function goTo(id, push=true){
  const fn = PAGES[id];
  if(!fn) return;
  currentPage = id;

  // Render
  const el = document.getElementById('page-content');
  el.innerHTML = fn();

  // Update nav
  document.querySelectorAll('.sb-item').forEach(e => {
    e.classList.toggle('active', e.dataset.page === id);
  });

  // Breadcrumb
  const label = NAV.flatMap(g=>g.items).find(i=>i.id===id)?.l || id;
  document.getElementById('page-title').textContent = label;

  // Scroll to top
  document.getElementById('page-wrap').scrollTop = 0;

  // History
  if(push){ try { history.pushState({id}, '', `#${id}`); } catch(e){ /* sandboxed iframe: ignore */ } }

  // Scroll active nav item into view
  const active = document.querySelector('.sb-item.active');
  if(active) active.scrollIntoView({block:'nearest',behavior:'smooth'});

  // Close the mobile sidebar after navigating
  closeSidebar();

  // Build the in-page section jump for long pages
  buildSectionJump();

  // Reset the back-to-top button
  updateToTop(0);
}

// ── Sidebar (mobile) ──
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const open = sb.classList.toggle('open');
  document.getElementById('sb-backdrop').classList.toggle('show', open);
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  const b = document.getElementById('sb-backdrop');
  if(b) b.classList.remove('show');
}

// ── In-page section jump (pages with many sections) ──
function buildSectionJump(){
  const bar = document.getElementById('section-jump');
  if(!bar) return;
  const secs = [...document.querySelectorAll('#page-content .sh2')];
  if(secs.length < 5){ bar.style.display = 'none'; bar.innerHTML = ''; return; }
  secs.forEach((s, i) => { if(!s.id) s.id = 'sec-' + i; });
  bar.style.display = 'flex';
  bar.innerHTML = '<span class="sj-label">Jump to</span>' +
    '<select class="sj-select" onchange="jumpToSection(this.value)">' +
      '<option value="">' + secs.length + ' sections…</option>' +
      secs.map(s => '<option value="' + s.id + '">' + s.textContent.trim().replace(/^[^A-Za-z0-9]+/, '') + '</option>').join('') +
    '</select>';
}
function jumpToSection(id){
  if(!id) return;
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function updateToTop(scrollTop){
  const b = document.getElementById('to-top');
  if(b) b.classList.toggle('show', scrollTop > 600);
}
function scrollTop(){
  document.getElementById('page-wrap').scrollTo({top:0, behavior:'smooth'});
}

// Search
function initSearch(){
  const input = document.getElementById('search-input');
  let timer;
  input.addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => runSearch(e.target.value.trim()), 180);
  });
  input.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ input.value = ''; if(currentPage) goTo(currentPage, false); }
  });
}

// Cached plain-text index (pages are static, so build once).
// Interactive pages are skipped: rendering them has side effects and matching them is not useful.
const SEARCH_SKIP = ['quiz','mock','studyplan'];
window._searchText = {};
function getSearchText(id){
  if(SEARCH_SKIP.indexOf(id) >= 0) return null;
  if(window._searchText[id] !== undefined) return window._searchText[id];
  const fn = PAGES[id];
  if(!fn){ window._searchText[id] = null; return null; }
  let t = null;
  try { t = fn().replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' '); } catch(e){ t = null; }
  window._searchText[id] = t;
  return t;
}

function runSearch(q){
  if(!q){ if(currentPage) goTo(currentPage, false); return; }
  const lq = q.toLowerCase();
  window._lastQuery = q;
  const allItems = NAV.flatMap(g => g.items.map(i => ({...i, group: g.g})));
  const results = [];
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  allItems.forEach(item => {
    const text = getSearchText(item.id);
    if(text === null) return;
    const ltext = text.toLowerCase();
    let idx = ltext.indexOf(lq);
    if(idx < 0) return;
    const snips = [];
    let count = 0;
    while(idx >= 0){
      count++;
      if(snips.length < 3){
        const s = Math.max(0, idx - 70);
        snips.push(text.slice(s, idx + 110).replace(re, m => '<mark>' + m + '</mark>'));
      }
      idx = ltext.indexOf(lq, idx + lq.length);
    }
    const titleHit = item.l.toLowerCase().indexOf(lq) >= 0;
    results.push({ ...item, snips, count, titleHit });
  });
  results.sort((a,b) => (b.titleHit - a.titleHit) || (b.count - a.count));
  const total = results.reduce((n,r) => n + r.count, 0);

  const el = document.getElementById('page-content');
  if(!results.length){
    el.innerHTML = hero('Search', `No results for <em>"${q}"</em>`, 'Try a different keyword or browse the sidebar');
    return;
  }
  el.innerHTML = hero('Search', `${total} match${total!==1?'es':''} across ${results.length} page${results.length!==1?'s':''} for <em>"${q}"</em>`, 'Click a result — the page opens with the first match highlighted, and any collapsed Q&A containing it expanded') +
    results.map(r => `<div class="search-result" onclick="goToMatch('${r.id}')">
      <div class="sr-group">${r.group} · ${r.count} match${r.count!==1?'es':''}${r.titleHit?' · title match':''}</div>
      <div class="sr-title">${r.l}</div>
      ${r.snips.map(s => `<div class="sr-snip">…${s}…</div>`).join('')}
    </div>`).join('');
}

function goToMatch(id){
  const q = window._lastQuery || '';
  goTo(id);
  if(!q) return;
  setTimeout(function(){
    const root = document.getElementById('page-content');
    if(!root) return;
    const lq = q.toLowerCase();
    // expand any collapsed Q&A / details containing the term
    root.querySelectorAll('details').forEach(function(d){
      if(d.textContent.toLowerCase().indexOf(lq) >= 0) d.open = true;
    });
    // highlight and scroll to the first occurrence
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while((node = walker.nextNode())){
      const i = node.textContent.toLowerCase().indexOf(lq);
      if(i >= 0){
        try {
          const range = document.createRange();
          range.setStart(node, i);
          range.setEnd(node, i + q.length);
          const mark = document.createElement('mark');
          mark.className = 'search-jump';
          range.surroundContents(mark);
          mark.scrollIntoView({block:'center'});
        } catch(e){}
        break;
      }
    }
  }, 80);
}

// Print support: expand all collapsibles before printing, restore after
let _printClosed = null;
window.addEventListener('beforeprint', function(){
  _printClosed = [];
  document.querySelectorAll('#page-content details:not([open])').forEach(function(d){
    _printClosed.push(d); d.open = true;
  });
});
window.addEventListener('afterprint', function(){
  if(_printClosed){ _printClosed.forEach(function(d){ d.open = false; }); _printClosed = null; }
});

// Copy code
function doCopy(btn){
  const pre = btn.closest('.code-wrap').querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
  });
}
function copyAllCode(btn){
  const blocks = [...document.querySelectorAll('#page-content pre')];
  if(!blocks.length){
    if(btn){ const o = btn.textContent; btn.textContent = 'No code on this page'; setTimeout(()=>btn.textContent=o, 1600); }
    return;
  }
  const all = blocks.map(p=>p.textContent).join('\n\n// ─────────\n\n');
  navigator.clipboard.writeText(all).then(function(){
    if(btn){ const o = btn.textContent; btn.textContent = 'Copied ' + blocks.length + ' block' + (blocks.length!==1?'s':'') + '!'; setTimeout(()=>btn.textContent=o, 1800); }
  });
}

// Progress bar
document.getElementById('page-wrap').addEventListener('scroll', function(){
  const ratio = this.scrollTop / (this.scrollHeight - this.clientHeight) || 0;
  document.getElementById('progress-bar').style.transform = `scaleX(${ratio})`;
  updateToTop(this.scrollTop);
});

// Keyboard: "/" or Cmd/Ctrl+K focuses search; Esc closes the mobile sidebar
document.addEventListener('keydown', function(e){
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  if(((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'))){
    e.preventDefault();
    const si = document.getElementById('search-input');
    if(si){ si.focus(); si.select(); }
  }
  if(e.key === 'Escape' && !typing) closeSidebar();
});

// Boot
buildNav();
initSearch();
let initHash = '';
try { initHash = location.hash.slice(1); } catch(e){}
goTo(initHash && PAGES[initHash] ? initHash : 'overview', false);
buildSectionJump();
window.addEventListener('popstate', e => { if(e.state?.id) goTo(e.state.id, false); });

</script>
<button id="to-top" aria-label="Back to top" onclick="scrollTop()">↑</button>
</body>
</html>
