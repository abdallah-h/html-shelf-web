<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSuite TF Reference — Expert Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="shelf-vendor:/fonts/9420ee60462e.css" rel="stylesheet">
<style>
/* ═══════════ DESIGN SYSTEM ═══════════ */
:root {
  /* Core palette */
  --bg0: #060810;
  --bg1: #0b0f1a;
  --bg2: #0f1520;
  --bg3: #141c28;
  --bg4: #1a2435;
  --bd:  #1e2d44;
  --bd2: #263650;
  --bd3: #2e4060;

  /* Accent */
  --blue:   #2563eb;
  --blue2:  #1d4ed8;
  --blue-g: rgba(0,120,212,.12);
  --teal:   #0891b2;
  --teal-g: rgba(96,205,255,.12);
  --gold:   #d97706;
  --gold2:  #b45309;
  --gold-g: rgba(252,185,0,.12);
  --green:  #059669;
  --green-g:rgba(108,203,95,.1);
  --red:    #dc2626;
  --red-g:  rgba(255,153,164,.1);
  --purple: #7c3aed;

  /* Text */
  --tx:  #e2eaf6;
  --tx2: #8ea3bf;
  --tx3: #506880;
  --tx4: #374d66;

  /* Code */
  --code-bg:  #05080f;
  --code-tx:  #7dd3fc;
  --code-str: #86efac;
  --code-kw:  #c4b5fd;
  --code-cm:  #64748b;

  /* Layout */
  --sidebar: 272px;
  --radius:  8px;

  /* Fonts */
  --f-ui:   'Inter', sans-serif;
  --f-mono: 'JetBrains Mono', monospace;
  --f-head: 'Playfair Display', serif;
}

/* ═══════════ RESET ═══════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg0);
  color: var(--tx);
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.6;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ═══════════ SCROLLBAR ═══════════ */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bd3); border-radius: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--bd3) transparent; }

/* ═══════════ SIDEBAR ═══════════ */
#sidebar {
  width: var(--sidebar);
  min-width: var(--sidebar);
  height: 100vh;
  background: var(--bg1);
  border-right: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  overflow: hidden;
  z-index: 30;
}

.sb-brand {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--bd);
  background: linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 100%);
  flex-shrink: 0;
}
.sb-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.sb-logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,120,212,.4);
}
.sb-logo-text { flex: 1; }
.sb-logo-title {
  font-size: 12.5px; font-weight: 700; color: #fff;
  line-height: 1.2; letter-spacing: -.01em;
}
.sb-logo-sub {
  font-size: 10px; color: var(--tx3); margin-top: 1px;
  font-family: var(--f-mono);
}
.sb-version {
  display: inline-flex; align-items: center;
  font-family: var(--f-mono); font-size: 9px; font-weight: 500;
  padding: 2px 6px; border-radius: 3px;
  background: var(--gold-g); color: var(--gold);
  border: 1px solid rgba(252,185,0,.25);
}

.sb-search-wrap {
  padding: 10px 12px;
  border-bottom: 1px solid var(--bd);
  flex-shrink: 0;
}
.sb-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg0); border: 1px solid var(--bd);
  border-radius: 6px; padding: 7px 10px;
  transition: border-color .15s;
}
.sb-search:focus-within { border-color: var(--blue); }
.sb-search input {
  background: none; border: none; outline: none;
  color: var(--tx); font-family: var(--f-mono); font-size: 11.5px;
  width: 100%;
}
.sb-search input::placeholder { color: var(--tx4); }
.sb-search-icon { color: var(--tx4); flex-shrink: 0; }

.sb-nav {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0 20px;
}
.sb-section { padding: 12px 0 0; }
.sb-section-label {
  padding: 0 14px 4px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tx4);
  font-family: var(--f-mono);
}
.sb-item {
  display: flex; align-items: center;
  padding: 5.5px 14px; gap: 8px;
  cursor: pointer; color: var(--tx3);
  font-size: 12.5px; font-weight: 450;
  border-left: 2px solid transparent;
  transition: all .12s; user-select: none;
}
.sb-item:hover { color: var(--tx); background: rgba(255,255,255,.025); }
.sb-item.active {
  color: #fff; background: var(--blue-g);
  border-left-color: var(--blue);
  font-weight: 500;
}
.sb-item-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--bd3); flex-shrink: 0;
  transition: .12s;
}
.sb-item.active .sb-item-dot { background: var(--blue); }
.sb-item:hover .sb-item-dot { background: var(--teal); }
.sb-badge {
  margin-left: auto; font-family: var(--f-mono); font-size: 8.5px;
  padding: 1px 5px; border-radius: 3px; font-weight: 600; letter-spacing: .05em;
}
.badge-new { background: var(--green-g); color: var(--green); border: 1px solid rgba(108,203,95,.25); }
.badge-hot { background: var(--red-g); color: var(--red); border: 1px solid rgba(255,153,164,.25); }

/* ═══════════ MAIN AREA ═══════════ */
#main {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; min-width: 0;
}

.topbar {
  height: 48px; flex-shrink: 0;
  background: rgba(32,32,32,.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center;
  padding: 0 28px; gap: 12px;
  position: sticky; top: 0; z-index: 20;
}
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--f-mono); font-size: 11px; color: var(--tx4);
}
.breadcrumb .sep { color: var(--bd3); }
.breadcrumb .current { color: var(--tx2); }
.topbar-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.tb-chip {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  padding: 3px 8px; border-radius: 4px;
  background: var(--blue-g); color: #99ebff;
  border: 1px solid rgba(0,120,212,.25);
}
.tb-btn {
  font-family: var(--f-mono); font-size: 10px; font-weight: 500;
  padding: 5px 10px; border-radius: 4px; cursor: pointer;
  background: var(--bg3); border: 1px solid var(--bd);
  color: var(--tx3); transition: all .12s; letter-spacing: .02em;
}
.tb-btn:hover { border-color: var(--teal); color: var(--teal); }

#progress-bar {
  position: fixed; top: 0; left: var(--sidebar); right: 0;
  height: 2px; z-index: 100; background: transparent;
  transform-origin: left; transform: scaleX(0);
}
#progress-bar::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--blue), var(--teal), var(--green));
}

#page-wrap {
  flex: 1; overflow-y: auto; overflow-x: hidden;
}
#page-content {
  max-width: 860px; margin: 0 auto;
  padding: 32px 32px 80px;
  animation: page-in .25s ease;
}
@keyframes page-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ═══════════ HERO BLOCK ═══════════ */
.hero {
  position: relative; overflow: hidden;
  border-radius: 10px; padding: 28px 32px;
  margin-bottom: 28px;
  background: linear-gradient(135deg, #2d2d2d 0%, #272727 60%, #272727 100%);
  border: 1px solid var(--bd2);
}
.hero::before {
  content: ''; position: absolute;
  top: -60px; right: -60px;
  width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,120,212,.1) 0%, transparent 70%);
  pointer-events: none;
}
.hero::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, rgba(252,185,0,.5), transparent);
}
.hero-eyebrow {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.hero-eyebrow::before {
  content: ''; width: 20px; height: 1px; background: var(--gold2);
}
.hero h1 {
  font-family: var(--f-head); font-size: 28px; font-weight: 700;
  color: #fff; line-height: 1.15; margin-bottom: 8px; letter-spacing: -.01em;
}
.hero h1 em { font-style: italic; color: var(--tx2); }
.hero-sub {
  font-size: 13.5px; color: var(--tx2); line-height: 1.6; margin-bottom: 14px;
}
.hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.hero-tag {
  font-family: var(--f-mono); font-size: 10px; font-weight: 500;
  padding: 3px 8px; border-radius: 4px;
  background: rgba(255,255,255,.05); color: var(--tx3);
  border: 1px solid var(--bd2);
}

/* ═══════════ SECTION HEADINGS ═══════════ */
.sh2 {
  display: flex; align-items: center; gap: 8px;
  margin: 32px 0 10px; padding: 9px 14px;
  background: var(--bg2); border-left: 3px solid var(--blue);
  border-radius: 0 5px 5px 0;
  font-size: 14px; font-weight: 600; color: #fff;
  letter-spacing: -.01em;
}
.sh2 .icon { opacity: .8; font-size: 13px; }
.sh3 {
  font-size: 12.5px; font-weight: 600; color: var(--teal);
  margin: 22px 0 8px; padding-bottom: 5px;
  border-bottom: 1px solid var(--bd);
  letter-spacing: .01em;
}
p { color: var(--tx2); font-size: 13.5px; margin-bottom: 10px; line-height: 1.7; }
p strong { color: var(--tx); font-weight: 600; }
p code { font-family: var(--f-mono); font-size: 11.5px; background: var(--teal-g); color: var(--teal); padding: 1px 5px; border-radius: 3px; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ═══════════ TABLES ═══════════ */
.tbl-wrap { overflow-x: auto; margin: 10px 0; border-radius: 7px; border: 1px solid var(--bd); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead tr { background: var(--bg2); }
thead th {
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--tx3);
  padding: 8px 12px; text-align: left;
  border-bottom: 1px solid var(--bd2); white-space: nowrap;
}
thead th:first-child { color: var(--gold); }
tbody tr { border-bottom: 1px solid rgba(255,255,255,0.09); }
tbody tr:last-child { border-bottom: none; }
tbody tr:nth-child(odd)  { background: var(--bg2); }
tbody tr:nth-child(even) { background: var(--code-bg); }
tbody tr:hover { background: rgba(0,120,212,.05); }
td { padding: 8px 12px; color: var(--tx2); vertical-align: top; line-height: 1.5; }
td:first-child { font-family: var(--f-mono); font-size: 11px; color: #99ebff; white-space: nowrap; }
td code { font-family: var(--f-mono); font-size: 10.5px; background: var(--teal-g); color: var(--teal); padding: 1px 5px; border-radius: 3px; }

/* ═══════════ KV TABLE ═══════════ */
.kv { margin: 10px 0; border: 1px solid var(--bd); border-radius: 7px; overflow: hidden; }
.kv-row { display: grid; grid-template-columns: 180px 1fr; border-bottom: 1px solid rgba(255,255,255,0.072); }
.kv-row:last-child { border-bottom: none; }
.kv-row:nth-child(odd)  { background: var(--bg2); }
.kv-row:nth-child(even) { background: var(--code-bg); }
.kv-k {
  font-family: var(--f-mono); font-size: 11px; font-weight: 500;
  color: #99ebff; padding: 8px 12px;
  border-right: 1px solid var(--bd); word-break: break-word;
}
.kv-v { padding: 8px 12px; color: var(--tx2); font-size: 12.5px; line-height: 1.55; }

/* ═══════════ CODE BLOCKS ═══════════ */
.code-wrap { margin: 12px 0; border-radius: 7px; overflow: hidden; border: 1px solid var(--teal); }
.code-header {
  background: rgba(96,205,255,.1); padding: 7px 14px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(96,205,255,.2);
}
.code-lang { font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; color: var(--teal); text-transform: uppercase; letter-spacing: .08em; }
.code-meta { display: flex; align-items: center; gap: 8px; }
.code-desc { font-family: var(--f-mono); font-size: 9px; color: var(--tx4); }
.copy-btn {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  padding: 2px 8px; border-radius: 3px; cursor: pointer;
  background: var(--bg3); border: 1px solid var(--bd);
  color: var(--tx3); transition: .12s;
}
.copy-btn:hover { border-color: var(--teal); color: var(--teal); }
.copy-btn.done { border-color: var(--green); color: var(--green); }
pre {
  background: var(--code-bg); padding: 16px 18px;
  font-family: var(--f-mono); font-size: 12px; line-height: 1.7;
  color: var(--code-tx); overflow-x: auto; tab-size: 2;
}

/* ═══════════ NOTE BOXES ═══════════ */
.note {
  margin: 12px 0; padding: 11px 14px; border-radius: 7px;
  border-left: 3px solid; display: flex; gap: 10px; align-items: flex-start;
}
.note-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.note-body strong {
  font-size: 11.5px; font-weight: 600; display: block; margin-bottom: 3px;
}
.note-body p { font-size: 12px; margin: 0; line-height: 1.55; }
.note-i { border-color: var(--blue); background: var(--blue-g); }
.note-i .note-body strong { color: #99ebff; }
.note-w { border-color: var(--gold); background: var(--gold-g); }
.note-w .note-body strong { color: #fcb900; }
.note-d { border-color: var(--red); background: var(--red-g); }
.note-d .note-body strong { color: #ff99a4; }
.note-s { border-color: var(--green); background: var(--green-g); }
.note-s .note-body strong { color: #6ccb5f; }

/* ═══════════ GL ENTRY CARDS ═══════════ */
.gl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 10px 0; }
@media (max-width: 600px) { .gl-grid { grid-template-columns: 1fr; } }
.gl-card { border: 1px solid var(--bd); border-radius: 6px; overflow: hidden; }
.gl-card-title {
  font-size: 10.5px; font-weight: 600; padding: 5px 11px;
  background: var(--bg3); color: var(--tx2);
  border-bottom: 1px solid var(--bd);
}
.gl-line { display: flex; justify-content: space-between; padding: 5px 11px; font-family: var(--f-mono); font-size: 10.5px; }
.gl-line:nth-child(odd) { background: rgba(0,0,0,.2); }
.gl-dr { color: #86efac; }
.gl-cr { color: #ffb3bc; }
.gl-dr::before { content: 'DR  '; color: rgba(134,239,172,.4); font-size: 9px; }
.gl-cr::before { content: 'CR  '; color: rgba(252,165,165,.4); font-size: 9px; }

/* ═══════════ FLOW DIAGRAM ═══════════ */
.flow-wrap { margin: 12px 0; }
.flow-step {
  display: flex; gap: 12px;
  padding: 9px 0 9px 22px;
  border-left: 2px solid var(--bd2); margin-left: 9px;
  position: relative;
}
.flow-step::before {
  content: ''; position: absolute; left: -6px; top: 13px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--teal); border: 2px solid var(--bg0);
  box-shadow: 0 0 0 2px rgba(96,205,255,.3);
}
.flow-step:last-child { border-left: 2px solid transparent; }
.flow-num { font-family: var(--f-mono); font-size: 9px; color: var(--teal); font-weight: 600; min-width: 24px; margin-top: 2px; }
.flow-body h5 { font-size: 12.5px; font-weight: 600; color: #fff; margin-bottom: 2px; }
.flow-nav { font-size: 10.5px; color: var(--tx4); font-family: var(--f-mono); margin-bottom: 2px; }
.flow-gl { font-size: 11.5px; color: var(--tx2); }
.flow-gl strong { color: var(--teal); }

/* ═══════════ CARD GRID ═══════════ */
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
@media (max-width: 580px) { .card-grid { grid-template-columns: 1fr; } }
.card {
  background: var(--bg2); border: 1px solid var(--bd);
  border-radius: 7px; padding: 14px;
}
.card h4 { font-size: 11.5px; font-weight: 600; color: #fff; margin-bottom: 8px; }
.card ul { list-style: none; padding: 0; }
.card li {
  font-size: 12px; color: var(--tx2); padding: 3px 0 3px 14px;
  position: relative; border-bottom: 1px solid rgba(255,255,255,0.054);
}
.card li:last-child { border-bottom: none; }
.card li::before { content: '›'; position: absolute; left: 0; color: var(--teal); }

/* ═══════════ STATS ═══════════ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
.stat {
  background: var(--bg2); border: 1px solid var(--bd);
  border-radius: 7px; padding: 12px 14px; text-align: center;
}
.stat-val { font-family: var(--f-head); font-size: 26px; color: var(--gold); line-height: 1; }
.stat-lbl { font-family: var(--f-mono); font-size: 9px; color: var(--tx4); margin-top: 3px; text-transform: uppercase; letter-spacing: .08em; }

/* ═══════════ NUMBERED LIST ═══════════ */
.num-list { counter-reset: nl; list-style: none; padding: 0; margin: 10px 0; }
.num-list li {
  counter-increment: nl; padding: 8px 0 8px 38px;
  position: relative; font-size: 13px; color: var(--tx2);
  border-bottom: 1px solid rgba(255,255,255,0.054);
}
.num-list li:last-child { border-bottom: none; }
.num-list li::before {
  content: counter(nl); position: absolute; left: 0; top: 8px;
  width: 22px; height: 22px; border-radius: 4px;
  background: var(--bg3); border: 1px solid var(--bd2);
  font-family: var(--f-mono); font-size: 9px; font-weight: 600; color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  line-height: 22px; text-align: center;
}
.num-list li strong { color: var(--tx); font-weight: 600; }

/* ═══════════ SEARCH RESULTS ═══════════ */
.search-result {
  background: var(--bg2); border: 1px solid var(--bd);
  border-radius: 7px; padding: 12px 14px; margin: 7px 0;
  cursor: pointer; transition: .12s;
}
.search-result:hover { border-color: var(--teal); background: rgba(96,205,255,.04); }
.sr-group { font-family: var(--f-mono); font-size: 9px; color: var(--teal); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
.sr-title { font-size: 13.5px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.sr-snip { font-size: 11.5px; color: var(--tx3); line-height: 1.5; }
.sr-snip mark { background: rgba(252,185,0,.25); color: var(--gold); border-radius: 2px; padding: 0 2px; }

/* ═══════════ Q&A INTERVIEW ═══════════ */
.qa { margin: 6px 0; border: 1px solid var(--bd); border-radius: 7px; background: var(--bg2); overflow: hidden; }
.qa summary { padding: 10px 14px; font-weight: 600; color: var(--tx); font-size: 13px; cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: flex-start; transition: background .12s; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary::before { content: '+'; color: var(--teal); font-family: var(--f-mono); font-weight: 700; flex-shrink: 0; font-size: 14px; line-height: 1.4; }
.qa[open] summary::before { content: '\2212'; }
.qa[open] summary { background: var(--bg3); border-bottom: 1px solid var(--bd); }
.qa summary:hover { background: var(--bg3); }
.qa .qnum { font-family: var(--f-mono); font-size: 10px; color: var(--gold); flex-shrink: 0; margin-top: 2px; min-width: 30px; }
.qa-a { padding: 12px 14px 14px 42px; color: var(--tx2); font-size: 13px; line-height: 1.7; }
.qa-a code { font-family: var(--f-mono); font-size: 11.5px; background: var(--teal-g); color: var(--teal); padding: 1px 5px; border-radius: 3px; }
.qa-a strong { color: var(--tx); }
.qa-tools { display: flex; gap: 8px; margin: 4px 0 14px; }
.qa-tool-btn { font-family: var(--f-mono); font-size: 10px; padding: 5px 12px; border-radius: 5px; cursor: pointer; background: var(--bg3); border: 1px solid var(--bd2); color: var(--tx3); transition: .12s; }
.qa-tool-btn:hover { border-color: var(--teal); color: var(--teal); }

/* ═══════════ SENIOR SCENARIOS ═══════════ */
.qa-senior summary { border-left: 2px solid var(--gold); }
.sc-prompt { padding: 10px 12px; background: var(--bg3); border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: var(--tx); line-height: 1.6; }
.sc-prompt strong { color: var(--gold); }
.sc-think { margin: 10px 0; }
.sc-think-label, .sc-follow-label, .sc-flags-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.sc-think-label { color: var(--teal); }
.sc-follow-label { color: var(--blue); }
.sc-flags-label { color: var(--red); }
.sc-steps { counter-reset: scs; list-style: none; padding: 0; margin: 0 0 12px; }
.sc-steps li { counter-increment: scs; padding: 7px 0 7px 30px; position: relative; font-size: 13px; color: var(--tx2); line-height: 1.6; border-bottom: 1px solid rgba(255,255,255,0.054); }
.sc-steps li:last-child { border-bottom: none; }
.sc-steps li::before { content: counter(scs); position: absolute; left: 0; top: 7px; width: 20px; height: 20px; border-radius: 4px; background: var(--teal-g); border: 1px solid var(--teal); color: var(--teal); font-family: var(--f-mono); font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; line-height: 20px; }
.sc-steps li strong { color: var(--tx); }
.sc-follow, .sc-flags { margin: 12px 0; padding: 10px 12px; border-radius: 6px; }
.sc-follow { background: var(--blue-g); border: 1px solid rgba(0,120,212,.2); }
.sc-flags { background: var(--red-g); border: 1px solid rgba(255,153,164,.2); }
.sc-follow ul, .sc-flags ul { margin: 0; padding-left: 16px; }
.sc-follow li, .sc-flags li { font-size: 12px; color: var(--tx2); line-height: 1.55; margin: 4px 0; }

/* ═══════════ MOCK INTERVIEW ═══════════ */
.mock-intro { margin-bottom: 16px; }
.mock-level { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.mock-level-label { font-family: var(--f-mono); font-size: 11px; color: var(--tx3); }
.mock-lvl { font-family: var(--f-mono); font-size: 11px; padding: 5px 12px; border-radius: 5px; cursor: pointer; background: var(--bg3); border: 1px solid var(--bd2); color: var(--tx3); transition: .12s; }
.mock-lvl:hover { border-color: var(--teal); color: var(--teal); }
.mock-lvl.active { background: var(--gold-g); border-color: var(--gold); color: var(--gold); }
.mock-suggest { font-size: 12px; color: var(--tx3); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mock-chip { font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; background: var(--bg2); border: 1px solid var(--bd); color: var(--tx2); transition: .12s; }
.mock-chip:hover { border-color: var(--teal); color: var(--teal); }
.mock-thread { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; min-height: 40px; }
.mock-msg { padding: 11px 14px; border-radius: 8px; font-size: 13px; line-height: 1.65; }
.mock-q { background: var(--bg3); border: 1px solid var(--bd2); align-self: flex-end; max-width: 85%; }
.mock-a { background: var(--blue-g); border: 1px solid rgba(0,120,212,.2); align-self: flex-start; max-width: 92%; }
.mock-who { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.mock-q .mock-who { color: var(--tx3); }
.mock-a .mock-who { color: #99ebff; }
.mock-text { color: var(--tx); }
.mock-input-row { display: flex; gap: 8px; align-items: flex-end; }
.mock-input { flex: 1; background: var(--bg0); border: 1px solid var(--bd2); border-radius: 7px; padding: 10px 12px; color: var(--tx); font-family: var(--f-ui); font-size: 13px; resize: vertical; outline: none; transition: border-color .12s; }
.mock-input:focus { border-color: var(--blue); }
.mock-send { background: var(--blue); border: none; color: #fff; font-size: 13px; font-weight: 600; padding: 11px 18px; border-radius: 7px; cursor: pointer; white-space: nowrap; transition: .12s; }
.mock-send:hover { background: var(--blue2); }
.mock-send:disabled { opacity: .5; cursor: wait; }
.mock-foot { font-size: 11px; color: var(--tx4); margin-top: 10px; font-style: italic; }

/* ═══════════ QUIZ MODE ═══════════ */
.quiz-setup { background: var(--bg2); border: 1px solid var(--bd); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.quiz-setup-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--tx3); margin: 10px 0 6px; }
.quiz-cats { display: flex; flex-wrap: wrap; gap: 6px; }
.quiz-cat { font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; background: var(--bg3); border: 1px solid var(--bd2); color: var(--tx3); transition: .12s; user-select: none; }
.quiz-cat:hover { border-color: var(--teal); color: var(--teal); }
.quiz-cat.on { background: var(--teal-g); border-color: var(--teal); color: var(--teal); }
.quiz-counts { display: flex; gap: 6px; }
.quiz-count { font-family: var(--f-mono); font-size: 11px; padding: 5px 14px; border-radius: 5px; cursor: pointer; background: var(--bg3); border: 1px solid var(--bd2); color: var(--tx3); transition: .12s; }
.quiz-count.on { background: var(--gold-g); border-color: var(--gold); color: var(--gold); }
.quiz-start { margin-top: 14px; background: var(--blue); border: none; color: #fff; font-size: 13px; font-weight: 600; padding: 10px 22px; border-radius: 7px; cursor: pointer; transition: .12s; }
.quiz-start:hover { background: var(--blue2); }
.quiz-hud { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--tx3); flex-wrap: wrap; }
.quiz-hud .hud-ok { color: var(--green); }
.quiz-hud .hud-miss { color: var(--red); }
.quiz-progress { flex: 1; min-width: 120px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--teal)); transition: width .2s; }
.quiz-card { background: var(--bg2); border: 1px solid var(--bd2); border-radius: 10px; padding: 24px; min-height: 160px; }
.quiz-cat-tag { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); margin-bottom: 10px; }
.quiz-q { font-size: 16px; font-weight: 600; color: var(--tx); line-height: 1.5; margin-bottom: 16px; }
.quiz-a { border-top: 1px solid var(--bd); padding-top: 14px; margin-top: 8px; font-size: 13px; color: var(--tx2); line-height: 1.7; }
.quiz-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.quiz-btn { font-size: 13px; font-weight: 600; padding: 9px 20px; border-radius: 7px; cursor: pointer; border: 1px solid; transition: .12s; }
.quiz-btn-reveal { background: var(--blue); border-color: var(--blue); color: #fff; }
.quiz-btn-reveal:hover { background: var(--blue2); }
.quiz-btn-ok { background: var(--green-g); border-color: var(--green); color: var(--green); }
.quiz-btn-ok:hover { background: rgba(108,203,95,.2); }
.quiz-btn-miss { background: var(--red-g); border-color: var(--red); color: var(--red); }
.quiz-btn-miss:hover { background: rgba(255,153,164,.2); }
.quiz-btn-quit { background: var(--bg3); border-color: var(--bd2); color: var(--tx3); }
.quiz-done { text-align: center; padding: 30px 20px; }
.quiz-score { font-family: var(--f-head); font-size: 40px; color: var(--gold); }
.quiz-done p { margin: 10px 0 18px; }

/* ═══════════ STUDY PLAN ═══════════ */
.sp-progress-wrap { background: var(--bg2); border: 1px solid var(--bd); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
.sp-progress-label { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--tx3); margin-bottom: 8px; }
.sp-progress-label span:last-child { color: var(--gold); }
.sp-progress { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.sp-progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--teal), var(--green)); transition: width .25s; }
.sp-week { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin: 22px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--bd); }
.sp-day { display: flex; gap: 12px; background: var(--bg2); border: 1px solid var(--bd); border-radius: 8px; padding: 12px 14px; margin: 7px 0; transition: .12s; }
.sp-day.done { opacity: .55; border-color: var(--green); }
.sp-check { flex-shrink: 0; margin-top: 2px; width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; }
.sp-body { flex: 1; }
.sp-title { font-size: 13px; font-weight: 600; color: var(--tx); margin-bottom: 4px; }
.sp-title .sp-num { font-family: var(--f-mono); font-size: 10px; color: var(--gold); margin-right: 8px; }
.sp-pages { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0; }
.sp-page { font-family: var(--f-mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; background: var(--blue-g); border: 1px solid rgba(0,120,212,.25); color: #99ebff; cursor: pointer; transition: .12s; }
.sp-page:hover { border-color: var(--blue); color: #fff; }
.sp-task { font-size: 12px; color: var(--tx3); line-height: 1.5; }
.sp-task strong { color: var(--teal); font-weight: 600; }

/* ═══════════ SEARCH JUMP HIGHLIGHT ═══════════ */
mark.search-jump { background: var(--gold); color: #202020; padding: 1px 3px; border-radius: 3px; box-shadow: 0 0 0 3px rgba(252,185,0,.25); }

/* ═══════════ PRINT ═══════════ */
@media print {
  body { background: #fff !important; color: #111 !important; height: auto !important; overflow: visible !important; }
  #sidebar, .topbar, #progress-bar, .qa-tools, .quiz-setup, .mock-input-row, .mock-level, .mock-suggest, .copy-btn, .sp-check, #sb-backdrop, #section-jump, #to-top, .mob-toggle { display: none !important; }
  #main { margin-left: 0 !important; }
  #page-wrap { overflow: visible !important; height: auto !important; }
  #page-content { max-width: 100% !important; }
  #page-content, #page-content * { color: #111 !important; background: transparent !important; border-color: #bbb !important; box-shadow: none !important; text-shadow: none !important; }
  h1, h2, h3, .sh2, .sh3, .qa summary, .sr-title, .sp-title, .quiz-q { color: #000 !important; font-weight: 700 !important; }
  pre, code { background: #f4f4f4 !important; color: #111 !important; }
  .qa, .note, .code-wrap, table, .sc-prompt, .sc-follow, .sc-flags, .sp-day, .quiz-card { border: 1px solid #ccc !important; page-break-inside: avoid; }
  details > summary { list-style: none; }
  a { color: #000 !important; text-decoration: none; }
  mark { background: #ffe08a !important; color: #000 !important; }
}

/* ═══════════ NAV / UX ADDITIONS ═══════════ */
#sb-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 90; }
#sb-backdrop.show { display: block; }
.sb-item:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; border-radius: 6px; }
#section-jump { display: none; align-items: center; gap: 10px; padding: 8px 40px; border-bottom: 1px solid var(--bd); background: var(--bg1); position: sticky; top: 0; z-index: 20; }
.sj-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--tx4); }
.sj-select { background: var(--bg2); border: 1px solid var(--bd2); color: var(--tx2); font-family: var(--f-ui); font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; max-width: 340px; outline: none; }
.sj-select:hover, .sj-select:focus { border-color: var(--teal); color: var(--tx); }
#to-top { position: fixed; right: 22px; bottom: 22px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--bd2); background: var(--bg2); color: var(--tx2); font-size: 17px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s, border-color .12s, color .12s; z-index: 80; }
#to-top.show { opacity: 1; pointer-events: auto; }
#to-top:hover { border-color: var(--teal); color: var(--teal); }
@media (max-width: 768px) {
  #section-jump { padding: 8px 16px; }
  .sj-select { max-width: 200px; }
  #to-top { right: 14px; bottom: 74px; }
}

/* ═══════════ DIVIDER ═══════════ */
.div { height: 1px; background: linear-gradient(90deg, var(--bd), transparent); margin: 28px 0; }

/* ═══════════ MOBILE ═══════════ */
.mob-toggle {
  display: none; position: fixed; bottom: 20px; right: 20px; z-index: 50;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--blue); border: none; color: #fff;
  font-size: 18px; cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,120,212,.5);
  align-items: center; justify-content: center;
}
@media (max-width: 768px) {
  #sidebar { position: fixed; transform: translateX(-100%); transition: .22s ease; }
  #sidebar.open { transform: translateX(0); box-shadow: 4px 0 40px rgba(0,0,0,.6); }
  .mob-toggle { display: flex; }
  #page-content { padding: 18px 16px 80px; }

  #progress-bar { left: 0; }

}


/* ═══════════ WORKED EXAMPLES ═══════════ */
.ex-intro { background: var(--bg2); border: 1px solid var(--bd); border-radius: 8px; padding: 14px 16px; margin: 0 0 18px; font-size: 13px; color: var(--tx2); line-height: 1.7; }

.ex-body { padding: 12px 16px 14px; }
.ex-story { font-size: 13px; color: var(--tx2); line-height: 1.7; margin-bottom: 10px; }

.ex-steps { margin: 0; padding-left: 20px; font-size: 13px; color: var(--tx2); line-height: 1.7; }

.je { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 4px 0 6px; }
.je th { text-align: left; font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--tx3); padding: 6px 10px; border-bottom: 1px solid var(--bd2); }
.je td { padding: 6px 10px; border-bottom: 1px solid var(--bd); color: var(--tx2); }

.ex-result { background: var(--green-g); border: 1px solid rgba(108,203,95,.3); border-radius: 6px; padding: 9px 12px; font-size: 12.5px; color: var(--tx2); margin-top: 10px; line-height: 1.6; }
.ex-result strong { color: var(--green); }
.ex-link { display: inline-block; margin-top: 4px; }
/* ═══════════ WINDOWS 11 DARK THEME ═══════════ */

  --f-head: 'Segoe UI Variable Display', 'Segoe UI', 'Inter', system-ui, sans-serif;
}
body { background: var(--bg0); }

button, .quiz-btn, .mock-send, .quiz-start { border-radius: 4px; }

// ─── helper renderers ───────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function hero(eyebrow, title, subtitle, tags=[]){
  const tagHtml = tags.map(t=>`<span class="hero-tag">${t}</span>`).join('');
  return `<div class="hero">
<div class="hero-eyebrow">${eyebrow}</div>
<h1>${title}</h1>
<div class="hero-sub">${subtitle}</div>
${tags.length?`<div class="hero-tags">${tagHtml}</div>`:''}
</div>`;
}

function sh2(icon, text){ return `<div class="sh2"><span class="icon">${icon}</span>${text}</div>`; }
function sh3(text){ return `<div class="sh3">${text}</div>`; }

function kv(pairs){
  return '<div class="kv">' +
    pairs.map(([k,v])=>`<div class="kv-row"><div class="kv-k">${k}</div><div class="kv-v">${v}</div></div>`).join('') +
  '</div>';
}

function tw(heads, rows){
  return '<div class="tbl-wrap"><table>' +
    '<thead><tr>'+heads.map(h=>`<th>${h}</th>`).join('')+'</tr></thead>' +
    '<tbody>'+rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')+'</tbody>' +
  '</table></div>';
}

function note(cls, icon, title, body){
  return `<div class="note note-${cls}"><span class="note-icon">${icon}</span><div class="note-body"><strong>${title}</strong><p>${body}</p></div></div>`;
}

function codeBlock(lang, src, desc=''){
  const lines = src.split('\n').length;
  return `<div class="code-wrap">
<div class="code-header">
  <span class="code-lang">${lang}</span>
  <div class="code-meta">
    ${desc?`<span class="code-desc">${desc}</span>`:''}
    <span class="code-desc">${lines} lines</span>
    <button class="copy-btn" onclick="doCopy(this)">Copy</button>
  </div>
</div>
<pre>${esc(src)}</pre>
</div>`;
}

function flowStep(num, title, nav, gl){
  return `<div class="flow-step">
<div class="flow-num">${num}</div>
<div class="flow-body">
  <h5>${title}</h5>
  ${nav?`<div class="flow-nav">${nav}</div>`:''}
  ${gl?`<div class="flow-gl"><strong>GL:</strong> ${gl}</div>`:''}
</div>
</div>`;
}

function flow(...steps){ return '<div class="flow-wrap">'+steps.map(s=>flowStep(...s)).join('')+'</div>'; }

function glGrid(cards){
  return '<div class="gl-grid">' + cards.map(([title, lines]) =>
    `<div class="gl-card"><div class="gl-card-title">${title}</div>` +
    lines.map(([d,c])=>`<div class="gl-line"><span class="gl-dr">${d}</span><span class="gl-cr">${c}</span></div>`).join('') +
    '</div>'
  ).join('') + '</div>';
}

function stats(...items){
  return '<div class="stats">'+items.map(([v,l])=>`<div class="stat"><div class="stat-val">${v}</div><div class="stat-lbl">${l}</div></div>`).join('')+'</div>';
}

function cardGrid(...cards){
  return '<div class="card-grid">'+cards.map(([title, items])=>
    `<div class="card"><h4>${title}</h4><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`
  ).join('')+'</div>';
}

function numList(...items){
  return '<ol class="num-list">'+items.map(i=>`<li>${i}</li>`).join('')+'</ol>';
}

${note('s','✅','10× Governance Saving','search.lookupFields() costs 1u vs 10u for record.load() on a transaction. But for many records, neither scales: 1,000 lookups is already 1,000u, the whole User Event budget. Read many records with one search (10u per page of up to 1,000 rows) instead.')}
${sh2('🔍','N/search — Four Key Patterns')}
${codeBlock('JavaScript — N/search patterns', `define(['N/search'], function(search){

  // Pattern 1: Basic filtered search
  function getOpenInvoices(customerId){
    var s = search.create({
      type: search.Type.INVOICE,
      filters: [
        ['status','anyof','CustInvc:A'], 'AND',
        ['entity','anyof', customerId],  'AND',
        ['mainline','is','T']
      ],
      columns: ['tranid','total','duedate',
        search.createColumn({name:'companyname', join:'entity'})]
    });
    return s;
  }

  // Pattern 2: lookupFields — cheapest single-record read
  function getCustomerInfo(customerId){
    return search.lookupFields({
      type:    search.Type.CUSTOMER,
      id:      customerId,
      columns: ['companyname','email','terms','creditlimit']
    }); // Cost: ~1u vs 10u for record.load()
  }

  // Pattern 3: Summary search (GROUP BY / SUM — no row limit)
  function getARByCustomer(){
    return search.create({
      type: search.Type.INVOICE,
      filters: [['status','anyof','CustInvc:A'], 'AND', ['mainline','is','T']],
      columns: [
        search.createColumn({name:'entity',    summary:'GROUP'}),
        search.createColumn({name:'companyname',join:'entity',summary:'GROUP'}),
        search.createColumn({name:'amount',    summary:'SUM'}),
        search.createColumn({name:'duedate',   summary:'MIN'})
      ]
    });
  }

  // Pattern 4: runPaged — handles 4,000+ results
  function processAllSalesOrders(callback){
    var s = search.create({
      type: search.Type.SALES_ORDER,
      filters: [['mainline','is','T'], 'AND', ['status','anyof','SalesOrd:B']],
      columns: ['tranid','entity','amount']
    });
    var paged = s.runPaged({pageSize:1000});      // run once (5u)
    paged.pageRanges.forEach(function(range){
      paged.fetch({index:range.index})            // 5u per page
        .data.forEach(callback);
    });
  }

  return {getOpenInvoices, getCustomerInfo, getARByCustomer, processAllSalesOrders};
});`, 'All four search patterns — basic, lookupFields, summary, paged')}`;

${note('i','ℹ️','Yielding is not the same as a bigger budget','Map/Reduce has no cap on the whole run, but each invocation has a hard limit (above). Separately, a map or reduce <em>job</em> soft-yields after using roughly 10,000 units: it stops between invocations and a new job picks up the remaining keys. That is what people mean by "Map/Reduce reschedules itself". Yielding never rescues a single invocation that exceeds its own 1,000 / 5,000 budget, so design each invocation to handle one record or one key. Time limits also apply per type (Scheduled, getInputData and summarize run up to 60 minutes). Oracle can change limits in any release, so confirm against the current Script Type Usage Unit Limits and Map/Reduce Governance help topics.')}

['record.submitFields()','10 / 5 / 2','N/record','Replaces load + save (30u on a transaction) with 10u'],
['ResultSet.getRange() / each()','10','N/search','Charged per call, not per row: page through results in large chunks'],
['search.load() / runPaged() / PagedData.fetch()','5','N/search','Use runPaged + fetch for result sets beyond 4,000 rows'],

])}
${sh2('🔧','Optimization Pattern: Cache Config Data')}
${codeBlock('JavaScript — N/cache pattern', `define(['N/cache','N/search','N/log'], function(cache, search, log){

  var CONFIG_CACHE = 'companyConfig';

  function getConfig(key){
    var c = cache.getCache({name: CONFIG_CACHE, scope: cache.Scope.PUBLIC});
    return c.get({
      key: 'cfg_' + key,
      loader: function(){
        // Only called on cache MISS — once per hour at most
        var r = search.create({
          type: 'customrecord_config',
          filters: [['custrecord_cfg_key','is', key]],
          columns: ['custrecord_cfg_value']
        }).run().getRange({start:0, end:1});

${sh2('📄','User Event — Complete Template')}
${codeBlock('JavaScript — User Event Script', `/**
 * @NApiVersion 2.x
 * @NScriptType UserEventScript
 * @NModuleScope SameAccount
 */
define(['N/record','N/search','N/log','N/email','N/runtime','N/error'],
function(record, search, log, email, runtime, error){

  function beforeLoad(context){
    if(context.type !== context.UserEventType.VIEW &&
       context.type !== context.UserEventType.EDIT &&
       context.type !== context.UserEventType.CREATE) return;

    var form = context.form;
    var user = runtime.getCurrentUser();

    // Hide field for non-admin roles
    if(user.role !== 3){
      var costField = form.getField({id:'custbody_internal_cost'});
      if(costField) costField.updateDisplayType({displayType:'hidden'}); // field may not be on this form
    }
    // Add custom button (calls Client Script function)
    form.clientScriptModulePath = './cs_process_button.js'; // where onProcess lives
    form.addButton({id:'custpage_btn_process', label:'Process', functionName:'onProcess'});
  }

  function beforeSubmit(context){
    if(context.type !== context.UserEventType.CREATE &&
       context.type !== context.UserEventType.EDIT) return;
    try {
      var rec  = context.newRecord;
      var dept = rec.getValue({fieldId:'department'});
      if(!dept){
        throw error.create({
          name:     'MISSING_DEPT',
          message:  'Department is required.',
          notifyOff: true
        });
      }
      // Stamp approval info when approved
      if(rec.getValue({fieldId:'approvalstatus'}) === '2'){
        rec.setValue({fieldId:'custbody_approved_date', value: new Date()});
        rec.setValue({fieldId:'custbody_approved_by',   value: runtime.getCurrentUser().id});
      }
    } catch(e){
      log.error('beforeSubmit', e.message);
      throw e; // Re-throw to block save and show error to user
    }
  }

  function afterSubmit(context){
    // SAVE IS COMMITTED — never throw here
    if(context.type !== context.UserEventType.CREATE) return;
    try {
      var recId  = context.newRecord.id;
      var entity = context.newRecord.getValue({fieldId:'entity'});

      // lookupFields: 1u vs 10u for record.load()
      var cust = search.lookupFields({
        type: search.Type.CUSTOMER, id: entity,
        columns: ['salesrep','companyname']
      });
      if(cust.salesrep && cust.salesrep[0]){

${codeBlock('JavaScript — Map/Reduce Script', `/**
 * @NApiVersion 2.x
 * @NScriptType MapReduceScript
 * Script Param: custscript_batch_date (Date)
 */
define(['N/search','N/record','N/log','N/email','N/runtime'],
function(search, record, log, email, runtime){

  function getInputData(){
    // CRITICAL: Return a search REFERENCE, not an array.
    // NetSuite streams results into map() — handles millions of records.
    // WRONG: return s.run().getRange({start:0,end:4000}) ← loads into memory
    var batchDate = runtime.getCurrentScript()
      .getParameter({name:'custscript_batch_date'}) || new Date();

    return search.create({
      type: search.Type.VENDOR_BILL,
      filters: [
        ['status','anyof','VendBill:A'], 'AND',
        ['duedate','onorbefore', batchDate], 'AND',
        ['mainline','is','T']
      ],
      columns: ['tranid','entity','amount','duedate']
    });
  }

  function map(context){
    var r       = JSON.parse(context.value);
    var vendorId= r.values.entity.value;
    // Key = vendor → all bills for same vendor grouped in reduce()
    context.write({
      key:   vendorId,
      value: JSON.stringify({id: r.id, amount: parseFloat(r.values.amount)})
    });
  }

  function reduce(context){
    var bills = context.values.map(function(v){ return JSON.parse(v); });
    var total = bills.reduce(function(s,b){ return s + b.amount; }, 0);
    try {
      bills.forEach(function(b){
        record.submitFields({
          type:   record.Type.VENDOR_BILL,
          id:     b.id,
          values: {memo: 'Auto-scheduled. Vendor total: $' + total.toFixed(2)}
        });
        log.audit('Processed', 'Vendor:'+context.key+' Bill:'+b.id);
      });
    } catch(e){
      log.error('Reduce - Vendor ' + context.key, e.message);
      // Don't re-throw — log and continue with next vendor
    }
  }

  function summarize(context){
    var mapErr = 0, redErr = 0;
    context.mapSummary.errors.iterator().each(function(k,e){
      log.error('Map:'+k, e); mapErr++; return true;
    });
    context.reduceSummary.errors.iterator().each(function(k,e){
      log.error('Red:'+k, e); redErr++; return true;
    });
    log.audit('Complete', JSON.stringify({
      vendors:  context.reduceSummary.keys.count,
      mapErrors:mapErr, reduceErrors:redErr,
      govUsed:  context.usage, seconds: context.reduceSummary.seconds
    }));
    if(mapErr + redErr > 0){
      email.send({author:-5, recipients:['finance@company.com'],
        subject: 'Bill Batch: '+(mapErr+redErr)+' errors',
        body: 'Check Script Execution Log for details.'
      });
    }
  }

  return {getInputData, map, reduce, summarize};
});`, 'Streaming getInputData, keyed map/reduce, error classification in summarize')}

${codeBlock('JavaScript — RESTlet', `/**
 * @NApiVersion 2.x
 * @NScriptType Restlet
 */
define(['N/record','N/search','N/log','N/error'], function(record, search, log, error){

  // Called when external system POSTs to this endpoint
  function doPost(requestBody){
    try {
      log.audit('RESTlet inbound', JSON.stringify(requestBody));

      var extId  = requestBody.externalId;
      var status = requestBody.status;
      if(!extId) throw error.create({name:'MISSING_EXT_ID', message:'externalId required'});

      // Find SO by External ID
      var r = search.create({
        type: search.Type.SALES_ORDER,
        filters: [['externalid','is', extId]],
        columns: ['internalid','status']
      }).run().getRange({start:0, end:1});

      if(!r.length) throw error.create({name:'NOT_FOUND', message:'SO not found: '+extId});

      var soId = r[0].getValue('internalid');

      // Update the record
      record.submitFields({
        type:   record.Type.SALES_ORDER,
        id:     soId,
        values: {custbody_ext_status: status}
      });

      return {success: true, internalId: soId};

    } catch(e){
      log.error('RESTlet Error', e.message);
      return {success: false, error: e.message}; // Return 200 with error in body
    }
  }

  return {post: doPost};
});`, 'Receive webhook, find record by External ID, update field')}`;

  SUM(CASE WHEN TRUNC(SYSDATE) - t.duedate BETWEEN 1 AND 30  THEN tal.amountunpaid ELSE 0 END) AS d1_30,

  SUM(CASE WHEN TRUNC(SYSDATE) - t.duedate BETWEEN 61 AND 90 THEN tal.amountunpaid ELSE 0 END) AS d61_90,
  SUM(CASE WHEN TRUNC(SYSDATE) - t.duedate > 90              THEN tal.amountunpaid ELSE 0 END) AS d90plus,
  SUM(tal.amountunpaid) AS total_open

JOIN transactionaccountingline tal ON tal.transaction = t.id
JOIN customer c ON c.id = t.entity
WHERE t.type = 'CustInvc'
  AND t.posting = 'T'
  AND t.voided  = 'F'

function getQuizBank(){
  if(window._quizBank) return window._quizBank;
  const tmp = document.createElement('div');
  tmp.innerHTML = PAGES.interview();
  const bank = [];
  let cat = 'General';

      const q = sum.textContent.replace(num ? num.textContent : '', '').trim();
      const aEl = el.querySelector('.qa-a');
      bank.push({ q: q, a: aEl ? aEl.innerHTML : '', cat: cat });
    }
  });
  window._quizBank = bank;
  return bank;
}

PAGES.quiz = function(){
  const bank = getQuizBank();
  const cats = [];
  bank.forEach(function(x){ if(cats.indexOf(x.cat) < 0) cats.push(x.cat); });
  return hero('Reference · Practice', 'Quiz / Flashcard Mode', 'Active recall beats re-reading. Draw random questions from the ' + bank.length + '-question bank, answer out loud, self-grade — missed cards return later in the deck (spaced repetition).', ['Active Recall','Self-Graded','Spaced Repetition']) +
  '<div class="quiz-setup" id="quiz-setup">' +
    '<div class="quiz-setup-label">Categories (' + cats.length + ' — tap to toggle, none selected = all)</div>' +
    '<div class="quiz-cats" id="quiz-cats">' +
      cats.map(function(c){ return '<span class="quiz-cat" onclick="this.classList.toggle(\'on\')">' + esc(c) + '</span>'; }).join('') +
    '</div>' +
    '<div class="quiz-setup-label">Deck size</div>' +
    '<div class="quiz-counts">' +
      [10,25,50].map(function(n){ return '<button class="quiz-count' + (n===25?' on':'') + '" data-n="' + n + '" onclick="quizCount(this)">' + n + '</button>'; }).join('') +
      '<button class="quiz-count" data-n="0" onclick="quizCount(this)">All</button>' +
    '</div>' +
    '<button class="quiz-start" onclick="quizStart()">Start Quiz &rarr;</button>' +
  '</div>' +
  '<div id="quiz-area"></div>';
};

window._quiz = null;

function quizCount(btn){
  document.querySelectorAll('.quiz-count').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
}

function quizStart(){
  const bank = getQuizBank();
  const selected = [];
  document.querySelectorAll('#quiz-cats .quiz-cat.on').forEach(function(el){ selected.push(el.textContent); });
  let pool = selected.length ? bank.filter(function(x){ return selected.indexOf(x.cat) >= 0; }) : bank.slice();
  // Fisher-Yates shuffle
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  const nBtn = document.querySelector('.quiz-count.on');
  const n = nBtn ? parseInt(nBtn.dataset.n, 10) : 25;
  if(n > 0) pool = pool.slice(0, n);
  if(!pool.length){ return; }
  window._quiz = { deck: pool, total: pool.length, ok: 0, miss: 0, seen: 0, revealed: false };
  document.getElementById('quiz-setup').style.display = 'none';
  quizRenderCard();
}

function quizRenderCard(){
  const s = window._quiz;
  const area = document.getElementById('quiz-area');
  if(!s.deck.length){
    const pct = s.seen ? Math.round(s.ok / s.seen * 100) : 0;
    area.innerHTML = '<div class="quiz-card quiz-done">' +
      '<div class="quiz-score">' + pct + '%</div>' +
      '<p>' + s.ok + ' correct · ' + s.miss + ' missed (' + s.seen + ' answers graded)</p>' +
      '<div class="quiz-actions" style="justify-content:center">' +
        '<button class="quiz-btn quiz-btn-reveal" onclick="goTo(\'quiz\')">New Quiz</button>' +
        '<button class="quiz-btn quiz-btn-quit" onclick="goTo(\'interview\')">Back to Q&amp;A</button>' +
      '</div></div>';
    return;
  }
  const card = s.deck[0];
  const done = s.total - s.deck.length;
  area.innerHTML =
    '<div class="quiz-hud">' +
      '<span>Card ' + (done + 1) + ' / ' + s.total + '</span>' +
      '<div class="quiz-progress"><div class="quiz-progress-fill" style="width:' + (done / s.total * 100) + '%"></div></div>' +
      '<span class="hud-ok">&#10003; ' + s.ok + '</span>' +
      '<span class="hud-miss">&#10007; ' + s.miss + '</span>' +
    '</div>' +
    '<div class="quiz-card">' +
      '<div class="quiz-cat-tag">' + esc(card.cat) + '</div>' +
      '<div class="quiz-q">' + esc(card.q) + '</div>' +
      '<div id="quiz-answer"></div>' +
      '<div class="quiz-actions" id="quiz-actions">' +
        '<button class="quiz-btn quiz-btn-reveal" onclick="quizReveal()">Show Answer</button>' +
        '<button class="quiz-btn quiz-btn-quit" onclick="goTo(\'quiz\')">Quit</button>' +
      '</div>' +
    '</div>';
}

function quizReveal(){
  const card = window._quiz.deck[0];
  document.getElementById('quiz-answer').innerHTML = '<div class="quiz-a">' + card.a + '</div>';
  document.getElementById('quiz-actions').innerHTML =
    '<button class="quiz-btn quiz-btn-ok" onclick="quizGrade(true)">&#10003; Got it</button>' +
    '<button class="quiz-btn quiz-btn-miss" onclick="quizGrade(false)">&#10007; Missed — repeat later</button>' +
    '<button class="quiz-btn quiz-btn-quit" onclick="goTo(\'quiz\')">Quit</button>';
}

function quizGrade(ok){
  const s = window._quiz;
  const card = s.deck.shift();
  s.seen++;
  if(ok){ s.ok++; }
  else {
    s.miss++;
    // spaced repetition lite: reinsert 4-7 cards ahead
    const pos = Math.min(s.deck.length, 4 + Math.floor(Math.random() * 4));
    s.deck.splice(pos, 0, card);
    s.total++; // it will be seen again
  }
  quizRenderCard();
}

// storage helper: window.storage if available (Claude artifact), else in-memory
window._spMem = {};
async function spGetDone(){
  try {
    if(window.storage){
      const r = await window.storage.get('studyplan_done');
      return r && r.value ? JSON.parse(r.value) : {};
    }
  } catch(e){}
  return window._spMem;
}
async function spSetDone(state){
  window._spMem = state;
  try {
    if(window.storage){ await window.storage.set('studyplan_done', JSON.stringify(state)); }
  } catch(e){}
}

PAGES.studyplan = function(){
  const totalDays = STUDY_PLAN.reduce(function(n,w){ return n + w.days.length; }, 0);
  let html = hero('Reference · Practice', '30-Day Study Plan', 'A sequenced path through all ' + NAV.flatMap(function(g){return g.items;}).length + ' pages: foundations first, then technical, then functional depth, then delivery — finishing with a 4-day interview sprint. Check off days as you go.', ['Sequenced','Hands-On Tasks','Progress Tracked']) +
  '<div class="sp-progress-wrap">' +
    '<div class="sp-progress-label"><span>Progress</span><span id="sp-pct">0 / ' + totalDays + ' days</span></div>' +
    '<div class="sp-progress"><div class="sp-progress-fill" id="sp-fill" style="width:0%"></div></div>' +
  '</div>' +
  note('w','💡','How to use this','Each day pairs reading with a hands-on or recall task — the task is the part that builds competence, not the reading. Roughly 1–2 hours/day. Checkbox state persists when viewed in the Claude app; in a plain browser it resets on reload.');
  STUDY_PLAN.forEach(function(week){
    html += '<div class="sp-week">' + week.w + '</div>';
    week.days.forEach(function(day){
      const links = day.p.map(function(pid){
        const label = NAV.flatMap(function(g){return g.items;}).find(function(i){return i.id===pid;});
        return '<span class="sp-page" onclick="goTo(\'' + pid + '\')">' + (label ? label.l : pid) + '</span>';
      }).join('');
      html += '<div class="sp-day" id="sp-day-' + day.d + '">' +
        '<input type="checkbox" class="sp-check" onchange="spToggle(' + day.d + ', this.checked)">' +
        '<div class="sp-body">' +
          '<div class="sp-title"><span class="sp-num">DAY ' + day.d + '</span>' + day.t + '</div>' +
          '<div class="sp-pages">' + links + '</div>' +
          '<div class="sp-task"><strong>Task:</strong> ' + day.k + '</div>' +
        '</div></div>';
    });
  });
  // async-load saved state after render
  setTimeout(spLoadState, 0);
  return html;
};

async function spLoadState(){
  const state = await spGetDone();
  let done = 0, total = 0;
  STUDY_PLAN.forEach(function(w){ w.days.forEach(function(d){
    total++;
    const el = document.getElementById('sp-day-' + d.d);
    if(!el) return;
    const checked = !!state[d.d];
    el.querySelector('.sp-check').checked = checked;
    el.classList.toggle('done', checked);
    if(checked) done++;
  }); });
  const pct = document.getElementById('sp-pct');
  const fill = document.getElementById('sp-fill');
  if(pct) pct.textContent = done + ' / ' + total + ' days';
  if(fill) fill.style.width = (total ? done / total * 100 : 0) + '%';
}

async function spToggle(dayNum, checked){
  const state = await spGetDone();
  if(checked) state[dayNum] = true; else delete state[dayNum];
  await spSetDone(state);
  const el = document.getElementById('sp-day-' + dayNum);
  if(el) el.classList.toggle('done', checked);
  spLoadState();
}

      ['Pick the integration topology.', 'At this volume I default to hub-and-spoke via an iPaaS (Celigo/Boomi) rather than point-to-point SuiteScript — the connector handles retry, error dashboards, and rate limiting that I would otherwise rebuild. I would only build custom if the logic is highly bespoke or licensing is prohibitive.'],

      ['Eliminate the per-record API call.', 'Four million individual calls is the core flaw. Most pricing APIs offer bulk/batch endpoints — call once per N records. Better: does the price actually change per record, or per item/customer/date? Usually you can fetch a price set once, cache it (N/cache or a staging custom record), and look up locally. This alone may cut 4M calls to a few hundred.'],
      ['Let Map/Reduce do its job.', 'getInputData returns a search or query object the framework streams, rather than a giant in-memory array. Each map invocation has 1,000 units and each reduce 5,000; yielding only happens between invocations, so a failure means one invocation is doing too much — push external calls and heavy work into properly chunked stages, or pre-stage the enriched data.'],

      ['Gate go-live on objective criteria.', 'Reconciliation tied out, zero open critical/high defects, UAT signed off per process area, integrations validated, cutover rehearsed. Sign-off is the basis for go/no-go, not a feeling.'],

    ]) +

      'Applying one recognition rule to all four elements.',
      'Tying recognition timing to billing timing.',

// Mock interview state + logic
window._mockLevel = 'balanced';
window._mockHistory = [];

function setMockLevel(btn){
  document.querySelectorAll('.mock-lvl').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  window._mockLevel = btn.dataset.level;
}
function mockSuggest(btn){
  document.getElementById('mock-input').value = btn.textContent;
  document.getElementById('mock-input').focus();
}

function mockSystemPrompt(){
  const base = "You are a candidate in a NetSuite Techno-Functional consultant job interview. The USER is the interviewer. Answer their questions and respond to their pushback AS THE CANDIDATE. Be concrete and technically accurate about NetSuite (SuiteScript, SuiteFlow, REST/SOAP, SuiteQL, GL/double-entry accounting, OTC/PTP, inventory/manufacturing, ARM revenue recognition, OneWorld, governance limits, data migration, implementation methodology). Use a structured 'here's how I'd think through it' approach for scenario questions. When the interviewer pushes back, defend your answer if it's sound, or gracefully revise it if their challenge is valid - never get defensive. Admit honestly when something would depend on specifics or when you're unsure, and say how you'd find out, rather than bluffing. Keep answers focused: 2-5 short paragraphs or a tight bulleted reasoning chain, not an essay. Do not break character or mention being an AI.";
  if(window._mockLevel === 'tough') return base + " The interviewer is senior and will push hard on trade-offs, edge cases, and failure modes. Anticipate the follow-up and address the hard part proactively.";
  if(window._mockLevel === 'architect') return base + " The interviewer is a principal architect grilling you on scale, cost trade-offs, failure modes, idempotency, governance, and system design. Show architectural judgment - topology choices, what you'd buy vs build, how it fails and recovers, and the numbers behind the decision.";
  return base;
}

function mockRender(){
  const el = document.getElementById('mock-thread');
  el.innerHTML = window._mockHistory.map(function(m){
    const who = m.role === 'user' ? 'You (Interviewer)' : 'Claude (Candidate)';
    const cls = m.role === 'user' ? 'mock-msg mock-q' : 'mock-msg mock-a';
    const text = m.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    return '<div class="'+cls+'"><div class="mock-who">'+who+'</div><div class="mock-text">'+text+'</div></div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

async function mockSend(){
  const input = document.getElementById('mock-input');
  const q = input.value.trim();
  if(!q) return;
  const sendBtn = document.getElementById('mock-send');
  input.value = '';
  window._mockHistory.push({role:'user', content:q});
  // typing indicator
  window._mockHistory.push({role:'assistant', content:'…thinking…'});
  mockRender();
  sendBtn.disabled = true; sendBtn.textContent = '…';

  try {
    const messages = window._mockHistory
      .filter(function(m){ return !(m.role==='assistant' && m.content==='…thinking…'); })
      .map(function(m){ return {role:m.role, content:m.content}; });

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: mockSystemPrompt(),
        messages: messages
      })
    });
    const data = await res.json();
    let answer = '';
    if(data && data.content){
      answer = data.content.map(function(b){ return b.type==='text'?b.text:''; }).filter(Boolean).join('\n');
    }
    if(!answer) answer = '(No response — try rephrasing your question.)';
    // replace the thinking placeholder
    window._mockHistory[window._mockHistory.length-1] = {role:'assistant', content:answer};
  } catch(e){
    window._mockHistory[window._mockHistory.length-1] = {role:'assistant', content:'(Error reaching the model. This interactive mode needs to run inside the Claude app artifact view.)'};
  }
  mockRender();
  sendBtn.disabled = false; sendBtn.textContent = 'Ask →';
  input.focus();
}

// Enter to send (Shift+Enter for newline)
document.addEventListener('keydown', function(e){
  if(e.target && e.target.id === 'mock-input' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    mockSend();
  }
});

    ['Explain the User Event entry points.',
     'beforeLoad (record opens — customize the form), beforeSubmit (before DB write — validate, set fields, can block save), afterSubmit (after commit — emails, related records, cannot block save).'],
    ['Why never throw an error in afterSubmit?',
     'The save is already committed by the time afterSubmit runs, so throwing does not roll it back. Wrap it in try/catch, log errors, and design for failure tolerance. Use beforeSubmit to block bad saves.'],
    ['Client Script vs User Event Script?',
     'Client Script runs in the browser for instant UI feedback. It is still governed (1,000 units) and can read or write records through N/record and N/search, but each call is a server round trip that slows the form. User Event runs server-side on the save lifecycle and fires in every context (UI, CSV import, web services, other scripts), whereas a Client Script only runs when a person has the form open. Put rules that must always hold in a User Event.'],
    ['When do you use a Map/Reduce script?',
     'For bulk work that would exhaust a Scheduled script. Map/Reduce splits the job into small invocations with their own limits (map 1,000, reduce 5,000), runs them in parallel across processors, and yields automatically between jobs, so the total run is not capped. The design rule: one record or one key per invocation.'],
    ['Explain the four Map/Reduce stages.',
     'getInputData returns the input set, ideally a search or query object that the framework runs and streams for you (a huge in-memory array risks memory and governance limits); map processes each result and emits key/value pairs; reduce processes all values for one key; summarize runs once at the end for error reporting and notifications.'],
    ['record.load() vs search.lookupFields()?',
     'load() costs ~10 units and loads the whole record; lookupFields() costs ~1 unit and reads only specified columns. For a few fields, always use lookupFields() — a 10x saving.'],
    ['What are governance units and the limits?',
     'The usage budget per execution. Client, User Event and Suitelet scripts get 1,000 units, RESTlets 5,000, Scheduled 10,000. Map/Reduce is limited per invocation: getInputData and summarize 10,000, each map 1,000, each reduce 5,000. On a transaction: load 10, save 20, submitFields 10, lookupFields 1. Exceeding a budget throws SSS_USAGE_LIMIT_EXCEEDED.'],
    ['How do you reduce governance usage?',
     'Use search instead of load loops, lookupFields for reads, submitFields for partial updates, summary searches for aggregation, N/cache for config, and Map/Reduce for bulk. Filter narrowly, select only needed columns.'],
    ['Standard vs dynamic mode?',
     'Dynamic mode (isDynamic:true) runs field sourcing — dependent fields auto-populate (price, description). Standard mode does not source, so it is faster for batch work. Use dynamic when creating transaction lines needing sourcing.'],
    ['What is a RESTlet and when do you use it?',
     'A custom SuiteScript REST endpoint (get/post/put/delete). Use it to receive webhooks or expose aggregated/custom data the standard REST API cannot provide.'],
    ['What is a Suitelet?',
     'A server-side script rendering a custom UI page inside NetSuite via N/ui/serverWidget — for dashboards, admin tools, and custom forms not achievable with standard records.'],
    ['How do you handle errors in SuiteScript?',
     'try/catch around risky operations, classify errors (governance -> reschedule, data -> skip and dead-letter, permission -> alert, unknown -> log full stack and halt), use N/log for structured logging, and route failed records to a Dead Letter Queue.'],
    ['What is N/cache used for?',
     'Server-side caching of expensive, infrequently-changing data (config records, current period) with a TTL you set on put. Entries can be evicted before the TTL, so always read through get() with a loader, which runs only on a cache miss and refills the cache. That cuts repeated searches dramatically.'],
    ['How do you make a SuiteScript integration idempotent?',
     'Use upsert by external ID rather than create, and store the sender\'s idempotency key to skip duplicates — so re-running does not create duplicate records.'],
    ['submitFields() vs load()+save()?',
     'submitFields() updates body fields without loading the record: 10 units on a transaction versus 30 for load (10) + save (20). On standard records it can only set fields that support inline editing, it cannot touch sublist lines, and it runs as an inline edit, so User Events still fire with type XEDIT and only the changed fields on newRecord. Use load()+save() when you need sublists, sourcing or full validation.'],
    ['What do @NApiVersion and @NScriptType do?',
     'JSDoc tags at the top of every SuiteScript 2.x file declaring the API version (e.g. 2.1) and the script type. Both are required for the script to deploy and be interpreted correctly.'],
    ['What is the difference between N/record and N/currentRecord?',
     'N/record is server-side CRUD (create, load, save). N/currentRecord is client-side, giving access to the record currently loaded in the browser with no server roundtrip — used in Client Scripts.'],
  ]) +

  cat('🔀', 'SuiteFlow & Workflows', [
    ['What is SuiteFlow?',

    ['What are the core components of a workflow?',

    ['SuiteFlow vs SuiteScript — when to use which?',

    ['How do you create time-based escalation in a workflow?',
