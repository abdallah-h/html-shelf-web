خلال 24 ساعة: تأمين موقع الحادث وتصويره وجمع الشهادات
خلال أيام   : بدء التحقيق في السبب الجذري
              متابعة الحالة الطبية وصرف المستحقات
لاحقًا      : تقرير نهائي وإجراء تصحيحي وتحديث تقييم المخاطر</div>
<div class="box warn"><span class="lbl">الأخطاء التي تُكلّف كثيرًا</span>
<ul style="margin:6px 0 0">
<li><strong>التأخر في الإبلاغ الرسمي</strong> — لكل جهة تأمين مهلة محددة، وتجاوزها قد يُسقط حقوقًا أو يُحمّل الشركة التكلفة كاملة.</li>
<li><strong>العلاج خارج الجهة المعتمدة</strong> بلا مبرر طارئ موثق.</li>
<li><strong>الضغط على المصاب لتسجيلها كإصابة خارج العمل</strong> — مخالفة جسيمة وتنكشف غالبًا.</li>
<li><strong>عدم تصوير الموقع</strong> قبل تنظيفه — تضيع الأدلة نهائيًا.</li>
</ul></div>

<h2>الحقوق النمطية للمصاب</h2>
<div class="tbl"><table><thead><tr><th>الحق</th><th>الوصف</th></tr></thead><tbody>
<tr><td>العلاج</td><td>على نفقة جهة التأمين حتى الشفاء أو ثبوت العجز</td></tr>
<tr><td>تعويض الأجر أثناء التخلف</td><td>نسبة من الأجر طوال فترة العلاج والعجز المؤقت</td></tr>
<tr><td>تعويض العجز الجزئي</td><td>وفق نسبة العجز المقدّرة طبيًا</td></tr>
<tr><td>معاش العجز الكامل</td><td>عند ثبوت عدم القدرة على العمل</td></tr>
<tr><td>الحماية من الفصل</td><td>لا يجوز الفصل بسبب الإصابة أثناء فترة العلاج</td></tr>
</tbody></table></div>

<h2>العجز والعودة للعمل</h2>
<div class="tbl"><table><thead><tr><th>الحالة</th><th>الاستجابة المهنية</th></tr></thead><tbody>
<tr><td>عجز مؤقت</td><td>إجازة مرضية مدفوعة ثم عودة تدريجية بمهام مخففة</td></tr>
<tr><td>عجز جزئي مستقر</td><td>البحث عن دور بديل مناسب لقدرته قبل التفكير في إنهاء الخدمة</td></tr>
<tr><td>عجز كامل</td><td>إنهاء للأسباب الصحية مع كامل الحقوق التأمينية والمستحقات</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">مبدأ «العودة للعمل» (Return to Work)</span><p>الشركات الأفضل لا تنتظر التعافي الكامل — بل تصمم <strong>مهام معدّلة مؤقتة</strong> تناسب القدرة الحالية. الفائدة مزدوجة: المصاب يحافظ على دخله وانتمائه ولا يدخل في عزلة، والشركة تحتفظ بخبرته وتخفض تكلفة الغياب الطويل.</p></div>

<h2>وفاة موظف — دليل إجرائي وإنساني</h2>
<div class="tbl"><table><thead><tr><th>المحور</th><th>ما يجب فعله</th></tr></thead><tbody>
<tr><td>التحقق</td><td>تأكيد الخبر رسميًا قبل أي إعلان</td></tr>
<tr><td>الإبلاغ</td><td>إبلاغ الفريق شخصيًا لا برسالة جماعية باردة</td></tr>
<tr><td>منسق واحد</td><td>شخص واحد يتواصل مع الأسرة حتى لا تتلقى اتصالات متكررة</td></tr>
<tr><td>إيقاف الأنظمة</td><td>وقف فوري لكل التنبيهات الآلية والتقييمات</td></tr>
<tr><td>المستحقات</td><td>الأجر · رصيد الإجازات · مكافأة نهاية الخدمة · تعويض الوفاة إن كانت إصابة عمل</td></tr>
<tr><td>الورثة</td><td>الصرف وفق المستندات الشرعية والقانونية المطلوبة — لا بالاجتهاد</td></tr>
<tr><td>معاش المستحقين</td><td>مساعدة الأسرة في إجراءات التأمينات لا تركها تتعامل وحدها</td></tr>
<tr><td>الأغراض الشخصية</td><td>جمعها باحترام وتسليمها بالتنسيق مع الأسرة</td></tr>
<tr><td>دعم الفريق</td><td>مساحة للحداد · مرونة في الحضور · دعم نفسي عند الحاجة</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">ما يُنسى دائمًا</span><p>الأسرة في هذه اللحظة لا تعرف الإجراءات ولا الجهات ولا المستندات. <strong>أكثر ما تقدمه الشركة قيمة ليس المبلغ — بل شخص يتابع معهم الإجراءات خطوة بخطوة.</strong> وهذا لا يكلف شيئًا ويُذكر لسنوات.</p></div>

<h2>مؤشرات المتابعة</h2>
<div class="chips"><span class="chip">عدد الإصابات وشدتها</span><span class="chip">أيام العمل الضائعة</span><span class="chip">زمن الإبلاغ الرسمي</span><span class="chip">نسبة الحالات المغلقة في الموعد</span><span class="chip">نسبة العودة للعمل</span><span class="chip">تكرار الإصابة في نفس الموقع</span></div>

<h2>الفحص الطبي — قبل وأثناء وبعد</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الغرض</th><th>نقطة انتباه</th></tr></thead><tbody>
<tr><td>فحص ما قبل التعيين</td><td>التأكد من اللياقة لمتطلبات الدور</td><td>يجب أن يقتصر على ما يخص الوظيفة فعلًا — لا استقصاء صحي شامل</td></tr>
<tr><td>الفحص الطبي الدوري</td><td>الكشف المبكر عن أمراض مهنية</td><td>إلزامي لفئات معينة، ونتائجه تُحفظ في ملف طبي منفصل</td></tr>
<tr><td>فحص العودة للعمل</td><td>بعد إصابة أو مرض طويل</td><td>يحدد المهام المناسبة لا صلاحية العمل من عدمها فقط</td></tr>
<tr><td>فحص نهاية الخدمة</td><td>توثيق الحالة الصحية عند الخروج</td><td>يحمي الطرفين من مطالبات لاحقة بأمراض مهنية</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">قاعدة خصوصية</span><p>نتائج الفحوص بيانات صحية شديدة الحساسية. المدير المباشر يحتاج معرفة <strong>القيود الوظيفية فقط</strong> («لا يرفع أوزانًا فوق 10 كجم») لا <strong>التشخيص الطبي</strong>. الخلط بينهما خرق للخصوصية وباب للتمييز.</p></div>

<h2>الدعم النفسي في مكان العمل</h2>
<div class="tbl"><table><thead><tr><th>متى يُحتاج</th><th>الاستجابة المناسبة</th></tr></thead><tbody>
<tr><td>بعد حادث أو وفاة زميل</td><td>جلسة تفريغ جماعية اختيارية + دعم فردي لمن يطلب</td></tr>
<tr><td>بعد تسريح جماعي</td><td>دعم للمغادرين وللباقين معًا</td></tr>

<div class="box tip"><span class="lbl">حدود دور HR</span><p>ممارس HR ليس معالجًا نفسيًا ولا يجوز أن يتصرف كذلك. دوره ثلاثة أشياء فقط: <strong>الملاحظة</strong> (تغيّر ملحوظ في السلوك أو الأداء) · <strong>الإتاحة</strong> (قناة إحالة معروفة وسرية) · <strong>إزالة العائق</strong> (مرونة وعبء عمل واقعي). التشخيص والعلاج خارج نطاقه تمامًا.</p></div>

<h2>القواعد التي تمنع معظم النزاعات</h2>
<div class="grid">
<div class="card"><h4>الاستحقاق</h4><p>متى يبدأ؟ هل يُحسب بالتناسب في السنة الأولى؟ هل تُحتسب العطلات داخل الإجازة؟</p></div>
<div class="card"><h4>الترحيل</h4><p>هل يُرحَّل الرصيد؟ بأي سقف؟ ولأي مدة قبل أن يسقط؟</p></div>
<div class="card"><h4>البدل النقدي</h4><p>متى يُصرف؟ على أي أجر يُحسب: الأساسي أم الشامل؟</p></div>
<div class="card"><h4>حق التحديد</h4><p>لمن حق تحديد موعد الإجازة عند الخلاف — وفق مقتضيات العمل غالبًا</p></div>
<div class="card"><h4>الاستدعاء</h4><p>هل يجوز استدعاء الموظف من إجازته؟ وما تعويضه؟</p></div>
<div class="card"><h4>التداخل</h4><p>ماذا لو مرض أثناء إجازته السنوية؟ هل تتحول لمرضية؟</p></div>
</div>
<div class="box ex"><span class="lbl">حالات عملية شائعة</span>
<p><strong>مرض أثناء الإجازة السنوية:</strong> كثير من اللوائح تسمح بتحويل الأيام إلى مرضية بتقرير طبي معتمد، فتُعاد للرصيد السنوي. حدد القاعدة كتابةً وإلا تحولت لنزاع متكرر.</p>
<p><strong>عطلة رسمية داخل الإجازة:</strong> القاعدة الشائعة ألا تُحتسب ضمن أيام الإجازة السنوية — لكنها تختلف، فانص عليها صراحةً.</p>
<p><strong>إجازة مرفوضة لمقتضيات العمل:</strong> الرفض المشروع يجب أن يقترن بـ<strong>موعد بديل مقترح</strong>، وإلا تحوّل إلى حرمان من حق.</p></div>

<h2>خطة الإجازات السنوية</h2>
<div class="ascii">نوفمبر  : كل قسم يعد خطة إجازات العام القادم
ديسمبر  : مراجعة التعارضات وضمان التغطية في كل فترة
يناير   : اعتماد الخطة وإعلانها
ربع سنوي: مراجعة الالتزام بالخطة وأرصدة المتأخرين
سبتمبر  : تنبيه أصحاب الأرصدة المرتفعة لاستخدامها</div>
<div class="box tip"><span class="lbl">لماذا خطة سنوية؟</span><p>بدونها يحدث أمران معًا: تكدّس الطلبات في نفس الفترات فتتعطل التغطية، وتراكم أرصدة لدى موظفين لا يجدون فرصة — وهو التزام مالي متراكم ومؤشر إنذار على الاحتراق.</p></div>

<h2>مؤشرات إدارة الإجازات</h2>

<li><strong>حد أقصى للاستقطاع الشهري</strong> يحمي دخل الموظف ويلتزم بحدود القانون.</li>
<li><strong>معايير معلنة</strong> للموافقة — لا قرارات فردية تُقرأ كمحاباة.</li>
<li><strong>نص صريح</strong> على تسوية الرصيد من المستحقات النهائية عند الخروج.</li>
<li><strong>سجل مركزي</strong> يمنع تعدد السلف لنفس الشخص دون علم.</li>
</ul>

<tr><td>علاوة الأداء</td><td>نتيجة التقييم</td><td>بلا معايير واضحة تتحول لمحاباة</td></tr>
<tr><td>علاوة الغلاء</td><td>التضخم وتكلفة المعيشة</td><td>تُدمج في الأساسي فتصعب مراجعتها لاحقًا</td></tr>

<h2>التأمين ضد البطالة (الحماية عند فقدان العمل)</h2>
<p>بعض الأنظمة التأمينية توفّر <strong>تعويض البطالة أو التأمين ضد البطالة</strong> يُصرف لفترة محددة لمن تنتهي خدمته لغير سبب يرجع إليه، بشروط تتعلق بمدة الاشتراك وسبب انتهاء الخدمة والتسجيل كباحث عن عمل.</p>
<div class="box tip"><span class="lbl">دور HR</span><p>عند إنهاء الخدمة لأسباب اقتصادية، <strong>أخبر الموظف بحقه في هذا التعويض ووجّهه لإجراءاته</strong>. كثيرون لا يعرفون أنه موجود ويفقدونه لتأخر التسجيل. معلومة واحدة في مقابلة الخروج قد تعني دخلًا لأشهر لأسرة كاملة — وهي أرخص ما يمكن أن تقدمه وأكثره أثرًا.</p></div>

/* ========== حقوق الموظف وقنوات صوته ========== */

html:`
<div class="box def"><span class="lbl">لماذا «الصوت» مهم</span><p>الموظف الذي لا يجد قناة داخلية لصوته يفعل واحدًا من ثلاثة: <strong>يستقيل</strong>، أو <strong>يبقى ويقلّل جهده</strong>، أو <strong>يصعّد للخارج</strong> (نقابة أو جهة رسمية أو قضاء أو منصات عامة). كل واحد من الثلاثة أغلى بكثير من قناة داخلية تعمل.</p></div>

<h2>حقوق أساسية يجب أن يعرفها كل موظف</h2>
<div class="tbl"><table><thead><tr><th>الحق</th><th>ماذا يعني عمليًا</th></tr></thead><tbody>
<tr><td>العلم بشروط عمله</td><td>نسخة من العقد واللائحة وسلّم الجزاءات ومعايير التقييم</td></tr>
<tr><td>الأجر في موعده</td><td>وقسيمة مفصّلة توضح كل بند</td></tr>
<tr><td>الاطلاع على ملفه</td><td>معرفة ما يُحفظ عنه وتصحيح ما هو خاطئ</td></tr>
<tr><td>الدفاع عن نفسه</td><td>لا جزاء بلا إخطار وتحقيق وفرصة رد</td></tr>
<tr><td>التظلم</td><td>الاعتراض على قرار يخصه عبر مسار معلن</td></tr>
<tr><td>بيئة آمنة</td><td>سلامة مهنية وحماية من التحرش والتمييز</td></tr>
<tr><td>عدم الانتقام</td><td>حماية عند الإبلاغ بحسن نية</td></tr>
<tr><td>الخصوصية</td><td>بياناته تُجمع بغرض محدد وتُحفظ بصلاحيات محددة</td></tr>
<tr><td>الراحة والإجازة</td><td>حق لا يجوز التنازل عنه</td></tr>
<tr><td>شهادة خبرة</td><td>عند انتهاء الخدمة ودون مقابل ودون عبارات مسيئة</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">إجراء بسيط عالي الأثر</span><p>صفحة واحدة تُسلَّم مع العقد بعنوان «حقوقك وواجباتك وكيف تُسمِع صوتك» تقلل نصف الاستفسارات والشكاوى — لأن معظمها ينشأ من الجهل بالإجراء لا من الظلم.</p></div>

<h2>قنوات الصوت — أربع طبقات</h2>
<div class="tbl"><table><thead><tr><th>القناة</th><th>مناسبة لـ</th><th>شرط نجاحها</th></tr></thead><tbody>
<tr><td><strong>الباب المفتوح</strong></td><td>الأسئلة والاقتراحات والانزعاج المبكر</td><td>أن يكون حقيقيًا لا شعارًا — ولا عواقب على من يستخدمه</td></tr>
<tr><td><strong>اجتماع فردي دوري</strong></td><td>متابعة مستمرة وتفريغ مبكر</td><td>انتظامه وعدم إلغائه لانشغال المدير</td></tr>
<tr><td><strong>التظلم الرسمي</strong></td><td>الاعتراض على قرار محدد</td><td>مسار مكتوب ومدد محددة ورد مُسبَّب</td></tr>
<tr><td><strong>قناة الإبلاغ المحمية</strong></td><td>مخالفات جسيمة وتحرش وفساد</td><td>سرية حقيقية وحماية من الانتقام</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">أخطر ما في «الباب المفتوح»</span><p>أن يكون شعارًا معلّقًا بينما أول من استخدمه دُوّن ضده انطباع سلبي. الموظفون يختبرون القناة مرة واحدة، وما يحدث للأول منهم <strong>يحدد سلوك الجميع</strong> بعد ذلك.</p></div>

<h2>لجنة التظلمات</h2>
<div class="tbl"><table><thead><tr><th>العنصر</th><th>التصميم السليم</th></tr></thead><tbody>
<tr><td>التشكيل</td><td>عضوية متنوعة تشمل من هم خارج خط تبعية المتظلم</td></tr>
<tr><td>الاختصاص</td><td>محدد كتابةً: ما الذي يمكن التظلم منه وما لا يمكن</td></tr>
<tr><td>المدد</td><td>مهلة للتظلم ومهلة للرد — كلاهما معلن</td></tr>
<tr><td>الشفافية</td><td>قرار مُسبَّب كتابةً يصل للمتظلم</td></tr>
<tr><td>الحياد</td><td>لا يشارك في نظر التظلم من اتخذ القرار محل الاعتراض</td></tr>
<tr><td>السرية</td><td>حماية أطراف الموضوع من التداول</td></tr>
</tbody></table></div>

<h2>الاعتراض على تقييم الأداء</h2>
<div class="ascii">1. حوار مع المدير المباشر أولًا      (يحل معظم الحالات)
2. طلب مراجعة مكتوب خلال مدة محددة
3. مراجعة من مدير أعلى أو HR بمعايير التقييم لا بالانطباع
4. قرار: تعديل التقييم أو تثبيته بتسبيب مكتوب
5. حق تدوين تعليق الموظف في الملف حتى لو ثُبّت التقييم</div>
<div class="box ex"><span class="lbl">النقطة الخامسة تحديدًا</span><p>حق الموظف في <strong>تدوين وجهة نظره في ملفه</strong> حتى بعد رفض اعتراضه إجراء بسيط لكنه يغيّر إحساس الناس بالنظام كله: هو يقول ضمنيًا «قد نختلف معك لكننا لا نطمس صوتك». وكثيرًا ما يكتفي المعترض بهذا الحق ولا يصعّد أبعد منه.</p></div>

<h2>التسوية الودية</h2>
<p>قبل أي تصعيد خارجي، التسوية الودية غالبًا أفضل للطرفين. مبادئها:</p>
<ul>
<li><strong>حساب واقعي للمستحقات</strong> — لا عرض متدنٍ يستفز ولا مبالغ فيه يُنشئ سابقة.</li>
<li><strong>وثيقة تسوية واضحة</strong> تحدد المصروف وما يُخلي الطرفين منه.</li>
<li><strong>عدم الضغط أو الاستعجال</strong> — التوقيع تحت ضغط قابل للطعن.</li>
<li><strong>احترام حدود التنازل</strong>: كثير من التشريعات تُبطل التنازل عن حقوق أساسية.</li>
<li><strong>الحفاظ على الكرامة</strong>: شهادة خبرة نظيفة وخروج محترم — يوفّران نزاعات أكثر مما يوفّره أي مبلغ.</li>
</ul>
<div class="box warn"><span class="lbl">تنبيه قانوني</span><p>الإبراء الموقّع أثناء سريان العقد أو خلال مدة قصيرة بعد انتهائه يقع باطلًا في تشريعات كثيرة. لا تعتمد على توقيع الموظف وحده كضمانة — استشر قانونيًا في صياغة أي تسوية.</p></div>

<h2>قياس صحة قنوات الصوت</h2>
<div class="tbl"><table><thead><tr><th>المؤشر</th><th>القراءة</th></tr></thead><tbody>
<tr><td>عدد التظلمات</td><td>الصفر ليس نجاحًا — بل غالبًا خوف أو جهل بالقناة</td></tr>
<tr><td>نسبة ما يُحل في المستويات الأولى</td><td>ارتفاعها دليل صحة</td></tr>
<tr><td>متوسط زمن الإغلاق</td><td>البطء يقتل الثقة أسرع من الرفض</td></tr>
<tr><td>نسبة التصعيد الخارجي</td><td>أي حالة تصل للخارج تعني أن القنوات الأربع فشلت</td></tr>
<tr><td>تكرار نفس الموضوع</td><td>مشكلة نظامية لا حالات فردية</td></tr>
</tbody></table></div>

<h2>البُعد الإنساني — ما يُهمَل دائمًا</h2>
<div class="box warn"><span class="lbl">حقيقة</span><p>لكثير من الناس، الوظيفة ليست مصدر دخل فقط بل <strong>هوية وشبكة اجتماعية وإيقاع يومي</strong>. الانتقال المفاجئ من 40 سنة عمل إلى فراغ كامل صدمة حقيقية موثقة أثرها على الصحة النفسية والجسدية. الشركة التي تُقدّم ورشة إعداد للتقاعد — عن التخطيط المالي والصحي وإدارة الوقت الجديد — تقدم شيئًا يُذكر لسنوات بتكلفة زهيدة.</p></div>

<tr><td>رغبة الموظف</td><td>هل يفهم أثر ذلك على قيمة معاشه؟ من واجبك التوضيح لا الإقناع</td></tr>
<tr><td>إعادة هيكلة</td><td>يجب أن يكون <strong>اختياريًا حقًا</strong> لا ضغطًا مقنّعًا</td></tr>
<tr><td>أسباب صحية</td><td>افحص بدائل تعديل الدور قبل الخروج</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">خطر التقاعد المبكر الجماعي</span><p>برنامج تقاعد مبكر مفتوح للجميع يُخرج غالبًا <strong>أفضل من لديهم بدائل</strong> ويُبقي من لا خيار أمامهم — عكس المقصود تمامًا. اجعله انتقائيًا بمعايير معلنة، أو اربطه بموافقة الإدارة على كل حالة.</p></div>

<div class="box def"><span class="lbl">القاعدة الأولى</span><p>قبل أي إجراء، <strong>شخّص الحالة</strong>. أغلب أخطاء HR في هذه المواقف سببها القفز إلى الإجراء التأديبي في حالة تحتاج حوارًا، أو الاكتفاء بحوار في حالة تحتاج تحقيقًا فوريًا. السلوك نفسه قد يكون عرضًا لأسباب مختلفة تمامًا.</p></div>

<h2>شجرة التشخيص</h2>
<div class="ascii">سلوك مزعج ظهر من موظف
        |
هل هو خطر فوري على شخص أو أصل؟
   نعم -> إجراء احترازي فوري + تحقيق  (عنف · تهديد · سرقة)
   لا   |
        v
هل السلوك مخالفة صريحة للائحة؟
   نعم -> مسار تأديبي موثق
   لا   |
        v
هل هو نمط متكرر أم واقعة منفردة؟
   منفردة -> حوار مباشر وتوضيح التوقع
   متكرر  |
          v
   هل يعرف أن سلوكه مشكلة؟
      لا  -> تغذية راجعة صريحة أولًا (كثيرون لا يعرفون)
      نعم -> هل يستطيع التغيير؟
              لا يستطيع -> تدريب أو تغيير دور
              لا يريد   -> مسار أداء/تأديب واضح العواقب</div>

<h2>الموظف الصعب — ستة أنماط</h2>
<div class="tbl"><table><thead><tr><th>النمط</th><th>السلوك الظاهر</th><th>ما وراءه غالبًا</th><th>التعامل</th></tr></thead><tbody>
<tr><td><strong>المعترض الدائم</strong></td><td>يرفض كل جديد ويجد عيبًا في كل مقترح</td><td>خوف من فقد المكانة أو تجارب تغيير سابقة فاشلة</td><td>أشركه مبكرًا في التصميم لا في التنفيذ فقط</td></tr>
<tr><td><strong>النجم المتعالي</strong></td><td>أداء عالٍ وسلوك مسيء للزملاء</td><td>تسامح سابق معه بسبب نتائجه</td><td>وضّح أن النتيجة والسلوك معيار واحد لا معياران</td></tr>
<tr><td><strong>المنسحب</strong></td><td>حضور بلا مشاركة وأداء بالحد الأدنى</td><td>إحباط أو تجاهل متراكم أو ظرف شخصي</td><td>حوار فردي يسأل قبل أن يحكم</td></tr>
<tr><td><strong>المُشتِّت</strong></td><td>ثرثرة ونقل كلام وشد الفريق للخلف</td><td>حاجة للانتباه أو فراغ في المهام</td><td>مهام واضحة ومساءلة على المخرَج</td></tr>
<tr><td><strong>الضحية الدائمة</strong></td><td>كل مشكلة سببها الآخرون</td><td>تجنّب المسؤولية أو خبرة سابقة بلوم غير عادل</td><td>حوّل الحوار من «من السبب» إلى «ما خطوتك التالية»</td></tr>
<tr><td><strong>المسيطر</strong></td><td>يفرض رأيه ويقاطع ويهمّش غيره</td><td>ثقة مفرطة أو غياب حدود واضحة</td><td>قواعد اجتماع صريحة وتغذية راجعة محددة بالوقائع</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">أخطر نمط على الإطلاق</span><p><strong>النجم المتعالي.</strong> السكوت عنه بسبب نتائجه يرسل رسالة واضحة لكل الفريق: <em>«القواعد تُطبَّق على الضعفاء فقط»</em>. الضرر لا يقتصر عليه — بل يخسرك أفضل من حوله ويهدم منظومة العدالة كلها. القاعدة: <strong>ما تتسامح معه هو ما تُعرَّف به</strong>.</p></div>

<h2>التنمر في مكان العمل</h2>
<div class="box def"><span class="lbl">تعريف عملي</span><p>سلوك <strong>متكرر</strong> وغير مرغوب يستهدف شخصًا أو مجموعة ويُنتج بيئة مهينة أو مؤذية. ثلاثة عناصر: التكرار · الاستهداف · الأثر. الواقعة المنفردة قد تكون فظاظة، والتكرار الموجّه هو التنمر.</p></div>
<div class="tbl"><table><thead><tr><th>ليس تنمرًا</th><th>تنمر</th></tr></thead><tbody>
<tr><td>تغذية راجعة صعبة عن الأداء بمعايير مكتوبة</td><td>انتقاد شخصي متكرر أمام الآخرين</td></tr>
<tr><td>مطالبة بمعايير عالية للجميع</td><td>تحميل شخص بعينه فوق طاقته دون غيره</td></tr>
<tr><td>خلاف حاد حول فكرة</td><td>إقصاء متعمد من الاجتماعات والمعلومات</td></tr>
<tr><td>قرار إداري لا يعجب الموظف</td><td>حجب الفرص أو التقليل من إنجازاته عمدًا</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">التنمر الأصعب: من المدير</strong></span><p>لأن الضحية تخشى التصعيد لمن يملك تقييمها وراتبها. لذلك أي قناة إبلاغ يجب أن تتيح <strong>تجاوز خط التبعية المباشر</strong> — وإلا فهي قناة معطّلة في أخطر الحالات.</p></div>

<h2>تضارب المصالح</h2>
<div class="tbl"><table><thead><tr><th>الصورة</th><th>مثال</th></tr></thead><tbody>
<tr><td>مصلحة مالية</td><td>موظف مشتريات له حصة في شركة مورّد</td></tr>
<tr><td>علاقة شخصية</td><td>مدير يشارك في تقييم أو تعيين قريبه</td></tr>
<tr><td>عمل خارجي</td><td>عمل إضافي لدى منافس أو على حساب وقت الشركة</td></tr>
<tr><td>هدايا وضيافة</td><td>هدية من مورّد أثناء دورة تفاوض</td></tr>
<tr><td>معلومة داخلية</td><td>استخدام معلومة غير معلنة لمصلحة شخصية</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">المبدأ الحاكم</span><p>تضارب المصالح <strong>ليس تهمة</strong> — هو <em>وضع</em> قد ينشأ بلا سوء نية. المخالفة ليست في وجوده بل في <strong>عدم الإفصاح عنه</strong>. لذلك الحل الصحيح: إقرار إفصاح سنوي + إلزام بالإفصاح الفوري عند نشوء الحالة + إخراج صاحب المصلحة من دائرة القرار. أما تحريم الحالة نفسها فيدفع الناس لإخفائها.</p></div>

<h2>المحسوبية والواسطة</h2>
<p>أخطر ما فيها أنها نادرًا ما تكون فسادًا صريحًا، بل <strong>تفضيلًا صغيرًا متكررًا</strong>: مهمة مميزة، حضور اجتماع مهم، تسامح في تأخير، تقييم أعلى قليلًا. أثرها التراكمي يهدم الإحساس بالعدالة أكثر من مخالفة كبيرة واحدة.</p>
<div class="box tip"><span class="lbl">العلاج نظامي لا شخصي</span><p>معايير مكتوبة للترقية والمهام المميزة · لجان بدل قرارات فردية · تحليل بيانات الترقيات والزيادات حسب المدير · إفصاح إلزامي عن صلة القرابة. مواجهة المحسوبية بالمواعظ بلا نظام لا تُنتج شيئًا.</p></div>

<h2>حالات تستدعي تحركًا فوريًا</h2>
<div class="tbl"><table><thead><tr><th>الحالة</th><th>الاستجابة الفورية</th></tr></thead><tbody>
<tr><td><strong>عنف أو تهديد</strong></td><td>ضمان السلامة أولًا · إبعاد فوري · توثيق · الاستعانة بالجهات المختصة إن لزم</td></tr>
<tr><td><strong>سرقة أو اختلاس</strong></td><td>تأمين الأدلة قبل المواجهة · إيقاف الوصول · تحقيق مالي · لا اتهام قبل الثبوت</td></tr>
<tr><td><strong>تعاطٍ في موقع العمل</strong></td><td>إبعاد عن المهام الخطرة فورًا · إجراء طبي وفق السياسة · معالجة قبل عقوبة حيث يسمح النظام</td></tr>
<tr><td><strong>تسريب معلومات</strong></td><td>احتواء فوري · تحديد نطاق الضرر · تحقيق · إخطار المتأثرين</td></tr>
<tr><td><strong>تحرش</strong></td><td>فصل التواصل بين الطرفين · تحقيق مستقل · حماية من الانتقام</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">ثلاثة أخطاء تتكرر في الحالات الحرجة</span>
<ol style="margin:6px 0 0">
<li><strong>المواجهة قبل تأمين الأدلة</strong> — تُتيح للطرف إتلافها.</li>
<li><strong>الاتهام العلني قبل الثبوت</strong> — يُنشئ مسؤولية على الشركة حتى لو ثبتت المخالفة لاحقًا.</li>
<li><strong>التسوية الصامتة</strong> — إخراج المخالف بهدوء بلا توثيق يجعله يكرر الفعل في شركة أخرى، وقد يعود عليك قانونيًا.</li>
</ol></div>

<h2>حوار التصحيح — بنية من خمس خطوات</h2>
<div class="ascii">1. الواقعة  : "لاحظت أنك قاطعت زميلك ثلاث مرات في اجتماع أمس"
              (وقائع محددة لا أوصاف شخصية)
2. الأثر    : "النتيجة أن فكرته لم تُسمع وتوقف عن المشاركة"
3. الإصغاء  : "ما وجهة نظرك؟"  ثم اصمت فعلًا
4. التوقع   : "المطلوب أن يكمل كل شخص كلامه قبل الرد"
5. المتابعة : "سنراجع هذا بعد أسبوعين"  — وافعلها</div>
<div class="box tip"><span class="lbl">الفرق الحاسم</span><p>«أنت شخص متعالٍ» وصف شخصي يستدعي الدفاع ولا يمكن تغييره. «قاطعت ثلاث مرات» واقعة قابلة للملاحظة والتغيير. <strong>هاجم السلوك لا الشخص</strong> — ليس لطفًا بل لأنه الأسلوب الوحيد الذي ينتج تغييرًا.</p></div>

<h2>كيف تقيس فعالية التعامل مع المواقف الصعبة</h2>
<div class="tbl"><table><thead><tr><th>المؤشر</th><th>ما يكشفه</th></tr></thead><tbody>
<tr><td>نسبة الحالات المحلولة بالحوار قبل التصعيد</td><td>ارتفاعها دليل نضج إداري لا تساهل</td></tr>
<tr><td>متوسط زمن التدخل من ظهور السلوك</td><td>التأخر يُرسّخ السلوك ويُفقد المتضررين الثقة</td></tr>
<tr><td>تكرار الحالات من نفس المدير</td><td>يحوّل التشخيص من الأفراد إلى الإشراف</td></tr>
<tr><td>نسبة إقرارات تضارب المصالح المستلمة</td><td>انخفاضها لا يعني عدم وجود تضارب بل عدم الإفصاح</td></tr>
<tr><td>دوران الفريق المحيط بموظف صعب</td><td>أوضح دليل على تكلفة السكوت</td></tr>
<tr><td>نسبة القرارات التأديبية المُلغاة عند التصعيد</td><td>ارتفاعها يعني خللًا في التحقيق أو التناسب</td></tr>
</tbody></table></div>

<div class="box def"><span class="lbl">مبدأ حاكم</span><p>الموظفون <strong>يملؤون الفراغ دائمًا</strong>. إن لم تُخبرهم، سيخبرون أنفسهم — وغالبًا بأسوأ تفسير ممكن. الصمت ليس حيادًا في الاتصال الداخلي، بل رسالة تُقرأ على أنها إخفاء.</p></div>

<h2>خريطة القنوات</h2>
<div class="tbl"><table><thead><tr><th>القناة</th><th>تصلح لـ</th><th>لا تصلح لـ</th></tr></thead><tbody>

<tr><td>المشرف المباشر</td><td>أقوى قناة على الإطلاق</td><td>لا شيء — بشرط تجهيزه أولًا</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">الخطأ الأشهر</span><p>إرسال بريد جماعي بخبر كبير <strong>قبل</strong> أن يعرف المشرفون. النتيجة أن الموظف يسأل مشرفه فيجيب «وأنا كمان لسه عارف» — فتُفقد أهم قناة لديك مصداقيتها في اللحظة التي تحتاجها أكثر. <strong>القاعدة: المشرفون يعرفون أولًا وبوقت كافٍ ومعهم إجابات الأسئلة المتوقعة.</strong></p></div>

<h2>الوصول للعمالة غير المكتبية</h2>
<p>في المصانع والمواقع والتجزئة، معظم القوى العاملة بلا بريد ولا جهاز. تجاهل ذلك يعني أن استراتيجية اتصالك تخدم الأقلية:</p>
<div class="chips"><span class="chip">لوحات في الموقع بلغة بسيطة</span><span class="chip">شاشات في الاستراحة</span><span class="chip">إحاطة بداية الوردية (5 دقائق)</span><span class="chip">رسائل نصية للعاجل</span><span class="chip">ممثلون من العمال ينقلون ويُنقل عنهم</span><span class="chip">تطبيق يعمل على الهاتف الشخصي</span></div>

<h2>الاجتماع العام (Town Hall) — كيف لا يكون مضيعة للوقت</h2>
<div class="tbl"><table><thead><tr><th>يعمل</th><th>لا يعمل</th></tr></thead><tbody>
<tr><td>أرقام حقيقية عن أداء الشركة</td><td>شرائح تسويقية عامة</td></tr>
<tr><td>الاعتراف بما لم يسر جيدًا</td><td>تفاؤل غير مبرر</td></tr>
<tr><td>أسئلة مُجمَّعة مسبقًا بلا أسماء + أسئلة حية</td><td>«هل من أسئلة؟» في آخر دقيقتين</td></tr>
<tr><td>الإجابة عن السؤال الصعب مباشرة</td><td>تجاهله أو الالتفاف حوله</td></tr>
<tr><td>متابعة مكتوبة لما لم يُجَب عنه</td><td>وعد شفهي بالرجوع لاحقًا</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مؤشر صحة الاجتماع العام</span><p>ليس عدد الحضور — بل <strong>نوع الأسئلة</strong>. أسئلة مجاملة أو صمت تام يعني أن الناس لا يشعرون بالأمان أو لا يرون فائدة. سؤال صعب واحد يُجاب عنه بصدق أمام الجميع يفعل للثقة ما لا تفعله عشر نشرات داخلية.</p></div>

<h2>الرسائل الصعبة — قاعدة الأسئلة الثلاثة</h2>
<div class="ascii">أي خبر كبير، الموظف يسمع منه ثلاثة أسئلة فقط:
   1. هل يؤثر عليّ؟          (وظيفتي · أجري · مديري)
   2. متى سأعرف بالتحديد؟
   3. هل هناك المزيد قادم؟
رسالة لا تجيب على الثلاثة — ولو بـ"لا نعرف بعد وسنخبركم يوم كذا" —
لن يُسمع منها أي شيء آخر مهما كانت جيدة الصياغة.</div>
<div class="box tip"><span class="lbl">صياغة الخبر السيئ</span>
<ol style="margin:6px 0 0">
<li><strong>ابدأ بالخبر لا بالمقدمة.</strong> التمهيد الطويل يزيد القلق ويُقرأ كمراوغة.</li>
<li><strong>اشرح السبب بالأرقام</strong> لا بالعموميات.</li>
<li><strong>قل ما تعرفه وما لا تعرفه</strong> صراحةً.</li>
<li><strong>حدد موعدًا للتحديث التالي</strong> والتزم به حتى لو لم يستجد شيء.</li>
<li><strong>افتح قناة للأسئلة</strong> وأجب علنًا عن المتكرر منها.</li>
</ol></div>

<h2>إدارة الشائعات</h2>
<div class="formula">قوة الشائعة ≈ أهمية الموضوع × غموضه</div>
<p>لا تستطيع تقليل أهمية الموضوع — لكنك تستطيع تقليل الغموض. وهذا هو كل ما يمكن فعله فعليًا.</p>
<div class="tbl"><table><thead><tr><th>الموقف</th><th>الاستجابة</th></tr></thead><tbody>
<tr><td>شائعة صحيحة وأنت لم تعلن بعد</td><td>أعلن فورًا — التأخير يجعلك تبدو مضطرًا لا شفافًا</td></tr>
<tr><td>شائعة خاطئة تمامًا</td><td>نفي واضح ومحدد بلا تفاصيل تُعيد إحياءها</td></tr>
<tr><td>شائعة جزئية الصحة</td><td>الأصعب — صحّح الخطأ وأكّد الصحيح وحدد ما لم يُقرر بعد</td></tr>
<tr><td>لا تستطيع الإفصاح (سبب قانوني أو تعاقدي)</td><td>قل ذلك صراحةً: «لا أستطيع مشاركة هذا الآن ولهذا السبب» — أفضل من الإنكار</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">أسوأ استجابة ممكنة</span><p><strong>الإنكار الذي يظهر كذبه لاحقًا.</strong> شائعة اليوم قد تُنسى، أما نفي كاذب يُكتشف فيُنهي مصداقية الإدارة نهائيًا — وكل رسالة بعده ستُقرأ بشك. إن لم تستطع القول، فلا تنفِ.</p></div>

<div class="box def"><span class="lbl">المعادلة الحاكمة</span><p>للشركة <strong>مصلحة مشروعة</strong> في حماية أصولها وبياناتها وسمعتها. وللموظف <strong>حق مشروع</strong> في خصوصية معقولة. السياسة الجيدة لا تُلغي أحدهما لصالح الآخر — بل تحدد الحدود مسبقًا وبوضوح. <strong>ما يجعل المراقبة مقبولة ليس شدتها بل الإعلان عنها قبل وقوعها.</strong></p></div>

<h2>سياسة الاستخدام المقبول — البنود الأساسية</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>ما يجب تحديده</th></tr></thead><tbody>
<tr><td>نطاق التطبيق</td><td>أي أجهزة وحسابات وشبكات تشملها السياسة</td></tr>
<tr><td>الاستخدام الشخصي</td><td>هل يُسمح به؟ بأي حدود؟ (المنع المطلق غير واقعي)</td></tr>
<tr><td>المحظورات</td><td>محتوى غير قانوني · اختراق · تثبيت برامج غير معتمدة · مشاركة كلمات المرور</td></tr>
<tr><td>البيانات</td><td>ما يجوز نسخه أو إرساله خارجيًا وما لا يجوز</td></tr>
<tr><td>الملكية</td><td>ملكية الشركة للبريد والملفات المُنشأة بأدواتها</td></tr>
<tr><td>المراقبة</td><td>ما يُراقب ولماذا ومن يطّلع — <strong>بالتفصيل لا بالعموم</strong></td></tr>
<tr><td>الإبلاغ</td><td>كيف يبلّغ الموظف عن حادث أمني أو جهاز مفقود</td></tr>
<tr><td>العواقب</td><td>ما يترتب على المخالفة بشكل متدرج</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">لماذا المنع المطلق للاستخدام الشخصي يفشل؟</span><p>لأنه غير قابل للتطبيق — والجميع يخالفه، فتتحول السياسة إلى أداة انتقائية تُستخدم ضد من تريد الشركة التخلص منه فقط. <strong>سياسة يخالفها الجميع أسوأ من عدم وجود سياسة</strong>، لأنها تمنح سلطة تقديرية بلا ضابط. حدّ معقول مُعلن ومُطبَّق على الجميع أفضل من منع شكلي.</p></div>

<h2>المراقبة الإلكترونية — الحدود</h2>
<div class="tbl"><table><thead><tr><th>مقبول عمومًا</th><th>محل خلاف أو خطر قانوني</th></tr></thead><tbody>
<tr><td>سجلات الدخول والخروج من الأنظمة</td><td>قراءة محتوى المراسلات الشخصية</td></tr>
<tr><td>مراقبة أمنية للشبكة والبيانات الحساسة</td><td>تسجيل ضغطات لوحة المفاتيح</td></tr>
<tr><td>كاميرات في المساحات العامة لأغراض أمنية</td><td>كاميرات في أماكن التوقع المعقول للخصوصية</td></tr>
<tr><td>تتبّع مركبات الشركة أثناء ساعات العمل</td><td>تتبّع الموقع خارج ساعات العمل</td></tr>
<tr><td>فحص أمني آلي للمرفقات</td><td>لقطات شاشة دورية للموظف</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">اختبار الشرعية الرباعي</span>
<p>قبل تفعيل أي مراقبة اسأل: <strong>1) هل الغرض مشروع ومحدد؟</strong> (الأمن لا الفضول) · <strong>2) هل هي الوسيلة الأقل تدخلًا لتحقيقه؟</strong> · <strong>3) هل أُعلنت مسبقًا وبوضوح؟</strong> · <strong>4) هل الوصول للبيانات مقيّد بمن يحتاجها؟</strong> — إن سقط أي شرط، فأنت أمام مخاطرة قانونية وأخلاقية معًا.</p></div>
<div class="box warn"><span class="lbl">الأثر الخفي للمراقبة المفرطة</span><p>ما يقيسه معظم أدوات المراقبة هو <strong>التواجد لا القيمة</strong>. النتيجة الموثقة في أغلب التجارب: يتعلم الناس <em>إنتاج مؤشرات</em> لا إنتاج عمل — حركة ماوس، رسائل بلا معنى، تواجد مفتوح. تدفع تكلفة الأداة وتخسر الثقة وتحصل على بيانات مضللة.</p></div>

<h2>الجهاز الشخصي في العمل (BYOD)</h2>
<div class="tbl"><table><thead><tr><th>الميزة</th><th>الخطر</th></tr></thead><tbody>
<tr><td>توفير تكلفة الأجهزة</td><td>بيانات الشركة على جهاز لا تملكه</td></tr>
<tr><td>راحة الموظف بجهاز يعرفه</td><td>صعوبة الاسترجاع أو المسح عند الخروج</td></tr>
<tr><td>مرونة العمل عن بُعد</td><td>تداخل بين الشخصي والمهني قانونيًا</td></tr>
</tbody></table></div>
<p><strong>ما يجب أن تنص عليه سياسة BYOD:</strong></p>
<ul>
<li><strong>الفصل التقني</strong>: حاوية عمل منفصلة بدل خلط البيانات.</li>
<li><strong>حق المسح عن بُعد</strong> — لكن <strong>لبيانات الشركة فقط</strong> لا للجهاز كله. مسح صور موظف الشخصية عند استقالته كارثة قانونية وسمعوية.</li>
<li><strong>الحد الأدنى من الأمان</strong>: قفل شاشة، تشفير، نظام محدّث.</li>
<li><strong>ماذا عند الفقد أو السرقة</strong>: إبلاغ فوري خلال مدة محددة.</li>
<li><strong>عند إنهاء الخدمة</strong>: إجراء واضح لإزالة الوصول والبيانات ضمن قائمة إخلاء الطرف.</li>
<li><strong>من يتحمل التكلفة</strong>: هل هناك بدل مقابل استخدام الجهاز والإنترنت؟</li>
</ul>

<h2>الموظف ووسائل التواصل الاجتماعي</h2>
<div class="tbl"><table><thead><tr><th>ما يجوز للشركة تنظيمه</th><th>ما لا يجوز عادةً</th></tr></thead><tbody>
<tr><td>عدم إفشاء أسرار العمل والمعلومات السرية</td><td>منع الموظف من امتلاك حسابات شخصية</td></tr>
<tr><td>عدم التحدث باسم الشركة بلا تفويض</td><td>مراقبة حساباته الشخصية أو طلب كلمات مروره</td></tr>
<tr><td>عدم نشر صور بيئة عمل حساسة أو بيانات عملاء</td><td>التدخل في آرائه الشخصية غير المتصلة بالعمل</td></tr>
<tr><td>عدم التنمر أو الإساءة للزملاء علنًا</td><td>منعه من مناقشة ظروف عمله مع زملائه</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">أذكى بند في السياسة</span><p>بدل قائمة محظورات طويلة، اطلب من الموظف <strong>الإفصاح بأن رأيه شخصي</strong> عند ذكر مكان عمله، ووضّح أن التحدث <em>باسم</em> الشركة يحتاج تفويضًا. هذا يحمي الشركة دون أن يصادر حق الشخص في الوجود العلني — والصياغة المتشددة تُنتج غالبًا أثرًا عكسيًا.</p></div>

<h2>خصوصية بيانات الموظف — ستة مبادئ</h2>
<div class="ascii">1. الغرض المحدد   : لكل بيان سبب مكتوب لجمعه
2. الحد الأدنى    : لا تجمع ما لا تحتاجه
3. الدقة          : للموظف حق تصحيح بياناته
4. تقييد الوصول   : حسب الحاجة للعلم لا حسب المنصب
5. مدة الاحتفاظ   : محددة لكل نوع ثم إتلاف آمن
6. الشفافية       : الموظف يعرف ما يُجمع عنه ولماذا</div>
<div class="box warn"><span class="lbl">حالة خاصة: البيانات الصحية</span><p>أعلى مستويات الحساسية. تُحفظ في <strong>ملف منفصل بصلاحية مقيدة</strong>، والمدير المباشر يعرف <strong>القيد الوظيفي فقط</strong> لا التشخيص. وينطبق الأمر نفسه على نتائج التقييم النفسي وبلاغات قنوات الإبلاغ المحمية.</p></div>

<h2>ماذا يحدث عند إنهاء الخدمة؟</h2>
<div class="tbl"><table><thead><tr><th>الإجراء</th><th>التوقيت</th></tr></thead><tbody>
<tr><td>إلغاء الوصول لكل الأنظمة</td><td>لحظة الإبلاغ في الإنهاء غير الطوعي</td></tr>
<tr><td>تحويل البريد لمن يخلفه</td><td>مع رسالة رد آلي واضحة</td></tr>
<tr><td>استرجاع الأجهزة والبيانات</td><td>ضمن إخلاء الطرف</td></tr>
<tr><td>مسح بيانات الشركة من الجهاز الشخصي</td><td>بحضوره وتوثيق ما مُسح</td></tr>
<tr><td>مراجعة صلاحيات الحسابات المشتركة</td><td>تغيير أي كلمة مرور كان يعرفها</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">الثغرة المنسية</span><p>الحسابات المشتركة والاشتراكات الخارجية التي كان يعرف كلمات مرورها. إلغاء حسابه الشخصي لا يكفي إن كان يملك دخول حساب الشركة على منصة أو خدمة خارجية. اجعل مراجعتها بندًا ثابتًا في إخلاء الطرف.</p></div>

<h2>فخاخ التصميم الشهيرة</h2>
<div class="tbl"><table><thead><tr><th>الفخ</th><th>ما يحدث فعليًا</th><th>العلاج</th></tr></thead><tbody>
<tr><td><strong>مؤشر واحد</strong></td><td>عمولة على البيع وحده ← بيع لعملاء غير مؤهلين وارتفاع الإلغاء</td><td>أضف مؤشر جودة أو احتفاظ كشرط</td></tr>
<tr><td><strong>قفزة الشريحة</strong></td><td>من يقترب من حد الشريحة يؤجل الصفقات للشهر التالي أو يستعجلها</td><td>منحنى خطي أو شرائح متقاربة</td></tr>
<tr><td><strong>السقف المبكر</strong></td><td>من يبلغه في نوفمبر يتوقف حتى يناير</td><td>سقف مرتفع أو نسبة متناقصة بدل توقف تام</td></tr>
<tr><td><strong>الهدف غير الواقعي</strong></td><td>من يتأكد أنه لن يبلغه يتوقف عن المحاولة تمامًا</td><td>عتبة قابلة للبلوغ + مكافأة تدريجية</td></tr>
<tr><td><strong>تغيير القواعد أثناء الفترة</strong></td><td>يهدم الثقة في كل الخطط القادمة</td><td>قواعد مجمّدة للفترة مع مراجعة معلنة بين الفترات</td></tr>
<tr><td><strong>الغموض في الحساب</strong></td><td>الموظف لا يعرف كيف يحسبها ← يفقد الحافز أثره</td><td>حاسبة بسيطة يستطيع كل موظف استخدامها</td></tr>
<tr><td><strong>حافز على أمر لا يتحكم فيه</strong></td><td>إحباط وشعور بالعبث</td><td>اربط بما يقع ضمن نطاق تأثيره فعلًا</td></tr>
</tbody></table></div>

<h2>مثال محلول: خطة عمولة مبيعات</h2>
<div class="box ex"><span class="lbl">التصميم</span>
<p><strong>العتبة:</strong> 70% من المستهدف — لا عمولة تحتها.</p>
<p><strong>من 70% إلى 100%:</strong> 2% من قيمة المبيعات.</p>
<p><strong>من 100% إلى 130%:</strong> 3% (تسريع لتحفيز التجاوز).</p>
<p><strong>فوق 130%:</strong> 2% (تباطؤ لضبط التكلفة دون إيقاف الدافع).</p>
<p><strong>شرط الجودة:</strong> تُصرف العمولة بعد تحصيل 60% من قيمة الصفقة.</p>
<p><strong>الاسترداد:</strong> تُسترد إن أُلغيت الصفقة خلال 90 يومًا.</p></div>
<div class="box ex"><span class="lbl">لماذا هذا التصميم؟</span>
<p>العتبة عند 70% لا 100% لأن العتبة العالية تُحبط الأغلبية. التسريع بين 100 و130 يكافئ التجاوز الحقيقي. التباطؤ فوق 130 يضبط التكلفة <strong>دون سقف مطلق</strong> يوقف الدافع. شرط التحصيل يمنع البيع لمن لا يدفع. والاسترداد يمنع الصفقات الوهمية آخر الفترة.</p></div>

<h2>حوافز الفريق مقابل الفردية</h2>

<tr><td>العلاج</td><td>أضف مكوّنًا جماعيًا للتوازن</td><td>فرق صغيرة + مساءلة داخلية مرئية</td></tr>

<div class="box tip"><span class="lbl">تصميم مركّب شائع</span><p>60% على الأداء الفردي · 25% على أداء الفريق · 15% على نتيجة الشركة. النسب تختلف حسب طبيعة العمل، لكن المبدأ ثابت: <strong>وزّع الحافز على المستويات التي تريد أن يهتم بها الموظف فعلًا.</strong> من لا يهتم إلا برقمه الشخصي لم يُصمَّم حافزه ليهتم بغيره.</p></div>

<h2>مشاركة الأرباح والملكية</h2>

<tr><td>خيارات وأسهم</td><td>حصة في ملكية الشركة تُستحق تدريجيًا</td><td>أداة استبقاء طويلة قوية — تحتاج شفافية في التقييم</td></tr>

<h2>قبل الإطلاق — قائمة تحقق</h2>
<div class="box warn"><span class="lbl">اختبر خطتك</span>
<ol style="margin:6px 0 0">
<li><strong>محاكاة بأسوأ سلوك:</strong> لو أراد موظف استغلال الخطة بأقصى ذكاء وأقل قيمة للشركة، ماذا سيفعل؟ إن وجدت إجابة سهلة فأعد التصميم.</li>
<li><strong>اختبار التكلفة:</strong> احسب التكلفة في ثلاثة سيناريوهات — أداء ضعيف ومتوسط واستثنائي.</li>
<li><strong>اختبار الفهم:</strong> اشرحها لموظف عادي في دقيقتين — إن لم يفهم كيف يحسبها فلن تحفّزه.</li>
<li><strong>اختبار السيطرة:</strong> هل كل مؤشر يقع ضمن تأثير الموظف فعلًا؟</li>
<li><strong>اختبار الحالات الحدية:</strong> من التحق في منتصف الفترة؟ من كان في إجازة طويلة؟ من استقال قبل الصرف؟ من نُقل بين الفرق؟</li>
</ol></div>
<div class="box ex"><span class="lbl">النقطة الخامسة تحديدًا</span><p>الحالات الحدية هي مصدر <strong>معظم النزاعات</strong> حول الحوافز — لا أصل الخطة. من التحق في مارس، هل يستحق نسبيًا؟ من استقال قبل الصرف بأسبوع بعد أن حقق هدفه؟ اكتب الإجابة <strong>قبل</strong> أن تحدث الحالة، لأن كتابتها بعد وقوعها ستُقرأ دائمًا كتفصيل على المقاس.</p></div>
`,

<tr><td><strong>يناير</strong></td><td>تطبيق تحديثات الحدود التأمينية والضريبية · اعتماد خطة الإجازات · إطلاق أهداف السنة · تحديث سلّم الرواتب إن اعتُمدت زيادات</td></tr>
<tr><td><strong>فبراير</strong></td><td>اجتماعات وضع الأهداف الفردية · إغلاق دورة التقييم السابقة إن تأخرت · خطة التدريب السنوية</td></tr>
<tr><td><strong>مارس</strong></td><td>مراجعة الربع الأول للمؤشرات · تقرير الدوران · بدء التخطيط لبرامج الخريجين والتدريب الصيفي</td></tr>
<tr><td><strong>أبريل</strong></td><td>مراجعة عيّنة ملفات (تدقيق ربعي) · تحديث تقييم مخاطر السلامة</td></tr>
<tr><td><strong>مايو</strong></td><td>استبيان نبضي منتصف العام · مراجعة سياسات لم تُحدَّث منذ سنة</td></tr>
<tr><td><strong>يونيو</strong></td><td>مراجعة منتصف العام للأداء · تقرير الربع الثاني · مراجعة خطط التعاقب</td></tr>
<tr><td><strong>يوليو</strong></td><td>استقبال المتدربين الصيفيين · مراجعة الأرصدة المرتفعة للإجازات</td></tr>
<tr><td><strong>أغسطس</strong></td><td>مسح رواتب السوق · تحضير بيانات الميزانية</td></tr>
<tr><td><strong>سبتمبر</strong></td><td>تقرير الربع الثالث · مسودة ميزانية HR للعام القادم · تنبيه أصحاب الأرصدة المرتفعة</td></tr>
<tr><td><strong>أكتوبر</strong></td><td>استبيان الاندماج السنوي · مناقصة/تجديد التأمين الطبي · الدفاع عن الميزانية</td></tr>
<tr><td><strong>نوفمبر</strong></td><td>دورة تقييم الأداء السنوي · جلسات المعايرة · خطة إجازات العام القادم</td></tr>
<tr><td><strong>ديسمبر</strong></td><td>قرارات الزيادات والمكافآت · تقرير المجلس السنوي · تسوية الأرصدة · أرشفة السنة</td></tr>
</tbody></table></div>
<p class="hint">التوقيت يُكيَّف مع السنة المالية للشركة ومواعيد التشريعات في بلدك — المهم الإيقاع لا الشهر بالضبط.</p>

<h2>بنية أي سياسة جيدة</h2>
<div class="ascii">1. الغرض        : لماذا توجد هذه السياسة؟ (سطران)
2. النطاق        : من تشمله ومن تستثنيه
3. التعريفات     : المصطلحات التي قد تُفهم بأكثر من معنى
4. الأحكام        : القواعد نفسها — واضحة وقابلة للتطبيق
5. المسؤوليات    : الموظف / المدير / HR
6. الاستثناءات   : من يعتمدها وكيف تُوثَّق
7. المرجعية      : القانون أو اللائحة المستندة إليها
8. السريان       : تاريخ البدء وموعد المراجعة القادمة</div>

<div class="box warn"><span class="lbl">أربع علامات على سياسة ستفشل</span>
<ol style="margin:6px 0 0">
<li>مكتوبة بلغة قانونية لا يفهمها الموظف العادي.</li>
<li>بلا مالك مسؤول عن تحديثها.</li>
<li>تختلف عن الممارسة الفعلية — والجميع يعرف ذلك.</li>
<li>لم يوقّع الموظفون على العلم بها، فلا يمكن الاحتجاج بها.</li>
</ol></div>
<div class="box tip"><span class="lbl">قاعدة الخبرة</span><p>السياسة التي يخالفها الجميع أسوأ من غيابها لأنها تمنح سلطة تقديرية بلا ضابط. قبل إصدار أي سياسة اسأل: <strong>هل سنطبقها فعلًا على الجميع بمن فيهم المديرون؟</strong> إن كانت الإجابة لا، فأعد صياغتها أو لا تُصدرها.</p></div>
`,

/* ---------- التخزين ---------- */
const KEY="hr-academy-v2";
let saveT, memStore=null, storeMode="memory";
function payload(){ return JSON.stringify({done:state.done,stats:state.stats,wrong:state.wrong,theme:state.theme,fs:state.fs}); }
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    const data = payload();
    memStore = data;
    try{ if(window.storage){ await window.storage.set(KEY, data); storeMode="cloud"; return; } }catch(e){}
    try{ if(window.localStorage){ window.localStorage.setItem(KEY, data); storeMode="local"; return; } }catch(e){}
    storeMode="memory";
    updateStoreNote();
  }, 400);
}
function applyState(d){
  if(!d) return false;
  state.done=d.done||{}; state.stats=d.stats||{}; state.wrong=d.wrong||[];
  if(d.fs) setFs(d.fs,true);
  if(d.theme) setTheme(d.theme,true);
  return true;
}
async function load(){
  try{
    if(window.storage){
      const r = await window.storage.get(KEY);
      if(r && r.value){ storeMode="cloud"; return applyState(JSON.parse(r.value)); }
      storeMode="cloud"; return false;
    }
  }catch(e){}
  try{
    if(window.localStorage){
      const v = window.localStorage.getItem(KEY);
      storeMode="local";
      if(v) return applyState(JSON.parse(v));
      return false;
    }
  }catch(e){}
  storeMode="memory";
  if(memStore) return applyState(JSON.parse(memStore));
  return false;
}
function updateStoreNote(){
  const el=document.getElementById("storeNote"); if(!el) return;
  el.textContent = storeMode==="memory"
    ? "تنبيه: تقدّمك محفوظ في هذه الجلسة فقط وسيضيع عند إغلاق الصفحة. حمّل الملف وافتحه في متصفحك ليُحفظ بشكل دائم."
    : "تقدّمك يُحفظ تلقائيًا على هذا الجهاز.";
}

const moon='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
function setTheme(t,skip){
  state.theme=t;
  document.documentElement.setAttribute("data-theme",t);
  $("#themeIcon").innerHTML = t==="dark"?sun:moon;
  $("#themeBtn").title = t==="dark"?"التبديل للوضع النهاري":"التبديل للوضع الليلي";
  if(!skip) save();
}
function setFs(v,skip){
  state.fs = Math.min(130, Math.max(85, v));
  document.documentElement.style.setProperty("--fs", state.fs+"%");
  if(!skip) save();
}
$("#themeBtn").onclick = ()=> setTheme(state.theme==="dark"?"light":"dark");

const strip = h => h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ").trim();
let _INDEX = null;
function getIndex(){
  if(_INDEX) return _INDEX;
  _INDEX = SECTIONS.map(s=>{
    const body = strip(s.html);
    return { id:s.id, title:s.title, track:s.track,
      text:(s.title+" "+s.lede+" "+body+" "+s.quiz.map(q=>q.q).join(" ")).toLowerCase(),
      raw:s.lede+" "+body };
  });
  return _INDEX;
}

/* ---------- الشريط الجانبي ---------- */
function buildRail(){
  const tracks=[]; SECTIONS.forEach(s=>{ if(!tracks.includes(s.track)) tracks.push(s.track); });
  let h = `<div class="rail-head"><b>الأقسام</b>
    <button id="railClose" aria-label="إغلاق القائمة"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="track"><div class="steps">
    <button class="step" data-id="home"><span class="dot"></span>الصفحة الرئيسية</button>
    <button class="step" data-id="paths"><span class="dot"></span>مسارات التعلّم<span class="badge">${PATHS.length}</span></button>
    <button class="step" data-id="map"><span class="dot"></span>خريطة الدليل<span class="badge">${SECTIONS.length}</span></button>
    <button class="step" data-id="review"><span class="dot"></span>مراجعة أخطائي<span class="badge" id="wrongCount">0</span></button>
    <button class="step" data-id="flash"><span class="dot"></span>بطاقات سريعة<span class="badge">${FLASH.length}</span></button>
  </div></div>`;
  tracks.forEach((tr,i)=>{
    h += `<div class="track"><div class="track-head"><i>${String(i+1).padStart(2,"0")}</i><span>${tr}</span></div><div class="steps">`;
    SECTIONS.filter(s=>s.track===tr).forEach(s=>{
      h += `<button class="step" data-id="${s.id}" data-search="${(s.title+" "+s.lede).toLowerCase()}">
        <span class="dot"></span><span>${s.title}</span><span class="badge">${s.quiz.length}</span></button>`;
    });
    h += `</div></div>`;
  });
  h += `<div class="track"><div class="steps"><button class="step" data-id="final"><span class="dot"></span>الاختبار الشامل<span class="badge">${totalQ}</span></button>
    <button class="step" data-id="cert"><span class="dot"></span>شهادة الإتمام</button></div></div>`;
  rail.innerHTML = h;
  rail.querySelectorAll(".step").forEach(b=> b.onclick = ()=>{ go(b.dataset.id); closeRail(); });
  const rc = document.getElementById("railClose"); if(rc) rc.onclick = closeRail;
  syncRail();
}
function syncRail(){
  rail.querySelectorAll(".step").forEach(b=>{
    b.setAttribute("aria-current", b.dataset.id===state.current?"true":"false");
    b.dataset.done = state.done[b.dataset.id]?"1":"0";
  });
  const wc = $("#wrongCount"); if(wc) wc.textContent = state.wrong.length;
  const done = SECTIONS.filter(s=>state.done[s.id]).length;
  const pct = Math.round(done/SECTIONS.length*100);
  const c = 2*Math.PI*15.5;
  const fg = $("#ringFg");
  fg.setAttribute("stroke-dasharray", `${c*pct/100} ${c}`);
  fg.style.opacity = pct ? 1 : 0;
  $("#ringTxt").textContent = pct+"%";
}

/* ---------- البحث في كامل المحتوى ---------- */
let searchT;
$("#search").addEventListener("input", e=>{
  const q = e.target.value.trim();
  clearTimeout(searchT);
  searchT = setTimeout(()=>{
    if(!q){ rail.querySelectorAll(".step,.track").forEach(x=>x.hidden=false); if(state.current==="search") go("home"); return; }
    const lq = q.toLowerCase();
    rail.querySelectorAll(".step[data-search]").forEach(b=>{
      const sec = getIndex().find(x=>x.id===b.dataset.id);
      b.hidden = !(sec && sec.text.includes(lq));
    });
    rail.querySelectorAll(".track").forEach(t=>{
      const st = t.querySelectorAll(".step[data-search]");
      if(st.length) t.hidden = [...st].every(s=>s.hidden);
    });
    if(q.length>=2) showSearch(q);
  }, 220);
});
function esc(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function showSearch(q){
  state.current = "search";
  const lq = q.toLowerCase();
  const hits = getIndex().filter(s=>s.text.includes(lq)).map(s=>{
    const i = s.raw.toLowerCase().indexOf(lq);
    let snip = i<0 ? s.raw.slice(0,150) : s.raw.slice(Math.max(0,i-70), i+120);
    snip = esc(snip);
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    snip = snip.replace(re, m=>`<mark>${m}</mark>`);
    return {id:s.id, title:s.title, track:s.track, snip:"…"+snip+"…"};
  });
  stage.innerHTML = `<div class="sec on">
    <div class="sec-head"><div class="tab">بحث</div><h1>نتائج البحث عن «${esc(q)}»</h1>
    <p class="lede">${hits.length ? hits.length+" قسمًا يحتوي على هذا المصطلح." : "لا توجد نتائج — جرّب كلمة أقصر أو مرادفًا."}</p></div>
    <div class="hits">${hits.map(h=>`<button class="hit" data-goto="${h.id}"><i>${h.track}</i><b>${h.title}</b><span>${h.snip}</span></button>`).join("")}</div>
  </div>`;
  stage.querySelectorAll("[data-goto]").forEach(b=> b.onclick = ()=> go(b.dataset.goto));
  syncRail();
}

/* ---------- محرك الأسئلة ---------- */
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function renderQ(it, i){
  const type = it.t || "mcq";
  let body = "";
  if(type==="tf"){
    const opts = ["صح","خطأ"];
    body = `<div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="key">${AR[j]}</span><span>${o}</span></button>`).join("")}</div>`;
    it._map = [0,1];
  } else if(type==="num"){
    body = `<div class="numans">
      <input type="number" step="any" placeholder="أدخل الرقم" aria-label="إجابتك">
      ${it.unit?`<span class="unit">${it.unit}</span>`:""}
      <button class="btn ghost act-check">تحقق</button></div>`;
  } else if(type==="order"){
    const sh = shuffle(it.items.map((t,k)=>({t,k})));
    it._sh = sh;
    body = `<div class="orderbox">
      <div class="ohint">اضغط العناصر بالترتيب الصحيح:</div>
      <div class="order-slot" data-slot></div>
      <div class="order-pool" data-pool>${sh.map((o,j)=>`<button class="ochip" data-k="${o.k}">${o.t}</button>`).join("")}</div>
      <div><button class="btn ghost act-check">تحقق</button> <button class="btn ghost act-undo">تراجع</button></div>
    </div>`;
  } else {
    const idx = shuffle(it.opts.map((o,j)=>j));
    it._map = idx;
    body = `<div class="opts">${idx.map((orig,j)=>`<button class="opt" data-j="${j}" data-orig="${orig}"><span class="key">${AR[j]}</span><span>${it.opts[orig]}</span></button>`).join("")}</div>`;
  }
  const badge = {tf:"صح أم خطأ", num:"سؤال حسابي", order:"ترتيب خطوات"}[type] || "اختيار من متعدد";
  return `<div class="q" data-i="${i}" data-type="${type}">
    <div class="q-num">سؤال ${i+1} · ${badge}</div>
    <div class="q-txt">${it.q}</div>${body}</div>`;
}

function quizHTML(items, key, title){
  return `<div class="quizwrap" data-quiz="${key}">
    <div class="quiz-head"><h2>${title}</h2><span class="pill">${items.length} أسئلة</span></div>
    ${items.map((it,i)=>renderQ(it,i)).join("")}
    <div class="scorebar">
      <span class="st">أجبت على <b class="cnt">0</b> من ${items.length} · صحيح <b class="ok">0</b></span>
      <span style="flex:1"></span>
      <button class="btn ghost act-reset">إعادة المحاولة</button>
    </div></div>`;
}

function wireQuiz(root, items, key){
  const wrap = root.querySelector(`[data-quiz="${key}"]`);
  if(!wrap) return;
  let answered=0, correct=0;
  const cnt=wrap.querySelector(".cnt"), okEl=wrap.querySelector(".ok");

  function finish(qEl, item, right){
    const why=document.createElement("div");
    why.className="why";
    let head;
    if(right) head="إجابة صحيحة";
    else if(item.t==="num") head="الإجابة الصحيحة: "+item.ans+(item.unit?" "+item.unit:"");
    else if(item.t==="order") head="الترتيب الصحيح: "+item.items.join(" ← ");
    else if(item.t==="tf") head="الإجابة الصحيحة: "+["صح","خطأ"][item.a];
    else head="الإجابة الصحيحة: "+item.opts[item.a];
    why.innerHTML=`<b>${head}</b><br>${item.why}`;
    qEl.appendChild(why);
    answered++; if(right) correct++;
    cnt.textContent=answered; okEl.textContent=correct;
    if(!right && key!=="review" && item._sec){
      if(!state.wrong.some(w=>w.s===item._sec && w.i===item._qi)) state.wrong.push({s:item._sec,i:item._qi});
    }
    if(right && key==="review" && item._sec){
      state.wrong = state.wrong.filter(w=>!(w.s===item._sec && w.i===item._qi));
    }
    if(answered===items.length){
      const pct=Math.round(correct/items.length*100);
      wrap.querySelector(".scorebar .st").innerHTML =
        `النتيجة النهائية <b>${correct}/${items.length}</b> · ${pct}% ${pct>=70?"— اجتزت هذا القسم ✓":"— راجع القسم وأعد المحاولة"}`;
      const sec = byId(key);
      if(sec){
        state.stats[key]={c:correct,t:items.length};
        if(pct>=70) state.done[key]=true;
      }
      syncRail(); save();
    }
    syncRail(); save();
  }

  wrap.querySelectorAll(".q").forEach(qEl=>{
    const idx=+qEl.dataset.i, item=items[idx], type=qEl.dataset.type;
    if(type==="num"){
      const inp=qEl.querySelector("input"), btn=qEl.querySelector(".act-check");
      const check=()=>{
        if(qEl.dataset.locked||inp.value==="") return;
        qEl.dataset.locked="1";
        const v=parseFloat(inp.value);
        const right=Math.abs(v-item.ans)<=(item.tol||0.01);
        inp.dataset.state=right?"right":"wrong"; inp.disabled=true; btn.disabled=true; btn.style.opacity=.4;
        finish(qEl,item,right);
      };
      btn.onclick=check;
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });
    } else if(type==="order"){
      const pool=qEl.querySelector("[data-pool]"), slot=qEl.querySelector("[data-slot]");
      const btn=qEl.querySelector(".act-check"), undo=qEl.querySelector(".act-undo");
      const seq=[];
      pool.querySelectorAll(".ochip").forEach(ch=>{
        ch.onclick=()=>{ if(qEl.dataset.locked) return; seq.push(+ch.dataset.k); ch.remove();
          slot.insertAdjacentHTML("beforeend",`<button class="ochip" data-k="${ch.dataset.k}"><span class="n">${seq.length}</span>${ch.textContent}</button>`); };
      });
      undo.onclick=()=>{
        if(qEl.dataset.locked||!seq.length) return;
        const k=seq.pop(); const last=slot.lastElementChild; const txt=last.textContent.replace(/^\d+/,"");
        last.remove(); pool.insertAdjacentHTML("beforeend",`<button class="ochip" data-k="${k}">${txt}</button>`);
        pool.lastElementChild.onclick=()=>{ if(qEl.dataset.locked) return; seq.push(k); pool.lastElementChild.remove();
          slot.insertAdjacentHTML("beforeend",`<button class="ochip" data-k="${k}"><span class="n">${seq.length}</span>${txt}</button>`); };
      };
      btn.onclick=()=>{
        if(qEl.dataset.locked||seq.length!==item.items.length) return;
        qEl.dataset.locked="1";
        const right = seq.every((k,i)=>k===i);
        slot.querySelectorAll(".ochip").forEach((ch,i)=>{ ch.dataset.state = seq[i]===i?"right":"wrong"; });
        btn.disabled=true; btn.style.opacity=.4; undo.disabled=true; undo.style.opacity=.4;
        finish(qEl,item,right);
      };
    } else {
      qEl.querySelectorAll(".opt").forEach(btn=>{
        btn.onclick=()=>{
          if(qEl.dataset.locked) return;
          qEl.dataset.locked="1";
          const orig = btn.dataset.orig!==undefined ? +btn.dataset.orig : +btn.dataset.j;
          const right = orig===item.a;
          qEl.querySelectorAll(".opt").forEach(b=>{
            b.disabled=true;
            const o = b.dataset.orig!==undefined ? +b.dataset.orig : +b.dataset.j;
            if(o===item.a) b.dataset.state="right"; else if(b===btn) b.dataset.state="wrong";
          });
          finish(qEl,item,right);
        };
      });
    }
  });
  wrap.querySelector(".act-reset").onclick = ()=> go(state.current, false);
}

/* ---------- تجميع أسئلة ---------- */
function tag(items, secId){ return items.map((q,i)=>Object.assign({},q,{_sec:secId,_qi:i})); }
function pickFinal(n){
  let all=[]; SECTIONS.forEach(s=> all = all.concat(tag(s.quiz, s.id)));
  return shuffle(all).slice(0,n);
}
function reviewItems(){
  return state.wrong.map(w=>{ const s=byId(w.s); if(!s||!s.quiz[w.i]) return null;
    return Object.assign({},s.quiz[w.i],{_sec:w.s,_qi:w.i}); }).filter(Boolean);
}

/* ---------- الحاسبات ---------- */
const CALCS = {
  turnover:(v)=>{ const avg=(v.a+v.b)/2; if(!avg) return "أدخل أعدادًا صحيحة."; const r=v.c/avg*100;
    return `<b>${r.toFixed(1)}%</b> معدل الدوران<small>متوسط الموظفين = (${v.a} + ${v.b}) ÷ 2 = ${avg} · الدوران = ${v.c} ÷ ${avg} × 100</small>`; },
  compa:(v)=>{ if(!v.b) return "أدخل النقطة الوسطى."; const r=v.a/v.b;
    const t = r<0.9?"أقل بوضوح من وسط الدرجة — راجع سبب الفجوة":r<=1.1?"قريب من وسط الدرجة":"أعلى من وسط الدرجة";
    return `<b>${r.toFixed(2)}</b> Compa-Ratio<small>${v.a} ÷ ${v.b} · ${t}</small>`; },
  fte:(v)=>{ const f=v.a + v.b*0.5 + v.c*0.25; const heads=v.a+v.b+v.c;
    return `<b>${f.toFixed(2)}</b> FTE<small>عدد الرؤوس ${heads} · ${v.a} + (${v.b}×0.5) + (${v.c}×0.25)</small>`; },
  enps:(v)=>{ const tot=v.a+v.b+v.c; if(!tot) return "أدخل الأعداد."; const p=v.a/tot*100, d=v.c/tot*100; const r=p-d;
    const t = r>=50?"ممتاز":r>=20?"جيد":r>=0?"يحتاج تحسينًا":"إشارة خطر";
    return `<b>${r.toFixed(0)}</b> eNPS<small>مروجون ${p.toFixed(0)}% − منتقدون ${d.toFixed(0)}% · التقدير: ${t} · المحايدون خارج الحساب</small>`; },
  cph:(v)=>{ if(!v.c) return "أدخل عدد التعيينات."; const r=(v.a+v.b)/v.c;
    return `<b>${r.toLocaleString("en")}</b> تكلفة التعيين الواحد<small>(${v.a.toLocaleString("en")} + ${v.b.toLocaleString("en")}) ÷ ${v.c}</small>`; },
  roi:(v)=>{ if(!v.b) return "أدخل التكلفة."; const r=(v.a-v.b)/v.b*100;
    return `<b>${r.toFixed(0)}%</b> عائد الاستثمار<small>صافي العائد = ${(v.a-v.b).toLocaleString("en")} · ${r>=0?"البرنامج مربح":"البرنامج خاسر بهذه الأرقام"}</small>`; },
  absent:(v)=>{ const av=v.a*v.b; if(!av) return "أدخل الأعداد."; const r=v.c/av*100;
    return `<b>${r.toFixed(2)}%</b> معدل الغياب<small>الأيام المتاحة = ${v.a} × ${v.b} = ${av.toLocaleString("en")} يوم عمل</small>`; },
  net:(v)=>{ const g=v.a+v.b+v.c, ded=v.d+v.e+v.g, n=g-ded;
    return `<b>${n.toLocaleString("en")}</b> صافي الراتب<small>الإجمالي ${g.toLocaleString("en")} − الاستقطاعات ${ded.toLocaleString("en")} · نسبة الاستقطاع ${g?((ded/g)*100).toFixed(1):0}%</small>`; },
  eos:(v)=>{ const y=v.b, w=v.a;
    const sa = (Math.min(y,5)*w*0.5) + (Math.max(0,y-5)*w);
    const daily = w/30;
    const ae = (Math.min(y,5)*daily*21) + (Math.max(0,y-5)*daily*30);
    return `<b>${sa.toLocaleString("en",{maximumFractionDigits:0})}</b> النموذج السعودي (نصف شهر ثم شهر)
      <small>النموذج الإماراتي (21 يومًا ثم 30 يومًا على الأساسي): <strong>${ae.toLocaleString("en",{maximumFractionDigits:0})}</strong> · الأجر اليومي ${daily.toFixed(0)} · حساب توضيحي يفترض إنهاء بغير استقالة ودون تطبيق السقوف</small>`; },
  ctc:(v)=>{
    const extras=v.b+v.c+v.d+v.e+v.g+v.h, tot=v.a+extras;
    const pct=tot?((v.a/tot)*100):0, m=tot/12;
    return `<b>${tot.toLocaleString("en",{maximumFractionDigits:0})}</b> التكلفة السنوية الكاملة
      <small>الراتب يمثل ${pct.toFixed(0)}% فقط · التكاليف الإضافية ${extras.toLocaleString("en",{maximumFractionDigits:0})}
      · التكلفة الشهرية الحقيقية ${m.toLocaleString("en",{maximumFractionDigits:0})}
      · تكلفة كل 10 موظفين ${(tot*10).toLocaleString("en",{maximumFractionDigits:0})}</small>`; },
  egypt:(v)=>{
    const gross=v.a, ins=Math.min(Math.max(gross,v.b),v.c);
    const empIns=ins*0.11, erIns=ins*0.1875;
    const annual=(gross-empIns)*12 - v.d;
    const br=[[40000,0],[15000,.10],[15000,.15],[130000,.20],[200000,.225],[800000,.25],[Infinity,.275]];
    let rem=Math.max(0,annual), tax=0;
    for(const [w,r] of br){ if(rem<=0) break; const t=Math.min(rem,w); tax+=t*r; rem-=t; }
    const mTax=tax/12, net=gross-empIns-mTax;
    return `<b>${net.toLocaleString("en",{maximumFractionDigits:0})}</b> صافي الراتب الشهري
      <small>أجر الاشتراك ${ins.toLocaleString("en")} · حصة الموظف ${empIns.toLocaleString("en",{maximumFractionDigits:0})}
      · الضريبة الشهرية ${mTax.toLocaleString("en",{maximumFractionDigits:0})}
      · حصة صاحب العمل ${erIns.toLocaleString("en",{maximumFractionDigits:0})}
      · التكلفة الكلية على الشركة ${(gross+erIns).toLocaleString("en",{maximumFractionDigits:0})}
      · حساب توضيحي دون قاعدة تلاشي الشرائح</small>`; },
  span:(v)=>{ if(!v.b||!v.c) return "أدخل الأعداد."; const sp=(v.a-v.b)/v.b, hr=v.a/v.c;
    return `<b>1 : ${sp.toFixed(1)}</b> نطاق الإشراف<small>نسبة HR للموظفين = 1 : ${hr.toFixed(0)} · النطاق المرجعي لـ HR قريب من 1:100 ويختلف حسب الحجم والأتمتة</small>`; }
};

function reportText(){
  const lines=["تقرير التقدم — أكاديمية الموارد البشرية","التاريخ: "+new Date().toLocaleDateString("ar-EG"),""];
  const done=SECTIONS.filter(x=>state.done[x.id]).length;
  lines.push("الأقسام المكتملة: "+done+" من "+SECTIONS.length+" ("+Math.round(done/SECTIONS.length*100)+"%)");
  lines.push("أسئلة تحتاج مراجعة: "+state.wrong.length,"","النتائج حسب القسم:","");
  const rows=Object.keys(state.stats).map(k=>{ const sec=byId(k); if(!sec) return null;
    const st=state.stats[k]; return {t:sec.title,p:Math.round(st.c/st.t*100),c:st.c,tt:st.t}; }).filter(Boolean).sort((a,b)=>b.p-a.p);
  if(!rows.length) lines.push("لم تُسجَّل نتائج بعد.");
  rows.forEach(r=> lines.push("- "+r.t+": "+r.c+"/"+r.tt+" ("+r.p+"%)"+(r.p>=70?" ✓":"")));

  if(weak.length){ lines.push("","أقسام تحتاج مراجعة:"); weak.forEach(r=>lines.push("- "+r.t)); }
  return lines.join("\n");
}

function pickFiltered(n, lvl, type){
  let all=[];
  SECTIONS.forEach(sec=> sec.quiz.forEach((q,i)=>{
    const item=Object.assign({},q,{_sec:sec.id,_qi:i});
    if(type!=="all" && (q.t||"mcq")!==type) return;
    if(lvl!=="all" && qLevel(q,sec)!==+lvl) return;
    all.push(item);
  }));
  return shuffle(all).slice(0,n);
}

    syncRail(); if(!skipHash) history.replaceState(null,"","#flash");
    window.scrollTo({top:0,behavior:"instant"});
    return;
  } else if(id==="final"){
    const n=examCfg.n, items=pickFiltered(n, examCfg.lvl, examCfg.type);
    const mins=Math.max(5,Math.round(n));
    stage.innerHTML=`<div class="sec on"><div class="sec-head"><div class="tab">تقييم شامل</div><h1>الاختبار الشامل</h1>
      <p class="lede">اختر المستوى ونوع الأسئلة وعددها، ثم ابدأ. كل محاولة تُولّد مجموعة جديدة. الزمن المقترح دقيقة لكل سؤال.</p>
      <div class="filters">
        <label>المستوى</label>
        <select id="fLvl"><option value="all">الكل</option><option value="1">أساسي</option><option value="2">متوسط</option><option value="3">متقدم</option></select>
        <label>النوع</label>
        <select id="fType"><option value="all">الكل</option><option value="mcq">اختيار من متعدد</option><option value="tf">صح وخطأ</option><option value="num">حسابي</option><option value="order">ترتيب</option></select>
        <label>العدد</label>
        <select id="fN"><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="50">50</option></select>
        <button class="btn" id="fGo">توليد اختبار جديد</button>
      </div>
      <p class="hint" style="margin-block-start:-6px">الأسئلة الحسابية وأسئلة الترتيب مصنّفة متقدمة دائمًا لأنها تقيس التطبيق لا التعرّف، فاختيارها مع مستوى أساسي أو متوسط لن يعطي نتائج.</p>
      <div class="flashbar" style="justify-content:flex-start">
        <span class="timer" id="examTimer">الوقت المتبقي</span>
        <button class="btn ghost" id="expBtn">تصدير تقرير نتائجي</button>
        <span class="pos">${items.length} سؤالًا متاحًا بهذه المعايير</span></div></div>
      ${items.length? quizHTML(items,"final","أسئلة مختلطة") : '<div class="box warn"><span class="lbl">لا توجد أسئلة</span><p>لا توجد أسئلة تطابق هذه المعايير. جرّب توسيع المستوى أو النوع.</p></div>'}
      ${pagerHTML(id)}</div>`;
    if(items.length){ wireQuiz(stage,items,"final"); startTimer(document.getElementById("examTimer"),mins); }
    document.getElementById("fLvl").value=examCfg.lvl;
    document.getElementById("fType").value=examCfg.type;
    document.getElementById("fN").value=String(examCfg.n);
    document.getElementById("fGo").onclick=()=>{
      examCfg={lvl:document.getElementById("fLvl").value, type:document.getElementById("fType").value, n:+document.getElementById("fN").value};
      go("final");
    };
    document.getElementById("expBtn").onclick=exportReport;
  } else if(id==="review"){
    const items=reviewItems();
    stage.innerHTML=`<div class="sec on"><div class="sec-head"><div class="tab">مراجعة ذكية</div><h1>مراجعة أخطائي</h1>
      <p class="lede">${items.length? items.length+" سؤالًا أخطأت فيها سابقًا. كل سؤال تُجيب عنه صحيحًا يُحذف من القائمة نهائيًا." : "لا توجد أخطاء مسجلة بعد — ابدأ بحل أسئلة الأقسام وستُجمع أخطاؤك هنا تلقائيًا."}</p></div>
      ${items.length? quizHTML(items,"review","أسئلتك الخاطئة") : ""}
      <div class="pager"><button data-nav="home"><small>عودة</small>الصفحة الرئيسية</button></div></div>`;
    if(items.length) wireQuiz(stage,items,"review");
  } else {
    const i=SECTIONS.findIndex(s=>s.id===id);
    if(i<0){ go("home"); return; }
    const s=SECTIONS[i];
    const items=tag(s.quiz, s.id);
    stage.innerHTML=`<div class="sec on"><div class="sec-head">
      <div class="tab">${s.track} · ملف ${String(i+1).padStart(2,"0")} · ${LVLNAME[s.lvl]}</div>
      <h1>${s.title}</h1><p class="lede">${s.lede}</p></div>
      ${s.verify?`<div class="verifybar"><b>آخر تحقق ${VERIFIED}</b><span>${s.verify} تحقق من النص الساري في بلدك قبل أي إجراء رسمي.</span></div>`:""}
      ${s.html}${relatedHTML(s.id)}${quizHTML(items,s.id,"اختبر فهمك")}${pagerHTML(id)}</div>`;
    wireQuiz(stage,items,s.id);
    wireCalcs(stage); wireCopy(stage); wireDefs(stage); buildSubnav(stage);
    stage.querySelectorAll(".relcard").forEach(b=> b.onclick=()=>go(b.dataset.goto));
  }
  stage.querySelectorAll("[data-nav]").forEach(b=>{ if(b.dataset.nav) b.onclick=()=>go(b.dataset.nav); });
  syncRail();
  if(!skipHash && id!=="search"){ history.replaceState(null,"","#"+id); }
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- شريط تقدم القراءة ---------- */
const readbar=document.createElement("div");
readbar.id="readbar"; readbar.innerHTML="<i></i>";
document.body.appendChild(readbar);
const readFill=readbar.firstElementChild;
window.addEventListener("scroll",()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  readFill.style.width = h>60 ? Math.min(100,(window.scrollY/h)*100)+"%" : "0%";
});

/* ---------- زر أعلى الصفحة ---------- */
const toTop=document.createElement("button");
toTop.id="toTop"; toTop.setAttribute("aria-label","العودة لأعلى");
toTop.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
toTop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
document.body.appendChild(toTop);
window.addEventListener("scroll",()=> toTop.classList.toggle("on", window.scrollY>500));

/* ---------- نافذة الاختصارات ---------- */
const modal=document.createElement("div");
modal.className="modal"; modal.id="kbdModal";
modal.innerHTML=`<div class="modal-in">
  <h3>اختصارات ومساعدة</h3>
  <div class="kbd-row"><span>بحث</span><kbd>/</kbd></div>
  <div class="kbd-row"><span>القسم التالي</span><kbd>J</kbd></div>
  <div class="kbd-row"><span>القسم السابق</span><kbd>K</kbd></div>
  <div class="kbd-row"><span>الوضع الليلي</span><kbd>D</kbd></div>
  <div class="kbd-row"><span>الصفحة الرئيسية</span><kbd>H</kbd></div>
  <div class="kbd-row"><span>مراجعة أخطائي</span><kbd>R</kbd></div>
  <div class="kbd-row"><span>بطاقات سريعة</span><kbd>F</kbd></div>
  <div class="kbd-row"><span>مسارات التعلّم</span><kbd>L</kbd></div>
  <div class="kbd-row"><span>خريطة الدليل</span><kbd>M</kbd></div>
  <div class="kbd-row"><span>قلب البطاقة</span><kbd>مسافة</kbd></div>
  <div class="kbd-row"><span>تصدير تقرير النتائج</span><kbd>E</kbd></div>
  <div class="kbd-row"><span>طباعة القسم</span><kbd>P</kbd></div>
  <div class="kbd-row"><span>إغلاق</span><kbd>Esc</kbd></div>
  <div class="kbd-row"><span>حجم الخط</span><span class="fsbtns"><button data-fs="-">−</button><button data-fs="0">↺</button><button data-fs="+">+</button></span></div>
  <div class="kbd-row"><span>مسح كل التقدم</span><button class="btn ghost" id="resetAll">إعادة ضبط</button></div>
</div>`;
document.body.appendChild(modal);
modal.onclick=e=>{ if(e.target===modal) modal.classList.remove("on"); };
modal.querySelectorAll("[data-fs]").forEach(b=> b.onclick=()=>{
  const v=b.dataset.fs; setFs(v==="0"?100:state.fs+(v==="+"?6:-6));
});
$("#resetAll").onclick=async ()=>{
  state.done={}; state.stats={}; state.wrong=[];
  memStore=null;
  try{ if(window.storage) await window.storage.delete(KEY); }catch(e){}
  try{ if(window.localStorage) window.localStorage.removeItem(KEY); }catch(e){}
  save(); syncRail(); modal.classList.remove("on"); go("home");
};

/* ---------- لوحة المفاتيح ---------- */
document.addEventListener("keydown", e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"){ if(e.key==="Escape") e.target.blur(); return; }
  if(e.key==="Escape"){ closeRail(); modal.classList.remove("on"); return; }
  if(e.key==="/"){ e.preventDefault(); document.querySelector(".searchbox").classList.add("on"); $("#search").focus(); return; }
  if(e.key==="?"||(e.shiftKey&&e.key==="؟")||e.key==="؟"){ modal.classList.add("on"); return; }
  const k=e.key.toLowerCase();
  const i=SECTIONS.findIndex(s=>s.id===state.current);
  if(k==="j"&&i<SECTIONS.length-1) go(SECTIONS[i+1] ? SECTIONS[i+1].id : "final");
  else if(k==="j"&&i<0) go(SECTIONS[0].id);
  else if(k==="k"&&i>0) go(SECTIONS[i-1].id);
  else if(k==="d") setTheme(state.theme==="dark"?"light":"dark");
  else if(k==="h") go("home");
  else if(k==="r") go("review");
  else if(k==="f") go("flash");
  else if(k==="m") go("map");
  else if(k==="l") go("paths");
  else if(k==="e") exportReport();
  else if(e.code==="Space" && state.current==="flash"){ e.preventDefault(); flashFlipped=!flashFlipped; renderFlash(); }
  else if(k==="p") window.print();
});

/* ---------- القائمة على الجوال ---------- */
function openRail(){ rail.classList.add("open"); $("#scrim").classList.add("on"); }
function closeRail(){ rail.classList.remove("open"); $("#scrim").classList.remove("on"); }
$("#menuBtn").onclick=()=> rail.classList.contains("open")?closeRail():openRail();
$("#scrim").onclick=closeRail;

/* ---------- زر البحث على الجوال ---------- */
const searchBox = $(".searchbox");
const searchBtn = document.createElement("button");
searchBtn.className="iconbtn"; searchBtn.id="searchToggle";
searchBtn.title="بحث"; searchBtn.setAttribute("aria-label","بحث");
searchBtn.innerHTML='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
searchBtn.onclick=(e)=>{
  e.stopPropagation();
  const on = searchBox.classList.toggle("on");
  if(on) setTimeout(()=>$("#search").focus(),30);
};
document.querySelector(".ring").parentNode.insertBefore(searchBtn, document.querySelector(".ring"));
document.addEventListener("click", e=>{
  if(searchBox.classList.contains("on") && !searchBox.contains(e.target) && e.target!==searchBtn){
    searchBox.classList.remove("on");
  }
});

/* ---------- زر المساعدة في الشريط العلوي ---------- */
const helpBtn=document.createElement("button");
helpBtn.className="iconbtn"; helpBtn.title="اختصارات ومساعدة"; helpBtn.setAttribute("aria-label","مساعدة");
helpBtn.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.4v.3"/><path d="M12 17h.01"/></svg>';
helpBtn.onclick=()=> modal.classList.add("on");
$("#themeBtn").parentNode.insertBefore(helpBtn, $("#themeBtn"));

/* ---------- الروابط المباشرة ---------- */
window.addEventListener("hashchange", ()=>{
  const id=location.hash.slice(1);
  if(id && id!==state.current) go(id, true);
});

/* ---------- الإقلاع ---------- */
(async ()=>{
  await load();
  const bt=document.getElementById("boot"); if(bt) bt.remove();
  buildRail();
  const h=location.hash.slice(1);
  go(h && (byId(h)||["final","review","flash","paths","map","cert"].includes(h)) ? h : "home");
})();
</script>
</body>
