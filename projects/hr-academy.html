SECTIONS.push({id:"audit",track:T.I,title:"تدقيق الموارد البشرية (HR Audit)",lede:"فحص منهجي يكشف ثغرات الملفات والسياسات والامتثال قبل أن يكشفها التفتيش أو المحكمة.",
html:`
<h2>أنواع التدقيق</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الغرض</th></tr></thead><tbody>
<tr><td>تدقيق امتثال</td><td>التأكد من مطابقة الممارسات لقانون العمل والتأمينات والضرائب</td></tr>
<tr><td>تدقيق أفضل الممارسات</td><td>مقارنة ممارساتنا بمعايير القطاع</td></tr>
<tr><td>تدقيق استراتيجي</td><td>هل سياسات HR تخدم استراتيجية الشركة فعلًا؟</td></tr>
<tr><td>تدقيق وظيفي</td><td>فحص عميق لمجال واحد: الرواتب أو التوظيف أو الأداء</td></tr>
</tbody></table></div>

<h2>منهجية التنفيذ</h2>
<ol>
<li><strong>حدد النطاق</strong> والفترة الزمنية والمجالات المشمولة.</li>
<li><strong>اجمع الأدلة</strong>: عيّنة عشوائية من الملفات (10–20%)، السياسات، كشوف الرواتب، سجلات الحضور.</li>
<li><strong>قارن بالمعيار</strong>: القانون · اللائحة الداخلية · أفضل الممارسات.</li>
<li><strong>صنّف النتائج</strong> حسب الخطورة: حرجة / مرتفعة / متوسطة / منخفضة.</li>
<li><strong>ضع خطة تصحيح</strong> بمسؤول وموعد لكل ملاحظة.</li>
<li><strong>تابع الإغلاق</strong> وأعد الفحص بعد 90 يومًا.</li>
</ol>
<div class="box tip"><span class="lbl">قاعدة التصنيف</span><p><strong>حرجة</strong> = تُعرّض الشركة لغرامة أو دعوى فورية (عقود غير موقّعة، عدم تسجيل تأميني، لائحة جزاءات غير معتمدة). <strong>منخفضة</strong> = تحسين شكلي. لا تخلط بينهما في التقرير وإلا ضاعت الأولويات.</p></div>

<h2>قائمة المراجعة الشاملة</h2>
<div class="tpl"><div class="tpl-h"><b>قائمة تدقيق الموارد البشرية</b><button class="copybtn">نسخ</button></div><pre>
=== أولًا: ملفات الموظفين (عيّنة 10-20%) ===
[ ] عقد عمل موقّع من الطرفين وبعدد النسخ المطلوب
[ ] كل البيانات الإلزامية موجودة في العقد
[ ] المؤهل وشهادات الخبرة والمستندات الشخصية
[ ] الموقف من التجنيد / صحيفة الحالة الجنائية
[ ] الشهادة الصحية سارية
[ ] إقرار استلام لائحة الشركة موقّع
[ ] نموذج تسليم عهدة محدث
[ ] الملف الطبي محفوظ منفصلًا
[ ] لا توجد بيانات لا يوجد مبرر لجمعها

=== ثانيًا: العقود والوضع القانوني ===
[ ] لا توجد عقود منتهية يُعمل بها فعليًا
[ ] العقود محددة المدة لم تُجدد بشكل يحوّلها لغير محددة دون وعي
[ ] فترات الاختبار منصوص عليها كتابةً وضمن الحد القانوني
[ ] عقود المتعاقدين لا تحمل خصائص علاقة عمل مقنّعة
[ ] تصاريح عمل الأجانب سارية

=== ثالثًا: اللوائح والسياسات ===
[ ] لائحة النظام الأساسي معتمدة وسارية
[ ] لائحة الجزاءات معتمدة من الجهة المختصة
[ ] الموظفون أُخطروا باللوائح ووُقّع على ذلك
[ ] السياسات محدّثة بعد آخر تعديل تشريعي
[ ] سياسة مكتوبة لمكافحة التحرش والتمييز
[ ] قناة إبلاغ فعّالة مع حماية من الانتقام

=== رابعًا: الرواتب والتأمينات والضرائب ===

[ ] حالات الإنهاء مدعومة بمستندات كافية

=== سابعًا: السلامة ===
[ ] تقييم مخاطر محدّث

=== ثامنًا: البيانات والأنظمة ===

/* ========== الحوكمة وقياس خدمة HR و ESG ========== */
SECTIONS.push({id:"governance",track:T.I,title:"حوكمة خدمات HR والإفصاح الاجتماعي",lede:"كيف تُقاس جودة إدارة HR نفسها، وما بيانات الأفراد المطلوبة في تقارير الاستدامة.",
html:`
<h2>أولًا: اتفاقية مستوى الخدمة (SLA)</h2>
<div class="box def"><span class="lbl">الفكرة</span><p>HR تقيس الجميع ونادرًا ما تقيس نفسها. الـ SLA يحوّل خدمات HR من «وعود مجاملة» إلى التزامات معلنة بزمن محدد وقابلة للقياس.</p></div>
<div class="tbl"><table><thead><tr><th>الخدمة</th><th>مستوى مقترح</th><th>المؤشر</th></tr></thead><tbody>
<tr><td>إصدار خطاب إفادة عمل</td><td>خلال يومي عمل</td><td>نسبة الالتزام بالمدة</td></tr>
<tr><td>الرد على استفسار رواتب</td><td>خلال يوم عمل</td><td>متوسط زمن الاستجابة</td></tr>
<tr><td>تسوية خطأ في الراتب</td><td>خلال 3 أيام أو مع الدورة التالية</td><td>عدد الأخطاء لكل 1000 قسيمة</td></tr>
<tr><td>الرد على طلب توظيف معتمد بقائمة مرشحين</td><td>خلال 10 أيام عمل</td><td>نسبة الشواغر الملتزمة</td></tr>
<tr><td>إنهاء إجراءات الالتحاق</td><td>قبل أول يوم عمل</td><td>نسبة الجاهزية في اليوم الأول</td></tr>
<tr><td>إغلاق شكوى موظف</td><td>خلال 15 يوم عمل</td><td>متوسط زمن الإغلاق</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال على أثر عملي</span><p>شركة أعلنت SLA لخطابات الإفادة بيومين. النتيجة لم تكن سرعة فقط — بل انخفاض المتابعات والمكالمات بنحو الثلث، لأن الموظف توقف عن السؤال المتكرر «خلص ولا لسه؟». الوضوح يقلل العبء أكثر مما تفعله السرعة نفسها.</p></div>
<p><strong>مؤشرات جودة خدمة HR:</strong> نسبة الالتزام بالـ SLA · دقة كشف الرواتب · نسبة اكتمال البيانات في النظام · رضا المستفيد الداخلي · نسبة الخدمات الذاتية دون تدخل بشري · تكلفة المعاملة الواحدة.</p>

<h2>ثانيًا: نموذج نضج الموارد البشرية</h2>
<div class="tbl"><table><thead><tr><th>المستوى</th><th>الوصف</th><th>العلامة المميزة</th></tr></thead><tbody>
<tr><td>1 — تفاعلي</td><td>تنفيذ معاملات ورد فعل على الطلبات</td><td>لا توجد بيانات ولا سياسات مكتوبة</td></tr>
<tr><td>2 — منظّم</td><td>سياسات وإجراءات موثقة ومطبقة باتساق</td><td>ملفات مكتملة ودورات منتظمة</td></tr>
<tr><td>3 — قائم على البيانات</td><td>قرارات تستند لمؤشرات لا انطباعات</td><td>لوحة مؤشرات شهرية تُناقَش</td></tr>
<tr><td>4 — شريك أعمال</td><td>HR في طاولة القرار وتصمم حلولًا للأعمال</td><td>مبادرات مرتبطة بأرقام مالية</td></tr>
<tr><td>5 — استباقي</td><td>تنبؤ وتصميم للمستقبل لا استجابة للحاضر</td><td>نماذج تنبؤ وتخطيط سيناريوهات</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">قاعدة</span><p>لا تقفز مستويات. بناء تحليلات فوق بيانات ناقصة أو سياسات غير مطبقة يُنتج تقارير جميلة ومضلّلة. أتقن المستوى الثاني قبل أن تبيع المستوى الرابع.</p></div>

<h2>ثالثًا: البُعد الاجتماعي في تقارير الاستدامة (ESG)</h2>
<p>الحرف <strong>S</strong> في ESG هو نطاق الموارد البشرية مباشرة، وقد تحوّل من عمل تطوعي إلى متطلب إفصاح لدى كثير من الشركات والمستثمرين والعملاء المؤسسيين.</p>
<div class="tbl"><table><thead><tr><th>المحور</th><th>البيانات المطلوبة عادةً</th></tr></thead><tbody>
<tr><td>تركيبة القوى العاملة</td><td>الإجمالي حسب النوع والفئة العمرية والمستوى الوظيفي ونوع العقد</td></tr>
<tr><td>التنوع في القيادة</td><td>نسبة النساء والفئات الممثَّلة في الإدارة العليا ومجلس الإدارة</td></tr>
<tr><td>فجوة الأجور</td><td>الفجوة بين النوعين ونسبة أعلى أجر إلى الأجر الوسيط</td></tr>
<tr><td>الدوران والاستبقاء</td><td>معدل الدوران الكلي والاختياري وحسب الفئة</td></tr>
<tr><td>الصحة والسلامة</td><td>معدل الإصابات وأيام العمل الضائعة والوفيات</td></tr>
<tr><td>التدريب</td><td>متوسط ساعات التدريب لكل موظف والإنفاق</td></tr>
<tr><td>حقوق العمل</td><td>حرية التنظيم، آليات الشكاوى، سلاسل التوريد وعمالة الأطفال</td></tr>
<tr><td>الحوادث والانتهاكات</td><td>عدد بلاغات التحرش والتمييز ونسب الإغلاق</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">تحذيران</span>
<p><strong>الأول:</strong> لا تُفصح عن رقم لا تستطيع تتبّعه وتكراره كل سنة — التذبذب غير المفسَّر أسوأ من عدم الإفصاح.</p>
<p><strong>الثاني:</strong> الإفصاح عن بيانات تنوع في مجموعات صغيرة قد يكشف هوية أفراد. استخدم حدًا أدنى لحجم المجموعة قبل النشر.</p></div>

<h2>رابعًا: حوكمة بيانات الموظفين</h2>
<ul>
<li><strong>الغرض المحدد:</strong> لكل بيان سبب مكتوب لجمعه.</li>
<li><strong>الحد الأدنى:</strong> لا تجمع ما لا تحتاجه.</li>
<li><strong>الصلاحيات:</strong> الوصول حسب الحاجة للعلم لا حسب المنصب.</li>
<li><strong>مدة الاحتفاظ:</strong> محددة لكل نوع، مع إتلاف آمن بعدها.</li>
<li><strong>الشفافية:</strong> الموظف يعرف ما يُجمع عنه ولماذا وله حق الاطلاع.</li>
<li><strong>الأطراف الثالثة:</strong> عقود واضحة مع مزودي الأنظمة بشأن مكان تخزين البيانات ومسؤولية حمايتها.</li>
</ul>
`,

{q:"في نموذج نضج HR، القدرة على التنبؤ وتخطيط السيناريوهات تقع في المستوى:",opts:["الأول","الثاني","الثالث","الخامس"],a:3,why:"المستوى الخامس استباقي يصمم للمستقبل، بينما الثالث قائم على البيانات الوصفية والتشخيصية للحاضر."},

{q:"الحرف S في ESG يخص مباشرة:",opts:["الانبعاثات الكربونية","البُعد الاجتماعي وبيانات القوى العاملة وحقوق العمل","حوكمة مجلس الإدارة","التقارير الضريبية"],a:1,why:"Social يشمل تركيبة القوى العاملة والتنوع وفجوة الأجور والسلامة وحقوق العمل في سلاسل التوريد."},
{q:"أخطر ما في الإفصاح عن بيانات تنوع لمجموعات صغيرة:",opts:["ارتفاع التكلفة","إمكانية كشف هوية أفراد بعينهم","بطء الإعداد","اختلاف اللغة"],a:1,why:"في مجموعة من ثلاثة أشخاص قد يكشف رقم واحد هوية شخص محدد، ولذلك يُوضع حد أدنى لحجم المجموعة قبل النشر."},
{q:"«الوصول حسب الحاجة للعلم» يعني:",opts:["كل المديرين يطّلعون على كل البيانات","الصلاحية تُمنح بناءً على ما يحتاجه الشخص لأداء عمله لا بناءً على مستواه الوظيفي","البيانات متاحة للجميع","لا أحد يطّلع"],a:1,why:"المنصب الأعلى لا يعني تلقائيًا حاجة للاطلاع؛ الربط بالحاجة الوظيفية هو المبدأ الحاكم في حماية البيانات."},
{q:"صح أم خطأ: يُفضّل الإفصاح عن أكبر عدد من مؤشرات الأفراد حتى لو تعذّر تتبع بعضها سنويًا.",t:"tf",a:1,why:"المؤشر الذي لا يمكن تكراره ينتج تذبذبًا غير مفسَّر يضر بالمصداقية أكثر من عدم الإفصاح أصلًا."},
{q:"مؤشر «تكلفة المعاملة الواحدة» في HR يقيس:",opts:["راتب الموظف","كفاءة تشغيل خدمات HR وأثر الأتمتة عليها","رضا العملاء","معدل الدوران"],a:1,why:"يربط تكلفة تشغيل الخدمة بحجمها، وانخفاضه مع ثبات الجودة دليل على نجاح الأتمتة والخدمة الذاتية."}

SECTIONS.push({id:"assessments",track:T.B,title:"أدوات التقييم النفسي والمهني",lede:"MBTI و DISC و Big Five و Hogan: ما تقيسه فعلًا، وأين يُساء استخدامها في قرارات التوظيف.",
html:`
<div class="box warn"><span class="lbl">قبل أي شيء</span><p>هذه أدوات <strong>مساعدة</strong> لا حاسمة. استخدامها كمعيار وحيد للقبول أو الرفض ممارسة ضعيفة علميًا وقد تكون تمييزية قانونيًا. القاعدة: الأداة تُثري الحوار، ولا تحل محل الأدلة السلوكية والأداء الفعلي.</p></div>

<h2>مقارنة الأدوات الأربع الشهيرة</h2>
<div class="tbl"><table><thead><tr><th>الأداة</th><th>ما تقيسه</th><th>القوة</th><th>الضعف</th><th>الاستخدام المناسب</th></tr></thead><tbody>
<tr><td><strong>MBTI</strong></td><td>تفضيلات إدراكية في 4 أبعاد ثنائية تنتج 16 نمطًا</td><td>لغة مشتركة سهلة ومقبولة، ممتازة لورش فهم الذات</td><td>تصنيف ثنائي حاد، وثبات ضعيف عند إعادة الاختبار، وضعف الارتباط بالأداء</td><td>تطوير ذاتي وبناء فرق — <strong>لا</strong> للتوظيف</td></tr>
<tr><td><strong>DISC</strong></td><td>أنماط سلوكية ظاهرة: سيطرة · تأثير · ثبات · التزام</td><td>عملية وسريعة ومفيدة في التواصل والمبيعات</td><td>تصف السلوك ولا تتنبأ بالأداء، وقابلة للتلاعب</td><td>تحسين التواصل وحل الصراع</td></tr>
<tr><td><strong>Big Five</strong></td><td>خمسة عوامل: الانفتاح · يقظة الضمير · الانبساط · الوداعة · الاستقرار الانفعالي</td><td>الأقوى علميًا، وأبعاده متصلة لا ثنائية، وثباتها مرتفع</td><td>أقل جاذبية تسويقيًا وتحتاج تفسيرًا مؤهلًا</td><td>الاختيار والتطوير معًا</td></tr>
<tr><td><strong>Hogan</strong></td><td>ثلاث حزم: السمات الظاهرة · السلوكيات المدمّرة تحت الضغط · القيم والدوافع</td><td>تركيز فريد على «الجانب المظلم» الذي يظهر في الأزمات</td><td>مكلفة وتحتاج معتمدًا مؤهلًا لتفسيرها</td><td>اختيار وتطوير القيادات</td></tr>
</tbody></table></div>
<div class="box def"><span class="lbl">أهم عامل تنبؤي</span><p>من بين عوامل Big Five، <strong>يقظة الضمير (Conscientiousness)</strong> هي الأكثر ارتباطًا بالأداء الوظيفي عبر معظم الوظائف والقطاعات. أما الانبساط فيرتبط بالنجاح في أدوار محددة كالمبيعات والقيادة لا بكل الأدوار.</p></div>

<h2>لماذا يُنتقد MBTI في التوظيف تحديدًا؟</h2>
<ul>
<li><strong>الثنائية القسرية:</strong> يصنفك انبساطيًا أو انطوائيًا، بينما معظم الناس في الوسط، فتغيّر إجابة واحدة نمطك كليًا.</li>
<li><strong>ضعف الثبات:</strong> نسبة معتبرة ممن يعيدون الاختبار بعد أسابيع يحصلون على نمط مختلف.</li>
<li><strong>أثر بارنوم:</strong> الأوصاف عامة وإيجابية بحيث يشعر الجميع أنها تنطبق عليهم بدقة.</li>
<li><strong>لا يوجد نمط «سيئ»</strong> — وهذا مريح اجتماعيًا لكنه يجعله بلا قدرة على التمييز في الاختيار.</li>
</ul>
<div class="box ex"><span class="lbl">استخدام صحيح مقابل خاطئ</span>
<p><strong>خاطئ:</strong> «نبحث عن ENTJ لهذا الدور القيادي» ← إقصاء بلا سند علمي.</p>
<p><strong>صحيح:</strong> استخدام النتيجة في ورشة فريق ليفهم كل شخص كيف يختلف أسلوبه في اتخاذ القرار عن زميله، فيقل سوء الفهم.</p></div>

<h2>معايير اختيار أي أداة تقييم</h2>
<ol>
<li><strong>الصدق التنبؤي:</strong> هل يوجد دليل منشور يربط نتائجها بالأداء في وظائف مشابهة؟</li>
<li><strong>الثبات:</strong> هل تعطي نتائج متسقة عند الإعادة؟</li>
<li><strong>معايير محلية:</strong> هل تمت معايرتها على مجتمع مشابه لمرشحيك أم على عينة أجنبية فقط؟</li>
<li><strong>العدالة:</strong> هل تُنتج فروقًا منهجية بين فئات لا علاقة لها بالأداء؟</li>
<li><strong>الترجمة:</strong> هل النسخة العربية مُعتمدة ومُعاد معايرتها أم ترجمة حرفية؟</li>
<li><strong>التفسير:</strong> من سيقرأ التقرير؟ هل هو مؤهل ومعتمد؟</li>
</ol>

<h2>ترتيب أدوات الاختيار بالقدرة التنبؤية</h2>

أدنى  |  المقابلة غير المنظمة والانطباع الشخصي</div>
<div class="box tip"><span class="lbl">القاعدة العملية</span><p>الجمع بين أداتين مختلفتين في طبيعتهما (عينة عمل + مقابلة منظمة) يرفع دقة التنبؤ أكثر من إضافة أداة ثالثة تقيس نفس الشيء. التنوع في نوع القياس أهم من العدد.</p></div>

<h2>الأخلاقيات والاستخدام المسؤول</h2>
<div class="box warn"><span class="lbl">قواعد</span>
<ul style="margin:6px 0 0">
<li>أبلغ المرشح مسبقًا بنوع التقييم وغرضه ومدته.</li>
<li>امنحه تغذية راجعة عن نتيجته — من حقه معرفتها.</li>
<li>لا تستخدم أداة تطوير (مثل MBTI) في قرار قبول أو رفض.</li>
<li>احفظ نتائج التقييم بسرية وفي ملف منفصل ولمدة محددة.</li>
<li>لا تشخّص حالات نفسية — هذه ليست أدوات تشخيص طبي.</li>
</ul></div>

<h2>تحيّز القرب (Proximity Bias)</h2>
<div class="box def"><span class="lbl">تعريف</span><p>ميل غير واعٍ لتفضيل من نراهم يوميًا في الترقيات والمهام المهمة والتقدير، بصرف النظر عن الأداء الفعلي. هو أخطر ما يهدد عدالة النموذج الهجين.</p></div>
<p><strong>العلاجات العملية:</strong></p>
<ul>
<li>قياس الأداء بالنتائج المتفق عليها لا بالحضور أو سرعة الرد.</li>
<li>مراجعة بيانات الترقيات والزيادات مقسّمة حسب نمط العمل — لو انحازت للحاضرين فالمشكلة مثبتة.</li>
<li>قاعدة «إن كان أحدنا عن بُعد فالجميع عن بُعد» في الاجتماعات: كل شخص من جهازه بدل غرفة يتبعها شاشة صغيرة.</li>
<li>توثيق القرارات كتابةً بدل حسمها في ممرات المكتب.</li>
<li>تدريب المديرين على إدارة الأداء عن بُعد لا على مراقبته.</li>
</ul>

<h2>التواصل المتزامن مقابل غير المتزامن</h2>
<div class="tbl"><table><thead><tr><th>متزامن (اجتماع/مكالمة)</th><th>غير متزامن (وثيقة/رسالة/تسجيل)</th></tr></thead><tbody>
<tr><td>مناسب للقرارات المعقدة والمواضيع الحساسة وبناء العلاقة</td><td>مناسب للتحديثات والمراجعات ومشاركة المعلومة</td></tr>
<tr><td>مكلف: يستهلك وقت الجميع في نفس اللحظة</td><td>يحترم فروق التوقيت وتركيز العمل العميق</td></tr>
<tr><td>القرار يضيع إن لم يُوثَّق</td><td>موثق تلقائيًا وقابل للبحث</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">قاعدة عملية</span><p>قبل أي اجتماع اسأل: هل يمكن أن يكون وثيقة؟ ولو كان لا بد منه، فليكن له <strong>غرض مكتوب ومخرَج محدد</strong>، وليُختم بثلاثة أسطر: ما القرار؟ من المسؤول؟ ما الموعد؟ — وتُنشر للجميع.</p></div>

<h2>سياسة العمل عن بُعد — البنود الأساسية</h2>
<div class="chips"><span class="chip">من يستحق ومن لا يستحق ولماذا</span><span class="chip">أيام ونسب الحضور</span><span class="chip">ساعات التداخل الإلزامية</span><span class="chip">توفير الأجهزة والإنترنت</span><span class="chip">أمن المعلومات وشبكات العمل</span><span class="chip">بيئة العمل المنزلية والسلامة</span><span class="chip">قواعد التوثيق والاجتماعات</span><span class="chip">العمل من دولة أخرى وأثره الضريبي</span><span class="chip">حق الانفصال بعد ساعات العمل</span><span class="chip">آلية سحب الامتياز عند تدهور الأداء</span></div>
<div class="box warn"><span class="lbl">تنبيه قانوني وضريبي</span><p>السماح لموظف بالعمل من دولة أخرى ولو مؤقتًا قد يُنشئ التزامات ضريبية وتأمينية في تلك الدولة — وأحيانًا «منشأة دائمة» للشركة. لا تعتمد ذلك بموافقة مدير مباشر؛ اجعله قرارًا يمر على HR والمالية والقانون.</p></div>

<h2>قياس الأداء عن بُعد</h2>

SECTIONS.push({id:"ma",track:T.D,title:"الاندماج والاستحواذ من منظور HR",lede:"العناية الواجبة، مواءمة الحزم، دمج الثقافات، والاحتفاظ بالكفاءات خلال أخطر فترة في حياة شركتين.",
html:`
<div class="box def"><span class="lbl">الحقيقة الصعبة</span><p>نسبة كبيرة من صفقات الاندماج تفشل في تحقيق قيمتها المتوقعة، والسبب الأشيع ليس ماليًا ولا قانونيًا — بل <strong>ثقافي وبشري</strong>: رحيل الكفاءات، تعارض أساليب العمل، وغياب الوضوح.</p></div>

<h2>المراحل الثلاث ودور HR في كل منها</h2>
<div class="tbl"><table><thead><tr><th>المرحلة</th><th>دور HR</th></tr></thead><tbody>
<tr><td><strong>ما قبل الصفقة</strong> (Due Diligence)</td><td>كشف الالتزامات والمخاطر البشرية المخفية وتقدير كلفتها</td></tr>
<tr><td><strong>الإغلاق والانتقال</strong></td><td>التواصل، الاحتفاظ بالكفاءات الحرجة، استمرارية الرواتب والمزايا</td></tr>
<tr><td><strong>ما بعد الدمج</strong> (Integration)</td><td>مواءمة الهياكل والحزم والسياسات وبناء ثقافة مشتركة</td></tr>
</tbody></table></div>

<h2>العناية الواجبة البشرية — ماذا تفحص؟</h2>
<div class="tbl"><table><thead><tr><th>المجال</th><th>الأسئلة الحاسمة</th></tr></thead><tbody>
<tr><td>الالتزامات المالية</td><td>مخصصات نهاية الخدمة والإجازات · مستحقات غير مسددة · فروق تأمينية</td></tr>
<tr><td>العقود</td><td>عقود بشروط استثنائية · بنود «تغيير السيطرة» التي تمنح تعويضات عند الاستحواذ</td></tr>
<tr><td>النزاعات</td><td>دعاوى عمالية قائمة أو محتملة وتقدير مخصصاتها</td></tr>
<tr><td>الامتثال</td><td>تسجيل تأميني ناقص · لوائح غير معتمدة · مخالفات تفتيش سابقة</td></tr>
<tr><td>القوى العاملة</td><td>التركيبة والأعمار والدوران والاعتماد على أفراد بعينهم</td></tr>
<tr><td>التعويضات</td><td>فجوة الحزم بين الشركتين وكلفة المواءمة</td></tr>
<tr><td>الكفاءات الحرجة</td><td>من الذين لو رحلوا انهارت القيمة المستهدفة من الصفقة؟</td></tr>
<tr><td>الثقافة</td><td>أسلوب القرار · العلاقة بالسلطة · سرعة الإيقاع · تحمّل الخطأ</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">البند الذي يُنسى دائمًا</span><p><strong>الاعتماد على أفراد بعينهم (Key Person Risk)</strong>. شركة صغيرة تُشترى بسبب علاقات مؤسسها بالعملاء، ثم يرحل بعد فترة الاحتفاظ فتتبخر نصف القيمة. يجب تقدير هذا الخطر وتسعيره في الصفقة نفسها لا بعدها.</p></div>

<h2>مواءمة الحزم بعد الدمج</h2>
<div class="tbl"><table><thead><tr><th>الخيار</th><th>الوصف</th><th>الأثر</th></tr></thead><tbody>
<tr><td>الرفع للأعلى</td><td>توحيد الجميع على الحزمة الأفضل</td><td>مقبول اجتماعيًا لكنه الأغلى</td></tr>
<tr><td>التوحيد على هيكل جديد</td><td>بناء سلّم موحد بمرحلة انتقالية</td><td>الأعدل طويلًا لكنه يحتاج وقتًا وشرحًا</td></tr>
<tr><td>الإبقاء المؤقت (Grandfathering)</td><td>حماية الأوضاع القائمة للحاليين وتطبيق الجديد على القادمين</td><td>يقلل المقاومة لكنه يُبقي ازدواجية سنوات</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">قاعدة</span><p>الخفض المباشر للمزايا القائمة هو أسرع طريق لموجة استقالات وربما نزاعات قانونية، لأن الحقوق المكتسبة محمية في معظم التشريعات. إن كان لا بد من التقليص فليكن تدريجيًا ومعلنًا ومقابل شيء آخر.</p></div>

<h2>الاحتفاظ بالكفاءات خلال الانتقال</h2>
<ul>
<li><strong>حدد قائمة الحرجين مبكرًا</strong> — قبل الإعلان لا بعده.</li>
<li><strong>مكافأة بقاء (Retention Bonus)</strong> مرتبطة بمدة محددة ونتائج انتقال.</li>
<li><strong>وضوح الدور خلال أسابيع لا شهور</strong> — الغموض أخطر من الخبر السيئ.</li>
<li><strong>حوارات فردية</strong> مع كل شخص في القائمة الحرجة خلال الأسبوعين الأولين.</li>
<li><strong>حماية من التحيّز</strong> ضد موظفي الشركة المستحوَذ عليها في الترقيات والفرص.</li>
</ul>

<h2>دمج الثقافات</h2>
<div class="box ex"><span class="lbl">ما الذي يُدمج فعلًا؟</span><p>الثقافة ليست الشعارات بل <strong>الآليات</strong>: كيف يُتخذ القرار؟ من يحضر الاجتماع؟ كيف يُكافأ الناس؟ ماذا يحدث عند الخطأ؟ كم يستغرق اعتماد الإنفاق؟ ادمج هذه الآليات وستتبعها الثقافة. اكتفِ بورشة قيم وستبقى شركتان تحت اسم واحد.</p></div>
<p><strong>مسار عملي:</strong> تشخيص الفروق قبل الدمج ← تسمية الفروق علنًا بدل تجاهلها ← اختيار «طريقة العمل» في كل فارق صراحةً ← فرق مختلطة في المشاريع الأولى ← قياس الاندماج بعد 90 و180 يومًا.</p>

<h2>التواصل — القاعدة الحاكمة</h2>
<div class="box warn"><span class="lbl">قاعدة اليوم الأول</span><p>الموظفون يسألون ثلاثة أسئلة فقط: <strong>هل وظيفتي باقية؟ هل مديري سيتغير؟ هل راتبي ومزاياي ستتغير؟</strong> أي رسالة لا تجيب على هذه الثلاثة — ولو بـ«لا نعرف بعد وسنخبركم في تاريخ كذا» — لن يُسمع منها شيء آخر.</p></div>

/* ========== الورديات والعمالة الميدانية ========== */
SECTIONS.push({id:"shifts",track:T.B,title:"جدولة الورديات والعمالة الميدانية",lede:"المصانع والتجزئة والخدمات: أنماط الورديات، حساب التغطية، والتوظيف الجماعي والموسمي.",
html:`
<h2>حساب احتياج التغطية</h2>
<div class="box def"><span class="lbl">الخطأ الأشهر</span><p>افتراض أن تشغيل مركز على مدار الساعة يحتاج <strong>3 أشخاص</strong> لأن اليوم ثلاث ورديات. الحقيقة أنه يحتاج أكثر — لأن الأشخاص يأخذون إجازات ويمرضون ويتدربون ويتركون العمل.</p></div>
<div class="formula">عدد الموظفين المطلوب = (عدد المراكز × ساعات التشغيل الأسبوعية) ÷ ساعات عمل الفرد الأسبوعية × معامل التغطية</div>
<p><strong>معامل التغطية</strong> يعوّض الغياب والإجازات والتدريب والدوران، ويتراوح عادةً بين 1.15 و1.35 حسب معدلات الغياب والدوران في المنشأة.</p>
<div class="box ex"><span class="lbl">مثال محلول</span>
<p>مصنع يعمل 24 ساعة × 7 أيام = 168 ساعة أسبوعيًا، ويحتاج مشغّلًا واحدًا في كل لحظة، وساعات عمل الفرد 48 أسبوعيًا، ومعامل التغطية 1.25.</p>
<p><code>168 ÷ 48 = 3.5</code> ثم <code>3.5 × 1.25 = 4.375</code> ← <strong>يلزم 5 مشغّلين</strong> لتغطية مركز واحد على مدار الساعة.</p>
<p class="hint">من يخطط بثلاثة سيعيش على الأجر الإضافي الدائم — وهو أغلى من التوظيف وأكثر إنهاكًا للفريق.</p></div>

<h2>أنماط الورديات الشائعة</h2>
<div class="tbl"><table><thead><tr><th>النمط</th><th>الوصف</th><th>الميزة</th><th>العيب</th></tr></thead><tbody>
<tr><td>ثابتة</td><td>كل موظف على وردية واحدة دائمًا</td><td>استقرار بيولوجي واجتماعي</td><td>عدم عدالة في توزيع الورديات الليلية</td></tr>
<tr><td>دوّارة بطيئة</td><td>تغيير الوردية كل أسبوع أو أكثر</td><td>عدالة أعلى</td><td>تكيّف بيولوجي متكرر</td></tr>
<tr><td>دوّارة سريعة</td><td>تغيير كل يومين أو ثلاثة</td><td>تراكم أقل لإجهاد الليل</td><td>ارتباك في الحياة الشخصية</td></tr>
<tr><td>2-2-3 (Panama)</td><td>ورديات 12 ساعة بنمط يومين عمل ويومان راحة وثلاثة عمل</td><td>عطلات طويلة متكررة</td><td>يوم عمل طويل ومرهق</td></tr>
<tr><td>مرنة/عند الطلب</td><td>جدولة حسب ذروة الطلب</td><td>كفاءة تكلفة عالية</td><td>عدم استقرار دخل الموظف ودوران مرتفع</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">قاعدة صحية</span><p>الاتجاه الطبي المفضّل عمومًا هو الدوران <strong>للأمام</strong> (صباحي ← مسائي ← ليلي) لا للخلف، لأنه أقرب لإيقاع الجسم الطبيعي. كما يُنصح بحد أدنى من ساعات الراحة بين ورديتين وتجنّب تراكم الورديات الليلية المتتالية.</p></div>

<h2>مبادئ جدولة عادلة</h2>
<ul>
<li><strong>إشعار مسبق كافٍ</strong> بالجدول — التغيير المفاجئ أكبر شكوى في العمالة الميدانية.</li>
<li><strong>توزيع عادل</strong> للورديات غير المرغوبة (ليل، عطلات، أعياد) بآلية معلنة.</li>
<li><strong>آلية تبادل ورديات</strong> بين الموظفين بموافقة المشرف.</li>
<li><strong>تجنّب الإغلاق-الافتتاح</strong> (وردية مسائية متأخرة يتبعها صباحية مبكرة).</li>
<li><strong>سقف للأجر الإضافي</strong> يمنع اعتماد التشغيل عليه بشكل دائم.</li>
</ul>

<h2>التوظيف الجماعي والموسمي</h2>
<div class="tbl"><table><thead><tr><th>الفرق</th><th>التوظيف العادي</th><th>التوظيف الجماعي</th></tr></thead><tbody>
<tr><td>الهدف</td><td>أفضل مرشح ممكن</td><td>عدد كافٍ يستوفي حدًا أدنى في وقت محدد</td></tr>
<tr><td>الأداة</td><td>مقابلات فردية معمقة</td><td>فرز آلي · جلسات جماعية · معايير حد أدنى واضحة</td></tr>
<tr><td>المؤشر الحاكم</td><td>جودة التعيين</td><td>نسبة الإنجاز في الموعد ونسبة البقاء بعد 30 يومًا</td></tr>
<tr><td>الخطر</td><td>بطء الإغلاق</td><td>دوران هائل في أول شهر إذا ضعف الفرز أو التهيئة</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">مفتاح النجاح</span><p>في التوظيف الموسمي، أكبر مكسب ليس في سرعة التوظيف بل في <strong>معدل العودة</strong>: احتفظ ببيانات من أدّوا جيدًا وادعُهم للموسم التالي مباشرة. عائد متكرر يوفر التوظيف والتدريب والتهيئة كاملة.</p></div>

<h2>خصائص إدارة العمالة الميدانية</h2>
<div class="grid">
<div class="card"><h4>التواصل</h4><p>لا بريد إلكتروني ولا أجهزة مكتبية — تحتاج قنوات على الهاتف ولوحات في الموقع.</p></div>
<div class="card"><h4>التدريب</h4><p>قصير وعملي وفي الموقع، لا قاعات ومحاضرات.</p></div>
<div class="card"><h4>الأداء</h4><p>مؤشرات تشغيلية يومية (إنتاج، جودة، سلامة) لا تقييم سنوي مجرد.</p></div>
<div class="card"><h4>الاستبقاء</h4><p>المشرف المباشر وجدولة العمل هما أقوى عاملي بقاء — أقوى من الراتب أحيانًا.</p></div>
</div>

/* ========== التنوع والشمول والرفاهية ========== */
SECTIONS.push({id:"dei",track:T.D,title:"التنوع والشمول والرفاهية",lede:"من الشعارات إلى الأدوات: كيف يُقاس التنوع فعلًا، وكيف تُبنى برامج رفاهية لها أثر.",
html:`
<h2>ثلاثة مفاهيم لا تترادف</h2>
<div class="tbl"><table><thead><tr><th>المفهوم</th><th>السؤال الذي يجيبه</th><th>مثال</th></tr></thead><tbody>
<tr><td><strong>التنوع (Diversity)</strong></td><td>من الموجود في الغرفة؟</td><td>تركيبة الفريق حسب النوع والخلفية والتخصص والعمر</td></tr>
<tr><td><strong>الإنصاف (Equity)</strong></td><td>هل يحصل الجميع على ما يحتاجونه للمنافسة بعدل؟</td><td>معايير ترقية موحدة ومعلنة ومراجعة فجوات الأجر</td></tr>
<tr><td><strong>الشمول (Inclusion)</strong></td><td>هل يشعر الموجودون بأن صوتهم مسموع ومؤثر؟</td><td>من يتكلم في الاجتماع؟ من يُقاطَع؟ من تُؤخذ فكرته؟</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">العبارة الأشهر</span><p>«التنوع أن تُدعى إلى الحفل، والشمول أن تُدعى للرقص، والإنصاف أن تُختار الموسيقى بمشاركتك.» التوظيف المتنوع بلا شمول ينتج بابًا دوارًا: تدخل الكفاءات المختلفة ثم ترحل خلال سنة.</p></div>

<h2>ما الذي يُقاس فعلًا؟</h2>
<div class="tbl"><table><thead><tr><th>المؤشر</th><th>ما يكشفه</th></tr></thead><tbody>
<tr><td>التمثيل حسب المستوى الوظيفي</td><td>التمثيل الجيد في القاعدة مع غيابه في القيادة يكشف «سقفًا زجاجيًا»</td></tr>
<tr><td>معدل الترقية حسب الفئة</td><td>هل فرص التقدم متساوية فعلًا؟</td></tr>
<tr><td>الدوران حسب الفئة</td><td>ترك فئة معينة بمعدل أعلى إشارة قوية على ضعف الشمول</td></tr>
<tr><td>فجوة الأجر</td><td>الفرق في الأجر لنفس الدور والدرجة والخبرة</td></tr>
<tr><td>نسبة النجاح في مراحل التوظيف</td><td>في أي مرحلة تحديدًا تتساقط فئة معينة؟</td></tr>
<tr><td>مؤشر الشمول في الاستبيان</td><td>«أشعر أن رأيي مسموع» و«أستطيع أن أكون على طبيعتي في العمل»</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال تشخيصي</span><p>شركة تشتكي من ضعف تمثيل فئة معينة في القيادة. تحليل مراحل التوظيف أظهر أن نسبة التقدم متساوية، ونسبة اجتياز الفرز متساوية، لكن نسبة النجاح في <strong>المقابلة النهائية</strong> تنخفض بشدة. التشخيص انتقل من «مشكلة استقطاب» إلى «مشكلة تحيّز في مرحلة واحدة محددة» — وهو ما يمكن معالجته بمقابلات منظمة ولجان متنوعة.</p></div>

<h2>تدخلات لها أثر مثبت مقابل تدخلات شكلية</h2>
<div class="tbl"><table><thead><tr><th>له أثر</th><th>شكلي غالبًا</th></tr></thead><tbody>
<tr><td>مقابلات منظمة بمعايير مكتوبة</td><td>دورة توعية بالتحيّز لمرة واحدة</td></tr>
<tr><td>مراجعة إعلانات الوظائف من لغة إقصائية</td><td>شعارات وحملات داخلية</td></tr>
<tr><td>لجان تقييم متنوعة</td><td>تعيين رمزي في منصب واحد</td></tr>
<tr><td>مراجعة دورية لفجوة الأجر وتصحيحها</td><td>الاكتفاء بنشر رقم التنوع سنويًا</td></tr>
<tr><td>مسارات رعاية (Sponsorship) لا إرشاد فقط</td><td>برنامج إرشاد بلا متابعة</td></tr>
<tr><td>مساءلة المديرين عن مؤشرات فرقهم</td><td>وضع الهدف بلا مالك</td></tr>
</tbody></table></div>
<div class="box def"><span class="lbl">فرق مهم</span><p><strong>الإرشاد (Mentoring)</strong> يعطيك نصيحة. <strong>الرعاية (Sponsorship)</strong> يستخدم راعيك رأسماله السياسي ليرشّحك لفرصة أنت غير موجود في غرفتها. الفئات الأقل تمثيلًا غالبًا تحصل على إرشاد وفير ورعاية شحيحة — وهذا أحد أسباب توقفها عند مستوى معين.</p></div>

<h2>الرفاهية (Wellbeing) — الأبعاد الأربعة</h2>
<div class="grid">
<div class="card"><h4>جسدية</h4><p>الفحوص الدورية · بيئة عمل صحية · النشاط · جودة النوم لمن يعملون بالورديات.</p></div>
<div class="card"><h4>نفسية</h4><p>عبء عمل واقعي · وضوح الدور · دعم نفسي سري · حق الانفصال بعد الدوام.</p></div>
<div class="card"><h4>مالية</h4><p>أجر عادل · تثقيف مالي · سلف منضبطة · الضغط المالي من أكبر مسببات التشتت والإجهاد.</p></div>
<div class="card"><h4>اجتماعية</h4><p>الترابط بالفريق · الشعور بالانتماء · دعم عند الأزمات الشخصية.</p></div>
</div>
<div class="box warn"><span class="lbl">أهم درس في الرفاهية</span><p>معظم برامج الرفاهية تفشل لأنها تعالج <strong>الأعراض</strong> لا <strong>الأسباب</strong>. جلسة يوجا شهرية لفريق يعمل 60 ساعة أسبوعيًا بأهداف غير واقعية ومدير متنمّر ليست رفاهية — بل إهانة مغلّفة. عالج تصميم العمل أولًا: عبء العمل، وضوح الدور، مساحة التحكم، وجودة الإشراف.</p></div>
<p><strong>مؤشرات إنذار مبكر:</strong> ارتفاع الغياب قصير المدى · تراكم أرصدة الإجازات دون استخدام · ساعات إضافية مزمنة في قسم بعينه · ارتفاع الدوران في فريق مدير واحد · انخفاض بند «عبء العمل معقول» في الاستبيان.</p>
`,

/* ========== دراسات حالة طويلة ========== */
SECTIONS.push({id:"cases",track:T.G,title:"دراسات حالة تطبيقية",lede:"ست حالات كاملة بمعطيات وأرقام وتحليل خطوة بخطوة — من التشخيص إلى القرار.",
html:`
<div class="box tip"><span class="lbl">كيف تستفيد</span><p>اقرأ المعطيات أولًا وحاول أن تكتب تحليلك وقرارك قبل أن تنزل للتحليل المعروض. الفائدة في المقارنة بين منطقك ومنطق التحليل — لا في حفظ الإجابة.</p></div>

<hr class="rule">
<h2>الحالة الأولى: دوران يلتهم الأرباح</h2>
<div class="box def"><span class="lbl">المعطيات</span>
<p>شركة خدمات مالية، 420 موظفًا، إيراد سنوي 180 مليونًا، ربح تشغيلي 21 مليونًا.</p>
<p>معدل الدوران ارتفع من 14% إلى 26% خلال سنتين. تحليل التاركين: 71% منهم من إدارة العمليات (140 موظفًا)، و64% تركوا خلال أول 18 شهرًا. متوسط تكلفة الإحلال 95 ألفًا. مقابلات الخروج: 38% ذكروا «غياب مسار وظيفي»، و27% «المدير المباشر»، و19% «الأجر».</p>
<p>الإدارة تطلب زيادة عامة في الرواتب 12%.</p></div>
<div class="box ex"><span class="lbl">التحليل</span>
<p><strong>1. حجم المشكلة ماليًا:</strong> 26% × 420 = 109 تاركين × 95 ألفًا = <strong>10.4 مليون سنويًا</strong>، أي نصف الربح التشغيلي تقريبًا. هذا هو الرقم الذي يجب أن يبدأ به العرض.</p>
<p><strong>2. المشكلة ليست عامة:</strong> 71% من إدارة واحدة تمثل ثلث الشركة. الزيادة العامة 12% ستكلف نحو 8 ملايين سنويًا وتوزَّع على 420 موظفًا معظمهم غير مغادرين — أي إنفاق ضخم على غير محل المشكلة.</p>
<p><strong>3. السبب المعلن ليس الأول:</strong> الأجر ثالثًا (19%) خلف المسار الوظيفي (38%) والمدير (27%). زيادة الأجر ستعالج أقل الأسباب وزنًا.</p>
<p><strong>4. التوقيت يكشف الخلل:</strong> 64% في أول 18 شهرًا ← المشكلة في الاختيار أو التهيئة أو وعود مرحلة التوظيف، لا في الاستبقاء طويل المدى.</p></div>
<div class="box tip"><span class="lbl">التوصية</span>
<p><strong>بدل الزيادة العامة، ثلاثة تدخلات مركّزة على إدارة العمليات:</strong></p>
<p>أ. بناء مستويين وظيفيين داخل الإدارة بمعايير ترقية معلنة (يعالج 38% من الأسباب) — تكلفة نحو 1.4 مليون.</p>
<p>ب. تقييم ثم تدريب إلزامي لمشرفي الإدارة مع مساءلة عن دوران فرقهم (يعالج 27%) — نحو 300 ألف.</p>
<p>ج. مراجعة أجور الدرجات الأدنى في هذه الإدارة تحديدًا مقابل السوق (يعالج 19%) — نحو 1.9 مليون.</p>
<p><strong>الإجمالي 3.6 مليون مقابل 8 ملايين للزيادة العامة</strong>، ومستهدف: خفض الدوران إلى 16% خلال 12 شهرًا = توفير نحو 4 ملايين. ومؤشر المتابعة: دوران الإدارة شهريًا وترك السنة الأولى.</p></div>

<hr class="rule">
<h2>الحالة الثانية: توسّع سريع بلا خطة قوى عاملة</h2>
<div class="box def"><span class="lbl">المعطيات</span>
<p>سلسلة مطاعم، 22 فرعًا، خطة افتتاح 10 فروع خلال 9 أشهر. كل فرع يحتاج 18 موظفًا منهم مدير ومساعدان.</p>
<p>الدوران الحالي في الفروع 55% سنويًا. زمن تدريب المدير الجديد 4 شهور. المديرون الحاليون: 22 مديرًا، ولا يوجد مخزون خلفاء. الترقية الداخلية السابقة كانت بمعدل 3 مديرين سنويًا.</p></div>
<div class="box ex"><span class="lbl">التحليل</span>
<p><strong>1. حساب الاحتياج الكلي:</strong> 10 فروع × 18 = 180 تعيينًا للتوسع. <em>بالإضافة</em> إلى إحلال الدوران: 22 فرعًا × 18 = 396 موظفًا حاليًا × 55% = 218 إحلالًا. <strong>الإجمالي نحو 398 تعيينًا في 9 أشهر</strong>، أي نحو 44 شهريًا.</p>
<p><strong>2. عنق الزجاجة ليس العدد بل القيادة:</strong> نحتاج 10 مديرين + 20 مساعدًا. القدرة الحالية على التخريج 3 مديرين سنويًا، ووقت التدريب 4 شهور. <strong>هذه هي القيود الحاكمة</strong>، والتوظيف الجماعي للعمالة قابل للحل بالحجم أما القيادة فلا.</p>
<p><strong>3. الخطر الأكبر:</strong> سحب مديري الفروع الحالية لافتتاح الجديدة يترك 10 فروع ناضجة بقيادة ضعيفة — فتنخفض مبيعاتها لتمويل فروع لم تنضج بعد.</p></div>
<div class="box tip"><span class="lbl">التوصية</span>
<p>أ. <strong>ابدأ ببرنامج مديرين قبل 5 شهور من أول افتتاح</strong>: رشّح 20 مساعدًا (ضعف العدد لتغطية التسرب) وابدأ تدريبهم فورًا.</p>
<p>ب. <strong>وظّف 3–4 مديرين من الخارج</strong> للفروع الأصعب مع قبول أن نسبة نجاحهم أقل من المرقّين داخليًا.</p>
<p>ج. <strong>عالج الدوران أولًا</strong>: خفضه من 55% إلى 45% يوفر 40 تعيينًا ويحرر طاقة التوظيف للتوسع — أرخص من مضاعفة فريق التوظيف.</p>
<p>د. <strong>أعد جدولة الافتتاحات</strong> بحسب جاهزية القيادة لا بحسب جاهزية العقار — وهذه أصعب رسالة يجب أن تقولها للإدارة، وأهمها.</p></div>

<hr class="rule">
<h2>الحالة الثالثة: نظام تقييم فقد مصداقيته</h2>
<div class="box def"><span class="lbl">المعطيات</span>
<p>شركة صناعية 900 موظف. نتائج التقييم السنوي: 91% حصلوا على «يفوق التوقعات» أو أعلى، و0.4% فقط «دون التوقعات».</p>
<p>في نفس العام: انخفض الإنتاج 8%، وارتفعت شكاوى الجودة 30%، وفي استبيان الاندماج قال 62% إن «التقييم لا يعكس الأداء الفعلي». المكافأة السنوية مرتبطة مباشرة بدرجة التقييم.</p></div>
<div class="box ex"><span class="lbl">التحليل</span>
<p><strong>1. التشخيص:</strong> تضخم تقييمي كلاسيكي ناتج عن <em>التساهل</em> (Leniency). سببه المباشر الربط المباشر بالمكافأة: المدير يعلم أن تقييمًا منخفضًا يعني حرمان موظفه من المال، فيتجنب المواجهة.</p>
<p><strong>2. الأثر:</strong> النظام لم يفقد الدقة فقط — بل صار <strong>ضارًا</strong>. المتميز يرى أن تميّزه بلا قيمة تمييزية، والضعيف يتلقى تأكيدًا بأن أداءه ممتاز فلا يتحسن.</p>
<p><strong>3. ما لا يجب فعله:</strong> فرض توزيع إجباري صارم فورًا. سيُقابل بمقاومة شديدة ويُنتج ظلمًا في الفرق الصغيرة عالية الأداء.</p></div>
<div class="box tip"><span class="lbl">التوصية</span>
<p>أ. <strong>افصل حوار الأداء عن حوار المكافأة زمنيًا</strong> — بفارق شهرين على الأقل.</p>
<p>ب. <strong>أدخل جلسات معايرة (Calibration)</strong> بين المديرين قبل اعتماد الدرجات، يعرض فيها كل مدير مبرراته أمام أقرانه.</p>
<p>ج. <strong>حوّل المعايير إلى وصف سلوكي (BARS)</strong> بدل مقياس رقمي مجرد.</p>
<p>د. <strong>اربط جزءًا من تقييم المدير نفسه</strong> بجودة إدارته للأداء لا بمتوسط درجات فريقه.</p>
<p>هـ. <strong>ابدأ بإدارة واحدة تجريبيًا لسنة</strong> ثم عمّم بالنتائج — التغيير المفاجئ في نظام يمس أموال الناس يحتاج دليلًا لا قرارًا.</p></div>

<hr class="rule">
<h2>الحالة الرابعة: شكوى تحرش ضد مدير عالي الأداء</h2>
<div class="box def"><span class="lbl">المعطيات</span>
<p>موظفة تقدّمت بشكوى ضد مدير إقليمي يحقق أعلى نتائج مبيعات في الشركة. الشكوى تتضمن تعليقات متكررة وطلبات لقاءات خارج العمل. لا يوجد شهود مباشرون، لكن هناك رسائل نصية.</p>
<p>المدير التنفيذي يقول: «الرجل يحقق 30% من مبيعاتنا، ولنتعامل مع الأمر بهدوء وبلا تحقيق رسمي.»</p></div>
<div class="box ex"><span class="lbl">التحليل</span>
<p><strong>1. الأداء ليس عاملًا في القرار.</strong> إدخاله في المعادلة هو أخطر ما يمكن أن تفعله المنظمة، لأنه يُعلن ضمنًا أن الحماية تُشترى بالنتائج.</p>
<p><strong>2. المخاطر عند التستر:</strong> قانونية (مسؤولية الشركة عن العلم وعدم التصرف) · سمعوية · وأهمها أن الرسالة ستصل لكل موظفة في الشركة، فتنهار الثقة في المنظومة كلها.</p>
<p><strong>3. غياب الشهود ليس غياب أدلة.</strong> الرسائل النصية دليل، والنمط السلوكي يمكن فحصه عبر مقابلات سابقة أو شكاوى قديمة أو مقابلات خروج.</p></div>
<div class="box tip"><span class="lbl">مسار العمل</span>
<p>أ. توثيق الشكوى بلغة المُبلِّغة وتأمينها كتابةً من الانتقام.</p>
<p>ب. تقييم مخاطر فورية: فصل مؤقت للتواصل المباشر بينهما أثناء التحقيق.</p>
<p>ج. تحقيق مستقل <strong>خارج نطاق سلطة المشكو منه</strong>، وبمستشار خارجي إن لزم.</p>
<p>د. فحص النمط: مقابلات خروج سابقة من فريقه، وشكاوى قديمة، ومعدل دوران الإناث في إدارته.</p>
<p>هـ. توثيق رفضك المهني كتابةً لطلب «عدم التحقيق» — هذه حماية للشركة ولك.</p>
<p>و. قرار متناسب مع نتيجة التحقيق يُطبَّق بنفس المعيار المطبق على أي موظف آخر.</p>
<p class="hint">الرسالة الجوهرية للإدارة: تكلفة خسارة مدير مبيعات قابلة للحساب والتعويض، أما تكلفة ثبوت تستر الشركة على تحرش فغير محدودة ولا تُستعاد.</p></div>

<hr class="rule">
<h2>الحالة الخامسة: عرض عمل وفجوة أجر داخلية</h2>
<div class="box def"><span class="lbl">المعطيات</span>
<p>مهندس برمجيات أول لديه 6 سنوات خبرة، راتبه 38 ألفًا. وصله عرض خارجي بـ 52 ألفًا. هو من أفضل ثلاثة مطورين ويقود مشروعًا حرجًا يُسلَّم بعد 5 شهور.</p>
<p>نطاق درجته: 32–46 ألفًا، ونقطة الوسط 39. اثنان من زملائه بنفس المستوى يتقاضيان 36 و41 ألفًا. مسح السوق يُظهر أن الوسط الحالي لهذا الدور 48 ألفًا — أي أن نطاق درجتنا نفسه متأخر عن السوق.</p></div>
<div class="box ex"><span class="lbl">التحليل</span>
<p><strong>1. Compa-Ratio له = 38/39 = 0.97</strong> — أي أنه في وسط درجته تمامًا. المشكلة إذن ليست في عدالتنا الداخلية بل في أن <strong>الهيكل كله متأخر عن السوق بنحو 23%</strong>.</p>
<p><strong>2. مطابقة العرض فرديًا (52 ألفًا) تخلق ثلاث مشكلات:</strong> تتجاوز سقف الدرجة (46) فتكسر الهيكل · وتخلق فجوة صادمة مع زميليه الذين سيعرفان حتمًا · وترسّخ قاعدة أن «الطريق للزيادة هو إحضار عرض».</p>
<p><strong>3. الاحتفاظ به لخمسة شهور فقط ليس حلًا</strong> — سيرحل بعد التسليم وقد أخذت الشركة الحل الأغلى بلا مكسب دائم.</p></div>
<div class="box tip"><span class="lbl">التوصية</span>
<p>أ. <strong>عالج السبب لا العَرَض:</strong> اعرض على الإدارة تحديث نطاق الدرجة كاملًا وفق مسح السوق. التكلفة أكبر لكنها تحل مشكلة ستتكرر مع كل مطور.</p>
<p>ب. <strong>في المدى القصير:</strong> تسوية لكل الثلاثة معًا داخل النطاق المحدّث بحسب أدائهم وخبرتهم — لا صفقة سرية لواحد.</p>
<p>ج. <strong>لا تفاوض بالمال وحده:</strong> اسأله ما الذي كان سيبقيه لو تساوى الرقمان؟ غالبًا سيذكر المسار أو التعلم أو المشروع القادم — وهذه أرخص وأدوم.</p>
<p>د. <strong>خطة الطوارئ في المشروع:</strong> ابدأ نقل المعرفة فورًا بصرف النظر عن قراره. الاعتماد على شخص واحد في مشروع حرج هو خطأ إداري مستقل عن هذه الواقعة.</p>
<p class="hint">القاعدة: من يبقى بمقابل مادي فقط بعد عرض خارجي، تُظهر التجربة أن نسبة كبيرة منهم يرحلون خلال 12 شهرًا على أي حال.</p></div>

<hr class="rule">
<h2>الحالة السادسة: تسريح جماعي بميزانية محدودة</h2>
<div class="box def"><span class="lbl">المعطيات</span>
<p>شركة تجزئة خسرت عقدًا يمثل 30% من إيراداتها. يجب خفض تكلفة العمالة 22% خلال 60 يومًا. عدد الموظفين 260، وتكلفة العمالة السنوية 46 مليونًا.</p>
<p>الإدارة تقترح تسريح 60 موظفًا فورًا بمعيار «الأحدث التحاقًا يخرج أولًا».</p></div>
<div class="box ex"><span class="lbl">التحليل</span>
<p><strong>1. الهدف المالي:</strong> 22% × 46 = <strong>10.1 مليون سنويًا</strong>. لكن تسريح 60 موظفًا يستلزم مستحقات نهاية خدمة وتعويضات فورية — أي أن التوفير في السنة الأولى أقل بكثير من المتوقع، وقد يكون التدفق النقدي أسوأ في الربع الأول.</p>
<p><strong>2. معيار «الأحدث يخرج أولًا» مريح لكنه خطر:</strong> بسيط الإدارة، لكنه قد يُخرج أحدث المهارات وأكثر الفئات تنوعًا، ويُبقي هيكلًا متقادمًا. كما قد يُنتج أثرًا تمييزيًا غير مقصود لو كان التوظيف الحديث مركّزًا في فئة معينة.</p>
<p><strong>3. لم تُستنفد البدائل:</strong> تجميد التوظيف · وقف الأجر الإضافي · خفض ساعات مؤقت · إجازات بلا أجر اختيارية · تأجيل الزيادات · مراجعة عقود المتعاقدين · خفض أجور القيادة أولًا كإشارة.</p></div>
<div class="box tip"><span class="lbl">التوصية</span>
<p>أ. <strong>حزمة مركّبة:</strong> نحو 40% من الوفر من إجراءات غير تسريحية (تجميد، أجر إضافي، متعاقدون، تأجيل زيادات) و60% من تقليص محسوب — بدل تحميل كل العبء على التسريح.</p>
<p>ب. <strong>معيار مكتوب متعدد العوامل:</strong> ضرورة الدور للاستراتيجية المستقبلية + الأداء الموثق + تعدد المهارات — لا الأقدمية وحدها، مع مراجعة قانونية للأثر التمييزي.</p>
<p>ج. <strong>احسب التكلفة الفورية</strong> للمستحقات وأدرجها في خطة التدفق النقدي قبل إعلان الرقم.</p>
<p>د. <strong>خطة تواصل من ثلاث طبقات:</strong> المغادرون (لقاءات فردية) · الباقون (اجتماع في نفس اليوم يجيب: هل انتهت الموجة؟) · الخارج (رسالة موحدة للعملاء والموردين).</p>
<p>هـ. <strong>دعم إعادة التوظيف</strong> للمغادرين: شهادات خبرة فورية، توصيات، وربط بشركاء — منخفض التكلفة وعالي الأثر على السمعة وعلى معنويات الباقين.</p></div>

SECTIONS.push({id:"gulf2",track:T.D,title:"قوانين العمل: الكويت وقطر وعُمان والبحرين والأردن",lede:"أهم الأحكام العملية في خمس دول إضافية، مع تنبيه دائم بضرورة الرجوع للنص الساري.",
html:`
<div class="box warn"><span class="lbl">تنبيه</span><p>هذه معلومات عامة للاسترشاد فقط وليست استشارة قانونية، والتشريعات تُعدَّل باستمرار وتصدر لها لوائح تنفيذية وقرارات وزارية. ارجع دائمًا للنص الرسمي وللمستشار القانوني قبل أي إجراء.</p></div>

<h2>الكويت — قانون العمل في القطاع الأهلي رقم 6 لسنة 2010</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>الجهة المنظمة</td><td>الهيئة العامة للقوى العاملة</td></tr>
<tr><td>مكافأة نهاية الخدمة (أجر شهري)</td><td>أجر 15 يومًا عن كل سنة من السنوات الخمس الأولى، وأجر شهر كامل عن كل سنة تالية</td></tr>
<tr><td>سقف المكافأة (أجر شهري)</td><td>لا تتجاوز أجر سنة ونصف</td></tr>
<tr><td>العامل باليومية أو الساعة أو القطعة</td><td>10 أيام عن كل سنة من الخمس الأولى ثم 15 يومًا، بسقف أجر سنة</td></tr>
<tr><td>شرط الاستحقاق</td><td>إتمام سنة خدمة كاملة على الأقل</td></tr>
<tr><td>الإجازة السنوية</td><td>30 يومًا بأجر</td></tr>
<tr><td>ساعات العمل</td><td>8 ساعات يوميًا / 48 أسبوعيًا</td></tr>
<tr><td>الاستقالة</td><td>تؤثر على نسبة المكافأة المستحقة حسب مدة الخدمة (المادة 53)</td></tr>
<tr><td>الانقطاع</td><td>الغياب 7 أيام متصلة أو 20 يومًا متفرقة في السنة دون عذر يجيز اعتبار العامل مستقيلًا</td></tr>
</tbody></table></div>

<h2>قطر — قانون العمل رقم 14 لسنة 2004 وتعديلاته</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>الجهة المنظمة</td><td>وزارة العمل</td></tr>
<tr><td>مكافأة نهاية الخدمة</td><td>لا تقل عن أجر <strong>ثلاثة أسابيع</strong> عن كل سنة خدمة، وتُحسب على الأجر الأساسي الأخير</td></tr>
<tr><td>شرط الاستحقاق</td><td>إتمام سنة كاملة متصلة في الخدمة</td></tr>
<tr><td>كسور السنة</td><td>يستحق العامل المكافأة عنها بنسبة المدة التي قضاها</td></tr>
<tr><td>ساعات العمل</td><td>48 أسبوعيًا (تُخفَّض في رمضان)</td></tr>
<tr><td>الإجازة السنوية</td><td>لا تقل عن ثلاثة أسابيع، وترتفع لأربعة بعد خمس سنوات خدمة</td></tr>
<tr><td>فترة التجربة</td><td>حتى 6 أشهر</td></tr>
<tr><td>مدة الإخطار</td><td>شهر إذا كانت الخدمة أقل من سنتين، وشهران إذا زادت</td></tr>
<tr><td>العقد محدد المدة</td><td>لا تزيد مدته على 5 سنوات، والاستمرار بعد انقضائه دون اتفاق يجعله غير محدد المدة</td></tr>
<tr><td>حماية الأجور</td><td>نظام حماية الأجور إلزامي</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال محلول (قطر)</span><p>عامل أجره الأساسي 6,000 ريال وخدمته 4 سنوات.<br>الأجر اليومي = <code>6000 ÷ 30 = 200</code> · ثلاثة أسابيع = 21 يومًا<br>المكافأة = <code>200 × 21 × 4 = 16,800 ريال</code></p><p class="hint">هذه الطريقة الشائعة في الحساب العملي. والثلاثة أسابيع حد أدنى لا سقف — العقد قد ينص على ما هو أفضل.</p></div>

<h2>عُمان — قانون العمل الصادر بالمرسوم السلطاني 53 لسنة 2023</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>الإطار</td><td>حلّ محل القانون السابق وأدخل تعديلات جوهرية</td></tr>
<tr><td>الإجازة السنوية</td><td>لا تقل عن 30 يومًا بأجر كامل، ولا تُؤخذ قبل مضي 6 أشهر من الالتحاق</td></tr>
<tr><td>بدل الإجازة</td><td>يجوز صرف الأجر الأساسي عن الأيام غير المستخدمة بموافقة كتابية من العامل</td></tr>
<tr><td>مكافأة نهاية الخدمة</td><td>حق قانوني للعمانيين والوافدين، ما لم يكونوا مشمولين بنظام حماية اجتماعية أو ادخار إلزامي</td></tr>
<tr><td>التسوية</td><td>يجوز تسوية حقوق الخدمة السابقة إلى نظام الادخار بحسابها على الأجر الأساسي</td></tr>
<tr><td>الفصل التعسفي</td><td>تعويض على أساس آخر أجر شامل مع مراعاة ظروف العامل ومدة خدمته، إضافة لأجر مدة الإخطار والاشتراكات التأمينية</td></tr>
<tr><td>شهادة نهاية الخدمة</td><td>يلتزم صاحب العمل بتسليمها مجانًا عند الطلب مع رد أوراق العامل</td></tr>
</tbody></table></div>

<h2>البحرين — قانون العمل في القطاع الأهلي رقم 36 لسنة 2012</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>الجهة المنظمة</td><td>هيئة تنظيم سوق العمل (LMRA) ووزارة العمل</td></tr>
<tr><td>مكافأة نهاية الخدمة</td><td>المادة 116 للعامل غير الخاضع للتأمينات الاجتماعية</td></tr>
<tr><td>تحوّل مهم</td><td>قرار رقم 109 لسنة 2023 حوّل مكافأة نهاية الخدمة لغير البحرينيين إلى <strong>اشتراك شهري</strong> يُسدَّد للهيئة العامة للتأمين الاجتماعي بنسبة تختلف حسب مدة الخدمة</td></tr>
<tr><td>العمل الإضافي</td><td>حد أقصى ساعتان يوميًا، وللمخالفة عقوبة مالية</td></tr>
<tr><td>حماية العاملة</td><td>يُحظر الفصل بسبب الزواج أو أثناء إجازة الوضع، ويُحظر التشغيل خلال 40 يومًا تالية للوضع</td></tr>
<tr><td>إجازة رعاية الطفل</td><td>بدون أجر حتى ستة أشهر في المرة، وثلاث مرات طوال الخدمة، لطفل دون ست سنوات</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">لماذا تحوّل البحرين مهم لممارس HR؟</span><p>تحويل المكافأة من التزام مؤجل يُصرف عند الخروج إلى <strong>اشتراك شهري جارٍ</strong> يغيّر طريقة إدارتها ماليًا: تختفي الحاجة لتجنيب مخصص متراكم، وتتحول التكلفة إلى بند شهري ثابت في كشف الرواتب. راجع النسب السارية والفئات المشمولة قبل التطبيق.</p></div>

<h2>الأردن — قانون العمل رقم 8 لسنة 1996 وتعديلاته</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>الجهة المنظمة</td><td>وزارة العمل ومؤسسة الضمان الاجتماعي</td></tr>
<tr><td>الضمان الاجتماعي</td><td>الشمول إلزامي، وهو الذي يغطي معظم استحقاقات نهاية الخدمة والمعاش</td></tr>
<tr><td>حماية الأمومة</td><td>أحكام تفصيلية بشأن إجازة الأمومة وحضانة الأطفال</td></tr>
<tr><td>حضانة أطفال العاملات</td><td>على صاحب العمل الذي يستخدم 20 عاملة متزوجة فأكثر تهيئة مكان مناسب برعاية مربية مؤهلة لأطفال دون أربع سنوات إذا بلغ عددهم عشرة</td></tr>
<tr><td>تشغيل الأحداث</td><td>يُحظر تشغيل من لم يكمل السادسة عشرة بأي صورة، مع مراعاة أحكام التدريب المهني</td></tr>
</tbody></table></div>

<h2>خلاصة المقارنة</h2>
<div class="tbl"><table><thead><tr><th>الدولة</th><th>أساس مكافأة نهاية الخدمة</th><th>الإجازة السنوية</th></tr></thead><tbody>
<tr><td>السعودية</td><td>نصف شهر عن كل سنة من الخمس الأولى ثم شهر</td><td>21 يومًا وترتفع إلى 30 بعد 5 سنوات</td></tr>
<tr><td>الإمارات</td><td>21 يومًا ثم 30 يومًا على الأساسي بسقف أجر سنتين</td><td>30 يومًا بعد سنة</td></tr>
<tr><td>الكويت</td><td>15 يومًا ثم شهر (للأجر الشهري) بسقف أجر سنة ونصف</td><td>30 يومًا</td></tr>
<tr><td>قطر</td><td>لا تقل عن 3 أسابيع عن كل سنة على الأساسي</td><td>لا تقل عن 3 أسابيع وترتفع إلى 4</td></tr>

<tr><td>البحرين</td><td>تحوّلت لغير البحرينيين إلى اشتراك شهري لدى التأمين الاجتماعي</td><td>وفق القانون واللوائح</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">درس عملي لمن يدير فرقًا متعددة الدول</span><p>لا توجد سياسة واحدة تصلح للجميع. أخطر ثلاثة فروق عمليًا: <strong>أساس الحساب</strong> (أساسي أم شامل) · <strong>السقوف</strong> (بعض الدول تضع سقفًا للمكافأة) · <strong>آلية السداد</strong> (مخصص مؤجل أم اشتراك جارٍ). كل واحد منها يغيّر المخصصات المحاسبية وتكلفة الموظف الحقيقية.</p></div>

html:`
<div class="box def"><span class="lbl">الفكرة المحورية</span><p>الدافعية ليست صفة في الشخص فقط — بل <strong>خاصية في تصميم الوظيفة نفسها</strong>. الوظيفة المصممة جيدًا تُنتج دافعية داخلية بلا حوافز إضافية، والمصممة سيئًا تستنزف حتى أكثر الناس حماسًا.</p></div>

<h2>نموذج خصائص الوظيفة (Hackman &amp; Oldham)</h2>
<div class="ascii">الخصائص الخمس            الحالات النفسية              النتائج
------------------      ----------------------      ------------------
تنوع المهارات    \\
هوية المهمة      -->  الشعور بمعنى العمل      \\
أهمية المهمة     /                              \\   دافعية داخلية عالية
                                                  >  أداء أفضل
الاستقلالية      -->  الشعور بالمسؤولية       /    رضا أعلى
                                              /     دوران وغياب أقل
التغذية الراجعة  -->  معرفة النتائج          /</div>

<h2>الخصائص الخمس بالتفصيل</h2>
<div class="tbl"><table><thead><tr><th>الخاصية</th><th>المعنى</th><th>مثال ضعيف</th><th>مثال قوي</th></tr></thead><tbody>
<tr><td><strong>تنوع المهارات</strong></td><td>عدد المهارات المختلفة التي يستخدمها الشخص</td><td>إدخال بيانات فقط طوال اليوم</td><td>يجمع البيانات ويحللها ويعرض النتائج</td></tr>
<tr><td><strong>هوية المهمة</strong></td><td>إنجاز عمل كامل له بداية ونهاية مرئية</td><td>تركيب مسمار واحد في خط طويل</td><td>تجميع وحدة كاملة واختبارها والتوقيع عليها</td></tr>
<tr><td><strong>أهمية المهمة</strong></td><td>أثر العمل الملموس على الآخرين</td><td>لا يعرف من يستفيد من عمله</td><td>يقابل العميل ويرى أثر عمله عليه</td></tr>
<tr><td><strong>الاستقلالية</strong></td><td>حرية تحديد الطريقة والجدول</td><td>كل خطوة محددة ويحتاج موافقة لكل قرار</td><td>يقرر ترتيب أولوياته وأسلوب تنفيذها</td></tr>
<tr><td><strong>التغذية الراجعة</strong></td><td>معرفة نتيجة العمل من العمل نفسه</td><td>يعرف رأي مديره مرة في السنة</td><td>لوحة مؤشرات لحظية يرى فيها أثر عمله</td></tr>
</tbody></table></div>

<h2>مؤشر إمكانية التحفيز (MPS)</h2>
<div class="formula">MPS = [(تنوع المهارات + هوية المهمة + أهمية المهمة) ÷ 3] × الاستقلالية × التغذية الراجعة</div>
<div class="box warn"><span class="lbl">لماذا الضرب لا الجمع؟</span><p>الاستقلالية والتغذية الراجعة تدخلان <strong>ضربًا</strong> — أي أن انعدام أي منهما يُصفّر إمكانية التحفيز مهما كانت الوظيفة متنوعة ومهمة. وظيفة ذات معنى عظيم لكن بلا أي حرية ولا معرفة بالنتيجة = وظيفة مُحبِطة.</p></div>
<div class="box ex"><span class="lbl">مثال محلول</span><p>وظيفة تقييمها على مقياس 1–7: تنوع 6 · هوية 5 · أهمية 7 · استقلالية 2 · تغذية راجعة 3.<br><code>MPS = [(6+5+7)/3] × 2 × 3 = 6 × 6 = 36</code><br>لو رفعنا الاستقلالية إلى 5 فقط: <code>6 × 5 × 3 = 90</code> — أي أكثر من الضعف بتغيير خاصية واحدة. <strong>هذا يوجّه التدخل بدقة</strong> بدل محاولة تحسين كل شيء.</p></div>

<h2>خمس مداخل لإعادة التصميم</h2>
<div class="grid">
<div class="card"><h4>دمج المهام</h4><p>ضم مهام مجزأة في وحدة واحدة ← يرفع التنوع وهوية المهمة.</p></div>
<div class="card"><h4>تكوين وحدات عمل طبيعية</h4><p>أن يملك الشخص عميلًا أو منتجًا أو منطقة كاملة ← يرفع الهوية والأهمية.</p></div>
<div class="card"><h4>إقامة علاقة مع العميل</h4><p>تواصل مباشر مع المستفيد ← يرفع الأهمية والتغذية الراجعة.</p></div>
<div class="card"><h4>التحميل الرأسي</h4><p>نقل صلاحيات كانت للمدير إلى الموظف ← يرفع الاستقلالية.</p></div>
<div class="card"><h4>فتح قنوات التغذية الراجعة</h4><p>أن تصل النتيجة من العمل نفسه لا من المدير.</p></div>
</div>

<h2>ثلاثة مفاهيم لا تختلط</h2>
<div class="tbl"><table><thead><tr><th>المفهوم</th><th>الاتجاه</th><th>الأثر</th></tr></thead><tbody>
<tr><td>تبسيط الوظيفة</td><td>تقليص</td><td>كفاءة أعلى لكن رتابة وإحباط</td></tr>
<tr><td>توسيع الوظيفة (Enlargement)</td><td>أفقي</td><td>مهام أكثر بنفس المستوى — قد تُقرأ كعبء إضافي</td></tr>
<tr><td>إثراء الوظيفة (Enrichment)</td><td>رأسي</td><td>مسؤولية وصلاحية أكبر — يرفع الدافعية فعلًا</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">قاعدة</span><p>إعطاء الموظف <em>مهام أكثر</em> من نفس النوع ليس إثراءً — بل عبء. الإثراء أن يقرر شيئًا لم يكن يقرره من قبل.</p></div>

<h2>قوة الحاجة للنمو</h2>
<p>النموذج يضيف متغيرًا معدِّلًا: <strong>قوة حاجة الفرد للنمو</strong>. من لديه حاجة عالية للنمو يستجيب بقوة للوظيفة الغنية، ومن حاجته منخفضة قد يشعر بالضغط والقلق من الصلاحيات الإضافية. لذلك <strong>إعادة التصميم ليست دواءً عامًا</strong> — طبّقها مع من يريدها.</p>

/* ========== العلاقات النقابية والتفاوض الجماعي ========== */
SECTIONS.push({id:"unions",track:T.D,title:"العلاقات النقابية والتفاوض الجماعي",lede:"التنظيم النقابي، الاتفاقيات الجماعية، إدارة المفاوضات، والتعامل مع الإضراب.",
html:`
<h2>مفاهيم أساسية</h2>
<div class="tbl"><table><thead><tr><th>المصطلح</th><th>المعنى</th></tr></thead><tbody>
<tr><td>النقابة العمالية</td><td>تنظيم يمثل العمال في الدفاع عن مصالحهم أمام صاحب العمل</td></tr>
<tr><td>اللجنة النقابية</td><td>التمثيل النقابي على مستوى المنشأة الواحدة</td></tr>
<tr><td>الاتفاقية الجماعية</td><td>عقد مكتوب بين النقابة وصاحب العمل ينظم شروط العمل لمدة محددة</td></tr>
<tr><td>المفاوضة الجماعية</td><td>العملية التفاوضية التي تنتهي بالاتفاقية</td></tr>
<tr><td>الوساطة</td><td>تدخل طرف محايد يقترح حلولًا دون إلزام</td></tr>
<tr><td>التحكيم</td><td>إحالة النزاع لهيئة يصدر قرارها ملزمًا</td></tr>
<tr><td>الإضراب</td><td>توقف جماعي منظم عن العمل للضغط، وله شروط وإجراءات قانونية</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">تنبيه قانوني</span><p>حق التنظيم والإضراب وشروطه وإجراءاته تختلف جوهريًا بين الدول: بعضها يعترف بالنقابات ويحمي الإضراب المنظم، وبعضها يحصره في تنظيمات محددة أو يقيّده في قطاعات حيوية. لا تتصرف بناءً على قاعدة عامة — ارجع لتشريع بلدك.</p></div>

<h2>لماذا تظهر النقابات؟</h2>
<p>الأدبيات الإدارية تُجمع على أن التنظيم النقابي ينمو في المنشآت التي يجتمع فيها ثلاثة عوامل: <strong>شعور بعدم العدالة</strong> + <strong>غياب قناة فعّالة للصوت</strong> + <strong>اعتقاد بأن العمل الجماعي سينجح</strong>. المنشأة التي تعالج الشكاوى بجدية وتتواصل بشفافية نادرًا ما تواجه دفعًا نقابيًا حادًا — ليس لأن العمال لا يريدون حقوقهم، بل لأن القناة القائمة تعمل.</p>

<h2>مراحل المفاوضة الجماعية</h2>
<ol>
<li><strong>التحضير:</strong> جمع البيانات (تكلفة العمالة، مقارنات السوق، القدرة المالية)، وتحديد الأولويات وخطوط الحد الأدنى.</li>
<li><strong>تبادل المطالب:</strong> كل طرف يعرض قائمته الأولية — وعادةً تكون أعلى من المتوقع فعليًا.</li>
<li><strong>التفاوض:</strong> مقايضة البنود ومناقشة الأرقام والبدائل.</li>
<li><strong>الوصول لاتفاق مبدئي</strong> ثم عرضه على العمال للتصويت.</li>
<li><strong>الصياغة والتوقيع والإيداع</strong> لدى الجهة المختصة.</li>
<li><strong>التنفيذ والمتابعة</strong> وآلية تفسير الخلافات خلال سريان الاتفاقية.</li>
</ol>

<h2>تحضير الطاولة — قبل أول جلسة</h2>
<div class="box tip"><span class="lbl">قواعد</span>
<ul style="margin:6px 0 0">
<li><strong>احسب كلفة كل بند بدقة</strong> قبل الجلسة، بما فيها الأثر التراكمي والمركّب. زيادة 3% تبدو صغيرة لكنها تُبنى عليها كل الزيادات القادمة.</li>
<li><strong>حدد ثلاثة مستويات:</strong> ما تريده · ما تقبله · نقطة الانسحاب. ولا تدخل بلا نقطة انسحاب واضحة.</li>
<li><strong>افصل الأشخاص عن المشكلة:</strong> الخصومة الشخصية مع ممثل نقابي تُكلّف الشركة أكثر من أي بند مالي.</li>
<li><strong>ابحث عن بنود منخفضة التكلفة عالية القيمة</strong>: جدولة أعدل، إشعار مسبق، آلية شكاوى أوضح، فرص تدريب. هذه غالبًا تُشبع حاجة الاعتراف بتكلفة قليلة.</li>
<li><strong>وثّق كل ما يُتفق عليه فورًا</strong> — «الاتفاق الشفهي» أول ما يتنازع عليه لاحقًا.</li>
</ul></div>

<h2>أنماط التفاوض</h2>
<div class="tbl"><table><thead><tr><th>النمط</th><th>الفكرة</th><th>الخطر</th></tr></thead><tbody>
<tr><td>توزيعي (Win–Lose)</td><td>كعكة ثابتة يقتسمها الطرفان</td><td>يستهلك العلاقة ويؤجل الصراع لا ينهيه</td></tr>
<tr><td>تكاملي (Win–Win)</td><td>توسيع الكعكة بالبحث عن مصالح مشتركة</td><td>يحتاج ثقة ووقتًا وقد يُستغل من طرف انتهازي</td></tr>
<tr><td>علاقات تعاونية دائمة</td><td>لجان مشتركة تعمل بين جولات التفاوض</td><td>يحتاج استمرارية والتزامًا من الإدارة العليا</td></tr>
</tbody></table></div>

<h2>إدارة الإضراب</h2>
<div class="box ex"><span class="lbl">قبل وقوعه</span><p>مؤشرات الإنذار المبكر: ارتفاع مفاجئ في التظلمات · تجمعات وشكاوى جماعية متكررة · انخفاض الإنتاجية دون سبب فني · شائعات مكثفة · رفض جماعي للعمل الإضافي. الوقت المناسب للتحرك هو <strong>هنا</strong>، لا بعد التوقف عن العمل.</p></div>
<p><strong>عند وقوعه:</strong></p>
<ul>
<li>تحقق من قانونية الإجراء وإجراءاته قبل أي تصرف.</li>
<li>حافظ على قنوات التفاوض مفتوحة — إغلاقها يطيل الأزمة.</li>
<li>وثّق كل شيء بدقة: التواريخ والمطالب والعروض والردود.</li>
<li>أمّن السلامة والأصول دون استفزاز.</li>
<li>تحدث بصوت واحد ورسالة موحدة داخليًا وخارجيًا.</li>
<li>تجنّب الإجراءات الانتقامية — أسرع طريق لتحويل نزاع اقتصادي إلى نزاع قانوني.</li>
</ul>
<div class="box warn"><span class="lbl">بعد انتهائه</span><p>أخطر مرحلة هي <strong>ما بعد العودة</strong>. الفريق الذي أضرب سيعود ليعمل مع نفس المديرين. بلا خطة مصالحة صريحة ومعالجة للأسباب الجذرية، تعود الأزمة أقوى خلال شهور. اجعل من الاتفاق آلية دائمة للحوار لا مجرد إنهاء للتوقف.</p></div>

html:`
<div class="box warn"><span class="lbl">الحقيقة الصعبة</span><p>معظم مشاريع أنظمة الموارد البشرية لا تفشل لأسباب تقنية — بل بسبب <strong>بيانات غير نظيفة</strong>، و<strong>عمليات غير موثقة قبل الأتمتة</strong>، و<strong>مقاومة تغيير لم تُدَر</strong>. أتمتة عملية فوضوية تُنتج فوضى أسرع وأغلى.</p></div>

<h2>المرحلة صفر: هل تحتاج نظامًا أصلًا؟</h2>
<ul>
<li>ما المشكلة التي تحلها بالتحديد؟ وكم تكلفك اليوم بالأرقام؟</li>
<li>هل عملياتك الحالية موثقة ومستقرة أم أنك تهرب من فوضى إلى أداة؟</li>
<li>هل بياناتك نظيفة؟ (كم ملفًا ناقصًا؟ كم تعارضًا؟)</li>
<li>هل لديك مالك للمشروع متفرغ جزئيًا على الأقل؟</li>
</ul>
<div class="box tip"><span class="lbl">قاعدة</span><p>وثّق عملياتك ونظّف بياناتك <strong>قبل</strong> اختيار النظام لا بعده. هذه المرحلة تستهلك 30–40% من جهد المشروع وتُهمل دائمًا.</p></div>

<h2>كراسة الشروط (RFP) — البنود الأساسية</h2>
<div class="tpl"><div class="tpl-h"><b>هيكل كراسة شروط نظام HRIS</b><button class="copybtn">نسخ</button></div><pre>
1) نبذة عن المنشأة
   - النشاط · عدد الموظفين · عدد المواقع/الدول · اللغات المطلوبة
   - أنظمة قائمة يجب التكامل معها (محاسبة · بصمة · بريد)

2) نطاق المطلوب  (حدد لكل بند: إلزامي / مرغوب / غير مطلوب)
   [ ] بيانات الموظفين والهيكل التنظيمي
   [ ] العقود والمستندات وتواريخ الانتهاء
   [ ] الحضور والورديات والإجازات
   [ ] الرواتب والضرائب والتأمينات وقسائم الرواتب
   [ ] التوظيف وتتبع المتقدمين
   [ ] التهيئة وإنهاء الخدمة
   [ ] إدارة الأداء والأهداف
   [ ] التدريب والشهادات
   [ ] الخدمة الذاتية للموظف والمدير
   [ ] التقارير ولوحات المؤشرات
   [ ] تطبيق الهاتف

3) متطلبات فنية
   - مكان استضافة البيانات وسياسة الاحتفاظ والنسخ الاحتياطي
   - الصلاحيات وسجل التدقيق (Audit Trail)
   - واجهات برمجية (API) وإمكانية التصدير الكامل للبيانات
   - التوافق مع اللغة العربية والاتجاه من اليمين لليسار
   - التوافق مع تشريعات بلدنا (الضرائب والتأمينات وحماية البيانات)

4) متطلبات الخدمة
   - نموذج الدعم وأوقاته ولغته
   - زمن الاستجابة للأعطال حسب درجة الخطورة
   - التدريب: عدد الجلسات والمواد ولغتها
   - دورية التحديثات وهل تُطبق تلقائيًا

5) التسعير  (اطلب التفصيل لا الإجمالي)
   - رسوم لكل موظف شهريًا · حد أدنى للعدد
   - رسوم التطبيق والإعداد لمرة واحدة
   - رسوم ترحيل البيانات والتكامل والتخصيص
   - تكلفة إضافة وحدة جديدة لاحقًا
   - التكلفة الكلية على 3 و5 سنوات

6) مطلوب من المورّد
   - عرض حي على بياناتنا نحن لا على بيانات تجريبية
   - ثلاثة عملاء مرجعيين في قطاع وحجم مشابهين
   - خطة تطبيق زمنية مفصّلة
   - شروط إنهاء التعاقد وكيفية استرجاع بياناتنا كاملة
</pre></div>

<h2>معايير المفاضلة بين العروض</h2>
<div class="tbl"><table><thead><tr><th>المعيار</th><th>وزن مقترح</th><th>ما تبحث عنه</th></tr></thead><tbody>
<tr><td>تغطية المتطلبات الإلزامية</td><td>30%</td><td>لا تقبل «سنطوّرها لاحقًا» في بند إلزامي</td></tr>
<tr><td>سهولة الاستخدام</td><td>20%</td><td>اختبرها مع موظف عادي لا مع فريق HR</td></tr>
<tr><td>التوافق التشريعي المحلي</td><td>15%</td><td>حساب الضريبة والتأمينات وصيغ التقارير الرسمية</td></tr>
<tr><td>التكلفة الكلية 5 سنوات</td><td>15%</td><td>لا السعر الابتدائي وحده</td></tr>
<tr><td>الدعم والتدريب</td><td>10%</td><td>باللغة والتوقيت المناسبين</td></tr>
<tr><td>حرية البيانات</td><td>10%</td><td>هل تستطيع تصدير كل شيء والخروج؟</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">أخطر بند في العقد</span><p><strong>الخروج</strong>. اسأل قبل التوقيع: لو أنهينا التعاقد بعد ثلاث سنوات، كيف نستعيد بياناتنا؟ بأي صيغة؟ خلال كم يومًا؟ وبأي تكلفة؟ المورّد الذي يتهرب من هذا السؤال يخطط لحبسك.</p></div>

<h2>ترحيل البيانات</h2>
<ol>
<li><strong>الجرد:</strong> ما البيانات الموجودة وأين؟ (نظام قديم، ملفات إكسل، ورق)</li>
<li><strong>التنظيف:</strong> إزالة التكرار وتوحيد الصيغ (التواريخ، الأسماء، المسميات) وسد النواقص.</li>
<li><strong>المطابقة (Mapping):</strong> ربط كل حقل قديم بحقل جديد وتحديد ما لن يُرحَّل.</li>
<li><strong>الترحيل التجريبي</strong> على بيئة اختبار ثم مراجعة عيّنة يدويًا.</li>
<li><strong>التسوية (Reconciliation):</strong> مطابقة الأعداد والإجماليات قبل وبعد — خصوصًا الأرصدة والمبالغ.</li>
<li><strong>الترحيل النهائي</strong> ثم تجميد النظام القديم للقراءة فقط لفترة أمان.</li>
</ol>
<div class="box ex"><span class="lbl">أرقام يجب أن تتطابق تمامًا</span><p>عدد الموظفين النشطين · إجمالي أرصدة الإجازات · إجمالي السلف القائمة · مجموع الرواتب الأساسية · عدد العقود سارية المفعول. أي فرق ولو بجنيه واحد يجب تفسيره قبل الإطلاق لا بعده.</p></div>

<h2>خطة الإطلاق وإدارة التغيير</h2>
<div class="tbl"><table><thead><tr><th>الأسلوب</th><th>الوصف</th><th>مناسب لـ</th></tr></thead><tbody>
<tr><td>الإطلاق الكامل (Big Bang)</td><td>الانتقال دفعة واحدة</td><td>الشركات الصغيرة ذات العمليات البسيطة</td></tr>
<tr><td>التدرج بالوحدات</td><td>وحدة تلو الأخرى (بيانات ← حضور ← رواتب)</td><td>الأشيع والأقل خطرًا</td></tr>
<tr><td>التدرج بالمواقع</td><td>موقع تجريبي ثم التعميم</td><td>المنشآت متعددة الفروع</td></tr>
<tr><td>التشغيل المتوازي</td><td>النظامان معًا لدورة أو دورتين</td><td>الرواتب تحديدًا — الأكثر أمانًا</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">قاعدة الرواتب</span><p>لا تُطلق وحدة الرواتب بلا <strong>تشغيل متوازٍ لدورتين</strong> على الأقل: احسب الرواتب بالنظامين وقارن كل قسيمة. خطأ واحد في أول شهر يكفي لأن يفقد النظام كله ثقة الموظفين لسنوات.</p></div>

<h2>أسباب الفشل الخمسة الأشهر</h2>
<div class="box warn"><span class="lbl">تجنّبها</span>
<ol style="margin:6px 0 0">
<li>أتمتة عملية فوضوية بدل إصلاحها أولًا.</li>
<li>ترحيل بيانات غير نظيفة — «سننظفها داخل النظام».</li>
<li>غياب مالك متفرغ للمشروع من جانب المنشأة.</li>
<li>الاكتفاء بتدريب فريق HR وإهمال المديرين والموظفين.</li>
<li>تخصيص مفرط يجعل التحديثات المستقبلية مستحيلة أو مكلفة.</li>
</ol></div>

{q:"متى تنظّف البيانات وتوثّق العمليات؟",opts:["بعد الإطلاق","قبل اختيار النظام لا بعده","أثناء التدريب","لا حاجة لذلك"],a:1,why:"هذه المرحلة تستهلك 30–40% من جهد المشروع وتُهمل دائمًا، وتجاهلها يُفشل أفضل الأنظمة."},
{q:"«التخصيص المفرط» للنظام خطر لأنه:",opts:["يبطئ الواجهة","يجعل التحديثات المستقبلية مستحيلة أو مكلفة","يزيد عدد المستخدمين","يقلل الأمان فقط"],a:1,why:"كل تخصيص خارج المسار القياسي يحتاج إعادة عمل مع كل تحديث، فتتراكم التكلفة ويتجمد النظام على نسخة قديمة."},

{q:"ترتيب مراحل ترحيل البيانات:",t:"order",items:["جرد البيانات ومصادرها","التنظيف وتوحيد الصيغ وسد النواقص","المطابقة بين الحقول القديمة والجديدة","الترحيل التجريبي ثم التسوية ثم الترحيل النهائي"],why:"القفز إلى الترحيل قبل التنظيف والمطابقة ينقل الفوضى بأمانة تامة إلى نظام جديد ومكلف."},

]});

html:`
<h2>أنماط العمالة غير التقليدية</h2>
<div class="tbl"><table><thead><tr><th>النمط</th><th>الوصف</th><th>يناسب</th></tr></thead><tbody>
<tr><td>مستقل (Freelancer)</td><td>يقدّم خدمة محددة بعقد خدمات لا عقد عمل</td><td>مهام متخصصة قصيرة ومتقطعة</td></tr>
<tr><td>متعاقد (Contractor)</td><td>يعمل لفترة محددة على مشروع بعينه</td><td>مشاريع لها بداية ونهاية</td></tr>
<tr><td>عمالة مؤقتة عبر وكالة</td><td>الوكالة هي صاحب العمل وتوفّرهم للمنشأة</td><td>الذروة والمواسم والغياب الطويل</td></tr>
<tr><td>عامل منصة (Gig)</td><td>مهام قصيرة عبر منصة رقمية</td><td>التوصيل والنقل والخدمات الدقيقة</td></tr>
<tr><td>استشاري</td><td>خبرة عالية لمشروع محدد بمخرجات</td><td>التحول والتصميم والتقييم</td></tr>
<tr><td>عمل جزئي</td><td>علاقة عمل حقيقية بساعات أقل</td><td>الأدوار المساندة والطلاب</td></tr>
</tbody></table></div>

<h2>الخط الفاصل: علاقة عمل أم عقد خدمات؟</h2>
<div class="box warn"><span class="lbl">القاعدة الحاكمة</span><p>القضاء ينظر إلى <strong>جوهر العلاقة لا إلى مسمى العقد</strong>. تسمية شخص «استشاريًا» لا تحميك إذا كانت الوقائع تُظهر علاقة عمل.</p></div>
<div class="tbl"><table><thead><tr><th>مؤشرات علاقة عمل (خطر)</th><th>مؤشرات عقد خدمات</th></tr></thead><tbody>
<tr><td>تبعية وإشراف يومي وتوجيه في التفاصيل</td><td>يحدد طريقة عمله بنفسه ويُقاس بالمخرَج</td></tr>
<tr><td>مواعيد حضور ملزمة ومكان عمل محدد</td><td>حرية في التوقيت والمكان</td></tr>
<tr><td>أجر شهري ثابت منتظم</td><td>مقابل مرتبط بمخرجات أو مراحل</td></tr>
<tr><td>أدوات وأجهزة من الشركة</td><td>يستخدم أدواته الخاصة</td></tr>
<tr><td>حصرية — لا يعمل لدى غيرك</td><td>يخدم عملاء آخرين</td></tr>
<tr><td>استمرارية طويلة ومتصلة</td><td>ارتباط بمشروع محدد المدة</td></tr>
<tr><td>يخضع للائحة الجزاءات ونظام الإجازات</td><td>خارج المنظومة التأديبية الداخلية</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال على التصنيف الخاطئ</span><p>مصمم «مستقل» يحضر يوميًا الساعة 9، يستخدم جهاز الشركة، يتبع مديرًا يوزّع عليه المهام، ويتقاضى مبلغًا ثابتًا شهريًا منذ سنتين ولا يعمل لدى غيرك. <strong>هذه علاقة عمل بكل مؤشراتها.</strong> عند أي نزاع قد تُعاد تكييفها فتستحق مستحقات تأمينية ومكافأة نهاية خدمة بأثر رجعي، مع غرامات تأخير.</p></div>

<h2>متى تستخدم العمالة المرنة فعلًا؟</h2>
<div class="tbl"><table><thead><tr><th>استخدام سليم</th><th>استخدام محفوف بالخطر</th></tr></thead><tbody>
<tr><td>خبرة نادرة تُحتاج لأسابيع لا سنوات</td><td>تغطية دور دائم لتجنّب التأمينات</td></tr>
<tr><td>ذروة موسمية أو مشروع محدد</td><td>«تجربة» موظف بدلًا من فترة اختبار نظامية</td></tr>
<tr><td>تغطية غياب طويل مؤقت</td><td>خفض التكلفة الظاهرية مع نفس التبعية</td></tr>
<tr><td>عمل يمكن قياسه بالمخرَج بوضوح</td><td>عمل يحتاج إشرافًا يوميًا وتوجيهًا مستمرًا</td></tr>
</tbody></table></div>

<h2>إدارتهم عمليًا</h2>
<ul>
<li><strong>عقد واضح بالمخرجات:</strong> ما المطلوب تسليمه ومتى وبأي معيار قبول ومقابل كم.</li>
<li><strong>مالك واحد داخلي</strong> لكل متعاقد يتابع الجودة والتسليم.</li>
<li><strong>حدود وصول محددة</strong> للأنظمة والبيانات، مع إلغاء فوري عند الانتهاء.</li>
<li><strong>ملكية فكرية وسرية</strong> منصوص عليها صراحةً — الأصل قد لا يكون في صالحك بدون نص.</li>
<li><strong>تتبّع الإنفاق الكلي</strong>: كثير من الشركات تكتشف أن إنفاقها على المتعاقدين يفوق ميزانية توظيف لم تُعتمد.</li>
<li><strong>مراجعة دورية للتصنيف</strong>: أي متعاقد تجاوز مدة معينة أو تحولت علاقته لتبعية يومية يجب إعادة النظر في وضعه.</li>
</ul>
<div class="box tip"><span class="lbl">مؤشر تحذيري</span><p>إذا كان لديك «متعاقدون» يعملون معك منذ أكثر من سنتين بنفس نمط الموظفين، فأنت لا توفّر تكلفة — بل <strong>تؤجل التزامًا متراكمًا</strong> قد يظهر دفعة واحدة عند أول نزاع.</p></div>

{q:"استخدام متعاقد لتغطية دور دائم بغرض تجنّب التأمينات:",opts:["ممارسة ذكية لخفض التكلفة","استخدام محفوف بالخطر قد يُعاد تكييفه بأثر رجعي مع غرامات","مسموح بموافقة الشخص","لا أثر له"],a:1,why:"التوفير الظاهري يتحول إلى التزام متراكم يظهر دفعة واحدة عند أول نزاع أو تفتيش."},

/* ========== HR في القطاع الحكومي وغير الربحي ========== */
SECTIONS.push({id:"publicsector",track:T.F,title:"الموارد البشرية في القطاع الحكومي وغير الربحي",lede:"بيئتان لهما قواعد مختلفة تمامًا: الجهاز الإداري للدولة، والمنظمات غير الربحية وإدارة المتطوعين.",
html:`
<h2>أولًا: القطاع الحكومي</h2>
<div class="tbl"><table><thead><tr><th>الوجه</th><th>القطاع الخاص</th><th>القطاع الحكومي</th></tr></thead><tbody>
<tr><td>الإطار</td><td>قانون العمل ولائحة الشركة</td><td>قوانين الخدمة المدنية ولوائحها ونظام الوظائف</td></tr>
<tr><td>التوظيف</td><td>مرونة في المعايير والتوقيت</td><td>إعلان ومسابقة وضوابط شكلية ملزمة</td></tr>
<tr><td>الأجر</td><td>تفاوضي وقابل للتمييز حسب الأداء</td><td>سلّم درجات وعلاوات محددة قانونًا</td></tr>
<tr><td>الترقية</td><td>حسب الحاجة والجدارة</td><td>غالبًا بالأقدمية والدرجة والشواغر المعتمدة</td></tr>
<tr><td>إنهاء الخدمة</td><td>ممكن وفق ضوابط</td><td>محدود جدًا ومقيد بإجراءات صارمة</td></tr>
<tr><td>أدوات التحفيز</td><td>مال وحوافز وأسهم</td><td>غير مالية غالبًا: مكانة، معنى، استقرار، تدريب</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">الاستنتاج العملي</span><p>حين تُغلق أبواب الأجر والترقية والفصل، لا يبقى أمام ممارس HR إلا الأدوات التي يهملها الجميع: <strong>تصميم الوظيفة، وجودة الإشراف، والاعتراف، ووضوح المسار، والمعنى</strong>. المفارقة أن هذه الأدوات هي الأقوى تأثيرًا في الدافعية أصلًا وفق كل النظريات — لكنها الأصعب لأنها تحتاج جهدًا إداريًا لا قرارًا ماليًا.</p></div>
<p><strong>تحديات نمطية:</strong> تضخم العمالة مع نقص المهارات · صعوبة التمييز بين الأداءات · التقييم الشكلي · بطء إجراءات التعيين حتى تفقد المرشح · تقادم المهارات مع طول الخدمة · مقاومة تغيير أعلى نتيجة الأمان الوظيفي.</p>

<h2>ثانيًا: المنظمات غير الربحية</h2>
<div class="grid">
<div class="card"><h4>الدافع القيمي</h4><p>الرسالة هي عامل الجذب الأول وتعوّض جزئيًا الأجر الأقل — لكنها لا تعوّض سوء الإدارة.</p></div>
<div class="card"><h4>تمويل مقيّد</h4><p>كثير من المنح تُقيّد الإنفاق الإداري، فتضغط رواتب الفريق وتصعّب التخطيط طويل المدى.</p></div>
<div class="card"><h4>عدم استقرار الدور</h4><p>ارتباط الوظائف بدورة المشروع يجعل العقود محددة المدة هي الأصل.</p></div>
<div class="card"><h4>خطر الاحتراق</h4><p>أعلى القطاعات في الاحتراق: عبء عاطفي + موارد شحيحة + شعور بأن الرفض «خيانة للرسالة».</p></div>
</div>
<div class="box warn"><span class="lbl">أخطر مغالطة</span><p>«نحن نعمل لقضية نبيلة فلا مجال للشكوى من ظروف العمل». هذه العبارة تُستخدم كثيرًا لتبرير عبء غير معقول وأجور غير عادلة وإدارة ضعيفة — وهي أسرع طريق لاستنزاف أكثر الناس إخلاصًا للرسالة نفسها.</p></div>

<h2>إدارة المتطوعين</h2>
<div class="tbl"><table><thead><tr><th>الموظف</th><th>المتطوع</th></tr></thead><tbody>
<tr><td>يرتبط بعقد وأجر والتزام قانوني</td><td>يرتبط باتفاق أدبي ويمكنه التوقف في أي وقت</td></tr>
<tr><td>يُدار بالمساءلة والتقييم</td><td>يُدار بالاعتراف والمعنى ووضوح الدور</td></tr>
<tr><td>مقياس النجاح الإنتاجية</td><td>مقياس النجاح الاستمرارية والانتظام</td></tr>
</tbody></table></div>
<p><strong>ما يجعل التطوع ينجح:</strong> وصف واضح لدور المتطوع ومدته والمتوقع منه · تهيئة حقيقية لا ترحيب فقط · تدريب على المهمة · نقطة اتصال واحدة يعرفها · اعتراف علني ومنتظم · تقييم للتجربة وسؤاله عمّا يريد أن يتعلمه هو.</p>
<div class="box ex"><span class="lbl">الخطأ الأشيع</span><p>استقبال مئة متطوع بحماس ثم تركهم بلا مهام واضحة ولا متابعة. النتيجة أسوأ من عدم استقبالهم: تجربة سلبية تنتشر، وسمعة تنظيمية متضررة، ومتطوعون كانوا سيستمرون سنوات لو وجدوا دورًا واضحًا.</p></div>
`,

{q:"مقياس النجاح في إدارة المتطوعين عادةً:",opts:["الإنتاجية بالساعة","الاستمرارية والانتظام","عدد المتطوعين المسجلين","حجم التبرعات"],a:1,why:"المتطوع يمكنه التوقف في أي لحظة، فبقاؤه المنتظم هو الدليل الحقيقي على جودة إدارة التجربة."},

{q:"صح أم خطأ: التقييم الشكلي الذي لا يميّز بين الأداءات مشكلة شائعة في القطاع الحكومي.",t:"tf",a:0,why:"حين لا يترتب على التقييم أثر حقيقي في الأجر أو الترقية، يفقد معناه ويتحول إلى إجراء ورقي يمنح الجميع تقديرات متقاربة."}

/* ========== نقل المعرفة والتوطين والدمج ========== */
SECTIONS.push({id:"knowledge",track:T.C,title:"نقل المعرفة والتوطين ودمج ذوي الإعاقة",lede:"ثلاثة ملفات تتحول من «مبادرة» إلى مخاطرة حقيقية إذا أُهملت.",
html:`
<h2>أولًا: نقل المعرفة قبل فقدانها</h2>
<div class="box def"><span class="lbl">المشكلة</span><p>جزء كبير من معرفة المنشأة <strong>ضمني</strong> — يسكن في رؤوس أشخاص ولا يوجد في أي وثيقة: من نتصل به عند عطل معين، لماذا رُفض هذا المورّد سابقًا، كيف يُقنع هذا العميل. عند تقاعد أو رحيل هؤلاء تختفي المعرفة دفعة واحدة.</p></div>
<h3>خريطة المخاطر</h3>
<div class="tbl"><table><thead><tr><th>الخطوة</th><th>السؤال</th></tr></thead><tbody>
<tr><td>1. تحديد المعرفة الحرجة</td><td>ما المعرفة التي لو اختفت تعطّل العمل؟</td></tr>
<tr><td>2. تحديد حامليها</td><td>من يملكها؟ وكم شخصًا يملك كل نوع؟</td></tr>
<tr><td>3. تقدير الخطر</td><td>متى يتقاعد أو يُحتمل رحيله؟ وما أثر ذلك؟</td></tr>
<tr><td>4. اختيار الأسلوب</td><td>توثيق · إرشاد · تناوب · تسجيل · مجتمعات ممارسة</td></tr>
<tr><td>5. التحقق</td><td>هل يستطيع شخص آخر أداء العمل فعلًا بدون صاحب المعرفة؟</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">اختبار الحقيقة</span><p>لا تكتفِ بأن الخبير «كتب دليلًا». الاختبار الحقيقي: <strong>اجعل الخليفة يؤدي المهمة كاملة والخبير مجرد مراقب صامت</strong>. كل نقطة يضطر فيها للتدخل هي فجوة معرفة لم تُنقل بعد.</p></div>
<p><strong>أساليب فعّالة:</strong> إرشاد عكسي (الشاب يعلّم التقنية والخبير يعلّم السياق) · تسجيل جلسات «كيف أفكر في هذه المشكلة» بالفيديو · تناوب وظيفي مخطط قبل التقاعد بسنة · مجتمعات ممارسة تجمع من يؤدون نفس العمل · توثيق «لماذا» لا «كيف» فقط، لأن السبب أثمن من الخطوة.</p>

<h2>ثانيًا: سياسات التوطين</h2>
<div class="tbl"><table><thead><tr><th>البُعد</th><th>ما يجب فهمه</th></tr></thead><tbody>
<tr><td>الطبيعة</td><td>سياسات حكومية تربط نسبة العمالة الوطنية بتصاريح العمل وخدمات الجهات الرسمية</td></tr>
<tr><td>أمثلة</td><td>«نطاقات» في السعودية وبرامج التوطين في الإمارات وسياسات مشابهة في دول الخليج</td></tr>
<tr><td>الأثر التشغيلي</td><td>تصنيف المنشأة يؤثر على استقدام العمالة ونقل الكفالة وخدمات أخرى</td></tr>
<tr><td>المخاطرة الأكبر</td><td>«التوطين الوهمي»: تسجيل أشخاص لتحسين النسبة دون عمل حقيقي — مخالفة جسيمة وعقوباتها شديدة</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">التحول الأهم في التفكير</span><p>معظم الشركات تتعامل مع التوطين كـ<strong>عبء امتثالي</strong> تسدّه بأقل تكلفة، فتوظف مواطنين في أدوار هامشية بلا تطوير، فيرحلون خلال شهور، فتعود لنقطة الصفر وتدفع مرتين. النهج الأنجح يعامله كـ<strong>مشروع بناء قدرات</strong>: أدوار حقيقية + مسار واضح + إرشاد + برنامج خريجين — وهذه هي الطريقة الوحيدة التي تُحسّن النسبة وتثبت.</p></div>
<p><strong>مؤشرات تستحق التتبع:</strong> نسبة التوطين مقارنة بالمستهدف · معدل بقاء الموظفين الوطنيين بعد سنة · نسبتهم في المستويات القيادية لا القاعدية فقط · نسبة الترقية الداخلية بينهم.</p>

<h2>ثالثًا: دمج ذوي الإعاقة</h2>
<div class="box def"><span class="lbl">التحول المفاهيمي</span><p>من نموذج «الإحسان» (نوظّفه لأننا طيبون) إلى نموذج <strong>إزالة الحواجز</strong>: الشخص ليس «عاجزًا» بذاته، بل البيئة هي التي تُعيقه. الموظف الذي يستخدم كرسيًا متحركًا لا يُعيقه الكرسي بل غياب المنحدر.</p></div>
<h3>الترتيبات التيسيرية (Reasonable Accommodation)</h3>
<div class="tbl"><table><thead><tr><th>الحاجة</th><th>ترتيب نمطي</th><th>التكلفة</th></tr></thead><tbody>
<tr><td>إعاقة حركية</td><td>منحدرات · مكتب بارتفاع مناسب · دورة مياه مهيأة · موقف قريب</td><td>غالبًا لمرة واحدة</td></tr>
<tr><td>إعاقة بصرية</td><td>قارئ شاشة · تكبير · مستندات بصيغ متاحة · تباين ألوان</td><td>منخفضة</td></tr>
<tr><td>إعاقة سمعية</td><td>ترجمة إشارة عند الحاجة · تفريغ نصي للاجتماعات · تنبيهات بصرية</td><td>منخفضة إلى متوسطة</td></tr>
<tr><td>اضطرابات النمو والانتباه</td><td>تعليمات مكتوبة · مساحة أقل ضوضاء · مرونة في التوقيت</td><td>شبه صفرية</td></tr>
<tr><td>أمراض مزمنة</td><td>مرونة في الجدول · إجازات متقطعة · عمل هجين</td><td>شبه صفرية</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">حقيقة كثيرًا ما تُغفل</span><p>تُظهر التجارب العملية أن <strong>غالبية الترتيبات التيسيرية تكلفتها منخفضة أو معدومة</strong> وتقتصر على تعديل في الجدول أو الأدوات أو طريقة التواصل. العائق الحقيقي في معظم الحالات ليس المال — بل <strong>الافتراض المسبق بأن الشخص لن يستطيع</strong>.</p></div>
<p><strong>ما يجعل الدمج ينجح:</strong> مراجعة الوصف الوظيفي لحذف متطلبات جسدية غير ضرورية فعلًا · مراجعة إجراءات التوظيف نفسها (هل موقع التقديم متاح؟ هل مكان المقابلة مهيأ؟) · سؤال الشخص عمّا يحتاجه بدل الافتراض · تدريب الفريق على التعامل الطبيعي · تكافؤ حقيقي في فرص التطوير والترقية لا مجرد التعيين.</p>
`,
quiz:[
{q:"«المعرفة الضمنية» في المنظمة هي:",opts:["الملفات المحفوظة","المعرفة التي تسكن في رؤوس الأشخاص ولا توجد في أي وثيقة","اللوائح المكتوبة","بيانات النظام"],a:1,why:"مثل معرفة من نتصل به عند عطل معين ولماذا رُفض مورّد سابقًا — وهي ما يختفي دفعة واحدة عند رحيل صاحبها."},
{q:"الاختبار الحقيقي لنجاح نقل المعرفة:",opts:["أن يكتب الخبير دليلًا","أن يؤدي الخليفة المهمة كاملة والخبير مراقب صامت","عدد جلسات التدريب","حجم الوثائق"],a:1,why:"كل نقطة يضطر فيها الخبير للتدخل هي فجوة معرفة لم تُنقل بعد، والدليل المكتوب وحده لا يكشفها."},

/* ========== التغييرات الوظيفية أثناء الخدمة ========== */
SECTIONS.push({id:"changes",track:T.B,title:"التغييرات الوظيفية أثناء الخدمة",lede:"النقل والانتداب والإعارة وتعديل العقد وتغيير المسمى وخفض الأجر والإيقاف: كل ما يحدث بين التعيين والخروج.",
html:`
<div class="box def"><span class="lbl">لماذا هذا القسم</span><p>معظم أدلة الموارد البشرية تغطي <strong>الدخول</strong> و<strong>الخروج</strong> وتترك فراغًا في المنتصف. لكن أغلب النزاعات العمالية لا تنشأ عند التعيين ولا عند الفصل — بل عند <strong>تغيير حدث أثناء الخدمة بلا موافقة أو توثيق</strong>.</p></div>

<h2>القاعدة الحاكمة</h2>
<div class="box warn"><span class="lbl">مبدأ أساسي</span><p>العقد شريعة المتعاقدين. أي تعديل <strong>جوهري</strong> يمس الأجر أو طبيعة العمل أو مكانه يحتاج <strong>موافقة كتابية</strong> من الموظف. التعديل الجوهري المفروض من طرف واحد قد يُعد في كثير من التشريعات <strong>إنهاءً ضمنيًا</strong> للعقد يستحق عنه الموظف تعويض الفصل التعسفي — حتى لو استمر في العمل تحت الاحتجاج.</p></div>

<h2>أنواع التغييرات</h2>
<div class="tbl"><table><thead><tr><th>التغيير</th><th>التعريف</th><th>يحتاج موافقة؟</th><th>ما يجب توثيقه</th></tr></thead><tbody>
<tr><td><strong>النقل</strong></td><td>تغيير دائم للقسم أو الموقع</td><td>نعم إذا كان جوهريًا أو غيّر مكان العمل</td><td>قرار نقل + مسمى ومهام جديدة + تاريخ السريان</td></tr>
<tr><td><strong>الانتداب</strong></td><td>تكليف مؤقت بعمل آخر مع بقاء الارتباط الأصلي</td><td>حسب المدة والطبيعة والبُعد</td><td>مدة محددة + بدل الانتداب + العودة للأصل</td></tr>
<tr><td><strong>الإعارة</strong></td><td>عمل لدى جهة أخرى مع حفظ الوظيفة والأقدمية</td><td>نعم — اتفاق ثلاثي</td><td>من يدفع الأجر والتأمينات · مدة · حق العودة</td></tr>
<tr><td><strong>الترقية</strong></td><td>انتقال لدرجة أعلى بمسؤوليات أكبر</td><td>لا (لصالحه) لكن يُوثَّق</td><td>قرار + المسمى والدرجة والأجر الجديد</td></tr>
<tr><td><strong>تغيير المسمى</strong></td><td>تعديل الاسم دون تغيير جوهر العمل</td><td>إخطار يكفي غالبًا</td><td>سبب التغيير + عدم المساس بالحقوق</td></tr>
<tr><td><strong>تعديل العقد</strong></td><td>تغيير بند أو أكثر</td><td>نعم كتابةً</td><td>ملحق عقد موقّع لا تعديل على الأصل</td></tr>
<tr><td><strong>خفض الأجر</strong></td><td>تقليل الأجر أو أحد عناصره</td><td>نعم — وهو الأخطر</td><td>موافقة صريحة + سبب + مدة إن كان مؤقتًا</td></tr>
<tr><td><strong>الإيقاف عن العمل</strong></td><td>منع من مباشرة العمل أثناء تحقيق</td><td>وفق اللائحة والقانون</td><td>مدة قصوى + الأجر أثناءه + نتيجة التحقيق</td></tr>
<tr><td><strong>تغيير الورديات</strong></td><td>نقل من نهاري لليلي أو العكس</td><td>يعتمد على نص العقد</td><td>إشعار مسبق كافٍ + أثر على البدلات</td></tr>
</tbody></table></div>

<h2>خفض الأجر — الحالة الأخطر</h2>
<div class="box ex"><span class="lbl">مسار سليم في أزمة مالية</span>
<p><strong>1.</strong> استنفد البدائل أولًا: تجميد التوظيف · وقف الإضافي · تأجيل الزيادات · خفض بدلات القيادة أولًا.</p>
<p><strong>2.</strong> صارح الموظفين بالوضع بالأرقام لا بالعموميات.</p>
<p><strong>3.</strong> اعرض الخفض كـ<strong>خيار مؤقت محدد المدة</strong> مقابل الحفاظ على الوظائف، مع تاريخ مراجعة معلن.</p>
<p><strong>4.</strong> احصل على <strong>موافقة فردية كتابية</strong> — لا موافقة جماعية شفهية ولا «من لم يعترض فقد وافق».</p>
<p><strong>5.</strong> وثّق حق العودة للأجر الأصلي عند انتهاء الظرف.</p>
<p class="hint">من يرفض لا يجوز معاقبته على رفضه — رفضه ممارسة لحق لا مخالفة.</p></div>

<h2>الإيقاف عن العمل (Suspension)</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الغرض</th><th>الأجر</th></tr></thead><tbody>
<tr><td>إيقاف احترازي</td><td>إبعاد الموظف أثناء تحقيق لحماية الأدلة أو الأشخاص</td><td>عادةً مدفوع — لأنه ليس عقوبة</td></tr>
<tr><td>إيقاف تأديبي</td><td>عقوبة بعد ثبوت المخالفة</td><td>وفق اللائحة والحدود القانونية</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">خطأ متكرر</span><p>الخلط بين النوعين: إيقاف الموظف بلا أجر «حتى ينتهي التحقيق» يحوّل الإجراء الاحترازي إلى عقوبة سابقة على الإدانة — وهو ما يسقط الإجراء كله عند الطعن.</p></div>

<h2>العودة من انقطاع طويل</h2>
<p>موظف عاد من إجازة وضع أو مرض طويل أو إعارة يحتاج <strong>إعادة تهيئة</strong> لا استئنافًا مباشرًا:</p>
<ul>
<li>لقاء تحديث قبل العودة بأسبوع: ما الذي تغيّر؟ من الفريق الجديد؟ ما الأنظمة الجديدة؟</li>
<li>عودة تدريجية إن أمكن (ساعات أقل في الأسبوع الأول).</li>
<li>حماية الدور: العودة لنفس المستوى والمسؤوليات ما لم يُتفق على غيره كتابةً.</li>
<li>مراجعة بعد 30 يومًا.</li>
</ul>
<div class="box tip"><span class="lbl">قاعدة</span><p>أكثر ما يدفع العائدين من انقطاع طويل للاستقالة ليس صعوبة العمل — بل اكتشافهم أن دورهم تقلّص أو أن أحدًا لم يخطرهم بما تغيّر. <strong>ساعة تحديث واحدة تمنع استقالة.</strong></p></div>

html:`

<h2>ما هي إصابة العمل؟</h2>
<p>تشمل عادةً ثلاث حالات: <strong>إصابة أثناء تأدية العمل أو بسببه</strong> · <strong>مرض مهني</strong> ناتج عن طبيعة العمل · <strong>إصابة في الطريق</strong> من المسكن للعمل والعكس بالطريق المعتاد وبلا انحراف أو توقف.</p>
