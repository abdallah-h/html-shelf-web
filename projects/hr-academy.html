<h2>التعريف</h2>
<div class="box def"><span class="lbl">تعريف</span>
<p><strong>الموارد البشرية</strong> هي الإدارة المسؤولة عن كل ما يتعلق بالعنصر البشري: تخطيط الاحتياج، الاستقطاب، التوظيف، التدريب، الأجور، الأداء، العلاقات، وصولًا إلى إنهاء الخدمة.</p>
<p>بصياغة عملية، هي الإدارة التي تجيب على سؤال واحد: <strong>كيف نحصل على الأشخاص المناسبين، ونجعلهم قادرين وراغبين في العمل، ونحتفظ بهم؟</strong></p></div>

<h2>لماذا تهم الموارد البشرية؟</h2>
<div class="tbl"><table><thead><tr><th>البُعد</th><th>الأثر</th><th>مثال ملموس</th></tr></thead><tbody>
<tr><td>مالي</td><td>الرواتب 40–70% من مصروفات الشركات الخدمية</td><td>خفض معدل الدوران 5% يوفّر ملايين في تكلفة الإحلال</td></tr>
<tr><td>تشغيلي</td><td>الموظف غير المناسب يعطّل الإنتاج</td><td>مشغّل خط إنتاج ضعيف التدريب يرفع نسبة الهالك 12%</td></tr>
<tr><td>قانوني</td><td>المخالفات = غرامات وقضايا</td><td>فصل بلا تحقيق موثّق ينتهي بتعويض فصل تعسفي</td></tr>
<tr><td>استراتيجي</td><td>لا تُنفَّذ استراتيجية بلا كفاءات</td><td>خطة توسع بـ 3 فروع بلا خطة قوى عاملة = تأخر الافتتاح</td></tr>
<tr><td>ثقافي</td><td>HR حارس القيم</td><td>سكوت HR عن مدير متنمّر يفقد الشركة أفضل كفاءاتها</td></tr>
</tbody></table></div>

<h2>تطوّر المفهوم تاريخيًا</h2>
<div class="tbl"><table><thead><tr><th>المرحلة</th><th>الفترة</th><th>التركيز</th></tr></thead><tbody>
<tr><td>رعاية العمال</td><td>1900–1920</td><td>ظروف العمل والرعاية الاجتماعية</td></tr>
<tr><td>الإدارة العلمية</td><td>1910–1930</td><td>الكفاءة ودراسة الحركة والزمن (تايلور)</td></tr>
<tr><td>العلاقات الإنسانية</td><td>1930–1950</td><td>الدافعية والروح المعنوية (تجارب هوثورن)</td></tr>
<tr><td>شؤون الأفراد</td><td>1950–1980</td><td>العقود والحضور والرواتب والالتزام القانوني</td></tr>
<tr><td>إدارة الموارد البشرية</td><td>1980–2000</td><td>ربط الأفراد بأهداف الشركة</td></tr>
<tr><td>الشريك الاستراتيجي</td><td>2000–2015</td><td>نموذج أولريخ ودخول HR لطاولة القرار</td></tr>
<tr><td>رأس المال البشري وتجربة الموظف</td><td>2015 → الآن</td><td>البيانات، التحليلات، تجربة الموظف، الذكاء الاصطناعي</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال على تجارب هوثورن</span><p>أراد الباحثون قياس أثر الإضاءة على إنتاجية العاملات. رفعوا الإضاءة فارتفع الإنتاج، ثم خفضوها فارتفع الإنتاج أيضًا! الاكتشاف: ما رفع الإنتاج لم يكن الضوء، بل <strong>شعور العاملات بأن أحدًا يهتم ويراقب ويسأل</strong>. من هنا وُلدت مدرسة العلاقات الإنسانية.</p></div>

<h2>الفروق بين المصطلحات</h2>
<div class="tbl"><table><thead><tr><th>المصطلح</th><th>المعنى</th><th>التركيز</th></tr></thead><tbody>
<tr><td>Personnel Management</td><td>شؤون الأفراد</td><td>إجراءات، ملفات، حضور، رواتب</td></tr>
<tr><td>HRM</td><td>إدارة الموارد البشرية</td><td>إدارة الأفراد كأصل من أصول الشركة</td></tr>
<tr><td>HRD</td><td>تنمية الموارد البشرية</td><td>التدريب والتطوير والمسار الوظيفي</td></tr>
<tr><td>SHRM</td><td>الإدارة الاستراتيجية للموارد البشرية</td><td>ربط سياسات الأفراد باستراتيجية العمل</td></tr>
<tr><td>HCM</td><td>إدارة رأس المال البشري</td><td>الموظف كاستثمار له عائد قابل للقياس</td></tr>
<tr><td>People Operations</td><td>المسمى الحديث في شركات التقنية</td><td>تجربة الموظف والثقافة والبيانات</td></tr>
<tr><td>IHRM</td><td>الموارد البشرية الدولية</td><td>عمالة عبر دول وثقافات وقوانين مختلفة</td></tr>
</tbody></table></div>

<h3>Personnel مقابل HRM</h3>
<div class="tbl"><table><thead><tr><th>المقارنة</th><th>Personnel Management</th><th>HRM</th></tr></thead><tbody>
<tr><td>النظرة للموظف</td><td>تكلفة</td><td>أصل / استثمار</td></tr>
<tr><td>الطبيعة</td><td>رد فعل</td><td>استباقي</td></tr>
<tr><td>القرار</td><td>مركزي</td><td>لامركزي وتشاركي</td></tr>
<tr><td>المقياس</td><td>الالتزام بالإجراءات</td><td>الأثر على الأعمال</td></tr>
</tbody></table></div>

<h2>الأهداف الأربعة لأي إدارة موارد بشرية</h2>
<div class="grid">
<div class="card"><h4><em>01</em> تنظيمي</h4><p>توفير الكفاءات اللازمة لتحقيق أهداف الشركة.</p></div>
<div class="card"><h4><em>02</em> وظيفي</h4><p>تقديم خدمات HR بكفاءة وتكلفة مناسبة دون تضخّم.</p></div>
<div class="card"><h4><em>03</em> اجتماعي</h4><p>الالتزام بالقوانين والمسؤولية تجاه المجتمع.</p></div>
<div class="card"><h4><em>04</em> شخصي</h4><p>مساعدة الموظفين على تحقيق أهدافهم المهنية.</p></div>
</div>

<h2>الوظائف الأساسية</h2>
<p><strong>وظائف إدارية:</strong> التخطيط · التنظيم · التوجيه · الرقابة</p>
<p><strong>وظائف تشغيلية:</strong> التوظيف · التنمية · التعويض · التكامل · الاستبقاء · إنهاء الخدمة</p>
<div class="box tip"><span class="lbl">القاعدة الذهبية</span><p>كل مدير خط هو مدير موارد بشرية لفريقه. إدارة HR توفّر الأدوات والسياسات والخبرة — لكن التنفيذ اليومي (التحفيز، التقييم، التوجيه) يقع على المدير المباشر.</p></div>

quiz:[
{q:"ما الفرق الجوهري بين Personnel Management و HRM في النظرة للموظف؟",opts:["كلاهما ينظر للموظف كتكلفة","Personnel يراه تكلفة بينما HRM يراه أصلًا واستثمارًا","HRM يراه تكلفة و Personnel يراه أصلًا","لا يوجد فرق سوى الاسم"],a:1,why:"الفارق الفلسفي الأهم: الإدارة التقليدية تتعامل مع الأجر كمصروف يجب ضغطه، بينما HRM تتعامل معه كاستثمار له عائد قابل للقياس."},
{q:"تجارب هوثورن أثبتت أن الإنتاجية تأثرت أساسًا بـ:",opts:["مستوى الإضاءة","الأجر بالقطعة","الاهتمام والانتباه الذي شعر به العاملون","تصميم الآلات"],a:2,why:"سواء رُفعت الإضاءة أو خُفضت ارتفع الإنتاج، فاستُنتج أن العامل الحاسم كان الشعور بالاهتمام — وهو ما أسس لمدرسة العلاقات الإنسانية."},
{q:"أي مصطلح يعبّر عن ربط سياسات الأفراد باستراتيجية العمل؟",opts:["HRD","SHRM","Payroll","IHRM"],a:1,why:"SHRM = Strategic Human Resource Management، ومحورها التوافق بين ممارسات HR واستراتيجية المؤسسة."},
{q:"HRD تركّز تحديدًا على:",opts:["حساب الرواتب والضرائب","التدريب والتطوير والمسار الوظيفي","التفتيش العمالي","تقييم الوظائف"],a:1,why:"HRD = Human Resource Development، وهي الجزء المعني ببناء قدرات الأفراد ونموّهم، وتُعد فرعًا داخل HRM."},
{q:"مسمى People Operations شاع أكثر في:",opts:["المصانع الثقيلة","الجهات الحكومية","شركات التقنية","شركات المقاولات"],a:2,why:"نشأ المسمى في شركات التقنية للتعبير عن نهج قائم على تجربة الموظف والبيانات بدل الطابع الإداري التقليدي."},
{q:"الهدف الاجتماعي لإدارة الموارد البشرية يعني:",opts:["تنظيم رحلات ترفيهية","الالتزام بالقوانين والمسؤولية تجاه المجتمع","زيادة الأرباح","تقليل عدد الموظفين"],a:1,why:"الهدف الاجتماعي يتعلق بالامتثال القانوني والأخلاقي وتجنّب الممارسات الضارة بالمجتمع."},
{q:"أي مما يلي يُصنَّف كوظيفة إدارية (Managerial) وليست تشغيلية؟",opts:["الاستقطاب","التخطيط","التعويض","إنهاء الخدمة"],a:1,why:"التخطيط والتنظيم والتوجيه والرقابة وظائف إدارية عامة، أما الاستقطاب والتعويض وإنهاء الخدمة فوظائف تشغيلية خاصة بـ HR."},
{q:"عبارة «كل مدير خط هو مدير موارد بشرية لفريقه» تعني:",opts:["إلغاء إدارة HR","أن المدير المباشر مسؤول عن التحفيز والتقييم والتوجيه اليومي","أن المديرين يحسبون الرواتب بأنفسهم","أن HR تتبع إدارة العمليات"],a:1,why:"HR تصمّم الأدوات والسياسات، لكن أثرها الفعلي يتحقق عبر ممارسة المدير المباشر اليومية مع فريقه."},
{q:"HCM (إدارة رأس المال البشري) تختلف عن HRM بتركيزها على:",opts:["الجانب القانوني فقط","قياس عائد الاستثمار في الأفراد","التفتيش والرقابة","العلاقات النقابية"],a:1,why:"HCM تنقل الخطاب من «إدارة أفراد» إلى «استثمار برأس مال» له عائد يمكن قياسه وتتبعه."},
{q:"في أي مرحلة تاريخية بدأت الشركات تنظر إلى HR كشريك استراتيجي بشكل واسع؟",opts:["1900–1920","1930–1950","1950–1980","بعد عام 2000"],a:3,why:"انتشر مفهوم الشريك الاستراتيجي و HRBP بعد أعمال ديف أولريخ في التسعينيات، وتوسّع تطبيقه بعد عام 2000."},
{q:"أي عبارة تصف الطبيعة الاستباقية لـ HRM؟",opts:["الانتظار حتى تصل استقالة ثم البحث عن بديل","بناء مخزون مواهب قبل ظهور الشاغر","توقيع الجزاء بعد وقوع المخالفة","إصدار خطاب راتب عند الطلب"],a:1,why:"الاستباقية تعني توقع الاحتياج والتحرك قبله — وبناء Talent Pool مثال نموذجي عليها."},
{q:"لماذا تُعتبر تكلفة الأجور مؤشرًا حساسًا في الشركات الخدمية؟",opts:["لأنها ثابتة لا تتغير","لأنها غالبًا 40–70% من إجمالي المصروفات","لأنها معفاة من الضرائب","لأنها لا تدخل في القوائم المالية"],a:1,why:"في الشركات كثيفة المعرفة والخدمة يمثل الأجر النسبة الأكبر من التكلفة، لذا أي تحسين في الإنتاجية أو الدوران له أثر مالي مباشر وكبير."}

SECTIONS.push({id:"types",track:T.A,title:"أنواع الموارد البشرية",lede:"ستة تصنيفات مختلفة لفهم شكل وظيفة HR: الفلسفة، المستوى، التخصص، المصدر، النطاق الجغرافي، والقطاع.",
html:`
<h2>أولًا: حسب الفلسفة الإدارية</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الوصف</th><th>مناسب لـ</th></tr></thead><tbody>
<tr><td><strong>Hard HRM</strong></td><td>الموظف مورد اقتصادي — تركيز على التكلفة والإنتاجية والرقابة</td><td>المصانع والتشغيل كثيف العمالة</td></tr>
<tr><td><strong>Soft HRM</strong></td><td>الموظف شريك — تركيز على التحفيز والولاء والتطوير</td><td>الشركات المعرفية والتقنية والاستشارات</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال</span><p>مصنع ملابس يقيس إنتاج كل عاملة بالقطعة ويربط الأجر بها = <strong>Hard</strong>. شركة برمجيات تمنح المطوّر حرية اختيار المشروع وساعات العمل = <strong>Soft</strong>. معظم الشركات الناجحة تستخدم <strong>مزيجًا</strong>: انضباط في التكلفة، ومرونة في التحفيز.</p></div>

<h2>ثانيًا: حسب مستوى الدور</h2>
<div class="grid">
<div class="card"><h4><em>تشغيلي</em> Administrative HR</h4><p>التنفيذ اليومي: الملفات، الحضور، التأمينات، الخطابات.</p></div>
<div class="card"><h4><em>تكتيكي</em> Tactical HR</h4><p>برامج متوسطة المدى: خطة تدريب سنوية، هيكل رواتب.</p></div>
<div class="card"><h4><em>استراتيجي</em> Strategic HR</h4><p>مشاركة في قرار الشركة: تخطيط القوى العاملة، إعادة الهيكلة، الثقافة.</p></div>
</div>

<h2>ثالثًا: حسب نطاق التخصص</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الوصف</th><th>متى يظهر؟</th></tr></thead><tbody>
<tr><td><strong>HR Generalist</strong></td><td>يغطي كل وظائف HR بشكل عام</td><td>الشركات الصغيرة والمتوسطة</td></tr>
<tr><td><strong>HR Specialist</strong></td><td>متخصص بعمق في مجال واحد (توظيف/رواتب/تدريب/C&amp;B)</td><td>الشركات الكبيرة</td></tr>
<tr><td><strong>HRBP</strong></td><td>مخصص لقطاع أو إدارة معينة — حلقة الوصل بين HR والأعمال</td><td>الشركات متوسطة إلى كبيرة</td></tr>
</tbody></table></div>

<h2>رابعًا: حسب مصدر الخدمة</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الوصف</th><th>متى يُستخدم</th></tr></thead><tbody>
<tr><td>In-house</td><td>فريق داخل الشركة</td><td>الشركات المتوسطة والكبيرة</td></tr>
<tr><td>HR Outsourcing</td><td>إسناد مهام لشركة خارجية</td><td>تقليل التكلفة أو غياب الخبرة الداخلية</td></tr>
<tr><td>PEO</td><td>توظيف مشترك — الشركة الخارجية صاحب عمل قانوني</td><td>الشركات الصغيرة (شائع في أمريكا)</td></tr>
<tr><td>EOR</td><td>صاحب عمل نيابي لتوظيف موظفين في دول أخرى</td><td>التوظيف الدولي والعمل عن بُعد</td></tr>
<tr><td>HR Consulting</td><td>استشارات مشروعية محددة</td><td>بناء هيكل، تقييم وظائف، لوائح</td></tr>
<tr><td>Staffing Agency</td><td>توفير عمالة مؤقتة أو تعاقدية</td><td>المواسم والمشاريع</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال على EOR</span><p>شركة مصرية تريد توظيف مطوّر يقيم في ألمانيا دون فتح كيان قانوني هناك. تتعاقد مع مزوّد EOR يصبح صاحب العمل الرسمي للمطوّر في ألمانيا (يتولى العقد والضرائب والتأمينات)، بينما يعمل المطوّر فعليًا مع الفريق المصري.</p></div>

<h2>خامسًا: حسب النطاق الجغرافي</h2>
<ul>
<li><strong>Domestic HRM</strong> — دولة واحدة، قانون واحد، ثقافة واحدة.</li>
<li><strong>IHRM</strong> — عدة دول، قوانين وعملات وثقافات متعددة، وإدارة المغتربين (Expatriates).</li>
<li><strong>Global / Remote HR</strong> — فرق موزعة، تركيز على الامتثال الضريبي والتوظيف عبر الحدود.</li>
</ul>

<h2>سادسًا: حسب القطاع</h2>
<div class="grid">
<div class="card"><h4>الحكومي</h4><p>التزام صارم باللوائح والدرجات الوظيفية ومرونة محدودة.</p></div>
<div class="card"><h4>الخاص</h4><p>مرونة أعلى وتركيز على الربحية والأداء.</p></div>
<div class="card"><h4>غير الربحي</h4><p>إدارة متطوعين، ميزانيات محدودة، الدافع القيمي بديل جزئي للمال.</p></div>
<div class="card"><h4>المصانع</h4><p>علاقات عمالية، سلامة مهنية، ورديات، نقابات.</p></div>
<div class="card"><h4>التجزئة والمطاعم</h4><p>توظيف بكميات كبيرة، دوران مرتفع، جدولة ورديات معقدة.</p></div>
<div class="card"><h4>التقنية</h4><p>حرب مواهب، أسهم وحوافز، عمل عن بُعد.</p></div>
</div>

{q:"أي من التالي يُعد نشاطًا تكتيكيًا وليس تشغيليًا ولا استراتيجيًا؟",opts:["طباعة خطاب إفادة عمل","بناء خطة التدريب السنوية","اتخاذ قرار إعادة هيكلة الشركة","تسجيل بصمة الحضور"],a:1,why:"الخطة السنوية برنامج متوسط المدى يترجم الاستراتيجية إلى إجراءات — وهذا هو المستوى التكتيكي."},

/* ========== 3. دورة حياة الموظف ========== */
SECTIONS.push({id:"lifecycle",track:T.A,title:"دورة حياة الموظف",lede:"الإطار الذي تدور حوله كل أقسام HR: من لحظة معرفة المرشح بالشركة حتى ما بعد رحيله.",
html:`

<div class="tbl"><table><thead><tr><th>المرحلة</th><th>السؤال الأساسي</th><th>القسم المسؤول</th><th>مؤشر القياس</th></tr></thead><tbody>
<tr><td>الجذب</td><td>لماذا يريد أحدهم العمل معنا؟</td><td>Employer Branding</td><td>عدد المتقدمين المؤهلين</td></tr>

<tr><td>التهيئة</td><td>كيف نجعله منتجًا بسرعة؟</td><td>Onboarding</td><td>Time to Productivity</td></tr>
<tr><td>التطوير</td><td>كيف نجعله أفضل؟</td><td>L&amp;D</td><td>ساعات تدريب/موظف</td></tr>
<tr><td>المكافأة</td><td>كيف يشعر بالعدالة؟</td><td>C&amp;B</td><td>Compa-Ratio</td></tr>

<tr><td>الخروج</td><td>ماذا نتعلم من رحيله؟</td><td>Exit Management</td><td>Regretted Attrition</td></tr>

<div class="box ex"><span class="lbl">مثال متكامل</span><p>مهندسة تقرأ عن ثقافة الشركة على لينكدإن (<strong>جذب</strong>) ← تتقدم وتمر بأربع مقابلات منظمة (<strong>استقطاب</strong>) ← تصلها معدات العمل قبل أول يوم ولها زميل مرافق (<strong>تهيئة</strong>) ← تدخل برنامج شهادة تقنية في الشهر السادس (<strong>تطوير</strong>) ← تحصل على زيادة بعد مراجعة السوق (<strong>مكافأة</strong>) ← تُرقّى لقائدة فريق (<strong>نمو</strong>) ← بعد 5 سنوات ترحل وتُجرى معها مقابلة خروج، ثم تنضم لشبكة الخريجين وترشّح لكم مطوّرين (<strong>خروج</strong>).</p></div>

<div class="box tip"><span class="lbl">فكرة محورية</span><p>أي خلل في مرحلة يظهر أثره في التي بعدها. ارتفاع الاستقالات في أول 90 يومًا ليس مشكلة «استبقاء» — بل غالبًا مشكلة <strong>اختيار</strong> أو <strong>تهيئة</strong> أو <strong>وعود مبالغ فيها في مرحلة الجذب</strong>.</p></div>

<h2>ما الذي يحدث فعليًا في كل مرحلة</h2>
<div class="tbl"><table><thead><tr><th>المرحلة</th><th>ما يفكر فيه الموظف</th><th>أكبر خطر</th></tr></thead><tbody>
<tr><td>الجذب</td><td>هل هذه الشركة تستحق؟</td><td>وعود لا تطابق الواقع</td></tr>
<tr><td>الاستقطاب</td><td>هل يقدّرونني ويحترمون وقتي؟</td><td>عملية طويلة بلا تواصل</td></tr>
<tr><td>التهيئة</td><td>هل اتخذت القرار الصحيح؟</td><td>الترك المبكر خلال 90 يومًا</td></tr>
<tr><td>التطوير</td><td>هل أتعلّم شيئًا هنا؟</td><td>الركود وتقادم المهارة</td></tr>
<tr><td>المكافأة</td><td>هل أُعامَل بعدل مقارنة بغيري؟</td><td>اكتشاف فجوة أجر غير مبررة</td></tr>
<tr><td>النمو</td><td>ما مستقبلي بعد سنتين؟</td><td>سقف مسدود بلا مصارحة</td></tr>
<tr><td>الخروج</td><td>هل سأوصي بهم أم أحذّر منهم؟</td><td>خروج مهين يضر بالسمعة</td></tr>
</tbody></table></div>

<h2>اللحظات الحاسمة (Moments That Matter)</h2>
<p>ليست كل لحظات التجربة متساوية الأثر. عدد قليل منها يترك انطباعًا يدوم سنوات:</p>
<div class="chips"><span class="chip">أول يوم عمل</span><span class="chip">أول تغذية راجعة</span><span class="chip">أول خطأ كبير وكيف عُومل</span><span class="chip">أول طلب إجازة طارئة</span><span class="chip">إعلان نتيجة الترقية</span><span class="chip">أزمة شخصية ودعم الشركة فيها</span><span class="chip">تغيير المدير المباشر</span><span class="chip">يوم الاستقالة</span></div>
<div class="box ex"><span class="lbl">مثال</span><p>موظفة طلبت إجازة طارئة لوفاة قريب. الشركة التي ترد خلال ساعة بـ«اذهبي الآن ونحن نتولى الباقي» تكسب ولاءً لا تشتريه بأي زيادة راتب. والشركة التي تطلب نموذجًا وتوقيعات ثلاثة تخسر شيئًا لا يُسترد — <strong>وكلا القرارين بنفس التكلفة المالية تقريبًا</strong>.</p></div>

<h2>ربط المراحل بالأقسام</h2>
<div class="tbl"><table><thead><tr><th>المرحلة</th><th>الأقسام ذات الصلة في هذا الدليل</th></tr></thead><tbody>
<tr><td>الجذب والاستقطاب</td><td>الاستقطاب والتوظيف · أدوات التقييم · الثقافة والاندماج</td></tr>

<tr><td>الخروج</td><td>إنهاء الخدمة · المؤشرات · إدارة الأزمات</td></tr>
</tbody></table></div>
`,

/* ========== 4. الاستقطاب والتوظيف ========== */
SECTIONS.push({id:"recruit",track:T.B,title:"الاستقطاب والتوظيف",lede:"من طلب التوظيف حتى توقيع العقد: الخطوات، المصادر، أنواع المقابلات، وأدوات رفع دقة الاختيار.",
html:`
<h2>Recruitment مقابل Talent Acquisition</h2>
<div class="tbl"><table><thead><tr><th>Recruitment</th><th>Talent Acquisition</th></tr></thead><tbody>
<tr><td>قصير المدى — ملء شاغر</td><td>طويل المدى — بناء مخزون مواهب</td></tr>
<tr><td>رد فعل على استقالة/احتياج</td><td>استباقي واستراتيجي</td></tr>
<tr><td>تركيز على السرعة</td><td>تركيز على الجودة والتوافق الثقافي</td></tr>
</tbody></table></div>

<h2>خطوات العملية</h2>
<ol>
<li><strong>طلب التوظيف (Manpower Request)</strong> + اعتماد الميزانية.</li>
<li><strong>تحليل الوظيفة</strong> ← ينتج: الوصف الوظيفي (JD) + المواصفات الوظيفية (Job Spec).</li>
<li><strong>تحديد المصادر:</strong> داخلية (ترقية، نقل، ترشيح موظفين، إعادة توظيف) وخارجية (مواقع، لينكدإن، جامعات، معارض، Headhunting).</li>
<li><strong>فرز السير الذاتية</strong> يدويًا أو عبر ATS.</li>
<li><strong>مقابلة هاتفية</strong> 10–15 دقيقة للتأكد من الأساسيات والراتب المتوقع.</li>
<li><strong>الاختبارات:</strong> تقني/مهني، قدرات، شخصية، مركز تقييم.</li>
<li><strong>المقابلات:</strong> HR ← تقنية ← نهائية.</li>
<li><strong>التحقق من المراجع والخلفية.</strong></li>
<li><strong>عرض العمل والتفاوض.</strong></li>
<li><strong>التعاقد واستكمال المستندات.</strong></li>
</ol>

<div class="box def"><span class="lbl">فرق مهم</span><p><strong>الوصف الوظيفي (JD)</strong> يصف <em>الوظيفة</em>: المهام والمسؤوليات والتبعية. أما <strong>المواصفات الوظيفية</strong> فتصف <em>الشخص</em> المطلوب: المؤهل، الخبرة، المهارات، السمات.</p></div>

<h2>أنواع المقابلات</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الوصف</th><th>دقة التنبؤ</th></tr></thead><tbody>
<tr><td>Structured</td><td>أسئلة ومعايير موحدة لكل المرشحين</td><td>مرتفعة</td></tr>
<tr><td>Unstructured</td><td>حوار حر بلا معايير ثابتة</td><td>منخفضة</td></tr>
<tr><td>Behavioral (STAR)</td><td>«احكِ لي عن موقف…» — السلوك السابق يتنبأ بالمستقبلي</td><td>مرتفعة</td></tr>
<tr><td>Competency-Based</td><td>مبنية على جدارات محددة مسبقًا</td><td>مرتفعة</td></tr>
<tr><td>Situational</td><td>«ماذا ستفعل لو…؟» — سيناريو افتراضي</td><td>متوسطة إلى مرتفعة</td></tr>
<tr><td>Panel</td><td>لجنة من عدة مقيّمين</td><td>متوسطة إلى مرتفعة</td></tr>
<tr><td>Case Interview</td><td>حل حالة عملية</td><td>مرتفعة (للأدوار التحليلية)</td></tr>
<tr><td>Stress Interview</td><td>ضغط متعمد — مثير للجدل ويضر بسمعة الشركة</td><td>منخفضة</td></tr>
</tbody></table></div>

<h2>نموذج STAR</h2>
<div class="ascii">S — Situation : ما السياق والموقف؟
T — Task      : ما المهمة المطلوبة منه تحديدًا؟
A — Action    : ماذا فعل هو شخصيًا؟ (انتبه: "نحن" علامة تحذير)
R — Result    : ما النتيجة؟ ويفضّل أن تكون رقمية</div>
<div class="box ex"><span class="lbl">مثال على سؤال STAR وتقييمه</span>
<p><strong>السؤال:</strong> «احكِ لي عن مرة اضطررت فيها لتسليم عمل في موعد شبه مستحيل.»</p>
<p><strong>إجابة ضعيفة:</strong> «دايمًا بشتغل تحت ضغط وبسلّم في معادي.» ← لا موقف ولا فعل ولا نتيجة.</p>
<p><strong>إجابة قوية:</strong> «في مارس الماضي (S) طُلب مني إغلاق تقرير ربع سنوي في 3 أيام بدل 10 (T)، فقسّمت العمل مع زميلين وأتمتت خطوتين بجداول Excel وألغيت تحليلين غير ضروريين بعد موافقة المدير (A)، فسلّمنا في يومين ونصف بصفر أخطاء وصار القالب معتمدًا بعدها (R).»</p></div>

<h2>الصدق والثبات في أدوات الاختيار</h2>
<div class="box def"><span class="lbl">تعريف</span>
<p><strong>الثبات (Reliability):</strong> هل الأداة تعطي نفس النتيجة إذا كررتها؟</p>
<p><strong>الصدق (Validity):</strong> هل تقيس فعلًا ما نريد قياسه، أي النجاح في الوظيفة؟</p>
<p>ترتيب الأدوات من حيث القدرة على التنبؤ بالأداء: <strong>عينات العمل والاختبارات المهنية والمقابلات المنظمة</strong> أعلى بكثير من المقابلات غير المنظمة أو الانطباع الشخصي.</p></div>

<h2>مؤشرات القسم</h2>
<div class="chips"><span class="chip">Time to Hire</span><span class="chip">Time to Fill</span><span class="chip">Cost per Hire</span><span class="chip">Offer Acceptance Rate</span><span class="chip">Quality of Hire</span><span class="chip">Source of Hire</span><span class="chip">Candidate Experience</span><span class="chip">First-Year Turnover</span></div>

<div class="box warn"><span class="lbl">أخطاء شائعة</span>
<ul style="margin:6px 0 0">
<li>نسخ وصف وظيفي من الإنترنت دون تحليل حقيقي للدور.</li>
<li>الاعتماد على «الإحساس» بدل معايير مكتوبة.</li>
<li>ترك قرار التوظيف كاملًا للمدير المستعجل لملء الشاغر ← يخفّض المعايير.</li>
<li>عدد مقابلات مبالغ فيه يُنهك المرشح دون زيادة تُذكر في الدقة.</li>

{q:"الفرق الجوهري بين Time to Fill و Time to Hire:",opts:["لا فرق بينهما","Time to Fill من فتح الشاغر حتى القبول، و Time to Hire من تقدّم المرشح حتى قبوله","Time to Hire يقيس التكلفة","Time to Fill يقيس جودة التعيين"],a:1,why:"Time to Fill يقيس كفاءة العملية كلها من لحظة اعتماد الشاغر، أما Time to Hire فيقيس تجربة المرشح المحدد من لحظة دخوله المسار."},
{q:"في نموذج STAR، إجابة يستخدم فيها المرشح ضمير «نحن» طوال الوقت تثير قلقًا بشأن:",opts:["حرف الـ S","حرف الـ A (الفعل الشخصي)","حرف الـ R","حرف الـ T"],a:1,why:"الهدف من A معرفة ما فعله المرشح شخصيًا؛ الإفراط في «نحن» قد يخفي مساهمة محدودة، ويستدعي سؤال متابعة: «وأنت تحديدًا ماذا فعلت؟»"},
{q:"أي أداة اختيار تُعد الأعلى في القدرة على التنبؤ بالأداء الوظيفي؟",opts:["المقابلة غير المنظمة","تحليل خط اليد","عينة عمل أو اختبار مهني","سنوات الخبرة فقط"],a:2,why:"عينات العمل تقيس الأداء الفعلي في مهمة تشبه الوظيفة، ولذلك صدقها التنبؤي مرتفع مقارنة بالانطباعات."},
{q:"«الثبات» (Reliability) في أداة اختيار يعني:",opts:["أنها تقيس ما نريد قياسه","أنها تعطي نتائج متسقة عند التكرار","أنها رخيصة","أنها معتمدة قانونيًا"],a:1,why:"الثبات = الاتساق. أما قياس الشيء الصحيح فهو الصدق (Validity). أداة قد تكون ثابتة لكنها تقيس شيئًا غير ذي صلة."},

{q:"الاستقطاب الداخلي يشمل كل ما يلي عدا:",opts:["الترقية","النقل بين الأقسام","إعادة توظيف موظف سابق","معارض التوظيف الجامعية"],a:3,why:"معارض التوظيف مصدر خارجي. الترقية والنقل وإعادة التوظيف كلها مصادر داخلية."},
{q:"ما وظيفة الـ ATS؟",opts:["حساب الرواتب","تتبع المتقدمين وإدارة مسار التوظيف","تقييم الأداء السنوي","إدارة التأمين الطبي"],a:1,why:"Applicant Tracking System نظام لاستقبال الطلبات وفرزها وتتبع مرحلة كل مرشح والتواصل معه."},
{q:"Quality of Hire يختلف عن باقي مؤشرات التوظيف بأنه:",opts:["يُقاس فورًا يوم التعيين","يُقاس بعد فترة من العمل بربطه بأداء الموظف وبقائه","لا يمكن قياسه","يقيس عدد المتقدمين"],a:1,why:"هو المؤشر الوحيد الذي يحكم على «صحة القرار» لا سرعته، ولذلك يحتاج بيانات لاحقة: تقييم الأداء، البقاء، تقييم المدير."},

html:`
<h2>المراحل الخمس</h2>

<div class="card"><h4>الجزاءات</h4><p>لفت نظر، إنذار، خصم — وفق اللائحة والقانون.</p></div>

<div class="box def"><span class="lbl">فرق مهم</span><p><strong>الإجازة العارضة</strong> تُؤخذ لظرف مفاجئ دون إخطار مسبق وتُخصم من الرصيد السنوي بحدود معينة. أما <strong>الإجازة الاعتيادية/السنوية</strong> فتُطلب مسبقًا وتُعتمد ضمن خطة إجازات القسم.</p></div>

<div class="box ex"><span class="lbl">مثال على حساب رصيد إجازة</span>
<p>موظف رصيده السنوي 21 يومًا، استهلك 13 يومًا حتى نوفمبر وطلب 10 أيام في ديسمبر. الرصيد المتبقي 8 أيام فقط ← إما يُعتمد 8 أيام، أو يُمنح يومان بدون أجر بموافقته، أو يُرحَّل جزء وفق اللائحة. <strong>القاعدة:</strong> لا تعتمد إجازة قبل مراجعة الرصيد الفعلي وخطة تغطية العمل.</p></div>

<div class="box tip"><span class="lbl">قاعدة عملية</span><p>ملف الموظف الناقص هو أول ما يظهر في التفتيش وأول ما يضعف موقف الشركة في أي نزاع. اجعل لديك <strong>قائمة تحقق (Checklist)</strong> موحدة لكل ملف، وراجع 10% من الملفات عشوائيًا كل ربع سنة.</p></div>

<h2>الدورة الشهرية لشؤون العاملين</h2>
<div class="ascii">أول الشهر : مراجعة العقود المنتهية والتنبيهات
             تحديث الملفات والمستندات المنتهية
منتصف الشهر: متابعة الحضور والأذونات والإجازات
             معالجة الجزاءات والتحقيقات القائمة
قبل الإغلاق: تجهيز مدخلات الرواتب وتسليمها
آخر الشهر  : تقارير الغياب والدوران وأرصدة الإجازات
             مراجعة عيّنة ملفات ومطابقة سجل التأمينات</div>

<h2>نظام التنبيهات الذي يمنع 90% من المشكلات</h2>

<tr><td>انتهاء عقد</td><td>60 يومًا</td><td>وقت كافٍ لقرار التجديد أو الإخطار</td></tr>

<tr><td>انتهاء تصريح عمل أو إقامة</td><td>90 يومًا</td><td>الإجراءات الحكومية تحتاج وقتًا</td></tr>
<tr><td>انتهاء شهادة صحية أو رخصة مهنية</td><td>30 يومًا</td><td>العمل بشهادة منتهية مخالفة</td></tr>
<tr><td>تراكم رصيد إجازات فوق حد معين</td><td>ربع سنوي</td><td>التزام مالي متراكم وخطر احتراق</td></tr>

</tbody></table></div>
<div class="box tip"><span class="lbl">قاعدة</span><p>أغلب أزمات شؤون العاملين ليست معقدة — بل <strong>متأخرة</strong>. عقد انتهى ولم يُلاحظ، تصريح انقضى، فترة اختبار مرت. نظام تنبيهات بسيط في جدول أو نظام يمنع معظمها بتكلفة شبه صفرية.</p></div>

<h2>تصنيف حالات الغياب</h2>
<div class="tbl"><table><thead><tr><th>الحالة</th><th>التعامل</th></tr></thead><tbody>

SECTIONS.push({id:"payroll",track:T.B,title:"الرواتب (Payroll)",lede:"مكونات الأجر، الاستقطاعات، دورة الصرف الشهرية، وأنظمة الأجر المختلفة.",
html:`
<h2>مكونات الراتب</h2>
<div class="ascii">الراتب الإجمالي (Gross)
  = الأساسي (Basic)
  + البدلات (Allowances)
  + الحوافز والعمولات
  + الأجر الإضافي (Overtime)

صافي الراتب (Net)
  = الإجمالي − الاستقطاعات
    (ضريبة كسب العمل + حصة الموظف في التأمينات
     + السلف + الجزاءات + خصومات أخرى)</div>

<h2>البدلات الشائعة</h2>
<div class="chips"><span class="chip">انتقالات</span><span class="chip">سكن</span><span class="chip">اتصالات</span><span class="chip">طبيعة عمل</span><span class="chip">وجبة</span><span class="chip">سفر ومأموريات</span><span class="chip">انتداب</span><span class="chip">مخاطر</span><span class="chip">بدل نقدي عن السيارة</span></div>

<h2>الدورة الشهرية</h2>
<ol>
<li>إغلاق شهر الحضور (<strong>Cut-off Date</strong>) — مثلًا يوم 25.</li>
<li>تجميع المدخلات: حضور، إضافي، إجازات، جزاءات، سلف، تعيينات، استقالات.</li>
<li>حساب الاستحقاقات والاستقطاعات.</li>
<li>حساب الضريبة والتأمينات.</li>
<li>المراجعة والاعتماد (HR ← المالية ← الإدارة العليا).</li>
<li>التحويل البنكي أو كشوف الصرف.</li>
<li>إصدار قسائم الراتب (Payslips).</li>
<li>سداد الضرائب والتأمينات للجهات المختصة.</li>
<li>المطابقة (Reconciliation) مع الحسابات.</li>
</ol>

<h2>أنظمة الأجر</h2>
<div class="tbl"><table><thead><tr><th>النظام</th><th>الوصف</th><th>مناسب لـ</th></tr></thead><tbody>
<tr><td>الأجر الزمني</td><td>شهري/يومي/بالساعة</td><td>معظم الوظائف الإدارية</td></tr>
<tr><td>الأجر بالقطعة</td><td>حسب حجم الإنتاج</td><td>خطوط الإنتاج والتصنيع</td></tr>
<tr><td>العمولة</td><td>نسبة من المبيعات</td><td>المبيعات المباشرة</td></tr>
<tr><td>راتب + عمولة</td><td>مزيج يوازن الأمان والتحفيز</td><td>المبيعات المؤسسية</td></tr>
<tr><td>الأجر المتغير</td><td>حوافز مرتبطة بمؤشرات أداء</td><td>الأدوار ذات النتائج القابلة للقياس</td></tr>
</tbody></table></div>

<div class="box ex"><span class="lbl">مثال محلول</span>
<p>موظف: أساسي 8,000 + بدل انتقالات 1,000 + بدل اتصالات 500 + حافز أداء 1,500.</p>
<p><strong>الإجمالي =</strong> 8,000 + 1,000 + 500 + 1,500 = <strong>11,000</strong></p>
<p>الاستقطاعات: حصة الموظف في التأمينات 900 + ضريبة 700 + سلفة 500 = 2,100</p>
<p><strong>الصافي =</strong> 11,000 − 2,100 = <strong>8,900</strong></p>
<p class="hint">ملاحظة: النسب الفعلية للضريبة وأجر الاشتراك التأميني تختلف حسب القانون الساري في بلدك — الأرقام هنا توضيحية فقط.</p></div>

<li>عدم مطابقة كشف الرواتب مع القيد المحاسبي شهريًا.</li>
</ul></div>

<div class="box def"><span class="lbl">تنبيه مفاهيمي</span><p>تقييم الوظائف يقيّم <strong>الوظيفة لا شاغلها</strong>. الشخص المتميز يُكافأ عبر الأداء والحوافز والترقية، لا عبر رفع تقييم وظيفته.</p></div>

<h2>هيكل الرواتب</h2>
<div class="ascii">Grade 5   |----------[Min]-------[Mid]-------[Max]----------|
Grade 4   |------[Min]-----[Mid]-----[Max]------|
Grade 3   |---[Min]---[Mid]---[Max]---|

Compa-Ratio = راتب الموظف / النقطة الوسطى للدرجة
  < 1.00  أقل من وسط الدرجة (جديد أو أداء متوسط)
  = 1.00  في المنتصف تمامًا
  > 1.00  أعلى من الوسط (خبير أو أداء متميز)</div>
<div class="box ex"><span class="lbl">مثال محلول</span><p>موظف راتبه 12,000 ونقطة الوسط لدرجته 15,000 ← <code>Compa-Ratio = 12000/15000 = 0.80</code>. هذا يعني أنه أقل بـ 20% من وسط درجته. السؤال التالي: هل هذا مبرر (حديث في الدور / أداء ناشئ) أم أنه خلل عدالة يجب تصحيحه قبل أن يستقيل؟</p></div>

<h2>موقعك في السوق</h2>
<div class="tbl"><table><thead><tr><th>السياسة</th><th>المعنى</th><th>المقابل</th></tr></thead><tbody>
<tr><td>Lead (قائد)</td><td>أعلى من السوق</td><td>جذب أقوى وتكلفة أعلى</td></tr>
<tr><td>Match (مطابق)</td><td>عند وسط السوق</td><td>التوازن الشائع</td></tr>
<tr><td>Lag (تابع)</td><td>أقل من السوق</td><td>يحتاج تعويضًا بمزايا غير مالية قوية</td></tr>
</tbody></table></div>

<div class="box tip"><span class="lbl">نظرية العدالة (Adams)</span><p>الموظف لا يقارن راتبه بالسوق فقط — بل يقارن <strong>نسبة (ما يأخذه ÷ ما يقدمه)</strong> بنسبة زميله. لذلك قد يُحبطه ظلم نسبي داخلي أكثر مما يُحبطه راتب منخفض يتساوى فيه الجميع.</p></div>

html:`
<h2>الفروق</h2>
<div class="tbl"><table><thead><tr><th>Training</th><th>Development</th><th>Education</th></tr></thead><tbody>

<tr><td>قصير المدى ومحدد</td><td>طويل المدى</td><td>أكاديمي</td></tr>
</tbody></table></div>

<h2>نموذج ADDIE</h2>
<div class="ascii">A — Analysis       تحليل الاحتياج التدريبي (TNA)
D — Design         تصميم الأهداف والمحتوى وطريقة التقييم
D — Development    إعداد المواد والتمارين والحالات
I — Implementation التنفيذ
E — Evaluation     التقييم والتحسين (يغذّي التحليل من جديد)</div>

<h2>مصادر تحليل الاحتياج (TNA)</h2>
<ul>
<li>نتائج تقييم الأداء وفجوات الجدارات.</li>
<li>الوصف الوظيفي مقابل المهارات الحالية.</li>
<li>مقابلات واستبيانات المديرين.</li>
<li>خطط التوسع والمنتجات الجديدة.</li>
<li>الشكاوى وأخطاء الجودة وحوادث السلامة.</li>
<li>متطلبات قانونية إلزامية.</li>
</ul>
<div class="box warn"><span class="lbl">تحذير</span><p>ليست كل مشكلة أداء مشكلة تدريب. لو كان الموظف <em>يعرف</em> كيف يؤدي لكنه لا يؤدي، فالمشكلة في الدافعية أو الأدوات أو العملية — والتدريب هنا هدر للمال. استخدم نموذج <strong>AMO</strong>: القدرة × الدافعية × الفرصة.</p></div>

<h2>طرق التدريب</h2>
<div class="grid">
<div class="card"><h4>داخل العمل (On-the-job)</h4><p>تدريب أثناء العمل · تناوب وظيفي · Coaching · Mentoring · تلمذة صناعية · Shadowing</p></div>
<div class="card"><h4>خارج العمل (Off-the-job)</h4><p>محاضرات · ورش · دراسة حالة · لعب أدوار · محاكاة · تعلم إلكتروني · Microlearning</p></div>
</div>
<div class="box def"><span class="lbl">Coaching مقابل Mentoring</span>
<p><strong>Coaching:</strong> قصير المدى، مرتبط بأداء أو مهارة محددة، يقوده غالبًا المدير أو مدرب متخصص، ويعتمد على الأسئلة لا الإجابات.</p>
<p><strong>Mentoring:</strong> طويل المدى، يركز على المسار المهني والنضج، يقوده شخص أكثر خبرة، ويقوم على مشاركة التجربة والنصح.</p></div>

<h2>نموذج 70:20:10</h2>
<div class="ascii">70%  خبرة عملية ومهام صعبة
20%  تعلّم من الآخرين (توجيه، إرشاد، تغذية راجعة)
10%  تعلّم رسمي (دورات ومحتوى)</div>
<div class="box ex"><span class="lbl">مثال تطبيقي</span><p>لتطوير محلل بيانات مبتدئ: <strong>10%</strong> دورة Power BI · <strong>20%</strong> جلستان أسبوعيًا مع محلل أول لمراجعة عمله · <strong>70%</strong> إسناد لوحة معلومات حقيقية لقسم المبيعات يقدمها للإدارة. الدورة وحدها لن تصنع محللًا.</p></div>

<h2>تقييم التدريب — كيركباتريك</h2>
<div class="tbl"><table><thead><tr><th>المستوى</th><th>يقيس</th><th>الأداة</th><th>مثال</th></tr></thead><tbody>
<tr><td>1. Reaction</td><td>رضا المتدربين</td><td>استبيان بعد الدورة</td><td>«كانت مفيدة» 4.5/5</td></tr>
<tr><td>2. Learning</td><td>اكتساب المعرفة</td><td>اختبار قبلي/بعدي</td><td>الدرجة من 55% إلى 88%</td></tr>
<tr><td>3. Behavior</td><td>تغيّر السلوك في العمل</td><td>ملاحظة بعد 3–6 أشهر</td><td>المشرف بدأ فعلًا يستخدم نموذج التغذية الراجعة</td></tr>
<tr><td>4. Results</td><td>الأثر على الأعمال</td><td>KPIs</td><td>انخفاض شكاوى العملاء 22%</td></tr>
</tbody></table></div>
<p>ويضيف <strong>نموذج فيليبس</strong> مستوى خامسًا هو العائد على الاستثمار:</p>
<div class="formula">ROI% = [(عائد التدريب − تكلفة التدريب) ÷ تكلفة التدريب] × 100</div>
<div class="box ex"><span class="lbl">مثال محلول</span><p>تكلفة برنامج خدمة عملاء = 200,000. بعده انخفض معدل فقد العملاء بما يعادل إيرادًا محفوظًا 500,000. <code>ROI = (500000−200000)/200000 × 100 = 150%</code>. أي أن كل جنيه أنفقناه عاد بجنيه ونصف صافي ربح.</p></div>

<h2>أنظمة تحديد الأهداف</h2>
<div class="grid">
<div class="card"><h4>SMART</h4><p>محدد · قابل للقياس · قابل للتحقيق · ذو صلة · محدد بزمن</p></div>
<div class="card"><h4>MBO</h4><p>اتفاق بين المدير والموظف على أهداف قابلة للقياس</p></div>
<div class="card"><h4>OKR</h4><p>هدف طموح + 3–5 نتائج رئيسية رقمية</p></div>
<div class="card"><h4>KPI</h4><p>مؤشرات مستمرة تقيس صحة العملية</p></div>
<div class="card"><h4>BSC</h4><p>أربعة أبعاد: مالي · عملاء · عمليات · تعلم ونمو</p></div>
</div>
<div class="box ex"><span class="lbl">مثال: هدف ضعيف مقابل SMART</span>
<p><strong>ضعيف:</strong> «تحسين خدمة العملاء.»</p>
<p><strong>SMART:</strong> «خفض متوسط زمن الرد الأول على تذاكر الدعم من 8 ساعات إلى ساعتين بحلول 31 ديسمبر، مع الحفاظ على رضا لا يقل عن 4.3/5.»</p></div>
<div class="box def"><span class="lbl">KPI مقابل OKR</span><p><strong>KPI</strong> يقيس استمرارية صحة العملية (مثل: نسبة الحضور، هامش الربح). <strong>OKR</strong> يدفع نحو تغيير طموح لفترة محددة. الأول «مقياس حرارة»، والثاني «رحلة صعود».</p></div>

<h2>طرق التقييم</h2>
<div class="tbl"><table><thead><tr><th>الطريقة</th><th>الوصف</th></tr></thead><tbody>
<tr><td>Graphic Rating Scale</td><td>تقييم بمقياس 1–5 لعناصر محددة</td></tr>
<tr><td>Checklist</td><td>قائمة عبارات سلوكية</td></tr>
<tr><td>Ranking</td><td>ترتيب الموظفين من الأفضل للأسوأ</td></tr>
<tr><td>Forced Distribution</td><td>توزيع إجباري على منحنى (مثلًا 20/70/10)</td></tr>

<tr><td>BARS</td><td>مقياس مرتكز على أوصاف سلوكية لكل درجة</td></tr>

<h2>أخطاء المقيّمين</h2>
<div class="tbl"><table><thead><tr><th>الخطأ</th><th>الوصف</th><th>مثال</th></tr></thead><tbody>
<tr><td>Halo Effect</td><td>تعميم صفة إيجابية على كل الجوانب</td><td>«ملتزم بالمواعيد» ← يُقيَّم عاليًا في كل شيء</td></tr>
<tr><td>Horn Effect</td><td>تعميم سلبي</td><td>خطأ واحد كبير يُسقط تقييم عام كامل</td></tr>
<tr><td>Central Tendency</td><td>إعطاء الجميع تقييمًا متوسطًا</td><td>الكل «3 من 5» تجنبًا للمواجهة</td></tr>

<tr><td>Similarity Bias</td><td>تفضيل من يشبهني</td><td>تقييم أعلى لخريجي نفس الجامعة</td></tr>

</tbody></table></div>

<h2>خطة تحسين الأداء (PIP)</h2>
<ol>
<li>تحديد الفجوة بوضوح ومستندات.</li>
<li>أهداف محددة قابلة للقياس.</li>
<li>الدعم المطلوب (تدريب، توجيه، أدوات).</li>
<li>مدة محددة: 30 / 60 / 90 يومًا.</li>
<li>متابعة دورية موثقة.</li>
<li>قرار نهائي: تحسّن / نقل / إنهاء.</li>
</ol>
<div class="box tip"><span class="lbl">قاعدة</span><p>لا يجوز أن يكون تقييم الأداء السنوي هو أول مرة يسمع فيها الموظف بمشكلة أدائه. المفاجأة في التقييم دليل فشل إداري، لا فشل الموظف.</p></div>

html:`
<h2>الخطوات الخمس</h2>
<ol>
<li>تحليل الوضع الحالي: عدد، مهارات، أعمار، معدل دوران.</li>
<li>التنبؤ بالطلب المستقبلي وفق خطط التوسع.</li>

<li>خطة العمل: توظيف / تدريب / إعادة توزيع / تقليص.</li>
</ol>

<h2>أساليب التنبؤ</h2>
<div class="tbl"><table><thead><tr><th>الأسلوب</th><th>الفكرة</th><th>مثال</th></tr></thead><tbody>
<tr><td>تحليل الاتجاه</td><td>إسقاط النمط التاريخي على المستقبل</td><td>نمو الفريق 8% سنويًا آخر 5 سنوات</td></tr>
<tr><td>تحليل النسب</td><td>ربط العمالة بمتغير أعمال</td><td>مندوب لكل 1.5 مليون مبيعات</td></tr>
<tr><td>تحليل ماركوف</td><td>احتمالات الحركة بين الوظائف</td><td>20% من المشرفين يُرقّون سنويًا</td></tr>
<tr><td>أسلوب دلفي</td><td>جولات آراء خبراء حتى التقارب</td><td>تقدير احتياج مهارة جديدة لا سابقة لها</td></tr>

<h2>مفاهيم أساسية</h2>
<div class="grid">
<div class="card"><h4>Headcount Budget</h4><p>ميزانية عدد الموظفين المعتمدة لكل إدارة.</p></div>
<div class="card"><h4>FTE</h4><p>ما يعادل موظفًا بدوام كامل — نصف دوام = 0.5 FTE.</p></div>
<div class="card"><h4>Span of Control</h4><p>عدد المرؤوسين المباشرين لكل مدير.</p></div>
<div class="card"><h4>Org Chart</h4><p>الهيكل التنظيمي وخطوط التبعية.</p></div>
</div>
<div class="box ex"><span class="lbl">مثال على FTE</span><p>قسم فيه 6 موظفين بدوام كامل + 4 بنصف دوام + 1 بربع دوام.<br><code>FTE = 6 + (4 × 0.5) + 0.25 = 8.25</code><br>الفائدة: عند حساب تكلفة العمالة لكل وحدة إنتاج، «11 موظفًا» رقم مضلل بينما 8.25 FTE هو الرقم الصحيح.</p></div>
<div class="box tip"><span class="lbl">نصيحة</span><p>Span of Control الضيق جدًا (مدير لكل ثلاثة) يضخّم التكلفة ويبطئ القرار. الواسع جدًا (مدير لخمسين) يجعل الإشراف صوريًا. النطاق المناسب يعتمد على تعقيد العمل وتجانس المهام ونضج الفريق.</p></div>

<h2>مثال محلول: بناء خطة قوى عاملة</h2>
<div class="box ex"><span class="lbl">المعطيات</span>
<p>إدارة خدمة عملاء فيها 60 موظفًا. خطة العام: نمو حجم التذاكر 25%. الإنتاجية الحالية 40 تذكرة لكل موظف يوميًا. الدوران السنوي 20%. زمن التوظيف والتدريب 3 شهور.</p></div>
<div class="box ex"><span class="lbl">الحل خطوة بخطوة</span>
<p><strong>1. الطلب المستقبلي:</strong> نمو 25% بنفس الإنتاجية يعني احتياج <code>60 × 1.25 = 75</code> موظفًا.</p>
<p><strong>2. المعروض المتوقع:</strong> سنفقد <code>60 × 20% = 12</code> موظفًا خلال العام، فيتبقى 48.</p>
<p><strong>3. الفجوة:</strong> <code>75 − 48 = 27</code> تعيينًا.</p>
<p><strong>4. توقيت التنفيذ:</strong> بزمن تجهيز 3 شهور، يجب أن يبدأ التوظيف قبل الحاجة بربع سنة على الأقل، وموزعًا لا دفعة واحدة حتى لا ينهار التدريب.</p>
<p><strong>5. البدائل قبل التوظيف:</strong> لو رفعنا الإنتاجية من 40 إلى 46 تذكرة (بأتمتة أو قاعدة معرفة)، ينخفض الاحتياج إلى <code>75000÷46</code> ما يعادل نحو 65 موظفًا — أي 17 تعيينًا بدل 27. <strong>هذا هو السؤال الذي يجب أن يسبق أي طلب توظيف.</strong></p></div>

SECTIONS.push({id:"talent",track:T.C,title:"إدارة المواهب والتعاقب",lede:"تحديد الوظائف الحرجة وأصحاب الإمكانات العالية، وضمان استمرارية القيادة.",
html:`
<h2>المكونات</h2>
<div class="grid">
<div class="card"><h4>الوظائف الحرجة</h4><p>الأدوار التي يُحدث فيها فرق الأداء أثرًا استراتيجيًا كبيرًا، ويصعب إحلالها.</p></div>
<div class="card"><h4>HiPo</h4><p>ذوو الإمكانات العالية: أداء قوي + قدرة على تحمل دور أكبر + طموح واستعداد.</p></div>

</div>

<h2>مصفوفة 9-Box</h2>
<div class="tbl"><table><thead><tr><th></th><th>إمكانات منخفضة</th><th>إمكانات متوسطة</th><th>إمكانات عالية</th></tr></thead><tbody>
<tr><th>أداء عالٍ</th><td>خبير موثوق</td><td>نجم صاعد</td><td><strong>نجم / خليفة جاهز</strong></td></tr>
<tr><th>أداء متوسط</th><td>أداء ثابت</td><td>لاعب أساسي</td><td>ماسة غير مصقولة</td></tr>
<tr><th>أداء منخفض</th><td><strong>خطر / خروج</strong></td><td>يحتاج تحسين</td><td>لغز — يحتاج تشخيصًا</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال على «اللغز»</span><p>موظف واضح الذكاء وسريع التعلم لكن نتائجه ضعيفة. قبل الحكم عليه اسأل: هل هو في الدور الخطأ؟ هل مديره يعطّله؟ هل فقد الدافع؟ خانة «اللغز» ليست حكمًا بل <strong>دعوة للتشخيص</strong> — وكثير من أفضل الموظفين مرّوا بها قبل نقلهم لدور مناسب.</p></div>

<h2>مستويات جاهزية الخليفة</h2>
<div class="tbl"><table><thead><tr><th>المستوى</th><th>المعنى</th><th>الإجراء</th></tr></thead><tbody>
<tr><td>جاهز الآن</td><td>يستطيع تولي الدور فورًا</td><td>احتفظ به وحصّنه من المنافسين</td></tr>
<tr><td>جاهز خلال 1–2 سنة</td><td>يحتاج خبرة إضافية</td><td>مهام تحدٍّ + توجيه</td></tr>
<tr><td>جاهز خلال 3–5 سنوات</td><td>إمكانات واعدة بعيدة</td><td>مسار تطوير طويل</td></tr>
<tr><td>لا يوجد خليفة</td><td>خطر استمرارية حقيقي</td><td>توظيف خارجي أو إعادة تصميم الدور</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">خطأ شائع</span><p>الخلط بين <strong>الأداء</strong> و<strong>الإمكانات</strong>. أفضل مندوب مبيعات ليس بالضرورة أفضل مدير مبيعات — الأول ينجح بمهارة فردية، والثاني يحتاج قدرة على تطوير الآخرين. ترقية الأداء العالي تلقائيًا هي أشهر طرق خسارة بائع ممتاز واكتساب مدير سيئ.</p></div>

<h2>كيف تُحدد الوظائف الحرجة؟</h2>
<div class="tbl"><table><thead><tr><th>المعيار</th><th>السؤال</th></tr></thead><tbody>
<tr><td>أثر الأداء</td><td>ما الفرق بين أداء متوسط وأداء متميز في هذا الدور؟</td></tr>
<tr><td>الندرة</td><td>كم يستغرق إيجاد بديل مؤهل في السوق؟</td></tr>
<tr><td>الارتباط بالاستراتيجية</td><td>هل يعطّل غيابه خطة رئيسية؟</td></tr>
<tr><td>المعرفة الحصرية</td><td>هل يملك معرفة أو علاقات لا يشاركه فيها أحد؟</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">مفاجأة متكررة</span><p>الوظيفة الحرجة ليست بالضرورة الأعلى في الهيكل. في كثير من المنشآت يكون الفني الوحيد الذي يجيد صيانة خط إنتاج بعينه، أو المحاسب الذي يعرف تاريخ ملفات الضرائب، أكثر <strong>حرجًا</strong> من مدير إدارة كامل له ثلاثة بدلاء جاهزين.</p></div>

<h2>معايير تحديد صاحب الإمكانات العالية</h2>
<div class="ascii">الأداء الحالي القوي     (يؤدي دوره بامتياز الآن)
        +
القدرة على التعلّم      (يتكيف بسرعة مع الجديد)
        +
الطموح والاستعداد       (يريد المسؤولية الأكبر ويستعد لها)
        =
        HiPo
غياب أي عنصر يغيّر التصنيف والخطة تمامًا</div>
<div class="box ex"><span class="lbl">ثلاث حالات</span>
<p><strong>قادر ولا يريد:</strong> لا تجبره — قد يكون خبيرًا ممتازًا في مساره الفني. اعرض مسارًا فنيًا موازيًا للمسار الإداري.</p>
<p><strong>يريد ولا يقدر بعد:</strong> فجوة قابلة للسد ببرنامج تطوير — قل له ذلك بصراحة مع مدة زمنية.</p>
<p><strong>يريد ويقدر لكن أداءه الحالي ضعيف:</strong> افحص الدور والمدير قبل الحكم — قد يكون في المكان الخطأ.</p></div>

<div class="tbl"><table><thead><tr><th>الدور الحرج</th><th>شاغله</th><th>خطر الفقد</th><th>خليفة جاهز الآن</th><th>خليفة خلال سنتين</th><th>الإجراء</th></tr></thead><tbody>

<tr><td>مدير المالية</td><td>—</td><td>متوسط</td><td>واحد</td><td>واحد</td><td>تثبيت الجاهز وحمايته من المنافسين</td></tr>
</tbody></table></div>
<p class="hint">هذه المصفوفة هي المخرَج العملي الوحيد الذي يهم مجلس الإدارة من كل نشاط إدارة المواهب.</p>

<div class="box warn"><span class="lbl">تجنّبها</span>

<div class="tbl"><table><thead><tr><th>المؤشر</th><th>ما يكشفه</th></tr></thead><tbody>

SECTIONS.push({id:"er",track:T.D,title:"علاقات الموظفين",lede:"الشكاوى والتحقيقات والتأديب والعلاقات النقابية: كيف تحمي المؤسسة والموظف معًا.",
html:`
<h2>المهام</h2>
<div class="chips"><span class="chip">الشكاوى والتظلمات</span><span class="chip">التحقيقات الداخلية</span><span class="chip">الإجراءات التأديبية</span><span class="chip">الوساطة في النزاعات</span><span class="chip">المفاوضة الجماعية</span><span class="chip">التعامل مع الإضرابات</span><span class="chip">سياسات مكافحة التحرش والتمييز</span><span class="chip">قنوات الإبلاغ</span></div>

<h2>التدرج التأديبي</h2>
<div class="ascii">تنبيه شفهي  ->  إنذار كتابي أول  ->  إنذار كتابي نهائي
   ->  خصم / وقف عن العمل  ->  إنهاء الخدمة</div>
<p>على أن يكون كل ذلك متسقًا مع <strong>لائحة الجزاءات المعتمدة</strong> ومع القانون.</p>

<h2>قواعد التحقيق العادل</h2>
<ol>
<li>إخطار الموظف بالمخالفة كتابةً وبوضوح.</li>
<li>منحه فرصة حقيقية للدفاع عن نفسه.</li>
<li>توثيق كل خطوة بالتوقيع والتاريخ.</li>
<li>التناسب بين المخالفة والعقوبة.</li>
<li>عدم التمييز: نفس المعاملة لنفس المخالفة.</li>
<li>الالتزام بالمواعيد القانونية لتوقيع الجزاء.</li>
</ol>
<div class="box ex"><span class="lbl">مثال على خطأ إجرائي مكلف</span><p>موظف تكرر تأخره فقررت الشركة فصله مباشرة دون سابق إنذارات موثقة ودون تحقيق. حتى لو كانت الواقعة صحيحة، فالإجراء الباطل قد يحوّل القضية لصالح الموظف. <strong>القاعدة:</strong> صحة الواقعة لا تكفي — سلامة الإجراء شرط موازٍ.</p></div>

<div class="box def"><span class="lbl">Grievance مقابل Discipline</span><p><strong>التظلم (Grievance):</strong> شكوى من الموظف تجاه الشركة أو زميل أو مدير. <strong>التأديب (Discipline):</strong> إجراء من الشركة تجاه الموظف. الاثنان يحتاجان نفس المبادئ: التوثيق، العدالة، التناسب، والسرية.</p></div>

<div class="box tip"><span class="lbl">مبدأ الحياد</span><p>محقق علاقات الموظفين ليس محاميًا للشركة ولا للموظف. دوره إثبات الوقائع. أي انحياز مبكر يفسد التحقيق ويهدم ثقة الطرفين في المنظومة كلها.</p></div>

<h2>هرم تصعيد الشكوى</h2>
<div class="ascii">1. حل مباشر بين الطرفين            (الأسرع والأقل ضررًا)
2. تدخل المدير المباشر
3. وساطة الموارد البشرية
4. تحقيق رسمي موثق
5. لجنة تظلمات أو تصعيد للإدارة العليا
6. الجهات الرسمية أو القضاء            (الأبطأ والأعلى تكلفة)</div>
<p>مهمة HR أن تُحل معظم الحالات في المستويات الثلاثة الأولى. ارتفاع نسبة ما يصل للمستوى الخامس مؤشر على أن القنوات الأدنى لا تعمل.</p>

<h2>نماذج إدارة التغيير</h2>
<div class="grid">
<div class="card"><h4>Lewin</h4><p>إذابة (Unfreeze) ← تغيير (Change) ← تجميد (Refreeze)</p></div>
<div class="card"><h4>Kotter — 8 خطوات</h4><p>الإلحاح ← ائتلاف قيادي ← رؤية ← توصيلها ← إزالة العقبات ← مكاسب سريعة ← البناء عليها ← الترسيخ</p></div>
<div class="card"><h4>ADKAR</h4><p>وعي ← رغبة ← معرفة ← قدرة ← تعزيز — نموذج فردي المستوى</p></div>
<div class="card"><h4>McKinsey 7S</h4><p>Strategy · Structure · Systems · Shared Values · Style · Staff · Skills</p></div>
</div>
<div class="box def"><span class="lbl">لماذا ADKAR مختلف؟</span><p>معظم النماذج تنظر للتغيير على مستوى <strong>المنظمة</strong>، أما ADKAR فينظر إليه على مستوى <strong>الفرد</strong>: المنظمة لا تتغير إلا إذا تغيّر أفرادها واحدًا واحدًا. لذلك يشخّص أين تحديدًا يتعثر الشخص: هل لا يعرف؟ أم لا يريد؟ أم لا يستطيع؟</p></div>
<div class="box ex"><span class="lbl">مثال تشخيصي بـ ADKAR</span><p>تطبيق نظام HR جديد وفريق يقاومه. لو المشكلة في <strong>A</strong> (لا يعرفون لماذا) فالحل تواصل. لو في <strong>D</strong> (يخافون على وظائفهم) فالحل طمأنة وحوار. لو في <strong>K</strong> فالحل تدريب. لو في <strong>Ab</strong> فالحل ممارسة ودعم. لو في <strong>R</strong> فالحل ربط بالتقييم والتقدير. إرسال تدريب لمن مشكلته الخوف = إهدار.</p></div>

<h2>الجدارات (Competency Framework)</h2>
<p>مجموعة السلوكيات والمهارات المطلوبة، موصوفة بمستويات إتقان، وتُستخدم في التوظيف والتقييم والتدريب والترقية معًا — فتصنع لغة مشتركة عبر أنظمة HR كلها.</p>
<div class="box warn"><span class="lbl">تحذير</span><p>مصفوفة جدارات من 60 جدارة لا يستخدمها أحد. الأفضل 8–12 جدارة أساسية واضحة السلوك، يستطيع أي مدير تطبيقها دون تدريب طويل.</p></div>

<h2>كيف تقيس نجاح التغيير والتطوير التنظيمي</h2>

html:`
<h2>المهام</h2>
<ul>
<li>تقييم المخاطر (Risk Assessment) وتحديثه دوريًا.</li>
<li>توفير مهمات الوقاية الشخصية (PPE) والتأكد من استخدامها.</li>

<li>التحقيق في الحوادث وإصابات العمل.</li>
<li>الفحوصات الطبية الدورية.</li>
<li>برامج الصحة النفسية والرفاهية.</li>
<li>الالتزام بمعايير مثل ISO 45001.</li>

<h2>هرم السلامة</h2>
<div class="ascii">                إصابة مميتة
              إصابات مُعطِّلة
           إصابات طفيفة
        حوادث دون إصابة
   حوادث وشيكة (Near Miss)
تصرفات وظروف غير آمنة</div>
<div class="box def"><span class="lbl">الفكرة</span><p>الحوادث الكبرى ليست أحداثًا عشوائية — بل قمة هرم قاعدته آلاف التصرفات غير الآمنة. لذلك <strong>الإبلاغ عن الحوادث الوشيكة (Near Miss)</strong> هو أهم مؤشر استباقي: ارتفاع بلاغات Near Miss علامة صحية تدل على ثقافة إبلاغ ناضجة، لا على تدهور السلامة.</p></div>

<h2>ترتيب ضوابط المخاطر (Hierarchy of Controls)</h2>
<div class="ascii">1. الإزالة    (Elimination)      -- الأقوى
2. الإحلال    (Substitution)
3. ضوابط هندسية (Engineering)
4. ضوابط إدارية (Administrative)
5. مهمات الوقاية الشخصية (PPE) -- الأضعف</div>
<div class="box ex"><span class="lbl">مثال</span><p>خطر استنشاق مذيب كيميائي: <strong>الإزالة</strong> = إلغاء الخطوة تمامًا · <strong>الإحلال</strong> = استخدام مذيب مائي · <strong>هندسي</strong> = شفاط موضعي · <strong>إداري</strong> = تقليل مدة التعرض بالتناوب · <strong>PPE</strong> = كمامة. الاعتماد على الكمامة وحدها هو الحل الأضعف رغم أنه الأرخص والأشيع.</p></div>

<div class="chips"><span class="chip">Incident Rate</span><span class="chip">LTIFR</span><span class="chip">Near Miss Reports</span><span class="chip">أيام العمل الضائعة</span><span class="chip">نسبة إتمام تدريب السلامة</span></div>

<h2>دورة إدارة السلامة</h2>
<div class="ascii">تحديد الخطر  ->  تقييم المخاطرة  ->  اختيار الضابط
     ^                                        |
     |                                        v
التحسين والمراجعة  <-  قياس الأداء  <-  التطبيق والتدريب</div>

<h2>تقييم المخاطرة عمليًا</h2>
<div class="formula">درجة المخاطرة = الاحتمال × شدة الأثر</div>
<div class="tbl"><table><thead><tr><th>الدرجة</th><th>المعنى</th><th>الإجراء المطلوب</th></tr></thead><tbody>
<tr><td>مرتفعة</td><td>احتمال عالٍ وأثر جسيم</td><td>إيقاف النشاط حتى تُطبَّق ضوابط فعّالة</td></tr>
<tr><td>متوسطة</td><td>أحد العاملين مرتفع</td><td>ضوابط بجدول زمني محدد ومسؤول</td></tr>
<tr><td>منخفضة</td><td>احتمال وأثر محدودان</td><td>مراقبة دورية وتوثيق</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال</span><p>عامل ينقل مواد ثقيلة يدويًا: الاحتمال مرتفع (يوميًا) والأثر متوسط (إصابات ظهر). الضابط الأقوى ليس حزام الظهر (وقاية شخصية) بل <strong>عربة نقل أو رافعة</strong> (ضابط هندسي) — أو إعادة تصميم مسار العمل ليقلل المسافة أصلًا (إزالة).</p></div>

<h2>التحقيق في الحوادث — لماذا وليس مَن</h2>
<p>التحقيق الذي يبحث عن <strong>مذنب</strong> يُنتج إخفاءً للحوادث. التحقيق الذي يبحث عن <strong>سبب نظامي</strong> يُنتج تحسينًا. استخدم أسلوب «لماذا الخمسة»:</p>
<div class="ascii">انزلق العامل  ->  لماذا؟  الأرضية مبللة

                  لماذا؟  البلاغ لم يصل للصيانة
                  لماذا؟  لا توجد آلية بلاغ واضحة  <-- السبب الجذري</div>
<div class="box warn"><span class="lbl">ثقافة السلامة</span><p>معاقبة المبلّغ عن حادث وشيك تعني أنك اشتريت صمتًا لا سلامة. المنشآت الأفضل أداءً في السلامة هي التي ترتفع فيها بلاغات الحوادث الوشيكة وتنخفض فيها الإصابات الفعلية — وهذا ليس تناقضًا بل علاقة سببية.</p></div>

<p>من أبرز ملامحه: الاعتراف الرسمي لأول مرة بأنماط العمل الحديثة ومنحها الحماية القانونية ذاتها، واعتبار العقد غير محدد المدة هو الأصل ما لم يُنص صراحة على غير ذلك، وتنظيم العمل الجزئي والعمل المرن والعمل عن بُعد، وإرساء مبادئ تكافؤ الفرص ومنع التمييز، وسدّ ثغرات الفصل غير المبرر مع تبسيط إجراءات التقاضي العمالي.</p>
<p>ويرتبط عمل HR في مصر كذلك بـ <strong>قانون التأمينات الاجتماعية والمعاشات رقم 148 لسنة 2019</strong> وبقانون الضريبة على الدخل فيما يخص ضريبة كسب العمل.</p>
<div class="box tip"><span class="lbl">قاعدة عملية</span><p>لأن التشريعات تتغير، تحقق دائمًا من آخر تحديث عبر الجريدة الرسمية أو الجهة المختصة قبل تطبيق أي إجراء — خصوصًا في الحدين الأدنى والأقصى لأجر الاشتراك التأميني وشرائح الضريبة، فهي تُحدَّث دوريًا.</p></div>

SECTIONS.push({id:"culture",track:T.D,title:"الثقافة والاندماج الوظيفي",lede:"Engagement و EX و EVP و eNPS: كيف تُقاس علاقة الموظف بالعمل وكيف تُحسَّن.",
html:`
<h2>المفاهيم</h2>
<div class="grid">
<div class="card"><h4>Employee Engagement</h4><p>درجة الارتباط العاطفي والذهني بالعمل — ليس الرضا، بل الاستعداد لبذل جهد إضافي.</p></div>
<div class="card"><h4>Employee Experience (EX)</h4><p>مجمل تجربة الموظف من أول تفاعل حتى ما بعد الخروج.</p></div>
<div class="card"><h4>Employer Branding</h4><p>صورة الشركة كجهة عمل في أذهان السوق.</p></div>
<div class="card"><h4>EVP</h4><p>عرض القيمة: ما الذي تقدمه الشركة مقابل جهد الموظف؟</p></div>
<div class="card"><h4>DEI</h4><p>التنوع والإنصاف والشمول.</p></div>
<div class="card"><h4>Wellbeing</h4><p>الرفاهية الجسدية والنفسية والمالية.</p></div>
</div>
<div class="box def"><span class="lbl">فرق دقيق</span><p><strong>الرضا (Satisfaction)</strong> شعور سلبي بالارتياح — قد يرضى موظف عن وظيفة مريحة لا يبذل فيها شيئًا. <strong>الاندماج (Engagement)</strong> حالة نشطة تدفع لبذل جهد تقديري إضافي. لذلك «موظف راضٍ» ليس بالضرورة «موظف منتج».</p></div>

<h2>أدوات القياس</h2>
<div class="tbl"><table><thead><tr><th>الأداة</th><th>التوقيت</th><th>الفائدة</th></tr></thead><tbody>
<tr><td>Engagement Survey</td><td>سنوي</td><td>صورة شاملة وقابلة للمقارنة</td></tr>
<tr><td>Pulse Survey</td><td>شهري/ربعي</td><td>رصد سريع للتغيرات</td></tr>
<tr><td>eNPS</td><td>دوري</td><td>مؤشر مختصر وسهل التتبع</td></tr>
<tr><td>Stay Interview</td><td>قبل التفكير في الرحيل</td><td>وقائي — يمنع الاستقالة قبل حدوثها</td></tr>

</tbody></table></div>
<div class="formula">eNPS = % المروجين (9–10) − % المنتقدين (0–6)</div>
<div class="box ex"><span class="lbl">مثال محلول</span><p>استُطلع 200 موظف: 90 أعطوا 9–10، و60 أعطوا 7–8، و50 أعطوا 0–6.<br>المروجون = 45% · المحايدون = 30% · المنتقدون = 25%<br><code>eNPS = 45 − 25 = +20</code><br>لاحظ أن المحايدين لا يدخلون الحساب مطلقًا.</p></div>

<div class="box warn"><span class="lbl">أخطر خطأ في الاستبيانات</span><p>إجراء استبيان ثم عدم فعل شيء بنتائجه. الاستبيان بلا إجراء لا يقيس الاندماج فحسب — بل <strong>يخفضه</strong>، لأنه يثبت للموظف أن صوته لا يُسمع. لا تسأل إن كنت لن تتصرف.</p></div>

<h2>من النتيجة إلى الإجراء</h2>
<div class="ascii">استبيان  ->  تحليل حسب الإدارة لا الشركة ككل

/* ========== 18. تحليلات HR والأنظمة ========== */
SECTIONS.push({id:"analytics",track:T.E,title:"تحليلات الموارد البشرية والأنظمة",lede:"من «أشعر أن» إلى «البيانات تُظهر أن»: مستويات التحليل، الأنظمة، وأخلاقيات البيانات.",
html:`
<h2>مستويات النضج التحليلي</h2>
<div class="tbl"><table><thead><tr><th>المستوى</th><th>السؤال</th><th>مثال</th></tr></thead><tbody>
<tr><td>وصفي (Descriptive)</td><td>ماذا حدث؟</td><td>معدل الدوران كان 18%</td></tr>
<tr><td>تشخيصي (Diagnostic)</td><td>لماذا حدث؟</td><td>60% من التاركين من قسم واحد وبسبب الأجر</td></tr>
<tr><td>تنبؤي (Predictive)</td><td>ماذا سيحدث؟</td><td>12 موظفًا معرضون لخطر الاستقالة خلال 6 أشهر</td></tr>
<tr><td>إرشادي (Prescriptive)</td><td>ماذا نفعل؟</td><td>تعديل هيكل أجور القسم يقلل الدوران 5%</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">القاعدة الأولى</span><p>ابدأ من <strong>سؤال العمل</strong> لا من البيانات. الخطأ الأشيع جمع بيانات ضخمة ثم البحث عن استخدام لها. الصحيح: «لماذا يترك مندوبو المبيعات خلال أول 9 أشهر؟» ثم اجمع ما يجيب هذا السؤال فقط.</p></div>

<div class="box warn"><span class="lbl">الارتباط ليس سببية</span><p>وجدت أن الحاصلين على تدريب معين أداؤهم أعلى. هل التدريب هو السبب؟ ربما لا — ربما الشركة أصلًا ترشّح <em>أفضل</em> الموظفين لهذا التدريب. ابحث دائمًا عن المتغير الخفي قبل إعلان النتيجة.</p></div>

<h2>حالات استخدام عالية العائد</h2>
<div class="chips"><span class="chip">التنبؤ بمخاطر الاستقالة</span><span class="chip">تحليل فجوة الأجور</span><span class="chip">فعالية مصادر التوظيف</span><span class="chip">تحليل أسباب الغياب</span><span class="chip">أثر التدريب على مؤشرات التشغيل</span><span class="chip">تحليل شبكات التعاون</span></div>

<h2>الأنظمة والأدوات</h2>
<div class="tbl"><table><thead><tr><th>الفئة</th><th>أمثلة</th></tr></thead><tbody>
<tr><td>HRIS / HCM شامل</td><td>SAP SuccessFactors · Workday · Oracle HCM · Odoo HR · Zoho People · BambooHR · Personio · HiBob · أنظمة السوق العربي</td></tr>
<tr><td>ATS (توظيف)</td><td>Greenhouse · Lever · Workable · SmartRecruiters · Zoho Recruit · Manatal</td></tr>
<tr><td>LMS (تعلّم)</td><td>Moodle · TalentLMS · Docebo · Cornerstone · 360Learning</td></tr>
<tr><td>استبيانات واندماج</td><td>Culture Amp · Qualtrics EX · Officevibe · Google Forms</td></tr>
<tr><td>تحليلات وتقارير</td><td>Excel · Power BI · Tableau · Looker Studio</td></tr>
<tr><td>أدوات مساندة</td><td>Slack/Teams · Asana/Jira · DocuSign · Calendly</td></tr>
</tbody></table></div>

<div class="box def"><span class="lbl">أخلاقيات البيانات</span><p>ثلاث قواعد: <strong>الشفافية</strong> بشأن ما يُجمع ولماذا · <strong>الحد الأدنى</strong> من البيانات · <strong>تجنّب التحيّز</strong> بألا يعيد النموذج إنتاج تمييز تاريخي موجود في البيانات. نموذج يتعلم من قرارات توظيف متحيزة سابقة سيصبح متحيزًا بكفاءة أعلى.</p></div>

<div class="box ex"><span class="lbl">مثال على «الرواية بالبيانات»</span>
<p><strong>عرض ضعيف:</strong> 30 شريحة فيها كل الجداول والمتغيرات والانحرافات المعيارية.</p>
<p><strong>عرض قوي:</strong> رسم واحد يُظهر أن دوران قسم الدعم ثلاثة أضعاف بقية الأقسام، وجملة واحدة: «السبب الأول في مقابلات الخروج هو غياب مسار وظيفي»، وتوصية واحدة: «إنشاء مستويين وظيفيين داخل الدعم بتكلفة X وعائد متوقع Y». التحليل الذي لا يفهمه المدير التنفيذي = تحليل بلا قيمة.</p></div>
`,
quiz:[
{q:"«12 موظفًا معرضون لخطر الاستقالة خلال 6 أشهر» ينتمي لمستوى:",opts:["الوصفي","التشخيصي","التنبؤي","الإرشادي"],a:2,why:"التنبؤي يقدّر ما سيحدث مستقبلًا بناءً على أنماط سابقة، بينما الإرشادي يوصي بالإجراء المناسب."},
{q:"وجدنا أن من حضروا دورة القيادة أداؤهم أعلى. أدق تفسير حذر هو:",opts:["الدورة سبب مباشر مؤكد","قد يكون السبب أن الشركة ترشّح الأفضل أصلًا للدورة (متغير خفي)","الأداء لا علاقة له بالتدريب","النتيجة خاطئة"],a:1,why:"هذا انحياز الاختيار (Selection Bias): الارتباط قائم لكن السببية غير مثبتة دون تصميم مقارنة عادل."},
{q:"القاعدة الأولى في بناء تحليلات HR:",opts:["شراء أغلى نظام","البدء من سؤال العمل ثم جمع ما يجيبه","جمع أكبر قدر من البيانات أولًا","توظيف عالم بيانات"],a:1,why:"البيانات بلا سؤال تنتج تقارير لا يقرأها أحد؛ السؤال هو ما يحدد ما نجمعه وكيف نقيسه."},
{q:"خطر رئيسي في نماذج التنبؤ داخل HR:",opts:["بطء الحساب","إعادة إنتاج تحيّز تاريخي موجود في البيانات بكفاءة أعلى","ارتفاع سعر الخوادم","صعوبة التصدير"],a:1,why:"النموذج يتعلم من الماضي؛ لو كان الماضي متحيزًا صار التحيز مؤتمتًا ومغلفًا بمظهر موضوعي."},
{q:"ATS يختلف عن HRIS بأنه:",opts:["يحسب الرواتب","متخصص في إدارة مسار التوظيف وتتبع المتقدمين","يدير التدريب","يخزن العقود فقط"],a:1,why:"HRIS نظام شامل لبيانات الموظفين الحاليين، أما ATS فيخدم مرحلة ما قبل التعيين تحديدًا."},
{q:"LMS يُستخدم أساسًا في:",opts:["إدارة التعلم والمحتوى التدريبي وتتبع الإنجاز","حساب الضرائب","تقييم الوظائف","إدارة الأصول"],a:0,why:"Learning Management System يستضيف المحتوى ويسجل الحضور والإنجاز ونتائج الاختبارات."},
{q:"أفضل وصف لمهارة «الرواية بالبيانات»:",opts:["عرض كل الأرقام المتاحة","تحويل التحليل إلى رسم واضح واستنتاج واحد وتوصية قابلة للتنفيذ","استخدام ألوان كثيرة","تصدير ملف Excel"],a:1,why:"قيمة التحليل تتحقق فقط إذا غيّر قرارًا، وذلك يتطلب تبسيطًا لا استعراضًا."},
{q:"مبدأ «الحد الأدنى من البيانات» في أخلاقيات HR يعني:",opts:["حذف السجلات سنويًا","جمع ما يلزم للغرض المحدد فقط","تخزين البيانات محليًا","إخفاء البيانات عن الموظف"],a:1,why:"كل بيان زائد مسؤولية أمنية وقانونية إضافية بلا عائد يبررها."}
]});

/* ========== 19. المؤشرات والمعادلات ========== */
SECTIONS.push({id:"metrics",track:T.E,title:"المؤشرات والمعادلات",lede:"كل معادلة تحتاجها في HR مع مثال محلول: الدوران، التوظيف، الإنتاجية، التدريب، الاندماج.",
html:`
<h2>مؤشرات الاستبقاء والدوران</h2>
<div class="formula">معدل الدوران % = (عدد التاركين ÷ متوسط عدد الموظفين) × 100</div>
<div class="formula">متوسط عدد الموظفين = (عدد بداية الفترة + عدد نهايتها) ÷ 2</div>
<div class="formula">معدل الاستبقاء % = (عدد الباقين طوال الفترة ÷ العدد في بدايتها) × 100</div>
<div class="box ex"><span class="lbl">مثال محلول</span><p>بداية العام 180 موظفًا، نهايته 220، وترك العمل 40.<br><code>المتوسط = (180+220)/2 = 200</code><br><code>الدوران = 40/200 × 100 = 20%</code></p></div>
<div class="box def"><span class="lbl">تفرقة مهمة</span><p><strong>الدوران الاختياري</strong> (استقالة) يقيس جاذبية الشركة. <strong>غير الاختياري</strong> (إنهاء من الشركة) يقيس جودة الاختيار وإدارة الأداء. و<strong>Regretted Attrition</strong> يقيس أخطرها: رحيل من كنّا نتمنى بقاءه.</p></div>

<h2>مؤشرات التوظيف</h2>
<div class="formula">تكلفة التعيين = (التكاليف الداخلية + الخارجية) ÷ عدد التعيينات</div>
<div class="formula">نسبة قبول العروض % = (العروض المقبولة ÷ العروض المقدمة) × 100</div>
<div class="formula">نسبة الاختيار = عدد المعيّنين ÷ عدد المتقدمين</div>

<h2>مؤشرات الإنتاجية والتكلفة</h2>
<div class="formula">الإيراد لكل موظف = إجمالي الإيرادات ÷ عدد الموظفين</div>
<div class="formula">نسبة تكلفة العمالة % = (إجمالي تكلفة العمالة ÷ إجمالي المصروفات) × 100</div>
<div class="formula">نسبة HR للموظفين = عدد موظفي HR ÷ إجمالي الموظفين (مرجعي 1 : 100)</div>
<div class="formula">معدل الغياب % = (أيام الغياب ÷ أيام العمل المتاحة) × 100</div>
<div class="box ex"><span class="lbl">مثال محلول</span><p>شركة 50 موظفًا، أيام العمل الشهرية 22، وإجمالي أيام الغياب 55 يومًا.<br><code>الأيام المتاحة = 50 × 22 = 1100</code><br><code>معدل الغياب = 55/1100 × 100 = 5%</code></p></div>

<h2>مؤشرات التدريب</h2>
<div class="formula">ساعات التدريب لكل موظف = إجمالي ساعات التدريب ÷ عدد الموظفين</div>
<div class="formula">ROI التدريب % = [(العائد − التكلفة) ÷ التكلفة] × 100</div>

<h2>مؤشرات الأداء والحركة</h2>
<div class="formula">معدل الحركة الداخلية % = (الترقيات + النقل الداخلي) ÷ إجمالي الموظفين × 100</div>
<div class="formula">تغطية التعاقب % = (الوظائف الحرجة التي لها خليفة ÷ إجمالي الوظائف الحرجة) × 100</div>
<div class="formula">Compa-Ratio = راتب الموظف ÷ النقطة الوسطى لدرجته</div>
<div class="formula">eNPS = % المروجين − % المنتقدين</div>

<div class="box warn"><span class="lbl">تحذير في قراءة المؤشرات</span><p>لا يوجد رقم «جيد» مطلق. دوران 20% كارثة في شركة استشارات، وطبيعي تمامًا في مطعم. قارن دائمًا بـ: <strong>تاريخك أنت</strong> · <strong>قطاعك</strong> · <strong>هدفك المعلن</strong>. والأهم: افصل الدوران المؤسف عن غير المؤسف — فقد يكون انخفاض الدوران علامة سيئة إن كان الباقون هم الأضعف.</p></div>
`,
quiz:[
{q:"بداية العام 300 موظف، نهايته 340، وترك 64. معدل الدوران:",opts:["18%","20%","21.3%","32%"],a:1,why:"المتوسط = (300+340)/2 = 320، والدوران = 64/320 × 100 = 20%."},
{q:"شركة 80 موظفًا، أيام العمل 20، وأيام الغياب 96. معدل الغياب:",opts:["4%","5%","6%","8%"],a:2,why:"الأيام المتاحة = 80 × 20 = 1600، والمعدل = 96/1600 × 100 = 6%."},
{q:"«Regretted Attrition» يقيس:",opts:["كل من ترك العمل","من تركوا العمل وكنّا نتمنى بقاءهم","من تم إنهاء خدمتهم","المتقاعدين"],a:1,why:"هو المؤشر الذي يفصل الخسارة الحقيقية عن الدوران الصحي، لأن رحيل ضعيف الأداء ليس خسارة."},
{q:"انخفاض معدل الدوران قد يكون علامة سلبية إذا:",opts:["كان أقل من متوسط القطاع","كان الباقون هم الأضعف بينما يرحل المتميزون","تزامن مع زيادة الأرباح","حدث في قسم واحد"],a:1,why:"الجمود قد يعني ركودًا وعجزًا عن ضخ دماء جديدة، أو أن السوق لا يطلب موظفينا — وكلاهما مقلق."},
{q:"20 عرض عمل قُدّم و13 قُبل. نسبة قبول العروض:",opts:["50%","65%","70%","35%"],a:1,why:"13 ÷ 20 × 100 = 65%."},
{q:"نسبة HR للموظفين 1:100 تعني:",opts:["موظف HR لكل 100 موظف","100 موظف HR لكل موظف","نسبة الرواتب","معدل الترقية"],a:0,why:"هي نسبة مرجعية تقريبية تختلف حسب حجم الشركة ودرجة الأتمتة وطبيعة القطاع."},
{q:"تكلفة التعيين تشمل:",opts:["رواتب المعيّنين","التكاليف الداخلية (وقت الفريق والأنظمة) والخارجية (إعلانات ووكالات) مقسومة على عدد التعيينات","تكلفة التدريب فقط","تكلفة المكاتب"],a:1,why:"إغفال التكلفة الداخلية يجعل الرقم مضللًا ويخفي الهدر في وقت المديرين والمقابلات الزائدة."},
{q:"لماذا لا يوجد رقم «مثالي» لمعدل الدوران؟",opts:["لأنه لا يُحسب","لأنه يعتمد على القطاع وطبيعة العمل وتاريخ الشركة نفسها","لأنه سري","لأنه يتغير يوميًا"],a:1,why:"المقارنة الصحيحة تكون بتاريخك وبمعيار قطاعك، لا برقم مطلق منقول من سياق مختلف."},
{q:"برنامج تكلفته 60,000 وعائده 90,000. الـ ROI:",opts:["150%","50%","30%","90%"],a:1,why:"(90000 − 60000) ÷ 60000 × 100 = 50%."},
{q:"تغطية التعاقب 40% تعني:",opts:["40% من الموظفين مرقّون","40% فقط من الوظائف الحرجة لها خليفة محدد","40% من الرواتب مغطاة","معدل دوران 40%"],a:1,why:"يعني أن 60% من الأدوار الحرجة مكشوفة بلا خليفة — وهي مخاطرة استمرارية كبيرة."},
{q:"الإيراد لكل موظف مؤشر مفيد بشرط:",opts:["استخدامه منفردًا","مقارنته بشركات مماثلة في نفس القطاع ونموذج العمل","حسابه يوميًا","إخفاؤه عن الإدارة"],a:1,why:"المقارنة عبر قطاعات مختلفة بلا معنى: شركة برمجيات وشركة مقاولات لهما هيكل عمالة وإيراد مختلفان جذريًا."},
{q:"موظف راتبه 22,000 ووسط درجته 20,000. الـ Compa-Ratio:",opts:["0.91","1.10","1.00","1.20"],a:1,why:"22000 ÷ 20000 = 1.10، أي أعلى بـ 10% من وسط الدرجة."}
]});

SECTIONS.push({id:"exit",track:T.E,title:"إنهاء الخدمة والخروج",lede:"أنواع الإنهاء، إجراءات إخلاء الطرف، حساب المستحقات، ومقابلة الخروج.",
html:`
<h2>أنواع إنهاء الخدمة</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>المبادر</th><th>الوصف</th></tr></thead><tbody>
<tr><td>استقالة</td><td>الموظف</td><td>قرار طوعي بترك العمل</td></tr>
<tr><td>إنهاء لأداء/سلوك</td><td>الشركة</td><td>بعد إجراءات موثقة</td></tr>
<tr><td>تسريح اقتصادي (Redundancy)</td><td>الشركة</td><td>إلغاء الوظيفة نفسها لا الشخص</td></tr>
<tr><td>انتهاء العقد</td><td>الأجل</td><td>عقد محدد المدة انتهى</td></tr>
<tr><td>تقاعد</td><td>السن</td><td>بلوغ سن المعاش</td></tr>
<tr><td>وفاة أو عجز</td><td>ظرف صحي</td><td>إنهاء لأسباب خارجة عن الإرادة</td></tr>
</tbody></table></div>
<div class="box def"><span class="lbl">فرق جوهري</span><p><strong>Termination</strong> يستهدف <em>الشخص</em> لأسباب تتعلق بأدائه أو سلوكه. <strong>Redundancy</strong> يستهدف <em>الوظيفة</em> لأسباب اقتصادية أو هيكلية — والشخص قد يكون ممتازًا. الخلط بينهما في التوثيق قد يقلب الوضع القانوني تمامًا.</p></div>

<h2>قائمة إجراءات الخروج</h2>
<ol>
<li>استلام الاستقالة أو إصدار قرار الإنهاء.</li>
<li>احتساب فترة الإخطار (Notice Period).</li>
<li>تسليم العهدة: لابتوب، هاتف، كارت دخول، مستندات، سيارة.</li>
<li>إخلاء طرف من كل الإدارات: المالية، IT، المخازن، الإدارة المباشرة.</li>
<li>حساب المستحقات النهائية.</li>
<li>إنهاء التأمينات الاجتماعية والطبية.</li>
<li>مقابلة الخروج وتحليل الأسباب.</li>
<li>إصدار شهادة الخبرة.</li>
<li>إلغاء كل الصلاحيات والحسابات فورًا.</li>
<li>أرشفة الملف للمدة القانونية.</li>
</ol>

<h2>المستحقات النهائية</h2>
<div class="ascii">+ الراتب حتى آخر يوم عمل
+ رصيد الإجازات غير المستخدمة
+ مكافأة نهاية الخدمة (إن استُحقت)
+ أي حوافز مستحقة غير مصروفة
- السلف والعهد غير المسددة
- أي التزامات أخرى موثقة
= صافي المستحقات</div>

<div class="box tip"><span class="lbl">مقابلة الخروج — كيف تكون مفيدة</span>
<ul style="margin:6px 0 0">
<li>يجريها شخص محايد لا المدير المباشر الذي قد يكون سبب الرحيل.</li>
<li>بعد ضمان صرف المستحقات، وإلا خشي الموظف الصراحة.</li>
<li>أسئلة عن الوقائع لا المشاعر: «متى بدأت تفكر في الرحيل؟ وما الذي كان سيبقيك؟»</li>
<li>قيمتها في <strong>التجميع</strong>: مقابلة واحدة قصة، وعشرون مقابلة نمط قابل للتصرف فيه.</li>
</ul></div>

<div class="box warn"><span class="lbl">الأمن أولًا</span><p>إلغاء صلاحيات الأنظمة يجب أن يتم في <strong>نفس اللحظة</strong> التي يُبلَّغ فيها الموظف بالإنهاء غير الطوعي — لا بعد أسبوع حين «يخلص الأوراق». التأخير هنا مخاطرة أمنية حقيقية على البيانات.</p></div>

<h2>كيف تقيس جودة إدارة الخروج</h2>
<div class="tbl"><table><thead><tr><th>المؤشر</th><th>المستهدف</th></tr></thead><tbody>

<tr><td>نسبة إلغاء الصلاحيات في اليوم نفسه</td><td>100% في الإنهاء غير الطوعي — بلا استثناء</td></tr>
<tr><td>نسبة إجراء مقابلات الخروج</td><td>ارتفاعها يعطي عينة كافية لاكتشاف الأنماط</td></tr>
<tr><td>الدوران المؤسف كنسبة من الكلي</td><td>انخفاضه أهم من انخفاض الدوران الكلي</td></tr>
<tr><td>نسبة المغادرين المستعدين للعودة</td><td>مؤشر جودة تجربة الخروج ومصدر توظيف مستقبلي</td></tr>
<tr><td>عدد النزاعات بعد الخروج</td><td>ارتفاعه يعني خللًا في الإجراء أو في التوثيق</td></tr>
</tbody></table></div>`,

/* ========== 23. التحديات والاتجاهات ========== */
SECTIONS.push({id:"trends",track:T.F,title:"التحديات والاتجاهات الحديثة",lede:"ما يعيد تشكيل المهنة الآن: الذكاء الاصطناعي، العمل الهجين، المهارات، وتجربة الموظف.",
html:`
<h2>الاتجاهات</h2>
<div class="tbl"><table><thead><tr><th>الاتجاه</th><th>الوصف</th><th>ما يجب الانتباه له</th></tr></thead><tbody>
<tr><td>الذكاء الاصطناعي في HR</td><td>فرز السير، مساعدات للموظفين، التنبؤ بالاستقالات، توليد المحتوى</td><td>التحيّز الخوارزمي والشفافية</td></tr>
<tr><td>العمل الهجين وعن بُعد</td><td>إعادة تصميم السياسات والثقافة والقياس</td><td>عدالة الفرص بين الحاضرين والبعيدين</td></tr>
<tr><td>التوظيف بالمهارات</td><td>معايير المهارة بدل الشهادة</td><td>يحتاج أدوات تقييم موثوقة</td></tr>
<tr><td>تجربة الموظف (EX)</td><td>تصميم رحلة الموظف كتصميم تجربة العميل</td><td>لا تصبح فعاليات بلا جوهر</td></tr>
<tr><td>People Analytics</td><td>القرار المبني على البيانات</td><td>الخصوصية والسببية</td></tr>
<tr><td>الرفاهية والصحة النفسية</td><td>برامج دعم ومرونة</td><td>معالجة أسباب الإجهاد لا أعراضه</td></tr>
<tr><td>DEI</td><td>التنوع والإنصاف والشمول</td><td>القياس لا الشعارات</td></tr>
<tr><td>الشفافية في الأجور</td><td>ضغط تشريعي ومجتمعي للإفصاح عن النطاقات</td><td>يتطلب هيكلًا يصمد أمام السؤال</td></tr>
<tr><td>إعادة التأهيل (Reskilling)</td><td>تحديث مهارات القوى العاملة</td><td>الأسرع نموًا لأن دورة حياة المهارة تقصر</td></tr>
</tbody></table></div>

<h2>التحديات</h2>
<div class="grid">
<div class="card"><h4>حرب المواهب</h4><p>المنافسة على الكفاءات النادرة تتجاوز حدود القطاع والدولة.</p></div>
<div class="card"><h4>الدوران المرتفع</h4><p>خصوصًا بين الأجيال الجديدة الأقل ارتباطًا بجهة عمل واحدة.</p></div>
<div class="card"><h4>فجوة المهارات</h4><p>ما يتخرج لا يطابق ما يحتاجه السوق.</p></div>
<div class="card"><h4>أربعة أجيال معًا</h4><p>توقعات وأساليب تواصل مختلفة في مكان واحد.</p></div>
<div class="card"><h4>الاحتراق الوظيفي</h4><p>Burnout يتحول من مشكلة فردية إلى مؤشر تنظيمي.</p></div>
<div class="card"><h4>إثبات قيمة HR</h4><p>الانتقال من سرد الأنشطة إلى إثبات الأثر بالأرقام.</p></div>
</div>

<div class="box warn"><span class="lbl">تحذير حول أتمتة الفرز</span><p>نموذج يتعلم من قرارات توظيف سابقة متحيزة سيصبح متحيزًا — لكن بكفاءة أعلى وبمظهر موضوعي يصعب الطعن فيه. أي أداة فرز آلي تحتاج: مراجعة بشرية، اختبار أثر تمييزي دوري، وقدرة على تفسير سبب الرفض.</p></div>

<h2>كيف تفرّق بين اتجاه حقيقي وموضة إدارية</h2>
<div class="tbl"><table><thead><tr><th>السؤال</th><th>الاتجاه الحقيقي</th><th>الموضة</th></tr></thead><tbody>
<tr><td>ما الذي يدفعه؟</td><td>تغيّر هيكلي في التقنية أو التشريع أو الديموغرافيا</td><td>مقال رائج أو مؤتمر</td></tr>
<tr><td>هل له دليل؟</td><td>بيانات من منشآت متعددة عبر سنوات</td><td>قصة نجاح شركة واحدة</td></tr>
<tr><td>هل يصلح لسياقك؟</td><td>قابل للتكييف مع قطاعك وحجمك</td><td>يفترض موارد شركات التقنية العملاقة</td></tr>
<tr><td>ماذا لو توقفت عنه؟</td><td>خسارة تنافسية ملموسة</td><td>لا شيء يُذكر</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">قاعدة عملية</span><p>قبل تبنّي أي ممارسة رائجة اسأل: <strong>ما المشكلة التي تحلها عندي بالتحديد؟</strong> إن لم تجد إجابة محددة برقم، فأنت تشتري راحة نفسية لا حلًا.</p></div>

<h2>ما لن يتغيّر</h2>
<p>وسط ضجيج الاتجاهات، هناك ثوابت أثبتت صمودها عبر كل الموجات:</p>
<div class="grid">
<div class="card"><h4>الاختيار الجيد</h4><p>لا تقنية تعوّض توظيف الشخص الخطأ.</p></div>
<div class="card"><h4>المدير المباشر</h4><p>يظل أقوى متغير في تجربة الموظف مهما تغيرت الأدوات.</p></div>
<div class="card"><h4>وضوح التوقعات</h4><p>أرخص تدخل وأعلاه أثرًا، ولم يتغير منذ عقود.</p></div>
<div class="card"><h4>العدالة</h4><p>الإحساس بالإنصاف يسبق كل شيء ولا يعوّضه أي امتياز.</p></div>
</div>

<h2>مهارات ممارس HR في السنوات القادمة</h2>
<div class="chips"><span class="chip">قراءة البيانات وسردها</span><span class="chip">الفهم المالي</span><span class="chip">تصميم التجربة</span><span class="chip">إدارة التغيير</span><span class="chip">الحكم الأخلاقي في قرارات الأتمتة</span><span class="chip">التعامل عبر الثقافات</span><span class="chip">صياغة السياسات بلغة واضحة</span><span class="chip">التعلّم المستمر</span></div>
<div class="box warn"><span class="lbl">ما يتقادم</span><p>المهام التي تقوم على النقل والإدخال والتجميع اليدوي — وهي بالضبط ما يشغل جزءًا كبيرًا من وقت كثير من ممارسي HR اليوم. الأتمتة لن تُلغي المهنة، لكنها ستُلغي هذا الجزء منها، وقيمتك ستُقاس بما تفعله بالوقت المُحرَّر.</p></div>
`,

html:`
<div class="book"><div class="book-top"><div class="book-no">1</div><div><h3>Human Resource Management</h3><div class="au">Gary Dessler · مرجع أكاديمي</div></div></div><div class="book-body">
<p><strong>لماذا يهم:</strong> الكتاب الأول عالميًا لتدريس HR، وميزته أنه يشرح كل وظيفة بشكل إجرائي خطوة بخطوة مع نماذج جاهزة.</p>
<h3>الأفكار الجوهرية</h3>
<ul>
<li><strong>HR مسؤولية كل مدير:</strong> إدارة HR توفر الأدوات، والمدير المباشر ينفذ يوميًا.</li>
<li><strong>سلسلة لا تُكسر:</strong> تحليل الوظيفة ← JD ← تخطيط ← اختيار ← تدريب ← تقييم ← أجر. لا يمكن أن يكون لديك تقييم عادل بلا وصف وظيفي واضح.</li>
<li><strong>الاختيار الجيد أرخص من الفصل:</strong> ويشرح الصدق والثبات في أدوات الاختيار.</li>
<li><strong>القانون إطار لا تفصيلة:</strong> قرار خاطئ واحد قد يكلف قضية.</li>
<li><strong>خريطة الاستراتيجية:</strong> ابدأ من هدف الشركة وارجع للخلف: أي سلوك موظف يحققه؟ أي ممارسة HR تنتجه؟ أي مؤشر يقيسه؟</li>
</ul>
<div class="box warn"><span class="lbl">ملاحظة نقدية</span><p>الجزء القانوني أمريكي، ويجب استبداله بقانون بلدك. وحجمه يجعله مرجعًا يُرجع إليه لا كتابًا يُقرأ بالتسلسل.</p></div>
<div class="box tip"><span class="lbl">الخلاصة</span><p>«الموارد البشرية علم إجرائي منظّم، وكل شيء يبدأ من فهمك الدقيق للوظيفة نفسها.»</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">2</div><div><h3>Armstrong's Handbook of HRM Practice</h3><div class="au">Michael Armstrong · موسوعة مرجعية</div></div></div><div class="book-body">
<p><strong>لماذا يهم:</strong> إن كان ديسلر «كتاب المنهج» فأرمسترونج هو «الموسوعة»، وهو المرجع شبه الرسمي لدارسي CIPD.</p>
<h3>الأفكار الجوهرية</h3>
<ul>
<li><strong>نظرية الموارد:</strong> الآلات تُشترى والتقنية تُنسخ، أما تركيبة البشر وثقافتهم فغير قابلة للتقليد.</li>
<li><strong>التوافق الرأسي والأفقي:</strong> رأسي = سياسات HR مع الاستراتيجية · أفقي = سياسات HR مع بعضها.</li>
<li><strong>العقد النفسي:</strong> بجانب العقد المكتوب عقد ضمني من التوقعات المتبادلة، وأغلب الإحباط والاستقالة سببه خرقه لا خرق المكتوب.</li>
<li><strong>المكافآت الكلية:</strong> مالي + مزايا + تعلم + بيئة + تقدير.</li>
<li><strong>HR القائم على الأدلة:</strong> لا تطبّق ممارسة لأنها موضة — اسأل عن الدليل في سياقك.</li>
</ul>
<div class="box ex"><span class="lbl">مثال على التوافق الأفقي</span><p>استراتيجيتك ابتكار، لكن نظام تقييمك يعاقب على الأخطاء ونظام أجرك يكافئ الالتزام الحرفي بالتعليمات ← أنت تحارب نفسك، والسياسات تلغي بعضها.</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">3</div><div><h3>Fundamentals of Human Resource Management</h3><div class="au">Noe · Hollenbeck · Gerhart · Wright</div></div></div><div class="book-body">
<p><strong>لماذا يهم:</strong> أحدث وأخف من ديسلر، وأقوى في ربط HR بالتقنية والتحليلات والاتجاهات الحديثة.</p>
<h3>نموذج AMO — أداة تشخيص ذهبية</h3>
<div class="ascii">الأداء = القدرة (Ability) × الدافعية (Motivation) × الفرصة (Opportunity)

Ability      هل يعرف كيف؟      -> التوظيف والتدريب
Motivation   هل يريد؟          -> الأجر والتقدير والقيادة
Opportunity  هل تسمح البيئة؟   -> الأدوات والصلاحيات والعمليات</div>
<p>حين يضعف أداء أحدهم، اسأل أي الثلاثة مفقود قبل أن تلومه. إرسال شخص فاقد الدافعية إلى دورة تدريبية هدر مزدوج.</p>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">4</div><div><h3>Human Resource Champions</h3><div class="au">Dave Ulrich · الكتاب الذي غيّر المهنة</div></div></div><div class="book-body">
<p><strong>السؤال الصادم:</strong> ما القيمة التي تضيفها HR فعلًا؟ والإجابة صارت المعيار العالمي.</p>
<h3>الأدوار الأربعة</h3>
<div class="tbl"><table><thead><tr><th>الدور</th><th>التركيز</th><th>مثال</th></tr></thead><tbody>
<tr><td>الشريك الاستراتيجي</td><td>مستقبل + عمليات</td><td>خطة قوى عاملة لتوسع 3 سنوات</td></tr>
<tr><td>الخبير الإداري</td><td>حاضر + عمليات</td><td>أتمتة الرواتب وخفض زمن المعاملة 60%</td></tr>
<tr><td>بطل الموظفين</td><td>حاضر + أشخاص</td><td>نظام إصغاء وحل شكاوى فعّال</td></tr>
<tr><td>وكيل التغيير</td><td>مستقبل + أشخاص</td><td>قيادة دمج ثقافي بعد استحواذ</td></tr>
</tbody></table></div>
<h3>أفكار مكمّلة</h3>
<ul>
<li><strong>Deliverables not Doables:</strong> لا تقل «نظّمنا 20 دورة» بل «قلّلنا أخطاء الجودة 30%».</li>
<li><strong>القيمة يحددها المستفيد لا المُنتج:</strong> الإدارة والمديرون والموظفون والعملاء والمستثمرون.</li>
</ul>
<div class="box tip"><span class="lbl">الخلاصة</span><p>«لن تصبح HR شريكًا استراتيجيًا لأنها طلبت مقعدًا على الطاولة، بل لأنها أثبتت أنها تحقق نتائج أعمال.»</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">5</div><div><h3>HR from the Outside In</h3><div class="au">Ulrich · Younger · Brockbank · Ulrich</div></div></div><div class="book-body">
<p><strong>الفكرة المحورية:</strong> ابدأ من خارج الشركة لا من داخلها — صمّم ممارسات HR انطلاقًا من احتياج العميل والمستثمر والسوق.</p>
<h3>الجدارات الست لممارس HR</h3>
<ol>
<li><strong>ناشط ذو مصداقية</strong> — موثوق شخصيًا وله موقف يُسمع. الأساس الذي بدونه لا شيء يعمل.</li>
<li><strong>مُنشئ قدرات</strong> — يبني قدرة المنظمة (سرعة، ابتكار، تعاون) لا مهارة الفرد فقط.</li>
<li><strong>بطل التغيير</strong> — يجعل التغيير يحدث ويستمر.</li>
<li><strong>مبتكر ومتكامل</strong> — حلول مترابطة لا سياسات منعزلة.</li>
<li><strong>محدد الموقع الاستراتيجي</strong> — يفهم السوق والعميل والمنافس والقوائم المالية.</li>
<li><strong>داعم التقنية</strong> — يوظّف الأنظمة والبيانات.</li>
</ol>
<div class="box ex"><span class="lbl">تطبيق</span><p>لكي تُؤخذ على محمل الجد في اجتماع الإدارة، تحدث بلغة الإيراد والهامش وحصة السوق ورضا العميل — لا بلغة «الاستبيانات والدورات».</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">6</div><div><h3>The HR Scorecard</h3><div class="au">Becker · Huselid · Ulrich</div></div></div><div class="book-body">
<p><strong>الفكرة المحورية:</strong> تحويل HR من مركز تكلفة إلى أصل استراتيجي قابل للقياس.</p>
<h3>سلسلة القيمة السببية</h3>
<div class="ascii">ممارسات HR -> قدرات الموظف -> سلوك الموظف
   -> نتائج تشغيلية -> نتائج مالية -> قيمة المساهم</div>
<h3>ثلاثة أنواع من المقاييس</h3>
<ul>
<li><strong>HR Doables:</strong> أنشطة (عدد الدورات، عدد التعيينات) ← الأقل قيمة.</li>
<li><strong>HR Deliverables:</strong> قدرات وسلوكيات نتجت فعلًا.</li>
<li><strong>Performance Drivers:</strong> محركات تنبئ بالنتائج المستقبلية.</li>
</ul>
<h3>فكرة «الوظائف من الفئة A»</h3>
<p>الوظائف ليست متساوية القيمة. الاستثمار يجب أن يتركز في الوظائف الحرجة التي تحدث فيها أكبر فروق أداء — لا توزيع الميزانية بالتساوي على الجميع.</p>
<div class="box tip"><span class="lbl">الخلاصة</span><p>«ما لا يُقاس لا يُموَّل. أثبت رابط السببية بين ما تفعله وبين رقم في القائمة المالية.»</p></div>
</div></div>
