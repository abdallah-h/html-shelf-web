<div class="book"><div class="book-top"><div class="book-no">7</div><div><h3>First, Break All the Rules</h3><div class="au">Buckingham &amp; Coffman · أبحاث Gallup</div></div></div><div class="book-body">
<p><strong>الفكرة الصادمة:</strong> «الناس لا يتركون الشركات، بل يتركون مديريهم.» المدير المباشر أقوى عامل في الاندماج والإنتاجية والبقاء — أقوى من الشركة ومن الراتب.</p>
<h3>الأفكار الجوهرية</h3>
<ul>
<li><strong>كسر الحكمة التقليدية:</strong> لا تعامل الجميع بالتساوي، ولا تركّز على إصلاح الضعف، ولا تفترض أن المسار الصحيح دائمًا تصاعدي.</li>
<li><strong>القوة قبل الضعف:</strong> إصلاح الضعف ينقل الموظف من «سيئ» إلى «متوسط»، بينما البناء على القوة ينقله من «جيد» إلى «متميز».</li>
<li><strong>المهارة تُدرَّس والموهبة تُختار:</strong> المعرفة والمهارة قابلتان للتعليم، أما الموهبة (أنماط التفكير والشعور والسلوك المتكررة) فشبه ثابتة. لذلك: <strong>وظّف على الموهبة ودرّب على المهارة.</strong></li>
</ul>
<h3>مقياس Q12 — والترتيب مهم</h3>
<p>أهم أسئلته: هل أعرف ما هو المتوقع مني؟ · هل لديّ المواد والمعدات اللازمة؟ · هل أفعل يوميًا ما أجيده؟ · هل تلقيت تقديرًا خلال الأسبوع الأخير؟ · هل يهتم أحد بي كإنسان؟ · هل هناك من يشجع تطوري؟ · هل رأيي مسموع؟</p>
<div class="box warn"><span class="lbl">الترتيب حرج</span><p>لا فائدة من فعاليات «بناء الفريق» إذا كان الموظف لا يعرف أصلًا ما هو المطلوب منه ولا يملك أدوات عمله. الأسئلة الأساسية تُحل أولًا.</p></div>
<h3>الأدوار الأربعة للمدير العظيم</h3>
<p>اختر بالموهبة · حدد التوقعات بالنتائج لا بالخطوات · حفّز بنقاط القوة · طوّر بالمواءمة لا بالترقية الإجبارية.</p>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">8</div><div><h3>Work Rules!</h3><div class="au">Laszlo Bock · رئيس HR السابق في Google</div></div></div><div class="book-body">
<h3>الأفكار الجوهرية</h3>
<ul>
<li><strong>اختر بين الحرية والسيطرة ولا تخلط:</strong> أسوأ خيار هو ادعاء الأولى وممارسة الثانية.</li>
<li><strong>اصرف مواردك على التوظيف لا على إصلاح ما بعده:</strong> تكلفة توظيف ممتاز أقل بكثير من تكلفة تدريب وإصلاح وفصل متوسط.</li>
<li><strong>انزع قرار التوظيف من المدير المباشر:</strong> المدير المستعجل لملء شاغر يخفّض المعايير.</li>
<li><strong>أربع مقابلات تكفي:</strong> بعدها تكاد دقة التنبؤ لا تتحسن.</li>
<li><strong>افصل حوار التطوير عن حوار الراتب:</strong> لو ناقشتهما معًا لن يسمع الموظف كلمة عن التطوير.</li>
<li><strong>الأداء قانون قوة لا منحنى طبيعي:</strong> نسبة صغيرة تصنع نسبة ضخمة من النتائج، لذلك <strong>كافئ بشكل غير متساوٍ</strong>.</li>
<li><strong>Project Oxygen:</strong> ظنوا أن المديرين غير مهمين للمهندسين، فأثبتت البيانات العكس واستُخرجت سلوكيات المدير الفعّال.</li>
<li><strong>Nudges:</strong> رسالة تذكير بسيطة للموظف الجديد ومديره قبل أول يوم رفعت الإنتاجية المبكرة.</li>
</ul>
<div class="box warn"><span class="lbl">ملاحظة نقدية</span><p>ممارسات جوجل نشأت في سياق ثري ماليًا ومواهب مطلوبة عالميًا. انسخ <strong>المنطق</strong> لا الممارسة.</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">9</div><div><h3>No Rules Rules</h3><div class="au">Reed Hastings &amp; Erin Meyer · Netflix</div></div></div><div class="book-body">
<h3>المعادلة التصاعدية — والترتيب حرج</h3>
<div class="ascii">دورة 1: ارفع كثافة المواهب -> زد الصراحة -> ارفع بعض الضوابط
دورة 2: عزّز الكثافة       -> زد الصراحة -> أزل مزيدًا من الضوابط
دورة 3: أقصى كثافة         -> أقصى صراحة -> قُد بالسياق لا بالسيطرة</div>
<p class="hint">إزالة الضوابط قبل توفر المواهب والصراحة = فوضى.</p>
<h3>الأفكار الجوهرية</h3>
<ul>
<li><strong>كثافة المواهب:</strong> الموظف الضعيف يخفض أداء من حوله ويستهلك وقت المدير.</li>
<li><strong>«نحن فريق لسنا عائلة»:</strong> الفريق المحترف يحتفظ بمن يؤدي في مركزه الآن.</li>
<li><strong>اختبار المحتفظ به (Keeper Test):</strong> «لو استقال غدًا، هل سأحارب لأبقيه؟» لو لا ← تعويض خروج كريم وافتراق باحترام.</li>
<li><strong>ادفع أعلى السوق:</strong> راتب ثابت مرتفع بدل بونص متغير.</li>
<li><strong>التغذية الراجعة 4A:</strong> اهدف للمساعدة · قابلة للتنفيذ · استقبلها بامتنان · لك حق القبول أو الرفض.</li>
<li><strong>القيادة بالسياق لا بالسيطرة:</strong> لو أخطأ الفريق، اسأل: أي سياق فاتني أن أعطيه؟</li>
</ul>

</div></div>

<li><strong>اشرح «لماذا» باستمرار:</strong> ليتخذ الموظف قرارات صحيحة بنفسه يجب أن يفهم نموذج العمل وأرقامه.</li>
<li><strong>الترقية ليست مكافأة:</strong> بل لأن الشركة تحتاج شخصًا في هذا المستوى وهذا الشخص يؤديه بالفعل.</li>

<tr><td>القيادة صفات موحدة</td><td>القائد ببساطة هو من له أتباع</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">التطبيق الأهم</span><p>بدل «مهارات تواصل: 3/5»، اسأل المدير عن <strong>نيّته هو</strong>: هل أعطي هذا الشخص أعلى مكافأة ممكنة؟ هل أريده دائمًا في فريقي؟ هل أثق به في وضع حرج؟ هل هو جاهز للترقية اليوم؟ — تنتج بيانات أصدق بكثير.</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">18</div><div><h3>Good to Great</h3><div class="au">Jim Collins</div></div></div><div class="book-body">
<ul>
<li><strong>أولًا مَن ثم ماذا:</strong> الشركات العظيمة وضعت الأشخاص المناسبين في الحافلة أولًا ثم قررت الوجهة. لأن الاتجاه قد يتغير أما نوعية الناس فتحدد قدرتك على التكيف.</li>
<li><strong>قيادة المستوى الخامس:</strong> تواضع شخصي شديد + إرادة مهنية شرسة. <em>نافذة ومرآة</em>: يشيرون من النافذة عند النجاح وينظرون في المرآة عند الفشل.</li>
<li><strong>مفارقة ستوكديل:</strong> إيمان مطلق بالانتصار في النهاية + مواجهة أقسى الحقائق الحالية بلا تجميل.</li>
<li><strong>مفهوم القنفذ:</strong> تقاطع ما تشتغف به × ما يمكن أن تكون الأفضل فيه × ما يحرّك محرّكك الاقتصادي.</li>
<li><strong>ثقافة الانضباط:</strong> أشخاص منضبطون فلا تحتاج هرمية، فكر منضبط فلا تحتاج بيروقراطية، فعل منضبط فلا تحتاج رقابة مفرطة.</li>
</ul>
<div class="box tip"><span class="lbl">الخلاصة</span><p>«الأشخاص ليسوا أهم أصولك — <strong>الأشخاص المناسبون</strong> هم أهم أصولك.»</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">19</div><div><h3>Measure What Matters</h3><div class="au">John Doerr · منهجية OKR</div></div></div><div class="book-body">
<div class="ascii">Objective   : ماذا نريد أن نحقق؟  (نوعي · ملهم · طموح · محدد بزمن)
Key Results : كيف نعرف أننا حققناه؟ (3-5 نتائج رقمية قاطعة)</div>
<div class="box ex"><span class="lbl">مثال</span>
<p><strong>الهدف:</strong> أن نصبح الخيار الأول لعملائنا في خدمة ما بعد البيع.</p>
<p><strong>KR1:</strong> رفع NPS من 32 إلى 50 · <strong>KR2:</strong> خفض زمن الاستجابة من 8 ساعات إلى ساعتين · <strong>KR3:</strong> حل 90% من الشكاوى من أول تواصل.</p></div>
<h3>المبادئ الأربعة</h3>
<ul>
<li><strong>التركيز:</strong> عدد قليل من الأهداف والقدرة على قول «لا».</li>
<li><strong>المواءمة والشفافية:</strong> أهداف الجميع معلنة للجميع.</li>
<li><strong>التتبع والمساءلة:</strong> مراجعة دورية وتحديث النسب.</li>
<li><strong>التمدد:</strong> تحقيق 70% من هدف طموح أفضل من 100% من هدف سهل.</li>
</ul>
<div class="box warn"><span class="lbl">قواعد حرجة</span><p><strong>افصل OKRs عن المكافآت المالية</strong> وإلا وضع الجميع أهدافًا سهلة مضمونة. و OKRs ليست قائمة مهام بل نتائج. ويكمّلها <strong>CFRs</strong>: محادثات + تغذية راجعة + تقدير.</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">20</div><div><h3>Leading Change</h3><div class="au">John Kotter</div></div></div><div class="book-body">
<div class="tbl"><table><thead><tr><th>#</th><th>الخطوة</th><th>الخطأ القاتل</th></tr></thead><tbody>
<tr><td>1</td><td>خلق شعور بالإلحاح</td><td>الرضا عن الوضع الحالي — الأخطر</td></tr>
<tr><td>2</td><td>بناء ائتلاف قيادي</td><td>الاعتماد على شخص واحد أو لجنة بلا نفوذ</td></tr>
<tr><td>3</td><td>صياغة رؤية واستراتيجية</td><td>رؤية غامضة لا تُشرح في 5 دقائق</td></tr>
<tr><td>4</td><td>توصيل الرؤية باستمرار</td><td>التواصل مرة ثم الصمت</td></tr>
<tr><td>5</td><td>التمكين وإزالة العوائق</td><td>ترك أنظمة ومديرين يعرقلون</td></tr>
<tr><td>6</td><td>مكاسب قصيرة المدى</td><td>غياب نتائج ملموسة خلال 6–18 شهرًا</td></tr>
<tr><td>7</td><td>البناء على المكاسب</td><td>إعلان النصر مبكرًا</td></tr>
<tr><td>8</td><td>الترسيخ في الثقافة</td><td>زوال التغيير برحيل قائده</td></tr>
</tbody></table></div>
<p><strong>دور HR</strong> يتركز في الخطوات 4 و5 و8: التواصل الداخلي، ومواءمة أنظمة الأجر والتقييم مع السلوك الجديد، وترسيخه في التوظيف والتدريب.</p>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">21</div><div><h3>Data-Driven HR / Predictive HR Analytics</h3><div class="au">Bernard Marr · Edwards &amp; Edwards</div></div></div><div class="book-body">
<ul>
<li><strong>ابدأ من السؤال لا من البيانات.</strong></li>
<li><strong>أربعة مستويات نضج:</strong> وصفي ← تشخيصي ← تنبؤي ← إرشادي. معظم الشركات عالقة عند الأول.</li>
<li><strong>الارتباط ليس سببية:</strong> ابحث دائمًا عن المتغير الخفي.</li>
<li><strong>حالات عالية العائد:</strong> التنبؤ بالاستقالة · فجوة الأجور · فعالية مصادر التوظيف · أسباب الغياب · أثر التدريب.</li>
<li><strong>الأخلاقيات:</strong> شفافية + حد أدنى من البيانات + تجنّب إعادة إنتاج التحيّز.</li>
<li><strong>الرواية بالبيانات:</strong> رسم واحد واضح وتوصية واحدة محددة أفضل من 30 شريحة.</li>
</ul>
<div class="box tip"><span class="lbl">الخلاصة</span><p>«قيمة تحليلات HR ليست في التقرير، بل في القرار الذي غيّرته.»</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">22</div><div><h3>Compensation</h3><div class="au">Milkovich · Newman · Gerhart</div></div></div><div class="book-body">
<h3>نموذج خيارات الأجر الأربعة</h3>
<div class="tbl"><table><thead><tr><th>البُعد</th><th>السؤال</th><th>الأداة</th></tr></thead><tbody>
<tr><td>العدالة الداخلية</td><td>هل الوظائف الأهم تأخذ أكثر؟</td><td>تحليل وتقييم الوظائف</td></tr>
<tr><td>التنافسية الخارجية</td><td>هل نجاري السوق؟</td><td>مسوح الرواتب</td></tr>
<tr><td>مساهمة الموظف</td><td>هل الأداء الأفضل يُكافأ؟</td><td>أجر مرتبط بالأداء</td></tr>
<tr><td>إدارة النظام</td><td>هل يُطبَّق بعدل وشفافية وضمن الميزانية؟</td><td>السياسات والحوكمة والتواصل</td></tr>
</tbody></table></div>
<p><strong>مبادئ:</strong> الشعور بالعدالة أهم من مستوى الأجر · قرّر موقعك السوقي بوعي (Lead/Match/Lag) · الأجر المتغير يوجّه السلوك بقوة بما فيه غير المرغوب · الشفافية تتطلب نظامًا يصمد أمام سؤال «لماذا هو أعلى مني؟».</p>
<div class="box tip"><span class="lbl">الخلاصة</span><p>«أنت لا تدفع أجرًا — أنت ترسل رسالة عمّا تقدّره المؤسسة فعلًا.»</p></div>
</div></div>

<div class="book"><div class="book-top"><div class="book-no">23</div><div><h3>The Alliance</h3><div class="au">Reid Hoffman · Casnocha · Yeh</div></div></div><div class="book-body">
<p>انتهى عصر الوظيفة مدى الحياة، لكن البديل ليس علاقة نفعية باردة — بل <strong>تحالف</strong>: علاقة صريحة متبادلة المنفعة ومحددة المدة.</p>
<h3>جولة الخدمة (Tour of Duty)</h3>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الوصف</th></tr></thead><tbody>
<tr><td>تناوبية</td><td>برامج تدريب وتناوب موحدة للمبتدئين</td></tr>
<tr><td>تحويلية</td><td>مهمة محددة (2–5 سنوات) تُحوّل الشركة وتُحوّل الموظف معها — الأهم</td></tr>
<tr><td>تأسيسية</td><td>لمن سيقضي مسيرته كلها في الشركة</td></tr>
</tbody></table></div>
<p>الصفقة الصريحة: «ساعدنا على تحويل الشركة، وسنساعدك على تحويل مسيرتك.»</p>
<p><strong>أفكار أخرى:</strong> شبكات علاقات موظفيك أصل استراتيجي (Network Intelligence) · والموظف السابق ليس عدوًا بل سفير وعميل محتمل ومصدر ترشيحات وقد يعود (Boomerang).</p>
</div></div>

<h2>خطة قراءة 12 شهرًا</h2>

<tr><td>الثالث — الناس والثقافة</td><td>Work Rules! · Radical Candor · Drive · The Culture Code</td><td>فهم كيف يعمل البشر وكيف تُبنى الثقافة</td></tr>

<div class="box tip"><span class="lbl">طريقة القراءة</span>
<ul style="margin:6px 0 0">
<li>اقرأ بقلم: بعد كل فصل اكتب سطرين — الفكرة + كيف أطبقها عندي.</li>
<li>طبّق فكرة واحدة فقط من كل كتاب خلال 30 يومًا. فكرة مُطبَّقة أفضل من عشرة كتب مقروءة.</li>
<li>ناقش ما قرأت — الشرح للآخرين يثبّت الفهم.</li>
<li>راجع ملاحظاتك كل 6 أشهر؛ ستقرأ نفس السطر بفهم مختلف بعد خبرة إضافية.</li>
</ul></div>

<div class="box warn"><span class="lbl">تنبيه أخير</span>
<ul style="margin:6px 0 0">
<li><strong>لا تقدّس كتابًا.</strong> نتفليكس وجوجل لا تشبهان مصنعًا أو مستشفى.</li>
<li><strong>احذر تحيّز الناجين:</strong> كثير من كتب الإدارة تدرس الناجحين فقط وتتجاهل من طبّقوا نفس الأشياء وفشلوا.</li>
<li><strong>الكتاب يعطيك خريطة لا طريقًا.</strong></li>
</ul></div>

/* ========== عقود العمل ========== */
SECTIONS.push({id:"contracts",track:T.B,title:"عقود العمل وأنواعها",lede:"البنود الإلزامية، أنواع العقود، فترة الاختبار، والاتفاقيات الملحقة.",
html:`
<h2>البنود الإلزامية في أي عقد</h2>
<ol>
<li><strong>أطراف العقد:</strong> اسم صاحب العمل وعنوانه، واسم العامل وبياناته وجنسيته ومؤهله.</li>
<li><strong>طبيعة العمل ونوعه</strong> والمسمى الوظيفي.</li>
<li><strong>مكان العمل</strong> (وأي شرط بشأن النقل أو العمل عن بُعد).</li>
<li><strong>تاريخ بدء العمل</strong> ومدة العقد إن كان محدد المدة.</li>
<li><strong>الأجر</strong> وطريقة ودورية صرفه والبدلات.</li>
<li><strong>ساعات العمل</strong> والراحة الأسبوعية.</li>
<li><strong>فترة الاختبار</strong> ومدتها.</li>
<li><strong>الإجازات</strong> المستحقة.</li>
<li><strong>مدة الإخطار</strong> عند الإنهاء.</li>
<li><strong>الإحالة للائحة الشركة</strong> وإقرار الموظف باستلامها.</li>
</ol>
<div class="box tip"><span class="lbl">قاعدة</span><p>العقد يُحرَّر عادةً بثلاث نسخ: نسخة للموظف، نسخة للشركة، ونسخة لجهة التأمينات. تسليم نسخة موقّعة للموظف ليس مجاملة — بل غالبًا التزام قانوني، وإغفاله يُضعف موقف الشركة.</p></div>

<h2>أنواع العقود</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>الخصائص</th><th>الاستخدام</th></tr></thead><tbody>
<tr><td>غير محدد المدة</td><td>مفتوح، إنهاؤه يحتاج سببًا مشروعًا وإخطارًا</td><td>الأصل في معظم التشريعات</td></tr>
<tr><td>محدد المدة</td><td>ينتهي بانتهاء أجله، وتجديده المتكرر قد يحوّله لغير محدد</td><td>مشاريع ومهام مؤقتة</td></tr>
<tr><td>عقد مهمة معينة</td><td>ينتهي بإنجاز العمل المتفق عليه</td><td>مشروع إنشائي أو تطويري</td></tr>
<tr><td>عقد جزئي (Part-time)</td><td>ساعات أقل، والاستحقاقات بالتناسب</td><td>الطلاب والأدوار المساندة</td></tr>
<tr><td>عقد موسمي</td><td>مرتبط بموسم متكرر</td><td>الزراعة، السياحة، المواسم التجارية</td></tr>
<tr><td>عقد عمل عن بُعد</td><td>يوثّق مكان الأداء وأدوات العمل ومعايير القياس</td><td>الأدوار المعرفية</td></tr>
<tr><td>عقد تدريب</td><td>غرضه التعلم، بشروط وحماية خاصة</td><td>المتدربون والخريجون الجدد</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">فخّ شائع</span><p>تجديد العقد محدد المدة مرة بعد مرة لسنوات ظنًا أنه يمنح مرونة في الإنهاء. في كثير من التشريعات يتحول العقد بعد التجديد المتكرر إلى <strong>غير محدد المدة</strong> بحكم القانون — فتفقد الشركة المرونة وتظل تحسب أنها تملكها.</p></div>

<h2>فترة الاختبار</h2>
<ul>
<li>يجب <strong>النص عليها صراحةً</strong> في العقد وإلا اعتُبرت غير قائمة.</li>
<li>لها حد أقصى قانوني يختلف بين الدول.</li>
<li>لا يجوز عادةً وضع الموظف تحت الاختبار <strong>مرتين لدى نفس صاحب العمل في نفس العمل</strong>.</li>
<li>الإنهاء خلالها أيسر لكنه ليس مطلقًا — يظل خاضعًا لعدم التعسف وللإخطار المقرر.</li>
</ul>

<h2>اتفاقيات ملحقة شائعة</h2>
<div class="grid">
<div class="card"><h4>السرية (NDA)</h4><p>حماية معلومات الشركة وعملائها، وتستمر عادةً بعد انتهاء العلاقة.</p></div>
<div class="card"><h4>عدم المنافسة</h4><p>تقييد العمل لدى منافس بعد الخروج — ولا تصح غالبًا إلا محددة المدة والمكان ونوع النشاط.</p></div>
<div class="card"><h4>الملكية الفكرية</h4><p>ملكية الشركة لما يُنتجه الموظف أثناء العمل وبأدواته.</p></div>
<div class="card"><h4>التزام التدريب</h4><p>ارتباط الموظف بمدة بعد تدريب مكلّف أو رد جزء من تكلفته.</p></div>
</div>
<div class="box ex"><span class="lbl">مثال</span><p>شرط عدم منافسة يقول «يُمنع الموظف من العمل في أي شركة أخرى إلى الأبد» شرط شبه باطل عمليًا لاتساعه غير المعقول. أما «يُمنع من العمل لدى منافس مباشر في نفس المدينة لمدة 12 شهرًا في نفس التخصص» فأقرب للقبول — لأن التقييد محدد المدة والمكان والنشاط.</p></div>
`,
quiz:[
{q:"تجديد العقد محدد المدة مرات متكررة قد يؤدي في كثير من التشريعات إلى:",opts:["بطلان العقد","تحوّله إلى عقد غير محدد المدة","إعفاء من التأمينات","إلغاء فترة الإخطار"],a:1,why:"المشرّع يعتبر التكرار دليلًا على أن العمل دائم الطبيعة، فيمنح الموظف حماية العقد غير محدد المدة."},
{q:"فترة الاختبار إذا لم يُنص عليها صراحةً في العقد:",opts:["تُطبق تلقائيًا 3 أشهر","تُعتبر غير قائمة","تُحدد بقرار المدير","تمتد سنة"],a:1,why:"الاختبار استثناء من الأصل، ولذلك يجب النص عليه كتابةً وإلا فلا وجود له قانونًا."},
{q:"شرط عدم المنافسة يكون أقرب للقبول قانونًا حين يكون:",opts:["مطلقًا وبلا حدود","محدد المدة والمكان ونوع النشاط","شفهيًا","بعد انتهاء الخدمة بخمس سنوات"],a:1,why:"التقييد المطلق يُعطّل حق الشخص في العمل، ولذلك تشترط التشريعات معقولية النطاق الزمني والمكاني والموضوعي."},
{q:"أي بند ليس من البنود الإلزامية النمطية في عقد العمل؟",opts:["الأجر ودوريته","مكان العمل","تقييم أداء الموظف السنوي","تاريخ بدء العمل"],a:2,why:"تقييم الأداء نظام داخلي لاحق، أما البنود الإلزامية فتحدد أركان العلاقة نفسها."},
{q:"عقد «المهمة المعينة» ينتهي بـ:",opts:["مرور سنة","إنجاز العمل المتفق عليه","بلوغ سن التقاعد","انتهاء فترة الاختبار"],a:1,why:"ارتباطه بالمخرج لا بالزمن هو ما يميزه عن العقد محدد المدة."},
{q:"لماذا يُعد تسليم نسخة موقّعة من العقد للموظف مهمًا؟",opts:["لتوفير الورق","لأنه غالبًا التزام قانوني وإغفاله يُضعف موقف الشركة في أي نزاع","لأنه يزيد الولاء","ليقدمه للبنك"],a:1,why:"غياب نسخة لدى الموظف يفتح باب الادعاء بعدم علمه بالشروط، ويصبح عبء الإثبات على الشركة."},
{q:"في العقد الجزئي (Part-time)، الاستحقاقات تُحسب عادةً:",opts:["كاملة كالدوام الكامل","بالتناسب مع ساعات العمل الفعلية","لا يستحق شيئًا","حسب رغبة صاحب العمل"],a:1,why:"مبدأ التناسب (Pro-rata) هو القاعدة العامة: نفس الحقوق لكن بنسبة الوقت المؤدى."},
{q:"صح أم خطأ: يجوز وضع الموظف تحت فترة اختبار مرتين لدى نفس صاحب العمل في نفس العمل.",t:"tf",a:1,why:"القاعدة العامة في معظم التشريعات هي المنع، لأن ذلك يُستخدم للتحايل على استقرار العلاقة."}

SECTIONS.push({id:"gulf",track:T.D,title:"قوانين العمل الخليجية (السعودية والإمارات)",lede:"مقارنة عملية لأهم الأحكام التي يحتاجها ممارس HR في السوق الخليجي.",
html:`
<div class="box warn"><span class="lbl">تنبيه</span><p>المعلومات التالية عامة وتوضيحية وليست استشارة قانونية، والتشريعات تُعدَّل باستمرار. ارجع دائمًا للنص الساري على المنصات الرسمية وللمستشار القانوني قبل أي إجراء.</p></div>

<h2>السعودية — نظام العمل</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>فترة التجربة</td><td>حتى <strong>180 يومًا</strong> كحد أقصى بنص صريح في العقد (منذ تعديلات 19 فبراير 2025)، ولا تُحتسب فيها إجازتا العيدين والمرضية</td></tr>
<tr><td>مهلة الإشعار (عقد غير محدد المدة)</td><td>30 يومًا إن كان الإنهاء من العامل · 60 يومًا إن كان من صاحب العمل</td></tr>
<tr><td>إجازة الوضع</td><td>12 أسبوعًا بأجر كامل</td></tr>
<tr><td>إجازات خاصة</td><td>5 أيام للزواج · 5 أيام لوفاة الزوج · 3 أيام لوفاة الأخ أو الأخت</td></tr>
<tr><td>التظلم من الجزاء</td><td>30 يومًا للتظلم الداخلي</td></tr>
<tr><td>الإجازة السنوية</td><td>21 يومًا، وترتفع إلى 30 يومًا بعد 5 سنوات لدى نفس صاحب العمل</td></tr>
<tr><td>مكافأة نهاية الخدمة</td><td>نصف شهر عن كل سنة من الخمس الأولى، وشهر عن كل سنة تالية</td></tr>
<tr><td>المكافأة عند الاستقالة</td><td>الثلث من 2–5 سنوات · الثلثان لأكثر من 5 وأقل من 10 · كاملة لـ10 فأكثر</td></tr>
<tr><td>الفصل غير المشروع</td><td>تعويض أجر 15 يومًا عن كل سنة في غير محدد المدة، أو أجر المدة الباقية في محدد المدة، بحد أدنى أجر شهرين</td></tr>
<tr><td>صرف الأجور</td><td>إلكترونيًا عبر نظام حماية الأجور (WPS)</td></tr>
<tr><td>التوثيق</td><td>العقود تُوثَّق إلكترونيًا عبر منصة «قوى»</td></tr>
<tr><td>التوطين</td><td>برنامج «نطاقات» لمتابعة نسب السعودة</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال محلول (السعودية)</span>
<p>موظف آخر أجر له 12,000 ريال، عمل 10 سنوات كاملة ثم انتهت خدمته بغير استقالة.</p>
<p>الخمس الأولى: <code>5 × (12000 ÷ 2) = 30,000</code></p>
<p>الخمس التالية: <code>5 × 12000 = 60,000</code></p>
<p><strong>الإجمالي = 90,000 ريال</strong></p>
<p class="hint">ولو كان قد استقال بعد 3 سنوات فقط: المكافأة الأساسية = 3 × 6,000 = 18,000، ثم يستحق الثلث = 6,000 ريال.</p></div>

<h2>الإمارات — المرسوم بقانون اتحادي رقم 33 لسنة 2021</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>الإطار</td><td>دخل حيز التنفيذ في فبراير 2022 وينظم علاقات العمل في القطاع الخاص</td></tr>
<tr><td>مكافأة نهاية الخدمة</td><td>أجر 21 يومًا عن كل سنة من الخمس الأولى، و30 يومًا عن كل سنة بعدها</td></tr>
<tr><td>سقف المكافأة</td><td>لا تتجاوز أجر سنتين من الراتب الأساسي</td></tr>
<tr><td>أساس الحساب</td><td>الراتب الأساسي فقط دون البدلات</td></tr>
<tr><td>شرط الاستحقاق</td><td>إتمام سنة متصلة على الأقل من الخدمة</td></tr>
<tr><td>فترة التجربة</td><td>لا تستحق عنها مكافأة نهاية خدمة</td></tr>
<tr><td>الجهة المنظمة</td><td>وزارة الموارد البشرية والتوطين (MOHRE)</td></tr>
<tr><td>الأجور</td><td>عبر نظام حماية الأجور (WPS)</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال محلول (الإمارات)</span>
<p>موظف راتبه الأساسي 9,000 درهم، خدمته 7 سنوات.</p>
<p>الأجر اليومي: <code>9000 ÷ 30 = 300</code></p>
<p>أول 5 سنوات: <code>300 × 21 × 5 = 31,500</code></p>
<p>السنتان التاليتان: <code>300 × 30 × 2 = 18,000</code></p>
<p><strong>الإجمالي = 49,500 درهم</strong> — ويُتحقق أنه لا يتجاوز سقف أجر سنتين (216,000).</p></div>

<h2>الفروق التي يجب أن ينتبه لها ممارس HR</h2>
<div class="tbl"><table><thead><tr><th>الوجه</th><th>مصر</th><th>السعودية</th><th>الإمارات</th></tr></thead><tbody>
<tr><td>الإطار الحالي</td><td>قانون 14 لسنة 2025</td><td>نظام العمل ولوائحه</td><td>مرسوم بقانون 33 لسنة 2021</td></tr>
<tr><td>أساس مكافأة نهاية الخدمة</td><td>وفق النظام التأميني والقانون</td><td>آخر أجر (وفق ما ينص عليه العقد بشأن البدلات)</td><td>الراتب الأساسي فقط</td></tr>
<tr><td>منصة رسمية</td><td>جهات العمل والتأمينات</td><td>قوى + WPS</td><td>MOHRE + WPS</td></tr>
<tr><td>سياسة التوطين</td><td>غير مطبقة بنفس الشكل</td><td>نطاقات</td><td>برامج التوطين</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">درس عملي</span><p>لو تدير فرقًا في أكثر من دولة خليجية، لا تنقل سياسة واحدة على الجميع. الفرق الأخطر عمليًا هو <strong>أساس حساب المستحقات</strong>: الحساب على «الراتب الأساسي» مقابل «الأجر الشامل» ينتج فروقًا ضخمة في المخصصات المحاسبية وفي مطالبات نهاية الخدمة.</p></div>

{q:"موظف في الإمارات راتبه الأساسي 6,000 درهم وخدمته 4 سنوات. كم تساوي مكافأته بالدرهم؟",t:"num",ans:16800,tol:1,unit:"درهم",why:"الأجر اليومي = 6000 ÷ 30 = 200. المكافأة = 200 × 21 × 4 = 16,800 درهم."},

{q:"منصة «قوى» في السعودية تُستخدم أساسًا في:",opts:["صرف الرواتب فقط","توثيق العقود وإدارة إجراءات العاملين إلكترونيًا","التدريب","التأمين الطبي"],a:1,why:"هي المنصة الرسمية لتوثيق العلاقة التعاقدية وإدارة خدمات العمل، بينما WPS يخص حماية الأجور."},

SECTIONS.push({id:"crisis",track:T.D,title:"إدارة الأزمات في الموارد البشرية",lede:"التسريح الجماعي، بلاغات التحرش، وفاة موظف، والتسريبات: ماذا تفعل ساعة بساعة.",
html:`
<h2>القواعد العامة لأي أزمة</h2>
<ol>
<li><strong>اجمع الحقائق قبل الرأي.</strong> لا تبنِ قرارًا على رواية طرف واحد.</li>
<li><strong>وثّق كل شيء</strong> بالتاريخ والساعة ومن حضر.</li>
<li><strong>حدد متحدثًا واحدًا</strong> للرسائل الداخلية والخارجية.</li>
<li><strong>تواصل مبكرًا حتى لو لم تكتمل المعلومات</strong> — الفراغ يملؤه الشائعات.</li>
<li><strong>افصل بين المعالجة والاتصال:</strong> فريق يعالج وفريق يبلّغ.</li>
<li><strong>راجع بعد انتهاء الأزمة</strong> واستخرج تعديلات السياسات.</li>
</ol>

<h2>أولًا: التسريح الجماعي (Layoff)</h2>
<div class="tbl"><table><thead><tr><th>المرحلة</th><th>الإجراء</th></tr></thead><tbody>
<tr><td>قبل القرار</td><td>استنفاد البدائل: تجميد التوظيف، خفض ساعات، نقل داخلي، إجازات بلا أجر اختيارية</td></tr>
<tr><td>تحديد المعايير</td><td>معايير مكتوبة وموضوعية (الدور لا الشخص)، ومراجعة قانونية لأثر تمييزي محتمل</td></tr>
<tr><td>التجهيز</td><td>حزمة الخروج، نصوص الإبلاغ، جدول اللقاءات، دعم إعادة التوظيف</td></tr>
<tr><td>يوم الإبلاغ</td><td>لقاءات فردية قصيرة يحضرها المدير + HR، صباحًا وبداية الأسبوع لا يوم الخميس</td></tr>
<tr><td>بعد الإبلاغ</td><td>اجتماع فوري للباقين: ما حدث، لماذا، وهل انتهى الأمر</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">الخطأ الأكبر</span><p>إهمال <strong>الناجين (Survivors)</strong>. من بقي يشعر بالذنب والخوف وانعدام الأمان، وإنتاجيته تنهار لأسابيع. اجتماع صريح في نفس اليوم يجيب على السؤال الوحيد الذي في رأس الجميع: «هل انتهت الموجة؟» — وإن كنت لا تعرف، قل ذلك بصراحة بدل وعد لن تفي به.</p></div>

<h2>ثانيًا: بلاغ تحرش أو تمييز</h2>
<ol>
<li><strong>استقبل البلاغ بجدية وحياد</strong> ولا تُقلل من شأنه ولا تَعِد بنتيجة محددة.</li>
<li><strong>وثّق الرواية بلغة المُبلِّغ</strong> نفسها.</li>
<li><strong>قيّم مخاطر فورية:</strong> هل يحتاج فصل مؤقت بين الطرفين؟ نقل مؤقت؟ إجازة مدفوعة أثناء التحقيق؟</li>
<li><strong>حماية من الانتقام:</strong> صرّح بها كتابةً وراقب تطبيقها.</li>
<li><strong>سرية مُدارة:</strong> لا وعود بسرية مطلقة، بل «لن يعلم إلا من يحتاج للعلم».</li>
<li><strong>تحقيق مستقل</strong> — ولو كان المشكو منه في موقع نفوذ، فليخرج التحقيق من نطاق سلطته تمامًا.</li>
<li><strong>إبلاغ الطرفين بالنتيجة</strong> في حدود ما يجوز الإفصاح عنه.</li>
</ol>

<h2>ثالثًا: وفاة موظف</h2>
<div class="grid">
<div class="card"><h4>خلال ساعات</h4><p>التحقق من الخبر رسميًا · إبلاغ الفريق المباشر شخصيًا لا عبر إيميل جماعي · تعيين منسق واحد للتواصل مع الأسرة.</p></div>
<div class="card"><h4>خلال أيام</h4><p>ترتيب العزاء · إيقاف الأنظمة الآلية (رسائل الحضور والتقييم) · دعم نفسي للفريق · مرونة في الحضور.</p></div>
<div class="card"><h4>الإجراءات</h4><p>صرف المستحقات للورثة وفق القانون · تعويضات التأمين · إنهاء التأمينات · التعامل مع مكتبه وأغراضه باحترام وبالتنسيق مع الأسرة.</p></div>
</div>
<div class="box tip"><span class="lbl">تفصيلة تُنسى</span><p>أوقف الأنظمة الآلية فورًا. رسالة «تأخرت عن البصمة» أو «حان موعد تقييمك» تصل لبريد موظف متوفى وتُرسَل نسخة لمديره — هذه اللحظات هي ما يتذكره الفريق سنوات.</p></div>

<h2>رابعًا: تسريب بيانات أو أزمة سمعة</h2>
<ul>
<li>احتواء فوري: إيقاف الوصول وتغيير الصلاحيات.</li>
<li>تحديد نطاق الضرر: ما البيانات؟ كم شخصًا؟ منذ متى؟</li>
<li>إخطار المتأثرين والجهات المختصة وفق القانون.</li>
<li>رسالة داخلية واحدة موحدة تسبق انتشار الرواية من الخارج.</li>
<li>مراجعة لاحقة: كيف حدث؟ وما الضابط الذي كان سيمنعه؟</li>
</ul>

<h2>كيف تقيس جاهزيتك للأزمات</h2>
<div class="tbl"><table><thead><tr><th>المؤشر</th><th>ما يكشفه</th></tr></thead><tbody>
<tr><td>زمن الاستجابة الأولى</td><td>من علم الحدث إلى أول رسالة رسمية — كل ساعة تأخير تملؤها الشائعات</td></tr>
<tr><td>نسبة الوصول للرسالة الأولى</td><td>كم موظفًا وصلته فعلًا، خصوصًا العمالة الميدانية</td></tr>
<tr><td>زمن إغلاق التحقيقات</td><td>البطء يضر بالطرفين ويُفقد المنظومة مصداقيتها</td></tr>
<tr><td>دوران الباقين بعد التسريح</td><td>ارتفاعه يعني إهمال «الناجين»</td></tr>
<tr><td>وجود خطة مكتوبة ومُختبَرة</td><td>خطة لم تُختبر مرة واحدة ليست خطة</td></tr>
<tr><td>الدروس المستفادة الموثقة والمطبَّقة</td><td>أزمة تتكرر بنفس السبب تعني أن المراجعة كانت شكلية</td></tr>
</tbody></table></div>`,

/* ========== الأخلاقيات المهنية ========== */
SECTIONS.push({id:"ethics",track:T.D,title:"الأخلاقيات المهنية ودراسات حالة",lede:"المواقف الرمادية التي لا يوجد فيها جواب واحد صحيح — وكيف تفكر فيها.",
html:`
<h2>المبادئ الخمسة</h2>
<div class="grid">
<div class="card"><h4><em>01</em> السرية</h4><p>لا تُفشِ معلومة إلا لمن يحتاج للعلم لأداء عمله، ولا تستخدمها لمصلحة شخصية.</p></div>
<div class="card"><h4><em>02</em> العدالة</h4><p>نفس المعيار لنفس الحالة، بغض النظر عن الشخص أو علاقته.</p></div>
<div class="card"><h4><em>03</em> الشفافية</h4><p>لا تَعِد بما لا تستطيع، ولا تُخفِ عن الموظف ما يؤثر في قراراته.</p></div>
<div class="card"><h4><em>04</em> عدم الإضرار</h4><p>وازن بين مصلحة المؤسسة وكرامة الفرد، ولا تجعل الكفاءة مبررًا للإذلال.</p></div>
<div class="card"><h4><em>05</em> الاستقلال المهني</h4><p>قدّم رأيك المهني حتى لو خالف رغبة الإدارة، ووثّقه.</p></div>
</div>

<h2>اختبار سريع لأي قرار رمادي</h2>
<div class="ascii">1. هل هو قانوني؟              -> لو لا، توقف.
2. هل هو متسق مع سياستنا؟      -> لو لا، لماذا الاستثناء؟ وثّقه.
3. هل أطبّقه على شخص آخر بنفس الطريقة؟
4. هل أستطيع شرحه علنًا أمام الجميع؟
5. كيف سيبدو لو نُشر غدًا؟</div>

<h2>دراسات حالة — لا جواب واحد صحيح</h2>
<div class="box ex"><span class="lbl">حالة 1</span><p><strong>الموقف:</strong> مدير تنفيذي يطلب منك راتب موظف في قسم آخر «للمقارنة فقط».<br><strong>التفكير:</strong> هل له صلاحية اطلاع على هذه البيانات ضمن دوره؟ ما الغرض المعلن؟ هل توجد قناة رسمية للحصول عليها؟ <strong>الاستجابة الأنسب</strong> غالبًا: عرض بيانات مجمّعة أو نطاقات درجات بدل رقم فردي، مع توثيق الطلب.</p></div>
<div class="box ex"><span class="lbl">حالة 2</span><p><strong>الموقف:</strong> موظفة تخبرك سرًا أنها حامل وتطلب ألا تُبلغ مديرها لأنها تخشى استبعادها من ترقية قادمة.<br><strong>التفكير:</strong> السرية واجبة والاستبعاد لهذا السبب تمييز غير مشروع. <strong>الاستجابة:</strong> احترام رغبتها في التوقيت، مع شرح ما سيتغير حين يصبح الإبلاغ ضروريًا لحقوقها، ومتابعة عملية الترقية بمعايير مكتوبة تمنع التحيّز.</p></div>
<div class="box ex"><span class="lbl">حالة 3</span><p><strong>الموقف:</strong> اكتشفت أن مدير قسم يوظّف أقاربه بشكل متكرر ونتائجهم مقبولة.<br><strong>التفكير:</strong> المشكلة ليست في كفاءة المعيّنين بل في <strong>سلامة العملية</strong> وأثرها على ثقة الآخرين. <strong>الاستجابة:</strong> سياسة إفصاح عن تعارض المصالح، وإخراج القريب من نطاق القرار، وليس بالضرورة إنهاء خدمة أحد.</p></div>
<div class="box ex"><span class="lbl">حالة 4</span><p><strong>الموقف:</strong> الإدارة تطلب منك «تلفيق» مبررات أداء لفصل موظف السبب الحقيقي لفصله شخصي.<br><strong>التفكير:</strong> هذا يتجاوز الرمادي إلى الخطأ الصريح. <strong>الاستجابة:</strong> ارفض التوثيق الكاذب، واعرض المسار القانوني السليم (إنهاء بتعويض) كتابةً — وثّق رأيك المهني.</p></div>
<div class="box ex"><span class="lbl">حالة 5</span><p><strong>الموقف:</strong> مرشح ممتاز لكن أحد المديرين يعترض بسبب «الشكل العام» أو السن أو الحالة الاجتماعية.<br><strong>الاستجابة:</strong> أعد الحوار إلى معايير البطاقة المكتوبة: أي نتيجة أو كفاءة تحديدًا لا يستوفيها؟ الاعتراض بلا معيار = تحيّز يجب تسميته بوضوح ومهني.</p></div>

<div class="box warn"><span class="lbl">الخط الأحمر</span><p>ثلاثة أشياء لا يجوز فيها تسوية: <strong>التوثيق الكاذب</strong> · <strong>إفشاء معلومة سرية لمنفعة</strong> · <strong>السكوت عن ضرر جسيم يقع على شخص</strong>. الوظيفة قد تُفقد، أما السمعة المهنية فلا تُستعاد.</p></div>
`,
quiz:[
{q:"مدير يطلب راتب موظف في قسم آخر «للمقارنة». الاستجابة المهنية الأنسب:",opts:["إعطاؤه الرقم فورًا","رفض الحديث نهائيًا","تقديم نطاق الدرجة أو بيانات مجمّعة بدل الرقم الفردي مع توثيق الطلب","إبلاغ الموظف صاحب الراتب"],a:2,why:"تُخدم الحاجة المشروعة للمقارنة دون كشف بيانات فردية، مع أثر موثّق يحمي الطرفين."},
{q:"في اختبار القرار الرمادي، السؤال «هل أستطيع شرحه علنًا؟» يكشف:",opts:["التكلفة","ما إذا كان القرار يعتمد على استثناء لا يمكن تبريره أمام الجميع","سرعة التنفيذ","رأي المدير"],a:1,why:"القرار الذي يحتاج إخفاءً غالبًا قرار غير عادل أو غير متسق مع السياسة."},
{q:"طلب توثيق مبررات أداء غير حقيقية لفصل موظف يُصنَّف:",opts:["موقفًا رماديًا يحتاج مفاضلة","خطأ صريح لا تسوية فيه","قرارًا إداريًا عاديًا","مسألة شكلية"],a:1,why:"التوثيق الكاذب تزوير يعرّض الشركة والممارس معًا لمسؤولية، ويتجاوز نطاق الاجتهاد المهني."},
{q:"في حالة توظيف الأقارب، جوهر المشكلة هو:",opts:["كفاءة المعيّنين","سلامة العملية وتعارض المصالح وأثره على ثقة الآخرين","تكلفة الرواتب","عدد الأقارب"],a:1,why:"حتى لو كان المعيّن كفئًا، فإن مشاركة القريب في قرار تعيينه تُفسد نزاهة العملية وتُضعف ثقة بقية الموظفين."},
{q:"اعتراض مدير على مرشح بسبب «الشكل العام» يُعالج بـ:",opts:["قبول رأيه لأنه المدير","إعادة الحوار إلى معايير البطاقة المكتوبة وطلب تحديد أي كفاءة لا يستوفيها","استبعاد المدير من التوظيف نهائيًا","تجاهل الاعتراض بصمت"],a:1,why:"إعادة النقاش إلى معيار مكتوب هي الأداة العملية لكشف التحيّز دون مواجهة شخصية عقيمة."},
{q:"صح أم خطأ: يجوز لممارس HR أن يعِد موظفًا بسرية مطلقة قبل سماع البلاغ.",t:"tf",a:1,why:"بعض البلاغات تُلزم بالتصعيد قانونًا أو أخلاقيًا؛ الوعد المطلق قد يستحيل الوفاء به فيهدم الثقة."},
{q:"«الاستقلال المهني» في HR يعني:",opts:["العمل بلا رئيس","تقديم رأيك المهني موثقًا حتى لو خالف رغبة الإدارة","رفض كل الطلبات","العمل بدوام جزئي"],a:1,why:"قيمتك تأتي من كونك مصدر رأي مهني موثوق لا مجرد منفّذ، وتوثيق الرأي يحمي الطرفين."}

SECTIONS.push({id:"startup",track:T.F,title:"الموارد البشرية في الشركات الناشئة",lede:"إذا كنت أول موظف HR في شركة صغيرة: ماذا تبني أولًا وبأي ترتيب.",
html:`
<h2>ترتيب البناء في أول 90 يومًا</h2>
<div class="tbl"><table><thead><tr><th>الأولوية</th><th>ما تبنيه</th><th>لماذا الآن</th></tr></thead><tbody>
<tr><td>1</td><td>الامتثال: عقود سليمة، تأمينات، ضرائب، ملفات مكتملة</td><td>أرخص المشكلات هي التي لم تحدث بعد</td></tr>
<tr><td>2</td><td>الرواتب: دورة منضبطة وقسائم واضحة</td><td>خطأ واحد هنا يهدم الثقة فورًا</td></tr>
<tr><td>3</td><td>الهيكل والمسميات ووصف وظيفي مبسط</td><td>بدونه يستحيل التوظيف أو التقييم</td></tr>
<tr><td>4</td><td>عملية توظيف موحدة وبطاقة معايير</td><td>التوظيف هو نشاطك الأكثر تكرارًا</td></tr>
<tr><td>5</td><td>تهيئة (Onboarding) بسيطة من صفحة واحدة</td><td>أعلى عائد لأقل مجهود</td></tr>
<tr><td>6</td><td>سياسات الحد الأدنى: إجازات، حضور، سلوك</td><td>وضوح يمنع نصف النزاعات</td></tr>
<tr><td>7</td><td>نطاقات أجور مبدئية</td><td>قبل أن تتراكم اختلالات يصعب إصلاحها</td></tr>
<tr><td>8</td><td>إيقاع تغذية راجعة خفيف (شهري)</td><td>بديل واقعي عن نظام تقييم ثقيل</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">القاعدة الحاكمة</span><p>في الشركة الناشئة، <strong>«جيد وموجود» يتفوق على «ممتاز ومؤجل»</strong>. سياسة إجازات من صفحة واحدة تُطبَّق اليوم أفضل من لائحة 60 صفحة تصدر بعد ستة أشهر.</p></div>

<h2>ما لا تفعله مبكرًا</h2>
<div class="box warn"><span class="lbl">تجنّب</span>
<ul style="margin:6px 0 0">
<li>شراء نظام HRIS ضخم لعشرين موظفًا — جدول منظم يكفي في البداية.</li>
<li>نسخ لوائح شركة كبيرة كما هي.</li>
<li>بناء مصفوفة جدارات من 40 بندًا.</li>
<li>نظام تقييم سنوي معقّد قبل أن يستقر الدور نفسه.</li>
<li>الوعد بمسارات ترقية لا تملك هيكلًا يدعمها.</li>
</ul></div>

<h2>تحديات خاصة بالنمو السريع</h2>
<div class="grid">
<div class="card"><h4>غموض الأدوار</h4><p>الجميع يفعل كل شيء — حتى تصبح المسؤوليات المشتركة سببًا للتعارض. الحل: تحديث الوصف الوظيفي كل ربع.</p></div>
<div class="card"><h4>ترقية المؤسسين الأوائل</h4><p>أول 5 موظفين يصبحون مديرين بحكم الأقدمية لا الجدارة. الحل: تدريب إداري مبكر أو استقدام قيادة من الخارج بشفافية.</p></div>
<div class="card"><h4>الثقافة تتحلل بعد 50</h4><p>ما كان يعمل بالتفاهم الضمني يحتاج الآن إلى كتابة صريحة.</p></div>
<div class="card"><h4>فجوات الأجور</h4><p>كل موظف تفاوض على راتبه منفردًا فنتج تشوّه. الحل: مسح داخلي وتصحيح تدريجي مخطط.</p></div>
</div>

<h2>مؤشرات تكفي في البداية</h2>
<div class="chips"><span class="chip">معدل الدوران</span><span class="chip">زمن إغلاق الشاغر</span><span class="chip">تكلفة العمالة كنسبة من المصروفات</span><span class="chip">اكتمال ملفات الموظفين</span><span class="chip">دقة كشف الرواتب</span></div>
`,

{q:"«جيد وموجود يتفوق على ممتاز ومؤجل» تعني:",opts:["قبول الرداءة","إطلاق نسخة بسيطة قابلة للتطبيق فورًا ثم تطويرها بدل انتظار الكمال","تجاهل الجودة","تأجيل السياسات"],a:1,why:"في بيئة سريعة التغير، السياسة غير الموجودة تكلّف أكثر بكثير من السياسة غير المثالية."},
{q:"أشهر مشكلة تظهر عند تجاوز الشركة الناشئة 50 موظفًا:",opts:["ارتفاع الرواتب","تحلل الثقافة الضمنية وحاجتها لكتابة صريحة","نقص المكاتب","كثرة العملاء"],a:1,why:"ما كان ينتقل بالمشاهدة والتفاهم في فريق صغير يحتاج إلى تدوين وتدريب حين يتضاعف العدد."},
{q:"ترقية الموظفين الأوائل إلى مديرين بحكم الأقدمية خطرها:",opts:["ارتفاع التكلفة فقط","تعيين مديرين بلا جدارة إدارية فيتضرر الفريق كله","بطء التوظيف","صعوبة المحاسبة"],a:1,why:"الأقدمية ليست مؤشرًا على القدرة على قيادة الآخرين، والفرق بين مساهم فردي ومدير فرق جوهري."},
{q:"صح أم خطأ: يُنصح بشراء نظام HRIS متكامل فور تأسيس الشركة.",t:"tf",a:1,why:"لعشرين موظفًا يكفي جدول منظم؛ تكلفة النظام وإدارته لا تُبرر إلا مع الحجم والتعقيد."},

<p><strong>السؤال:</strong> «مدير يريد فصل موظف فورًا اليوم. ماذا تفعل؟»</p>
<p><strong>إجابة ضعيفة:</strong> «أنفّذ طلب المدير.» أو «أرفض تمامًا.»</p>
<p><strong>إجابة قوية:</strong> أسأل عن السبب والوقائع والمستندات → أتحقق من وجود إنذارات سابقة وتحقيق → أشرح للمدير المخاطر القانونية والبدائل (PIP، نقل، إنهاء بالتراضي) → أوثّق توصيتي كتابةً → ثم يُتخذ القرار بعلم لا بانفعال.</p></div>
<div class="box ex"><span class="lbl">مثال 2</span>
<p><strong>السؤال:</strong> «معدل الدوران عندنا 35%. من أين تبدأ؟»</p>
<p><strong>إجابة قوية:</strong> أولًا أفكّك الرقم: أي قسم؟ أي مستوى؟ أول سنة أم بعدها؟ اختياري أم لا؟ مؤسف أم غير مؤسف؟ ثم أقارن بمعيار القطاع. ثم أجمع الأدلة من مقابلات الخروج ومسح الأجور واستبيان الاندماج. ثم أقترح تدخلين قابلين للقياس بدل خطة من عشرين بندًا.</p></div>
<div class="box ex"><span class="lbl">مثال 3</span>
<p><strong>السؤال:</strong> «موظف يشكو من مديره لك سرًا. ماذا تفعل؟»</p>
<p><strong>إجابة قوية:</strong> أستمع وأوثّق دون وعد بسرية مطلقة، أميّز بين خلاف أسلوب وبين مخالفة، أشجعه على معالجة مباشرة إن كان الأمر يحتمل، وأتدخل رسميًا إن كان يتضمن مخالفة أو نمطًا متكررًا — مع حماية من الانتقام.</p></div>

<h2>الأسئلة التي تسألها أنت</h2>
<ul>
<li>ما أكبر تحدٍ في الأفراد تواجهه الشركة الآن؟</li>
<li>لمن يتبع دور HR هنا؟ وما مساحة قراره؟</li>
<li>كيف تُتخذ قرارات الرواتب والترقيات حاليًا؟</li>
<li>ما معدل الدوران في آخر سنة وما تفسيركم له؟</li>
<li>ما الذي يجعلكم تعتبرون هذا الشخص ناجحًا بعد 6 أشهر؟</li>
</ul>
<div class="box tip"><span class="lbl">نصيحة</span><p>أسئلتك تكشف مستواك أكثر من إجاباتك. سؤال عن معدل الدوران وتفسيره يضعك فورًا في خانة من يفكر بالبيانات لا بالمهام.</p></div>

<h2>أخطاء تُسقط المرشح</h2>
<div class="box warn"><span class="lbl">تجنّب</span>
<ul style="margin:6px 0 0">
<li>الحديث بمصطلحات دون أمثلة تطبيقية.</li>
<li>ادعاء أن HR «تقف مع الموظف دائمًا» أو «مع الإدارة دائمًا».</li>
<li>الجهل بأرقام إنجازاتك السابقة.</li>
<li>عدم معرفة نشاط الشركة ونموذج ربحها.</li>
<li>إفشاء معلومات سرية من جهة عملك السابقة أثناء المقابلة — أسوأ إشارة ممكنة.</li>
</ul></div>

html:`
<div class="box def"><span class="lbl">لماذا تهم</span><p>كل قرار في الأجر أو التقييم أو تصميم الوظيفة يقوم — بوعي أو بدونه — على افتراض عن <strong>ما الذي يحرّك البشر</strong>. النظريات التالية تجعل هذا الافتراض ظاهرًا وقابلًا للنقاش بدل أن يبقى حدسًا.</p></div>

<h2>١. هرم ماسلو للحاجات</h2>
<div class="ascii">          تحقيق الذات      (نمو · إبداع · معنى)
        التقدير والاحترام  (إنجاز · مكانة · اعتراف)
      الحاجات الاجتماعية   (انتماء · صداقة · فريق)
    حاجات الأمان           (أمان وظيفي · تأمين · استقرار)
  الحاجات الفسيولوجية      (أجر يكفي · طعام · راحة)</div>
<p>الفكرة: الحاجة المُشبَعة تتوقف عن التحفيز، والانتقال للأعلى لا يحدث قبل إشباع ما تحته بدرجة معقولة.</p>
<div class="box ex"><span class="lbl">تطبيق</span><p>موظف يخشى على وظيفته بعد موجة تسريح (مستوى الأمان) لن يتحمّس لبرنامج «تحقيق الذات» ولا لورشة إبداع. عالج الأمان أولًا — بمصارحة عن مستقبل الشركة — قبل أي مبادرة تطوير.</p></div>
<div class="box warn"><span class="lbl">النقد</span><p>الأدلة التجريبية على الترتيب الهرمي الصارم ضعيفة، والبشر يسعون لعدة حاجات في وقت واحد. استخدمه كإطار تشخيصي لا كقانون.</p></div>

<h2>٢. نظرية ERG لألدرفر</h2>
<p>تبسيط لماسلو في ثلاث فئات: <strong>الوجود (Existence)</strong> · <strong>الارتباط (Relatedness)</strong> · <strong>النمو (Growth)</strong>. وأضافت مبدأ <strong>الإحباط–الارتداد</strong>: إذا أُحبط السعي لحاجة عليا، يرتد الشخص إلى المطالبة المكثفة بحاجة أدنى.</p>
<div class="box ex"><span class="lbl">تطبيق</span><p>موظف سُدّت أمامه فرص الترقية (نمو) يبدأ فجأة في المطالبة المتكررة بزيادة الراتب والبدلات (وجود). الزيادة ستُهدّئه مؤقتًا لأنها ليست الحاجة الحقيقية.</p></div>

<h2>٣. هيرزبرج — العاملان</h2>
<div class="tbl"><table><thead><tr><th>العوامل الصحية (Hygiene)</th><th>العوامل المحفزة (Motivators)</th></tr></thead><tbody>
<tr><td>الراتب · سياسات الشركة · ظروف العمل · العلاقة بالمشرف · الأمان الوظيفي</td><td>الإنجاز · التقدير · طبيعة العمل نفسه · المسؤولية · الترقي · النمو</td></tr>
<tr><td>غيابها يُسبب <strong>عدم الرضا</strong></td><td>وجودها يُسبب <strong>الرضا والتحفيز</strong></td></tr>
<tr><td>وجودها لا يُحفّز — بل يُحيّد فقط</td><td>غيابها لا يُسبب سخطًا بل حيادًا</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">الاستنتاج الأهم</span><p>عكس «عدم الرضا» ليس «الرضا» — بل «لا عدم رضا». لذلك رفع الرواتب يوقف الشكوى لكنه لا يصنع حماسًا. الحماس يأتي من إثراء الوظيفة نفسها (Job Enrichment).</p></div>
<div class="box ex"><span class="lbl">مثال</span><p>شركة رفعت الرواتب 20% فتوقفت الشكاوى شهرين ثم عادت الروح المعنوية لما كانت. لماذا؟ لأن المشكلة كانت في عمل رتيب بلا مسؤولية ولا تقدير — وهي عوامل محفزة لا صحية.</p></div>

<h2>٤. ماكجريجور — نظريتا X و Y</h2>
<div class="tbl"><table><thead><tr><th>نظرية X</th><th>نظرية Y</th></tr></thead><tbody>
<tr><td>الإنسان يكره العمل بطبعه</td><td>العمل طبيعي كاللعب والراحة</td></tr>
<tr><td>يحتاج رقابة وتهديدًا</td><td>يمارس التوجيه الذاتي إن التزم بالهدف</td></tr>
<tr><td>يتجنب المسؤولية ويفضل التوجيه</td><td>يسعى للمسؤولية ويتعلمها</td></tr>
<tr><td>← إدارة بالسيطرة والعقاب</td><td>← إدارة بالتمكين والمشاركة</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">النبوءة ذاتية التحقق</span><p>المدير الذي يفترض X يصمم رقابة خانقة، فيفقد الموظفون المبادرة، فيتأكد المدير أن افتراضه صحيح. والعكس صحيح مع Y. الافتراض يصنع الواقع الذي يبرره.</p></div>

<h2>٥. ماكليلاند — الحاجات المكتسبة</h2>
<div class="grid">
<div class="card"><h4>الحاجة للإنجاز (nAch)</h4><p>يسعى لأهداف متوسطة الصعوبة وتغذية راجعة فورية. مناسب للأدوار الفنية والمبيعات — وليس بالضرورة للإدارة.</p></div>
<div class="card"><h4>الحاجة للانتماء (nAff)</h4><p>يقدّر العلاقات والانسجام. ممتاز في خدمة العملاء والعمل الجماعي، وقد يتجنب القرارات الصعبة.</p></div>
<div class="card"><h4>الحاجة للقوة (nPow)</h4><p>يسعى للتأثير. «القوة المؤسسية» (لصالح المنظمة) هي أفضل مؤشر على نجاح المديرين، لا القوة الشخصية.</p></div>
</div>

<h2>٦. فروم — نظرية التوقع</h2>
<div class="formula">الدافعية = التوقع (Expectancy) × الوسيلية (Instrumentality) × التكافؤ (Valence)</div>
<ul>
<li><strong>التوقع:</strong> لو بذلت جهدًا، هل سأحقق الأداء؟</li>
<li><strong>الوسيلية:</strong> لو حققت الأداء، هل سأحصل على المكافأة فعلًا؟</li>
<li><strong>التكافؤ:</strong> هل هذه المكافأة تهمّني أصلًا؟</li>
</ul>
<div class="box warn"><span class="lbl">الضرب لا الجمع</span><p>لأنها معادلة ضرب، فإن <strong>صفرًا في أي عنصر يُصفّر الدافعية كلها</strong>. هدف مستحيل = توقع صفر. وعد سبق أن أُخلف = وسيلية صفر. جائزة لا يريدها الموظف = تكافؤ صفر.</p></div>
<div class="box ex"><span class="lbl">مثال</span><p>شركة أعلنت رحلة لتركيا لأفضل مندوب. النتيجة كانت باهتة، والسبب: مندوبان فقط يعتقدان أن لهما فرصة (توقع منخفض للباقين)، وثلاثة لديهم أطفال رضّع ولا يريدون السفر (تكافؤ صفر). لو كانت المكافأة نقدية ومتدرجة لتغيرت النتيجة.</p></div>

<h2>٧. آدامز — نظرية العدالة</h2>
<div class="formula">أقارن نسبتي (مخرجاتي ÷ مدخلاتي) بنسبة زميل مرجعي</div>
<p>عند الشعور بعدم العدالة يستعيد الشخص التوازن بأحد المسارات: تقليل جهده · المطالبة بزيادة · تغيير مرجع المقارنة · تشويه الإدراك · الانسحاب أو الاستقالة.</p>
<div class="box tip"><span class="lbl">درس عملي</span><p>الظلم النسبي يُحبط أكثر من الأجر المنخفض المتساوي. ولذلك تفشل الزيادات السرية غير المتسقة: يكتشفها الموظفون دائمًا، وتُحدث ضررًا أكبر من نفعها.</p></div>

<h2>٨. لوك — نظرية تحديد الأهداف</h2>
<ul>
<li>الأهداف <strong>المحددة والصعبة</strong> تنتج أداءً أعلى من «ابذل قصارى جهدك».</li>
<li>الشرطان الحاسمان: <strong>قبول الهدف</strong> و<strong>التغذية الراجعة</strong> عن التقدم.</li>
<li>المشاركة في وضع الهدف ترفع القبول — وهي أساس MBO و OKR.</li>
</ul>

<h2>٩. سكينر — التعزيز السلوكي</h2>
<div class="tbl"><table><thead><tr><th>الأسلوب</th><th>الفعل</th><th>الأثر</th></tr></thead><tbody>
<tr><td>تعزيز إيجابي</td><td>إضافة نتيجة مرغوبة</td><td>زيادة تكرار السلوك</td></tr>
<tr><td>تعزيز سلبي</td><td>إزالة شيء مزعج</td><td>زيادة تكرار السلوك</td></tr>
<tr><td>عقاب</td><td>إضافة نتيجة غير مرغوبة</td><td>كبت السلوك مؤقتًا</td></tr>
<tr><td>إطفاء</td><td>سحب التعزيز</td><td>تلاشي السلوك</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">تحذير</span><p>العقاب يقمع السلوك ولا يعلّم البديل الصحيح، وآثاره الجانبية (الخوف والإخفاء) مكلفة. التعزيز الإيجابي الفوري والمحدد أقوى بكثير من مكافأة سنوية عامة.</p></div>

html:`
<h2>أنماط القيادة الكلاسيكية (ليفين)</h2>
<div class="tbl"><table><thead><tr><th>النمط</th><th>الوصف</th><th>يصلح حين</th><th>خطره</th></tr></thead><tbody>
<tr><td>الأوتوقراطي</td><td>القائد يقرر منفردًا</td><td>الأزمات وقرارات الطوارئ</td><td>يقتل المبادرة والاحتفاظ بالكفاءات</td></tr>
<tr><td>الديمقراطي</td><td>يقرر بالمشاركة</td><td>الفرق الناضجة والقرارات المعقدة</td><td>بطء عند الحاجة للسرعة</td></tr>
<tr><td>الحر (Laissez-faire)</td><td>يترك الحرية الكاملة</td><td>الخبراء المستقلون</td><td>فوضى مع فرق غير ناضجة</td></tr>
</tbody></table></div>

<h2>القيادة الموقفية (هيرسي وبلانشارد)</h2>
<p>لا يوجد نمط أفضل مطلقًا — النمط يتحدد بـ <strong>نضج المرؤوس</strong> في المهمة المحددة:</p>
<div class="tbl"><table><thead><tr><th>مستوى النضج</th><th>الحالة</th><th>النمط المناسب</th></tr></thead><tbody>
<tr><td>M1</td><td>لا يستطيع ولا يريد</td><td><strong>التوجيه</strong> — تعليمات محددة ومتابعة لصيقة</td></tr>
<tr><td>M2</td><td>لا يستطيع لكنه يريد</td><td><strong>الإرشاد</strong> — شرح وإقناع مع توجيه</td></tr>
<tr><td>M3</td><td>يستطيع لكنه متردد</td><td><strong>المشاركة</strong> — دعم وتشجيع وتقليل التوجيه</td></tr>
<tr><td>M4</td><td>يستطيع ويريد</td><td><strong>التفويض</strong> — سلّمه المسؤولية وابتعد</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال</span><p>نفس الموظف قد يكون M4 في تقاريره المعتادة و M1 في نظام جديد بدأ العمل عليه أمس. الخطأ الشائع أن يعامله المدير بنمط واحد ثابت — فيخنقه في مهمة يتقنها، ويتركه تائهًا في مهمة جديدة.</p></div>

<h2>القيادة التحويلية مقابل التبادلية</h2>
<div class="tbl"><table><thead><tr><th>التبادلية (Transactional)</th><th>التحويلية (Transformational)</th></tr></thead><tbody>
<tr><td>مقايضة: أداء مقابل مكافأة</td><td>إلهام: رؤية ومعنى يتجاوز المصلحة الذاتية</td></tr>
<tr><td>إدارة بالاستثناء والتصحيح</td><td>تحفيز فكري وتطوير فردي واعتبار شخصي</td></tr>
<tr><td>تحافظ على الاستقرار</td><td>تصنع التغيير</td></tr>
</tbody></table></div>
<p class="hint">الأفضل عمليًا مزيج: نظام مكافآت عادل (تبادلي) + رؤية وتطوير (تحويلي).</p>

<h2>مصادر القوة (فرينش ورافن)</h2>
<div class="grid">
<div class="card"><h4>الشرعية</h4><p>من المنصب والصلاحية الرسمية.</p></div>
<div class="card"><h4>المكافأة</h4><p>القدرة على منح ما يريده الآخرون.</p></div>
<div class="card"><h4>الإكراه</h4><p>القدرة على العقاب — الأسرع أثرًا والأقصر عمرًا.</p></div>
<div class="card"><h4>الخبرة</h4><p>المعرفة والمهارة — من أقوى المصادر ديمومة.</p></div>
<div class="card"><h4>الإعجاب (المرجعية)</h4><p>احترام الآخرين ورغبتهم في الاقتداء.</p></div>
</div>
<div class="box tip"><span class="lbl">درس لممارس HR</span><p>سلطتك الرسمية في HR محدودة غالبًا. تأثيرك الحقيقي يأتي من <strong>الخبرة</strong> و<strong>المرجعية</strong> — أي أن يثق بك المديرون ويطلبون رأيك، لا أن تلوّح باللائحة.</p></div>

<h2>مراحل بناء الفريق (تاكمان)</h2>
<div class="ascii">التشكيل (Forming)   -> تهذيب وحذر وأسئلة كثيرة
العصف (Storming)    -> صراع أدوار وتوتر  <-- أخطر مرحلة
التنظيم (Norming)   -> اتفاق على القواعد
الأداء (Performing) -> إنتاجية عالية واستقلالية
الإنهاء (Adjourning)-> تفكك الفريق بعد المهمة</div>
<div class="box warn"><span class="lbl">الخطأ الشائع</span><p>المدير الذي يقمع مرحلة العصف حفاظًا على «الانسجام» يمنع الفريق من الوصول للتنظيم والأداء، فيبقى عالقًا في تهذيب سطحي وخلافات مدفونة.</p></div>

<h2>إدارة الصراع (توماس–كيلمان)</h2>
<div class="tbl"><table><thead><tr><th>الأسلوب</th><th>الحزم × التعاون</th><th>متى يُستخدم</th></tr></thead><tbody>
<tr><td>التنافس</td><td>حزم عالٍ / تعاون منخفض</td><td>قرارات طارئة أو مبدئية غير قابلة للتفاوض</td></tr>
<tr><td>التعاون</td><td>عالٍ / عالٍ</td><td>قضايا مهمة تحتاج حلًا يرضي الطرفين</td></tr>
<tr><td>التسوية</td><td>متوسط / متوسط</td><td>ضغط الوقت وأطراف متكافئة</td></tr>
<tr><td>التجنّب</td><td>منخفض / منخفض</td><td>قضايا تافهة أو تحتاج تهدئة مؤقتة</td></tr>
<tr><td>التكيّف</td><td>منخفض / عالٍ</td><td>حين تكون مخطئًا أو العلاقة أهم من الموضوع</td></tr>
</tbody></table></div>
<div class="box def"><span class="lbl">تمييز مهم</span><p><strong>الصراع الوظيفي</strong> (حول الأفكار والمهام) يحسّن جودة القرار. <strong>الصراع المُختل</strong> (شخصي وعلائقي) يدمّر الفريق. مهمة المدير ليست إنهاء الصراع بل <strong>تحويله من علائقي إلى موضوعي</strong>.</p></div>

<h2>الاتصال التنظيمي</h2>
<ul>
<li><strong>هابط:</strong> من الإدارة للموظفين — خطره الفقد والتشويه عبر المستويات.</li>
<li><strong>صاعد:</strong> من الموظفين للإدارة — خطره التجميل والفلترة.</li>
<li><strong>أفقي:</strong> بين الأقسام — أضعف حلقة في معظم المنظمات.</li>
<li><strong>غير رسمي (Grapevine):</strong> سريع وواسع الانتشار — لا يمكن إلغاؤه، لكن يمكن تجويعه بالمعلومة الرسمية السريعة.</li>
</ul>
<div class="box tip"><span class="lbl">قاعدة</span><p>الشائعة تنمو بمقدار (أهمية الموضوع × غموضه). لا تستطيع تقليل الأهمية، فقلّل الغموض.</p></div>

/* ========== قانون العمل المصري بالأرقام ========== */

html:`
<div class="box warn"><span class="lbl">تنبيه مهم</span><p>الأرقام التالية للاسترشاد التعليمي وليست استشارة قانونية، وبعضها (خصوصًا حدود أجر الاشتراك التأميني) <strong>يُحدَّث سنويًا</strong>. راجع دائمًا الجريدة الرسمية وموقعي وزارة العمل والهيئة القومية للتأمين الاجتماعي قبل أي إجراء.</p></div>

<h2>الإطار التشريعي</h2>
<div class="tbl"><table><thead><tr><th>القانون</th><th>الموضوع</th><th>ملاحظة</th></tr></thead><tbody>
<tr><td>14 لسنة 2025</td><td>قانون العمل</td><td>نُشر 3 مايو 2025 وسرى من 1 سبتمبر 2025، والمحاكم العمالية من 1 أكتوبر 2025</td></tr>
<tr><td>148 لسنة 2019</td><td>التأمينات الاجتماعية والمعاشات</td><td>حدود أجر الاشتراك تُحدَّث كل يناير</td></tr>
<tr><td>91 لسنة 2005 وتعديلاته (أحدثها 7 لسنة 2024)</td><td>الضريبة على الدخل</td><td>يحكم ضريبة كسب العمل</td></tr>
</tbody></table></div>

<h2>فترة الاختبار والفصل</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>الحكم</th></tr></thead><tbody>
<tr><td>فترة الاختبار</td><td>لا تزيد على <strong>3 أشهر</strong>، ولا يجوز التعيين تحت الاختبار أكثر من مرة لدى نفس صاحب العمل</td></tr>
<tr><td>الإنهاء دون إخطار</td><td>يلتزم صاحب العمل بتعويض يعادل أجر مدة الإخطار التي لم يراعها</td></tr>
<tr><td>الفصل دون مبرر مشروع</td><td>تعويض لا يقل عن <strong>أجر شهرين عن كل سنة خدمة</strong>، إضافة لمستحقات الإخطار</td></tr>
<tr><td>النطاق</td><td>لا يسري أصلًا على العاملين بأجهزة الدولة ولا عمال الخدمة المنزلية ما لم يرد نص خاص</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">أثر عملي مباشر</span><p>حد «أجر شهرين عن كل سنة» يجعل الفصل غير المبرر لموظف خدم 8 سنوات يكلّف <strong>16 شهر أجر على الأقل</strong> قبل حساب الإخطار. هذا وحده يجعل التوثيق السليم للأداء والتحقيقات استثمارًا لا بيروقراطية.</p></div>

<h2>ساعات العمل والراحة</h2>
<ul>
<li>الحد الأقصى لساعات <strong>وجود العامل بالمنشأة 12 ساعة</strong> في جميع الأحوال.</li>
<li>يلتزم صاحب العمل بوضع <strong>جدول ظاهر</strong> بمواعيد العمل وفترات الراحة ويوم الراحة الأسبوعية، وإخطار الجهة الإدارية بصورة منه وبأي تعديل خلال 7 أيام.</li>
<li>التشغيل في يوم الراحة الأسبوعية يستحق عنه <strong>مثل الأجر</strong> + يوم راحة بديل خلال الأسبوع التالي.</li>
</ul>

<h2>الإجازات</h2>
<div class="tbl"><table><thead><tr><th>النوع</th><th>المدة</th><th>ملاحظات</th></tr></thead><tbody>
<tr><td>السنوية — السنة الأولى</td><td>15 يومًا</td><td>منها أسبوع متصل على الأقل</td></tr>
<tr><td>السنوية — من السنة الثانية</td><td>21 يومًا</td><td>لا تُحتسب فيها الأعياد الرسمية والراحة الأسبوعية</td></tr>
<tr><td>السنوية — 10 سنوات أو سن 50+</td><td>30 يومًا</td><td>لدى صاحب عمل واحد أو أكثر</td></tr>
<tr><td>الأعمال الخطرة أو النائية</td><td>+7 أيام</td><td>بقرار من الوزير المختص</td></tr>
<tr><td>المرضية</td><td>3 أشهر بأجر كامل ثم 6 أشهر بـ85% ثم 3 أشهر بـ75% إن وُجد أمل في الشفاء</td><td>بتقرير الجهة الطبية المختصة، ويجوز تحويلها لسنوية من الرصيد</td></tr>
<tr><td>العارضة</td><td>7 أيام في السنة</td><td>تُخصم من الرصيد السنوي</td></tr>
<tr><td>الأبوة</td><td>يوم واحد بأجر يوم الولادة</td><td>حتى 3 مرات طوال الخدمة ولا يُخصم من الرصيد</td></tr>
<tr><td>رعاية الطفل</td><td>حتى سنتين بدون أجر</td><td>في المنشآت التي بها 50 عاملًا فأكثر، بعد سنة خدمة، حتى 3 مرات</td></tr>
<tr><td>الوضع</td><td>4 أشهر بأجر</td><td>حتى ثلاث مرات طوال مدة الخدمة</td></tr>
<tr><td>الحج</td><td>مرة واحدة بأجر</td><td>بعد خمس سنوات خدمة</td></tr>
</tbody></table></div>
<div class="box tip"><span class="lbl">قواعد إضافية</span>
<ul style="margin:6px 0 0">
<li>لا يجوز للعامل <strong>التنازل</strong> عن إجازته، وإذا رفضها كتابةً سقط حقه في بدلها.</li>
<li>تسوية رصيد الإجازات أو صرف بدله <strong>كل ثلاث سنوات على الأكثر</strong>.</li>
<li>يُحظر فصل العاملة أثناء إجازة الوضع أو بعدها مباشرة.</li>
<li>الاحتفاظ بملف العامل <strong>5 سنوات على الأقل</strong> بعد انتهاء العلاقة، ولحين صدور حكم بات إن كان هناك نزاع.</li>
<li>يقع باطلًا أي شرط ينتقص من حقوق العامل، أو إبراء منها خلال سريان العقد أو خلال <strong>3 أشهر</strong> من انتهائه.</li>
</ul></div>

<h2>مكافأة نهاية الخدمة</h2>
<div class="formula">نصف شهر عن كل سنة من الخمس الأولى + شهر كامل عن كل سنة تالية</div>
<p>تُستحق عند بلوغ سن الستين، <strong>ما لم تكن المدة مغطاة بالتأمينات الاجتماعية</strong> — وهذا الاستثناء مهم عمليًا لأن معظم العمالة المؤمَّن عليها تحصل على حقوقها عبر منظومة التأمينات لا عبر مكافأة من صاحب العمل.</p>

<h2>التأمينات الاجتماعية — أرقام 2026</h2>
<div class="tbl"><table><thead><tr><th>البند</th><th>القيمة</th></tr></thead><tbody>
<tr><td>الحد الأدنى لأجر الاشتراك (من يناير 2026)</td><td>2,700 جنيه</td></tr>
<tr><td>الحد الأقصى لأجر الاشتراك (من يناير 2026)</td><td>16,700 جنيه</td></tr>
<tr><td>حصة المؤمن عليه</td><td>11% من أجر الاشتراك</td></tr>
<tr><td>حصة صاحب العمل</td><td>18.75% من أجر الاشتراك</td></tr>
<tr><td>الإجمالي</td><td>29.75%</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال محلول</span>
<p>موظف أجره الشامل 20,000 جنيه في 2026.</p>
<p>أجر الاشتراك = <strong>16,700</strong> (الحد الأقصى، لأن أجره يتجاوزه).</p>
<p>حصة الموظف = <code>16,700 × 11% = 1,837</code></p>
<p>حصة صاحب العمل = <code>16,700 × 18.75% = 3,131.25</code></p>
<p>التكلفة التأمينية الكلية على الشركة = <code>4,968.25</code> جنيه شهريًا.</p>
<p class="hint">لاحظ: ارتفاع أجر الموظف فوق الحد الأقصى لا يزيد الاشتراك — وهذه نقطة مهمة في تقدير تكلفة العمالة.</p></div>

<h2>ضريبة كسب العمل</h2>
<p>الوعاء = إجمالي الدخل الخاضع − حصة الموظف في التأمينات − الإعفاء الشخصي السنوي (<strong>20,000 جنيه</strong> وفق القانون 7 لسنة 2024) − إعفاءات أخرى مقررة.</p>
<div class="tbl"><table><thead><tr><th>الشريحة السنوية (جنيه)</th><th>السعر</th></tr></thead><tbody>
<tr><td>حتى 40,000</td><td>0%</td></tr>
<tr><td>40,001 – 55,000</td><td>10%</td></tr>
<tr><td>55,001 – 70,000</td><td>15%</td></tr>
<tr><td>70,001 – 200,000</td><td>20%</td></tr>
<tr><td>200,001 – 400,000</td><td>22.5%</td></tr>
<tr><td>400,001 – 1,200,000</td><td>25%</td></tr>
<tr><td>أكثر من 1,200,000</td><td>27.5%</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">تنبيه فني</span><p>النظام المصري يطبّق قاعدة <strong>تلاشي الشرائح المنخفضة</strong> عند تجاوز مستويات دخل معينة، كما توجد تعديلات دورية. لا تعتمد على جدول محفوظ — استخدم أداة رسمية أو راجع منشورات مصلحة الضرائب لكل سنة.</p></div>

<h2>خطوات حساب صافي الراتب في مصر</h2>
<div class="ascii">1. احسب الأجر الشامل (أساسي + بدلات + حوافز)
2. حدد أجر الاشتراك التأميني (بين الحد الأدنى والأقصى)
3. اخصم حصة الموظف 11%
4. اطرح الإعفاء الشخصي (20,000 سنويًا = 1,666.67 شهريًا)
5. طبّق الشرائح على الوعاء السنوي واقسم على 12
6. اخصم الضريبة والسلف والجزاءات
7. الناتج = صافي الراتب</div>
`,

SECTIONS.push({id:"excel",track:T.H,title:"Excel للموارد البشرية",lede:"الدوال والصيغ التي تُستخدم فعليًا كل يوم — جاهزة للنسخ مع شرح لكل واحدة.",
html:`
<div class="box tip"><span class="lbl">قبل تبدأ</span><p>افترض دائمًا أن بياناتك في <strong>جدول Excel رسمي</strong> (Ctrl+T). الجداول تجعل الصيغ تقرأ أسماء الأعمدة بدل النطاقات، وتتوسع تلقائيًا مع البيانات الجديدة.</p></div>

<h2>١. البحث والمطابقة</h2>
<div class="tpl"><div class="tpl-h"><b>XLOOKUP — البديل الحديث لـ VLOOKUP</b><button class="copybtn">نسخ</button></div><pre>
' جلب راتب موظف برقمه الوظيفي
=XLOOKUP(A2, Emp[EmpID], Emp[Salary], "غير موجود")

' البحث من الأسفل للأعلى (آخر سجل مطابق - مفيد لآخر ترقية)
=XLOOKUP(A2, Hist[EmpID], Hist[NewGrade], "-", 0, -1)

' البحث بشرطين معًا (القسم + الدرجة)
=XLOOKUP(1, (T[Dept]=A2)*(T[Grade]=B2), T[MidPoint], "-")

' لمن لا يملك XLOOKUP: INDEX + MATCH
=INDEX(Emp[Salary], MATCH(A2, Emp[EmpID], 0))
</pre></div>
<p class="hint">لماذا لا VLOOKUP؟ لأنه يبحث في العمود الأول فقط، ويعتمد على رقم العمود الذي ينكسر عند إضافة أو حذف أعمدة.</p>

<h2>٢. التجميع الشرطي</h2>
<div class="tpl"><div class="tpl-h"><b>SUMIFS · COUNTIFS · AVERAGEIFS</b><button class="copybtn">نسخ</button></div><pre>
' إجمالي رواتب قسم معين
=SUMIFS(Emp[Salary], Emp[Dept], "المبيعات")

' عدد من تركوا العمل في 2026 من قسم معين
=COUNTIFS(Exit[Dept], A2, Exit[LeaveDate], ">="&DATE(2026,1,1),
          Exit[LeaveDate], "<="&DATE(2026,12,31))

' متوسط راتب الدرجة الرابعة للإناث
=AVERAGEIFS(Emp[Salary], Emp[Grade], 4, Emp[Gender], "أنثى")

' عدد الموظفين النشطين فقط
=COUNTIFS(Emp[Status], "نشط")

' تجميع بمعيار جزئي (كل من مسماه يحتوي كلمة "مدير")
=COUNTIFS(Emp[Title], "*مدير*")
</pre></div>

<h2>٣. التواريخ ومدة الخدمة</h2>
<div class="tpl"><div class="tpl-h"><b>DATEDIF · EDATE · NETWORKDAYS</b><button class="copybtn">نسخ</button></div><pre>
' مدة الخدمة بالسنوات الكاملة
=DATEDIF(B2, TODAY(), "y")

' مدة الخدمة نصًا: "5 سنوات و3 شهور"
=DATEDIF(B2,TODAY(),"y") & " سنوات و" & DATEDIF(B2,TODAY(),"ym") & " شهور"

' مدة الخدمة بالكسور العشرية (للحسابات)
=YEARFRAC(B2, TODAY())

' العمر الحالي
=DATEDIF(C2, TODAY(), "y")

' تاريخ انتهاء فترة الاختبار (3 شهور)
=EDATE(B2, 3)

' أيام العمل الفعلية بين تاريخين مع استبعاد العطلات الرسمية
=NETWORKDAYS.INTL(D2, E2, "1000001", Holidays[Date])

' تنبيه انتهاء العقد خلال 30 يومًا
=IF(AND(F2>=TODAY(), F2<=TODAY()+30), "ينتهي قريبًا", "")
</pre></div>
<p class="hint">في <code>NETWORKDAYS.INTL</code> السلسلة "1000001" تعني: الاثنين عطلة والأحد عطلة — عدّلها حسب أسبوع العمل عندك (الترتيب من الاثنين للأحد، و1 = عطلة).</p>

<h2>٤. حسابات الرواتب والدرجات</h2>
<div class="tpl"><div class="tpl-h"><b>الأجر · Compa-Ratio · الشرائح</b><button class="copybtn">نسخ</button></div><pre>
' Compa-Ratio
=IFERROR(C2 / XLOOKUP(D2, Grades[Grade], Grades[MidPoint]), "")

' موقع الموظف داخل نطاق درجته (0% = الحد الأدنى، 100% = الأقصى)
=(C2 - MinG) / (MaxG - MinG)

' تنبيه تجاوز سقف الدرجة
=IF(C2 > XLOOKUP(D2, Grades[Grade], Grades[Max]), "فوق السقف", "")

' أجر الاشتراك التأميني بين حدين
=MEDIAN(MinIns, C2, MaxIns)

' ضريبة تصاعدية بالشرائح (SUMPRODUCT - أنظف من IF المتداخلة)
=SUMPRODUCT(--(Base>Limits), (Base-Limits), Rates)
' حيث Limits حدود الشرائح و Rates الفروق بين الأسعار المتتالية

' التقريب لأقرب 50
=MROUND(C2, 50)
</pre></div>

<h2>٥. مؤشرات HR</h2>
<div class="tpl"><div class="tpl-h"><b>الدوران · الغياب · الاستبقاء</b><button class="copybtn">نسخ</button></div><pre>
' معدل الدوران %
=Leavers / AVERAGE(HeadStart, HeadEnd)

' معدل الدوران لكل قسم (صيغة واحدة تُسحب)
=COUNTIFS(Exit[Dept],A2) / AVERAGE(
   COUNTIFS(Emp[Dept],A2,Emp[JoinDate],"<"&StartDate),
   COUNTIFS(Emp[Dept],A2,Emp[Status],"نشط"))

' نسبة من تركوا خلال أول سنة
=COUNTIFS(Exit[Tenure],"<1") / COUNTA(Exit[EmpID])

' معدل الغياب
=SUM(Att[AbsentDays]) / (COUNTA(Emp[EmpID]) * WorkDays)

' eNPS
=(COUNTIF(S[Score],">=9") - COUNTIF(S[Score],"<=6")) / COUNTA(S[Score])

' FTE
=SUMPRODUCT(Emp[FTEFactor])
</pre></div>

<h2>٦. التنظيف والتحقق</h2>
<div class="tpl"><div class="tpl-h"><b>تنظيف البيانات وكشف الأخطاء</b><button class="copybtn">نسخ</button></div><pre>
' إزالة المسافات الزائدة والأحرف غير المرئية
=TRIM(CLEAN(A2))

' كشف التكرار في الأرقام القومية
=IF(COUNTIF(Emp[NationalID], A2)>1, "مكرر", "")

' التحقق من طول الرقم القومي (14 رقمًا)
=IF(LEN(TRIM(A2))<>14, "طول غير صحيح", "سليم")

' توحيد صيغة الاسم
=PROPER(TRIM(A2))

' فصل الاسم الأول والأخير
=TEXTBEFORE(A2," ")        &  =TEXTAFTER(A2," ",-1)

' كشف الملفات الناقصة
=IF(COUNTBLANK(B2:H2)>0, "ملف ناقص: "&COUNTBLANK(B2:H2)&" حقول", "مكتمل")

' مطابقة قائمتين (من في كشف الرواتب وليس في التأمينات)
=IF(ISNA(XLOOKUP(A2, Ins[ID], Ins[ID])), "غير مؤمّن عليه", "")
</pre></div>

<h2>٧. التنسيق الشرطي — قواعد مفيدة</h2>
<div class="tbl"><table><thead><tr><th>الغرض</th><th>الصيغة في «قاعدة بصيغة»</th></tr></thead><tbody>
<tr><td>تلوين عقود تنتهي خلال 60 يومًا</td><td><code>=AND($F2>=TODAY(), $F2<=TODAY()+60)</code></td></tr>
<tr><td>تمييز من هم تحت الحد الأدنى للدرجة</td><td><code>=$C2 &lt; $G2</code></td></tr>
<tr><td>تمييز الصف كله لمن ترك العمل</td><td><code>=$H2="منتهي"</code></td></tr>
<tr><td>تمييز غياب يتجاوز 5 أيام</td><td><code>=$D2&gt;5</code></td></tr>
</tbody></table></div>
<p class="hint">لاحظ علامة <code>$</code> قبل حرف العمود فقط — هذه هي الحيلة التي تجعل القاعدة تلوّن الصف كاملًا.</p>

<h2>٨. الجداول المحورية و Power Query</h2>
<div class="box ex"><span class="lbl">متى تستخدم أيهما؟</span>
<p><strong>Pivot Table:</strong> عندك بيانات نظيفة في ورقة واحدة وتريد تلخيصها سريعًا (متوسط الراتب لكل قسم ودرجة).</p>
<p><strong>Power Query:</strong> عندك تقرير يتكرر شهريًا، أو بيانات من عدة ملفات/أنظمة تحتاج دمجًا وتنظيفًا. تبنيه مرة، وكل شهر تضغط <strong>Refresh</strong> فقط.</p></div>
<div class="tpl"><div class="tpl-h"><b>سير عمل Power Query لتقرير رواتب شهري</b><button class="copybtn">نسخ</button></div><pre>
1. Data > Get Data > From Folder  (مجلد ملفات الرواتب الشهرية)
2. Combine & Transform
3. احذف الأعمدة غير المستخدمة (Remove Other Columns)
4. غيّر أنواع البيانات (تاريخ / عدد عشري / نص)
5. Replace Errors -> null   ثم   Fill Down عند الحاجة
6. Unpivot Columns لتحويل أعمدة البدلات إلى صفوف
7. Merge Queries مع جدول الموظفين لجلب القسم والدرجة
8. Add Custom Column:  = [Basic] + [Allow] + [Incent]
9. Close & Load To > PivotTable Report
10. كل شهر: ضع الملف الجديد في المجلد ثم Refresh All
</pre></div>

<h2>٩. اختصارات توفر ساعات</h2>
<div class="tbl"><table><thead><tr><th>الاختصار</th><th>الوظيفة</th></tr></thead><tbody>
<tr><td><code>Ctrl + T</code></td><td>تحويل النطاق إلى جدول رسمي</td></tr>
<tr><td><code>Ctrl + Shift + L</code></td><td>تشغيل/إيقاف الفلاتر</td></tr>
<tr><td><code>Alt + =</code></td><td>جمع تلقائي</td></tr>
<tr><td><code>Ctrl + E</code></td><td>التعبئة السريعة (Flash Fill)</td></tr>
<tr><td><code>Ctrl + Shift + سهم</code></td><td>تحديد حتى نهاية البيانات</td></tr>
<tr><td><code>F4</code></td><td>تثبيت المرجع ($) / تكرار آخر إجراء</td></tr>
<tr><td><code>Ctrl + ;</code></td><td>إدراج تاريخ اليوم</td></tr>
<tr><td><code>Alt + N + V</code></td><td>إنشاء جدول محوري</td></tr>
</tbody></table></div>

<div class="box warn"><span class="lbl">أخطاء تكلّف غاليًا</span>
<ul style="margin:6px 0 0">
<li>دمج الخلايا (Merge) في جداول البيانات — يكسر الفرز والجداول المحورية.</li>
<li>كتابة الأرقام كنص (تظهر بمثلث أخضر) فتفشل كل عمليات الجمع.</li>
<li>صفوف أو أعمدة فارغة داخل الجدول — تقطع النطاقات.</li>
<li>حفظ نسخ متعددة بأسماء مثل «نهائي 3» بدل نسخة واحدة محدّثة.</li>
<li>ترك البيانات الشخصية في ملفات غير محمية بكلمة مرور.</li>
</ul></div>

SECTIONS.push({id:"ai",track:T.H,title:"الذكاء الاصطناعي في الموارد البشرية",lede:"أين يفيد فعلًا، أين يجب ألا يُستخدم، وبرومبتات جاهزة للنسخ.",

<div class="box warn"><span class="lbl">ثلاث قواعد غير قابلة للتفاوض</span>
<ol style="margin:6px 0 0">
<li><strong>لا تُدخل بيانات شخصية</strong> (أسماء، أرقام قومية، رواتب فردية، شكاوى) في أدوات عامة. جرّدها أو استخدم أداة مؤسسية معتمدة.</li>
<li><strong>القرار النهائي بشري دائمًا</strong> في أي شيء يمسّ مصير شخص: توظيف، ترقية، تأديب، إنهاء.</li>
<li><strong>راجع المخرجات قانونيًا</strong> — النماذج تخترع تفاصيل وتخلط تشريعات بين الدول بثقة تامة.</li>
</ol></div>

<h2>بنية البرومبت الفعّال</h2>
<div class="ascii">الدور    : أنت أخصائي موارد بشرية بخبرة 10 سنوات في قطاع ...
السياق   : شركتنا حجمها ... في مجال ... والمشكلة هي ...
المهمة   : اكتب / حلّل / لخّص ...
القيود   : لا يزيد عن ... · تجنّب ... · التزم بـ ...
الصيغة   : جدول بأعمدة ... / نقاط مرقمة / نص جاهز للإرسال
المعيار  : ما الذي يجعل الناتج جيدًا؟</div>

<h2>برومبتات جاهزة</h2>
<div class="tpl"><div class="tpl-h"><b>1. كتابة وصف وظيفي</b><button class="copybtn">نسخ</button></div><pre>
أنت أخصائي موارد بشرية خبير في تحليل وتوصيف الوظائف.

السياق: شركة [النشاط] حجمها [العدد] موظفًا في [الدولة].
نحتاج وصفًا وظيفيًا لدور: [المسمى]، يتبع: [الجهة].

اكتب وصفًا وظيفيًا يتضمن:
1. غرض الوظيفة في جملة واحدة
2. من 5 إلى 7 مسؤوليات رئيسية، كل واحدة تبدأ بفعل قابل للملاحظة
3. من 3 إلى 5 مؤشرات نجاح قابلة للقياس
4. المؤهلات والخبرة المطلوبة
5. المهارات الفنية والسلوكية

القيود:
- تجنب العبارات العامة مثل "يقوم بالمهام الموكلة إليه"
- تجنب أي صياغة قد توحي بتمييز على أساس السن أو الجنس أو الحالة الاجتماعية
- اللغة العربية الفصحى المبسطة
- لا يزيد الإجمالي عن 400 كلمة

في النهاية: اذكر 3 نقاط أحتاج التحقق منها معك قبل الاعتماد.
</pre></div>

<div class="tpl"><div class="tpl-h"><b>2. توليد أسئلة مقابلة قائمة على الجدارات</b><button class="copybtn">نسخ</button></div><pre>
أنت مصمم مقابلات منظمة.

الدور: [المسمى]
الجدارات المستهدفة: [مثال: حل المشكلات، التعاون، تحمل الضغط]

لكل جدارة، أعطني:
- سؤالًا سلوكيًا واحدًا بصيغة STAR (عن واقعة حدثت فعلًا)
- سؤالي متابعة لاستخراج الفعل الشخصي لا الجماعي
- مؤشرات إجابة قوية (3 نقاط)
- مؤشرات إجابة ضعيفة أو علامات تحذير (3 نقاط)

القيود:
- لا أسئلة افتراضية من نوع "ماذا ستفعل لو"
- لا أسئلة عن الحياة الشخصية أو الأسرة أو الخطط الإنجابية
- أخرج الناتج في جدول

ثم اقترح مقياس تقييم من 1 إلى 5 بوصف سلوكي لكل درجة.
</pre></div>

<div class="tpl"><div class="tpl-h"><b>3. تحليل مقابلات الخروج (بيانات مجرّدة)</b><button class="copybtn">نسخ</button></div><pre>
أنت محلل بيانات موارد بشرية.

سألصق لك ملخصات مقابلات خروج مجهولة الهوية (بلا أسماء).

المطلوب:
1. صنّف كل حالة إلى سبب رئيسي واحد فقط من:
   الأجر / المسار الوظيفي / المدير المباشر / عبء العمل /
   الثقافة / ظروف شخصية / فرصة أفضل / أخرى
2. اذكر تكرار كل سبب ونسبته المئوية
3. استخرج 3 أنماط متكررة مع اقتباس قصير يوضح كل نمط
4. ميّز بين الأسباب القابلة للمعالجة من الشركة وغير القابلة
5. اقترح تدخلين فقط — الأعلى أثرًا والأقل تكلفة — مع مؤشر قياس لكل منهما

القيود:
- لا تخترع أسبابًا غير مذكورة في النصوص
- إذا كانت العينة أصغر من أن تدعم استنتاجًا، قل ذلك صراحة

النصوص:
[ألصق هنا]
</pre></div>

<div class="tpl"><div class="tpl-h"><b>4. صياغة سياسة داخلية</b><button class="copybtn">نسخ</button></div><pre>
أنت متخصص في كتابة سياسات الموارد البشرية.

اكتب مسودة سياسة [الموضوع: مثال العمل عن بُعد] لشركة
[النشاط] في [الدولة]، حجمها [العدد] موظفًا.

هيكل السياسة:
1. الغرض
2. النطاق (من تشمله ومن تستثنيه)
3. التعريفات
4. الأحكام التفصيلية
5. المسؤوليات (الموظف / المدير / الموارد البشرية)
6. حالات الاستثناء وآلية اعتمادها
7. تاريخ السريان والمراجعة

القيود:
- لغة واضحة يفهمها موظف غير متخصص
- لا تذكر مواد قانونية بأرقام محددة (سأراجعها مع المستشار القانوني)
- أضف في النهاية قائمة "نقاط تحتاج قرارًا من الإدارة" بدل افتراضها
</pre></div>

<div class="tpl"><div class="tpl-h"><b>5. مسودة رسالة حساسة</b><button class="copybtn">نسخ</button></div><pre>
أنت مستشار اتصال داخلي.

الموقف: [اشرح الموقف بإيجاز دون أسماء]
الجمهور: [مثال: كل موظفي الشركة / فريق مكوّن من 12 شخصًا]
الهدف من الرسالة: [مثال: إبلاغهم بتغيير سياسة الحضور]
النبرة المطلوبة: [صريحة ومحترمة / تعاطفية / رسمية]

اكتب لي 3 صياغات مختلفة الاستراتيجية لا النبرة فقط:
- صياغة تركز على الشفافية الكاملة
- صياغة تركز على الطمأنة وتقليل القلق
- صياغة موجزة وعملية

لكل صياغة: اذكر ما الذي تكسبه وما الذي تخاطر به.
لا تزد كل صياغة عن 180 كلمة.
</pre></div>

<div class="tpl"><div class="tpl-h"><b>6. مراجعة إعلان وظيفي من التحيّز</b><button class="copybtn">نسخ</button></div><pre>
راجع إعلان الوظيفة التالي وحدد:

1. أي عبارة قد تُقصي فئة بلا مبرر وظيفي حقيقي
   (السن، الجنس، الحالة الاجتماعية، المظهر، الجنسية)
2. أي متطلب مبالغ فيه لا يخدم الأداء الفعلي
   (مثل اشتراط سنوات خبرة أكثر مما يتطلبه الدور)
3. أي لغة قد تقلل تقدّم فئة معينة دون قصد
4. اقترح بديلًا لكل ملاحظة

أعطني الناتج في جدول: العبارة الأصلية | المشكلة | البديل المقترح

الإعلان:
[ألصق هنا]
</pre></div>

<h2>التحيّز الخوارزمي — ما يجب أن تعرفه</h2>
<div class="box ex"><span class="lbl">كيف يحدث</span><p>النموذج يتعلم من قرارات سابقة. لو كانت الشركة تاريخيًا توظف من فئة معينة، سيتعلم النموذج أن سمات هذه الفئة «مؤشر نجاح» ويستبعد غيرها — <strong>بكفاءة عالية ومظهر موضوعي يصعب الطعن فيه</strong>. الأخطر أنه قد يستدل على الخاصية المحمية من متغيرات بديلة (اسم المدرسة، الحي، فجوة في السيرة الذاتية) حتى لو حذفت الخاصية نفسها.</p></div>
<p><strong>الضوابط الثلاثة:</strong> مراجعة بشرية لكل قرار سلبي · اختبار الأثر التمييزي دوريًا على نتائج الأداة · القدرة على تفسير سبب الترشيح أو الاستبعاد بلغة مفهومة.</p>

{q:"في بنية البرومبت الفعّال، عنصر «القيود» يخدم أساسًا:",opts:["إطالة الإجابة","تحديد ما يجب تجنبه وحدود الطول والصياغة لتقليل المراجعة اللاحقة","إظهار الخبرة","تسريع الاستجابة"],a:1,why:"القيود الواضحة هي ما يفرّق بين مخرَج صالح للاستخدام ومخرَج عام يحتاج إعادة كتابة كاملة."},

["Collective Bargaining","المفاوضة الجماعية","تفاوض بين ممثلي العمال وصاحب العمل على شروط العمل والأجور.","Negotiation between worker representatives and the employer over terms and wages.","er"],
["Whistleblowing","الإبلاغ عن المخالفات","إبلاغ الموظف عن مخالفة داخلية عبر قناة تحمي هويته من الانتقام.","An employee reporting internal wrongdoing through a channel that protects them from retaliation.","er"],

["Offboarding","إنهاء الخدمة والخروج","الإجراءات المنظمة عند انتهاء علاقة العمل من التسليم حتى المستحقات.","The structured process at the end of employment, from handover through final settlement.","er"],

["Attrition","التناقص الطبيعي","انخفاض عدد الموظفين دون إحلال، غالبًا بالاستقالة أو التقاعد.","A reduction in headcount without replacement, typically through resignation or retirement.","er"],
["Regretted Attrition","الترك المؤسف","رحيل موظفين كانت المنظمة ترغب في الاحتفاظ بهم.","Departures of employees the organization would have preferred to retain.","er"],
["Retention","الاستبقاء","قدرة المنظمة على الاحتفاظ بموظفيها لا سيما ذوي الأداء العالي.","An organization's ability to keep its employees, particularly high performers.","er"],
["Absenteeism","الغياب","نسبة أيام الغياب غير المخطط إلى أيام العمل المتاحة.","The ratio of unplanned absence days to available working days.","er"],

/* ========== التكلفة الكاملة للموظف وميزانية HR ========== */
SECTIONS.push({id:"ctc",track:T.I,title:"تكلفة الموظف وميزانية الموارد البشرية",lede:"الراتب ليس التكلفة: كيف تحسب Cost to Company وتبني ميزانية HR سنوية تُعتمد من الإدارة.",
html:`
<h2>التكلفة الكاملة للموظف (Cost to Company)</h2>
<div class="box def"><span class="lbl">القاعدة</span><p>الراتب الظاهر في العقد يمثل عادةً <strong>60–75% فقط</strong> من التكلفة الحقيقية للموظف. من يخطط بالراتب وحده يبني ميزانية ناقصة بالثلث.</p></div>
<div class="tbl"><table><thead><tr><th>البند</th><th>الوصف</th><th>ملاحظة</th></tr></thead><tbody>
<tr><td>الأجر الإجمالي</td><td>أساسي + بدلات + حوافز متوقعة</td><td>ادخل الحوافز بالمتوقع لا بالحد الأقصى</td></tr>
<tr><td>حصة صاحب العمل في التأمينات</td><td>نسبة قانونية على أجر الاشتراك</td><td>غالبًا أكبر بند مخفي</td></tr>
<tr><td>مخصص نهاية الخدمة</td><td>يُجنَّب سنويًا لا عند الخروج</td><td>إغفاله يُنتج صدمة مالية لاحقًا</td></tr>
<tr><td>التأمين الطبي</td><td>وثيقة الموظف والمعالين</td><td>يرتفع سنويًا بمعدل التضخم الطبي</td></tr>
<tr><td>مخصص الإجازات</td><td>رصيد غير مستخدم كالتزام مالي</td><td>التزام قائم حتى لو لم يُصرف</td></tr>
<tr><td>التكلفة المكانية</td><td>إيجار ومرافق وأثاث لكل مقعد</td><td>تنخفض في العمل الهجين</td></tr>
<tr><td>التقنية</td><td>جهاز وتراخيص برمجيات وهاتف</td><td>وزّع كلفة الجهاز على عمره الافتراضي</td></tr>
<tr><td>التوظيف والإحلال</td><td>تكلفة التعيين موزعة على مدة البقاء المتوقعة</td><td>ترتفع مع ارتفاع الدوران</td></tr>
<tr><td>التدريب</td><td>ميزانية الفرد السنوية</td><td>استثمار لا مصروف</td></tr>
<tr><td>الوقت غير المنتج</td><td>الإجازات والأعياد والتدريب</td><td>يقلل الساعات القابلة للفوترة</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال محلول</span>
<p>موظف أجره الشامل 20,000 شهريًا (240,000 سنويًا).</p>
<p>+ تأمينات صاحب العمل 37,575 · + مخصص نهاية خدمة 10,000 · + تأمين طبي 18,000 · + مخصص إجازات 14,000 · + مكان وتقنية 24,000 · + إحلال وتدريب 15,000</p>
<p><strong>التكلفة الكاملة ≈ 358,575 جنيه سنويًا</strong> — أي أن الراتب يمثل 67% فقط من التكلفة الفعلية.</p>
<p class="hint">أثر ذلك عمليًا: توفير موظفين اثنين لا يوفر 480 ألفًا بل نحو 717 ألفًا — وهذا ما يجب أن تعرضه على الإدارة المالية.</p></div>

<h2>بنود ميزانية HR السنوية</h2>
<div class="grid">
<div class="card"><h4>تكلفة القوى العاملة</h4><p>الأجور والزيادات والحوافز والتأمينات والمخصصات — أكبر بند وأكثره حساسية.</p></div>
<div class="card"><h4>التوظيف</h4><p>الإعلانات، وكالات التوظيف، أدوات الفرز، معارض الجامعات، مكافآت الترشيح.</p></div>
<div class="card"><h4>التعلم والتطوير</h4><p>البرامج والمدربون والشهادات والمنصات ووقت التدريب.</p></div>
<div class="card"><h4>الأنظمة والتقنية</h4><p>اشتراكات HRIS و ATS و LMS وأدوات الاستبيانات.</p></div>
<div class="card"><h4>الاندماج والثقافة</h4><p>الفعاليات وبرامج التقدير والاستبيانات.</p></div>
<div class="card"><h4>الاستشارات والامتثال</h4><p>استشارات قانونية، مسوح رواتب، تدقيق، شهادات.</p></div>
<div class="card"><h4>فريق HR نفسه</h4><p>رواتب الفريق وتطويره وسفره.</p></div>
<div class="card"><h4>احتياطي الطوارئ</h4><p>5–10% لتغطية تعيينات غير مخططة أو تسويات.</p></div>
</div>

<h2>ثلاث طرق لبناء الميزانية</h2>
<div class="tbl"><table><thead><tr><th>الطريقة</th><th>الفكرة</th><th>متى تناسب</th></tr></thead><tbody>
<tr><td>تزايدية (Incremental)</td><td>ميزانية العام الماضي + نسبة زيادة</td><td>الاستقرار وقلة التغيير — لكنها تُرحّل الهدر</td></tr>
<tr><td>صفرية (Zero-Based)</td><td>كل بند يُبرَّر من الصفر كل سنة</td><td>ضغط التكلفة وإعادة الهيكلة — مجهدة لكنها تكشف الهدر</td></tr>
<tr><td>مبنية على المحركات (Driver-Based)</td><td>ربط البنود بمحرك أعمال: عدد الفروع، حجم المبيعات، الإنتاج</td><td>النمو السريع وتغيّر الحجم</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال على الطريقة المبنية على المحركات</span><p>بدل «ميزانية توظيف 500 ألف»، اكتب: «كل فرع جديد يحتاج 12 موظفًا، وتكلفة التعيين 5,000 لكل واحد، والخطة 4 فروع ← 4 × 12 × 5,000 = 240 ألفًا». هذه الصياغة تصمد أمام أي سؤال، وتتعدل تلقائيًا لو تغيرت خطة التوسع.</p></div>

<h2>الدفاع عن الميزانية أمام الإدارة</h2>
<ol>
<li><strong>اربط كل بند بنتيجة عمل</strong> لا بنشاط: «برنامج الاستبقاء يخفض الدوران 4% = توفير 1.2 مليون» أفضل من «ميزانية تدريب».</li>
<li><strong>قدّم سيناريوهات</strong>: أساسي · متحفظ · طموح — مع أثر كل منها.</li>
<li><strong>افصل الإلزامي عن الاختياري</strong>: التأمينات والامتثال ليست موضع نقاش.</li>
<li><strong>اعرض تكلفة عدم الفعل</strong>: ما تكلفة بقاء الدوران على ما هو عليه؟</li>
<li><strong>تتبّع الانحراف شهريًا</strong> واشرح أسبابه قبل أن يُسأل عنها.</li>
</ol>

/* ========== HR والقوائم المالية ========== */
SECTIONS.push({id:"hrfinance",track:T.I,title:"الموارد البشرية والقوائم المالية",lede:"تقرأ P&L إزاي، وتترجم مبادرات الأفراد إلى لغة الهامش والإيراد وتقرير مجلس الإدارة.",
html:`
<div class="box def"><span class="lbl">لماذا هذا القسم</span><p>الفارق الأكبر بين HR إداري و HR استراتيجي ليس عدد الشهادات — بل <strong>القدرة على الحديث بلغة الأرقام</strong>. من لا يفهم كيف تربح شركته لا يستطيع أن يقترح كيف تتحسن.</p></div>

<h2>قائمة الدخل (P&amp;L) في دقيقتين</h2>
<div class="ascii">الإيرادات (Revenue)
- تكلفة المبيعات (COGS)      <-- أجور الإنتاج والتشغيل غالبًا هنا
= مجمل الربح (Gross Profit)
- المصروفات التشغيلية (OPEX) <-- أجور الإدارة والتسويق و HR هنا
= الربح التشغيلي (EBIT)
- الفوائد والضرائب
= صافي الربح (Net Profit)</div>
<div class="box tip"><span class="lbl">النقطة المحورية لـ HR</span><p>موقع الأجر في القائمة يغيّر الحوار كليًا. أجر عامل الإنتاج يقع في <strong>تكلفة المبيعات</strong> فيؤثر مباشرة في هامش الربح لكل وحدة. أما أجر موظف إداري فيقع في <strong>المصروفات التشغيلية</strong>. لذلك لا تُناقش زيادة الأجور بنفس المنطق للفئتين.</p></div>

<h2>ثلاث نسب يجب أن تعرفها عن شركتك</h2>
<div class="tbl"><table><thead><tr><th>النسبة</th><th>المعادلة</th><th>ماذا تخبرك</th></tr></thead><tbody>
<tr><td>هامش الربح الإجمالي</td><td>مجمل الربح ÷ الإيرادات</td><td>كم يتبقى من كل جنيه مبيعات بعد تكلفة الإنتاج</td></tr>
<tr><td>نسبة تكلفة العمالة</td><td>إجمالي تكلفة العمالة ÷ الإيرادات</td><td>مدى كثافة الشركة عماليًا وحساسيتها لأي زيادة أجور</td></tr>
<tr><td>الإيراد لكل موظف</td><td>الإيرادات ÷ عدد الموظفين</td><td>إنتاجية القوى العاملة ومقارنتها بالقطاع</td></tr>
</tbody></table></div>
<div class="box ex"><span class="lbl">مثال</span><p>شركة إيراداتها 100 مليون وتكلفة عمالتها 32 مليونًا. نسبة تكلفة العمالة 32%. زيادة أجور 10% تعني 3.2 مليون إضافية. لو كان هامش الربح التشغيلي 12% (12 مليونًا)، فالزيادة تلتهم <strong>27% من الربح التشغيلي</strong>. هذا هو الرقم الذي يجب أن تدخل به الاجتماع — لا «الزيادة معقولة».</p></div>

<h2>ترجمة مبادرات HR إلى لغة مالية</h2>
<div class="tbl"><table><thead><tr><th>المبادرة</th><th>الصياغة الضعيفة</th><th>الصياغة المالية</th></tr></thead><tbody>
<tr><td>برنامج استبقاء</td><td>«يرفع رضا الموظفين»</td><td>«خفض الدوران من 22% إلى 17% يوفر 18 عملية إحلال × 120 ألف = 2.16 مليون»</td></tr>
<tr><td>أتمتة الرواتب</td><td>«يوفر وقت الفريق»</td><td>«يوفر 60 ساعة شهريًا = 0.4 FTE، تُعاد لمهام تحليلية بدل توظيف إضافي»</td></tr>
<tr><td>تدريب المبيعات</td><td>«يحسّن المهارات»</td><td>«رفع معدل الإغلاق 3 نقاط على خط مبيعات 40 مليونًا = 1.2 مليون إيراد إضافي»</td></tr>
<tr><td>تحسين التهيئة</td><td>«تجربة أفضل»</td><td>«تقصير زمن الوصول للإنتاجية من 90 إلى 60 يومًا × 25 تعيينًا = 750 يوم إنتاجية»</td></tr>
<tr><td>برنامج سلامة</td><td>«بيئة آمنة»</td><td>«خفض أيام العمل الضائعة 40% = 320 يومًا + تجنّب غرامات ورفع أقساط التأمين»</td></tr>
</tbody></table></div>

<h2>حساب تكلفة الدوران</h2>
<div class="formula">تكلفة ترك موظف = تكلفة التعيين + تكلفة الإحلال والتدريب + فقد الإنتاجية خلال فترة الشاغر والتعلم + أثر على الفريق والعملاء</div>
<p>القاعدة المرجعية الشائعة: تتراوح بين <strong>50% من الأجر السنوي</strong> للأدوار المبتدئة و<strong>150–200%</strong> للأدوار المتخصصة والقيادية.</p>
<div class="box ex"><span class="lbl">مثال محلول</span><p>شركة 400 موظف ومعدل الدوران 22% ← 88 تاركًا. لو كان متوسط تكلفة الترك 100 ألف، فالتكلفة السنوية 8.8 مليون. خفض الدوران 5 نقاط فقط (إلى 17%) يوفر 20 موظفًا × 100 ألف = <strong>2 مليون سنويًا</strong>. أي برنامج استبقاء يكلف أقل من ذلك هو استثمار رابح رياضيًا.</p></div>

<h2>تقرير HR لمجلس الإدارة</h2>
<div class="box tip"><span class="lbl">قاعدة الصفحة الواحدة</span><p>مجلس الإدارة لا يقرأ 30 شريحة. صفحة واحدة تحتوي: 5–7 مؤشرات مع اتجاهها · مخاطر الأفراد الحالية · القرارات المطلوبة منهم · وما تغيّر منذ آخر اجتماع.</p></div>
<div class="tbl"><table><thead><tr><th>يُعرض على المجلس</th><th>لا يُعرض</th></tr></thead><tbody>
<tr><td>تكلفة العمالة ونسبتها من الإيراد</td><td>عدد الدورات التدريبية المنفذة</td></tr>
<tr><td>الدوران المؤسف والوظائف الحرجة المكشوفة</td><td>تفاصيل الشكاوى الفردية</td></tr>
<tr><td>تغطية التعاقب للأدوار القيادية</td><td>عدد الخطابات الصادرة</td></tr>
<tr><td>مخاطر الامتثال والنزاعات المحتملة وأثرها المالي</td><td>جدول الإجازات</td></tr>
<tr><td>الإيراد لكل موظف مقارنة بالقطاع</td><td>تفاصيل نظام الحضور</td></tr>
<tr><td>مؤشر الاندماج واتجاهه لا رقمه فقط</td><td>أسماء الموظفين</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">قاعدة الاتجاه</span><p>الرقم المنفرد بلا اتجاه بلا معيار = بلا معنى. «الدوران 18%» لا تقول شيئًا. «الدوران 18% مقابل 24% العام الماضي و15% متوسط القطاع، والتحسن مركّز في قسم واحد» هي جملة تُبنى عليها قرارات.</p></div>
