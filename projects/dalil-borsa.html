<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدليل الشامل للاستثمار في البورصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/b7fa5cf4a2c0.css" rel="stylesheet">
<style>
:root{
--bg:#0c1822; --bg2:#102331; --panel:#0f1f2c;
--head:#f6f1e7; --nav:#a9b8c0; --nav-hover:#f6f1e7;
--sheet1:#f6f1e7; --sheet2:#efe7d6; --sheet-text:#2c3a42; --sheet-head:#0c1822;
--card-bg:#ffffff; --muted:#5d6b72; --btn-bg:rgba(255,255,255,.04);
--gold:#c8a45a; --gold-soft:#e3c987; --emerald:#2f8f6f;
--emerald-soft:#e3f1ea; --crimson:#b6432f; --crimson-soft:#f7e6e1;
--line:rgba(200,164,90,.22); --shadow:0 24px 60px -28px rgba(0,0,0,.55);
--txt:16px;
}
[data-theme="light"]{
--bg:#e8dec9; --bg2:#f2ead8; --panel:#ece2cd;
--head:#16242f; --nav:#5a6168; --nav-hover:#16242f;
--sheet1:#ffffff; --sheet2:#fbf7ee; --sheet-head:#12202c;
--card-bg:#fbf7ee; --btn-bg:rgba(0,0,0,.05);
--line:rgba(120,95,40,.28); --shadow:0 22px 50px -30px rgba(60,40,10,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--sheet-text);line-height:1.85;overflow-x:hidden;transition:background .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(900px 500px at 90% -5%,rgba(200,164,90,.10),transparent 60%),
radial-gradient(700px 500px at 0% 100%,rgba(47,143,111,.10),transparent 55%),var(--bg)}
.app{display:flex;min-height:100vh}
.side{width:300px;flex-shrink:0;background:linear-gradient(180deg,var(--bg2),var(--panel));
border-inline-start:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 0 16px}
.brand{padding:0 28px 16px;border-bottom:1px solid var(--line)}
.brand .kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:8px}
.brand h1{font-family:'El Messiri',serif;color:var(--head);font-size:22px;font-weight:700;line-height:1.4}
.brand h1 span{color:var(--gold)}
.tools{display:flex;gap:7px;padding:14px 22px 8px}
.tools button{flex:1;background:var(--btn-bg);border:1px solid var(--line);color:var(--head);border-radius:10px;padding:8px 0;cursor:pointer;font-size:14px;font-family:'Tajawal';transition:.2s}
.tools button:hover{background:var(--gold);color:#0c1822;border-color:var(--gold)}
.search{padding:2px 22px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--btn-bg);color:var(--head);font-family:'Tajawal';font-size:14px;outline:none}
.search input::placeholder{color:var(--muted)}.search input:focus{border-color:var(--gold)}
.nav{flex:1;overflow-y:auto;padding:12px 14px 6px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.nav::-webkit-scrollbar{width:5px}.nav::-webkit-scrollbar-thumb{background:rgba(200,164,90,.4);border-radius:9px}
.nav button{width:100%;text-align:right;background:none;border:none;cursor:pointer;font-family:'Tajawal';color:var(--nav);font-size:15px;padding:10px 16px;border-radius:11px;margin-bottom:2px;display:flex;align-items:center;gap:12px;transition:.25s}
.nav button .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);width:26px;flex-shrink:0;opacity:.7;text-align:center}
.nav button:hover{background:var(--btn-bg);color:var(--nav-hover)}
.nav button.active{background:linear-gradient(90deg,rgba(200,164,90,.18),rgba(200,164,90,.02));color:var(--nav-hover);box-shadow:inset 3px 0 0 var(--gold)}
.nav button.active .num{opacity:1}
.side-foot{padding:12px 28px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.side-foot #scoreChip{display:block;color:var(--gold-soft);font-weight:700;margin-bottom:4px;font-size:12px}
[data-theme="light"] .side-foot #scoreChip{color:#8a6a1f}
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 0 60px}
.stage{width:100%;max-width:860px;padding:46px 40px}
.page{display:none;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.page.show{display:block}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.page.show>*{animation:fade .55s both}
.page.show>*:nth-child(1){animation-delay:.02s}.page.show>*:nth-child(2){animation-delay:.08s}
.page.show>*:nth-child(3){animation-delay:.14s}.page.show>*:nth-child(4){animation-delay:.2s}
.page.show>*:nth-child(n+5){animation-delay:.26s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
h2.title{font-family:'El Messiri',serif;color:var(--head);font-size:38px;font-weight:700;line-height:1.3;margin-bottom:10px}
.rule{width:64px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:3px;margin-bottom:30px}
.sheet{background:linear-gradient(180deg,var(--sheet1),var(--sheet2));border-radius:20px;padding:34px 36px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04);font-size:var(--txt)}
.sheet h3{font-family:'El Messiri',serif;font-size:1.4em;color:var(--sheet-head);margin:26px 0 12px;font-weight:600}
.sheet h3:first-child{margin-top:0}
.sheet p{margin-bottom:14px;color:var(--sheet-text)}
.sheet ul,.sheet ol{margin:0 22px 16px 0;padding:0}
.sheet li{margin-bottom:9px;color:var(--sheet-text)}
.sheet strong{color:var(--sheet-head);font-weight:700}
.sheet em{color:var(--emerald);font-style:normal;font-weight:500}
.lead{font-size:1.18em;color:var(--sheet-head);line-height:1.9}
.callout{border-radius:14px;padding:16px 20px;margin:20px 0;font-size:.97em;border-inline-start:4px solid}
.callout.warn{background:var(--crimson-soft);border-color:var(--crimson);color:#7a2c1d}
.callout.tip{background:var(--emerald-soft);border-color:var(--emerald);color:#1f5a44}
.callout.note{background:rgba(200,164,90,.14);border-color:var(--gold);color:#6e561f}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0}
.card{background:var(--card-bg);border:1px solid rgba(12,24,34,.07);border-radius:14px;padding:16px 18px;transition:.25s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(12,24,34,.4);border-color:var(--gold)}
.card .t{font-weight:700;color:var(--sheet-head);margin-bottom:5px}
.card .d{font-size:.9em;color:var(--muted);line-height:1.7}
.tbl{width:100%;border-collapse:collapse;margin:18px 0;font-size:.92em;background:var(--card-bg);border-radius:12px;overflow:hidden}
.tbl th{background:var(--bg2);color:var(--gold-soft);padding:12px 14px;font-weight:600;text-align:right;font-family:'El Messiri',serif}
[data-theme="light"] .tbl th{color:#8a6a1f}
.tbl td{padding:11px 14px;border-top:1px solid rgba(120,95,40,.15);color:var(--sheet-text)}
.tbl tr:nth-child(even) td{background:rgba(120,95,40,.05)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.85em;font-weight:700}
.p-hi{background:var(--crimson-soft);color:var(--crimson)}.p-mid{background:#fbf0d8;color:#a07614}.p-lo{background:var(--emerald-soft);color:var(--emerald)}
.calc{background:var(--card-bg);border:1px solid rgba(12,24,34,.08);border-radius:16px;padding:20px 22px;margin:16px 0}
.calc h4{font-family:'El Messiri',serif;font-size:1.2em;color:var(--sheet-head);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.fields{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
.field label{font-size:.82em;color:var(--muted);font-weight:500}
.field input{font-family:'IBM Plex Mono',monospace;padding:9px 12px;border:1px solid rgba(120,95,40,.3);border-radius:9px;background:var(--sheet2);font-size:14px;color:var(--sheet-head);outline:none;width:100%}
.field input:focus{border-color:var(--gold)}
.go{margin-top:14px;font-family:'Tajawal';font-weight:700;font-size:15px;cursor:pointer;background:var(--gold);color:#0c1822;border:none;padding:11px 26px;border-radius:11px;transition:.2s}
.go:hover{filter:brightness(1.07)}
.res{margin-top:14px;background:var(--sheet2);border:1px dashed var(--line);border-radius:11px;padding:14px 16px;font-size:.97em;color:var(--sheet-head);line-height:2}
.res b{color:var(--emerald);font-weight:700}
.chart{margin-top:14px;background:var(--sheet2);border:1px solid var(--line);border-radius:12px;padding:12px 10px 6px}
.chart svg{width:100%;height:auto;display:block}
.chart .ctitle{font-size:.82em;color:var(--muted);padding:0 6px 6px;font-weight:500}
/* quiz */
.quizwrap{background:linear-gradient(180deg,var(--sheet1),var(--sheet2));border-radius:20px;padding:26px 30px;margin-top:22px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04);font-size:var(--txt)}
.quiz-h{font-family:'El Messiri',serif;font-size:1.25em;color:var(--sheet-head);margin-bottom:16px;font-weight:600}
.quiz{margin-bottom:18px}.quiz:last-child{margin-bottom:0}
.quiz-q{font-weight:700;color:var(--sheet-head);margin-bottom:10px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{text-align:right;font-family:'Tajawal';font-size:.95em;padding:11px 16px;border-radius:10px;border:1px solid rgba(120,95,40,.25);background:var(--card-bg);cursor:pointer;color:var(--sheet-text);transition:.2s}
.qopt:hover:not(:disabled){border-color:var(--gold)}.qopt:disabled{cursor:default}
.qopt.ok{background:var(--emerald-soft);border-color:var(--emerald);color:#1f5a44;font-weight:700}
.qopt.bad{background:var(--crimson-soft);border-color:var(--crimson);color:#7a2c1d}
.quiz-fb{margin-top:10px;font-weight:700;font-size:.9em;min-height:1px}
.quiz-fb.good{color:var(--emerald)}.quiz-fb.bad{color:var(--crimson)}
/* checklist */
.chk{display:flex;align-items:flex-start;gap:12px;background:var(--card-bg);border:1px solid rgba(12,24,34,.08);border-radius:12px;padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:.2s}
.chk:hover{border-color:var(--gold)}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--emerald);cursor:pointer;flex-shrink:0}
.chk span{color:var(--sheet-text);font-size:.97em}
.chk input:checked + span{color:var(--muted);text-decoration:line-through}
.chk-bar{height:9px;background:var(--sheet2);border-radius:9px;overflow:hidden;margin:6px 0 18px;border:1px solid var(--line)}
.chk-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--emerald),var(--gold));transition:.4s}
/* glossary */
.gsearch{width:100%;padding:11px 15px;border-radius:12px;border:1px solid rgba(120,95,40,.3);background:var(--sheet2);font-family:'Tajawal';font-size:15px;color:var(--sheet-head);outline:none;margin-bottom:16px}
.gsearch:focus{border-color:var(--gold)}
.gterm{background:var(--card-bg);border:1px solid rgba(12,24,34,.07);border-radius:12px;padding:13px 16px;margin-bottom:9px}
.gterm .gt{font-weight:700;color:var(--sheet-head);margin-bottom:3px}
.gterm .gt span{font-family:'IBM Plex Mono',monospace;font-size:.8em;color:var(--gold);margin-inline-start:6px}
.gterm .gd{font-size:.92em;color:var(--muted)}
.gnone{color:var(--muted);text-align:center;padding:14px}
/* score */
.scorebox{text-align:center;padding:10px 0 6px}
.score-num{font-family:'El Messiri',serif;font-size:64px;font-weight:700;color:var(--gold);line-height:1}
.score-sub{color:var(--sheet-head);font-size:1.1em;font-weight:700;margin:6px 0 4px}
.score-tier{display:inline-block;padding:5px 16px;border-radius:30px;font-weight:700;font-size:.9em;margin-top:8px}
.score-bar{height:12px;background:var(--sheet2);border-radius:12px;overflow:hidden;margin:20px 0;border:1px solid var(--line)}
.score-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--emerald));transition:.6s}
.certline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:18px}
.certline .field{min-width:160px}
.score-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.score-btns button{font-family:'Tajawal';font-weight:700;font-size:14px;cursor:pointer;border-radius:11px;padding:11px 20px;border:1px solid var(--line);transition:.2s}
.btn-gold{background:var(--gold);color:#0c1822;border-color:var(--gold)}.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--btn-bg);color:var(--head)}.btn-ghost:hover{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:30px}
.pager button{flex:1;font-family:'Tajawal';font-weight:700;font-size:15px;cursor:pointer;padding:14px 18px;border-radius:13px;border:1px solid var(--line);background:var(--btn-bg);color:var(--head);transition:.25s}
.pager button:hover:not(:disabled){background:var(--gold);color:#0c1822;border-color:var(--gold)}
.pager button:disabled{opacity:.3;cursor:not-allowed}
.pager button.next{background:var(--gold);color:#0c1822;border-color:var(--gold)}
.pager button.next:hover{filter:brightness(1.08)}
.progress{position:fixed;top:0;inset-inline:0;height:3px;background:transparent;z-index:50}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--emerald));transition:width .4s}
.hero{text-align:center;padding:30px 0 0}
.hero .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--gold);border:1px solid var(--line);padding:7px 16px;border-radius:30px;margin-bottom:26px}
.hero h2{font-family:'El Messiri',serif;color:var(--head);font-size:52px;line-height:1.25;font-weight:700;margin-bottom:18px}
.hero h2 span{color:var(--gold)}
.hero p{color:var(--nav);font-size:18px;max-width:560px;margin:0 auto 30px}
.start{font-family:'Tajawal';font-weight:700;font-size:17px;cursor:pointer;background:var(--gold);color:#0c1822;border:none;padding:15px 38px;border-radius:40px;transition:.25s;box-shadow:0 16px 36px -16px rgba(200,164,90,.7)}
.start:hover{transform:translateY(-2px);filter:brightness(1.05)}
.hero-stats{display:flex;gap:28px;justify-content:center;margin-top:46px;flex-wrap:wrap}
.hero-stats .n{font-family:'El Messiri',serif;color:var(--gold);font-size:30px;font-weight:700}
.hero-stats .l{color:var(--muted);font-size:13px}
.topbar{display:none}
#printArea,#certArea{display:none}
@media(max-width:880px){
.side{position:fixed;inset-inline-end:-310px;z-index:60;transition:.3s;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.side.open{inset-inline-end:0}
.topbar{display:flex;position:sticky;top:0;z-index:55;width:100%;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg2);border-bottom:1px solid var(--line)}
.topbar .tt{font-family:'El Messiri',serif;color:var(--head);font-size:17px;font-weight:700}
.topbar button{background:none;border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:18px}
.stage{padding:26px 18px}.hero h2{font-size:36px}h2.title{font-size:29px}.sheet,.quizwrap{padding:24px 20px}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:58}.scrim.show{display:block}
}
@media print{
.app,.topbar,.progress,.scrim{display:none!important}
body,body::before{background:#fff!important}
#printArea{display:block;padding:0 6%;color:#111}
.p-title{font-family:'El Messiri',serif;font-size:26px;text-align:center;margin:10px 0 24px;color:#0c1822}
.p-sec{break-inside:avoid;margin-bottom:26px}
.p-sec h2{font-family:'El Messiri',serif;font-size:20px;color:#0c1822;border-bottom:2px solid #c8a45a;padding-bottom:4px;margin-bottom:12px}
.p-sec .sheet{box-shadow:none;border:none;background:#fff;padding:0;font-size:13px}
.p-sec .card{border:1px solid #ddd}.p-sec .callout{border:1px solid #ccc}
html[data-printmode="cert"] #printArea{display:none}
html[data-printmode="cert"] #certArea{display:flex}
}
#certArea{align-items:center;justify-content:center;min-height:90vh;padding:5%}
.cert{border:3px solid var(--gold);border-radius:18px;padding:50px 40px;text-align:center;max-width:640px;margin:auto;width:100%}
.cert .ck{font-family:'IBM Plex Mono';letter-spacing:4px;color:#a07614;font-size:13px}
.cert h1{font-family:'El Messiri',serif;font-size:34px;color:#0c1822;margin:14px 0}
.cert .nm{font-size:24px;font-weight:700;border-bottom:2px dashed #c8a45a;display:inline-block;padding:0 30px 6px;margin:10px 0 18px;color:#0c1822}
.cert .sc{font-size:20px;color:#1f5a44;font-weight:700}
.cert .dt{color:#777;margin-top:20px;font-size:13px}
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:14px 0 6px;border:1px solid var(--line)}
.stack i{height:100%;transition:.3s}
.alloc{display:flex;justify-content:space-between;font-size:.9em;color:var(--sheet-text);padding:4px 0;border-bottom:1px dashed var(--line)}
.alloc b{font-weight:700;color:var(--sheet-head)}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-start:6px;vertical-align:middle}
.mrow{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.mrow .mlabel{font-size:.85em;color:var(--muted)}.mrow .mlabel small{display:block;color:var(--gold);font-size:.9em}
.mrow input{font-family:'IBM Plex Mono';padding:8px 10px;border:1px solid rgba(120,95,40,.3);border-radius:8px;background:var(--sheet2);color:var(--sheet-head);font-size:14px;width:100%}
.win{background:var(--emerald-soft)!important;color:#1f5a44;font-weight:700}
.bookhead{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:16px}
.bookhead .bt{font-family:'El Messiri',serif;font-size:1.45em;color:var(--sheet-head);font-weight:700}
.bookhead .ba{font-size:.9em;color:var(--muted)}
.topic{background:var(--card-bg);border:1px solid rgba(12,24,34,.08);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.topic .tn{font-weight:700;color:var(--sheet-head);margin-bottom:6px;font-size:1.02em}
.topic .tn i{font-style:normal;color:var(--gold);font-family:'IBM Plex Mono';font-size:.85em;margin-inline-end:6px}
.topic p{margin:0 0 8px;font-size:.95em}
.topic .ex{background:var(--emerald-soft);border-inline-start:3px solid var(--emerald);border-radius:9px;padding:9px 13px;font-size:.9em;color:#1f5a44}
.topic .ex b{color:#143d2e}
.topic .lesson{background:rgba(200,164,90,.14);border-inline-start:3px solid var(--gold);border-radius:9px;padding:9px 13px;font-size:.9em;color:#6e561f;margin-top:8px}
.topic .lesson b{color:#5a441380}
.topic .lesson b{color:#584312}
.qgroup{font-family:'El Messiri',serif;font-weight:700;color:var(--gold);font-size:1.02em;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
[data-theme="light"] .qgroup{color:#8a6a1f}
.qa{border-bottom:1px dashed var(--line)}
.qa summary{cursor:pointer;padding:11px 4px;font-weight:600;color:var(--sheet-head);font-size:.96em;list-style:none;display:flex;gap:9px;align-items:flex-start}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"▸";color:var(--gold);flex-shrink:0;transition:.2s}
.qa[open] summary::before{transform:rotate(90deg)}
.qa summary:hover{color:var(--gold)}
.qa .ans{padding:0 22px 13px;font-size:.93em;color:var(--sheet-text);line-height:1.85}
.qbank{background:var(--sheet2);border:1px solid var(--line);border-radius:14px;padding:8px 16px;margin-top:6px}
.whofor{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(max-width:600px){.whofor{grid-template-columns:1fr}}
.whofor div{border-radius:12px;padding:13px 16px;font-size:.92em}
.whofor .yes{background:var(--emerald-soft);color:#1f5a44}
.whofor .no{background:var(--crimson-soft);color:#7a2c1d}
.whofor b{display:block;margin-bottom:4px}
</style>
</head>
<body>

["السيد السوق (Mr. Market)","أشهر استعارة في الكتاب: تخيّل إن ليك شريك في مشروع اسمه \"السيد السوق\"، بيجيلك كل يوم ويعرض عليك سعر يشتري بيه حصتك أو يبيعلك حصته. الراجل ده مزاجه متقلّب جداً: في يوم متفائل فبيطلب سعر خيالي، وفي يوم مكتئب فبيعرض سعر مضحك. المفتاح إن <strong>وجوده لخدمتك مش لإرشادك</strong> — إنت مش مضطر تتعامل معاه كل يوم، وسعره مش حكم على قيمة شركتك.","سهم درسته وقيّمته بـ100 جنيه نزل لـ70 من غير ما يتغير أي حاجة في الشركة نفسها. \"السيد السوق\" مكتئب النهاردة — ده عرض شراء، مش إشارة إنك غلطان.","بدل ما تسأل \"السعر عمل إيه النهاردة؟\"، اسأل \"الشركة عملت إيه آخر ربع سنة؟\". لو الإجابة التانية كويسة، الأولى مالهاش لازمة."],
["هامش الأمان (Margin of Safety)","دي أهم فكرة في الكتاب كله، وجراهام بيلخّص الاستثمار السليم فيها. الفكرة إنك متشتريش عند القيمة العادلة، لكن بخصم كبير عنها. ليه؟ لإن تقديرك للقيمة نفسه مبني على افتراضات ممكن تغلط، وفي حاجات مستقبلية محدش يقدر يحسبها. الفرق بين السعر اللي دفعته والقيمة الحقيقية هو <strong>الوسادة اللي بتمتص أخطاءك</strong>.","لو قدّرت قيمة السهم العادلة 100 جنيه، متشتريهوش بـ98. استنّى 70 أو 60. لو طلع تقديرك متفائل بـ20% وقيمته الحقيقية 80، إنت لسه مكسبان لإنك دفعت 60.","هامش الأمان مش بس في السعر — كمان في اختيارك لشركات مالهاش ديون كتيرة وأرباحها مستقرة."],
["المستثمر الدفاعي مقابل المبادر","جراهام بيقسّم المستثمرين لنوعين، والاختيار بينهم مش حسب ذكاءك لكن حسب <strong>الوقت والجهد اللي مستعد تبذله فعلاً</strong>. الدفاعي عايز أمان ومجهود قليل: شركات كبيرة مستقرة، تنويع واسع، ومراجعة دورية بسيطة. المبادر مستعد يشتغل بجدية على تحليل القوائم المالية والبحث عن فرص مقوّمة بأقل من قيمتها. أخطر وضع هو الشخص في النص: بياخد مخاطر المبادر من غير ما يبذل مجهوده.","موظف مشغول بشغله وعيلته → دفاعي: صناديق مؤشرات وشركات قيادية ومساهمة شهرية ثابتة. حد بيقرا قوائم مالية وتقارير قطاعية أسبوعياً → مبادر.","كن صادق مع نفسك: كام ساعة في الشهر فعلاً هتخصصها للبحث؟ لو أقل من عشرة، إنت دفاعي — وده مش عيب."],
["تقلبات السوق مش هي المخاطرة","في الأدبيات الحديثة، المخاطرة بتتقاس بالتقلب. جراهام بيرفض ده تماماً. عنده المخاطرة الحقيقية هي <strong>احتمال الخسارة الدائمة لرأس المال</strong> — إن الشركة تتدهور فعلياً، أو إنك تدفع سعر مبالغ فيه، أو إنك تتجبر تبيع في أسوأ وقت. تحرّك السعر لأعلى ولأسفل من غير تغيّر في قيمة الشركة مش خسارة، ده ضوضاء.","سهم شركة قوية نزل 35% في أزمة عامة وبعد سنتين رجع وزود = تقلب مؤقت. شركة اتدهور نشاطها وأفلست = خسارة حقيقية دائمة. الاتنين شكلهم واحد في اللحظة، ومختلفين تماماً في النتيجة.","لو التقلب بيخليك تبيع، فمشكلتك مش السوق — مشكلتك إن نسبة الأسهم عندك أكبر من اللي تتحمّله نفسياً. قلّلها."],
["التنويع الإلزامي","جراهام بيعتبر التنويع مش رفاهية ولا نقص ثقة، لكنه <strong>اعتراف صادق بإنك ممكن تغلط</strong>. مهما كان تحليلك محكم، فيه معلومات مخفية وأحداث مفاجئة. التنويع بيخلّي الخطأ الواحد مش قاتل. لكنه بينبّه كمان على التنويع الوهمي: امتلاك عشرين شركة كلها في نفس القطاع مش تنويع.","بدل ما تحط كل فلوسك في سهم واحد مقتنع بيه جداً، وزّعها على عدة شركات في قطاعات مختلفة (بنوك، أغذية، اتصالات، عقارات).","لو خسارة سهم واحد ممكن تدمّر محفظتك، فنسبته أكبر من اللازم — بغض النظر عن مدى ثقتك فيه."],
["توزيع الأصول بين الأسهم والسندات","جراهام بيقترح إطار عملي: متخليش الأسهم أقل من ربع محفظتك ولا أكتر من تلاتة أرباعها أبداً، والباقي في أدوات دخل ثابت. السبب مش رياضي بحت — ده <strong>حماية سلوكية</strong>. لما السوق ينهار، وجود جزء ثابت بيمنعك من الذعر، ولما يرتفع بجنون، وجود حد أقصى للأسهم بيمنعك من الطمع.","في سوق صاعد بجنون، نسبة الأسهم عندك ممكن توصل 90% تلقائياً بفعل الارتفاع — القاعدة بتقولك بِع جزء ورجّعها لحدودها.","اكتب نسبتك المستهدفة النهاردة وإنت هادي، عشان تلاقيها قدامك لما تتوتر."],
["إعادة التوازن الدورية","نتيجة طبيعية للنقطة اللي فاتت: مع حركة السوق، نسب محفظتك بتنحرف عن المستهدف. إعادة التوازن معناها إنك ترجّعها لنسبتها الأصلية على فترات منتظمة. الجميل في الفكرة إنها <strong>بتجبرك تبيع الغالي وتشتري الرخيص آلياً</strong> — عكس ما بتميل نفسك تعمله بالظبط.","المستهدف 60% أسهم و40% دخل ثابت. بعد سنة صعود بقت 75/25 — بتبيع جزء من الأسهم وترجّعها 60/40، يعني بعت وقت الارتفاع.","حدد موعد ثابت (مرة كل سنة مثلاً) لإعادة التوازن، مش لما تحس. القاعدة بتحميك من مزاجك."],
["الحذر من الاكتتابات الجديدة","جراهام بيحذّر بوضوح من الطروحات الجديدة، والسبب منطقي: الشركة بتختار توقيت الطرح لما السوق متحمّس والسعر في صالحها، والمعلومات المتاحة عنها قليلة ومفيش تاريخ أداء طويل تحكم عليه. مش معناه كل اكتتاب سيء، بس <strong>عبء الإثبات عليه أكبر</strong>.","شركة بتطرح أسهمها في ذروة حماس القطاع بسعر مرتفع، وبعد سنة السعر أقل من سعر الطرح بكتير.","لو مش هتقرا نشرة الاكتتاب كاملة، متشتركش. ومفيش خسارة في إنك تستنى سنة وتشوف أداءها الحقيقي."],
["الأرقام المحاسبية مش دايماً بتقول الحقيقة","جراهام بيخصص جزء مهم لتحذير المستثمر من أخذ الأرباح المعلنة كما هي. الشركات ممكن تجمّل نتائجها بطرق قانونية: تغيير طرق التقييم، مكاسب استثنائية غير متكررة، أو تأجيل مصاريف. المستثمر لازم يسأل: <strong>الأرباح دي متكررة ولا مرة واحدة؟</strong>","شركة أرباحها قفزت 200% السنة دي — بس لما تقرا التفاصيل تلاقي السبب بيع قطعة أرض، مش تحسّن في نشاطها الأساسي.","قارن الأرباح على 5–10 سنين مش سنة واحدة، وابحث عن الأرباح التشغيلية المتكررة."],
["الأمان في السجل الطويل","جراهام بيفضّل الشركات اللي ليها تاريخ طويل من الأرباح والتوزيعات المستقرة. مش لإن الماضي ضمان، لكن لإن <strong>الاستمرارية دليل على متانة النموذج</strong> وقدرته على تجاوز دورات اقتصادية مختلفة. شركة صمدت عشرين سنة أثبتت حاجة، وشركة عمرها سنتين لسه بتُختبر.","شركة أغذية بتوزّع أرباح بانتظام من عشرين سنة مرّت بأزمات وخرجت منها — ده مؤشر متانة أقوى من نمو مبهر لشركة عمرها سنتين.","اطلب من الشركة تاريخ: أرباح مستقرة، ديون معقولة، وتوزيعات منتظمة على مدى سنين."],
["أكبر عدو للمستثمر هو نفسه","الجملة الأشهر في الكتاب معناها إن المشكلة نادراً ما تكون في السوق أو في نقص المعلومات، المشكلة في <strong>سلوك المستثمر وقت الضغط</strong>. الخوف بيخليك تبيع في القاع، والطمع بيخليك تشتري في القمة، والملل بيخليك تعدّل خطة كويسة من غير سبب. جراهام بيقول إن المزاج الهادئ والانضباط أهم من الذكاء الحاد.","اتنين عندهم نفس المحفظة بالظبط: واحد التزم بخطته وقت الانهيار، والتاني باع كل حاجة من الذعر. بعد خمس سنين النتيجة مختلفة تماماً رغم إن اختيارهم كان واحد.","القرار الوحيد اللي بتتحكم فيه 100% هو رد فعلك. اكتب خطتك وإنت هادي والتزم بيها وإنت متوتر."]

{t:"الأب الغني والأب الفقير",a:"روبرت كيوساكي",tag:"الثقافة المالية",
idea:"الأغنياء بيشتروا أصول بتدرّ دخل؛ غيرهم بيشتري التزامات فاكرينها أصول. الفرق بين الاتنين اسمه الثقافة المالية.",
ctx:"الكتاب مبني على مقارنة بين شخصيتين: \"الأب الفقير\" (متعلّم وبيؤمن بالوظيفة الآمنة) و\"الأب الغني\" (أقل تعليماً رسمياً وبيبني أصول). الكتاب مش دليل تقني — هو <strong>كتاب عن طريقة التفكير</strong>، وقيمته الأساسية إنه بيهزّ افتراضات كتير الناس عايشة بيها من غير ما تراجعها: إن المرتب العالي = أمان، وإن البيت = أصل، وإن الوظيفة = استقرار.",
topics:[
["الأصل مقابل الالتزام","دي الفكرة اللي بيتبني عليها الكتاب كله، وكيوساكي بيعرّفها بشكل عملي مبسّط: <strong>الأصل بيحط فلوس في جيبك، والالتزام بيطلّع فلوس منه</strong>. التعريف ده مش محاسبي بالمعنى الدقيق، لكنه مفيد كعدسة يومية. المشكلة اللي بيرصدها إن ناس كتير بتشتري التزامات وهي فاكرة إنها بتبني أصول، فبتفضل تشتغل أكتر من غير ما وضعها يتحسّن.","شقة بتأجّرها وبتدخّلك إيجار شهري = أصل. عربية شخصية بأقساط وبنزين وصيانة وتأمين = التزام مهما كانت غالية أو بتحسّن صورتك.","اعمل جدول بسيط بعمودين: إيه اللي بيدخّلني فلوس وإيه اللي بيطلّعها. النتيجة غالباً هتفاجئك."],
["الثقافة المالية أهم من حجم الدخل","كيوساكي بيجادل إن المشكلة نادراً ما تكون قلة الدخل، المشكلة إن الناس <strong>متعلمتش تدير الفلوس</strong>. دخل عالي مع جهل مالي بينتهي بديون أكبر، لإن الاستهلاك بيكبر مع الدخل. وبالعكس، دخل متوسط مع فهم مالي بيبني ثروة بالتدريج.","اتنين بيقبضوا نفس المرتب: واحد بيحوّل 15% لاستثمار أول كل شهر، والتاني بيزوّد مصاريفه مع كل علاوة. بعد عشر سنين الفرق بينهم مش في الدخل، في العادات.","خصص وقت شهري ثابت لتعليم نفسك مالياً — قراءة أو تحليل ميزانيتك. ده استثمار عائده أعلى من أي سهم."],
["فخ سباق الفئران","بيصف الدائرة اللي أغلب الناس عايشة فيها: تشتغل → تقبض → تصرف وتزوّد نمط حياتك → تحتاج تشتغل أكتر عشان تغطي. الحلقة دي <strong>مالهاش نهاية طبيعية</strong> لإنها بتتحرك مع الدخل. الخروج منها مش بزيادة الدخل، بالخروج من منطقها: تحويل جزء من الدخل لأصول بتولّد دخل مستقل عن شغلك.","كل علاوة بتروح في قسط أكبر أو سيارة أحدث أو سكن أغلى، فمهما زاد المرتب الفائض بيفضل صفر.","القاعدة: لما دخلك يزيد، ثبّت مصاريفك وحوّل الزيادة كلها للاستثمار. ده أسرع طريق للخروج."],
["اشتغل عشان تتعلّم مش عشان تقبض","خصوصاً في بداية حياتك المهنية، المهارة اللي هتكتسبها من شغلانة ممكن تساوي أضعاف فرق المرتب. كيوساكي بيشجّع على اكتساب مهارات <strong>مبيعات، تواصل، إدارة، وفهم مالي</strong> لإنها بتفتح أبواب أوسع من التخصص الضيق.","تختار وظيفة مرتبها أقل بس بتعلّمك مبيعات وإدارة عملاء — بعد سنتين قيمتك في السوق أعلى من زميلك اللي اختار المرتب الأعلى في شغل روتيني.","اسأل عن أي فرصة: هتعلّمني إيه؟ لو الإجابة \"لا شيء جديد\"، المرتب لوحده مش كفاية."],
["الفلوس بتشتغل عندك بدل ما تشتغل إنت","الفرق الجوهري بين اللي بيبني ثروة واللي بيلف في مكانه: الأول <strong>بيبيع وقته مرة واحدة ويبني أصل بيدفع باستمرار</strong>، والتاني بيبيع وقته كل شهر من جديد. أي دخل بيتوقف لما تتوقف إنت هو دخل هش.","صندوق استثمار أو عقار مؤجّر بيدّي عائد وإنت نايم أو في إجازة؛ مرتبك بيقف في نفس اللحظة اللي بتقف فيها.","استهدف إن جزء من دخلك — حتى لو صغير جداً في البداية — ييجي من مصدر مش مرتبط بوقتك."],
["الخوف والتردد أكبر عائق","كيوساكي بيقول إن أغلب الناس مش بتفشل من قلة فرص، بتفشل من <strong>الخوف من الخسارة والانتظار للحظة المثالية</strong>. والخوف ده مش عيب، لكن اللي بيفرق هو إنك تتحرك بمبالغ صغيرة وتتعلّم بدل ما تفضل تأجل.","تفضل مأجّل أول استثمار خمس سنين انتظاراً لـ\"الوقت المناسب\" — والوقت الضايع نفسه خسارة، لإن التراكم بيحتاج سنين.","ابدأ بمبلغ صغير جداً دلوقتي بدل مبلغ كبير \"بعدين\". قيمة البداية في التعلّم مش في الربح."],
["الأخطاء جزء من التعليم المالي","الكتاب بيعامل الخسارة الصغيرة المدروسة كمصروف تعليم، مش كفشل. اللي بيتجنّب أي خطأ بيتجنّب معاه أي تعلّم. الشرط إن الخطأ يكون <strong>محدود الحجم ومستخلَص منه درس</strong>.","خسارة بسيطة في أول استثمار علّمتك تقرا بيانات الشركة كويس — دي أرخص من نفس الغلطة بمبلغ كبير بعد عشر سنين.","سجّل كل قرار مالي وسببه، وراجعه بعد سنة. السجل ده أثمن من نتيجة أي صفقة."],
["الضرايب والهيكلة المالية","جزء مهم في الكتاب بيوضّح إن الأغنياء بيفهموا القواعد المالية والقانونية ويستخدموها بشكل مشروع، بينما غيرهم بيتعامل معاها كأمر واقع مش فاهمه. الرسالة الأساسية: <strong>افهم قواعد اللعبة اللي بتلعبها</strong>.","حد فاهم رسوم وضرايب استثماراته بيختار الأدوات والتوقيت بشكل يقلل التكلفة؛ وحد تاني بيدفع أكتر من غير ما يعرف ليه.","خصص وقت لفهم الرسوم والضرايب على أي أداة قبل ما تدخلها. التوفير هنا مضمون أكتر من العائد.","note"],
["البيت مش دايماً أصل","من أكتر أفكار الكتاب إثارة للجدل: إن بيت السكن اللي بتدفع عليه أقساط ومصاريف من غير ما يدخّلك دخل هو التزام حسب تعريفه العملي، مش أصل. <strong>مش معناها متشتريش بيت</strong> — معناها متحسبهوش استثمار مدرّ للدخل وأنت بتخطط.","بيت سكن بقسط ومصاريف صيانة وضرايب سنوية بيسحب من دخلك شهرياً؛ بينما شقة مؤجّرة بتضيف لدخلك.","لما تخطط لمحفظتك، افصل بين \"سكن\" و\"استثمار\". الخلط بينهم بيدي إحساس زائف بالأمان المالي."],
["أربعة مصادر للدخل","كيوساكي بيقسّم الناس لأربع فئات حسب مصدر دخلهم: موظف، صاحب عمل حر، صاحب نظام/شركة، ومستثمر. الفكرة إن <strong>الانتقال ناحية اليمين (نظام واستثمار) بيقلل اعتمادك على وقتك</strong>. مش لازم تسيب وظيفتك، بس تبني قدم في الجانب التاني.","طبيب بيشتغل بنفسه = عمل حر (دخله بيقف لو وقف)؛ نفس الطبيب لو بنى عيادة بفريق بتشتغل من غيره = نظام.","حدد إنت في أي خانة دلوقتي، وخطوة واحدة صغيرة تنقلك للخانة اللي بعدها."],
["ابدأ صغير وكرّر","الكتاب بيرفض فكرة انتظار المبلغ الكبير. القيمة الأساسية للبداية الصغيرة إنها <strong>بتبني عادة وخبرة بتكلفة خطأ منخفضة</strong>، والمبالغ بتكبر بعد كده على أساس متين.","تبدأ بمبلغ بسيط شهري في صندوق، وبعد سنة بقيت فاهم آلية السوق وقادر تكبّر بثقة بدل ما تدخل بمبلغ كبير وإنت مش فاهم.","المبلغ مش المهم في البداية — الاستمرارية والانتظام هما اللي بيفرقوا."],
["كوّن فريقك وتعلّم من الخبراء","بيشجّع على إنك متحاولش تعرف كل حاجة بنفسك، لكن تحيط نفسك بناس أفهم منك في المجالات المختلفة — بشرط إنك تفضل فاهم القرار النهائي. <strong>الاستعانة بخبير مش تنازل عن مسؤوليتك</strong>.","تستشير محاسب في الضرايب ومتخصص في الاستثمار، بس القرار النهائي يفضل قرارك إنت وإنت فاهمه.","أي حد بيقولك \"سيبها عليّا ومتسألش\" — ده إنذار خطر مش خبرة."]

idea:"قواعد الثروة بسيطة وقديمة: ادخر جزء ثابت من دخلك، استثمره بحكمة، وابعد عن الديون الاستهلاكية.",
ctx:"الكتاب مكتوب على شكل <strong>حكايات في بابل القديمة</strong>، وده مقصود: الفكرة إن مبادئ المال مش اختراع حديث ولا معقّدة، هي قواعد قديمة قدر الحضارة نفسها. القيمة الأساسية للكتاب إنه بسيط جداً وسريع القراءة، وبيركّز على <strong>العادات</strong> مش على أدوات استثمار معيّنة — وعشان كده مبادئه مبتقدمش مهما تغيّرت الأسواق.",
topics:[
["ادفع لنفسك أولاً","أشهر قاعدة في الكتاب: خصّص نسبة من دخلك — على الأقل عُشره — <strong>قبل</strong> أي مصروف. الفكرة النفسية عميقة: لو استنيت الفاضل في آخر الشهر، مش هيفضل حاجة أبداً، لإن المصاريف بتتمدد لتملأ المتاح. لما تخصم الادخار أولاً، بتتكيّف تلقائياً مع الباقي.","أول ما المرتب ينزل، حوّل 10% لحساب استثمار منفصل قبل ما تصرف أي جنيه. اللي فاضل هو ميزانيتك الحقيقية.","اعمل التحويل تلقائي لو أمكن — الأتمتة بتشيل الاعتماد على انضباطك الشهري."],
["اضبط مصاريفك","الكتاب بيلاحظ إن الناس بتخلط بين \"النفقات الضرورية\" و\"الرغبات\". الرغبات لا نهائية وبتتمدد مع أي دخل، فمهما زاد دخلك هتحس إنك مش قادر تدخر. الحل إنك <strong>تفحص كل بند بصراحة</strong> وتفصل الضروري عن المعتاد.","تعمل ميزانية مفصّلة لشهر واحد بس، فتكتشف بنود متكررة كبيرة كنت شايفها بديهية وهي فعلياً اختيار.","راجع مصاريفك كل ٦ شهور — البنود بتتسلل بالتدريج وبتحتاج تنضيف دوري."],
["خلّي فلوسك تتوالد","الادخار وحده مش كفاية عند كلاسون. الفلوس المكدّسة ساكنة <strong>بتفقد قيمتها بالتضخم</strong>، فلازم توظّفها في حاجة بتدرّ دخل بدورها، والدخل ده يتعاد استثماره فيتراكم.","بدل ما تسيب المدّخرات كاش في الدرج، تحطها في أداة استثمارية عائدها يغطي التضخم على الأقل ويزيد.","خلّي هدفك الأول إن عائدك يتفوّق على التضخم — ده الحد الأدنى للحفاظ على قيمتك."],
["احمِ ثروتك من الخسارة","أول قاعدة في الاستثمار عند كلاسون: <strong>متخسرش رأس مالك</strong>. الأمان قبل العائد. أي عرض بعائد مغري مع مخاطرة مجهولة أو غير مفهومة هو فخ، مهما كان اللي بيعرضه مقنع أو قريب منك.","حد بيعرض عليك عائد 40% مضمون شهرياً — القاعدة تقولك ده إنذار احتيال مش فرصة نادرة.","لو مش قادر تشرح إزاي هييجي العائد ده ومن فين، متحطش فيه فلوسك."],
["استشر أهل الخبرة الصح","الكتاب بيحذّر من أخذ النصيحة من غير المتخصص. الناس بتسأل أقرب حد مش أفهم حد، والنتيجة قرارات مبنية على حماس مش خبرة. <strong>المصدر بيحدد جودة النصيحة</strong>.","متسألش صاحبك اللي بيبيع موبايلات عن الأسهم لمجرد إنه متحمّس؛ اسأل حد شغله فعلاً في السوق ومسؤول عن نتيجته.","اسأل دايماً: الشخص ده مصلحته إيه من نصيحته؟ ولو فيه عمولة، خُد كلامه بحذر مضاعف."],
["الديون الاستهلاكية عدو","الاقتراض للاستهلاك بيخصم من دخلك المستقبلي مقابل متعة حاضرة. النتيجة إنك بتشتغل شهور جاية عشان حاجة استهلكتها خلاص. الكتاب بيفرّق ضمنياً بين <strong>دين بيبني أصل ودين بيموّل استهلاك</strong>.","قسط على تليفون أو أجهزة بيقلل قدرتك على الادخار شهور من غير أي عائد مقابل.","سدّد الديون الاستهلاكية الأول قبل ما تفكّر في الاستثمار — فايدتها غالباً أعلى من أي عائد متوقع."],
["امتلك بيتك بدل الإيجار الدائم","في سياق الكتاب، تحويل مصروف السكن المتكرر لملكية بيحرّر جزء من دخلك على المدى الطويل ويدّي استقرار. النقطة مش \"العقار استثمار مضمون\"، النقطة إن <strong>مصروف دائم بلا نهاية بيستنزف قدرتك على البناء</strong>.","بدل إيجار بيزيد كل سنة لأجل غير مسمّى، خطة ملكية بتنتهي عند نقطة معيّنة فتتحرر بعدها.","خُد الفكرة كمبدأ عام مش قاعدة مطلقة — قارن الأرقام في سوقك قبل أي قرار."],
["أمّن دخلاً لمستقبلك","كلاسون بينبّه إن الشيخوخة وانقطاع الدخل حتمية، فالتخطيط ليها لازم يبدأ بدري وإنت قادر. <strong>الاستعداد المبكر أرخص بكتير</strong> من محاولة اللحاق في آخر لحظة.","تبدأ ادخار تقاعدي في العشرينات بمبلغ صغير، فتوصل لنتيجة أفضل من حد بدأ في الأربعينات بمبلغ مضاعف.","حدد النهاردة نسبة مخصصة للمدى الطويل ومتمسّهاش مهما كانت الظروف العادية."],
["زوّد قدرتك على الكسب","المبدأ الأخير في الكتاب وأهم واحد على المدى الطويل: الاستثمار في <strong>مهاراتك ومعرفتك</strong>. كل ما زادت قدرتك على تقديم قيمة، كل ما زاد دخلك، وبالتالي قدرتك على الادخار والاستثمار.","حد طوّر مهارة مطلوبة في سوق العمل فزاد دخله 40% — الزيادة دي أقوى من أي عائد استثماري في نفس السنة.","خصص جزء من دخلك ووقتك للتعلّم — عائد الاستثمار في نفسك عادةً الأعلى."],
["الحظ بيجي للمستعد","الكتاب بيتناول فكرة الحظ بشكل عملي: الفرص بتعدي على الناس كلها تقريباً، لكن <strong>اللي عنده مدّخرات ومعرفة هو اللي يقدر يستغلها</strong>. اللي مش مستعد بتفوته الفرصة حتى لو شافها بعينه.","فرصة استثمار كويسة ظهرت — واحد عنده سيولة جاهزة دخل فيها، والتاني شافها وعدّت لإن مفيش معاه.","السيولة الجاهزة مش فلوس عاطلة — دي قدرتك على التحرك لما الفرصة تيجي."],
["التأجيل عدو الثروة","المماطلة بتتنكر في صورة \"هبدأ لما...\": لما دخلي يزيد، لما الظروف تستقر، لما أفهم أكتر. الكتاب بيعتبر ده <strong>أخطر عادة</strong> لإنها بتاكل السلاح الوحيد المجاني: الوقت.","تأجيل البداية خمس سنين بمبلغ صغير بيكلّفك أكتر بكتير مما تتخيل بسبب فقدان التراكم.","ابدأ النهاردة بأي مبلغ ولو رمزي — الحركة نفسها بتكسر عادة التأجيل."],
["السداد المنظّم للديون","الكتاب بيقدّم منهج عملي للخروج من الدين: تخصيص نسبة ثابتة من الدخل لسداد الديون بانتظام، مع الاستمرار في ادخار نسبة أصغر، والعيش على الباقي. <strong>الخطة المكتوبة والانتظام</strong> أهم من حجم الدفعة.","تقسّم دخلك: نسبة للسداد المنتظم، نسبة للادخار، والباقي للمعيشة — وتلتزم بيها شهرياً بدل السداد العشوائي.","التواصل مع الدائنين بخطة واضحة أفضل من التهرب — الانتظام بيبني ثقة ويقلل الضغط."]

{t:"سيكولوجية المال",a:"مورجان هاوسل",tag:"السلوك المالي",
idea:"النجاح المالي سلوك أكتر منه ذكاء. طريقة تصرفك وقت الخوف والطمع بتحدد نتيجتك أكتر من أي معادلة.",
ctx:"الكتاب مبني على فكرة إن المال مش مادة رياضية، هو <strong>مادة سلوكية</strong>. هاوسل بيقول إن حد بدون أي تعليم مالي ممكن يبني ثروة بالصبر، وحد بشهادات عالية ممكن يفلس بالطمع. الكتاب مجموعة فصول قصيرة مستقلة، كل واحد بيعالج تحيّز نفسي واحد — وده بيخليه سهل القراءة جداً ومناسب لأي مستوى.",
topics:[
["السلوك أهم من المعرفة","الفكرة الأساسية في الكتاب: النتائج المالية بتتحدد بـ<strong>كيفية تصرفك وقت الضغط</strong> أكتر من كمية معرفتك. الشخص اللي بيعرف القليل لكن منضبط ومستمر بيتفوّق على العبقري اللي بيتخلى عن خطته مع أول هزة. السبب إن المعرفة بتتحوّل لنتيجة بس لما السلوك يسمح ليها.","مستثمر بيحط مبلغ ثابت شهرياً 20 سنة من غير ما يلمس محفظته بيتفوّق على حد ذكي بيدخل ويخرج مع كل خبر عاجل.","قيّم نفسك بسؤال: كام مرة غيّرت خطتك السنة اللي فاتت؟ لو كتير، مشكلتك سلوكية مش معرفية."],
["قوة التراكم والوقت","العائد المركّب بيشتغل بشكل غير بديهي: <strong>الوقت أقوى من نسبة العائد</strong>. سنين إضافية بتفرق أكتر بكثير من نقاط عائد إضافية، لإن التراكم بيتضاعف على نفسه. عشان كده أهم قرار مش \"إيه أعلى عائد\" لكن \"إزاي أفضل مستثمر لأطول فترة\".","عائد 10% لمدة 30 سنة بيتفوّق بفارق ضخم على عائد 15% لمدة 10 سنين — الوقت هو البطل الحقيقي.","الأولوية إنك متقطعش السلسلة. عائد متوسط مستمر أفضل من عائد ممتاز متقطع."],
["كفاية (Enough)","من غير تعريف شخصي واضح لكلمة \"كفاية\"، إنت في خطر دائم: بتخاطر بحاجة تملكها وتحتاجها عشان تكسب حاجة متملكهاش ومش محتاجها. <strong>الطمع بيلغي سنين نجاح</strong> في قرار واحد.","حد وصل لثروة مريحة تكفّيه، وخاطر بيها كلها في صفقة طماعة وخسر كل حاجة — سنين النجاح اتلغت في شهور.","اكتب رقم أو وضع مالي تعتبره \"كفاية\" بالنسبالك. من غير الرقم ده مفيش نقطة توقف."],
["البقاء أهم من التفوّق","الأولوية مش تحقيق أعلى عائد سنة واحدة، الأولوية <strong>إنك تفضل موجود في اللعبة</strong>. الإفلاس أو الخروج الاضطراري بيلغي كل المكاسب اللي قبله مهما كانت كبيرة. عشان كده الهامش والاحتياطي أهم من الكفاءة القصوى.","محفظة عائدها متوسط بس محدش اضطر يبيعها في أزمة بتتفوّق على محفظة عالية العائد اتصفّرت مرة واحدة.","صمّم خطتك عشان تصمد في أسوأ سيناريو، مش عشان تتألق في أحسن سيناريو."],
["الحظ والمخاطرة توأم","النجاح فيه نصيب من الحظ، والفشل فيه نصيب من سوء الحظ — والاتنين صعب تفصلهم عن المهارة. النتيجة العملية: <strong>متقلّدش قصص النجاح حرفياً</strong> ومتحكمش على نفسك بقسوة من نتيجة واحدة.","قصة حد كسب ثروة من سهم واحد مش وصفة قابلة للتكرار — ممكن تكون صدفة اتسمّت مهارة بعد الحدث.","ادرس الأنماط المتكررة مش القصص الفردية الاستثنائية."],
["التفاؤل مع الاستعداد للأسوأ","التركيبة الصحية: تتوقع إن السوق هيصعد على المدى الطويل، وفي نفس الوقت تتوقع إن الطريق هيكون فيه انهيارات وسنين سيئة. <strong>التفاؤل بيخليك تستثمر، والاستعداد بيخليك تصمد</strong>.","تفضل مستثمر لعقود، وعندك في نفس الوقت صندوق طوارئ يمنعك تبيع في أسوأ لحظة.","خطط على أساس إن هيحصل انهيار — مش لو حصل. ده بيغيّر تصميم محفظتك تماماً."],
["التقلبات ثمن مش غرامة","معظم الناس بتتعامل مع هبوط السوق كعقوبة على خطأ ارتكبوه، والصح إنه <strong>تكلفة الدخول للعائد طويل المدى</strong>. زي ما مفيش خدمة كويسة من غير سعر، مفيش عائد مرتفع من غير تقلب. اللي بيرفض يدفع الثمن ده بيخرج من اللعبة بدري.","سوق نزل 25% في سنة — ده مش دليل إن استثمارك غلط، ده الرسوم الطبيعية اللي بتدفعها مقابل عائد العقود.","لما تحس إن التقلب عقوبة، فكّر فيه كسعر تذكرة. السعر ده بيشتري لك العائد."],
["الثروة هي اللي متشوفهاش","التمييز الحاسم بين الغِنى والثروة: الغِنى هو الاستهلاك الظاهر (عربية، ساعة، سكن)، والثروة هي <strong>الأصول اللي لسه محدش شافها لإنها متصرفتش</strong>. اللي بتشوفه على الناس هو إنفاقهم، مش رصيدهم.","حد بيقود عربية فارهة ممكن يكون مديون؛ وحد بسيط في مظهره ممكن يكون عنده محفظة كبيرة.","كل جنيه بتصرفه على مظهر الثروة هو جنيه مش هيبقى ثروة. الاختيار حرفي كده."],
["المدخرات بلا سبب محدد","هاوسل بيدافع عن الادخار حتى من غير هدف معلن، لإن <strong>المرونة نفسها عائد</strong>. المدّخرات بتديك قدرة على الرفض، على الانتظار، وعلى استغلال فرص مفاجئة — وده صعب تقيّسه بس قيمته ضخمة.","حد عنده سيولة قدر يرفض عرض شغل سيء ويستنى الأحسن؛ وحد تاني اضطر يقبل لإنه مضغوط مالياً.","اعتبر المدّخرات شرائك لحرية الاختيار، مش مجرد رقم في حساب."],
["الاعتدال بدل التطرف","الخطط المتطرفة بتنكسر: تقشف شديد بيولّد انفجار استهلاكي، ومخاطرة قصوى بتولّد ذعر. <strong>الخطة المعتدلة اللي تقدر تعيش بيها سنين</strong> بتتفوّق على خطة مثالية على الورق بتسيبها بعد شهور.","حد قرر يدخر 60% من دخله فمصمّدش سنة ورجع صفر؛ وحد ادخر 15% باستمرار عشر سنين فبنى فعلاً.","اسأل عن أي خطة: هقدر ألتزم بيها 10 سنين؟ لو لأ، خفّفها دلوقتي."],
["كل واحد بيلعب لعبة مختلفة","جزء كبير من الأخطاء بييجي من تقليد ناس أهدافهم وأفقهم الزمني مختلف تماماً عنك. <strong>المضارب اليومي والمستثمر لعشرين سنة بيشوفوا نفس السهم بشكل مختلف</strong> — ولو قلّدت اللي مش زيك هتاخد قراراته من غير ظروفه.","بتسمع حد بيمدح سهم فتشتريه — بس هو داخل ليوم واحد وإنت داخل لعشر سنين، فسلوككم لازم يختلف.","قبل ما تاخد أي نصيحة، اسأل: الشخص ده بيلعب نفس لعبتي؟ أفقه الزمني قد إيه؟"],
["الأخطاء متوقعة فخطط ليها","الخطة اللي مفيهاش مساحة للخطأ بتنكسر مع أول مفاجأة. هاوسل بيشجّع على <strong>هامش أمان في كل حاجة</strong>: في العائد المتوقع، في السيولة، وفي توقعاتك الزمنية. المستقبل مجهول والخطة الجامدة بتفترض العكس.","لو خطتك بتحتاج عائد 12% سنوياً بالضبط عشان تنجح، فأي سنة ضعيفة بتهدّها — بينما خطة بتفترض 7% بتصمد.","استخدم توقعات متحفظة في تخطيطك. المفاجأة السارة أحسن بكتير من المفاجأة المؤلمة."]

{t:"المشي العشوائي في وول ستريت",a:"برتون مالكيل",tag:"كفاءة السوق والمؤشرات",
idea:"التفوّق المستمر على السوق صعب جداً، فالاستثمار منخفض التكلفة في مؤشرات متنوعة غالباً أفضل من الاجتهاد في اختيار الأسهم.",
ctx:"عنوان الكتاب نفسه هو الحجة: <strong>حركة الأسعار قصيرة المدى أقرب للعشوائية</strong>، بمعنى إن السعر بكرة مش بيتحدد بنمط في سعر النهاردة. مالكيل بيراجع بالأدلة أداء المحللين والصناديق النشطة عبر عقود، ونتيجته إن أغلبهم مبيتفوّقش على السوق بعد الرسوم. الكتاب بيغطي كمان تاريخ الفقاعات والنظريات المالية بلغة مبسّطة.",
topics:[
["فرضية كفاءة السوق","الفكرة إن المعلومات المتاحة بتنعكس في الأسعار بسرعة كبيرة، فلما توصلك معلومة عامة غالباً السعر استوعبها خلاص. <strong>مش معناها إن الأسعار دايماً صح</strong>، معناها إن استغلال المعلومة العامة للتفوّق المستمر صعب جداً. الأخطاء بتحصل، بس التنبؤ بيها بشكل متكرر أصعب مما يبدو.","خبر أرباح ممتاز بيتسعّر في دقائق من إعلانه — لما توصلك الأخبار وتقرر تشتري، الحركة الكبيرة حصلت.","لو استراتيجيتك بتعتمد على معلومة الكل شايفها، فمفيش ميزة فيها."],
["ليه الإدارة السلبية غالباً بتكسب","المقارنة الجوهرية في الكتاب: أغلب الصناديق النشطة بتفشل تتفوّق على مؤشرها المرجعي على المدى الطويل، والسبب الرياضي بسيط — <strong>مجموع المستثمرين بيحقق عائد السوق قبل التكاليف، فبعد التكاليف المتوسط لازم يقل عنه</strong>. اللي عنده تكاليف أقل بيحتفظ بنصيب أكبر.","صندوق نشط عائده 11% ورسومه 2% بيديك 9%؛ ومؤشر عائده 10% ورسومه 0.2% بيديك 9.8% — المؤشر كسب رغم إن عائده الخام أقل.","قارن دايماً العائد بعد الرسوم مش قبلها، وقارنه بمؤشر مرجعي مش بالصفر."],
["الرسوم بتاكل العائد","نسبة صغيرة سنوياً شكلها بسيط، لكنها بتتخصم كل سنة من رأس مال بيكبر، فأثرها التراكمي ضخم. <strong>الرسوم هي التكلفة الوحيدة المؤكدة</strong> في الاستثمار — العائد مش مضمون بس الرسوم مضمونة.","فرق 1.5% سنوياً على 25 سنة ممكن ياكل شريحة كبيرة جداً من ثروتك النهائية مقارنة ببديل أرخص.","قبل أي منتج استثماري، اسأل عن إجمالي التكلفة السنوية بالنسبة المئوية — مش عن العائد المتوقع."],
["فقاعات السوق بتتكرر","مالكيل بيستعرض فقاعات تاريخية متعددة عبر قرون، والنمط شبه ثابت: قصة مقنعة عن \"عصر جديد\"، ارتفاع سريع يجذب المزيد، تبرير الأسعار بمنطق جديد، ثم انهيار. <strong>الأداة بتتغير والسلوك البشري ثابت</strong>.","كل فترة بيظهر أصل بيتقال عنه \"مالوش سقف\" وإن القواعد القديمة مش منطبقة عليه — والنمط بينتهي بنفس الطريقة غالباً.","لما تسمع \"المرة دي مختلفة\"، دي أخطر جملة في الاستثمار. اطلب أرقام مش قصص."],
["حدود التحليل الفني","نقد الكتاب للتحليل الفني إنه بيدوّر على أنماط في سلسلة أقرب للعشوائية، والأنماط اللي بتظهر ممكن تكون صدفة إحصائية. كمان لو نمط اشتغل فعلاً، <strong>انتشاره بيلغي ميزته</strong> لإن الكل هيتحرك عليه.","نمط على الشارت اشتغل تلات مرات مش دليل إنه هيشتغل الرابعة — دي عيّنة صغيرة جداً للحكم.","لو استخدمت الفني، استخدمه لتحديد التوقيت والانضباط مش كأساس للقرار."],
["حدود التحليل الأساسي","مالكيل مش بيرفض الأساسي لكنه بيحدّد قيوده: التقييم بيعتمد على <strong>تقديرات مستقبلية</strong> للأرباح والنمو، وأي خطأ صغير في الافتراضات بيغيّر النتيجة كتير. كمان المحللين بيغلطوا بشكل منهجي وبيميلوا للتفاؤل.","توقّع نمو 15% بدل 10% ممكن يغيّر القيمة العادلة المقدّرة بنسبة كبيرة جداً، والفرق بين النسبتين تخمين.","استخدم سيناريوهات متعددة (متفائل/محايد/متشائم) بدل رقم واحد."],
["توزيع الأصول حسب العمر والظروف","المبدأ العملي: كل ما قرب احتياجك للفلوس، كل ما قلّت نسبة الأصول المتقلبة. لكن مالكيل بينبّه إن العمر مش العامل الوحيد — <strong>استقرار دخلك وقدرتك النفسية</strong> على تحمّل الهبوط مهمين بنفس القدر.","شاب في العشرينات بدخل مستقر يتحمّل نسبة أسهم عالية؛ حد قرّب على المعاش أو دخله متذبذب يزوّد الأدوات الثابتة.","حدد نسبتك على أساس: متى أحتاج الفلوس؟ وكام هبوط أقدر أتحمّله من غير ما أبيع؟"],
["التنويع عبر الأصول والأسواق","التنويع الفعّال مش مجرد كتر عدد الأسهم، لكنه <strong>خلط أصول سلوكها مختلف</strong> (أسهم، سندات، عقارات، أسواق مختلفة). الهدف إن مش كل حاجة تنزل مع بعض في نفس الوقت.","محفظة كلها أسهم محلية في قطاع واحد بتتحرك ككتلة واحدة؛ محفظة موزّعة على أصول وأسواق بتتحمل الصدمات أحسن.","اسأل: لو القطاع ده أو السوق ده اتضرب، محفظتي هتخسر كام؟"],
["متوسط التكلفة والاستثمار المنتظم","الاستثمار بمبلغ ثابت على فترات منتظمة بيقلل خطر التوقيت السيئ، لإنك بتشتري كميات أكبر لما السعر يقل وأقل لما يعلا. <strong>ميزته الأساسية سلوكية</strong>: بيشيل عبء قرار \"إمتى أدخل\".","بدل ما تحتار تدخل النهاردة ولا تستنى، تحط مبلغ ثابت كل شهر بغض النظر عن السعر.","أتمت العملية شهرياً — الأتمتة بتحميك من التردد والتوقيت العاطفي."],
["إعادة التوازن الدورية","لما نسب الأصول تنحرف بفعل السوق، إعادة التوازن بترجّعها لمستوى المخاطرة اللي اخترته. الأثر الجانبي المفيد إنها <strong>بتبيع اللي غلي وتشتري اللي رخص آلياً</strong> من غير اجتهاد أو تنبؤ.","المستهدف 70/30 وبقى 82/18 بعد صعود — بتبيع جزء من الأسهم وترجّع النسبة.","حدد موعد سنوي ثابت لإعادة التوازن بدل ما تقرر حسب مزاجك."],
["الأداء الماضي مش وعد بالمستقبل","الصناديق اللي أدّت ممتاز في فترة نادراً ما بتفضل في القمة، وفي ميل إحصائي للرجوع للمتوسط. <strong>ملاحقة الأداء الماضي</strong> واحدة من أكتر الأخطاء تكلفة لإنك بتشتري بعد الارتفاع.","تختار صندوق لإنه كان الأعلى السنة اللي فاتت، فتلاقيه في المتوسط أو تحته السنين اللي بعدها.","لو هتقيّم صندوق، بص على التكلفة والاتساق على 10 سنين مش على أفضل سنة."],
["الضرايب والتكاليف الخفية","العائد الحقيقي هو اللي بيوصلك بعد الرسوم والضرايب وتكاليف التداول. كتر البيع والشراء بيزوّد التكاليف دي، وده سبب إضافي لتفضيل <strong>الاحتفاظ طويل الأجل</strong> على الحركة الكثيرة.","محفظتين بنفس القرارات: واحدة بتتداول كتير والتانية بتحتفظ — الفرق النهائي بيرجع للتكاليف مش للذكاء.","احسب تكلفة كل صفقة قبل ما تعملها، وقلل عدد الصفقات كقاعدة."]

ctx:"لينش كان مدير صندوق حقّق نتائج استثنائية لسنين، والكتاب خلاصة منهجه. رسالته الأساسية <strong>مضادة لفكرة إن السوق للمحترفين بس</strong>: الفرد عنده مزايا المؤسسات مبتقدرش تستغلها — مفيش ضغط أداء ربع سنوي، ومفيش قيود حجم، وعنده ملاحظة مباشرة للسوق الاستهلاكي. بس بيشترط شرط صارم: الملاحظة بداية البحث مش نهايته.",
topics:[
["استثمر في اللي بتفهمه","القاعدة الأولى عند لينش: لو مش قادر تشرح شغل الشركة في جملتين لطفل، متحطش فيها فلوسك. <strong>الفهم البسيط بيحميك من الأوهام</strong> ومن الذعر كمان — لما تفهم مصدر أرباح الشركة، بتقدر تحكم لو الهبوط مؤقت ولا الأساسيات اتغيّرت.","بتشتغل في مجال الأدوية وفاهم سوقه ومنافسيه؟ ميزتك هناك أكبر بكتير من محاولتك تحلل شركة تكنولوجيا معقدة متعرفش عنها حاجة.","اكتب في سطرين: الشركة دي بتكسب فلوسها منين؟ لو متعرفش، ده مش سهمك."],
["ميزة المستثمر الفرد","المحللون بيوصلهم التقرير بعد ما الشركة تعلنه؛ إنت بتشوف الزحمة في المحل وبتلاحظ المنتج اللي الكل بيشتريه <strong>قبل ما يوصل للأرقام الرسمية</strong>. الميزة دي حقيقية بس محدودة الزمن — لازم تتصرف عليها ببحث سريع.","لاحظت سلسلة مطاعم بتفتح فروع بسرعة وزحمة دايماً في كل فرع — دي إشارة تبدأ منها بحثك، مش أمر شراء.","خلّي عندك دفتر ملاحظات للمنتجات والشركات اللي بتلفت نظرك في حياتك اليومية."],
["تصنيف الشركات لأنواع","لينش بيقسّم الشركات لفئات، وكل فئة ليها توقعات مختلفة تماماً: <strong>البطيئة</strong> (نمو محدود وتوزيعات)، <strong>المستقرة</strong> (نمو معتدل وثبات في الأزمات)، <strong>سريعة النمو</strong> (فرصة مضاعفة ومخاطرة أعلى)، <strong>الدورية</strong> (بتتحرك مع دورات الاقتصاد)، <strong>المتعافية</strong> (خارجة من أزمة)، و<strong>صاحبة الأصول المخفية</strong>. الخطأ الشائع إنك تتوقع سلوك فئة من فئة تانية.","متتوقعش من شركة مرافق مستقرة إنها تتضاعف زي شركة ناشئة؛ ومتتفاجئش لو شركة حديد نزلت مع الركود — ده طبعها.","قبل ما تشتري، صنّف الشركة وحدد توقعك المناسب لفئتها."],
["البحث قبل الشراء","الملاحظة نقطة البداية بس. لازم بعدها تقرا الأرقام: الأرباح ونموها، الديون، هوامش الربح، المنافسة، وخطط التوسع. <strong>المنتج الشعبي مش معناه شركة رابحة</strong> — ممكن تكون بتبيع بخسارة أو غارقة في ديون.","المنتج بيتباع بجنون؟ طيب الشركة بتكسب منه فعلاً؟ ولا بتحرق فلوس عشان تكسب حصة سوقية وعليها قروض ضخمة؟","خصص ساعتين على الأقل لقراءة أرقام أي شركة قبل ما تشتريها."],
["قصة السهم في دقيقتين","تمرين عملي بيقترحه لينش: قبل ما تشتري، اشرح لنفسك بصوت عالٍ في دقيقتين <strong>ليه بتشتري، وإيه اللي لازم يحصل عشان تنجح، وإيه اللي ممكن يوقعها</strong>. لو مش قادر تعمل كده، إنت مش جاهز.","تشرح: الشركة بتوسّع في محافظات جديدة، هامشها بيتحسن، والدين قليل — والخطر إن منافس كبير يدخل بأسعار أقل.","سجّل \"قصة السهم\" مكتوبة، وراجعها كل ربع سنة: هل القصة لسه صحيحة؟"],
["الصبر على النمو","الشركات الكويسة محتاجة سنين تظهر نتيجتها في السعر، والسوق ممكن يتجاهلها فترة طويلة. <strong>البيع بعد شهور من الملل بيضيّع أكبر جزء من العائد</strong>، لإن معظم المكاسب بتيجي في فترات قصيرة غير متوقعة.","سهم اشتريته وفضل ثابت سنة كاملة فبعته بالملل — وبعدها بسنتين اتضاعف لما نمو الشركة ظهر في الأرباح.","لو أسباب شرائك لسه قائمة، الملل مش سبب للبيع."],
["تجاهل توقعات الاقتصاد العامة","لينش بيسخر من فكرة تأجيل الاستثمار انتظاراً لوضوح الاقتصاد. محدش بيتوقع الركود والفوائد باستمرار، و<strong>الشركة الممتازة بتنجح في ظروف مختلفة</strong>. ركّز على أداء الشركة بدل التنبؤ بالاقتصاد الكلي.","بدل ما تستنى \"يستقر السوق\" لسنين، اسأل: الشركة دي بتكبر أرباحها ولا لأ؟","خصص وقتك لدراسة الشركات مش لقراءة توقعات الاقتصاد."],
["الشركات المملة فرصة","من أفكار لينش المميزة: الشركات اللي اسمها ممل ونشاطها غير جذاب <strong>بتكون مهملة من المحللين</strong>، فسعرها ممكن يكون أقل من قيمتها. العكس صحيح: الشركة اللي الكل بيتكلم عنها غالباً سعرها استوعب التفاؤل كله.","شركة تصنيع مواسير أو خدمات صناعية مملة ممكن تكون أرباحها ممتازة ومحدش مهتم بيها، بينما شركة في قطاع \"ساخن\" سعرها مبالغ فيه.","اسأل: الشركة دي متابَعة من كام محلل؟ الإهمال ممكن يكون فرصة."],

["إمتى تبيع","البيع عند لينش مرتبط بـ<strong>تغيّر القصة مش تحرّك السعر</strong>: تبيع لما تتحقق أسباب الشراء بالكامل، أو لما تتدهور الأساسيات، أو لما تلاقي فرصة أوضح. البيع لمجرد إن السهم ارتفع 30% بيقطع النمو المركّب.","سهم ارتفع فبعته وفرحت — وبعدها اتضاعف مرتين لإن الشركة كانت لسه في بداية توسعها.","قبل البيع، راجع قصة السهم: هل السبب اللي اشتريت عشانه لسه موجود؟"],

ctx:"الكتاب دراسة إحصائية ضخمة بتتبع أداء الأصول المختلفة عبر <strong>قرنين من الزمن</strong>. القيمة الأساسية فيه إنه بيحوّل الجدل من الآراء للأرقام: بدل ما نتناقش هل الأسهم أفضل من الذهب، سيجل بيعرض البيانات. النتيجة المفاجئة للكثيرين إن الأصل اللي بيبان \"خطر\" (الأسهم) هو الأكثر أماناً على المدى الطويل، والأصل اللي بيبان \"آمن\" (النقد) هو الأخطر على قوتك الشرائية.",
topics:[
["العائد الحقيقي بعد التضخم","الفكرة اللي بيبني عليها الكتاب كله: الرقم الاسمي مضلل. اللي يهم فعلاً هو <strong>قوتك الشرائية بعد التضخم</strong>. أداة عائدها 20% في بلد تضخمه 25% هي خسارة حقيقية، وأداة عائدها 5% مع تضخم 2% هي مكسب حقيقي أكبر.","شهادة بعائد 20% وتضخم 25% = خسارة حقيقية 5% في قدرتك الشرائية، رغم إن رصيدك الرقمي زاد.","احسب دايماً: العائد ناقص التضخم. الرقم ده هو عائدك الحقيقي الوحيد."],
["الأسهم مقابل الأدوات الأخرى تاريخياً","على مدى عقود طويلة، البيانات بتوضّح إن الأسهم تفوّقت على السندات والذهب والنقد في العائد الحقيقي. السبب المنطقي إن السهم <strong>حصة في نشاط إنتاجي بينمو</strong>، بينما الذهب معدن لا ينتج شيء والنقد بيتآكل.","النقد بيبان آمن، بس على 30 سنة التضخم بياكل معظم قيمته؛ الأسهم تقلبت أكتر بكتير وحافظت على القيمة وزوّدتها.","لو أفقك عقود، تخصيص نسبة معتبرة للأسهم مبرّر تاريخياً — بشرط تحمّل التقلب."],
["الوقت بيقلل المخاطرة","نتيجة إحصائية مهمة: تقلب الأسهم عالي جداً على المدى القصير، لكن <strong>كل ما امتدت المدة كل ما ضاق نطاق النتائج</strong> وقلّ احتمال الخسارة الحقيقية. الأسهم مش خطرة أو آمنة بشكل مطلق — الخطورة دالة في الزمن.","سنة واحدة ممكن تخسر فيها 30%؛ على عشرين سنة احتمال الخسارة الحقيقية تاريخياً بيقل بشكل واضح جداً.","اسأل الأول: امتى محتاج الفلوس؟ الإجابة هي اللي بتحدد نسبة الأسهم مش رأيك في السوق."],
["توقيت السوق مقابل الوقت في السوق","محاولة الخروج قبل الهبوط والدخول قبل الصعود بتفشل غالباً، والسبب إن <strong>معظم العائد بيتركّز في أيام قليلة جداً</strong> غير متوقعة. اللي بيخرج ويستنى \"وضوح الصورة\" بيفوّت الأيام دي عادةً.","لو خرجت من السوق وفوّتت أقوى عشر جلسات صعود في عقد، عائدك بيتراجع بشكل كبير جداً.","الاستمرار في السوق أهم إحصائياً من إتقان التوقيت — والأمرين مش متعادلين."],
["التنويع الجغرافي والقطاعي","الاعتماد على سوق واحد بيعرّضك لمخاطر محلية ممكن تستمر عقد كامل: ركود طويل، أزمة عملة، أو تغيّر تنظيمي. <strong>التوزيع بيقلل الاعتماد على مصير واحد</strong>.","سوق دولة واحدة ممكن يفضل راكد سنين طويلة بينما أسواق تانية بتنمو — التوزيع بيحميك من سوء حظ جغرافي.","لو أغلب استثمارك في سوق واحد، اسأل نفسك: إيه خطتي لو السوق ده ركد عشر سنين؟"],
["توقعات معقولة للعائد","التوقعات المبالغ فيها بتدمّر الخطط لإنها بتخلي العائد الطبيعي يبان فشل، فتجري ورا مخاطرة أعلى. سيجل بيدعو لتوقع <strong>عائد حقيقي معتدل مع سنين ضعيفة متوقعة</strong> ضمن المسار.","لو مستني 40% سنوياً، أول سنة عائدها 8% هتخليك تسيب خطتك وتدوّر على حاجة \"أفضل\" — وغالباً أخطر.","اكتب توقعك السنوي المتحفظ، واعتبر أي زيادة مكافأة مش استحقاق."],
["مكرر الربحية وتوقعات المستقبل","الكتاب بيربط بين مستوى التقييم عند دخولك والعائد المتوقع بعدها: الدخول عند تقييمات مرتفعة تاريخياً بيرتبط بعوائد لاحقة أقل، والعكس. <strong>السعر اللي بتدفعه بيحدد جزء كبير من عائدك</strong>.","دخول السوق وهو عند مكررات مرتفعة جداً تاريخياً معناه توقع عائد أقل في السنين اللي بعدها، حتى لو الشركات كويسة.","التقييم مش أداة توقيت دقيقة، لكنه مؤشر مفيد لتعديل توقعاتك ونسبك."],
["دور السندات في المحفظة","السندات عائدها الحقيقي أقل تاريخياً، لكن دورها مش زيادة العائد — دورها <strong>تقليل التقلب وحماية سلوكك</strong>. وجودها بيخلّيك تصمد وقت انهيار الأسهم بدل ما تبيع في القاع.","محفظة فيها سندات بتنزل أقل في الأزمة، فصاحبها بيقدر يستحمل ومايبيعش — وده بيحافظ على عائده طويل المدى.","حدد نسبة السندات على أساس تحمّلك النفسي مش على أساس العائد المتوقع بس."],
["الاستثمار الدوري والانضباط","الاستثمار بمبالغ منتظمة بيقلل أثر التوقيت وبيحوّل التقلب من تهديد لفرصة، لإنك بتشتري أكتر لما الأسعار تقل. <strong>الانضباط الآلي بيتفوّق على الاجتهاد العاطفي</strong>.","خلال هبوط طويل، المستثمر المنتظم بيجمّع كميات أكبر بسعر أقل فبيستفيد بقوة وقت التعافي.","أتمت مساهماتك وخليها مستقلة عن أخبار السوق تماماً."],
["الأزمات جزء من المسار","البيانات التاريخية بتوضّح إن الأسواق مرّت بحروب وكساد وأزمات مالية متعددة، ومع ذلك المسار طويل المدى استمر صاعد. <strong>الأزمة حدث متوقع مش استثناء</strong> — الخطة اللي مش حاسبة أزمات هي خطة ناقصة.","كل جيل عاش أزمة اعتبرها نهاية العالم المالي، والأسواق استمرت بعدها بسنين طويلة من النمو.","افترض في خطتك إنك هتشوف عدة انهيارات — وده بيغيّر تصميمها من البداية."],
["الفرق بين المخاطرة الحقيقية والمتصوّرة","المخاطرة المتصوّرة بتزيد وقت الهبوط بينما المخاطرة الحقيقية بتقل (لإن الأسعار بقت أرخص)، والعكس في القمم. <strong>مشاعرك بتتحرك عكس الواقع</strong> — وده سبب أخطاء التوقيت الجماعية.","وقت الذعر، الناس بتشوف الأسهم أخطر ما يكون بينما تقييماتها بقت أرخص وفرصتها المستقبلية أحسن.","لما تحس إن السوق \"خطر جداً\"، راجع الأرقام قبل ما تتصرف على الإحساس."],
["العملة والتضخم في الأسواق الناشئة","في أسواق التضخم فيها مرتفع وعملتها متقلبة، حساب العائد الحقيقي بيبقى أهم بكتير، والأصول المرتبطة بالإنتاج بتاخد أهمية إضافية كحماية نسبية. <strong>الاسمي بيخدع أكتر لما التضخم أعلى</strong>.","في بيئة تضخم مرتفع، عائد ثابت يبان كبير رقمياً ممكن يكون خسارة حقيقية واضحة كل سنة.","في بيئة تضخم مرتفع، قيّم كل أداة بعائدها الحقيقي وبتنوّعك بين أنواع أصول مختلفة."]

ctx:"فيشر بيمثّل <strong>الوجه المكمّل لجراهام</strong>: جراهام بيدوّر على الرخص، وفيشر بيدوّر على الجودة. رأيه إن شركة ممتازة بسعر معقول أفضل من شركة متوسطة بسعر رخيص، لإن النمو المستمر بيعوّض فرق السعر أضعاف. الكتاب أثّر بعمق في وارن بافيت اللي وصف نفسه بإنه مزيج من الاتنين. منهجه بيتطلّب بحث نوعي مش حسابات بس.",
topics:[
["جودة الإدارة قبل الأرقام","الأرقام بتوصف الماضي؛ الإدارة بتصنع المستقبل. فيشر بيعتبر تقييم الإدارة <strong>أهم خطوة في التحليل</strong>: هل عندها رؤية طويلة؟ هل بتتصرف بنزاهة مع المساهمين؟ هل بتعترف بأخطائها؟ إدارة ضعيفة بتضيّع حتى شركة ممتازة، وإدارة قوية بتنقذ شركة متعثرة.","شركتين بنفس الأرقام: واحدة إدارتها شفافة وبتستثمر في المستقبل، والتانية بتخفي مشاكلها وتجمّل النتائج — النتيجة بعد خمس سنين هتختلف تماماً.","تابع تصريحات الإدارة وقت المشاكل مش وقت النجاح — ساعتها بتظهر معادنها."],
["البحث الميداني (Scuttlebutt)","المنهج الأشهر لفيشر: تكوين صورة عن الشركة من <strong>مصادر متعددة حول الشركة</strong> مش من تقاريرها بس — اسأل العملاء عن جودة المنتج، الموردين عن التزامها، المنافسين عن قوتها، والموظفين عن بيئتها. الصورة المجمّعة بتكشف حاجات مش موجودة في أي قائمة مالية.","قبل ما تستثمر في شركة منتجات، اسأل تجار بيبيعوها: بتتباع كويس؟ الجودة ثابتة؟ الشركة بتتعامل منيح وبتسدد في ميعادها؟","خصص وقت لسؤال ٣-٤ مصادر مختلفة عن أي شركة قبل ما تستثمر فيها."],
["الاستثمار في البحث والتطوير","الشركة اللي بتستثمر في تطوير منتجاتها بتحافظ على تفوقها؛ واللي بتاكل من رصيدها القديم بتتآكل ببطء. الأهم إن فيشر مش بيقيس الإنفاق بس، لكن <strong>كفاءته</strong>: هل الإنفاق ده بيتحوّل لمنتجات ناجحة فعلاً؟","شركة تكنولوجيا بتقلل إنفاق التطوير عشان تحسّن أرباح السنة الحالية — ده مكسب مؤقت بثمن مستقبلي كبير.","قارن إنفاق التطوير بمنتجات الشركة الجديدة آخر 5 سنين — الكفاءة أهم من الرقم."],
["هوامش الربح واستدامتها","الهامش العالي بيجذب منافسين تلقائياً. السؤال الحقيقي مش \"الهامش كام؟\" لكن <strong>إيه اللي يمنع المنافسين يقلّدوها؟</strong> الميزة التنافسية المستدامة (علامة تجارية، تكلفة أقل، تقنية محمية) هي اللي بتخلي الهامش يستمر.","هامش عالي من غير ميزة تنافسية بيجذب منافسين وبيتآكل خلال سنين قليلة.","اسأل عن كل شركة: إيه الخندق اللي بيحميها؟ ولو مفيش، الهامش مؤقت."],
["قوة التسويق والتوزيع","فيشر بيشدد إن المنتج الممتاز مش كافي لوحده — لازم شبكة توزيع ومبيعات قوية توصّله. <strong>كتير من المنتجات الأفضل تقنياً خسرت</strong> قدام منتجات أضعف بتوزيع أقوى.","شركة عندها منتج متفوق بس شبكة توزيعها ضعيفة بتخسر أمام منافس منتجه أقل جودة بس موجود في كل مكان.","قيّم قدرة الشركة على الوصول للعميل مش جودة منتجها بس."],
["العلاقة مع الموظفين","بيئة العمل الجيدة مش رفاهية — الشركة اللي بتحافظ على موظفيها الأكفاء <strong>بتحافظ على معرفتها المؤسسية</strong> وبتقلل تكاليف التدريب والأخطاء. معدل الدوران العالي علامة خطر خفية.","شركة بيسيبها كبار موظفيها باستمرار بتفقد خبرة متراكمة صعب تعويضها، حتى لو أرقامها لسه كويسة.","معدل ترك الموظفين مؤشر مبكر على مشاكل إدارية قبل ما تظهر في الأرقام."],
["الاحتفاظ بالشركات الممتازة","من أقوى أفكار الكتاب: بيع شركة ممتازة عشان السعر طلع 30% بيضيّع نمو سنين. <strong>الشركة الاستثنائية نادرة</strong>، ولما تلاقيها الأفضل تمسكها طالما أسباب امتلاكها قائمة. البيع يكون لتغيّر الأساسيات مش لتحرّك السعر.","حد باع شركة قوية بعد مكسب 30% وفوّت مضاعفة عشر أضعاف على عشر سنين — المكسب الصغير كلّفه الكبير.","قبل أي بيع اسأل: هل الشركة اتغيّرت؟ لو لأ، السعر مش سبب كافي."],
["قلة الأخطاء أهم من كتر القرارات","فيشر بيفضّل محفظة مركّزة نسبياً في شركات مفهومة بعمق على محفظة واسعة من قرارات سطحية. المنطق إن <strong>الفهم العميق بيقلل الأخطاء</strong>، والأخطاء هي اللي بتاكل العائد.","التركيز في 8–12 شركة فاهمها كويس أفضل من 40 شركة متعرفش عنهم غير الأسماء والأسعار.","العدد المناسب هو اللي تقدر تعرف عن كل شركة فيه أكتر من المتوسط."],
["الشراء في التوقيت المناسب","فيشر مش بيحاول توقيت السوق، لكنه بيلاحظ إن <strong>الشركة الممتازة أحياناً بتتعرض لمشكلة مؤقتة</strong> تنزّل سعرها — ودي أفضل لحظة شراء لو تأكدت إن المشكلة عابرة مش هيكلية.","شركة قوية نزل سهمها بسبب تعثّر منتج واحد مؤقت، بينما نشاطها الأساسي وإدارتها زي ما هما.","فرّق دايماً بين مشكلة مؤقتة وتدهور هيكلي — الأولى فرصة والتانية فخ."],
["التوسع المدروس مقابل التشتيت","الشركة اللي بتتوسّع في مجالات قريبة من قدراتها بتنجح غالباً؛ واللي بتقفز لمجالات بعيدة بتضيّع فلوس المساهمين. <strong>النمو المفيد بيبني على ميزة قائمة</strong> مش بيهرب منها.","شركة أغذية ناجحة قررت تدخل مجال التكنولوجيا فجأة — ده تشتيت مش نمو غالباً.","اسأل: التوسع ده بيستفيد من قدرات الشركة الحالية ولا بيبدأ من الصفر؟"],
["الشفافية وقت الأزمات","اختبار النزاهة الحقيقي بيحصل لما الشركة تتعثّر: هل بتصارح المساهمين بالمشكلة وخطة العلاج، ولا بتخفيها وتجمّل النتائج؟ <strong>الإدارة اللي بتخفي المشاكل الصغيرة هتخفي الكبيرة</strong>.","شركة أعلنت بوضوح عن فشل مشروع وخسائره وخطتها للتعامل — دي إشارة نزاهة أقوى من سنين من الأخبار الجيدة.","اقرا تقارير الشركة في أسوأ سنواتها — ده أفضل تقييم لمصداقيتها."],
["النظرة طويلة الأجل في القرارات","الشركات اللي بتضحّي بأرباح ربع سنوي عشان بناء طويل الأجل غالباً بتكون الأفضل للمستثمر الصبور، رغم إن السوق بيعاقبها قصير المدى. <strong>التوافق بين أفق الإدارة وأفقك</strong> مهم جداً.","إدارة بتستثمر في مصنع جديد هيقلل أرباح السنة دي لكن هيضاعف الطاقة الإنتاجية بعد سنتين — ده قرار في صالح المستثمر الطويل.","اختار شركات أفق إدارتها زي أفقك — الخلاف هنا بيسبب إحباط متبادل."]

ctx:"بوجل هو مؤسس أول صندوق مؤشرات متاح للأفراد، والكتاب خلاصة فلسفته في صفحات قليلة. حجته الأساسية <strong>حسابية مش تنبؤية</strong>: مش بيقول إن المؤشر هيتفوّق، بيقول إن التكاليف الأقل بتخلّي نصيبك من العائد أكبر حتمياً. لغة الكتاب بسيطة ومتكررة عن قصد، لإن رسالته واحدة وبيصرّ عليها.",
topics:[
["امتلك السوق بدل ما تراهن عليه","بدل محاولة اختيار الشركات الفائزة مقدماً، تملك السوق كله فتضمن إن <strong>الفائزين جواه تلقائياً</strong>. الفكرة إنك مش محتاج تعرف مين هينجح، محتاج بس تكون موجود لما ينجح.","بدل ما تحاول تخمّن أنهي خمس شركات هتنجح في العشر سنين الجاية، تملك سلة فيها السوق كله فتضمن نصيبك من نجاح أي منهم.","اسأل نفسك: هل عندي ميزة معلوماتية حقيقية تبرر اختياري لشركات بعينها؟"],
["التكلفة هي العدو الأول","العائد المستقبلي مجهول، لكن <strong>التكلفة معلومة ومؤكدة</strong>. كل جنيه رسوم بيتخصم من عائدك مباشرة، والفرق بيتضخّم على عشرات السنين. عشان كده بوجل بيعتبر خفض التكلفة أضمن طريقة لزيادة عائدك.","فرق 1% سنوياً يبان صغير، لكن على 30 سنة بياكل شريحة ضخمة من ثروتك النهائية مقارنة ببديل أرخص.","قبل أي منتج، اسأل عن إجمالي التكلفة السنوية — ده الرقم الوحيد المؤكد في المعادلة."],
["قاعدة حصة السوق","حجة بوجل الحسابية: كل المستثمرين مجتمعين بيمتلكوا السوق، فعائدهم الجماعي = عائد السوق ناقص التكاليف. يعني <strong>المستثمر المتوسط لازم يقل عن السوق بمقدار تكاليفه</strong>. اللي بيدفع أقل بيحتفظ بنصيب أكبر — ودي مسألة رياضية مش رأي.","لو السوق عائده 10% وأنت دفعت 2% رسوم، عائدك 8%؛ ولو دفعت 0.2%، عائدك 9.8%. الفرق كله جه من التكلفة.","قلل تكاليفك بدل ما تحاول تزوّد عائدك — ده الجزء اللي تتحكم فيه فعلاً."],
["البساطة تتفوّق على التعقيد","المنتجات المعقدة غالباً أغلى، وأصعب في الفهم، وأصعب في المقارنة. <strong>الخطة البسيطة اللي بتنفّذها فعلاً</strong> بتتفوّق على خطة ذكية بتسيبها بعد سنة. البساطة كمان بتقلل احتمال الغلط.","محفظة من صندوق أو اتنين بتلتزم بيهم أفضل من عشرين منتج مش فاهمهم ومش قادر تتابعهم.","لو مش قادر تشرح منتجك المالي في جملتين، ده مؤشر إنه معقد أكتر من اللازم بالنسبالك."],
["الانضباط ضد ضوضاء السوق","الأخبار اليومية مصمّمة تجذب انتباهك، والانتباه بيولّد رغبة في الحركة، والحركة بتكلّف رسوم وضرايب وأخطاء. بوجل بيقول <strong>متعملش حاجة، اقعد مكانك</strong> — وده أصعب نصيحة في التنفيذ رغم بساطتها.","كل ما تتفرج على أخبار السوق أكتر، كل ما زادت رغبتك تعدّل محفظتك من غير سبب حقيقي.","قلل متابعتك للسوق عمداً — ده قرار استثماري مش كسل."],
["إعادة التوازن الدورية","مع الوقت، نسب محفظتك بتتغير مع حركة السوق فتبعد عن مستوى المخاطرة اللي اخترته. إعادة التوازن بترجّعها، والأثر الجانبي إنها <strong>بتبيع الغالي وتشتري الرخيص آلياً</strong>.","لو المستهدف 70% أسهم وصعدت لـ85%، بتبيع جزء وترجّعها لنسبتها الأصلية.","اعمل إعادة التوازن في موعد سنوي ثابت — القاعدة أفضل من الاجتهاد."],
["استثمر لعقود مش لسنوات","ميزة المؤشرات الأساسية بتظهر مع الزمن الطويل، لإن التكلفة المنخفضة بتتراكم لصالحك سنة بعد سنة. <strong>الخروج المبكر بيلغي أهم ميزة</strong> في الطريقة كلها.","خطة 25 سنة بمساهمة شهرية ثابتة بتستفيد من التراكم بشكل مختلف تماماً عن خطة 3 سنين.","حدد أفقك من البداية بصدق — لو أقل من 5 سنين، الأسهم مش الأداة."],
["التوزيع بين الأسهم والسندات","بوجل بيقترح إطار بسيط: نسبة تتناسب مع عمرك وظروفك، مع الاعتراف إن <strong>القدرة النفسية على التحمّل جزء من المعادلة</strong> زي الأفق الزمني بالظبط. الأهم إنك تختار نسبة تقدر تعيش بيها في الانهيار.","حد قرّب على التقاعد بيزوّد الدخل الثابت؛ شاب بأفق طويل يتحمّل نسبة أسهم أعلى — بشرط ينام مرتاح.","اختبر نسبتك بسؤال: لو محفظتي نزلت 40%، هقدر أستحمل من غير ما أبيع؟"],
["متلاحقش الأداء الماضي","اختيار الصندوق الأعلى أداءً السنة اللي فاتت من أكتر الأخطاء شيوعاً، لإن <strong>الأداء بيميل للرجوع للمتوسط</strong>. إنت غالباً بتشتري بعد الارتفاع وقبل التصحيح.","تختار صندوق لإنه كان الأفضل السنة الماضية، فتلاقيه في المتوسط أو تحته السنين اللي بعدها.","لو هتقارن صناديق، قارن التكلفة والاتساق طويل المدى مش أفضل سنة."],
["الوقت في السوق أهم من توقيته","بوجل صريح: محدش بيعرف يوقّت السوق باستمرار، وأي محاولة بتكلّفك أيام الصعود الكبيرة. <strong>الحل إنك تكون موجود دايماً</strong> بدل ما تحاول تدخل وتخرج في اللحظة المناسبة.","الخروج انتظاراً لـ\"وضوح الصورة\" بيفوّت عادةً أقوى جلسات التعافي اللي بتحصل فجأة.","استثمر بانتظام آلي وخلّي القرار مستقل عن توقعاتك للسوق."],
["تجنّب المضاربة بجزء كبير","بوجل مش بيمنع المضاربة تماماً، لكنه بيقترح فصلها: خلّي <strong>الجزء الأكبر في محفظة جدية طويلة الأجل</strong>، ولو محتاج تجرّب فاعمل ده بجزء صغير مقبول خسارته ومفصول حسابياً.","تخصص نسبة صغيرة جداً للتجربة والتعلّم، والباقي في محفظة منتظمة متلمسهاش.","لو الجزء التجريبي أثّر على نومك أو خطتك، فهو أكبر من اللازم."],
["ثقة في المنظومة لا في التنبؤ","الأساس الفلسفي للكتاب: العائد طويل المدى بيجي من <strong>نمو الشركات الحقيقي</strong> (أرباح وتوزيعات) مش من تخمين حركة الأسعار. لما تملك السوق، إنت شريك في الاقتصاد الإنتاجي مش مراهن على مزاج المتداولين.","على المدى الطويل، عائد السوق بيقترب من نمو أرباح الشركات وتوزيعاتها، بينما تقلبات المزاج بتختفي في المتوسط.","ركّز على إنك تفضل مالك لأصول منتجة، وسيب توقّع الأسعار لغيرك."]

ctx:"برنشتاين طبيب أعصاب بقى كاتب مالي، وأسلوبه تحليلي وصريح لدرجة القسوة أحياناً. فكرة الكتاب إن معظم النصائح المالية بتركّز على عمود واحد وبتهمل الباقي، والنتيجة مستثمر <strong>يعرف النظرية ويقع في فخ نفسي</strong>، أو يفهم نفسه ويجهل التاريخ. الكتاب بيحاول يدّيك الأربعة مع بعض لتبني محفظة متماسكة.",
topics:[
["العلاقة بين المخاطرة والعائد","العمود الأول (النظرية): مفيش عائد مرتفع من غير مخاطرة حقيقية مقابلة. العلاقة دي <strong>مش وعد بأن المخاطرة هتديك عائد</strong>، لكنها تأكيد إن العائد المرتفع مستحيل من غير مخاطرة. أي عرض بيدّعي العكس فيه حاجة غلط.","عرض بعائد 30% سنوياً \"مضمون\" بيخالف أساس السوق — ده إنذار احتيال مش فرصة نادرة.","لما تقيّم أي فرصة، اسأل: فين المخاطرة؟ لو مش شايفها، إنت مش شايفها بس — مش معناها مش موجودة."],

</div>

</ul>
<h3>ليه السعر بيتغيّر كل يوم؟</h3>
<p>السعر بيتحدد بـ<strong>العرض والطلب</strong>، واللي بيحرّكهم توقعات المستثمرين عن مستقبل الشركة — مش نتائجها الحالية بس. عشان كده ممكن شركة تعلن أرباح كويسة وسهمها ينزل، لو الأرباح جت أقل من المتوقع.</p>

</div>`, bank:[

<div class="card"><div class="t">التقلب</div><div class="d">مدى تذبذب السعر صعوداً وهبوطاً خلال فترة.</div></div>
</div>
<div class="callout note"><b>فرق جوهري:</b> <b>السعر</b> هو اللي السوق بيطلبه دلوقتي؛ <b>القيمة</b> تقدير لما تستحقه الشركة فعلاً. الاستثمار القيمي كله قائم على الفجوة بينهم.</div>

<div class="callout warn"><b>تحذير عملي:</b> استخدام Market Order في سهم سيولته ضعيفة ممكن ينفّذ بسعر أسوأ بكتير من اللي شايفه على الشاشة، لإن الفجوة بين Bid و Ask بتكون واسعة.</div>

<li><strong>Ask:</strong> أقل سعر البايعين مستعدين يبيعوا بيه.</li>
<li><strong>Spread:</strong> الفرق بينهم — <strong>وده تكلفة خفية عليك</strong>. كل ما ضاق، كل ما كانت السيولة أفضل.</li>
<li><strong>حجم التداول (Volume):</strong> عدد الأسهم المتداولة — مؤشر على الاهتمام والسيولة.</li>
<li><strong>Portfolio:</strong> مجموع كل استثماراتك.</li>

<h3>اتجاهات السوق</h3>

<div class="card"><div class="t">Crash</div><div class="d">انهيار — هبوط حاد ومفاجئ أكبر بكتير.</div></div>
</div>
<div class="callout tip">فيه مسرد كامل بأكتر من 50 مصطلح قابل للبحث في قسم <b>📖 المسرد</b>.</div>
</div>`, bank:[

{ menu:"أنواع الأسهم", eyebrow:"التصنيف", title:"أنواع الأسهم", body:`
<div class="sheet">
<p class="lead">مش كل الأسهم بتتصرف بنفس الطريقة. فهم نوع السهم <strong>بيحدد توقعاتك منه</strong> — والخطأ الشائع إنك تتوقع من سهم مستقر إنه يتضاعف، أو تتفاجأ لما سهم دوري ينزل مع الركود.</p>
<h3>أولاً: حسب طبيعة السهم</h3>
<ul>
<li><strong>الأسهم العادية:</strong> الأكثر شيوعاً — بتديك حق تصويت في الجمعية العامة ونصيب من التوزيعات (لو الشركة وزّعت).</li>
<li><strong>الأسهم الممتازة:</strong> ليها أولوية في التوزيعات وفي التصفية، لكنها غالباً بدون حق تصويت.</li>
</ul>
<h3>ثانياً: حسب سلوك السهم</h3>
<div class="cards">
<div class="card"><div class="t">أسهم النمو</div><div class="d">شركات بتكبر بسرعة وبتعيد استثمار أرباحها بدل توزيعها. عائد محتمل عالي + تقلب أعلى + غالباً بدون توزيعات.</div></div>
<div class="card"><div class="t">أسهم القيمة</div><div class="d">شركات مستقرة سعرها أقل من قيمتها المقدّرة. بتحتاج صبر لحد ما السوق يعيد تسعيرها.</div></div>
<div class="card"><div class="t">أسهم التوزيعات</div><div class="d">بتدّي دخل نقدي دوري. مناسبة للباحث عن دخل منتظم مش نمو سريع.</div></div>
<div class="card"><div class="t">الأسهم القيادية</div><div class="d">Blue Chips — شركات ضخمة قديمة مستقرة، أقل تقلباً وأعلى سيولة.</div></div>
<div class="card"><div class="t">الأسهم الصغيرة</div><div class="d">Small Caps — فرصة نمو أكبر لإن قاعدتها صغيرة، بس سيولتها أقل وتقلبها أعلى.</div></div>
<div class="card"><div class="t">الأسهم الدورية</div><div class="d">بتصعد وتهبط مع دورات الاقتصاد — حديد، أسمنت، سياحة، سيارات.</div></div>
</div>
<h3>ثالثاً: القطاعات وسلوكها</h3>
<p>القطاع بيحدد جزء كبير من سلوك السهم، والتفرقة المهمة هنا:</p>
<table class="tbl">
<thead><tr><th>النوع</th><th>أمثلة</th><th>السلوك في الأزمات</th></tr></thead>
<tbody>
<tr><td><b>دفاعي</b></td><td>أغذية، أدوية، مرافق</td><td>طلبه ثابت نسبياً فأقل تأثراً</td></tr>
<tr><td><b>دوري</b></td><td>حديد، أسمنت، سياحة، سيارات</td><td>بيتأثر بقوة مع الركود</td></tr>
<tr><td><b>مالي</b></td><td>بنوك، تأمين</td><td>حساس لأسعار الفايدة والائتمان</td></tr>
</tbody>
</table>
<div class="callout warn"><b>خطأ شائع:</b> إن سعر السهم المنخفض معناه إنه "رخيص". سهم بـ5 جنيه ممكن يكون أغلى من سهم بـ500 جنيه لو قارنت السعر بأرباح كل شركة (مكرر الربحية). <b>السعر المطلق مالوش معنى لوحده.</b></div>
<div class="callout tip"><b>للمبتدئ:</b> الأسهم القيادية أو صناديق المؤشرات عادةً نقطة البداية الأنسب — أقل تقلباً وأسهل في المتابعة.</div>
</div>`, bank:[

{ menu:"إزاي تختار سهم؟", eyebrow:"التحليل", title:"إزاي تختار الأسهم؟", body:`
<div class="sheet">
<p class="lead">اختيار السهم مش تخمين ولا توصية — هو <strong>عملية بخطوات</strong>. والقاعدة الحاكمة: التحليل الأساسي بيقولك تشتري <strong>إيه</strong>، والتحليل الفني بيساعدك تحدد تشتري <strong>إمتى</strong>.</p>
<h3>أولاً: التحليل الأساسي — تقييم الشركة نفسها</h3>
<p>هنا بتحاول تجاوب على سؤال واحد: <strong>الشركة دي تستاهل كام؟</strong> وبعدين تقارن الإجابة بالسعر في السوق.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:16px 0 8px">مؤشرات التقييم</h4>
<table class="tbl">
<thead><tr><th>المؤشر</th><th>معناه</th><th>إزاي تقرأه</th></tr></thead>
<tbody>
<tr><td><b>P/E</b> مكرر الربحية</td><td>السعر ÷ ربحية السهم</td><td>بتدفع كام مقابل كل جنيه أرباح — قارنه بمتوسط القطاع</td></tr>
<tr><td><b>EPS</b> ربحية السهم</td><td>صافي الربح ÷ عدد الأسهم</td><td>الأهم اتجاهه على 3–5 سنين مش رقمه</td></tr>
<tr><td><b>D/E</b> نسبة الدين</td><td>الديون ÷ حقوق الملكية</td><td>الأعلى = مخاطرة أكبر وقت الأزمات</td></tr>
<tr><td><b>ROE</b> العائد على الملكية</td><td>الربح ÷ حقوق المساهمين</td><td>كفاءة الإدارة في تشغيل أموالك</td></tr>
<tr><td><b>عائد التوزيعات</b></td><td>التوزيع السنوي ÷ السعر</td><td>عالي جداً؟ اسأل ليه — ممكن السعر منهار</td></tr>
</tbody>
</table>
<div class="callout note"><b>أهم قاعدة في المؤشرات:</b> مالهاش معنى مطلق. مكرر ربحية 20 ممكن يكون رخيص في قطاع تكنولوجيا وغالي في قطاع مرافق. <b>قارن دايماً بشركات نفس القطاع</b>، مش بأرقام مجردة.</div>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:16px 0 8px">مؤشرات الجودة</h4>
<ul>
<li><strong>نمو الإيرادات والأرباح</strong> على عدة سنين — الاتجاه أهم من أي سنة منفردة.</li>
<li><strong>التدفق النقدي التشغيلي</strong> — بتدخّل كاش حقيقي ولا أرباح دفترية؟</li>
<li><strong>هامش الربح واستدامته</strong> — وفيه ميزة تنافسية تحميه ولا لأ؟</li>
<li><strong>جودة الإدارة</strong> — شفافة وقت المشاكل؟ بتتوسّع في مجالها ولا بتشتّت؟</li>
</ul>
<h3>ثانياً: التحليل الفني — دراسة حركة السعر</h3>
<p>بيدرس الشارت والأنماط السعرية وأحجام التداول. أدواته الشائعة: <strong>مستويات الدعم والمقاومة</strong>، و<strong>المتوسطات المتحركة</strong>، ومؤشرات زي <strong>RSI</strong> و<strong>MACD</strong>.</p>
<div class="callout warn"><b>بصراحة:</b> التحليل الفني محل جدل واسع. فيه رأي قوي (زي مالكيل) إنه بيبحث عن أنماط في حركة عشوائية إلى حد كبير. للمبتدئ: استخدمه لتحديد نقاط الدخول والانضباط، <b>مش كأساس وحيد لقرار الشراء</b>.</div>
<h3>ثالثاً: خطوات عملية بالترتيب</h3>
<ol>
<li><strong>حدد هدفك:</strong> دخل ثابت؟ نمو طويل المدى؟ ده بيحدد نوع السهم من البداية.</li>
<li><strong>اختار قطاع تفهمه</strong> أو مستعد تتعلّمه — الفهم بيحميك من الأوهام ومن الذعر.</li>
<li><strong>رشّح 3–5 شركات</strong> من القطاع ده وقارنهم بنفس المؤشرات.</li>
<li><strong>اقرا القوائم المالية</strong> لأفضل واحدة أو اتنين — مش الملخصات والأخبار.</li>
<li><strong>اتأكد من السيولة</strong> — تقدر تخرج بسهولة ولا هتضطر تبيع بخصم؟</li>
<li><strong>قيّم السعر:</strong> السهم عند سعر معقول ولا في ذروة حماس؟</li>
<li><strong>اكتب "قصة السهم"</strong> في دقيقتين: ليه بشتري، إيه اللي لازم يحصل عشان أكسب، وإيه اللي ممكن يوقّعها.</li>
<li><strong>حدد خطة الخروج قبل الشراء:</strong> هدف ربح + حد خسارة.</li>
<li><strong>حدد حجم المركز</strong> بحيث الخسارة المحتملة ضمن 1–2% من محفظتك.</li>
</ol>
<h3>علامات خطر توقّفك</h3>
<div class="cards">
<div class="card"><div class="t">🚩 ديون متزايدة بسرعة</div><div class="d">خصوصاً مع ثبات أو تراجع الإيرادات.</div></div>
<div class="card"><div class="t">🚩 أرباح استثنائية</div><div class="d">قفزة سببها بيع أصل مش تحسّن النشاط.</div></div>
<div class="card"><div class="t">🚩 تشتيت الأنشطة</div><div class="d">دخول مجالات بعيدة عن نشاط الشركة الأساسي.</div></div>
<div class="card"><div class="t">🚩 سيولة ضعيفة جداً</div><div class="d">صعوبة الخروج بسعر عادل وقت الحاجة.</div></div>
</div>
<div class="callout tip">جرّب أداة <b>⚖️ مقارنة سهمين</b> لتطبيق المؤشرات دي عملياً، و<b>✅ قائمة التحقّق</b> قبل أي شراء.</div>

{ menu:"إدارة المخاطر", eyebrow:"الحماية", title:"إدارة المخاطر — أهم جزء", body:`
<div class="sheet">
<p class="lead">أغلب نجاح المستثمر بييجي من حماية رأس ماله، مش من اصطياد الصفقة الخارقة. القاعدة اللي بتلخّص الباب ده: <strong>خسارة 50% محتاجة مكسب 100% عشان ترجع مكانك</strong> — عشان كده منع الخسارة الكبيرة أهم من مطاردة المكسب الكبير.</p>
<h3>1) التنويع — وكمان التنويع الوهمي</h3>
<p>التنويع مش قلة ثقة، هو <strong>اعتراف بإنك ممكن تغلط</strong>. لكن أهم من عدد الأسهم هو تنوّعها الحقيقي: امتلاك عشر شركات كلها بنوك مش تنويع، لإنها بتتحرك مع بعض في أي أزمة تضرب القطاع.</p>
<div class="cards">
<div class="card"><div class="t">تنويع القطاعات</div><div class="d">بنوك، أغذية، اتصالات، عقارات — سلوكهم مختلف في الأزمات.</div></div>
<div class="card"><div class="t">تنويع الأصول</div><div class="d">أسهم + دخل ثابت + سيولة، مش نوع واحد.</div></div>
<div class="card"><div class="t">اختبار التنويع</div><div class="d">لو القطاع ده اتضرب، هخسر كام % من محفظتي؟</div></div>
</div>
<h3>2) حجم المركز — الرقم اللي بيحميك</h3>
<p>القاعدة الشائعة إن الخسارة المحتملة في الصفقة الواحدة متزيدش عن <strong>1–2% من إجمالي محفظتك</strong>. ودي مش نسبة المبلغ المستثمر، دي نسبة الخسارة لو وقف الخسارة اتنفّذ.</p>
<div class="callout note"><b>المعادلة:</b> عدد الأسهم = (رأس المال × نسبة المخاطرة) ÷ (سعر الدخول − وقف الخسارة).<br>مثال: 100,000 ج.م ومخاطرة 2% = 2,000 ج.م. لو دخلت بـ50 ووقفك 45، الفرق 5 ج.م للسهم → 400 سهم.</div>
<h3>3) وقف الخسارة والانضباط</h3>
<p>حد الخسارة قرار بتاخده <strong>قبل</strong> الشراء وإنت هادي، مش أثناء الهبوط وإنت متوتر. أخطر عادة هي تحريك الوقف لتحت كل ما السعر ينزل — ده بيلغي الغرض منه تماماً ويحوّل خسارة صغيرة لكارثة.</p>
<h3>4) صندوق الطوارئ قبل الاستثمار</h3>
<p>السبب الأول اللي بيخلي الناس تبيع في القاع مش الذعر — هو <strong>الاحتياج المفاجئ للفلوس</strong>. وجود سيولة منفصلة (عادةً مصاريف عدة شهور) بيمنعك من تسييل استثمارك في أسوأ توقيت، وبيحوّل التقلب من خسارة مثبّتة لموجة بتعدّي.</p>
<h3>5) الأفق الزمني جزء من إدارة المخاطر</h3>
<p>نفس السهم ممكن يكون مخاطرة عالية لحد محتاج فلوسه بعد سنة، ومخاطرة معقولة لحد أفقه عشر سنين. <strong>السؤال الأول مش "السهم ده كويس؟" لكن "إمتى محتاج الفلوس دي؟"</strong></p>
<h3>6) المخاطرة الحقيقية مقابل التقلب</h3>
<p>تحرّك السعر لأعلى ولأسفل من غير تغيّر في الشركة = تقلب. تدهور الشركة فعلياً أو بيعك الاضطراري = <strong>خسارة دائمة</strong>. الأولى بتعدّي، والتانية مش بترجع.</p>
<div class="callout warn"><b>علامة إن مخاطرتك أعلى من اللازم:</b> لو تحركات السوق بتأثر على نومك، أو بتخليك تراجع محفظتك كذا مرة في اليوم، أو بتغيّر خطتك مع كل خبر — النسبة اللي عندك أكبر من اللي تتحمّله فعلياً، بغض النظر عن الأرقام.</div>
<div class="callout tip">جرّب <b>🎯 حاسبة حجم المركز</b> في قسم الحاسبات لتطبيق المعادلة على أرقامك.</div>
</div>`, bank:[
