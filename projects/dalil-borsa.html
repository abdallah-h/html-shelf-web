/* ===== state + persistence ===== */
const KEY='borsaGuideV1';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state=Object.assign({page:0,theme:'',font:1,quiz:{},checks:{},name:''},load()||{});
if(!state.quiz)state.quiz={};if(!state.checks)state.checks={};
const nav=document.getElementById('nav'),stage=document.getElementById('stage'),bar=document.getElementById('bar'),topTitle=document.getElementById('topTitle');
let current=0;
/* search index + quiz meta */
function strip(h){const d=document.createElement('div');d.innerHTML=h||'';return d.textContent||''}
const quizMeta={};
pages.forEach((p,i)=>{if(p.quiz)p.quiz.forEach((q,k)=>{quizMeta[i+'-'+k]=q.a})});
let searchReady=false;
function buildSearch(){if(searchReady)return;pages.forEach(p=>{let t=(p.menu||'')+' '+(p.title||'')+' '+strip(p.body);if(p.quiz)p.quiz.forEach(q=>{t+=' '+q.q+' '+q.opts.join(' ')});if(p.bank)p.bank.forEach(q=>{t+=' '+q[0]+' '+q[1]});if(p._b)p._b.qs.forEach(q=>{t+=' '+q[0]+' '+q[1]});p._s=t.toLowerCase()});searchReady=true}
const QUIZ_TOTAL=Object.keys(quizMeta).length;
/* nav */
let cn=0;
pages.forEach((p,i)=>{
const b=document.createElement('button');
const num=i===0?'●':(p.icon?p.icon:String(++cn).padStart(2,'0'));
b.innerHTML=`<span class="num">${num}</span><span>${p.menu}</span>`;
b.onclick=()=>go(i);nav.appendChild(b);
});
const navBtns=[...nav.children];
function render(i){
const p=pages[i];
if(p.hero){
stage.innerHTML=`<div class="page show hero">
<span class="badge">دليلك خطوة بخطوة</span>
<h2>الطريق إلى <span>الاستثمار الذكي</span><br>في البورصة</h2>
<p>من أول "إيه هي البورصة؟" لحد الذهب والصناديق والحاسبات ومكتبة فيها 10 كتب مشروحة — كل اللي محتاجه في مكان واحد.</p>
<button class="start" onclick="go(1)">ابدأ الدليل ←</button>
<div class="hero-stats">
<div><div class="n">📖 31</div><div class="l">قسم شامل</div></div>
<div><div class="n">🛠️ 7</div><div class="l">أدوات تفاعلية</div></div>
<div><div class="n">📚 10</div><div class="l">كتب مشروحة</div></div>
<div><div class="n">❓ 1000+</div><div class="l">سؤال وجواب</div></div>
</div></div>`;
} else {
let quizHTML='';
if(p.quiz){
quizHTML='<div class="quizwrap"><div class="quiz-h">📝 اختبر نفسك</div>';
p.quiz.forEach((q,k)=>{quizHTML+=`<div class="quiz" data-qid="${i}-${k}" data-a="${q.a}"><div class="quiz-q">${q.q}</div><div class="qopts">`+q.opts.map((o,j)=>`<button class="qopt" data-i="${j}" onclick="quizPick(this)">${o}</button>`).join('')+`</div><div class="quiz-fb"></div></div>`});
quizHTML+='</div>';
}
let bankHTML='';
if(p.bank&&p.bank.length){
bankHTML=`<div class="quizwrap"><div class="quiz-h">📚 بنك أسئلة القسم (${p.bank.length} سؤال)</div><div class="qbank">`+
p.bank.map(q=>`<details class="qa"><summary>${q[0]}</summary><div class="ans">${q[1]}</div></details>`).join('')+
`</div></div>`;
}
stage.innerHTML=`<div class="page show">
<div class="eyebrow">${p.eyebrow}</div>
<h2 class="title">${p.title}</h2>
<div class="rule"></div>
${p.body}${bankHTML}${quizHTML}
<div class="pager">
<button onclick="go(${i-1})" ${i<=0?'disabled':''}>→ السابق</button>
<button class="next" onclick="go(${i+1})" ${i>=pages.length-1?'disabled':''}>${i>=pages.length-1?'تمّ ✔':'التالي ←'}</button>
</div></div>`;
// restore answered quizzes
stage.querySelectorAll('.quiz').forEach(w=>{const id=w.dataset.qid;if(state.quiz[id]!=null)markAnswered(w,state.quiz[id],+w.dataset.a)});
if(p.icon==='✅')restoreChecks();
if(p.icon==='🧪')simulatePortfolio();
if(p.icon==='🏆')renderScore();
}
navBtns.forEach((b,k)=>b.classList.toggle('active',k===i));
topTitle.textContent=p.hero?'الدليل الشامل للاستثمار':p.menu;
bar.style.width=(i/(pages.length-1)*100)+'%';
}
function go(i){if(i<0||i>pages.length-1)return;current=i;state.page=i;save();render(i);window.scrollTo({top:0,behavior:'smooth'});closeSide()}
/* quiz */
function markAnswered(w,idx,correct){
w.dataset.done='1';const opts=[...w.querySelectorAll('.qopt')];
opts[correct].classList.add('ok');if(idx!==correct&&opts[idx])opts[idx].classList.add('bad');
opts.forEach(o=>o.disabled=true);
const fb=w.querySelector('.quiz-fb');
fb.textContent=idx===correct?'✅ إجابة صحيحة!':'❌ مش مظبوط — الصح متظللة بالأخضر.';
fb.className='quiz-fb '+(idx===correct?'good':'bad');
}
function quizPick(btn){
const w=btn.closest('.quiz');if(w.dataset.done)return;
const idx=+btn.dataset.i,correct=+w.dataset.a;
markAnswered(w,idx,correct);
state.quiz[w.dataset.qid]=idx;save();updateScore();
}
function updateScore(){
let ans=0,cor=0;
for(const id in state.quiz){if(quizMeta[id]!=null){ans++;if(state.quiz[id]===quizMeta[id])cor++}}
document.getElementById('scoreChip').textContent=`📝 الكويز: ${cor}/${QUIZ_TOTAL} صح`;
}
function renderScore(){
let ans=0,cor=0;for(const id in state.quiz){if(quizMeta[id]!=null){ans++;if(state.quiz[id]===quizMeta[id])cor++}}
const pct=Math.round(cor/QUIZ_TOTAL*100);
document.getElementById('score-num').textContent=pct+'%';
document.getElementById('score-sub').textContent=`جاوبت صح على ${cor} من ${QUIZ_TOTAL} سؤال (${ans} متحلّلين)`;
const t=document.getElementById('score-tier');let txt,bg,fg;
if(ans<QUIZ_TOTAL){txt='لسه فيه أسئلة متحلّتش';bg='#fbf0d8';fg='#a07614';}
else if(pct>=90){txt='🏅 ممتاز — جاهز تبدأ بثقة';bg='var(--emerald-soft)';fg='#1f5a44';}
else if(pct>=70){txt='👍 كويس جداً';bg='var(--emerald-soft)';fg='#1f5a44';}
else if(pct>=50){txt='🙂 لا بأس — راجع شوية';bg='#fbf0d8';fg='#a07614';}
else{txt='📚 محتاج تراجع الأقسام تاني';bg='var(--crimson-soft)';fg='#7a2c1d';}
t.textContent=txt;t.style.background=bg;t.style.color=fg;
document.getElementById('score-fill').style.width=pct+'%';
const ni=document.getElementById('cert-name');if(ni&&state.name)ni.value=state.name;
}
function resetQuiz(){state.quiz={};save();updateScore();renderScore();}
function saveName(){state.name=document.getElementById('cert-name').value;save()}
/* checklist */
function checkTick(el){state.checks[el.dataset.k]=el.checked;save();updateChk()}
function restoreChecks(){document.querySelectorAll('.chk input').forEach(c=>{c.checked=!!state.checks[c.dataset.k]});updateChk()}
function updateChk(){
const all=document.querySelectorAll('.chk input'),done=[...all].filter(c=>c.checked).length;
const f=document.getElementById('chk-fill'),c=document.getElementById('chk-count');
if(f)f.style.width=(all.length?done/all.length*100:0)+'%';
if(c)c.textContent=`تم ${done} من ${all.length}`+(done===all.length&&all.length?' ✓ جاهز!':'');
}
/* calculators */
const v=id=>parseFloat(document.getElementById(id).value),
egp=n=>Math.round(n).toLocaleString('en-US')+' ج.م';
function out(id,h,warn){const e=document.getElementById(id);e.innerHTML=h;e.style.color=warn?'var(--crimson)':''}
function fvAt(init,m,r,months){return r===0?init+m*months:init*Math.pow(1+r,months)+m*((Math.pow(1+r,months)-1)/r)}
function calcDCA(){
const init=v('dca-init')||0,m=v('dca-month')||0,r=(v('dca-rate')||0)/100/12,y=Math.max(1,Math.round(v('dca-years')||0)),n=y*12;
const fv=fvAt(init,m,r,n),c=init+m*n;
out('dca-out',`القيمة المتوقعة بعد ${y} سنة: <b>${egp(fv)}</b><br>إجمالي اللي حطّيته: ${egp(c)}<br>صافي الأرباح: <b>${egp(fv-c)}</b>`);
const vals=[];for(let t=0;t<=y;t++)vals.push(fvAt(init,m,r,t*12));
const ch=document.getElementById('dca-chart');ch.style.display='';
ch.innerHTML=`<div class="ctitle">نمو استثمارك عبر السنين</div>`+lineChartSVG(vals);
}
function lineChartSVG(vals){
const W=620,H=230,L=8,R=8,T=22,B=26,n=vals.length,max=Math.max(...vals)||1;
const x=i=>L+(W-L-R)*(n>1?i/(n-1):0),y=val=>T+(H-T-B)*(1-val/max);
let line='',area=`M ${x(0)} ${H-B}`;
vals.forEach((val,i)=>{line+=(i?'L':'M')+x(i)+' '+y(val)+' ';area+=`L ${x(i)} ${y(val)} `});
area+=`L ${x(n-1)} ${H-B} Z`;
const step=Math.max(1,Math.ceil(n/7));let labels='';
for(let i=0;i<n;i+=step)labels+=`<text x="${x(i)}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${i}</text>`;
const last=n-1;
return `<svg viewBox="0 0 ${W} ${H}" font-family="IBM Plex Mono">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#c8a45a" stop-opacity=".35"/><stop offset="1" stop-color="#c8a45a" stop-opacity="0"/></linearGradient></defs>
<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--line)"/>
<path d="${area}" fill="url(#g)"/>
<path d="${line}" fill="none" stroke="#2f8f6f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="${x(last)}" cy="${y(vals[last])}" r="4" fill="#2f8f6f"/>
<text x="${x(last)}" y="${y(vals[last])-9}" font-size="12" fill="#2f8f6f" font-weight="700" text-anchor="end">${Math.round(vals[last]/1000)}k</text>
${labels}<text x="${x(0)}" y="${H-8}" font-size="11" fill="var(--muted)">سنة</text></svg>`;
}
function calcFees(){
const val=v('fee-val')||0,side=(((v('fee-broker')||0)+(v('fee-stamp')||0))/100)*val;
out('fee-out',`رسوم وضريبة الشراء: <b>${egp(side)}</b><br>رسوم وضريبة البيع: <b>${egp(side)}</b><br>إجمالي رحلة كاملة: <b style="color:var(--crimson)">${egp(side*2)}</b>`);
}
function calcGold(){
const oz=v('g-oz')||0,usd=v('g-usd')||0,k=v('g-k')||24,w=v('g-w')||0,fee=(v('g-fee')||0)/100;
if(k<=0||k>24){out('g-out','⚠️ العيار لازم يكون بين 1 و24.',true);return}
const base=(oz/31.1035)*usd*(k/24);
const total=base*w, paid=total*(1+fee), breakeven=fee/(1)*100;
out('g-out',`سعر الجرام (بدون مصنعية): <b>${egp(base)}</b><br>قيمة ${w} جرام: <b>${egp(total)}</b><br>اللي هتدفعه تقريباً: <b style="color:var(--crimson)">${egp(paid)}</b><br>لو بعت النهاردة: ${egp(total)} → خسارة ${egp(paid-total)}<br>السعر لازم يرتفع <b>${breakeven.toFixed(1)}%</b> عشان تتعادل.`);
}
function calcZakat(){out('zak-out',`زكاة المتاجرة (2.5%): <b>${egp((v('zak-val')||0)*0.025)}</b>`)}
function calcPos(){
const cap=v('pos-cap')||0,risk=(v('pos-risk')||0)/100,entry=v('pos-entry')||0,stop=v('pos-stop')||0,per=entry-stop;
if(per<=0){out('pos-out','⚠️ لازم سعر وقف الخسارة يكون أقل من سعر الدخول.',true);return}
const ra=cap*risk,sh=Math.floor(ra/per);
out('pos-out',`المبلغ اللي بتخاطر بيه: <b>${egp(ra)}</b><br>عدد الأسهم: <b>${sh.toLocaleString('en-US')}</b> سهم<br>حجم المركز: <b>${egp(sh*entry)}</b>`);
}
/* portfolio simulator */
const PF=[['أسهم',12,'#c8a45a'],['سندات وأذون',18,'#2f8f6f'],['ذهب',6,'#d4b24a'],['عقارات',8,'#b6432f'],['شهادات/نقد',15,'#5a8fb0']];
function simulatePortfolio(){
const total=parseFloat(document.getElementById('pf-total').value)||0;
const pct=PF.map((_,i)=>parseFloat(document.getElementById('pf-'+i).value)||0);
const sum=pct.reduce((a,b)=>a+b,0),denom=sum||1;
document.getElementById('pf-stack').innerHTML=PF.map((p,i)=>`<i style="width:${pct[i]/denom*100}%;background:${p[2]}"></i>`).join('');
document.getElementById('pf-alloc').innerHTML=PF.map((p,i)=>`<div class="alloc"><span><span class="dot" style="background:${p[2]}"></span>${p[0]} — ${pct[i]}%</span><b>${egp(total*pct[i]/100)}</b></div>`).join('');
const wret=sum?PF.reduce((a,p,i)=>a+p[1]*pct[i],0)/sum:0;
const w=pct.map(x=>x/denom),hhi=w.reduce((a,x)=>a+x*x,0),active=pct.filter(x=>x>0).length;
let div;if(active<=1)div='⚠️ مركّزة جداً (خطر عالي)';else if(hhi>0.5)div='🟠 تركيز مرتفع';else if(hhi>0.3)div='🟡 تنويع متوسط';else div='🟢 تنويع جيد';
const warn=Math.round(sum)!==100?`<div style="color:var(--crimson);font-weight:700">⚠️ مجموع النسب = ${Math.round(sum)}% (المفروض 100%)</div>`:'';
document.getElementById('pf-out').innerHTML=`${warn}العائد السنوي المتوقع (تقديري): <b>${wret.toFixed(1)}%</b><br>القيمة بعد سنة ≈ <b>${egp(total*(1+wret/100))}</b><br>تقييم التنويع: <b>${div}</b><br><span style="font-size:.85em;color:var(--muted)">نِسب العائد افتراضية للتعلّم ومش وعد بأي عائد.</span>`;
}
/* stock comparison */
const CMP=[['مكرر الربحية P/E',true],['ربحية السهم EPS',false],['عائد التوزيعات %',false],['نسبة الدين D/E',true],['نمو الإيرادات %',false]];
function compareStocks(){
const na=document.getElementById('cmp-a').value||'الأول',nb=document.getElementById('cmp-b').value||'الثاني';
let aw=0,bw=0,rows='';
CMP.forEach((m,i)=>{const a=parseFloat(document.getElementById('m'+i+'a').value),b=parseFloat(document.getElementById('m'+i+'b').value);let ca='',cb='';
if(!isNaN(a)&&!isNaN(b)&&a!==b){const aBetter=m[1]?a<b:a>b;if(aBetter){ca='win';aw++}else{cb='win';bw++}}
rows+=`<tr><td>${m[0]}</td><td class="${ca}">${isNaN(a)?'—':a}</td><td class="${cb}">${isNaN(b)?'—':b}</td></tr>`});
let verdict;if(aw>bw)verdict=`<b>${na}</b> متفوّق في ${aw} من ${CMP.length} مؤشرات.`;else if(bw>aw)verdict=`<b>${nb}</b> متفوّق في ${bw} من ${CMP.length} مؤشرات.`;else verdict='الاتنين متعادلين تقريباً.';
document.getElementById('cmp-out').innerHTML=`<table class="tbl" style="margin-top:14px"><thead><tr><th>المؤشر</th><th>${na}</th><th>${nb}</th></tr></thead><tbody>${rows}</tbody></table><div class="callout note" style="margin-top:10px">${verdict} بس المؤشرات مش كل حاجة — راجع نشاط الشركة وأخبارها.</div>`;
}
/* glossary */
function glossFilter(){
const q=document.getElementById('gloss-search').value.trim().toLowerCase();let any=false;
document.querySelectorAll('#gloss-list .gterm').forEach(t=>{const m=!q||t.dataset.k.includes(q);t.style.display=m?'':'none';if(m)any=true});
document.getElementById('gloss-none').style.display=any?'none':'';
}
/* theme + font + search */
function toggleTheme(){const el=document.documentElement,light=el.getAttribute('data-theme')==='light';el.setAttribute('data-theme',light?'':'light');document.getElementById('themeBtn').textContent=light?'☀️':'🌙';state.theme=light?'':'light';save()}
const sizes=[14,16,18,20];let lvl=1;
function applyFont(){document.documentElement.style.setProperty('--txt',sizes[lvl]+'px')}
function fontStep(d){lvl=Math.max(0,Math.min(sizes.length-1,lvl+d));state.font=lvl;save();applyFont()}
function doSearch(){const q=document.getElementById('search').value.trim().toLowerCase();if(q)buildSearch();navBtns.forEach((b,i)=>{b.style.display=(!q||pages[i]._s.includes(q))?'':'none'})}
/* print */
function printGuide(){buildPrint();document.documentElement.removeAttribute('data-printmode');window.print()}
function printCert(){
let cor=0;for(const id in state.quiz){if(quizMeta[id]!=null&&state.quiz[id]===quizMeta[id])cor++}
const pct=Math.round(cor/QUIZ_TOTAL*100),name=(document.getElementById('cert-name').value||'').trim()||'………………';
document.getElementById('certArea').innerHTML=`<div class="cert">
<div class="ck">CERTIFICATE OF COMPLETION</div>
<h1>شهادة إتمام دليل الاستثمار</h1>
<div>تشهد هذه الشهادة بإتمام</div>
<div class="nm">${name}</div>
<div>الدليل الشامل للاستثمار في البورصة</div>
<div class="sc">النتيجة: ${cor}/${QUIZ_TOTAL} (${pct}%)</div>
<div class="dt">${new Date().toLocaleDateString('en-GB')}</div>
</div>`;
document.documentElement.setAttribute('data-printmode','cert');
window.print();
}
window.addEventListener('afterprint',()=>document.documentElement.removeAttribute('data-printmode'));
let printReady=false;
function buildPrint(){if(printReady)return;
let ph='<h1 class="p-title">الدليل الشامل للاستثمار في البورصة</h1>';
pages.forEach(p=>{
if(p.hero) return;
if(p.icon&&!['❓','📖','📚','📕'].includes(p.icon)) return; // skip interactive tools only
ph+=`<section class="p-sec"><h2>${p.title}</h2>${p.body}`;
if(p.bank&&p.bank.length){
ph+=`<h3 style="font-size:15px;margin-top:10px">أسئلة القسم</h3><ol style="font-size:12px">`+
p.bank.map(q=>`<li><b>${q[0]}</b><br>${q[1]}</li>`).join('')+`</ol>`;
}
ph+=`</section>`;
});
document.getElementById('printArea').innerHTML=ph;
printReady=true}
window.addEventListener('beforeprint',buildPrint);
/* drawer + keys */
const side=document.getElementById('side'),scrim=document.getElementById('scrim');
document.getElementById('burger').onclick=()=>{side.classList.toggle('open');scrim.classList.toggle('show')};
scrim.onclick=closeSide;function closeSide(){side.classList.remove('open');scrim.classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')go(current+1);if(e.key==='ArrowRight')go(current-1)});
/* init */
if(state.theme==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeBtn').textContent='🌙'}
lvl=(state.font!=null)?state.font:1;applyFont();
updateScore();
let startPage=Number.isInteger(state.page)&&state.page>=0&&state.page<pages.length?state.page:0;
current=startPage;render(startPage);
</script>
