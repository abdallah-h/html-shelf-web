{ menu:"الاستراتيجيات", eyebrow:"الخطة", title:"أنواع الاستراتيجيات", body:`
<div class="sheet">
<p class="lead">الاستراتيجية مش "أنهي سهم أشتري"، هي <strong>القواعد اللي بتحكم قراراتك كلها</strong>: بتشتري إمتى، بتمسك قد إيه، وبتخرج ليه. أهم من اختيار الاستراتيجية المثالية إنك تختار واحدة <strong>تقدر تلتزم بيها سنين</strong>.</p>
<h3>1) الاستثمار طويل المدى (Buy &amp; Hold)</h3>
<p>تشتري شركات كويسة أو صناديق متنوعة وتمسكها سنين، وتتجاهل التقلبات المؤقتة. <strong>الأنسب للمبتدئ</strong> لإنها بتقلل عدد القرارات والتكاليف، وبتستفيد من العائد المركّب اللي محتاج وقت طويل عشان يبان.</p>
<div class="callout tip"><b>مناسبة لو:</b> وقتك محدود، أفقك 5 سنين فأكتر، وعايز أقل مجهود متابعة.</div>
<h3>2) متوسط التكلفة (DCA)</h3>
<p>تستثمر <strong>مبلغ ثابت على فترات منتظمة</strong> بغض النظر عن السعر. الميزة الحسابية إنك بتشتري كميات أكبر لما السعر ينزل وأقل لما يعلا، فبيتحسن متوسط تكلفتك. الميزة الأهم سلوكية: <strong>بتشيل عبء قرار "أدخل إمتى؟"</strong> اللي بيشل كتير من المبتدئين.</p>
<div class="callout note"><b>مثال:</b> 2,000 ج.م شهرياً. في شهر السعر 50 فتشتري 40 سهم، وفي شهر السعر 40 فتشتري 50 سهم — فمتوسط تكلفتك أقل من متوسط السعر تلقائياً.</div>
<h3>3) الصناديق وصناديق المؤشرات</h3>
<p>بدل ما تختار أسهم بنفسك، تشتري سلة جاهزة. بتديك <strong>تنويع فوري بمبلغ صغير</strong> وبمجهود متابعة أقل بكتير. صناديق المؤشرات تحديداً رسومها أقل لإنها بتتبع مؤشر من غير إدارة نشطة.</p>
<h3>4) المضاربة قصيرة المدى</h3>
<p>البيع والشراء على فترات قصيرة للاستفادة من حركة السعر. بصراحة: <strong>دي أصعب استراتيجية وأعلاها تكلفة</strong> — كل صفقة عليها عمولة ودمغة، والقرارات المتكررة بتفتح باب واسع للأخطاء العاطفية. مش مناسبة للمبتدئ.</p>
<h3>إزاي تختار استراتيجيتك؟</h3>
<table class="tbl">
<thead><tr><th>لو عندك</th><th>الأنسب</th></tr></thead>
<tbody>
<tr><td>وقت قليل + أفق طويل</td><td>صناديق مؤشرات + DCA</td></tr>
<tr><td>وقت للبحث + رغبة في الاختيار</td><td>أسهم مختارة طويلة المدى</td></tr>
<tr><td>مبلغ شهري ثابت من الراتب</td><td>DCA</td></tr>
<tr><td>مبلغ كبير مرة واحدة</td><td>دخول تدريجي على دفعات</td></tr>
</tbody>
</table>
<h3>الاستراتيجية المختلطة</h3>
<p>مش لازم تختار واحدة بس. الشكل الشائع والعملي: <strong>محفظة أساسية (Core)</strong> من صناديق مؤشرات تمثّل معظم فلوسك، مع <strong>جزء صغير (Satellite)</strong> لأسهم فردية بتدرسها بنفسك. كده بتتعلّم من غير ما تخاطر بكل حاجة.</p>
<div class="callout warn"><b>أخطر حاجة:</b> تغيير الاستراتيجية كل شوية. القفز من طريقة لطريقة مع كل خسارة بيمنع أي خطة من إنها تثبت نتيجتها، وبيضاعف تكاليفك.</div>
</div>`, bank:[
["إيه هي استراتيجية Buy & Hold؟","شراء شركات جيدة والاحتفاظ بيها لسنين طويلة بغض النظر عن التقلبات المؤقتة."],
["ليه Buy & Hold مناسبة للمبتدئ؟","لإنها بتقلل عدد القرارات والتكاليف وبتستفيد من التراكم طويل المدى."],
["إيه هي المضاربة؟","البيع والشراء على المدى القصير للاستفادة من حركة الأسعار، وبتحتاج خبرة ووقت."],
["إيه مخاطر المضاربة للمبتدئ؟","تكاليف تداول عالية، قرارات عاطفية متكررة، واحتمال خسائر سريعة."],
["يعني إيه متوسط التكلفة (DCA)؟","استثمار مبلغ ثابت على فترات منتظمة بغض النظر عن سعر السوق."],
["إيه فايدة DCA؟","بيقلل خطر الدخول في توقيت سيئ وبيشيل عبء قرار التوقيت."],
["إزاي DCA بيشتغل في الهبوط؟","بيخليك تشتري كميات أكبر بأسعار أقل فبتستفيد وقت التعافي."],
["إيه هي صناديق المؤشرات؟","صناديق بتتبع مؤشر معيّن فبتديك تنويع فوري بتكلفة منخفضة."],
["إيه الفرق بين الاستثمار والمضاربة في الاستراتيجية؟","الاستثمار بيعتمد على قيمة الشركة ونموها؛ المضاربة على حركة السعر."],
["إزاي تختار استراتيجيتك؟","حسب وقتك المتاح، أفقك الزمني، وقدرتك على تحمّل التقلب."],
["ليه كتر تغيير الاستراتيجية ضار؟","لإنه بيمنع أي خطة من إنها تثبت نتيجتها وبيضاعف التكاليف."],
["هل ممكن تجمع بين أكتر من استراتيجية؟","نعم — مثلاً محفظة أساسية طويلة المدى مع جزء صغير للتجربة."],
["إيه أهمية الالتزام بالخطة؟","لإن العائد بيتحقق بالاستمرارية مش بالقرارات الذكية المتفرقة."],
["إيه أثر التكاليف على الاستراتيجية؟","كل ما زاد عدد الصفقات كل ما زادت الرسوم والضرايب وقلّ صافي عائدك."],
["إيه أبسط استراتيجية للمبتدئ؟","مبلغ شهري ثابت في صندوق متنوع منخفض التكلفة لفترة طويلة."],
["إيه الفرق بين الاستراتيجية واختيار السهم؟","الاستراتيجية هي القواعد اللي بتحكم كل قراراتك؛ اختيار السهم قرار واحد جواها."],
["إيه أهم شرط في اختيار استراتيجية؟","إنك تقدر تلتزم بيها لسنين، مش إنها الأمثل نظرياً."],
["إزاي DCA بيحسّن متوسط تكلفتك؟","بشراء كميات أكبر لما السعر ينزل وأقل لما يعلا تلقائياً."],
["إيه الميزة السلوكية لـ DCA؟","بيشيل عبء قرار التوقيت اللي بيعطّل كتير من المبتدئين."],
["إيه المناسب لو معاك مبلغ كبير مرة واحدة؟","الدخول التدريجي على دفعات بدل دفعة واحدة لتقليل خطر التوقيت."],
["يعني إيه استراتيجية Core-Satellite؟","محفظة أساسية من صناديق متنوعة مع جزء صغير لأسهم فردية بتدرسها."],
["ليه المضاربة أعلى تكلفة؟","لإن كل صفقة عليها عمولة ودمغة، والتكرار بيراكم التكاليف."],
["ليه تغيير الاستراتيجية المتكرر ضار؟","لإنه بيمنع أي خطة من إثبات نتيجتها وبيضاعف التكاليف."],
["الأنسب لمين عنده وقت قليل؟","صناديق مؤشرات مع استثمار شهري منتظم."],
["إمتى تكون الأسهم الفردية مناسبة؟","لما يكون عندك وقت منتظم للبحث ومتابعة نتائج الشركات."]
],
quiz:[{q:"استثمار مبلغ ثابت بشكل دوري بغض النظر عن السعر؟",opts:["المضاربة","الهامش","متوسط التكلفة (DCA)"],a:2}]},
{ menu:"صناديق الاستثمار", eyebrow:"البديل الأسهل", title:"صناديق الاستثمار — دليل كامل", body:`
<div class="sheet">
<p class="lead">بدل ما تختار أسهم بنفسك، بتحط فلوسك في <strong>سلة جاهزة</strong> بيديرها متخصصين أو بتتبع مؤشر. دي غالباً أنسب نقطة بداية للمبتدئ.</p>
<h3>إزاي بتشتغل؟</h3>
<p>الصندوق بيجمّع فلوس من ناس كتير ويستثمرها في أصول متنوعة (أسهم، سندات، أدوات نقدية…). إنت بتشتري <strong>وثيقة (Unit)</strong> في الصندوق، وقيمتها بتتحسب يومياً وبتسمى <strong>صافي قيمة الأصول (NAV)</strong>. لو الأصول كسبت، سعر الوثيقة بيطلع.</p>
<h3>أنواع الصناديق حسب الأصول</h3>
<div class="cards">
<div class="card"><div class="t">صناديق أسهم</div><div class="d">بتستثمر في أسهم — عائد محتمل أعلى ومخاطرة أعلى. للمدى الطويل.</div></div>
<div class="card"><div class="t">صناديق دخل ثابت</div><div class="d">سندات وأذون خزانة — أقل تقلباً ودخل أثبت.</div></div>
<div class="card"><div class="t">صناديق نقدية (سيولة)</div><div class="d">أدوات قصيرة الأجل — الأقل مخاطرة والأسهل في السحب.</div></div>
<div class="card"><div class="t">صناديق متوازنة</div><div class="d">خليط بين الأسهم والدخل الثابت.</div></div>
<div class="card"><div class="t">صناديق مؤشرات</div><div class="d">بتتبع مؤشر زي EGX30 — رسومها عادةً أقل.</div></div>
<div class="card"><div class="t">صناديق ذهب/سلع</div><div class="d">مرتبطة بأسعار الذهب أو السلع.</div></div>
</div>
<h3>صناديق مفتوحة vs. ETFs</h3>
<table class="tbl">
<thead><tr><th>الفرق</th><th>الصندوق المفتوح</th><th>الصندوق المتداول (ETF)</th></tr></thead>
<tbody>
<tr><td>الشراء والبيع</td><td>من البنك أو مدير الصندوق</td><td>من البورصة زي أي سهم</td></tr>
<tr><td>السعر</td><td>على سعر NAV (مرة كل فترة)</td><td>لحظي طول جلسة التداول</td></tr>
<tr><td>الإدارة</td><td>غالباً نشطة</td><td>غالباً بتتبع مؤشر</td></tr>
<tr><td>الرسوم</td><td>عادةً أعلى</td><td>عادةً أقل</td></tr>
</tbody>
</table>
<h3>الإدارة النشطة مقابل السلبية</h3>
<ul>
<li><strong>نشطة (Active):</strong> مدير بيختار الأسهم محاولاً يتفوّق على السوق — رسوم أعلى، والتفوّق مش مضمون.</li>
<li><strong>سلبية (Passive):</strong> بتتبع مؤشر من غير اجتهاد — رسوم أقل وأداء قريب من السوق نفسه.</li>
</ul>
<h3>✅ المميزات</h3>
<div class="cards">
<div class="card"><div class="t">تنويع فوري</div><div class="d">بمبلغ صغير بتملك حصة في عشرات الشركات.</div></div>
<div class="card"><div class="t">إدارة محترفة</div><div class="d">مش محتاج تحلّل كل شركة بنفسك.</div></div>
<div class="card"><div class="t">وقت ومجهود أقل</div><div class="d">مناسب لو مش فاضي تتابع السوق يومياً.</div></div>
<div class="card"><div class="t">بداية بمبلغ بسيط</div><div class="d">الحد الأدنى عادةً أقل من بناء محفظة بنفسك.</div></div>
</div>
<h3>⚠️ العيوب والمخاطر</h3>
<ul>
<li><strong>رسوم إدارة سنوية</strong> بتتخصم سواء كسب الصندوق أو خسر.</li>
<li><strong>مفيش عائد مضمون</strong> — صناديق الأسهم ممكن تخسر زي أي استثمار.</li>
<li><strong>تحكّم أقل</strong> — إنت مش بتختار الأسهم اللي جواه.</li>
<li><strong>سيولة أبطأ</strong> في الصناديق المفتوحة (الاسترداد بياخد أيام أحياناً).</li>
</ul>
<h3>إزاي تختار صندوق؟</h3>
<ol>
<li>حدّد <strong>هدفك وأفقك الزمني</strong> (نمو طويل؟ دخل؟ حفظ سيولة؟).</li>
<li>طابق <strong>نوع الصندوق</strong> مع تحمّلك للمخاطرة.</li>
<li>راجع <strong>الأداء التاريخي</strong> على 3–5 سنين — بس افتكر إنه مش ضمان للمستقبل.</li>
<li>قارن <strong>الرسوم</strong> (إدارة، اشتراك، استرداد) — الرسوم بتاكل من عائدك كل سنة.</li>
<li>اقرأ <strong>نشرة الاكتتاب</strong> وسياسة الاستثمار وأكبر مكوّنات الصندوق.</li>
<li>تأكد إنه <strong>مرخّص من الرقابة المالية</strong>.</li>
<li>لو مهم ليك، دوّر على <strong>صندوق متوافق مع الشريعة</strong> بلجنة رقابة شرعية.</li>
</ol>
<h3>إزاي تستفيد منها عملياً؟</h3>
<div class="callout tip">
<b>للمبتدئ:</b> ابدأ بصندوق مؤشرات أو متوازن كأساس لمحفظتك، وادخل عليه <b>بمبلغ ثابت شهرياً (DCA)</b>. ده بيديك تنويع فوري ويعوّدك على السوق من غير ضغط اختيار الأسهم.
</div>
<ul>
<li><strong>كأساس (Core):</strong> خلّي الصناديق أغلب محفظتك، وسيب نسبة صغيرة للأسهم الفردية اللي بتدرسها بنفسك.</li>
<li><strong>لإدارة السيولة:</strong> الصناديق النقدية مكان مؤقت لفلوس مستنياها بدل ما تسيبها ساكنة.</li>
<li><strong>لتوازن المخاطر:</strong> اخلط صندوق أسهم مع صندوق دخل ثابت حسب تحمّلك.</li>
<li><strong>للاستمرارية:</strong> استثمر دورياً وتجاهل ضوضاء السوق اليومية.</li>
</ul>
<div class="callout note">جرّب <b>🧪 محاكي المحفظة</b> عشان تشوف شكل التوزيع بين الصناديق والأدوات التانية.</div>

</div>`,

{ menu:"أخطاء شائعة", eyebrow:"تحذيرات", title:"أخطاء شائعة تتجنّبها", body:`
<div class="sheet">
<p class="lead">الأخطاء دي مش نظرية — <strong>دي أكتر الأسباب اللي بتخلي المبتدئين يخسروا</strong>، وأغلبها سلوكي مش تحليلي. معرفتها مقدماً بتوفّر عليك فلوس حقيقية.</p>
<h3>1) الدخول من غير خطة</h3>
<p>تشتري من غير ما تعرف ليه بتشتري، ولا إمتى هتبيع، ولا كام مستعد تخسر. <strong>القرار ساعتها بيتحوّل لمزاج</strong>، وكل حركة سعر بتبقى سبب لقرار جديد.</p>
<div class="callout note"><b>العلاج:</b> اكتب قبل كل صفقة: ليه بشتري؟ هدفي كام؟ حد خسارتي كام؟</div>
<h3>2) اتباع القطيع و FOMO</h3>
<p>تشتري لإن الكل بيتكلم عن السهم. المشكلة إن الحماس الجماعي بيرفع السعر <strong>قبل</strong> ما توصلك الأخبار، فبتدخل عند أعلى سعر وأعلى مخاطرة.</p>
<h3>3) عدم وضع حد للخسارة</h3>
<p>الأمل مش استراتيجية. خسارة 10% لو اتسابت ممكن تبقى 50%، واللي بيسمّوه "استثمار طويل المدى" أحياناً بيكون مجرد رفض للاعتراف بالغلط.</p>
<h3>4) وضع كل الفلوس في سهم واحد</h3>
<p>مهما كنت واثق. الثقة العالية مش بديل عن التنويع — <strong>لإن الغلط الوحيد ساعتها بيبقى قاتل</strong>.</p>
<h3>5) القرارات العاطفية</h3>
<p>الطمع بيخليك تشتري في القمة، والخوف بيخليك تبيع في القاع. النمط ده هو بالظبط <strong>عكس اللي المفروض تعمله</strong>، وبيحصل لإن المشاعر بتشتغل أسرع من التحليل.</p>
<h3>6) المتابعة الزائدة للسعر</h3>
<p>متابعة السعر كل دقيقة بترهقك نفسياً وبتخلق إحساس زائف بضرورة التصرف. <strong>كل ما زادت متابعتك، زادت صفقاتك، وزادت تكاليفك وأخطاءك.</strong></p>
<h3>7) التداول المتكرر</h3>
<p>كل صفقة عليها عمولة ودمغة. عشر صفقات في الشهر ممكن تاكل جزء كبير من عائدك السنوي حتى لو معظم قراراتك كانت صح.</p>
<h3>8) مغالطة التكلفة الغارقة</h3>
<p>التمسّك بسهم خسران لمجرد إنك دفعت فيه كتير. <strong>السؤال الصح مش "خسرت كام فيه؟" لكن "لو مكنتش مالكه، كنت هشتريه النهاردة بالسعر ده؟"</strong></p>
<h3>9) الاقتراض للاستثمار</h3>
<p>بيحوّل الخسارة المؤقتة لكارثة دائمة، وبيجبرك تبيع في أسوأ وقت.</p>
<h3>10) الثقة الزائدة بعد سلسلة أرباح</h3>
<p>بعد كام صفقة ناجحة، بتبدأ تكبّر المراكز وتقلل البحث — وغالباً الخسارة الكبيرة بتيجي بالظبط في اللحظة دي.</p>
<div class="callout warn"><b>القاعدة الذهبية:</b> مفيش حاجة اسمها ربح مضمون في البورصة. أي حد بيوعدك بده — سواء شخص أو منصة أو "مدير محفظة" — ده إنذار احتيال مش فرصة.</div>

{ menu:"قبل ما تستثمر أصلاً", eyebrow:"الأساس المالي", title:"أساسك المالي قبل الاستثمار", body:`
<div class="sheet">
<p class="lead">أغلب الأدلة بتبدأ من "اشتري إيه". لكن <strong>الاستثمار مبني على أساس مالي شخصي</strong> — ولو الأساس ده مش موجود، أفضل قرار استثماري ممكن ينهار لأسباب مالهاش علاقة بالسوق.</p>
<h3>1) اعرف وضعك الحالي بصراحة</h3>
<p>قبل أي حاجة، اعمل صورة واضحة لوضعك:</p>
<ul>
<li><strong>صافي ثروتك</strong> = (كل اللي تملكه) − (كل اللي عليك). الرقم ده هو نقطة البداية الحقيقية، مش مرتبك.</li>
<li><strong>الفائض الشهري</strong> = الدخل − المصاريف. لو الرقم ده صفر أو سالب، مفيش استثمار قبل ما تعالجه.</li>
<li><strong>ديونك</strong> مرتّبة حسب سعر الفايدة.</li>
</ul>
<div class="callout note"><b>ليه ده مهم؟</b> لإن الاستثمار بيحوّل فائضك لأصول. من غير فائض منتظم، الاستثمار بيبقى حدث لمرة واحدة مش عملية مستمرة — والتراكم محتاج استمرار.</div>
<h3>2) حدد أهدافك بشكل محدد</h3>
<p>"عايز أكسب فلوس" مش هدف. الهدف المفيد ليه <strong>مبلغ وتاريخ</strong>:</p>
<table class="tbl">
<thead><tr><th>بدل ما تقول</th><th>قول</th><th>الأداة اللي بتترتب عليه</th></tr></thead>
<tbody>
<tr><td>عايز أدّخر</td><td>200 ألف خلال سنتين للجواز</td><td>دخل ثابت — مفيش أسهم</td></tr>
<tr><td>عايز أستثمر</td><td>بناء محفظة تقاعد خلال 25 سنة</td><td>أسهم/صناديق بنسبة عالية</td></tr>
<tr><td>عايز دخل إضافي</td><td>3 آلاف شهرياً خلال 5 سنين</td><td>توزيعات/دخل ثابت/عقار</td></tr>
</tbody>
</table>
<p>لاحظ إن <strong>تحديد الهدف بيحدد الأداة تلقائياً</strong> — من غير ما تحتاج رأي حد.</p>
<h3>3) صندوق الطوارئ (غير قابل للتفاوض)</h3>
<p>سيولة تغطي <strong>مصاريف عدة شهور</strong> في أداة آمنة سهلة السحب، منفصلة تماماً عن استثمارك. ده مش تحفّظ زائد — ده اللي بيمنعك تبيع أصولك في أسوأ لحظة لما تيجي مصيبة.</p>
<div class="callout warn"><b>القاعدة:</b> كل ما كان دخلك أقل استقراراً (عمل حر، عمولات، مصدر واحد)، كل ما احتجت صندوق طوارئ أكبر.</div>
<h3>4) التأمين قبل الاستثمار</h3>
<p>نقطة كتير بينساها: <strong>التأمين مش استثمار — هو حماية لخطتك الاستثمارية</strong>. حادث أو مرض كبير من غير تغطية ممكن يجبرك تسيّل كل استثمارك دفعة واحدة.</p>
<ul>
<li><strong>التأمين الصحي</strong> — الأهم عملياً لأغلب الناس.</li>
<li><strong>تأمين الحياة</strong> — مهم بشكل خاص لو فيه ناس معتمدة عليك مالياً.</li>
<li>افصل دايماً بين <strong>منتجات الحماية</strong> ومنتجات "التأمين الاستثماري" المختلطة — الأخيرة غالباً أعلى تكلفة وأقل شفافية.</li>
</ul>
<h3>5) خطة للتقاعد من بدري</h3>
<p>التقاعد مش حدث بعيد — هو <strong>أكبر هدف مالي في حياة أغلب الناس</strong>. وميزته الوحيدة إن الوقت في صالحك لو بدأت بدري. سنة تأجيل في العشرينات بتكلّف أضعاف ما تتخيّل بسبب التراكم المركّب.</p>
<div class="callout tip">استخدم <b>📈 حاسبة العائد المركّب</b> وجرّب: نفس المبلغ الشهري لمدة 30 سنة مقابل 20 سنة. الفرق هيوضّحلك قيمة البدء المبكر أكتر من أي كلام.</div>
<h3>6) الترتيب النهائي</h3>
<ol>

<div class="sheet">

<h3>المرحلة صفر: قبل أي استثمار</h3>

<li><strong>سدّد ديونك الاستهلاكية عالية الفايدة.</strong> فايدة الدين غالباً أعلى من أي عائد متوقع، فسدادها مكسب مضمون.</li>

<li><strong>حدد أفقك الزمني.</strong> فلوس محتاجها خلال سنة أو سنتين؟ الأسهم مش مكانها.</li>
</ol>

<div class="sheet">
<p class="lead">دي أول خطوة فعلية عشان تقدر تشتري أي سهم. من غيرها مش هتقدر تدخل السوق.</p>
<h3>1) اختار شركة سمسرة</h3>
<ul>
<li>لازم تكون <strong>مرخّصة من الهيئة العامة للرقابة المالية</strong> — تأكد من ده بنفسك على موقع الهيئة.</li>
<li>قارن <strong>العمولات</strong> — فرق بسيط في النسبة بيفرق كتير مع تكرار الصفقات.</li>
<li>شوف <strong>الحد الأدنى لفتح الحساب</strong> (بيختلف من شركة للتانية).</li>
<li>جرّب <strong>منصة التداول</strong> بتاعتهم — سهلة؟ فيها تطبيق موبايل؟ بيانات لحظية؟</li>
<li>اسأل عن <strong>خدمة العملاء والدعم</strong>، خصوصاً وإنت مبتدئ.</li>
</ul>
<h3>2) الأوراق المطلوبة عادةً</h3>
<div class="cards">
<div class="card"><div class="t">بطاقة الرقم القومي</div><div class="d">سارية + صور منها.</div></div>
<div class="card"><div class="t">صور شخصية</div><div class="d">حسب طلب الشركة.</div></div>
<div class="card"><div class="t">إثبات محل إقامة</div><div class="d">فاتورة مرافق مثلاً.</div></div>
<div class="card"><div class="t">بيانات حساب بنكي</div><div class="d">للإيداع والسحب باسمك إنت.</div></div>
</div>
<div class="callout note">القوائم بتختلف من شركة لشركة ومن وقت للتاني — <b>اتأكد من المطلوب من الشركة نفسها</b> قبل ما تروح.</div>
<h3>3) كود المستثمر ورقم الحساب</h3>
<p>الشركة بتستخرجلك <strong>كود مستثمر</strong> من شركة الإيداع المركزي (مصر للمقاصة)، وده اللي بتتسجّل بيه أسهمك باسمك. بعدها بيتفتح حساب التداول وتقدر تحوّل فلوسك وتبدأ.</p>
<h3>4) قبل أول صفقة</h3>
<ol>
<li>افهم منصة التداول كويس (إزاي تحط Limit Order و Stop Loss).</li>
<li>اعرف بالظبط <strong>العمولات والرسوم</strong> اللي هتتخصم منك.</li>
<li>ابدأ بمبلغ صغير في أول صفقة عشان تتعوّد.</li>
<li>راجع <strong>✅ قائمة التحقّق</strong> قبل ما تضغط شراء.</li>
</ol>
<div class="callout warn"><b>تحذير:</b> متحوّلش فلوس لأي حد بصفته الشخصية أبداً — التحويل بيكون لحساب الشركة الرسمي باسمها فقط. واحذر من أي "مدير محفظة" بيوعدك بأرباح مضمونة.</div>
</div>`,

{ menu:"الحاسبات", icon:"🧮", eyebrow:"أدوات", title:"حاسبات الاستثمار", body:`
<div class="sheet">
<p>خمس حاسبات سريعة: العائد المركّب، رسوم الصفقة، الزكاة، حجم المركز، وسعر الذهب. الأرقام تقديرية للتوضيح.</p>
<div class="calc">
<h4>📈 العائد المركّب / الادخار الشهري</h4>
<div class="fields">
<div class="field"><label>مبلغ مبدئي (ج.م)</label><input id="dca-init" type="number" value="0"></div>
<div class="field"><label>ادخار شهري (ج.م)</label><input id="dca-month" type="number" value="1000"></div>
<div class="field"><label>عائد سنوي %</label><input id="dca-rate" type="number" value="12"></div>
<div class="field"><label>عدد السنين</label><input id="dca-years" type="number" value="10"></div>
</div>
<button class="go" onclick="calcDCA()">احسب</button>
<div class="res" id="dca-out">النتيجة هتظهر هنا…</div>
<div class="chart" id="dca-chart" style="display:none"></div>
</div>
<div class="calc">
<h4>💸 رسوم وضريبة الصفقة</h4>
<div class="fields">
<div class="field"><label>قيمة الصفقة (ج.م)</label><input id="fee-val" type="number" value="100000"></div>
<div class="field"><label>عمولة السمسرة % (لكل جانب)</label><input id="fee-broker" type="number" value="0.2"></div>
<div class="field"><label>دمغة % (لكل جانب)</label><input id="fee-stamp" type="number" value="0.05"></div>
</div>
<button class="go" onclick="calcFees()">احسب</button>
<div class="res" id="fee-out">النتيجة هتظهر هنا…</div>
</div>
<div class="calc">
<h4>🕌 الزكاة (للمتاجر)</h4>
<div class="fields"><div class="field"><label>القيمة السوقية لأسهمك (ج.م)</label><input id="zak-val" type="number" value="100000"></div></div>
<button class="go" onclick="calcZakat()">احسب</button>
<div class="res" id="zak-out">النتيجة هتظهر هنا…</div>
</div>
<div class="calc">
<h4>🥇 حاسبة سعر الذهب والتعادل</h4>
<div class="fields">
<div class="field"><label>سعر الأونصة ($)</label><input id="g-oz" type="number" value="2400"></div>
<div class="field"><label>سعر الدولار (ج.م)</label><input id="g-usd" type="number" value="48"></div>
<div class="field"><label>العيار</label><input id="g-k" type="number" value="21"></div>
<div class="field"><label>الوزن (جرام)</label><input id="g-w" type="number" value="10"></div>
<div class="field"><label>المصنعية + هامش %</label><input id="g-fee" type="number" value="8"></div>
</div>
<button class="go" onclick="calcGold()">احسب</button>
<div class="res" id="g-out">النتيجة هتظهر هنا…</div>
</div>
<div class="calc">
<h4>🎯 حجم المركز وحد الخسارة</h4>
<div class="fields">
<div class="field"><label>رأس المال (ج.م)</label><input id="pos-cap" type="number" value="100000"></div>
<div class="field"><label>مخاطرة للصفقة %</label><input id="pos-risk" type="number" value="2"></div>
<div class="field"><label>سعر الدخول</label><input id="pos-entry" type="number" value="50"></div>
<div class="field"><label>وقف الخسارة</label><input id="pos-stop" type="number" value="45"></div>
</div>
<button class="go" onclick="calcPos()">احسب</button>
<div class="res" id="pos-out">النتيجة هتظهر هنا…</div>
</div>

{ menu:"الضرائب والرسوم", eyebrow:"البورصة المصرية", title:"الضرائب والرسوم", body:`
<div class="sheet">
<div class="callout warn"><b>تنبيه:</b> النظام الضريبي على البورصة المصرية اتغيّر جوهرياً في 2025–2026. الأرقام هنا محدّثة حتى منتصف 2026 — <b>اتأكد من النسبة السارية من شركة السمسرة قبل أي صفقة</b>، لإن التشريعات بتتعدّل.</div>
<h3>التحوّل الكبير: من ضريبة الأرباح لضريبة الدمغة</h3>
<p>في يونيو 2025 أعلنت الحكومة إلغاء <strong>ضريبة الأرباح الرأسمالية</strong> على تداول الأسهم المقيدة واستبدالها بـ<strong>ضريبة دمغة نسبية</strong>، وفي يونيو 2026 وافق مجلس النواب نهائياً على التعديل التشريعي.</p>
<h3>النسب المطبّقة</h3>
<table class="tbl">
<thead><tr><th>الحالة</th><th>النسبة لكل طرف</th><th>يعني</th></tr></thead>
<tbody>
<tr><td><b>صفقة عادية</b></td><td>0.5 في الألف</td><td>0.05% على البائع و0.05% على المشتري</td></tr>
<tr><td><b>بيع وشراء في نفس اليوم</b></td><td>0.25 في الألف</td><td>0.025% لكل طرف — لتنظيم المضاربات اليومية</td></tr>
</tbody>
</table>
<ul>
<li>الضريبة <strong>موحّدة على المقيم وغير المقيم</strong> — قبل كده كان المقيم عليه 1.25 في الألف وغير المقيم ضريبة أرباح 10%.</li>
<li>بتتحسب على <strong>إجمالي قيمة العملية دون خصم أي تكاليف</strong>.</li>
<li>فيه <strong>إعفاءات</strong> لتعاملات صانعي السوق ووثائق صناديق الاستثمار المقيدة، لتجنب الازدواج الضريبي.</li>
</ul>
<h3>الفرق الجوهري بين النظامين</h3>
<table class="tbl">
<thead><tr><th></th><th>ضريبة الأرباح (القديمة)</th><th>ضريبة الدمغة (الحالية)</th></tr></thead>
<tbody>
<tr><td>بتتفرض على</td><td>صافي الربح المحقق</td><td>قيمة الصفقة نفسها</td></tr>
<tr><td>لو خسرت</td><td>مبتدفعش</td><td><b>بتدفع برضه</b></td></tr>
<tr><td>المتضرر الأكبر</td><td>المستثمر الرابح</td><td>المتداول كثير الصفقات</td></tr>
<tr><td>التعقيد</td><td>عالي (حساب التكلفة والأرباح)</td><td>بسيط ومباشر</td></tr>
</tbody>
</table>
<div class="callout note"><b>الأثر العملي على سلوكك:</b> النظام بقى بيحاسب على <b>النشاط</b> مش على الربح. يعني كل ما زاد عدد صفقاتك، زادت تكلفتك الضريبية بغض النظر عن نتيجتك — وده بيجعل الاستثمار طويل المدى أوفر ضريبياً من المضاربة المتكررة.</div>
<h3>كل التكاليف على صفقتك</h3>
<table class="tbl">
<thead><tr><th>البند</th><th>على إيه بتتفرض</th></tr></thead>
<tbody>
<tr><td><b>عمولة السمسرة</b></td><td>نسبة على قيمة كل صفقة — بتختلف من شركة لشركة وهي غالباً <b>أكبر بند</b></td></tr>
<tr><td><b>ضريبة الدمغة</b></td><td>0.05% على كل بيع وكل شراء (0.025% لصفقات نفس اليوم)</td></tr>
<tr><td><b>رسوم البورصة والمقاصة</b></td><td>رسوم تشغيلية على الصفقات والإيداع المركزي</td></tr>
<tr><td><b>ضريبة التوزيعات</b></td><td>بتتخصم من توزيعات الأرباح النقدية</td></tr>
</tbody>
</table>
<div class="callout warn"><b>ملاحظة مهمة:</b> الدمغة نسبتها صغيرة نسبياً، لكن <b>عمولة السمسرة عادةً أكبر منها بكتير</b>. فلو بتقارن التكاليف، ركّز على العمولة أولاً — دي اللي فيها فرق حقيقي بين الشركات وتقدر تتفاوض أو تختار على أساسها.</div>
<h3>مثال توضيحي</h3>
<div class="callout note">صفقة بـ100,000 ج.م، بافتراض عمولة سمسرة 0.2% ودمغة 0.05% لكل جانب:<br>
• تكلفة الشراء ≈ 250 ج.م &nbsp;•&nbsp; تكلفة البيع ≈ 250 ج.م<br>
• <b>إجمالي الرحلة الكاملة ≈ 500 ج.م</b> — يعني السهم لازم يرتفع ~0.5% قبل ما تبدأ تكسب.<br>
<span style="font-size:.9em">الأرقام دي توضيحية — عمولة السمسرة بتختلف، فاحسب بأرقامك إنت.</span></div>
<h3>أثر الرسوم على استراتيجيتك</h3>
<p>الرقم اللي فوق بيبان صغير في صفقة واحدة، لكن لو بتعمل 20 صفقة في السنة، <strong>التكلفة التراكمية بتاكل جزء معتبر من عائدك</strong> حتى لو أغلب قراراتك كانت صح.</p>
<div class="callout tip"><b>القاعدة:</b> التكلفة هي الجزء الوحيد اللي بتتحكم فيه بشكل مؤكد — العائد مش مضمون، لكن الرسوم مضمونة. قلل عدد صفقاتك وقارن عمولات السماسرة.</div>
<div class="callout warn"><b>خطأ شائع:</b> حساب الربح من فرق السعر بس. الربح الحقيقي = (سعر البيع − سعر الشراء) − كل الرسوم والضرايب على الجانبين. جرّب <b>💸 حاسبة رسوم الصفقة</b>.</div>
</div>`, bank:[

{ menu:"الحلال والزكاة", eyebrow:"الجانب الشرعي", title:"الأسهم المتوافقة مع الشريعة والزكاة", body:`
<div class="sheet">
<p class="lead">الجانب الشرعي في الاستثمار بيدور حول سؤالين: <strong>هل السهم ده حلال؟</strong> و<strong>إزاي أزكّي عليه؟</strong> والإجابة فيها اجتهادات، فالمعروض هنا الإطار العام والرجوع لمتخصص ضروري.</p>
<h3>أولاً: معايير السهم المتوافق مع الشريعة</h3>
<p>غالباً بيتم الفحص على مستويين:</p>
<ol>
<li><strong>معيار النشاط:</strong> نشاط الشركة الأساسي لازم يكون مباحاً — فبتُستبعد البنوك الربوية، والخمور، والتبغ، والقمار، وما شابهها.</li>
<li><strong>المعايير المالية:</strong> حتى لو النشاط مباح، بيتم فحص نسب الشركة — نسبة الديون بفوائد، والاستثمارات الربوية، والإيرادات غير المتوافقة. المعايير الشائعة بتحط حدوداً حوالي الثُلث، وبتختلف بين الهيئات.</li>
</ol>
<div class="callout note"><b>ليه فيه معايير مالية أصلاً؟</b> لإن شركة نشاطها مباح ممكن تكون معتمدة على قروض بفوايد أو مودعة أموالها بفائدة، فالتعامل في سهمها بيدخله جزء غير متوافق.</div>
<h3>ثانياً: التطهير</h3>
<p>لو الشركة عندها إيرادات غير متوافقة بنسبة صغيرة ضمن الحدود المقبولة، بيكون على المساهم <strong>تطهير نصيبه منها</strong> بالتصدّق بها دون نية الأجر. النسبة عادةً بتُعلن من الجهة أو اللجنة الشرعية اللي بتفحص السهم.</p>
<h3>ثالثاً: الزكاة على الأسهم</h3>
<p>الحكم بيختلف حسب <strong>نيتك</strong> من امتلاك السهم:</p>
<table class="tbl">
<thead><tr><th>الحالة</th><th>الوعاء الزكوي</th><th>النسبة</th></tr></thead>
<tbody>
<tr><td><b>نية المتاجرة</b><br>(بيع وشراء)</td><td>القيمة السوقية الكاملة للأسهم وقت الحول</td><td>2.5%</td></tr>
<tr><td><b>نية الاستثمار طويل المدى</b><br>(احتفاظ للعائد)</td><td>حصتك من الموجودات الزكوية للشركة (نقد، بضائع، ديون لها) — مش قيمة السهم كاملة</td><td>2.5%</td></tr>
</tbody>

<p>سبب التفرقة إن السهم في حالة المتاجرة بيبقى <strong>عرض تجارة</strong> يُزكّى بقيمته، أما في حالة الاستثمار فبيبقى وسيلة إنتاج ويُزكّى على موجوداته الزكوية.</p>
<h3>تفاصيل عملية</h3>
<ul>
<li><strong>موعد الحساب:</strong> عند حولان الحول (مرور سنة قمرية على بلوغ النصاب).</li>
<li><strong>التوزيعات النقدية:</strong> بتنضم لأموالك وتُزكّى معها عند الحول.</li>

<li><strong>حساب الموجودات الزكوية:</strong> صعب على الفرد، وبعض الشركات أو الجهات الشرعية بتعلن نصيب السهم من الزكاة لتسهيل الحساب.</li>
</ul>
<h3>الصناديق المتوافقة</h3>
<p>فيه صناديق استثمار بلجان رقابة شرعية بتلتزم بالضوابط دي، وبتوفّر عليك مجهود فحص كل سهم بنفسك. تأكد من <strong>وجود لجنة شرعية معتمدة</strong> واقرا سياسة الصندوق الاستثمارية.</p>
<div class="callout warn"><b>مهم:</b> النسب والتفاصيل دي فيها اجتهادات وبتختلف بين الهيئات والمذاهب. المعروض هنا إطار عام للفهم — <b>ارجع لمتخصص شرعي موثوق</b> لحالتك تحديداً، خصوصاً في حساب الزكاة.</div>

{ menu:"الاستثمار في الذهب", eyebrow:"أصل بديل", title:"الاستثمار في الذهب", body:`
<div class="sheet">
<p class="lead">الذهب من أقدم وسائل حفظ القيمة، وفي مصر تحديداً من أكتر الأدوات شعبية. لكن فيه سوء فهم شائع: <strong>الذهب مش أداة نمو، هو أداة حفظ قيمة وتحوّط</strong> — والفرق بينهم بيغيّر توقعاتك تماماً.</p>
<h3>ليه الناس بتشتري ذهب؟</h3>
<ul>
<li><strong>التحوّط من التضخم:</strong> لما العملة تفقد قيمتها، الذهب بيميل للحفاظ على قوته الشرائية.</li>
<li><strong>التحوّط من مخاطر العملة:</strong> سعره عالمياً بالدولار، فبيستفيد لما الجنيه ينخفض.</li>
<li><strong>ملاذ وقت الأزمات:</strong> بيميل للارتفاع في فترات عدم اليقين والحروب والاضطرابات.</li>
<li><strong>تنويع المحفظة:</strong> حركته مش دايماً مرتبطة بالأسهم، فبيقلل تقلب المحفظة الكلي.</li>
</ul>
<h3>⚠️ الحقيقة المهمة: الذهب أصل غير منتج</h3>
<p>ده أهم مفهوم في القسم كله. السهم حصة في شركة <strong>بتنتج وبتكسب وبتوزّع أرباح</strong>؛ العقار بيدّي إيجار. أما الذهب فقطعة معدن — <strong>مبيدّيش دخل دوري خالص</strong>. مكسبك الوحيد منه هو إن حد تاني يشتريه منك بسعر أعلى.</p>
<div class="callout note"><b>النتيجة العملية:</b> على المدى الطويل جداً، الأصول المنتجة (أسهم، عقار مؤجّر) تاريخياً بتتفوّق على الذهب في العائد الحقيقي. دور الذهب في محفظتك هو <b>الحماية</b> مش النمو — وده مش عيب فيه، ده تعريفه.</p></div>
<h3>طرق الاستثمار في الذهب</h3>
<table class="tbl">
<thead><tr><th>الطريقة</th><th>المميزات</th><th>العيوب</th></tr></thead>
<tbody>
<tr><td><b>السبائك</b></td><td>أقل مصنعية، أقرب للسعر العالمي، أفضل للاستثمار</td><td>تحتاج تخزين آمن، وحدات أكبر</td></tr>
<tr><td><b>الجنيهات الذهب</b></td><td>سهلة البيع، وحدة متوسطة، مطلوبة دايماً</td><td>مصنعية أعلى من السبيكة</td></tr>
<tr><td><b>المشغولات (الحلي)</b></td><td>استخدام شخصي + قيمة</td><td><span class="pill p-hi">أسوأ خيار استثمارياً</span> — مصنعية عالية بتضيع عند البيع</td></tr>
<tr><td><b>صناديق الذهب</b></td><td>مفيش تخزين ولا مخاطر سرقة، سيولة أسهل، وحدات صغيرة</td><td>رسوم إدارة سنوية</td></tr>
</tbody>
</table>
<div class="callout warn"><b>أكبر خطأ شائع:</b> شراء <b>مشغولات ذهبية بنية الاستثمار</b>. المصنعية ممكن تكون نسبة معتبرة من السعر، وبتخسرها كلها تقريباً وقت البيع. لو هدفك استثمار، اتجه للسبائك أو الجنيهات أو الصناديق.</div>
<h3>مفاهيم لازم تعرفها</h3>
<div class="cards">
<div class="card"><div class="t">العيار</div><div class="d">نسبة نقاء الذهب: 24 (نقي) · 21 (الأشهر في مصر) · 18. كل ما زاد العيار زاد السعر للجرام.</div></div>
<div class="card"><div class="t">المصنعية</div><div class="d">تكلفة التشكيل — بتضاف عند الشراء ومش بتسترجع عند البيع.</div></div>
<div class="card"><div class="t">فرق البيع والشراء</div><div class="d">بتشتري بسعر أعلى وبتبيع بأقل — تكلفة فورية زي الـ Spread في الأسهم.</div></div>
<div class="card"><div class="t">الدمغة</div><div class="d">ختم رسمي بيثبت العيار — متشتريش من غير دمغة وفاتورة.</div></div>
</div>
<h3>إيه اللي بيحرّك سعر الذهب؟</h3>
<ol>
<li><strong>سعر الأونصة عالمياً</strong> (بالدولار) — العامل الأساسي.</li>
<li><strong>سعر صرف العملة المحلية</strong> — في مصر، انخفاض الجنيه بيرفع سعر الذهب محلياً حتى لو العالمي ثابت.</li>
<li><strong>أسعار الفايدة العالمية</strong> — ارتفاعها بيقلل جاذبية الذهب لإنه مبيدّيش عائد.</li>
<li><strong>الطلب والأزمات</strong> — التوترات الجيوسياسية بتزوّد الطلب عليه كملاذ.</li>
</ol>
<h3>قد إيه أحط في الذهب؟</h3>
<p>مفيش رقم قاطع، لكن الشائع بين المخططين الماليين إن الذهب يكون <strong>نسبة محدودة من المحفظة</strong> (كتير بيتكلموا عن حدود 5–15%) — بوصفه أداة <strong>تحوّط</strong> مش أساس للمحفظة. تحويل معظم مدّخراتك لذهب معناه التخلي عن نمو الأصول المنتجة.</p>
<h3>مقارنة سريعة: ذهب مقابل أسهم</h3>
<table class="tbl">
<thead><tr><th></th><th>الذهب</th><th>الأسهم</th></tr></thead>
<tbody>
<tr><td>دخل دوري</td><td>لا يوجد</td><td>توزيعات محتملة</td></tr>
<tr><td>الطبيعة</td><td>أصل غير منتج</td><td>حصة في نشاط منتج</td></tr>
<tr><td>وقت الأزمات</td><td>غالباً بيصعد</td><td>غالباً بينزل</td></tr>
<tr><td>العائد الحقيقي طويل المدى</td><td>متوسط تاريخياً</td><td>أعلى تاريخياً</td></tr>
<tr><td>السيولة</td><td>عالية</td><td>عالية</td></tr>
</tbody>
</table>
<div class="callout tip"><b>الخلاصة:</b> الاتنين مش بدائل — هما <b>مكمّلين</b>. الأسهم للنمو، والذهب للحماية وقت ما الأسهم بتتعب. وده بالظبط سبب إن التنويع بينهم بيقلل تقلب محفظتك.</div>
<h3>نصائح عملية عند الشراء</h3>
<ul>
<li>اشترِ من <strong>محل موثوق</strong> واطلب <strong>فاتورة رسمية</strong> فيها الوزن والعيار والسعر والمصنعية.</li>
<li>تأكد من وجود <strong>الدمغة</strong> على القطعة.</li>
<li>اسأل عن <strong>سعر إعادة الشراء</strong> قبل ما تشتري — ده اللي هيحدد خسارتك الفورية.</li>
<li>فكّر في <strong>التخزين الآمن</strong> (خزنة بنكية مثلاً) — الذهب المادي عرضة للسرقة والفقد.</li>
<li>الشراء التدريجي على فترات بيقلل خطر الشراء عند قمة سعرية.</li>
</ul>
<h3>إزاي يتحسب سعر الذهب عندك؟</h3>
<p>سعر الجرام المحلي مش رقم عشوائي — هو ناتج معادلة واضحة:</p>
<div class="callout note"><b>سعر الجرام ≈ (سعر الأونصة بالدولار ÷ 31.1) × سعر الدولار × (العيار ÷ 24)</b><br>
وبعدين بيتضاف عليه <b>المصنعية</b> وهامش ربح التاجر عند الشراء.</div>
<p>الفايدة العملية للمعادلة دي إنك <strong>تقدر تتأكد إن السعر المعروض عليك منطقي</strong> قبل ما تشتري، بدل ما تعتمد على كلام التاجر وحده.</p>
<h3>العيارات: أنهي أختار؟</h3>
<table class="tbl">
<thead><tr><th>العيار</th><th>النقاء</th><th>الاستخدام</th><th>للاستثمار؟</th></tr></thead>
<tbody>
<tr><td><b>24</b></td><td>ذهب نقي</td><td>سبائك وعملات</td><td><span class="pill p-lo">الأفضل</span></td></tr>
<tr><td><b>22</b></td><td>عالي</td><td>الجنيه الذهب</td><td><span class="pill p-lo">جيد</span></td></tr>
<tr><td><b>21</b></td><td>الأشهر في مصر</td><td>مشغولات ومدخرات</td><td><span class="pill p-mid">مقبول</span></td></tr>
<tr><td><b>18</b></td><td>أقل نقاءً</td><td>مشغولات ومجوهرات</td><td><span class="pill p-hi">غير مناسب</span></td></tr>
</tbody>
</table>
<div class="callout warn"><b>انتبه:</b> العيار الأقل معناه ذهب أقل في نفس الوزن. جرام عيار 18 فيه ذهب أقل من جرام عيار 21، فسعره أقل — <b>مش لإنه "أرخص" بل لإنه أقل نقاءً</b>.</div>
<h3>حساب خسارتك الفورية (المهم اللي محدش بيحسبه)</h3>
<p>لحظة ما تشتري ذهب، إنت فعلياً في خسارة — لإنك دفعت مصنعية وهامش تاجر مش هتسترجعهم.</p>
<div class="callout note"><b>مثال توضيحي:</b> اشتريت بـ10,000 ج.م والمصنعية وفرق البيع والشراء مجتمعين 8%.<br>
• قيمة بيعها فوراً ≈ 9,200 ج.م<br>
• <b>السعر لازم يرتفع ~8.7% عشان تتعادل</b> — قبل أي مكسب.<br>
وده بالظبط سبب إن الذهب <b>مش أداة للمدى القصير</b>.</div>
<h3>الذهب المادي مقابل صناديق الذهب</h3>
<table class="tbl">
<thead><tr><th>المعيار</th><th>ذهب مادي</th><th>صندوق ذهب</th></tr></thead>
<tbody>
<tr><td>الحيازة</td><td>بتمتلكه في إيدك</td><td>ملكية غير مباشرة</td></tr>
<tr><td>التكلفة الأولية</td><td>مصنعية + هامش تاجر</td><td>رسوم شراء أقل عادةً</td></tr>
<tr><td>التكلفة المستمرة</td><td>تخزين آمن</td><td>رسوم إدارة سنوية</td></tr>
<tr><td>مخاطر السرقة</td><td><span class="pill p-hi">موجودة</span></td><td><span class="pill p-lo">لا توجد</span></td></tr>
<tr><td>سهولة البيع</td><td>محتاج تروح تاجر</td><td>أسرع وأوضح سعرياً</td></tr>
<tr><td>الوحدات الصغيرة</td><td>صعبة</td><td>سهلة (شراء بمبالغ صغيرة)</td></tr>
</tbody>
</table>
<h3>متى يكون الذهب اختياراً ضعيفاً؟</h3>
<ul>
<li><strong>لو أفقك قصير</strong> (أقل من 3–5 سنين) — تكاليف الدخول والخروج بتاكل أي مكسب محتمل.</li>
<li><strong>لو هدفك دخل شهري</strong> — الذهب مبيدّيش أي دخل، خالص.</li>
<li><strong>لو بتشتري بعد ارتفاع حاد</strong> — الشراء وقت الذروة الإعلامية غالباً بيكون في أسوأ سعر.</li>
<li><strong>لو هتحط فيه كل مدّخراتك</strong> — بتتخلى عن نمو الأصول المنتجة مقابل حماية بس.</li>
</ul>
<h3>الفضة والمعادن الأخرى</h3>
<p>الفضة أرخص وأسهل في الدخول بمبالغ صغيرة، لكنها <strong>أعلى تقلباً من الذهب بكتير</strong> لإن جزء كبير من طلبها صناعي بيتأثر بالدورة الاقتصادية. مش بديل عن الذهب كملاذ آمن، وسوقها أضيق.</p>
<h3>خطة عملية للمدّخر المصري</h3>
<ol>
<li><strong>حدد الهدف:</strong> حماية من التضخم وانخفاض الجنيه — مش مضاربة على السعر.</li>
<li><strong>حدد النسبة:</strong> جزء محدود من مدّخراتك، والباقي في أصول منتجة.</li>
<li><strong>اختار الصورة:</strong> سبائك أو جنيهات ذهب للحيازة، أو صندوق ذهب لو مش عايز تخزين.</li>
<li><strong>اشترِ تدريجياً</strong> على فترات بدل دفعة واحدة.</li>
<li><strong>احتفظ بالفواتير</strong> — بتفرق كتير وقت البيع.</li>
<li><strong>خزّنه بأمان</strong> (خزنة بنكية) ومتقولش لحد إنك بتحتفظ بذهب في البيت.</li>
</ol>
<div class="callout tip">جرّب <b>🥇 حاسبة سعر الذهب والتعادل</b> في قسم الحاسبات لتطبيق المعادلة على أرقامك.</div>
<div class="callout warn"><b>الجانب الشرعي:</b> بيع وشراء الذهب له أحكام خاصة — أهمها اشتراط <b>التقابض الفوري</b> (القبض في مجلس العقد) في مبادلة الذهب بالنقد، وده بيثير أسئلة حول بعض صور الشراء المؤجل أو الإلكتروني. ارجع لمتخصص شرعي لو الموضوع مهم بالنسبالك.</div>
</div>`,

{ menu:"العقارات", eyebrow:"أصل ملموس", title:"الاستثمار في العقارات", body:`
<div class="sheet">
<p class="lead">العقار من أشهر أدوات الاستثمار في مصر، وميزته الأساسية إنه <strong>أصل منتج ملموس</strong> — بيدّي دخل إيجاري وبيميل للحفاظ على قيمته مع التضخم. لكن سيولته المنخفضة بتخليه أداة مختلفة تماماً عن الأسهم.</p>
<h3>طرق الاستثمار العقاري</h3>
<table class="tbl">
<thead><tr><th>الطريقة</th><th>مصدر العائد</th><th>المخاطرة</th></tr></thead>
<tbody>
<tr><td><b>شراء للتأجير</b></td><td>إيجار دوري + ارتفاع القيمة</td><td><span class="pill p-mid">متوسطة</span></td></tr>
<tr><td><b>شراء للبيع (تقليب)</b></td><td>فرق السعر فقط</td><td><span class="pill p-hi">عالية</span></td></tr>
<tr><td><b>أراضي</b></td><td>ارتفاع القيمة</td><td><span class="pill p-hi">عالية — بلا دخل</span></td></tr>
<tr><td><b>وحدات تجارية/إدارية</b></td><td>إيجار أعلى عادةً</td><td><span class="pill p-mid">متوسطة — طلب أقل استقراراً</span></td></tr>
</tbody>
</table>
<h3>حساب العائد الحقيقي (اللي كتير بينساه)</h3>
<p>العائد مش الإيجار السنوي ÷ سعر الشراء. لازم تخصم:</p>
<ul>
<li><strong>فترات الخلو</strong> — الوحدة مش مؤجّرة طول السنة بالضرورة.</li>
<li><strong>الصيانة والتشطيبات</strong> الدورية.</li>
<li><strong>الرسوم والضرايب</strong> ومصاريف التسجيل.</li>
<li><strong>عمولة السمسار</strong> عند الشراء والتأجير.</li>
</ul>
<div class="callout note"><b>مثال:</b> وحدة بـمليون جنيه وإيجارها 60 ألف سنوياً = عائد ظاهري 6%. لكن مع شهرين خلو وصيانة 8 آلاف، الصافي الفعلي بيقرب من 4.2%. <b>قارن دايماً بالصافي مش بالظاهري.</b></div>
<h3>المميزات</h3>
<div class="cards">
<div class="card"><div class="t">دخل دوري</div><div class="d">إيجار شهري ملموس، عكس الذهب.</div></div>
<div class="card"><div class="t">حماية من التضخم</div><div class="d">الإيجارات والأسعار بتميل للارتفاع معه.</div></div>
<div class="card"><div class="t">أصل ملموس</div><div class="d">إحساس بالأمان النفسي وقابلية للاستخدام.</div></div>
<div class="card"><div class="t">تقلب أقل ظاهرياً</div><div class="d">مفيش سعر لحظي يومي يوتّرك.</div></div>
</div>
<h3>⚠️ العيوب الحقيقية</h3>
<ul>
<li><strong>سيولة منخفضة جداً:</strong> البيع ممكن ياخد شهور، ولو مستعجل هتبيع بخصم.</li>
<li><strong>رأس مال كبير:</strong> صعب تبدأ بمبلغ صغير أو تنوّع.</li>
<li><strong>مصاريف مستمرة:</strong> صيانة وضرايب حتى لو الوحدة فاضية.</li>
<li><strong>عبء الإدارة:</strong> مستأجرين، تحصيل، إصلاحات — ده شغل مش دخل سلبي بالكامل.</li>
<li><strong>تركيز المخاطر:</strong> وحدة واحدة في منطقة واحدة = بيضك كله في سلة.</li>
<li><strong>مخاطر قانونية:</strong> مشاكل التسجيل والملكية والإخلاء.</li>
</ul>
<div class="callout warn"><b>خطأ شائع:</b> اعتبار "العقار مبيخسرش أبداً". العقار ممكن يركد سنين، والمناطق بتتغير، والتقلب موجود — بس <b>إنت مش شايفه لإن مفيش سعر يومي معروض قدامك</b>. غياب السعر مش غياب المخاطرة.</div>
<h3>قبل أي شراء عقاري</h3>
<ol>
<li>تأكد من <strong>سلامة الأوراق والتسجيل</strong> — ده أهم من السعر.</li>
<li>ادرس <strong>الطلب على الإيجار</strong> في المنطقة تحديداً مش في المدينة عموماً.</li>
<li>احسب <strong>العائد الصافي</strong> بعد كل المصاريف.</li>
<li>اسأل عن <strong>مدة البيع المتوقعة</strong> في المنطقة لو احتجت تخرج.</li>
<li>خد في اعتبارك <strong>البنية التحتية والمشاريع المستقبلية</strong> حواليها.</li>
</ol>
</div>`,

{ menu:"الأدوات ذات الدخل الثابت", eyebrow:"الأمان أولاً", title:"الشهادات والودائع وأذون الخزانة", body:`
<div class="sheet">
<p class="lead">دي أدوات <strong>الأمان والدخل المعروف مقدماً</strong>. مش هتبني بيها ثروة كبيرة، لكنها ضرورية لأي محفظة متوازنة — وأحياناً هي الخيار الصح تماماً.</p>
<h3>الأنواع الأساسية</h3>
<table class="tbl">
<thead><tr><th>الأداة</th><th>الجهة</th><th>المدة</th><th>الميزة</th></tr></thead>
<tbody>
<tr><td><b>شهادات الادخار</b></td><td>البنوك</td><td>سنة – 5 سنين</td><td>عائد ثابت معروف، أمان رأس المال</td></tr>
<tr><td><b>الودائع</b></td><td>البنوك</td><td>مرنة</td><td>سهولة ومرونة أعلى</td></tr>
<tr><td><b>أذون الخزانة</b></td><td>الحكومة</td><td>3 – 12 شهر</td><td>قصيرة الأجل، مخاطر ائتمانية منخفضة</td></tr>
<tr><td><b>السندات الحكومية</b></td><td>الحكومة</td><td>سنوات</td><td>عائد دوري لفترة أطول</td></tr>
<tr><td><b>صناديق الدخل الثابت</b></td><td>شركات إدارة</td><td>مرنة</td><td>تنويع وإدارة بمبالغ صغيرة</td></tr>
</tbody>
</table>
<h3>⚠️ الخطر الخفي: التضخم</h3>
<p>أكبر سوء فهم في الأدوات دي إن الناس بتفتكرها "بلا مخاطرة". صحيح إن <strong>رأس مالك آمن رقمياً</strong>، لكن قوتك الشرائية مش آمنة.</p>
<div class="callout warn"><b>مثال:</b> شهادة بعائد 20% وتضخم 25% = <b>خسارة حقيقية 5% كل سنة</b>. رصيدك بيزيد أرقاماً وبيقل قيمةً. المخاطرة هنا حقيقية بس صامتة ومش ظاهرة زي تقلب الأسهم.</div>
<h3>إمتى تكون الخيار الصح؟</h3>
<ul>
<li><strong>فلوس محتاجها خلال سنة أو سنتين</strong> — مينفعش تعرّضها لتقلب الأسهم.</li>
<li><strong>صندوق الطوارئ</strong> — لازم يكون في أداة آمنة سهلة السحب.</li>
<li><strong>الجزء الدفاعي من محفظتك</strong> — بيخفف التقلب ويمنعك من البيع بذعر.</li>
<li><strong>لو قرّبت على التقاعد</strong> أو دخلك غير مستقر.</li>
<li><strong>وقت ارتفاع الفايدة</strong> — العائد بيبقى مغرياً نسبياً.</li>
</ul>
<h3>نقاط عملية</h3>
<ol>
<li><strong>الكسر المبكر:</strong> معظم الشهادات ليها شروط وغرامة لو كسرتها بدري — اسأل قبل ما تشترك.</li>
<li><strong>دورية العائد:</strong> شهري أم سنوي؟ الشهري بيناسب من يحتاج دخل، والتراكمي بيستفيد من إعادة الاستثمار.</li>
<li><strong>سلّم الاستحقاقات:</strong> بدل ما تحط كل فلوسك في شهادة واحدة بمدة واحدة، وزّعها على مدد مختلفة عشان تحافظ على مرونتك.</li>
<li><strong>قارن دايماً بالتضخم المتوقع</strong> مش بالعائد المعلن وحده.</li>
</ol>
<div class="callout tip"><b>القاعدة:</b> الأدوات دي مش "استثمار ضعيف" — هي <b>أداة لهدف مختلف</b>. استخدمها للحماية والسيولة والمدى القصير، والأصول المنتجة للنمو طويل المدى.</div>
</div>`,

<div class="sheet">
<p class="lead">ده القسم اللي بيربط الدليل كله. القاعدة الحاكمة في جملة واحدة: <strong>المدة اللي هتسيب فيها فلوسك هي اللي بتحدد الأداة — مش العائد المتوقع ولا رأيك في السوق.</strong></p>
<div class="callout warn"><b>أخطر خطأ في الاستثمار كله:</b> حط فلوس محتاجها قريب في أداة متقلبة. لإنك ساعتها مش هتختار وقت الخروج — <b>الظروف هي اللي هتختاره</b>، وغالباً هيكون في أسوأ لحظة.</div>
<h3>الخريطة السريعة حسب المدى</h3>
<table class="tbl">
<thead><tr><th>محتاج الفلوس بعد</th><th>الأداة المناسبة</th><th>ليه</th></tr></thead>
<tbody>
<tr><td><b>أقل من سنة</b></td><td>حساب جاري · صندوق نقدي · وديعة قصيرة</td><td>الأولوية للسيولة وأمان رأس المال</td></tr>
<tr><td><b>1 – 3 سنين</b></td><td>شهادات · أذون خزانة · صناديق دخل ثابت</td><td>عائد معقول بتقلب محدود</td></tr>
<tr><td><b>3 – 5 سنين</b></td><td>مزيج متوازن: دخل ثابت + نسبة أسهم/صناديق</td><td>المدة تسمح بتقلب محدود</td></tr>
<tr><td><b>5 – 10 سنين</b></td><td>أسهم وصناديق أسهم كأساس + ذهب كتحوّط</td><td>الوقت بيقلل احتمال الخسارة</td></tr>
<tr><td><b>أكتر من 10 سنين</b></td><td>أسهم وصناديق مؤشرات بنسبة عالية + عقار</td><td>الأصول المنتجة بتتفوّق على المدى الطويل</td></tr>
</tbody>
</table>
<h3>كل أداة: امتى تناسبك وامتى لأ</h3>
<div class="topic">
<div class="tn"><i>01</i>الأسهم الفردية</div>
<p><strong>المدى:</strong> طويل (5 سنين+) · <strong>الهدف:</strong> نمو رأس المال</p>
<div class="ex"><b>✅ تناسبك لو:</b> عندك وقت منتظم للبحث، وتتحمّل هبوط 30–40% من غير ما تبيع، وأفقك سنين.</div>
<div class="lesson"><b>❌ متقربش لو:</b> محتاج الفلوس خلال سنتين، أو مش هتقدر تتابع نتائج الشركات، أو التقلب بيأثر على نومك.</div>
</div>
<div class="topic">
<div class="tn"><i>02</i>صناديق المؤشرات والأسهم</div>
<p><strong>المدى:</strong> طويل (5 سنين+) · <strong>الهدف:</strong> نمو بمجهود أقل</p>
<div class="ex"><b>✅ تناسبك لو:</b> عايز نمو طويل المدى من غير اختيار أسهم، ووقتك محدود، وبتفضل التنويع الجاهز.</div>
<div class="lesson"><b>❌ متقربش لو:</b> أفقك أقل من 3–5 سنين — الرسوم والتقلب مش هيسعفوك.</div>
</div>
<div class="topic">
<div class="tn"><i>03</i>الشهادات والودائع وأذون الخزانة</div>
<p><strong>المدى:</strong> قصير لمتوسط (شهور – 3 سنين) · <strong>الهدف:</strong> أمان ودخل معروف</p>
<div class="ex"><b>✅ تناسبك لو:</b> محتاج الفلوس قريب، أو بتكوّن صندوق طوارئ، أو دخلك غير مستقر، أو قرّبت على التقاعد.</div>
<div class="lesson"><b>❌ متعتمدش عليها وحدها لو:</b> أفقك عشر سنين — التضخم هياكل جزء كبير من قيمتك الحقيقية.</div>
</div>
<div class="topic">
<div class="tn"><i>04</i>الذهب</div>
<p><strong>المدى:</strong> طويل (5 سنين+) · <strong>الهدف:</strong> تحوّط وحفظ قيمة — مش نمو</p>
<div class="ex"><b>✅ يناسبك لو:</b> عايز حماية من التضخم وانخفاض العملة، كـ<b>نسبة محدودة</b> من محفظتك.</div>
<div class="lesson"><b>❌ متقربش لو:</b> أفقك أقل من 3 سنين (المصنعية هتاكل مكسبك)، أو محتاج دخل شهري، أو ناوي تحط فيه كل مدّخراتك.</div>
</div>
<div class="topic">
<div class="tn"><i>05</i>العقارات</div>
<p><strong>المدى:</strong> طويل جداً (7 سنين+) · <strong>الهدف:</strong> دخل إيجاري + نمو</p>
<div class="ex"><b>✅ تناسبك لو:</b> عندك رأس مال كافٍ، ومستعد لإدارة العقار، ومش هتحتاج الفلوس فجأة.</div>
<div class="lesson"><b>❌ متقربش لو:</b> ممكن تحتاج تسييل سريع، أو المبلغ ده كل مدّخراتك (تركيز شديد)، أو مش قادر تتحمّل مصاريف صيانة وفترات خلو.</div>
</div>
<h3>نماذج محفظة حسب الحالة</h3>
<p>دي أمثلة توضيحية للفهم — <strong>مش توصية</strong>، وظروفك بتغيّرها:</p>
<table class="tbl">
<thead><tr><th>الحالة</th><th>توزيع تقريبي</th></tr></thead>
<tbody>
<tr><td><b>شاب في العشرينات، دخل مستقر، أفق 20 سنة</b></td><td>نسبة عالية أسهم/صناديق · نسبة صغيرة ذهب · صندوق طوارئ</td></tr>
<tr><td><b>في الأربعينات، عنده التزامات عائلية</b></td><td>توازن بين أسهم ودخل ثابت · ذهب محدود · طوارئ أكبر</td></tr>
<tr><td><b>قرّب على التقاعد (5 سنين)</b></td><td>غالبية دخل ثابت · أسهم محدودة · سيولة عالية</td></tr>
<tr><td><b>دخل غير منتظم (عمل حر)</b></td><td>صندوق طوارئ أكبر بكتير · تقليل الأصول المتقلبة</td></tr>
<tr><td><b>بيدّخر لهدف بعد سنتين (جواز/سفر)</b></td><td>أدوات دخل ثابت فقط — الأسهم مش مكانها</td></tr>
</tbody>
</table>
<h3>الترتيب الصح للأولويات</h3>
<ol>
<li><strong>سدّد الديون الاستهلاكية</strong> عالية الفايدة — عائد مضمون.</li>
<li><strong>كوّن صندوق طوارئ</strong> في أداة آمنة سهلة السحب.</li>
<li><strong>غطِّ أهدافك قصيرة المدى</strong> بأدوات دخل ثابت.</li>
<li><strong>بعدين</strong> ابدأ الاستثمار طويل المدى في الأصول المنتجة.</li>
<li><strong>وأخيراً</strong> ضيف نسبة تحوّط (ذهب) لو حبيت.</li>
</ol>
<div class="callout note"><b>ليه الترتيب ده مهم؟</b> لإن كل خطوة بتحمي اللي بعدها. الاستثمار من غير صندوق طوارئ معناه إنك هتضطر تسيّل في أسوأ وقت — فبتخسر رغم إن اختيارك كان صح.</div>
<h3>الأسئلة الأربعة قبل أي قرار</h3>
<div class="cards">
<div class="card"><div class="t">1. امتى محتاج الفلوس؟</div><div class="d">ده أهم سؤال وبيحدد الأداة قبل أي حاجة.</div></div>
<div class="card"><div class="t">2. لو نزلت 30% هتعمل إيه؟</div><div class="d">لو الإجابة "هبيع"، فالأداة أكبر من تحمّلك.</div></div>
<div class="card"><div class="t">3. هدفي نمو ولا دخل ولا حماية؟</div><div class="d">كل هدف ليه أدوات مختلفة تماماً.</div></div>
<div class="card"><div class="t">4. قد إيه أقدر أتابع؟</div><div class="d">وقتك بيحدد أسهم فردية ولا صناديق.</div></div>
</div>
<div class="callout tip"><b>الخلاصة:</b> مفيش أداة "أحسن" — فيه أداة <b>مناسبة لمدتك وهدفك وتحمّلك</b>. والمستثمر الناجح مش اللي بيختار أعلى عائد، هو اللي بيطابق الأداة مع ظروفه فمايضطرش يخرج في وقت غلط.</div>
</div>`,

<div class="sheet">
<p class="lead">الدليل كله بيقولك تستثمر في إيه. القسم ده بيقولك <strong>تبعد عن إيه</strong> — وده أحياناً بيحميك أكتر من أي نصيحة إيجابية، لإن المبتدئ بيتعرّض للأدوات دي بتسويق مكثّف.</p>
<h3>1) العقود مقابل الفروقات (CFDs) والفوركس بالرافعة</h3>
<p>منصات بتعرض عليك المضاربة على العملات والسلع والمؤشرات <strong>برافعة عالية جداً</strong>. الأرقام المعلنة عالمياً بتقول إن الغالبية العظمى من عملاء التجزئة بيخسروا فلوسهم في المنتجات دي.</p>
<ul>
<li><strong>رافعة مرتفعة</strong> معناها إن حركة صغيرة ضدك بتصفّي حسابك.</li>
<li>كتير من المنصات دي <strong>غير مرخّصة محلياً</strong> — لو ضاعت فلوسك، مفيش جهة تلجأ ليها.</li>
<li>نموذج ربح بعض الوسطاء بيكون <strong>من خسارة العميل</strong> نفسه.</li>
</ul>
<div class="callout warn"><b>علامة إنذار:</b> أي منصة بتعرض "تدريب مجاني" + "مدير حساب شخصي" + "بونص على الإيداع" + ضغط للإيداع بسرعة — ده نمط معروف وخطر.</div>
<h3>2) الخيارات والعقود الآجلة (المشتقات)</h3>
<p>أدوات مالية معقّدة بتشتق قيمتها من أصل آخر. ليها استخدامات مشروعة (تحوّط مؤسسي)، لكن <strong>للمبتدئ هي مضاربة عالية المخاطر</strong> بتحتاج فهم رياضي ومتابعة دقيقة. أضف لده تعقيدها الشرعي.</p>
<h3>3) العملات المشفّرة (الكريبتو)</h3>
<p>موضوع واسع وخارج نطاق الدليل ده، لكن للإنصاف والتحذير:</p>
<ul>
<li><strong>تقلب عنيف جداً</strong> — هبوط 50%+ حصل أكتر من مرة تاريخياً.</li>
<li><strong>الوضع التنظيمي في مصر:</strong> البنك المركزي حذّر مراراً من التعامل فيها، والتعامل غير مرخّص. اعرف وضعها القانوني قبل أي خطوة.</li>
<li><strong>مخاطر تقنية</strong> — فقدان المفاتيح، اختراق المنصات، ومشاريع بتختفي.</li>
<li><strong>جدل شرعي واسع</strong> حولها.</li>
</ul>
<div class="callout note">لو قررت تدخل فيها رغم ده، القاعدة الوحيدة المعقولة: <b>مبلغ صغير جداً تقدر تخسره بالكامل من غير ما يأثر عليك</b> — ومتعتبرهاش استثماراً أساسياً.</div>
<h3>4) المخططات الهرمية والاستثمار الوهمي</h3>
<p>دي مش أدوات استثمار أصلاً — دي احتيال. علاماتها ثابتة عبر الزمن:</p>
<div class="cards">
<div class="card"><div class="t">🚩 عائد مضمون مرتفع</div><div class="d">"20% شهرياً مضمونة" — مستحيل اقتصادياً.</div></div>
<div class="card"><div class="t">🚩 الربح من ضم أعضاء</div><div class="d">عائدك مرتبط بتجنيد ناس مش بنشاط حقيقي.</div></div>
<div class="card"><div class="t">🚩 غموض النشاط</div><div class="d">مش قادرين يشرحوا منين بييجي العائد.</div></div>
<div class="card"><div class="t">🚩 ضغط وسرية</div><div class="d">"الفرصة هتفوت" + "متقولش لحد".</div></div>
<div class="card"><div class="t">🚩 صعوبة السحب</div><div class="d">الإيداع سهل والسحب فيه تعقيدات مفاجئة.</div></div>
<div class="card"><div class="t">🚩 بلا ترخيص</div><div class="d">مش مسجّلة لدى أي جهة رقابية.</div></div>
</div>
<h3>5) الشراء بالتقسيط أو القرض للاستثمار</h3>
<p>الاقتراض عشان تستثمر بيحوّل الخسارة المؤقتة لأزمة حقيقية، لإن <strong>الدين ثابت والعائد متغيّر</strong>. لو السوق نزل، بتفضل مدين بنفس المبلغ بينما أصولك قلّت.</p>
<h3>6) "توصيات مدفوعة" وإدارة محافظ غير مرخّصة</h3>
<p>أي شخص بيدير فلوسك لازم يكون <strong>مرخّص من الجهة الرقابية وبعقد واضح</strong>. تسليم فلوسك لشخص بصفته الشخصية — مهما كانت ثقتك فيه — مخاطرة قانونية كاملة من غير أي حماية.</p>
<div class="callout warn"><b>القاعدة الجامعة:</b> لو مش قادر تشرح <b>منين بييجي العائد بالظبط</b>، ومين الجهة المرخّصة اللي وراه، وإيه المخاطرة اللي بتقابله — ابعد. غياب إجابة واضحة لأي سؤال من دول كافي لوحده.</div>
<div class="callout tip"><b>تحقّق دايماً:</b> اسأل عن الترخيص، وراجع الجهة الرقابية بنفسك، واطلب كل حاجة مكتوبة، ومتحوّلش فلوس لأي شخص بصفته الشخصية أبداً.</div>

<h3>ليه التوقيت غالباً في صالح البائع؟</h3>
<p>الشركة هي اللي بتختار <strong>إمتى</strong> تطرح أسهمها، وطبيعي إنها تختار وقت السوق متحمّس والقطاع "ساخن" عشان تحصل على أعلى تقييم ممكن. يعني إنت بتشتري في اللحظة اللي البائع شايفها الأنسب ليه — مش بالضرورة ليك.</p>
<h3>نشرة الاكتتاب (Prospectus)</h3>
<p>ده المستند الرسمي الوحيد، وقراءته مش رفاهية. ركّز على:</p>
<ul>
<li><strong>الأرباح التاريخية</strong> على عدة سنين — مش سنة واحدة مختارة.</li>
<li><strong>حجم الديون</strong> وهيكل التمويل.</li>
<li><strong>قسم المخاطر</strong> — الشركة ملزمة تعلنها، وكتير مبيقراهوش.</li>
<li><strong>استخدام حصيلة الطرح</strong> — رايحة توسع ولا سداد ديون؟</li>
<li><strong>نسبة الملّاك الباقية</strong> — لو الملّاك بيبيعوا كل حصتهم، دي إشارة سلبية.</li>
</ul>

<div class="card"><div class="t">مفيش تاريخ تداول</div><div class="d">مفيش سجل أداء في السوق تحكم بيه.</div></div>

<div class="card"><div class="t">تقلب حاد بعد الإدراج</div><div class="d">الأيام الأولى غالباً عنيفة في الاتجاهين.</div></div>
</div>

{ menu:"سيكولوجية الاستثمار", eyebrow:"العقل", title:"سيكولوجية الاستثمار", body:`
<div class="sheet">
<p class="lead">أغلب الخسائر مش بسبب ضعف التحليل، لكن بسبب العواطف. <strong>مستثمر عادي منضبط بيتفوّق على محلل ذكي متسرّع</strong> — لإن المعرفة بتتحوّل لنتيجة بس لما السلوك يسمح.</p>
<h3>الدورة النفسية للسوق</h3>
<p>النمط ده بيتكرر مع كل دورة، وأغلب الناس بتعيشه من غير ما تلاحظه:</p>
<ol>
<li><strong>تفاؤل</strong> → السوق بيصعد والأخبار كويسة.</li>
<li><strong>حماس</strong> → مكاسب سريعة، الكل بيتكلم عن السوق.</li>
<li><strong>نشوة</strong> → <span class="pill p-hi">أعلى مخاطرة</span> وأنت حاسس بأعلى أمان — وهنا معظم الناس بتشتري.</li>
<li><strong>قلق ← إنكار ← خوف</strong> → الهبوط بيبدأ والتبريرات بتظهر.</li>
<li><strong>ذعر واستسلام</strong> → <span class="pill p-lo">أقل مخاطرة</span> وأنت حاسس بأعلى خطر — وهنا معظم الناس بتبيع.</li>
</ol>
<div class="callout note"><b>الخلاصة القاسية:</b> مشاعرك بتتحرك <b>عكس</b> المخاطرة الحقيقية. وقت ما تحس إن السوق آمن جداً، هو غالباً أغلى ما يكون؛ ووقت ما تحس إنه خطر جداً، هو غالباً أرخص ما يكون.</div>
<h3>الفخاخ النفسية الأساسية</h3>
<div class="cards">
<div class="card"><div class="t">النفور من الخسارة</div><div class="d">ألم الخسارة أقوى من متعة المكسب المكافئ، فبتتمسك بالخاسر وتبيع الرابح بسرعة.</div></div>
<div class="card"><div class="t">التحيّز التأكيدي</div><div class="d">بتسمع الأخبار اللي بتأكد رأيك وتتجاهل اللي بيعارضه.</div></div>
<div class="card"><div class="t">التثبيت (Anchoring)</div><div class="d">بتتمسك بسعر شرائك كمرجع، رغم إن السوق مش عارفه ولا يهمه.</div></div>
<div class="card"><div class="t">التكلفة الغارقة</div><div class="d">بتكمّل في استثمار خاسر لمجرد إنك دفعت فيه كتير.</div></div>
<div class="card"><div class="t">القطيع و FOMO</div><div class="d">بتشتري لإن الكل بيشتري، فبتدخل عند القمة.</div></div>
<div class="card"><div class="t">الثقة الزائدة</div><div class="d">بعد أرباح متتالية بتكبّر المخاطرة وتقلل البحث.</div></div>
</div>
<h3>العلاج: نظام مش إرادة</h3>
<p>الحل مش إنك "تتحكم في مشاعرك" — دي طبيعة بشرية مش هتلغيها. الحل إنك <strong>تصمّم نظام يقلل عدد القرارات اللي بتاخدها وإنت متوتر</strong>:</p>
<ol>
<li><strong>خطة مكتوبة قبل الشراء:</strong> ليه بشتري، هدفي كام، حد خسارتي كام.</li>
<li><strong>قواعد آلية:</strong> مساهمة شهرية ثابتة + إعادة توازن سنوية.</li>
<li><strong>قلّل المتابعة عمداً:</strong> يوم مراجعة محدد بدل متابعة لحظية.</li>
<li><strong>دفتر قرارات:</strong> اكتب سبب كل قرار وراجعه بعد شهور — بيفرّق بين القرار الصح والحظ.</li>
<li><strong>ابحث عن الرأي المعارض:</strong> قبل أي صفقة، دوّر عمداً على أسباب إنك تكون غلطان.</li>
</ol>
<div class="callout warn"><b>مؤشر عملي:</b> لو محفظتك بتأثر على نومك أو بتراجعها كذا مرة يومياً، فالمشكلة مش في السوق — نسبة المخاطرة عندك أعلى من اللي تتحمّله فعلياً. قلّلها، حتى لو الأرقام على الورق تقول إنك تقدر.</div>
</div>`, bank:[

{ menu:"الرافعة المالية", eyebrow:"تحذير", title:"الرافعة المالية والهامش (Margin)", body:`
<div class="sheet">
<div class="callout warn"><b>للمبتدئ: ابعد عنها تماماً.</b> الرافعة المالية بتفلّس المتداولين عديمي الخبرة بسرعة، والقسم ده موجود عشان <strong>تفهم خطرها</strong> مش عشان تستخدمها.</div>
<h3>إيه هي الرافعة؟</h3>
<p>إنك تقترض فلوس من شركة السمسرة عشان تشتري أسهم بأكتر من رأس مالك الفعلي. لو معاك 100,000 ج.م واشتريت بـ200,000، إنت مستخدم رافعة 2:1.</p>
<h3>ليه بتضخّم الخسائر؟</h3>
<p>لإن الخسارة بتتحسب على حجم المركز الكامل، بينما رأس مالك أصغر منه.</p>
<table class="tbl">
<thead><tr><th>الحالة</th><th>بدون رافعة</th><th>برافعة 2:1</th></tr></thead>
<tbody>
<tr><td>رأس مالك</td><td>100,000</td><td>100,000</td></tr>
<tr><td>حجم المركز</td><td>100,000</td><td>200,000</td></tr>
<tr><td>السوق نزل 20%</td><td>خسارة 20,000 (20%)</td><td>خسارة 40,000 (<b>40%</b>)</td></tr>
<tr><td>السوق نزل 50%</td><td>خسارة 50%</td><td><b>رأس مالك اتصفّر</b></td></tr>
</tbody>
</table>
<h3>نداء التغطية (Margin Call)</h3>
<p>لما خسارتك توصل لحد معيّن، السمسار بيطلب منك <strong>تضخ فلوس إضافية فوراً أو يبيع مراكزك</strong>. والمشكلة إن ده بيحصل عادةً في أسوأ لحظة — وقت الهبوط الحاد — فبتتجبر تبيع في القاع وتثبّت الخسارة بدل ما تستنى التعافي.</p>
<h3>التكاليف الخفية</h3>
<ul>
<li><strong>فوائد على المبلغ المقترض</strong> بتتراكم يومياً وبتقلل عائدك حتى لو ربحت.</li>
<li><strong>ضغط نفسي كبير</strong> بيدفعك لقرارات متسرعة.</li>
<li><strong>احتمال خسارة أكتر من رأس مالك</strong> — يعني تخرج مديون.</li>
</ul>
<h3>الفرق الجوهري</h3>
<p>في الاستثمار العادي، أسوأ سيناريو إنك تخسر اللي دفعته. مع الرافعة، <strong>أسوأ سيناريو إنك تخسر أكتر مما تملك</strong> — ودي نقلة نوعية في نوع المخاطرة مش زيادة في درجتها.</p>
<div class="callout tip"><b>البديل الآمن لزيادة عائدك:</b> زوّد مساهماتك المنتظمة، وطوّل أفقك الزمني، وقلّل تكاليفك. التلاتة دول بيزوّدوا ثروتك من غير ما يعرّضوك لخطر الإفلاس.</div>
</div>`, bank:[
["إيه هو التداول بالهامش؟","اقتراض فلوس من شركة السمسرة عشان تشتري أسهم بأكتر من رأس مالك."],
["إزاي الرافعة بتضخّم النتائج؟","بتزوّد حجم مركزك، فأي حركة في السعر بتأثر بنسبة أكبر على رأس مالك."],

{ menu:"مصادر وأدوات", eyebrow:"التعلّم", title:"مصادر وأدوات للتعلّم", body:`
<div class="sheet">
<p class="lead">جودة قرارك بتعتمد على جودة مصادرك. القاعدة الأساسية: <strong>البيانات الرسمية أولاً، والتحليلات كمدخل للبحث مش كأمر تنفيذ</strong>.</p>
<h3>1) المصادر الرسمية (الأولوية القصوى)</h3>
<div class="cards">
<div class="card"><div class="t">البورصة المصرية (EGX)</div><div class="d">الأسعار والمؤشرات وبيانات الشركات والإفصاحات الرسمية.</div></div>
<div class="card"><div class="t">الهيئة العامة للرقابة المالية</div><div class="d">القرارات والتنظيمات والتحقق من تراخيص الشركات.</div></div>
<div class="card"><div class="t">إفصاحات الشركات</div><div class="d">القوائم المالية الربع سنوية والسنوية المدقّقة.</div></div>
<div class="card"><div class="t">منصة السمسرة</div><div class="d">بيانات لحظية وتنفيذ الأوامر ومتابعة محفظتك ورسومك.</div></div>
</div>
<h3>2) إزاي تقرا قائمة مالية كمبتدئ؟</h3>
<p>مش لازم تكون محاسب. ركّز على أربع حاجات بس:</p>
<table class="tbl">
<thead><tr><th>البند</th><th>السؤال اللي بيجاوب عليه</th></tr></thead>
<tbody>
<tr><td><b>الإيرادات</b></td><td>الشركة بتكبر ولا بتنكمش؟ (قارن على 3–5 سنين)</td></tr>
<tr><td><b>صافي الربح</b></td><td>بتحوّل مبيعاتها لأرباح فعلية؟</td></tr>
<tr><td><b>الديون</b></td><td>معتمدة على الاقتراض قد إيه؟</td></tr>
<tr><td><b>التدفق النقدي التشغيلي</b></td><td>بتدخّل كاش حقيقي ولا أرباح دفترية بس؟</td></tr>
</tbody>
</table>
<div class="callout note"><b>نقطة مهمة:</b> شركة ممكن تعلن أرباح وتدفقها النقدي سالب. الأرباح تقدير محاسبي، والكاش حقيقة — وعشان كده التدفق النقدي أصعب في التجميل.</div>
<h3>3) الأسواق العالمية</h3>
<p>مواقع بيانات زي <strong>Investing.com</strong> و<strong>Yahoo Finance</strong> لمتابعة المؤشرات العالمية والأسعار والبيانات الاقتصادية.</p>
<h3>4) إزاي تقيّم أي مصدر؟</h3>
<ol>
<li><strong>اسأل عن مصلحته:</strong> هو بيكسب لو نفّذت كلامه؟ فيه عمولة؟</li>
<li><strong>دوّر على الأرقام:</strong> رأي من غير بيانات = انطباع مش تحليل.</li>
<li><strong>راجع سجله:</strong> بينشر توقعاته الغلط ولا بيمسحها؟</li>
<li><strong>قارن بالمصدر الرسمي:</strong> أي رقم مهم راجعه من إفصاح الشركة نفسه.</li>
</ol>
<div class="callout warn"><b>إنذارات خطر واضحة:</b> الوعد بأرباح مضمونة · الضغط عليك بالاستعجال ("الفرصة هتفوت") · طلب تحويل فلوس لشخص بصفته الشخصية · رفض الإفصاح عن المخاطر · جروبات بتبيع "توصيات مدفوعة".</div>
<div class="callout tip"><b>أفضل استثمار في نفسك:</b> وقت منتظم لقراءة القوائم المالية بنفسك. مهارة واحدة زي دي بتغنيك عن مئة توصية.</div>
</div>`, bank:[

{ menu:"📚 مكتبة الاستثمار", icon:"📚", eyebrow:"الكتب", title:"أشهر كتب الاستثمار والمال", body:`
<div class="sheet">
<p class="lead">مش تلخيص للكتب، لكن <strong>شرح لمواضيعها الأساسية بأسلوب سهل مع أمثلة ودروس عملية</strong> — وبنك أسئلة موسّع لكل كتاب.</p>
<div class="cards" style="margin-bottom:6px">
<div class="card"><div class="t">📚 10</div><div class="d">كتب أساسية في الاستثمار والمال</div></div>
<div class="card"><div class="t">🧩 120</div><div class="d">موضوع مشروح بمثال ودرس عملي</div></div>
<div class="card"><div class="t">❓ 400</div><div class="d">سؤال وجواب مصنّفة بأقسام</div></div>
</div>
<div class="cards">
${BOOKS.map((b,i)=>`<div class="card"><div class="t">${i+1}. ${b.t}</div><div class="d">${b.a}<br><b style="color:var(--gold)">${b.tag}</b></div></div>`).join('')}
</div>
<h3>الكتب دي بتتعارض مع بعضها — وده مقصود</h3>
<p>لينش وفيشر بيقولوك <strong>اختار أسهم بنفسك</strong> لو مستعد تبحث؛ بوجل ومالكيل بيقولوك <strong>متحاولش وخُد المؤشر</strong>. جراهام بيدوّر على الرخص، وفيشر بيدوّر على الجودة. الاختلاف ده مفيد ليك: هتشوف الحجج من الجهتين وتقرر مكانك بينهم بدل ما تاخد رأي واحد.</p>
<h3>ترتيب مقترح للقراءة</h3>
<ol>
<li><strong>لو مبتدئ تماماً:</strong> أغنى رجل في بابل ← الأب الغني والأب الفقير ← سيكولوجية المال.</li>
<li><strong>بعدين للأساس الاستثماري:</strong> مستثمر المؤشر البسيط ← المشي العشوائي ← الأسهم على المدى الطويل.</li>
<li><strong>لو قررت تختار أسهم بنفسك:</strong> المستثمر الذكي ← تفوّق على وول ستريت ← الأسهم العادية والأرباح غير العادية.</li>
<li><strong>وأخيراً للتركيب:</strong> الأصول الأربعة للاستثمار.</li>
</ol>
<div class="callout note">افتح كل كتاب من القائمة الجانبية. كل كتاب فيه سياقه، 12 موضوع بالتفصيل، أهم الدروس، نقد صريح لحدوده، و40 سؤال قابلين للفتح والإخفاء.</div>
<div class="callout warn"><b>مهم:</b> الشروح دي مقدّمات بأسلوبنا للأفكار الرئيسية ومش بديل عن الكتب نفسها. حقوق الكتب محفوظة لأصحابها.</div>
</div>`},

{ menu:"أسئلة شائعة", icon:"❓", eyebrow:"FAQ", title:"أسئلة شائعة", body:`
<div class="sheet">
<p class="lead">الأسئلة اللي بيسألها كل مبتدئ فعلاً — بإجابات صريحة من غير مجاملة.</p>
<h3>الفلوس والبداية</h3>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أبدأ بكام فلوس؟</h4>
<p>مفيش رقم سحري. القاعدة إنك تبدأ بمبلغ <strong>تقدر تخسره كله من غير ما حياتك تتأثر</strong>. كتير بيبدأوا بمبلغ صغير جداً في أول شهور عشان يتعلّموا بفلوس حقيقية بس بمخاطرة محدودة، وبعدين يكبّروا تدريجياً. الحد الأدنى الفعلي بيحدده كمان السمسار أو الصندوق.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أستنى قد إيه عشان أشوف نتيجة؟</h4>
<p>الأسهم أداة <strong>طويلة المدى</strong> — الكلام عن سنين مش شهور. لو محتاج الفلوس خلال سنة أو سنتين، الأسهم مش المكان المناسب؛ الأدوات الأقل تقلباً أنسب للمدى القصير.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أستثمر مبلغ كبير مرة واحدة ولا على دفعات؟</h4>
<p>لو معاك مبلغ كبير وقلقان من التوقيت، <strong>الدخول التدريجي على عدة شهور</strong> بيقلل خطر إنك تدخل كله قبل هبوط. مش هيدّيك أفضل نتيجة نظرياً في كل الحالات، لكنه بيحميك من أسوأ سيناريو نفسياً.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">لازم أسدد ديوني الأول؟</h4>
<p>الديون الاستهلاكية عالية الفايدة: <strong>أيوه، سدّدها الأول</strong>. تجنّب فايدة مؤكدة مكسب مضمون، بينما عائد الاستثمار غير مضمون.</p>
<h3>وقت الأزمات</h3>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">السوق نزل ومحفظتي في الأحمر — أعمل إيه؟</h4>
<p>الأول: <strong>متتصرفش من الذعر</strong>. اسأل نفسك: هل الشركة نفسها اتغيّرت للأسوأ، ولا السوق كله نازل؟ لو أسبابك الأصلية للشراء لسه قائمة، الهبوط المؤقت جزء طبيعي. ولو اتضح إن تحليلك كان غلط، الخروج بخسارة محدودة أحسن من التمسّك بالأمل.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أشتري وقت الهبوط؟</h4>
<p>لو عندك سيولة فائضة وأساسيات الشركة سليمة، الهبوط العام بيوفّر أسعار أفضل. <strong>لكن متحاولش تصطاد القاع</strong> — محدش بيعرفه إلا بعد ما يعدّي. الشراء التدريجي أأمن من دفعة واحدة.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">إمتى أبيع بخسارة؟</h4>
<p>لما <strong>أساسيات الشركة تتدهور فعلاً</strong> أو يتضح إن تحليلك كان مبني على معلومة غلط — مش لمجرد إن السعر نزل. وده بالظبط سبب إنك تحط حد خسارة قبل الشراء وإنت هادي.</p>
<h3>الاختيار والتوزيع</h3>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أوزّع فلوسي على كام سهم؟</h4>
<p>سهم واحد خطر جداً، و30 سهم صعب تتابعهم كمبتدئ. الأهم من العدد إنهم <strong>مش كلهم في نفس القطاع</strong> — 5 أسهم بنوك بس ده تنويع وهمي. لو مش عايز تتابع كتير، صندوق مؤشرات بيديك تنويع جاهز.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أعرف منين إن السهم "رخيص"؟</h4>
<p>سعر السهم لوحده مش معناه رخيص. سهم بـ5 جنيه ممكن يكون أغلى من سهم بـ500 جنيه لو قارنت بأرباح الشركة. <strong>قارن بمؤشرات زي P/E مع شركات نفس القطاع</strong>، مش بالسعر المطلق.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">الأفضل أسهم فردية ولا صناديق؟</h4>
<p>لو مش هتقدر تخصص وقت منتظم للتحليل، <strong>الصناديق أنسب</strong>. الأسهم الفردية بتديك تحكّم وعائد محتمل أعلى بس بتطلب مجهود. كتير بيعملوا خليط: صناديق كأساس + نسبة صغيرة أسهم فردية.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أستثمر في السوق المصري ولا العالمي؟</h4>
<p>التنويع الجغرافي بيقلل اعتمادك على سوق واحد ممكن يركد سنين. لكن الاستثمار الخارجي ليه اعتبارات إضافية — <strong>تكاليف تحويل، مخاطر عملة، وقواعد تنظيمية</strong>. لو مبتدئ، ابدأ من سوقك المحلي اللي بتفهمه وأدواته متاحة ليك.</p>
<h3>التنفيذ والمتابعة</h3>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أشتري وأبيع كل ما السعر يتحرك؟</h4>
<p>لأ. كل صفقة عليها <strong>عمولة ورسوم وضريبة دمغة</strong>، وكترة الصفقات بتاكل مكسبك حتى لو قراراتك صح. كمان التداول المتكرر بيزوّد فرص القرارات العاطفية.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">كل قد إيه أتابع محفظتي؟</h4>
<p>مراجعة أسبوعية أو شهرية كفاية للمستثمر طويل المدى. <strong>المتابعة اليومية بتزوّد التوتر والرغبة في التدخل</strong> من غير ما تحسّن قراراتك.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">هل التوصيات على السوشيال ميديا أعتمد عليها؟</h4>
<p>خد أي توصية <strong>كمدخل للبحث، مش كأمر تنفيذ</strong>. وفي حالة واحدة القرار سهل: أي حد بيوعد بـ"أرباح مضمونة" أو بيضغط عليك تشتري بسرعة — ابعد عنه فوراً.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">التوزيعات النقدية أحسن ولا نمو السهم؟</h4>
<p>حسب هدفك. <strong>التوزيعات</strong> بتديك دخل دوري ملموس، و<strong>النمو</strong> بيراكم ثروتك من غير ضرايب أو رسوم على التوزيع. لو مش محتاج دخل دلوقتي، النمو غالباً أكفأ.</p>
<h3>مواقف صعبة</h3>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">أعمل إيه لو محتاج فلوسي فجأة؟</h4>
<p>ده بالظبط سبب إنك <strong>متستثمرش فلوس محتاجها</strong>. خلّي عندك <strong>صندوق طوارئ</strong> منفصل قبل ما تستثمر أصلاً، عشان متضطرش تبيع في وقت السعر نازل.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">الخسارة معناها إني فشلت؟</h4>
<p>لأ. الخسارة جزء طبيعي حتى للمحترفين. المقياس مش صفقة واحدة، المقياس <strong>أداء محفظتك على المدى الطويل والتزامك بخطتك</strong>. المهم إن الخسائر تكون محدودة ومحسوبة.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">حققت مكسب كويس — أبيع؟</h4>
<p>ارجع لسبب شرائك. لو الأسباب لسه قائمة والشركة لسه بتنمو، البيع لمجرد المكسب بيقطع النمو المركّب. لو تحقق هدفك اللي كتبته من البداية، نفّذ خطتك.</p>
<h4 style="font-family:'El Messiri';color:var(--sheet-head);margin:14px 0 6px">صاحبي كسب أكتر مني — أنا غلطان؟</h4>
<p>غالباً لأ. إنت مش شايف صفقاته الخسرانة، ومخاطرته ممكن تكون أعلى بكتير من اللي تناسبك. <strong>المقارنة بالآخرين من أسرع الطرق لاتخاذ قرارات مش مناسبة لظروفك.</strong></p>
<div class="callout warn"><b>افتكر:</b> كل اللي فوق محتوى تعليمي عام ومش نصيحة استثمارية مخصصة لظروفك. لو المبالغ كبيرة، استشير مستشار مالي مرخّص.</div>
</div>`},
