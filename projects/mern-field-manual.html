value } = await reader.read();", "  if (done) break;", "  setAnswer(prev => prev + parseSSE(decoder.decode(value)));", "}"]}, {"t": "li", "text": "RAG pipeline: chunk documents → embed → store in Atlas Vector Search → retrieve top-k on each question → include as context in the prompt."}, {"t": "li", "text": "Guardrails: rate-limit AI endpoints, cap max tokens, log prompts/responses, and validate model output before acting on it (treat it as untrusted input)."}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection", "body": ["This is a differentiator: a chat assistant over NetSuite data. Sync NS records to MongoDB via the REST integration you built in Month 12, embed item/customer descriptions, and answer natural-language questions with RAG — a demo few NS consultants can build."]}, {"t": "subhead", "text": "H7 — Tooling in 2026"}, {"t": "li", "text": "Vite is the default React build tool (create-react-app is dead); Vitest is its Jest-compatible test runner."}, {"t": "li", "text": "pnpm for package management — content-addressed store, strict node_modules, first-class workspaces for monorepos (often with Turborepo for task caching)."}, {"t": "li", "text": "ESLint 9 flat config (eslint.config.js) replaced .eslintrc; Biome offers an all-in-one fast linter+formatter alternative."}, {"t": "li", "text": "TypeScript is assumed by default in job postings — plain-JS-only MERN roles are now rare."}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter H", "body": ["E1: Migrate one of your Express 4 projects to Express 5 — remove every try/catch(next) wrapper and fix route patterns.", "E2: Rebuild a form from your capstone with useActionState + useOptimistic, deleting the manual loading/error state.", "E3: Add a \"search my docs\" AI feature to a project: embed 50 documents into Atlas Vector Search and stream answers over SSE.", "E4: Convert a CRA project to Vite and its Jest tests to Vitest; measure cold-start and HMR before/after."]}]}, {"id": "pgI", "title": "Senior Deep Dive — Node Internals, Streams & Production Patterns", "sub": "Chapter I · New", "blocks": [{"t": "callout", "kind": "info", "title": "Why this chapter exists", "body": ["Senior Node interviews go past \"what is the event loop\" into phases, backpressure, memory, and how you keep a process alive in production. This chapter covers the depth the roadmap weeks only touch."]}, {"t": "subhead", "text": "I1 — The event loop, precisely"}, {"t": "p", "text": "Node's event loop runs in phases, each with its own queue: timers (setTimeout/setInterval callbacks), pending callbacks, poll (I/O — where the loop usually waits), check (setImmediate), and close callbacks. Between every callback, Node fully drains two microtask queues: first the process.nextTick queue, then the Promise microtask queue. Microtasks therefore always run before the loop advances — which is also why a recursive nextTick can starve I/O."}, {"t": "code", "lang": "js", "lines": ["setTimeout(() => console.log(\"timeout\"), 0);", "setImmediate(() => console.log(\"immediate\"));", "Promise.resolve().then(() => console.log(\"promise\"));", "process.nextTick(() => console.log(\"nextTick\"));", "console.log(\"sync\");", "// sync → nextTick → promise → timeout|immediate (order of the last two", "// is nondeterministic at top level, but inside an I/O callback", "// setImmediate ALWAYS beats setTimeout — poll phase runs before check)"]}, {"t": "li", "text": "Blocking the loop: any sync work (JSON.parse on huge payloads, crypto.pbkdf2Sync, big loops) freezes every request. Detect with --trace-event-categories or clinic.js; fix by chunking, streaming, or moving to a worker."}, {"t": "li", "text": "The libuv threadpool (default 4 threads, UV_THREADPOOL_SIZE) handles fs, dns.lookup, and crypto — \"async\" fs calls can still queue behind each other under load."}, {"t": "subhead", "text": "I2 — Streams & backpressure"}, {"t": "p", "text": "Streams process data in chunks with bounded memory: a 10 GB file flows through a 64 KB buffer. Four kinds: Readable, Writable, Duplex, Transform. Backpressure is the contract between them — when a writable's internal buffer exceeds highWaterMark, write() returns false and a well-behaved producer pauses until the drain event."}, {"t": "code", "lang": "js", "lines": ["import { pipeline } from \"node:stream/promises\";", "import { createReadStream, createWriteStream } from \"node:fs\";", "import { createGzip } from \"node:zlib\";", "", "// pipeline handles backpressure, error propagation, and cleanup", "await pipeline(", "  createReadStream(\"access.log\"),", "  createGzip(),", "  createWriteStream(\"access.log.gz\")", ");", "", "// Streams are async iterables — clean line-by-line processing:", "for await (const chunk of createReadStream(\"big.csv\")) {", "  process(chunk);           // consumer speed throttles the reader", "}", "", "// HTTP responses are writable streams — stream, don't buffer:", "app.get(\"/export\", (req, res) => {", "  res.setHeader(\"Content-Type\", \"text/csv\");", "  Order.find().cursor()                       // Mongoose cursor stream", "    .pipe(csvTransform)", "    .pipe(res);", "});"]}, {"t": "callout", "kind": "warn", "title": "The classic senior mistake", "body": ["Never use readFile / res.json for large exports — it loads everything into heap and one big request can OOM the process. If the payload can grow with data volume, it must stream. Interviewers probe exactly this."]}, {"t": "subhead", "text": "I3 — Scaling one machine: cluster vs worker_threads"}, {"t": "table", "rows": [["Tool", "Use when", "Memory model"], ["cluster / PM2 -i max", "scale I/O-bound HTTP across CPU cores", "separate processes, shared server port"], ["worker_threads", "CPU-bound work: hashing, image resize, parsing", "threads, can share memory via SharedArrayBuffer"], ["queue + separate service", "work that outlives requests or needs retries", "independent processes (BullMQ + Redis)"], ["horizontal pods/instances", "real production scale", "stateless copies behind a load balancer"]]}, {"t": "code", "lang": "js", "lines": ["// Offload CPU work so the event loop stays responsive", "import { Worker } from \"node:worker_threads\";", "const runInWorker = (file, data) => new Promise((res, rej) => {", "  const w = new Worker(file, { workerData: data });", "  w.once(\"message\", res); w.once(\"error\", rej);", "});", "app.post(\"/report\", async (req, res) => {", "  const pdf = await runInWorker(\"./workers/render-pdf.js\", req.body);", "  res.type(\"application/pdf\").send(pdf);", "});"]}, {"t": "li", "text": "Rule stated in interviews: Node scales I/O on one thread beautifully; the moment work is CPU-bound, move it off the loop — worker for latency-sensitive, queue for everything else."}, {"t": "li", "text": "Clustering means no in-process state: sessions, caches, and socket rooms must live in Redis or the design breaks at 2+ instances."}, {"t": "subhead", "text": "I4 — Memory & garbage collection"}, {"t": "li", "text": "V8 heap: short-lived objects die cheaply in the young generation (scavenge); survivors promote to the old generation (mark-sweep-compact, more expensive). Allocation churn shows up as GC pauses."}, {"t": "li", "text": "The usual leak suspects: unbounded module-level Maps used as caches, event listeners added per request and never removed, closures capturing large objects, forgotten setInterval timers."}, {"t": "li", "text": "Diagnosis: node --inspect + Chrome DevTools heap snapshots (compare two snapshots under load — growing retained size is the leak), or process.memoryUsage() trends in metrics."}, {"t": "li", "text": "Fixes: bounded LRU caches (lru-cache) instead of Maps, WeakMap for metadata keyed by objects, once() instead of on() where appropriate, AbortController to cancel abandoned work."}, {"t": "subhead", "text": "I5 — Error handling & graceful shutdown"}, {"t": "code", "lang": "js", "lines": ["// Policy: crash on unknown state, recover from expected errors", "// Node 15+ already crashes on unhandled rejections (--unhandled-rejections=throw", "// is the default); a handler is only for logging before the crash:", "process.on(\"unhandledRejection\", err => { logger.error(err); throw err; });", "process.on(\"uncaughtException\", err => {", "  logger.fatal(err);        // log, then exit — state is untrusted now", "  process.exit(1);          // the orchestrator restarts the pod", "});", "", "// Graceful shutdown: finish in-flight requests, then die", "const server = app.listen(PORT);", "process.on(\"SIGTERM\", async () => {", "  server.close(async () => {              // stop accepting, drain in-flight", "    // (Node 19+ also closes idle keep-alive sockets; on older Node call", "    //  server.closeIdleConnections() or close() can hang on keep-alive)", "    await mongoose.connection.close();", "    process.exit(0);", "  });", "  setTimeout(() => process.exit(1), 10_000).unref(); // hard deadline", "});"]}, {"t": "li", "text": "Distinguish operational errors (bad input, timeout, 404 — handle and respond) from programmer errors (undefined is not a function — crash and restart). Trying to \"recover\" from programmer errors leaves corrupted state."}, {"t": "li", "text": "Expose /healthz (process up) and /readyz (dependencies reachable) — orchestrators route traffic on readiness, restart on liveness."}, {"t": "subhead", "text": "I6 — Observability"}, {"t": "li", "text": "Structured logging: pino with one JSON line per event; attach a request id (middleware generating X-Request-Id) so one request is traceable across services."}, {"t": "li", "text": "Metrics: RED for services — Rate, Errors, Duration (p50/p95/p99, not averages). prom-client + Grafana is the standard free stack."}, {"t": "li", "text": "Tracing: OpenTelemetry auto-instruments Express, Mongoose and fetch — a waterfall per request showing exactly where the 800 ms went."}, {"t": "li", "text": "Interview one-liner: \"Logs tell you what happened, metrics tell you how often, traces tell you where the time went.\""}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter I", "body": ["E1: Write a script proving setImmediate beats setTimeout inside an fs.readFile callback but not at top level; explain both orderings in comments.", "E2: Build a CSV export endpoint twice — buffered vs streamed — and compare heap usage with process.memoryUsage() while exporting 1M rows.", "E3: Leak memory on purpose (module-level array pushed per request), find it with two heap snapshots, then fix it with an LRU cache.", "E4: Add graceful shutdown + /healthz + /readyz + pino request logging to your capstone API."]}]}, {"id": "pgJ", "title": "Free Cloud Databases — Atlas, Firebase & Supabase Setup", "sub": "Chapter J · New", "blocks": [{"t": "callout", "kind": "info", "title": "What this chapter covers", "body": ["Every project in this guide needs a database that costs nothing while you learn. This chapter sets up the three that matter — MongoDB Atlas (your MERN default), Firebase (Firestore + Auth), and Supabase (hosted Postgres) — and shows when to pick which. Console UIs change over time; the flow below stays the same even if button labels move."]}, {"t": "subhead", "text": "J1 — The free-tier landscape"}, {"t": "table", "rows": [["Service", "Database", "Free tier", "Best for"], ["MongoDB Atlas", "MongoDB (document)", "M0: 512 MB, shared cluster, never expires", "everything MERN in this guide"], ["Firebase Firestore", "document + realtime sync", "1 GB storage, 50k reads/20k writes per day", "realtime apps, mobile, instant auth"], ["Supabase", "PostgreSQL + auth + storage", "500 MB DB, 2 projects (pause when idle)", "relational data, SQL practice"], ["Neon", "serverless PostgreSQL", "0.5 GB, autosuspend", "Postgres with branching, edge-friendly"], ["Upstash", "Redis (serverless)", "256 MB, pay-per-request free band", "caching, rate limits, queues, sessions"], ["Render/Railway PG", "PostgreSQL", "small free/trial instances", "quick demos beside your deploy"]]}, {"t": "li", "text": "Rule of thumb: Atlas for the MERN portfolio, Firebase when you need realtime sync or drop-in auth, Supabase/Neon when the data is genuinely relational, Upstash Redis alongside any of them."}, {"t": "subhead", "text": "J2 — MongoDB Atlas free cluster (M0), step by step"}, {"t": "li", "text": "1. Create an account at mongodb.com/cloud/atlas → create a project → Build a Database → choose the FREE M0 tier and a region near you."}, {"t": "li", "text": "2. Database Access: add a database user with a strong password (this is NOT your Atlas login)."}, {"t": "li", "text": "3. Network Access: add your current IP. For deployed apps on platforms with dynamic IPs (Render, Vercel functions), allow 0.0.0.0/0 and rely on the user password + TLS — or use the platform's static-IP feature when available."}, {"t": "li", "text": "4. Connect → Drivers → copy the connection string; put it in .env, never in code."}, {"t": "code", "lang": "shell", "lines": ["// .env", "MONGODB_URI=mongodb+srv://appuser:<password>@cluster0.abc12.mongodb.net/myapp?retryWrites=true&w=majority", "", "// db.js", "import mongoose from \"mongoose\";", "export async function connectDB() {", "  try {", "    await mongoose.connect(process.env.MONGODB_URI);", "    console.log(\"Atlas connected:\", mongoose.connection.name);", "  } catch (err) {", "    console.error(\"DB connection failed\", err);", "    process.exit(1);            // fail fast — no app without a DB", "  }", "}"]}, {"t": "callout", "kind": "warn", "title": "Free-tier gotchas", "body": ["M0 clusters pause long-idle connections — enable retryWrites (default in the SRV string) and let Mongoose's auto-reconnect work. 512 MB fills faster than you think with logs; add TTL indexes on anything disposable."]}, {"t": "subhead", "text": "J3 — Firebase: project setup & Firestore from React"}, {"t": "li", "text": "1. console.firebase.google.com → Add project (Analytics optional) → in Build → Firestore Database, create a database in production mode."}, {"t": "li", "text": "2. Project settings → Your apps → Web (<\/>) → register the app → copy the firebaseConfig object."}, {"t": "li", "text": "3. npm install firebase. The config values are public identifiers, not secrets — security comes from rules (J4), not from hiding the config."}, {"t": "code", "lang": "js", "lines": ["// firebase.js", "import { initializeApp } from \"firebase/app\";", "import { getFirestore } from \"firebase/firestore\";", "import { getAuth } from \"firebase/auth\";", "", "const app = initializeApp({", "  apiKey: import.meta.env.VITE_FB_API_KEY,", "  authDomain: \"myapp.firebaseapp.com\",", "  projectId: \"myapp\",", "});", "export const db = getFirestore(app);", "export const auth = getAuth(app);"]}, {"t": "code", "lang": "js", "lines": ["// CRUD + realtime from React — no Express layer needed", "import { collection, addDoc, query, where, orderBy,", "         onSnapshot, doc, updateDoc, deleteDoc,", "         serverTimestamp } from \"firebase/firestore\";", "", "await addDoc(collection(db, \"todos\"),", "  { text, uid: auth.currentUser.uid, done: false, createdAt: serverTimestamp() });", "", "// Live subscription: the UI updates on every change, any device", "useEffect(() => {", "  const q = query(collection(db, \"todos\"),", "    where(\"uid\", \"==\", user.uid), orderBy(\"createdAt\", \"desc\"));", "  const unsub = onSnapshot(q, snap =>", "    setTodos(snap.docs.map(d => ({ id: d.id, ...d.data() }))));", "  return unsub;                       // cleanup = unsubscribe", "}, [user.uid]);", "", "await updateDoc(doc(db, \"todos\", id), { done: true });", "await deleteDoc(doc(db, \"todos\", id));"]}, {"t": "li", "text": "Auth in two lines: signInWithPopup(auth, new GoogleAuthProvider()) and an onAuthStateChanged listener — the fastest login you will ever ship."}, {"t": "subhead", "text": "J4 — Firestore security rules (the part everyone skips)"}, {"t": "p", "text": "With Firebase the browser talks straight to the database, so rules ARE your backend authorization. Test-mode rules expire and open rules get scraped within days — write real ones before sharing any URL."}, {"t": "code", "lang": "rules", "lines": ["rules_version = '2';", "service cloud.firestore {", "  match /databases/{database}/documents {", "    match /todos/{todoId} {", "      allow read, update, delete:", "        if request.auth != null && resource.data.uid == request.auth.uid;", "      allow create:", "        if request.auth != null", "        && request.resource.data.uid == request.auth.uid", "        && request.resource.data.text is string", "        && request.resource.data.text.size() < 500;", "    }", "  }", "}"]}, {"t": "subhead", "text": "J5 — Firebase Admin SDK in Node/Express"}, {"t": "p", "text": "When you do want a server (webhooks, scheduled jobs, code the client must not run), the Admin SDK bypasses rules with full access — so its credentials are real secrets."}, {"t": "li", "text": "Project settings → Service accounts → Generate new private key → store the JSON outside the repo, load via env var. Never commit it; never ship it to the client."}, {"t": "code", "lang": "js", "lines": ["import { initializeApp, cert } from \"firebase-admin/app\";", "import { getAuth } from \"firebase-admin/auth\";", "import { getFirestore } from \"firebase-admin/firestore\";", "", "initializeApp({ cert: cert(JSON.parse(process.env.FB_SERVICE_ACCOUNT)) });", "", "// Express middleware: verify Firebase ID tokens like JWTs", "export async function requireUser(req, res, next) {", "  const token = req.headers.authorization?.split(\"Bearer \")[1];", "  if (!token) return res.status(401).json({ error: \"No token\" });", "  try { req.user = await getAuth().verifyIdToken(token); next(); }", "  catch { res.status(401).json({ error: \"Invalid token\" }); }", "}", "// getFirestore() here ignores security rules — server is trusted"]}, {"t": "callout", "kind": "tip", "title": "Architecture note", "body": ["Firebase can replace the E and M of MERN for small apps (React talks to Firestore directly — sometimes called the FERN stack). The hybrid is common too: Firebase Auth for login, Express + Atlas for business data, with the middleware above bridging them. Being able to explain that trade-off — velocity vs vendor lock-in, rules vs server validation, per-read pricing vs flat cluster — is a genuine interview differentiator."]}, {"t": "subhead", "text": "J6 — Supabase in ten minutes"}, {"t": "li", "text": "1. supabase.com → New project (choose region + DB password) → Table Editor: create table todos (id uuid default gen_random_uuid(), text text, uid uuid, done bool default false)."}, {"t": "li", "text": "2. Authentication is built in (email, OAuth). Enable Row Level Security on the table and add a policy: uid = auth.uid() — the Postgres equivalent of Firestore rules."}, {"t": "li", "text": "3. Project Settings → API: copy the URL and anon key (public, like Firebase config)."}, {"t": "code", "lang": "js", "lines": ["import { createClient } from \"@supabase/supabase-js\";", "const supabase = createClient(import.meta.env.VITE_SB_URL,", "                              import.meta.env.VITE_SB_ANON_KEY);", "", "const { data: todos } = await supabase", "  .from(\"todos\").select(\"*\").eq(\"done\", false).order(\"created_at\");", "", "await supabase.from(\"todos\").insert({ text, uid: user.id });", "", "// Realtime, Firestore-style", "supabase.channel(\"todos\").on(\"postgres_changes\",", "  { event: \"*\", schema: \"public\", table: \"todos\" },", "  payload => refresh()).subscribe();"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter J", "body": ["E1: Create an Atlas M0 cluster and point your Month 6 capstone at it; confirm reconnect behaviour by toggling your network.", "E2: Rebuild your todo capstone on Firestore with Google sign-in and realtime sync — no Express at all. Note what you gained and lost.", "E3: Write Firestore rules for a multi-user notes app (owner-only access, shared read via a members array) and verify them in the Rules Playground.", "E4: Add the Admin-SDK token middleware to an existing Express API so Firebase-authenticated users can call it.", "E5: Repeat the todo app on Supabase with RLS policies; compare the three data models in a short README."]}]}, {"id": "pgK", "title": "Testing — The Complete Practical Guide", "sub": "Chapter K · New", "blocks": [{"t": "callout", "kind": "info", "title": "Why a whole chapter", "body": ["Testing is the clearest line between hobby projects and employable code — and it is the thing self-taught candidates most often skip. Every capstone in this guide should ship with the tests below; \"how do you test this?\" is asked in nearly every interview."]}, {"t": "subhead", "text": "K1 — The pyramid, and what to test"}, {"t": "table", "rows": [["Layer", "Share", "Tool", "Answers"], ["Unit", "~70%", "Vitest / node:test", "does this function do its job?"], ["Integration", "~20%", "Supertest + mongodb-memory-server, RTL", "do these pieces work together?"], ["E2E", "~10%", "Playwright", "can a user actually complete the flow?"]]}, {"t": "li", "text": "Test behaviour, not implementation: assert what the user or caller observes. Tests that assert internal state break on every refactor and teach the team to distrust the suite."}, {"t": "li", "text": "Priorities when time is short: money paths, auth, and anything you have broken before. 100% coverage is a vanity metric — 70% on the paths that matter beats 95% including getters."}, {"t": "li", "text": "Structure every test AAA: Arrange, Act, Assert. One behaviour per test; the name states the behaviour (\"rejects an expired token\"), not the function name."}, {"t": "subhead", "text": "K2 — Unit tests with Vitest"}, {"t": "code", "lang": "js", "lines": ["import { describe, it, expect, vi, beforeEach } from \"vitest\";", "import { calcTotal } from \"./cart.js\";", "", "describe(\"calcTotal\", () => {", "  it(\"applies percentage discounts before tax\", () => {", "    const total = calcTotal([{ price: 100, qty: 2 }], { discount: 0.1, tax: 0.15 });", "    expect(total).toBeCloseTo(207);        // floats: never toBe", "  });", "", "  it(\"throws on a negative quantity\", () => {", "    expect(() => calcTotal([{ price: 1, qty: -1 }])).toThrow(/quantity/i);", "  });", "});", "", "// Mocking: replace the boundary, not the logic under test", "vi.mock(\"./mailer.js\", () => ({ sendEmail: vi.fn() }));", "vi.useFakeTimers();                        // control setTimeout/debounce", "vi.spyOn(console, \"error\").mockImplementation(() => {});"]}, {"t": "subhead", "text": "K3 — React component tests (RTL)"}, {"t": "code", "lang": "js", "lines": ["import { render, screen } from \"@testing-library/react\";", "import userEvent from \"@testing-library/user-event\";", "", "it(\"shows a validation error for a bad email\", async () => {", "  const user = userEvent.setup();", "  render(<SignupForm onSubmit={vi.fn()} />);", "", "  await user.type(screen.getByLabelText(/email/i), \"not-an-email\");", "  await user.click(screen.getByRole(\"button\", { name: /sign up/i }));", "", "  expect(await screen.findByRole(\"alert\")).toHaveTextContent(/valid email/i);", "});"]}, {"t": "li", "text": "Query priority: getByRole > getByLabelText > getByText > getByTestId (last resort). Querying by role is an accessibility check for free — if you cannot find it by role, neither can a screen reader."}, {"t": "li", "text": "getBy (must exist now) vs queryBy (may be absent — the only way to assert absence) vs findBy (async, awaits appearance). Using getBy for async content is the #1 flaky-test cause."}, {"t": "li", "text": "Never test useState internals or call hooks directly — render the component and interact with it the way a user does."}, {"t": "subhead", "text": "K4 — Mocking the network with MSW"}, {"t": "p", "text": "MSW intercepts at the network layer, so your component uses real fetch and real loading states — no mocked axios, no fake hooks. The same handlers work in tests, Storybook and the browser."}, {"t": "code", "lang": "js", "lines": ["import { setupServer } from \"msw/node\";", "import { http, HttpResponse } from \"msw\";", "", "const server = setupServer(", "  http.get(\"/api/users\", () => HttpResponse.json([{ id: 1, name: \"Ada\" }]))", ");", "beforeAll(() => server.listen({ onUnhandledRequest: \"error\" }));", "afterEach(() => server.resetHandlers());", "afterAll(() => server.close());", "", "it(\"renders the error state when the API fails\", async () => {", "  server.use(http.get(\"/api/users\", () => new HttpResponse(null, { status: 500 })));", "  render(<UserList />);", "  expect(await screen.findByRole(\"alert\")).toBeInTheDocument();", "});"]}, {"t": "subhead", "text": "K5 — API integration tests (Supertest + in-memory Mongo)"}, {"t": "code", "lang": "js", "lines": ["import request from \"supertest\";", "import { MongoMemoryServer } from \"mongodb-memory-server\";", "import mongoose from \"mongoose\";", "import app from \"../app.js\";", "", "let mongod;", "beforeAll(async () => {", "  mongod = await MongoMemoryServer.create();     // real MongoDB, no Docker", "  await mongoose.connect(mongod.getUri());", "});", "afterEach(async () => {                           // isolation between tests", "  for (const c of Object.values(mongoose.connection.collections)) await c.deleteMany({});", "});", "afterAll(async () => { await mongoose.disconnect(); await mongod.stop(); });", "", "it(\"rejects an unauthenticated delete\", async () => {", "  const res = await request(app).delete(\"/api/users/123\");", "  expect(res.status).toBe(401);", "});", "", "it(\"creates a user and returns 201 without the password\", async () => {", "  const res = await request(app).post(\"/api/users\")", "    .send({ email: \"a@b.com\", password: \"supersecret\" });", "  expect(res.status).toBe(201);", "  expect(res.body).not.toHaveProperty(\"password\");", "});"]}, {"t": "subhead", "text": "K6 — E2E with Playwright"}, {"t": "code", "lang": "js", "lines": ["import { test, expect } from \"@playwright/test\";", "", "test(\"a user can sign up and reach the dashboard\", async ({ page }) => {", "  await page.goto(\"/signup\");", "  await page.getByLabel(\"Email\").fill(`u${Date.now()}@test.com`);", "  await page.getByLabel(\"Password\").fill(\"Str0ng!pass\");", "  await page.getByRole(\"button\", { name: \"Create account\" }).click();", "  await expect(page.getByRole(\"heading\", { name: \"Dashboard\" })).toBeVisible();", "});", "// Playwright auto-waits for actionability — no sleep() ever.", "// Reuse auth: save storageState once, load it in every other test."]}, {"t": "li", "text": "E2E is expensive: cover the 3-5 flows that make you money (signup, login, checkout, core create). Everything else belongs lower in the pyramid."}, {"t": "li", "text": "Flake killers: no fixed sleeps, unique data per run, isolated test users, and never depend on test execution order."}, {"t": "subhead", "text": "K7 — TDD, coverage & CI"}, {"t": "li", "text": "TDD loop: red (write the failing test) → green (simplest code that passes) → refactor (with the test as your safety net). Most valuable on bug fixes: reproduce with a test first, and the bug can never silently return."}, {"t": "li", "text": "Coverage: vitest run --coverage. Use it to find untested branches, not as a target to game. Enforce a floor in CI (e.g. 70%) that only ever goes up."}, {"t": "li", "text": "CI: run unit + integration on every PR, E2E on merge to main (or nightly). A red main branch is an emergency, not a ticket."}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter K", "body": ["E1: Retrofit your Month 6 API capstone with Supertest + mongodb-memory-server: cover auth, validation errors, and one happy path per route.", "E2: Take a React form from any capstone and test it with RTL + MSW — success, validation error, and server-error states.", "E3: Write one Playwright test for your app's core flow and wire it into GitHub Actions.", "E4: Fix your next bug with TDD: failing test first, then the fix. Keep the test forever."]}]}, {"id": "pgL", "title": "Performance — Frontend, Backend & Database", "sub": "Chapter L · New", "blocks": [{"t": "callout", "kind": "info", "title": "The discipline", "body": ["Performance work without measurement is superstition. Every section here follows the same loop: measure → find the biggest cost → fix it → measure again. Interviewers listen for that loop more than for any specific trick."]}, {"t": "subhead", "text": "L1 — Core Web Vitals"}, {"t": "table", "rows": [["Metric", "Good", "Measures", "Main fixes"], ["LCP — Largest Contentful Paint", "< 2.5 s", "when the main content appears", "preload the hero image, cut render-blocking CSS/JS, faster TTFB, CDN"], ["INP — Interaction to Next Paint", "< 200 ms", "responsiveness to clicks/typing", "break long tasks, debounce, move work off the main thread"], ["CLS — Cumulative Layout Shift", "< 0.1", "unexpected movement", "width/height on images, reserve ad/embed space, no injected banners"], ["TTFB", "< 800 ms", "server response time", "caching, DB indexes, edge rendering"]]}, {"t": "li", "text": "Lab (Lighthouse, WebPageTest) finds problems; field data (RUM, web-vitals library, Chrome UX Report) proves them. Optimising only the lab score is how sites score 100 and still feel slow on a mid-range Android."}, {"t": "code", "lang": "js", "lines": ["import { onLCP, onINP, onCLS } from \"web-vitals\";", "const send = m => navigator.sendBeacon(\"/api/vitals\", JSON.stringify(m));", "onLCP(send); onINP(send); onCLS(send);     // real users, real devices"]}, {"t": "subhead", "text": "L2 — Bundle size"}, {"t": "li", "text": "Measure first: npx vite-bundle-visualizer (or rollup-plugin-visualizer / webpack-bundle-analyzer). The answer is almost always one fat dependency — moment, lodash imported whole, a chart library, an icon set."}, {"t": "li", "text": "Fixes in order of payoff: route-level code splitting (lazy + Suspense), import only what you use (import debounce from \"lodash-es/debounce\"), swap heavy deps (moment → date-fns/Temporal), defer non-critical widgets, tree-shakeable ESM builds."}, {"t": "li", "text": "Images are usually bigger than your JS: modern formats (AVIF/WebP), correct dimensions, responsive srcset, lazy loading below the fold, and a real CDN. next/image does all of this by default."}, {"t": "li", "text": "Fonts: preload the one weight you need, font-display: swap, and subset — an unoptimised font stack costs LCP and causes layout shift."}, {"t": "code", "lang": "js", "lines": ["// Route-level splitting is the highest-ROI frontend change you can make", "const Dashboard = lazy(() => import(\"./routes/Dashboard\"));", "const Reports   = lazy(() => import(\"./routes/Reports\"));   // ~40% of the", "// bundle usually lives in routes most users never open"]}, {"t": "subhead", "text": "L3 — React runtime performance"}, {"t": "li", "text": "Diagnose with the React DevTools Profiler: record an interaction, look for components re-rendering that shouldn't. Guessing at memo() is how codebases get slower and uglier."}, {"t": "li", "text": "Fix order: (1) move state down so fewer components subscribe to it, (2) pass children through instead of re-creating trees, (3) split context, (4) then memoise — and note the React Compiler is automating step 4."}, {"t": "li", "text": "Long lists: virtualise (react-window / TanStack Virtual) — the DOM, not React, is the bottleneck at 5,000 rows."}, {"t": "li", "text": "Keep the main thread free: useDeferredValue for expensive filtered views, useTransition for non-urgent updates, Web Workers for genuinely heavy computation."}, {"t": "subhead", "text": "L4 — API & database performance"}, {"t": "li", "text": "Most \"slow API\" tickets are one of four things: a missing index, an N+1 query, no pagination, or an unbounded payload. Check those before touching architecture."}, {"t": "li", "text": "Prove it with .explain(\"executionStats\") (IXSCAN vs COLLSCAN, docsExamined vs nReturned) and Atlas's slow-query profiler. The ESR rule from the MongoDB cheat sheet fixes most compound-index misses."}, {"t": "li", "text": "N+1: one query for the list, then one per row. Fix with $lookup, a single $in batch query, or populate — and add a DataLoader if you serve GraphQL."}, {"t": "li", "text": "Project only the fields you need (.select(\"name email\")), .lean() for read-only routes (skips Mongoose document construction — often 2-5× faster), and always paginate."}, {"t": "code", "lang": "js", "lines": ["// N+1 (bad): 1 + N round trips", "const posts = await Post.find().limit(20);", "for (const p of posts) p.author = await User.findById(p.authorId);", "", "// Batched (good): 2 round trips, any N", "const posts   = await Post.find().limit(20).lean();", "const authors = await User.find({ _id: { $in: posts.map(p => p.authorId) } })", "                          .select(\"name\").lean();", "const byId = new Map(authors.map(a => [String(a._id), a]));", "posts.forEach(p => (p.author = byId.get(String(p.authorId))));"]}, {"t": "subhead", "text": "L5 — Caching layers"}, {"t": "table", "rows": [["Layer", "Tool", "Good for", "Invalidation"], ["Browser", "Cache-Control, ETag", "static assets, GETs", "content hashes in filenames"], ["CDN / edge", "Cloudflare, Vercel", "HTML, images, public API GETs", "purge on deploy / stale-while-revalidate"], ["App memory", "lru-cache", "hot config, tiny lookups", "TTL — dies with the process"], ["Shared cache", "Redis (Upstash free)", "sessions, query results, rate limits", "TTL + explicit delete on write"], ["Client cache", "TanStack Query", "server state in the UI", "staleTime + invalidateQueries"]]}, {"t": "code", "lang": "js", "lines": ["// Cache-aside: the pattern behind most \"we added Redis\" wins", "async function getProduct(id) {", "  const hit = await redis.get(`product:${id}`);", "  if (hit) return JSON.parse(hit);", "  const doc = await Product.findById(id).lean();", "  await redis.set(`product:${id}`, JSON.stringify(doc), { EX: 300 }); // 5 min", "  return doc;", "}", "// On write: await redis.del(`product:${id}`) — stale cache is worse than none"]}, {"t": "li", "text": "Cache invalidation is the hard part: prefer short TTLs you can reason about over clever dependency graphs, and never cache per-user data under a shared key (the classic leak of one user's dashboard to everyone)."}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter L", "body": ["E1: Lighthouse your deployed capstone, fix the two worst items, and record before/after scores in the README.", "E2: Run a bundle visualiser; get the initial JS under 200 KB gzipped with route splitting and dependency swaps.", "E3: Find an N+1 in your API, fix it with a batched $in query, and measure the latency drop.", "E4: Add Redis cache-aside (Upstash free tier) to your hottest read endpoint, with correct invalidation on write."]}]}, {"id": "pgM", "title": "Coding Challenge Prep — Implement-From-Scratch & DSA Patterns", "sub": "Chapter M · New", "blocks": [{"t": "callout", "kind": "info", "title": "The round this chapter covers", "body": ["Most MERN interviews include a live-coding stage: either \"implement debounce/deepClone from scratch\" (JS fluency) or a LeetCode-easy/medium (problem solving). Neither is about tricks — they are about writing clean code while talking. Type these out by hand until they are muscle memory."]}, {"t": "subhead", "text": "M1 — Big-O, the practical version"}, {"t": "table", "rows": [["Complexity", "Name", "Typical source"], ["O(1)", "constant", "Map/Set lookup, object property access, push/pop"], ["O(log n)", "logarithmic", "binary search, balanced tree / DB index lookup"], ["O(n)", "linear", "a single loop, map/filter/reduce, spread of an array"], ["O(n log n)", "linearithmic", "sort() — the practical floor for comparison sorting"], ["O(n²)", "quadratic", "nested loops, includes() inside a loop — the usual culprit"], ["O(2ⁿ)", "exponential", "naive recursion without memoisation (fib)"]]}, {"t": "li", "text": "The single most common interview fix: an inner .includes()/.find() over an array (O(n²)) becomes a Set/Map lookup (O(n)). If you spot a nested loop, ask \"can a hash map remember this?\" first."}, {"t": "li", "text": "Say complexity out loud unprompted — \"this is O(n) time, O(n) space, and I could trade space for time by...\" — it is half the grade."}, {"t": "li", "text": "Hidden costs: spread inside a loop ([...acc, x] in a reduce) is quadratic; array.shift()/unshift() is O(n); string += in a big loop allocates repeatedly."}, {"t": "subhead", "text": "M2 — The classics: implement these from memory"}, {"t": "code", "lang": "js", "lines": ["// 1. Debounce (asked more than any other)", "function debounce(fn, ms = 300) {", "  let t;", "  return function (...args) {", "    clearTimeout(t);", "    t = setTimeout(() => fn.apply(this, args), ms);   // preserve `this`", "  };", "}", "", "// 2. Throttle", "function throttle(fn, ms = 300) {", "  let last = 0, timer;", "  return (...args) => {", "    const now = Date.now(), remaining = ms - (now - last);", "    if (remaining <= 0) { last = now; fn(...args); }", "    else if (!timer) timer = setTimeout(() => {        // trailing call", "      last = Date.now(); timer = null; fn(...args);", "    }, remaining);", "  };", "}", "", "// 3. Deep clone (without structuredClone)", "function deepClone(v, seen = new WeakMap()) {", "  if (v === null || typeof v !== \"object\") return v;", "  if (seen.has(v)) return seen.get(v);                 // handles cycles", "  if (v instanceof Date) return new Date(v);", "  if (v instanceof Map) return new Map([...v].map(([k, x]) => [k, deepClone(x, seen)]));", "  if (v instanceof Set) return new Set([...v].map(x => deepClone(x, seen)));", "  const out = Array.isArray(v) ? [] : Object.create(Object.getPrototypeOf(v));", "  seen.set(v, out);", "  for (const k of Reflect.ownKeys(v)) out[k] = deepClone(v[k], seen);", "  return out;", "}"]}, {"t": "code", "lang": "js", "lines": ["// 4. Memoize", "const memoize = (fn, keyFn = (...a) => JSON.stringify(a)) => {", "  const cache = new Map();", "  return (...args) => {", "    const k = keyFn(...args);", "    if (!cache.has(k)) cache.set(k, fn(...args));", "    return cache.get(k);", "  };", "};", "", "// 5. Flatten (depth-aware, no Array.prototype.flat)", "const flatten = (arr, depth = 1) =>", "  depth < 1 ? arr.slice()", "  : arr.reduce((acc, v) =>", "      acc.concat(Array.isArray(v) ? flatten(v, depth - 1) : v), []);", "", "// 6. Group by", "const groupBy = (arr, keyFn) => arr.reduce((acc, x) => {", "  const k = keyFn(x); (acc[k] ||= []).push(x); return acc;", "}, {});", "", "// 7. Promisify a callback API", "const promisify = fn => (...args) =>", "  new Promise((res, rej) =>", "    fn(...args, (err, data) => (err ? rej(err) : res(data))));"]}, {"t": "code", "lang": "js", "lines": ["// 8. Promise.all from scratch (classic follow-up)", "function promiseAll(promises) {", "  return new Promise((resolve, reject) => {", "    const out = new Array(promises.length);", "    let done = 0;", "    if (!promises.length) return resolve(out);", "    promises.forEach((p, i) =>", "      Promise.resolve(p).then(v => {", "        out[i] = v;                       // preserve order", "        if (++done === promises.length) resolve(out);", "      }, reject));                        // first rejection wins", "  });", "}", "", "// 9. Retry with exponential backoff", "async function retry(fn, tries = 3, base = 200) {", "  for (let i = 0; i < tries; i++) {", "    try { return await fn(); }", "    catch (e) { if (i === tries - 1) throw e;", "      await new Promise(r => setTimeout(r, base * 2 ** i)); }", "  }", "}", "", "// 10. Concurrency-limited pool (the senior version of Promise.all)", "async function pool(tasks, limit = 5) {", "  const results = []; const running = new Set();", "  for (const task of tasks) {", "    const p = task().finally(() => running.delete(p)); // free the slot on success OR failure", "    running.add(p); results.push(p);", "    if (running.size >= limit) await Promise.race(running);", "  }", "  return Promise.all(results);", "}"]}, {"t": "code", "lang": "js", "lines": ["// 11. Event emitter (tests understanding of the Node core pattern)", "class Emitter {", "  #events = new Map();", "  on(name, fn) { (this.#events.get(name) ?? this.#events.set(name, []).get(name)).push(fn);", "                 return () => this.off(name, fn); }        // unsubscribe fn", "  off(name, fn) { this.#events.set(name, (this.#events.get(name) ?? []).filter(f => f !== fn)); }", "  once(name, fn) { const off = this.on(name, (...a) => { off(); fn(...a); }); }", "  emit(name, ...args) { (this.#events.get(name) ?? []).forEach(f => f(...args)); }", "}", "", "// 12. Curry", "const curry = fn => function curried(...args) {", "  return args.length >= fn.length ? fn(...args)", "    : (...rest) => curried(...args, ...rest);", "};"]}, {"t": "subhead", "text": "M3 — The five patterns that cover most screens"}, {"t": "topic", "text": "Hash map (counting / lookup) — the default weapon"}, {"t": "code", "lang": "js", "lines": ["// Two Sum — O(n) instead of the O(n²) nested loop", "function twoSum(nums, target) {", "  const seen = new Map();                    // value -> index", "  for (let i = 0; i < nums.length; i++) {", "    const need = target - nums[i];", "    if (seen.has(need)) return [seen.get(need), i];", "    seen.set(nums[i], i);", "  }", "  return [];", "}", "// Anagram check, first non-repeating char, frequency counts: same shape."]}, {"t": "topic", "text": "Two pointers (sorted arrays, in-place work)"}, {"t": "code", "lang": "js", "lines": ["const isPalindrome = s => {", "  const t = s.toLowerCase().replace(/[^a-z0-9]/g, \"\");", "  let i = 0, j = t.length - 1;", "  while (i < j) if (t[i++] !== t[j--]) return false;", "  return true;", "};"]}, {"t": "topic", "text": "Sliding window (subarray/substring over a range)"}, {"t": "code", "lang": "js", "lines": ["// Longest substring without repeating characters — O(n)", "function longestUnique(s) {", "  const last = new Map(); let start = 0, best = 0;", "  for (let i = 0; i < s.length; i++) {", "    if (last.has(s[i]) && last.get(s[i]) >= start) start = last.get(s[i]) + 1;", "    last.set(s[i], i);", "    best = Math.max(best, i - start + 1);", "  }", "  return best;", "}"]}, {"t": "topic", "text": "Recursion / DFS+BFS (trees, nested data, the DOM)"}, {"t": "code", "lang": "js", "lines": ["// Flatten a nested category tree — the real-world version of DFS", "function flattenTree(nodes, depth = 0, out = []) {", "  for (const n of nodes) {", "    out.push({ id: n.id, name: n.name, depth });", "    if (n.children?.length) flattenTree(n.children, depth + 1, out);", "  }", "  return out;", "}", "// BFS with a queue when you need level order / shortest path:", "function bfs(root) {", "  const q = [root], seen = [];", "  for (let head = 0; head < q.length; head++) {   // index pointer, not shift(): O(1) dequeue", "    const n = q[head]; seen.push(n.id); q.push(...(n.children ?? []));", "  }", "  return seen;", "}"]}, {"t": "topic", "text": "Sort + scan (intervals, top-k, dedupe)"}, {"t": "code", "lang": "js", "lines": ["// Merge overlapping intervals — O(n log n)", "function merge(intervals) {", "  const sorted = [...intervals].sort((a, b) => a[0] - b[0]);", "  return sorted.reduce((acc, cur) => {", "    const last = acc[acc.length - 1];", "    if (last && cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]);", "    else acc.push([...cur]);", "    return acc;", "  }, []);", "}"]}, {"t": "subhead", "text": "M4 — How to behave in the live round"}, {"t": "li", "text": "1. Restate the problem and confirm inputs/outputs/edge cases before typing. Silence while you think reads as being stuck — narrate instead."}, {"t": "li", "text": "2. State the brute force, give its complexity, then say how you would improve it. Interviewers grade the trajectory, not the first idea."}, {"t": "li", "text": "3. Write the ugly-but-correct version first, then refactor out loud. A working O(n²) beats an unfinished O(n)."}, {"t": "li", "text": "4. Test by hand with an example, plus the edge cases: empty input, one element, duplicates, negatives, null."}, {"t": "li", "text": "5. If you are stuck, say what you know and what you would look up. \"I would check the exact signature of Intl.Collator\" is honest; silent guessing is not."}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter M", "body": ["E1: Type all twelve implementations in M2 from memory, once a day for a week, without looking. This is the highest-ROI hour in the whole guide for a live round.", "E2: Solve five LeetCode-easy problems using only the M3 patterns; state the complexity out loud before coding.", "E3: Record yourself solving one medium in 25 minutes — watch it back for silence gaps and untested edge cases.", "E4: Re-implement debounce with leading and trailing options, and write Vitest tests using fake timers."]}]}, {"id": "pgN", "title": "Job Search Toolkit — CV, GitHub, Take-Homes & Offers", "sub": "Chapter N · New", "blocks": [{"t": "callout", "kind": "info", "title": "The last mile", "body": ["Skills do not get hired; evidence of skills gets hired. This chapter covers the artifacts and conversations between finishing the roadmap and signing an offer — written for a NetSuite consultant moving into full-stack development."]}, {"t": "subhead", "text": "N1 — The CV that survives 20 seconds"}, {"t": "li", "text": "One page. Order: name + title + links (GitHub, LinkedIn, portfolio) → 3-line summary → skills → experience → projects → education. No photo, no skill bars, no \"references available\"."}, {"t": "li", "text": "Title yourself as the job you want: \"Full-Stack Developer (MERN) · ERP Integration Specialist\" — not \"NetSuite Consultant seeking career change\"."}, {"t": "li", "text": "Every bullet: verb + what + measurable outcome + tech. \"Built a NetSuite→MongoDB sync service (Node, Express, BullMQ) processing 40k records/night, cutting manual reconciliation from 6 hours to 15 minutes.\""}, {"t": "li", "text": "Reframe consulting as engineering: you already ship JavaScript to production, gather requirements, debug live systems, and integrate APIs under SLA. That IS the job — say it in that language."}, {"t": "li", "text": "ATS reality: plain formatting, no tables/columns/graphics, real text (never a PDF of an image), and mirror the exact keywords from the posting (\"React\", \"Node.js\", \"TypeScript\", \"REST\")."}, {"t": "subhead", "text": "N2 — GitHub as your real CV"}, {"t": "li", "text": "Pin 4-6 repos, ordered by relevance. A hiring manager gives your profile ~90 seconds: the README is what they read, not your code."}, {"t": "li", "text": "Every pinned README needs: one-line pitch, live demo link, a screenshot or GIF, the stack, why you built it, setup steps, and what you would do next. No README = no evaluation."}, {"t": "li", "text": "Signals that separate you from bootcamp portfolios: tests in CI (a green badge), meaningful commit messages, an actual deployed URL, and a repo that is not a tutorial clone."}, {"t": "li", "text": "A profile README with your NetSuite-to-MERN story converts curiosity into interviews. Contribution graphs matter less than one impressive, finished, deployed thing."}, {"t": "subhead", "text": "N3 — Take-home assignments"}, {"t": "li", "text": "Timebox honestly. If they say 4 hours, spend 4-6 and write down what you would add with more time — over-building signals poor judgement as loudly as under-building."}, {"t": "li", "text": "Ship the boring excellence: a README with decisions and trade-offs, a few real tests, input validation, error handling, .env.example, and one commit history that shows how you work."}, {"t": "li", "text": "The README section that wins take-homes: \"Trade-offs — I chose X over Y because Z; with more time I would add A and B.\" It converts every gap into a deliberate decision."}, {"t": "li", "text": "Do not use a framework they did not ask for, and do not skip the requirements to show off. Read the brief twice; answer exactly it."}, {"t": "subhead", "text": "N4 — The process & the numbers"}, {"t": "table", "rows": [["Stage", "What it tests", "Prepare with"], ["Recruiter screen (20 min)", "story, motivation, salary range", "the 90-second intro (Behavioral B13)"], ["Technical screen (45-60 min)", "JS/React/Node fundamentals, live coding", "the drill + Chapter M"], ["Take-home or pair session", "how you actually build", "N3 above"], ["System design (senior)", "architecture, trade-offs", "System Design Walkthroughs"], ["Behavioral / hiring manager", "ownership, collaboration", "STAR stories (B15-B17)"], ["Team/culture fit", "do we want you around", "your questions (B18)"]]}, {"t": "li", "text": "Volume is normal: dozens of applications per offer for a career changer. Track them in a sheet (company, date, stage, contact, next action) or the process will manage you."}, {"t": "li", "text": "Referrals beat portals by an order of magnitude. Your NetSuite network already contains engineers, partners and clients who ship software — tell them exactly what you are looking for."}, {"t": "li", "text": "Rejection after a technical screen is information: ask what to strengthen, note the questions you fumbled, drill them, move on. The same 20 questions recur across companies."}, {"t": "subhead", "text": "N5 — Offers & negotiation"}, {"t": "li", "text": "Never name the first number. \"I'd like to understand the full package and scope first — what range is budgeted for this role?\" Recruiters have a range; make them share it."}, {"t": "li", "text": "If pressed, give a researched range with your floor near the middle, anchored on market data (levels.fyi, Glassdoor, local surveys) — not on your consulting salary."}, {"t": "li", "text": "Negotiate the package, not just base: remote days, learning budget, equipment, title, review timing, sign-on. Asking politely once, in writing, is expected — offers are essentially never withdrawn for it."}, {"t": "li", "text": "Get the final offer in writing before resigning, and evaluate what compounds: the codebase you will work in, the seniority of your reviewers, and what you will be able to claim in two years."}, {"t": "callout", "kind": "tip", "title": "The mindset that actually matters", "body": ["You are not a beginner asking for a chance — you are an experienced professional adding a stack. You have shipped code that ran businesses, worked with stakeholders, and debugged production under pressure. Most junior candidates have none of that. Interview like someone who knows it."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter N", "body": ["E1: Rewrite your CV to one page with outcome-based bullets; have someone read it for 20 seconds and tell you what you do.", "E2: Write READMEs for your top 3 capstones to the N2 checklist and pin them.", "E3: Draft your 90-second intro and record it — twice, until it is under 100 seconds and sounds human.", "E4: Write the \"trade-offs\" section for your last project as if it were a take-home submission."]}]}], "volumes": [{"vol": "Volume 1", "sections": [{"id": "v1s0", "title": "JavaScript — Core Language", "sub": "", "qs": [{"num": "Q1", "title": "What is the difference between var, let, and const?", "level": "Junior", "blocks": [{"t": "p", "text": "var is function-scoped and hoisted to undefined — it can be accessed before declaration without an error. let is block-scoped and in the temporal dead zone before declaration (accessing it throws ReferenceError). const is also block-scoped and must be assigned at declaration — it cannot be reassigned, though the object or array it points to can be mutated."}, {"t": "li", "text": "Use const by default for every variable."}, {"t": "li", "text": "Use let only when you know the variable will be reassigned."}, {"t": "li", "text": "Never use var in modern JavaScript."}, {"t": "code", "lang": "js", "lines": ["var x = 1; if(true) { var x = 2; } console.log(x); // 2 — same scope!", "let y = 1; if(true) { let y = 2; } console.log(y); // 1 — block scoped", "", "const obj = { a: 1 };", "obj.a = 2;    // OK — mutating the object", "// obj = {};  // TypeError — cannot reassign the binding"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Interviewers expect you to explain the temporal dead zone for let/const, not just say \"let is block-scoped\". Mention it unprompted."]}]}, {"num": "Q2", "title": "Explain JavaScript type coercion. What is == vs ===?", "level": "Junior", "blocks": [{"t": "p", "text": "Type coercion is JavaScript automatically converting a value from one type to another. == (loose equality) coerces types before comparing. === (strict equality) never coerces — values must have the same type AND value."}, {"t": "li", "text": "\"5\" + 3 === \"53\" (string concatenation)"}, {"t": "li", "text": "\"5\" - 3 === 2 (arithmetic forces numeric)"}, {"t": "li", "text": "0 == false is true, but 0 === false is false"}, {"t": "li", "text": "null == undefined is true, null === undefined is false"}, {"t": "li", "text": "NaN === NaN is false — use Number.isNaN() instead"}, {"t": "p", "text": "Always use === in production code."}, {"t": "code", "lang": "js", "lines": ["console.log(\"5\" + 3);    // \"53\" (string wins with +)", "console.log(\"5\" - 3);    // 2  (arithmetic forces number)", "console.log(0 == false);  // true", "console.log(0 === false); // false", "console.log(null == undefined);  // true", "console.log(null === undefined); // false"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know all 7 falsy values: false, 0, -0, 0n, \"\", null, undefined, NaN. Be ready to recite them."]}]}, {"num": "Q3", "title": "What is a closure and what are its practical uses?", "level": "Mid", "blocks": [{"t": "p", "text": "A closure is a function that retains access to variables from its outer (enclosing) scope even after that outer function has returned. The inner function \"closes over\" those variables."}, {"t": "li", "text": "Private state: factory functions that expose methods sharing hidden state"}, {"t": "li", "text": "Partial application / currying: pre-fill some arguments of a function"}, {"t": "li", "text": "Memoisation: cache results in a closed-over Map"}, {"t": "li", "text": "Event listeners that remember which element they're attached to"}, {"t": "li", "text": "React hooks internally use closures to capture state"}, {"t": "code", "lang": "js", "lines": ["function makeCounter(start = 0) {", "  let count = start; // private — not accessible outside", "  return {", "    increment: () => ++count,", "    decrement: () => --count,", "    getCount:  () => count,", "  };", "}", "const c = makeCounter(10);", "c.increment(); // 11", "console.log(c.count); // undefined — truly private"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Explain WHY closures work (lexical scoping). Most candidates say \"a function that has access to outer variables\" — go deeper and mention the lexical environment object."]}]}, {"num": "Q4", "title": "Explain the JavaScript event loop in detail.", "level": "Mid", "blocks": [{"t": "p", "text": "JavaScript is single-threaded. The event loop coordinates the call stack, task queue, and microtask queue."}, {"t": "li", "text": "Call stack: executes synchronous code frame by frame"}, {"t": "li", "text": "Web/Node APIs: handle async operations (setTimeout, fetch, fs)"}, {"t": "li", "text": "Microtask queue: Promise .then(), queueMicrotask() — processed COMPLETELY after each task, before the next task"}, {"t": "li", "text": "Task queue (macrotask): setTimeout, setInterval, I/O callbacks — one per event loop turn"}, {"t": "p", "text": "Order: sync code → all microtasks → one macrotask → all microtasks → one macrotask → ..."}, {"t": "code", "lang": "js", "lines": ["console.log(\"1\");", "setTimeout(() => console.log(\"4\"), 0);", "Promise.resolve().then(() => console.log(\"3\"));", "console.log(\"2\");", "// Output: 1, 2, 3, 4", "// Microtask (Promise) runs before macrotask (setTimeout)"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Draw the event loop on a whiteboard if given the chance. Explaining the microtask queue separately from the macrotask queue is what distinguishes senior candidates."]}]}, {"num": "Q5", "title": "What is the difference between call, apply, and bind?", "level": "Mid", "blocks": [{"t": "p", "text": "All three control what this refers to inside a function."}, {"t": "li", "text": "call(thisArg, arg1, arg2, ...): invokes immediately, arguments passed individually"}, {"t": "li", "text": "apply(thisArg, [arg1, arg2, ...]): invokes immediately, arguments as array"}, {"t": "li", "text": "bind(thisArg, arg1, ...): returns a NEW function with this permanently bound, does not invoke immediately"}, {"t": "p", "text": "Arrow functions cannot have their this changed by any of these — they inherit this lexically."}, {"t": "code", "lang": "js", "lines": ["function greet(greeting, punctuation) {", "  return `${greeting}, ${this.name}${punctuation}`;", "}", "const user = { name: \"Ahmed\" };", "", "greet.call(user, \"Hello\", \"!\");   // \"Hello, Ahmed!\"", "greet.apply(user, [\"Hi\", \".\"]);   // \"Hi, Ahmed.\"", "const boundGreet = greet.bind(user, \"Hey\");", "boundGreet(\"!\"); // \"Hey, Ahmed!\" — called later"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A classic follow-up: \"implement your own bind()\". Practice this before the interview."]}]}, {"num": "Q6", "title": "Explain prototypal inheritance vs classical inheritance.", "level": "Senior", "blocks": [{"t": "p", "text": "Classical inheritance (Java, Python): classes are blueprints. Objects are instances created from classes. Inheritance creates a hierarchy of classes."}, {"t": "p", "text": "JavaScript uses prototypal inheritance: every object has a [[Prototype]] (internal slot pointing to another object). When a property is not found on an object, JavaScript looks up the chain until it reaches null."}, {"t": "p", "text": "ES6 classes are syntactic sugar over prototypal inheritance — class A extends B still uses [[Prototype]] under the hood."}, {"t": "p", "text": "Key difference: in classical inheritance you inherit from classes (static blueprints). In prototypal inheritance you inherit from objects (living instances)."}, {"t": "code", "lang": "js", "lines": ["const animal = { speak() { return `${this.name} speaks`; } };", "const dog = Object.create(animal); // dog.__proto__ === animal", "dog.name = \"Rex\";", "dog.speak(); // \"Rex speaks\" — found on prototype", "", "// Class syntax (still prototypal under the hood)", "class Animal { speak() { return `${this.name} speaks`; } }", "class Dog extends Animal { fetch() { return \"fetching!\"; } }", "Object.getPrototypeOf(Dog.prototype) === Animal.prototype // true"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Interviewers love \"what does Object.create(null) do and when would you use it?\" — it creates an object with no prototype (no toString, no hasOwnProperty), useful for safe hash maps."]}]}, {"num": "Q7", "title": "What are Promises and how does async/await relate to them?", "level": "Senior", "blocks": [{"t": "p", "text": "A Promise is an object representing the eventual result of an asynchronous operation. It has three states: pending, fulfilled, rejected. It is a state machine — once settled, it never changes state."}, {"t": "p", "text": "async/await is syntactic sugar over Promises. An async function always returns a Promise. await pauses execution of that async function only — the rest of the JS thread continues."}, {"t": "p", "text": "Error handling: in Promise chains, use .catch(). With async/await, use try/catch. Both are equivalent."}, {"t": "p", "text": "Promise combinators: Promise.all (all succeed or first failure), Promise.allSettled (wait for all, report each), Promise.race (first to settle wins), Promise.any (first success wins)."}, {"t": "code", "lang": "js", "lines": ["// These are exactly equivalent:", "function fetchUser(id) {", "  return fetch(`/api/users/${id}`).then(r => r.json());", "}", "", "async function fetchUser2(id) {", "  const r = await fetch(`/api/users/${id}`);", "  return r.json(); // async function returns a Promise automatically", "}", "", "// Parallel execution (not sequential)", "const [users, posts] = await Promise.all([fetchUsers(), fetchPosts()]);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Common gotcha question: \"what does await do inside a non-async function?\" — answer: SyntaxError. Also know that await outside an async function throws at parse time in modules vs runtime in scripts."]}]}, {"num": "Q8", "title": "Explain generators and their use cases.", "level": "Expert", "blocks": [{"t": "p", "text": "A generator function (function*) returns a Generator object — an iterator. Execution is paused at each yield expression and resumes on .next(). Values are produced lazily (on demand), not all at once."}, {"t": "p", "text": "Use cases: lazy infinite sequences, async iteration, implementing custom iterators, co-routines, data pipelines that process elements one at a time without loading all into memory."}, {"t": "p", "text": "Generators are the foundation of async/await under the hood — babel compiled early async/await to generator-based state machines."}, {"t": "code", "lang": "js", "lines": ["function* range(start, end, step = 1) {", "  for (let i = start; i < end; i += step) yield i;", "}", "const evens = [...range(0, 10, 2)]; // [0, 2, 4, 6, 8]", "", "// Infinite sequence — memory efficient", "function* fibonacci() {", "  let [a, b] = [0, 1];", "  while (true) { yield a; [a, b] = [b, a + b]; }", "}", "const fib = fibonacci();", "fib.next().value; // 0", "fib.next().value; // 1", "fib.next().value; // 1"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["If asked about async generators (async function*) — they combine generators and async/await for streaming async data, like reading a large file line by line from an API."]}]}]}, {"id": "v1s1", "title": "TypeScript", "sub": "", "qs": [{"num": "Q9", "title": "What is TypeScript and why use it over plain JavaScript?", "level": "Junior", "blocks": [{"t": "p", "text": "TypeScript is a statically-typed superset of JavaScript that compiles to plain JS. It adds optional type annotations, interfaces, generics, and access modifiers."}, {"t": "p", "text": "Benefits:"}, {"t": "li", "text": "Catch type errors at compile time, not at runtime"}, {"t": "li", "text": "IDE autocompletion and refactoring safety"}, {"t": "li", "text": "Self-documenting code — function signatures are contracts"}, {"t": "li", "text": "Easier to maintain large codebases"}, {"t": "li", "text": "Generics enable reusable, type-safe data structures"}, {"t": "p", "text": "TypeScript does NOT change runtime behaviour — it is erased at compile time."}, {"t": "code", "lang": "js", "lines": ["// JS: no error at write time, crashes at runtime", "function add(a, b) { return a + b; }", "add(\"5\", 3); // \"53\" — silent bug", "", "// TS: error caught at compile time", "function add(a: number, b: number): number { return a + b; }", "add(\"5\", 3); // TS2345: Argument of type string not assignable to number"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Always mention the compile-time vs runtime distinction. TypeScript cannot catch runtime errors like null pointer exceptions unless you use strict mode and handle nullability."]}]}, {"num": "Q10", "title": "What are generics in TypeScript and when would you use them?", "level": "Mid", "blocks": [{"t": "p", "text": "Generics are type parameters that let you write reusable code that works with multiple types while retaining type safety. Think of them like function parameters, but for types."}, {"t": "p", "text": "Use generics when: a function works on any type but the input and output types must be related; when you want a container (like Array, Promise, Map) that carries type information; when implementing data structures (Stack<T>, Queue<T>)."}, {"t": "p", "text": "Without generics you would use any — which defeats the purpose of TypeScript."}, {"t": "code", "lang": "js", "lines": ["// Without generics — loses type info", "function first(arr: any[]): any { return arr[0]; }", "", "// With generics — preserves type", "function first<T>(arr: T[]): T { return arr[0]; }", "const n = first([1, 2, 3]);      // n is number", "const s = first([\"a\", \"b\"]);    // s is string", "", "// Generic interface", "interface ApiResponse<T> { success: boolean; data: T; }", "type UserResponse = ApiResponse<User>;", "type PostsResponse = ApiResponse<Post[]>;"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know Partial<T>, Required<T>, Readonly<T>, Pick<T, K>, Omit<T, K>, Record<K, V>, ReturnType<F>. Interviewers frequently ask about these utility types."]}]}, {"num": "Q11", "title": "What is the difference between type and interface in TypeScript?", "level": "Mid", "blocks": [{"t": "p", "text": "Both describe object shapes, but they have key differences:"}, {"t": "li", "text": "interface can be extended with extends and merged (declaration merging) — two interface declarations with the same name merge automatically"}, {"t": "li", "text": "type can represent unions, intersections, conditional types, mapped types, and tuples — more powerful for complex type compositions"}, {"t": "li", "text": "interface is better for object shapes and public API contracts (extendable, mergeable)"}, {"t": "li", "text": "type is better for unions (string | number), intersections (A & B), and computed types"}, {"t": "p", "text": "In practice: use interface for objects, use type for everything else."}, {"t": "code", "lang": "js", "lines": ["interface User { name: string; age: number; }", "interface Admin extends User { permissions: string[]; }", "", "// Declaration merging (interfaces only)", "interface Window { myPlugin: () => void; } // adds to global Window", "", "// type for unions and computed types", "type ID = string | number;", "type Status = \"pending\" | \"active\" | \"closed\";", "type UserKeys = keyof User; // \"name\" | \"age\"", "type ReadonlyUser = Readonly<User>;"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The merger often asks: \"can you extend a type with another type?\" — yes, with intersection: type AdminUser = User & { role: \"admin\" }."]}]}, {"num": "Q12", "title": "Explain TypeScript conditional types, mapped types, and template literal types.", "level": "Senior", "blocks": [{"t": "p", "text": "Conditional types: T extends U ? X : Y — like a ternary for types. Used to create type-level logic."}, {"t": "p", "text": "Mapped types: transform every property of an existing type. The syntax is { [K in keyof T]: ... }."}, {"t": "p", "text": "Template literal types: combine string literal types with template syntax to create new string types."}, {"t": "code", "lang": "js", "lines": ["// Conditional type", "type IsArray<T> = T extends any[] ? true : false;", "type A = IsArray<string[]>; // true", "type B = IsArray<string>;   // false", "", "// Mapped type (manual Partial<T>)", "type MyPartial<T> = { [K in keyof T]?: T[K] };", "", "// Template literal type", "type EventName = `on${Capitalize<string>}`;", "type EventHandler = `handle${Capitalize<\"click\" | \"submit\">}`;", "// \"handleClick\" | \"handleSubmit\"", "", "// Infer keyword in conditional types", "type ReturnType<T> = T extends (...args: any[]) => infer R ? R : never;"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["These are senior/expert-level TypeScript questions. If you can explain infer in conditional types, you will impress most interviewers."]}]}]}, {"id": "v1s2", "title": "React — Core & Hooks", "sub": "", "qs": [{"num": "Q13", "title": "What is the Virtual DOM and how does React use it?", "level": "Junior", "blocks": [{"t": "p", "text": "The Virtual DOM is a lightweight JavaScript representation of the real DOM — a tree of plain objects. React maintains this in memory."}, {"t": "p", "text": "When state changes: React re-renders the component into a new Virtual DOM tree, diffs it against the previous one (reconciliation), and calculates the minimal set of real DOM operations needed. Only those changes are applied to the real DOM (commit phase)."}, {"t": "p", "text": "This is faster than updating the real DOM directly for every change because DOM operations are expensive (layout, paint, composite) while JavaScript object comparison is cheap."}, {"t": "p", "text": "React 18 concurrent rendering: rendering can be interrupted, paused, and resumed — the virtual DOM diffing happens in chunks."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Do not say \"the Virtual DOM is faster than the DOM\" — this is an oversimplification. The correct answer is that it enables efficient batched updates and reconciliation."]}]}, {"num": "Q14", "title": "Explain the rules of React Hooks.", "level": "Junior", "blocks": [{"t": "p", "text": "React Hooks must follow two rules enforced by the eslint-plugin-react-hooks linter:"}, {"t": "li", "text": "Only call Hooks at the top level — never inside if statements, loops, or nested functions. React relies on the order of Hook calls to associate state with the correct component instance."}, {"t": "li", "text": "Only call Hooks from React functions — functional components or custom Hooks. Never from regular JS functions, class components, or event handlers."}, {"t": "p", "text": "These rules exist because React tracks Hooks by their call order. Conditional or loop-based Hook calls would break this ordering between renders."}, {"t": "code", "lang": "js", "lines": ["// WRONG — Hook inside condition", "if (isLoggedIn) { const [data, setData] = useState(null); }", "", "// CORRECT — condition inside Hook effect", "const [data, setData] = useState(null);", "useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Be ready to explain WHY the rules exist — the call-order tracking mechanism. This shows depth beyond memorising the rules."]}]}, {"num": "Q15", "title": "What is the difference between useEffect and useLayoutEffect?", "level": "Mid", "blocks": [{"t": "p", "text": "Both accept a function and dependency array. The difference is timing:"}, {"t": "li", "text": "useEffect: runs asynchronously AFTER the browser has painted — does not block the browser. Use for data fetching, subscriptions, logging."}, {"t": "li", "text": "useLayoutEffect: runs synchronously AFTER the DOM mutations but BEFORE the browser paints — blocks paint. Use for reading DOM measurements (getBoundingClientRect) and making synchronous DOM mutations to prevent flickering."}, {"t": "p", "text": "In 99% of cases, useEffect is correct. useLayoutEffect is for specific cases where you need to read the DOM and update it before the user sees the intermediate state."}, {"t": "p", "text": "On the server (Next.js SSR), useLayoutEffect causes a warning because the DOM does not exist — use useEffect for universal code."}, {"t": "code", "lang": "js", "lines": ["// useLayoutEffect: measure DOM, update before paint", "useLayoutEffect(() => {", "  const { height } = ref.current.getBoundingClientRect();", "  setHeight(height); // no flicker — runs before paint", "}, []);", "", "// useEffect: same code would cause a visible flicker", "// because it runs after the browser already painted"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A common trick question: \"when should you use useLayoutEffect in a Next.js app?\" — answer: almost never, because SSR renders on the server where there is no DOM. Use useEffect with a mounted state check instead."]}]}, {"num": "Q16", "title": "Explain React.memo, useMemo, and useCallback — when does each help?", "level": "Mid", "blocks": [{"t": "p", "text": "React.memo: wraps a COMPONENT. Prevents re-render if props have not changed (shallow comparison). Only helps if the component re-renders frequently with the same props due to its parent re-rendering."}, {"t": "p", "text": "useMemo: memoises the RESULT of an expensive computation. Returns the cached value until dependencies change. Use for expensive calculations, not for object references passed as props."}, {"t": "p", "text": "useCallback: memoises a FUNCTION reference. Returns the same function reference until dependencies change. Use when passing callbacks to memoised child components to prevent them re-rendering due to a new function reference every render."}, {"t": "p", "text": "The key insight: all three are optimisations. Premature use adds complexity without benefit. Profile first, optimise second."}, {"t": "code", "lang": "js", "lines": ["// React.memo — prevents re-render if props unchanged", "const ExpensiveList = React.memo(({ items }) => <ul>...<\/ul>);", "", "// useMemo — cache expensive calculation", "const sorted = useMemo(", "  () => items.sort((a, b) => a.price - b.price),", "  [items] // only re-sort when items changes", ");", "", "// useCallback — stable function reference for memoised child", "const handleDelete = useCallback((id) => {", "  setItems(prev => prev.filter(i => i.id !== id));", "}, []); // never changes — safe to pass to React.memo child"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know that useMemo and useCallback have a cost — the comparison itself. For cheap operations, not memoising is often faster. Always profile with React DevTools Profiler before adding these."]}]}, {"num": "Q17", "title": "What is the Context API and what are its performance implications?", "level": "Mid", "blocks": [{"t": "p", "text": "React Context provides a way to pass data through the component tree without prop drilling. createContext creates a context. The Provider makes the value available to all consumers below it."}, {"t": "p", "text": "Performance problem: when the context VALUE changes, ALL consumers re-render — even those that only use a part of the value. A single context with user data and theme data means a theme change re-renders all user-data consumers."}, {"t": "p", "text": "Solutions:"}, {"t": "li", "text": "Split contexts by update frequency (AuthContext separate from ThemeContext)"}, {"t": "li", "text": "Pass the state setter separately from the value to avoid re-renders in components that only dispatch"}, {"t": "li", "text": "Use external state managers (Zustand, Redux) for data that many components read/write frequently"}, {"t": "code", "lang": "js", "lines": ["// Splitting context to prevent unnecessary re-renders", "const AuthStateContext = createContext(null);   // user data", "const AuthDispatchContext = createContext(null); // login/logout", "", "function AuthProvider({ children }) {", "  const [user, dispatch] = useReducer(authReducer, null);", "  return (", "    <AuthStateContext.Provider value={user}>", "      <AuthDispatchContext.Provider value={dispatch}>", "        {children}", "      <\/AuthDispatchContext.Provider>", "    <\/AuthStateContext.Provider>", "  );", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A great follow-up answer: \"I would use Zustand for this instead of Context if more than 5 components consume it — Zustand only re-renders components that subscribe to the specific slice they use.\""]}]}, {"num": "Q18", "title": "How does concurrent rendering work in React 18+? Explain useTransition and useDeferredValue.", "level": "Senior", "blocks": [{"t": "callout", "kind": "warn", "title": "Terminology check", "body": ["\"Concurrent Mode\" was the name of an experimental opt-in mode that never shipped. React 18 instead introduced concurrent features — concurrent rendering is used only for updates you opt in to (useTransition, useDeferredValue, Suspense), and the whole app does not switch modes. Saying \"concurrent features\" or \"concurrent rendering\" in an interview signals current knowledge."]}, {"t": "p", "text": "Concurrent Mode enables React to interrupt, pause, abandon, and resume rendering. This makes the UI stay responsive even during heavy re-renders."}, {"t": "li", "text": "startTransition / useTransition: marks state updates as non-urgent. React can interrupt the transition render if a more urgent update (like a keypress) arrives. isPending is true while the transition is in progress."}, {"t": "li", "text": "useDeferredValue: defers re-rendering a slow part of the tree using the stale value while computing a new one. Like a React-managed debounce. Requires the slow component to be wrapped in React.memo."}, {"t": "p", "text": "The key: urgent updates (typing) are never blocked by non-urgent updates (filtering 10k items)."}, {"t": "code", "lang": "js", "lines": ["function SearchPage({ allItems }) {", "  const [query, setQuery] = useState(\"\");", "  const [filtered, setFiltered] = useState(allItems);", "  const [isPending, startTransition] = useTransition();", "", "  const handleChange = (e) => {", "    setQuery(e.target.value);       // urgent: instant", "    startTransition(() => {", "      setFiltered(expensiveFilter(allItems, e.target.value));", "    }); // non-urgent: can be interrupted", "  };", "", "  return <input value={query} onChange={handleChange} />;", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know the difference: useTransition wraps the state setter (you control the update). useDeferredValue wraps the value (used when you do not control the update, e.g. a prop from a parent)."]}]}, {"num": "Q19", "title": "How would you optimise a React application that is rendering slowly?", "level": "Senior", "blocks": [{"t": "p", "text": "A systematic approach:"}, {"t": "p", "text": "1. Measure first: use React DevTools Profiler to identify which components are re-rendering unnecessarily and how long each render takes."}, {"t": "p", "text": "2. Identify the cause: unnecessary re-renders (parent re-renders, new object references), expensive computations, large list rendering, large bundle size."}, {"t": "p", "text": "3. Fix root cause:"}, {"t": "p", "text": "• Unnecessary re-renders: React.memo + useCallback for stable callbacks"}, {"t": "p", "text": "• New object references: useMemo for objects/arrays passed as props"}, {"t": "p", "text": "• Expensive computations: useMemo"}, {"t": "p", "text": "• Large lists: react-window (virtual list — only renders visible rows)"}, {"t": "p", "text": "• Bundle size: route-based code splitting with React.lazy + Suspense"}, {"t": "p", "text": "• Slow initial load: Next.js SSR/SSG, preloading, skeleton screens"}, {"t": "code", "lang": "js", "lines": ["// Code splitting by route", "const Dashboard = React.lazy(() => import(\"./Dashboard\"));", "", "function App() {", "  return (", "    <Suspense fallback={<Skeleton />}>", "      <Dashboard />", "    <\/Suspense>", "  );", "}", "", "// Virtual list for 10,000 items", "import { FixedSizeList } from \"react-window\";", "const Row = ({ index, style }) => <div style={style}>Item {index}<\/div>;", "<FixedSizeList height={400} itemCount={10000} itemSize={35}>", "  {Row}", "<\/FixedSizeList>"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Structure your answer as: Measure → Identify → Fix. Never jump to solutions without profiling first. This shows engineering maturity."]}]}, {"num": "Q20", "title": "Explain React's reconciliation algorithm (the \"diffing\" algorithm).", "level": "Expert", "blocks": [{"t": "p", "text": "React's reconciliation uses two heuristics to make O(n) tree comparison (instead of O(n³) for a general tree diff):"}, {"t": "p", "text": "1. Different types produce different trees: if the root element type changes (div → span), React tea
