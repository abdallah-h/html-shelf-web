st Recently Used) cache in JavaScript.", "level": "Expert", "blocks": [{"t": "p", "text": "LRU cache evicts the least recently used item when capacity is exceeded. Operations must be O(1): get and put."}, {"t": "p", "text": "Solution: doubly linked list (for O(1) head/tail operations) + HashMap (for O(1) lookup by key)."}, {"t": "p", "text": "The Map maintains insertion order in JavaScript — we can use it as both hash map and linked list proxy, making the implementation much cleaner than a raw doubly linked list."}, {"t": "code", "lang": "js", "lines": ["class LRUCache {", "  constructor(capacity) {", "    this.capacity = capacity;", "    this.cache = new Map(); // maintains insertion order", "  }", "", "  get(key) {", "    if(!this.cache.has(key)) return -1;", "    // Move to end (most recently used)", "    const value = this.cache.get(key);", "    this.cache.delete(key);", "    this.cache.set(key, value); // re-insert at end", "    return value;", "  }", "", "  put(key, value) {", "    if(this.cache.has(key)) {", "      this.cache.delete(key); // remove to re-insert at end", "    } else if(this.cache.size >= this.capacity) {", "      // Evict least recently used (first entry in Map)", "      const lruKey = this.cache.keys().next().value;", "      this.cache.delete(lruKey);", "    }", "    this.cache.set(key, value); // insert at end (most recently used)", "  }", "", "  has(key) { return this.cache.has(key); }", "  size() { return this.cache.size; }", "}", "", "// Usage: caching API responses", "const cache = new LRUCache(100);", "", "async function getCachedUser(id) {", "  if(cache.has(id)) return cache.get(id);", "  const user = await User.findById(id);", "  cache.put(id, user);", "  return user;", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The JavaScript Map maintains insertion order — keys().next().value gives the oldest entry (LRU). This makes LRU with Map much simpler than a doubly linked list + hash map. Mentioning this shows deep JS knowledge."]}]}]}], "extras": [{"id": "v2x0", "title": "Question Count by Domain — Both Volumes", "blocks": [{"t": "table", "rows": [["Domain", "Distribution", "Total"], ["JavaScript Core & Advanced", "Vol 1: 7, Vol 2: 6", "13 questions"], ["TypeScript", "Vol 1: 4, Vol 2: 3", "7 questions"], ["React Core & Advanced", "Vol 1: 8, Vol 2: 7", "15 questions"], ["Next.js", "Vol 1: 4, Vol 2: 0", "4 questions"], ["Node.js Runtime", "Vol 1: 3, Vol 2: 3", "6 questions"], ["Express & REST API", "Vol 1: 3, Vol 2: 2", "5 questions"], ["MongoDB & Mongoose", "Vol 1: 4, Vol 2: 4", "8 questions"], ["Security", "Vol 1: 4, Vol 2: 2", "6 questions"], ["Testing Strategy", "Vol 1: 3, Vol 2: 3", "6 questions"], ["State Management", "Vol 1: 2, Vol 2: 0", "2 questions"], ["Performance & Optimisation", "Vol 1: 2, Vol 2: 2", "4 questions"], ["System Design", "Vol 1: 3, Vol 2: 3", "6 questions"], ["DevOps & CI/CD", "Vol 1: 3, Vol 2: 2", "5 questions"], ["GraphQL", "Vol 1: 0, Vol 2: 2", "2 questions"], ["Real-Time & WebSockets", "Vol 1: 0, Vol 2: 2", "2 questions"], ["Payments & Integrations", "Vol 1: 0, Vol 2: 1", "1 question"], ["Accessibility & i18n", "Vol 1: 0, Vol 2: 1", "1 question"], ["Live Coding Challenges", "Vol 1: 0, Vol 2: 3", "3 questions"], ["TOTAL", "", "201 questions"]]}]}]}, {"vol": "Volume 3 — 2026 Additions", "extras": [], "sections": [{"id": "v3s0", "title": "Modern React & React 19", "sub": "Actions, RSC, Compiler — added by this guide", "qs": [{"num": "B1", "title": "What problems do React 19 Actions solve compared to manual event handlers?", "level": "Mid", "blocks": [{"t": "p", "text": "Before Actions, every mutation needed hand-rolled state: isLoading, error, optimistic value, and a try/catch in an onSubmit handler. Actions move that into React: pass an async function to form action (or run it in startTransition) and React tracks pending state, surfaces errors to the nearest boundary or useActionState, batches the transition, and coordinates optimistic updates via useOptimistic."}, {"t": "li", "text": "useActionState(action, initial) → [state, formAction, isPending]"}, {"t": "li", "text": "useFormStatus() lets a nested submit button read the parent form's pending state without prop drilling."}, {"t": "li", "text": "Forms with actions work before hydration — progressive enhancement for free in frameworks."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Frame it as \"React 19 made the mutation lifecycle a framework concern instead of userland boilerplate\" — then name the three hooks: useActionState, useFormStatus, useOptimistic."]}]}, {"num": "B2", "title": "Explain React Server Components. How do they differ from SSR?", "level": "Senior", "blocks": [{"t": "p", "text": "RSC is a component-level split between server and client. Server Components execute only on the server, can access backend resources directly, and are never shipped to the browser — they serialise to a stream the client merges into the tree. Client Components (\"use client\") ship JS and hydrate as usual."}, {"t": "li", "text": "SSR: renders initial HTML, but every component's JS still downloads and hydrates. RSC: server-only components contribute zero bundle bytes and never re-run on the client."}, {"t": "li", "text": "They compose: an RSC app is still SSR'd for first paint; the technologies stack."}, {"t": "li", "text": "Constraints: no hooks/state/effects in Server Components; props crossing the boundary must be serialisable."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The one-liner that lands: \"SSR is about where the first render happens; RSC is about where the component lives.\""]}]}, {"num": "B3", "title": "What does the React Compiler do, and what does it require from your code?", "level": "Senior", "blocks": [{"t": "p", "text": "It is a build-time optimiser that auto-memoises: it analyses each component, determines what each value depends on, and inserts fine-grained caching so components skip re-rendering when inputs are unchanged — the effect of useMemo/useCallback/React.memo everywhere, without the annotations."}, {"t": "p", "text": "Requirement: components must follow the Rules of React — pure during render, no mutating props/state/values previously passed to JSX, hooks called unconditionally. Violations make the compiler skip (or mis-optimise) that component; the eslint-plugin-react-compiler rule flags them."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Do not claim manual memoisation is obsolete — legacy codebases and library authors still need it. Say the default is shifting from \"memoise manually after profiling\" to \"write rule-following code and let the compiler do it.\""]}]}]}, {"id": "v3s1", "title": "Modern Backend & Runtime", "sub": "Express 5, Node 22, edge — added by this guide", "qs": [{"num": "B4", "title": "What changed in Express 5 error handling and routing?", "level": "Mid", "blocks": [{"t": "p", "text": "The headline: rejected promises from async middleware/handlers are automatically forwarded to error-handling middleware, eliminating the try { } catch (e) { next(e) } wrapper on every async route — the single most common Express 4 bug (unhandled rejection hanging the request) disappears."}, {"t": "li", "text": "Routing: optional params are /users{/:id} instead of /users/:id?; wildcards must be named (*splat); string regex shortcuts removed to prevent ReDoS."}, {"t": "li", "text": "Removed legacy API: app.del, res.sendfile, res.redirect(\"back\"); Node 18+ required."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["If asked \"how do you handle async errors in Express\", give the version-aware answer: wrapper/next(err) in v4, automatic in v5 — it signals you actually track the ecosystem."]}]}, {"num": "B5", "title": "Node's built-in test runner vs Jest — when is each the right choice?", "level": "Mid", "blocks": [{"t": "p", "text": "node:test ships with the runtime: zero dependencies, fast startup, native ESM, watch mode, coverage, mocking (mock.method, mock.timers), and TAP/spec reporters. It is ideal for backend/service code."}, {"t": "p", "text": "Jest (or Vitest) still wins for frontend: jsdom environment, snapshot testing, the Testing Library ecosystem, rich watch UX, and transform pipelines. Vitest is usually chosen over Jest in Vite projects for speed and shared config."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Strong answer shape: node:test for Node services, Vitest for Vite/React code, Playwright for E2E — and note Jest's ESM support has always been its weak point."]}]}, {"num": "B6", "title": "Edge runtime vs Node runtime — how do you choose per route?", "level": "Senior", "blocks": [{"t": "p", "text": "Edge runtimes (V8 isolates on a CDN PoP) give near-zero cold start and run close to the user, but expose only Web APIs — no native Node modules, no TCP, limited memory/CPU. Node runtime (serverless function or container) supports the full ecosystem, including the MongoDB driver and Mongoose."}, {"t": "li", "text": "Edge: middleware, auth token checks, redirects/rewrites, A/B bucketing, streaming AI proxying via HTTP."}, {"t": "li", "text": "Node: anything touching MongoDB with the native driver, heavy CPU, large payloads, long-running work."}, {"t": "li", "text": "Database access from edge requires an HTTP-based data API or an edge-compatible driver — a classic gotcha."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention the concrete failure mode: deploying a Mongoose route to the edge crashes because the driver needs TCP sockets. Naming real constraints beats reciting definitions."]}]}, {"num": "B19", "title": "How do Node streams and backpressure work, and when must an API stream?", "level": "Senior", "blocks": [{"t": "p", "text": "Streams move data in chunks through bounded buffers. Backpressure is the flow control: when a writable's buffer passes highWaterMark, write() returns false; the producer should pause until \"drain\". pipe()/pipeline() implement this handshake for you — pipeline also propagates errors and destroys all streams on failure, which raw pipe() does not."}, {"t": "li", "text": "Must stream: any response whose size grows with data (exports, reports, file downloads/uploads, LLM tokens). Buffering these is an OOM waiting for a big customer."}, {"t": "li", "text": "MERN tie-in: Mongoose .cursor() streams query results; pipe it through a Transform into res."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Name the failure concretely: \"a 2 GB export via res.json needs 2 GB of heap per concurrent request; streamed, it needs ~64 KB.\" Numbers make the answer senior."]}]}, {"num": "B20", "title": "Your Node service maxes one CPU core. Walk through scaling it.", "level": "Senior", "blocks": [{"t": "li", "text": "First diagnose: I/O-bound (event loop mostly idle, waiting on DB) or CPU-bound (loop blocked)? Fixes differ completely."}, {"t": "li", "text": "I/O-bound: cluster/PM2 across cores, then horizontal instances behind a load balancer. Precondition: no in-process state — sessions, cache, socket rooms move to Redis."}, {"t": "li", "text": "CPU-bound: move the work off the loop — worker_threads for latency-sensitive tasks, a Redis-backed queue (BullMQ) with separate worker processes for everything else."}, {"t": "li", "text": "Then the boring wins: fix N+1 queries and missing indexes, add caching, enable compression — most \"scaling problems\" are database problems wearing a costume."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Saying \"I'd profile before scaling — clinic.js or --inspect flame graph\" first is worth more than the whole horizontal-scaling speech."]}]}]}, {"id": "v3s2", "title": "AI-Enabled MERN", "sub": "Streaming, RAG, vector search — added by this guide", "qs": [{"num": "B7", "title": "Design the architecture for streaming an LLM response into a React UI.", "level": "Senior", "blocks": [{"t": "p", "text": "Three parts. (1) Server route holds the API key, calls the model with stream: true, and forwards deltas as Server-Sent Events (or a raw streamed body). (2) Client reads response.body.getReader(), decodes chunks, and appends to state — batching updates (e.g. per animation frame or via startTransition) so 50 tokens/sec doesn't mean 50 re-renders/sec. (3) An AbortController wired to the stop button and component unmount cancels both fetch and upstream model call."}, {"t": "li", "text": "SSE vs WebSocket: SSE is one-directional and enough for token streaming; it survives proxies and auto-reconnects. Use WebSockets only for bidirectional needs."}, {"t": "li", "text": "Persist the full transcript server-side after the stream ends; treat client-rendered markdown as untrusted (sanitise)."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Bonus points for mentioning backpressure (await res.write / flush behaviour) and rate-limiting the endpoint per user, since AI calls are expensive."]}]}, {"num": "B8", "title": "What is RAG and how would you implement it on the MERN stack?", "level": "Senior", "blocks": [{"t": "p", "text": "Retrieval-Augmented Generation grounds the model in your own data: at question time you retrieve the most relevant documents and place them in the prompt, so answers cite real content instead of hallucinating. Pipeline: chunk documents (~500-1000 tokens with overlap) → create embeddings → store vectors alongside documents in MongoDB Atlas → $vectorSearch top-k at query time → build prompt with retrieved context → stream the answer."}, {"t": "li", "text": "Atlas Vector Search keeps vectors in the same collection as source docs — one database, transactional metadata, pre-filtering with $match on tenant/user."}, {"t": "li", "text": "Evaluate retrieval separately from generation: bad answers are usually bad retrieval."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Interviewers probe multi-tenancy: show you'd add a filter clause on tenantId inside $vectorSearch so users can never retrieve each other's documents."]}]}]}, {"id": "v3s3", "title": "System Design Walkthroughs", "sub": "Full answers you can rehearse out loud — added by this guide", "qs": [{"num": "B9", "title": "Design a URL shortener (bit.ly) on the MERN stack.", "level": "Senior", "blocks": [{"t": "p", "text": "Structure your answer: requirements → API → data model → the hard part (code generation) → reads at scale."}, {"t": "li", "text": "Requirements: shorten URL, redirect fast, optional custom alias, click analytics, expiry. Scale assumption: write-light, read-heavy (100:1)."}, {"t": "li", "text": "API: POST /api/urls {longUrl, alias?} → {shortCode}; GET /:code → 301/302 redirect; GET /api/urls/:code/stats."}, {"t": "li", "text": "Code generation: base62-encode an auto-incrementing counter (7 chars ≈ 3.5 trillion codes) — no collisions by construction. Random codes need an existence check loop; hashing the URL breaks when two users shorten the same URL with different expiry."}, {"t": "li", "text": "Redirect path: cache hot codes in Redis (code → longUrl), fall back to MongoDB with a unique index on code. 302 if you want analytics on every hit, 301 to let browsers cache."}, {"t": "li", "text": "Analytics: don't block the redirect — push click events to a queue and $inc counters in a background worker; TTL index for expiring links."}, {"t": "code", "lang": "js", "lines": ["// urls collection", "{ _id, code: \"aZ3k9Qp\",   // unique index", "  longUrl, ownerId, createdAt,", "  expiresAt,               // TTL index", "  clicks: 0 }", "// counter via Redis INCR or a findOneAndUpdate({$inc:{seq:1}}) counters doc"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Say the trade-off out loud: \"301 is cheaper but browsers cache it and I lose analytics; I'd use 302 while analytics matter.\" Naming a trade-off unprompted is what separates senior answers."]}]}, {"num": "B10", "title": "Design a real-time chat application.", "level": "Senior", "blocks": [{"t": "li", "text": "Transport: WebSockets (Socket.io) for bidirectional messaging; SSE is not enough because clients send too."}, {"t": "li", "text": "Model: conversations (participants, lastMessageAt) + messages (conversationId, senderId, body, createdAt) with compound index {conversationId: 1, createdAt: -1} for history pagination."}, {"t": "li", "text": "Delivery flow: client emits → server validates membership → persist message → broadcast to the conversation room → receivers ack; sender UI is optimistic with a pending state."}, {"t": "li", "text": "Scale past one server: a Redis pub/sub adapter fans out events across Socket.io nodes; sticky sessions or a connection-aware load balancer."}, {"t": "li", "text": "Presence & receipts: heartbeat updates lastSeenAt in Redis with TTL; read receipts as per-participant lastReadMessageId — cheaper than per-message flags."}, {"t": "li", "text": "Offline & sync: on reconnect, client sends its latest message timestamp per conversation and the server returns the delta."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The follow-up is always \"what if a server dies?\" — answer: sockets reconnect to another node, missed messages recovered by the delta-sync query, so correctness never depends on the socket layer."]}]}, {"num": "B11", "title": "Design the cart & checkout for an e-commerce site — how do you prevent overselling?", "level": "Expert", "blocks": [{"t": "p", "text": "The heart of this question is inventory correctness under concurrency; everything else is scaffolding."}, {"t": "li", "text": "Cart: persistent carts collection per user (survives devices), items embedded [{productId, qty, priceAtAdd}]; guest carts keyed by session id and merged at login."}, {"t": "li", "text": "Overselling fix: atomic conditional decrement — findOneAndUpdate({_id, stock: {$gte: qty}}, {$inc: {stock: -qty}}). If it returns null, stock ran out; no read-then-write race is possible."}, {"t": "li", "text": "Checkout: multi-document transaction covering stock decrement + order creation; reservation with a 15-minute TTL releases stock if payment stalls."}, {"t": "li", "text": "Payment: create a payment-intent with the provider, confirm client-side, finalise the order in the webhook — never trust the client's \"payment succeeded\". Make the webhook idempotent (store processed event ids)."}, {"t": "code", "lang": "js", "lines": ["const session = await mongoose.startSession();", "await session.withTransaction(async () => {", "  for (const item of cart.items) {", "    const r = await Product.updateOne(", "      { _id: item.productId, stock: { $gte: item.qty } },", "      { $inc: { stock: -item.qty } }, { session });", "    if (r.modifiedCount === 0) throw new OutOfStockError(item.productId);", "  }", "  await Order.create([{ userId, items: cart.items, status: \"pending_payment\" }], { session });", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Lead with the conditional $inc — it shows you know MongoDB's single-document atomicity. Then add transactions for the multi-document step. That ordering signals you reach for the cheapest correct tool first."]}]}, {"num": "B12", "title": "Design a file upload service (avatars, documents) for a MERN app.", "level": "Senior", "blocks": [{"t": "li", "text": "Golden rule: files go to object storage (S3/R2/GCS), never into MongoDB or the app server disk; the database stores metadata only."}, {"t": "li", "text": "Presigned upload flow: client asks your API for a presigned URL → API validates type/size and returns URL + key → browser PUTs directly to storage → client confirms → API verifies the object and saves metadata. Your server never proxies file bytes."}, {"t": "li", "text": "Metadata doc: {key, ownerId, mime, size, status: \"pending\"→\"ready\", createdAt}; a cleanup job deletes \"pending\" uploads older than a day."}, {"t": "li", "text": "Safety: allowlist MIME types and verify magic bytes server-side, cap size in the presign policy, randomise keys (never user filenames), serve via CDN with signed URLs for private files."}, {"t": "li", "text": "Images: background worker (queue) generates thumbnails/webp variants after upload; original stays immutable."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The phrase \"presigned URL\" is the checkpoint — without it, interviewers assume you'd stream uploads through Express and melt the server. Mention multer only as the small-scale alternative."]}]}]}, {"id": "v3s4", "title": "Behavioral & Career", "sub": "STAR frameworks tuned to the NetSuite → full-stack story — added by this guide", "qs": [{"num": "B13", "title": "\"Tell me about yourself.\" — the 90-second version.", "level": "Junior", "blocks": [{"t": "p", "text": "Structure: present → past → future, ending on why this role. Rehearse until it sounds unrehearsed."}, {"t": "li", "text": "Present: \"I'm a NetSuite consultant who builds JavaScript customisations daily — SuiteScript, integrations, business logic for ERP workflows.\""}, {"t": "li", "text": "Past: \"Over the last year I completed a structured 12-month MERN program: React 19, Node/Express, MongoDB, TypeScript, with N deployed projects including <capstone>.\""}, {"t": "li", "text": "Future: \"I'm looking for a full-stack role where the ERP domain knowledge and the modern stack combine — teams building business software is exactly that.\""}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Never narrate your CV chronologically. The consultant background is a differentiator — you've shipped code that ran real businesses. Say that sentence."]}]}, {"num": "B14", "title": "\"Why are you moving from NetSuite consulting to full-stack development?\"", "level": "Junior", "blocks": [{"t": "p", "text": "Frame it as running toward, not away. Danger words: \"bored\", \"stuck\", \"NetSuite is limiting\"."}, {"t": "li", "text": "Toward: broader problems, owning products end to end, modern engineering practice (testing, CI/CD, code review culture)."}, {"t": "li", "text": "Continuity: \"It's an evolution — I already write JavaScript for a living; I've expanded from customising one platform to building complete applications.\""}, {"t": "li", "text": "Proof of commitment: the 12-month self-directed program, shipped projects, and (if true) production integrations between NetSuite and custom MERN services."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Expect the follow-up \"would you go back to consulting?\" — answer that you'd happily be the bridge: teams integrating with ERPs rarely have someone who knows both sides."]}]}, {"num": "B15", "title": "Describe a conflict with a colleague or client and how you resolved it.", "level": "Mid", "blocks": [{"t": "p", "text": "STAR with the weight on Action. Pick a disagreement about approach, not a personality clash, and end with a relationship intact."}, {"t": "li", "text": "Situation/Task: e.g. a client demanded a customisation you believed would corrupt data integrity, on a deadline."}, {"t": "li", "text": "Action: understood their underlying goal first, demonstrated the risk concretely (test environment, numbers), proposed an alternative meeting the goal, escalated transparently when needed."}, {"t": "li", "text": "Result: quantify — hours saved, incident avoided, client renewed. State what you'd do differently; self-awareness scores points."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["One sentence of Situation, one of Task, four of Action, one of Result. Most candidates invert that ratio and run out of time before the interesting part."]}]}, {"num": "B16", "title": "Tell me about a significant mistake you made and what you learned.", "level": "Mid", "blocks": [{"t": "li", "text": "Pick a real technical mistake with real consequences — a sandbox-vs-production mixup, a script that mass-updated wrong records, a deploy without a rollback plan. Trivial \"mistakes\" (perfectionism in disguise) fail this question."}, {"t": "li", "text": "Own it in first person: \"I deployed\", not \"the process allowed\". Describe detection, immediate containment, and the honest conversation with the stakeholder."}, {"t": "li", "text": "The lesson must be systemic: \"I now write a rollback step before any migration\" beats \"I'm more careful now\"."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Interviewers are testing blame reflexes and whether your fixes are process-level. A candidate who built a checklist out of a failure is more hireable than one who never failed."]}]}, {"num": "B17", "title": "How do you handle competing deadlines and pressure?", "level": "Mid", "blocks": [{"t": "li", "text": "Give a system, then a story. System: make the conflict visible early, force explicit prioritisation with the stakeholders (never silently decide), cut scope before cutting quality, communicate slips the moment they're known."}, {"t": "li", "text": "Story: two clients, one go-live week — show the triage conversation, what got descoped, and that both stakeholders felt informed rather than surprised."}, {"t": "li", "text": "For dev roles, connect to engineering practice: small PRs, feature flags, and CI keep pressure from turning into broken main branches."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The phrase interviewers want to hear: \"I don't absorb the conflict silently — I surface it and make the trade-off a shared decision.\""]}]}, {"num": "B18", "title": "What questions should you ask the interviewer?", "level": "Junior", "blocks": [{"t": "p", "text": "Always have 3-4 ready; asking nothing reads as low interest. Best questions reveal how the team actually works:"}, {"t": "li", "text": "\"Walk me through how a feature goes from idea to production here — who writes the ticket, who reviews, how do you deploy?\""}, {"t": "li", "text": "\"What does the first 90 days look like for this role? How do you measure that it's going well?\""}, {"t": "li", "text": "\"What's the current biggest source of engineering pain — tech debt, tooling, process?\" (their answer tells you everything)"}, {"t": "li", "text": "\"How much of the stack is TypeScript / tested / on modern React?\" — signals you care about code health."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Skip questions answerable from the website, and never open with compensation — recruiters handle that stage. End with: \"Is there anything about my background that gives you hesitation I could address now?\" It converts silent objections into a conversation."]}]}]}, {"id": "v3s5", "title": "Live Coding — Implement From Scratch", "sub": "The classics, with the follow-ups interviewers ask — added by this guide", "qs": [{"num": "B21", "title": "Implement debounce. Then add leading/trailing options and cancel.", "level": "Mid", "blocks": [{"t": "p", "text": "The base version is four lines; the interview is in the follow-ups. Keep the timer in the closure, use a normal function so `this` can be forwarded, and apply args at call time."}, {"t": "code", "lang": "js", "lines": ["function debounce(fn, ms = 300, { leading = false, trailing = true } = {}) {", "  let timer = null;", "  function debounced(...args) {", "    const callNow = leading && timer === null;", "    clearTimeout(timer);", "    timer = setTimeout(() => {", "      timer = null;", "      if (trailing && !callNow) fn.apply(this, args);", "    }, ms);", "    if (callNow) fn.apply(this, args);", "  }", "  debounced.cancel = () => { clearTimeout(timer); timer = null; };", "  return debounced;", "}"]}, {"t": "li", "text": "Follow-up \"debounce vs throttle?\": debounce waits for silence (search-as-you-type); throttle guarantees a steady rate (scroll, resize). Both cap work; only throttle guarantees execution during continuous input."}, {"t": "li", "text": "Follow-up \"how do you test it?\": fake timers — vi.useFakeTimers(), call twice, advance by ms, assert the callback ran once."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Say why it is a normal function and not an arrow: arrows have no own `this`, so `fn.apply(this, args)` could not forward the caller's context. That one sentence is the whole point of the question."]}]}, {"num": "B22", "title": "Write deepClone. What breaks in the naive version?", "level": "Mid", "blocks": [{"t": "p", "text": "The naive JSON.parse(JSON.stringify(x)) silently destroys data: undefined and functions vanish, Dates become strings, Map/Set become {}, NaN/Infinity become null, and circular references throw."}, {"t": "li", "text": "A correct implementation handles: primitives, arrays, plain objects, Date, Map, Set, RegExp — and cycles, via a WeakMap of seen objects (see Chapter M for the full version)."}, {"t": "li", "text": "Modern answer: structuredClone() is built into browsers and Node 17+ and handles all of the above (though not functions or DOM nodes). Say this — then write the manual version anyway, because they want the recursion."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Ask \"should this handle cycles?\" before coding. The candidate who identifies the cycle problem unprompted is the one who gets the offer."]}]}, {"num": "B23", "title": "Implement Promise.all, then a concurrency-limited pool.", "level": "Senior", "blocks": [{"t": "p", "text": "Promise.all: resolve when all fulfil, preserving input order; reject on the first rejection. The trap is using push() instead of index assignment — results must keep positional order regardless of completion order."}, {"t": "li", "text": "Edge cases to mention: an empty array resolves immediately; non-promise values must be wrapped with Promise.resolve(); resolve only after the counter equals length (not on each settle)."}, {"t": "li", "text": "The senior follow-up is the pool: run 1,000 tasks with at most 5 in flight — Promise.all would open 1,000 sockets and get you rate-limited. Track a running Set and await Promise.race(running) when full (full code in Chapter M)."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Connect it to real work: \"this is exactly what I use against the NetSuite REST API, which enforces concurrency limits.\" Turning a puzzle into production experience is the strongest move you have."]}]}, {"num": "B24", "title": "Given nested category data, flatten it to a list with depth. Then invert it.", "level": "Mid", "blocks": [{"t": "p", "text": "Tree traversal disguised as a real ticket — this is the most common \"practical\" live-coding task in product interviews."}, {"t": "code", "lang": "js", "lines": ["// Tree -> flat list (DFS, pre-order)", "const flatten = (nodes, depth = 0, out = []) => {", "  for (const n of nodes) {", "    out.push({ id: n.id, name: n.name, parentId: n.parentId ?? null, depth });", "    if (n.children?.length) flatten(n.children, depth + 1, out);", "  }", "  return out;", "};", "", "// Flat list -> tree, O(n) with a lookup map (the inverse, often the follow-up)", "function toTree(rows) {", "  const byId = new Map(rows.map(r => [r.id, { ...r, children: [] }]));", "  const roots = [];", "  for (const node of byId.values()) {", "    const parent = node.parentId != null ? byId.get(node.parentId) : null;", "    (parent ? parent.children : roots).push(node);", "  }", "  return roots;", "}"]}, {"t": "li", "text": "Complexity: both are O(n) time and O(n) space. Mention that recursion depth is bounded by tree height — for a 10k-deep tree you would switch to an explicit stack."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Ask whether the input can contain orphans or cycles. Real data does, and handling \"parent not found\" gracefully instead of crashing is the senior differentiator."]}]}]}]}], "quickref": [{"id": "qr1", "title": "JavaScript Essentials", "sub": "Cheat sheet", "blocks": [{"t": "callout", "kind": "info", "title": "How to use the cheat sheets", "body": ["These pages compress the full reference into scannable tables. Use them for pre-interview review and day-to-day lookups; follow the roadmap weeks for actual learning."]}, {"t": "subhead", "text": "Array methods"}, {"t": "table", "rows": [["Method", "Returns", "Use for"], ["map(fn)", "new array", "transform every element"], ["filter(fn)", "new array", "keep elements passing a test"], ["reduce(fn, init)", "single value", "fold into sum/object/map"], ["find(fn) / findIndex(fn)", "element / index", "first match"], ["some(fn) / every(fn)", "boolean", "any / all pass"], ["includes(x)", "boolean", "membership check"], ["flat(n) / flatMap(fn)", "new array", "flatten nested arrays"], ["slice(a, b)", "new array", "copy a range (non-mutating)"], ["splice(i, n, ...items)", "removed items", "insert/remove in place (mutates!)"], ["sort(cmp) / toSorted(cmp)", "same / new array", "sort — toSorted avoids mutation"], ["at(-1)", "element", "last element without length math"], ["Array.from(x, fn)", "new array", "from iterables / array-likes"], ["Object.groupBy(arr, fn)", "object", "group elements by key (ES2024)"]]}, {"t": "subhead", "text": "Object utilities"}, {"t": "table", "rows": [["Pattern", "Example"], ["Keys / values / entries", "Object.keys(o) · Object.values(o) · Object.entries(o)"], ["Build from entries", "Object.fromEntries(map)"], ["Shallow merge / clone", "{ ...a, ...b } · structuredClone(o) for deep"], ["Freeze", "Object.freeze(o) — shallow immutability"], ["Optional chaining", "user?.address?.city — undefined instead of throw"], ["Nullish coalescing", "value ?? fallback — only null/undefined trigger fallback"], ["Destructure + default + rename", "const { name: n = \"anon\", ...rest } = user"], ["Computed keys", "{ [`${type}Id`]: 42 }"]]}, {"t": "subhead", "text": "Async patterns"}, {"t": "code", "lang": "js", "lines": ["// Sequential vs parallel", "const a = await getA(); const b = await getB();      // sequential (slow)", "const [x, y] = await Promise.all([getA(), getB()]);  // parallel", "", "// Tolerate individual failures", "const results = await Promise.allSettled(jobs);", "results.filter(r => r.status === \"fulfilled\").map(r => r.value);", "", "// First to succeed / first to settle", "await Promise.any(mirrors);   // first fulfilled", "await Promise.race([fetchData(), timeout(5000)]);    // timeout pattern", "", "// Async iteration", "for await (const chunk of stream) process(chunk);"]}, {"t": "subhead", "text": "Equality & coercion traps"}, {"t": "table", "rows": [["Expression", "Result", "Why"], ["0.1 + 0.2 === 0.3", "false", "binary floating point — compare with epsilon"], ["[] == false", "true", "[] → \"\" → 0; use === always"], ["typeof null", "\"object\"", "historic bug — check x === null"], ["NaN === NaN", "false", "use Number.isNaN(x) or Object.is"], ["\"5\" + 3 vs \"5\" - 3", "\"53\" vs 2", "+ concatenates with strings, - coerces to number"]]}, {"t": "callout", "kind": "tip", "title": "One-line rules", "body": ["Always ===. const by default. Never mutate props/state. Prefer toSorted/toReversed over sort/reverse when you need the original."]}]}, {"id": "qr2", "title": "React Quick Reference", "sub": "Cheat sheet", "blocks": [{"t": "subhead", "text": "Hooks at a glance"}, {"t": "table", "rows": [["Hook", "Purpose"], ["useState", "local state; setter accepts value or updater fn"], ["useReducer", "complex state transitions with a reducer"], ["useEffect", "sync with external systems; cleanup on return"], ["useLayoutEffect", "measure DOM before paint (rare)"], ["useContext / use(Context)", "read context; use() works conditionally"], ["useRef", "mutable box that survives renders; DOM refs"], ["useMemo / useCallback", "cache values / functions (React Compiler is replacing these)"], ["useTransition / useDeferredValue", "mark updates non-urgent; keep UI responsive"], ["useActionState", "form action + pending + result state (React ation by its inputs; useMemo / React.memo / the React Compiler"], ["Middleware", "function in the request pipeline with access to req, res, next (interview)"], ["Monorepo", "many packages in one repository, managed with workspaces (pnpm, Turborepo)"], ["N+1 problem", "one query plus one per result row; fix with $lookup, populate batching, or joins (interview)"], ["Normalisation vs embedding", "referencing documents vs nesting them — the core MongoDB schema decision (interview)"], ["ODM / ORM", "object-document/relational mapper: Mongoose for MongoDB, Prisma for SQL"], ["Optimistic UI", "show the expected result immediately, reconcile when the server responds"], ["Prop drilling", "passing props through layers that don't use them; fixed by composition or context (interview)"], ["Race condition", "outcome depends on operation ordering; guard with atomic ops, transactions, or versioning"], ["RAG", "retrieval-augmented generation: fetch relevant docs, include them in an LLM prompt"], ["Reconciliation", "React diffing the new element tree against the old to compute minimal DOM updates (interview)"], ["Replica set", "MongoDB cluster of primary + secondaries for failover and read scaling"], ["REST", "API style using HTTP methods on noun resources with status-code semantics"], ["Sharding", "horizontal partitioning of data across servers by a shard key (interview)"], ["SPA", "single-page application: one HTML shell, client-side routing — like this guide"], ["SSE", "server-sent events: one-way streaming over HTTP, ideal for LLM token streams"], ["Suspense", "React boundary showing a fallback while children load (lazy code, use() promises)"], ["Transaction", "multi-operation unit that commits or rolls back together; multi-document in MongoDB 4+"], ["TTL index", "MongoDB index auto-deleting documents after a time — sessions, caches"], ["Virtual DOM", "in-memory element tree React diffs before touching the real DOM (interview)"], ["WebSocket", "persistent bidirectional connection <script>
const DATA = JSON.parse(document.getElementById('data').textContent);

/* ---------- model ---------- */
const PHASE_COLOR = {1:'var(--p1)',2:'var(--p2)',3:'var(--p3)',4:'var(--p4)'};
const LEARN = []; // ordered pages
DATA.phases.forEach(ph => {
  ph.pages.forEach(pg => LEARN.push({...pg, group:`Phase ${ph.n}`, groupSub:`Months ${ph.months}`, color:PHASE_COLOR[ph.n], phase:ph}));
});
DATA.chapters.forEach(pg => LEARN.push({...pg, group:'Reference chapters', color:'var(--chap)', isNew: ['pgH','pgI','pgJ','pgK','pgL','pgM','pgN'].includes(pg.id)}));
(DATA.quickref||[]).forEach(pg => LEARN.push({...pg, group:'Quick reference', color:'var(--qr)', isNew:true}));
const PAGE_BY_ID = Object.fromEntries(LEARN.map(p => [p.id, p]));

const CAPSTONES = [];
LEARN.forEach(p=>p.blocks.forEach((b,bi)=>{
  if(b.t==='callout'&&b.kind==='capstone') CAPSTONES.push({key:p.id+':'+bi, page:p, title:b.title, body:b.body});
}));

const SECS = [];
DATA.volumes.forEach((v,vi) => {
  v.sections.forEach(s => SECS.push({...s, vol:v.vol, vi, isNew: vi===2}));
  (v.extras||[]).forEach(e => SECS.push({id:e.id, title:e.title, sub:'', vol:v.vol, vi, qs:[], extra:e}));
});
const SEC_BY_ID = Object.fromEntries(SECS.map(s => [s.id, s]));
const ALL_Q = [];
SECS.forEach(s => (s.qs||[]).forEach(q => ALL_Q.push({...q, uid:s.id+'/'+q.num, sec:s})));

const state = {
  mode:'learn', done:new Set(), known:new Set(), marks:new Set(), built:new Set(),
  lvls:new Set(), open:new Set(), collapsed:new Set(), theme:'dark',
  drill:{active:false, queue:[], idx:0, revealed:false, got:0, again:0, lvls:new Set(), misses:{}},
};

/* ---------- utils ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $ = sel => document.querySelector(sel);

const KW = /\b(const|let|var|function|return|if|else|for|while|of|in|new|class|extends|import|from|export|default|async|await|try|catch|finally|throw|switch|case|break|continue|typeof|instanceof|this|null|undefined|true|false|yield|static|get|set|delete|void|do|super|interface|type|enum|implements|readonly|public|private|protected|namespace|declare|keyof|infer|as|is|FROM|RUN|CMD|COPY|WORKDIR|EXPOSE|ENV|ENTRYPOINT)\b/g;
const HASH_LANGS = new Set(['yaml','shell','docker','nginx','graphql','text']);
const LANG_LABEL = {js:'JavaScript',html:'HTML',css:'CSS',shell:'Shell',docker:'Dockerfile',yaml:'YAML',
  nginx:'nginx',graphql:'GraphQL',rules:'Firestore rules',text:'Snippet'};
function highlight(src, lang){
  const e = esc(src);
  const hash = HASH_LANGS.has(lang);
  const tokenRe = hash
    ? /((?:^|(?<=\s))#[^\n]*|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/gm
    : /(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/|\/\/[^\n]*|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)/g;
  let out='', last=0, m;
  const plain = t => t.replace(KW,'<span class="tok-k">$&</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="tok-n">$1</span>');
  while((m = tokenRe.exec(e))){
    out += plain(e.slice(last, m.index));
    const t = m[0];
    out += (t.startsWith('//')||t.startsWith('/*')||t.startsWith('&lt;!--')||(hash && t.startsWith('#')))
      ? `<span class="tok-c">${t}</span>` : `<span class="tok-s">${t}</span>`;
    last = m.index + t.length;
  }
  out += plain(e.slice(last));
  return out;
}

function leadP(text){
  const e = esc(text);
  const m = e.match(/^([A-Z][^.:•]{1,44}):\s/);
  if(m && !/^(https?|Note)/.test(m[1])) return `<strong class="lead">${m[1]}:</strong> ${e.slice(m[0].length)}`;
  return e;
}

const CO_LABEL = {info:'Key concept', tip:'Tip', exercise:'Exercises', capstone:'Capstone', netsuite:'NetSuite', warn:'Warning'};
function renderBlocks(blocks, anchored){
  let html='', i=0, ti=-1;
  while(i < blocks.length){
    const b = blocks[i];
    if(b.t==='li'){
      let items=[];
      while(i<blocks.length && blocks[i].t==='li'){ items.push(`<li>${leadP(blocks[i].text)}</li>`); i++; }
      html += `<ul class="body">${items.join('')}</ul>`; continue;
    }
    if(b.t==='topic'||b.t==='subhead') ti++;
    const aid = anchored && (b.t==='topic'||b.t==='subhead') ? ` id="t${ti}"` : '';
    if(b.t==='p') html += `<p class="body">${leadP(b.text)}</p>`;
    else if(b.t==='topic') html += `<h4 class="topic"${aid}>${esc(b.text)}</h4>`;
    else if(b.t==='subhead') html += `<h3 class="subhead"${aid}>${esc(b.text)}</h3>`;
    else if(b.t==='code') html += `<pre class="code" data-lang="${b.lang}"><span class="lang">${LANG_LABEL[b.lang]||b.lang}</span><button class="cp" data-copy aria-label="Copy code">Copy</button><code>${highlight(b.lines.join('\n'), b.lang)}</code></pre>`;
    else if(b.t==='callout'){
      const listy = b.body.length>1 && b.body.every(x=>/^([A-Z]?\d+[.:)]|E\d+:|Day \d|•|-)\s?/.test(x)||b.body.length>3&&x.length<160);
      const body = (b.kind==='exercise'||listy)
        ? `<ul>${b.body.map(x=>`<li>${leadP(x)}</li>`).join('')}</ul>`
        : b.body.map(x=>`<p>${leadP(x)}</p>`).join('');
      html += `<div class="callout co-${b.kind}"><p class="co-t"><span class="tag">${CO_LABEL[b.kind]||b.kind}</span> ${esc(b.title)}</p>${body}</div>`;
    }
    else if(b.t==='table'){
      const [h,...rows]=b.rows;
      html += `<table class="data"><thead><tr>${h.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }
    i++;
  }
  return html;
}

/* Question counts computed from the live data — replaces the original document's

function viewCounts(s){
  const vols = DATA.volumes.map((v,vi)=>({name:v.vol, vi}));
  const rows = SECS.filter(x=>x.qs && x.qs.length).map(x=>({sec:x.title, vol:x.vi, n:x.qs.length, id:x.id}));

  return `<div class="qcard ${open?'open':''}" id="q-${cssId(uid)}">

const cssId = s => s.replace(/[^a-zA-Z0-9_-]/g,'_');

function viewDrill(){
  const d = state.drill;
  if(!d.active){
    return `<div class="page-head" style="--ac:var(--new)">
      <span class="eyebrow">Drill mode</span><h2>Flashcards</h2>
      <p class="tagline">Question on the front, full answer on the back. Self-grade to track what you know — "Again" cards return to the end of the queue.</p></div>
    <div class="drill-set"><span style="font-size:13px;color:var(--muted)">Include levels:</span>
      ${LVLS.map(l=>`<button class="chip ${d.lvls.has(l)||!d.lvls.size?'on':''}" data-l="${l}" data-dlvl="${l}">${l}</button>`).join('')}
    </div>
    <div class="drill-set">
      <button class="chip" data-start="all">Start · all questions</button>
      <button class="chip" data-start="unknown">Start · not yet known (${ALL_Q.filter(q=>!state.known.has(q.uid)).length})</button>
    </div>`;
  }
  if(d.idx >= d.queue.length){
    const missed = Object.entries(d.misses);
    let weak='';
    if(missed.length){
      const bySec = {};
      missed.forEach(([uid,n])=>{ const q=ALL_Q.find(x=>x.uid===uid); if(q){ bySec[q.sec.title]=(bySec[q.sec.title]||0)+n; } });
      const rows = Object.entries(bySec).sort((a,b)=>b[1]-a[1]).slice(0,6)
        .map(([sec,n])=>`<li><b>${esc(sec)}</b> — ${n} miss${n>1?'es':''}</li>`).join('');
      weak = `<div class="callout co-warn" style="margin-top:16px"><p class="co-t"><span class="tag">Weak areas</span> Where the misses came from</p><ul>${rows}</ul></div>`;
    }
    return `<div class="page-head" style="--ac:var(--new)"><span class="eyebrow">Drill complete</span><h2>Deck finished</h2></div>
    <div class="fcard"><div class="fq">✓ ${d.got} known · ↻ ${d.again} sent back and cleared</div>
    <p class="body" style="color:var(--muted)">Total marked known overall: ${state.known.size} / ${ALL_Q.length}.</p>
    ${weak}
    <div class="drill-btns">
      ${missed.length?`<button class="btn-again" data-start="missed">Re-drill missed (${missed.length})</button>`:''}
      <button class="btn-reveal" data-drill-reset>New deck</button></div></div>`;
  }
  const q = d.queue[d.idx];
  return `<div class="page-head" style="--ac:var(--new)">
    <span class="eyebrow">Drill · card ${d.idx+1} of ${d.queue.length}</span><h2 style="font-size:22px">Flashcards</h2></div>
  <div class="fcard">
    <div class="fmeta"><span class="lvl" data-l="${esc(q.level)}">${esc(q.level)}</span><span>${esc(q.sec.title)}</span><span>·</span><span>${esc(q.sec.vol)}</span></div>
    <div class="fq">${esc(q.title)}</div>
    ${d.revealed?`<div style="margin-top:18px;--ac:var(--intv)">${renderBlocks(q.blocks)}</div>`:''}
    <div class="drill-btns">
      ${d.revealed
        ? `<button class="btn-again" data-again>↻ Again</button><button class="btn-got" data-got>✓ Got it</button>`
        : `<button class="btn-reveal" data-reveal>Reveal answer <kbd style="opacity:.6">space</kbd></button>`}
      <span style="flex:1"></span><span class="drill-stats">✓ ${d.got} · ↻ ${d.again}</span>
    </div>
  </div>
  <p class="body" style="color:var(--faint);font-size:12.5px">Keyboard: space = reveal · 1 = again · 2 = got it · esc = end drill</p>`;
}

/* ---------- A–Z topic index ---------- */
function buildTopicIndex(){
  const rows = [];
  LEARN.forEach(p=>{
    p.blocks.forEach((b,i)=>{
      if(b.t==='topic'||b.t==='subhead'){
        const t = b.text.replace(/^[A-Z]\d+\s*—\s*/,'').replace(/\s*—\s*added by this guide/i,'').trim();
        if(!t || /^Extended topics/i.test(t)) return;
        rows.push({term:t, page:p, ti:i});
      }
    });
  });
  // index by the first letter, dedupe identical term+page
  const seen = new Set(); const out = [];
  rows.forEach(r=>{ const k=r.term.toLowerCase()+'|'+r.page.id; if(!seen.has(k)){ seen.add(k); out.push(r); } });
  out.sort((a,b)=>a.term.localeCompare(b.term));
  return out;
}
let TOPIC_INDEX = null;
function viewTopics(){
  TOPIC_INDEX = TOPIC_INDEX || buildTopicIndex();
  const groups = {};
  TOPIC_INDEX.forEach(r=>{ const L = /[a-z]/i.test(r.term[0]) ? r.term[0].toUpperCase() : '#'; (groups[L] ||= []).push(r); });
  const letters = Object.keys(groups).sort();
  return `<div class="page-head" style="--ac:var(--qr)">
    <span class="eyebrow">${TOPIC_INDEX.length} entries</span><h2>Topic index A–Z</h2>
    <p class="tagline">Every topic heading in the guide, alphabetically, with the page it lives on. Useful when a subject is covered in more than one place.</p></div>
  <div class="alpha">${letters.map(L=>`<a href="#ix-${L}">${L}</a>`).join('')}</div>
  ${letters.map(L=>`<h3 class="subhead" id="ix-${L}">${L}</h3>
    <div class="ix">${groups[L].map(r=>
      `<a href="#/learn/${r.page.id}?t=${topicOrdinal(r.page,r.ti)}"><span class="ix-t">${esc(r.term)}</span><span class="ix-p">${esc(r.page.title)}</span></a>`).join('')}</div>`).join('')}`;
}
function topicOrdinal(page, blockIndex){
  let n=-1;
  for(let i=0;i<=blockIndex;i++){ const b=page.blocks[i]; if(b.t==='topic'||b.t==='subhead') n++; }

function doSearch(qs){
  const q = qs.trim().toLowerCase();
  if(!q) return '<div class="empty">Type to search '+INDEX.length+' pages, topics and questions — full text included.</div>';
  const words = q.split(/\s+/);
  const scored = [];
  INDEX.forEach(e=>{
    if(!words.every(w=>e.text.includes(w))) return;
    const inTitle = words.every(w=>e.title.toLowerCase().includes(w));
    scored.push([inTitle?0:(e.kind==='Topic'?1:2), e]);
  });
  scored.sort((a,b)=>a[0]-b[0]);
  const hits = scored.slice(0,30);
  if(!hits.length) return '<div class="empty">No matches for “'+esc(qs)+'”.</div>';
  return hits.map(([rank,h])=>{
    let snip='';
    if(h.kind==='Term' && h.raw){ snip=`<span class="snip">${esc(h.raw.slice(0,110))}</span>`; }
    else if(rank>0 && h.raw){
      const i = h.raw.toLowerCase().indexOf(words[0]);
      if(i>=0){ const j=Math.max(0,i-30); snip=`<span class="snip">…${esc(h.raw.substr(j,100))}…</span>`; }
    }
    return `<a href="${h.href}" data-goto><span class="k">${esc(h.kind)}</span><span class="st">${esc(h.title)}${snip}</span><span class="ctx">${esc(h.ctx)}</span></a>`;
  }).join('');
}

/* ---------- persistence (auto-save, best effort) ---------- */
const LS_KEY = "mern_field_manual_v1";
let lsOK = true;
function persist(){
  if(!lsOK) return;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      d:[...state.done], k:[...state.known], m:[...state.marks],
      b:[...state.built], c:[...state.collapsed], l:state.lastLearn||null,
      theme:state.theme
    }));
  }catch(e){ lsOK=false; }   // private mode / artifact sandbox: stay session-only
}
function restore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    state.done=new Set(o.d||[]); state.known=new Set(o.k||[]);
    state.marks=new Set(o.m||[]); state.built=new Set(o.b||[]);
    state.collapsed=new Set(o.c||[]);
    if(o.l) state.lastLearn=o.l;
    if(o.theme){ state.theme=o.theme; document.documentElement.dataset.theme=o.theme; }
  }catch(e){ lsOK=false; }
}

function route(){
  const h = location.hash || '#/home';
  if(h.startsWith('#/learn/')) { const [id,qs]=h.slice(8).split('?'); return {v:'learn', id, t:new URLSearchParams(qs||'').get('t')}; }
  if(h.startsWith('#/int/')) { const [id,qs]=h.slice(6).split('?'); return {v:'int', id, q:new URLSearchParams(qs||'').get('q')}; }
  if(h.startsWith('#/drill')) return {v:'drill'};
  if(h.startsWith('#/roadmap')) return {v:'roadmap'};
  if(h.startsWith('#/projects')) return {v:'projects'};
  if(h.startsWith('#/plan')) return {v:'plan'};
  if(h.startsWith('#/bookmarks')) return {v:'bookmarks'};
  if(h.startsWith('#/topics')) return {v:'topics'};
  return {v:'home'};
}
function crumb(r){
  if(r.v==='learn'){ const p=PAGE_BY_ID[r.id]; return p?`${p.group} / ${p.title}`:''; }
  if(r.v==='int'){ const s=SEC_BY_ID[r.id]; return s?`${s.vol} / ${s.title}`:''; }
  if(r.v==='drill') return 'Interview / Flashcard drill';
  if(r.v==='roadmap') return 'Roadmap overview';
  if(r.v==='projects') return 'Capstone projects';
  if(r.v==='plan') return 'Interview / 7-day crash plan';
  if(r.v==='bookmarks') return 'Bookmarks';
  if(r.v==='topics') return 'Topic index A–Z';
  return 'MERN Field Manual';
}
function render(){
  const r = route();
  if(r.v==='learn'||r.v==='roadmap'||r.v==='projects'||r.v==='topics') state.mode='learn';
  if(r.v==='int'||r.v==='drill'||r.v==='plan') state.mode='interview';
  const main = $('#view');
  main.innerHTML = r.v==='learn'?viewLearn(r.id) : r.v==='int'?viewSection(r.id)
    : r.v==='drill'?viewDrill() : r.v==='roadmap'?viewRoadmap() : r.v==='projects'?viewProjects()
    : r.v==='plan'?viewPlan() : r.v==='bookmarks'?viewBookmarks() : r.v==='topics'?viewTopics() : viewHome();
  $('#crumb').textContent = crumb(r);
  renderSide();
  if(r.v==='int' && r.q){
    state.open.add(r.q); main.innerHTML = viewSection(r.id);
    const el = document.getElementById('q-'+cssId(r.q));
    if(el) el.scrollIntoView?.({block:'start'});
  } else if(r.v==='learn' && r.t!=null){
    const el = document.getElementById('t'+r.t);
    if(el) el.scrollIntoView?.({block:'start'}); else window.scrollTo(0,0);
  } else window.scrollTo(0,0);
  if(r.v==='learn' && PAGE_BY_ID[r.id]) state.lastLearn = r.id;
  $('#side').classList.remove('open');
  persist();
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-copy],[data-done],[data-toggle],[data-know],[data-lvl],[data-expand],[data-m],[data-reveal],[data-again],[data-got],[data-start],[data-dlvl],[data-drill-reset],[data-export],[data-import],[data-mark],[data-built],[data-grp],#burger,#theme,#searchbtn,#totop,[data-goto]');
  if(!t) return;
  if(t.dataset.copy!==undefined){
    const code = t.parentElement.querySelector('code').textContent;
    navigator.clipboard.writeText(code).then(()=>{ t.textContent='Copied ✓'; setTimeout(()=>t.textContent='Copy',1200); });
  }
  else if(t.dataset.done){ const id=t.dataset.done; state.done.has(id)?state.done.delete(id):state.done.add(id); render(); }
  else if(t.dataset.toggle){ const u=t.dataset.toggle; state.open.has(u)?state.open.delete(u):state.open.add(u); render(); }
  else if(t.dataset.know){ const u=t.dataset.know; state.known.has(u)?state.known.delete(u):state.known.add(u); render(); }
  else if(t.dataset.lvl){ const l=t.dataset.lvl; state.lvls.has(l)?state.lvls.delete(l):state.lvls.add(l); render(); }
  else if(t.dataset.expand!==undefined){ const r=route(); const s=SEC_BY_ID[r.id];
    if(s){ const allOpen = s.qs.every(q=>state.open.has(s.id+'/'+q.num));
      s.qs.forEach(q=>{ const u=s.id+'/'+q.num; allOpen?state.open.delete(u):state.open.add(u); }); }
    render(); }
  else if(t.dataset.m){ state.mode=t.dataset.m; renderSide(); if(state.mode==='interview'&&route().v==='learn') location.hash='#/int/'+SECS[0].id; else if(state.mode==='learn'&&route().v!=='learn') location.hash='#/learn/'+LEARN[0].id; }
  else if(t.dataset.dlvl){ const l=t.dataset.dlvl; state.drill.lvls.has(l)?state.drill.lvls.delete(l):state.drill.lvls.add(l); render(); }
  else if(t.dataset.start){
    const d=state.drill; let pool=ALL_Q.filter(q=>!d.lvls.size||d.lvls.has(q.level));
    if(t.dataset.start==='unknown') pool=pool.filter(q=>!state.known.has(q.uid));
    if(t.dataset.start==='missed') pool=ALL_Q.filter(q=>d.misses[q.uid]);
    if(t.dataset.start!=='missed') d.misses={};
    d.queue=[...pool].sort(()=>Math.random()-.5); d.idx=0; d.revealed=false; d.got=0; d.again=0; d.active=true; render();
  }
  else if(t.dataset.reveal!==undefined){ state.drill.revealed=true; render(); }
  else if(t.dataset.again!==undefined){ const d=state.drill; const u=d.queue[d.idx].uid; d.misses[u]=(d.misses[u]||0)+1; d.queue.push(d.queue[d.idx]); d.again++; d.idx++; d.revealed=false; render(); }
  else if(t.dataset.got!==undefined){ const d=state.drill; state.known.add(d.queue[d.idx].uid); d.got++; d.idx++; d.revealed=false; render(); }
  else if(t.dataset.drillReset!==undefined){ state.drill.active=false; render(); }
  else if(t.dataset.mark){ const k=t.dataset.mark; state.marks.has(k)?state.marks.delete(k):state.marks.add(k); render(); }
  else if(t.dataset.built){ const k=t.dataset.built; state.built.has(k)?state.built.delete(k):state.built.add(k); render(); }
  else if(t.dataset.grp){ const k=t.dataset.grp; state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k); renderSide(); }
  else if(t.id==='totop'){ window.scrollTo({top:0,behavior:'smooth'}); }
  else if(t.dataset.export!==undefined){ openModal('export'); }
  else if(t.dataset.import!==undefined){ openModal('import'); }
  else if(t.id==='burger'){ $('#side').classList.toggle('open'); }
  else if(t.id==='theme'){ state.theme = state.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=state.theme; t.textContent = state.theme==='dark'?'☀':'☾'; persist(); }
  else if(t.id==='searchbtn'){ openSearch(); }
  else if(t.dataset.goto!==undefined){ closeSearch(); }
});

$('#m-ok').addEventListener('click', ()=>{
  const mode = $('#m-ok').dataset.mode;
  if(mode==='export'){ navigator.clipboard.writeText($('#m-ta').value); $('#m-ok').textContent='Copied ✓'; setTimeout(()=>$('#modal').classList.remove('open'),700); }
  else { if(importCode($('#m-ta').value)){ $('#modal').classList.remove('open'); } else { $('#m-desc').textContent='That code could not be read — check it was pasted completely.'; } }
});
$('#m-cancel').addEventListener('click', ()=>$('#modal').classList.remove('open'));
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); });

function openSearch(){ $('#ovl').classList.add('open'); const i=$('#sinput'); i.value=''; $('#sres').innerHTML=doSearch(''); i.focus(); }
function closeSearch(){ $('#ovl').classList.remove('open'); }
$('#sinput').addEventListener('input', e=>{ $('#sres').innerHTML=doSearch(e.target.value); });
$('#sinput').addEventListener('keydown', e=>{
  const links=[...document.querySelectorAll('#sres a')];
  if(!links.length) return;
  let i = links.findIndex(a=>a.classList.contains('sel'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(i>=0) links[i].classList.remove('sel');
    i = e.key==='ArrowDown' ? (i+1)%links.length : (i-1+links.length)%links.length;
    links[i].classList.add('sel'); links[i].scrollIntoView?.({block:'nearest'});
  } else if(e.key==='Enter' && i>=0){ links[i].click(); }
});
$('#ovl').addEventListener('click', e=>{ if(e.target.id==='ovl') closeSearch(); });

document.addEventListener('keydown', e=>{
  if(e.key==='/' && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); openSearch(); }
  if(e.key==='?' && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); openModal('help'); }
  if(e.key==='Escape'){ if($('#ovl').classList.contains('open')) closeSearch();
    else if($('#modal').classList.contains('open')) $('#modal').classList.remove('open');
    else if(route().v==='drill'&&state.drill.active){ state.drill.active=false; render(); } }
  if(route().v==='drill' && state.drill.active && !/input|textarea/i.test(document.activeElement.tagName)){
    const d=state.drill;
    if(e.key===' '&&!d.revealed&&d.idx<d.queue.length){ e.preventDefault(); d.revealed=true; render(); }
    else if(e.key==='1'&&d.revealed){ const u=d.queue[d.idx].uid; d.misses[u]=(d.misses[u]||0)+1; d.queue.push(d.queue[d.idx]); d.again++; d.idx++; d.revealed=false; render(); }
    else if(e.key==='2'&&d.revealed){ state.known.add(d.queue[d.idx].uid); d.got++; d.idx++; d.revealed=false; render(); }
  }
});

window.addEventListener('scroll', ()=>{ const b=$('#totop'); if(b) b.classList.toggle('show', window.scrollY>700); }, {passive:true});

/* Print: answers render lazily, so expand everything on the current page first */
let printSaved = null;
function expandForPrint(){
  const r = route();
  if(r.v!=='int') return;
  const s = SEC_BY_ID[r.id]; if(!s || !s.qs) return;
  printSaved = new Set(state.open);
  s.qs.forEach(q=>state.open.add(s.id+'/'+q.num));
  $('#view').innerHTML = viewSection(r.id);
}
function restoreAfterPrint(){
  if(!printSaved) return;
  state.open = printSaved; printSaved = null; render();
}
window.addEventListener('beforeprint', expandForPrint);
window.addEventListener('afterprint', restoreAfterPrint);
if(window.matchMedia){
  const mq = window.matchMedia('print');
  (mq.addEventListener||mq.addListener) && (mq.addEventListener
    ? mq.addEventListener('change', e=> e.matches ? expandForPrint() : restoreAfterPrint())
    : mq.addListener(e=> e.matches ? expandForPrint() : restoreAfterPrint()));
}

restore();
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
