, "text": "OAuth 2.0 & OpenID Connect — Social Login"}, {"t": "p", "text": "OAuth 2.0 is an authorisation framework. OpenID Connect (OIDC) adds an identity layer on top — it is how \"Login with Google\" works."}, {"t": "p", "text": "The authorization code flow: (1) redirect user to Google with your client_id and a random state; (2) user logs in on Google; (3) Google redirects back with a code; (4) your server exchanges the code for tokens; (5) verify ID token, extract user info, create/find user in DB, issue your own JWT."}, {"t": "p", "text": "Auth.js (formerly next-auth) and Passport.js handle this flow. Use a library — implementing OAuth from scratch introduces security bugs."}, {"t": "code", "lang": "shell", "lines": ["// Next.js with Auth.js (next-auth v5)", "// app/api/auth/[...nextauth]/route.ts", "import NextAuth from \"next-auth\";", "import Google from \"next-auth/providers/google\";", "import GitHub from \"next-auth/providers/github\";", "", "export const { handlers, auth, signIn, signOut } = NextAuth({", "  providers: [", "    Google({", "      clientId: process.env.GOOGLE_CLIENT_ID,", "      clientSecret: process.env.GOOGLE_CLIENT_SECRET,", "    }),", "    GitHub({", "      clientId: process.env.GITHUB_CLIENT_ID,", "      clientSecret: process.env.GITHUB_CLIENT_SECRET,", "    }),", "  ],", "  callbacks: {", "    async signIn({ user, account }) {", "      // Find or create user in MongoDB", "      await User.findOneAndUpdate(", "        { email: user.email },", "        {", "          $setOnInsert: { name: user.name, role: \"user\" },", "          $set: { avatar: user.image, lastLogin: new Date() },", "        },", "        { upsert: true }", "      );", "      return true; // allow sign in", "    },", "    async jwt({ token, user }) {", "      if (user) token.role = await getUserRole(user.email);", "      return token;", "    },", "    async session({ session, token }) {", "      session.user.role = token.role;", "      return session;", "    },", "  },", "  pages: { signIn: \"/login\" },", "});", "", "// Passport.js with Express", "const passport = require(\"passport\");", "const { Strategy: GoogleStrategy } = require(\"passport-google-oauth20\");", "", "passport.use(new GoogleStrategy({", "  clientID: process.env.GOOGLE_CLIENT_ID,", "  clientSecret: process.env.GOOGLE_CLIENT_SECRET,", "  callbackURL: \"/auth/google/callback\",", "}, async (accessToken, refreshToken, profile, done) => {", "  try {", "    const user = await User.findOneAndUpdate(", "      { googleId: profile.id },", "      { name: profile.displayName, email: profile.emails[0].value },", "      { upsert: true, new: true }", "    );", "    return done(null, user);", "  } catch (err) { return done(err); }", "}));", "", "router.get(\"/auth/google\", passport.authenticate(\"google\", { scope: [\"profile\",\"email\"] }));", "router.get(\"/auth/google/callback\",", "  passport.authenticate(\"google\", { session: false }),", "  (req, res) => {", "    const token = signJWT(req.user._id);", "    res.redirect(`${process.env.CLIENT_URL}/auth?token=${token}`);", "  }", ");"]}, {"t": "topic", "text": "Secrets Management & Environment Security"}, {"t": "p", "text": "Never hardcode secrets. Never commit .env files. Never log secrets. Never put secrets in client-side code or git history."}, {"t": "p", "text": "For small projects: .env with dotenv, .gitignore the file, .env.example with placeholder values in git."}, {"t": "p", "text": "For production: use a secrets manager — AWS Secrets Manager, HashiCorp Vault, Doppler, or Infisical. These support secret rotation (updating secrets without downtime) and audit logs."}, {"t": "p", "text": "Secret rotation: generate new value, update the secrets manager, deploy a new version that reads the new value, revoke the old value. JWT secrets must be rotated by supporting both old and new secrets during a transition window."}, {"t": "code", "lang": "js", "lines": ["// AWS Secrets Manager with Node.js", "const { SecretsManagerClient, GetSecretValueCommand } = require(\"@aws-sdk/client-secrets-manager\");", "", "const client = new SecretsManagerClient({ region: \"us-east-1\" });", "", "async function getSecret(secretName) {", "  const response = await client.send(", "    new GetSecretValueCommand({ SecretId: secretName })", "  );", "  return JSON.parse(response.SecretString);", "}", "", "// Load secrets at startup, not per-request", "let secrets = {};", "async function loadSecrets() {", "  secrets = await getSecret(\"myapp/production\");", "  // { DB_URI, JWT_SECRET, STRIPE_KEY, ... }", "}", "", "// JWT secret rotation: accept both old and new secrets", "function verifyTokenWithRotation(token) {", "  const secrets = [process.env.JWT_SECRET_NEW, process.env.JWT_SECRET_OLD];", "  for (const secret of secrets) {", "    try {", "      return jwt.verify(token, secret, { algorithms: [\"HS256\"] });", "    } catch (e) {", "      if (e.name !== \"JsonWebTokenError\") throw e;", "    }", "  }", "  throw new Error(\"Invalid token\");", "}", "", "// Scanning git history for leaked secrets (run in CI)", "// npm install -g trufflehog", "// trufflehog git file://. --only-verified", "// trufflehog github --repo https://github.com/org/repo"]}, {"t": "callout", "kind": "capstone", "title": "OWASP Top 10 Quick Reference", "body": ["A01 Broken Access Control: always check ownership (user can only edit their own posts). Use middleware, never trust client-supplied IDs.", "A02 Cryptographic Failures: use bcrypt (not MD5/SHA1) for passwords. Always HTTPS. Never log plaintext passwords or tokens.", "A03 Injection: use Mongoose schemas + Zod validation + express-mongo-sanitize. Never interpolate user input into queries.", "A04 Insecure Design: threat model before you build. Rate limit all auth endpoints. Lock accounts after N failed attempts.", "A05 Security Misconfiguration: disable X-Powered-By. Use Helmet. Remove default credentials. Restrict CORS to known origins.", "A06 Vulnerable Components: run npm audit weekly. Use Dependabot or Renovate for automatic dependency updates.", "A07 Auth Failures: use httpOnly cookies or short-lived JWTs. Implement refresh token rotation. Log all auth events.", "A08 Software Integrity Failures: use npm ci (exact lockfile). Verify checksums on downloaded binaries.", "A09 Logging Failures: log auth events, admin actions, errors. Use structured JSON logging. Never log passwords or tokens.", "A10 SSRF: validate and allowlist URLs before fetching. Never fetch arbitrary user-supplied URLs on the server."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter B", "body": ["E1: Write a login endpoint vulnerable to operator injection ({\"$gt\": \"\"}), exploit it, then fix it with sanitisation and schema validation.", "E2: Add a strict CSP to your app and fix every violation until the console is clean.", "E3: Implement CSRF protection for a cookie-session app and prove a cross-origin POST is rejected.", "E4: Add Google OAuth login and store no password at all for those users."]}]}, {"id": "pg18", "title": "Node.js Streams, Workers & Observability", "sub": "Chapter C", "blocks": [{"t": "topic", "text": "Node.js Streams — Processing Data Without Loading It All"}, {"t": "p", "text": "Streams process data in chunks rather than loading the entire thing into memory. A 500MB CSV file processed as a stream uses ~1MB of memory. Loaded with readFile, it uses 500MB."}, {"t": "p", "text": "Four stream types: Readable (source), Writable (destination), Duplex (both), Transform (Duplex that modifies data passing through)."}, {"t": "p", "text": "pipeline(): the correct way to connect streams. It handles backpressure automatically and properly propagates errors. Never use pipe() in new code — it does not handle errors correctly."}, {"t": "p", "text": "Backpressure: when a Writable cannot keep up with a Readable, the Readable pauses automatically. pipeline() manages this. If you implement a custom Writable, return false from write() when the buffer is full and emit drain when ready."}, {"t": "code", "lang": "js", "lines": ["const fs = require(\"fs\");", "const { pipeline, Transform } = require(\"stream\");", "const { promisify } = require(\"util\");", "const csvParser = require(\"csv-parser\");", "const pipelineAsync = promisify(pipeline);", "", "// Process a 500MB NS CSV export line-by-line", "// Memory usage: ~1MB regardless of file size", "async function processNSExport(filePath) {", "  const results = [];", "  let rowCount = 0;", "", "  const cleanupTransform = new Transform({", "    objectMode: true, // work with objects, not buffers", "    transform(row, encoding, callback) {", "      // Transform each CSV row", "      const cleaned = {", "        id: row[\"Internal ID\"],", "        name: row[\"Name\"]?.trim(),", "        amount: parseFloat(row[\"Amount\"] || 0),", "        date: new Date(row[\"Date\"]),", "        status: row[\"Status\"]?.toLowerCase(),", "      };", "      // Filter invalid rows", "      if (cleaned.id && cleaned.amount > 0) {", "        this.push(cleaned); // pass to next stream", "      }", "      callback(); // signal ready for next chunk", "    },", "  });", "", "  const batchWriter = new Transform({", "    objectMode: true,", "    transform(row, encoding, callback) {", "      results.push(row);", "      rowCount++;", "      // Batch insert every 500 rows", "      if (results.length >= 500) {", "        Order.insertMany(results.splice(0, 500))", "          .then(() => callback())", "          .catch(callback);", "      } else {", "        callback();", "      }", "    },", "    flush(callback) {", "      // Insert remaining rows when stream ends", "      if (results.length > 0) {", "        Order.insertMany(results).then(() => callback()).catch(callback);", "      } else {", "        callback();", "      }", "    },", "  });", "", "  await pipelineAsync(", "    fs.createReadStream(filePath),", "    csvParser(),      // parse CSV rows to objects", "    cleanupTransform, // clean and filter", "    batchWriter,      // insert in batches", "  );", "", "  return { rowCount };", "}", "", "// Streaming HTTP response (send large data without buffering)", "app.get(\"/export/orders\", protect, async (req, res) => {", "  res.setHeader(\"Content-Type\", \"text/csv\");", "  res.setHeader(\"Content-Disposition\", \"attachment; filename=orders.csv\");", "", "  const cursor = Order.find({ user: req.user._id }).cursor();", "  const { stringify } = require(\"csv-stringify\");", "  const stringifier = stringify({ header: true });", "", "  await pipelineAsync(cursor, stringifier, res);", "});"]}, {"t": "topic", "text": "Worker Threads — CPU-Bound Tasks"}, {"t": "p", "text": "Node.js is single-threaded. CPU-intensive work (image resizing, PDF generation, heavy computation) blocks the event loop, making your entire server unresponsive."}, {"t": "p", "text": "Worker threads run in a separate thread with their own V8 instance. They share memory via SharedArrayBuffer and communicate via postMessage."}, {"t": "p", "text": "When to use worker threads: operations that take more than ~10ms of pure CPU work. For I/O-bound tasks (database, network), async/await is sufficient."}, {"t": "p", "text": "Alternative: child_process.fork() for completely separate Node processes (more isolation, higher overhead). Use for untrusted code."}, {"t": "code", "lang": "js", "lines": ["const { Worker, isMainThread, parentPort, workerData } = require(\"worker_threads\");", "const path = require(\"path\");", "", "// worker.js — runs in a separate thread", "if (!isMainThread) {", "  const { imagePath, width, height } = workerData;", "  const sharp = require(\"sharp\");", "  sharp(imagePath)", "    .resize(width, height)", "    .toBuffer()", "    .then(buffer => parentPort.postMessage({ success: true, buffer }))", "    .catch(err => parentPort.postMessage({ success: false, error: err.message }));", "}", "", "// main thread — creates worker for each image", "function resizeImageInWorker(imagePath, width, height) {", "  return new Promise((resolve, reject) => {", "    const worker = new Worker(__filename, {", "      workerData: { imagePath, width, height },", "    });", "    worker.on(\"message\", (result) => {", "      if (result.success) resolve(result.buffer);", "      else reject(new Error(result.error));", "    });", "    worker.on(\"error\", reject);", "  });", "}", "", "// Worker pool pattern (reuse workers, avoid creation overhead)", "const { Piscina } = require(\"piscina\"); // npm install piscina", "", "const imagePool = new Piscina({", "  filename: path.resolve(__dirname, \"image-worker.js\"),", "  maxThreads: 4, // one per CPU core typically", "});", "", "app.post(\"/upload\", upload.single(\"image\"), async (req, res) => {", "  // Offload to worker pool — event loop stays free", "  const [thumbnail, medium] = await Promise.all([", "    imagePool.run({ buffer: req.file.buffer, width: 100, height: 100 }),", "    imagePool.run({ buffer: req.file.buffer, width: 800, height: 600 }),", "  ]);", "  // Upload thumbnails to S3...", "  res.json({ success: true });", "});"]}, {"t": "topic", "text": "PM2 & Cluster Mode — Production Process Management"}, {"t": "p", "text": "PM2 is a production process manager for Node.js. It keeps your app running after crashes, restarts on file changes, runs multiple processes, and provides monitoring."}, {"t": "p", "text": "Cluster mode: spawns one process per CPU core. Each process handles a share of incoming requests. Combined with a load balancer (Nginx), this saturates all CPU cores."}, {"t": "p", "text": "PM2 graceful reload: sends SIGINT to one process at a time, waits for it to finish in-flight requests, then starts a new process. Zero-downtime deploys."}, {"t": "p", "text": "ecosystem.config.js: define all PM2 settings in code, commit to git, consistent across environments."}, {"t": "code", "lang": "js", "lines": ["// ecosystem.config.js", "module.exports = {", "  apps: [{", "    name: \"api\",", "    script: \"dist/server.js\",", "    instances: \"max\",        // one per CPU core", "    exec_mode: \"cluster\",", "    watch: false,            // never watch in production", "    max_memory_restart: \"500M\",", "    env_production: {", "      NODE_ENV: \"production\",", "      PORT: 3000,", "    },", "    // Graceful shutdown", "    kill_timeout: 5000,      // wait 5s for in-flight requests", "    listen_timeout: 10000,   // wait for app to bind port", "    // Logs", "    out_file: \"/var/log/myapp/out.log\",", "    error_file: \"/var/log/myapp/error.log\",", "    merge_logs: true,", "    log_date_format: \"YYYY-MM-DD HH:mm:ss Z\",", "  }],", "};", "", "// Package.json scripts", "// \"start:prod\": \"pm2 start ecosystem.config.js --env production\"", "// \"reload\": \"pm2 reload api --update-env\"    (zero-downtime)", "// \"logs\": \"pm2 logs api --lines 100\"", "// \"monitor\": \"pm2 monit\"", "", "// Handle graceful shutdown in your app", "process.on(\"SIGINT\", async () => {", "  console.log(\"Shutting down gracefully...\");", "  server.close(async () => {", "    await mongoose.connection.close();", "    await redisClient.quit();", "    process.exit(0);", "  });", "  // Force exit after timeout", "  setTimeout(() => process.exit(1), 5000);", "});"]}, {"t": "topic", "text": "Structured Logging & Observability"}, {"t": "p", "text": "Console.log is not production logging. Structured JSON logging lets you search, filter, and alert on log data in tools like Datadog, CloudWatch, Logtail, or Grafana Loki."}, {"t": "p", "text": "Pino: the fastest Node.js logger. Outputs newline-delimited JSON. Minimal overhead — uses worker threads internally."}, {"t": "p", "text": "Correlation IDs: assign a unique ID (UUID) to each incoming request. Log it on every log line within that request. When a user reports a bug, find all logs for their request in seconds."}, {"t": "p", "text": "Log levels: error (app crash, data loss), warn (unexpected but handled), info (significant events: startup, request summary), debug (development detail), trace (very verbose)."}, {"t": "code", "lang": "js", "lines": ["const pino = require(\"pino\");", "const pinoHttp = require(\"pino-http\");", "const { randomUUID } = require(\"crypto\");", "", "// Create logger", "const logger = pino({", "  level: process.env.LOG_LEVEL || \"info\",", "  transport: process.env.NODE_ENV === \"development\"", "    ? { target: \"pino-pretty\" }  // human-readable in dev", "    : undefined,                 // JSON in production", "  serializers: {", "    err: pino.stdSerializers.err,", "    req: (req) => ({ method: req.method, url: req.url, id: req.id }),", "    res: (res) => ({ statusCode: res.statusCode }),", "  },", "});", "", "// Attach correlation ID to every request", "app.use((req, res, next) => {", "  req.id = req.headers[\"x-request-id\"] || randomUUID();", "  res.setHeader(\"x-request-id\", req.id);", "  req.log = logger.child({ requestId: req.id, userId: req.user?._id });", "  next();", "});", "", "// HTTP request logging middleware (pino-http)", "app.use(pinoHttp({ logger, genReqId: (req) => req.id }));", "", "// Log in controllers", "exports.createOrder = async (req, res, next) => {", "  try {", "    req.log.info({ body: req.body }, \"Creating order\");", "    const order = await OrderService.create(req.user._id, req.body);", "    req.log.info({ orderId: order._id, total: order.total }, \"Order created\");", "    res.status(201).json(order);", "  } catch (err) {", "    req.log.error({ err }, \"Order creation failed\");", "    next(err);", "  }", "};", "", "// Sentry for error tracking", "const Sentry = require(\"@sentry/node\");", "Sentry.init({", "  dsn: process.env.SENTRY_DSN,", "  environment: process.env.NODE_ENV,", "  tracesSampleRate: 0.1, // trace 10% of requests", "});", "app.use(Sentry.Handlers.requestHandler());", "// Error handler (must be after all routes)", "app.use(Sentry.Handlers.errorHandler());"]}, {"t": "topic", "text": "Server-Sent Events (SSE) — One-Way Real-Time"}, {"t": "p", "text": "SSE is a simpler alternative to WebSockets for server-to-client real-time updates. It uses a plain HTTP connection that stays open, with the server pushing text/event-stream data."}, {"t": "p", "text": "Use SSE when: you only need server-to-client updates (notifications, progress bars, live logs, stock prices). Use WebSockets when you need bidirectional communication (chat, gaming)."}, {"t": "p", "text": "SSE advantages: works over HTTP/1.1 and HTTP/2, automatic reconnection built into the browser, proxies and load balancers handle it correctly, simpler than WebSockets."}, {"t": "code", "lang": "js", "lines": ["// Server: SSE endpoint", "app.get(\"/sse/notifications\", protect, (req, res) => {", "  // SSE headers", "  res.setHeader(\"Content-Type\", \"text/event-stream\");", "  res.setHeader(\"Cache-Control\", \"no-cache\");", "  res.setHeader(\"Connection\", \"keep-alive\");", "  res.setHeader(\"X-Accel-Buffering\", \"no\"); // disable Nginx buffering", "  res.flushHeaders();", "", "  const userId = req.user._id.toString();", "", "  // Helper to send an event", "  const send = (event, data) => {", "    res.write(`event: ${event}\\n`);", "    res.write(`data: ${JSON.stringify(data)}\\n\\n`);", "  };", "", "  // Send a ping every 30s to keep connection alive", "  const heartbeat = setInterval(() => res.write(\": heartbeat\\n\\n\"), 30000);", "", "  // Register this connection", "  sseClients.set(userId, res);", "", "  // Cleanup on client disconnect", "  req.on(\"close\", () => {", "    clearInterval(heartbeat);", "    sseClients.delete(userId);", "  });", "", "  // Send initial data", "  send(\"connected\", { timestamp: new Date() });", "});", "", "// Send notification from anywhere in your app", "function sendNotification(userId, notification) {", "  const client = sseClients.get(userId.toString());", "  if (client) {", "    client.write(`event: notification\\n`);", "    client.write(`data: ${JSON.stringify(notification)}\\n\\n`);", "  }", "}", "", "// Client: EventSource API (built into browsers)", "// const source = new EventSource(\"/sse/notifications\", { withCredentials: true });", "// source.addEventListener(\"notification\", (e) => {", "//   const notif = JSON.parse(e.data);", "//   showToast(notif.message);", "// });", "// source.addEventListener(\"error\", () => {", "//   // Browser automatically reconnects", "// });"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter C", "body": ["E1: Stream a 500 MB CSV through a Transform that filters rows, writing the result without the heap ever exceeding 100 MB.", "E2: Move an image-resize endpoint into a worker thread and measure event-loop lag before and after.", "E3: Run your API under PM2 cluster mode; prove in-memory sessions break, then fix it with Redis.", "E4: Add pino structured logging with a request id propagated end to end, plus an SSE progress endpoint."]}]}, {"id": "pg19", "title": "Payments, File Storage & Email", "sub": "Chapter D", "blocks": [{"t": "subhead", "text": "D1 — Stripe Payments"}, {"t": "p", "text": "Stripe is the de-facto payment processor for MERN applications. It handles PCI compliance, fraud detection, and global currencies. You never touch raw card numbers — Stripe's client-side library collects them and gives you a token."}, {"t": "topic", "text": "Payment Intent Flow — One-Time Payments"}, {"t": "p", "text": "The Payment Intent is Stripe's object that tracks a payment through its lifecycle. You create it on the server, confirm it on the client with Stripe.js, and receive the final status via a webhook."}, {"t": "p", "text": "Why webhooks: the client confirmation can fail (browser closed, network dropped). Your server should never mark an order as paid based on client-side callback alone. Always rely on the webhook."}, {"t": "p", "text": "Idempotency keys: pass a unique key with every Stripe API call. If the call fails and you retry, Stripe returns the original response instead of charging twice. Use orderId or a UUID stored with the order."}, {"t": "code", "lang": "js", "lines": ["// Server: create Payment Intent", "const stripe = require(\"stripe\")(process.env.STRIPE_SECRET_KEY);", "", "app.post(\"/api/payments/create-intent\", protect, async (req, res, next) => {", "  try {", "    const { orderId } = req.body;", "    const order = await Order.findOne({ _id: orderId, user: req.user._id });", "    if (!order) return res.status(404).json({ message: \"Order not found\" });", "    if (order.paymentStatus === \"paid\") {", "      return res.status(409).json({ message: \"Order already paid\" });", "    }", "", "    const paymentIntent = await stripe.paymentIntents.create({", "      amount: Math.round(order.total * 100), // Stripe uses cents", "      currency: \"usd\",", "      customer: req.user.stripeCustomerId,", "      metadata: { orderId: order._id.toString(), userId: req.user._id.toString() },", "      automatic_payment_methods: { enabled: true },", "    }, {", "      idempotencyKey: `order-${orderId}-payment`, // safe to retry", "    });", "", "    // Save paymentIntentId for reconciliation", "    await Order.findByIdAndUpdate(orderId, {", "      stripePaymentIntentId: paymentIntent.id,", "      paymentStatus: \"pending\",", "    });", "", "    // Only send the client_secret — never the full PaymentIntent", "    res.json({ clientSecret: paymentIntent.client_secret });", "  } catch (err) { next(err); }", "});", "", "// Client: React component using Stripe.js", "import { loadStripe } from \"@stripe/stripe-js\";", "import { Elements, PaymentElement, useStripe, useElements } from \"@stripe/react-stripe-js\";", "", "const stripePromise = loadStripe(process.env.REACT_APP_STRIPE_PUBLIC_KEY);", "", "function CheckoutForm({ clientSecret }) {", "  const stripe = useStripe();", "  const elements = useElements();", "  const [loading, setLoading] = useState(false);", "  const [error, setError] = useState(null);", "", "  const handleSubmit = async (e) => {", "    e.preventDefault();", "    setLoading(true);", "    const { error } = await stripe.confirmPayment({", "      elements,", "      confirmParams: { return_url: window.location.origin + \"/order/success\" },", "    });", "    if (error) setError(error.message);", "    setLoading(false);", "  };", "", "  return (", "    <form onSubmit={handleSubmit}>", "      <PaymentElement />", "      <button disabled={loading}>", "        {loading ? \"Processing...\" : \"Pay now\"}", "      <\/button>", "      {error && <p>{error}<\/p>}", "    <\/form>", "  );", "}", "", "export default function Checkout({ orderId }) {", "  const [clientSecret, setClientSecret] = useState(null);", "  useEffect(() => {", "    fetch(\"/api/payments/create-intent\", {", "      method: \"POST\",", "      headers: { \"Content-Type\": \"application/json\" },", "      body: JSON.stringify({ orderId }),", "    }).then(r => r.json()).then(d => setClientSecret(d.clientSecret));", "  }, [orderId]);", "  if (!clientSecret) return <Spinner />;", "  return (", "    <Elements stripe={stripePromise} options={{ clientSecret }}>", "      <CheckoutForm clientSecret={clientSecret} />", "    <\/Elements>", "  );", "}"]}, {"t": "topic", "text": "Stripe Webhooks — The Source of Truth"}, {"t": "p", "text": "Webhooks are Stripe's way of telling your server what happened. This is more reliable than the client-side callback because it works even if the user closes the browser mid-payment."}, {"t": "p", "text": "Verify the webhook signature before processing. Stripe signs each event with your webhook secret. If you skip verification, attackers can send fake events to mark orders as paid."}, {"t": "p", "text": "Use the Stripe CLI locally: stripe listen --forward-to localhost:3000/api/webhooks/stripe. It creates a temporary webhook and prints events in real time."}, {"t": "code", "lang": "js", "lines": ["// Register this route BEFORE app.use(express.json()) — a parsed body breaks signature verification", "// Webhook handler — must use raw body (not parsed JSON)", "app.post(\"/api/webhooks/stripe\",", "  express.raw({ type: \"application/json\" }), // raw body for signature verification", "  async (req, res) => {", "    const sig = req.headers[\"stripe-signature\"];", "    let event;", "", "    try {", "      event = stripe.webhooks.constructEvent(", "        req.body,", "        sig,", "        process.env.STRIPE_WEBHOOK_SECRET", "      );", "    } catch (err) {", "      return res.status(400).send(`Webhook Error: ${err.message}`);", "    }", "", "    // Handle events", "    switch (event.type) {", "      case \"payment_intent.succeeded\": {", "        const pi = event.data.object;", "        const orderId = pi.metadata.orderId;", "        await Order.findByIdAndUpdate(orderId, {", "          paymentStatus: \"paid\",", "          paidAt: new Date(),", "          stripeChargeId: pi.latest_charge,", "        });", "        await emailQueue.add(\"order-confirmed\", { orderId });", "        break;", "      }", "      case \"payment_intent.payment_failed\": {", "        const pi = event.data.object;", "        await Order.findByIdAndUpdate(pi.metadata.orderId, {", "          paymentStatus: \"failed\",", "          paymentError: pi.last_payment_error?.message,", "        });", "        break;", "      }", "      case \"customer.subscription.deleted\": {", "        const sub = event.data.object;", "        await User.findOneAndUpdate(", "          { stripeSubscriptionId: sub.id },", "          { plan: \"free\", stripeSubscriptionId: null }", "        );", "        break;", "      }", "    }", "", "    res.json({ received: true });", "  }", ");", "", "// Stripe CLI for local testing", "// stripe login", "// stripe listen --forward-to localhost:3000/api/webhooks/stripe", "// stripe trigger payment_intent.succeeded"]}, {"t": "topic", "text": "Subscription Billing"}, {"t": "p", "text": "Stripe Subscriptions handle recurring payments automatically. You create a product and price in Stripe, then create a subscription for the customer. Stripe handles renewal, retries on failure, and proration."}, {"t": "p", "text": "Customer Portal: a hosted Stripe page where customers manage their own subscriptions (cancel, upgrade, update payment method). Zero code on your side."}, {"t": "code", "lang": "js", "lines": ["// Create subscription", "app.post(\"/api/subscriptions/create\", protect, async (req, res, next) => {", "  try {", "    const { priceId } = req.body; // Stripe Price ID from your dashboard", "", "    // Ensure user has a Stripe customer ID", "    let customerId = req.user.stripeCustomerId;", "    if (!customerId) {", "      const customer = await stripe.customers.create({", "        email: req.user.email,", "        name: req.user.name,", "        metadata: { userId: req.user._id.toString() },", "      });", "      customerId = customer.id;", "      await User.findByIdAndUpdate(req.user._id, { stripeCustomerId: customerId });", "    }", "", "    const subscription = await stripe.subscriptions.create({", "      customer: customerId,", "      items: [{ price: priceId }],", "      payment_behavior: \"default_incomplete\",", "      expand: [\"latest_invoice.payment_intent\"],", "    });", "", "    res.json({", "      subscriptionId: subscription.id,", "      clientSecret: subscription.latest_invoice.payment_intent.client_secret,", "    });", "  } catch (err) { next(err); }", "});", "", "// Customer Portal (let users manage their own sub)", "app.post(\"/api/subscriptions/portal\", protect, async (req, res) => {", "  const session = await stripe.billingPortal.sessions.create({", "    customer: req.user.stripeCustomerId,", "    return_url: process.env.CLIENT_URL + \"/dashboard\",", "  });", "  res.json({ url: session.url });", "});", "// Client: redirect to session.url"]}, {"t": "subhead", "text": "D2 — AWS S3 File Storage with Presigned URLs"}, {"t": "p", "text": "The correct pattern for file uploads in production: the client uploads directly to S3, bypassing your server entirely. Your server only generates a short-lived signed URL that authorises the upload. This eliminates memory pressure, bandwidth costs, and the 10MB Express body limit."}, {"t": "topic", "text": "Presigned URL Upload Pattern"}, {"t": "p", "text": "Flow: (1) client requests a presigned URL from your Express server; (2) Express calls S3 to generate a signed URL valid for 5 minutes; (3) client PUTs the file directly to S3 using that URL; (4) client tells Express the upload is complete with the S3 key; (5) Express saves the key to MongoDB."}, {"t": "p", "text": "Benefits: your server never sees the file contents (less memory, less bandwidth, cheaper), S3 handles large files up to 5TB, uploads go directly to a CDN-edge location near the user."}, {"t": "code", "lang": "js", "lines": ["const { S3Client, PutObjectCommand, GetObjectCommand, DeleteObjectCommand } = require(\"@aws-sdk/client-s3\");", "const { getSignedUrl } = require(\"@aws-sdk/s3-request-presigner\");", "const { randomUUID } = require(\"crypto\");", "", "const s3 = new S3Client({", "  region: process.env.AWS_REGION,", "  credentials: {", "    accessKeyId: process.env.AWS_ACCESS_KEY_ID,", "    secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY,", "  },", "});", "", "// Step 1: Generate presigned URL", "app.post(\"/api/uploads/presign\", protect, async (req, res, next) => {", "  try {", "    const { filename, contentType, size } = req.body;", "", "    // Validate before generating URL", "    const allowedTypes = [\"image/jpeg\", \"image/png\", \"image/webp\", \"application/pdf\"];", "    if (!allowedTypes.includes(contentType)) {", "      return res.status(400).json({ message: \"File type not allowed\" });", "    }", "    if (size > 10 * 1024 * 1024) { // 10MB limit", "      return res.status(400).json({ message: \"File too large\" });", "    }", "", "    // Generate a unique key", "    const ext = filename.split(\".\").pop();", "    const key = `uploads/${req.user._id}/${randomUUID()}.${ext}`;", "", "    const command = new PutObjectCommand({", "      Bucket: process.env.S3_BUCKET,", "      Key: key,", "      ContentType: contentType,", "      ContentLength: size,", "      // Metadata is stored with the object", "      Metadata: { userId: req.user._id.toString(), originalName: filename },", "    });", "", "    const presignedUrl = await getSignedUrl(s3, command, { expiresIn: 300 }); // 5 min", "", "    res.json({", "      uploadUrl: presignedUrl, // client PUTs directly here", "      key,                     // client sends this back after upload", "      publicUrl: `https://${process.env.S3_BUCKET}.s3.amazonaws.com/${key}`,", "    });", "  } catch (err) { next(err); }", "});", "", "// Client: upload directly to S3", "async function uploadFile(file) {", "  // Step 1: Get presigned URL from your server", "  const { uploadUrl, key, publicUrl } = await api.post(\"/uploads/presign\", {", "    filename: file.name,", "    contentType: file.type,", "    size: file.size,", "  });", "", "  // Step 2: PUT directly to S3 (no server involved)", "  await fetch(uploadUrl, {", "    method: \"PUT\",", "    headers: { \"Content-Type\": file.type },", "    body: file,", "  });", "", "  // Step 3: Tell your server the upload is done", "  await api.post(\"/posts/attach-image\", { key, publicUrl });", "", "  return publicUrl;", "}"]}, {"t": "topic", "text": "S3 Access Control & CloudFront CDN"}, {"t": "p", "text": "Never make S3 buckets public by default. Use IAM policies, bucket policies, or presigned GET URLs to control access."}, {"t": "p", "text": "CloudFront in front of S3: serves files from edge locations near users (lower latency), handles HTTPS, supports custom domains, and caches files (reducing S3 costs)."}, {"t": "p", "text": "Private files: generate presigned GET URLs from your server. These expire and are user-specific. Perfect for user uploads, invoices, and documents."}, {"t": "code", "lang": "js", "lines": ["// Generate presigned GET URL for private files", "app.get(\"/api/files/:key\", protect, async (req, res, next) => {", "  try {", "    // Verify user owns this file (check DB)", "    const file = await File.findOne({ key: req.params.key, owner: req.user._id });", "    if (!file) return res.status(404).json({ message: \"Not found\" });", "", "    const command = new GetObjectCommand({", "      Bucket: process.env.S3_BUCKET,", "      Key: req.params.key,", "    });", "    const url = await getSignedUrl(s3, command, { expiresIn: 3600 }); // 1 hour", "    res.json({ url });", "  } catch (err) { next(err); }", "});", "", "// CloudFront signed URL (for high-traffic private files)", "const { getSignedUrl: getCFSignedUrl } = require(\"@aws-sdk/cloudfront-signer\");", "", "function getCloudfrontUrl(key) {", "  return getCFSignedUrl({", "    url: `https://${process.env.CF_DOMAIN}/${key}`,", "    privateKey: process.env.CF_PRIVATE_KEY,", "    keyPairId: process.env.CF_KEY_PAIR_ID,", "    dateLessThan: new Date(Date.now() + 3600 * 1000).toISOString(),", "  });", "}", "", "// Delete file", "async function deleteFile(key) {", "  await s3.send(new DeleteObjectCommand({", "    Bucket: process.env.S3_BUCKET,", "    Key: key,", "  }));", "}"]}, {"t": "subhead", "text": "D3 — Transactional Email & Notifications"}, {"t": "topic", "text": "Transactional Email with React Email & Resend"}, {"t": "p", "text": "React Email: build email templates with React components. Outputs inline-styled HTML compatible with all email clients (including Outlook which has terrible CSS support)."}, {"t": "p", "text": "Resend: a developer-friendly email API with a generous free tier. Integrates naturally with React Email."}, {"t": "p", "text": "Deliverability: set up SPF, DKIM, and DMARC DNS records for your sending domain. Without these, your emails go to spam. Resend guides you through this setup."}, {"t": "code", "lang": "js", "lines": ["// Email template with React Email", "// emails/welcome.tsx", "import { Html, Head, Body, Container, Text, Button, Hr } from \"@react-email/components\";", "", "export function WelcomeEmail({ name, confirmUrl }) {", "  return (", "    <Html>", "      <Head />", "      <Body style={{ fontFamily: \"Arial, sans-serif\", backgroundColor: \"#f4f4f4\" }}>", "        <Container style={{ maxWidth: \"600px\", margin: \"0 auto\", backgroundColor: \"#ffffff\", padding: \"40px\" }}>", "          <Text style={{ fontSize: \"24px\", fontWeight: \"bold\" }}>", "            Welcome, {name}!", "          <\/Text>", "          <Text style={{ color: \"#666\" }}>", "            Thanks for signing up. Please confirm your email to get started.", "          <\/Text>", "          <Button href={confirmUrl} style={{ backgroundColor: \"#0070f3\", color: \"#fff\", padding: \"12px 24px\", borderRadius: \"4px\", textDecoration: \"none\" }}>", "            Confirm Email", "          <\/Button>", "          <Hr />", "          <Text style={{ fontSize: \"12px\", color: \"#999\" }}>", "            If you did not create an account, ignore this email.", "          <\/Text>", "        <\/Container>", "      <\/Body>", "    <\/Html>", "  );", "}", "", "// Send with Resend", "const { Resend } = require(\"resend\");", "const { render } = require(\"@react-email/components\");", "const { WelcomeEmail } = require(\"../emails/welcome\");", "", "const resend = new Resend(process.env.RESEND_API_KEY);", "", "async function sendWelcomeEmail(user, confirmToken) {", "  const confirmUrl = `${process.env.CLIENT_URL}/confirm?token=${confirmToken}`;", "  const html = render(<WelcomeEmail name={user.name} confirmUrl={confirmUrl} />);", "", "  await resend.emails.send({", "    from: \"MyApp <hello@myapp.com>\",", "    to: user.email,", "    subject: \"Confirm your MyApp account\",", "    html,", "  });", "}", "", "// BullMQ worker for email queue", "const emailWorker = new Worker(\"emails\", async (job) => {", "  const handlers = {", "    \"welcome\":          sendWelcomeEmail,", "    \"order-confirmed\":  sendOrderConfirmedEmail,", "    \"password-reset\":   sendPasswordResetEmail,", "  };", "  const handler = handlers[job.name];", "  if (handler) await handler(job.data);", "  else console.warn(\"Unknown email job:\", job.name);", "}, { connection, concurrency: 5 });"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter D", "body": ["E1: Implement a Stripe payment intent flow end to end in test mode, finalising the order only in the webhook.", "E2: Make the webhook idempotent by storing processed event ids, then replay the same event and prove nothing duplicates.", "E3: Build presigned-URL uploads with type/size validation and a cleanup job for abandoned uploads.", "E4: Send a transactional email (welcome or receipt) with a React Email template."]}]}, {"id": "pg20", "title": "Concurrent React — useTransition, useDeferredValue & Suspense", "sub": "Chapter E", "blocks": [{"t": "p", "text": "React 18 introduced concurrent rendering — the ability to interrupt, pause, and resume rendering work. These hooks let you mark updates as urgent or non-urgent, keeping the UI responsive during heavy computation."}, {"t": "topic", "text": "useTransition — Non-Urgent State Updates"}, {"t": "p", "text": "useTransition marks a state update as non-urgent. React can interrupt it if a more urgent update arrives (like a keypress). The UI stays responsive during the transition."}, {"t": "p", "text": "isPending: a boolean that is true while the transition is in progress. Use it to show a loading indicator without blocking the UI."}, {"t": "p", "text": "Use case: tab switches, page navigation, filtering large lists — any update where a brief delay is acceptable and keeping the UI interactive is more important."}, {"t": "code", "lang": "js", "lines": ["import { useState, useTransition } from \"react\";", "", "// Without useTransition: typing in the search box freezes", "// because filtering 10,000 items blocks the main thread", "", "// With useTransition: typing stays instant, filter lags slightly", "function SearchPage({ allItems }) {", "  const [query, setQuery] = useState(\"\");", "  const [filtered, setFiltered] = useState(allItems);", "  const [isPending, startTransition] = useTransition();", "", "  const handleSearch = (e) => {", "    const value = e.target.value;", "    setQuery(value);             // URGENT: update input immediately", "", "    startTransition(() => {", "      // NON-URGENT: React can delay this if user types again", "      setFiltered(allItems.filter(item =>", "        item.name.toLowerCase().includes(value.toLowerCase())", "      ));", "    });", "  };", "", "  return (", "    <>", "      <input value={query} onChange={handleSearch} placeholder=\"Search...\" />", "      {isPending && <span>Updating...<\/span>}", "      <ul style={{ opacity: isPending ? 0.6 : 1 }}>", "        {filtered.map(item => <li key={item.id}>{item.name}<\/li>)}", "      <\/ul>", "    <\/>", "  );", "}", "", "// Tab switching that stays responsive", "function TabContainer() {", "  const [tab, setTab] = useState(\"home\");", "  const [isPending, startTransition] = useTransition();", "", "  const switchTab = (newTab) => {", "    startTransition(() => setTab(newTab));", "  };", "", "  return (", "    <>", "      <nav>", "        {[\"home\", \"posts\", \"about\"].map(t => (", "          <button", "            key={t}", "            onClick={() => switchTab(t)}", "            style={{ opacity: isPending && tab !== t ? 0.7 : 1 }}", "          >", "            {t}", "          <\/button>", "        ))}", "      <\/nav>", "      <Suspense fallback={<Spinner />}>", "        <TabContent tab={tab} />", "      <\/Suspense>", "    <\/>", "  );", "}"]}, {"t": "topic", "text": "useDeferredValue — Deferred Rendering"}, {"t": "p", "text": "useDeferredValue defers re-rendering a slow part of the tree with the stale value while a fresh value loads. It is like a React-managed debounce — but smarter, because it does not use a fixed timer."}, {"t": "p", "text": "Difference from useTransition: useTransition wraps the state setter. useDeferredValue wraps the value that is passed to a slow component. Use useDeferredValue when you do not control the state update (e.g. it comes from a parent)."}, {"t": "code", "lang": "js", "lines": ["import { useState, useDeferredValue, memo } from \"react\";", "", "// The slow component (expensive to re-render)", "const HeavyList = memo(function HeavyList({ query }) {", "  // Simulate expensive filtering", "  const items = expensiveFilter(allItems, query);", "  return <ul>{items.map(i => <li key={i.id}>{i.name}<\/li>)}<\/ul>;", "});", "", "function SearchWithDeferred() {", "  const [query, setQuery] = useState(\"\");", "  const deferredQuery = useDeferredValue(query);", "", "  // query updates instantly (input stays responsive)", "  // deferredQuery updates after — used for the expensive render", "  const isStale = query !== deferredQuery;", "", "  return (", "    <>", "      <input", "        value={query}", "        onChange={e => setQuery(e.target.value)}", "        placeholder=\"Type to search...\"", "      />", "      <div style={{ opacity: isStale ? 0.5 : 1, transition: \"opacity 0.2s\" }}>", "        {/* Renders with deferred value — old value shown while computing new */}", "        <HeavyList query={deferredQuery} />", "      <\/div>", "    <\/>", "  );", "}", "", "// Rule: memo() is required for useDeferredValue to help", "// Without memo, React re-renders HeavyList with both old and new value"]}, {"t": "topic", "text": "Suspense for Data Fetching"}, {"t": "p", "text": "Suspense lets you declaratively specify a loading state for part of your component tree. The component throws a Promise when data is not ready — React catches it and shows the fallback."}, {"t": "p", "text": "TanStack Query + Suspense: in TanStack Query v5 the suspense: true option was removed — use useSuspenseQuery(), which suspends while loading (and guarantees data is defined), and wrap the component in <Suspense> plus an error boundary."}, {"t": "p", "text": "React 19 use() hook: the new hook that reads a Promise or Context inline. It suspends the component if the Promise is not yet resolved — simpler than throwing manually."}, {"t": "code", "lang": "js", "lines": ["// TanStack Query with Suspense", "import { useSuspenseQuery } from \"@tanstack/react-query\";", "", "// This component suspends while loading — no isLoading needed", "function UserProfile({ userId }) {", "  const { data: user } = useSuspenseQuery({", "    queryKey: [\"user\", userId],", "    queryFn: () => api.get(`/users/${userId}`),", "  });", "  return <div>{user.name}<\/div>; // never null — query guarantees data", "}", "", "// Wrap with Suspense and ErrorBoundary", "function ProfilePage({ userId }) {", "  return (", "    <ErrorBoundary fallback={<p>Something went wrong<\/p>}>", "      <Suspense fallback={<ProfileSkeleton />}>", "        <UserProfile userId={userId} />", "      <\/Suspense>", "    <\/ErrorBoundary>", "  );", "}", "", "// React 19: use() hook", "import { use, Suspense } from \"react\";", "", "function Message({ messagePromise }) {", "  const message = use(messagePromise); // suspends until resolved", "  return <p>{message}<\/p>;", "}", "", "function App() {", "  const msgPromise = fetchMessage(); // start fetching before render", "  return (", "    <Suspense fallback={<p>Loading...<\/p>}>", "      <Message messagePromise={msgPromise} />", "    <\/Suspense>", "  );", "}"]}, {"t": "topic", "text": "useOptimistic — Built-in Optimistic Updates"}, {"t": "p", "text": "React 19 ships useOptimistic as a first-class hook. It is simpler than the manual optimistic update pattern with TanStack Query."}, {"t": "p", "text": "The hook takes the current state and an updater function. While a Server Action is in progress, React shows the optimistic value. When the action completes, React reverts to the real server state."}, {"t": "code", "lang": "js", "lines": ["import { useOptimistic } from \"react\";", "", "function TodoList({ initialTodos, addTodoAction }) {", "  const [todos, setTodos] = useState(initialTodos);", "  const [optimisticTodos, addOptimistic] = useOptimistic(", "    todos,", "    (currentTodos, newTodo) => [", "      ...currentTodos,", "      { ...newTodo, id: \"temp-\" + Date.now(), isPending: true },", "    ]", "  );", "", "  const handleAdd = async (formData) => {", "    const newTodo = { text: formData.get(\"text\"), done: false };", "    addOptimistic(newTodo); // show immediately", "    const created = await addTodoAction(formData); // server action", "    setTodos(prev => [...prev, created]); // replace with real data", "  };", "", "  return (", "    <>", "      <form action={handleAdd}>", "        <input name=\"text\" /><button type=\"submit\">Add<\/button>", "      <\/form>", "      <ul>", "        {optimisticTodos.map(todo => (", "          <li key={todo.id} style={{ opacity: todo.isPending ? 0.5 : 1 }}>", "            {todo.text} {todo.isPending && \"(saving...)\"}", "          <\/li>", "        ))}", "      <\/ul>", "    <\/>", "  );", "}"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter E", "body": ["E1: Build a 10k-row filterable table; make typing janky on purpose, then fix it with useDeferredValue and virtualisation.", "E2: Wrap a slow tab switch in useTransition and show a pending indicator with isPending.", "E3: Convert a like button to useOptimistic and verify it reverts correctly when the server rejects."]}]}, {"id": "pg21", "title": "GraphQL with Apollo Server", "sub": "Chapter F", "blocks": [{"t": "p", "text": "GraphQL is a query language and runtime for APIs. Clients request exactly the data they need — no over-fetching (getting too many fields) or under-fetching (requiring multiple requests for related data)."}, {"t": "topic", "text": "GraphQL Schema, Resolvers & Apollo Server"}, {"t": "p", "text": "Schema: defines the types and operations available. Written in SDL (Schema Definition Language). Types have fields. Query type defines reads. Mutation type defines writes. Subscription type defines real-time streams."}, {"t": "p", "text": "Resolvers: functions that fulfil each field in the schema. A resolver receives (parent, args, context, info). Context is shared across all resolvers — use it for the authenticated user and database connection."}, {"t": "p", "text": "Apollo Server 4: the current version. Integrates with Express via expressMiddleware."}, {"t": "code", "lang": "js", "lines": ["const { ApolloServer, gql } = require(\"@apollo/server\");", "const { expressMiddleware } = require(\"@apollo/server/express4\");", "", "// Schema (SDL)", "const typeDefs = gql`", "  type User {", "    id: ID!", "    name: String!", "    email: String!", "    posts: [Post!]!", "    postCount: Int!", "  }", "", "  type Post {", "    id: ID!", "    title: String!", "    content: String!", "    author: User!", "    tags: [String!]!", "    createdAt: String!", "  }", "", "  type Query {", "    me: User", "    post(id: ID!): Post", "    posts(page: Int, limit: Int, tag: String): PostsResult!", "    searchPosts(query: String!): [Post!]!", "  }", "", "  type PostsResult {", "    posts: [Post!]!", "    total: Int!", "    hasMore: Boolean!", "  }", "", "  type Mutation {", "    createPost(title: String!, content: String!, tags: [String!]): Post!", "    updatePost(id: ID!, title: String, content: String): Post!", "    deletePost(id: ID!): Boolean!", "  }", "`;", "", "// Resolvers", "const resolvers = {", "  Query: {", "    me: (_, __, { user }) => user, // from context", "    post: (_, { id }) => Post.findById(id).lean(),", "    posts: async (_, { page = 1, limit = 10, tag }) => {", "      const filter = tag ? { tags: tag } : {};", "      const [posts, total] = await Promise.all([", "        Post.find(filter).skip((page-1)*limit).limit(limit).lean(),", "        Post.countDocuments(filter),", "      ]);", "      return { posts, total, hasMore: page * limit < total };", "    },", "  },", "  Mutation: {", "    createPost: async (_, args, { user }) => {", "      if (!user) throw new Error(\"Not authenticated\");", "      return Post.create({ ...args, author: user._id });", "    },", "    deletePost: async (_, { id }, { user }) => {", "      const post = await Post.findById(id);", "      if (!post) throw new Error(\"Not found\");", "      if (post.author.toString() !== user._id.toString()) throw new Error(\"Forbidden\");", "      await post.deleteOne();", "      return true;", "    },", "  },", "  // Field resolvers (resolve individual fields)", "  Post: {", "    author: (post) => User.findById(post.author).lean(),", "  },", "  User: {", "    posts: (user) => Post.find({ author: user._id }).lean(),", "    postCount: (user) => Post.countDocuments({ author: user._id }),", "  },", "};", "", "// Setup", "const server = new ApolloServer({ typeDefs, resolvers });", "await server.start();", "app.use(\"/graphql\", express.json(), expressMiddleware(server, {", "  context: async ({ req }) => ({", "    user: req.user, // set by protect middleware", "    db: mongoose.connection,", "  }),", "}));"]}, {"t": "topic", "text": "The N+1 Problem & DataLoader"}, {"t": "p", "text": "The N+1 problem: a query fetches a list of N posts, then for each post runs a separate query to fetch the author — N+1 total queries. At scale this destroys performance."}, {"t": "p", "text": "DataLoader: batches and caches resolver calls within a single request. Instead of N individual User.findById() calls, DataLoader batches them into a single User.find({ _id: { $in: [...] } }) call."}, {"t": "p", "text": "DataLoader is scoped per request — create a new instance per request so users do not see each other's cached data."}, {"t": "code", "lang": "js", "lines": ["const DataLoader = require(\"dataloader\");", "", "// Batch function: called once with all collected IDs", "async function batchUsers(ids) {", "  const users = await User.find({ _id: { $in: ids } }).lean();", "  // Must return in same order as ids", "  const map = new Map(users.map(u => [u._id.toString(), u]));", "  return ids.map(id => map.get(id.toString()) || null);", "}", "", "// Context: create loaders per-request (not module-level!)", "app.use(\"/graphql\", expressMiddleware(server, {", "  context: async ({ req }) => ({", "    user: req.user,", "    loaders: {", "      user: new DataLoader(batchUsers),   // new instance per request", "      post: new DataLoader(batchPosts),", "    },", "  }),", "}));", "", "// Resolver using DataLoader", "const resolvers = {", "  Post: {", "    // This is called for EACH post, but DataLoader batches them", "    author: (post, _, { loaders }) => loaders.user.load(post.author),", "    // Result: 1 query for all authors instead of N queries", "  },", "};", "", "// Without DataLoader: 11 DB queries for 10 posts", "// With DataLoader: 2 DB queries (1 for posts, 1 for all authors)"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter F", "body": ["E1: Build a GraphQL schema for posts/authors/comments with resolvers over MongoDB.", "E2: Demonstrate the N+1 problem with query logging, then eliminate it with DataLoader and count queries again.", "E3: Add pagination (Relay cursor connections), field-level auth, and query depth/complexity limits.", "E4: Write the same feature as REST and GraphQL, then argue both sides in your README."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Schema design: nullability, interfaces & unions"}, {"t": "li", "text": "Every field is nullable by default; ! means non-null. Over-using ! is risky — one resolver error nulls the whole parent chain up to the nearest nullable field."}, {"t": "li", "text": "Interfaces share fields across types (Node, Timestamped); unions model \"one of\" results — the standard way to return errors as data instead of throwing."}, {"t": "code", "lang": "graphql", "lines": ["union CreateUserResult = User | EmailTaken | ValidationError", "", "type Mutation { createUser(input: CreateUserInput!): CreateUserResult! }", "# clients handle every outcome with __typename — typed errors, no try/catch"]}, {"t": "topic", "text": "Pagination: Relay cursor connections"}, {"t": "code", "lang": "graphql", "lines": ["type PostConnection { edges: [PostEdge!]!  pageInfo: PageInfo! }", "type PostEdge { node: Post!  cursor: String! }", "type PageInfo { hasNextPage: Boolean!  endCursor: String }", "# posts(first: 20, after: \"cursor\") — stable under inserts, unlike offset"]}, {"t": "topic", "text": "Security: depth, complexity & persisted queries"}, {"t": "li", "text": "A single malicious query can nest author→posts→author forever. Defend with depth limits (graphql-depth-limit), cost/complexity analysis, and timeouts."}, {"t": "li", "text": "Disable introspection in production, rate-limit by complexity rather than request count, and prefer persisted (allow-listed) queries for public APIs."}, {"t": "li", "text": "Authorisation belongs in resolvers or the data layer — never trust the shape of the query. Field-level checks via context.user are the norm."}, {"t": "topic", "text": "Caching & the REST trade-off"}, {"t": "li", "text": "GraphQL loses HTTP caching (everything is a POST to one URL); you replace it with client normalised caches (Apollo/urql), persisted queries over GET, and server-side DataLoader batching."}, {"t": "li", "text": "Choose GraphQL when many clients need different shapes of deeply related data; choose REST when endpoints are few, caching matters, and files/streaming are involved. Saying \"REST for this service, GraphQL for the BFF\" is a strong senior answer."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["The two questions that always come: \"how do you solve N+1?\" (DataLoader batching per request) and \"how do you stop an expensive query?\" (depth + complexity limits). Have both ready."]}]}, {"id": "pg22", "title": "Accessibility, i18n & Animation", "sub": "Chapter G", "blocks": [{"t": "subhead", "text": "G1 — Accessibility (a11y) in Depth"}, {"t": "topic", "text": "WCAG 2.2 & ARIA Fundamentals"}, {"t": "p", "text": "WCAG 2.2 has four principles: Perceivable (users can perceive all content), Operable (users can operate the interface), Understandable (users can understand content and operation), Robust (content is interpreted by assistive technologies)."}, {"t": "p", "text": "ARIA (Accessible Rich Internet Applications): attributes that add semantic meaning to HTML elements for screen readers. Rule: do not use ARIA if native HTML provides the same semantics."}, {"t": "p", "text": "The ARIA tree: roles (what the element is), states (aria-checked, aria-expanded, aria-disabled), properties (aria-label, aria-labelledby, aria-describedby, aria-live)."}, {"t": "p", "text": "aria-live regions: announce dynamic content to screen readers without focus moving. Use aria-live=\"polite\" for non-urgent updates, aria-live=\"assertive\" for urgent alerts."}, {"t": "code", "lang": "js", "lines": ["// Accessible form", "function AccessibleForm() {", "  const [errors, setErrors] = useState({});", "  const errorId = useId(); // stable ID for aria-describedby", "", "  return (", "    <form onSubmit={handleSubmit} noValidate>", "      <div>", "        <label htmlFor=\"email\">", "          Email address", "          <span aria-hidden=\"true\" style={{ color: \"red\" }}> *<\/span>", "          <span className=\"sr-only\"> (required)<\/span>", "        <\/label>", "        <input", "          id=\"email\"", "          type=\"email\"", "          name=\"email\"", "          aria-required=\"true\"", "          aria-invalid={!!errors.email}", "          aria-describedby={errors.email ? `${errorId}-email` : undefined}", "          autoComplete=\"email\"", "        />", "        {errors.email && (", "          <span id={`${errorId}-email`} role=\"alert\" style={{ color: \"red\" }}>", "            {errors.email}", "          <\/span>", "        )}", "      <\/div>", "    <\/form>", "  );", "}", "", "// aria-live region for dynamic content", "function StatusAnnouncer() {", "  const [message, setMessage] = useState(\"\");", "  return (", "    <div", "      aria-live=\"polite\"", "      aria-atomic=\"true\"", "      className=\"sr-only\"  // visually hidden but announced", "    >", "      {message}", "    <\/div>", "  );", "}", "", "// Screen-reader only utility class", "// .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;", "//   overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }"]}, {"t": "topic", "text": "Focus Management & Keyboard Navigation"}, {"t": "p", "text": "Focus trapping: when a modal opens, focus must stay inside it until it closes. Users navigating by keyboard must not be able to Tab out of the modal."}, {"t": "p", "text": "Skip links: a visually hidden link at the top of every page that jumps to the main content. Essential for keyboard users who do not want to Tab through the navigation on every page."}, {"t": "p", "text": "Focus restoration: when a modal or drawer closes, focus should return to the element that opened it."}, {"t": "code", "lang": "js", "lines": ["import { useRef, useEffect } from \"react\";", "", "// Focus trap hook for modals", "function useFocusTrap(isOpen) {", "  const containerRef = useRef(null);", "  const previousFocusRef = useRef(null);", "", "  useEffect(() => {", "    if (!isOpen) return;", "", "    // Save previous focus", "    previousFocusRef.current = document.activeElement;", "", "    // Focus first focusable element in modal", "    const focusable = containerRef.current?.querySelectorAll(", "      \"button, input, select, textarea, a[href], [tabindex]:not([tabindex=-1])\"", "    );", "    focusable?.[0]?.focus();", "", "    // Trap focus inside modal", "    const handleKeyDown = (e) => {", "      if (e.key !== \"Tab\") return;", "      const first = focusable[0];", "      const last = focusable[focusable.length - 1];", "      if (e.shiftKey) {", "        if (document.activeElement === first) { e.preventDefault(); last.focus(); }", "      } else {", "        if (document.activeElement === last) { e.preventDefault(); first.focus(); }", "      }", "    };", "", "    document.addEventListener(\"keydown\", handleKeyDown);", "    return () => {", "      document.removeEventListener(\"keydown\", handleKeyDown);", "      previousFocusRef.current?.focus(); // restore focus on close", "    };", "  }, [isOpen]);", "", "  return containerRef;", "}", "", "// Skip link (first element in body)", "function SkipLink() {", "  return (", "    <a", "      href=\"#main-content\"", "      style={{", "        position: \"absolute\",", "        left: \"-9999px\",", "        // Becomes visible on focus", "      }}", "      onFocus={e => (e.target.style.left = \"1rem\")}", "      onBlur={e => (e.target.style.left = \"-9999px\")}", "    >", "      Skip to main content", "    <\/a>", "  );", "}", "", "// Accessible Modal using focus trap", "function Modal({ isOpen, onClose, title, children }) {", "  const containerRef = useFocusTrap(isOpen);", "", "  useEffect(() => {", "    const handleEsc = (e) => { if (e.key === \"Escape\") onClose(); };", "    document.addEventListener(\"keydown\", handleEsc);", "    return () => document.removeEventListener(\"keydown\", handleEsc);", "  }, [onClose]);", "", "  if (!isOpen) return null;", "  return (", "    <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\" ref={containerRef}>", "      <h2 id=\"modal-title\">{title}<\/h2>", "      {children}", "      <button onClick={onClose}>Close<\/button>", "    <\/div>", "  );", "}"]}, {"t": "subhead", "text": "G2 — Internationalisation (i18n) & RTL Support"}, {"t": "topic", "text": "react-i18next & ICU Message Format"}, {"t": "p", "text": "react-i18next is the standard i18n library for React. It supports namespaces (separate translation files by feature), pluralisation, interpolation, and lazy loading of translation files."}, {"t": "p", "text": "ICU message format: a standard for complex messages — pluralisation ({count, plural, one {# item} other {# items}}), select ({gender, select, male {He} female {She} other {They}})."}, {"t": "p", "text": "Arabic and RTL: Arabic is read right-to-left. Set dir=\"rtl\" on the html element. Use logical CSS properties (padding-inline-start instead of padding-left) to avoid maintaining two stylesheets."}, {"t": "code", "lang": "js", "lines": ["// i18n setup (i18n.js)", "import i18n from \"i18next\";", "import { initReactI18next } from \"react-i18next\";", "import LanguageDetector from \"i18next-browser-languagedetector\";", "import Backend from \"i18next-http-backend\"; // lazy load translations", "", "i18n", "  .use(Backend)", "  .use(LanguageDetector)", "  .use(initReactI18next)", "  .init({", "    fallbackLng: \"en\",", "    supportedLngs: [\"en\", \"ar\"],", "    ns: [\"common\", \"auth\", \"dashboard\"],", "    defaultNS: \"common\",", "    interpolation: { escapeValue: false },", "    backend: { loadPath: \"/locales/{{lng}}/{{ns}}.json\" },", "  });", "", "// Translation files", "// public/locales/en/common.json", "// { \"greeting\": \"Hello, {{name}}!\", \"items\": \"{count, plural, one {# item} other {# items}}\" }", "// public/locales/ar/common.json", "// { \"greeting\": \"مرحباً، {{name}}!\", \"items\": \"{{count}} عنصر\" }", "", "// Component", "import { useTranslation } from \"react-i18next\";", "", "function Header() {", "  const { t, i18n } = useTranslation(\"common\");", "", "  return (", "    <header dir={i18n.language === \"ar\" ? \"rtl\" : \"ltr\"}>", "      <h1>{t(\"greeting\", { name: \"Ahmed\" })}<\/h1>", "      <p>{t(\"items\", { count: 5 })}<\/p>", "      <button onClick={() => i18n.changeLanguage(\"ar\")}>العربية<\/button>", "      <button onClick={() => i18n.changeLanguage(\"en\")}>English<\/button>", "    <\/header>", "  );", "}", "", "// RTL-safe CSS (use logical properties)", "/* WRONG: breaks in RTL */", "/* .card { padding-left: 1rem; border-left: 2px solid blue; } */", "", "/* CORRECT: flips automatically in RTL */", "/* .card { padding-inline-start: 1rem; border-inline-start: 2px solid blue; } */", "", "// Intl API for dates and numbers", "const formatter = new Intl.DateTimeFormat(\"ar-EG\", {", "  day: \"numeric\", month: \"long\", year: \"numeric\",", "});", "formatter.format(new Date()); // \"١١ مايو ٢٠٢٥\"", "", "const currency = new Intl.NumberFormat(\"ar-EG\", {", "  style: \"currency\", currency: \"EGP\",", "});", "currency.format(1500); // \"١٬٥٠٠٫٠٠ ج.م.\""]}, {"t": "subhead", "text": "G3 — Animation with Framer Motion"}, {"t": "topic", "text": "Framer Motion — Production Animations"}, {"t": "p", "text": "Framer Motion is the standard React animation library. It uses a declarative API: describe the initial state, the animated state, and the exit state. Framer handles the interpolation."}, {"t": "p", "text": "AnimatePresence: required for exit animations. React removes DOM nodes immediately on unmount — AnimatePresence delays removal until the exit animation completes."}, {"t": "p", "text": "Layout animations: add layout to any motion element. When its size or position changes (due to state changes), Framer automatically animates the transition. No manual FLIP calculation needed."}, {"t": "p", "text": "Gesture animations: whileHover, whileTap, whileDrag — add interactive feel with zero event listeners."}, {"t": "code", "lang": "js", "lines": ["import { motion, AnimatePresence } from \"framer-motion\";", "", "// Basic animation: fade and slide in", "function Card({ children }) {", "  return (", "    <motion.div", "      initial={{ opacity: 0, y: 20 }}  // start state", "      animate={{ opacity: 1, y: 0 }}   // end state", "      exit={{ opacity: 0, y: -20 }}    // when removed", "      transition={{ duration: 0.3, ease: \"easeOut\" }}", "      whileHover={{ scale: 1.02, boxShadow: \"0 8px 30px rgba(0,0,0,0.12)\" }}", "      whileTap={{ scale: 0.98 }}", "    >", "      {children}", "    <\/motion.div>", "  );", "}", "", "// AnimatePresence for list items", "function TodoList({ todos }) {", "  return (", "    <ul>", "      <AnimatePresence mode=\"popLayout\">", "        {todos.map(todo => (", "          <motion.li", "            key={todo.id}", "            layout  // animates layout changes", "            initial={{ opacity: 0, x: -20 }}", "            animate={{ opacity: 1, x: 0 }}", "            exit={{ opacity: 0, x: 20 }}", "            transition={{ duration: 0.2 }}", "          >", "            {todo.text}", "          <\/motion.li>", "        ))}", "      <\/AnimatePresence>", "    <\/ul>", "  );", "}", "", "// Page transition (in Next.js App Router)", "export default function Template({ children }) {", "  return (", "    <motion.main", "      initial={{ opacity: 0, y: 10 }}", "      animate={{ opacity: 1, y: 0 }}", "      transition={{ duration: 0.25 }}", "    >", "      {children}", "    <\/motion.main>", "  );", "}", "// app/template.tsx replaces content on every navigation", "", "// Shared layout animation (hero image expands to full screen)", "function ProductCard({ id, image }) {", "  return (", "    <Link href={`/products/${id}`}>", "      <motion.img", "        layoutId={`product-image-${id}`}  // same ID on detail page", "        src={image}", "      />", "    <\/Link>", "  );", "}", "", "function ProductDetail({ id, image }) {", "  return (", "    <motion.img", "      layoutId={`product-image-${id}`}  // Framer animates between the two", "      src={image}", "    />", "  );", "}"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter G", "body": ["E1: Run axe DevTools on a capstone and fix every violation; then navigate the whole app with keyboard only.", "E2: Build an accessible modal: focus trap, restore focus on close, Escape to dismiss, correct aria roles.", "E3: Add i18n with react-i18next for two languages including plurals, dates and an RTL layout check.", "E4: Animate a list with Framer Motion (enter/exit) and respect prefers-reduced-motion."]}]}, {"id": "pgH", "title": "Modern MERN — React 19, Node 22, Express 5 & AI Features", "sub": "Chapter H · New", "blocks": [{"t": "callout", "kind": "info", "title": "About this chapter", "body": ["This chapter extends the original reference with what changed in the ecosystem through 2025-2026: React 19, React Server Components, Express 5, the modern Node.js runtime, MongoDB 8 / Atlas Vector Search, and the patterns for adding AI features to a MERN app. Treat it as required reading after Phase 4."]}, {"t": "subhead", "text": "Stack version status — October 2026"}, {"t": "table", "rows": [["Component", "Status (Oct 2026)", "What it means for you"], ["Node.js 24", "Active LTS (until late 2026, maintenance to May 2028)", "the production default today"], ["Node.js 26", "Current; scheduled to become LTS on Oct 28 2026", "adopt for new projects once it hits LTS"], ["Node.js 22", "Maintenance LTS until Apr 2027", "fine, but plan the upgrade"], ["Node.js 20", "End of life since Apr 30 2026", "upgrade — no more security fixes"], ["Next.js 16", "current major", "proxy.ts replaces middleware.ts; Turbopack default"], ["Mongoose 9", "current major", "async/sync pre hooks only — next() removed"], ["Express 5", "current major", "async errors forwarded automatically"]]}, {"t": "callout", "kind": "info", "title": "Release-schedule change", "body": ["Starting with Node.js 27, Node moves to one major release per year (April) and every release becomes LTS each October — the odd/even split ends. Node 26 is the last line on the old model. Versions move fast: confirm against nodejs.org/en/about/previous-releases and each library's changelog before pinning."]}, {"t": "subhead", "text": "H1 — React 19: Actions, new hooks & the Compiler"}, {"t": "topic", "text": "Actions & useActionState"}, {"t": "p", "text": "React 19 formalises \"Actions\": async functions passed to form action or startTransition that manage pending state, errors, and optimistic updates for you. useActionState wraps an action and returns the latest result, a form-ready action, and a pending flag — replacing the useState + loading + error boilerplate around every mutation."}, {"t": "code", "lang": "js", "lines": ["function ChangeName() {", "  const [error, submitAction, isPending] = useActionState(", "    async (prevState, formData) => {", "      const err = await updateName(formData.get(\"name\"));", "      if (err) return err;      // becomes the new state", "      redirect(\"/profile\");", "      return null;", "    },", "    null", "  );", "  return (", "    <form action={submitAction}>", "      <input name=\"name\" />", "      <button disabled={isPending}>Update<\/button>", "      {error && <p role=\"alert\">{error}<\/p>}", "    <\/form>", "  );", "}"]}, {"t": "topic", "text": "useOptimistic"}, {"t": "p", "text": "useOptimistic renders an optimistic value while an async action is in flight, then automatically reverts to the real state when the action settles. It is the standard way to build instant-feeling likes, comments, and cart updates."}, {"t": "code", "lang": "js", "lines": ["const [optimisticTodos, addOptimistic] = useOptimistic(", "  todos,", "  (state, newTodo) => [...state, { ...newTodo, pending: true }]", ");", "", "async function create(formData) {", "  const todo = { title: formData.get(\"title\") };", "  addOptimistic(todo);        // UI updates instantly", "  await api.createTodo(todo); // real state arrives via revalidation", "}"]}, {"t": "topic", "text": "use() — reading promises and context"}, {"t": "p", "text": "use(promise) suspends the component until the promise resolves and integrates with Suspense boundaries; use(Context) reads context conditionally (allowed inside if blocks, unlike useContext). Pass promises down from Server Components and unwrap them in the client with use()."}, {"t": "topic", "text": "Smaller quality-of-life changes"}, {"t": "li", "text": "ref is a normal prop — forwardRef is no longer needed for function components."}, {"t": "li", "text": "<Context> can be rendered directly as a provider: <ThemeContext value=\"dark\">."}, {"t": "li", "text": "Document metadata: <title>, <meta>, <link> rendered inside components are hoisted to <head> automatically."}, {"t": "li", "text": "Better hydration error diffs and support for preloading resources (preload, preinit APIs)."}, {"t": "topic", "text": "React Compiler"}, {"t": "p", "text": "The React Compiler automatically memoises components and values at build time by analysing your code, largely removing the need for manual useMemo / useCallback / React.memo. Code must follow the Rules of React (pure render, no mutation of props/state) for the compiler to optimise it — another reason the rules matter in interviews."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["When asked about memoisation in 2026, the strong answer mentions: profile first, memoise what matters, and note that the React Compiler is making manual memoisation increasingly unnecessary for new codebases."]}, {"t": "subhead", "text": "H2 — React Server Components & Next.js 15+"}, {"t": "topic", "text": "The RSC mental model"}, {"t": "p", "text": "Server Components run only on the server: they can read the database or filesystem directly, ship zero JS to the browser, and render to a serialised tree streamed to the client. Client Components (\"use client\") hydrate normally and hold interactivity. The boundary is per-component, and props crossing it must be serialisable."}, {"t": "li", "text": "RSC vs SSR: SSR renders HTML for the first paint but still ships and hydrates all component JS. RSC removes server-only components from the bundle entirely."}, {"t": "li", "text": "Data flows down: fetch in Server Components, pass data (or promises) to Client Components."}, {"t": "li", "text": "Server Actions (\"use server\") are RPC endpoints generated from functions — the standard mutation path in App Router."}, {"t": "code", "lang": "js", "lines": ["// app/orders/page.jsx — Server Component (default)", "import { db } from \"@/lib/db\";", "import OrderTable from \"./OrderTable\";      // client component", "", "export default async function OrdersPage() {", "  const orders = await db.order.findMany(); // direct DB access", "  return <OrderTable initialOrders={orders} />;", "}", "", "// app/orders/actions.js", "\"use server\";", "export async function cancelOrder(id) {", "  await db.order.update({ where: { id }, data: { status: \"cancelled\" } });", "  revalidatePath(\"/orders\");", "}"]}, {"t": "topic", "text": "Next.js 15 → 16 changes worth knowing"}, {"t": "li", "text": "Async request APIs: cookies(), headers(), params and searchParams are now awaited."}, {"t": "li", "text": "Caching defaults flipped: fetch requests and route handlers are uncached by default — you opt in to caching instead of opting out."}, {"t": "li", "text": "Turbopack is the stable dev bundler; builds are dramatically faster than webpack."}, {"t": "li", "text": "after() lets you run work after the response streams to the user (logging, analytics)."}, {"t": "li", "text": "Next.js 16: middleware.ts is renamed proxy.ts (export function proxy) and runs on the Node.js runtime; middleware.ts remains only as a deprecated option for Edge-runtime needs. The codemod npx @next/codemod@canary middleware-to-proxy . does the rename."}, {"t": "li", "text": "Next.js 16 also made Turbopack the default bundler and reorganised caching around explicit opt-in — re-read the caching docs when upgrading rather than assuming 15-era behaviour."}, {"t": "subhead", "text": "H3 — Node.js runtime (22 → 24 LTS → 26)"}, {"t": "li", "text": "Native test runner: node --test with node:test and node:assert — no Jest needed for backend unit tests."}, {"t": "li", "text": "Watch mode: node --watch server.js replaces nodemon."}, {"t": "li", "text": "Native fetch, WebSocket client, and .env support: node --env-file=.env app.js."}, {"t": "li", "text": "ESM is the default mental model for new projects; require(esm) interop landed in Node 22."}, {"t": "li", "text": "Permission model (--permission) restricts filesystem/network access for untrusted code."}, {"t": "code", "lang": "js", "lines": ["// user.test.js — zero-dependency testing", "import { test } from \"node:test\";", "import assert from \"node:assert/strict\";", "import { slugify } from \"./slugify.js\";", "", "test(\"slugify lowercases and hyphenates\", () => {", "  assert.equal(slugify(\"Hello World\"), \"hello-world\");", "});", "// run: node --test"]}, {"t": "subhead", "text": "H4 — Express 5"}, {"t": "p", "text": "Express 5 finally shipped. The migration is small but the changes are common interview bait:"}, {"t": "li", "text": "Rejected promises in async handlers are forwarded to error middleware automatically — no more express-async-handler wrappers or try/catch(next)."}, {"t": "li", "text": "path-to-regexp upgraded: optional params use {} syntax (/users{/:id}), * wildcards must be named (/files/*splat), and regex shortcuts in strings were removed (ReDoS protection)."}, {"t": "li", "text": "Removed: app.del(), res.sendfile(), and callback-era aliases; res.status() rejects invalid codes."}, {"t": "li", "text": "Node 18+ required; body-parser re-integrated as express.json() / express.urlencoded() with stricter defaults."}, {"t": "code", "lang": "js", "lines": ["// Express 5: async errors just work", "app.get(\"/users/:id\", async (req, res) => {", "  const user = await User.findById(req.params.id).orFail();", "  res.json(user);          // a rejection here hits the error", "});                        // middleware — no try/catch needed", "", "app.use((err, req, res, next) => {", "  if (err.name === \"DocumentNotFoundError\")", "    return res.status(404).json({ error: \"Not found\" });", "  res.status(500).json({ error: \"Server error\" });", "});"]}, {"t": "subhead", "text": "H5 — MongoDB 8 & Atlas Vector Search"}, {"t": "li", "text": "MongoDB 8.0: significantly faster reads/writes and time-series, plus Queryable Encryption with range queries — fields stay encrypted even during queries."}, {"t": "li", "text": "Atlas Vector Search stores embeddings next to your documents; $vectorSearch runs approximate nearest-neighbour queries inside the aggregation pipeline."}, {"t": "li", "text": "Pattern: one collection holds the document, its metadata, and its embedding — no separate vector database needed for most apps."}, {"t": "code", "lang": "js", "lines": ["// RAG retrieval step with Atlas Vector Search", "const results = await db.collection(\"docs\").aggregate([", "  {", "    $vectorSearch: {", "      index: \"embedding_index\",", "      path: \"embedding\",", "      queryVector: await embed(userQuestion), // 1536-dim array", "      numCandidates: 200,", "      limit: 5,", "    }", "  },", "  { $project: { text: 1, score: { $meta: \"vectorSearchScore\" } } }", "]).toArray();"]}, {"t": "subhead", "text": "H6 — Adding AI features to a MERN app"}, {"t": "p", "text": "The standard architecture: the browser never holds the LLM API key. React calls your Express/Next API route; the server calls the model with streaming enabled and forwards tokens to the client via Server-Sent Events or a streamed fetch response."}, {"t": "code", "lang": "js", "lines": ["// Express route: stream model output to the browser via SSE", "app.post(\"/api/chat\", async (req, res) => {", "  res.setHeader(\"Content-Type\", \"text/event-stream\");", "  res.setHeader(\"Cache-Control\", \"no-cache\");", "  const stream = await llm.chat({ messages: req.body.messages, stream: true });", "  for await (const chunk of stream) {", "    res.write(`data: ${JSON.stringify(chunk.delta)}\\n\\n`);", "  }", "  res.write(\"data: [DONE]\\n\\n\");", "  res.end();", "});"]}, {"t": "code", "lang": "js", "lines": ["// React side: consume the stream", "const res = await fetch(\"/api/chat\", { method: \"POST\", body });", "const reader = res.body.getReader();", "const decoder = new TextDecoder();", "while (true) {", "  const { done,
