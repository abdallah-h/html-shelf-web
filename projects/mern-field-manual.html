rs down the old tree and builds a new one from scratch."}, {"t": "p", "text": "2. Keys help identify stable list elements: without keys, React re-renders all list items on any change. With stable, unique keys React can identify which items moved, which are new, and which were removed."}, {"t": "p", "text": "The algorithm works top-down, comparing node by node. When it finds a difference, it replaces that node and all descendants."}, {"t": "p", "text": "concurrent rendering adds \"work-in-progress\" fibers — React builds the new tree in memory (can be interrupted), then commits atomically."}, {"t": "code", "lang": "js", "lines": ["// Keys must be stable, unique, and not the array index", "// BAD: index changes on sort/filter — causes unnecessary re-renders", "{items.map((item, i) => <Item key={i} {...item} />)}", "", "// GOOD: stable unique ID from data", "{items.map(item => <Item key={item.id} {...item} />)}", "", "// Type change: React destroys Counter and mounts TextInput", "// All Counter state is lost", "{isEditing ? <TextInput /> : <Counter />}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Expert question: \"what is a React Fiber?\" — A Fiber is a unit of work representing one React element. The Fiber architecture (React 16+) allows rendering to be split into chunks and prioritised. Each Fiber has a return (parent), child, and sibling pointer."]}]}]}, {"id": "v1s3", "title": "Next.js", "sub": "", "qs": [{"num": "Q21", "title": "What are the different rendering strategies in Next.js?", "level": "Junior", "blocks": [{"t": "p", "text": "Next.js supports four rendering strategies:"}, {"t": "li", "text": "SSG (Static Site Generation): HTML generated at build time. Served from CDN. Fastest. Use for content that rarely changes (blog posts, marketing pages, docs)."}, {"t": "li", "text": "SSR (Server-Side Rendering): HTML generated on every request. Fresh data always. Slower TTFB. Use for dashboards, personalised pages, data that changes frequently."}, {"t": "li", "text": "ISR (Incremental Static Regeneration): Start with SSG. Regenerate the page in the background after a revalidate period. Best of both worlds for most content."}, {"t": "li", "text": "CSR (Client-Side Rendering): No server HTML for the page. JS loads, fetches data, renders. Use for highly interactive apps where SEO is not needed."}, {"t": "code", "lang": "js", "lines": ["// SSG — generateStaticParams + no revalidate", "export async function generateStaticParams() {", "  return (await getSlugs()).map(slug => ({ slug }));", "}", "", "// ISR — add revalidate (seconds)", "export const revalidate = 60; // rebuild every 60s", "", "// SSR — force dynamic (every request)", "export const dynamic = \"force-dynamic\";", "", "// Or per-fetch:", "fetch(url, { cache: \"force-cache\" });   // SSG", "fetch(url, { next: { revalidate: 60 } }); // ISR", "fetch(url, { cache: \"no-store\" });      // SSR"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know which strategy to recommend for which use case. A common scenario question: \"you have a news site with 10,000 articles\" — answer: ISR with revalidate: 300."]}]}, {"num": "Q22", "title": "What are React Server Components? How do they differ from Client Components?", "level": "Mid", "blocks": [{"t": "p", "text": "Server Components (RSC): render ONLY on the server. They can directly access databases, file system, and server-side APIs. They produce zero client-side JavaScript. They cannot use useState, useEffect, or browser APIs."}, {"t": "p", "text": "Client Components: render on the server (for initial HTML) AND on the client (for interactivity). Marked with \"use client\" directive. Can use all React hooks."}, {"t": "p", "text": "Key rules:"}, {"t": "li", "text": "Server Components can import and render Client Components"}, {"t": "li", "text": "Client Components CANNOT import Server Components (but can receive them as children props)"}, {"t": "li", "text": "Data fetching in Server Components: direct await, no useEffect needed"}, {"t": "p", "text": "The mental model: default to Server Components. Add \"use client\" only when you need interactivity."}, {"t": "code", "lang": "js", "lines": ["// Server Component (default — no directive needed)", "async function UserProfile({ userId }) {", "  const user = await db.users.findById(userId); // direct DB access!", "  return <div>{user.name}<\/div>; // 0 JS sent to client", "}", "", "// Client Component (opt in to interactivity)", "\"use client\";", "import { useState } from \"react\";", "", "function LikeButton({ initialCount }) {", "  const [count, setCount] = useState(initialCount);", "  return <button onClick={() => setCount(c => c + 1)}>{count}<\/button>;", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Common interview trap: \"can a Server Component use useState?\" — No. \"Can a Server Component be async?\" — Yes, and that's one of their biggest advantages."]}]}, {"num": "Q23", "title": "What are Next.js Server Actions and when would you use them?", "level": "Mid", "blocks": [{"t": "p", "text": "Server Actions are async functions that run on the server but can be called directly from Client Components — no separate API route needed. They are marked with the \"use server\" directive (either at the file level or inside a function)."}, {"t": "p", "text": "Use cases: form submissions, data mutations, any write operation that should run on the server. They replace simple POST API routes."}, {"t": "p", "text": "Benefits: no API boilerplate, TypeScript end-to-end without extra type definitions, automatic CSRF protection, progressive enhancement (forms work without JavaScript)."}, {"t": "p", "text": "Limitations: not suitable for complex APIs (use Express for that), cannot stream responses, must validate all input (they are exposed endpoints)."}, {"t": "code", "lang": "js", "lines": ["// app/actions/posts.ts", "\"use server\";", "export async function createPost(formData: FormData) {", "  const title = formData.get(\"title\") as string;", "  // Zod validation", "  const parsed = CreatePostSchema.safeParse({ title });", "  if (!parsed.success) return { error: parsed.error.flatten() };", "  const post = await Post.create({ title, author: await getSessionUserId() });", "  revalidatePath(\"/posts\");", "  redirect(`/posts/${post.slug}`);", "}", "", "// Client usage", "<form action={createPost}><input name=\"title\" /><button>Create<\/button><\/form>"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention progressive enhancement — Server Actions work even with JavaScript disabled because they fall back to standard HTML form submission. This is a key architectural advantage."]}]}, {"num": "Q24", "title": "How does Next.js middleware work and what are its use cases?", "level": "Senior", "blocks": [{"t": "p", "text": "Next.js Middleware runs at the Edge (CDN nodes) before the request reaches your server. It executes before routing, allowing you to inspect and modify the request/response."}, {"t": "p", "text": "Middleware runs in the Edge Runtime — a lightweight V8 environment without Node.js APIs (no fs, no net, no heavy libraries). Use edge-compatible alternatives (jose for JWT, not jsonwebtoken)."}, {"t": "p", "text": "Use cases: authentication (redirect unauthenticated users before the page renders), A/B testing (serve different variants based on cookie), geolocation-based routing, rate limiting, request rewriting."}, {"t": "p", "text": "The file lives at the project root as proxy.ts (Next.js 16+; it was middleware.ts in Next.js 15 and earlier, and the exported function is now named proxy)."}, {"t": "code", "lang": "js", "lines": ["// proxy.ts — Next.js 16+ (was middleware.ts; runs on the Node.js runtime)", "import { NextResponse } from \"next/server\";", "import { jwtVerify } from \"jose\"; // works on Node and Edge runtimes", "", "export async function proxy(request) {", "  const token = request.cookies.get(\"token\")?.value;", "  if (!token) {", "    return NextResponse.redirect(new URL(\"/login\", request.url));", "  }", "  const secret = new TextEncoder().encode(process.env.JWT_SECRET);", "  try {", "    const { payload } = await jwtVerify(token, secret);", "    const res = NextResponse.next();", "    res.headers.set(\"x-user-id\", payload.sub);", "    return res;", "  } catch {", "    return NextResponse.redirect(new URL(\"/login\", request.url));", "  }", "}", "export const config = { matcher: [\"/dashboard/:path*\"] };"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Emphasise the Edge Runtime constraint — this trips up many candidates. If asked \"can you use mongoose in middleware?\" — No, mongoose uses the Node.js net module which is unavailable at the edge."]}]}]}, {"id": "v1s4", "title": "Node.js", "sub": "", "qs": [{"num": "Q25", "title": "What is Node.js and how is it different from browser JavaScript?", "level": "Junior", "blocks": [{"t": "p", "text": "Node.js is a JavaScript runtime built on Chrome's V8 engine. It runs JavaScript outside the browser — on servers, CLIs, and scripts."}, {"t": "p", "text": "Key differences from browser JS:"}, {"t": "li", "text": "No DOM, no window, no document"}, {"t": "li", "text": "Has access to file system (fs), network (net, http), process, child_process, crypto"}, {"t": "li", "text": "Uses CommonJS (require/module.exports) or ESM (import/export)"}, {"t": "li", "text": "Has a different event loop implementation (libuv with 6 phases, not browser event loop)"}, {"t": "li", "text": "Can run multiple process instances (cluster module, worker_threads)"}, {"t": "p", "text": "The same JavaScript language, completely different standard library and environment."}, {"t": "code", "lang": "js", "lines": ["// Browser-only", "document.getElementById(\"btn\").addEventListener(\"click\", () => {});", "", "// Node.js-only", "const fs = require(\"fs/promises\");", "const data = await fs.readFile(\"config.json\", \"utf-8\");", "", "// Works in both (ES2020+)", "const result = [1,2,3].map(x => x * 2);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Common question: \"is Node.js multi-threaded?\" — Node.js JS execution is single-threaded, but libuv uses a thread pool (4 threads by default) for I/O operations. Worker threads API enables true JS multi-threading."]}]}, {"num": "Q26", "title": "Explain Node.js streams. Why are they important?", "level": "Mid", "blocks": [{"t": "p", "text": "Streams process data in chunks rather than loading the entire thing into memory. A 1GB file can be processed with constant ~1MB memory usage using streams."}, {"t": "p", "text": "Four stream types: Readable (source of data), Writable (destination), Duplex (both readable and writable), Transform (Duplex that modifies data in transit)."}, {"t": "p", "text": "pipeline(): the correct way to connect streams. Handles backpressure (when a Writable cannot keep up with a Readable) and error propagation automatically."}, {"t": "p", "text": "Real use cases: reading large CSV files, compressing responses, processing video uploads, streaming API responses without buffering."}, {"t": "code", "lang": "js", "lines": ["const { pipeline, Transform } = require(\"stream\");", "const { promisify } = require(\"util\");", "const pipelineAsync = promisify(pipeline);", "", "async function processLargeCSV(filePath) {", "  await pipelineAsync(", "    fs.createReadStream(filePath),  // read file in chunks", "    csvParser(),                     // parse each chunk", "    new Transform({                  // transform each row", "      objectMode: true,", "      transform(row, enc, cb) {", "        this.push(cleanRow(row));", "        cb();", "      }", "    }),", "    writableDestination,             // write output", "  );", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know that pipe() does NOT handle errors correctly — if the writable errors, the readable is not cleaned up. Always use pipeline() in production code."]}]}, {"num": "Q27", "title": "How would you prevent your Node.js server from crashing under load?", "level": "Senior", "blocks": [{"t": "p", "text": "Multiple layers of defence:"}, {"t": "p", "text": "1. Async error handling: all async code wrapped in try/catch with proper error propagation. Unhandled promise rejections crash Node — enable process.on(\"unhandledRejection\") to log and gracefully shut down."}, {"t": "p", "text": "2. Input validation: validate all inputs with Zod/express-validator before processing. Never trust user data."}, {"t": "p", "text": "3. Rate limiting: limit requests per IP/user to prevent abuse and DoS."}, {"t": "p", "text": "4. Timeouts: set request timeouts. Never leave open database connections or HTTP requests without a timeout."}, {"t": "p", "text": "5. Circuit breaker pattern: stop sending requests to a failing downstream service to prevent cascading failures."}, {"t": "p", "text": "6. Cluster mode / PM2: run one process per CPU core. If one crashes, PM2 restarts it automatically."}, {"t": "p", "text": "7. Memory limits: set --max-old-space-size and restart processes that exceed the limit (PM2 max_memory_restart)."}, {"t": "code", "lang": "js", "lines": ["// Catch unhandled rejections (Node may exit otherwise)", "process.on(\"unhandledRejection\", (reason) => {", "  logger.error({ reason }, \"Unhandled rejection\");", "  // Graceful shutdown then exit", "  server.close(() => process.exit(1));", "});", "", "// Timeout middleware", "app.use((req, res, next) => {", "  res.setTimeout(30000, () => {", "    res.status(503).json({ message: \"Request timeout\" });", "  });", "  next();", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Structured answer wins: start with \"I think about this in layers\" and go from code-level (error handling) to process-level (PM2) to infrastructure-level (load balancer health checks)."]}]}]}, {"id": "v1s5", "title": "Express.js & REST API Design", "sub": "", "qs": [{"num": "Q28", "title": "What is middleware in Express.js?", "level": "Junior", "blocks": [{"t": "p", "text": "Middleware is a function with signature (req, res, next) that sits in the request-response cycle. It has access to the request object, response object, and the next middleware function."}, {"t": "p", "text": "Middleware can: execute code, modify req/res objects, end the request-response cycle (by sending a response), or call next() to pass control to the next middleware."}, {"t": "p", "text": "Types: application-level (app.use), router-level (router.use), error-handling (4 params: err, req, res, next), third-party (cors, helmet, morgan), built-in (express.json)."}, {"t": "p", "text": "Order matters: middleware runs in the order it is registered."}, {"t": "code", "lang": "js", "lines": ["// Custom middleware", "function requestLogger(req, res, next) {", "  const start = Date.now();", "  res.on(\"finish\", () => {", "    console.log(`${req.method} ${req.path} ${res.statusCode} ${Date.now()-start}ms`);", "  });", "  next(); // MUST call next or request hangs", "}", "", "// Error middleware (must have 4 params)", "app.use((err, req, res, next) => {", "  res.status(err.statusCode || 500).json({ message: err.message });", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["\"What happens if you forget to call next()?\" — the request hangs indefinitely. This is one of the most common Express bugs beginners make."]}]}, {"num": "Q29", "title": "How do you implement JWT authentication in an Express API?", "level": "Mid", "blocks": [{"t": "p", "text": "JWT (JSON Web Token) authentication flow:"}, {"t": "p", "text": "1. User sends credentials to POST /auth/login"}, {"t": "p", "text": "2. Server verifies password with bcrypt.compare"}, {"t": "p", "text": "3. Server signs a JWT with jsonwebtoken.sign, encoding the user ID and role"}, {"t": "p", "text": "4. Server returns the JWT (typically in the response body for API clients, or httpOnly cookie for web apps)"}, {"t": "p", "text": "5. Client sends the JWT in the Authorization: Bearer <token> header on subsequent requests"}, {"t": "p", "text": "6. A protect middleware verifies the JWT signature and attaches req.user"}, {"t": "p", "text": "Security considerations: short-lived access tokens (15 min), refresh token rotation, httpOnly cookies prevent XSS theft, never store sensitive data in the payload (it is base64 encoded, not encrypted)."}, {"t": "code", "lang": "js", "lines": ["const jwt = require(\"jsonwebtoken\");", "const bcrypt = require(\"bcryptjs\");", "", "exports.login = async (req, res, next) => {", "  const user = await User.findOne({ email: req.body.email }).select(\"+password\");", "  if (!user || !await bcrypt.compare(req.body.password, user.password))", "    return res.status(401).json({ message: \"Invalid credentials\" });", "  const token = jwt.sign({ id: user._id, role: user.role },", "    process.env.JWT_SECRET, { expiresIn: \"15m\" });", "  res.json({ token });", "};", "", "exports.protect = async (req, res, next) => {", "  const token = req.headers.authorization?.split(\" \")[1];", "  if (!token) return res.status(401).json({ message: \"Not authenticated\" });", "  try {", "    const decoded = jwt.verify(token, process.env.JWT_SECRET, { algorithms: [\"HS256\"] });", "    req.user = await User.findById(decoded.id);", "    next();", "  } catch { res.status(401).json({ message: \"Token invalid or expired\" }); }", "};"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Follow-up: \"why httpOnly cookies instead of localStorage?\" — localStorage is accessible by JavaScript, making it vulnerable to XSS attacks. httpOnly cookies cannot be read by JS, only sent automatically by the browser."]}]}, {"num": "Q30", "title": "What are REST API best practices? Design a REST API for a blog platform.", "level": "Senior", "blocks": [{"t": "p", "text": "REST best practices:"}, {"t": "li", "text": "Use plural nouns for resources: /posts, /users, /comments"}, {"t": "li", "text": "Use HTTP verbs correctly: GET (read), POST (create), PUT (replace), PATCH (partial update), DELETE (remove)"}, {"t": "li", "text": "Return appropriate status codes: 200 OK, 201 Created, 204 No Content, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 409 Conflict, 422 Unprocessable, 429 Too Many Requests, 500 Server Error"}, {"t": "li", "text": "Use query params for filtering, sorting, pagination: GET /posts?category=tech&sort=-createdAt&page=2&limit=20"}, {"t": "li", "text": "Version your API: /api/v1/posts"}, {"t": "li", "text": "Return consistent response shapes: { success, data, message, count }"}, {"t": "li", "text": "Never expose internal IDs or database structure"}, {"t": "li", "text": "Validate all inputs and sanitise all outputs"}, {"t": "code", "lang": "text", "lines": ["GET    /api/v1/posts              // list (filterable, paginated)", "POST   /api/v1/posts              // create", "GET    /api/v1/posts/:slug        // get one (by slug not ID)", "PATCH  /api/v1/posts/:id          // partial update (author only)", "DELETE /api/v1/posts/:id          // delete (author only)", "", "GET    /api/v1/posts/:id/comments // nested resource", "POST   /api/v1/posts/:id/comments // add comment", "POST   /api/v1/posts/:id/like     // action (not pure REST but practical)", "", "// Response shape", "{ \"success\": true, \"data\": [...], \"count\": 25, \"totalPages\": 3 }"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["When asked to design an API, always clarify: authentication requirements, pagination strategy, versioning approach, and error format BEFORE writing the routes."]}]}]}, {"id": "v1s6", "title": "MongoDB & Mongoose", "sub": "", "qs": [{"num": "Q31", "title": "When would you use MongoDB over a relational database (SQL)?", "level": "Junior", "blocks": [{"t": "p", "text": "Use MongoDB when:"}, {"t": "li", "text": "Data is document-oriented — naturally nested objects (user with addresses, order with line items)"}, {"t": "li", "text": "Schema needs to evolve rapidly (early-stage startup, agile development)"}, {"t": "li", "text": "Data is read-heavy and the document contains all needed data (no joins)"}, {"t": "li", "text": "Horizontal scaling (sharding) is a requirement"}, {"t": "li", "text": "Storing semi-structured or variable data (logs, events, user-generated content)"}, {"t": "p", "text": "Use SQL when:"}, {"t": "li", "text": "Data has complex relationships requiring many joins"}, {"t": "li", "text": "ACID transactions across multiple tables are required (financial systems)"}, {"t": "li", "text": "Data is highly relational and normalised"}, {"t": "li", "text": "Schema is stable and well-defined upfront"}, {"t": "p", "text": "MongoDB supports multi-document transactions since 4.0, closing the main ACID gap."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Do not say \"MongoDB is faster than SQL\" — this is context-dependent and often false. The correct answer is that MongoDB is better suited for document-oriented workloads, and SQL is better for relational workloads."]}]}, {"num": "Q32", "title": "Explain MongoDB's aggregation pipeline. What are the key stages?", "level": "Mid", "blocks": [{"t": "p", "text": "The aggregation pipeline transforms documents through a sequence of stages. Each stage takes documents in and outputs documents to the next stage."}, {"t": "p", "text": "Key stages:"}, {"t": "li", "text": "$match: filter documents (like WHERE in SQL)"}, {"t": "li", "text": "$group: group by field and compute aggregates ($sum, $avg, $min, $max, $push, $addToSet)"}, {"t": "li", "text": "$sort: sort documents (-1 descending, 1 ascending)"}, {"t": "li", "text": "$limit, $skip: pagination"}, {"t": "li", "text": "$project: reshape documents (include/exclude/rename fields, compute new ones)"}, {"t": "li", "text": "$lookup: join another collection (like SQL JOIN)"}, {"t": "li", "text": "$unwind: flatten an array field into multiple documents"}, {"t": "li", "text": "$facet: run multiple sub-pipelines in parallel on the same input"}, {"t": "code", "lang": "js", "lines": ["// Revenue by category, last 30 days", "await Order.aggregate([", "  { $match: {", "      status: \"completed\",", "      createdAt: { $gte: new Date(Date.now() - 30*24*3600*1000) },", "  }},", "  { $group: {", "      _id: \"$category\",", "      totalRevenue: { $sum: { $multiply: [\"$price\", \"$qty\"] } },", "      orderCount: { $sum: 1 },", "  }},", "  { $sort: { totalRevenue: -1 } },", "  { $project: { category: \"$_id\", totalRevenue: 1, orderCount: 1, _id: 0 } },", "]);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Aggregation is a frequent advanced question. Know the order matters: $match early to reduce documents before expensive stages. $match before $unwind if possible."]}]}, {"num": "Q33", "title": "What are MongoDB indexes? Explain compound indexes and the ESR rule.", "level": "Mid", "blocks": [{"t": "p", "text": "An index is a sorted data structure (B-tree) that allows MongoDB to find documents without scanning the entire collection. Without an index on a queried field, MongoDB does a COLLSCAN (collection scan) — reads every document."}, {"t": "p", "text": "Index types: single field, compound, text, geospatial, TTL (time-to-live, auto-delete), sparse (only index documents where field exists), partial (only index documents matching a filter), wildcard."}, {"t": "p", "text": "The ESR rule for compound indexes: put Equality fields first, then Sort fields, then Range fields. This maximises the index's usefulness."}, {"t": "p", "text": "Always verify index usage with .explain(\"executionStats\") — look for IXSCAN (good) vs COLLSCAN (bad)."}, {"t": "code", "lang": "js", "lines": ["// TTL index: auto-delete sessions after 24 hours", "sessionSchema.index({ createdAt: 1 }, { expireAfterSeconds: 86400 });", "", "// Compound index following ESR rule", "// Query: find posts by userId (equality), sorted by createdAt (sort)", "postSchema.index({ userId: 1, createdAt: -1 });", "", "// Verify index is used", "const explanation = await Post", "  .find({ userId: \"123\" })", "  .sort({ createdAt: -1 })", "  .explain(\"executionStats\");", "console.log(explanation.executionStats.executionStages.stage);", "// \"IXSCAN\" = index used (correct)"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A great answer mentions index selectivity: high-cardinality fields (userId, email) make better index prefixes than low-cardinality fields (status, boolean). Low selectivity indexes are often not used by the query planner."]}]}, {"num": "Q34", "title": "How do MongoDB transactions work and what are the performance trade-offs?", "level": "Senior", "blocks": [{"t": "p", "text": "MongoDB multi-document transactions (version 4.0+) provide ACID guarantees across multiple documents and collections."}, {"t": "p", "text": "How they work: start a session, start a transaction within the session, execute operations passing the session object to each, commit or abort."}, {"t": "p", "text": "withTransaction(): the recommended approach — automatically retries on transient errors (network blip, write conflict)."}, {"t": "p", "text": "Performance trade-offs:"}, {"t": "li", "text": "Transactions hold locks on all affected documents until committed"}, {"t": "li", "text": "Longer transactions = longer lock contention = lower throughput"}, {"t": "li", "text": "Require replica set or sharded cluster (no standalone MongoDB)"}, {"t": "li", "text": "60-second default timeout"}, {"t": "p", "text": "Best practices: keep transactions short, do NOT make external API calls inside a transaction, prefer embedding documents over transactions where possible."}, {"t": "code", "lang": "js", "lines": ["const session = await mongoose.startSession();", "try {", "  await session.withTransaction(async () => {", "    // Deduct from account A", "    await Account.findByIdAndUpdate(fromId,", "      { $inc: { balance: -amount } }, { session });", "    // Credit account B", "    await Account.findByIdAndUpdate(toId,", "      { $inc: { balance: amount } }, { session });", "    // Log the transfer", "    await TransferLog.create([{ from: fromId, to: toId, amount }], { session });", "  });", "} finally { session.endSession(); }", "", "// Anti-pattern: external call inside transaction (holds locks!)", "// WRONG: await stripe.charge(amount); inside withTransaction"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The interviewer often asks: \"when would you NOT use a MongoDB transaction?\" — When all the related data can be embedded in a single document. A single-document write is always atomic in MongoDB without needing a transaction."]}]}]}, {"id": "v1s7", "title": "Security", "sub": "", "qs": [{"num": "Q35", "title": "What is XSS (Cross-Site Scripting) and how do you prevent it?", "level": "Junior", "blocks": [{"t": "p", "text": "XSS is an attack where an attacker injects malicious JavaScript into a web page that other users view. The script runs in the victim's browser with the victim's permissions, potentially stealing cookies, session tokens, or credentials."}, {"t": "p", "text": "Types: Stored XSS (injected script saved in the database and served to all users), Reflected XSS (injected via URL parameters), DOM-based XSS (manipulated via client-side JS)."}, {"t": "p", "text": "Prevention:"}, {"t": "li", "text": "Never use innerHTML with user content — use textContent or innerText"}, {"t": "li", "text": "Sanitise all user input before storing (DOMPurify on client, sanitize-html on server)"}, {"t": "li", "text": "Set Content-Security-Policy headers to whitelist allowed script sources"}, {"t": "li", "text": "Use httpOnly cookies for session tokens (JS cannot read them)"}, {"t": "li", "text": "In React, JSX auto-escapes expressions — {userInput} is safe, dangerouslySetInnerHTML is not"}, {"t": "code", "lang": "js", "lines": ["// UNSAFE: innerHTML with user content", "el.innerHTML = userComment; // attacker injects <script>stealCookies()<\/script>", "", "// SAFE: textContent escapes automatically", "el.textContent = userComment;", "", "// If you need HTML: sanitise first", "const DOMPurify = require(\"dompurify\");", "el.innerHTML = DOMPurify.sanitize(userComment);", "", "// React JSX is safe by default", "{userInput}               // safe — escaped", "<div dangerouslySetInnerHTML={{ __html: userInput }} /> // unsafe!"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Always mention that React escapes JSX by default — this shows you understand the framework security model, not just generic web security."]}]}, {"num": "Q36", "title": "What is NoSQL injection and how does it differ from SQL injection?", "level": "Mid", "blocks": [{"t": "p", "text": "SQL injection exploits string concatenation in SQL queries. NoSQL injection exploits JavaScript operator evaluation in MongoDB queries."}, {"t": "p", "text": "MongoDB injection: an attacker sends a JSON body with MongoDB operators instead of string values. For example, { email: { $gt: \"\" } } matches ALL documents where email is greater than an empty string — i.e., all documents."}, {"t": "p", "text": "If your login route does findOne({ email: req.body.email, password: req.body.password }) and you do not validate that email is a string, an attacker can bypass authentication."}, {"t": "p", "text": "Prevention:"}, {"t": "li", "text": "Use Mongoose strict schemas (rejects extra fields by default)"}, {"t": "li", "text": "Validate with Zod — z.string().email() rejects non-string types"}, {"t": "li", "text": "Use express-mongo-sanitize to strip $ and . from request bodies"}, {"t": "code", "lang": "js", "lines": ["// VULNERABLE", "app.post(\"/login\", async (req, res) => {", "  const user = await User.findOne({", "    email: req.body.email,    // could be { $gt: \"\" }", "    password: req.body.password,", "  }); // matches ALL users!", "});", "", "// SAFE: Zod validates type before query", "const LoginSchema = z.object({", "  email: z.string().email(),    // must be a string", "  password: z.string().min(8),  // must be a string", "});", "const { email, password } = LoginSchema.parse(req.body);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["This question catches many candidates who know SQL injection but have never thought about NoSQL injection. Knowing it demonstrates security awareness beyond the basics."]}]}, {"num": "Q37", "title": "Explain CORS. When does it apply and how do you configure it correctly?", "level": "Senior", "blocks": [{"t": "p", "text": "CORS (Cross-Origin Resource Sharing) is a browser security mechanism that restricts HTTP requests made from a different origin (protocol + domain + port) than the one that served the page."}, {"t": "p", "text": "CORS does NOT apply to: server-to-server requests, Postman, curl — only browser-initiated cross-origin requests."}, {"t": "p", "text": "Simple requests (GET, POST with certain Content-Types): browser adds Origin header. Server responds with Access-Control-Allow-Origin. No preflight."}, {"t": "p", "text": "Preflight requests: for non-simple methods/headers (PUT, DELETE, custom headers, JSON Content-Type), browser first sends OPTIONS request. Server must respond with allowed methods, headers, and origin before the actual request is sent."}, {"t": "p", "text": "Credentials: to send cookies cross-origin, both the request (credentials: \"include\") and server (Access-Control-Allow-Credentials: true, specific origin not *) must opt in."}, {"t": "code", "lang": "js", "lines": ["const cors = require(\"cors\");", "", "// Development: allow all origins", "app.use(cors());", "", "// Production: specific origins only", "app.use(cors({", "  origin: [\"https://myapp.com\", \"https://staging.myapp.com\"],", "  methods: [\"GET\", \"POST\", \"PUT\", \"PATCH\", \"DELETE\"],", "  allowedHeaders: [\"Content-Type\", \"Authorization\"],", "  credentials: true,        // allow cookies", "  maxAge: 86400,            // cache preflight for 24h", "}));", "", "// WRONG: allows credentials with wildcard origin (browsers reject this)", "// Access-Control-Allow-Origin: *  +  Access-Control-Allow-Credentials: true"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Interviewers love: \"what happens if I set Access-Control-Allow-Origin: * and Access-Control-Allow-Credentials: true?\" — Browsers reject it. You must specify a concrete origin when credentials are involved."]}]}, {"num": "Q38", "title": "How would you secure a MERN application for production?", "level": "Expert", "blocks": [{"t": "p", "text": "A layered security approach (defence in depth):"}, {"t": "p", "text": "Network layer: HTTPS everywhere, HTTP Strict Transport Security (HSTS), WAF (Web Application Firewall), DDoS protection (Cloudflare)."}, {"t": "p", "text": "Authentication: httpOnly + Secure + SameSite=Strict cookies or short-lived JWT (15 min) + refresh token rotation, bcrypt (cost ≥ 12), account lockout after N failed attempts, MFA for admin accounts."}, {"t": "p", "text": "Authorisation: RBAC, verify ownership (user can only edit their own resources), never trust client-supplied IDs for permissions."}, {"t": "p", "text": "Input/output: Zod validation on all inputs, express-mongo-sanitize against NoSQL injection, DOMPurify for HTML content, rate limiting per IP per route."}, {"t": "p", "text": "Headers: Helmet.js (sets X-Frame-Options, X-Content-Type-Options, Referrer-Policy), Content-Security-Policy with nonces."}, {"t": "p", "text": "Dependencies: npm audit weekly, Dependabot for automatic updates, Software Composition Analysis (SCA) in CI."}, {"t": "p", "text": "Secrets: no hardcoded credentials, .env not committed, AWS Secrets Manager for production, secret rotation."}, {"t": "p", "text": "Logging: log all auth events, errors, admin actions — never log passwords or tokens. Correlate with request IDs."}, {"t": "code", "lang": "js", "lines": ["// Security middleware stack (order matters)", "app.use(helmet());                    // security headers", "app.use(cors({ origin: allowedOrigins }));", "app.use(mongoSanitize());             // NoSQL injection", "app.use(express.json({ limit: \"10kb\" })); // prevent large payload attacks", "app.use(rateLimit({ windowMs: 15*60*1000, max: 100 })); // rate limit", "", "// Per-route rate limiting for auth", "const loginLimiter = rateLimit({ windowMs: 15*60*1000, max: 5,", "  message: \"Too many login attempts\" });", "router.post(\"/login\", loginLimiter, authController.login);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Structure this as layers: network → auth → authorisation → input → headers → dependencies → secrets → logging. This shows you think systematically rather than listing individual tools."]}]}]}, {"id": "v1s8", "title": "Testing", "sub": "", "qs": [{"num": "Q39", "title": "What is the testing pyramid? Explain unit, integration, and E2E tests.", "level": "Junior", "blocks": [{"t": "p", "text": "The testing pyramid defines the ideal balance of test types, from the base (most) to the top (fewest):"}, {"t": "li", "text": "Unit tests (base — many): test a single function or component in isolation. Fast (milliseconds), cheap to write, precise error messages. Use Jest, React Testing Library."}, {"t": "li", "text": "Integration tests (middle — fewer): test multiple units working together — an Express route hitting a real in-memory MongoDB. Slower but test real interactions."}, {"t": "li", "text": "End-to-end tests (top — few): test the entire application from the browser. Real browser, real server, real database. Slow, expensive, but highest confidence. Use Playwright or Cypress."}, {"t": "p", "text": "The pyramid shape: many fast cheap tests at the bottom, few slow expensive tests at the top. An inverted pyramid (more E2E than unit) is slow, expensive, and fragile."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A common follow-up: \"what is the testing trophy?\" (coined by Kent C. Dodds) — a variation emphasising integration tests more than the pyramid, because they give the best ROI. Know both models."]}]}, {"num": "Q40", "title": "What is React Testing Library's testing philosophy?", "level": "Mid", "blocks": [{"t": "p", "text": "RTL's core philosophy: \"The more your tests resemble the way your software is used, the more confidence they can give you.\""}, {"t": "p", "text": "This means: query elements the way users find them — by role, label, text — not by CSS class, component name, or internal state."}, {"t": "p", "text": "Avoid testing implementation details: if you test that useState has a specific value, you cannot refactor to useReducer without rewriting the test. If you test what the user sees, refactoring is safe."}, {"t": "p", "text": "Priority of queries (from most to least preferred): getByRole (most semantically meaningful), getByLabelText, getByPlaceholderText, getByText, getByDisplayValue, getByAltText, getByTitle, getByTestId (last resort)."}, {"t": "code", "lang": "js", "lines": ["import { render, screen } from \"@testing-library/react\";", "import userEvent from \"@testing-library/user-event\";", "", "// BAD: implementation detail (CSS class, component name)", "const button = container.querySelector(\".submit-btn\");", "", "// GOOD: query by role (how users find it)", "const button = screen.getByRole(\"button\", { name: /submit/i });", "", "// BAD: test state value", "expect(component.state.isLoading).toBe(false);", "", "// GOOD: test what the user sees", "expect(screen.queryByText(\"Loading...\")).not.toBeInTheDocument();", "expect(screen.getByText(\"Order confirmed\")).toBeInTheDocument();"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Interviewers may ask: \"why not use Enzyme?\" — RTL focuses on behaviour, Enzyme focuses on implementation. RTL tests survive refactors; Enzyme tests often do not."]}]}, {"num": "Q41", "title": "How do you test a Node.js/Express API?", "level": "Senior", "blocks": [{"t": "p", "text": "Strategy: use Supertest to make HTTP requests to your Express app without starting a real server, and mongodb-memory-server for an in-memory MongoDB that is isolated between tests."}, {"t": "p", "text": "Test structure: Arrange (set up data), Act (make the request), Assert (verify response)."}, {"t": "p", "text": "What to test: happy path (correct input returns correct response), validation errors (invalid input returns 400 with error details), authentication (protected routes return 401 without token), authorisation (users cannot access other users' resources), edge cases (empty arrays, null values, non-existent IDs)."}, {"t": "p", "text": "Code coverage: aim for 80%+ line and branch coverage. Coverage is a floor, not a ceiling — 100% coverage with bad assertions is useless."}, {"t": "code", "lang": "js", "lines": ["const request = require(\"supertest\");", "const { MongoMemoryServer } = require(\"mongodb-memory-server\");", "", "let mongoServer;", "beforeAll(async () => {", "  mongoServer = await MongoMemoryServer.create();", "  await mongoose.connect(mongoServer.getUri());", "});", "afterAll(async () => {", "  await mongoose.disconnect();", "  await mongoServer.stop();", "});", "", "describe(\"POST /api/posts\", () => {", "  it(\"creates a post for authenticated user\", async () => {", "    const token = generateTestToken(testUser._id);", "    const res = await request(app)", "      .post(\"/api/posts\")", "      .set(\"Authorization\", `Bearer ${token}`)", "      .send({ title: \"Test Post\", content: \"Content here\" });", "    expect(res.status).toBe(201);", "    expect(res.body.data.title).toBe(\"Test Post\");", "  });", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention test isolation: each test should set up its own data and clean up after itself. Using beforeEach to reset the database between tests prevents test pollution."]}]}]}, {"id": "v1s9", "title": "State Management", "sub": "", "qs": [{"num": "Q42", "title": "When would you use Redux vs Zustand vs React Context?", "level": "Mid", "blocks": [{"t": "p", "text": "Each tool solves a different problem:"}, {"t": "p", "text": "React Context: built-in, zero dependencies, good for low-frequency global state (theme, auth user, locale). Performance issue: all consumers re-render on any context change. Use for: 1–5 components reading it, updates rare."}, {"t": "p", "text": "Zustand: minimal boilerplate, no providers, only re-renders subscribers of the specific slice they use. Use for: simple-to-moderate client state, UI state, when Redux feels like overkill."}, {"t": "p", "text": "Redux Toolkit: predictable, time-travel debugging, powerful middleware ecosystem, DevTools. Use for: complex state with many interactions, large team where predictability matters, when you need RTK Query for server state."}, {"t": "p", "text": "TanStack Query: not client state — manages SERVER state (cached API data). Use it alongside any of the above."}, {"t": "code", "lang": "js", "lines": ["// Rule of thumb for choosing:", "// 1-5 components, low update frequency → Context", "// Simple app, moderate state → Zustand (less boilerplate)", "// Large app, complex state, team of 5+ → Redux Toolkit", "// API data fetching and caching → TanStack Query (always)", "", "// Zustand — zero boilerplate", "const useStore = create((set) => ({", "  user: null,", "  setUser: (user) => set({ user }),", "}));", "", "// No provider needed — consume anywhere", "const user = useStore((state) => state.user);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A great answer quantifies thresholds. Say \"I use Zustand when fewer than 5 components share the state and updates are moderate. I introduce Redux when I need time-travel debugging or the team needs strict unidirectional data flow.\""]}]}, {"num": "Q43", "title": "Explain RTK Query's caching model. What are tags and how does invalidation work?", "level": "Senior", "blocks": [{"t": "p", "text": "RTK Query automatically caches API responses by query key (the endpoint name + arguments). When the same query is requested again and the data is not stale, it returns from cache without a network request."}, {"t": "p", "text": "Tags: labels you assign to cached data. When a mutation succeeds, you invalidate specific tags — RTK Query automatically refetches all queries that provided those tags."}, {"t": "p", "text": "providesTags: tells RTK Query what data this query represents (used by queries/GET endpoints)."}, {"t": "p", "text": "invalidatesTags: tells RTK Query which cached data should be invalidated after this mutation succeeds (used by mutations/POST/PATCH/DELETE endpoints)."}, {"t": "code", "lang": "js", "lines": ["const postsApi = createApi({", "  endpoints: (builder) => ({", "    getPosts: builder.query({", "      query: () => \"/posts\",", "      // This query \"owns\" the Post list", "      providesTags: (result) => result", "        ? [...result.map(p => ({ type: \"Post\", id: p._id })), \"Post\"]", "        : [\"Post\"],", "    }),", "    createPost: builder.mutation({", "      query: (body) => ({ url: \"/posts\", method: \"POST\", body }),", "      // After create: invalidate Post list → triggers refetch", "      invalidatesTags: [\"Post\"],", "    }),", "    deletePost: builder.mutation({", "      query: (id) => ({ url: `/posts/${id}`, method: \"DELETE\" }),", "      // Only invalidate the specific post — not the whole list", "      invalidatesTags: (result, error, id) => [{ type: \"Post\", id }],", "    }),", "  }),", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The interviewer may ask: \"what is the difference between providesTags with a specific ID vs the list tag?\" — specific ID invalidation is surgical (only that one post refetches), list tag invalidation is broad (the entire list refetches)."]}]}]}, {"id": "v1s10", "title": "Performance & Optimisation", "sub": "", "qs": [{"num": "Q44", "title": "What are Core Web Vitals? How do you improve them?", "level": "Mid", "blocks": [{"t": "p", "text": "Core Web Vitals are Google's real-world performance metrics:"}, {"t": "li", "text": "LCP (Largest Contentful Paint): how long the largest visible element takes to load. Target: < 2.5s. Improve: optimise images (WebP, proper sizing, preload hero image), fast server, CDN."}, {"t": "li", "text": "INP (Interaction to Next Paint, replaced FID): how long the browser takes to respond to user input. Target: < 200ms. Improve: break up long tasks, use useTransition, avoid heavy JS on main thread."}, {"t": "li", "text": "CLS (Cumulative Layout Shift): unexpected layout shifts as page loads. Target: < 0.1. Improve: always set width/height on images, avoid inserting content above existing content."}, {"t": "p", "text": "Tools: Google Lighthouse (in DevTools), PageSpeed Insights, WebPageTest, Core Web Vitals report in Search Console."}, {"t": "code", "lang": "html", "lines": ["// Improve LCP: preload the hero image", "<link rel=\"preload\" as=\"image\" href=\"/hero.webp\" />", "", "// Improve CLS: always set dimensions on images", "<img src=\"/photo.jpg\" width={800} height={600} alt=\"...\" />", "// or in CSS", "img { aspect-ratio: 4 / 3; width: 100%; }", "", "// Next.js Image: handles all of this automatically", "import Image from \"next/image\";", "<Image src=\"/hero.jpg\" width={1200} height={600} priority alt=\"Hero\" />"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know which metric impacts SEO (all three are Google ranking signals since 2021). LCP is usually the most impactful to fix."]}]}, {"num": "Q45", "title": "How does Redis improve performance in a MERN application?", "level": "Senior", "blocks": [{"t": "p", "text": "Redis is an in-memory data store. Operations are measured in microseconds vs milliseconds for MongoDB. Use Redis for:"}, {"t": "p", "text": "Cache-aside pattern: check Redis first, on cache miss fetch from MongoDB, store in Redis with a TTL. Subsequent requests are served from memory — 100x faster."}, {"t": "p", "text": "Session storage: store user sessions in Redis (shared across processes) instead of memory."}, {"t": "p", "text": "Rate limiting: use atomic Redis operations for accurate counting across distributed processes."}, {"t": "p", "text": "Background job queues (BullMQ): Redis as the persistent backing store for job queues."}, {"t": "p", "text": "Pub/sub: real-time messaging between server instances."}, {"t": "p", "text": "Cache invalidation: on document create/update/delete, delete the relevant Redis keys to force refetch."}, {"t": "code", "lang": "js", "lines": ["const Redis = require(\"ioredis\");", "const redis = new Redis(process.env.REDIS_URL);", "", "// Cache middleware", "function cache(ttl) {", "  return async (req, res, next) => {", "    const key = `cache:${req.originalUrl}`;", "    const cached = await redis.get(key);", "    if (cached) return res.json(JSON.parse(cached));", "    const originalJson = res.json.bind(res);", "    res.json = (data) => {", "      redis.setex(key, ttl, JSON.stringify(data));", "      return originalJson(data);", "    };", "    next();", "  };", "}", "", "router.get(\"/posts\", cache(300), postsController.list); // cache 5 min"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention cache invalidation as the hard problem: \"there are only two hard things in computer science: cache invalidation and naming things.\" Explain your invalidation strategy."]}]}]}, {"id": "v1s11", "title": "System Design & Architecture", "sub": "", "qs": [{"num": "Q46", "title": "Design a URL shortener using MERN stack.", "level": "Senior", "blocks": [{"t": "p", "text": "Requirements clarification: read-heavy (many redirects, few creates), short codes must be unique, should support custom aliases, analytics (click counts), expiry."}, {"t": "p", "text": "Components:"}, {"t": "li", "text": "MongoDB: stores { code, originalUrl, userId, clicks, expiresAt }"}, {"t": "li", "text": "Express API: POST /shorten (create), GET /:code (redirect)"}, {"t": "li", "text": "Short code generation: Base62 encoding of an auto-incrementing counter, or nanoid (collision-resistant random 8 chars)"}, {"t": "li", "text": "Redis cache: cache code→URL mapping, hot URLs served from memory without DB hit"}, {"t": "li", "text": "Background job: expire old links via TTL index in MongoDB"}, {"t": "p", "text": "Scaling considerations: read replicas for MongoDB, Redis cluster, CDN for redirect endpoint (edge functions)."}, {"t": "code", "lang": "js", "lines": ["// Short code generation with nanoid", "const { nanoid } = require(\"nanoid\");", "", "app.post(\"/shorten\", protect, async (req, res) => {", "  const code = nanoid(8); // 8-char unique code", "  const link = await ShortLink.create({", "    code, originalUrl: req.body.url,", "    userId: req.user._id,", "    expiresAt: req.body.expiresAt || null,", "  });", "  res.json({ shortUrl: `https://sho.rt/${code}` });", "});", "", "app.get(\"/:code\", async (req, res) => {", "  let url = await redis.get(`link:${req.params.code}`);", "  if (!url) {", "    const link = await ShortLink.findOneAndUpdate(", "      { code: req.params.code, expiresAt: { $gt: new Date() } },", "      { $inc: { clicks: 1 } }, { new: true }", "    );", "    if (!link) return res.status(404).send(\"Not found\");", "    url = link.originalUrl;", "    await redis.setex(`link:${req.params.code}`, 3600, url);", "  }", "  res.redirect(301, url);", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Always clarify requirements before designing. Ask: expected RPS (reads vs writes), geographic distribution, analytics depth, custom domains. This shows senior-level thinking."]}]}, {"num": "Q47", "title": "What is the difference between monolith, microservices, and modular monolith? Which would you recommend for a new MERN startup?", "level": "Senior", "blocks": [{"t": "p", "text": "Monolith: one deployable unit — all features in one codebase. Simple to develop, test, and deploy. Becomes hard to scale and maintain as it grows. All teams share one deployment pipeline."}, {"t": "p", "text": "Microservices: each feature is a separate service with its own database and deployment. Independent scaling, independent deployments, technology flexibility. High operational overhead — distributed tracing, service mesh, network calls instead of function calls. Suitable for large teams and proven bounded domains."}, {"t": "p", "text": "Modular monolith: one deployable unit but with strict internal module boundaries (auth module cannot import order module directly, only through defined interfaces). Simplicity of monolith + discipline of microservices. Easy to extract modules to microservices later."}, {"t": "p", "text": "Recommendation for new MERN startup: modular monolith. Start simple, ship fast, enforce module boundaries from day one. Extract to microservices only when there is a proven, measurable need (specific scaling bottleneck, team structure)."}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["\"Start with a monolith\" is the pragmatic answer, but \"modular monolith\" is the sophisticated answer. Know the difference — modular monolith has the discipline to avoid the big ball of mud while avoiding microservices complexity."]}]}, {"num": "Q48", "title": "How would you design a real-time notification system for 1 million users?", "level": "Expert", "blocks": [{"t": "p", "text": "At 1M users, architectural choices compound. Break it into subsystems:"}, {"t": "p", "text": "Fan-out strategy: on an event (user liked your post), create a notification for each follower. Two models: fan-out on write (pre-compute, fast reads but expensive writes for viral users) vs fan-out on read (compute at read time, slower reads). Hybrid: fan-out on write for users < 1M followers, fan-out on read for celebrities."}, {"t": "p", "text": "Delivery layer: Socket.io with Redis adapter (pub/sub across multiple server instances). Use Nginx sticky sessions or ensure your Socket.io server is backed by Redis pub/sub."}, {"t": "p", "text": "Persistence: store notifications in MongoDB (users can see past notifications). Index by userId + read status + createdAt."}, {"t": "p", "text": "Push notifications: Web Push API for users not currently connected. Queue via BullMQ, deliver via Firebase Cloud Messaging."}, {"t": "p", "text": "Scalability: horizontal scaling of the Node.js Socket.io servers behind a load balancer. Redis Cluster for the pub/sub layer. MongoDB sharded by userId."}, {"t": "code", "lang": "js", "lines": ["// Redis adapter for Socket.io (multi-server pub/sub)", "const { createAdapter } = require(\"@socket.io/redis-adapter\");", "const { createClient } = require(\"redis\");", "", "const pubClient = createClient({ url: REDIS_URL });", "const subClient = pubClient.duplicate();", "await Promise.all([pubClient.connect(), subClient.connect()]);", "io.adapter(createAdapter(pubClient, subClient));", "", "// Now any server can emit to any connected socket", "// emit from server A reaches socket connected to server B", "io.to(`user:${userId}`).emit(\"notification\", data);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["At 1M scale: the interviewer wants to hear you think about fan-out, the Redis adapter for multi-server Socket.io, and the hybrid push/WebSocket delivery strategy. Most candidates only talk about Socket.io."]}]}]}, {"id": "v1s12", "title": "DevOps, CI/CD & Deployment", "sub": "", "qs": [{"num": "Q49", "title": "What is Docker and why is it used in MERN deployments?", "level": "Junior", "blocks": [{"t": "p", "text": "Docker packages your application and its entire environment (Node version, dependencies, OS libraries) into a portable container. \"Works on my machine\" becomes \"works in any container runtime.\""}, {"t": "p", "text": "Key concepts: Dockerfile (instructions to build an image), Image (the built artefact, like a class), Container (a running instance of an image, like an object), docker-compose (define multi-container apps)."}, {"t": "p", "text": "Benefits for MERN: consistent environments from development to production, isolated services (API, MongoDB, Redis, Nginx each in their own container), easy horizontal scaling, simplified deployment."}, {"t": "p", "text": "Multi-stage builds: use a heavy build image (node:24 with devDependencies) and copy only the compiled output into a lean production image (node:24-alpine). Reduces image from ~1GB to ~150MB."}, {"t": "code", "lang": "docker", "lines": ["# Multi-stage Dockerfile for Express API", "FROM node:24-alpine AS builder", "WORKDIR /app", "COPY package*.json ./", "RUN npm ci", "COPY . .", "RUN npm run build", "", "FROM node:24-alpine AS production", "WORKDIR /app", "COPY package*.json ./", "RUN npm ci --omit=dev", "COPY --from=builder /app/dist ./dist", "ENV NODE_ENV=production", "EXPOSE 3000", "CMD [\"node\", \"dist/server.js\"]"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know the difference between image and container. The question \"is Docker a VM?\" comes up — answer: No, containers share the host OS kernel (no hypervisor), making them much lighter and faster to start."]}]}, {"num": "Q50", "title": "Explain CI/CD. What does a typical MERN CI/CD pipeline look like?", "level": "Mid", "blocks": [{"t": "p", "text": "CI (Continuous Integration): automatically run tests, linting, and type checking on every push and pull request. Prevents broken code from reaching main."}, {"t": "p", "text": "CD (Continuous Deployment): automatically deploy to production after CI passes on the main branch. Every merge to main becomes a deployment."}, {"t": "p", "text": "Typical MERN pipeline (GitHub Actions):"}, {"t": "p", "text": "1. Trigger on push/PR to main"}, {"t": "p", "text": "2. Run linter (ESLint)"}, {"t": "p", "text": "3. Run type check (tsc --noEmit)"}, {"t": "p", "text": "4. Run tests with coverage (jest --coverage), fail if below threshold"}, {"t": "p", "text": "5. Build Docker image"}, {"t": "p", "text": "6. Push image to registry (Docker Hub, GHCR)"}, {"t": "p", "text": "7. Deploy to Render/Fly.io/AWS via deploy hook"}, {"t": "p", "text": "8. Notify Slack on success/failure"}, {"t": "code", "lang": "yaml", "lines": ["# .github/workflows/ci-cd.yml", "on: [push, pull_request]", "jobs:", "  test:", "    runs-on: ubuntu-latest", "    steps:", "      - uses: actions/checkout@v4", "      - uses: actions/setup-node@v4", "        with: { node-version: 20, cache: npm }", "      - run: npm ci", "      - run: npm run lint", "      - run: npm run typecheck", "      - run: npm run test:coverage", "  deploy:", "    needs: test", "    if: github.ref == \"refs/heads/main\"", "    steps:", "      - uses: docker/build-push-action@v5", "        with: { push: true, tags: myuser/myapp:latest }", "      - run: curl -X POST ${{ secrets.DEPLOY_HOOK }}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Explain the fail-fast principle: the pipeline fails at the first error and does not continue. This saves time and gives clear error context."]}]}, {"num": "Q51", "title": "How do you achieve zero-downtime deployments for a Node.js API?", "level": "Senior", "blocks": [{"t": "p", "text": "Multiple strategies depending on infrastructure:"}, {"t": "p", "text": "Rolling deployment: deploy new instances one at a time. Load balancer routes traffic to healthy instances. Kubernetes does this automatically."}, {"t": "p", "text": "Blue/Green deployment: maintain two identical environments (blue = current, green = new). Deploy to green, run smoke tests, switch load balancer from blue to green. Instant rollback by switching back. Higher infrastructure cost."}, {"t": "p", "text": "PM2 graceful reload: pm2 reload app sends SIGINT to each process one at a time. Each process finishes in-flight requests, then the new version starts. Zero-downtime on a single server."}, {"t": "p", "text": "Health check endpoint: load balancer checks /health before routing traffic to a new instance. Instance reports unhealthy until fully booted and database connections established."}, {"t": "p", "text": "Graceful shutdown: on SIGINT, stop accepting new connections, wait for in-flight requests to complete (with timeout), then exit."}, {"t": "code", "lang": "js", "lines": ["// Graceful shutdown", "process.on(\"SIGINT\", async () => {", "  console.log(\"Starting graceful shutdown...\");", "  server.close(async () => {", "    await mongoose.connection.close();", "    await redis.quit();", "    process.exit(0);", "  });", "  // Force exit after 10s if requests do not finish", "  setTimeout(() => process.exit(1), 10000);", "});", "", "// Health check endpoint", "app.get(\"/health\", async (req, res) => {", "  const dbStatus = mongoose.connection.readyState === 1 ? \"ok\" : \"error\";", "  const redisStatus = (await redis.ping()) === \"PONG\" ? \"ok\" : \"error\";", "  const healthy = dbStatus === \"ok\" && redisStatus === \"ok\";", "  res.status(healthy ? 200 : 503).json({ status: healthy ? \"ok\" : \"degraded\", db: dbStatus, redis: redisStatus });", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The graceful shutdown handler is the key piece most candidates miss. Without it, an in-flight database write is cut short when the process exits, potentially corrupting data."]}]}]}], "extras": [{"id": "v1x0", "title": "General Interview Tips", "blocks": [{"t": "table", "rows": [["Tip", "Details"], ["Clarify before you solve", "For any system design or API design question, ask about requirements, scale, constraints, and non-functional requirements before writing a single line of code."], ["Structure your answers", "Use the format: What → Why → How → Trade-offs. Especially for senior/expert questions, interviewers want to see you weigh options, not just recite facts."], ["Know the \"why\"", "For every concept (hooks rules, event loop, compound indexes, ESR rule) — know WHY it works that way. Surface-level answers fail senior interviews."], ["Prepare for \"gotcha\" questions", "Common traps: NaN === NaN (false), typeof null (object), useEffect runs twice in StrictMode, COLLSCAN vs IXSCAN, == vs === with null/undefined."], ["Mention trade-offs", "Senior engineers always think in trade-offs. For any solution: \"this approach is good because X but has the downside of Y. An alternative would be Z which is better when...\""], ["Live coding: think aloud", "Talk through your reasoning as you code. Interviewers evaluate how you think, not just the final answer. A correct silent solution is worth less than an explained imperfect one."], ["Ask questions back", "After answering, ask \"does that cover what you were looking for?\" or \"should I go deeper on any aspect?\" This shows confidence and communication skills."], ["NetSuite + MERN angle", "For roles that value your NS background: position the NS integration knowledge as a differentiator. Offer to discuss the NS REST API, SuiteQL, or the NS+MERN dashboard architecture you built."]]}]}]}, {"vol": "Volume 2", "sections": [{"id": "v2s0", "title": "JavaScript — Advanced (continued)", "sub": "Deep JS internals, patterns & tricky concepts", "qs": [{"num": "Q52", "title": "What is the difference between deep copy and shallow copy?", "level": "Mid", "blocks": [{"t": "p", "text": "A shallow copy copies the top-level properties of an object but does not duplicate nested objects — both the copy and the original point to the same nested objects."}, {"t": "p", "text": "A deep copy creates an entirely independent clone — all nested objects are also copied recursively."}, {"t": "li", "text": "Shallow: Object.assign({}, obj), spread {...obj}, Array.from(arr), [...arr]"}, {"t": "li", "text": "Deep: structuredClone(obj) (modern, built-in), JSON.parse(JSON.stringify(obj)) (loses Date, undefined, functions, circular refs), lodash.cloneDeep (handles edge cases)"}, {"t": "p", "text": "structuredClone is the correct modern answer — it handles Dates, RegExps, Maps, Sets, and circular references correctly."}, {"t": "code", "lang": "js", "lines": ["const original = { name: \"Ahmed\", address: { city: \"Cairo\" } };", "", "// Shallow copy — address is shared", "const shallow = { ...original };", "shallow.address.city = \"Giza\";", "console.log(original.address.city); // \"Giza\" — mutated!", "", "// Deep copy with structuredClone", "const deep = structuredClone(original);", "deep.address.city = \"Alexandria\";", "console.log(original.address.city); // \"Cairo\" — unchanged", "", "// JSON trick — FAILS for Date, undefined, functions", "const broken = JSON.parse(JSON.stringify({ date: new Date() }));", "console.log(broken.date); // string, not Date object"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know why JSON.parse/JSON.stringify fails for Date (converts to string), undefined (property dropped), functions (dropped), circular references (throws). structuredClone handles all of these."]}]}, {"num": "Q53", "title": "Explain debounce vs throttle. When would you use each?", "level": "Mid", "blocks": [{"t": "p", "text": "Both control how frequently a function executes, but in different ways."}, {"t": "p", "text": "Debounce: delays execution until a specified time has passed since the LAST call. If calls keep coming within the delay window, the timer resets. Use for: search-as-you-type (wait until user stops typing), window resize handler, auto-save."}, {"t": "p", "text": "Throttle: ensures the function executes at most ONCE per specified interval, regardless of how many times it is called. Use for: scroll event handlers, mouse move tracking, API calls triggered by rapid UI interaction."}, {"t": "p", "text": "Rule of thumb: debounce when you only care about the FINAL value after activity stops. Throttle when you need regular execution during continuous activity."}, {"t": "code", "lang": "js", "lines": ["// Debounce: wait 300ms after last keystroke", "function debounce(fn, delay) {", "  let timer;", "  return (...args) => {", "    clearTimeout(timer);", "    timer = setTimeout(() => fn(...args), delay);", "  };", "}", "const search = debounce((q) => fetchResults(q), 300);", "input.addEventListener(\"input\", (e) => search(e.target.value));", "", "// Throttle: execute at most once per 100ms", "function throttle(fn, limit) {", "  let lastCall = 0;", "  return (...args) => {", "    const now = Date.now();", "    if(now - lastCall >= limit) { lastCall = now; fn(...args); }", "  };", "}", "const onScroll = throttle(() => updateScrollProgress(), 100);", "window.addEventListener(\"scroll\", onScroll);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Common follow-up: \"can you implement your own debounce/throttle?\" — practice this. Also know that lodash provides _.debounce and _.throttle and that useDebounce is a custom React hook built on debounce."]}]}, {"num": "Q54", "title": "What are WeakMap and WeakSet? When are they useful?", "level": "Mid", "blocks": [{"t": "p", "text": "WeakMap and WeakSet hold weak references to their keys/values — the garbage collector can reclaim them if no other references exist. They do not prevent garbage collection."}, {"t": "p", "text": "WeakMap: key must be an object, cannot be iterated. Use for: storing private data associated with an object without preventing the object from being garbage collected; caching computed results keyed by DOM nodes."}, {"t": "p", "text": "WeakSet: stores objects only, cannot be iterated. Use for: tracking which objects have been processed without keeping them alive; \"has this DOM element been initialised?\" checks."}, {"t": "p", "text": "Regular Map/Set hold strong references — the object stays in memory as long as it is in the Map/Set. WeakMap/WeakSet do not."}, {"t": "code", "lang": "js", "lines": ["// WeakMap: store metadata without memory leaks", "const cache = new WeakMap();", "", "function processUser(user) {", "  if(cache.has(user)) return cache.get(user); // cached", "  const result = expensiveCompute(user);", "  cache.set(user, result); // weak reference", "  return result;", "  // When user object is no longer referenced elsewhere,", "  // the cache entry is automatically garbage collected", "  // Regular Map would keep user in memory forever", "  }", "", "// WeakSet: tracking processed items", "const processed = new WeakSet();", "function handle(element) {", "  if(processed.has(element)) return;", "  processed.add(element);", "  // ... process element", "  // element auto-removed from WeakSet when GC collects it", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Interviewers ask this to test memory management awareness. Mention the key limitation: WeakMap/WeakSet are not iterable (you cannot loop over them) because the contents can change unpredictably due to GC."]}]}, {"num": "Q55", "title": "What is the Proxy object in JavaScript? Give a real use case.", "level": "Senior", "blocks": [{"t": "p", "text": "Proxy wraps an object and intercepts fundamental operations on it: property access (get), assignment (set), function calls (apply), property existence checks (has), deletion (deleteProperty), and more."}, {"t": "p", "text": "A handler object defines traps for each intercepted operation."}, {"t": "p", "text": "Real use cases: validation (validate before setting a property), reactive data (Vue 3 uses Proxy for its reactivity system), logging/monitoring (log all property accesses), default values (return a default when a property is undefined), API client builders (proxy.users.find({ name: \"Ahmed\" }) → generates a query)."}, {"t": "code", "lang": "js", "lines": ["// Validation proxy", "const validator = {", "  set(target, prop, value) {", "    if(prop === \"age\" && (typeof value !== \"number\" || value < 0 || value > 150)) {", "      throw new RangeError(`Invalid age: ${value}`);", "    }", "    if(prop === \"email\" && !value.includes(\"@\")) {", "      throw new TypeError(`Invalid email: ${value}`);", "    }", "    target[prop] = value;", "    return true; // must return true on success", "  }", "};", "", "const user = new Proxy({}, validator);", "user.name = \"Ahmed\";   // OK", "user.age = 30;         // OK", "// user.age = -1;      // RangeError: Invalid age: -1", "", "// Vue 3 reactivity uses Proxy", "// When you set obj.count = 5, the set trap notifies all watchers"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Vue 3 replaced Object.defineProperty (Vue 2) with Proxy. Knowing this shows you understand framework internals, which impresses senior interviewers."]}]}, {"num": "Q56", "title": "Explain memory management and garbage collection in JavaScript.", "level": "Expert", "blocks": [{"t": "p", "text": "JavaScript uses automatic memory management. The V8 garbage collector (GC) reclaims memory that is no longer reachable from the root set (global variables, call stack, closures)."}, {"t": "p", "text": "GC algorithm: mark-and-sweep. Starting from roots, the GC marks all reachable objects. Unmarked (unreachable) objects are swept (memory freed)."}, {"t": "p", "text": "Common memory leaks in JS:"}, {"t": "li", "text": "Forgotten timers: setInterval not cleared — its callback holds a reference to outer scope variables"}, {"t": "li", "text": "Event listeners: not removed when the element is removed from the DOM"}, {"t": "li", "text": "Closures: a closure keeps outer variables alive — large objects captured in a closure that outlives them"}, {"t": "li", "text": "Global variables: accidentally setting a property on the global object (window.bigData = ...)"}, {"t": "li", "text": "Detached DOM nodes: removed from the DOM but still referenced in JS variables"}, {"t": "p", "text": "V8 uses generational GC: new space (young generation, collected frequently) and old space (long-lived objects, collected rarely)."}, {"t": "code", "lang": "js", "lines": ["// Memory leak: setInterval holds reference to largeData", "function leakyComponent() {", "  const largeData = new Array(1000000).fill(\"data\");", "  const interval = setInterval(() => {", "    process(largeData); // keeps largeData alive forever!", "  }, 1000);", "  // FORGOT: return () => clearInterval(interval);", "}", "", "// Memory leak: event listener not cleaned up", "function addListeners() {", "  const data = fetchHugeDataset();", "  document.querySelector(\"#btn\").addEventListener(\"click\", () => {", "    display(data); // data kept alive as long as button exists", "  });", "  // Fix: removeEventListener when component unmounts", "}", "", "// Check memory in Chrome DevTools: Performance → Memory tab", "// Look for \"sawtooth\" pattern that never drops back to baseline"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Demonstrate you know how to diagnose leaks: Chrome DevTools Memory tab, heap snapshots, comparing heap before/after a suspected leak. This is a strong senior differentiator."]}]}, {"num": "Q57", "title": "What is event delegation and why is it better than attaching listeners to each element?", "level": "Senior", "blocks": [{"t": "p", "text": "Event delegation leverages event bubbling: instead of attaching a listener to each child element, attach one listener to a parent. The event bubbles up from the target, and you check event.target to identify which child was interacted with."}, {"t": "p", "text": "Benefits:"}, {"t": "li", "text": "Performance: one listener vs hundreds — less memory, faster page load"}, {"t": "li", "text": "Dynamic elements: new children added after the listener is set up automatically benefit"}, {"t": "li", "text": "Simpler code: one handler handles all matching children"}, {"t": "p", "text": "Use event.target.closest(selector) to find the nearest ancestor matching a selector, even if the user clicked a nested element inside the target."}, {"t": "code", "lang": "js", "lines": ["// INEFFICIENT: listener on each item", "document.querySelectorAll(\".todo-item\").forEach(item => {", "  item.addEventListener(\"click\", handleClick); // N listeners", "});", "", "// EFFICIENT: event delegation (one listener)", "document.querySelector(\"#todo-list\").addEventListener(\"click\", (e) => {", "  const item = e.target.closest(\".todo-item\"); // handles nested elements", "  if(!item) return; // click was not on an item", "", "  if(e.target.matches(\".delete-btn\")) {", "    deleteItem(item.dataset.id);", "  } else if(e.target.matches(\".complete-btn\")) {", "    completeItem(item.dataset.id);", "  }", "});", "// Works for items added dynamically AFTER this listener is set up"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention event.target.closest() as the correct pattern — not event.target.matches(). closest() handles clicks on nested elements (e.g. clicking the icon inside a button)."]}]}]}, {"id": "v2s1", "title": "TypeScript — Advanced", "sub": "Decorators, declaration merging, strict patterns", "qs": [{"num": "Q58", "title": "What is declaration merging in TypeScript?", "level": "Mid", "blocks": [{"t": "p", "text": "Declaration merging: when TypeScript sees two or more declarations with the same name, it merges them into a single definition."}, {"t": "p", "text": "Works with: interfaces (most common), namespaces, enums."}, {"t": "p", "text": "Does NOT work with: types (type aliases cannot be merged — redeclaring a type alias is an error)."}, {"t": "p", "text": "Common use: augmenting third-party library types without modifying node_modules. Example: adding custom properties to Express Request, adding properties to the Window interface, extending module declarations."}, {"t": "code", "lang": "js", "lines": ["// Augment Express Request (add req.user)", "// types/express.d.ts", "declare global {", "  namespace Express {", "    interface Request {", "      user?: import(\"./models/User\").IUser;", "      requestId?: string;", "    }", "  }", "}", "", "// Augment Window interface", "declare global {", "  interface Window {", "    analytics: { track: (event: string) => void };", "  }", "}", "window.analytics.track(\"page_view\"); // no TypeScript error", "", "// Augment a module", "declare module \"express-serve-static-core\" {", "  interface Request {", "    session: SessionData;", "  }", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Augmenting Express Request types is the most practical use of declaration merging. If you have worked with Express + TypeScript, you have almost certainly done this."]}]}, {"num": "Q59", "title": "What are discriminated unions and how do they improve type safety?", "level": "Senior", "blocks": [{"t": "p", "text": "A discriminated union is a union of types that each have a common literal property (the discriminant). TypeScript uses the discriminant to narrow the type in switch/if statements."}, {"t": "p", "text": "Benefits: exhaustive checking (TypeScript warns if you forget a case), no type assertions needed, IDE autocomplete shows only relevant properties."}, {"t": "p", "text": "Use for: action types in Redux, API response shapes (success vs error), state machine states, event payloads."}, {"t": "code", "lang": "js", "lines": ["// Without discriminated union — error-prone", "type Result = { data?: string; error?: string; };", "function handle(r: Result) {", "  if(r.data) { /* but data could be \"\" which is falsy */ }", "}", "", "// With discriminated union — airtight", "type Success = { status: \"success\"; data: string };", "type Failure = { status: \"error\";   code: number; message: string };", "type ApiResult = Success | Failure;", "", "function handle(r: ApiResult) {", "  switch(r.status) {", "    case \"success\": console.log(r.data);    break; // r is Success", "    case \"error\":   console.log(r.message); break; // r is Failure", "    // TypeScript warns if you add a new case and forget to handle it", "  }", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Know the \"never\" trick for exhaustive checking: add a default case that assigns the discriminant to a variable of type never. If you add a new union member and forget to handle it, TypeScript shows an error."]}]}, {"num": "Q60", "title": "Explain TypeScript's structural typing vs nominal typing.", "level": "Expert", "blocks": [{"t": "p", "text": "TypeScript uses structural typing (also called duck typing): two types are compatible if they have the same structure — regardless of their names. If it walks like a duck and quacks like a duck, TypeScript treats it as a duck."}, {"t": "p", "text": "Nominal typing (used by Java, C#): types are compatible only if they explicitly declare the relationship (extends, implements). Two classes with identical properties are NOT assignable to each other."}, {"t": "p", "text": "Structural typing implications: any object with a name: string and age: number satisfies interface Person — even if it was never declared as a Person. This is both powerful (flexible) and dangerous (unexpected compatibility)."}, {"t": "p", "text": "Simulate nominal typing in TypeScript: branded types (add a unique phantom field that does not exist at runtime)."}, {"t": "code", "lang": "js", "lines": ["// Structural typing — works", "interface User { name: string; age: number; }", "const u: User = { name: \"Ahmed\", age: 30, role: \"admin\" }; // extra props OK on assignment from object literal... actually error", "// Extra properties are only disallowed on direct object literal assignment", "// But this works:", "const obj = { name: \"Ahmed\", age: 30, role: \"admin\" };", "const u2: User = obj; // OK — structural check passes", "", "// Branded types (simulate nominal typing)", "type UserId   = string & { readonly _brand: \"UserId\" };", "type ProductId = string & { readonly _brand: \"ProductId\" };", "", "function getUser(id: UserId) { /* ... */ }", "const uid = \"abc\" as UserId;", "const pid = \"abc\" as ProductId;", "// getUser(pid); // TypeScript error — ProductId is not UserId", "getUser(uid);   // OK"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Branded types are the TypeScript pattern for preventing accidentally mixing up IDs of different entity types. This is expert-level TS knowledge that impresses senior interviewers."]}]}]}, {"id": "v2s2", "title": "React — Advanced Patterns & Edge Cases", "sub": "Patterns, state, refs, portals, error boundaries", "qs": [{"num": "Q61", "title": "What are React Error Boundaries and how do you implement one?", "level": "Mid", "blocks": [{"t": "p", "text": "Error Boundaries are React components that catch JavaScript errors in their child tree, log those errors, and display a fallback UI instead of crashing the entire component tree."}, {"t": "p", "text": "They catch errors during: rendering, lifecycle methods, constructor of child components."}, {"t": "p", "text": "They do NOT catch: errors in event handlers (use try/catch), async errors (unhandled promises), errors in the boundary itself, server-side rendering errors."}, {"t": "p", "text": "Error Boundaries must be class components — the getDerivedStateFromError and componentDidCatch lifecycle methods are not available in functional components. (A third-party library \"react-error-boundary\" wraps this in a clean functional API.)"}, {"t": "code", "lang": "js", "lines": ["// Class-based Error Boundary", "class ErrorBoundary extends React.Component {", "  state = { hasError: false, error: null };", "", "  static getDerivedStateFromError(error) {", "    // Update state so next render shows fallback UI", "    return { hasError: true, error };", "  }", "", "  componentDidCatch(error, info) {", "    // Log to error tracking service", "    Sentry.captureException(error, { extra: info });", "  }", "", "  render() {", "    if(this.state.hasError) {", "      r
