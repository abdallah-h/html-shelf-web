(req.body);", "    if(!result.success) {", "      return res.status(422).json({ errors: result.error.flatten() });", "    }", "    req.body = result.data; // replace with parsed/coerced data", "    next();", "  };", "", "router.post(\"/posts\", protect, validateBody(CreatePostSchema), createPost);"]}, {"t": "topic", "text": "React Testing Library & Playwright"}, {"t": "p", "text": "React Testing Library (RTL) encourages testing from the user's perspective. Query elements the way users find them: by role, label, text — not by CSS class or implementation detail."}, {"t": "p", "text": "The testing philosophy: test what the component DOES, not how it is BUILT. If you refactor and only implementation details change, tests should still pass."}, {"t": "p", "text": "Playwright: end-to-end browser automation. Runs real browsers (Chromium, Firefox, WebKit). Tests the full user flow from a real browser perspective — the closest to how users actually experience your app."}, {"t": "code", "lang": "js", "lines": ["// React Testing Library example", "import { render, screen, waitFor } from \"@testing-library/react\";", "import userEvent from \"@testing-library/user-event\";", "import { LoginForm } from \"./LoginForm\";", "", "// Mock the API", "jest.mock(\"../lib/api\", () => ({", "  post: jest.fn(),", "  get: jest.fn(),", "  put: jest.fn(),", "  delete: jest.fn(),", "  patch: jest.fn(),", "}));", "", "describe(\"LoginForm\", () => {", "  it(\"shows validation errors for empty submit\", async () => {", "    const user = userEvent.setup();", "    render(<LoginForm onSuccess={jest.fn()} />);", "", "    // Find by role and label — not by class name", "    const submitBtn = screen.getByRole(\"button\", { name: /sign in/i });", "    await user.click(submitBtn);", "", "    // Assert by text visible to the user", "    expect(screen.getByText(/email is required/i)).toBeInTheDocument();", "    expect(screen.getByText(/password is required/i)).toBeInTheDocument();", "  });", "", "  it(\"calls onSuccess with user data after successful login\", async () => {", "    const user = userEvent.setup();", "    const mockApi = require(\"../lib/api\");", "    const onSuccess = jest.fn();", "", "    mockApi.post.mockResolvedValueOnce({", "      user: { _id:\"1\", name:\"Ahmed\", role:\"user\" },", "      token: \"test-token\",", "    });", "", "    render(<LoginForm onSuccess={onSuccess} />);", "", "    await user.type(screen.getByLabelText(/email/i), \"a@b.com\");", "    await user.type(screen.getByLabelText(/password/i), \"password123\");", "    await user.click(screen.getByRole(\"button\", { name:/sign in/i }));", "", "    await waitFor(() => {", "      expect(onSuccess).toHaveBeenCalledWith(", "        expect.objectContaining({ name:\"Ahmed\" })", "      );", "    });", "  });", "});", "", "// Playwright E2E test", "// tests/e2e/auth.spec.ts", "import { test, expect } from \"@playwright/test\";", "", "test(\"full auth flow: register → login → create post → see it\", async ({ page }) => {", "  // Register", "  await page.goto(\"/register\");", "  await page.fill(\"[name=name]\", \"Ahmed Test\");", "  await page.fill(\"[name=email]\", `test${Date.now()}@test.com`);", "  await page.fill(\"[name=password]\", \"Password123!\");", "  await page.click(\"button[type=submit]\");", "  await expect(page).toHaveURL(\"/dashboard\"); // redirected", "", "  // Create a post", "  await page.click(\"text=New Post\");", "  await page.fill(\"[name=title]\", \"My E2E Test Post\");", "  await page.fill(\"[name=content]\", \"This post was created in a Playwright test.\");", "  await page.getByRole(\"button\", { name: \"Publish\" }).click();", "", "  // Verify it appears on home page", "  await page.goto(\"/\");", "  await expect(page.locator(\"h2\", { hasText:\"My E2E Test Post\" })).toBeVisible();", "  await expect(page.locator(\".post-author\", { hasText:\"Ahmed Test\" })).toBeVisible();", "});"]}, {"t": "callout", "kind": "capstone", "title": "Month 9 Capstone — TypeScript Migration & Full Test Suite", "body": ["Migrate your blog platform (frontend + backend) to full TypeScript. Shared types package imported by both.", "Frontend: RTL tests for all components, MSW for API mocking. Backend: Supertest + mongodb-memory-server, 80%+ coverage. E2E: Playwright for critical user flows (register, login, create post, delete post). CI fails if coverage drops below threshold."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Utility Types — the working set"}, {"t": "code", "lang": "js", "lines": ["type User = { id: string; name: string; email: string; role: \"user\"|\"admin\" };", "Partial<User>            // all optional — update payloads", "Pick<User, \"id\"|\"name\">  // subset          Omit<User, \"email\">", "Record<string, number>   // index map       Readonly<User>", "ReturnType<typeof fn>    // infer from code Awaited<Promise<T>>", "NonNullable<T | null>    // strip null/undefined"]}, {"t": "topic", "text": "Narrowing & Type Guards"}, {"t": "code", "lang": "js", "lines": ["function fmt(v: string | number | Date) {", "  if (typeof v === \"string\") return v.trim();        // narrowed: string", "  if (v instanceof Date) return v.toISOString();", "  return v.toFixed(2);                                // number by elimination", "}", "// Custom guard", "const isUser = (x: unknown): x is User =>", "  !!x && typeof x === \"object\" && \"email\" in x;"]}, {"t": "topic", "text": "Discriminated Unions — model states, not booleans"}, {"t": "code", "lang": "js", "lines": ["type FetchState<T> =", "  | { status: \"idle\" }", "  | { status: \"loading\" }", "  | { status: \"error\"; error: string }", "  | { status: \"success\"; data: T };", "// switch(state.status) — TS knows .data exists ONLY in \"success\",", "// and impossible states (loading + data) cannot be represented", "function assertNever(x: never): never { throw new Error(\"unhandled \" + x); }"]}, {"t": "topic", "text": "unknown vs any, and satisfies"}, {"t": "li", "text": "any turns the checker off and spreads; unknown is the safe top type — you must narrow before use. API responses and catch clauses should be unknown."}, {"t": "li", "text": "satisfies checks a value against a type without widening it: const cfg = {...} satisfies Config keeps literal types for autocomplete while enforcing the shape."}, {"t": "topic", "text": "Zod + infer — one source of truth"}, {"t": "code", "lang": "js", "lines": ["const UserSchema = z.object({ id: z.string(), email: z.string().email() });", "type User = z.infer<typeof UserSchema>;      // static type FROM the validator", "const user = UserSchema.parse(await res.json()); // runtime-checked at the edge", "// Types check compile time; zod checks runtime — you need both at IO boundaries"]}, {"t": "li", "text": "tsconfig flags that matter: \"strict\": true always; add noUncheckedIndexedAccess (arr[i] is T | undefined) and verbatimModuleSyntax for honest imports."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Discriminated unions are the TS interview centrepiece — \"model a fetch lifecycle so invalid states can't exist\" is asked almost verbatim."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 33", "body": ["E1: Convert a JS project to TypeScript with strict: true — no any, no @ts-ignore. Log every workaround you were tempted by.", "E2: Model a fetch lifecycle as a discriminated union and render it with an exhaustive switch plus assertNever.", "E3: Define one Zod schema per API resource and derive the TS types with z.infer — parse at every IO boundary.", "E4: Write a generic useFetch<T>() and a typed Express handler (Request<Params, Res, Body>) with no casts."]}], "week": 33}, {"id": "pg13", "title": "Docker & Containerization", "sub": "Week 37 · Month 10", "blocks": [{"t": "topic", "text": "Docker — Images, Containers & Dockerfiles"}, {"t": "p", "text": "Docker solves the \"works on my machine\" problem by packaging your application with all its dependencies into a portable container."}, {"t": "p", "text": "Image: a read-only template — like a class. Defined by a Dockerfile. Stored in a registry (Docker Hub, GitHub Container Registry)."}, {"t": "p", "text": "Container: a running instance of an image — like an object. Isolated from the host and other containers via Linux namespaces."}, {"t": "p", "text": "Multi-stage builds: use one image to build (node:24 with all devDependencies) and a different, smaller image for production (node:24-alpine with only production code). Reduces final image size from ~1GB to ~150MB."}, {"t": "code", "lang": "docker", "lines": ["# Dockerfile for Node.js Express API", "", "# ── Stage 1: build (has devDependencies for TypeScript compile)", "FROM node:24-alpine AS builder", "WORKDIR /app", "", "# Copy dependency files first (cached layer)", "COPY package*.json ./", "RUN npm ci               # exact install from lockfile", "", "# Copy source", "COPY tsconfig.json ./", "COPY src ./src", "RUN npm run build        # tsc output to /app/dist", "", "# ── Stage 2: production", "FROM node:24-alpine AS production", "", "# Security: run as non-root user", "RUN addgroup -S appgroup && adduser -S appuser -G appgroup", "WORKDIR /app", "", "# Copy only production deps (no devDependencies)", "COPY package*.json ./", "RUN npm ci --omit=dev", "", "# Copy compiled output from builder stage", "COPY --from=builder /app/dist ./dist", "", "# Set environment", "ENV NODE_ENV=production", "ENV PORT=3000", "EXPOSE 3000", "", "# Switch to non-root user", "USER appuser", "", "# Health check", "HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \\", "  CMD wget -qO- http://localhost:3000/health || exit 1", "", "# Start", "CMD [\"node\", \"dist/server.js\"]"]}, {"t": "topic", "text": "docker-compose — Multi-Container Applications"}, {"t": "p", "text": "docker-compose defines and runs multi-container Docker applications with a single YAML file. In development it replaces the need to install MongoDB, Redis, and Nginx locally."}, {"t": "p", "text": "Services: each service is a container. Services can reference each other by service name (the API container connects to MongoDB using the hostname \"mongodb\")."}, {"t": "p", "text": "Volumes: persist data beyond container restarts. Named volumes (mongo-data) persist in Docker's managed storage. Bind mounts (./src:/app/src) sync host files into the container for live reload in development."}, {"t": "code", "lang": "yaml", "lines": ["# docker-compose.yml", "# (no \"version:\" key — Compose v2 ignores it and warns)", "", "services:", "  api:", "    build:", "      context: .", "      dockerfile: Dockerfile", "      target: production      # use the production stage", "    ports: [\"3000:3000\"]", "    environment:", "      NODE_ENV: production", "      PORT: 3000", "      MONGO_URI: mongodb://mongodb:27017/myapp   # service name as host", "      REDIS_URL: redis://redis:6379", "      JWT_SECRET: ${JWT_SECRET}  # from .env file", "    depends_on:", "      mongodb: { condition: service_healthy }", "      redis:   { condition: service_started }", "    restart: unless-stopped", "", "  mongodb:", "    image: mongo:7", "    volumes: [mongo-data:/data/db]", "    healthcheck:", "      test: [\"CMD\",\"mongosh\",\"--eval\",\"db.adminCommand(\"ping\")\"]", "      interval: 10s", "      timeout: 5s", "      retries: 5", "    restart: unless-stopped", "", "  redis:", "    image: redis:7-alpine", "    volumes: [redis-data:/data]", "    command: redis-server --appendonly yes  # persistence", "    restart: unless-stopped", "", "  nginx:", "    image: nginx:alpine", "    ports: [\"80:80\",\"443:443\"]", "    volumes:", "      - ./nginx.conf:/etc/nginx/conf.d/default.conf", "      - ./certbot/www:/var/www/certbot     # Let's Encrypt", "      - ./certbot/conf:/etc/letsencrypt", "    depends_on: [api]", "    restart: unless-stopped", "", "volumes:", "  mongo-data:", "  redis-data:"]}, {"t": "topic", "text": "GitHub Actions CI/CD Pipeline"}, {"t": "p", "text": "GitHub Actions is a CI/CD platform built into GitHub. Workflows are YAML files in .github/workflows/."}, {"t": "p", "text": "CI (Continuous Integration): run on every push and pull request. Lint code, run tests, check coverage. Merge is blocked if CI fails."}, {"t": "p", "text": "CD (Continuous Deployment): run on merge to main. Build Docker image, push to registry, deploy to production server."}, {"t": "p", "text": "Secrets: sensitive values (API keys, deploy tokens) stored in GitHub repository Settings → Secrets and Variables. Referenced in workflows as ${{ secrets.MY_SECRET }}."}, {"t": "code", "lang": "shell", "lines": ["# .github/workflows/ci-cd.yml", "name: CI/CD Pipeline", "", "on:", "  push:", "    branches: [main, develop]", "  pull_request:", "    branches: [main]", "", "jobs:", "  test:", "    name: Test & Lint", "    runs-on: ubuntu-latest", "    strategy:", "      matrix:", "        node-version: [18, 20, 22]   # test on multiple versions", "", "    steps:", "      - uses: actions/checkout@v4", "", "      - name: Setup Node.js ${{ matrix.node-version }}", "        uses: actions/setup-node@v4", "        with:", "          node-version: ${{ matrix.node-version }}", "          cache: \"npm\"             # cache node_modules between runs", "", "      - name: Install dependencies", "        run: npm ci", "", "      - name: Lint", "        run: npm run lint", "", "      - name: Type check", "        run: npm run typecheck", "", "      - name: Test with coverage", "        run: npm run test:coverage", "        env:", "          CI: true", "          JWT_SECRET: test-secret-for-ci", "", "      - name: Upload coverage to Codecov", "        uses: codecov/codecov-action@v3", "", "  deploy:", "    name: Build & Deploy", "    needs: test              # only runs after test job succeeds", "    runs-on: ubuntu-latest", "    if: github.ref == \"refs/heads/main\"  # only on main branch", "", "    steps:", "      - uses: actions/checkout@v4", "", "      - name: Login to Docker Hub", "        uses: docker/login-action@v3", "        with:", "          username: ${{ secrets.DOCKER_USERNAME }}", "          password: ${{ secrets.DOCKER_TOKEN }}", "", "      - name: Build and push Docker image", "        uses: docker/build-push-action@v5", "        with:", "          context: .", "          push: true", "          tags: |", "            myuser/myapp:latest", "            myuser/myapp:${{ github.sha }}", "", "      - name: Deploy to Render", "        run: |", "          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}", "", "      - name: Notify Slack", "        if: always()", "        uses: rtCamp/action-slack-notify@v2", "        env:", "          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}", "          SLACK_MESSAGE: \"Deploy ${{ job.status }} for ${{ github.sha }}\""]}, {"t": "topic", "text": "Redis Caching & BullMQ Background Jobs"}, {"t": "p", "text": "Redis is an in-memory data store used for caching, session storage, pub/sub messaging, and job queues. Data is stored in RAM — reads are microseconds fast."}, {"t": "p", "text": "Cache-aside pattern: (1) check Redis first; (2) if cache miss, fetch from MongoDB; (3) store in Redis with TTL; (4) return data. On update/delete, delete the cache key."}, {"t": "p", "text": "BullMQ: a robust job queue built on Redis. Jobs are added to a queue and processed by worker processes. Supports retries, delays, priority, rate limiting, and repeating jobs."}, {"t": "p", "text": "Why background jobs: operations that are slow (sending email), unreliable (external API calls), or should not block the request cycle (webhooks, report generation)."}, {"t": "code", "lang": "js", "lines": ["// Redis caching with ioredis", "const Redis = require(\"ioredis\");", "const redis = new Redis(process.env.REDIS_URL);", "", "// Cache middleware — wraps any route", "function cache(ttlSeconds) {", "  return async (req, res, next) => {", "    const key = `cache:${req.originalUrl}`;", "    try {", "      const cached = await redis.get(key);", "      if(cached) {", "        return res.json(JSON.parse(cached));", "      }", "      // Monkey-patch res.json to cache the response", "      const originalJson = res.json.bind(res);", "      res.json = (data) => {", "        redis.setex(key, ttlSeconds, JSON.stringify(data));", "        return originalJson(data);", "      };", "      next();", "    } catch(err) { next(); } // fail open — serve uncached if Redis is down", "  };", "}", "", "// Usage: cache popular endpoints for 5 minutes", "router.get(\"/posts\", cache(300), postsController.list);", "", "// Invalidate on create/update/delete", "exports.createPost = async (req, res, next) => {", "  const post = await Post.create(req.body);", "  // Delete all cache keys matching posts", "  const keys = await redis.keys(\"cache:/api/posts*\");", "  if(keys.length) await redis.del(keys);", "  res.status(201).json(post);", "};", "", "// BullMQ worker queue", "const { Queue, Worker } = require(\"bullmq\");", "const connection = { host: \"redis\", port: 6379 };", "", "// Producer — add jobs from anywhere", "const emailQueue = new Queue(\"emails\", { connection });", "", "async function sendWelcomeEmail(user) {", "  await emailQueue.add(\"welcome\", { user }, {", "    attempts: 3,", "    backoff: { type:\"exponential\", delay:2000 },", "    removeOnComplete: 100,  // keep last 100 completed jobs", "    removeOnFail: 500,      // keep last 500 failed jobs", "  });", "}", "", "// Consumer — separate process or file", "const emailWorker = new Worker(\"emails\", async (job) => {", "  if(job.name === \"welcome\") {", "    const { user } = job.data;", "    await nodemailer.sendMail({", "      to: user.email,", "      subject: \"Welcome to MyApp!\",", "      html: welcomeTemplate(user),", "    });", "    console.log(`Welcome email sent to ${user.email}`);", "  }", "}, {", "  connection,", "  concurrency: 5,  // process 5 jobs at once", "});", "", "// Repeating job — hourly NetSuite sync", "const nsSyncQueue = new Queue(\"ns-sync\", { connection });", "await nsSyncQueue.add(\"sync-orders\", {}, {", "  repeat: { pattern: \"0 * * * *\" }, // every hour", "  jobId: \"ns-orders-sync\",          // stable ID prevents duplicates", "});"]}, {"t": "callout", "kind": "capstone", "title": "Month 10 Capstone — TypeScript SaaS Starter Kit", "body": ["Everything from Phases 1–3: TypeScript full-stack, JWT auth, CRUD, Docker (multi-stage), docker-compose (API + MongoDB + Redis + Nginx), GitHub Actions CI/CD (test → build → deploy), Redis caching, BullMQ email jobs, full test suite (80%+ coverage).", "This is a reusable foundation for any future MERN project. Hosted on GitHub as a public template repository."]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection — Month 10", "body": ["The BullMQ repeating job you build for NS data sync (hourly fetch → MongoDB upsert) is the foundation of the Phase 4 NS Analytics Dashboard backend.", "GitHub Actions CI/CD for NS integration projects: run your NS API client tests on every PR. A broken NS integration caught in CI is worth far more than one found in production at 2am.", "Redis TTL for NS data: NS API rate limits make aggressive caching essential. Cache NS record lookups (customer, item) in Redis with a 15-minute TTL to stay within concurrency limits."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Multi-stage Builds — small, safe images"}, {"t": "code", "lang": "docker", "lines": ["# build stage: full toolchain", "FROM node:22-alpine AS build", "WORKDIR /app", "COPY package*.json ./", "RUN npm ci", "COPY . .", "RUN npm run build && npm prune --omit=dev", "", "# runtime stage: only what runs", "FROM node:22-alpine", "WORKDIR /app", "ENV NODE_ENV=production", "COPY --from=build /app/node_modules ./node_modules", "COPY --from=build /app/dist ./dist", "USER node                      # never run as root", "EXPOSE 3000", "HEALTHCHECK CMD wget -qO- http://localhost:3000/healthz || exit 1", "CMD [\"node\", \"dist/server.js\"]"]}, {"t": "li", "text": "Layer-cache rule: COPY package*.json + install BEFORE copying source — code changes then skip the reinstall. Add a .dockerignore (node_modules, .git, .env) or the cache never hits."}, {"t": "topic", "text": "Secrets & Config in Containers"}, {"t": "li", "text": "Images are readable by anyone who pulls them — secrets never go in ENV instructions or layers. Inject at runtime: platform env vars, Docker secrets, or a secrets manager."}, {"t": "li", "text": "Build-time vs runtime: ARG exists only during build; ENV persists into the container. Vite-style VITE_* vars bake into the client bundle — they are public by definition."}, {"t": "topic", "text": "Nginx as Reverse Proxy"}, {"t": "code", "lang": "nginx", "lines": ["# serve the React build, proxy /api to Node, one origin = no CORS", "server {", "  listen 80;", "  root /usr/share/nginx/html;", "  location / { try_files $uri /index.html; }        # SPA fallback", "  location /api {", "    proxy_pass http://api:3000;", "    proxy_set_header X-Request-Id $request_id;", "    proxy_set_header X-Forwarded-For $remote_addr;", "  }", "  gzip on; gzip_types application/json text/css application/javascript;", "}"]}, {"t": "topic", "text": "Zero-Downtime Deploys"}, {"t": "li", "text": "Rolling: start new containers → wait for /readyz → shift traffic → stop old. Platforms (Render, Railway, K8s) do this when health checks exist — which is why Chapter I's graceful shutdown matters: SIGTERM must drain, not drop, in-flight requests."}, {"t": "li", "text": "Blue-green (two full environments, instant switch/rollback) and canary (1% of traffic first) are the answers to \"how do you deploy without downtime\" at senior interviews."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Multi-stage builds + non-root USER + healthcheck is the three-part answer to \"how do you productionise a Node image\"."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 37", "body": ["E1: Dockerise your API with a multi-stage build, non-root USER and a healthcheck; get the image under 200 MB.", "E2: Write a docker-compose stack (api + mongo + redis + nginx) that starts with one command and persists data in volumes.", "E3: Build a GitHub Actions pipeline: install → lint → test → build image → deploy on green only.", "E4: Add BullMQ + Redis for one background job (email or report) and watch it survive an API restart."]}], "week": 37}], "monthList": [{"n": 8, "title": "Advanced State Management & Real-Time Features", "goal": "Redux Toolkit, Zustand, TanStack Query, and Socket.io for real-time apps."}, {"n": 9, "title": "TypeScript & Comprehensive Testing", "goal": "Type the entire MERN stack. Achieve 80%+ coverage with unit, integration, and E2E tests."}, {"n": 10, "title": "DevOps, Redis Caching & Advanced Backend", "goal": "Docker, GitHub Actions CI/CD, Redis, BullMQ — production-ready infrastructure."}]}, {"id": "phase4", "n": 4, "months": "11-12", "title": "Expert: Architecture, Next.js & NetSuite Integration Capstone", "tagline": "System design, Next.js, open source, and the unique capstone that defines your career.", "intro": "", "pages": [{"id": "pg14", "title": "Next.js - App Router, Server Components & Data Fetching", "sub": "Week 41 · Month 11", "blocks": [{"t": "topic", "text": "Next.js App Router - Core Mental Model"}, {"t": "p", "text": "Next.js is a React framework that adds server-side rendering, static generation, file-based routing, image optimization, and more on top of React."}, {"t": "p", "text": "App Router (Next.js 13+): every file in the app/ directory is a route segment. page.tsx makes a segment publicly accessible. layout.tsx wraps child routes. loading.tsx shows a loading state. error.tsx catches errors."}, {"t": "p", "text": "Server Components vs Client Components: in the App Router, all components are Server Components by default. They run only on the server, have direct database access, and produce zero client-side JavaScript."}, {"t": "p", "text": "Add \"use client\" at the top of a file to make it a Client Component - interactive, hooks-enabled, runs in the browser."}, {"t": "p", "text": "Mental model: render as much as possible on the server. Only add \"use client\" for components that need interactivity."}, {"t": "code", "lang": "shell", "lines": ["// Create project with Vite or Next.js", "npx create-next-app@latest my-app --typescript --tailwind --app", "", "// app/layout.tsx - wraps all pages (Server Component)", "export default function RootLayout({ children }) {", "  return (", "    <html lang=\"en\">", "      <body>", "        <Navbar />", "        <main>{children}<\/main>", "      <\/body>", "    <\/html>", "  );", "}", "", "// app/posts/page.tsx - Server Component (runs on server)", "// Direct DB access - no useEffect, no API route needed", "import { Post } from \"@/models/Post\";", "", "export default async function PostsPage() {", "  const posts = await Post.find().sort(\"-createdAt\").limit(20).lean();", "  return (", "    <ul>", "      {posts.map(p => <li key={p._id.toString()}>{p.title}<\/li>)}", "    <\/ul>", "  );", "}", "", "// app/posts/[slug]/page.tsx - dynamic route", "export async function generateStaticParams() {", "  const posts = await Post.find().select(\"slug\").lean();", "  return posts.map(p => ({ slug: p.slug }));", "  // Pre-renders all post pages at build time (SSG)", "}", "", "// For ISR - add this to the file:", "// export const revalidate = 60; // rebuild every 60 seconds"]}, {"t": "topic", "text": "Next.js Data Fetching - fetch, revalidate and cache"}, {"t": "p", "text": "Next.js extends the native fetch API with caching and revalidation options."}, {"t": "p", "text": "Static (SSG): fetch at build time. Data rarely changes. Fastest TTFB."}, {"t": "p", "text": "ISR: rebuild in the background when data is stale. Set revalidate seconds on the route."}, {"t": "p", "text": "Dynamic (SSR): fetch on every request. Use when data changes frequently or is user-specific."}, {"t": "p", "text": "Server Actions: async functions that run on the server, called directly from forms. No separate API route needed."}, {"t": "code", "lang": "js", "lines": ["// Static - cached indefinitely at build time (SSG)", "const data = await fetch(\"https://api.example.com/config\", {", "  cache: \"force-cache\",", "});", "", "// ISR - cached but revalidated every 60 seconds", "const data2 = await fetch(\"https://api.example.com/posts\", {", "  next: { revalidate: 60 },", "});", "", "// Dynamic - never cached (SSR on every request)", "const data3 = await fetch(\"https://api.example.com/cart\", {", "  cache: \"no-store\",", "});", "", "// Server Action - form submits without a separate API route", "async function createPost(formData) {", "  \"use server\";", "  const title = formData.get(\"title\");", "  const post = await Post.create({ title, author: await getUserId() });", "  revalidatePath(\"/posts\");", "  redirect(\"/posts/\" + post.slug);", "}", "", "export default function CreatePostPage() {", "  return (", "    <form action={createPost}>", "      <input name=\"title\" required />", "      <button type=\"submit\">Create<\/button>", "    <\/form>", "  );", "}"]}, {"t": "topic", "text": "Next.js Proxy (formerly Middleware) and Runtimes"}, {"t": "p", "text": "Middleware runs BEFORE a request is completed at the Edge (CDN nodes). Use it for: auth redirects, A/B testing, geolocation routing."}, {"t": "p", "text": "Must not use Node.js APIs (no fs, no mongoose). Use edge-compatible libraries like jose for JWT."}, {"t": "p", "text": "The proxy file goes at the project root: proxy.ts (Next.js 16 renamed middleware.ts → proxy.ts and the export middleware → proxy; it now runs on the Node.js runtime. middleware.ts still works but is deprecated and only needed for Edge-runtime cases. Migrate with npx @next/codemod@canary middleware-to-proxy .)"}, {"t": "code", "lang": "js", "lines": ["// proxy.ts — Next.js 16+ (was middleware.ts; runs on the Node.js runtime)", "import { NextResponse } from \"next/server\";", "import { jwtVerify } from \"jose\"; // works on Node and Edge runtimes", "", "const AUTH_PATHS = [\"/dashboard\", \"/profile\", \"/settings\"];", "", "export async function proxy(request) {", "  const pathname = request.nextUrl.pathname;", "  const requiresAuth = AUTH_PATHS.some(p => pathname.startsWith(p));", "  if(!requiresAuth) return NextResponse.next();", "", "  const token = request.cookies.get(\"token\")?.value;", "  if(!token) {", "    const loginUrl = new URL(\"/login\", request.url);", "    loginUrl.searchParams.set(\"from\", pathname);", "    return NextResponse.redirect(loginUrl);", "  }", "", "  try {", "    const secret = new TextEncoder().encode(process.env.JWT_SECRET);", "    const { payload } = await jwtVerify(token, secret);", "    const response = NextResponse.next();", "    response.headers.set(\"x-user-id\", payload.id);", "    response.headers.set(\"x-user-role\", payload.role);", "    return response;", "  } catch {", "    return NextResponse.redirect(new URL(\"/login\", request.url));", "  }", "}", "", "export const config = {", "  matcher: [\"/dashboard/:path*\", \"/profile/:path*\"],", "};"]}, {"t": "topic", "text": "Backend Architecture Patterns"}, {"t": "p", "text": "Layered architecture: separate code into layers where each has one responsibility."}, {"t": "p", "text": "Routes then Controllers (handle HTTP) then Services (business logic) then Repositories (data access)."}, {"t": "p", "text": "Repository pattern: abstracts all data access. Swap MongoDB for PostgreSQL by only changing the Repository."}, {"t": "p", "text": "CQRS: separate the read and write models when their patterns differ significantly."}, {"t": "code", "lang": "js", "lines": ["// 1. Route: HTTP routing only", "router.post(\"/posts\", protect, validate(Schema), PostsController.create);", "", "// 2. Controller: req/res only, delegates to Service", "class PostsController {", "  static async create(req, res, next) {", "    try {", "      const post = await PostsService.create(req.user._id, req.body);", "      res.status(201).json({ success: true, data: post });", "    } catch(err) { next(err); }", "  }", "}", "", "// 3. Service: pure business logic, no HTTP", "class PostsService {", "  static async create(authorId, dto) {", "    const slug = slugify(dto.title);", "    if(await PostsRepository.findBySlug(slug)) {", "      throw new ConflictError(\"Title already taken\");", "    }", "    const post = await PostsRepository.create({ ...dto, author: authorId, slug });", "    await EmailService.notifyFollowers(authorId, post);", "    return post;", "  }", "}", "", "// 4. Repository: data access only. Swap DB here and nowhere else.", "class PostsRepository {", "  static create(data)     { return Post.create(data); }", "  static findBySlug(slug) { return Post.findOne({ slug }).lean(); }", "  static list({ page, limit, sort }) {", "    return Post.find().sort(sort).skip((page-1)*limit).limit(limit).lean();", "  }", "}"]}, {"t": "callout", "kind": "capstone", "title": "Month 11 Capstone - Turborepo Monorepo + Next.js Migration", "body": ["Migrate blog frontend to Next.js App Router: post list as SSG, post detail as ISR (60s revalidate), dashboard as dynamic SSR.", "Turborepo: apps/web (Next.js), apps/api (Express), packages/ui (shared components), packages/types (IUser, IPost, IComment).", "Publish packages/ui to npm. Submit one OSS pull request. Write one technical article on dev.to."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "File Conventions — layout, loading, error, not-found"}, {"t": "code", "lang": "js", "lines": ["app/", "  layout.jsx        // shared shell, persists across navigation", "  page.jsx          // the route UI", "  loading.jsx       // automatic Suspense fallback for this segment", "  error.jsx         // error boundary (\"use client\") with reset()", "  not-found.jsx     // notFound() renders this", "  api/route.js      // route handlers: export async function GET(req)"]}, {"t": "p", "text": "Each folder is a segment with its own loading and error states — streaming SSR shows the shell instantly while slow segments suspend. This file system IS the architecture; interviewers ask you to narrate it."}, {"t": "topic", "text": "Metadata & SEO"}, {"t": "code", "lang": "js", "lines": ["export async function generateMetadata({ params }) {", "  const post = await getPost(params.slug);", "  return { title: post.title,", "           openGraph: { images: [post.cover] } };", "}", "export async function generateStaticParams() {       // SSG the known slugs", "  return (await getSlugs()).map(slug => ({ slug }));", "}"]}, {"t": "topic", "text": "Auth in the App Router"}, {"t": "li", "text": "Middleware handles the cheap gate (has session cookie? redirect to /login) at the edge; real authorization happens in Server Components / Server Actions where you can hit the DB."}, {"t": "li", "text": "Read the session server-side (cookies() + verify) in a shared lib; never trust a client-passed user object. Auth.js (NextAuth v5) packages this pattern."}, {"t": "topic", "text": "Rendering Modes in One Table"}, {"t": "table", "rows": [["Mode", "When it renders", "Use for"], ["Static (SSG)", "at build", "marketing, docs, blogs"], ["ISR", "build + revalidate every N s", "catalogs, listings"], ["Dynamic (SSR)", "every request", "dashboards, personalised pages"], ["Client", "in the browser", "highly interactive widgets"]]}, {"t": "li", "text": "One page mixes modes: a static shell streaming a dynamic <Suspense> island is the default senior answer to \"SSR or SSG?\" — \"both, per component\"."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Be ready to explain why a fetch in a Server Component is cached (or not) in Next 15 — the caching-defaults flip (uncached by default) is fresh interview bait."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 41", "body": ["E1: Rebuild one capstone page in the App Router with a Server Component fetching data and a small Client Component island.", "E2: Add loading.jsx, error.jsx and not-found.jsx to a route group and trigger all three deliberately.", "E3: Implement a Server Action mutation with useActionState and revalidatePath — no client-side fetch at all.", "E4: Add generateMetadata with Open Graph tags and verify the preview in a social-card debugger."]}], "week": 41}, {"id": "pg15", "title": "NetSuite REST API - Full Integration Reference", "sub": "Week 45 · Month 12", "blocks": [{"t": "topic", "text": "NetSuite REST API - Architecture and Authentication"}, {"t": "p", "text": "NetSuite exposes records via the SuiteTalk REST Web Services API. Standard HTTP verbs against resource URLs."}, {"t": "p", "text": "Base URL: https://{accountId}.suitetalk.api.netsuite.com/services/rest/record/v1/{recordType}"}, {"t": "p", "text": "Authentication uses OAuth 1.0a with Token-Based Authentication (TBA). Four credentials: Consumer Key, Consumer Secret, Token Key, Token Secret."}, {"t": "p", "text": "OAuth 1.0a signature steps: (1) build a base string from method + URL + sorted parameters, (2) create signing key from Consumer Secret + Token Secret, (3) HMAC-SHA256 the base string, (4) base64-encode the result."}, {"t": "p", "text": "This signature goes in the Authorization header of every request. Unlike OAuth 2.0, there is no browser redirect flow."}, {"t": "code", "lang": "js", "lines": ["// NetSuite OAuth 1.0a client - Node.js (no external library)", "const crypto = require(\"crypto\");", "const axios  = require(\"axios\");", "", "class NetSuiteClient {", "  constructor({ accountId, consumerKey, consumerSecret, tokenKey, tokenSecret }) {", "    this.baseUrl = \"https://\" + accountId + \".suitetalk.api.netsuite.com/services/rest\";", "    this.creds = { consumerKey, consumerSecret, tokenKey, tokenSecret };", "    this.accountId = accountId;", "  }", "", "  _buildAuthHeader(method, url, extraParams = {}) {", "    const ts = Math.floor(Date.now() / 1000).toString();", "    const nonce = crypto.randomBytes(16).toString(\"hex\");", "", "    const oauthParams = {", "      oauth_consumer_key:     this.creds.consumerKey,", "      oauth_token:            this.creds.tokenKey,", "      oauth_signature_method: \"HMAC-SHA256\",", "      oauth_timestamp:        ts,", "      oauth_nonce:            nonce,", "      oauth_version:          \"1.0\",", "    };", "", "    const allParams = { ...oauthParams, ...extraParams };", "    const paramStr = Object.keys(allParams).sort()", "      .map(k => encodeURIComponent(k) + \"=\" + encodeURIComponent(allParams[k]))", "      .join(\"&\");", "", "    const baseStr = [method.toUpperCase(), encodeURIComponent(url), encodeURIComponent(paramStr)].join(\"&\");", "", "    const sigKey = encodeURIComponent(this.creds.consumerSecret) + \"&\" + encodeURIComponent(this.creds.tokenSecret);", "    const sig = crypto.createHmac(\"sha256\", sigKey).update(baseStr).digest(\"base64\");", "", "    const parts = { ...oauthParams, oauth_signature: sig, realm: this.accountId };", "    return \"OAuth \" + Object.keys(parts).map(k => k + \"=\" + JSON.stringify(encodeURIComponent(parts[k]))).join(\", \");", "  }", "", "  async request(method, path, { params = {}, body } = {}) {", "    const url = this.baseUrl + path;", "    const res = await axios({ method, url, params, data: body, headers: {", "      Authorization: this._buildAuthHeader(method, url, params),", "      \"Content-Type\": \"application/json\",", "      prefer: \"transient\",", "    } });", "    return res.data;", "  }", "", "  get(path, params) { return this.request(\"GET\",    path, { params }); }", "  post(path, body)  { return this.request(\"POST\",   path, { body }); }", "  patch(path, body) { return this.request(\"PATCH\",  path, { body }); }", "  del(path)         { return this.request(\"DELETE\", path); }", "}", "module.exports = NetSuiteClient;"]}, {"t": "topic", "text": "NetSuite Record API - CRUD Operations"}, {"t": "p", "text": "The Record API exposes all NS record types: salesOrder, customer, inventoryItem, invoice, vendor, purchaseOrder, and hundreds more."}, {"t": "p", "text": "Listing: GET /record/v1/{type}?limit=100&offset=0&q=status IS \"Open\". Supports filtering, sorting, pagination."}, {"t": "p", "text": "Getting: GET /record/v1/{type}/{id}. Use fields param to limit returned fields (like MongoDB projection)."}, {"t": "p", "text": "Creating: POST creates. PATCH partially updates. PUT fully replaces. Body is JSON with field names matching NS internal IDs."}, {"t": "p", "text": "Sublists: use expandSubResources=true to include line items and subrecords in the response."}, {"t": "code", "lang": "js", "lines": ["const ns = new NetSuiteClient(process.env);", "", "// List open Sales Orders with pagination", "async function getOpenOrders(page = 1) {", "  const limit = 100;", "  const offset = (page - 1) * limit;", "  const result = await ns.get(\"/record/v1/salesOrder\", {", "    limit, offset,", "    q: \"status IS \\\"Open\\\"\",", "    fields: \"id,tranid,entity,amount,trandate,status\",", "    expandSubResources: true,", "  });", "  return { orders: result.items, total: result.totalResults, hasMore: result.hasMore };", "}", "", "// Get single record with expanded sublists", "async function getOrder(id) {", "  return ns.get(\"/record/v1/salesOrder/\" + id, { expandSubResources: true });", "}", "", "// Create a Sales Order", "async function createOrder(data) {", "  return ns.post(\"/record/v1/salesOrder\", {", "    entity: { id: data.customerId },", "    trandate: new Date().toISOString().split(\"T\")[0],", "    item: {", "      items: data.lines.map(line => ({", "        item: { id: line.itemId },", "        quantity: line.qty,", "        rate: line.price,", "      })),", "    },", "  });", "}", "", "// Partial update (PATCH)", "async function updateOrderMemo(id, memo) {", "  return ns.patch(\"/record/v1/salesOrder/\" + id, { memo });", "}"]}, {"t": "topic", "text": "SuiteQL - SQL-Like Query Language for NetSuite"}, {"t": "p", "text": "SuiteQL is a SQL-like query language for NetSuite, querying the transaction database directly."}, {"t": "p", "text": "Supports JOIN, WHERE, GROUP BY, ORDER BY, and aggregates. Can join multiple NS record types in one query."}, {"t": "p", "text": "Endpoint: POST /query/v1/suiteql. Pass the SQL in the body as q. Supports limit and offset for pagination."}, {"t": "p", "text": "Far more powerful than the Record API for analytics - this is where you build the NS dashboard data."}, {"t": "code", "lang": "docker", "lines": ["// SuiteQL helper", "async function suiteql(query, limit = 100, offset = 0) {", "  return ns.request(\"POST\", \"/query/v1/suiteql\", {", "    params: { limit, offset },", "    body: { q: query },", "  });", "}", "", "// Revenue by customer - last 30 days", "const revenue = await suiteql(`", "  SELECT", "    c.id         AS customerId,", "    c.companyname AS customerName,", "    COUNT(t.id)  AS orderCount,", "    SUM(t.foreigntotal) AS totalRevenue,", "    MAX(t.trandate)     AS lastOrderDate", "  FROM customer c", "  JOIN transaction t ON t.entity = c.id", "  WHERE", "    t.recordtype = \"salesorder\"", "    AND t.status != \"SalesOrd:H\"", "    AND t.trandate >= TO_DATE(SYSDATE - 30)", "  GROUP BY c.id, c.companyname", "  ORDER BY totalRevenue DESC", "  FETCH FIRST 50 ROWS ONLY", "`);", "", "// Inventory alert - items below reorder point", "const lowStock = await suiteql(`", "  SELECT i.itemid AS sku, i.displayname AS name,", "    il.quantityonhand AS onHand, i.reorderpoint", "  FROM item i", "  JOIN inventorylocation il ON il.item = i.id", "  WHERE il.quantityonhand <= i.reorderpoint", "    AND i.isinactive = \"F\"", "  ORDER BY (il.quantityonhand - i.reorderpoint) ASC", "`);"]}, {"t": "topic", "text": "NS Webhooks and Real-Time Events"}, {"t": "p", "text": "NetSuite calls your Express endpoint when records are created or updated. Configure via a NS Workflow with a Send HTTP Request action."}, {"t": "p", "text": "Pattern: NS event -> NS Workflow -> HTTP POST to your Express -> validate -> update MongoDB -> Socket.io emit -> React updates."}, {"t": "p", "text": "Security: implement a shared secret in a custom header, or HMAC signature via a User Event Script that adds the header."}, {"t": "code", "lang": "js", "lines": ["// Express webhook endpoint", "router.post(\"/webhooks/netsuite\", verifyNSWebhook, async (req, res, next) => {", "  try {", "    const { recordType, recordId, eventType } = req.body;", "    if(recordType === \"salesOrder\") {", "      const order = await nsClient.get(\"/record/v1/salesOrder/\" + recordId, {", "        expandSubResources: true,", "      });", "      const updated = await Order.findOneAndUpdate(", "        { nsId: recordId },", "        { $set: transformOrder(order), updatedAt: new Date() },", "        { upsert: true, new: true }", "      );", "      io.to(\"room:dashboard\").emit(\"order:updated\", { order: updated, eventType });", "    }", "    res.status(200).json({ received: true });", "  } catch(err) { next(err); }", "});", "", "// Webhook signature verification middleware", "function verifyNSWebhook(req, res, next) {", "  const signature = req.headers[\"x-ns-signature\"];", "  const expected = crypto", "    .createHmac(\"sha256\", process.env.NS_WEBHOOK_SECRET)", "    .update(JSON.stringify(req.body))", "    .digest(\"hex\");", "  if(!crypto.timingSafeEqual(Buffer.from(signature, \"hex\"), Buffer.from(expected, \"hex\"))) {", "    return res.status(401).json({ error: \"Invalid signature\" });", "  }", "  next();", "}"]}, {"t": "topic", "text": "NS Analytics Dashboard - Full Architecture"}, {"t": "p", "text": "The capstone dashboard combines every skill from 12 months into one coherent system."}, {"t": "p", "text": "Data sync layer (BullMQ): hourly jobs pull data from NS via REST + SuiteQL, transform it, and upsert into MongoDB. The dashboard never calls NS directly on page load."}, {"t": "p", "text": "Redis caching: expensive aggregations cached with 15-minute TTL. NS webhook updates invalidate relevant cache keys."}, {"t": "p", "text": "Real-time layer: NS webhook -> Express -> MongoDB update -> Socket.io emit -> React dashboard updates without reload."}, {"t": "p", "text": "Frontend (Next.js): Server Components for initial render from MongoDB, Client Components with Socket.io for live updates."}, {"t": "code", "lang": "js", "lines": ["// 1. BullMQ sync job (hourly)", "const syncWorker = new Worker(\"ns-sync\", async (job) => {", "  if(job.name === \"sync-orders\") {", "    let offset = 0, hasMore = true;", "    while(hasMore) {", "      const { orders, hasMore: more } = await getOpenOrders(offset / 100 + 1);", "      await Order.bulkWrite(orders.map(o => ({", "        updateOne: { filter: { nsId: o.id }, update: { $set: transformOrder(o) }, upsert: true },", "      })));", "      offset += orders.length;", "      hasMore = more;", "    }", "    await redis.del(\"cache:dashboard:summary\");", "  }", "}, { connection, concurrency: 1 }); // respect NS rate limits", "", "// 2. Express dashboard API (reads MongoDB, not NS)", "router.get(\"/dashboard/summary\", cache(900), async (req, res, next) => {", "  try {", "    const [revenueByCategory, topCustomers, lowStock, recentOrders] = await Promise.all([", "      Order.aggregate([{ $group: { _id: \"$category\", total: { $sum: \"$amount\" } } }]),", "      Customer.find().sort(\"-totalRevenue\").limit(10).lean(),", "      Item.find({ onHand: { $lte: \"$reorderPoint\" } }).lean(),", "      Order.find({ status: \"Open\" }).sort(\"-createdAt\").limit(20).lean(),", "    ]);", "    res.json({ revenueByCategory, topCustomers, lowStock, recentOrders });", "  } catch(err) { next(err); }", "});", "", "// 3. Next.js dashboard page (Server Component)", "// app/dashboard/page.tsx", "export default async function DashboardPage() {", "  const summary = await fetchFromApi(\"/dashboard/summary\");", "  return (", "    <DashboardLayout>", "      <RevenueChart data={summary.revenueByCategory} />", "      <LiveOrderFeed initialOrders={summary.recentOrders} />", "      <LowStockAlerts items={summary.lowStock} />", "    <\/DashboardLayout>", "  );", "}", "// LiveOrderFeed has \"use client\" and connects to Socket.io for real-time updates"]}, {"t": "callout", "kind": "capstone", "title": "Year Capstone - NetSuite Analytics Dashboard", "body": ["Full data flow: NS REST + SuiteQL -> BullMQ hourly sync -> MongoDB -> Redis cache -> Express API -> Next.js Server Components + Socket.io real-time.", "Features: real-time open orders (Socket.io + NS webhook), revenue analytics (SuiteQL + Recharts), inventory alerts, customer health scores, role-based access matching NS roles.", "Stack: TypeScript throughout, Next.js 16 App Router, Turborepo monorepo, Docker + GitHub Actions CI/CD, Redis + BullMQ, MongoDB Atlas.", "This is your portfolio centrepiece and market differentiator. Price at 2000-10000 USD implementation + monthly SaaS fee."]}, {"t": "subhead", "text": "Certifications to Pursue"}, {"t": "table", "rows": [["Certification", "Details"], ["MongoDB Certified Developer Associate", "Most relevant cert for MERN backend. Covers aggregation pipeline, indexing, schema design, and Mongoose patterns. Exam fee approximately 150 USD. Study via MongoDB University free courses."], ["Meta Front-End Developer (Coursera)", "Covers React deeply across 9 courses. Portfolio-credible and recognized by tech employers globally. Complete while doing Phase 3-4 projects."], ["AWS Certified Cloud Practitioner", "Foundation for cloud deployment. Start here before AWS Developer Associate. 90-minute exam, study guide available free from AWS."], ["AWS Certified Developer - Associate", "Covers Lambda, API Gateway, DynamoDB, S3, CloudFormation, CI/CD with CodePipeline. Highly valued in the market."], ["NetSuite SuiteFoundation", "Keep this current. It is half your unique market positioning. Combined with MERN expertise it commands premium project rates."]]}, {"t": "callout", "kind": "tip", "title": "Final Note", "body": ["You have completed 12 months of structured learning, built 8 deployed projects, and created the NetSuite Analytics Dashboard.", "You are not a junior MERN developer. You are a MERN developer with NetSuite integration expertise. That combination commands premium rates.", "The next step is not more learning - it is shipping. Publish the dashboard, write the case study, update your LinkedIn, and start charging for what you can now build."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Governance — Rate Limits & Concurrency"}, {"t": "p", "text": "NetSuite REST enforces per-account concurrency limits and request governance. Integrations that fire unbounded parallel requests hit 429s in production even when dev worked fine. Wrap all NS calls in a limiter and treat 429 as a normal, retryable event."}, {"t": "code", "lang": "js", "lines": ["import pLimit from \"p-limit\";", "const nsLimit = pLimit(4);                 // stay under account concurrency", "const results = await Promise.all(", "  orders.map(o => nsLimit(() => pushToNetSuite(o))));", "", "async function withRetry(fn, tries = 5) {  // exponential backoff + jitter", "  for (let i = 0; i < tries; i++) {", "    try { return await fn(); }", "    catch (e) {", "      if (e.status !== 429 && e.status < 500) throw e;   // don't retry 4xx", "      await sleep(2 ** i * 500 + Math.random() * 300);", "    }", "  }", "  throw new Error(\"NS retries exhausted\");", "}"]}, {"t": "topic", "text": "Sync Strategies — delta, idempotency, reconciliation"}, {"t": "li", "text": "Delta sync: never full-pull. Query with lastModifiedDate > lastSyncCheckpoint (SuiteQL), process, then advance the checkpoint only after success."}, {"t": "li", "text": "Idempotency: store the NS internalId (or your externalId on the NS side) and upsert — replayed webhooks and retried jobs must not duplicate records."}, {"t": "li", "text": "Reconciliation job: a nightly count-and-checksum comparison per record type catches the drift that event-driven sync always eventually accumulates."}, {"t": "code", "lang": "js", "lines": ["// Idempotent upsert keyed by NetSuite internal id", "await Order.updateOne(", "  { nsId: payload.id },", "  { $set: mapNsOrder(payload), $setOnInsert: { importedAt: new Date() } },", "  { upsert: true });"]}, {"t": "topic", "text": "A Mapping Layer, not scattered field names"}, {"t": "p", "text": "Field mappings (NS custbody_* ↔ your schema) belong in one translation module with unit tests — the alternative is NS field names leaking through the whole codebase and breaking on the next customisation."}, {"t": "topic", "text": "Testing Integrations Without Hitting NetSuite"}, {"t": "li", "text": "Record real responses once, then mock the HTTP layer (msw or nock) in tests — sandbox credentials in CI are slow, flaky, and a security smell."}, {"t": "li", "text": "Contract tests: validate mapNsOrder() against stored sample payloads for every record type you consume; when NS adds a field, the fixture diff tells you first."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["For integration roles, \"how do you handle rate limits and duplicate deliveries\" is the whole interview — limiter + backoff + idempotent upsert + reconciliation is the complete answer."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 45", "body": ["E1: Authenticate to a NetSuite sandbox with OAuth 2.0 and fetch one record type end to end.", "E2: Write a SuiteQL delta query with a checkpoint and sync it into MongoDB via idempotent upsert on nsId.", "E3: Wrap all NS calls in a concurrency limiter with exponential backoff; simulate 429s and prove no data is lost.", "E4: Build a reconciliation script that reports count and field drift per record type, then schedule it nightly."]}], "week": 45}], "monthList": [{"n": 11, "title": "System Design, Architecture & Next.js", "goal": "Think at the architecture level. Design systems. Master Next.js App Router."}, {"n": 12, "title": "NetSuite + MERN Capstone & Expert Launch", "goal": "Build your unique differentiator. NS REST integration. Expert positioning."}]}], "chapters": [{"id": "pg16", "title": "MongoDB Advanced", "sub": "Chapter A", "blocks": [{"t": "p", "text": "These topics complete the MongoDB section of the roadmap. They cover production patterns that senior engineers use daily but that most tutorials skip."}, {"t": "subhead", "text": "A1 — Multi-Document ACID Transactions"}, {"t": "p", "text": "MongoDB added ACID transactions in version 4.0 for replica sets and 4.2 for sharded clusters. Before transactions, developers had to implement complex compensating logic for multi-document operations. Now you can wrap multiple operations in a session and guarantee they all succeed or all fail together."}, {"t": "topic", "text": "Why Transactions Are Needed"}, {"t": "p", "text": "Without transactions, a failure between two related writes leaves your database in an inconsistent state. Example: deducting balance from Account A succeeds, but crediting Account B crashes — the money disappears."}, {"t": "p", "text": "ACID guarantees: Atomicity (all or nothing), Consistency (DB moves from one valid state to another), Isolation (concurrent transactions do not interfere), Durability (committed data survives crashes)."}, {"t": "p", "text": "When to use: transferring funds between accounts, reserving inventory while creating an order line, updating multiple related documents that must stay in sync."}, {"t": "p", "text": "When NOT to use: single-document operations (already atomic in MongoDB), read-heavy operations (no writes = no need), operations on unrelated collections."}, {"t": "code", "lang": "js", "lines": ["const mongoose = require(\"mongoose\");", "", "// Pattern 1: session.withTransaction() — preferred, handles retries", "async function transferFunds(fromId, toId, amount) {", "  const session = await mongoose.startSession();", "  try {", "    const result = await session.withTransaction(async () => {", "      // All operations use the same session", "      const from = await Account.findById(fromId).session(session);", "      if (!from || from.balance < amount) {", "        throw new Error(\"Insufficient funds\"); // aborts transaction", "      }", "      await Account.findByIdAndUpdate(", "        fromId,", "        { $inc: { balance: -amount } },", "        { session }", "      );", "      await Account.findByIdAndUpdate(", "        toId,", "        { $inc: { balance: amount } },", "        { session }", "      );", "      await TransactionLog.create([{", "        from: fromId, to: toId, amount,", "        type: \"transfer\", timestamp: new Date(),", "      }], { session }); // array syntax required with session", "      return { success: true };", "    });", "    return result;", "  } finally {", "    session.endSession(); // always end session", "  }", "}", "", "// Pattern 2: manual commit/abort — more control", "async function reserveInventory(orderId, items) {", "  const session = await mongoose.startSession();", "  session.startTransaction({", "    readConcern: { level: \"snapshot\" },", "    writeConcern: { w: \"majority\" },", "  });", "  try {", "    for (const { itemId, qty } of items) {", "      const item = await Item.findOneAndUpdate(", "        { _id: itemId, stock: { $gte: qty } }, // check and update atomically", "        { $inc: { stock: -qty }, $push: { reservedBy: orderId } },", "        { new: true, session }", "      );", "      if (!item) throw new Error(`Insufficient stock for item ${itemId}`);", "    }", "    const order = await Order.findByIdAndUpdate(", "      orderId,", "      { status: \"confirmed\", confirmedAt: new Date() },", "      { session, new: true }", "    );", "    await session.commitTransaction();", "    return order;", "  } catch (err) {", "    await session.abortTransaction(); // rolls back all writes", "    throw err;", "  } finally {", "    session.endSession();", "  }", "}"]}, {"t": "topic", "text": "Transaction Performance Considerations"}, {"t": "p", "text": "Transactions have overhead: they hold locks, require inter-node coordination on replica sets, and add latency. Keep transactions short."}, {"t": "p", "text": "Max transaction lifetime: 60 seconds by default (transactionLifetimeLimitSeconds). Operations that exceed this are aborted."}, {"t": "p", "text": "Avoid long-running operations inside transactions: no external API calls, no heavy computation, no user input waiting."}, {"t": "p", "text": "withTransaction() automatically retries on transient errors (network blip, write conflict). Manual transactions need you to handle TransientTransactionError yourself."}, {"t": "p", "text": "Anti-pattern: putting a fetch() call inside a transaction. This holds locks while waiting for an external service — guaranteed deadlocks under load."}, {"t": "code", "lang": "js", "lines": ["// WRONG: external call inside transaction", "async function badPattern(userId, amount) {", "  const session = await mongoose.startSession();", "  await session.withTransaction(async () => {", "    await User.findByIdAndUpdate(userId, { $inc: { balance: -amount } }, { session });", "    await fetch(\"https://payment-gateway.com/charge\"); // HOLDS LOCK while waiting!", "    // If fetch takes 5s, your DB records are locked for 5s", "  });", "}", "", "// CORRECT: do external calls outside the transaction", "async function goodPattern(userId, amount) {", "  // 1. External call first, outside transaction", "  const chargeResult = await paymentGateway.charge(amount);", "  if (!chargeResult.success) throw new Error(\"Payment failed\");", "", "  // 2. Short DB transaction to record the result", "  const session = await mongoose.startSession();", "  await session.withTransaction(async () => {", "    await User.findByIdAndUpdate(userId,", "      { $inc: { balance: -amount }, $push: { payments: chargeResult.id } },", "      { session }", "    );", "    await Payment.create([{ user: userId, amount, ref: chargeResult.id }], { session });", "  });", "  session.endSession();", "}"]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite + Transactions", "body": ["NS inventory reservation: when a customer places an order via your MERN frontend, use a transaction to simultaneously create the Order document and decrement the Item stock. If either fails, both roll back — no overselling.", "NS financial sync: when syncing a NS invoice to MongoDB, use a transaction to update the Invoice document, the Customer balance, and the AuditLog in one atomic operation."]}, {"t": "subhead", "text": "A2 — Change Streams"}, {"t": "p", "text": "Change streams let you watch a collection, database, or entire cluster for real-time changes without polling. They are built on MongoDB's oplog and provide at-least-once delivery with resumability."}, {"t": "topic", "text": "Change Stream Fundamentals"}, {"t": "p", "text": "A change stream emits a document for each insert, update, replace, delete, and invalidate event. Each event contains: operationType, fullDocument (the new state after update), updateDescription (which fields changed), ns (namespace), and a resumeToken."}, {"t": "p", "text": "Requirements: replica set or sharded cluster (not standalone). Atlas M0+ supports change streams."}, {"t": "p", "text": "Resume tokens: save the last _id from the change event. If your watcher crashes, resume from that token to catch up on missed events — guaranteed not to miss changes."}, {"t": "p", "text": "fullDocument: by default, updates only give you the diff. Set fullDocument: \"updateLookup\" to get the complete document after the update."}, {"t": "code", "lang": "js", "lines": ["const mongoose = require(\"mongoose\");", "", "// Watch a single collection", "async function watchOrders(io) {", "  const Order = mongoose.model(\"Order\");", "  const changeStream = Order.watch(", "    [", "      // Optional pipeline: filter events", "      { $match: {", "          \"operationType\": { $in: [\"insert\", \"update\", \"replace\"] },", "          \"fullDocument.status\": \"Open\",", "      }},", "    ],", "    {", "      fullDocument: \"updateLookup\", // get full doc on updates", "      resumeAfter: getLastResumeToken(), // resume from last saved token", "    }", "  );", "", "  changeStream.on(\"change\", async (event) => {", "    // Save resume token so we can recover from crashes", "    await saveResumeToken(event._id);", "", "    if (event.operationType === \"insert\") {", "      io.to(\"dashboard\").emit(\"order:new\", event.fullDocument);", "    } else if (event.operationType === \"update\") {", "      io.to(\"dashboard\").emit(\"order:updated\", event.fullDocument);", "    }", "  });", "", "  changeStream.on(\"error\", (err) => {", "    console.error(\"Change stream error:\", err);", "    // Restart after delay", "    setTimeout(() => watchOrders(io), 5000);", "  });", "", "  // Graceful shutdown", "  process.on(\"SIGINT\", async () => {", "    await changeStream.close();", "    process.exit(0);", "  });", "}", "", "// Watch entire database", "const dbStream = mongoose.connection.db.watch([], { fullDocument: \"updateLookup\" });", "dbStream.on(\"change\", (event) => {", "  console.log(event.ns.coll, event.operationType); // which collection changed", "});"]}, {"t": "subhead", "text": "A3 — Atlas Search & Vector Search"}, {"t": "p", "text": "Atlas Search provides full-text search on top of your MongoDB data using Apache Lucene under the hood. It supports fuzzy matching, autocomplete, faceted navigation, highlighting, and relevance scoring — all via the aggregation pipeline."}, {"t": "topic", "text": "Atlas Search — $search Stage"}, {"t": "p", "text": "Create a search index in Atlas UI or via the API. The index defines which fields are searchable and how they are analyzed (language-specific tokenisation, synonyms, etc.)."}, {"t": "p", "text": "The $search aggregation stage runs before any $match stage, so it is always the first stage in the pipeline. It returns documents ordered by relevance score."}, {"t": "p", "text": "Operators: text (full-text), phrase (exact phrase), fuzzy (typo-tolerant), wildcard, regex, range (numeric/date), geoWithin (geospatial), compound (combine multiple operators with must/should/mustNot/filter)."}, {"t": "code", "lang": "shell", "lines": ["// Full-text search with fuzzy matching", "const results = await Product.aggregate([", "  {", "    $search: {", "      index: \"products_search\", // Atlas Search index name", "      compound: {", "        must: [{", "          text: {", "            query: searchTerm,", "            path: [\"name\", \"description\", \"tags\"],", "            fuzzy: { maxEdits: 1, prefixLength: 3 }, // typo tolerance", "          },", "        }],", "        filter: [{", "          range: { path: \"price\", gte: minPrice, lte: maxPrice },", "        }],", "        should: [{", "          text: {", "            query: searchTerm,", "            path: \"name\",", "            score: { boost: { value: 3 } }, // name matches rank higher", "          },", "        }],", "      },", "    },", "  },", "  { $limit: 20 },", "  {", "    $project: {", "      name: 1, price: 1, category: 1,", "      score: { $meta: \"searchScore\" },    // relevance score", "      highlights: { $meta: \"searchHighlights\" }, // matched text", "    },", "  },", "]);", "", "// Autocomplete (requires autocomplete field in index)", "const suggestions = await Product.aggregate([", "  {", "    $search: {", "      index: \"products_search\",", "      autocomplete: {", "        query: partialTerm,", "        path: \"name\",", "        tokenOrder: \"sequential\",", "        fuzzy: { maxEdits: 1 },", "      },", "    },", "  },", "  { $limit: 5 },", "  { $project: { name: 1 } },", "]);", "", "// Faceted search (counts per category)", "const faceted = await Product.aggregate([", "  {", "    $searchMeta: {", "      index: \"products_search\",", "      facet: {", "        operator: { text: { query: searchTerm, path: \"name\" } },", "        facets: {", "          categoryCounts: { type: \"string\", path: \"category\", numBuckets: 10 },", "          priceBuckets: { type: \"number\", path: \"price\",", "            boundaries: [0, 50, 100, 250, 500, 1000] },", "        },", "      },", "    },", "  },", "]);"]}, {"t": "topic", "text": "Atlas Vector Search — Semantic Search"}, {"t": "p", "text": "Vector search stores high-dimensional embeddings (arrays of floats) alongside your documents and finds nearest neighbors by cosine similarity or dot product."}, {"t": "p", "text": "Use cases: semantic search (find documents similar in meaning, not just keyword matches), recommendation (find products similar to what user liked), RAG (retrieval-augmented generation for AI chatbots on your data)."}, {"t": "p", "text": "Workflow: generate embeddings with OpenAI/Cohere/local model → store in MongoDB → create vector index → query with $vectorSearch stage."}, {"t": "p", "text": "Vector index must be created separately from regular search indexes. It specifies the field name, number of dimensions, and similarity metric."}, {"t": "code", "lang": "js", "lines": ["// 1. Generate and store embeddings on insert", "const { OpenAI } = require(\"openai\");", "const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });", "", "async function embedDocument(text) {", "  const res = await openai.embeddings.create({", "    model: \"text-embedding-3-small\",", "    input: text,", "  });", "  return res.data[0].embedding; // array of 1536 floats", "}", "", "// Schema with embedding field", "const productSchema = new mongoose.Schema({", "  name: String,", "  description: String,", "  embedding: { type: [Number], select: false }, // exclude from normal queries", "});", "", "// Store embedding when product is created", "productSchema.pre(\"save\", async function() {", "  if (this.isModified(\"description\")) {", "    this.embedding = await embedDocument(this.name + \" \" + this.description);", "  }", "});", "", "// 2. Semantic search with $vectorSearch", "async function semanticSearch(query, limit = 10) {", "  const queryEmbedding = await embedDocument(query);", "", "  return Product.aggregate([", "    {", "      $vectorSearch: {", "        index: \"product_vector_index\",", "        path: \"embedding\",", "        queryVector: queryEmbedding,", "        numCandidates: 100,  // examine this many before returning limit", "        limit,", "        filter: { category: \"electronics\" }, // optional pre-filter", "      },", "    },", "    {", "      $project: {", "        name: 1, description: 1, price: 1,", "        score: { $meta: \"vectorSearchScore\" },", "      },", "    },", "  ]);", "}", "", "// Result: finds \"wireless headphones\" even if query is \"audio device for commuting\""]}, {"t": "topic", "text": "Advanced Aggregation Pipeline Patterns"}, {"t": "p", "text": "The aggregation pipeline is the most powerful feature in MongoDB. These are the advanced stages that production applications use."}, {"t": "p", "text": "$facet: run multiple sub-pipelines on the same input documents simultaneously. Perfect for search results pages that need both the data and the facet counts."}, {"t": "p", "text": "$graphLookup: recursive traversal of a tree or graph structure stored in the same collection. Use for org charts, category hierarchies, friend-of-friend queries."}, {"t": "p", "text": "$setWindowFields: compute running totals, moving averages, rank, and percentile across a window of documents. Like SQL window functions."}, {"t": "p", "text": "$bucket / $bucketAuto: group documents into buckets based on value ranges. Useful for histograms and analytics dashboards."}, {"t": "code", "lang": "shell", "lines": ["// $facet: run multiple aggregations in one pass", "const searchPage = await Product.aggregate([", "  { $match: { active: true } },", "  {", "    $facet: {", "      // Facet 1: paginated results", "      results: [", "        { $sort: { price: 1 } },", "        { $skip: (page - 1) * limit },", "        { $limit: limit },", "        { $project: { name: 1, price: 1, image: 1 } },", "      ],", "      // Facet 2: total count (for pagination)", "      totalCount: [{ $count: \"count\" }],", "      // Facet 3: price histogram", "      priceHistogram: [", "        { $bucket: {", "            groupBy: \"$price\",", "            boundaries: [0, 25, 50, 100, 250, 500, 1000],", "            default: \"1000+\",", "        }},", "      ],", "      // Facet 4: counts per category", "      categories: [", "        { $group: { _id: \"$category\", count: { $sum: 1 } } },", "        { $sort: { count: -1 } },", "      ],", "    },", "  },", "]);", "", "// $setWindowFields: running total and rank", "const salesWithRank = await Sale.aggregate([", "  {", "    $setWindowFields: {", "      partitionBy: \"$category\",       // group by category", "      sortBy: { amount: -1 },", "      output: {", "        rank: { $rank: {} },           // rank within category", "        runningTotal: {", "          $sum: \"$amount\",", "          window: { documents: [\"unbounded\", \"current\"] },", "        },", "        movingAvg: {", "          $avg: \"$amount\",", "          window: { documents: [-4, 0] }, // last 5 docs", "        },", "      },", "    },", "  },", "]);", "", "// $graphLookup: category hierarchy (parent -> children)", "const categoryTree = await Category.aggregate([", "  { $match: { parentId: null } }, // start from root categories", "  {", "    $graphLookup: {", "      from: \"categories\",", "      startWith: \"$_id\",", "      connectFromField: \"_id\",", "      connectToField: \"parentId\",", "      as: \"descendants\",", "      maxDepth: 5,", "      depthField: \"depth\",", "    },", "  },", "]);"]}, {"t": "topic", "text": "Index Strategies for Production"}, {"t": "p", "text": "Indexes are the single biggest performance lever in MongoDB. A missing index on a frequently-queried field causes a full collection scan — catastrophic at scale."}, {"t": "p", "text": "Index types: single field, compound (order matters: equality fields first, then sort fields, then range fields), text (full-text search, use Atlas Search instead for production), TTL (auto-delete documents after expiry), sparse (only index documents where the field exists), partial (only index documents matching a filter), wildcard (all sub-fields dynamically)."}, {"t": "p", "text": "The ESR rule for compound indexes: Equality fields first, then Sort fields, then Range fields."}, {"t": "p", "text": "explain() is your friend: db.collection.find(query).explain(\"executionStats\") shows whether an index was used (IXSCAN) or a collection scan occurred (COLLSCAN). Always check before deploying a new query pattern."}, {"t": "code", "lang": "js", "lines": ["// TTL index: auto-delete sessions after 24 hours", "sessionSchema.index({ createdAt: 1 }, { expireAfterSeconds: 86400 });", "", "// Sparse index: only index documents that have the field", "userSchema.index({ googleId: 1 }, { sparse: true }); // only indexed users with Google login", "", "// Partial index: only index active products (saves space)", "productSchema.index({ category: 1, price: 1 }, {", "  partialFilterExpression: { active: true, stock: { $gt: 0 } },", "});", "", "// Compound index following ESR rule", "// Query: find active posts by userId, sorted by createdAt", "// Equality: userId (first), Sort: createdAt (second), Range: none", "postSchema.index({ userId: 1, createdAt: -1 });", "", "// Text index (basic - prefer Atlas Search for production)", "postSchema.index({ title: \"text\", content: \"text\" }, {", "  weights: { title: 10, content: 1 }, // title matches rank higher", "  default_language: \"arabic\",          // for Arabic content", "});", "", "// Check index usage with explain()", "const explanation = await Post", "  .find({ userId: \"123\", active: true })", "  .sort({ createdAt: -1 })", "  .explain(\"executionStats\");", "", "console.log(explanation.executionStats.executionStages.stage);", "// \"IXSCAN\" = index used (good)", "// \"COLLSCAN\" = full scan (bad — add an index)", "", "// Wildcard index: for dynamic/unknown fields", "db.collection.createIndex({ \"attributes.$**\": 1 });", "// Now any query on attributes.color, attributes.size, etc. uses the index"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Chapter A", "body": ["E1: Implement an inventory reservation with a transaction, then deliberately force a write conflict and handle the retry.", "E2: Use a change stream to push live order updates to a WebSocket room.", "E3: Build an Atlas Search index with fuzzy matching and autocomplete over a product catalogue.", "E4: Embed 200 documents and answer questions over them with $vectorSearch, filtered by tenant."]}]}, {"id": "pg17", "title": "Security Hardening", "sub": "Chapter B", "blocks": [{"t": "p", "text": "Security is not a feature you add at the end — it is woven into every layer of your stack. This chapter documents attack vectors, prevention patterns, and the production security baseline every MERN expert must maintain."}, {"t": "topic", "text": "NoSQL Injection — MongoDB Operator Injection"}, {"t": "p", "text": "Unlike SQL injection where an attacker injects SQL syntax, NoSQL injection exploits MongoDB operators. An attacker sends a JSON body with MongoDB operators instead of string values."}, {"t": "p", "text": "Example: a login form expecting { email: \"a@b.com\", password: \"secret\" } receives { email: { $gt: \"\" }, password: { $gt: \"\" } }. Without sanitisation, this matches ALL documents — logging in as the first user in the database."}, {"t": "p", "text": "Prevention: use Mongoose strict schemas (it only allows defined fields by default), validate with Zod/express-validator before any DB query, use express-mongo-sanitize to strip $ and . from request bodies/query strings."}, {"t": "code", "lang": "js", "lines": ["// VULNERABLE: passing req.body directly to a query", "app.post(\"/login\", async (req, res) => {", "  // If req.body = { email: { $gt: \"\" }, password: { $gt: \"\" } }", "  // This matches ALL users — attacker logs in as the first user!", "  const user = await User.findOne({", "    email: req.body.email,    // UNSAFE", "    password: req.body.password, // UNSAFE", "  });", "});", "", "// SAFE: use express-mongo-sanitize middleware", "const mongoSanitize = require(\"express-mongo-sanitize\");", "app.use(mongoSanitize({", "  replaceWith: \"_\",  // replace $ with _ instead of removing", "  onSanitize: ({ req, key }) => {", "    console.warn(`Sanitized key: ${key} from ${req.ip}`);", "  },", "}));", "", "// SAFE: Zod schema rejects non-string types", "const LoginSchema = z.object({", "  email: z.string().email(), // must be a string, not an object", "  password: z.string().min(8),", "});", "", "// SAFE: explicit type casting", "const user = await User.findOne({", "  email: String(req.body.email),    // forces string type", "  password: String(req.body.password),", "});"]}, {"t": "topic", "text": "CSRF Protection"}, {"t": "p", "text": "CSRF (Cross-Site Request Forgery): an attacker tricks a logged-in user's browser into making a request to your API with the user's cookies attached."}, {"t": "p", "text": "Token-based auth (JWT in Authorization header): NOT vulnerable to CSRF, because cross-origin requests cannot set custom headers. If you use JWT in localStorage, CSRF is not your problem (XSS is)."}, {"t": "p", "text": "Cookie-based auth: VULNERABLE to CSRF. Mitigation: SameSite=Strict or SameSite=Lax on session cookies (modern browsers enforce this), CSRF tokens (double-submit cookie pattern), custom header check (browsers cannot set custom headers in cross-origin requests without CORS preflight)."}, {"t": "p", "text": "Best practice today: SameSite=Lax is the sensible default for session cookies (and what browsers apply when the attribute is missing) — it blocks cross-site POSTs while keeping users logged in when they arrive from an external link. Use SameSite=Strict for high-value cookies or admin apps, accepting that users following a link from email or another site will appear logged out on that first request. Neither replaces CSRF tokens for state-changing endpoints in cookie-authenticated apps."}, {"t": "code", "lang": "js", "lines": ["// Setting secure cookies with SameSite", "res.cookie(\"token\", jwt, {", "  httpOnly: true,      // not accessible via JS — prevents XSS theft", "  secure: true,        // HTTPS only", "  sameSite: \"strict\",  // browser will NOT send cookie on cross-origin requests", "  maxAge: 15 * 60 * 1000, // 15 minutes", "  path: \"/api\",        // only sent to /api paths", "  domain: \".myapp.com\",// include subdomains", "});", "", "// Double-submit CSRF token pattern (for APIs that need cookie auth + CSRF protection)", "const crypto = require(\"crypto\");", "", "// Generate CSRF token on login", "const csrfToken = crypto.randomBytes(32).toString(\"hex\");", "res.cookie(\"csrf-token\", csrfToken, {", "  httpOnly: false,     // accessible to JS so client can read and send it", "  secure: true,", "  sameSite: \"strict\",", "});", "", "// CSRF middleware: verify token on state-changing requests", "function csrfProtect(req, res, next) {", "  if ([\"GET\", \"HEAD\", \"OPTIONS\"].includes(req.method)) return next();", "  const cookieToken = req.cookies[\"csrf-token\"];", "  const headerToken = req.headers[\"x-csrf-token\"];", "  if (!cookieToken || !headerToken || cookieToken !== headerToken) {", "    return res.status(403).json({ message: \"CSRF token mismatch\" });", "  }", "  next();", "}", "", "// Client: read cookie and send as header", "// const csrfToken = document.cookie.match(/csrf-token=([^;]+)/)?.[1];", "// fetch(\"/api/posts\", { method: \"POST\", headers: { \"X-CSRF-Token\": csrfToken } });"]}, {"t": "topic", "text": "Content Security Policy (CSP)"}, {"t": "p", "text": "CSP is an HTTP header that tells the browser which resources it is allowed to load. Even if an attacker injects a script tag, CSP prevents it from executing."}, {"t": "p", "text": "The strongest CSP uses nonces: a random value generated per-request, added to the script tag and the header. The browser only executes scripts with matching nonces."}, {"t": "p", "text": "Helmet.js provides CSP helpers but you must configure it — the defaults are too loose for production."}, {"t": "code", "lang": "js", "lines": ["const crypto = require(\"crypto\");", "const helmet = require(\"helmet\");", "", "// Nonce-based CSP (strongest)", "app.use((req, res, next) => {", "  res.locals.nonce = crypto.randomBytes(16).toString(\"base64\");", "  next();", "});", "", "app.use(helmet.contentSecurityPolicy({", "  directives: {", "    defaultSrc: [\"self\"],", "    scriptSrc: [", "      \"self\",", "      (req, res) => `\"nonce-${res.locals.nonce}\"`, // nonce for inline scripts", "    ],", "    styleSrc: [\"self\", \"https://fonts.googleapis.com\"],", "    fontSrc: [\"self\", \"https://fonts.gstatic.com\"],", "    imgSrc: [\"self\", \"data:\", \"https://res.cloudinary.com\"],", "    connectSrc: [\"self\", \"https://api.myapp.com\"],", "    objectSrc: [\"none\"],      // no Flash/plugins", "    upgradeInsecureRequests: [],", "    reportTo: \"/api/csp-report\", // log violations", "  },", "}));", "", "// In your HTML template, use the nonce:", "// <script nonce=\"<%= nonce %>\">/* inline script */<\/script>", "", "// Other essential Helmet settings", "app.use(helmet({", "  hsts: { maxAge: 31536000, includeSubDomains: true, preload: true },", "  referrerPolicy: { policy: \"strict-origin-when-cross-origin\" },", "  xContentTypeOptions: true,", "  xFrameOptions: { action: \"deny\" },      // prevent clickjacking", "  dnsPrefetchControl: { allow: false },", "}));"]}, {"t": "topic"
