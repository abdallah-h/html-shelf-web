eturn this.props.fallback || <h2>Something went wrong<\/h2>;", "    }", "    return this.props.children;", "  }", "}", "", "// Usage", "<ErrorBoundary fallback={<ErrorPage />}>", "  <Dashboard />", "<\/ErrorBoundary>", "", "// react-error-boundary library (functional API)", "import { ErrorBoundary } from \"react-error-boundary\";", "<ErrorBoundary FallbackComponent={ErrorFallback} onError={logError}>", "  <App />", "<\/ErrorBoundary>"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Candidates often say \"useEffect can catch errors\" — wrong. Error boundaries catch render-time errors. Event handler errors need try/catch. This distinction is tested frequently."]}]}, {"num": "Q62", "title": "What are React Portals and when would you use them?", "level": "Mid", "blocks": [{"t": "p", "text": "A React Portal renders children into a different DOM node than the parent component — outside the parent's DOM hierarchy — while keeping them in the React component tree."}, {"t": "p", "text": "Created with ReactDOM.createPortal(child, domNode)."}, {"t": "p", "text": "Use cases: modals and dialogs (avoid z-index and overflow: hidden issues by rendering at document.body level), tooltips and dropdowns (position relative to viewport, not a potentially overflow:hidden ancestor), notification toasts."}, {"t": "p", "text": "Key insight: portals stay in the React component tree — events still bubble through React's virtual tree, not the DOM tree. A click inside a portal propagates to the portal's React parent component."}, {"t": "code", "lang": "js", "lines": ["import { createPortal } from \"react-dom\";", "", "function Modal({ isOpen, onClose, children }) {", "  if(!isOpen) return null;", "", "  return createPortal(", "    <div className=\"modal-overlay\" onClick={onClose}>", "      <div className=\"modal-content\" onClick={e => e.stopPropagation()}>", "        {children}", "        <button onClick={onClose}>Close<\/button>", "      <\/div>", "    <\/div>,", "    document.body // renders here in the DOM", "    // but stays in React tree — events bubble to React parent", "  );", "}", "", "// Usage inside a component with overflow:hidden — modal still shows!", "function App() {", "  const [open, setOpen] = useState(false);", "  return (", "    <div style={{ overflow: \"hidden\", height: \"100px\" }}>", "      <button onClick={() => setOpen(true)}>Open Modal<\/button>", "      <Modal isOpen={open} onClose={() => setOpen(false)}>", "        <p>Modal content visible even though parent has overflow:hidden<\/p>", "      <\/Modal>", "    <\/div>", "  );", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The event bubbling behaviour is the tricky part. Clicks inside a portal DO bubble to the React parent (even though the DOM parent is document.body). This is intentional and expected behaviour."]}]}, {"num": "Q63", "title": "Explain controlled vs uncontrolled components in React forms.", "level": "Mid", "blocks": [{"t": "p", "text": "Controlled component: the input's value is controlled by React state. Every keypress triggers onChange, which updates state, which re-renders the input with the new value. React is the \"single source of truth.\""}, {"t": "p", "text": "Uncontrolled component: the DOM manages the input's state internally. You read the value via a ref when needed (e.g. on submit). Less React overhead per keypress."}, {"t": "p", "text": "When to use controlled: when you need to validate, format, or derive other state from the input value as the user types (e.g. showing password strength, filtering a list, disabling a button based on value)."}, {"t": "p", "text": "When to use uncontrolled: simple forms where you only need the value on submit, file inputs (always uncontrolled), integration with non-React libraries that manage their own state."}, {"t": "code", "lang": "js", "lines": ["// Controlled: React owns the value", "function ControlledInput() {", "  const [value, setValue] = useState(\"\");", "  return <input value={value} onChange={e => setValue(e.target.value)} />;", "}", "", "// Uncontrolled: DOM owns the value", "function UncontrolledInput() {", "  const inputRef = useRef(null);", "  const handleSubmit = () => {", "    console.log(inputRef.current.value); // read on demand", "  };", "  return <input ref={inputRef} defaultValue=\"\" />;", "}", "", "// File input — ALWAYS uncontrolled", "function FileInput() {", "  const fileRef = useRef(null);", "  const handleSubmit = () => {", "    const file = fileRef.current.files[0];", "    uploadFile(file);", "  };", "  return <input type=\"file\" ref={fileRef} />;", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["React Hook Form uses uncontrolled inputs under the hood (with refs) for better performance — re-registering inputs without causing re-renders on every keystroke. This is why it is faster than naive controlled form implementations."]}]}, {"num": "Q64", "title": "What is prop drilling and what are the solutions?", "level": "Mid", "blocks": [{"t": "p", "text": "Prop drilling is passing props through multiple intermediate components that do not use them, only to reach a deeply nested component that does."}, {"t": "p", "text": "Problems: tightly coupled components, hard to refactor, intermediate components must know about data they do not use."}, {"t": "p", "text": "Solutions (from lightest to heaviest):"}, {"t": "li", "text": "Component composition: pass the consumer component itself down (children or render props) instead of its data"}, {"t": "li", "text": "Context API: for low-frequency global state (theme, auth) — but re-renders all consumers on change"}, {"t": "li", "text": "Zustand: for client state that many components read/write"}, {"t": "li", "text": "Redux Toolkit: for complex state with many interactions"}, {"t": "li", "text": "Component colocation: sometimes moving state DOWN (closer to where it is used) is better than lifting UP"}, {"t": "code", "lang": "js", "lines": ["// Prop drilling problem", "<App user={user}>", "  <Header user={user}>", "    <NavBar user={user}>", "      <UserAvatar user={user} /> {/* only this needs it */}", "    <\/NavBar>", "  <\/Header>", "<\/App>", "", "// Solution 1: Component composition (pass component, not data)", "function App() {", "  const user = useCurrentUser();", "  return (", "    <Header avatar={<UserAvatar user={user} />}>", "      {/* Header does not know about user */}", "    <\/Header>", "  );", "}", "", "// Solution 2: Context", "const UserContext = createContext(null);", "function UserAvatar() {", "  const user = useContext(UserContext); // no prop drilling", "  return <img src={user.avatar} />;", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Component composition is the most underused solution. Before reaching for Context, ask: can I restructure the component tree to eliminate the middle layers?"]}]}, {"num": "Q65", "title": "How do you implement infinite scroll in React?", "level": "Senior", "blocks": [{"t": "p", "text": "Infinite scroll loads more data when the user scrolls near the bottom of the list. Two common approaches:"}, {"t": "p", "text": "1. Intersection Observer API: observe a sentinel element at the bottom of the list. When it enters the viewport, fetch the next page. Clean, performant, no scroll event listener."}, {"t": "p", "text": "2. TanStack Query useInfiniteQuery: built-in support for paginated/cursor-based fetching with getNextPageParam, fetchNextPage, and hasNextPage."}, {"t": "p", "text": "Considerations: preserve scroll position on back navigation, handle loading and error states per page, implement a debounce or threshold to avoid firing on every pixel of scroll."}, {"t": "code", "lang": "js", "lines": ["import { useEffect, useRef, useCallback } from \"react\";", "import { useInfiniteQuery } from \"@tanstack/react-query\";", "", "function PostList() {", "  const { data, fetchNextPage, hasNextPage, isFetchingNextPage } =", "    useInfiniteQuery({", "      queryKey: [\"posts\"],", "      queryFn: ({ pageParam = 1 }) =>", "        api.get(`/posts?page=${pageParam}&limit=20`),", "      getNextPageParam: (lastPage, pages) =>", "        lastPage.hasMore ? pages.length + 1 : undefined,", "    });", "", "  // Intersection Observer sentinel", "  const sentinelRef = useRef(null);", "  const observer = useRef(null);", "", "  const lastItemRef = useCallback((node) => {", "    if(isFetchingNextPage) return;", "    if(observer.current) observer.current.disconnect();", "    observer.current = new IntersectionObserver((entries) => {", "      if(entries[0].isIntersecting && hasNextPage) fetchNextPage();", "    });", "    if(node) observer.current.observe(node);", "  }, [isFetchingNextPage, hasNextPage, fetchNextPage]);", "", "  return (", "    <ul>", "      {data?.pages.flat().map((post, i, arr) => (", "        <li key={post._id} ref={i === arr.length - 1 ? lastItemRef : null}>", "          {post.title}", "        <\/li>", "      ))}", "      {isFetchingNextPage && <li>Loading more...<\/li>}", "    <\/ul>", "  );", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The callback ref pattern (lastItemRef) is more reliable than a static sentinel element at the bottom — it automatically re-attaches the observer when new items load."]}]}, {"num": "Q66", "title": "What are render props and compound components? When would you still use them today?", "level": "Senior", "blocks": [{"t": "p", "text": "Render props: a component accepts a function prop that it calls with data, letting the caller decide what to render. Solves the problem of sharing stateful logic."}, {"t": "p", "text": "Compound components: a group of components that share implicit state via Context. Think <Select> and <Option> — Option works because Select passes context down."}, {"t": "p", "text": "When to use today: custom hooks have replaced most render prop use cases. But compound components remain the best pattern for flexible, accessible UI components (Accordion, Tabs, Menu, Select) where components need implicit communication without explicit prop threading."}, {"t": "code", "lang": "js", "lines": ["// Compound components pattern", "const TabsContext = createContext(null);", "", "function Tabs({ defaultTab, children }) {", "  const [active, setActive] = useState(defaultTab);", "  return (", "    <TabsContext.Provider value={{ active, setActive }}>", "      <div>{children}<\/div>", "    <\/TabsContext.Provider>", "  );", "}", "", "function Tab({ id, children }) {", "  const { active, setActive } = useContext(TabsContext);", "  return (", "    <button", "      role=\"tab\"", "      aria-selected={active === id}", "      onClick={() => setActive(id)}", "    >", "      {children}", "    <\/button>", "  );", "}", "", "function TabPanel({ id, children }) {", "  const { active } = useContext(TabsContext);", "  return active === id ? <div role=\"tabpanel\">{children}<\/div> : null;", "}", "", "// Usage — flexible, no explicit state management in consumer", "<Tabs defaultTab=\"overview\">", "  <Tab id=\"overview\">Overview<\/Tab>", "  <Tab id=\"details\">Details<\/Tab>", "  <TabPanel id=\"overview\"><Overview /><\/TabPanel>", "  <TabPanel id=\"details\"><Details /><\/TabPanel>", "<\/Tabs>"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Shadcn/ui and Radix UI use compound components extensively. Knowing this pattern shows you understand how production UI libraries are built."]}]}, {"num": "Q67", "title": "How does React's state batching work and what changed in React 18?", "level": "Expert", "blocks": [{"t": "p", "text": "State batching: multiple state updates that happen in the same event handler are batched together and trigger a single re-render."}, {"t": "p", "text": "React 17 and earlier: batching only worked inside React event handlers. Updates inside setTimeout, Promise callbacks, and native event listeners caused separate re-renders for each setState call."}, {"t": "p", "text": "React 18: automatic batching for ALL state updates — inside Promises, setTimeout, native event listeners, any async code. This reduces unnecessary re-renders."}, {"t": "p", "text": "Opt out: use ReactDOM.flushSync if you need a synchronous re-render (rare — usually for animations or DOM measurements that must happen before the next update)."}, {"t": "code", "lang": "js", "lines": ["// React 17: 2 renders (outside React events)", "setTimeout(() => {", "  setCount(c => c + 1); // render 1", "  setFlag(f => !f);    // render 2", "}, 1000);", "", "// React 18: 1 render (automatic batching everywhere)", "setTimeout(() => {", "  setCount(c => c + 1); // batched", "  setFlag(f => !f);    // batched — single re-render", "}, 1000);", "", "// Promise callbacks are also batched in React 18", "fetch(\"/api/data\").then(() => {", "  setData(d);   // batched", "  setLoading(false); // batched — single re-render", "}); // In React 17 this caused 2 re-renders", "", "// Opt out when needed (rare)", "import { flushSync } from \"react-dom\";", "flushSync(() => setCount(c => c + 1)); // forces immediate render", "doSomethingThatRequiresUpdatedDOM();"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Automatic batching is one of the most impactful React 18 performance improvements. Mentioning it shows you keep up with React releases."]}]}]}, {"id": "v2s3", "title": "Node.js — Advanced Runtime & Patterns", "sub": "Event loop phases, clustering, process management", "qs": [{"num": "Q68", "title": "What is the difference between process.nextTick and setImmediate?", "level": "Mid", "blocks": [{"t": "p", "text": "Both schedule a callback to run asynchronously, but at different points in the event loop:"}, {"t": "p", "text": "process.nextTick: runs IMMEDIATELY after the current operation completes, before the event loop continues to the next phase. Higher priority than any I/O or timer callbacks. Can starve I/O if overused."}, {"t": "p", "text": "setImmediate: runs at the beginning of the CHECK phase of the event loop — after I/O callbacks, before timers in the next iteration."}, {"t": "p", "text": "queueMicrotask: schedules a microtask — runs after process.nextTick, before setImmediate, similar to Promise.resolve().then()."}, {"t": "code", "lang": "js", "lines": ["console.log(\"start\");", "", "process.nextTick(() => console.log(\"nextTick\"));", "setImmediate(() => console.log(\"setImmediate\"));", "Promise.resolve().then(() => console.log(\"Promise\"));", "setTimeout(() => console.log(\"setTimeout 0\"), 0);", "", "console.log(\"end\");", "", "// Output order:", "// start", "// end", "// nextTick      ← before anything async", "// Promise       ← microtask queue", "// setTimeout 0  ← macrotask (or setImmediate depending on CPU timing)", "// setImmediate  ← check phase"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The relative order of setTimeout(0) and setImmediate is non-deterministic in the main module (depends on CPU timing). But inside an I/O callback, setImmediate always runs before setTimeout(0)."]}]}, {"num": "Q69", "title": "What is the Node.js cluster module and how does it differ from worker_threads?", "level": "Senior", "blocks": [{"t": "p", "text": "Both enable multi-core utilisation, but serve different purposes:"}, {"t": "p", "text": "cluster: spawns multiple Node.js processes (each is a full process with its own V8 instance, memory, and event loop). The master process listens on a port and distributes connections to worker processes via round-robin. Each worker is a separate OS process. Communication via IPC (inter-process communication) messages."}, {"t": "p", "text": "worker_threads: spawns threads within a single Node.js process. Threads share memory (via SharedArrayBuffer) and have lower overhead than full processes. Better for CPU-bound tasks that need shared memory."}, {"t": "p", "text": "cluster is for: scaling web servers across all CPU cores. PM2 uses cluster mode under the hood."}, {"t": "p", "text": "worker_threads is for: CPU-intensive computations (image processing, cryptography) that would block the event loop if run on the main thread."}, {"t": "code", "lang": "js", "lines": ["// Cluster: multiple processes, each handling HTTP", "const cluster = require(\"cluster\");", "const os = require(\"os\");", "", "if(cluster.isPrimary) {", "  os.cpus().forEach(() => cluster.fork()); // one worker per CPU core", "  cluster.on(\"exit\", (worker) => {", "    console.log(`Worker ${worker.process.pid} died, forking new one`);", "    cluster.fork(); // auto-restart", "  });", "} else {", "  // Each worker runs Express", "  const app = require(\"./app\");", "  app.listen(3000);", "  console.log(`Worker ${process.pid} started`);", "}", "", "// Worker threads: shared memory", "const { Worker, isMainThread, workerData, parentPort } = require(\"worker_threads\");", "if(!isMainThread) {", "  const result = heavyComputation(workerData);", "  parentPort.postMessage(result);", "}"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["PM2 with exec_mode: \"cluster\" is the production-ready way to use the cluster module. You do not typically write cluster code directly in production applications."]}]}, {"num": "Q70", "title": "How do you handle file uploads efficiently in a Node.js API?", "level": "Senior", "blocks": [{"t": "p", "text": "Two approaches depending on file destination:"}, {"t": "p", "text": "1. Stream directly to cloud storage (preferred): use multer with memoryStorage, then pipe/upload to S3 using presigned URLs or the AWS SDK streaming upload. The file never touches your server's disk."}, {"t": "p", "text": "2. Disk-first with multer diskStorage: good for temporary processing (image resizing, format conversion) before upload to S3."}, {"t": "p", "text": "Best practice for large files: use presigned S3 URLs — the client uploads directly to S3, bypassing your server entirely. Your server only generates the signed URL and receives the S3 key after upload completes."}, {"t": "p", "text": "Security: always validate file type by MIME type (not just extension — attackers rename files), enforce size limits, scan for malware in sensitive applications."}, {"t": "code", "lang": "js", "lines": ["// Multer with memory storage + S3 stream upload", "const multer = require(\"multer\");", "const { S3Client, PutObjectCommand } = require(\"@aws-sdk/client-s3\");", "", "const upload = multer({", "  storage: multer.memoryStorage(),", "  limits: { fileSize: 10 * 1024 * 1024 }, // 10MB", "  fileFilter: (req, file, cb) => {", "    const allowed = [\"image/jpeg\",\"image/png\",\"image/webp\",\"application/pdf\"];", "    cb(null, allowed.includes(file.mimetype));", "  },", "});", "", "router.post(\"/upload\", protect, upload.single(\"file\"), async (req, res) => {", "  const { randomUUID } = require(\"crypto\");", "  const key = `uploads/${req.user._id}/${randomUUID()}.${req.file.originalname.split(\".\").pop()}`;", "", "  await s3.send(new PutObjectCommand({", "    Bucket: process.env.S3_BUCKET,", "    Key: key,", "    Body: req.file.buffer, // from memory storage", "    ContentType: req.file.mimetype,", "  }));", "", "  const url = `https://${process.env.S3_BUCKET}.s3.amazonaws.com/${key}`;", "  res.json({ url, key });", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["For production: always use presigned URLs for large files (avoids memory pressure on your server). Multer is for small files or files that need server-side processing before storage."]}]}]}, {"id": "v2s4", "title": "MongoDB — Advanced Schema Design & Operations", "sub": "Schema patterns, data modeling, performance", "qs": [{"num": "Q71", "title": "What is the N+1 problem in MongoDB and how do you solve it?", "level": "Mid", "blocks": [{"t": "p", "text": "N+1 problem: fetching N documents then making N additional queries to fetch related data — N+1 total queries."}, {"t": "p", "text": "Example: fetch 20 posts (1 query), then for each post fetch the author name (20 queries) = 21 total queries."}, {"t": "p", "text": "Solutions:"}, {"t": "p", "text": "1. populate() in Mongoose: one query with a JOIN-like operation under the hood (actually two queries but handled in one operation)"}, {"t": "p", "text": "2. $lookup in aggregation pipeline: true server-side join, single pipeline execution"}, {"t": "p", "text": "3. Embed the data: if author name rarely changes and is always needed with the post, store it directly in the post document (denormalisation trade-off)"}, {"t": "p", "text": "4. DataLoader (in GraphQL): batches all individual loads into a single query"}, {"t": "code", "lang": "js", "lines": ["// N+1 problem", "const posts = await Post.find().limit(20);", "for(const post of posts) {", "  // 20 separate queries — N+1!", "  post.authorName = (await User.findById(post.author)).name;", "}", "", "// Solution 1: populate (2 queries total)", "const posts = await Post.find().limit(20).populate(\"author\",\"name avatar\");", "", "// Solution 2: $lookup aggregation (1 pipeline)", "const posts = await Post.aggregate([", "  { $limit: 20 },", "  { $lookup: {", "      from: \"users\",", "      localField: \"author\",", "      foreignField: \"_id\",", "      as: \"authorData\",", "      pipeline: [{ $project: { name: 1, avatar: 1 } }],", "  }},", "  { $addFields: { author: { $arrayElemAt: [\"$authorData\", 0] } } },", "  { $project: { authorData: 0 } },", "]);"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["$lookup with a sub-pipeline (available since MongoDB 3.6; since 5.0 it can also be combined with localField/foreignField) is the most powerful option — you can filter and project the joined documents without fetching extra fields."]}]}, {"num": "Q72", "title": "Explain the schema design trade-off between embedding and referencing in MongoDB.", "level": "Mid", "blocks": [{"t": "p", "text": "Embedding (denormalisation): store related data inside the same document. One read gets all data. Write is complex if embedded data is large or shared."}, {"t": "p", "text": "Referencing (normalisation): store ObjectId references, use populate/$lookup to join. Flexible for shared or large data."}, {"t": "p", "text": "Decision framework:"}, {"t": "li", "text": "Embed when: data is always accessed together, data is owned by the parent (1-to-1 or 1-to-few), data is rarely updated independently, embedded array will not grow unboundedly"}, {"t": "li", "text": "Reference when: data is shared across documents, data can grow without bound (comments on a viral post), data is accessed independently, you need to query the embedded data directly"}, {"t": "code", "lang": "js", "lines": ["// EMBED: address belongs to one user, always accessed together", "const userSchema = new Schema({", "  name: String,", "  email: String,", "  address: {     // embedded — no separate collection", "    street: String,", "    city: String,", "    country: String,", "  },", "});", "", "// REFERENCE: posts are shared/independent, can be many", "const userSchema = new Schema({", "  name: String,", "  // DO NOT embed posts array — it can grow unboundedly!", "});", "const postSchema = new Schema({", "  title: String,", "  author: { type: Schema.Types.ObjectId, ref: \"User\" }, // reference", "});", "", "// Hybrid: embed summary, reference full", "const userSchema = new Schema({", "  name: String,", "  // Embed last 5 posts for quick profile display", "  recentPosts: [{ title: String, slug: String, createdAt: Date }],", "  // Reference for full post access", "  // posts fetched separately when needed", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The unbounded array anti-pattern is the most common MongoDB schema mistake: putting all user posts inside a posts: [] array on the User document. It breaks MongoDB's 16MB document limit and causes slow updates."]}]}, {"num": "Q73", "title": "How do you handle MongoDB replica sets and what is eventual consistency?", "level": "Senior", "blocks": [{"t": "p", "text": "A replica set is a group of MongoDB instances that maintain the same data — one primary and one or more secondaries."}, {"t": "p", "text": "Write path: all writes go to the primary. The primary replicates changes to secondaries via the oplog (operation log). Secondaries are eventually consistent — they may lag behind the primary by milliseconds."}, {"t": "p", "text": "Read preference: by default reads go to the primary (strong consistency). You can set readPreference to secondary for read-heavy workloads, accepting eventual consistency."}, {"t": "p", "text": "Write concern: how many replica set members must acknowledge a write before MongoDB reports success. w:1 (primary only, fast, risk of data loss on crash), w:\"majority\" (most members, slower, durable)."}, {"t": "p", "text": "Change streams require a replica set — they listen to the oplog."}, {"t": "p", "text": "Atlas: all Atlas clusters are replica sets, even M0 (free tier with only one data-bearing node)."}, {"t": "code", "lang": "js", "lines": ["// Read from secondary (eventual consistency — may lag)", "await Post.find({ status: \"published\" })", "  .read(\"secondary\")  // may return slightly stale data", "  .limit(100);", "", "// Strong consistency (default — always reads primary)", "await Post.findById(id); // reads from primary", "", "// Write concern — wait for majority acknowledgment", "await Order.create(orderData, {", "  writeConcern: { w: \"majority\", j: true }, // journaled + majority", "});", "// Slower but durable — survives primary crash", "", "// Connect with write concern set at connection level", "mongoose.connect(MONGO_URI, {", "  replicaSet: \"rs0\",", "  w: \"majority\",", "  readPreference: \"primaryPreferred\",", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["For financial data: always use w:\"majority\" and j:true (journaled). For analytics reads: secondary is fine. This distinction shows production-grade MongoDB knowledge."]}]}, {"num": "Q74", "title": "What is the MongoDB aggregation pipeline's $facet stage and how would you use it for a product search page?", "level": "Expert", "blocks": [{"t": "p", "text": "$facet runs multiple independent aggregation sub-pipelines on the same input documents simultaneously, returning all results in a single query."}, {"t": "p", "text": "This is exactly what e-commerce search pages need: run the paginated results, total count, category counts, and price histogram all in one database round trip."}, {"t": "p", "text": "Performance: $facet after $match is efficient — documents are filtered once, then multiple pipelines fan out from the filtered set. It does NOT re-scan the collection for each facet."}, {"t": "code", "lang": "js", "lines": ["const searchResults = await Product.aggregate([", "  // Step 1: filter (runs once, shared by all facets)", "  { $match: { active: true, category: req.query.category } },", "", "  { $facet: {", "    // Facet 1: paginated results", "    results: [", "      { $sort: { createdAt: -1 } },", "      { $skip: (page - 1) * limit },", "      { $limit: limit },", "      { $project: { name:1, price:1, image:1, rating:1 } },", "    ],", "    // Facet 2: total count for pagination", "    totalCount: [{ $count: \"count\" }],", "    // Facet 3: price buckets for histogram", "    priceBuckets: [{ $bucket: {", "      groupBy: \"$price\",", "      boundaries: [0, 25, 50, 100, 250, 500, 1000],", "      default: \"1000+\",", "      output: { count: { $sum: 1 } },", "    }}],", "    // Facet 4: counts per brand", "    brandFacets: [", "      { $group: { _id: \"$brand\", count: { $sum: 1 } } },", "      { $sort: { count: -1 } },", "      { $limit: 20 },", "    ],", "  }},", "]);", "const { results, totalCount, priceBuckets, brandFacets } = searchResults[0];"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Without $facet, this would require 4 separate database queries. Mention this performance win explicitly — it shows you think about database round trips, not just query correctness."]}]}]}, {"id": "v2s5", "title": "Express — Advanced Patterns", "sub": "Validation, error handling, rate limiting, architecture", "qs": [{"num": "Q75", "title": "How do you implement request validation in Express? Compare express-validator vs Zod.", "level": "Mid", "blocks": [{"t": "p", "text": "express-validator: middleware-based, uses a chain of validators per field, reads errors with validationResult(req). Requires separate middleware per route. Verbose but familiar."}, {"t": "p", "text": "Zod: schema-first, TypeScript-native, infers types from schemas (one source of truth for type AND validation). More concise, better DX, works anywhere (not Express-specific)."}, {"t": "p", "text": "Best practice: use Zod with a generic validateBody middleware. Define schemas once, reuse them in tests. The TypeScript type is inferred automatically — no duplication."}, {"t": "code", "lang": "js", "lines": ["// Zod approach (recommended)", "const { z } = require(\"zod\");", "", "const CreatePostSchema = z.object({", "  title: z.string().min(3).max(200).trim(),", "  content: z.string().min(20),", "  tags: z.array(z.string().toLowerCase()).max(5).optional().default([]),", "  published: z.boolean().default(false),", "});", "", "// Generic middleware (reusable for any schema)", "const validateBody = (schema) => (req, res, next) => {", "  const result = schema.safeParse(req.body);", "  if(!result.success) {", "    return res.status(422).json({", "      message: \"Validation failed\",", "      errors: result.error.flatten().fieldErrors,", "    });", "  }", "  req.body = result.data; // replace with parsed+coerced data", "  next();", "};", "", "// Usage", "router.post(\"/posts\", protect, validateBody(CreatePostSchema), create);", "", "// TypeScript: infer type from schema", "type CreatePostDTO = z.infer<typeof CreatePostSchema>;"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention that req.body = result.data replaces the raw body with parsed and coerced values (e.g. string \"true\" → boolean true). This is a Zod superpower that express-validator does not have."]}]}, {"num": "Q76", "title": "How do you implement a proper error handling strategy in Express?", "level": "Senior", "blocks": [{"t": "p", "text": "A robust error strategy has three layers:"}, {"t": "p", "text": "1. Operational errors (expected): invalid input, resource not found, unauthorised. These have a statusCode and are safe to send to the client."}, {"t": "p", "text": "2. Programming errors (unexpected): bugs, null references, unhandled rejections. Should log full stack trace, send generic 500 to client, alert on-call."}, {"t": "p", "text": "3. Async error propagation: all async route handlers wrapped in try/catch that calls next(err). Or use a wrapper function (asyncHandler) that auto-calls next on rejection."}, {"t": "li", "text": "Express 5 update: rejected promises from async handlers are now forwarded to error middleware automatically, so try/catch(next) wrappers and express-async-handler are only needed on Express 4."}, {"t": "p", "text": "Global error handler middleware: 4-parameter function at the end of the middleware stack. Distinguishes operational from programming errors. Sends sanitised responses."}, {"t": "code", "lang": "js", "lines": ["// Custom operational error class", "class AppError extends Error {", "  constructor(message, statusCode) {", "    super(message);", "    this.statusCode = statusCode;", "    this.isOperational = true;", "    Error.captureStackTrace(this, this.constructor);", "  }", "}", "", "// asyncHandler wrapper — eliminates try/catch boilerplate", "const asyncHandler = (fn) => (req, res, next) =>", "  Promise.resolve(fn(req, res, next)).catch(next);", "", "// Route using asyncHandler", "router.get(\"/:id\", asyncHandler(async (req, res) => {", "  const post = await Post.findById(req.params.id);", "  if(!post) throw new AppError(\"Post not found\", 404);", "  res.json(post);", "}));", "", "// Global error handler (MUST be last middleware)", "app.use((err, req, res, next) => {", "  const status = err.statusCode || 500;", "  const message = err.isOperational ? err.message : \"Something went wrong\";", "  logger.error({ err, requestId: req.id }, \"Error caught\");", "  if(process.env.NODE_ENV !== \"production\") console.error(err);", "  res.status(status).json({ success: false, message });", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The asyncHandler pattern eliminates repetitive try/catch in every route handler. In Express 5 (next major version), async errors are caught automatically — no asyncHandler needed. Mention this."]}]}]}, {"id": "v2s6", "title": "GraphQL", "sub": "Schema design, resolvers, subscriptions, performance", "qs": [{"num": "Q77", "title": "What are the advantages of GraphQL over REST?", "level": "Mid", "blocks": [{"t": "p", "text": "GraphQL advantages:"}, {"t": "li", "text": "No over-fetching: client requests exactly the fields it needs — a mobile app can request fewer fields than a desktop app from the same endpoint"}, {"t": "li", "text": "No under-fetching: get related data in one request (user + their posts + post comments) — no multiple REST round trips"}, {"t": "li", "text": "Strongly typed schema: the schema is a contract between client and server, auto-generates documentation and TypeScript types"}, {"t": "li", "text": "Single endpoint: /graphql handles all operations"}, {"t": "li", "text": "Introspection: clients can query the schema itself to discover available operations"}, {"t": "li", "text": "Real-time with subscriptions: built-in WebSocket-based subscription type"}, {"t": "p", "text": "REST advantages: simpler caching (HTTP caching works out of the box), easier to secure (per-endpoint auth, rate limiting), no N+1 if designed correctly, lower overhead for simple APIs, more familiar to most developers."}, {"t": "code", "lang": "js", "lines": ["// REST: multiple round trips", "// 1. GET /users/123", "// 2. GET /users/123/posts", "// 3. GET /posts/456/comments", "", "// GraphQL: single request", "// POST /graphql", "// {", "//   user(id: \"123\") {", "//     name", "//     posts {", "//       title", "//       comments { content author { name } }", "//     }", "//   }", "// }"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["\"When would you choose REST over GraphQL?\" — For simple CRUD APIs with few client types, REST is simpler and easier to cache. GraphQL shines when you have multiple client types (mobile, web, TV app) with different data needs."]}]}, {"num": "Q78", "title": "What are GraphQL subscriptions and how do you implement them?", "level": "Senior", "blocks": [{"t": "p", "text": "GraphQL subscriptions provide real-time updates via WebSockets. Clients subscribe to events; the server pushes updates when those events occur."}, {"t": "p", "text": "Apollo Server uses the graphql-ws library for WebSocket subscriptions. The PubSub mechanism bridges your server events to active subscriptions."}, {"t": "p", "text": "Use cases: real-time chat, live notifications, collaborative editing, live dashboards."}, {"t": "p", "text": "Limitations: subscriptions are stateful (WebSocket connections are expensive at scale), scale across multiple server instances requires a shared pub/sub (Redis, RabbitMQ)."}, {"t": "code", "lang": "js", "lines": ["const { PubSub } = require(\"graphql-subscriptions\");", "const pubsub = new PubSub();", "", "const typeDefs = gql`", "  type Subscription {", "    messageAdded(roomId: ID!): Message!", "    userTyping(roomId: ID!): TypingEvent!", "  }", "`;", "", "const resolvers = {", "  Subscription: {", "    messageAdded: {", "      subscribe: (_, { roomId }) =>", "        pubsub.asyncIterator(`MESSAGE_ADDED_${roomId}`),", "      resolve: (payload) => payload.message,", "    },", "  },", "  Mutation: {", "    sendMessage: async (_, { roomId, text }, { user }) => {", "      const message = await Message.create({ roomId, text, author: user._id });", "      // Publish to all subscribers of this room", "      pubsub.publish(`MESSAGE_ADDED_${roomId}`, { message });", "      return message;", "    },", "  },", "};", "", "// For production scale: use graphql-redis-subscriptions", "// PubSub backed by Redis — works across multiple server instances"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The built-in PubSub is in-memory and does not scale across multiple server instances. For production, use graphql-redis-subscriptions. This is the key scaling concern for GraphQL subscriptions."]}]}]}, {"id": "v2s7", "title": "Security — Advanced Attack Vectors", "sub": "SQL injection, clickjacking, timing attacks, JWT pitfalls", "qs": [{"num": "Q79", "title": "What are common JWT security pitfalls and how do you avoid them?", "level": "Mid", "blocks": [{"t": "p", "text": "JWT pitfalls:"}, {"t": "p", "text": "1. Storing in localStorage: accessible to JavaScript — stolen by XSS. Use httpOnly cookies instead."}, {"t": "p", "text": "2. No expiration: tokens that never expire are valid forever if stolen. Always set expiresIn."}, {"t": "p", "text": "3. Weak secret: a short or guessable secret can be brute-forced offline if a token is leaked. Use a minimum 256-bit cryptographically random secret."}, {"t": "p", "text": "4. Algorithm confusion: the \"none\" algorithm allows unsigned tokens — always validate the algorithm on the server, never trust the header's alg field. Use jsonwebtoken with explicit algorithms option."}, {"t": "p", "text": "5. Sensitive data in payload: the payload is base64 encoded, NOT encrypted. Anyone with the token can decode it. Never store passwords, full credit card numbers, or other secrets in the payload."}, {"t": "p", "text": "6. No token revocation: JWT is stateless — you cannot invalidate a token before expiry. Solutions: short expiry + refresh token rotation, token blocklist in Redis."}, {"t": "code", "lang": "js", "lines": ["// WRONG: trust alg from header", "jwt.verify(token, secret, { algorithms: [\"HS256\"] }); // vulnerable to algorithm confusion", "", "// CORRECT: enforce algorithm", "jwt.verify(token, secret, { algorithms: [\"HS256\"] });", "", "// Refresh token rotation", "router.post(\"/auth/refresh\", async (req, res) => {", "  const { refreshToken } = req.cookies;", "  // Verify refresh token is valid and not revoked", "  const payload = jwt.verify(refreshToken, process.env.REFRESH_SECRET, { algorithms: [\"HS256\"] });", "  const stored = await RefreshToken.findOne({ token: refreshToken });", "  if(!stored) return res.status(401).json({ message: \"Refresh token revoked\" });", "", "  // Rotate: invalidate old, issue new", "  await RefreshToken.deleteOne({ token: refreshToken });", "  const newRefresh = jwt.sign({ id: payload.id }, REFRESH_SECRET, { expiresIn: \"7d\" });", "  const newAccess = jwt.sign({ id: payload.id }, ACCESS_SECRET, { expiresIn: \"15m\" });", "  await RefreshToken.create({ token: newRefresh, userId: payload.id });", "  res.cookie(\"refreshToken\", newRefresh, { httpOnly: true, secure: true });", "  res.json({ accessToken: newAccess });", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Algorithm confusion (CVE class) is the most serious JWT vulnerability. Always specify algorithms in jwt.verify. Some older libraries accepted { alg: \"none\" } which means no signature validation."]}]}, {"num": "Q80", "title": "Explain SQL/command injection. Does it apply to MongoDB?", "level": "Senior", "blocks": [{"t": "p", "text": "Classic SQL injection: user input inserted directly into a SQL string lets attackers execute arbitrary SQL. \"SELECT * FROM users WHERE email = '\" + email + \"'\" — if email is \"' OR 1=1 --\", all users are returned."}, {"t": "p", "text": "In MongoDB: traditional SQL injection does not apply (no SQL strings). But operator injection does — see NoSQL injection. Additionally, if you use $where with JavaScript expressions or mapReduce with user-supplied code, arbitrary JavaScript execution is possible."}, {"t": "p", "text": "Command injection: if your Node.js code passes user input to exec() or spawn() with shell: true, an attacker can append shell commands. Example: filename \"report.pdf; rm -rf /\" if passed to exec(\"convert \" + filename)."}, {"t": "p", "text": "Prevention: never use exec with user input, use spawn with args array (no shell), use Mongoose strict schemas, validate all inputs with Zod."}, {"t": "code", "lang": "js", "lines": ["// VULNERABLE: command injection", "const { exec } = require(\"child_process\");", "app.get(\"/convert\", (req, res) => {", "  const filename = req.query.file;", "  // If filename = \"x.pdf; rm -rf /\" — catastrophic!", "  exec(`convert ${filename} output.jpg`, callback);", "});", "", "// SAFE: spawn with array args (no shell interpolation)", "const { spawn } = require(\"child_process\");", "app.get(\"/convert\", (req, res) => {", "  const filename = path.basename(req.query.file); // sanitise path", "  // Args as array — never interpreted as shell", "  spawn(\"convert\", [filename, \"output.jpg\"]);", "});", "", "// Also safe: use a Node.js library instead of shell commands", "// sharp(filename).jpeg().toFile(\"output.jpg\") — no shell involved"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["spawn with args array is immune to command injection because the arguments are passed directly to the process, not through a shell that interprets special characters."]}]}]}, {"id": "v2s8", "title": "Testing — Advanced Strategies", "sub": "Mocking, TDD, E2E, visual regression, contract testing", "qs": [{"num": "Q81", "title": "What is Mock Service Worker (MSW) and how does it improve testing?", "level": "Mid", "blocks": [{"t": "p", "text": "MSW intercepts HTTP requests at the network level (using Service Workers in the browser, or a custom Node.js HTTP interceptor in Jest) and returns mock responses. It works without changing any application code."}, {"t": "p", "text": "Advantages over jest.mock():"}, {"t": "li", "text": "Tests run exactly as in production — your fetch/axios/RTK Query code is unchanged"}, {"t": "li", "text": "Mock once, use in tests AND in development (Storybook, demo mode)"}, {"t": "li", "text": "No import mocking — you mock the API contract, not the implementation"}, {"t": "li", "text": "Can be reused as a development mock server"}, {"t": "p", "text": "This gives you more confidence than mocking the fetch function or axios directly, because the entire HTTP layer is exercised."}, {"t": "code", "lang": "js", "lines": ["// src/mocks/handlers.js", "import { http, HttpResponse } from \"msw\";", "", "export const handlers = [", "  http.get(\"/api/posts\", () => {", "    return HttpResponse.json([", "      { _id: \"1\", title: \"Test Post\", author: { name: \"Ahmed\" } },", "    ]);", "  }),", "  http.post(\"/api/posts\", async ({ request }) => {", "    const body = await request.json();", "    return HttpResponse.json({ _id: \"2\", ...body }, { status: 201 });", "  }),", "  http.get(\"/api/posts/:id\", ({ params }) => {", "    if(params.id === \"404\") return new HttpResponse(null, { status: 404 });", "    return HttpResponse.json({ _id: params.id, title: \"A Post\" });", "  }),", "];", "", "// Setup for Jest (Node environment)", "// src/mocks/server.js", "import { setupServer } from \"msw/node\";", "export const server = setupServer(...handlers);", "", "// In jest.setup.js:", "// beforeAll(() => server.listen());", "// afterEach(() => server.resetHandlers());", "// afterAll(() => server.close());"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["MSW is the gold standard for API mocking in React Testing Library tests. It allows you to test the full component interaction with the network layer, giving much higher confidence than jest.mock()."]}]}, {"num": "Q82", "title": "What is Test-Driven Development (TDD) and when does it make sense to use it?", "level": "Senior", "blocks": [{"t": "p", "text": "TDD cycle: Red → Green → Refactor."}, {"t": "p", "text": "Red: write a failing test for the behaviour you want to implement."}, {"t": "p", "text": "Green: write the minimum code to make the test pass."}, {"t": "p", "text": "Refactor: clean up the code while keeping tests passing."}, {"t": "p", "text": "Benefits: tests document the expected behaviour, encourages small focused functions, immediate feedback loop, confidence to refactor."}, {"t": "p", "text": "When TDD is valuable: algorithmic functions (sorting, filtering, data transformations), domain logic (business rules, validation), pure functions with clear inputs/outputs, bug fixes (write a failing test for the bug, then fix it)."}, {"t": "p", "text": "When TDD is harder: UI components (hard to know what to test before building), exploratory code, rapidly changing requirements, integration points with external APIs."}, {"t": "code", "lang": "js", "lines": ["// TDD example: implement a discountPrice function", "", "// Step 1: Write the failing test", "it(\"applies 10% discount to price\", () => {", "  expect(discountPrice(100, 10)).toBe(90);", "});", "it(\"clamps discount at 0\", () => {", "  expect(discountPrice(100, 0)).toBe(100);", "});", "it(\"throws for negative discount\", () => {", "  expect(() => discountPrice(100, -1)).toThrow(\"Discount cannot be negative\");", "});", "", "// Step 2: Write minimum code to pass", "function discountPrice(price, discountPercent) {", "  if(discountPercent < 0) throw new Error(\"Discount cannot be negative\");", "  return price * (1 - discountPercent / 100);", "}", "", "// Step 3: Refactor if needed (extract constants, improve naming, etc.)"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A nuanced answer: \"I use TDD for business logic and pure functions, but I often prototype the UI first and add tests after for complex interactive components.\" This shows maturity over dogmatism."]}]}, {"num": "Q83", "title": "How do you test custom React hooks in isolation?", "level": "Senior", "blocks": [{"t": "p", "text": "Custom hooks can only be called inside React components. To test them in isolation, use renderHook from @testing-library/react, which renders the hook inside a minimal wrapper component."}, {"t": "p", "text": "act(): wrap any state-updating code in act() to ensure React processes all updates before assertions. renderHook's result property reflects the current return value of the hook."}, {"t": "p", "text": "Test the behaviour, not the implementation: test what the hook returns and what effect it has, not internal state variables."}, {"t": "code", "lang": "js", "lines": ["import { renderHook, act } from \"@testing-library/react\";", "import { useCounter } from \"./useCounter\";", "", "describe(\"useCounter\", () => {", "  it(\"initialises with default value\", () => {", "    const { result } = renderHook(() => useCounter());", "    expect(result.current.count).toBe(0);", "  });", "", "  it(\"increments count\", () => {", "    const { result } = renderHook(() => useCounter(10));", "    act(() => { result.current.increment(); });", "    expect(result.current.count).toBe(11);", "  });", "", "  it(\"resets to initial value\", () => {", "    const { result } = renderHook(() => useCounter(5));", "    act(() => { result.current.increment(); result.current.increment(); });", "    expect(result.current.count).toBe(7);", "    act(() => { result.current.reset(); });", "    expect(result.current.count).toBe(5);", "  });", "});", "", "// For hooks that need context (e.g. useAuth inside AuthProvider):", "const wrapper = ({ children }) => <AuthProvider>{children}<\/AuthProvider>;", "const { result } = renderHook(() => useAuth(), { wrapper });"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Forgetting to wrap state updates in act() is the most common renderHook mistake. It causes \"act() warning\" in the console and potentially flaky tests."]}]}]}, {"id": "v2s9", "title": "Performance — Deep Dive", "sub": "Bundle analysis, database tuning, CDN, image optimisation", "qs": [{"num": "Q84", "title": "How do you analyse and reduce JavaScript bundle size?", "level": "Mid", "blocks": [{"t": "p", "text": "Bundle analysis tools: Webpack Bundle Analyzer (webpack-bundle-analyzer), Vite plugin visualizer (rollup-plugin-visualizer). They show which packages take the most space."}, {"t": "p", "text": "Common findings and fixes:"}, {"t": "li", "text": "moment.js: 300KB — replace with date-fns (pick-what-you-need) or dayjs (2KB)"}, {"t": "li", "text": "lodash (full): 70KB — use lodash-es with tree shaking, or replace specific functions with native equivalents"}, {"t": "li", "text": "Large icon libraries: import only the icons you use, not the entire library"}, {"t": "li", "text": "Duplicate packages: two versions of the same library bundled — fix by aligning peer dependencies"}, {"t": "p", "text": "Code splitting strategies: route-level splitting (each page = separate bundle), vendor chunk (stable libraries cached separately), dynamic import of heavy features (rich text editor, chart library) on demand"}, {"t": "code", "lang": "js", "lines": ["// Vite bundle visualizer", "// vite.config.js", "import { visualizer } from \"rollup-plugin-visualizer\";", "export default { plugins: [visualizer({ open: true })] };", "", "// Tree-shakeable date library (instead of moment.js)", "import { format, parseISO, addDays } from \"date-fns\"; // ~10KB for these 3", "// vs import moment from \"moment\"; // ~300KB", "", "// Dynamic import for heavy component", "const RichTextEditor = lazy(() => import(\"./RichTextEditor\"));", "// Bundle is downloaded only when the editor is first rendered", "", "// Named export for tree shaking", "import { debounce } from \"lodash-es\"; // tree-shakeable", "// vs", "import _ from \"lodash\"; // entire 70KB lodash bundled", "", "// Check bundle size in CI", "// bundlesize in package.json:", "// \"bundlesize\": [{ \"path\": \"dist/*.js\", \"maxSize\": \"200kb\" }]"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention that tree shaking only works with ES modules (import/export), not CommonJS (require). This is why lodash-es exists alongside lodash."]}]}, {"num": "Q85", "title": "What is edge computing and how does Next.js use it?", "level": "Senior", "blocks": [{"t": "p", "text": "Edge computing runs code geographically close to users — at CDN nodes (Points of Presence) around the world, not in a centralised data centre. Lower latency because the server is physically closer."}, {"t": "p", "text": "Vercel Edge Network / Cloudflare Workers: run JavaScript at the edge in a lightweight V8 runtime (not full Node.js). No access to Node.js APIs (fs, net, crypto)."}, {"t": "p", "text": "Next.js edge features:"}, {"t": "li", "text": "Middleware (edge runtime by default): runs at the edge before routing — auth redirects, A/B testing, geolocation"}, {"t": "li", "text": "Edge API routes / Route Handlers: export const runtime = \"edge\" — ultra-low latency for simple handlers"}, {"t": "li", "text": "ISR: pages are cached and served from edge CDN nodes globally"}, {"t": "p", "text": "Trade-offs: no Node.js APIs (no Mongoose, no fs), limited execution time, limited memory. Use for: auth checks, redirects, request transformation. Not for: database queries, heavy processing."}, {"t": "code", "lang": "js", "lines": ["// Edge API Route (Next.js App Router)", "// app/api/hello/route.ts", "export const runtime = \"edge\"; // deploy to edge network", "", "export async function GET(request) {", "  const { searchParams } = new URL(request.url);", "  const name = searchParams.get(\"name\") || \"World\";", "  return new Response(JSON.stringify({ message: `Hello, ${name}!` }), {", "    headers: { \"Content-Type\": \"application/json\" },", "  });", "  // Response in ~10ms from any location globally", "}", "", "// Middleware runs at edge globally", "// Can use jose (edge JWT), but NOT jsonwebtoken (uses Node crypto)", "// Can use fetch (built-in), but NOT node-fetch, axios", "// Can use URLPattern (URL routing), URL, Headers, Request, Response"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A common misconception: \"edge = serverless\". They are different. Serverless (Lambda) runs in a full Node.js environment in a single region. Edge runs in a lightweight runtime in many regions simultaneously."]}]}]}, {"id": "v2s10", "title": "System Design — Advanced Scenarios", "sub": "Real-world architecture, scaling, trade-offs", "qs": [{"num": "Q86", "title": "Design an authentication system supporting email/password and Google OAuth.", "level": "Senior", "blocks": [{"t": "p", "text": "Architecture:"}, {"t": "li", "text": "Email/password: bcrypt hash passwords, issue JWT access token (15 min) + refresh token (7 days, stored in httpOnly cookie + DB for revocation)"}, {"t": "li", "text": "Google OAuth (OAuth 2.0 Authorization Code flow): redirect to Google → Google returns code → exchange code for access + ID token → verify ID token → find or create user by Google ID/email → issue your own JWT"}, {"t": "p", "text": "Unified user model: one User document regardless of auth method. googleId field for OAuth users, passwordHash field for email users (null for OAuth-only). A user can link both methods."}, {"t": "p", "text": "Security: refresh token rotation (invalidate old on use), absolute refresh token expiry (30 days max), token family tracking (detect refresh token theft via reuse detection)."}, {"t": "code", "lang": "js", "lines": ["// User schema supporting multiple auth methods", "const userSchema = new Schema({", "  email: { type: String, unique: true },", "  name: String,", "  avatar: String,", "  passwordHash: { type: String, select: false }, // null for OAuth users", "  googleId: { type: String, sparse: true, index: true },", "  githubId: { type: String, sparse: true, index: true },", "  role: { type: String, default: \"user\" },", "  emailVerified: { type: Boolean, default: false },", "  refreshTokenFamily: String, // for theft detection", "});", "", "// Google OAuth callback", "router.get(\"/auth/google/callback\",", "  passport.authenticate(\"google\", { session: false }),", "  async (req, res) => {", "    // req.user is the User from DB (created or found)", "    const refreshToken = signRefreshToken(req.user._id);", "    await saveRefreshToken(req.user._id, refreshToken);", "    res.cookie(\"refreshToken\", refreshToken, {", "      httpOnly: true, secure: true, sameSite: \"lax\", path: \"/api/auth/refresh\",", "    });", "    // Never put tokens in the URL (history, logs, Referer leak them).", "    // The SPA lands on /auth/callback and calls /api/auth/refresh; the", "    // HttpOnly cookie is sent automatically and an access token comes back.", "    res.redirect(`${CLIENT_URL}/auth/callback`);", "  }", ");"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention the \"account linking\" problem: what if a user registers with email then tries to Google OAuth with the same email? You should link the accounts (add googleId to existing user) rather than creating a duplicate."]}]}, {"num": "Q87", "title": "Design a multi-tenant SaaS platform with MERN stack.", "level": "Senior", "blocks": [{"t": "p", "text": "Multi-tenancy: multiple organisations (tenants) share the same application instance with isolated data."}, {"t": "p", "text": "Three isolation strategies:"}, {"t": "p", "text": "1. Separate databases per tenant: strongest isolation, expensive, complex connection pooling"}, {"t": "p", "text": "2. Separate collections per tenant: moderate isolation, namespace explosion, harder to query across tenants"}, {"t": "p", "text": "3. Shared collections with tenantId field: simplest, most scalable, requires disciplined query isolation"}, {"t": "p", "text": "For MERN SaaS: shared collections with tenantId is practical. Every model includes a tenantId field. Every query must filter by tenantId."}, {"t": "p", "text": "Security: a middleware attaches tenantId from the JWT. All Mongoose queries automatically include { tenantId } via a plugin or explicit pattern."}, {"t": "code", "lang": "js", "lines": ["// Mongoose plugin: auto-inject tenantId on all queries", "const tenantPlugin = (schema) => {", "  schema.add({ tenantId: { type: String, required: true, index: true } });", "", "  // Auto-filter by tenantId on all find operations", "  schema.pre([\"find\",\"findOne\",\"findOneAndUpdate\",\"count\"], function() {", "    const tenantId = this.getOptions().session?.tenantId || this._conditions.tenantId;", "    if(!tenantId) throw new Error(\"tenantId required for all queries\");", "    this.where({ tenantId });", "  });", "", "  // Auto-set tenantId on create", "  schema.pre(\"save\", function() {", "    if(!this.tenantId) throw new Error(\"tenantId required\");", "  });", "};", "", "// Middleware: attach tenantId from JWT", "const tenantMiddleware = async (req, res, next) => {", "  const decoded = jwt.verify(req.headers.authorization.split(\" \")[1], SECRET);", "  req.user = decoded;", "  req.tenantId = decoded.tenantId; // every JWT includes tenant", "  next();", "};", "", "// Usage: tenantId automatically included in every query", "await Post.find({ status: \"published\" }); // auto-adds { tenantId: req.tenantId }"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Compound indexes: every collection needs { tenantId: 1, ... } as the first field in all compound indexes. Queries without tenantId in the index prefix cause full collection scans."]}]}, {"num": "Q88", "title": "How would you implement a distributed rate limiter that works across multiple server instances?", "level": "Expert", "blocks": [{"t": "p", "text": "A single-server rate limiter (express-rate-limit with memory store) breaks when you run multiple instances behind a load balancer — each instance has its own counter."}, {"t": "p", "text": "Solution: Redis-backed rate limiter. Redis atomic operations (INCR + EXPIRE) ensure counters are shared and accurate across all instances."}, {"t": "p", "text": "Algorithm options:"}, {"t": "li", "text": "Fixed window: count requests in a fixed time window (e.g. 0–60s). Simple but bursts possible at window boundary."}, {"t": "li", "text": "Sliding window log: store timestamps of each request, count those within the last N seconds. Accurate but memory-intensive."}, {"t": "li", "text": "Token bucket: tokens replenish at a fixed rate, each request consumes a token. Allows bursts up to bucket size."}, {"t": "li", "text": "Leaky bucket: requests queued and processed at fixed rate — smooth output regardless of bursty input."}, {"t": "code", "lang": "js", "lines": ["// Redis sliding window rate limiter (Lua script for atomicity)", "const redis = require(\"ioredis\");", "", "async function isRateLimited(key, maxRequests, windowSeconds) {", "  const now = Date.now();", "  const windowStart = now - windowSeconds * 1000;", "", "  // Lua script runs atomically on Redis", "  const script = `", "    local key = KEYS[1]", "    local now = tonumber(ARGV[1])", "    local windowStart = tonumber(ARGV[2])", "    local maxRequests = tonumber(ARGV[3])", "    local windowSeconds = tonumber(ARGV[4])", "    -- Remove timestamps outside the window", "    redis.call(\"ZREMRANGEBYSCORE\", key, \"-inf\", windowStart)", "    -- Count requests in window", "    local count = redis.call(\"ZCARD\", key)", "    if count < maxRequests then", "      redis.call(\"ZADD\", key, now, now)", "      redis.call(\"EXPIRE\", key, windowSeconds)", "      return 0 -- not limited", "    end", "    return 1 -- rate limited", "  `;", "", "  const result = await redis.eval(script, 1, key, now, windowStart, maxRequests, windowSeconds);", "  return result === 1;", "}", "", "// Express middleware", "const rateLimiter = (maxReq, windowSec) => async (req, res, next) => {", "  const key = `rate:${req.ip}:${req.path}`;", "  if(await isRateLimited(key, maxReq, windowSec)) {", "    return res.status(429).json({ message: \"Rate limit exceeded\" });", "  }", "  next();", "};"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The Lua script is critical — it ensures the ZREMRANGEBYSCORE, ZCARD, ZADD operations are atomic. Without atomicity, race conditions between instances produce inaccurate counts."]}]}]}, {"id": "v2s11", "title": "DevOps — Advanced Infrastructure", "sub": "Kubernetes basics, observability, cost optimisation", "qs": [{"num": "Q89", "title": "What is Kubernetes and when would a MERN application need it?", "level": "Senior", "blocks": [{"t": "p", "text": "Kubernetes (K8s) is an open-source container orchestration system. It automates deployment, scaling, load balancing, health checking, and rolling updates of containerised applications."}, {"t": "p", "text": "Core concepts: Pod (smallest deployable unit, one or more containers), Deployment (desired state — 3 replicas of my API pod), Service (stable network endpoint to reach pods), Ingress (HTTP routing from outside the cluster), ConfigMap (configuration), Secret (sensitive config)."}, {"t": "p", "text": "When MERN needs Kubernetes: you have multiple services (API, worker, Socket.io server), you need autoscaling (scale up during traffic spikes, scale down at night), you need zero-downtime rolling deploys, or you have strict SLA requirements."}, {"t": "p", "text": "When Kubernetes is overkill: single MERN application, team smaller than 10, early-stage startup (Render, Fly.io, or ECS is sufficient). Do not add Kubernetes complexity before you need it."}, {"t": "code", "lang": "yaml", "lines": ["# Kubernetes Deployment for Express API", "# k8s/deployment.yaml", "apiVersion: apps/v1", "kind: Deployment", "metadata:", "  name: api", "spec:", "  replicas: 3", "  selector:", "    matchLabels:", "      app: api", "  template:", "    metadata:", "      labels:", "        app: api", "    spec:", "      containers:", "      - name: api", "        image: myregistry/api:1.4.2   # pin a version or digest — never :latest", "        ports:", "        - containerPort: 3000", "        env:", "        - name: MONGO_URI", "          valueFrom:", "            secretKeyRef:", "              name: app-secrets", "              key: mongo-uri", "        resources:", "          requests: { cpu: \"100m\", memory: \"128Mi\" }", "          limits:   { cpu: \"500m\", memory: \"512Mi\" }", "        readinessProbe:", "          httpGet: { path: /health, port: 3000 }", "          initialDelaySeconds: 10"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["\"Should every MERN app use Kubernetes?\" — Absolutely not. Most startups should start with Render or Railway and only move to Kubernetes when they have a specific scaling or operational need that simpler platforms cannot solve."]}]}, {"num": "Q90", "title": "What is observability and how do you implement it for a MERN application?", "level": "Senior", "blocks": [{"t": "p", "text": "Observability is the ability to understand the internal state of a system from its external outputs. The three pillars are:"}, {"t": "p", "text": "Logs: structured records of events that happened (what). Use Pino with JSON output, ship to a log aggregator (Datadog, Loki, CloudWatch)."}, {"t": "p", "text": "Metrics: numerical measurements over time (how many, how long). Expose /metrics endpoint in Prometheus format, visualise in Grafana. Track: request rate, error rate, response time (p50/p95/p99), memory usage."}, {"t": "p", "text": "Traces: request spans across services (where time is spent). Use OpenTelemetry to instrument Express and MongoDB, ship to Jaeger or Datadog APM. Each request gets a trace ID that links all logs and spans."}, {"t": "p", "text": "The correlation ID pattern: generate a UUID per request, include it in all logs and responses — when a user reports an issue, find all logs in seconds."}, {"t": "code", "lang": "js", "lines": ["// OpenTelemetry instrumentation (add before any other imports)", "const { NodeSDK } = require(\"@opentelemetry/sdk-node\");", "const { HttpInstrumentation } = require(\"@opentelemetry/instrumentation-http\");", "const { ExpressInstrumentation } = require(\"@opentelemetry/instrumentation-express\");", "const { MongoDBInstrumentation } = require(\"@opentelemetry/instrumentation-mongodb\");", "", "const sdk = new NodeSDK({", "  traceExporter: new OTLPTraceExporter({ url: process.env.OTEL_EXPORTER_URL }),", "  instrumentations: [", "    new HttpInstrumentation(),", "    new ExpressInstrumentation(),", "    new MongoDBInstrumentation(), // traces every DB query", "  ],", "});", "sdk.start();", "", "// Prometheus metrics endpoint", "const client = require(\"prom-client\");", "client.collectDefaultMetrics(); // CPU, memory, event loop lag", "", "const httpDuration = new client.Histogram({", "  name: \"http_request_duration_seconds\",", "  help: \"HTTP request duration\",", "  labelNames: [\"method\", \"route\", \"status\"],", "  buckets: [0.01, 0.05, 0.1, 0.5, 1, 5],", "});", "", "// Middleware: record duration", "app.use((req, res, next) => {", "  const end = httpDuration.startTimer();", "  res.on(\"finish\", () => end({ method: req.method, route: req.route?.path, status: res.statusCode }));", "  next();", "});", "", "app.get(\"/metrics\", async (req, res) => {", "  res.set(\"Content-Type\", client.register.contentType);", "  res.send(await client.register.metrics());", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention the four golden signals (from Google SRE book): Latency (how long requests take), Traffic (how much demand), Errors (error rate), Saturation (how full the system is). These are what you monitor, not just \"CPU and memory\"."]}]}]}, {"id": "v2s12", "title": "Accessibility & Internationalisation", "sub": "WCAG, ARIA, RTL, i18n patterns", "qs": [{"num": "Q91", "title": "What is WCAG and what are the four principles of web accessibility?", "level": "Mid", "blocks": [{"t": "p", "text": "WCAG (Web Content Accessibility Guidelines) is the international standard for web accessibility, published by the W3C."}, {"t": "p", "text": "The four POUR principles:"}, {"t": "li", "text": "Perceivable: all information must be presentable to users in ways they can perceive — images have alt text, videos have captions, sufficient colour contrast (minimum 4.5:1 for text)"}, {"t": "li", "text": "Operable: all functionality must be operable via keyboard alone — no keyboard traps, skip links, logical focus order, sufficient time to complete tasks"}, {"t": "li", "text": "Understandable: content and UI must be understandable — clear language, predictable navigation, error identification and suggestions"}, {"t": "li", "text": "Robust: content must be robust enough to be interpreted by current and future assistive technologies — valid HTML, correct use of ARIA"}, {"t": "p", "text": "WCAG 2.2 AA is the most common legal requirement (ADA, EN 301 549, EAA). Level AAA is aspirational."}, {"t": "code", "lang": "text", "lines": ["// Colour contrast check (minimum 4.5:1 for normal text, 3:1 for large)", "// Use the WebAIM Contrast Checker or axe DevTools extension", "", "// Skip link — first focusable element on the page", "<a href=\"#main-content\" className=\"skip-link\">Skip to main content<\/a>", "<main id=\"main-content\">...<\/main>", "", "// Image alt text", "<img src=\"/chart.png\" alt=\"Bar chart showing monthly revenue: January $10k, February $12k\" />", "// Decorative images get empty alt (screen reader skips)", "<img src=\"/decorative.png\" alt=\"\" role=\"presentation\" />", "", "// Sufficient focus indicator (never remove outline without replacement!)", "/* CSS */", ".button:focus-visible {", "  outline: 2px solid #0277BD;", "  outline-offset: 2px;", "  /* Never: outline: none without a replacement */", "  }", "", "// Test with axe-core in CI", "// npm install -D @axe-core/playwright", "import AxeBuilder from \"@axe-core/playwright\";", "test(\"home page has no a11y violations\", async ({ page }) => {", "  await page.goto(\"/\");", "  const results = await new AxeBuilder({ page }).analyze();", "  expect(results.violations).toEqual([]);", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Legal context: the European Accessibility Act (EAA) requires WCAG 2.1 AA compliance for most digital products from June 2025. This is becoming a compliance requirement, not just a best practice."]}]}]}, {"id": "v2s13", "title": "Payments & Integrations", "sub": "Stripe, webhooks, idempotency, S3 patterns", "qs": [{"num": "Q92", "title": "Why are idempotency keys important in payment APIs?", "level": "Mid", "blocks": [{"t": "p", "text": "An idempotency key is a unique identifier you send with a payment API request. If the same key is sent again (e.g. due to network retry), the payment provider returns the original response without processing the payment twice."}, {"t": "p", "text": "Without idempotency: a network timeout between your server and Stripe could cause you to retry the charge, resulting in a customer being charged twice."}, {"t": "p", "text": "With idempotency: even if you retry 10 times with the same key, the customer is charged once."}, {"t": "p", "text": "Stripe accepts Idempotency-Key header. Use a stable unique value: the orderId, or a hash of the user + amount + timestamp. Store the key with the order so retries use the same key."}, {"t": "code", "lang": "js", "lines": ["const stripe = require(\"stripe\")(process.env.STRIPE_SECRET_KEY);", "", "async function chargeOrder(order) {", "  // Idempotency key: stable identifier for this specific payment attempt", "  const idempotencyKey = `order-${order._id}-v1`;", "", "  try {", "    const paymentIntent = await stripe.paymentIntents.create({", "      amount: Math.round(order.total * 100),", "      currency: \"usd\",", "      customer: order.userId,", "      metadata: { orderId: order._id.toString() },", "    }, {", "      idempotencyKey, // Stripe deduplicates on this key", "    });", "    return paymentIntent;", "  } catch(err) {", "    if(err.code === \"idempotency_key_in_use\") {", "      // Another request with this key is in progress — wait and retry", "      await sleep(1000);", "      return chargeOrder(order);", "    }", "    throw err;", "  }", "}", "", "// Without idempotency key: a retry could charge twice", "// With idempotency key: safe to retry on network error"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Mention that idempotency applies beyond payments: any POST that creates a resource benefits from idempotency keys. Stripe, Twilio, and most payment/communication APIs support them."]}]}]}, {"id": "v2s14", "title": "Real-Time — WebSockets, SSE & Socket.io", "sub": "Scaling, reconnection, rooms, security", "qs": [{"num": "Q93", "title": "What is the difference between WebSockets and Server-Sent Events (SSE)?", "level": "Mid", "blocks": [{"t": "p", "text": "WebSockets: full-duplex (bidirectional), persistent TCP connection. Both server and client can send messages at any time. Requires a protocol upgrade handshake. Use for: chat, gaming, collaborative editing, any bidirectional real-time communication."}, {"t": "p", "text": "SSE (Server-Sent Events): unidirectional — server pushes to client only. Built on plain HTTP. The browser auto-reconnects on disconnect. Much simpler to implement and proxy-compatible."}, {"t": "p", "text": "Use SSE when: only the server needs to push updates (notifications, live scores, progress indicators, stock tickers). Use WebSockets when the client also needs to send messages in real time (chat, gaming, drawing app)."}, {"t": "p", "text": "SSE advantages: automatic reconnection, works through HTTP/2 multiplexing, no special proxy config, simpler implementation, one EventSource per domain limit is not usually an issue."}, {"t": "code", "lang": "js", "lines": ["// SSE — simpler, server-to-client only", "app.get(\"/stream/orders\", protect, (req, res) => {", "  res.setHeader(\"Content-Type\", \"text/event-stream\");", "  res.setHeader(\"Cache-Control\", \"no-cache\");", "  res.flushHeaders();", "", "  const send = (event, data) => {", "    res.write(`event: ${event}\\n`);", "    res.write(`data: ${JSON.stringify(data)}\\n\\n`);", "  };", "", "  const interval = setInterval(() => res.write(\": ping\\n\\n\"), 30000);", "  req.on(\"close\", () => clearInterval(interval));", "", "  send(\"connected\", { timestamp: Date.now() });", "});", "", "// Client EventSource (auto-reconnects)", "const source = new EventSource(\"/stream/orders\", { withCredentials: true });", "source.addEventListener(\"order:new\", (e) => {", "  const order = JSON.parse(e.data);", "  addToOrderList(order);", "});"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["A nuanced answer: \"for the NS analytics dashboard, I used SSE for the initial implementation because only the server pushes updates. I would switch to WebSockets only if we needed client-initiated real-time commands.\""]}]}, {"num": "Q94", "title": "How do you scale Socket.io across multiple server instances?", "level": "Senior", "blocks": [{"t": "p", "text": "Problem: when you have 10 server instances behind a load balancer, a socket connected to instance A cannot receive events emitted on instance B."}, {"t": "p", "text": "Solution: Socket.io Redis adapter. Each instance subscribes to a Redis pub/sub channel. When any instance emits to a room/socket, it publishes to Redis. All other instances receive the message and forward it to their connected sockets."}, {"t": "p", "text": "Architecture: Load balancer (sticky sessions optional with Redis adapter) → Socket.io server instances → Redis pub/sub → all instances forward messages."}, {"t": "p", "text": "Sticky sessions: with the Redis adapter, sticky sessions (same client always goes to same instance) are no longer required for correctness, but can reduce Redis traffic."}, {"t": "code", "lang": "js", "lines": ["const { createServer } = require(\"http\");", "const { Server } = require(\"socket.io\");", "const { createAdapter } = require(\"@socket.io/redis-adapter\");", "const { createClient } = require(\"redis\");", "", "const httpServer = createServer(app);", "const io = new Server(httpServer, {", "  cors: { origin: process.env.CLIENT_URL },", "});", "", "// Redis adapter: messages broadcast to all instances", "const pubClient = createClient({ url: process.env.REDIS_URL });", "const subClient = pubClient.duplicate();", "await Promise.all([pubClient.connect(), subClient.connect()]);", "io.adapter(createAdapter(pubClient, subClient));", "", "// Now works across instances:", "// User on instance A and user on instance B in the same room", "// Both receive messages emitted from any instance", "io.to(\"room:sales-dashboard\").emit(\"order:new\", order);", "", "// Horizontal scaling: add more instances behind load balancer", "// Redis handles cross-instance message delivery automatically"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The Redis adapter is the standard production approach. For very high scale (millions of connections), consider a dedicated Socket.io cluster with sticky sessions and a message queue instead of Redis pub/sub."]}]}]}, {"id": "v2s15", "title": "Live Coding Challenges", "sub": "Common whiteboard & take-home problems with MERN context", "qs": [{"num": "Q95", "title": "Implement a custom useLocalStorage React hook.", "level": "Mid", "blocks": [{"t": "p", "text": "This hook persists state to localStorage and stays in sync with changes."}, {"t": "p", "text": "Requirements: initialise from localStorage if key exists, update localStorage on every state change, handle JSON serialisation errors gracefully, support functional updates (like useState)."}, {"t": "code", "lang": "js", "lines": ["import { useState, useEffect, useCallback } from \"react\";", "", "function useLocalStorage(key, initialValue) {", "  // Lazy initialisation: read from storage only once", "  const [value, setValue] = useState(() => {", "    if(typeof window === \"undefined\") return initialValue;", "    try {", "      const stored = window.localStorage.getItem(key);", "      return stored !== null ? JSON.parse(stored) : initialValue;", "    } catch {", "      return initialValue; // graceful degradation", "    }", "  });", "", "  // Sync to localStorage on every value change", "  useEffect(() => {", "    try {", "      window.localStorage.setItem(key, JSON.stringify(value));", "    } catch {", "      console.warn(`useLocalStorage: failed to save ${key}`);", "    }", "  }, [key, value]);", "", "  // Support functional updates like useState", "  const setStoredValue = useCallback((valOrFn) => {", "    setValue(prev => {", "      const next = valOrFn instanceof Function ? valOrFn(prev) : valOrFn;", "      return next;", "    });", "  }, []);", "", "  // Remove from storage", "  const removeValue = useCallback(() => {", "    window.localStorage.removeItem(key);", "    setValue(initialValue);", "  }, [key, initialValue]);", "", "  return [value, setStoredValue, removeValue];", "}", "", "// Usage", "const [theme, setTheme] = useLocalStorage(\"theme\", \"light\");", "const [cart, setCart] = useLocalStorage(\"cart\", []);", "setCart(prev => [...prev, newItem]); // functional update"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["The \"typeof window === undefined\" check is for Next.js SSR compatibility — localStorage does not exist on the server. This edge case differentiates experienced candidates."]}]}, {"num": "Q96", "title": "Implement a rate-limiter middleware using the token bucket algorithm.", "level": "Senior", "blocks": [{"t": "p", "text": "The token bucket algorithm: a bucket holds tokens (capacity N). Tokens are added at rate R per second. Each request consumes one token. If bucket is empty, reject the request."}, {"t": "p", "text": "Benefits over fixed window: allows controlled bursts (up to N requests at once if tokens accumulated), then enforces the rate limit."}, {"t": "code", "lang": "js", "lines": ["class TokenBucket {", "  constructor(capacity, refillRatePerSecond) {", "    this.capacity = capacity;", "    this.tokens = capacity;", "    this.refillRate = refillRatePerSecond;", "    this.lastRefill = Date.now();", "  }", "", "  refill() {", "    const now = Date.now();", "    const elapsed = (now - this.lastRefill) / 1000; // seconds", "    this.tokens = Math.min(", "      this.capacity,", "      this.tokens + elapsed * this.refillRate", "    );", "    this.lastRefill = now;", "  }", "", "  consume() {", "    this.refill();", "    if(this.tokens >= 1) {", "      this.tokens -= 1;", "      return true; // request allowed", "    }", "    return false; // rate limited", "  }", "}", "", "// In-memory store (use Redis for multi-instance)", "const buckets = new Map();", "", "function tokenBucketMiddleware(capacity = 10, refillRate = 2) {", "  return (req, res, next) => {", "    const key = req.ip;", "    if(!buckets.has(key)) {", "      buckets.set(key, new TokenBucket(capacity, refillRate));", "    }", "    const bucket = buckets.get(key);", "    if(bucket.consume()) {", "      res.setHeader(\"X-RateLimit-Remaining\", Math.floor(bucket.tokens));", "      next();", "    } else {", "      res.status(429).json({", "        message: \"Rate limit exceeded\",", "        retryAfter: Math.ceil(1 / refillRate),", "      });", "    }", "  };", "}", "", "app.use(tokenBucketMiddleware(20, 5)); // 20 burst, 5/sec refill"]}, {"t": "callout", "kind": "tip", "title": "Interview tip", "body": ["Always explain the algorithm before coding. \"I will implement a token bucket — tokens accumulate at a fixed rate, each request spends a token, requests fail when tokens are empty.\" This shows you understand the approach, not just the code."]}]}, {"num": "Q97", "title": "Implement a LRU (Lea
