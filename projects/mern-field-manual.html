<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MERN Field Manual — Learning Guide &amp; Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="shelf-vendor:/fonts/d0b59e169e5c.css" rel="stylesheet">
<style>
:root{
  --bg:#0e1320; --panel:#141b2b; --raised:#1b2436; --line:rgba(148,163,196,.15);
  --ink:#e9eef8; --muted:#94a1ba; --faint:#6b7794;
  --p1:#5b9dff; --p2:#f0a452; --p3:#4bd68b; --p4:#a78bfa; --chap:#38c3d8; --intv:#f27d72; --new:#f5c451; --qr:#d78fe0;
  --code-bg:#0b1019; --code-ink:#d7e2f5;
  --junior:#4bd68b; --mid:#5b9dff; --senior:#f0a452; --expert:#f27d72;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --sidebar:304px;
}
[data-theme="light"]{
  --bg:#f4f6fa; --panel:#ffffff; --raised:#eef1f7; --line:rgba(30,41,70,.12);
  --ink:#1a2233; --muted:#57647f; --faint:#8b96ad;
  --code-bg:#101725; --code-ink:#d7e2f5;
  --shadow:0 8px 24px rgba(24,36,70,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;}
h1,h2,h3,h4{font-family:"Space Grotesk","IBM Plex Sans",sans-serif;line-height:1.2;letter-spacing:-.01em}
a{color:inherit}
#side a,.toc a,.pagenav a,.sres a,.card,.nav-item{text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:rgba(91,157,255,.35)}

/* layout */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:0 0 24px;scrollbar-width:thin}
#main{min-width:0}
.wrap{max-width:880px;margin:0 auto;padding:28px 40px 90px}

/* sidebar */
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:19px}
.brand h1 span{color:var(--p3)}
.brand p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 14px}
.modes button{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.modes button.on{color:var(--ink);background:var(--raised);border-color:transparent}
.side-tools{display:flex;gap:6px;padding:0 14px 10px}
.side-tools button{flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--muted)}
.side-tools button:hover{color:var(--ink)}
.grp{margin:14px 10px 0}
.grp-h{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.grp-h .dot{width:8px;height:8px;border-radius:3px;background:var(--gc,var(--p1));flex:none}
.grp-h .mn{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.nav-item{position:relative;display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;padding:7px 10px 7px 16px;border-radius:9px;font-size:13.5px;color:var(--muted);border-left:2px solid transparent}
.nav-item:hover{background:var(--raised);color:var(--ink)}
.nav-item.on{background:var(--raised);color:var(--ink);border-left-color:var(--gc,var(--p1))}
.nav-item .wk{flex:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);min-width:34px}
.nav-item.on .wk{color:var(--gc,var(--p1))}
.nav-item .ck{margin-left:auto;flex:none;font-size:11px;color:var(--p3);opacity:0;transform:translateY(1px)}
.nav-item.done .ck{opacity:1}
.nav-item .badge-new{margin-left:auto;flex:none;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#141b2b;background:var(--new);border-radius:5px;padding:1px 5px}
.spine{height:3px;border-radius:2px;background:var(--line);margin:6px 10px 2px;overflow:hidden}
.spine i{display:block;height:100%;width:0;background:var(--gc,var(--p1));transition:width .3s}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 40px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#burger{display:none;font-size:20px;padding:4px 8px}
.crumb{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.tb-btn{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--muted)}
.tb-btn:hover{color:var(--ink);background:var(--raised)}
.tb-btn kbd{font-family:"IBM Plex Mono",monospace;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--faint)}

/* content */
.page-head{margin:26px 0 6px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac,var(--p1))}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--ac,var(--p1));border-radius:2px}
.page-head h2{margin:8px 0 4px;font-size:31px}
.page-head .tagline{color:var(--muted);font-size:15px;margin:0}
.headrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.done-btn{padding:8px 14px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.done-btn:hover{color:var(--ink)}
.done-btn.done{color:#0c1a12;background:var(--p3);border-color:transparent}

h3.subhead{margin:44px 0 10px;font-size:21px;padding-top:22px;border-top:1px solid var(--line)}
h4.topic{margin:34px 0 8px;font-size:16.5px;display:flex;gap:10px;align-items:baseline}
h4.topic::before{content:"§";color:var(--ac,var(--p1));font-family:"IBM Plex Mono",monospace;font-size:13px}
p.body{margin:10px 0;color:var(--ink)}
p.body strong.lead{color:var(--ac,var(--p1))}
ul.body{margin:10px 0;padding-left:22px}
ul.body li{margin:5px 0}

pre.code{position:relative;background:var(--code-bg);color:var(--code-ink);border:1px solid rgba(148,163,196,.14);border-radius:12px;padding:15px 17px;overflow-x:auto;font:12.8px/1.6 "IBM Plex Mono",ui-monospace,monospace;margin:14px 0;tab-size:2}
pre.code .cp{position:absolute;top:8px;right:8px;font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid rgba(148,163,196,.2);color:#93a1ba;background:rgba(14,19,32,.6);opacity:0;transition:.15s}
pre.code:hover .cp,pre.code:focus-within .cp{opacity:1}
pre.code .lang{position:absolute;top:8px;right:72px;font:500 10px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b7a95;pointer-events:none}
pre.code{padding-top:28px}
@media (hover:none){ pre.code .cp{opacity:1} }
pre.code .cp:hover{color:#e9eef8}
.tok-c{color:#6b7a95;font-style:italic}
.tok-s{color:#9ce0a2}
.tok-k{color:#7db4ff}
.tok-n{color:#f0b76a}

.callout{border:1px solid var(--line);border-left:3px solid var(--cc,var(--p1));border-radius:12px;background:var(--panel);padding:14px 18px;margin:16px 0}
.callout .co-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin:0 0 6px;color:var(--cc,var(--p1))}
.callout .co-t .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:5px;padding:1px 6px;opacity:.85}
.callout p{margin:6px 0;font-size:14px;color:var(--ink)}
.callout ul{margin:6px 0;padding-left:20px;font-size:14px}
.callout li{margin:5px 0}
.co-info{--cc:#5b9dff}.co-tip{--cc:#4bd68b}.co-exercise{--cc:#8f9dff}.co-capstone{--cc:#f0b76a}.co-netsuite{--cc:#9fb0cc}.co-warn{--cc:#f27d72}

table.data{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px}
table.data th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px}
table.data td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.data tr:hover td{background:var(--raised)}

.pagenav{display:flex;gap:12px;margin-top:56px}
.pagenav a{flex:1;display:block;border:1px solid var(--line);border-radius:12px;padding:13px 16px;text-decoration:none;color:var(--muted);font-size:13px}
.pagenav a:hover{background:var(--raised);color:var(--ink)}
.pagenav a b{display:block;color:var(--ink);font-size:14.5px;margin-top:2px}
.pagenav a.next{text-align:right}

/* month strip */
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0 4px}
.month{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--panel)}
.month b{font-size:13.5px}
.month .mn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ac,var(--p1))}
.month p{margin:3px 0 0;font-size:12px;color:var(--muted)}

/* interview */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{padding:6px 13px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{color:var(--bg);background:var(--lc,var(--ink));border-color:transparent}
.chip[data-l="Junior"]{--lc:var(--junior)}.chip[data-l="Mid"]{--lc:var(--mid)}.chip[data-l="Senior"]{--lc:var(--senior)}.chip[data-l="Expert"]{--lc:var(--expert)}
.qcard{border:1px solid var(--line);border-radius:13px;background:var(--panel);margin:12px 0;overflow:hidden}
.qcard>button.qh{display:flex;width:100%;text-align:left;gap:12px;align-items:baseline;padding:14px 18px}
.qcard>button.qh:hover{background:var(--raised)}
.qnum{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);flex:none;min-width:30px}
.qtitle{font-weight:600;font-size:14.5px;flex:1}
.lvl{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 9px;border-radius:99px;border:1px solid var(--lc);color:var(--lc)}
.lvl[data-l="Junior"]{--lc:var(--junior)}.lvl[data-l="Mid"]{--lc:var(--mid)}.lvl[data-l="Senior"]{--lc:var(--senior)}.lvl[data-l="Expert"]{--lc:var(--expert)}
.qbody{display:none;padding:2px 20px 16px;border-top:1px solid var(--line)}
.qcard.open .qbody{display:block}
.qcard .caret{flex:none;color:var(--faint);transition:transform .15s}
.qcard.open .caret{transform:rotate(90deg)}
.qfoot{margin-top:12px}
.know-btn{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.know-btn.on{color:#0c1a12;background:var(--p3);border-color:transparent}

/* home */
.hero{margin:34px 0 30px}
.hero .eyebrow{--ac:var(--p3)}
.hero h2{font-size:42px;margin:10px 0 10px;max-width:640px}
.hero p.sub{color:var(--muted);font-size:16px;max-width:620px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:26px 0}
.stat{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--panel)}
.stat b{font-family:"Space Grotesk";font-size:26px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 26px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px 20px;text-decoration:none;display:block}
.card:hover{background:var(--raised)}
.card .eyebrow{font-size:10.5px}
.card b{display:block;font-size:16px;margin:7px 0 4px;font-family:"Space Grotesk"}
.card p{margin:0;font-size:13px;color:var(--muted)}
.prog-row{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:13px}
.prog-row .nm{width:210px;flex:none;color:var(--muted)}
.prog-row .bar{flex:1;height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.prog-row .bar i{display:block;height:100%;background:var(--gc);border-radius:3px;transition:width .3s}
.prog-row .pc{width:44px;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
.note{border:1px dashed var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--muted);margin:20px 0}
.note b{color:var(--ink)}
.note button{color:var(--p1);text-decoration:underline;padding:0}

/* drill */
.drill-set{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.fcard{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:34px 34px 26px;margin:18px 0;min-height:220px;box-shadow:var(--shadow)}
.fcard .fq{font-size:20px;font-weight:600;font-family:"Space Grotesk"}
.fcard .fmeta{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--faint)}
.drill-btns{display:flex;gap:10px;margin-top:8px}
.drill-btns button{padding:10px 20px;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn-reveal{background:var(--raised)}
.btn-again{color:var(--intv);border-color:color-mix(in srgb,var(--intv) 45%,transparent)}
.btn-got{color:#0c1a12;background:var(--p3);border-color:transparent}
.drill-stats{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint)}

/* search */
#ovl{position:fixed;inset:0;z-index:80;display:none;background:rgba(5,8,15,.6);backdrop-filter:blur(3px)}
#ovl.open{display:block}
.sbox{max-width:640px;margin:9vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sbox input{width:100%;padding:16px 20px;font:16px "IBM Plex Sans";background:none;border:none;color:var(--ink);outline:none;border-bottom:1px solid var(--line)}
.sres{max-height:56vh;overflow-y:auto;padding:8px}
.sres a{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:14px}
.sres a:hover,.sres a.sel{background:var(--raised)}
.sres .k{flex:none;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);min-width:56px}
.sres .ctx{margin-left:auto;flex:none;font-size:11.5px;color:var(--faint);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .empty{padding:18px;color:var(--muted);font-size:14px;text-align:center}

/* modal */
#modal{position:fixed;inset:0;z-index:90;display:none;background:rgba(5,8,15,.6)}
#modal.open{display:flex;align-items:center;justify-content:center}
.mbox{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
.mbox h3{margin:0 0 8px}
.mbox p{font-size:13.5px;color:var(--muted)}
.mbox textarea{width:100%;height:110px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:10px;font:12px "IBM Plex Mono",monospace;padding:10px;resize:vertical}
.mbox .mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.mbox .mrow button{padding:8px 16px;border:1px solid var(--line);border-radius:9px;font-size:13px}
.mbox .mrow .primary{background:var(--p1);color:#0b1224;border-color:transparent;font-weight:600}

/* on-page TOC */
/* related pages strip */
.related{margin:44px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.related .rel-h{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.related a{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:7px;text-decoration:none;font-size:13px}
.related a:hover{background:var(--raised)}
.related a b{font-weight:600;flex:none}
.related a span{color:var(--muted);font-size:12.5px}

/* topic index */
.alpha{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.alpha a{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);text-decoration:none}
.alpha a:hover{background:var(--raised);color:var(--ink)}
.ix{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:5px}
.ix a{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:13.5px}
.ix a:hover{background:var(--raised)}
.ix-t{flex:1;min-width:0}
.ix-p{flex:none;font-size:11.5px;color:var(--faint);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* roadmap overview */
.rm{border:1px solid var(--line);border-left:3px solid var(--gc);border-radius:14px;background:var(--panel);padding:16px 20px;margin:16px 0}
.rm-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rm-h .dot{width:9px;height:9px;border-radius:3px;background:var(--gc)}
.rm-h b{font-family:"Space Grotesk";font-size:15.5px}
.rm-h .mn{color:var(--muted);font-size:13px}
.rm-h .pc{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--gc)}
.rm-tag{margin:6px 0 2px;font-size:13px;color:var(--muted)}
.rm-months{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0 4px}
.rm-m{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px}
.rm-m .mn{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--gc)}
.rm-goal{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.rm-weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px;margin-top:10px}
.rm-week{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;color:var(--muted)}
.rm-week:hover{background:var(--raised);color:var(--ink)}
.rm-week .wk{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--gc);min-width:22px}
.rm-week .ck{margin-left:auto;color:var(--p3);opacity:0}
.rm-week.dn .ck{opacity:1}
.rm-week.dn{color:var(--ink)}

/* collapsible sidebar groups */
button.grp-h{width:100%;cursor:pointer}
.grp-h .chev{flex:none;width:11px;color:var(--faint);font-size:9px}
.grp-h:hover{color:var(--ink)}

/* bookmark states */
.done-btn.mk-on{color:#241c04;background:var(--new);border-color:transparent}
.know-btn.mkq{color:#241c04;background:var(--new);border-color:transparent}
.qbody a,.callout a{color:var(--p1)}

/* back to top */
#totop{position:fixed;right:22px;bottom:22px;z-index:40;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:16px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}
#totop.show{opacity:1;pointer-events:auto}
#totop:hover{color:var(--ink);background:var(--raised)}

.toc{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:13px 16px;margin:18px 0;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.toc-h{flex:none;width:100%;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.toc a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.toc a:hover{color:var(--ink);background:var(--raised)}
.toc a.toc-sub{color:var(--ac,var(--p1));border-color:color-mix(in srgb,var(--ac,var(--p1)) 40%,transparent);font-weight:600}

.sres .st{flex:1;min-width:0}
.sres .snip{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}

.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 14px;text-decoration:none}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--p1);outline-offset:2px;border-radius:6px}

@media print{
  html{--bg:#fff;--panel:#fff;--raised:#f2f3f6;--ink:#111;--muted:#444;--faint:#777;--line:#ccc;
       --code-bg:#f6f7f9;--code-ink:#1a2233}
  .tok-c{color:#6a737d}.tok-s{color:#22863a}.tok-k{color:#005cc5}.tok-n{color:#b45309}
  #side,.topbar,#ovl,#modal,#totop,.skip,.toc,.related,.alpha,.done-btn,.pagenav,.filters,.qfoot,.drill-btns,.note{display:none!important}
  #app{display:block}
  .wrap{max-width:none;padding:0}
  .qcard .qbody{display:block!important;padding:2px 20px 16px}
  .qcard,.callout,pre.code{break-inside:avoid}
  pre.code{white-space:pre-wrap;box-shadow:none}
  a{text-decoration:none;color:inherit}
}

@media(max-width:960px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);z-index:60;transform:translateX(-102%);transition:transform .2s}
  #side.open{transform:none;box-shadow:var(--shadow)}
  #burger{display:block}
  .wrap{padding:20px 20px 80px}
  .topbar{padding:10px 16px}
  .cards{grid-template-columns:1fr}
  .hero h2{font-size:30px}
  .prog-row .nm{width:130px}
}
</style>
</head>

<script type="application/json" id="data">{"phases": [{"id": "phase1", "n": 1, "months": "1–3", "title": "Foundation: JavaScript, HTML/CSS, Git & Node.js", "tagline": "Build an unshakeable base. Every MERN concept you will ever learn rests on what you master here.", "intro": "Phase 1 is the most important phase of this roadmap. Developers who rush it spend months 4–7 constantly backtracking. Your existing NetSuite JavaScript exposure is useful context, but it is not a substitute for disciplined foundational study. The goal is not just to know the syntax — it is to think like a JavaScript developer.", "pages": [{"id": "pg1", "title": "HTML5 & CSS3 Fundamentals", "sub": "Week 1 · Month 1", "blocks": [{"t": "topic", "text": "Semantic HTML5 Elements"}, {"t": "p", "text": "HTML5 introduced semantic elements that describe meaning, not just presentation. Use them instead of generic <div> and <span> wherever possible."}, {"t": "p", "text": "<header> — site or section header, contains nav/logo. <nav> — primary navigation links. <main> — unique main content of the page (one per page). <article> — self-contained content (blog post, news item). <section> — thematic grouping of content with a heading. <aside> — tangentially related content (sidebar). <footer> — closing content, copyright, links."}, {"t": "p", "text": "Why it matters: screen readers, SEO crawlers, and browser reading modes all rely on semantic structure. Google ranks semantically correct pages higher."}, {"t": "code", "lang": "html", "lines": ["<!-- WRONG: all divs, no meaning -->", "<div class=\"top\"><div class=\"links\">...<\/div><\/div>", "", "<!-- CORRECT: semantic structure -->", "<header>", "  <nav>", "    <a href=\"/\">Home<\/a>", "    <a href=\"/about\">About<\/a>", "  <\/nav>", "<\/header>", "<main>", "  <article>", "    <h1>Post Title<\/h1>", "    <p>Content...<\/p>", "  <\/article>", "  <aside>Related posts<\/aside>", "<\/main>", "<footer>Copyright 2025<\/footer>"]}, {"t": "topic", "text": "HTML Forms"}, {"t": "p", "text": "Forms are the primary way users send data to your server. Mastering form markup prevents 80% of accessibility bugs."}, {"t": "p", "text": "Key attributes: action (where data goes), method (GET or POST), novalidate (disable browser validation for custom JS validation)."}, {"t": "p", "text": "Input types: text, email (mobile shows email keyboard), number (shows numeric keyboard), password (hidden chars), checkbox, radio, file, date, range, tel, url, hidden."}, {"t": "p", "text": "Validation attributes: required (must not be empty), minlength/maxlength, min/max (for numbers), pattern (regex), type itself validates (email must have @)."}, {"t": "p", "text": "Always pair every input with a <label> using for=id matching. Never use placeholder as a label — it disappears when user starts typing."}, {"t": "code", "lang": "html", "lines": ["<form action=\"/submit\" method=\"POST\">", "  <label for=\"email\">Email address<\/label>", "  <input", "    type=\"email\"", "    id=\"email\"", "    name=\"email\"", "    required", "    placeholder=\"you@example.com\"", "  />", "  <label for=\"age\">Age<\/label>", "  <input type=\"number\" id=\"age\" name=\"age\" min=\"18\" max=\"120\" />", "  <button type=\"submit\">Send<\/button>", "<\/form>"]}, {"t": "topic", "text": "CSS Selectors & Specificity"}, {"t": "p", "text": "Specificity determines which CSS rule wins when multiple rules target the same element. It is calculated as a 3-part score: (ID count, Class/Attribute/Pseudo-class count, Element count)."}, {"t": "p", "text": "Inline style: 1,0,0,0 (always wins except !important). ID (#id): 0,1,0,0. Class (.class), attribute ([href]), pseudo-class (:hover): 0,0,1,0. Element (div, p): 0,0,0,1."}, {"t": "p", "text": "The cascade: when specificity is equal, the LAST rule in the stylesheet wins."}, {"t": "p", "text": "Key pseudo-classes: :hover (mouse over), :focus (keyboard focus — never remove outline!), :active (being clicked), :nth-child(n) (every nth child), :first-child, :last-child, :not(selector), :is(), :has() (parent selector — modern CSS)."}, {"t": "code", "lang": "css", "lines": ["/* Specificity: 0,0,1,1 — element + class */", "p.intro { color: blue; }", "", "/* Specificity: 0,1,0,0 — ID wins */", "#hero { color: red; }", "", "/* Attribute selector — specificity: 0,0,1,0 */", "a[href^=\"https\"] { color: green; } /* starts with */", "a[href$=\".pdf\"] { color: orange; } /* ends with */", "", "/* :has() — style parent based on child */", "form:has(input:invalid) { border: 2px solid red; }"]}, {"t": "topic", "text": "CSS Box Model"}, {"t": "p", "text": "Every HTML element is a rectangular box with 4 layers: content (width/height), padding (inside spacing), border, margin (outside spacing)."}, {"t": "p", "text": "CRITICAL: By default, width/height only size the CONTENT box. Padding and border ADD to it. So width:200px + padding:20px = 240px actual width. This is the source of countless layout bugs."}, {"t": "p", "text": "Fix: use box-sizing: border-box — makes width include padding and border. Set it globally: *, *::before, *::after { box-sizing: border-box; }"}, {"t": "p", "text": "Margin collapsing: vertical margins between block elements collapse to the larger of the two. Horizontal margins never collapse."}, {"t": "code", "lang": "css", "lines": ["/* Without box-sizing: border-box */", "/* width: 200px + padding: 20px = 240px actual */", "", ".box {", "  width: 200px;", "  padding: 20px;  /* now actual width is 240px — BAD */", "  border: 2px solid;  /* now 244px — keeps growing */", "}", "", "/* With box-sizing: border-box (use this always) */", "* { box-sizing: border-box; }", "", ".box {", "  width: 200px;", "  padding: 20px;  /* still 200px total — GOOD */", "  border: 2px solid; /* still 200px — GOOD */", "  margin: 10px;  /* outside, does not affect width */", "  border-radius: 8px; /* rounded corners */", "  box-shadow: 0 2px 8px rgba(0,0,0,0.15); /* shadow */", "  overflow: hidden; /* clips content to border edge */", "  opacity: 0.8; /* overall transparency */", "  visibility: hidden; /* hides but keeps space */", "  display: none; /* hides AND removes from flow */", "  position: relative; /* offset from normal position */", "  z-index: 10; /* stacking order (only on positioned) */", "  cursor: pointer; /* pointer cursor on hover */", "  user-select: none; /* prevent text selection */", "  outline: 2px solid blue; /* focus ring — never remove! */", "  outline-offset: 2px; /* gap between border and outline */", "  text-overflow: ellipsis; /* truncate long text with ... */", "  white-space: nowrap; /* prevent wrapping */", "  overflow: hidden; /* required for text-overflow */", "  aspect-ratio: 16/9; /* maintain ratio on resize */", "  object-fit: cover; /* image fills box without distortion */", "  object-position: center; /* image focal point */", "  max-width: 100%; /* never overflow parent width */", "  min-height: 100vh; /* at least full viewport height */", "  line-height: 1.6; /* comfortable reading line spacing */", "  letter-spacing: 0.02em; /* slight tracking for headers */", "  word-break: break-word; /* wrap long words/URLs */", "  text-align: center; /* center inline content */", "  vertical-align: middle; /* align inline elements */", "  clip-path: circle(50%); /* shape clipping */", "  transform: rotate(45deg) scale(1.1); /* CSS transforms */", "  transition: all 0.2s ease; /* animate property changes */", "  animation: spin 1s linear infinite; /* keyframe animation */", "  background-clip: text; /* gradient text hack */", "  backdrop-filter: blur(8px); /* frosted glass effect */", "  will-change: transform; /* GPU hint for animations */", "  contain: layout; /* CSS containment for performance */", "  content-visibility: auto; /* skip rendering off-screen */", "  scrollbar-width: thin; /* thinner browser scrollbar */", "  accent-color: blue; /* style checkboxes/radios */", "  resize: vertical; /* allow textarea resize direction */", "  pointer-events: n ross axis: stretch|center|flex-start|flex-end|baseline), flex-wrap (nowrap|wrap), gap (spacing between items)."}, {"t": "p", "text": "Child (flex item) properties: flex-grow (how much to expand to fill space), flex-shrink (how much to shrink), flex-basis (initial size before growing/shrinking). Shorthand: flex: grow shrink basis. flex:1 means flex:1 1 0 — take equal share of space."}, {"t": "code", "lang": "css", "lines": ["/* PARENT */", "nav {", "  display: flex;", "  justify-content: space-between;  /* logo left, links right */", "  align-items: center;", "  gap: 1rem;", "  flex-wrap: wrap; /* wrap to next line on small screens */", "  padding: 1rem 2rem;", "}", "", "/* CHILD */", "nav .logo { flex-shrink: 0; }  /* never shrink the logo */", "nav .links { flex: 1; }  /* take remaining space */", "nav .cta { margin-left: auto; }  /* push to far right */"]}, {"t": "topic", "text": "CSS Grid"}, {"t": "p", "text": "CSS Grid is a two-dimensional layout system — it arranges items in rows AND columns simultaneously. Use it for page-level layouts and complex component grids."}, {"t": "p", "text": "Key properties: grid-template-columns (define column sizes), grid-template-rows (define row sizes), gap (space between tracks), grid-column / grid-row (place item across multiple tracks), grid-area (name a grid area), grid-template-areas (visual layout with named areas)."}, {"t": "p", "text": "repeat(3, 1fr) creates 3 equal columns. auto-fit with minmax() creates responsive grids without media queries."}, {"t": "code", "lang": "css", "lines": ["/* Fixed 3-column layout */", "main {", "  display: grid;", "  grid-template-columns: 250px 1fr 200px; /* sidebar, content, aside */", "  grid-template-rows: auto 1fr auto; /* header, main, footer */", "  grid-template-areas:", "    \"header header header\"", "    \"sidebar content aside\"", "    \"footer footer footer\";", "  min-height: 100vh;", "  gap: 1rem;", "}", "", "header { grid-area: header; }", "aside  { grid-area: aside; }", "footer { grid-area: footer; }", "", "/* Responsive auto-grid — no media queries needed */", "ul.cards {", "  display: grid;", "  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));", "  gap: 1.5rem;", "  /* Cards automatically wrap: 4 cols desktop, 1 col mobile */", "  list-style: none;", "  padding: 0;", "  align-items: start; /* prevents stretching to tallest card */", "  place-items: center; /* shorthand for align + justify */", "  grid-auto-rows: 1fr; /* all rows same height */", "  grid-auto-flow: dense; /* fill holes in grid */", "  subgrid: grid-template-columns; /* inherit parent tracks */", "  justify-items: start; /* horizontal align all cells */", "  align-content: start; /* vertical align all rows in container */", "  /* Named lines for clarity */", "  grid-template-columns: [start] 1fr [mid] 1fr [end];", "  /* Span multiple columns */", "  /* .featured { grid-column: 1 / -1; } spans full width */", "  /* Span multiple rows */", "  /* .tall { grid-row: span 2; } */", "  /* Order items visually */", "  /* .item { order: -1; } */", "  grid-auto-columns: minmax(200px, 1fr); /* implicit cols */", "  overflow: hidden; /* clip grid overflow */", "  contain: layout; /* performance optimisation */", "  padding-block: 2rem; /* logical padding top and bottom */", "  padding-inline: max(1rem, 5vw); /* responsive padding */", "  container-type: inline-size; /* CSS container queries */", "  container-name: card-grid; /* name for container query */", "  /* Then in a media query for the container: */", "  /* @container card-grid (min-width: 600px) { .card { flex-direction: row; } } */", "  /* Grid areas with fractional and pixel units mixed */", "  grid-template-columns: [sidebar-start] 250px [sidebar-end content-start] 1fr [content-end];", "  grid-template-rows: [header-start] 80px [header-end body-start] 1fr [body-end footer-start] 60px [footer-end];", "  /* Layered grid items (z-index for stack order) */", "  /* grid-column: 1 / -1; grid-row: 1 / -1; */ /* dia queries add complexity upward. Container queries (now baseline in all browsers) size components by their container instead of the viewport — the missing piece for truly reusable components."}, {"t": "code", "lang": "css", "lines": ["/* Mobile-first breakpoints */", ".cards { display: grid; grid-template-columns: 1fr; gap: 1rem; }", "@media (min-width: 640px)  { .cards { grid-template-columns: repeat(2, 1fr); } }", "@media (min-width: 1024px) { .cards { grid-template-columns: repeat(4, 1fr); } }", "", "/* Container query: the card adapts to ITS box, not the screen */", ".sidebar { container-type: inline-size; }", "@container (min-width: 320px) {", "  .card { flex-direction: row; }", "}"]}, {"t": "topic", "text": "CSS Custom Properties (Variables)"}, {"t": "p", "text": "Custom properties cascade and can change at runtime — the foundation of theming. Define tokens on :root, override per component or per theme."}, {"t": "code", "lang": "css", "lines": [":root { --brand: #4f46e5; --space: 1rem; }", "[data-theme=\"dark\"] { --brand: #818cf8; }", ".btn { background: var(--brand); padding: calc(var(--space) / 2) var(--space); }"]}, {"t": "topic", "text": "Positioning & Stacking Contexts"}, {"t": "li", "text": "static (default) → relative (offset, keeps space) → absolute (out of flow, positioned to nearest positioned ancestor) → fixed (viewport) → sticky (hybrid: relative until a scroll threshold)."}, {"t": "li", "text": "z-index only competes within the same stacking context; transform, opacity < 1, filter and position+z-index each create a new one — the reason \"z-index: 9999\" sometimes does nothing."}, {"t": "topic", "text": "Transitions, Animations & Accessibility Basics"}, {"t": "code", "lang": "css", "lines": [".btn { transition: transform .15s ease, box-shadow .15s ease; }", ".btn:hover { transform: translateY(-2px); }", "@keyframes pulse { 50% { opacity: .5; } }", ".badge { animation: pulse 2s infinite; }", "@media (prefers-reduced-motion: reduce) { * { animation: none; transition: none; } }"]}, {"t": "li", "text": "Accessibility non-negotiables: one h1 per page and a logical heading order, alt text on meaningful images, labels tied to inputs, visible :focus-visible styles, 4.5:1 text contrast, and keyboard-reachable interactive elements (buttons, not clickable divs)."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Specificity, the box model, Flexbox vs Grid, and \"why does my z-index not work\" are the four most common CSS screen questions — stacking contexts answer the last one."]}], "week": 1}, {"id": "pg2", "title": "JavaScript Variables, Types & Control Flow", "sub": "Week 2 · Month 1", "blocks": [{"t": "topic", "text": "var vs let vs const"}, {"t": "p", "text": "JavaScript has three ways to declare variables. Understanding the differences is critical to avoiding subtle bugs."}, {"t": "p", "text": "var: function-scoped (not block-scoped), hoisted to the top of its function and initialized to undefined. This means you can reference it before the declaration without an error — it just returns undefined. Avoid var in modern code."}, {"t": "p", "text": "let: block-scoped (only accessible within the {} block it is declared in). Hoisted but NOT initialized — accessing it before declaration throws ReferenceError (the \"temporal dead zone\"). Use let for variables that will be reassigned."}, {"t": "p", "text": "const: block-scoped. Must be initialized at declaration. Cannot be reassigned (but objects/arrays it points to CAN be mutated). Use const by default — only use let when you know you need reassignment."}, {"t": "code", "lang": "js", "lines": ["// var — function scoped, hoisted to undefined", "function example() {", "  console.log(x); // undefined (NOT ReferenceError)", "  var x = 5;", "  console.log(x); // 5", "  if(true) {", "    var x = 10; // same x — overwrites!", "  }", "  console.log(x); // 10 — unexpected!", "}", "", "// let — block scoped, temporal dead zone", "function better() {", "  // console.log(y); // ReferenceError — good, caught early", "  let y = 5;", "  if(true) {", "    let y = 10; // different y — block scoped", "    console.log(y); // 10", "  }", "  console.log(y); // 5 — unchanged, good", "}", "", "// const — must initialize, cannot reassign", "const PI = 3.14159;", "// PI = 3; // TypeError: Assignment to constant variable", "", "const user = { name: \"Ahmed\" };", "user.name = \"Mohamed\"; // OK — mutating the object, not reassigning", "// user = {}; // TypeError — cannot reassign the binding", "", "// Use const by default, let only when reassignment is needed"]}, {"t": "topic", "text": "The 7 Primitive Types"}, {"t": "p", "text": "JavaScript has 7 primitive types. Primitives are immutable values — when you \"change\" a primitive, you create a new value."}, {"t": "p", "text": "string: sequence of UTF-16 code units. Strings are immutable — str[0] = \"A\" does nothing. Template literals use backticks: `Hello ${name}`."}, {"t": "p", "text": "number: IEEE 754 double-precision float. Integers up to 2^53-1 are safe (Number.MAX_SAFE_INTEGER). Numbers: 0, -0 (yes, negative zero), NaN (not a number — result of invalid math), Infinity, -Infinity."}, {"t": "p", "text": "bigint: arbitrary precision integers. Created with n suffix: 9007199254740991n. Cannot mix with number without explicit conversion."}, {"t": "p", "text": "boolean: true or false. Only two values."}, {"t": "p", "text": "undefined: a variable declared but not yet assigned. typeof undefined === \"undefined\"."}, {"t": "p", "text": "null: intentional absence of a value. typeof null === \"object\" — this is a famous JavaScript bug that will never be fixed for backward compatibility."}, {"t": "p", "text": "symbol: unique, immutable identifier. Symbol(\"tag\") !== Symbol(\"tag\") — every symbol is unique. Used as non-colliding object keys."}, {"t": "code", "lang": "js", "lines": ["// typeof for runtime type checking", "console.log(typeof \"hello\")      // \"string\"", "console.log(typeof 42)           // \"number\"", "console.log(typeof 42n)          // \"bigint\"", "console.log(typeof true)         // \"boolean\"", "console.log(typeof undefined)    // \"undefined\"", "console.log(typeof null)         // \"object\" — the famous bug!", "console.log(typeof Symbol())     // \"symbol\"", "console.log(typeof {})           // \"object\"", "console.log(typeof [])           // \"object\" — not \"array\"!", "console.log(typeof function(){}) // \"function\"", "", "// Correct null check", "const isNull = (val) => val === null;", "", "// Correct array check", "Array.isArray([]) // true — use this, not typeof", "", "// NaN check", "Number.isNaN(NaN)    // true  (safe version)", "isNaN(\"hello\")       // true  (unsafe — converts first)", "Number.isNaN(\"hello\")// false (no conversion — use this)", "", "// Safe integer check", "Number.isInteger(42)   // true", "Number.isSafeInteger(9007199254740992) // false — too large"]}, {"t": "topic", "text": "Type Coercion"}, {"t": "p", "text": "JavaScript automatically converts types in many situations. Understanding coercion prevents surprising bugs."}, {"t": "p", "text": "String conversion: happens with +  when one operand is a string. \"5\" + 3 === \"53\" (concatenation, not addition). All other operators (-,*,/) convert strings to numbers: \"5\" - 3 === 2."}, {"t": "p", "text": "Boolean conversion (truthy/falsy): happens in if(), while(), ternary. Falsy values are ONLY: false, 0, -0, 0n, \"\" (empty string), null, undefined, NaN. Everything else is truthy — including \"false\" (non-empty string), [] (empty array), {} (empty object)."}, {"t": "p", "text": "Explicit conversion: always prefer explicit over relying on implicit coercion. Number(\"42\") === 42. String(42) === \"42\". Boolean(0) === false."}, {"t": "p", "text": "== vs ===: == does type coercion before comparing. === never coerces — values must have the same type AND value. Always use ===."}, {"t": "code", "lang": "js", "lines": ["// String + number = string (concatenation)", "console.log(\"5\" + 3)   // \"53\"", "console.log(\"5\" - 3)   // 2 (subtraction forces numeric)", "console.log(\"5\" * \"3\") // 15 (both convert)", "console.log(+\"5\")      // 5 (unary + converts to number)", "console.log(+true)     // 1", "console.log(+null)     // 0", "console.log(+undefined)// NaN", "console.log(+[])       // 0 (via \"\" -> 0)", "console.log(+{})       // NaN", "", "// Falsy values — ONLY these 7", "Boolean(false)     // false", "Boolean(0)         // false", "Boolean(-0)        // false", "Boolean(0n)        // false — BigInt zero", "Boolean(\"\")        // false — empty string", "Boolean(null)      // false", "Boolean(undefined) // false", "Boolean(NaN)       // false", "", "// Everything else is truthy", "Boolean(\"false\")  // true — non-empty string!", "Boolean([])       // true — empty array!", "Boolean({})       // true — empty object!", "Boolean(-1)       // true — any non-zero number", "", "// == vs === coercion surprises", "0 == false        // true  (both convert to 0)", "\"\" == false       // true", "null == undefined // true  (special case)", "null == 0        // false", "NaN == NaN       // false — NaN is never equal to itself", "", "// Always use ===", "0 === false      // false — different types", "null === undefined// false — different types"]}, {"t": "topic", "text": "Control Flow: Conditionals"}, {"t": "p", "text": "Conditionals let your code make decisions. Master all the patterns — each has its place."}, {"t": "p", "text": "if/else: the most basic. Use early returns to avoid deep nesting."}, {"t": "p", "text": "Ternary: condition ? valueIfTrue : valueIfFalse. Use for simple expressions, not complex logic."}, {"t": "p", "text": "Nullish coalescing (??): returns the right side only if the left is null or undefined. Unlike ||, it does NOT trigger for 0, false, or empty string."}, {"t": "p", "text": "Optional chaining (?.) : accesses nested properties safely without throwing if a value is null/undefined."}, {"t": "p", "text": "switch: use when comparing one value against many known constants. Always add break; (or fall through intentionally)."}, {"t": "code", "lang": "js", "lines": ["// Early return pattern — avoid deep nesting", "function processUser(user) {", "  if (!user) return null;          // guard clause", "  if (!user.active) return null;   // guard clause", "  if (!user.email) return null;    // guard clause", "  // happy path — no nesting", "  return sendEmail(user.email);", "}", "", "// Ternary — simple expressions only", "const label = isAdmin ? \"Admin\" : \"User\";", "// NOT for complex logic — use if/else then", "", "// Nullish coalescing vs OR", "const count = data.count ?? 0;   // 0 if null/undefined", "const count2 = data.count || 0;  // 0 if falsy — BUG if count IS 0!", "", "// Optional chaining", "const city = user?.address?.city; // undefined if any step is null", "const first = arr?.[0];           // safe array index", "const result = obj?.method?.();   // safe method call", "", "// Logical assignment operators", "user.name ??= \"Guest\";    // assign only if null/undefined", "settings.debug ||= false; // assign if falsy", "config.cache &&= true;    // assign only if already truthy", "", "// Switch with fall-through (intentional)", "switch(status) {", "  case \"pending\":", "  case \"processing\":", "    showSpinner(); break;", "  case \"done\":", "    showSuccess(); break;", "  default:", "    showError();", "}"]}, {"t": "topic", "text": "Loops"}, {"t": "p", "text": "Loops repeat code. Each type has a specific use case."}, {"t": "p", "text": "for: use when you need the index or need to iterate a specific number of times."}, {"t": "p", "text": "while: use when you do not know in advance how many iterations you need."}, {"t": "p", "text": "for...of: use to iterate over iterable values (arrays, strings, Maps, Sets, generators). Cleaner than for when you do not need the index."}, {"t": "p", "text": "for...in: iterates over enumerable PROPERTY NAMES of an object. Not for arrays — use for...of."}, {"t": "p", "text": "forEach: array method. Cannot break out of it — use for...of if you need break."}, {"t": "p", "text": "break: exit the loop immediately. continue: skip the rest of the current iteration."}, {"t": "code", "lang": "js", "lines": ["// Classic for — use when index matters", "for(let i = 0; i < arr.length; i++) {", "  if(arr[i] === target) break; // can break", "  if(i % 2 !== 0) continue;   // skip odd indices", "}", "", "// while — unknown iteration count", "let page = 1;", "while(hasMore) {", "  const data = await fetch(`/api?page=${page++}`);", "  hasMore = data.hasNextPage;", "  // must ensure loop terminates!", "  if(page > 100) break; // safety valve", "}", "", "// for...of — iterate values (preferred for arrays)", "for(const user of users) {", "  console.log(user.name);", "  // can use break and continue", "  if(!user.active) continue;", "  if(user.name === \"stop\") break;", "  processUser(user);", "}", "", "// Destructuring in for...of", "for(const [key, value] of Object.entries(obj)) {", "  console.log(`${key}: ${value}`);", "}", "for(const [index, value] of arr.entries()) {", "  console.log(`${index}: ${value}`);", "}", "", "// for...in — object property names only", "for(const key in config) {", "  if(!Object.hasOwn(config, key)) continue; // skip inherited", "  console.log(key, config[key]);", "}"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 2", "body": ["E1: Write a typeInspector(val) function: logs type, truthy/falsy, and string representation. Test all 7 falsy values plus [], {}, \"false\", -1.", "E2: Write 10 coercion predictions on paper before running them in the console. Compare results.", "E3: FizzBuzz 1–100. Then refactor: use ternary, then use a lookup object. All three must produce identical output.", "E4: isPrime(n) — only check divisors up to Math.sqrt(n). Print all primes under 100."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Strings & Template Literals in Depth"}, {"t": "code", "lang": "js", "lines": ["const name = \"Ada\";", "`Hello ${name}` ;                    // interpolation", "`line 1", "line 2`;                             // real newlines", "\"  pad  \".trim(); \"ab\".padStart(4, \"0\");   // \"00ab\"", "\"a-b-c\".split(\"-\"); [\"a\",\"b\"].join(\"/\");", "\"hello\".includes(\"ell\"); \"hello\".at(-1);   // \"o\"", "\"aaa\".replaceAll(\"a\", \"b\");"]}, {"t": "topic", "text": "Numbers, Precision & BigInt"}, {"t": "li", "text": "All JS numbers are 64-bit floats: 0.1 + 0.2 !== 0.3. Compare with Math.abs(a-b) < Number.EPSILON, or work in integer cents for money."}, {"t": "li", "text": "Safe integers end at Number.MAX_SAFE_INTEGER (2^53 − 1); beyond that use BigInt: 9007199254740993n. Never mix BigInt and Number without explicit conversion."}, {"t": "li", "text": "Parsing: Number(\"42\") strict, parseInt(\"42px\", 10) forgiving, + \"42\" terse. NaN checks: Number.isNaN(x), never x === NaN."}, {"t": "topic", "text": "Truthy / Falsy — the complete list"}, {"t": "p", "text": "Exactly eight falsy values exist: false, 0, -0, 0n, \"\", null, undefined, NaN. Everything else is truthy — including \"0\", [], and {}. This is why value ?? fallback (nullish) beats value || fallback when 0 or \"\" are legitimate values."}, {"t": "topic", "text": "Equality: ==, ===, Object.is"}, {"t": "code", "lang": "js", "lines": ["1 == \"1\";            // true  — coercion (avoid)", "1 === \"1\";           // false — strict, always use", "Object.is(NaN, NaN); // true  (=== says false)", "Object.is(0, -0);    // false (=== says true)", "// Objects compare by reference, never by content:", "({a:1}) === ({a:1}); // false"]}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Reciting the eight falsy values and explaining ?? vs || is a fast credibility win in JS screens."]}], "week": 2}, {"id": "pg3", "title": "Functions, Scope & Closures", "sub": "Week 3 · Month 1", "blocks": [{"t": "topic", "text": "Function Declarations vs Expressions vs Arrow Functions"}, {"t": "p", "text": "JavaScript has three main ways to define functions. They differ in hoisting, this binding, and valid use cases."}, {"t": "p", "text": "Function declaration: hoisted entirely (both the name and the body). Can be called before it appears in the source."}, {"t": "p", "text": "Function expression: the name is hoisted as undefined, the function body is NOT. Cannot be called before the assignment."}, {"t": "p", "text": "Arrow function: concise syntax. If the body is a single expression, you can omit braces and return. Critical difference: arrow functions do NOT have their own this — they inherit this from the surrounding scope. This makes them ideal for callbacks inside methods."}, {"t": "code", "lang": "js", "lines": ["// Declaration — hoisted, can call before definition", "greet(\"Ahmed\"); // works!", "function greet(name) {", "  return `Hello, ${name}`;", "}", "", "// Expression — NOT hoisted", "// sayHi(\"Ahmed\"); // TypeError: sayHi is not a function", "const sayHi = function(name) {", "  return `Hi, ${name}`;", "};", "", "// Arrow — concise syntax", "const add = (a, b) => a + b; // implicit return", "const square = n => n * n;   // single param, no parens needed", "const noOp = () => {};        // no params", "", "// Arrow preserves outer this", "class Timer {", "  count = 0;", "  start() {", "    // Arrow: this refers to Timer instance", "    setInterval(() => {", "      this.count++; // works!", "    }, 1000);", "    // Regular function: this would be window/undefined", "    setInterval(function() {", "      // this.count++; // BUG — this is not Timer!", "    }, 1000);", "  }", "}"]}, {"t": "topic", "text": "Scope Chain & Closures"}, {"t": "p", "text": "Scope: the rules for which variables are accessible where. JavaScript uses lexical scoping — scope is determined by where code is written, not where it is called."}, {"t": "p", "text": "Scope chain: when you access a variable, JavaScript looks in the current scope, then the outer scope, then outer outer, up to global. It stops at the first match."}, {"t": "p", "text": "Closure: a function that \"closes over\" (captures) variables from its outer scope. The function retains access to those variables even after the outer function has returned."}, {"t": "p", "text": "This is not just a feature — it is how private state is implemented in JavaScript, how module patterns work, and how React hooks work internally."}, {"t": "code", "lang": "js", "lines": ["// Scope chain example", "const global = \"global\";", "function outer() {", "  const outerVar = \"outer\";", "  function inner() {", "    const innerVar = \"inner\";", "    // Can access: innerVar, outerVar, global", "    console.log(global, outerVar, innerVar);", "  }", "  // Can access: outerVar, global — NOT innerVar", "  inner();", "  // console.log(innerVar); // ReferenceError", "}", "", "// Closure — factory function pattern", "function makeCounter(start = 0) {", "  let count = start; // private — cannot access from outside", "  return {", "    increment() { count++; },", "    decrement() { count--; },", "    reset()     { count = start; },", "    getCount()  { return count; },", "  };", "  // When makeCounter returns, count persists", "  // because the returned methods close over it", "}", "", "const counter1 = makeCounter(10);", "const counter2 = makeCounter(0);", "counter1.increment();", "console.log(counter1.getCount()); // 11", "console.log(counter2.getCount()); // 0 — independent", "", "// Classic closure bug in loops", "// WRONG: all functions share the same i", "const funcs = [];", "for(var i = 0; i < 3; i++) {", "  funcs.push(() => console.log(i)); // captures i reference", "  // NOT the value of i at time of creation", "}", "funcs[0](); // 3 — not 0!", "", "// FIX 1: use let (block-scoped — new binding per iteration)", "for(let i = 0; i < 3; i++) {", "  funcs.push(() => console.log(i)); // each has own i", "  // funcs[0]() -> 0, funcs[1]() -> 1, funcs[2]() -> 2", "}"]}, {"t": "topic", "text": "Higher-Order Functions"}, {"t": "p", "text": "A higher-order function (HOF) is a function that either accepts a function as an argument OR returns a function. HOFs are foundational to functional programming in JavaScript."}, {"t": "p", "text": "Functions are first-class values in JavaScript — they can be stored in variables, passed as arguments, and returned from other functions."}, {"t": "p", "text": "Common HOF patterns: callbacks (pass a function to be called later), factories (return a function configured with arguments), decorators (wrap a function to add behavior)."}, {"t": "code", "lang": "js", "lines": ["// Passing functions as arguments (callbacks)", "[1,2,3].map(n => n * 2);  // map is a HOF", "[1,2,3].filter(n => n > 1); // filter is a HOF", "[1,2,3].reduce((acc,n) => acc+n, 0); // reduce is a HOF", "", "// Custom HOF: retries", "function withRetry(fn, maxRetries) {", "  return async function(...args) {", "    for(let i = 0; i <= maxRetries; i++) {", "      try { return await fn(...args); }", "      catch(err) {", "        if(i === maxRetries) throw err;", "        console.log(`Retry ${i+1}/${maxRetries}`);", "      }", "    }", "  };", "}", "const fetchWithRetry = withRetry(fetch, 3);", "", "// Decorator pattern", "function memoize(fn) {", "  const cache = new Map();", "  return function(...args) {", "    const key = JSON.stringify(args);", "    if(cache.has(key)) return cache.get(key);", "    const result = fn(...args);", "    cache.set(key, result);", "    return result;", "  };", "}", "", "const expensiveFib = (n) => n < 2 ? n : expensiveFib(n-1) + expensiveFib(n-2);", "const fastFib = memoize(expensiveFib);", "console.time(\"first\"); fastFib(40); console.timeEnd(\"first\");  // slow", "console.time(\"second\"); fastFib(40); console.timeEnd(\"second\"); // instant"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 3", "body": ["E1: Write once(fn) — wraps any function, executes only on first call, subsequent calls return the first result.", "E2: Write compose(...fns) — right-to-left composition. compose(f, g, h)(x) === f(g(h(x))).", "E3: makeMultiplier(factor) returns a function: makeMultiplier(3)(5) === 15.", "E4: memoize(fn) with Map cache — test with Fibonacci(40) and measure performance gain with console.time()."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "this — the four binding rules"}, {"t": "p", "text": "this is decided at call time, not definition time. Precedence: new binding → explicit (call/apply/bind) → implicit (obj.method()) → default (undefined in strict mode). Arrow functions have no this at all — they capture the enclosing scope's, which is why they fix callback bugs and why they cannot be methods that need their own this."}, {"t": "code", "lang": "js", "lines": ["const user = {", "  name: \"Ada\",", "  greet() { return `Hi ${this.name}`; },          // implicit: user", "};", "const f = user.greet;   f();                       // undefined — lost binding", "const bound = user.greet.bind(user); bound();      // \"Hi Ada\"", "user.greet.call({ name: \"Grace\" });                // explicit: \"Hi Grace\"", "", "setTimeout(() => console.log(this), 0);            // arrow: outer this"]}, {"t": "topic", "text": "Currying & Composition"}, {"t": "code", "lang": "js", "lines": ["const curry = f => a => b => f(a, b);", "const add = curry((a, b) => a + b);", "const add5 = add(5);                     // partial application", "", "const pipe = (...fns) => x => fns.reduce((v, f) => f(v), x);", "const slugify = pipe(s => s.trim(), s => s.toLowerCase(),", "                     s => s.replace(/\\s+/g, \"-\"));"]}, {"t": "topic", "text": "Recursion & the call stack"}, {"t": "li", "text": "Every call pushes a frame; deep recursion overflows (~10k frames). Iterative loops or an explicit stack handle unbounded depth — JS engines do not reliably optimise tail calls."}, {"t": "li", "text": "Classic pattern: walking trees (DOM, categories, file systems) — base case first, then recurse on children."}, {"t": "topic", "text": "IIFE & the module pattern (pre-ESM history)"}, {"t": "p", "text": "(function(){ ... })() created private scope before modules existed. You will still meet it in legacy code and older NetSuite scripts; today ESM files give the same privacy for free."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Expect \"what does this log?\" puzzles combining an object method, a detached reference, and an arrow function — the four rules above solve all of them."]}], "week": 3}, {"id": "pg4", "title": "Arrays, Objects, Destructuring & Error Handling", "sub": "Week 4 · Month 1", "blocks": [{"t": "topic", "text": "Array Methods — The Core Three (map, filter, reduce)"}, {"t": "p", "text": "These three methods are the most important tools for working with data in JavaScript. Master them deeply."}, {"t": "p", "text": "map(fn): transforms each element, returns a NEW array of the same length. The original is not mutated. Use it to extract a property, convert units, format data."}, {"t": "p", "text": "filter(fn): keeps only elements where fn returns true, returns a NEW shorter array. Use it to remove items that do not meet a condition."}, {"t": "p", "text": "reduce(fn, initial): accumulates all elements into a single value. The most powerful and general — map and filter can both be implemented using reduce."}, {"t": "code", "lang": "js", "lines": ["const products = [", "  { id:1, name:\"Monitor\", price:400, category:\"tech\", qty:5 },", "  { id:2, name:\"Desk\",    price:250, category:\"furniture\", qty:2 },", "  { id:3, name:\"Chair\",   price:150, category:\"furniture\", qty:8 },", "  { id:4, name:\"Laptop\",  price:1200,category:\"tech\", qty:1 },", "];", "", "// map — transform", "const names = products.map(p => p.name);", "// [\"Monitor\",\"Desk\",\"Chair\",\"Laptop\"]", "const withTax = products.map(p => ({...p, priceWithTax: p.price*1.15}));", "", "// filter — select", "const expensive = products.filter(p => p.price > 200);", "const tech = products.filter(p => p.category === \"tech\");", "", "// reduce — accumulate to anything", "const total = products.reduce((sum, p) => sum + p.price * p.qty, 0);", "// 400*5 + 250*2 + 150*8 + 1200*1 = 4900", "", "// reduce to object: total per category", "const byCategory = products.reduce((acc, p) => {", "  acc[p.category] = (acc[p.category] || 0) + p.price;", "  return acc;", "}, {});", "// { tech: 1600, furniture: 400 }", "", "// Method chaining: all together", "const result = products", "  .filter(p => p.qty > 0)", "  .map(p => ({ name: p.name, total: p.price * p.qty }))", "  .sort((a, b) => b.total - a.total);"]}, {"t": "topic", "text": "Destructuring"}, {"t": "p", "text": "Destructuring lets you unpack values from arrays or properties from objects into distinct variables. It is ubiquitous in modern JS and in React props."}, {"t": "p", "text": "Array destructuring: position-based. You can skip elements, use rest (...), and rename."}, {"t": "p", "text": "Object destructuring: name-based. You must use the exact property name (or rename with colon). You can set defaults."}, {"t": "p", "text": "Destructuring in function parameters: instead of accessing obj.prop inside the function, destructure directly in the signature."}, {"t": "code", "lang": "js", "lines": ["// Array destructuring", "const [a, b] = [1, 2];", "const [first, , third] = [1, 2, 3];  // skip second", "const [head, ...tail] = [1,2,3,4];   // head=1, tail=[2,3,4]", "", "// Swap variables WITHOUT temp variable", "let x = 1, y = 2;", "[x, y] = [y, x]; // x=2, y=1", "", "// Object destructuring", "const { name, age } = user;", "const { name: userName } = user; // rename to userName", "const { role = \"user\" } = user;  // default if undefined", "", "// Nested destructuring", "const { address: { city, country = \"Egypt\" } } = user;", "", "// Destructuring in function params", "function greetUser({ name, role = \"user\", address: { city } = {} }) {", "  return `Hello ${name} (${role}) from ${city}`;", "}", "// Called as: greetUser(user) — clean and self-documenting", "", "// Destructuring in for...of", "for(const { name, price } of products) {", "  console.log(`${name}: ${price}`);", "}", "", "// Swap object keys", "const { a: aa, b: bb } = { a: 1, b: 2 };"]}, {"t": "topic", "text": "Spread & Rest"}, {"t": "p", "text": "Spread (...) expands an iterable into individual elements. Rest (...) collects remaining elements into an array."}, {"t": "p", "text": "The same three dots mean different things depending on context: in a function CALL or array literal, it spreads. In a function DEFINITION or destructuring, it rests/collects."}, {"t": "p", "text": "Critical use case: immutable updates. Spread to create a new copy rather than mutating: {...user, name: \"new name\"}. This is the fundamental pattern for React state updates."}, {"t": "code", "lang": "js", "lines": ["// Spread in array literals", "const a = [1, 2];", "const b = [3, 4];", "const combined = [...a, ...b]; // [1,2,3,4]", "const copy = [...a];           // shallow clone", "", "// Spread in object literals", "const defaults = { theme: \"light\", lang: \"en\" };", "const userPrefs = { lang: \"ar\" };", "const merged = { ...defaults, ...userPrefs };", "// { theme: \"light\", lang: \"ar\" } — later wins", "", "// Immutable update (critical for React state)", "const user = { name: \"Ahmed\", age: 30, role: \"admin\" };", "const updated = { ...user, age: 31 };  // new object, original untouched", "const renamed = { ...user, name: \"Mohamed\" };", "const withExtra = { ...user, address: \"Cairo\" };", "", "// Spread in function calls", "const nums = [3, 1, 4, 1, 5, 9];", "Math.max(...nums); // same as Math.max(3,1,4,1,5,9)", "", "// Rest parameters — collects extras into array", "function sum(first, second, ...rest) {", "  const total = first + second + rest.reduce((a,b)=>a+b, 0);", "  return total;", "}", "sum(1, 2, 3, 4, 5); // first=1, second=2, rest=[3,4,5]", "", "// Rest in destructuring", "const { name, ...everything_else } = user;", "const [head2, ...tail2] = arr;"]}, {"t": "topic", "text": "Error Handling"}, {"t": "p", "text": "Proper error handling is the difference between production code and scripts. JavaScript errors are objects with name, message, and stack properties."}, {"t": "p", "text": "try/catch/finally: try runs the code; catch runs if an error is thrown (with the error as argument); finally ALWAYS runs (use for cleanup like closing connections)."}, {"t": "p", "text": "throw: you can throw any value, but always throw Error objects so you get a stack trace."}, {"t": "p", "text": "Custom error classes: extend Error to create semantic error types. This lets callers distinguish what went wrong and handle different errors differently."}, {"t": "code", "lang": "js", "lines": ["// try/catch/finally", "async function fetchData(url) {", "  let response;", "  try {", "    response = await fetch(url);", "    if(!response.ok) {", "      throw new Error(`HTTP ${response.status}: ${response.statusText}`);", "    }", "    return await response.json();", "  } catch(error) {", "    if(error instanceof TypeError) {", "      // Network error (no internet, CORS, etc.)", "      console.error(\"Network error:\", error.message);", "    } else {", "      // HTTP error or JSON parse error", "      console.error(\"Request failed:\", error.message);", "    }", "    throw error; // re-throw — let caller decide what to do", "  } finally {", "    // Always runs — good for cleanup", "    hideLoadingSpinner();", "  }", "  // Note: finally does NOT suppress re-thrown errors", "  // It runs BEFORE the error propagates up", "}", "", "// Custom error classes", "class ValidationError extends Error {", "  constructor(field, message) {", "    super(message);", "    this.name = \"ValidationError\";", "    this.field = field;", "  }", "  // Usage: throw new ValidationError(\"email\", \"Invalid format\")", "}", "", "class NotFoundError extends Error {", "  constructor(resource, id) {", "    super(`${resource} ${id} not found`);", "    this.name = \"NotFoundError\";", "    this.statusCode = 404;", "  }", "  // Usage: throw new NotFoundError(\"User\", userId)", "  // Express can catch this and return 404 automatically", "  // if your error handler checks error.statusCode", "}"]}, {"t": "callout", "kind": "capstone", "title": "Month 1 Capstone — Personal Portfolio Site", "body": ["Build a fully responsive portfolio website using only HTML, CSS, and vanilla JavaScript.", "Requirements: 4+ sections (hero, about, projects, contact), CSS custom properties for theming, dark/light mode toggle (localStorage persisted), CSS Grid for layout, smooth scroll, contact form with JS validation (no submit if invalid), at least 3 project cards.", "Deploy: GitHub Pages (free). Commit every feature as a separate git commit."]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection — Month 1", "body": ["map/filter/reduce: you will use these constantly to transform NS search results before sending to a MERN frontend.", "Custom errors: the NS error object has name, message, and a code property. Your custom errors should mirror this pattern for consistent handling across your NS integration code.", "CSS Grid: NS SuiteForm layouts are fundamentally a grid system. Understanding CSS Grid makes you better at designing custom NS UI components in Suitelets."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Map, Set, WeakMap"}, {"t": "code", "lang": "js", "lines": ["const seen = new Set([1, 2, 2, 3]);        // {1,2,3} — dedupe idiom", "[...new Set(arr)];", "", "const counts = new Map();                   // any key type, keeps order", "for (const w of words) counts.set(w, (counts.get(w) ?? 0) + 1);", "", "const meta = new WeakMap();                 // keys are objects; entries", "meta.set(domNode, { clicks: 0 });           // vanish when the key is GC'd"]}, {"t": "li", "text": "Map vs plain object: Map for dynamic keys, frequent add/remove, non-string keys, and when you need .size; object for fixed, known shapes."}, {"t": "topic", "text": "Immutability Patterns & Deep Copy"}, {"t": "code", "lang": "js", "lines": ["const next = { ...user, address: { ...user.address, city: \"Cairo\" } }; // shallow×2", "const clone = structuredClone(state);       // real deep copy (handles Dates, Maps)", "// JSON.parse(JSON.stringify(x)) drops Dates, undefined, functions — avoid", "const frozen = Object.freeze(config);       // shallow freeze"]}, {"t": "topic", "text": "Sorting with Comparators"}, {"t": "code", "lang": "js", "lines": ["nums.sort((a, b) => a - b);                          // numeric — default is lexicographic!", "users.toSorted((a, b) => a.name.localeCompare(b.name)); // non-mutating, locale-aware", "orders.sort((a, b) => b.total - a.total || a.id - b.id); // multi-key"]}, {"t": "topic", "text": "Iterators & Generators"}, {"t": "p", "text": "Anything with [Symbol.iterator] works in for...of, spread, and destructuring. Generators build iterators lazily — sequences computed on demand, including infinite ones."}, {"t": "code", "lang": "js", "lines": ["function* range(start, end, step = 1) {", "  for (let i = start; i < end; i += step) yield i;", "}", "[...range(0, 10, 2)];        // [0,2,4,6,8]"]}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["The \"dedupe an array\" and \"count word frequency\" warm-ups are Set/Map one-liners — reach for them instead of nested loops."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 4", "body": ["E1: Implement groupBy, chunk and uniqueBy with reduce only — no loops, no lodash.", "E2: Take a messy API payload (nested, some fields missing) and extract a flat view model using destructuring with defaults and optional chaining.", "E3: Write a safeJsonParse(str, fallback) and a retryable fetch wrapper that distinguishes network errors from HTTP errors.", "E4: Dedupe a 10k-item array two ways — nested includes() vs a Set — and measure both with console.time to feel the O(n²) difference."]}], "week": 4}, {"id": "pg5", "title": "DOM Manipulation & Events", "sub": "Week 5 · Month 2", "blocks": [{"t": "topic", "text": "DOM Selection"}, {"t": "p", "text": "The DOM (Document Object Model) is a tree of objects representing the HTML. JavaScript manipulates it to update the page dynamically."}, {"t": "p", "text": "document.getElementById(\"id\"): fastest selector for ID. Returns one element or null."}, {"t": "p", "text": "document.querySelector(\"selector\"): returns the FIRST element matching any CSS selector. Versatile and preferred."}, {"t": "p", "text": "document.querySelectorAll(\"selector\"): returns a NodeList of ALL matching elements. It is NOT a real array — use Array.from() or spread if you need array methods."}, {"t": "code", "lang": "js", "lines": ["// Selection", "const btn = document.getElementById(\"submit\");", "const form = document.querySelector(\"#login-form\");", "const cards = document.querySelectorAll(\".card\");", "", "// NodeList is NOT an array", "cards.forEach(c => c.classList.add(\"visible\")); // forEach exists on NodeList", "// cards.map(...) // TypeError! Use Array.from first:", "Array.from(cards).map(c => c.getBoundingClientRect());", "", "// Creating and inserting elements", "const li = document.createElement(\"li\");", "li.textContent = \"New item\"; // safe — no XSS risk", "// li.innerHTML = userInput; // DANGEROUS — XSS risk!", "li.className = \"item active\";", "li.dataset.id = \"42\"; // sets data-id=\"42\"", "", "// Inserting", "parent.appendChild(li);           // append at end", "parent.insertBefore(li, sibling); // before a sibling", "parent.prepend(li);               // first child", "parent.append(li, \"text\");        // multiple, including text", "parent.insertAdjacentElement(\"afterend\", li); // many positions", "", "// Removing", "li.remove(); // modern — just call on the element", "parent.removeChild(li); // old way", "", "// Reading and writing", "el.textContent = \"Safe text\";     // safe", "el.innerHTML = sanitizedHTML;      // use only with sanitized content", "el.getAttribute(\"href\");", "el.setAttribute(\"aria-expanded\", \"true\");", "el.removeAttribute(\"disabled\");", "el.classList.toggle(\"active\");     // add if missing, remove if present", "el.classList.toggle(\"open\", true); // force add", "el.style.setProperty(\"--color\", \"red\"); // CSS custom property"]}, {"t": "topic", "text": "Event Listeners & Bubbling"}, {"t": "p", "text": "Events flow through the DOM in three phases: capturing (top to target), at target, bubbling (target to top). Most event listeners use the bubbling phase."}, {"t": "p", "text": "addEventListener(event, handler, options): options include once:true (auto-removes after first call), capture:true (listen during capture phase), passive:true (promise not to call preventDefault — improves scroll performance)."}, {"t": "p", "text": "Event delegation: attach ONE listener to a parent. When an event bubbles up, check event.target to determine which child was clicked. Much better than attaching listeners to each child — works for dynamically added children too."}, {"t": "code", "lang": "js", "lines": ["// addEventListener with options", "document.addEventListener(\"click\", handler, {", "  once: true,    // auto-removes after first call", "  capture: false, // bubbling phase (default)", "  passive: true, // cannot call preventDefault — scroll perf", "});", "", "// Removing listeners — must be the SAME reference", "const handler = (e) => console.log(e.target);", "el.addEventListener(\"click\", handler);", "el.removeEventListener(\"click\", handler); // works", "// el.removeEventListener(\"click\", () => {}); // FAILS — different reference", "", "// Event delegation", "document.querySelector(\"#list\").addEventListener(\"click\", (e) => {", "  // e.target: element clicked", "  // e.currentTarget: element listener is attached to", "  const item = e.target.closest(\".list-item\"); // find ancestor", "  if(!item) return; // not an item click", "  const id = item.dataset.id; // read data attribute", "  deleteItem(id);", "});", "// Works for items added AFTER the listener was set up!", "", "// Common events", "el.addEventListener(\"keydown\", e => {", "  if(e.key === \"Escape\") closeModal();", "  if(e.key === \"Enter\" && e.ctrlKey) submitForm();", "  e.code; // physical key: \"KeyA\", \"Digit1\", \"Space\"", "  e.repeat; // true if key held down", "});", "", "window.addEventListener(\"scroll\", handler, { passive: true });", "", "// Custom events", "const event = new CustomEvent(\"user:login\", {", "  detail: { userId: 42, name: \"Ahmed\" },", "  bubbles: true,", "  cancelable: false,", "});", "document.dispatchEvent(event);", "document.addEventListener(\"user:login\", e => console.log(e.detail));"]}, {"t": "topic", "text": "Promises, Async/Await & the Event Loop"}, {"t": "p", "text": "JavaScript is single-threaded. Long operations (network, disk, timers) are handed off to browser/Node APIs and their callbacks are scheduled in queues."}, {"t": "p", "text": "Task queue (macrotasks): setTimeout, setInterval, fetch (when resolved), DOM events. Processed ONE per event loop turn."}, {"t": "p", "text": "Microtask queue: Promise .then()/.catch(), queueMicrotask(). Processed COMPLETELY before the next macrotask. This means Promise callbacks run before the next setTimeout callback even if setTimeout was scheduled first."}, {"t": "p", "text": "async/await: syntactic sugar over Promises. An async function always returns a Promise. await pauses ONLY the async function — the rest of the program keeps running."}, {"t": "code", "lang": "js", "lines": ["// Event loop demonstration", "console.log(\"1 - sync start\");", "", "setTimeout(() => console.log(\"4 - macrotask\"), 0);", "", "Promise.resolve()", "  .then(() => console.log(\"3 - microtask\"));", "", "console.log(\"2 - sync end\");", "// Output: 1, 2, 3, 4", "// Microtask (Promise) runs before macrotask (setTimeout)", "// even though setTimeout was scheduled first", "", "// async/await is syntactic sugar over Promises", "async function fetchUser(id) {", "  // Same as: return fetch(url).then(r => r.json()).then(data => data)", "  const response = await fetch(`/api/users/${id}`);", "  if(!response.ok) throw new Error(`HTTP ${response.status}`);", "  return response.json();", "}", "", "// Error handling with async/await", "async function loadData() {", "  try {", "    const [users, posts] = await Promise.all([", "      fetchUser(1),", "      fetchPosts(),", "    ]);", "    return { users, posts };", "  } catch(error) {", "    console.error(\"Failed:\", error);", "    return null;", "  }", "  // Note: finally still works with async/await", "}", "", "// Promise combinators", "Promise.all([p1, p2]);       // all succeed or first failure rejects", "Promise.allSettled([p1,p2]); // wait for all, get {status,value/reason}", "Promise.race([p1, p2]);      // first to settle (success or failure)", "Promise.any([p1, p2]);       // first SUCCESS — ignores failures"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Weeks 5–7", "body": ["E1: Accordion — one event listener on parent using delegation. No per-item listeners.", "E2: EventEmitter class: on(event, fn), off(event, fn), emit(event, ...args), once(event, fn).", "E3: API Client class: get/post/put/delete, automatic JSON parsing, auth token injection, AbortController.", "E4: Feature-branch Git workflow: create branch, 3 commits, PR, merge, delete branch."]}, {"t": "callout", "kind": "capstone", "title": "Month 2 Capstone — GitHub User Explorer", "body": ["Debounced search (300ms) with AbortController to cancel stale requests. User card showing avatar, bio, follower/following counts, public repos count. Repo list sorted by stars. Pagination (click-based). localStorage cache with 5-minute TTL.", "All code in ES modules (separate .js files). No framework, no build step. Deployed on Vercel."]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection — Month 2", "body": ["AbortController: NS API calls from Node.js should use AbortController with a timeout. Without it, a slow NS response hangs your server indefinitely.", "Event delegation: NS renders sublists dynamically. If you ever build a custom NS UI (Suitelet/ClientScript), delegation is the correct pattern for sublist row events.", "The event loop: understanding why async/await matters in Node is crucial for NS background scripts (Map/Reduce, Scheduled Scripts) — they all run in a JS runtime with similar event loop constraints."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Event Delegation"}, {"t": "p", "text": "One listener on a parent handles events from any number of children — including ones added later — via bubbling. This is how you handle a 1,000-row table with one listener instead of 1,000."}, {"t": "code", "lang": "js", "lines": ["list.addEventListener(\"click\", e => {", "  const btn = e.target.closest(\"[data-delete]\");", "  if (!btn || !list.contains(btn)) return;", "  removeItem(btn.dataset.delete);", "});"]}, {"t": "topic", "text": "fetch, AbortController & Error Handling"}, {"t": "code", "lang": "js", "lines": ["const ctrl = new AbortController();", "setTimeout(() => ctrl.abort(), 5000);              // timeout pattern", "try {", "  const res = await fetch(\"/api/users\", { signal: ctrl.signal });", "  if (!res.ok) throw new Error(`HTTP ${res.status}`); // fetch does NOT reject on 404/500!", "  const data = await res.json();", "} catch (err) {", "  if (err.name === \"AbortError\") console.log(\"cancelled\");", "  else showError(err);", "}"]}, {"t": "li", "text": "fetch rejects only on network failure — always check res.ok. POST JSON needs headers: {\"Content-Type\": \"application/json\"} an
