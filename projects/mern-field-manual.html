d body: JSON.stringify(payload)."}, {"t": "topic", "text": "Forms & FormData"}, {"t": "code", "lang": "js", "lines": ["form.addEventListener(\"submit\", async e => {", "  e.preventDefault();", "  const data = Object.fromEntries(new FormData(form)); // {name: \"...\", email: \"...\"}", "  await fetch(\"/api/signup\", { method: \"POST\",", "    headers: { \"Content-Type\": \"application/json\" },", "    body: JSON.stringify(data) });", "});"]}, {"t": "topic", "text": "Debounce & Throttle — implement them once"}, {"t": "code", "lang": "js", "lines": ["const debounce = (fn, ms) => {           // run after input pauses (search boxes)", "  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };", "};", "const throttle = (fn, ms) => {           // run at most every ms (scroll, resize)", "  let last = 0; return (...a) => {", "    const now = Date.now();", "    if (now - last >= ms) { last = now; fn(...a); }", "  };", "};"]}, {"t": "topic", "text": "IntersectionObserver"}, {"t": "p", "text": "The modern way to do lazy loading, infinite scroll, and \"animate when visible\" — no scroll listeners, no layout thrash."}, {"t": "code", "lang": "js", "lines": ["const io = new IntersectionObserver(entries => {", "  entries.forEach(e => e.isIntersecting && loadMore());", "}, { rootMargin: \"200px\" });", "io.observe(document.querySelector(\"#sentinel\"));"]}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Writing debounce from memory is a rite-of-passage question; delegation and \"why didn't fetch throw on 500\" are close behind."]}], "week": 5}, {"id": "pg6", "title": "Node.js Core — Runtime & Built-in Modules", "sub": "Week 9 · Month 3", "blocks": [{"t": "topic", "text": "What Node.js Actually Is"}, {"t": "p", "text": "Node.js is not a programming language. It is a runtime environment that allows JavaScript to run outside the browser."}, {"t": "p", "text": "Node bundles: V8 (Google's JS engine, same as Chrome), libuv (C library providing the event loop, async I/O, thread pool), and a set of built-in JavaScript modules (fs, http, path, etc.)."}, {"t": "p", "text": "The event loop in Node has 6 phases: timers (setTimeout/setInterval), pending I/O callbacks, idle/prepare (internal), poll (new I/O — where most time is spent), check (setImmediate), close callbacks."}, {"t": "p", "text": "Node is single-threaded for JS but uses a thread pool (libuv) for I/O operations. This is why Node can handle thousands of concurrent connections without blocking."}, {"t": "code", "lang": "js", "lines": ["// Node version and info", "process.version;      // e.g. \"v20.11.0\"", "process.platform;     // \"linux\", \"darwin\", \"win32\"", "process.arch;         // \"x64\", \"arm64\"", "process.env.NODE_ENV; // \"development\", \"production\"", "process.env.PORT;     // custom env var", "process.argv;         // [\"node\", \"script.js\", ...args]", "process.cwd();        // current working directory", "process.exit(0);      // 0 = success, 1 = error", "process.memoryUsage(); // { rss, heapTotal, heapUsed, external }", "", "// Environment variable pattern", "const port = process.env.PORT || 3000;", "const isDev = process.env.NODE_ENV === \"development\";"]}, {"t": "topic", "text": "The fs/promises Module"}, {"t": "p", "text": "The fs module provides file system operations. Always use the fs/promises (async) version, never the synchronous versions in production code — synchronous I/O blocks the event loop."}, {"t": "p", "text": "Common operations: readFile (entire file into memory), writeFile (write or overwrite), appendFile, readdir (list directory), stat (file metadata), mkdir, rm."}, {"t": "p", "text": "IMPORTANT: readFile reads the ENTIRE file into memory. For large files (> a few MB), use streams instead."}, {"t": "code", "lang": "js", "lines": ["const fs = require(\"fs/promises\");", "// Or with ESM: import fs from \"fs/promises\";", "", "// Read file", "const content = await fs.readFile(\"data.json\", \"utf-8\");", "const parsed = JSON.parse(content);", "", "// Write file (creates if not exists, overwrites if exists)", "await fs.writeFile(\"output.json\", JSON.stringify(data, null, 2));", "", "// Append", "await fs.appendFile(\"log.txt\", `${new Date().toISOString()} - Event\\n`);", "", "// Read directory", "const files = await fs.readdir(\"./src\");", "// [\"index.js\", \"utils.js\", \"styles.css\"]", "", "// Stat — file metadata", "const stat = await fs.stat(\"file.js\");", "stat.isFile();        // true", "stat.isDirectory();   // false", "stat.size;            // bytes", "stat.mtime;           // last modified Date", "", "// Create directory (recursive creates parent dirs)", "await fs.mkdir(\"./logs/2025/01\", { recursive: true });", "", "// Delete file", "await fs.rm(\"temp.txt\");", "// Delete directory and all contents", "await fs.rm(\"./cache\", { recursive: true, force: true });", "", "// Check if file exists (fs.exists is deprecated — use stat)", "async function exists(path) {", "  try { await fs.access(path); return true; }", "  catch { return false; }", "}"]}, {"t": "callout", "kind": "capstone", "title": "Phase 1 Capstone Deliverables", "body": ["1. Portfolio site: live on GitHub Pages or Vercel. Responsive, dark mode, contact form validation.", "2. GitHub User Explorer: deployed, async, caching, error and loading states.", "3. Node CLI file processor: reads JSON, normalizes data, writes output. On GitHub with README.", "4. GitHub profile: pinned repos, profile README, at least 30 days of contribution history."]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection — Phase 1 Complete", "body": ["After Phase 1 you can read SuiteScript 2.x code fluently. You understand the module system (define()), the async patterns (require callback style), and the error handling.", "Node fs/promises is exactly what you use to build NS CSV import processors: read a CSV with fs.readFile, parse with csv-parser, map/filter/transform the data, then batch-upload to MongoDB or POST to the NS REST API."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "CommonJS vs ES Modules"}, {"t": "code", "lang": "js", "lines": ["// CJS (legacy, still everywhere): synchronous, dynamic", "const fs = require(\"node:fs\");  module.exports = { run };", "// ESM (the default for new code): static, async, tree-shakeable", "import fs from \"node:fs\";       export function run() {}", "// package.json: { \"type\": \"module\" } switches .js files to ESM"]}, {"t": "li", "text": "Interop rules: ESM can import CJS; CJS can require() ESM only from Node 22+. Mixed codebases are the #1 source of \"ERR_REQUIRE_ESM\" pain — pick ESM for anything new."}, {"t": "topic", "text": "EventEmitter — the pattern under everything"}, {"t": "p", "text": "Streams, servers, sockets and process are all EventEmitters. Knowing the API means understanding half of Node's surface."}, {"t": "code", "lang": "js", "lines": ["import { EventEmitter } from \"node:events\";", "class Orders extends EventEmitter {}", "const orders = new Orders();", "orders.on(\"created\", o => sendEmail(o));      // subscribe", "orders.once(\"created\", o => logFirst(o));     // auto-unsubscribe", "orders.emit(\"created\", { id: 1 });            // publish", "orders.off(\"created\", handler);               // cleanup — leaks otherwise"]}, {"t": "topic", "text": "The raw http module (what Express wraps)"}, {"t": "code", "lang": "js", "lines": ["import http from \"node:http\";", "http.createServer((req, res) => {", "  if (req.url === \"/health\") {", "    res.writeHead(200, { \"Content-Type\": \"application/json\" });", "    return res.end(JSON.stringify({ ok: true }));", "  }", "  res.writeHead(404).end();", "}).listen(3000);", "// Express = this + routing + middleware + helpers"]}, {"t": "topic", "text": "path, os, url — the utility belt"}, {"t": "code", "lang": "js", "lines": ["import path from \"node:path\";", "path.join(import.meta.dirname, \"uploads\", file);  // safe cross-OS paths", "path.extname(\"report.pdf\");                        // \".pdf\"", "new URL(req.url, \"http://x\").searchParams.get(\"page\");"]}, {"t": "topic", "text": "Environment & npm scripts"}, {"t": "li", "text": "Config lives in process.env, loaded via node --env-file=.env (or dotenv). Validate required vars at boot and crash early if missing."}, {"t": "li", "text": "npm scripts are the project's command palette: \"dev\": \"node --watch server.js\", \"test\": \"node --test\", \"start\": \"node server.js\". pre/post prefixes chain automatically (pretest runs before test)."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["\"Explain CJS vs ESM\" and \"what is an EventEmitter\" are the two most common Node fundamentals questions after the event loop itself."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 9", "body": ["E1: Build a CLI that reads a directory, filters by extension, and writes a JSON report — fs/promises + path only.", "E2: Write the same tiny API twice: once with the raw http module, once with Express. List exactly what Express gave you.", "E3: Create an EventEmitter-based job runner: emit start/progress/done/error, and prove off() prevents a listener leak.", "E4: Convert one CommonJS project to ESM; document every error you hit and its fix."]}], "week": 9}], "monthList": [{"n": 1, "title": "HTML/CSS & JavaScript Part 1", "goal": "Write 20+ functions from memory. Deploy a styled, responsive webpage."}, {"n": 2, "title": "JavaScript Deeply + Git & Tooling", "goal": "Master async JS, DOM events, modules, and professional Git workflow."}, {"n": 3, "title": "Node.js Introduction & First Deployment", "goal": "Run JavaScript on the server. Understand npm. Ship your first backend code."}]}, {"id": "phase2", "n": 2, "months": "4–7", "title": "Core MERN: React, Express, MongoDB & Full-Stack Integration", "tagline": "Learn each letter of the MERN stack in depth. Wire them into deployed, production-quality apps.", "intro": "", "pages": [{"id": "pg7", "title": "JSX, Components & Props", "sub": "Week 13 · Month 4", "blocks": [{"t": "topic", "text": "Why React Exists — The Problem It Solves"}, {"t": "p", "text": "Before React, building interactive UIs meant manually tracking which DOM elements needed updating when data changed. As apps grew, this became impossible to maintain."}, {"t": "p", "text": "React's core idea: describe what the UI should look like for a given state, and let React figure out the minimal DOM changes needed. This is called declarative programming."}, {"t": "p", "text": "The Virtual DOM: React keeps a lightweight copy of the DOM in memory. When state changes, React re-renders the component to a new virtual DOM, diffs it against the previous one, and applies only the changed parts to the real DOM (reconciliation)."}, {"t": "p", "text": "React 18+: concurrent rendering, automatic batching of state updates, Suspense for data fetching. All new React code should use the React 18+ API."}, {"t": "code", "lang": "shell", "lines": ["// Create a new React project with Vite (fastest)", "npm create vite@latest my-app -- --template react", "cd my-app", "npm install", "npm run dev", "", "// JSX is syntactic sugar over React.createElement", "// JSX version", "const el = <h1 className=\"title\">Hello<\/h1>;", "// Compiled to:", "const el2 = React.createElement(\"h1\", { className: \"title\" }, \"Hello\");", "", "// Key JSX rules:", "// 1. className not class (class is a reserved JS word)", "// 2. htmlFor not for (same reason)", "// 3. Self-closing tags must have /> : <br />, <img />, <input />", "// 4. JSX must have ONE root element (or use a Fragment)", "", "// Fragment — avoid wrapper div pollution", "function List() {", "  return (", "    <> {/* shorthand for <React.Fragment> */}", "      <h2>Title<\/h2>", "      <ul>...<\/ul>", "    <\/>", "  );", "}"]}, {"t": "topic", "text": "Functional Components & Props"}, {"t": "p", "text": "A component is a function that returns JSX. Props (properties) are how you pass data INTO a component from its parent."}, {"t": "p", "text": "Props are read-only — a component must never modify its own props. If you need to change data, lift state up to a common ancestor."}, {"t": "p", "text": "Children prop: when you put content between component opening and closing tags, it is available as props.children. This is how layout components work."}, {"t": "p", "text": "Props drilling: passing props through many layers of components. When it becomes painful, context or state management is the solution."}, {"t": "code", "lang": "js", "lines": ["// Basic component with props", "function ProductCard({ name, price, inStock, onAddToCart }) {", "  return (", "    <div className={`card ${inStock ? \"\" : \"out-of-stock\"}`}>", "      <h3>{name}<\/h3>", "      <p>${price.toFixed(2)}<\/p>", "      {inStock && (", "        <button onClick={() => onAddToCart({ name, price })}>", "          Add to Cart", "        <\/button>", "      )}", "      {!inStock && <span>Out of Stock<\/span>}", "    <\/div>", "  );", "}", "", "// Children prop — layout/container pattern", "function Modal({ title, children, onClose }) {", "  return (", "    <div className=\"modal-overlay\" onClick={onClose}>", "      <div className=\"modal\" onClick={e => e.stopPropagation()}>", "        <header>", "          <h2>{title}<\/h2>", "          <button onClick={onClose}>×<\/button>", "        <\/header>", "        <main>{children}<\/main>", "      <\/div>", "    <\/div>", "  );", "}", "", "// Usage", "<Modal title=\"Confirm\" onClose={handleClose}>", "  <p>Are you sure?<\/p>", "  <button onClick={handleConfirm}>Yes<\/button>", "<\/Modal>"]}, {"t": "topic", "text": "useState & State Management"}, {"t": "p", "text": "State is data that belongs to a component and can change over time. When state changes, React re-renders the component."}, {"t": "p", "text": "useState(initialValue): returns [currentValue, setterFunction]. The setter can take a new value OR a function receiving the previous value."}, {"t": "p", "text": "State is a snapshot: when React re-renders, it reads the CURRENT state value. Calling setState does not immediately change the value in the current render — you need to wait for the next render."}, {"t": "p", "text": "Functional update: when the new state depends on the old state, always use the function form: setCount(prev => prev + 1). This prevents stale closure bugs."}, {"t": "code", "lang": "js", "lines": ["import { useState } from \"react\";", "", "function Counter() {", "  const [count, setCount] = useState(0);", "", "  // WRONG — direct mutation (React will not re-render)", "  // count = count + 1; // NEVER DO THIS", "", "  // CORRECT", "  const increment = () => setCount(prev => prev + 1);", "  const reset = () => setCount(0);", "", "  // Object state — always spread to create new object", "  const [user, setUser] = useState({ name: \"\", email: \"\" });", "  const updateName = (name) => setUser(prev => ({ ...prev, name }));", "", "  // Array state — use filter/map to create new arrays", "  const [items, setItems] = useState([]);", "  const addItem = (item) => setItems(prev => [...prev, item]);", "  const removeItem = (id) => setItems(prev => prev.filter(i => i.id !== id));", "  const updateItem = (id, updates) => setItems(prev =>", "    prev.map(i => i.id === id ? { ...i, ...updates } : i)", "  );", "", "  // Lazy initialization — only runs once", "  const [data, setData] = useState(() => {", "    const saved = localStorage.getItem(\"data\");", "    return saved ? JSON.parse(saved) : [];", "  });", "", "  return <button onClick={increment}>{count}<\/button>;", "}"]}, {"t": "topic", "text": "useEffect — Side Effects"}, {"t": "p", "text": "useEffect runs AFTER the render is committed to the DOM. Use it for: fetching data, setting up subscriptions, manipulating the DOM, and cleaning up."}, {"t": "p", "text": "The dependency array controls WHEN the effect runs: [] runs only on mount, [dep1, dep2] runs on mount + whenever dep1 or dep2 changes, no array runs after EVERY render."}, {"t": "p", "text": "Cleanup function: the function you return from useEffect runs BEFORE the next effect runs and on unmount. Use it to cancel fetches, clear timers, remove event listeners."}, {"t": "p", "text": "React StrictMode in development runs effects TWICE to help you find cleanup bugs. If your effect breaks when run twice, you have a missing cleanup."}, {"t": "code", "lang": "js", "lines": ["import { useEffect, useState } from \"react\";", "", "function UserProfile({ userId }) {", "  const [user, setUser] = useState(null);", "  const [loading, setLoading] = useState(true);", "  const [error, setError] = useState(null);", "", "  useEffect(() => {", "    // Cleanup flag to prevent setting state after unmount", "    let cancelled = false;", "", "    setLoading(true);", "    setError(null);", "", "    const controller = new AbortController();", "", "    fetch(`/api/users/${userId}`, { signal: controller.signal })", "      .then(res => {", "        if(!res.ok) throw new Error(`HTTP ${res.status}`);", "        return res.json();", "      })", "      .then(data => {", "        if(!cancelled) setUser(data);", "      })", "      .catch(err => {", "        if(!cancelled && err.name !== \"AbortError\") {", "          setError(err.message);", "        }", "      })", "      .finally(() => {", "        if(!cancelled) setLoading(false);", "      });", "", "    // Cleanup: cancel fetch and prevent state updates", "    return () => {", "      cancelled = true;", "      controller.abort();", "    };", "  }, [userId]); // Re-runs when userId changes", "", "  // Window event listener example", "  useEffect(() => {", "    const handleKey = (e) => { if(e.key===\"Escape\") close(); };", "    window.addEventListener(\"keydown\", handleKey);", "    return () => window.removeEventListener(\"keydown\", handleKey); // cleanup", "  }, []); // [] = only on mount/unmount", "", "  if(loading) return <Spinner />;", "  if(error) return <Error message={error} />;", "  return <div>{user?.name}<\/div>;", "}"]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Month 4", "body": ["E1: ProductCard component — image, name, price, category badge, stock status, add-to-cart button.", "E2: Shopping cart: CartContext with add/remove/updateQty — all state in parent, passed to children.", "E3: Stopwatch: useEffect with setInterval, cleanup on pause and unmount.", "E4: Multi-page blog with React Router v6: Home (post list), Post/:id, About, protected dashboard."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Conditional Rendering Patterns"}, {"t": "code", "lang": "js", "lines": ["{isLoading && <Spinner />}                    // gate", "{error ? <ErrorBox err={error} /> : <List items={items} />}  // branch", "{items.length === 0 && !isLoading && <Empty />}              // empty state", "// Gotcha: {count && <X/>} renders the literal 0 — use {count > 0 && <X/>}"]}, {"t": "topic", "text": "Lists & Keys — why index breaks"}, {"t": "p", "text": "Keys tell React which item is which across renders. With index-as-key, deleting the first row makes every row \"become\" its neighbour — inputs keep the wrong values, animations glitch. Use a stable id; use index only for static, never-reordered lists."}, {"t": "topic", "text": "Controlled vs Uncontrolled Inputs"}, {"t": "code", "lang": "js", "lines": ["// Controlled: React state is the source of truth — validate as you type", "<input value={email} onChange={e => setEmail(e.target.value)} />", "// Uncontrolled: the DOM holds the value — read it on submit", "const ref = useRef();  <input ref={ref} defaultValue=\"hi\" />", "// React 19 tip: with form actions, uncontrolled + FormData is often simpler"]}, {"t": "topic", "text": "Composition with children"}, {"t": "p", "text": "Components that render {children} are React's answer to inheritance — layouts, cards, modals all compose. Passing components as props (slots) scales it further, and moving state down + passing children is also a performance tool: the children prop doesn't re-render when the wrapper's state changes."}, {"t": "code", "lang": "js", "lines": ["function Card({ title, actions, children }) {", "  return <section className=\"card\">", "    <header>{title}{actions}<\/header>", "    {children}", "  <\/section>;", "}", "<Card title=\"Users\" actions={<AddButton/>}><UserTable/><\/Card>"]}, {"t": "topic", "text": "Fragments, Portals & StrictMode"}, {"t": "li", "text": "<>...<\/> groups siblings without a wrapper div (keyed version: <Fragment key={id}>)."}, {"t": "li", "text": "createPortal(child, document.body) renders modals/toasts outside the parent DOM while keeping React context and events — the standard modal technique."}, {"t": "li", "text": "StrictMode double-invokes renders and effects in dev on purpose, to expose impure renders and missing cleanups. It is not a bug; do not remove it."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["\"Why not index as key\" and \"controlled vs uncontrolled\" are the two React screen staples at junior/mid level."]}], "week": 13}, {"id": "pg8", "title": "useContext, useReducer & Custom Hooks", "sub": "Week 17 · Month 5", "blocks": [{"t": "topic", "text": "useContext — Global State Without Prop Drilling"}, {"t": "p", "text": "Context provides a way to pass data through the component tree without manually passing props at every level. Use it for: theme, current user, language/locale, cart data."}, {"t": "p", "text": "createContext(defaultValue): creates a context. The default is only used if a component reads context WITHOUT a matching Provider above it."}, {"t": "p", "text": "Context re-renders: when context value changes, ALL consumers re-render. To avoid unnecessary re-renders, split contexts by update frequency (user data in one context, UI state in another)."}, {"t": "code", "lang": "js", "lines": ["import { createContext, useContext, useState } from \"react\";", "", "// 1. Create", "const AuthContext = createContext(null);", "", "// 2. Provider — wraps the part of the tree that needs the data", "function AuthProvider({ children }) {", "  const [user, setUser] = useState(null);", "", "  const login = async (email, password) => {", "    const data = await api.post(\"/auth/login\", { email, password });", "    setAccessToken(data.accessToken); // in memory only — refresh token is an HttpOnly cookie", "    setUser(data.user);", "  };", "", "  const logout = async () => {", "    setAccessToken(null);", "    await api.post(\"/auth/logout\"); // server clears the refresh cookie", "    setUser(null);", "  };", "", "  const value = { user, login, logout, isAuth: !!user };", "", "  return (", "    <AuthContext.Provider value={value}>", "      {children}", "    <\/AuthContext.Provider>", "  );", "}", "", "// 3. Custom hook — cleaner API, includes null check", "function useAuth() {", "  const ctx = useContext(AuthContext);", "  if(!ctx) throw new Error(\"useAuth must be inside AuthProvider\");", "  return ctx;", "}", "", "// 4. Consume in any descendant", "function Navbar() {", "  const { user, logout } = useAuth();", "  return user ? <button onClick={logout}>Logout {user.name}<\/button> : null;", "}"]}, {"t": "callout", "kind": "warn", "title": "Why not localStorage?", "body": ["This sample originally stored the JWT in localStorage. Any XSS bug can read localStorage, so the token would be stolen with one injected script. The pattern used throughout this guide: keep the short-lived access token in memory (a module variable or state), keep the refresh token in an HttpOnly, Secure, SameSite cookie, and call /auth/refresh on page load to restore the session. See Week 21 — Refresh Token Rotation."]}, {"t": "topic", "text": "useReducer — Complex State Logic"}, {"t": "p", "text": "useReducer is an alternative to useState for complex state that has multiple sub-values or when the next state depends on the previous in complex ways."}, {"t": "p", "text": "Pattern: state + action → new state. The reducer is a PURE function — no side effects, no mutation, always returns a new state object."}, {"t": "p", "text": "When to use useReducer over useState: state has multiple related values that change together; state transitions are complex (many cases); state update logic needs to be testable in isolation."}, {"t": "code", "lang": "js", "lines": ["import { useReducer } from \"react\";", "", "// Reducer — pure function: (state, action) => newState", "function cartReducer(state, action) {", "  switch(action.type) {", "    case \"ADD_ITEM\": {", "      const existing = state.items.find(i => i.id === action.payload.id);", "      if(existing) {", "        return { ...state, items: state.items.map(i =>", "          i.id === action.payload.id ? { ...i, qty: i.qty+1 } : i", "        )};", "      }", "      return { ...state, items: [...state.items, { ...action.payload, qty: 1 }] };", "    }", "    case \"REMOVE_ITEM\":", "      return { ...state, items: state.items.filter(i => i.id !== action.payload) };", "    case \"CLEAR_CART\":", "      return { ...state, items: [] };", "    case \"SET_DISCOUNT\":", "      return { ...state, discount: action.payload };", "    default:", "      throw new Error(`Unknown action: ${action.type}`);", "  }", "}", "", "function Cart() {", "  const [state, dispatch] = useReducer(cartReducer, { items:[], discount:0 });", "", "  const addItem = (product) => dispatch({ type:\"ADD_ITEM\", payload: product });", "  const remove = (id) => dispatch({ type:\"REMOVE_ITEM\", payload: id });", "", "  const total = state.items.reduce((sum, i) => sum + i.price * i.qty, 0);", "  return null; // render UI", "}"]}, {"t": "topic", "text": "Custom Hooks — Extracting and Reusing Stateful Logic"}, {"t": "p", "text": "A custom hook is a function whose name starts with \"use\" that calls other hooks. It lets you extract and share stateful logic between components without adding components to your tree."}, {"t": "p", "text": "Custom hooks do not share state between components — each component that uses a custom hook gets its own isolated state. They only share logic."}, {"t": "p", "text": "Key hooks to build: useFetch (data fetching), useLocalStorage (persistent state), useDebounce (delay value), useWindowSize (viewport dimensions), useMediaQuery (CSS breakpoints), useOnClickOutside (dismiss dropdowns/modals), useIntersectionObserver (infinite scroll, lazy loading)."}, {"t": "code", "lang": "js", "lines": ["// useFetch — data fetching with loading/error states", "function useFetch(url) {", "  const [data, setData] = useState(null);", "  const [loading, setLoading] = useState(true);", "  const [error, setError] = useState(null);", "", "  useEffect(() => {", "    if(!url) return;", "    let cancelled = false;", "    const controller = new AbortController();", "    setLoading(true);", "    fetch(url, { signal: controller.signal })", "      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))", "      .then(d => { if(!cancelled) setData(d); })", "      .catch(e => { if(!cancelled && e.name!==\"AbortError\") setError(e.message); })", "      .finally(() => { if(!cancelled) setLoading(false); });", "    return () => { cancelled=true; controller.abort(); };", "  }, [url]);", "", "  return { data, loading, error };", "}", "", "// useLocalStorage — persistent React state", "function useLocalStorage(key, initialValue) {", "  const [value, setValue] = useState(() => {", "    try {", "      const item = window.localStorage.getItem(key);", "      return item ? JSON.parse(item) : initialValue;", "    } catch { return initialValue; }", "  });", "", "  const setStoredValue = (val) => {", "    const v = val instanceof Function ? val(value) : val;", "    setValue(v);", "    window.localStorage.setItem(key, JSON.stringify(v));", "  };", "", "  return [value, setStoredValue];", "}", "", "// useDebounce — delay a value", "function useDebounce(value, delay = 300) {", "  const [debounced, setDebounced] = useState(value);", "  useEffect(() => {", "    const timer = setTimeout(() => setDebounced(value), delay);", "    return () => clearTimeout(timer);", "  }, [value, delay]);", "  return debounced;", "}", "", "// Usage: const debouncedSearch = useDebounce(searchTerm, 300);", "// Then use debouncedSearch in a useEffect to fetch"]}, {"t": "callout", "kind": "capstone", "title": "Month 5 Capstone — E-Commerce Product Catalog", "body": ["Cart context with useReducer (ADD, REMOVE, UPDATE_QTY, CLEAR), filter sidebar (category, price range), sort (price, name, rating), pagination, lazy-loaded product images.", "All data fetching through useFetch hook. Cart persisted via useLocalStorage. Tailwind CSS for styling. Storybook for Button and ProductCard components. Deployed on Vercel."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "useRef beyond DOM nodes"}, {"t": "code", "lang": "js", "lines": ["const intervalRef = useRef(null);            // mutable box, no re-render", "const latest = useRef(callback);             // \"latest value\" pattern", "useEffect(() => { latest.current = callback; });", "// vs state: changing .current does NOT trigger a render — perfect for", "// timers, previous values, and \"have we mounted\" flags"]}, {"t": "topic", "text": "Error Boundaries"}, {"t": "p", "text": "A render error unmounts the whole tree unless a boundary catches it. Boundaries are still class components (or the react-error-boundary package); they catch render/lifecycle errors below them — not event handlers or async code, which you handle with try/catch."}, {"t": "code", "lang": "js", "lines": ["import { ErrorBoundary } from \"react-error-boundary\";", "<ErrorBoundary fallback={<Oops/>} onError={logToSentry}>", "  <Dashboard />", "<\/ErrorBoundary>"]}, {"t": "topic", "text": "Code Splitting — lazy & Suspense"}, {"t": "code", "lang": "js", "lines": ["const Reports = lazy(() => import(\"./Reports\"));   // separate chunk", "<Suspense fallback={<PageSkeleton/>}>", "  <Reports />", "<\/Suspense>", "// Split on routes first — that alone usually halves the initial bundle"]}, {"t": "topic", "text": "Context performance pitfalls"}, {"t": "li", "text": "Every consumer re-renders when the context value changes — and an inline value={{user, setUser}} object is new every render. Memoise the value, or split contexts (UserContext + UserDispatchContext) so writers don't wake readers."}, {"t": "li", "text": "Context is for low-frequency data (theme, auth, locale). High-frequency shared state belongs in a store (Zustand/Redux) with selector-based subscriptions."}, {"t": "topic", "text": "Custom hook example — useDebouncedValue"}, {"t": "code", "lang": "js", "lines": ["function useDebouncedValue(value, ms = 300) {", "  const [debounced, setDebounced] = useState(value);", "  useEffect(() => {", "    const t = setTimeout(() => setDebounced(value), ms);", "    return () => clearTimeout(t);", "  }, [value, ms]);", "  return debounced;", "}", "// const q = useDebouncedValue(search); useEffect fetches on q"]}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["The context-performance question (\"everything re-renders when I type\") is a favourite mid-level React trap — the split-context answer marks you as experienced."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 17", "body": ["E1: Build an auth context (user, login, logout) and prove with the Profiler that an unmemoised value re-renders every consumer on each keystroke — then fix it.", "E2: Rewrite a 5-useState form with useReducer; add an \"undo last change\" action.", "E3: Extract three custom hooks from existing components: useDebouncedValue, useLocalStorage, useFetch (with cleanup/abort).", "E4: Add an error boundary plus a lazy-loaded route with a Suspense skeleton, and verify the chunk splits in the network tab."]}], "week": 17}, {"id": "pg9", "title": "Express.js — Routing, Middleware & Architecture", "sub": "Week 21 · Month 6", "blocks": [{"t": "topic", "text": "Express Application Structure"}, {"t": "p", "text": "Express is a minimal Node.js web framework. It provides routing, middleware, and helpers for building HTTP servers."}, {"t": "p", "text": "Request lifecycle: incoming HTTP request → Express matches route → runs matching middleware in order → route handler runs → sends response."}, {"t": "p", "text": "Middleware: a function with signature (req, res, next). Call next() to pass to the next middleware. Call next(error) to pass to the error handler. If you do not call next() or send a response, the request hangs."}, {"t": "code", "lang": "js", "lines": ["const express = require(\"express\");", "const app = express();", "", "// Global middleware (runs for every request in order)", "app.use(express.json());                    // parse JSON bodies", "app.use(express.urlencoded({ extended:true })); // parse form data", "app.use(require(\"cors\")());                 // allow cross-origin requests", "app.use(require(\"helmet\")());               // security headers", "app.use(require(\"morgan\")(\"dev\"));          // request logging", "", "// Mount router (all /api/users routes in users.router.js)", "app.use(\"/api/users\", require(\"./routes/users.router\"));", "app.use(\"/api/posts\", require(\"./routes/posts.router\"));", "", "// 404 handler — catches unmatched routes", "app.use((req, res) => {", "  res.status(404).json({ success:false, message:\"Route not found\" });", "});", "", "// Global error handler — MUST have 4 params", "app.use((err, req, res, next) => {", "  const status = err.statusCode || 500;", "  res.status(status).json({", "    success: false,", "    message: err.message || \"Internal server error\",", "    ...(process.env.NODE_ENV===\"development\" && { stack: err.stack }),", "  });", "});", "", "app.listen(process.env.PORT || 3000);"]}, {"t": "topic", "text": "REST API Design"}, {"t": "p", "text": "REST (Representational State Transfer) is an architectural style for APIs. A RESTful API uses HTTP verbs to indicate the action and URL paths to identify resources."}, {"t": "p", "text": "HTTP verbs: GET (read, no body, safe and idempotent), POST (create, has body, not idempotent), PUT (replace, has body, idempotent), PATCH (partial update, has body), DELETE (remove, idempotent)."}, {"t": "p", "text": "Status codes: 200 OK, 201 Created (POST success), 204 No Content (DELETE success), 400 Bad Request (invalid input), 401 Unauthorized (not authenticated), 403 Forbidden (authenticated but no permission), 404 Not Found, 409 Conflict (duplicate), 422 Unprocessable Entity (validation failure), 429 Too Many Requests, 500 Internal Server Error."}, {"t": "p", "text": "Resource naming: plural nouns (/users, /posts). Nested resources for relationships (/users/:id/posts). Query params for filtering/sorting/pagination (/posts?category=tech&page=2&limit=20&sort=-createdAt)."}, {"t": "code", "lang": "js", "lines": ["// users.router.js", "const router = require(\"express\").Router();", "const { protect, adminOnly } = require(\"../middleware/auth\");", "const usersController = require(\"../controllers/users.controller\");", "", "// Public", "router.get(\"/\", usersController.list);", "router.post(\"/\", usersController.create);", "", "// Protected — requires valid JWT", "router.get(\"/me\", protect, usersController.getMe);", "router.patch(\"/me\", protect, usersController.updateMe);", "", "// Admin only", "router.get(\"/:id\", protect, adminOnly, usersController.getById);", "router.delete(\"/:id\", protect, adminOnly, usersController.delete);", "", "module.exports = router;", "", "// Controller pattern (business logic separate from routes)", "// controllers/users.controller.js", "exports.list = async (req, res, next) => {", "  try {", "    const { page=1, limit=20, sort=\"createdAt\" } = req.query;", "    const users = await UserService.list({ page, limit, sort });", "    res.json({ success:true, count:users.length, data:users });", "  } catch(err) { next(err); } // pass to global error handler", "};"]}, {"t": "topic", "text": "JWT Authentication"}, {"t": "p", "text": "JSON Web Token (JWT) is a compact, URL-safe token format for transmitting claims between parties. A JWT has three parts separated by dots: Header.Payload.Signature."}, {"t": "p", "text": "Header: base64-encoded JSON with algorithm (typically HS256 or RS256) and type (JWT)."}, {"t": "p", "text": "Payload: base64-encoded JSON with claims — standard claims like sub (subject/user ID), exp (expiration), iat (issued at), and custom claims like role."}, {"t": "p", "text": "Signature: HMAC of header + payload using a secret key. Only the server with the secret can verify it. The payload is NOT encrypted — do not put sensitive data in it."}, {"t": "p", "text": "Flow: login → server verifies password → server signs JWT with secret → client stores JWT → client sends JWT in Authorization header on every subsequent request → server verifies signature and extracts claims."}, {"t": "code", "lang": "js", "lines": ["const jwt = require(\"jsonwebtoken\");", "const bcrypt = require(\"bcryptjs\");", "", "// Register", "exports.register = async (req, res, next) => {", "  try {", "    const { name, email, password } = req.body;", "    if(await User.findOne({ email })) {", "      return res.status(409).json({ message:\"Email already taken\" });", "    }", "    const hash = await bcrypt.hash(password, 12);", "    const user = await User.create({ name, email, passwordHash:hash });", "    const token = signToken(user._id);", "    res.status(201).json({ success:true, token, user: sanitize(user) });", "  } catch(err) { next(err); }", "};", "", "// Sign token helper", "function signToken(id) {", "  return jwt.sign({ id }, process.env.JWT_SECRET, {", "    expiresIn: process.env.JWT_EXPIRES || \"15m\",", "  });", "}", "", "// Protect middleware", "exports.protect = async (req, res, next) => {", "  try {", "    const auth = req.headers.authorization;", "    if(!auth?.startsWith(\"Bearer \")) {", "      return res.status(401).json({ message:\"Not authenticated\" });", "    }", "    const token = auth.split(\" \")[1];", "    const decoded = jwt.verify(token, process.env.JWT_SECRET, { algorithms: [\"HS256\"] });", "    const user = await User.findById(decoded.id).select(\"-passwordHash\");", "    if(!user) return res.status(401).json({ message:\"User not found\" });", "    req.user = user;", "    next();", "  } catch(err) {", "    if(err.name===\"TokenExpiredError\") {", "      return res.status(401).json({ message:\"Token expired\" });", "    }", "    next(err);", "  }", "};"]}, {"t": "callout", "kind": "tip", "title": "Why pin algorithms?", "body": ["Passing { algorithms: [\"HS256\"] } to jwt.verify makes the server reject tokens signed with any other algorithm. Without it, misconfigured setups have historically been tricked into accepting forged tokens (the \"alg: none\" and RS256→HS256 confusion attacks). Always pin the algorithm you sign with — and use RS256/ES256 with a public key when other services must verify tokens they cannot sign."]}, {"t": "callout", "kind": "capstone", "title": "Month 6 Capstone — Task Manager REST API", "body": ["Full CRUD for tasks (user-scoped — users only see their own). JWT register/login. Zod validation on all inputs. Rate limiting (5 login attempts per 15 min). File attachments via Cloudinary. Global error handler. 80%+ test coverage with Jest + Supertest + mongodb-memory-server. Deployed on Render."]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection — Express", "body": ["Express Router structure mirrors NS RESTlet structure exactly: one file per resource, handlers for GET/POST/PUT/DELETE. Your NS RESTlet architecture knowledge translates 1:1.", "JWT roles map to NS roles: admin role gets broader access, just as NS Administrator role has access regular employees do not. Your role-based middleware is conceptually identical to NS permission checking."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Input Validation with Zod"}, {"t": "code", "lang": "js", "lines": ["import { z } from \"zod\";", "const CreateUser = z.object({", "  email: z.string().email(),", "  password: z.string().min(8),", "  age: z.coerce.number().int().min(13).optional(),", "});", "const validate = schema => (req, res, next) => {", "  const result = schema.safeParse(req.body);", "  if (!result.success)", "    return res.status(400).json({ errors: result.error.flatten().fieldErrors });", "  req.body = result.data;            // typed + stripped of unknown keys", "  next();", "};", "app.post(\"/users\", validate(CreateUser), createUser);"]}, {"t": "topic", "text": "Refresh Token Rotation"}, {"t": "p", "text": "Access tokens should be short-lived (15 min); a long-lived refresh token in an HttpOnly cookie mints new ones. Rotation — issuing a new refresh token on every use and revoking the old — turns a stolen token into a one-shot that gets detected on reuse."}, {"t": "li", "text": "Store refresh tokens (hashed) server-side with user + device; on reuse of a revoked token, kill the whole session family."}, {"t": "li", "text": "Cookie flags: HttpOnly (no JS access → XSS-proof), Secure, SameSite=Lax or Strict, Path=/api/auth/refresh."}, {"t": "topic", "text": "Role-Based Access Control middleware"}, {"t": "code", "lang": "js", "lines": ["const requireRole = (...roles) => (req, res, next) =>", "  roles.includes(req.user.role) ? next()", "    : res.status(403).json({ error: \"Forbidden\" });", "app.delete(\"/api/users/:id\", auth, requireRole(\"admin\"), deleteUser);", "// Ownership check pattern: admin OR resource.ownerId === req.user.id"]}, {"t": "topic", "text": "Pagination — offset vs cursor"}, {"t": "code", "lang": "js", "lines": ["// Offset: simple, but page 5000 scans 5000*20 docs and shifts under writes", "const page = await Post.find().sort({_id:-1}).skip(p*20).limit(20);", "// Cursor: stable and O(limit) — encode the last _id as the cursor", "const q = cursor ? { _id: { $lt: cursor } } : {};", "const items = await Post.find(q).sort({ _id: -1 }).limit(21);", "const nextCursor = items.length > 20 ? items[19]._id : null;"]}, {"t": "topic", "text": "File Uploads & CORS, correctly"}, {"t": "li", "text": "multer memoryStorage → validate MIME + size → push to S3/Cloudinary — never save user filenames to disk on the app server (see Chapter I/J for the presigned-URL upgrade)."}, {"t": "li", "text": "CORS: allowlist exact origins, credentials: true only if you use cookies, and remember the preflight — custom headers or JSON content-type trigger an OPTIONS request your API must answer fast."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["\"Where do you store the JWT and why\" (answer: access token in memory, refresh in HttpOnly cookie) is the single most common Express security question."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 21", "body": ["E1: Build a full CRUD resource with layered structure (routes → controller → service → model) and Zod validation middleware returning field-level errors.", "E2: Implement JWT auth with access tokens in memory and refresh tokens in HttpOnly cookies, including rotation and reuse detection.", "E3: Add RBAC: an admin-only delete route and an ownership check that admins bypass.", "E4: Convert an offset-paginated endpoint to cursor pagination and explain the difference in your README."]}], "week": 21}, {"id": "pg10", "title": "MongoDB & Mongoose ODM", "sub": "Week 25 · Month 7", "blocks": [{"t": "topic", "text": "MongoDB Data Model"}, {"t": "p", "text": "MongoDB stores data as BSON (Binary JSON) documents in collections. Unlike SQL, there is no schema enforced at the database level — schema is enforced by your application (via Mongoose)."}, {"t": "p", "text": "Document: a JSON-like object with fields. A document can embed other documents and arrays. Max document size: 16MB."}, {"t": "p", "text": "When to embed vs reference: embed when the embedded data is always accessed together with the parent and will not grow unboundedly. Reference (populate) when the child is accessed independently or the relationship is many-to-many."}, {"t": "code", "lang": "js", "lines": ["// Document example", "// In SQL: Users table + Posts table joined", "// In MongoDB: embed (if few posts per user) or reference (if many)", "", "// Reference approach (most common for many-to-many)", "// users collection", "{ _id: ObjectId(\"...\"), name: \"Ahmed\", email: \"a@b.com\" }", "", "// posts collection", "{ _id: ObjectId(\"...\"), title: \"...\", author: ObjectId(\"...\") /* ref to user */ }", "", "// Mongoose schemas", "const mongoose = require(\"mongoose\");", "", "const userSchema = new mongoose.Schema({", "  name:  { type:String, required:true, trim:true },", "  email: { type:String, required:true, unique:true, lowercase:true },", "  passwordHash: { type:String, required:true, select:false }, // excluded from queries by default", "  role:  { type:String, enum:[\"user\",\"admin\"], default:\"user\" },", "  avatar:{ type:String },", "}, {", "  timestamps: true, // adds createdAt, updatedAt automatically", "});", "", "const postSchema = new mongoose.Schema({", "  title:   { type:String, required:true, minlength:3, maxlength:200 },", "  content: { type:String, required:true },", "  author:  { type:mongoose.Schema.Types.ObjectId, ref:\"User\", required:true },", "  tags:    [{ type:String, lowercase:true, trim:true }],", "  likes:   [{ type:mongoose.Schema.Types.ObjectId, ref:\"User\" }],", "  slug:    { type:String, unique:true, index:true },", "}, { timestamps:true });", "", "// Middleware (hooks)", "// Mongoose 9+: pre hooks are sync or async functions — next() was removed", "postSchema.pre(\"save\", function () {", "  if (this.isModified(\"title\")) {", "    this.slug = this.title.toLowerCase().replace(/\\s+/g, \"-\").replace(/[^\\w-]/g, \"\");", "  }", "});", "", "// Virtuals — computed properties not stored in DB", "postSchema.virtual(\"likeCount\").get(function() {", "  return this.likes.length;", "});", "", "const Post = mongoose.model(\"Post\", postSchema);"]}, {"t": "topic", "text": "Mongoose Queries & Aggregation"}, {"t": "p", "text": "Mongoose wraps the MongoDB driver with a convenient API. Queries are chainable and lazy — they do not execute until you await them or call .exec()."}, {"t": "p", "text": "Populate: replaces an ObjectId reference with the actual document from the referenced collection. Can be nested (populate within populate)."}, {"t": "p", "text": "Aggregation pipeline: a sequence of stages that transform documents. More powerful than find() for complex queries: $match (filter), $group (aggregate), $sort, $limit, $lookup (join), $project (shape output), $unwind (flatten arrays), $facet (multiple pipelines)."}, {"t": "code", "lang": "js", "lines": ["// Basic CRUD", "const post = await Post.create({ title, content, author: req.user._id });", "const posts = await Post.find({ author: userId }).sort(\"-createdAt\").limit(20).lean();", "const post2 = await Post.findById(id).populate(\"author\", \"name avatar\");", "const updated = await Post.findByIdAndUpdate(id, { title:\"New\" }, { new:true, runValidators:true });", "await Post.findByIdAndDelete(id);", "", "// .lean() returns plain JS objects — 2-3x faster for read-only", "// .select() picks fields: .select(\"title createdAt -_id\")", "// .populate() replaces ObjectId with full document", "", "// Populate with selection", "const posts2 = await Post", "  .find()", "  .populate(\"author\", \"name avatar -_id\")", "  .populate(\"comments.user\", \"name\");", "", "// Aggregation pipeline — revenue per category", "const stats = await Product.aggregate([", "  { $match: { active: true } },", "  { $group: {", "      _id: \"$category\",", "      totalRevenue: { $sum: { $multiply: [\"$price\", \"$qtySold\"] } },", "      avgPrice: { $avg: \"$price\" },", "      count: { $sum: 1 },", "  }},", "  { $sort: { totalRevenue: -1 } },", "  { $limit: 10 },", "  { $project: {", "      category: \"$_id\",", "      totalRevenue: { $round: [\"$totalRevenue\", 2] },", "      avgPrice: 1,", "      count: 1,", "      _id: 0,", "  }},", "]);"]}, {"t": "callout", "kind": "capstone", "title": "Phase 2 Capstone — Full-Stack Blog Platform", "body": ["Register/login with JWT, create/edit/delete posts (author-only), rich text (react-quill), image uploads to Cloudinary, comment system, public feed, user profiles, paginated results.", "React frontend on Vercel, Express + MongoDB on Render. Axios interceptors for auth. Full loading/error states. Proper README with screenshots."]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection — Month 7", "body": ["Mongoose schemas = NS record type definitions. Both define structure, validations, and hooks.", "populate() = NS loadRecord() — fetch the full document from a reference.", "Aggregation pipeline = NS saved search formulas, but vastly more powerful. The $lookup stage is JOIN. $group is your NS summary row.", "NS CSV exports come back as messy string arrays. In Month 7 you can now write a proper pipeline: parse CSV → validate with Zod → upsert into MongoDB → return summary."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Schema Design Patterns (beyond embed vs reference)"}, {"t": "li", "text": "Subset pattern: embed the 10 most recent reviews in the product, keep the full history in a reviews collection — one read serves the page."}, {"t": "li", "text": "Computed pattern: store ratingAvg and ratingCount, update with $inc on write — never aggregate on every read."}, {"t": "li", "text": "Bucket pattern: group time-series points into hourly/daily documents ({sensor, hour, readings: []}) — fewer docs, faster ranges."}, {"t": "li", "text": "Outlier pattern: design for the 99% (embedded followers array), flag the celebrities (hasOverflow: true) and spill to a side collection."}, {"t": "topic", "text": "Transactions — when documents aren't enough"}, {"t": "code", "lang": "js", "lines": ["// Money moves atomically or not at all", "const session = await mongoose.startSession();", "await session.withTransaction(async () => {", "  await Account.updateOne({ _id: from, balance: { $gte: amt } },", "                          { $inc: { balance: -amt } }, { session });", "  await Account.updateOne({ _id: to }, { $inc: { balance: amt } }, { session });", "  await Transfer.create([{ from, to, amt }], { session });", "});   // retries transient errors automatically"]}, {"t": "li", "text": "First ask: can a better document design make this a single atomic write? Transactions cost latency; MongoDB rewards designs that rarely need them."}, {"t": "topic", "text": "explain() — reading query plans"}, {"t": "code", "lang": "js", "lines": ["const plan = await Order.find({ userId, status: \"open\" })", "  .sort({ createdAt: -1 }).explain(\"executionStats\");", "// Check: winningPlan uses IXSCAN (not COLLSCAN),", "// totalDocsExamined ≈ nReturned (not 100x it),", "// and no SORT stage (index covers the sort → ESR ordering)"]}, {"t": "topic", "text": "Change Streams"}, {"t": "p", "text": "watch() turns the oplog into an event feed — react to inserts/updates in real time without polling. This is how you sync MongoDB to search indexes, caches, or WebSocket clients."}, {"t": "code", "lang": "js", "lines": ["Order.watch([{ $match: { operationType: \"insert\" } }])", "  .on(\"change\", ({ fullDocument }) => io.to(\"ops\").emit(\"newOrder\", fullDocument));"]}, {"t": "topic", "text": "Migrations & Schema Versioning"}, {"t": "li", "text": "Schemaless ≠ no schema changes. Add schemaVersion to documents, write lazy migrations (upgrade on read) for cheap changes and scripted migrations (migrate-mongo) for breaking ones."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["Naming two schema patterns (subset, bucket) and reading an explain() plan out loud are the clearest \"actually used MongoDB in production\" signals."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 25", "body": ["E1: Model a blog three ways (embedded comments, referenced comments, subset pattern) and write the read query each design requires.", "E2: Write an aggregation producing monthly revenue by category with $group, $lookup and $facet for the total count.", "E3: Run explain(\"executionStats\") on your slowest query; add a compound index using ESR and record docsExamined before/after.", "E4: Implement a money transfer with a transaction, then rewrite it as a single atomic conditional $inc and compare."]}], "week": 25}], "monthList": [{"n": 4, "title": "React.js Fundamentals", "goal": "Think in components. Master state/props/effects. Build 5+ standalone UIs."}, {"n": 5, "title": "React Intermediate — Hooks, Performance & Architecture", "goal": "Context, custom hooks, performance patterns, Tailwind, component design."}, {"n": 6, "title": "Node.js Deep & Express.js", "goal": "Build a production-grade REST API with auth, validation, file uploads, and testing."}, {"n": 7, "title": "MongoDB, Mongoose & Full-Stack Integration", "goal": "Wire React + Express + MongoDB into a live authenticated app."}]}, {"id": "phase3", "n": 3, "months": "8–10", "title": "Advanced: TypeScript, State Management, Testing & DevOps", "tagline": "Close the gap between junior and mid-senior. Performance, types, real testing, Docker, CI/CD.", "intro": "", "pages": [{"id": "pg11", "title": "Redux Toolkit — Modern Redux", "sub": "Week 29 · Month 8", "blocks": [{"t": "topic", "text": "Redux Toolkit — configureStore & createSlice"}, {"t": "p", "text": "Redux Toolkit (RTK) is the official, opinionated way to write Redux. It eliminates the boilerplate of classic Redux."}, {"t": "p", "text": "configureStore: sets up the Redux store with Redux DevTools and redux-thunk middleware automatically. Combine multiple slices."}, {"t": "p", "text": "createSlice: generates action creators and action types from a single object. Uses Immer internally, so you can write \"mutating\" syntax that is actually safe (Immer converts it to a new state object)."}, {"t": "p", "text": "When to use Redux: multiple components across the app need the same frequently-changing data; complex state transitions; need for time-travel debugging; large team where state predictability matters."}, {"t": "code", "lang": "js", "lines": ["// store/index.js", "import { configureStore } from \"@reduxjs/toolkit\";", "import authSlice from \"./auth.slice\";", "import cartSlice from \"./cart.slice\";", "import postsSlice from \"./posts.slice\";", "", "export const store = configureStore({", "  reducer: {", "    auth: authSlice,", "    cart: cartSlice,", "    posts: postsSlice,", "  },", "  // middleware: (getDefault) => getDefault().concat(myMiddleware),", "});", "export type RootState = ReturnType<typeof store.getState>;", "export type AppDispatch = typeof store.dispatch;", "", "// store/auth.slice.js", "import { createSlice, createAsyncThunk } from \"@reduxjs/toolkit\";", "import { api } from \"../lib/api\";", "", "// Async action", "export const loginUser = createAsyncThunk(", "  \"auth/login\",", "  async (credentials, { rejectWithValue }) => {", "    try {", "      const data = await api.post(\"/auth/login\", credentials);", "      setAccessToken(data.accessToken); // in memory only — refresh token is an HttpOnly cookie", "      return data.user;", "    } catch(err) {", "      return rejectWithValue(err.response?.data?.message || \"Login failed\");", "    }", "  }", ");", "", "const authSlice = createSlice({", "  name: \"auth\",", "  initialState: { user: null, loading: false, error: null },", "  reducers: {", "    logout(state) {", "      state.user = null;  // Immer makes this safe", "      setAccessToken(null); await api.post(\"/auth/logout\"); // server clears the cookie", "    },", "    clearError(state) { state.error = null; },", "  },", "  extraReducers: (builder) => {", "    builder", "      .addCase(loginUser.pending,   (s) => { s.loading=true; s.error=null; })", "      .addCase(loginUser.fulfilled, (s,a) => { s.loading=false; s.user=a.payload; })", "      .addCase(loginUser.rejected,  (s,a) => { s.loading=false; s.error=a.payload; });", "  },", "});", "", "export const { logout, clearError } = authSlice.actions;", "export default authSlice.reducer;"]}, {"t": "callout", "kind": "warn", "title": "Why not localStorage?", "body": ["This sample originally stored the JWT in localStorage. Any XSS bug can read localStorage, so the token would be stolen with one injected script. The pattern used throughout this guide: keep the short-lived access token in memory (a module variable or state), keep the refresh token in an HttpOnly, Secure, SameSite cookie, and call /auth/refresh on page load to restore the session. See Week 21 — Refresh Token Rotation."]}, {"t": "topic", "text": "RTK Query — Server State Caching"}, {"t": "p", "text": "RTK Query is a data fetching and caching layer built into Redux Toolkit. It eliminates manual loading/error/data state for API calls."}, {"t": "p", "text": "createApi: define your API once. Each endpoint becomes a hook (useGetPostsQuery, useCreatePostMutation). RTK Query handles caching, invalidation, background refetching, and optimistic updates."}, {"t": "p", "text": "Cache invalidation with tags: when a mutation succeeds, invalidate tags that query endpoints provide. This triggers a refetch of stale data automatically."}, {"t": "code", "lang": "js", "lines": ["import { createApi, fetchBaseQuery } from \"@reduxjs/toolkit/query/react\";", "", "export const postsApi = createApi({", "  reducerPath: \"postsApi\",", "  baseQuery: fetchBaseQuery({", "    baseUrl: \"/api\",", "    prepareHeaders: (headers) => {", "      const token = localStorage.getItem(\"token\");", "      if(token) headers.set(\"Authorization\", `Bearer ${token}`);", "      return headers;", "    },", "  }),", "  tagTypes: [\"Post\", \"User\"],", "", "  endpoints: (builder) => ({", "    // Query — GET /posts", "    getPosts: builder.query({", "      query: ({ page=1, limit=10 } = {}) =>", "        `/posts?page=${page}&limit=${limit}`,", "      providesTags: (result) =>", "        result ? [...result.data.map(p=>({type:\"Post\",id:p._id})), \"Post\"] : [\"Post\"],", "    }),", "", "    // Query — GET /posts/:id", "    getPost: builder.query({", "      query: (id) => `/posts/${id}`,", "      providesTags: (r,e,id) => [{type:\"Post\",id}],", "    }),", "", "    // Mutation — POST /posts", "    createPost: builder.mutation({", "      query: (body) => ({ url:\"/posts\", method:\"POST\", body }),", "      invalidatesTags: [\"Post\"], // triggers refetch of getPosts", "    }),", "", "    // Mutation — DELETE /posts/:id", "    deletePost: builder.mutation({", "      query: (id) => ({ url:`/posts/${id}`, method:\"DELETE\" }),", "      invalidatesTags: (r,e,id) => [{type:\"Post\",id}],", "    }),", "  }),", "});", "", "export const {", "  useGetPostsQuery,", "  useGetPostQuery,", "  useCreatePostMutation,", "  useDeletePostMutation,", "} = postsApi;", "", "// Usage in component", "function PostList() {", "  const { data, isLoading, isError } = useGetPostsQuery({ page:1 });", "  const [deletePost, { isLoading: isDeleting }] = useDeletePostMutation();", "  if(isLoading) return <Spinner/>;", "  if(isError) return <Error/>;", "  return data.data.map(p => (", "    <PostCard key={p._id} post={p} onDelete={() => deletePost(p._id)} />", "  ));", "}"]}, {"t": "topic", "text": "Zustand — Lightweight State"}, {"t": "p", "text": "Zustand is a minimal, flexible state management library. No providers, no reducers, no boilerplate. Just a store and hooks."}, {"t": "p", "text": "Use Zustand for: UI state (sidebar open/closed, modal state, selected tab), simpler global state that does not need Redux DevTools, when you want fast setup."}, {"t": "p", "text": "Zustand middleware: persist (syncs to localStorage/sessionStorage), devtools (Redux DevTools integration), immer (use immer mutation syntax)."}, {"t": "code", "lang": "js", "lines": ["import { create } from \"zustand\";", "import { persist, devtools } from \"zustand/middleware\";", "", "// Simple store", "const useAuthStore = create(", "  devtools(", "    persist(", "      (set, get) => ({", "        user: null,", "        token: null,", "        isAuthenticated: () => !!get().token,", "", "        login: async (credentials) => {", "          const { user, token } = await api.post(\"/auth/login\", credentials);", "          set({ user, token }, false, \"auth/login\"); // action name for DevTools", "        },", "", "        logout: () => {", "          set({ user:null, token:null }, false, \"auth/logout\");", "        },", "", "        updateUser: (updates) => {", "          set(state => ({ user: {...state.user, ...updates} }));", "        },", "      }),", "      {", "        name: \"auth-storage\", // localStorage key", "        partialize: (state) => ({ token: state.token }), // only persist token", "      }", "    )", "  )", ");", "", "// Consume — no Provider needed!", "function Header() {", "  const { user, logout } = useAuthStore();", "  // Select only what you need to avoid re-renders", "  const isAuth = useAuthStore(state => state.isAuthenticated());", "  return isAuth ? <button onClick={logout}>{user.name}<\/button> : null;", "}"]}, {"t": "topic", "text": "TanStack Query (React Query) — Server State"}, {"t": "p", "text": "TanStack Query manages server state: data from an API that lives on a server and needs to be fetched, cached, synchronized, and updated."}, {"t": "p", "text": "Core philosophy: your React state and your server state are fundamentally different. Server state is asynchronous, has cache lifetime, can be stale, and can be updated by other users. Manage them separately."}, {"t": "p", "text": "useQuery: fetches data, manages loading/error/success states, caches the result by queryKey, automatically refetches on window focus."}, {"t": "p", "text": "useMutation: for POST/PUT/PATCH/DELETE. Provides callbacks for optimistic updates, error rollback, and cache invalidation on success."}, {"t": "code", "lang": "js", "lines": ["import { useQuery, useMutation, useQueryClient } from \"@tanstack/react-query\";", "", "// Wrap app in QueryClientProvider", "import { QueryClient, QueryClientProvider } from \"@tanstack/react-query\";", "const queryClient = new QueryClient({", "  defaultOptions: {", "    queries: {", "      staleTime: 5 * 60 * 1000,  // data is fresh for 5 min", "      gcTime: 10 * 60 * 1000,    // keep in cache for 10 min", "      retry: 1,                   // retry failed requests once", "    },", "  },", "});", "// <QueryClientProvider client={queryClient}><App/><\/QueryClientProvider>", "", "// useQuery", "function PostList({ page }) {", "  const { data, isLoading, isError, isFetching } = useQuery({", "    queryKey: [\"posts\", page],   // cache key — must include all variables", "    queryFn: () => api.get(`/posts?page=${page}`),", "    placeholderData: keepPreviousData, // show old data while fetching new", "  });", "  // isFetching: true even when showing cached data (background refetch)", "  // isLoading: true only on first fetch (no cached data yet)", "  return null;", "}", "", "// useMutation with optimistic update", "function LikeButton({ postId }) {", "  const queryClient = useQueryClient();", "", "  const { mutate: likePost } = useMutation({", "    mutationFn: () => api.post(`/posts/${postId}/like`),", "", "    onMutate: async () => {", "      // Cancel in-flight queries for this post", "      await queryClient.cancelQueries({ queryKey: [\"post\", postId] });", "      // Snapshot previous value", "      const previous = queryClient.getQueryData([\"post\", postId]);", "      // Optimistically update cache", "      queryClient.setQueryData([\"post\", postId], (old) => ({", "        ...old, likes: old.likes + 1", "      }));", "      return { previous }; // context for rollback", "    },", "", "    onError: (err, vars, context) => {", "      // Roll back on failure", "      queryClient.setQueryData([\"post\", postId], context.previous);", "    },", "", "    onSettled: () => {", "      // Always refetch to sync with server", "      queryClient.invalidateQueries({ queryKey: [\"post\", postId] });", "    },", "  });", "", "  return <button onClick={likePost}>Like<\/button>;", "}"]}, {"t": "topic", "text": "WebSockets & Socket.io"}, {"t": "p", "text": "WebSocket is a full-duplex communication protocol over a single TCP connection. Unlike HTTP, it stays open — both client and server can send messages at any time."}, {"t": "p", "text": "Socket.io: library that wraps WebSockets with automatic reconnection, rooms, namespaces, and fallback to long-polling for environments that block WebSockets."}, {"t": "p", "text": "Architecture: server emits named events, client listens for them. Client emits named events, server listens. Think of it as a two-way event emitter over the network."}, {"t": "code", "lang": "js", "lines": ["// SERVER (Express + Socket.io)", "const { createServer } = require(\"http\");", "const { Server } = require(\"socket.io\");", "const httpServer = createServer(app);", "const io = new Server(httpServer, {", "  cors: { origin: process.env.CLIENT_URL, credentials: true },", "});", "", "// Auth middleware for sockets", "io.use(async (socket, next) => {", "  try {", "    const token = socket.handshake.auth.token;", "    const decoded = jwt.verify(token, process.env.JWT_SECRET, { algorithms: [\"HS256\"] });", "    socket.userId = decoded.id;", "    socket.user = await User.findById(decoded.id).lean();", "    next();", "  } catch { next(new Error(\"Unauthorized\")); }", "});", "", "io.on(\"connection\", (socket) => {", "  const userId = socket.userId;", "  socket.join(`user:${userId}`);     // personal room", "", "  socket.on(\"join:room\", (roomId) => {", "    socket.join(`room:${roomId}`);", "    socket.to(`room:${roomId}`).emit(\"user:joined\", { user: socket.user });", "  });", "", "  socket.on(\"message:send\", async ({ roomId, text }) => {", "    const msg = await Message.create({ room:roomId, sender:userId, text });", "    const populated = await msg.populate(\"sender\",\"name avatar\");", "    io.to(`room:${roomId}`).emit(\"message:new\", populated); // everyone incl. sender", "  });", "", "  socket.on(\"typing:start\", ({ roomId }) => {", "    socket.to(`room:${roomId}`).emit(\"typing:start\", { user: socket.user });", "  });", "", "  socket.on(\"disconnect\", () => {", "    io.emit(\"user:offline\", { userId });", "  });", "});", "", "// CLIENT (React)", "import { io } from \"socket.io-client\";", "", "function useSocket(token) {", "  const [socket, setSocket] = useState(null);", "", "  useEffect(() => {", "    const s = io(process.env.REACT_APP_SERVER_URL, {", "      auth: { token },", "      reconnection: true,", "      reconnectionAttempts: 5,", "      reconnectionDelay: 1000,", "    });", "", "    s.on(\"connect\", () => setSocket(s));", "    s.on(\"connect_error\", (err) => console.error(\"Socket error:\", err));", "", "    return () => { s.disconnect(); };  // cleanup on unmount", "  }, [token]);", "", "  return socket;", "}", "", "// In a chat component", "function ChatRoom({ roomId }) {", "  const socket = useSocket(localStorage.getItem(\"token\"));", "  const [messages, setMessages] = useState([]);", "", "  useEffect(() => {", "    if(!socket) return;", "", "    socket.emit(\"join:room\", roomId);", "", "    const onMessage = (msg) => setMessages(prev => [...prev, msg]);", "    socket.on(\"message:new\", onMessage);", "", "    return () => {", "      socket.off(\"message:new\", onMessage); // cleanup specific listener", "    };", "  }, [socket, roomId]);", "  return null;", "}"]}, {"t": "callout", "kind": "capstone", "title": "Month 8 Capstone — Real-Time Chat Application", "body": ["Rooms (join, leave, message history loaded from MongoDB on join). Online presence (show who is connected). Typing indicators (debounced emit, show \"X is typing...\"). Message persistence in MongoDB.", "Redux Toolkit or Zustand for client state. Socket.io for real-time. JWT auth on socket connection. Fully deployed."]}, {"t": "callout", "kind": "netsuite", "title": "NetSuite Connection — Month 8", "body": ["Real-time NS dashboards showing live open orders, inventory updates, or approvals are premium offerings. Socket.io + NS webhooks is a combination almost no NS consultant can currently provide.", "The TanStack Query stale-time concept matches NS record caching: frequently-read records (customers, items) can be cached and invalidated on mutation."]}, {"t": "subhead", "text": "Extended topics — added by this guide"}, {"t": "topic", "text": "Choosing a State Tool — the decision table"}, {"t": "table", "rows": [["State kind", "Right tool"], ["Local UI (inputs, toggles)", "useState / useReducer"], ["Server data (lists, entities)", "TanStack Query or RTK Query — cache, not state"], ["Global client state (auth user, theme, cart)", "Zustand or Redux Toolkit"], ["Form state", "react-hook-form (+ zod resolver)"], ["URL state (filters, tabs, page)", "searchParams — shareable and back-button-friendly"]]}, {"t": "p", "text": "The senior insight interviewers listen for: server cache and client state are different problems. Most \"Redux misery\" was using client-state tools to cache server data — Query libraries solved that category."}, {"t": "topic", "text": "Optimistic Updates with TanStack Query"}, {"t": "code", "lang": "js", "lines": ["const qc = useQueryClient();", "const like = useMutation({", "  mutationFn: id => api.like(id),", "  onMutate: async id => {", "    await qc.cancelQueries({ queryKey: [\"posts\"] });", "    const prev = qc.getQueryData([\"posts\"]);", "    qc.setQueryData([\"posts\"], old =>", "      old.map(p => p.id === id ? { ...p, likes: p.likes + 1 } : p));", "    return { prev };                                  // rollback context", "  },", "  onError: (_e, _id, ctx) => qc.setQueryData([\"posts\"], ctx.prev),", "  onSettled: () => qc.invalidateQueries({ queryKey: [\"posts\"] }),", "});"]}, {"t": "topic", "text": "Normalised Client State"}, {"t": "p", "text": "Store entities as { byId: {}, allIds: [] } (RTK's createEntityAdapter does this) — updates touch one object instead of mapping arrays, and no component holds stale copies of the same user."}, {"t": "topic", "text": "Socket.io — auth, rooms & reconnect"}, {"t": "code", "lang": "js", "lines": ["// server", "io.use(async (socket, next) => {                     // handshake auth", "  try { socket.user = await verifyJWT(socket.handshake.auth.token); next(); }", "  catch { next(new Error(\"unauthorized\")); }", "});", "io.on(\"connection\", s => {", "  s.join(`user:${s.user.id}`);                       // private room", "  s.on(\"msg\", data => io.to(`conv:${data.convId}`).emit(\"msg\", data));", "});", "// scale to 2+ nodes: io.adapter(createAdapter(redisPub, redisSub))"]}, {"t": "li", "text": "Client reconnect is automatic, but missed events are not — on \"connect\", re-fetch deltas since the last known timestamp (same pattern as the chat design in System Design Walkthroughs)."}, {"t": "callout", "kind": "tip", "title": "Interview relevance", "body": ["The decision table IS the answer to \"Redux or Context or Query?\" — draw it and you've answered every variant of the question."]}, {"t": "callout", "kind": "exercise", "title": "Exercises for Week 29", "body": ["E1: Build the same todo feature three times — useState, Zustand, RTK — and write a paragraph on which fits and why.", "E2: Replace hand-rolled useEffect fetching with TanStack Query; add optimistic updates with rollback on error.", "E3: Move filters and pagination into the URL (searchParams) so the state survives refresh and back-button.", "E4: Add a Socket.io live feed with JWT handshake auth and per-user rooms; verify reconnect re-syncs missed events."]}], "week": 29}, {"id": "pg12", "title": "TypeScript Fundamentals", "sub": "Week 33 · Month 9", "blocks": [{"t": "topic", "text": "Types, Interfaces & Generics"}, {"t": "p", "text": "TypeScript adds a static type system on top of JavaScript. Types are erased at compile time — the output is plain JavaScript."}, {"t": "p", "text": "type vs interface: both describe the shape of an object. Prefer interface for object shapes (it is extendable with extends). Use type for unions, intersections, and computed types."}, {"t": "p", "text": "Generics: parameterize types just like function parameters. <T> is a placeholder that gets replaced with a real type when the generic is used. This enables reusable, type-safe functions and data structures."}, {"t": "p", "text": "Utility types: TypeScript ships with built-in type transformers. Partial<T> (all fields optional), Required<T>, Readonly<T>, Pick<T,Keys>, Omit<T,Keys>, Record<Keys,Value>, ReturnType<Fn>, Parameters<Fn>, Awaited<T>."}, {"t": "code", "lang": "js", "lines": ["// Primitive types", "let name: string = \"Ahmed\";", "let age: number = 30;", "let active: boolean = true;", "let nothing: null = null;", "let missing: undefined = undefined;", "", "// Arrays", "let scores: number[] = [1,2,3];", "let tags: Array<string> = [\"ts\",\"js\"];", "", "// Union types", "let id: string | number = \"abc\";", "id = 42; // also valid", "", "type Status = \"pending\" | \"active\" | \"closed\"; // string literal union", "", "// Interface — extendable", "interface IUser {", "  readonly _id: string; // cannot reassign after creation", "  name: string;", "  email: string;", "  role: \"user\" | \"admin\";", "  address?: { // optional nested", "    city: string;", "    country: string;", "  };", "}", "", "// Extend interface", "interface IAdminUser extends IUser {", "  permissions: string[];", "  lastLogin: Date;", "}", "", "// Generics", "function identity<T>(value: T): T { return value; }", "identity<string>(\"hello\"); // T = string", "identity(42);              // T inferred as number", "", "// Generic interface", "interface ApiResponse<T> {", "  success: boolean;", "  data: T;", "  message?: string;", "  count?: number;", "}", "", "// Generic function", "async function fetchData<T>(url: string): Promise<ApiResponse<T>> {", "  const res = await fetch(url);", "  return res.json();", "}", "", "// Utility types in practice", "type CreateUserDTO = Omit<IUser, \"_id\" | \"role\">; // for POST body", "type UpdateUserDTO = Partial<Omit<IUser, \"_id\">>;  // for PATCH body", "type PublicUser = Pick<IUser, \"_id\" | \"name\" | \"role\">; // safe to expose", "", "// Record — key-value map with typed values", "type CategoryTotals = Record<string, number>;", "// { electronics: 4200, furniture: 890 }", "", "// ReturnType — extract return type of a function", "type UserFromDB = ReturnType<typeof UserModel.findById>;", "", "// Conditional types", "type IsArray<T> = T extends any[] ? true : false;", "type A = IsArray<string[]>; // true", "type B = IsArray<string>;   // false", "", "// Template literal types", "type EventName = `on${Capitalize<string>}`;", "type CSSProperty = `${string}-${string}`;"]}, {"t": "topic", "text": "TypeScript with React"}, {"t": "p", "text": "Typing React components makes refactoring safe — TypeScript tells you immediately when you change a prop that is used in child components."}, {"t": "p", "text": "FC<Props>: React.FC<Props> or just (props: Props) => JSX.Element. The explicit annotation is preferred for clarity."}, {"t": "p", "text": "Event types: React provides typed event objects. React.ChangeEvent<HTMLInputElement>, React.FormEvent<HTMLFormElement>, React.MouseEvent<HTMLButtonElement>."}, {"t": "p", "text": "useRef: must specify the element type. useRef<HTMLInputElement>(null) for DOM refs. useRef<number>(0) for mutable values."}, {"t": "code", "lang": "js", "lines": ["import { useState, useRef, useCallback } from \"react\";", "import type { FC, ReactNode, ChangeEvent, FormEvent, KeyboardEvent } from \"react\";", "", "// Props interface", "interface ButtonProps {", "  children: ReactNode;", "  variant?: \"primary\" | \"secondary\" | \"danger\";", "  size?: \"sm\" | \"md\" | \"lg\";", "  disabled?: boolean;", "  isLoading?: boolean;", "  onClick?: (event: React.MouseEvent<HTMLButtonElement>) => void;", "}", "", "// Typed component", "const Button: FC<ButtonProps> = ({", "  children, variant = \"primary\", size = \"md\",", "  disabled, isLoading, onClick", "}) => {", "  return (", "    <button", "      disabled={disabled || isLoading}", "      onClick={onClick}", "      className={`btn btn-${variant} btn-${size}`}", "    >", "      {isLoading ? <Spinner /> : children}", "    <\/button>", "  );", "};", "", "// Typed form", "interface LoginForm {", "  email: string;", "  password: string;", "}", "", "function LoginPage() {", "  const [form, setForm] = useState<LoginForm>({ email:\"\", password:\"\" });", "  const inputRef = useRef<HTMLInputElement>(null);", "", "  const handleChange = useCallback((e: ChangeEvent<HTMLInputElement>) => {", "    const { name, value } = e.target;", "    setForm(prev => ({ ...prev, [name]: value }));", "  }, []);", "", "  const handleSubmit = async (e: FormEvent<HTMLFormElement>) => {", "    e.preventDefault();", "    await login(form);", "  };", "", "  return (", "    <form onSubmit={handleSubmit}>", "      <input ref={inputRef} name=\"email\" value={form.email} onChange={handleChange} />", "      <input name=\"password\" type=\"password\" value={form.password} onChange={handleChange} />", "      <button type=\"submit\">Login<\/button>", "    <\/form>", "  );", "}"]}, {"t": "topic", "text": "TypeScript with Express & Mongoose"}, {"t": "p", "text": "Extending Express types: the Request interface can be augmented to add custom properties like req.user."}, {"t": "p", "text": "Mongoose with TypeScript: define an interface extending Document, pass it as a generic to the schema and model."}, {"t": "p", "text": "Zod: a TypeScript-first schema validation library. Define validation schemas once and infer TypeScript types from them — the type and validation are always in sync."}, {"t": "code", "lang": "js", "lines": ["// Augment Express Request", "declare global {", "  namespace Express {", "    interface Request {", "      user?: IUser; // added by protect middleware", "    }", "  }", "}", "", "// Typed route handler", "import { Request, Response, NextFunction, RequestHandler } from \"express\";", "", "const getUser: RequestHandler = async (req, res, next) => {", "  try {", "    const user = await User.findById(req.params.id);", "    if(!user) return res.status(404).json({ message:\"Not found\" });", "    res.json(user);", "  } catch(err) { next(err); }", "};", "", "// Mongoose with TypeScript", "import { Schema, model, Document } from \"mongoose\";", "", "interface IPost {", "  title: string;", "  content: string;", "  author: string; // ObjectId reference", "  tags: string[];", "  createdAt: Date;", "  updatedAt: Date;", "}", "", "interface IPostDocument extends IPost, Document {", "  likeCount: number; // virtual", "  toggleLike(userId: string): Promise<void>; // method", "}", "", "const postSchema = new Schema<IPostDocument>({ /* ... */ }, { timestamps:true });", "const Post = model<IPostDocument>(\"Post\", postSchema);", "", "// Zod schema with inferred TypeScript type", "import { z } from \"zod\";", "", "const CreatePostSchema = z.object({", "  title: z.string().min(3).max(200),", "  content: z.string().min(20),", "  tags: z.array(z.string().toLowerCase().trim()).max(5).optional(),", "});", "", "type CreatePostDTO = z.infer<typeof CreatePostSchema>;", "// Exactly equivalent to:", "// { title: string; content: string; tags?: string[] }", "", "// Express middleware using Zod", "const validateBody = (schema: z.ZodSchema) =>", "  (req: Request, res: Response, next: NextFunction) => {", "    const result = schema.safeParse
