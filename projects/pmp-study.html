trends when expectation and scope diverge, that is a change request conversation, not a quiet accommodation 2.5 knowledge transfer explicit vs tacit knowledge explicit — codifiable: documents, procedures, data, drawings. managed with repositories, wikis, templates, document control. tacit — experience, judgement, \"how things really work here\". cannot be written down effectively. transferred through interaction : pairing, shadowing, mentoring, storytelling, communities of practice, work-shadowing, coaching. most exam questions about knowledge transfer are really about tacit knowledge: the answer involves people talking to people , not \"write a document\". managing project knowledge identify knowledge critical to the project — what would hurt if that person left tomorrow? gather it — lessons learned register maintained throughout , not at the end. foster an environment for transfer — psychological safety, time allocated, pairing, communities of practice, knowledge cafés, retrospectives, seminars. lessons learned register (live, during the project) → lessons learned repository (the organisational opa, updated at closure). lessons learned are captured continuously ; capturing them only at the end is a wrong answer. knowledge loss risks: single points of expertise, contractor turnover, team disbanding at closure, undocumented decisions. mitigations: cross-training, pairing, decision logs, documented rationale ( why a choice was made, not just what). 2.6 communication the model sender → encode → transmit (through noise ) → receive → decode → feedback/acknowledge → response. noise = anything that distorts: language, jargon, culture, distraction, technology failure, emotional state, assumptions. feedback loops are how you confirm the message was understood, not just delivered. \"establish a feedback loop\" is an explicit eco enabler. methods method examples use for interactive meetings, calls, video, conversations, stand-ups complex, sensitive, contentious or urgent matters; anything needing shared understanding push email, reports, memos, voicemail, letters distributing information to specific recipients. no guarantee of understanding. pull intranet, wiki, knowledge repository, dashboards, e-learning large volumes, large audiences, self-service if the scenario involves misunderstanding, conflict, or bad news, the answer is almost always interactive . dimensions internal / external formal (reports, contracts, minutes) / informal (chat, corridor conversation, email) vertical (up and down the hierarchy) / horizontal (peer to peer) official / unofficial written / oral verbal / non-verbal (tone, body language — roughly half of the message in face-to-face communication) communications management plan must answer, per stakeholder or group: what information, why , who produces it, who receives it, when/how often , through what medium , in what format and language , with what escalation path and what glossary of terms . include the method for updating the plan itself. channels n(n − 1) / 2 , where n is the number of people. six people = 15 channels. ten people = 45. adding one person to a team of ten adds ten channels. this is why small teams communicate better and why \"add people to fix a late project\" is wrong. meetings have a purpose and an agenda distributed in advance invite only those who need to be there start and finish on time assign action items with owners and dates distribute minutes/decisions promptly the pm facilitates ; in agile, the team runs many of its own events reporting work performance data (raw observations: hours logged, defects found) → work performance information (analysed: cpi, forecast completion) → work performance reports (packaged for a decision-maker: status report, dashboard, briefing). tailor reports to the audience: the sponsor wants exceptions and decisions, the team wants detail, the regulator wants evidence. support governance reporting requirements — an explicit eco enabler. know your reporting cadence, thresholds and escalation triggers. information radiators (agile): big, visible, self-updating displays — task boards, burndowns, impediment lists, cfds. active listening pay attention → withhold judgement → reflect and paraphrase → clarify with questions → summarise → share your view last. when an exam option includes \"listen to understand the concern\", it is usually the right early step. cross-cultural communication be aware of high-context vs low-context cultures, attitudes to hierarchy and disagreement, time orientation, and directness norms. tailor form and channel; never tailor honesty. when in doubt on the exam: ask, do not assume. "}, {"id": "s3", "title": "Part 3 — Process domain (41%)", "html": "<p><em>ECO Tasks: integrated plan and delivery · scope · value-based delivery · resources · procurement · finance · quality · schedule · project status · closure<\/em><\/p>\n<h2 id=\"s3-h1\">3.1 Integration and the project management plan<\/h2>\n<h3>The charter<\/h3>\n<p>The <strong>project charter<\/strong> formally authorises the project's existence and gives the project manager authority to apply organisational resources. Issued by the <strong>sponsor or initiator external to the project<\/strong> — the PM does not sign their own authority into existence, though the PM often drafts it.<\/p>\n<p>Contents: purpose, measurable objectives and success criteria, high-level requirements, high-level description and boundaries, overall risk, summary milestone schedule, preapproved financial resources, key stakeholders, approval requirements, exit criteria, assigned PM and authority level, sponsor name.<\/p>\n<p><strong>Assumption log<\/strong> starts here and runs throughout — assumptions and constraints tracked as they are validated or invalidated. An invalidated assumption is a risk trigger.<\/p>\n<h3>The project management plan<\/h3>\n<p>The integrated plan is the parent document containing:<\/p>\n<p><strong>Subsidiary plans:<\/strong> scope, requirements, schedule, cost, quality, resource, communications, risk, procurement, stakeholder engagement, change management, configuration management.\n<strong>Baselines:<\/strong> scope, schedule, cost (together the <strong>performance measurement baseline<\/strong>).\n<strong>Additional components:<\/strong> development approach, life cycle description, management reviews.<\/p>\n<p><strong>Plan vs documents:<\/strong> the <em>plan<\/em> says how you will manage; <em>project documents<\/em> (registers, logs, estimates) are outputs of doing the work. Changing the plan or a baseline requires approval through change control; updating a document usually does not.<\/p>\n<h3>Progressive elaboration and rolling wave planning<\/h3>\n<ul>\n<li><strong>Progressive elaboration<\/strong> — continuously refining detail as more is known.<\/li>\n<li><strong>Rolling wave planning<\/strong> — plan near-term work in detail and far-term work at a high level; elaborate as you approach it. Perfect for hybrid.<\/li>\n<\/ul>\n<h3>Directing and managing project work<\/h3>\n<p>The PM executes the plan, produces deliverables, manages issues, implements approved changes, and generates work performance data. Outputs include deliverables, work performance data, issue log updates, change requests.<\/p>\n<h3>Monitoring and controlling project work<\/h3>\n<p>Compare actual against plan, forecast, and recommend corrective action (bring future performance in line), preventive action (avoid a future deviation), or defect repair.<\/p>\n<h3>Integrated change control<\/h3>\n<p>Every change follows: <strong>request → log → impact analysis (all constraints) → CCB decision → communicate → implement if approved → update baselines and documents<\/strong>.<\/p>\n<p>Key rules:\n- The PM may have authority to approve minor changes — check the change management plan.\n- A change is not approved because the customer asked loudly.\n- A rejected change is still logged and communicated.\n- Only approved changes are implemented; implementing first and documenting later is a serious error.\n- In agile, backlog reordering within scope is <strong>not<\/strong> a change request; changing the release commitment or budget is.<\/p>\n<h3>Configuration management<\/h3>\n<p>Controls the <em>product's<\/em> characteristics and versions: configuration identification, status accounting, verification and audit. Change control manages <em>changes to the plan and baselines<\/em>; configuration management manages <em>versions of deliverables<\/em>. Both are needed.<\/p>\n<h3>Closing the project or phase<\/h3>\n<ul>\n<li>Confirm all work is complete and all deliverables accepted<\/li>\n<li>Obtain <strong>formal, documented stakeholder approval<\/strong> of completion<\/li>\n<li>Determine and meet the closure criteria<\/li>\n<li><strong>Validate readiness for transition<\/strong> to operations or the next phase — training, documentation, support model, warranty<\/li>\n<li>Close procurements and settle claims<\/li>\n<li>Release resources, finalise financials<\/li>\n<li>Conduct the final retrospective / lessons learned and <strong>update the OPA repository<\/strong><\/li>\n<li>Archive project records<\/li>\n<li>Measure and hand over benefits tracking<\/li>\n<\/ul>\n<p>A cancelled project is still formally closed — with lessons learned captured. That is a common trick question.<\/p>\n<h2 id=\"s3-h2\">3.2 Scope<\/h2>\n<h3>Predictive scope<\/h3>\n<p><strong>Plan scope management → collect requirements → define scope → create WBS → validate scope → control scope.<\/strong><\/p>\n<p><strong>Collect requirements<\/strong> techniques:\n- Interviews, focus groups, facilitated workshops (JAD, QFD, voice of the customer)\n- Brainstorming, nominal group technique, mind mapping, affinity diagrams\n- Questionnaires and surveys, benchmarking\n- Document analysis, observation/job shadowing, prototypes, storyboarding\n- Multicriteria decision analysis, voting (unanimity, majority, plurality), autocratic decision-making<\/p>\n<p><strong>Requirements traceability matrix (RTM)<\/strong> — links each requirement to its origin and to the deliverable, test and business objective that satisfy it. Used to prove nothing was lost and to assess change impact. Frequently the correct answer when a question asks how to verify all requirements are covered.<\/p>\n<p><strong>Requirement types:<\/strong> business, stakeholder, solution (functional and non-functional), transition and readiness, project, quality.<\/p>\n<p><strong>Project scope statement<\/strong> — product scope description, deliverables, acceptance criteria, <strong>exclusions<\/strong>, constraints, assumptions. Exclusions matter: stating what you are <em>not<\/em> doing prevents disputes.<\/p>\n<p><strong>Product scope<\/strong> (features and functions of the product) vs <strong>project scope<\/strong> (the work required to deliver it).<\/p>\n<p><strong>WBS<\/strong> — a deliverable-oriented hierarchical decomposition of the total scope. Rules:\n- <strong>100% rule<\/strong> — the WBS contains 100% of the work, and no more. Anything not in the WBS is out of scope.\n- Decompose to <strong>work packages<\/strong> — small enough to estimate and control reliably (many organisations use an 8–80 hour heuristic, or one reporting period).\n- Below work packages, the team creates <strong>activities<\/strong> (that is the schedule, not the WBS).\n- <strong>Control accounts<\/strong> sit above work packages, where scope, budget and schedule are integrated and performance is measured. A <strong>planning package<\/strong> is a control account with known work but no detailed activities yet.\n- <strong>WBS dictionary<\/strong> — detail for each component: description, assumptions, responsible org, milestones, resources, cost estimates, quality requirements, acceptance criteria.\n- <strong>Scope baseline<\/strong> = scope statement + WBS + WBS dictionary.<\/p>\n<p><strong>Validate scope vs control quality:<\/strong>\n- <strong>Control quality<\/strong> = internal, checks <em>correctness<\/em> against requirements, done first, produces verified deliverables.\n- <strong>Validate scope<\/strong> = external, obtains <em>customer acceptance<\/em>, produces accepted deliverables.\nVerify, then validate. A question about a customer refusing to accept a deliverable is a validate-scope question.<\/p>\n<p><strong>Scope creep<\/strong> = uncontrolled expansion without adjustments to time, cost and resources. <strong>Gold plating<\/strong> = the team adding unrequested extras. Both are failures. Neither is ever the right answer.<\/p>\n<h3>Adaptive scope<\/h3>\n<ul>\n<li><strong>Product backlog<\/strong> — ordered list of everything that might be needed. Owned by the <strong>product owner<\/strong>.<\/li>\n<li><strong>User story:<\/strong> <em>As a [role], I want [capability], so that [benefit].<\/em> Acceptance criteria attached.<\/li>\n<li><strong>INVEST<\/strong> — good stories are Independent, Negotiable, Valuable, Estimable, Small, Testable.<\/li>\n<li><strong>Epics → features → stories → tasks.<\/strong><\/li>\n<li><strong>Backlog refinement (grooming)<\/strong> — ongoing; typically ~10% of team capacity; adds detail, estimates and order.<\/li>\n<li><strong>Definition of Ready<\/strong> — a story is ready to be pulled into an iteration. <strong>Definition of Done<\/strong> — an increment is complete and potentially releasable.<\/li>\n<li><strong>Story maps<\/strong> — organise stories by user journey and release slices.<\/li>\n<li><strong>MVP<\/strong> — smallest release that delivers value and generates learning. <strong>MBI<\/strong> — smallest increment with business value.<\/li>\n<li>Scope is variable and time/cost are fixed — the inverse of the predictive triangle.<\/li>\n<\/ul>\n<h2 id=\"s3-h3\">3.3 Schedule<\/h2>\n<p><strong>Plan schedule management → define activities → sequence activities → estimate durations → develop schedule → control schedule.<\/strong><\/p>\n<h3>Sequencing<\/h3>\n<p><strong>Precedence Diagramming Method (PDM)<\/strong> relationships:\n- <strong>Finish-to-Start (FS)<\/strong> — most common. B starts after A finishes.\n- <strong>Start-to-Start (SS)<\/strong> — B starts after A starts.\n- <strong>Finish-to-Finish (FF)<\/strong> — B finishes after A finishes.\n- <strong>Start-to-Finish (SF)<\/strong> — rare; B finishes after A starts (shift handovers).<\/p>\n<p><strong>Leads<\/strong> accelerate (a negative lag: B starts 3 days before A finishes). <strong>Lags<\/strong> delay (concrete must cure 7 days).<\/p>\n<p><strong>Dependency types:<\/strong>\n- <strong>Mandatory (hard logic)<\/strong> — physically or contractually required\n- <strong>Discretionary (soft logic / preferred logic)<\/strong> — best practice, can be changed (this is what you break when fast-tracking)\n- <strong>External<\/strong> — outside the project (a permit, a vendor delivery)\n- <strong>Internal<\/strong> — inside the project team's control<\/p>\n<h3>Estimating durations<\/h3>\n<ul>\n<li><strong>Analogous<\/strong> — top-down from similar past work; fast, cheap, least accurate; used early<\/li>\n<li><strong>Parametric<\/strong> — statistical relationship (200 m² at 0.5 hours/m² = 100 hours); accurate if the model and data are good<\/li>\n<li><strong>Three-point<\/strong> — accounts for uncertainty (see Part 7)<\/li>\n<li><strong>Bottom-up<\/strong> — sum of detailed estimates; most accurate, most effort<\/li>\n<li><strong>Expert judgement<\/strong>, <strong>reserve analysis<\/strong>, <strong>decision-making (voting/planning poker)<\/strong>, <strong>data analysis (alternatives)<\/strong><\/li>\n<\/ul>\n<p><strong>Law of diminishing returns<\/strong>, <strong>number of resources<\/strong>, <strong>advances in technology<\/strong>, <strong>motivation (student syndrome, Parkinson's law)<\/strong> all influence duration.<\/p>\n<p><strong>Effort vs duration:<\/strong> 40 hours of effort with two people is 20 hours of duration only if the work is divisible and the people are 100% available. They never are.<\/p>\n<h3>Developing the schedule<\/h3>\n<ul>\n<li><strong>Critical path method (CPM)<\/strong> — forward and backward pass to find the longest path and calculate float.<\/li>\n<li><strong>Critical chain method (CCM)<\/strong> — accounts for resource constraints; uses <strong>buffers<\/strong> instead of activity padding: a <strong>project buffer<\/strong> at the end, <strong>feeding buffers<\/strong> where non-critical chains join the critical chain, and <strong>resource buffers<\/strong>.<\/li>\n<li><strong>Resource optimisation:<\/strong><\/li>\n<li><strong>Levelling<\/strong> — adjusts start/finish dates to respect resource limits. <strong>Can change the critical path and usually extends duration.<\/strong><\/li>\n<li><strong>Smoothing<\/strong> — adjusts only within float. <strong>Does not change the critical path.<\/strong><\/li>\n<li><strong>Schedule compression:<\/strong><\/li>\n<li><strong>Crashing<\/strong> — add resources to critical-path activities. <strong>Costs money<\/strong>, may add risk and communication overhead. Crash the cheapest critical activity per unit of time saved.<\/li>\n<li><strong>Fast tracking<\/strong> — perform sequential activities in parallel. <strong>Costs no money but adds risk and rework.<\/strong> Only works on discretionary dependencies.<\/li>\n<li><strong>Schedule baseline<\/strong> — the approved schedule; changes require change control.<\/li>\n<li><strong>Milestone chart<\/strong> for executives, <strong>Gantt/bar chart<\/strong> for the team, <strong>network diagram<\/strong> for logic.<\/li>\n<\/ul>\n<h3>Adaptive scheduling<\/h3>\n<ul>\n<li><strong>Timeboxes / iterations / sprints<\/strong> — fixed duration, never extended.<\/li>\n<li><strong>Release planning<\/strong> — which features in which release, based on velocity.<\/li>\n<li><strong>Iteration planning<\/strong> — what the team commits to this sprint.<\/li>\n<li><strong>Velocity-based forecasting<\/strong> — remaining points ÷ average velocity = sprints remaining.<\/li>\n<li><strong>Cadence<\/strong> — regular rhythm of planning, review, retrospective.<\/li>\n<li><strong>Kanban<\/strong> — no timebox; flow-based, WIP-limited, forecast by cycle time and throughput.<\/li>\n<\/ul>\n<h3>Controlling the schedule<\/h3>\n<ul>\n<li>Compare actual to baseline; use SV and SPI<\/li>\n<li><strong>Schedule variance analysis<\/strong>, <strong>trend analysis<\/strong>, <strong>iteration burndown<\/strong>, <strong>performance reviews<\/strong><\/li>\n<li>Update forecasts; recommend corrective action<\/li>\n<li><strong>Never change the baseline to match reality<\/strong> without approved change control — that is a favourite wrong answer<\/li>\n<\/ul>\n<h2 id=\"s3-h4\">3.4 Cost and finance<\/h2>\n<p><em>Note: \"Plan and manage finance\" is now an explicit Process task with seven enablers. Expect more finance questions than on the old exam.<\/em><\/p>\n<h3>Estimating and budgeting<\/h3>\n<p><strong>Cost types:<\/strong>\n- <strong>Direct<\/strong> (charged only to this project) vs <strong>indirect/overhead<\/strong> (shared)\n- <strong>Variable<\/strong> (scale with work) vs <strong>fixed<\/strong>\n- <strong>Sunk<\/strong> (already spent — irrelevant to the go/no-go decision, always)\n- <strong>Opportunity cost<\/strong> (value of the next best option forgone)\n- <strong>Life-cycle cost / total cost of ownership<\/strong> — includes operations, maintenance and disposal, not just build cost. Increasingly tested alongside sustainability.<\/p>\n<p><strong>Estimate accuracy ranges:<\/strong> Rough Order of Magnitude −25% to +75%; Budget estimate −10% to +25%; Definitive −5% to +10%.<\/p>\n<p><strong>Building the budget:<\/strong>\nActivity estimates → work package estimates → control account estimates → <strong>+ contingency reserve<\/strong> = <strong>cost baseline<\/strong> → <strong>+ management reserve<\/strong> = <strong>budget at completion (BAC)<\/strong> / project funding requirements.<\/p>\n<ul>\n<li><strong>Contingency reserve<\/strong> — for <em>known unknowns<\/em> (identified risks). Inside the baseline. PM controls it.<\/li>\n<li><strong>Management reserve<\/strong> — for <em>unknown unknowns<\/em>. Outside the baseline. Requires management approval to access; when used, it is moved into the baseline via change control.<\/li>\n<\/ul>\n<p><strong>Funding limit reconciliation<\/strong> — smoothing expenditure against periodic funding limits; may require rescheduling work.\n<strong>S-curve<\/strong> — cumulative spend over time.<\/p>\n<h3>Managing finance (ECO task 6 enablers)<\/h3>\n<ul>\n<li><strong>Analyse financial needs<\/strong> — cash flow by period, not just total cost<\/li>\n<li><strong>Quantify risk and contingency allocations<\/strong> — EMV and Monte Carlo drive the reserve size, not a flat 10%<\/li>\n<li><strong>Plan spend tracking<\/strong> across the life cycle — how often, by whom, against what<\/li>\n<li><strong>Plan financial reporting<\/strong> — format, audience, thresholds<\/li>\n<li><strong>Anticipate future finance challenges<\/strong> — currency movement, inflation, interest rates, funding gates, capital vs operating expenditure treatment<\/li>\n<li><strong>Monitor variations and work with governance<\/strong> — variance thresholds trigger defined escalation<\/li>\n<li><strong>Manage reserves<\/strong> — track consumption; a contingency reserve burning faster than risk is retiring is an early warning<\/li>\n<\/ul>\n<h3>Business case metrics<\/h3>\n<ul>\n<li><strong>NPV<\/strong> — higher is better; accounts for the time value of money; the primary selection criterion<\/li>\n<li><strong>IRR<\/strong> — the rate at which NPV = 0; higher is better<\/li>\n<li><strong>ROI<\/strong> — (benefit − cost) / cost; higher is better<\/li>\n<li><strong>BCR<\/strong> — benefits ÷ costs; above 1 is viable; higher is better<\/li>\n<li><strong>Payback period<\/strong> — shorter is better, but ignores time value and post-payback returns; the weakest criterion<\/li>\n<li><strong>Cost-benefit analysis<\/strong>, <strong>economic value added<\/strong>, <strong>internal rate of return<\/strong><\/li>\n<\/ul>\n<p>If a question gives you NPV and payback period and they conflict, <strong>choose on NPV<\/strong>.<\/p>\n<h2 id=\"s3-h5\">3.5 Quality<\/h2>\n<h3>Concepts<\/h3>\n<ul>\n<li><strong>Quality<\/strong> = the degree to which the deliverable fulfils requirements. <strong>Grade<\/strong> = a category of features. <em>Low quality is always a problem; low grade may be acceptable.<\/em><\/li>\n<li><strong>Precision<\/strong> (consistent, tightly clustered results) vs <strong>accuracy<\/strong> (correct results). You can be precise and wrong.<\/li>\n<li><strong>Prevention over inspection<\/strong> — it is cheaper to build quality in.<\/li>\n<li><strong>Continuous improvement<\/strong> — PDCA (plan-do-check-act), Kaizen, Lean, Six Sigma, TQM.<\/li>\n<li><strong>Management responsibility<\/strong> — quality requires resources; the team alone cannot fix a system problem.<\/li>\n<\/ul>\n<h3>Cost of quality (CoQ)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cost of conformance<\/th>\n<th>Cost of non-conformance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Prevention:<\/strong> training, documenting processes, right equipment, time to do it right<\/td>\n<td><strong>Internal failure:<\/strong> rework, scrap (found by the project)<\/td>\n<\/tr>\n<tr>\n<td><strong>Appraisal:<\/strong> testing, inspection, destructive testing loss<\/td>\n<td><strong>External failure:<\/strong> warranty work, liabilities, lost business, recalls, reputational damage (found by the customer)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Investing in prevention reduces total CoQ. Sustainability costs (waste disposal, emissions remediation) now sit in this analysis explicitly.<\/p>\n<h3>Tools<\/h3>\n<p><strong>Data gathering:<\/strong> checklists, check sheets (tally sheets), statistical sampling, questionnaires.\n<strong>Data analysis:<\/strong> root cause analysis, alternatives analysis, document analysis, process analysis.\n<strong>Data representation:<\/strong>\n- <strong>Cause-and-effect / fishbone / Ishikawa diagram<\/strong> — find root causes across categories (people, process, materials, machines, measurement, environment)\n- <strong>Flowcharts / process maps<\/strong> — show the process, expose handoffs and waste; also used for SIPOC\n- <strong>Histogram<\/strong> — frequency distribution\n- <strong>Pareto diagram<\/strong> — an ordered histogram; the <strong>80/20 rule<\/strong>: most defects come from a few causes. Use it to decide what to fix first.\n- <strong>Scatter diagram<\/strong> — correlation between two variables\n- <strong>Control chart<\/strong> — process stability over time. Know: <strong>upper/lower control limits<\/strong> (usually ±3σ, set by the process) versus <strong>specification limits<\/strong> (set by the customer, must be outside the control limits). <strong>Rule of seven<\/strong> — seven consecutive points on one side of the mean means the process is out of control even if within limits. Any point outside the control limits is out of control.\n- <strong>Run chart<\/strong> — trend over time without control limits<\/p>\n<p><strong>Audits<\/strong> — independent review of whether the project complies with policies and processes. Quality audits identify good practice and gaps and may generate change requests.\n<strong>Design for X (DfX)<\/strong> — optimise for a specific characteristic (cost, reliability, serviceability, <strong>sustainability<\/strong>).\n<strong>Problem solving<\/strong> — define, identify root cause, generate solutions, choose, implement, verify.\n<strong>Quality metrics<\/strong> — defect density, failure rate, availability, reliability, test coverage, on-time performance.<\/p>\n<h3>Standards<\/h3>\n<p>ISO 9000 series (quality management systems), Six Sigma (DMAIC: define, measure, analyse, improve, control), Lean (eliminate the seven wastes), Total Quality Management, Kaizen.<\/p>\n<h3>Regulatory compliance and quality<\/h3>\n<p>\"Help ensure regulatory compliance\" is a quality enabler in the 2026 ECO. Quality planning must incorporate the applicable standards, evidence requirements, inspection regimes and audit trail. Non-compliance is never traded off against schedule.<\/p>\n<h2 id=\"s3-h6\">3.6 Resources<\/h2>\n<h3>Planning<\/h3>\n<ul>\n<li><strong>Resource management plan<\/strong> — identification, acquisition, roles and responsibilities, org charts, training, team development, resource control, recognition.<\/li>\n<li><strong>Resource breakdown structure (RBS)<\/strong> — hierarchical list of resources by category and type. (Careful: RBS is also <em>risk<\/em> breakdown structure. Context decides.)<\/li>\n<li><strong>Responsibility assignment matrix (RAM)<\/strong> / <strong>RACI<\/strong> — Responsible (does the work), Accountable (answerable, <strong>exactly one per row<\/strong>), Consulted (two-way input), Informed (one-way update).<\/li>\n<li><strong>Resource calendars<\/strong> — when each resource is available.<\/li>\n<li><strong>Pre-assignment<\/strong>, <strong>negotiation<\/strong> (with functional managers and other PMs), <strong>acquisition<\/strong>, <strong>virtual teams<\/strong>.<\/li>\n<\/ul>\n<h3>Estimating<\/h3>\n<ul>\n<li>Estimate activity resources: type, quantity and characteristics of people, materials, equipment and supplies<\/li>\n<li><strong>Bottom-up<\/strong>, analogous, parametric, alternatives analysis, published estimating data<\/li>\n<\/ul>\n<h3>Managing physical resources<\/h3>\n<ul>\n<li>Logistics, lead times, storage, inventory, just-in-time, Kanban for materials, supply-chain risk<\/li>\n<li>Sustainability considerations: sourcing, waste, energy, recyclability<\/li>\n<\/ul>\n<h3>Controlling resources<\/h3>\n<ul>\n<li>Compare planned vs actual utilisation<\/li>\n<li><strong>Resource histogram<\/strong> shows over-allocation<\/li>\n<li>Address shortfalls: negotiate, reprioritise, reschedule, outsource, train, escalate as a last resort<\/li>\n<li><strong>Trend analysis<\/strong>, <strong>alternatives analysis<\/strong>, <strong>cost-benefit analysis<\/strong>, <strong>performance reviews<\/strong><\/li>\n<\/ul>\n<h2 id=\"s3-h7\">3.7 Procurement<\/h2>\n<h3>Plan procurements<\/h3>\n<ul>\n<li><strong>Make-or-buy analysis<\/strong> — capability, capacity, cost, risk, strategic importance, confidentiality<\/li>\n<li><strong>Procurement management plan<\/strong> and <strong>procurement strategy<\/strong> — delivery method, contract payment type, procurement phases<\/li>\n<li><strong>Procurement statement of work (SOW)<\/strong> — what is being bought, in enough detail for a seller to price it. <strong>Terms of reference (TOR)<\/strong> for services.<\/li>\n<li><strong>Bid documents:<\/strong> <strong>RFI<\/strong> (information, market research), <strong>RFQ<\/strong> (quotation, price-driven for defined items), <strong>RFP<\/strong> (proposal, for complex or solution-based purchases), IFB/tender<\/li>\n<li><strong>Source selection criteria<\/strong> — capability, capacity, past performance, technical approach, warranty, financial stability, references, <strong>price<\/strong> (never price alone for complex work), and increasingly <strong>sustainability and ESG credentials<\/strong><\/li>\n<li><strong>Independent cost estimates<\/strong> to sanity-check bids<\/li>\n<\/ul>\n<h3>Contract types<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Description<\/th>\n<th>Buyer risk<\/th>\n<th>Seller risk<\/th>\n<th>Use when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>FFP<\/strong> Firm Fixed Price<\/td>\n<td>One price, period<\/td>\n<td>Low<\/td>\n<td>High<\/td>\n<td>Scope is clear and stable<\/td>\n<\/tr>\n<tr>\n<td><strong>FPIF<\/strong> Fixed Price Incentive Fee<\/td>\n<td>Target cost, target fee, share ratio, ceiling price<\/td>\n<td>Low–med<\/td>\n<td>Med<\/td>\n<td>You want a cost-performance incentive<\/td>\n<\/tr>\n<tr>\n<td><strong>FPEPA<\/strong> Fixed Price with Economic Price Adjustment<\/td>\n<td>Price adjusts to a defined index<\/td>\n<td>Low–med<\/td>\n<td>Med<\/td>\n<td>Multi-year, inflation or currency exposure<\/td>\n<\/tr>\n<tr>\n<td><strong>Purchase order<\/strong><\/td>\n<td>Simplest FFP<\/td>\n<td>Low<\/td>\n<td>High<\/td>\n<td>Commodity items<\/td>\n<\/tr>\n<tr>\n<td><strong>CPFF<\/strong> Cost Plus Fixed Fee<\/td>\n<td>Costs reimbursed + a fixed fee<\/td>\n<td>High<\/td>\n<td>Low<\/td>\n<td>Scope uncertain, R&amp;D<\/td>\n<\/tr>\n<tr>\n<td><strong>CPIF<\/strong> Cost Plus Incentive Fee<\/td>\n<td>Costs reimbursed + fee varying with performance, share ratio<\/td>\n<td>High<\/td>\n<td>Low–med<\/td>\n<td>Shared savings/overruns<\/td>\n<\/tr>\n<tr>\n<td><strong>CPAF<\/strong> Cost Plus Award Fee<\/td>\n<td>Costs + a subjective award fee at buyer's discretion<\/td>\n<td>High<\/td>\n<td>Low<\/td>\n<td>Performance is judged qualitatively<\/td>\n<\/tr>\n<tr>\n<td><strong>T&amp;M / unit price<\/strong><\/td>\n<td>Hourly or unit rates, often with a not-to-exceed cap<\/td>\n<td>Med–high<\/td>\n<td>Low<\/td>\n<td>Staff augmentation, urgent or small scope<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Point of total assumption (PTA)<\/strong> applies to FPIF: beyond that cost, the seller absorbs every further dollar.<\/p>\n<h3>Conduct and control procurements<\/h3>\n<ul>\n<li>Bidder conferences (all sellers get the same information at the same time — fairness is mandatory)<\/li>\n<li>Proposal evaluation using weighted criteria<\/li>\n<li><strong>Negotiation strategy<\/strong> — know your objectives, your BATNA (best alternative to a negotiated agreement), your walk-away point, and the other party's interests. Aim for a workable long-term relationship, not a crushed vendor.<\/li>\n<li><strong>Manage suppliers and contracts<\/strong> — performance reviews, inspections, audits, claims administration, payment systems<\/li>\n<li><strong>Evaluate vendor performance<\/strong> against agreed KPIs; a vendor problem is your problem<\/li>\n<li><strong>Claims administration<\/strong> — contested changes. Resolve by negotiation first; then ADR (mediation, arbitration); litigation last.<\/li>\n<li><strong>Close procurements<\/strong> — verify all work is complete and accepted, settle claims, update records, formal written notice of closure<\/li>\n<\/ul>\n<p><strong>Agile procurement:<\/strong> master services agreement with iteration-level appendices; graduated fixed price; fixed-price work packages; capacity-based contracts; incremental delivery contracts; early termination clauses with payment for value delivered.<\/p>\n<h2 id=\"s3-h8\">3.8 Evaluating project status<\/h2>\n<h3>Data to information to report<\/h3>\n<p><strong>Work performance data<\/strong> (raw) → <strong>work performance information<\/strong> (analysed in context) → <strong>work performance reports<\/strong> (communicated artifact).<\/p>\n<p>Example: \"312 hours logged\" is data. \"CPI 0.87, forecast overrun $41k\" is information. \"Amber status, decision needed on scope trade\" is a report.<\/p>\n<h3>Metrics<\/h3>\n<ul>\n<li><strong>Deliverable metrics:<\/strong> defects, performance against specification<\/li>\n<li><strong>Delivery metrics:<\/strong> lead time, cycle time, throughput, WIP, queue size<\/li>\n<li><strong>Baseline performance:<\/strong> SV, SPI, CV, CPI, EAC, VAC, TCPI<\/li>\n<li><strong>Resource metrics:<\/strong> utilisation, cost per unit<\/li>\n<li><strong>Business value metrics:<\/strong> benefits realised, ROI, NPV, net promoter score, customer satisfaction, feature usage<\/li>\n<li><strong>Stakeholder metrics:<\/strong> engagement level, satisfaction, mood charts<\/li>\n<li><strong>Forecast metrics:<\/strong> EAC, ETC, velocity-based forecasts<\/li>\n<\/ul>\n<h3>Pitfalls PMI tests<\/h3>\n<ul>\n<li><strong>Hawthorne effect<\/strong> — measuring something changes behaviour<\/li>\n<li><strong>Vanity metrics<\/strong> — impressive numbers that drive no decision<\/li>\n<li><strong>Misuse of metrics<\/strong> — velocity as a performance target across teams destroys its value<\/li>\n<li><strong>Confirmation bias<\/strong> — reporting only the numbers that support the current narrative<\/li>\n<li>Too many metrics — measure what you will act on<\/li>\n<\/ul>\n<h3>Artifacts<\/h3>\n<p>Identify and <strong>tailor<\/strong> the artifacts the project actually needs; ensure they are created, reviewed, updated, documented and <strong>accessible<\/strong>; continually assess whether artifact management is still effective. Over-documentation is waste; under-documentation is risk.<\/p>\n<h2 id=\"s3-h9\">3.9 Value-based delivery<\/h2>\n<ul>\n<li><strong>Identify value components<\/strong> with key stakeholders — what specifically counts as value here, and how will we know?<\/li>\n<li><strong>Prioritise by value<\/strong> using MoSCoW, WSJF, Kano, cost of delay, value/effort<\/li>\n<li><strong>Deliver incrementally<\/strong> where the increment produces real value, so benefits start early<\/li>\n<li><strong>Examine business value throughout<\/strong> — the business case is a living document. If the market shifts and the value disappears, the right recommendation may be to stop the project.<\/li>\n<li><strong>Verify a measurement system exists<\/strong> before claiming benefits — you cannot report benefits you never instrumented<\/li>\n<li><strong>Evaluate delivery options<\/strong> — pilot, phased rollout, big bang, dark launch, A/B test<\/li>\n<\/ul>\n<p><strong>Cost of delay<\/strong> = the economic loss per unit time of not having the feature. <strong>WSJF<\/strong> = cost of delay ÷ job size. High-value, small items first.<\/p>\n<p><strong>Killing a project<\/strong> is a legitimate and sometimes correct answer. If a question shows the business case no longer holds, escalating a recommendation to terminate is right — you do not keep spending because money is already committed (sunk cost).<\/p>\n<hr />", "subs": [{"t": "3.1 Integration and the project management plan", "a": "s3-h1"}, {"t": "3.2 Scope", "a": "s3-h2"}, {"t": "3.3 Schedule", "a": "s3-h3"}, {"t": "3.4 Cost and finance", "a": "s3-h4"}, {"t": "3.5 Quality", "a": "s3-h5"}, {"t": "3.6 Resources", "a": "s3-h6"}, {"t": "3.7 Procurement", "a": "s3-h7"}, {"t": "3.8 Evaluating project status", "a": "s3-h8"}, {"t": "3.9 Value-based delivery", "a": "s3-h9"}], "text": " eco tasks: integrated plan and delivery · scope · value-based delivery · resources · procurement · finance · quality · schedule · project status · closure 3.1 integration and the project management plan the charter the project charter formally authorises the project's existence and gives the project manager authority to apply organisational resources. issued by the sponsor or initiator external to the project — the pm does not sign their own authority into existence, though the pm often drafts it. contents: purpose, measurable objectives and success criteria, high-level requirements, high-level description and boundaries, overall risk, summary milestone schedule, preapproved financial resources, key stakeholders, approval requirements, exit criteria, assigned pm and authority level, sponsor name. assumption log starts here and runs throughout — assumptions and constraints tracked as they are validated or invalidated. an invalidated assumption is a risk trigger. the project management plan the integrated plan is the parent document containing: subsidiary plans: scope, requirements, schedule, cost, quality, resource, communications, risk, procurement, stakeholder engagement, change management, configuration management. baselines: scope, schedule, cost (together the performance measurement baseline ). additional components: development approach, life cycle description, management reviews. plan vs documents: the plan says how you will manage; project documents (registers, logs, estimates) are outputs of doing the work. changing the plan or a baseline requires approval through change control; updating a document usually does not. progressive elaboration and rolling wave planning progressive elaboration — continuously refining detail as more is known. rolling wave planning — plan near-term work in detail and far-term work at a high level; elaborate as you approach it. perfect for hybrid. directing and managing project work the pm executes the plan, produces deliverables, manages issues, implements approved changes, and generates work performance data. outputs include deliverables, work performance data, issue log updates, change requests. monitoring and controlling project work compare actual against plan, forecast, and recommend corrective action (bring future performance in line), preventive action (avoid a future deviation), or defect repair. integrated change control every change follows: request → log → impact analysis (all constraints) → ccb decision → communicate → implement if approved → update baselines and documents . key rules: - the pm may have authority to approve minor changes — check the change management plan. - a change is not approved because the customer asked loudly. - a rejected change is still logged and communicated. - only approved changes are implemented; implementing first and documenting later is a serious error. - in agile, backlog reordering within scope is not a change request; changing the release commitment or budget is. configuration management controls the product's characteristics and versions: configuration identification, status accounting, verification and audit. change control manages changes to the plan and baselines ; configuration management manages versions of deliverables . both are needed. closing the project or phase confirm all work is complete and all deliverables accepted obtain formal, documented stakeholder approval of completion determine and meet the closure criteria validate readiness for transition to operations or the next phase — training, documentation, support model, warranty close procurements and settle claims release resources, finalise financials conduct the final retrospective / lessons learned and update the opa repository archive project records measure and hand over benefits tracking a cancelled project is still formally closed — with lessons learned captured. that is a common trick question. 3.2 scope predictive scope plan scope management → collect requirements → define scope → create wbs → validate scope → control scope. collect requirements techniques: - interviews, focus groups, facilitated workshops (jad, qfd, voice of the customer) - brainstorming, nominal group technique, mind mapping, affinity diagrams - questionnaires and surveys, benchmarking - document analysis, observation/job shadowing, prototypes, storyboarding - multicriteria decision analysis, voting (unanimity, majority, plurality), autocratic decision-making requirements traceability matrix (rtm) — links each requirement to its origin and to the deliverable, test and business objective that satisfy it. used to prove nothing was lost and to assess change impact. frequently the correct answer when a question asks how to verify all requirements are covered. requirement types: business, stakeholder, solution (functional and non-functional), transition and readiness, project, quality. project scope statement — product scope description, deliverables, acceptance criteria, exclusions , constraints, assumptions. exclusions matter: stating what you are not doing prevents disputes. product scope (features and functions of the product) vs project scope (the work required to deliver it). wbs — a deliverable-oriented hierarchical decomposition of the total scope. rules: - 100% rule — the wbs contains 100% of the work, and no more. anything not in the wbs is out of scope. - decompose to work packages — small enough to estimate and control reliably (many organisations use an 8–80 hour heuristic, or one reporting period). - below work packages, the team creates activities (that is the schedule, not the wbs). - control accounts sit above work packages, where scope, budget and schedule are integrated and performance is measured. a planning package is a control account with known work but no detailed activities yet. - wbs dictionary — detail for each component: description, assumptions, responsible org, milestones, resources, cost estimates, quality requirements, acceptance criteria. - scope baseline = scope statement + wbs + wbs dictionary. validate scope vs control quality: - control quality = internal, checks correctness against requirements, done first, produces verified deliverables. - validate scope = external, obtains customer acceptance , produces accepted deliverables. verify, then validate. a question about a customer refusing to accept a deliverable is a validate-scope question. scope creep = uncontrolled expansion without adjustments to time, cost and resources. gold plating = the team adding unrequested extras. both are failures. neither is ever the right answer. adaptive scope product backlog — ordered list of everything that might be needed. owned by the product owner . user story: as a [role], i want [capability], so that [benefit]. acceptance criteria attached. invest — good stories are independent, negotiable, valuable, estimable, small, testable. epics → features → stories → tasks. backlog refinement (grooming) — ongoing; typically ~10% of team capacity; adds detail, estimates and order. definition of ready — a story is ready to be pulled into an iteration. definition of done — an increment is complete and potentially releasable. story maps — organise stories by user journey and release slices. mvp — smallest release that delivers value and generates learning. mbi — smallest increment with business value. scope is variable and time/cost are fixed — the inverse of the predictive triangle. 3.3 schedule plan schedule management → define activities → sequence activities → estimate durations → develop schedule → control schedule. sequencing precedence diagramming method (pdm) relationships: - finish-to-start (fs) — most common. b starts after a finishes. - start-to-start (ss) — b starts after a starts. - finish-to-finish (ff) — b finishes after a finishes. - start-to-finish (sf) — rare; b finishes after a starts (shift handovers). leads accelerate (a negative lag: b starts 3 days before a finishes). lags delay (concrete must cure 7 days). dependency types: - mandatory (hard logic) — physically or contractually required - discretionary (soft logic / preferred logic) — best practice, can be changed (this is what you break when fast-tracking) - external — outside the project (a permit, a vendor delivery) - internal — inside the project team's control estimating durations analogous — top-down from similar past work; fast, cheap, least accurate; used early parametric — statistical relationship (200 m² at 0.5 hours/m² = 100 hours); accurate if the model and data are good three-point — accounts for uncertainty (see part 7) bottom-up — sum of detailed estimates; most accurate, most effort expert judgement , reserve analysis , decision-making (voting/planning poker) , data analysis (alternatives) law of diminishing returns , number of resources , advances in technology , motivation (student syndrome, parkinson's law) all influence duration. effort vs duration: 40 hours of effort with two people is 20 hours of duration only if the work is divisible and the people are 100% available. they never are. developing the schedule critical path method (cpm) — forward and backward pass to find the longest path and calculate float. critical chain method (ccm) — accounts for resource constraints; uses buffers instead of activity padding: a project buffer at the end, feeding buffers where non-critical chains join the critical chain, and resource buffers . resource optimisation: levelling — adjusts start/finish dates to respect resource limits. can change the critical path and usually extends duration. smoothing — adjusts only within float. does not change the critical path. schedule compression: crashing — add resources to critical-path activities. costs money , may add risk and communication overhead. crash the cheapest critical activity per unit of time saved. fast tracking — perform sequential activities in parallel. costs no money but adds risk and rework. only works on discretionary dependencies. schedule baseline — the approved schedule; changes require change control. milestone chart for executives, gantt/bar chart for the team, network diagram for logic. adaptive scheduling timeboxes / iterations / sprints — fixed duration, never extended. release planning — which features in which release, based on velocity. iteration planning — what the team commits to this sprint. velocity-based forecasting — remaining points ÷ average velocity = sprints remaining. cadence — regular rhythm of planning, review, retrospective. kanban — no timebox; flow-based, wip-limited, forecast by cycle time and throughput. controlling the schedule compare actual to baseline; use sv and spi schedule variance analysis , trend analysis , iteration burndown , performance reviews update forecasts; recommend corrective action never change the baseline to match reality without approved change control — that is a favourite wrong answer 3.4 cost and finance note: \"plan and manage finance\" is now an explicit process task with seven enablers. expect more finance questions than on the old exam. estimating and budgeting cost types: - direct (charged only to this project) vs indirect/overhead (shared) - variable (scale with work) vs fixed - sunk (already spent — irrelevant to the go/no-go decision, always) - opportunity cost (value of the next best option forgone) - life-cycle cost / total cost of ownership — includes operations, maintenance and disposal, not just build cost. increasingly tested alongside sustainability. estimate accuracy ranges: rough order of magnitude −25% to +75%; budget estimate −10% to +25%; definitive −5% to +10%. building the budget: activity estimates → work package estimates → control account estimates → + contingency reserve = cost baseline → + management reserve = budget at completion (bac) / project funding requirements. contingency reserve — for known unknowns (identified risks). inside the baseline. pm controls it. management reserve — for unknown unknowns . outside the baseline. requires management approval to access; when used, it is moved into the baseline via change control. funding limit reconciliation — smoothing expenditure against periodic funding limits; may require rescheduling work. s-curve — cumulative spend over time. managing finance (eco task 6 enablers) analyse financial needs — cash flow by period, not just total cost quantify risk and contingency allocations — emv and monte carlo drive the reserve size, not a flat 10% plan spend tracking across the life cycle — how often, by whom, against what plan financial reporting — format, audience, thresholds anticipate future finance challenges — currency movement, inflation, interest rates, funding gates, capital vs operating expenditure treatment monitor variations and work with governance — variance thresholds trigger defined escalation manage reserves — track consumption; a contingency reserve burning faster than risk is retiring is an early warning business case metrics npv — higher is better; accounts for the time value of money; the primary selection criterion irr — the rate at which npv = 0; higher is better roi — (benefit − cost) / cost; higher is better bcr — benefits ÷ costs; above 1 is viable; higher is better payback period — shorter is better, but ignores time value and post-payback returns; the weakest criterion cost-benefit analysis , economic value added , internal rate of return if a question gives you npv and payback period and they conflict, choose on npv . 3.5 quality concepts quality = the degree to which the deliverable fulfils requirements. grade = a category of features. low quality is always a problem; low grade may be acceptable. precision (consistent, tightly clustered results) vs accuracy (correct results). you can be precise and wrong. prevention over inspection — it is cheaper to build quality in. continuous improvement — pdca (plan-do-check-act), kaizen, lean, six sigma, tqm. management responsibility — quality requires resources; the team alone cannot fix a system problem. cost of quality (coq) cost of conformance cost of non-conformance prevention: training, documenting processes, right equipment, time to do it right internal failure: rework, scrap (found by the project) appraisal: testing, inspection, destructive testing loss external failure: warranty work, liabilities, lost business, recalls, reputational damage (found by the customer) investing in prevention reduces total coq. sustainability costs (waste disposal, emissions remediation) now sit in this analysis explicitly. tools data gathering: checklists, check sheets (tally sheets), statistical sampling, questionnaires. data analysis: root cause analysis, alternatives analysis, document analysis, process analysis. data representation: - cause-and-effect / fishbone / ishikawa diagram — find root causes across categories (people, process, materials, machines, measurement, environment) - flowcharts / process maps — show the process, expose handoffs and waste; also used for sipoc - histogram — frequency distribution - pareto diagram — an ordered histogram; the 80/20 rule : most defects come from a few causes. use it to decide what to fix first. - scatter diagram — correlation between two variables - control chart — process stability over time. know: upper/lower control limits (usually ±3σ, set by the process) versus specification limits (set by the customer, must be outside the control limits). rule of seven — seven consecutive points on one side of the mean means the process is out of control even if within limits. any point outside the control limits is out of control. - run chart — trend over time without control limits audits — independent review of whether the project complies with policies and processes. quality audits identify good practice and gaps and may generate change requests. design for x (dfx) — optimise for a specific characteristic (cost, reliability, serviceability, sustainability ). problem solving — define, identify root cause, generate solutions, choose, implement, verify. quality metrics — defect density, failure rate, availability, reliability, test coverage, on-time performance. standards iso 9000 series (quality management systems), six sigma (dmaic: define, measure, analyse, improve, control), lean (eliminate the seven wastes), total quality management, kaizen. regulatory compliance and quality \"help ensure regulatory compliance\" is a quality enabler in the 2026 eco. quality planning must incorporate the applicable standards, evidence requirements, inspection regimes and audit trail. non-compliance is never traded off against schedule. 3.6 resources planning resource management plan — identification, acquisition, roles and responsibilities, org charts, training, team development, resource control, recognition. resource breakdown structure (rbs) — hierarchical list of resources by category and type. (careful: rbs is also risk breakdown structure. context decides.) responsibility assignment matrix (ram) / raci — responsible (does the work), accountable (answerable, exactly one per row ), consulted (two-way input), informed (one-way update). resource calendars — when each resource is available. pre-assignment , negotiation (with functional managers and other pms), acquisition , virtual teams . estimating estimate activity resources: type, quantity and characteristics of people, materials, equipment and supplies bottom-up , analogous, parametric, alternatives analysis, published estimating data managing physical resources logistics, lead times, storage, inventory, just-in-time, kanban for materials, supply-chain risk sustainability considerations: sourcing, waste, energy, recyclability controlling resources compare planned vs actual utilisation resource histogram shows over-allocation address shortfalls: negotiate, reprioritise, reschedule, outsource, train, escalate as a last resort trend analysis , alternatives analysis , cost-benefit analysis , performance reviews 3.7 procurement plan procurements make-or-buy analysis — capability, capacity, cost, risk, strategic importance, confidentiality procurement management plan and procurement strategy — delivery method, contract payment type, procurement phases procurement statement of work (sow) — what is being bought, in enough detail for a seller to price it. terms of reference (tor) for services. bid documents: rfi (information, market research), rfq (quotation, price-driven for defined items), rfp (proposal, for complex or solution-based purchases), ifb/tender source selection criteria — capability, capacity, past performance, technical approach, warranty, financial stability, references, price (never price alone for complex work), and increasingly sustainability and esg credentials independent cost estimates to sanity-check bids contract types type description buyer risk seller risk use when ffp firm fixed price one price, period low high scope is clear and stable fpif fixed price incentive fee target cost, target fee, share ratio, ceiling price low–med med you want a cost-performance incentive fpepa fixed price with economic price adjustment price adjusts to a defined index low–med med multi-year, inflation or currency exposure purchase order simplest ffp low high commodity items cpff cost plus fixed fee costs reimbursed + a fixed fee high low scope uncertain, r&amp;d cpif cost plus incentive fee costs reimbursed + fee varying with performance, share ratio high low–med shared savings/overruns cpaf cost plus award fee costs + a subjective award fee at buyer's discretion high low performance is judged qualitatively t&amp;m / unit price hourly or unit rates, often with a not-to-exceed cap med–high low staff augmentation, urgent or small scope point of total assumption (pta) applies to fpif: beyond that cost, the seller absorbs every further dollar. conduct and control procurements bidder conferences (all sellers get the same information at the same time — fairness is mandatory) proposal evaluation using weighted criteria negotiation strategy — know your objectives, your batna (best alternative to a negotiated agreement), your walk-away point, and the other party's interests. aim for a workable long-term relationship, not a crushed vendor. manage suppliers and contracts — performance reviews, inspections, audits, claims administration, payment systems evaluate vendor performance against agreed kpis; a vendor problem is your problem claims administration — contested changes. resolve by negotiation first; then adr (mediation, arbitration); litigation last. close procurements — verify all work is complete and accepted, settle claims, update records, formal written notice of closure agile procurement: master services agreement with iteration-level appendices; graduated fixed price; fixed-price work packages; capacity-based contracts; incremental delivery contracts; early termination clauses with payment for value delivered. 3.8 evaluating project status data to information to report work performance data (raw) → work performance information (analysed in context) → work performance reports (communicated artifact). example: \"312 hours logged\" is data. \"cpi 0.87, forecast overrun $41k\" is information. \"amber status, decision needed on scope trade\" is a report. metrics deliverable metrics: defects, performance against specification delivery metrics: lead time, cycle time, throughput, wip, queue size baseline performance: sv, spi, cv, cpi, eac, vac, tcpi resource metrics: utilisation, cost per unit business value metrics: benefits realised, roi, npv, net promoter score, customer satisfaction, feature usage stakeholder metrics: engagement level, satisfaction, mood charts forecast metrics: eac, etc, velocity-based forecasts pitfalls pmi tests hawthorne effect — measuring something changes behaviour vanity metrics — impressive numbers that drive no decision misuse of metrics — velocity as a performance target across teams destroys its value confirmation bias — reporting only the numbers that support the current narrative too many metrics — measure what you will act on artifacts identify and tailor the artifacts the project actually needs; ensure they are created, reviewed, updated, documented and accessible ; continually assess whether artifact management is still effective. over-documentation is waste; under-documentation is risk. 3.9 value-based delivery identify value components with key stakeholders — what specifically counts as value here, and how will we know? prioritise by value using moscow, wsjf, kano, cost of delay, value/effort deliver incrementally where the increment produces real value, so benefits start early examine business value throughout — the business case is a living document. if the market shifts and the value disappears, the right recommendation may be to stop the project. verify a measurement system exists before claiming benefits — you cannot report benefits you never instrumented evaluate delivery options — pilot, phased rollout, big bang, dark launch, a/b test cost of delay = the economic loss per unit time of not having the feature. wsjf = cost of delay ÷ job size. high-value, small items first. killing a project is a legitimate and sometimes correct answer. if a question shows the business case no longer holds, escalating a recommendation to terminate is right — you do not keep spending because money is already committed (sunk cost). "}, {"id": "s4", "title": "Part 4 — Business Environment domain (26%)", "html": "<p><em>This domain tripled in weight. Most experienced PMs under-study it and lose the exam here. ECO tasks: governance · compliance · change control · impediments and issues · risk · continuous improvement · organisational change · external environment.<\/em><\/p>\n<h2 id=\"s4-h1\">4.1 Governance<\/h2>\n<p><strong>Project governance<\/strong> is the framework of authority, decision rights, accountability, rules, procedures, reporting and ethics within which the project operates. It answers: <em>who decides what, on what evidence, and who is accountable for the outcome?<\/em><\/p>\n<h3>Establishing governance<\/h3>\n<p>Using OPAs, define:\n- <strong>Structure<\/strong> — sponsor, steering committee, CCB, PMO relationship, escalation hierarchy\n- <strong>Rules and procedures<\/strong> — what needs approval, by whom, in what form\n- <strong>Reporting<\/strong> — cadence, format, audience, thresholds\n- <strong>Ethics<\/strong> — code of conduct, conflict-of-interest handling, whistleblowing route\n- <strong>Policies<\/strong> — procurement, security, data, safety, sustainability\n- <strong>Decision rights<\/strong> — which decisions the PM can make alone, which need the sponsor, which need the committee\n- <strong>Success metrics<\/strong> — defined up front and agreed, covering delivery <em>and<\/em> value<\/p>\n<h3>Escalation paths and thresholds<\/h3>\n<p>A <strong>threshold<\/strong> is a pre-agreed measurable trigger for escalation. Examples: cost variance beyond 10%, schedule slip beyond 5 days on the critical path, any safety incident, any risk with EMV above $50k, any change above $25k.<\/p>\n<p>Good governance defines the threshold <strong>before<\/strong> the situation arises. On the exam: if a scenario describes a PM deciding ad hoc whether something warrants escalation, the underlying failure is that no threshold was defined.<\/p>\n<h3>Governance levels<\/h3>\n<p><strong>Organisational governance<\/strong> (enterprise-wide: strategy, portfolio, compliance, risk appetite) → <strong>portfolio governance<\/strong> → <strong>programme governance<\/strong> → <strong>project governance<\/strong>. Each constrains the one below.<\/p>\n<h3>Steering committee vs CCB vs PMO<\/h3>\n<ul>\n<li><strong>Steering committee<\/strong> — strategic oversight across the project's life; funding, priority, scope direction, sponsor support<\/li>\n<li><strong>CCB<\/strong> — authorises or rejects specific change requests against baselines<\/li>\n<li><strong>PMO<\/strong> — organisational function providing standards, support or direction (below)<\/li>\n<\/ul>\n<h3>Types of PMO<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Degree of control<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Supportive<\/strong><\/td>\n<td>Low<\/td>\n<td>Templates, best practices, training, lessons learned, coaching. A repository and consultancy.<\/td>\n<\/tr>\n<tr>\n<td><strong>Controlling<\/strong><\/td>\n<td>Moderate<\/td>\n<td>Requires compliance with frameworks, methodologies, templates, governance forms. Audits.<\/td>\n<\/tr>\n<tr>\n<td><strong>Directive<\/strong><\/td>\n<td>High<\/td>\n<td>Takes control of projects; project managers report to the PMO.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Also: <strong>Agile/value delivery office (VDO)<\/strong> — coaching, removing organisational impediments, enabling flow rather than enforcing process. <strong>Enterprise PMO (EPMO)<\/strong> — reports to the C-suite, links strategy to portfolio.<\/p>\n<p>The PMO's value proposition includes standardisation, resource optimisation, cross-project visibility, capability building and strategic alignment. A <strong>customer-centric<\/strong> PMO focuses on what project teams need rather than what the PMO wants to enforce.<\/p>\n<h3>Defining success metrics<\/h3>\n<p>Modern PMI success metrics cover four layers:\n1. <strong>Delivery:<\/strong> scope, schedule, cost, quality\n2. <strong>Adoption:<\/strong> usage, transition success, training completion\n3. <strong>Value/benefit:<\/strong> revenue, cost saving, satisfaction, strategic contribution\n4. <strong>Sustainability/impact:<\/strong> environmental, social, governance outcomes<\/p>\n<p>Agree them with the sponsor and stakeholders <em>before<\/em> execution, define who measures them and when, and note that most value metrics are measured <strong>after<\/strong> the project closes — hence the handover of benefits tracking.<\/p>\n<h2 id=\"s4-h2\">4.2 Compliance<\/h2>\n<p><strong>Compliance<\/strong> = conforming to rules — laws, regulations, standards, contractual terms and internal policy.<\/p>\n<h3>The compliance process (matching the ECO enablers)<\/h3>\n<ol>\n<li><strong>Confirm requirements<\/strong> — regulatory, legal, contractual, security, health and safety, environmental/sustainability, data privacy, industry standard, internal policy. Source them from the regulator, legal counsel, the contract and the PMO — not from memory.<\/li>\n<li><strong>Classify categories<\/strong> — group them so you can assign owners and evidence requirements.<\/li>\n<li><strong>Determine potential threats to compliance<\/strong> — where could we fail? Supplier practices, undocumented work, schedule pressure, data handling, subcontractor labour standards.<\/li>\n<li><strong>Use methods to support compliance<\/strong> — build requirements into the WBS and acceptance criteria, design controls into the process, train the team, audit, use checklists, maintain an evidence trail.<\/li>\n<li><strong>Analyse consequences of non-compliance<\/strong> — fines, licence loss, injunction, contract termination, criminal liability, reputational damage, project cancellation, harm to people.<\/li>\n<li><strong>Determine the approach and actions<\/strong> — prevention, detection, correction. Assign owners and dates.<\/li>\n<li><strong>Measure the extent of compliance<\/strong> — audits, inspections, compliance dashboards, third-party certification.<\/li>\n<\/ol>\n<h3>Exam rules<\/h3>\n<ul>\n<li>Compliance is <strong>never<\/strong> traded off against cost or schedule. Any option that says \"proceed and address the regulation later\" is wrong.<\/li>\n<li>Safety concerns stop work. Immediately.<\/li>\n<li>If you discover non-compliance, report it through the defined channel. Do not conceal it, and do not quietly fix it without informing governance.<\/li>\n<li>Compliance requirements become <strong>scope<\/strong>, <strong>quality criteria<\/strong>, <strong>risks<\/strong> and <strong>costs<\/strong> — they must appear in the plan, not as an afterthought.<\/li>\n<li>Regulatory change during a project is an <strong>external environment<\/strong> trigger: assess impact, raise a change request, escalate.<\/li>\n<\/ul>\n<h2 id=\"s4-h3\">4.3 Managing and controlling changes<\/h2>\n<h3>The integrated change control process<\/h3>\n<ol>\n<li><strong>Request<\/strong> — anyone can raise one; capture it formally in the change log<\/li>\n<li><strong>Log<\/strong> — every request, approved or not<\/li>\n<li><strong>Assess impact<\/strong> — across <strong>all<\/strong> constraints: scope, schedule, cost, quality, resources, risk, benefits, compliance, stakeholders. This is the step candidates skip.<\/li>\n<li><strong>Decide<\/strong> — PM within delegated authority, otherwise the CCB<\/li>\n<li><strong>Communicate the decision and its status<\/strong> — to the requester and affected stakeholders<\/li>\n<li><strong>Implement<\/strong> approved changes<\/li>\n<li><strong>Update<\/strong> baselines, plans and documents; adjust the RTM; re-baseline only when authorised<\/li>\n<\/ol>\n<h3>Change control in each approach<\/h3>\n<ul>\n<li><strong>Predictive<\/strong> — formal, baseline-protecting, CCB-driven.<\/li>\n<li><strong>Adaptive<\/strong> — changes to backlog content and order are normal and require no change request; the product owner decides. What <em>does<\/em> need governance: changing the release date, the budget, the team, or a contractual commitment.<\/li>\n<li><strong>Hybrid<\/strong> — agile inside the boundary, formal change control at the boundary. Define clearly where the boundary sits — that definition is itself a governance decision.<\/li>\n<\/ul>\n<h3>Frequent exam traps<\/h3>\n<ul>\n<li>Implementing a change because the sponsor asked verbally → still needs the process<\/li>\n<li>Rejecting a change without analysis → wrong<\/li>\n<li>Updating the schedule quietly to absorb slippage → wrong<\/li>\n<li>Failing to communicate a <em>rejected<\/em> change → wrong<\/li>\n<li>Treating a defect repair as a scope change → it is a defect repair; correct the deliverable<\/li>\n<\/ul>\n<h2 id=\"s4-h4\">4.4 Impediments, issues and problems<\/h2>\n<h3>Definitions<\/h3>\n<ul>\n<li><strong>Risk<\/strong> — an uncertain event that <em>may<\/em> occur<\/li>\n<li><strong>Issue<\/strong> — a current condition that <em>is<\/em> affecting the project. A risk that occurred becomes an issue.<\/li>\n<li><strong>Impediment / blocker / obstacle<\/strong> — something stopping the team from progressing now (agile terminology)<\/li>\n<li><strong>Constraint<\/strong> — a limiting factor (fixed date, fixed budget, mandated technology)<\/li>\n<li><strong>Assumption<\/strong> — something believed true without proof; track it, validate it<\/li>\n<\/ul>\n<h3>Handling impediments<\/h3>\n<ol>\n<li><strong>Evaluate the impact<\/strong> — who is blocked, how much work is stalled, what it costs per day<\/li>\n<li><strong>Prioritise and make them visible<\/strong> — impediment log, impediment board, daily stand-up<\/li>\n<li><strong>Determine and apply an intervention strategy<\/strong> — remove it yourself, get the team to remove it, negotiate, escalate with a recommendation<\/li>\n<li><strong>Reassess continually<\/strong> — an impediment log that never shrinks is a governance failure<\/li>\n<li><strong>Recognise when a risk becomes an issue<\/strong> — move it from the risk register to the issue log, assign an owner and a due date<\/li>\n<li><strong>Collaborate with stakeholders<\/strong> on the resolution — do not solve in isolation<\/li>\n<\/ol>\n<p><strong>Issue log fields:<\/strong> ID, description, raised by, date raised, category, impact, priority/urgency, owner, target resolution date, status, resolution, date closed.<\/p>\n<p><strong>Escalation done well:<\/strong> state the issue, the impact, what you have already tried, the options, and your recommendation. Escalation without a recommendation is delegation of your job.<\/p>\n<h2 id=\"s4-h5\">4.5 Risk<\/h2>\n<h3>Definitions<\/h3>\n<ul>\n<li><strong>Individual project risk<\/strong> — one uncertain event affecting one or more objectives<\/li>\n<li><strong>Overall project risk<\/strong> — the effect of uncertainty on the project as a whole, including opportunity<\/li>\n<li><strong>Risk appetite<\/strong> — the degree of uncertainty an organisation is willing to accept for the reward<\/li>\n<li><strong>Risk tolerance<\/strong> — the amount of variation deemed acceptable<\/li>\n<li><strong>Risk threshold<\/strong> — the measurable level at which action becomes required<\/li>\n<li><strong>Uncertainty, ambiguity, complexity, volatility<\/strong> — the sources of overall risk<\/li>\n<\/ul>\n<h3>Plan risk management<\/h3>\n<p>Defines methodology, roles, budget, timing, <strong>risk categories (RBS)<\/strong>, <strong>definitions of probability and impact<\/strong> (the scales), the <strong>probability and impact matrix<\/strong>, stakeholder risk appetite, reporting formats and tracking.<\/p>\n<h3>Identify risks<\/h3>\n<ul>\n<li>Brainstorming, checklists (from OPAs), interviews, root cause analysis<\/li>\n<li><strong>SWOT<\/strong> analysis (identifies opportunities as well as threats)<\/li>\n<li>Assumption and constraint analysis<\/li>\n<li>Document analysis, prompt lists (<strong>PESTLE<\/strong>, TECOP, VUCA)<\/li>\n<li>Facilitation, <strong>Delphi technique<\/strong> (anonymous expert consensus, avoids groupthink and dominance)<\/li>\n<li>Iterative — repeat throughout. New risks emerge every phase.<\/li>\n<\/ul>\n<p>Outputs: <strong>risk register<\/strong> (individual risks: description, category, cause, owner, probability, impact, score, response, status) and <strong>risk report<\/strong> (overall project risk and summary).<\/p>\n<p>Write risks in cause-risk-effect form: <em>\"Because [cause], [risk event] may occur, which would result in [effect].\"<\/em><\/p>\n<h3>Qualitative risk analysis<\/h3>\n<p>Fast, subjective, prioritises. Uses:\n- <strong>Probability and impact matrix<\/strong> → risk score → priority\n- <strong>Risk data quality assessment<\/strong> — how reliable is the information?\n- <strong>Urgency, proximity, dormancy, manageability, controllability, detectability, connectivity, strategic impact, propinquity<\/strong>\n- <strong>Risk categorisation<\/strong> by RBS, WBS or source\n- Output: updated risk register with priorities, watch list for low-priority risks<\/p>\n<h3>Quantitative risk analysis<\/h3>\n<p>Numeric, for large or complex projects. Uses:\n- <strong>Expected monetary value (EMV)<\/strong> = probability × impact, summed\n- <strong>Decision tree analysis<\/strong> — compare options by EMV, including the cost of each branch\n- <strong>Monte Carlo simulation<\/strong> — thousands of iterations produce a probability distribution of cost or completion date; output typically an <strong>S-curve<\/strong> giving confidence levels (e.g. 80% confident of finishing by 14 March)\n- <strong>Sensitivity analysis<\/strong> — <strong>tornado diagram<\/strong> shows which variables affect the outcome most\n- <strong>Influence diagrams<\/strong><\/p>\n<p>Not every project needs quantitative analysis; it is a tailoring decision.<\/p>\n<h3>Plan risk responses<\/h3>\n<p><strong>Threats:<\/strong> <strong>Escalate<\/strong> (outside project authority — ownership transfers), <strong>Avoid<\/strong> (eliminate the cause or the exposure), <strong>Transfer<\/strong> (insurance, warranties, performance bonds, fixed-price contracts — the risk still exists, someone else bears it, and there is a premium), <strong>Mitigate<\/strong> (reduce probability or impact), <strong>Accept<\/strong> (active: set a contingency reserve; passive: do nothing but monitor).<\/p>\n<p><strong>Opportunities:<\/strong> <strong>Escalate<\/strong>, <strong>Exploit<\/strong> (make certain it happens), <strong>Share<\/strong> (partnership, joint venture, teaming agreement), <strong>Enhance<\/strong> (increase probability or impact), <strong>Accept<\/strong>.<\/p>\n<p><strong>Contingent response strategies<\/strong> — pre-planned responses executed only if a defined <strong>trigger<\/strong> occurs. Also: <strong>fallback plan<\/strong> (if the primary response fails), <strong>workaround<\/strong> (unplanned response to an issue that had no prior response).<\/p>\n<p><strong>Secondary risk<\/strong> — created by implementing a response. <strong>Residual risk<\/strong> — what remains afterwards. Both must be documented.<\/p>\n<h3>Implement and monitor<\/h3>\n<ul>\n<li>Implement responses (a real executing process — a risk register full of unexecuted responses is a common failure)<\/li>\n<li><strong>Risk reassessment<\/strong>, <strong>risk audits<\/strong> (how effective is the risk <em>process<\/em>?), <strong>variance and trend analysis<\/strong>, <strong>technical performance analysis<\/strong>, <strong>reserve analysis<\/strong><\/li>\n<li>Report overall risk exposure to governance<\/li>\n<\/ul>\n<h3>Risk in agile<\/h3>\n<ul>\n<li>Risk is addressed by short feedback loops, early delivery of risky items, spikes, and prototypes<\/li>\n<li>Risk-adjusted backlog: schedule high-risk, high-value items early<\/li>\n<li>Risks surfaced in daily stand-ups and retrospectives<\/li>\n<li>The team owns risk collectively<\/li>\n<\/ul>\n<h3>Sustainability and security risks<\/h3>\n<p>Explicitly called out in the ECO: poor IT security in the risk register, and sustainability risk responses. Expect scenarios about a data breach, a supplier with poor labour practices, or an environmental permit.<\/p>\n<h2 id=\"s4-h6\">4.6 Continuous improvement<\/h2>\n<ul>\n<li><strong>Lessons learned register<\/strong> maintained continuously; <strong>repository<\/strong> updated at closure<\/li>\n<li><strong>Retrospectives<\/strong> — regular, blameless, action-producing. A retrospective that produces no changed behaviour is theatre.<\/li>\n<li><strong>Kaizen<\/strong> — small continuous improvements. <strong>Kaizen events / blitzes<\/strong> for focused improvement.<\/li>\n<li><strong>PDCA / Deming cycle<\/strong> — plan, do, check, act<\/li>\n<li><strong>Process analysis and value stream mapping<\/strong> — find waste and delays<\/li>\n<li><strong>The seven wastes (Lean/TIMWOOD):<\/strong> transport, inventory, motion, waiting, overproduction, overprocessing, defects (plus unused talent)<\/li>\n<li><strong>Update OPAs<\/strong> — improvements must feed back into templates, checklists and standards or they die with the project<\/li>\n<li><strong>Retrospective formats:<\/strong> start/stop/continue, 4Ls (liked, learned, lacked, longed for), sailboat, timeline, mad/sad/glad<\/li>\n<li>Improvement is a <strong>task in the Business Environment domain<\/strong> now, meaning the exam frames it as organisational learning, not just team hygiene<\/li>\n<\/ul>\n<h2 id=\"s4-h7\">4.7 Supporting organisational change<\/h2>\n<p>Delivering an output is not success; <strong>adoption<\/strong> is.<\/p>\n<h3>Assessing organisational culture<\/h3>\n<p>Consider: tolerance for risk and failure, decision-making style (consensus vs hierarchical), attitude to change, degree of formality, communication norms, reward systems, history of previous change efforts. Culture determines what approach can actually work.<\/p>\n<h3>Change models<\/h3>\n<ul>\n<li><strong>ADKAR<\/strong> — Awareness of the need, Desire to support, Knowledge of how, Ability to implement, Reinforcement to sustain. Diagnostic: find which letter the individual is stuck on and act there.<\/li>\n<li><strong>Kotter's 8 steps<\/strong> — create urgency; build a guiding coalition; form a vision; communicate the vision; empower action and remove obstacles; generate short-term wins; consolidate gains; anchor in the culture.<\/li>\n<li><strong>Virginia Satir change model<\/strong> — late status quo → foreign element → chaos → transforming idea → practice and integration → new status quo. Explains why performance <em>drops<\/em> after a change is introduced; leaders must expect and support the chaos phase.<\/li>\n<li><strong>Bridges' transition model<\/strong> — ending/losing/letting go → neutral zone → new beginning. Change is external; transition is psychological.<\/li>\n<li><strong>Lewin<\/strong> — unfreeze, change, refreeze.<\/li>\n<\/ul>\n<h3>Practical change management on a project<\/h3>\n<ul>\n<li>Identify who must behave differently and how<\/li>\n<li>Build a <strong>change impact assessment<\/strong> per affected group<\/li>\n<li>Communicate early, repeatedly and through trusted voices<\/li>\n<li>Recruit <strong>change champions<\/strong> in the affected groups<\/li>\n<li>Provide training and post-go-live support (hypercare)<\/li>\n<li>Measure adoption, not just deployment<\/li>\n<li>Plan the transition to operations: support model, documentation, runbooks, service levels<\/li>\n<\/ul>\n<h2 id=\"s4-h8\">4.8 Evaluating the external business environment<\/h2>\n<p>This ECO task is new in emphasis and reliably tested.<\/p>\n<h3>Scanning<\/h3>\n<ul>\n<li><strong>PESTLE<\/strong> — Political, Economic, Social, Technological, Legal, Environmental<\/li>\n<li><strong>SWOT<\/strong> — internal strengths and weaknesses, external opportunities and threats<\/li>\n<li><strong>Porter's five forces<\/strong>, competitor analysis, market research<\/li>\n<li>Regulatory monitoring and horizon scanning<\/li>\n<li>Supply-chain and geopolitical monitoring<\/li>\n<li>Technology watch — including AI capability shifts that could make your solution obsolete<\/li>\n<\/ul>\n<h3>Responding<\/h3>\n<ol>\n
