ting people", "Retention bonuses for everyone", "Avoiding discussion of job impacts"], "a": 1, "e": "Uncertainty drives attrition; transparency and clear decision timelines reduce it.", "sc": 10}, {"id": "C12.1", "q": "How should the PM reconcile the stage gate with iterative discovery?", "o": ["Write a complete specification anyway", "Agree with governance what evidence satisfies the gate for an iterative approach — validated user needs, a prioritised backlog, a tested prototype and a release plan", "Skip the stage gate", "Switch to a fully predictive approach"], "a": 1, "e": "Tailor the gate criteria to the approach through governance, rather than faking compliance or bypassing it.", "sc": 11}, {"id": "C12.2", "q": "How should the accessibility legislation be treated?", "o": ["As a nice-to-have for a later release", "As a mandatory compliance requirement built into acceptance criteria and the definition of done from the start", "As the agency's responsibility, not the project's", "As a risk to monitor"], "a": 1, "e": "Legislated requirements are scope and quality criteria, not optional features.", "sc": 11}, {"id": "C12.3", "q": "What does the user research on older applicants most directly imply?", "o": ["Build a paper alternative only", "Include older users in usability testing throughout and design for their needs, while keeping an assisted channel for those who cannot use the service online", "Target only younger users first", "Add a help page"], "a": 1, "e": "Design with the real users, and keep an inclusive fallback channel.", "sc": 11}, {"id": "C12.4", "q": "Which metric would best demonstrate the service's value at the next review?", "o": ["Story points delivered", "Completion rate and time-to-complete for real applicants, including older users, against the paper baseline", "Number of features built", "Budget consumed"], "a": 1, "e": "Value is measured in outcomes for users, against a baseline.", "sc": 11}], "domain": "mixed"}, {"id": "b_match", "title": "Matching", "group": "formats", "qs": [{"id": "MA1", "q": "Match each contract type to its risk profile.", "t": "match", "l": ["Firm fixed price", "Cost plus fixed fee", "Time and materials", "Fixed price incentive fee"], "r": ["Seller bears most of the cost risk", "Buyer bears most of the cost risk; seller's fee does not vary", "Buyer pays per hour or unit; suits staff augmentation", "Target cost and share ratio with a ceiling price"], "e": "Risk shifts from seller to buyer as you move from fixed price to cost-reimbursable arrangements."}, {"id": "MA2", "q": "Match each conflict mode to its outcome.", "t": "match", "l": ["Collaborate", "Compromise", "Force", "Withdraw"], "r": ["Win-win; addresses the root cause", "Both parties give something up", "Win-lose; appropriate in emergencies", "The issue is postponed"], "e": "PMI's preference order is collaborate, compromise, smooth, force, withdraw."}, {"id": "MA3", "q": "Match each stakeholder quadrant to its strategy.", "t": "match", "l": ["High power, high interest", "High power, low interest", "Low power, high interest", "Low power, low interest"], "r": ["Manage closely", "Keep satisfied", "Keep informed", "Monitor"], "e": "The power/interest grid drives how much engagement effort each stakeholder receives."}, {"id": "MA4", "q": "Match each threat response to its example.", "t": "match", "l": ["Avoid", "Transfer", "Mitigate", "Accept"], "r": ["Change the design to remove the hazard entirely", "Buy insurance against equipment loss", "Add redundant servers to reduce outage impact", "Set aside a contingency reserve and monitor"], "e": "Transfer shifts impact to a third party; mitigate reduces probability or impact; avoid removes the exposure."}, {"id": "MA5", "q": "Match each Tuckman stage to the leader's primary action.", "t": "match", "l": ["Forming", "Storming", "Norming", "Performing"], "r": ["Provide direction and clarify purpose and roles", "Coach and resolve conflict", "Facilitate and step back", "Delegate and remove impediments"], "e": "Leadership style should follow team maturity."}, {"id": "MA6", "q": "Match each PMO type to its degree of control.", "t": "match", "l": ["Supportive", "Controlling", "Directive"], "r": ["Low — templates, training and advice", "Moderate — requires compliance with frameworks", "High — manages the projects directly"], "e": "The three PMO types differ by how much control they exert."}, {"id": "MA7", "q": "Match each quality tool to its purpose.", "t": "match", "l": ["Pareto diagram", "Control chart", "Fishbone diagram", "Scatter diagram"], "r": ["Identify the vital few causes", "Determine process stability over time", "Structure possible causes of a problem", "Show correlation between two variables"], "e": "Know when to reach for each of the seven basic quality tools."}, {"id": "MA8", "q": "Match each Scrum event to its purpose.", "t": "match", "l": ["Sprint planning", "Daily scrum", "Sprint review", "Sprint retrospective"], "r": ["Define the sprint goal and select the work", "Inspect progress toward the sprint goal and adapt the plan", "Inspect the increment with stakeholders and adapt the backlog", "Inspect and improve the team's way of working"], "e": "Each event is an inspect-and-adapt point for a different subject."}, {"id": "MA9", "q": "Match each estimating technique to its characteristic.", "t": "match", "l": ["Analogous", "Parametric", "Bottom-up", "Three-point"], "r": ["Top-down from a similar past project; fast, least accurate", "Statistical relationship between variables", "Sum of detailed estimates; most accurate", "Accounts for uncertainty with optimistic, most likely and pessimistic values"], "e": "Accuracy generally increases with the level of detail and data."}, {"id": "MA10", "q": "Match each motivation theory to its central idea.", "t": "match", "l": ["Herzberg", "Maslow", "McGregor", "Vroom"], "r": ["Hygiene factors prevent dissatisfaction; motivators drive engagement", "Needs are met in a hierarchy from basic to self-actualisation", "Theory X assumes control is needed; Theory Y assumes self-motivation", "Motivation depends on expectancy, instrumentality and valence"], "e": "Know the one-line idea behind each theory."}, {"id": "MA11", "q": "Match each dependency type to its example.", "t": "match", "l": ["Mandatory", "Discretionary", "External", "Internal"], "r": ["Concrete must cure before load is applied", "The team prefers design review before build", "A government permit must be issued", "Testing depends on the test environment the team builds"], "e": "Discretionary logic is what you break when fast tracking."}, {"id": "MA12", "q": "Match each ADKAR element to its meaning.", "t": "match", "l": ["Awareness", "Desire", "Knowledge", "Ability", "Reinforcement"], "r": ["Understanding why the change is needed", "Willingness to support the change", "Knowing how to change", "Being able to implement the new behaviour", "Sustaining the change over time"], "e": "Diagnose which element an individual is stuck on and act there."}, {"id": "MA13", "q": "Match each opportunity response to its example.", "t": "match", "l": ["Exploit", "Share", "Enhance", "Accept"], "r": ["Assign the best team to guarantee early completion and the bonus", "Form a joint venture to pursue the opportunity", "Add resources to raise the probability of an early finish", "Take the benefit if it happens, with no active pursuit"], "e": "Exploit makes the opportunity certain; enhance increases its likelihood or impact."}, {"id": "MA14", "q": "Match each metric to what it measures.", "t": "match", "l": ["Lead time", "Cycle time", "Throughput", "WIP"], "r": ["Customer request to delivery", "Work started to work completed", "Items completed per unit of time", "Items currently in progress"], "e": "Little's Law connects them: cycle time = WIP ÷ throughput."}, {"id": "MA15", "q": "Match each document to its purpose.", "t": "match", "l": ["Project charter", "Business case", "Benefits management plan", "Requirements traceability matrix"], "r": ["Authorises the project and the project manager", "Justifies the investment", "Defines how and when benefits will be realised and measured", "Links requirements to their origin and to deliverables"], "e": "Each document answers a different question about the project."}], "domain": "mixed"}, {"id": "b_graph", "title": "Graphic interpretation", "group": "formats", "qs": [{"id": "G1", "q": "What does this control chart indicate?", "svg": "<svg viewBox=\"0 0 480 250\" role=\"img\" aria-label=\"Control chart with one point above the upper control limit\" style=\"width:100%;max-width:520px;height:auto;display:block;margin:.4rem 0 1rem\"><line x1=\"50\" y1=\"210\" x2=\"460\" y2=\"210\" style=\"stroke:var(--muted);stroke-width:1.2\"/><line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"210\" style=\"stroke:var(--muted);stroke-width:1.2\"/><text x=\"255\" y=\"240\" text-anchor=\"middle\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Sample<\/text><text x=\"14\" y=\"115\" text-anchor=\"middle\" transform=\"rotate(-90 14 115)\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Measurement<\/text><line x1=\"50\" y1=\"55\" x2=\"460\" y2=\"55\" style=\"stroke:var(--muted);stroke-dasharray:4 4\"/><text x=\"464\" y=\"59\" text-anchor=\"start\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">UCL<\/text><line x1=\"50\" y1=\"115\" x2=\"460\" y2=\"115\" style=\"stroke:var(--muted);stroke-dasharray:4 4\"/><text x=\"464\" y=\"119\" text-anchor=\"start\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Mean<\/text><line x1=\"50\" y1=\"175\" x2=\"460\" y2=\"175\" style=\"stroke:var(--muted);stroke-dasharray:4 4\"/><text x=\"464\" y=\"179\" text-anchor=\"start\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">LCL<\/text><polyline points=\"62.0,118.0 97.5,104.0 132.9,126.0 168.4,110.0 203.8,98.0 239.3,121.0 274.7,108.0 310.2,40.0 345.6,112.0 381.1,119.0 416.5,102.0 452.0,116.0\" fill=\"none\" style=\"stroke:var(--accent);stroke-width:1.6\"/><circle cx=\"62.0\" cy=\"118.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"97.5\" cy=\"104.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"132.9\" cy=\"126.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"168.4\" cy=\"110.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"203.8\" cy=\"98.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"239.3\" cy=\"121.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"274.7\" cy=\"108.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"310.2\" cy=\"40.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"345.6\" cy=\"112.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"381.1\" cy=\"119.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"416.5\" cy=\"102.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><circle cx=\"452.0\" cy=\"116.0\" r=\"3.2\" style=\"fill:var(--accent)\"/><\/svg>", "o": ["The process is in control", "The process is out of control; investigate the assignable cause of the point above the UCL", "The specification limits are too wide", "The sample size is too small"], "a": 1, "e": "Any point beyond a control limit signals an out-of-control process."}, {"id": "G2", "q": "All points are within the control limits. What should the project manager conclude?", "svg": "<svg viewBox=\"0 0 480 250\" role=\"img\" aria-label=\"Control chart with a run of points above the mean\" style=\"width:100%;max-width:520px;height:auto;display:block;margin:.4rem 0 1rem\"><line x1=\"50\" y1=\"210\" x2=\"460\" y2=\"210\" style=\"stroke:var(--muted);stroke-width:1.2\"/><line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"210\" style=\"stroke:var(--muted);stroke-width:1.2\"/><text x=\"255\" y=\"240\" text-anchor=\"middle\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Sample<\/text><text x=\"14\" y=\"115\" text-anchor=\"middle\" transform=\"rotate(-90 14 1  more consecutive points fall on one side of the mean", "The control limits should be widened", "No action is needed while points stay inside the limits"], "a": 1, "e": "The rule of seven: a run of seven consecutive points on one side of the mean indicates a shift."}, {"id": "G3", "q": "What does this cumulative flow diagram show?", "svg": "<svg viewBox=\"0 0 480 250\" role=\"img\" aria-label=\"Cumulative flow diagram\" style=\"width:100%;max-width:520px;height:auto;display:block;margin:.4rem 0 1rem\"><line x1=\"50\" y1=\"210\" x2=\"460\" y2=\"210\" style=\"stroke:var(--muted);stroke-width:1.2\"/><line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"210\" style=\"stroke:var(--muted);stroke-width:1.2\"/><text x=\"255\" y=\"240\" text-anchor=\"middle\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Time<\/text><text x=\"14\" y=\"115\" text-anchor=\"middle\" transform=\"rotate(-90 14 115)\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Work items<\/text><polygon points=\"50,210 91,204 132,198 173,192 214,186 255,180 296,174 337,168 378,162 419,156 460,150 460,210 419,210 378,210 337,210 296,210 255,210 214,210 173,210 132,210 91,210 50,210\" style=\"fill:var(--ok);opacity:.55\"/><text x=\"466\" y=\"205\" text-anchor=\"start\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Done<\/text><polygon points=\"50,198 91,184 132,170 173,156 214,142 255,128 296,114 337,100 378,86 419,72 460,58 460,150 419,156 378,162 337,168 296,174 255,180 214,186 173,192 132,198 91,204 50,210\" style=\"fill:var(--bad);opacity:.55\"/><text x=\"466\" y=\"108.0\" text-anchor=\"start\" style=\"fill:var(--muted);font-size:10px;font-family:ui-sans-serif,sans-serif\">Testing<\/text><polygon points=\"50,182 91,167 132,152 173,137 214,122 255,107 296,92 337,77 378,62 419,47 460,32 460,58 419,72 378,86 337,100 296,114 255,128 214,142 173,156 132,170 91,184 50,198\" style=\"fill:var(--accent);opacity:.55\"/><text x=\"46 : "TCPI to EAC", "b": "(BAC − EV) ÷ (EAC − AC)."}, {"f": "Percent complete", "b": "EV ÷ BAC."}, {"f": "PERT / beta estimate", "b": "(O + 4M + P) ÷ 6."}, {"f": "Triangular estimate", "b": "(O + M + P) ÷ 3."}, {"f": "Standard deviation of an estimate", "b": "(P − O) ÷ 6."}, {"f": "Activity variance", "b": "[(P − O) ÷ 6]²."}, {"f": "Path standard deviation", "b": "√(sum of activity variances). Variances add; sigmas do not."}, {"f": "Confidence ranges", "b": "±1σ = 68.27% · ±2σ = 95.45% · ±3σ = 99.73% · ±6σ = 99.99966%."}, {"f": "Total float", "b": "LS − ES = LF − EF."}, {"f": "Forward pass", "b": "EF = ES + duration − 1."}, {"f": "Backward pass", "b": "LS = LF − duration + 1."}, {"f": "Critical path", "b": "The longest path through the network; total float of zero."}, {"f": "Communication channels", "b": "n(n − 1) ÷ 2."}, {"f": "ROI", "b": "(Benefit − Cost) ÷ Cost × 100."}, {"f": "Benefit-cost ratio", "b": "Benefits ÷ Costs. Above 1 is viable."}, {"f": "Present value", "b": "FV ÷ (1 + r)ⁿ."}, {"f": "NPV decision rule", "b": "Choose the highest NPV. It outranks payback period."}, {"f": "IRR", "b": "The discount rate at which NPV = 0. Higher is better."}, {"f": "Straight-line depreciation", "b": "(Cost − salvage) ÷ useful life."}, {"f": "Point of Total Assumption (PTA)", "b": "((Ceiling − Target price) ÷ Buyer's share) + Target cost."}, {"f": "FPIF final fee", "b": "Target fee + ((Target cost − Actual cost) × Seller's share)."}, {"f": "Expected monetary value (EMV)", "b": "Probability × Impact, summed. Threats negative, opportunities positive."}, {"f": "Little's Law", "b": "Cycle time = WIP ÷ Throughput."}, {"f": "Velocity forecast", "b": "Points remaining ÷ rolling average velocity."}, {"f": "Estimate accuracy ranges", "b": "ROM −25% to +75% · Budget −10% to +25% · Definitive −5% to +10%."}, {"f": "Cost baseline vs project budget", "b": "Cost baseline = estimates + contingency. Budget = cost baseline + management reserve."}, {"f": "Control limits vs specification limits", "b": "Control limits are ±3σ set by the process; specification limits are set by the customer and sit outside them."}]}, {"id": "d_acronym", "title": "Acronyms", "cards": [{"f": "BAC", "b": "Budget at Completion"}, {"f": "EAC", "b": "Estimate at Completion"}, {"f": "ETC", "b": "Estimate to Complete"}, {"f": "VAC", "b": "Variance at Completion"}, {"f": "TCPI", "b": "To-Complete Performance Index"}, {"f": "EV / PV / AC", "b": "Earned Value / Planned Value / Actual Cost"}, {"f": "CPI / SPI", "b": "Cost / Schedule Performance Index"}, {"f": "CV / SV", "b": "Cost / Schedule Variance"}, {"f": "WBS", "b": "Work Breakdown Structure"}, {"f": "RBS", "b": "Resource Breakdown Structure, or Risk Breakdown Structure"}, {"f": "OBS", "b": "Organisational Breakdown Structure"}, {"f": "RAM", "b": "Responsibility Assignment Matrix"}, {"f": "RACI", "b": "Responsible, Accountable, Consulted, Informed"}, {"f": "RTM", "b": "Requirements Traceability Matrix"}, {"f": "CCB", "b": "Change Control Board"}, {"f": "PMO", "b": "Project Management Office"}, {"f": "EPMO", "b": "Enterprise Project Management Office"}, {"f": "VDO", "b": "Value Delivery Office"}, {"f": "EEF", "b": "Enterprise Environmental Factor"}, {"f": "OPA", "b": "Organisational Process Asset"}, {"f": "SOW", "b": "Statement of Work"}, {"f": "RFI / RFQ / RFP", "b": "Request for Information / Quotation / Proposal"}, {"f": "FFP", "b": "Firm Fixed Price"}, {"f": "FPIF", "b": "Fixed Price Incentive Fee"}, {"f": "FPEPA", "b": "Fixed Price with Economic Price Adjustment"}, {"f": "CPFF / CPIF / CPAF", "b": "Cost Plus Fixed Fee / Incentive Fee / Award Fee"}, {"f": "T&M", "b": "Time and Materials"}, {"f": "IDIQ", "b": "Indefinite Delivery Indefinite Quantity"}, {"f": "MSA", "b": "Master Services Agreement"}, {"f": "SLA", "b": "Service Level Agreement"}, {"f": "MOU", "b": "Memorandum of Understanding"}, {"f": "PTA", "b": "Point of Total Assumption"}, {"f": "BATNA", "b": "Best Alternative to a Negotiated Agreement"}, {"f": "ZOPA", "b": "Zone of Possible Agreement"}, {"f": "EMV", "b": "Expected Monetary Value"}, {"f": "CoQ", "b": "Cost of Quality"}, {"f": "QA / QC", "b": "Quality Assurance / Quality Control"}, {"f": "TQM", "b": "Total Quality Management"}, {"f": "DMAIC", "b": "Define, Measure, Analyse, Improve, Control"}, {"f": "PDCA", "b": "Plan-Do-Check-Act"}, {"f": "MVP / MBI", "b": "Minimum Viable Product / Minimum Business Increment"}, {"f": "DoD / DoR", "b": "Definition of Done / Definition of Ready"}, {"f": "WIP", "b": "Work In Progress"}, {"f": "CFD", "b": "Cumulative Flow Diagram"}, {"f": "WSJF", "b": "Weighted Shortest Job First"}, {"f": "MoSCoW", "b": "Must, Should, Could, Won't have"}, {"f": "INVEST", "b": "Independent, Negotiable, Valuable, Estimable, Small, Testable"}, {"f": "SAFe / LeSS / DA", "b": "Scaled Agile Framework / Large-Scale Scrum / Disciplined Agile"}, {"f": "PI", "b": "Program Increment (SAFe)"}, {"f": "XP", "b": "Extreme Programming"}, {"f": "TDD", "b": "Test-Driven Development"}, {"f": "CI", "b": "Continuous Integration"}, {"f": "ADKAR", "b": "Awareness, Desire, Knowledge, Ability, Reinforcement"}, {"f": "PESTLE", "b": "Political, Economic, Social, Technological, Legal, Environmental"}, {"f": "SWOT", "b": "Strengths, Weaknesses, Opportunities, Threats"}, {"f": "ESG", "b": "Environmental, Social, Governance"}, {"f": "SDG", "b": "Sustainable Development Goal"}, {"f": "JTA", "b": "Job Task Analysis"}, {"f": "ECO", "b": "Examination Content Outline"}, {"f": "ATP", "b": "Authorized Training Partner"}, {"f": "GAC", "b": "Global Accreditation Center"}, {"f": "PDU", "b": "Professional Development Unit"}, {"f": "CCRS", "b": "Continuing Certification Requirements System"}, {"f": "CAPM", "b": "Certified Associate in Project Management"}, {"f": "RAID", "b": "Risks, Assumptions, Issues, Dependencies"}, {"f": "ROM", "b": "Rough Order of Magnitude"}, {"f": "CCM", "b": "Critical Chain Method"}, {"f": "PDM", "b": "Precedence Diagramming Method"}, {"f": "FS / SS / FF / SF", "b": "Finish-to-Start / Start-to-Start / Finish-to-Finish / Start-to-Finish"}]}, {"id": "d_gloss", "title": "Glossary", "cards": [{"f": "Acceptance criteria", "b": "the conditions a deliverable must satisfy to be accepted by the customer."}, {"f": "Accepted deliverable", "b": "output formally signed off through validate scope."}, {"f": "Accuracy", "b": "closeness to the true value. Distinct from precision."}, {"f": "Activity", "b": "a distinct scheduled portion of work, below the work package."}, {"f": "Actual cost (AC)", "b": "cost incurred for the work performed."}, {"f": "Adaptive approach", "b": "development approach with emergent requirements delivered iteratively and incrementally."}, {"f": "ADKAR", "b": "Awareness, Desire, Knowledge, Ability, Reinforcement."}, {"f": "Affinity diagram", "b": "groups many ideas into related clusters."}, {"f": "Agile", "b": "family of adaptive approaches based on the Agile Manifesto."}, {"f": "Analogous estimating", "b": "top-down estimating from similar past work."}, {"f": "Assumption", "b": "a factor considered true without proof, tracked in the assumption log."}, {"f": "Backlog", "b": "ordered list of work to be done."}, {"f": "Backlog refinement", "b": "adding detail, estimates and order to backlog items."}, {"f": "Baseline", "b": "approved version of scope, schedule or cost, changed only via change control."}, {"f": "BATNA", "b": "best alternative to a negotiated agreement."}, {"f": "Benefits management plan", "b": "how and when benefits will be delivered and measured."}, {"f": "Benefits owner", "b": "the person accountable for realising the benefits, usually in the business."}, {"f": "Bidder conference", "b": "a meeting with all prospective sellers to ensure equal information."}, {"f": "Blocker / impediment", "b": "anything preventing the team from progressing."}, {"f": "Bottom-up estimating", "b": "summing detailed lower-level estimates."}, {"f": "Budget at completion (BAC)", "b": "total authorised budget."}, {"f": "Burndown chart", "b": "remaining work over time."}, {"f": "Burnup chart", "b": "completed work against total scope; shows scope change."}, {"f": "Business case", "b": "justification for the investment."}, {"f": "Cadence", "b": "the rhythm of recurring activities."}, {"f": "Change control board (CCB)", "b": "the body authorised to approve or reject changes."}, {"f": "Change log", "b": "record of all change requests and their disposition."}, {"f": "Change request", "b": "formal proposal to modify a baseline or document."}, {"f": "Charter", "b": "document authorising the project and the PM."}, {"f": "Configuration management", "b": "control of product versions and characteristics."}, {"f": "Constraint", "b": "a limiting factor."}, {"f": "Contingency reserve", "b": "funds or time for identified risks; inside the cost baseline."}, {"f": "Contingent response strategy", "b": "a response executed only if a defined trigger occurs."}, {"f": "Control account", "b": "management control point where scope, budget and schedule integrate."}, {"f": "Control chart", "b": "displays process stability against control limits."}, {"f": "Control limits", "b": "statistical boundaries of a process, usually ±3σ; set by the process."}, {"f": "Cost baseline", "b": "approved time-phased budget excluding management reserve."}, {"f": "Cost of delay", "b": "economic loss per unit time of not having a capability."}, {"f": "Cost of quality", "b": "conformance plus non-conformance costs."}, {"f": "Cost performance index (CPI)", "b": "EV ÷ AC."}, {"f": "Cost variance (CV)", "b": "EV − AC."}, {"f": "Crashing", "b": "shortening duration by adding resources, at additional cost."}, {"f": "Critical chain", "b": "the resource-constrained longest path, managed with buffers."}, {"f": "Critical path", "b": "the longest path through the network; determines minimum duration."}, {"f": "Cumulative flow diagram (CFD)", "b": "visualises WIP, bottlenecks and cycle time over time."}, {"f": "Cycle time", "b": "elapsed time from starting work to completing it."}, {"f": "Cynefin", "b": "sense-making framework classifying situations as clear, complicated, complex or chaotic."}, {"f": "Decision tree", "b": "analysis comparing options by expected monetary value."}, {"f": "Definition of done (DoD)", "b": "shared standard for an increment to be releasable."}, {"f": "Definition of ready (DoR)", "b": "criteria for a backlog item to enter an iteration."}, {"f": "Deliverable", "b": "any unique, verifiable product, result or capability."}, {"f": "Delphi technique", "b": "anonymous iterative expert consensus."}, {"f": "Dependency", "b": "a logical relationship between activities."}, {"f": "Development approach", "b": "predictive, adaptive or hybrid."}, {"f": "Discretionary dependency", "b": "preferred rather than required logic."}, {"f": "Earned value (EV)", "b": "budgeted value of work actually completed."}, {"f": "EEF", "b": "enterprise environmental factor; conditions outside project control."}, {"f": "Emotional intelligence", "b": "recognising and managing emotions in self and others."}, {"f": "Epic", "b": "a large body of work decomposed into features and stories."}, {"f": "Escalate", "b": "raise beyond your authority, with facts and a recommendation."}, {"f": "Estimate at completion (EAC)", "b": "forecast total cost."}, {"f": "Estimate to complete (ETC)", "b": "forecast cost of remaining work."}, {"f": "Expected monetary value (EMV)", "b": "probability × impact."}, {"f": "Explicit knowledge", "b": "knowledge that can be codified and documented."}, {"f": "Fallback plan", "b": "the plan used if the primary risk response fails."}, {"f": "Fast tracking", "b": "overlapping activities normally done in sequence; adds risk."}, {"f": "Feature", "b": "a set of related requirements delivering value."}, {"f": "Fishbone diagram", "b": "cause-and-effect diagram for root cause analysis."}, {"f": "Float / slack", "b": "permissible delay without affecting the project (total) or the successor (free)."}, {"f": "Focus areas", "b": "PMBOK 8 term for the process groups."}, {"f": "Forecast", "b": "estimate of future conditions based on current performance."}, {"f": "Free float", "b": "delay possible without delaying the successor's early start."}, {"f": "Functional organisation", "b": "hierarchy by specialism; PM authority is minimal."}, {"f": "Gold plating", "b": "delivering more than required without authorisation."}, {"f": "Governance", "b": "framework of authority, decision rights and accountability."}, {"f": "Grade", "b": "a category of features; distinct from quality."}, {"f": "Ground rules", "b": "agreed behavioural expectations, held in the team charter."}, {"f": "Hybrid approach", "b": "combination of predictive and adaptive elements."}, {"f": "Impediment log", "b": "record of blockers and their resolution."}, {"f": "Increment", "b": "a usable, potentially releasable piece of the product."}, {"f": "Incremental delivery", "b": "delivering usable pieces successively."}, {"f": "Information radiator", "b": "large, visible, self-updating display of project state."}, {"f": "Issue", "b": "a current condition affecting the project; a risk that occurred."}, {"f": "Iteration", "b": "a fixed timebox producing an increment."}, {"f": "Iterative approach", "b": "refining the same deliverable through successive cycles."}, {"f": "Kanban", "b": "flow-based method using visualisation and WIP limits."}, {"f": "Kano model", "b": "classifies features as basic, performance or delighter."}, {"f": "Lag", "b": "a delay between dependent activities."}, {"f": "Lead", "b": "an acceleration allowing overlap between dependent activities."}, {"f": "Lead time", "b": "elapsed time from customer request to delivery."}, {"f": "Lessons learned register", "b": "live record during the project."}, {"f": "Lessons learned repository", "b": "organisational archive; an OPA."}, {"f": "Life-cycle cost", "b": "total cost of ownership across the whole life, including disposal."}, {"f": "Little's Law", "b": "cycle time = WIP ÷ throughput."}, {"f": "Management reserve", "b": "funds for unknown unknowns; outside the cost baseline."}, {"f": "Mandatory dependency", "b": "hard logic, physically or contractually required."}, {"f": "Matrix organisation", "b": "dual reporting between functional and project lines."}, {"f": "MBI", "b": "minimum business increment."}, {"f": "Milestone", "b": "a significant point with zero duration."}, {"f": "Monte Carlo simulation", "b": "probabilistic modelling producing outcome distributions."}, {"f": "MoSCoW", "b": "must, should, could, won't have."}, {"f": "MVP", "b": "minimum viable product."}, {"f": "Net present value (NPV)", "b": "discounted future cash flows less investment."}, {"f": "Non-conformance cost", "b": "internal and external failure costs."}, {"f": "OPA", "b": "organisational process asset."}, {"f": "Opportunity", "b": "an uncertain event with positive impact."}, {"f": "Outcome", "b": "the change resulting from an output."}, {"f": "Output", "b": "what the project produces."}, {"f": "Parametric estimating", "b": "estimating using a statistical relationship."}, {"f": "Pareto diagram", "b": "ordered histogram showing the vital few causes."}, {"f": "Payback period", "b": "time to recover the investment."}, {"f": "Performance measurement baseline", "b": "scope, schedule and cost baselines combined."}, {"f": "PERT", "b": "three-point beta estimate: (O + 4M + P) ÷ 6."}, {"f": "PESTLE", "b": "political, economic, social, technological, legal, environmental scan."}, {"f": "Planned value (PV)", "b": "budgeted value of work scheduled."}, {"f": "Planning package", "b": "control account content not yet decomposed into activities."}, {"f": "PMO", "b": "project management office: supportive, controlling or directive."}, {"f": "Point of total assumption (PTA)", "b": "cost beyond which the seller bears all overrun in an FPIF."}, {"f": "Portfolio", "b": "projects, programmes and operations managed together for strategic objectives."}, {"f": "Precision", "b": "consistency of repeated measurements."}, {"f": "Predictive approach", "b": "plan-driven approach with defined scope up front."}, {"f": "Prevention cost", "b": "cost of preventing defects."}, {"f": "Product backlog", "b": "the ordered list of everything that might be needed."}, {"f": "Product owner", "b": "accountable for maximising product value and ordering the backlog."}, {"f": "Programme", "b": "related projects managed together for benefits not available separately."}, {"f": "Progressive elaboration", "b": "refining plans as more becomes known."}, {"f": "Psychological safety", "b": "belief that speaking up will not be punished."}, {"f": "Quality", "b": "degree to which requirements are fulfilled."}, {"f": "RACI", "b": "responsible, accountable, consulted, informed."}, {"f": "RAID log", "b": "risks, assumptions, issues, dependencies."}, {"f": "Regression analysis", "b": "statistical relationship between variables."}, {"f": "Requirements traceability matrix", "b": "links requirements to origin and deliverables."}, {"f": "Reserve analysis", "b": "evaluating the adequacy of contingency and management reserves."}, {"f": "Residual risk", "b": "risk remaining after responses are implemented."}, {"f": "Resource levelling", "b": "adjusting dates to resource limits; can change the critical path."}, {"f": "Resource smoothing", "b": "adjusting within float; does not change the critical path."}, {"f": "Retrospective", "b": "team review of process producing improvement actions."}, {"f": "Risk", "b": "an uncertain event that may affect objectives."}, {"f": "Risk appetite", "b": "degree of uncertainty an organisation will accept for reward."}, {"f": "Risk breakdown structure", "b": "hierarchical categorisation of risk sources."}, {"f": "Risk register", "b": "record of individual risks and responses."}, {"f": "Risk report", "b": "summary of overall project risk."}, {"f": "Risk threshold", "b": "the measurable level at which action is required."}, {"f": "Rolling wave planning", "b": "detailed near-term planning, high-level long-term."}, {"f": "Root cause analysis", "b": "determining the underlying reason for a problem."}, {"f": "Rule of seven", "b": "seven consecutive points on one side of the mean signals an out-of-control process."}, {"f": "S-curve", "b": "cumulative cost or effort over time."}, {"f": "Salience model", "b": "power, legitimacy and urgency classification of stakeholders."}, {"f": "Schedule baseline", "b": "approved version of the schedule."}, {"f": "Schedule performance index (SPI)", "b": "EV ÷ PV."}, {"f": "Schedule variance (SV)", "b": "EV − PV."}, {"f": "Scope creep", "b": "uncontrolled expansion of scope."}, {"f": "Scrum", "b": "an agile framework with defined roles, events and artifacts."}, {"f": "Secondary risk", "b": "a risk created by implementing a risk response."}, {"f": "Sensitivity analysis", "b": "determining which variables most affect outcomes."}, {"f": "Servant leadership", "b": "leading by enabling and removing obstacles."}, {"f": "Specification limits", "b": "customer-set boundaries; wider than control limits."}, {"f": "Spike", "b": "a timeboxed investigation to reduce uncertainty."}, {"f": "Sponsor", "b": "provides funding, authority and executive support."}, {"f": "Sprint", "b": "Scrum's timebox, one month or less."}, {"f": "Sprint goal", "b": "the single objective of a sprint."}, {"f": "Stakeholder", "b": "anyone who affects, is affected by, or perceives themselves affected."}, {"f": "Stakeholder engagement assessment matrix", "b": "current versus desired engagement levels."}, {"f": "Story point", "b": "a relative measure of size combining complexity, effort and uncertainty."}, {"f": "Sunk cost", "b": "cost already incurred; irrelevant to future decisions."}, {"f": "Sustainability", "b": "meeting present needs without compromising future ones; environmental, social and economic."}, {"f": "SWOT", "b": "strengths, weaknesses, opportunities, threats."}, {"f": "Tacit knowledge", "b": "experiential knowledge that resists codification."}, {"f": "Tailoring", "b": "deliberate adaptation of approach and process to context."}, {"f": "Technical debt", "b": "deferred work that increases future cost."}, {"f": "Throughput", "b": "items completed per unit of time."}, {"f": "Timebox", "b": "a fixed, non-extendable period."}, {"f": "To-complete performance index (TCPI)", "b": "efficiency required on remaining work."}, {"f": "Total float", "b": "delay possible without delaying the project finish."}, {"f": "Transfer", "b": "risk response shifting impact to a third party."}, {"f": "Trigger / risk trigger", "b": "an indicator that a risk is about to occur or has occurred."}, {"f": "Triple constraint", "b": "scope, schedule, cost; extended by quality, risk, resources and value."}, {"f": "Value", "b": "the worth or usefulness of something to stakeholders."}, {"f": "Value stream map", "b": "visualisation of flow and waste."}, {"f": "Variance at completion (VAC)", "b": "BAC − EAC."}, {"f": "Velocity", "b": "story points completed per iteration."}, {"f": "Verified deliverable", "b": "output that has passed control quality."}, {"f": "Virtual team", "b": "geographically distributed team."}, {"f": "WBS", "b": "hierarchical decomposition of total project scope."}, {"f": "WBS dictionary", "b": "detail behind each WBS component."}, {"f": "WIP limit", "b": "cap on concurrent work items in a workflow stage."}, {"f": "Work package", "b": "lowest WBS level, where cost and duration are estimated."}, {"f": "Work performance data / information / report", "b": "raw · analysed · communicated."}, {"f": "Workaround", "b": "unplanned response to an unanticipated issue."}, {"f": "WSJF", "b": "weighted shortest job first: cost of delay ÷ job size."}, {"f": "ZOPA", "b": "zone of possible agreement in a negotiation."}]}, {"id": "d_mindset", "title": "Mindset rules", "cards": [{"f": "Never do nothing.", "b": "\"Take no action\", \"wait\", \"let it resolve itself\" are almost always wrong."}, {"f": "Never escalate first.", "b": "Gather facts, assess impact, try to resolve at your level. Escalate with a recommendation when it genuinely exceeds your authority."}, {"f": "Never go around a person.", "b": "Problem with a team member → talk to the team member. Problem with a stakeholder → talk to the stakeholder."}, {"f": "Understand before acting.", "b": "When information is missing, the first step is analyse / assess / investigate / review the plan / meet the person."}, {"f": "But act when the analysis is done.", "b": "If the scenario says the impact is already assessed, the next step is the action, not more analysis."}, {"f": "Follow the process.", "b": "Changes → change control. Risks → register. Issues → issue log. Lessons → repository."}, {"f": "Consult the plan.", "b": "\"Review the [X] management plan\" is right far more often than it feels. The agreed answer usually already exists."}, {"f": "Be proactive.", "b": "Prevention beats correction; risk management beats issue management; \"what should the PM have done?\" is nearly always a planning answer."}, {"f": "Serve the team.", "b": "Remove impediments. Do not assign tasks to a self-organising team. Do not accept work thrown directly at developers."}, {"f": "Never trade away quality, safety, ethics or compliance.", "b": "Instant elimination for any option that does."}, {"f": "Never gold plate and never allow scope creep.", "b": "A core PMI mindset rule."}, {"f": "Collaborate first in conflict.", "b": "Problem-solving beats compromise beats smoothing beats forcing beats avoiding."}, {"f": "Engage resistance, do not overrule it.", "b": "Find the cause first."}, {"f": "Be transparent.", "b": "Hiding bad news is always wrong. So is escalating before you have facts."}, {"f": "Communicate in the right mode.", "b": "Complex, sensitive, contentious → interactive, face to face."}, {"f": "Value first.", "b": "In adaptive contexts, deliver the highest-value item and get feedback."}, {"f": "Tailor.", "b": "There is no universal process; the right amount depends on context."}, {"f": "Involve the team.", "b": "Estimates, approach and commitments come from the people doing the work."}, {"f": "Document decisions, not just outcomes.", "b": "Rationale is what future teams need."}, {"f": "Keep the sponsor informed, and bring options.", "b": "Escalation without a recommendation is abdication."}]}], "plan": [{"d": 1, "w": "Week 1 — diagnose and rebuild", "t": "Full 180-question exam simulation, cold, timed. Do not study first. Record the domain breakdown."}, {"d": 2, "w": "Week 1 — diagnose and rebuild", "t": "Error log the whole mock. Categorise each miss: knowledge, mindset, misread or rushed."}, {"d": 3, "w": "Week 1 — diagnose and rebuild", "t": "Weakest domain — re-read the guide part, then drill 50 questions from that bank."}, {"d": 4, "w": "Week 1 — diagnose and rebuild", "t": "Second weakest domain — same pattern."}, {"d": 5, "w": "Week 1 — diagnose and rebuild", "t": "Formulas: write the whole sheet from blank paper. Then the Formulas flashcard deck and 25 calculation questions."}, {"d": 6, "w": "Week 1 — diagnose and rebuild", "t": "Mindset: Part 8 plus the scenario playbook. Drill 50 situational questions, writing one line of reasoning for each."}, {"d": 7, "w": "Week 1 — diagnose and rebuild", "t": "Rest, or light flashcards only."}, {"d": 8, "w": "Week 2 — Business Environment and agile", "t": "Governance, PMO types, escalation thresholds, success metrics. Drill the governance bank."}, {"d": 9, "w": "Week 2 — Business Environment and agile", "t": "Compliance end to end, plus the consequences of non-compliance."}, {"d": 10, "w": "Week 2 — Business Environment and agile", "t": "Risk: full process, all ten response strategies, secondary and residual risk, EMV and decision trees."}, {"d": 11, "w": "Week 2 — Business Environment and agile", "t": "Change control, issues and impediments. Predictive versus agile versus hybrid handling of the same change."}, {"d": 12, "w": "Week 2 — Business Environment and agile", "t": "Scrum, Kanban, XP, metrics and servant leadership. Drill the agile banks."}, {"d": 13, "w": "Week 2 — Business Environment and agile", "t": "Hybrid design: where governance sits, how reporting translates, how contracts adapt."}, {"d": 14, "w": "Week 2 — Business Environment and agile", "t": "Mock exam 2, timed. Compare the domain breakdown with day 1."}, {"d": 15, "w": "Week 3 — Process depth and endurance", "t": "Scope: requirements, RTM, WBS, validate versus control, scope creep."}, {"d": 16, "w": "Week 3 — Process depth and endurance", "t": "Schedule: network diagrams, float, compression, levelling versus smoothing. Work Part 17.1 twice."}, {"d": 17, "w": "Week 3 — Process depth and endurance", "t": "Cost and finance: baselines, reserves, funding reconciliation, NPV/IRR/BCR."}, {"d": 18, "w": "Week 3 — Process depth and endurance", "t": "Quality: cost of quality, control charts, Pareto, audits, prevention over inspection."}, {"d": 19, "w": "Week 3 — Process depth and endurance", "t": "Procurement: all contract types, PTA, source selection, agile contracting."}, {"d": 20, "w": "Week 3 — Process depth and endurance", "t": "People: conflict, motivation theories, Tuckman, EI, stakeholder analysis models."}, {"d": 21, "w": "Week 3 — Process depth and endurance", "t": "Full 180-question exam simulation, timed, with breaks."}, {"d": 22, "w": "Week 4 — consolidate and taper", "t": "Error log review across all mocks. Look for repeated *patterns*, not individual facts."}, {"d": 23, "w": "Week 4 — consolidate and taper", "t": "Drill every flagged question. Clear the ones you now know."}, {"d": 24, "w": "Week 4 — consolidate and taper", "t": "AI, sustainability, value delivery, benefits management."}, {"d": 25, "w": "Week 4 — consolidate and taper", "t": "Models, methods and artifacts (Part 12). Flashcard the glossary and acronyms."}, {"d": 26, "w": "Week 4 — consolidate and taper", "t": "Mixed custom quiz, 100 questions, all banks, exam mode."}, {"d": 27, "w": "Week 4 — consolidate and taper", "t": "Weakest remaining bank, drilled to 85%."}, {"d": 28, "w": "Week 4 — consolidate and taper", "t": "Light: formulas, mindset rules, the scenario playbook. No new material."}, {"d": 29, "w": "Week 4 — consolidate and taper", "t": "Logistics: confirm the test centre or run the OnVUE system test. ID ready. Sleep early."}, {"d": 30, "w": "Week 4 — consolidate and taper", "t": "Rest. Nothing heavier than a flashcard skim in the morning. Exam."}], "cases": [{"title": "Case 1 — The hospital records migration", "sc": "You are the project manager for migrating a regional hospital group's patient records to a new cloud platform. The contract with the platform vendor is firm fixed price. Go-live is fixed to coincide with the retirement of the old system's support contract in seven months. The hospital's chief medical officer (CMO) sponsors the project; the IT director controls the infrastructure team, who work on the project part-time in a weak matrix. The data protection officer (DPO) was consulted during initiation but has not been involved since. Three months in, the vendor's integration work is on schedule, but a clinical lead tells you that ward staff have not been told the new system changes how medication records are entered. The IT director has just reassigned two infrastructure engineers to an urgent network outage for \"a few weeks\". The latest earned value figures are CPI 0.97 and SPI 0.88.", "n": 5}, {"title": "Case 2 — The agile team under a fixed contract", "sc": "A retail company has contracted your firm to build a customer loyalty app. The contract fixes the price and a list of 40 features. Your team runs two-week sprints. After six sprints, velocity has stabilised at 32 points. 610 points of the original scope remain, and the customer's marketing director keeps adding \"small\" features directly with developers during sprint reviews. The product owner is a junior employee of the customer who cannot make priority decisions without the marketing director. The contract end date is 18 weeks away.", "n": 4}, {"title": "Case 3 — The infrastructure programme and the new regulation", "sc": "You manage a two-year project building a regional water treatment facility, currently 40% complete. The approach is predictive; the schedule and cost baselines are approved. A new national environmental regulation, published last week, tightens discharge limits and takes effect in 14 months — before your planned commissioning date. The design team believes compliance requires an additional filtration stage. The sponsor, a municipal director, is on leave for three weeks. The contingency reserve is 60% consumed.", "n": 4}, {"title": "Case 4 — The global rollout and the resistant region", "sc": "You lead the global rollout of a new sales CRM across six regions. Four regions have adopted it successfully. The Asia-Pacific regional sales director is openly resistant, saying the system \"doesn't fit how we sell here\". Her team's usage is 15%. She reports to the global sales VP, who sponsors the project and is frustrated. An analysis of APAC usage shows the system requires a customer approval step that does not exist in APAC's distributor-led sales model. The sponsor wants you to \"make usage mandatory and report non-compliance\".", "n": 4}, {"title": "Case 5 — The vendor dispute", "sc": "Your project uses a specialist vendor under a cost-plus-incentive-fee contract to develop a control system. At the midpoint, actual costs are 25% above target. The vendor attributes this to \"requirement ambiguity\" and has submitted a claim for additional fee. Your review finds that three of the vendor's claimed ambiguities are genuine gaps in the buyer's specification, while five are standard industry requirements the vendor should have anticipated. The relationship has become tense, and the vendor's lead engineer has stopped attending weekly meetings.", "n": 4}, {"title": "Case 6 — The AI-assisted forecasting tool", "sc": "Your PMO has introduced an AI tool that generates schedule forecasts from historical project data. It forecasts your project will finish on time with 92% confidence. Your team's own assessment, based on current blockers and a key supplier delay, is that the project is six weeks late. The steering committee likes the AI forecast and has asked why your report differs. The tool's training data comes from the organisation's last 40 projects, none of which used your project's new supplier.", "n": 4}, {"title": "Case 7 — The sustainability commitment", "sc": "Your company has publicly committed to net-zero operations by 2030. You manage the construction of a new distribution warehouse. The business case was approved two years ago on cost and capacity grounds and does not mention sustainability. The lowest-cost design uses gas heating and no solar provision. A retrofit to add solar and heat pumps later would cost roughly three times as much as including them now. The sponsor is focused on hitting the budget. A local community group has raised concerns about lorry traffic and noise.", "n": 4}, {"title": "Case 8 — The merger and the stranded project", "sc": "Your company has just merged with a competitor. Your project — a new customer billing platform, 55% complete — was sponsored by an executive who has left in the merger. The acquiring company already has a billing platform in production. No one has told you whether your project continues. Your team is anxious and two members have accepted offers elsewhere. Your vendor is asking whether to proceed with the next paid phase, due to start in two weeks.", "n": 4}, {"title": "Case 9 — The data centre relocation", "sc": "You are relocating a bank's primary data centre to a new facility over a single planned weekend outage, eight weeks from now. The migration plan was built by an external consultancy that has since left. Rehearsals have been run twice; the second took 41 hours against a 36-hour outage window. The operations director insists the date cannot move because it has been announced to regulators and customers. Your infrastructure lead privately tells you that two critical database clusters have never been included in a rehearsal because their owners \"didn't have time\".", "n": 4}, {"title": "Case 10 — The volunteer-run charity project", "sc": "You are leading a project for a national charity to launch a volunteer-matching platform. Most of the team are volunteers who contribute a few hours a week around their jobs. Two paid staff members from the charity work on it part-time. Progress has slowed because volunteers miss meetings and commitments slip. A major donor funding the project wants a launch date and monthly reports. One volunteer, a senior software architect, has strong opinions and frequently overrides other volunteers' design decisions.", "n": 4}, {"title": "Case 11 — The acquisition integration", "sc": "Your company has acquired a smaller firm and you lead the integration of their finance, HR and IT systems within nine months. The acquired firm's staff are anxious about job security, and several key people have already left. Their finance lead, who knows the legacy systems best, has told you she is interviewing elsewhere. The integration steering committee meets monthly and is focused on synergy savings. Your integration team has identified that the acquired firm's contracts with three major customers contain change-of-control clauses that were not flagged during due diligence.", "n": 4}, {"title": "Case 12 — The public sector digital service", "sc": "You are delivering a new online service for a government agency that lets citizens apply for permits. The agency mandates a stage-gate governance model with formal approval at each gate. Your delivery team works in sprints. User research shows that 30% of applicants are over 65 and many struggle with the current paper form. Accessibility legislation applies. The next stage gate requires a \"complete requirements specification\", but your team's approach is to discover requirements iteratively through user testing.", "n": 4}]}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('DATA').textContent);
var SEC = D.sections, BANKS = D.banks, DECKS = D.decks || [], PLAN = D.plan || [], CASES = D.cases || [];
var BYID = {}; SEC.forEach(function(s){BYID[s.id]=s;});
var BK = {}; BANKS.forEach(function(b){BK[b.id]=b;});
var DK = {}; DECKS.forEach(function(d){DK[d.id]=d;});
var ALLQ = [], QBANK = {}; BANKS.forEach(function(b){ b.qs.forEach(function(q){ ALLQ.push(q); QBANK[q.id]=b.id; }); });

/* ---------- runtime capabilities (optional) ---------- */
var SAMPLE=null, DL=null;
function useCap(n){ try{ return (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null); }catch(e){ return Promise.resolve(null); } }
useCap('sample').then(function(x){ SAMPLE=x; buildNav(); refreshAI(); }).catch(function(){});
useCap('downloads').then(function(x){ DL=x; if(location.hash==='#/progress') renderProgress(); }).catch(function(){});
function refreshAI(){ [].forEach.call(document.querySelectorAll('[data-ai]'),function(el){ el.style.display=SAMPLE?'':'none'; }); }
function aiErr(e){
  var c=e&&e.code;
  if(c==='not_granted') return 'The tutor needs your permission to use your Claude account. Allow it when prompted to use AI features.';
  if(c==='rate_limited'||c==='queue_overflow') return 'Too many requests just now. Wait a moment and try again.';
  if(c==='cancelled') return '';
  if(c==='refused') return 'The tutor could not answer that one.';
  if(c==='invalid_json') return 'The generated questions came back malformed. Try again.';
  if(c==='session_expired') return 'Your session expired. Reload the page.';
  return 'The tutor is unavailable right now.';
}
var RULES='You are an expert PMP exam tutor. Align everything to the PMP Examination Content Outline effective 9 July 2026 '+
 '(People 33%, Process 41%, Business Environment 26%; about 40% predictive and 60% agile or hybrid) and the PMBOK Guide Eighth Edition '+
 '(six principles; performance domains Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk; five focus areas). '+
 'Teach the PMI mindset: assess before acting, address people directly, follow the process, never trade away ethics, safety or compliance, '+
 'collaborate first, serve the team. Be accurate, concise and practical. Use plain text with short paragraphs; no markdown headings or tables.';

/* ---------- storage ---------- */
var store = {read:{}, best:{}, flag:{}, known:{}, srs:{}, plan:{}, stat:{}};
function load(){ try{ var r=localStorage.getItem('pmp2026'); if(r) store=JSON.parse(r);
  if(!store.read)store.read={}; if(!store.best)store.best={}; if(!store.flag)store.flag={}; if(!store.known)store.known={}; if(!store.srs)store.srs={}; if(!store.plan)store.plan={}; if(!store.stat)store.stat={}; }catch(e){} }
function save(){ try{ localStorage.setItem('pmp2026', JSON.stringify(store)); }catch(e){} }
load();

/* ---------- helpers ---------- */
var view=document.getElementById('view'), nav=document.getElementById('nav');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function go(h){ location.hash = h; }
function totalQ(){ var n=0; BANKS.forEach(function(b){n+=b.qs.length;}); return n; }

/* ---------- spaced repetition ---------- */
var DAY = 86400000, IVL = [1,2,4,8,16,32];
function srsUpdate(id, right){
  var r = store.srs[id] || {b:0, due:0};
  if(right){ r.b = Math.min(r.b+1, IVL.length-1); } else { r.b = 0; }
  r.due = Date.now() + IVL[r.b]*DAY;
  store.srs[id] = r;
}
function dueQuestions(){
  var now = Date.now();
  return ALLQ.filter(function(q){ var r=store.srs[q.id]; return r && r.due<=now; });
}
function isRight(q, ans){
  if(q.t==='hot') return ans===q.a;
  if(q.t==='match'){ if(!ans) return false; for(var i=0;i<q.l.length;i++){ if(ans[i]!==i) return false; } return true; }
  if(q.m){ if(!ans || !ans.length || ans.length!==q.a.length) return false;
    var a=ans.slice().sort(function(x,y){return x-y;});
    for(var i=0;i<a.length;i++){ if(a[i]!==q.a[i]) return false; } return true; }
  return ans===q.a;
}
function ansLetters(a, q){ if(q && q.t==='hot') return a==null?'—':'area '+(a+1);
  if(q && q.t==='match'){ if(!a) return '—'; return q.l.map(function(l,i){ return l+' → '+(a[i]!=null?q.r[a[i]]:'(blank)'); }).join(' · '); }
  if(a==null) return '—'; if(Array.isArray(a)) return a.map(function(k){return 'ABCDE'[k];}).join(', '); return 'ABCDE'[a]; }
function corrText(q){ if(q.t==='hot') return 'See the highlighted area — '+q.e;
  if(q.t==='match') return q.l.map(function(l,i){ return l+' → '+q.r[i]; }).join(' · ');
  if(q.m) return q.a.map(function(k){return 'ABCDE'[k]+'. '+q.o[k];}).join('  ·  '); return 'ABCDE'[q.a]+'. '+q.o[q.a]; }

/* ---------- nav ---------- */
function buildNav(){
  var h='<h4>Study guide</h4>';
  SEC.forEach(function(s){
    h+='<a href="#/s/'+s.id+'" data-k="'+s.id+'" class="'+(store.read[s.id]?'done':'')+'">'+esc(s.title)+'</a>';
  });
  h+='<h4>Practice</h4><a href="#/practice">All question banks<span class="n">'+totalQ()+'</span></a>';
  BANKS.filter(function(b){return b.group==='core'||b.group==='advanced';}).forEach(function(b){
    h+='<a href="#/q/'+b.id+'" data-k="'+b.id+'">'+esc(b.title)+'<span class="n">'+b.qs.length+'</span></a>';
  });
  h+='<h4>2026 exam formats</h4>';
  BANKS.filter(function(b){return b.group==='formats';}).forEach(function(b){
    h+='<a href="#/q/'+b.id+'" data-k="'+b.id+'">'+esc(b.title)+'<span class="n">'+b.qs.length+'</span></a>';
  });
  h+='<h4>Exam simulation</h4>';
  BANKS.filter(function(b){return b.group==='exam';}).forEach(function(b){
    h+='<a href="#/q/'+b.id+'">'+esc(b.title.replace(/\s*\(\d+\)/,''))+'<span class="n">'+b.qs.length+'</span></a>';
  });
  h+='<a href="#/fullexam">Full exam (180 Q / 240 min)</a>';
  h+='<a href="#/custom">Custom quiz</a>';
  h+='<h4>Flashcards</h4>';
  DECKS.forEach(function(d){
    h+='<a href="#/f/'+d.id+'">'+esc(d.title)+'<span class="n">'+d.cards.length+'</span></a>';
  });
  h+='<h4 data-ai style="'+(SAMPLE?'':'display:none')+'">AI tutor</h4>'+
     '<a data-ai style="'+(SAMPLE?'':'display:none')+'" href="#/tutor">Ask the tutor</a>'+
     '<a data-ai style="'+(SAMPLE?'':'display:none')+'" href="#/gen">Generate new questions</a>';
  h+='<h4>Drills</h4><a href="#/review">Review queue<span class="n">'+dueQuestions().length+'</span></a>'+
     '<a href="#/calc">Calculation drills<span class="n">∞</span></a>';
  h+='<h4>Tools</h4><a href="#/search">Search</a><a href="#/flagged">Flagged questions<span class="n">'+
     Object.keys(store.flag).length+'</span></a><a href="#/planner">30-day plan</a><a href="#/progress">My progress</a>';
  nav.innerHTML=h;
}
function markNav(key){
  [].forEach.call(nav.querySelectorAll('a'),function(a){
    a.classList.toggle('on', a.getAttribute('href')===key);
  });
}

/* ---------- reading view ---------- */
function renderSection(id){
  var s=BYID[id]; if(!s){ go('#/s/'+SEC[0].id); return; }
  var i=SEC.indexOf(s);
  var chips = s.subs.length>1 ? '<div class="chips">'+s.subs.map(function(x){
      return '<a href="#'+x.a+'">'+esc(x.t)+'</a>';}).join('')+'</div>' : '';
  var prev = i>0 ? '<a class="ib" href="#/s/'+SEC[i-1].id+'">‹ Previous</a>' : '';
  var next = i<SEC.length-1 ? '<a class="ib pri" href="#/s/'+SEC[i+1].id+'">Next ›</a>' : '';
  view.innerHTML = '<article><h1>'+esc(s.title)+'</h1>'+chips+s.html+'</article>'+
    '<div class="pager">'+prev+next+
    '<span class="sp" style="flex:1"></span>'+
    '<label class="ck"><input type="checkbox" id="rd" '+(store.read[id]?'checked':'')+'> Mark as read</label></div>';
  document.getElementById('rd').addEventListener('change',function(){
    if(this.checked) store.read[id]=1; else delete store.read[id];
    save(); buildNav(); markNav('#/s/'+id);
  });
  document.getElementById('bartitle').textContent = s.title;
  markNav('#/s/'+id);
  window.scrollTo(0,0);
}

/* ---------- practice index ---------- */
function renderPractice(){
  function grp(title, list){
    if(!list.length) return '';
    var h='<h3>'+title+'</h3><div class="grid">';
    list.forEach(function(b){
      var best=store.best[b.id];
      h+='<button class="card" data-b="'+b.id+'"><b>'+esc(b.title)+'</b>'+
         '<small>'+b.qs.length+' questions'+(best?' · best '+best+'%':'')+'</small>'+
         (best?'<span class="bar"><i style="width:'+best+'%"></i></span>':'')+'</button>';
    });
    return h+'</div>';
  }
  view.innerHTML='<h1>Question banks</h1><p class="note">'+totalQ()+
    ' questions in total. Practice mode gives feedback after each answer; exam mode hides it until the end and runs a timer.</p>'+
    grp('Core banks', BANKS.filter(function(b){return b.group==='core';}))+
    grp('Advanced banks', BANKS.filter(function(b){return b.group==='advanced';}))+
    grp('2026 exam formats — case studies, matching, graphics', BANKS.filter(function(b){return b.group==='formats';}))+
    grp('Exam simulation', BANKS.filter(function(b){return b.group==='exam';}))+
    '<div class="row"><a class="ib pri" href="#/fullexam">Full exam simulation</a>'+
    '<a class="ib" href="#/custom">Build a custom quiz</a><a class="ib" href="#/flagged">Flagged questions</a></div>';
  [].forEach.call(view.querySelectorAll('.card'),function(c){
    c.addEventListener('click',function(){ go('#/q/'+c.dataset.b); });
  });
  document.getElementById('bartitle').textContent='Question banks';
  markNav('#/practice'); window.scrollTo(0,0);
}

/* ---------- quiz setup ---------- */
function renderSetup(bankId){

   (isMock?'<blockquote><p>The mock runs at 80 minutes for 60 questions, matching real exam pacing of roughly 80 seconds per question.</p></blockquote>':'')+

/* ---------- quiz engine ---------- */
var Q=null, tick=null;
function shuffleArr(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function startQuiz(pool,title,bankId,mode,shuffle,n){
  if(shuffle) shuffleArr(pool);
  pool=pool.slice(0,Math.max(1,Math.min(n,pool.length)));
  Q={list:pool,title:title,bank:bankId,mode:mode,i:0,ans:[],checked:false,
     secs: mode==='exam' ? pool.length*80 : 0, t0:Date.now()};
  if(tick){ clearInterval(tick); tick=null; }
  if(mode==='exam'){ tick=setInterval(function(){ Q.secs--; paintTimer(); if(Q.secs<=0){ clearInterval(tick); finish(); } },1000); }
  drawQ();
}
function paintTimer(){
  var el=document.getElementById('tmr'); if(!el||!Q) return;
  var m=Math.floor(Q.secs/60), s=Q.secs%60;
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.classList.toggle('warn', Q.secs<300);
}
function drawQ(){
  var q=Q.list[Q.i], sel=Q.ans[Q.i];
  var pct=Math.round(Q.i/Q.list.length*100);
  var h='<div class="qmeta"><span>'+esc(Q.title)+'</span><span>·</span><span>Question '+(Q.i+1)+' of '+Q.list.length+'</span>';
  if(Q.mode==='exam') h+='<span class="sp" style="flex:1"></span><span class="timer" id="tmr">–</span>';
  h+='</div><div class="prog"><i style="width:'+pct+'%"></i></div>';
  if(q.sc!=null && CASES[q.sc]){
    var cs=CASES[q.sc];
    h+='<details class="scen" open><summary>'+esc(cs.title)+' — scenario</summary><p>'+esc(cs.sc)+'</p></details>';
  }
  h+='<div class="stem"><span class="qn">Q'+esc(q.id)+'</span>'+esc(q.q)+'</div>';
  if(q.svg) h+='<div class="fig'+(q.t==='hot'?' hot':'')+'">'+q.svg+'</div>';
  if(q.t==='hot') h+='<p class="note">Click or tap the correct area.</p>';
  if(q.t==='match'){
    if(!Q.ord) Q.ord={};
    if(!Q.ord[Q.i]) Q.ord[Q.i]=shuffleArr(q.r.map(function(_,k){return k;}));
    var ord=Q.ord[Q.i], cur=sel||[];
    q.l.forEach(function(l,i){
      var cls='mrow';
      if(Q.checked) cls+= (cur[i]===i?' right':' wrong');
      h+='<div class="'+cls+'"><b>'+esc(l)+'</b><select data-i="'+i+'"'+(Q.checked?' disabled':'')+'><option value="">Choose…</option>'+
        ord.map(function(k){ return '<option value="'+k+'"'+(cur[i]===k?' selected':'')+'>'+esc(q.r[k])+'</option>'; }).join('')+'</select>'+
        (Q.checked && cur[i]!==i ? '<span class="fix">Correct: '+esc(q.r[i])+'</span>' : '')+'</div>';
    });
  }
  if(q.m) h+='<p class="note">Select '+q.a.length+'.</p>';
  (q.o||[]).forEach(function(o,k){
    var cls='opt', picked = q.m ? (sel&&sel.indexOf(k)>-1) : (k===sel);
    if(Q.checked){
      var corr = q.m ? q.a.indexOf(k)>-1 : k===q.a;
      if(corr) cls+=' right'; else if(picked) cls+=' wrong';
    } else if(picked) cls+=' sel';
    h+='<button class="'+cls+'" data-k="'+k+'"'+(Q.checked?' disabled':'')+'><span class="l">'+'ABCDE'[k]+'</span>'+esc(o)+'</button>';
  });
  if(Q.checked){
    var good = isRight(q, sel);
    h+='<div class="fb '+(good?'g':'r')+'" id="fbq"><b>'+(good?'Correct':(q.t==='match'?'Not quite — see the corrections above':q.t==='hot'?'Not quite — the correct area is highlighted in green':'Not quite — the answer is '+ansLetters(q.a)))+'</b>'+esc(q.e)+'</div>';
  }
  if(Q.checked && Q.bank!=='ai') h+='<div id="tut"></div>';
  h+='<div class="row">';
  if(Q.checked) h+='<button class="ib" id="askt" data-ai style="'+(SAMPLE?'':'display:none')+'">Ask the tutor why</button>';
  if(Q.mode==='practice' && !Q.checked) h+='<button class="ib pri" id="check">Check answer</button>';
  h+='<span class="kbd">'+((q.t==='match'||q.t==='hot')?'':'Keys: 1–'+((q.o||[]).length)+' select · ')+'Enter next · F flag</span>';
  if(Q.mode==='practice' && !Q.checked && q.m) h+='';
  if(Q.mode==='practice' && Q.checked) h+='<button class="ib pri" id="next">'+(Q.i===Q.list.length-1?'See results':'Next question')+'</button>';
  if(Q.mode==='exam'){
    if(Q.i>(Q.minIdx||0)) h+='<button class="ib" id="prev">‹ Back</button>';
    if(Q.bounds) h+='<button class="ib" id="secrev">Section review</button>';
    h+='<button class="ib pri" id="next">'+(Q.i===Q.list.length-1?'Finish':'Next ›')+'</button>';
  }
  h+='<span style="flex:1"></span><button class="ib" id="flag"'+(Q.bank==='ai'?' style="display:none"':'')+'>'+(store.flag[q.id]?'★ Flagged':'☆ Flag')+
     '</button><button class="ib" id="quit">Quit</button></div>';
  view.innerHTML=h;
  if(Q.mode==='exam') paintTimer();
  [].forEach.call(view.querySelectorAll('.opt'),function(b){
    b.addEventListener('click',function(){
      var k=parseInt(b.dataset.k,10);
      if(q.m){
        var cur=Q.ans[Q.i]||[]; var p=cur.indexOf(k);
        if(p>-1) cur.splice(p,1); else cur.push(k);
        Q.ans[Q.i]=cur;
      } else {
        Q.ans[Q.i]=k;
        if(Q.mode==='practice'){ Q.checked=true; }
      }
      drawQ();
    });
  });
  if(q.t==='hot'){
    [].forEach.call(view.querySelectorAll('.fig.hot .hs'),function(g){
      var k=parseInt(g.getAttribute('data-k'),10);
      if(Q.checked){ if(k===q.a) g.classList.add('right'); else if(k===sel) g.classList.add('wrong'); }
      else if(k===sel) g.classList.add('sel');
      function pick(){ if(Q.checked) return; Q.ans[Q.i]=k; if(Q.mode==='practice') Q.checked=true; drawQ(); }
      g.addEventListener('click',pick);
      g.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
    });
  }
  [].forEach.call(view.querySelectorAll('.mrow select'),function(el){
    el.addEventListener('change',function(){
      var cur=Q.ans[Q.i]||[]; var v=el.value===''?null:parseInt(el.value,10);
      cur[parseInt(el.dataset.i,10)]=v; Q.ans[Q.i]=cur;
    });
  });
  var c=document.getElementById('check');
  if(c) c.addEventListener('click',function(){
    var a=Q.ans[Q.i];
    if(a==null || (q.m && (!a.length))){ alert('Choose an answer first.'); return; }
    if(q.t==='match'){ for(var z=0;z<q.l.length;z++){ if(a[z]==null){ alert('Match every item first.'); return; } } }
    Q.checked=true; drawQ();
  });
  var nx=document.getElementById('next');
  if(nx) nx.addEventListener('click',function(){
    if(Q.i===Q.list.length-1){ finish(); return; }
    if(Q.bounds && Q.bounds.indexOf(Q.i+1)>-1){ sectionEnd(); return; }
    Q.i++; Q.checked=false; drawQ(); window.scrollTo(0,0);
  });
  var sr=document.getElementById('secrev'); if(sr) sr.addEventListener('click',function(){ sectionReview(false); });
  var at=document.getElementById('askt');
  if(at) at.addEventListener('click',function(){ explainQ(q, Q.ans[Q.i], document.getElementById('tut')||view, at); });
  var pv=document.getElementById('prev');
  if(pv) pv.addEventListener('click',function(){ Q.i--; Q.checked=false; drawQ(); window.scrollTo(0,0); });
  document.getElementById('flag').addEventListener('click',function(){
    if(store.flag[q.id]) delete store.flag[q.id]; else store.flag[q.id]=1;
    save(); buildNav(); markNav(''); this.textContent = store.flag[q.id]?'★ Flagged':'☆ Flag';
  });
  document.getElementById('quit').addEventListener('click',function(){
    if(confirm('End this quiz? Progress will be lost.')){ if(tick)clearInterval(tick); Q=null; go('#/practice'); }
  });
  document.getElementById('bartitle').textContent=Q.title;
  window.scrollTo(0,0);
}
function finish(){
  if(tick){ clearInterval(tick); tick=null; }
  var right=0, missed=[];
  Q.list.forEach(function(q,k){ var ok=isRight(q,Q.ans[k]);
    if(Q.bank!=='ai'){ srsUpdate(q.id, ok); var st=store.stat[q.id]||[0,0]; st[1]++; if(ok) st[0]++; store.stat[q.id]=st; }
    if(ok) right++; else missed.push({q:q,mine:Q.ans[k]}); });
  save(); buildNav();
  var pct=Math.round(right/Q.list.length*100);
  if(Q.bank!=='custom' && Q.bank!=='ai' && Q.bank!=='review' && Q.bank!=='flagged'){ if(!store.best[Q.bank] || pct>store.best[Q.bank]){ store.best[Q.bank]=pct; save(); buildNav(); } }
  var mins=Math.round((Date.now()-Q.t0)/60000);
  var h='<h1>Results</h1><div class="score '+(pct>=75?'g':'r')+'">'+pct+'%</div>'+
    '<p class="note">'+right+' of '+Q.list.length+' correct · '+esc(Q.title)+' · '+mins+' min</p>'+
    '<p>'+(pct>=85?'Strong. Move to the harder banks or a full mock.':
           pct>=75?'At the readiness benchmark. Keep the error log going.':
           pct>=60?'Close. Work through the misses below and repeat this bank in a few days.':
                   'Re-read the related guide sections before repeating this bank.')+'</p>';
  if(missed.length){
    h+='<h3>Review the '+missed.length+' you missed</h3>';
    missed.forEach(function(m){
      h+='<div class="rev"><div class="t">Q'+esc(m.q.id)+' · '+esc(m.q.q)+'</div>'+
        ((m.mine==null||(Array.isArray(m.mine)&&!m.mine.length))?'<div class="mine">You left this blank.</div>':
         '<div class="mine">Your answer: '+esc(ansLetters(m.mine, m.q))+'</div>')+
        '<div class="corr">Correct: '+esc(corrText(m.q))+'</div>'+
        '<div style="margin-top:.35rem;color:var(--muted)">'+esc(m.q.e)+'</div>'+
        (Q.bank!=='ai'?'<button class="ib" data-ai data-mi="'+missed.indexOf(m)+'" style="margin-top:.5rem;'+(SAMPLE?'':'display:none')+'">Ask the tutor why</button><div class="tbox"></div>':'')+
        '</div>';
    });
  }
  h+='<div class="row"><button class="ib pri" id="again">Retry this set</button>';
  if(missed.length) h+='<button class="ib" id="justmissed">Retry only the '+missed.length+' missed</button>';
  h+='<a class="ib" href="#/practice">All banks</a><a class="ib" href="#/progress">My progress</a></div>';
  view.innerHTML=h;
  [].forEach.call(view.querySelectorAll('button[data-mi]'),function(b){
    b.addEventListener('click',function(){ var m=missed[parseInt(b.dataset.mi,10)]; explainQ(m.q, m.mine, b.nextElementSibling, b); });
  });
  var list=Q.list.slice(), title=Q.title, bank=Q.bank, mode=Q.mode;
  document.getElementById('again').addEventListener('click',function(){ startQuiz(list,title,bank,mode,true,list.length); });
  var jm=document.getElementById('justmissed');
  if(jm) jm.addEventListener('click',function(){ startQuiz(missed.map(function(m){return m.q;}),title+' (misses)',bank,'practice',true,missed.length); });
  document.getElementById('bartitle').textContent='Results';
  window.scrollTo(0,0);
}

/* ---------- exam sections ---------- */
function secRange(){
  var st=0, en=Q.list.length;
  (Q.bounds||[]).forEach(function(b){ if(b<=Q.i && b>st) st=b; if(b>Q.i && b<en) en=b; });
  return [Math.max(st,Q.minIdx||0), en];
}
function sectionReview(atEnd){
  var r=secRange(), h='<h1>Section review</h1><p class="note">Questions '+(r[0]+1)+'–'+r[1]+'. Shaded = answered, red underline = flagged. Tap a number to return to it.</p><div class="secmap">';
  for(var i=r[0];i<r[1];i++){ var q=Q.list[i], a=Q.ans[i];
    var done=a!=null&&!(Array.isArray(a)&&!a.length);
    h+='<button data-j="'+i+'" class="'+(done?'done ':'')+(store.flag[q.id]?'fl':'')+'">'+(i+1)+'</button>'; }
  var un=0; for(var j=r[0];j<r[1];j++){ var aa=Q.ans[j]; if(aa==null||(Array.isArray(aa)&&!aa.length)) un++; }
  h+='</div><p>'+(un?un+' unanswered in this section.':'Every question in this section is answered.')+'</p>';
  h+='<div class="row">'+(atEnd?'<button class="ib pri" id="endsec">End section and continue</button>':'<button class="ib pri" id="back">Back to question</button>')+'</div>';
  view.innerHTML=h;
  [].forEach.call(view.querySelectorAll('[data-j]'),function(b){ b.addEventListener('click',function(){ Q.i=parseInt(b.dataset.j,10); drawQ(); }); });
  var bk=document.getElementById('back'); if(bk) bk.addEventListener('click',drawQ);
  var es=document.getElementById('endsec'); if(es) es.addEventListener('click',breakScreen);
}
function sectionEnd(){ sectionReview(true); }
function breakScreen(){
  var next=Q.i+1;
  view.innerHTML='<div class="brk"><h1>End of section</h1><p>You cannot return to the previous section after this point.</p>'+
    '<p class="note">On the real exam you get an optional 10-minute break here. Break time does not count against your exam time.</p>'+
    '<div class="row" style="justify-content:center"><button class="ib pri" id="tb">Take a 10-minute break</button><button class="ib" id="nb">Continue without a break</button></div></div>';
  function resume(){ Q.minIdx=next; Q.i=next; Q.checked=false;
    if(!tick) tick=setInterval(function(){ Q.secs--; paintTimer(); if(Q.secs<=0){ clearInterval(tick); tick=null; finish(); } },1000);
    drawQ(); }
  document.getElementById('nb').addEventListener('click',resume);
  document.getElementById('tb').addEventListener('click',function(){
    if(tick){ clearInterval(tick); tick=null; }
    var left=600;
    view.innerHTML='<div class="brk"><h1>Break</h1><div class="big" id="bt">10:00</div><p class="note">Your exam timer is paused.</p>'+
      '<div class="row" style="justify-content:center"><button class="ib pri" id="eb">End break and continue</button></div></div>';
    var bt=setInterval(function(){ left--; var m=Math.floor(left/60), s2=left%60;
      var el=document.getElementById('bt'); if(el) el.textContent=m+':'+(s2<10?'0':'')+s2;
      if(left<=0){ clearInterval(bt); resume(); } },1000);
    document.getElementById('eb').addEventListener('click',function(){ clearInterval(bt); resume(); });
  });
}

/* ---------- full exam ---------- */
function poolByDomain(d){ var p=[]; BANKS.forEach(function(b){ if(b.domain===d) p=p.concat(b.qs); }); return p; }
function renderFullExam(){
  view.innerHTML='<h1>Full exam simulation</h1>'+
   '<p class="note">180 questions in 240 minutes, weighted to the 2026 blueprint: People 33%, Process 41%, Business Environment 26%. '+
   'It opens with a case-study section, as the real exam does, then independent questions drawn at random from every bank.</p>'+
   '<p class="note">Like the real exam: a section review before each break, an optional 10-minute break that pauses the clock, and no going back into a finished section.</p>'+
   '<blockquote><p>Sit this only when you are scoring above 75% on the individual banks. Do it in one sitting, with two short breaks, and no notes. Endurance is a real failure mode on the real exam.</p></blockquote>'+
   '<div class="kpi"><div><b>180</b><small>questions</small></div><div><b>240</b><small>minutes</small></div>'+
   '<div><b>'+(store.best.fullexam!=null?store.best.fullexam+'%':'–')+'</b><small>your best</small></div></div>'+
   '<div class="row"><button class="ib pri" id="start">Start full exam</button>'+
   '<button class="ib" id="half">Half length (90 Q / 120 min)</button></div>';
  function build(n){
    var out=[], used={};
    // case-study section first, like the real exam
    var caseQs=(BK.b_case?BK.b_case.qs:[]);
    var picks=shuffleArr(CASES.map(function(_,i){return i;})).slice(0, n>=150?3:2);
    var lead=[];
    picks.forEach(function(ci){ caseQs.filter(function(q){return q.sc===ci;}).forEach(function(q){ lead.push(q); used[q.id]=1; }); });
    n = n - lead.length;
    var want={people:Math.round(n*0.33), process:Math.round(n*0.41), be:Math.round(n*0.26)};
    ['people','process','be'].forEach(function(d){
      var p=shuffleArr(poolByDomain(d).slice());
      p.slice(0,want[d]).forEach(function(q){ out.push(q); used[q.id]=1; });
    });
    var rest=shuffleArr(ALLQ.filter(function(q){return !used[q.id] && q.sc==null;}));
    while(out.length<n && rest.length) out.push(rest.pop());
    var tail=shuffleArr(out).slice(0,n);
    var paper=lead.concat(tail);
    paper._bounds=[lead.length, lead.length+Math.floor(tail.length/2)];
    return paper;
  }
  document.getElementById('start').addEventListener('click',function(){
    var paper=build(180), b=paper._bounds; startQuiz(paper,'Full exam simulation','fullexam','exam',false,paper.length); Q.bounds=b; Q.minIdx=0;
    Q.secs=240*60; paintTimer();
  });
  document.getElementById('half').addEventListener('click',function(){
    var paper=build(90), b=paper._bounds; startQuiz(paper,'Half exam simulation','halfexam','exam',false,paper.length); Q.bounds=b; Q.minIdx=0;
    Q.secs=120*60; paintTimer();
  });
  document.getElementById('bartitle').textContent='Full exam simulation';
  markNav('#/fullexam'); window.scrollTo(0,0);
}

/* ---------- flagged ---------- */
function renderFlagged(){
  var fq=ALLQ.filter(function(q){return store.flag[q.id];});
  var h='<h1>Flagged questions</h1>';
  if(!fq.length){
    h+='<p class="note">Nothing flagged yet. Use the ☆ Flag button during a quiz to mark questions you want to come back to.</p>';
  } else {
    h+='<p class="note">'+fq.length+' flagged. These are the ones you marked to revisit.</p>'+
       '<div class="row"><button class="ib pri" id="drill">Drill all flagged</button>'+
       '<button class="ib" id="clear">Clear all flags</button></div>';
    fq.forEach(function(q){
      h+='<div class="rev"><div class="t">Q'+esc(q.id)+' · '+esc(q.q)+'</div>'+
         '<div class="corr">'+esc(corrText(q))+'</div>'+
         '<div style="margin-top:.3rem;color:var(--muted)">'+esc(q.e)+'</div></div>';
    });
  }
  view.innerHTML=h;
  var d=document.getElementById('drill');
  if(d) d.addEventListener('click',function(){ startQuiz(fq.slice(),'Flagged questions','flagged','practice',true,fq.length); });
  var c=document.getElementById('clear');
  if(c) c.addEventListener('click',function(){ if(confirm('Clear every flag?')){ store.flag={}; save(); buildNav(); renderFlagged(); } });
  document.getElementById('bartitle').textContent='Flagged questions';
  markNav('#/flagged'); window.scrollTo(0,0);
}

/* ---------- flashcards ---------- */
var F=null;
function renderDeck(id){
  var d=DK[id]; if(!d){ go('#/practice'); return; }
  var cards=d.cards.slice();
  var unknown=cards.filter(function(c){return !store.known[d.id+'|'+c.f];});
  view.innerHTML='<h1>'+esc(d.title)+'</h1>'+
    '<p class="note">'+cards.length+' cards · '+(cards.length-unknown.length)+' marked known</p>'+
    '<div class="row"><button class="ib pri" id="all">Study all ('+cards.length+')</button>'+
    (unknown.length&&unknown.length<cards.length?'<button class="ib" id="unk">Study not-yet-known ('+unknown.length+')</button>':'')+
    '<button class="ib" id="rst">Reset this deck</button></div>';
  document.getElementById('all').addEventListener('click',function(){ startCards(d,cards.slice()); });
  var u=document.getElementById('unk');
  if(u) u.addEventListener('click',function(){ startCards(d,unknown.slice()); });
  document.getElementById('rst').addEventListener('click',function(){
    cards.forEach(function(c){ delete store.known[d.id+'|'+c.f]; }); save(); renderDeck(id);
  });

/* ---------- AI tutor ---------- */
function qAsText(q){
  var t='Question: '+q.q+'\n';
  if(q.sc!=null && CASES[q.sc]) t='Scenario: '+CASES[q.sc].sc+'\n\n'+t;
  if(q.t==='match'){ t+='Correct pairs:\n'+q.l.map(function(l,i){return '- '+l+' -> '+q.r[i];}).join('\n')+'\n'; }
  else if(q.t==='hot'){ t+='(This is a point-and-click question on a chart.)\n'; }
  else { t+=q.o.map(function(o,k){return 'ABCDE'[k]+'. '+o;}).join('\n')+'\n'; }
  return t;
}
function explainQ(q, mine, box, btn){
  if(!SAMPLE||!box) return;
  var right=isRight(q,mine);
  var prompt=RULES+'\n\n'+qAsText(q)+
    (q.t==='match'||q.t==='hot'?'':'Correct answer: '+ansLetters(q.a)+'\n')+
    'The student answered: '+ansLetters(mine,q)+(right?' (correct).':' (incorrect).')+'\n'+
    'Reference explanation: '+q.e+'\n\n'+
    'Explain in under 170 words, in plain text with no headings: '+
    (right?'why this answer is right and why each tempting alternative is weaker; ':'why the student\'s choice is wrong, what reasoning trap it reflects, and why the correct answer is right; ')+
    'then the underlying PMI principle in one sentence; then one short memory hook starting "Remember:".';
  box.className='tutor'; box.innerHTML='<span class="who">Tutor</span><span class="tx">Thinking…</span>';
  var tx=box.querySelector('.tx'); if(btn) btn.disabled=true;
  SAMPLE(prompt,{modelTier:'quick',onText:function(o){ tx.textContent=o.text; }})
    .then(function(r){ tx.textContent=r.text; })
    .catch(function(e){ tx.textContent=(e&&e.text)||aiErr(e); })
    .then(function(){ if(btn) btn.disabled=false; });
}
