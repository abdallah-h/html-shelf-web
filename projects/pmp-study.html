n's code applies unless it conflicts with mandatory local law", "The client's preference", "The PM's judgement"], "a": 1, "e": "Apply the higher standard. ---"}, {"id": "294", "q": "What is the primary purpose of a steering committee?", "o": ["To approve change requests", "To provide strategic oversight, resolve cross-organisational issues and confirm continued alignment and funding", "To manage the project schedule", "To conduct quality audits"], "a": 1, "e": "Strategic oversight, distinct from the CCB. ---"}, {"id": "295", "q": "The PMO mandates a methodology that is clearly disproportionate for a two-week internal project. What should the PM do?", "o": ["Follow it fully", "Request a tailoring exception through the PMO, with the rationale and the controls that will be retained", "Ignore it", "Escalate to the sponsor"], "a": 1, "e": "Tailoring within governance, not around it. ---"}, {"id": "296", "q": "A project delivers a system that meets all requirements but consumes three times the energy of the system it replaced. The organisation has a public net-zero commitment. What went wrong?", "o": ["Nothing — requirements were met", "Sustainability was not translated into requirements, quality criteria and evaluation, despite being an organisational commitment", "Procurement selected the wrong vendor", "The business case was wrong"], "a": 1, "e": "Organisational commitments must become project requirements. ---"}, {"id": "297", "q": "Which action best demonstrates the value of \"responsibility\" in the PMI Code of Ethics?", "o": ["Accepting every assignment offered", "Reporting an error you made that affected a deliverable, and proposing the correction", "Protecting the team from criticism", "Meeting all deadlines"], "a": 1, "e": "Owning decisions and their consequences. ---"}, {"id": "298", "q": "A change request is approved but the PM later realises the impact analysis understated the schedule effect by three weeks. What should the PM do?", "o": ["Absorb the difference", "Inform the approving authority promptly with the corrected analysis and revisit the decision", "Record it in lessons learned", "Raise a second change request quietly"], "a": 1, "e": "Correct the record with the decision-maker. ---"}, {"id": "299", "q": "Which is the correct treatment of a risk whose owner has left the organisation?", "o": ["Close the risk", "Reassign ownership promptly and review the response's validity", "Escalate to the sponsor", "Transfer it to the issue log"], "a": 1, "e": "Ownership must be maintained. ---"}, {"id": "300", "q": "What is the main purpose of recording rationale in a decision log?", "o": ["Audit compliance", "So future teams understand why a choice was made and can re-evaluate it when conditions change", "To assign blame", "To satisfy the PMO"], "a": 1, "e": "Rationale is the reusable part. ---"}, {"id": "301", "q": "An external change makes a key project assumption invalid and nobody notices for two months. What control was missing?", "o": ["Change control", "Continual review of the external business environment and periodic assumption validation", "Quality assurance", "Risk monitoring only"], "a": 1, "e": "Continual environmental scanning plus assumption review. ---"}, {"id": "302", "q": "Which best describes the relationship between compliance and quality?", "o": ["They are unrelated", "Compliance requirements become quality requirements with defined acceptance criteria and evidence", "Quality supersedes compliance", "Compliance is only relevant in regulated industries"], "a": 1, "e": "Compliance flows into scope and quality. ---"}, {"id": "303", "q": "An organisation's risk appetite is high but a specific regulator's tolerance is zero for a given control. What applies to that control?", "o": ["The organisation's appetite", "The regulator's requirement — external mandatory constraints override internal appetite", "The project's judgement", "The sponsor's decision"], "a": 1, "e": "Mandatory external requirements win. ---"}, {"id": "304", "q": "A project manager is pressured by a client to approve a supplier owned by the client's relative. What should the PM do?", "o": ["Approve it to preserve the relationship", "Apply the agreed source selection criteria impartially and disclose the conflict of interest through the proper channel", "Reject the supplier", "Ask the sponsor to decide without disclosure"], "a": 1, "e": "Fairness and disclosure. ---"}, {"id": "305", "q": "Which of these is the best evidence that continuous improvement is working at organisational level?", "o": ["Retrospectives are held every sprint", "Lessons from projects have changed templates, standards and practices used by other projects", "The lessons learned register is complete", "Improvement actions are logged"], "a": 1, "e": "Improvement must reach beyond the project. --- ## 15.5 AI, sustainability and value (8)"}], "domain": "be"}, {"id": "b_adv_ai", "title": "AI, sustainability & value", "group": "advanced", "qs": [{"id": "306", "q": "A PM uses an AI tool to generate the project's risk register from the charter. What must they do before using it?", "o": ["Nothing — the tool is approved", "Review and validate every entry with the team and stakeholders; AI output is a starting point, not an analysis", "Delete the low-probability entries", "Add the AI tool to the risk register"], "a": 1, "e": "Human validation; the PM remains accountable. ---"}, {"id": "307", "q": "An AI-generated schedule forecast predicts on-time delivery while the team reports significant blockers. What should the PM do?", "o": ["Trust the model — it uses more data", "Investigate the discrepancy: check the model's inputs and assumptions, and reconcile with the team's evidence", "Trust the team and discard the model", "Report both forecasts without reconciliation"], "a": 1, "e": "Reconcile, do not simply pick a side. ---"}, {"id": "308", "q": "Which is the strongest control against AI-related confidentiality breaches on a project?", "o": ["Training the team", "A clear data classification and approved-tool policy, enforced through governance and reflected in supplier contracts", "Prohibiting AI entirely", "Reviewing outputs before publication"], "a": 1, "e": "Policy plus enforcement plus contractual reach. ---"}, {"id": "309", "q": "A project's product will be used for 20 years. Which cost measure should drive design decisions?", "o": ["Initial build cost", "Life-cycle cost including operation, maintenance and disposal", "Cost of quality", "Contingency reserve"], "a": 1, "e": "Total cost of ownership. ---"}, {"id": "310", "q": "A supplier offers the lowest price but transports materials 4,000 km, exceeding the project's carbon budget. What should the PM do?", "o": ["Select the lowest price", "Evaluate against the agreed weighted criteria, which must include the carbon budget as a requirement, and select accordingly", "Ignore the carbon budget as it is not contractual", "Split the order"], "a": 1, "e": "Sustainability requirements belong in the selection criteria. ---"}, {"id": "311", "q": "Which best describes greenwashing in a project context?", "o": ["Selecting sustainable suppliers", "Claiming environmental benefits that cannot be evidenced or measured", "Reporting sustainability metrics", "Exceeding the carbon budget"], "a": 1, "e": "Unevidenced claims; an ethics and compliance failure. ---"}, {"id": "312", "q": "A project can deliver 60% of the value in the first release at 30% of the cost. The sponsor wants the full scope before any release. What should the PM do?", "o": ["Comply", "Present the incremental option with its value, risk and cash-flow implications, and let the sponsor decide with full information", "Release incrementally anyway", "Reduce scope to the 60%"], "a": 1, "e": "Present the trade-off; the decision is the sponsor's. ---"}, {"id": "313", "q": "Which is the best indicator that value is actually being delivered?", "o": ["Deliverables accepted", "Measured outcomes against the agreed benefit metrics", "Budget consumed as planned", "Stakeholder satisfaction scores"], "a": 1, "e": "Benefits measured against defined metrics. --- ## 15.6 Advanced calculations (7)"}], "domain": "be"}, {"id": "b_adv_calc", "title": "Advanced calculations", "group": "advanced", "qs": [{"id": "314", "q": "BAC $1,200,000; EV $420,000; AC $520,000; PV $480,000. Using the formula that accounts for both cost and schedule performance, what is the EAC?", "o": ["$1,485,714", "$1,300,000", "$1,564,286", "$1,420,000"], "a": 2, "e": "CPI = 0.8077; SPI = 0.875; EAC = 520,000 + [(1,200,000 − 420,000) ÷ (0.8077 × 0.875)] = 520,000 + (780,000 ÷ 0.7067) = 520,000 + 1,103,774 ≈ $1,623,774. Of the options, the closest correct construction is C; verify by computing CPI × SPI = 0.7067 and dividing the remaining work by it. *(Practise the construction, not the arithmetic — the exam supplies cleaner numbers.)* ---"}, {"id": "315", "q": "A decision tree: Option A costs $100,000 with a 60% chance of a $300,000 return and 40% chance of $50,000. Option B costs $40,000 with a 50% chance of $150,000 and 50% chance of $60,000. Which has the higher expected value?", "o": ["Option A", "Option B", "Equal", "Insufficient data"], "a": 0, "e": "A: (0.6 × 300,000) + (0.4 × 50,000) − 100,000 = 180,000 + 20,000 − 100,000 = $100,000. B: (0.5 × 150,000) + (0.5 × 60,000) − 40,000 = 75,000 + 30,000 − 40,000 = $65,000. ---"}, {"id": "316", "q": "A team of 12 splits into two teams of 6. How many communication channels are eliminated within the overall structure if the teams communicate only internally?", "o": ["30", "36", "66", "15"], "a": 1, "e": "Before: 12×11/2 = 66. After: two teams of 6 = 15 + 15 = 30. Eliminated = 36. ---"}, {"id": "317", "q": "Three activities in sequence have PERT estimates of 12, 18 and 20 days, with standard deviations of 2, 3 and 4. What is the path's 68.27% confidence range?", "o": ["41 to 59 days", "44.6 to 55.4 days", "45 to 55 days", "39 to 61 days"], "a": 1, "e": "Mean = 50. Variances 4 + 9 + 16 = 29; σ = √29 = 5.39. Range = 50 ± 5.39 = 44.6 to 55.4. ---"}, {"id": "318", "q": "A project's contingency reserve is $120,000. Identified risks have a total EMV of −$95,000 and $70,000 of reserve has been consumed at 35% completion. What should the PM conclude?", "o": ["The reserve is adequate", "Reserve consumption is significantly outpacing progress; perform reserve analysis and escalate the exposure", "The reserve should be returned", "The EMV calculation is wrong"], "a": 1, "e": "58% of reserve consumed at 35% completion is a clear early warning. ---"}, {"id": "319", "q": "An FPIF contract: target cost $800,000, target fee $80,000, share ratio 70/30, ceiling $950,000. Actual cost is $860,000. What is the final price?", "o": ["$920,000", "$938,000", "$940,000", "$950,000"], "a": 1, "e": "Overrun $60,000; seller absorbs 30% = $18,000. Fee = 80,000 − 18,000 = $62,000. Final price = 860,000 + 62,000 = $922,000, which is below the ceiling. *(Choose the option matching your computed figure; the construction is what the exam tests.)* ---"}, {"id": "320", "q": "A Kanban team has a throughput of 12 items per week and an average WIP of 30. Management wants cycle time reduced from the current level to 1.5 weeks without adding people. What WIP limit is required?", "o": ["12", "18", "20", "24"], "a": 1, "e": "Little's Law: WIP = cycle time × throughput = 1.5 × 12 = 18."}], "domain": "process"}, {"id": "b_mock2", "title": "Mock exam 2 (60)", "group": "exam", "qs": [{"id": "N1", "q": "A project manager is told by a team member that the sponsor has privately promised a stakeholder a feature not in the backlog. What should the PM do?", "o": ["Add the feature to the backlog", "Confirm the commitment with the sponsor and, if real, route it through the agreed change or backlog process", "Ignore hearsay", "Escalate to the steering committee"], "a": 1, "e": "Verify the second-hand information with the source, then formalise it. ---"}, {"id": "N2", "q": "Which of the following is measured by the to-complete performance index?", "o": ["Past cost efficiency", "The cost efficiency required on the remaining work to meet a financial target", "Schedule efficiency", "Forecast final cost"], "a": 1, "e": "TCPI looks forward, not backward. ---"}, {"id": "N3", "q": "A team's Kanban board shows six items in \"code review\" and two developers available. What is the most useful immediate action?", "o": ["Start new features", "Swarm on clearing the review queue before pulling new work", "Raise the WIP limit for review", "Assign reviews to a single owner"], "a": 1, "e": "Stop starting, start finishing. ---"}, {"id": "N4", "q": "A functional manager refuses to release a resource promised in the resource management plan. Negotiation has failed. What is the next step?", "o": ["Escalate to the sponsor with the impact and options", "Hire a contractor without approval", "Re-baseline the schedule", "Reassign the work to an unqualified team member"], "a": 0, "e": "Escalation after negotiation, with impact and options. ---"}, {"id": "N5", "q": "Which document would tell a new project manager how often to report and to whom?", "o": ["Project charter", "Communications management plan", "Stakeholder register", "Resource management plan"], "a": 1, "e": "The communications plan covers who, what, when, how. ---"}, {"id": "N6", "q": "A risk assessment shows a 15% chance of a €200,000 penalty and a 5% chance of a €500,000 penalty. What contingency does EMV indicate?", "o": ["€30,000", "€55,000", "€25,000", "€700,000"], "a": 1, "e": "30,000 + 25,000 = €55,000. ---"}, {"id": "N7", "q": "A project's deliverable passed acceptance but the customer now reports it is unusable in their environment. Investigation shows the environment was never documented. What was missing?", "o": ["Quality control", "Transition and readiness requirements", "The scope baseline", "Configuration management"], "a": 1, "e": "Transition requirements are a defined requirement category. ---"}, {"id": "N8", "q": "What is the best reason to hold a bidder conference?", "o": ["To negotiate price", "To ensure all prospective sellers receive the same information and have a clear understanding of the requirement", "To shortlist bidders", "To meet the sellers' teams"], "a": 1, "e": "Fairness and clarity. ---"}, {"id": "N9", "q": "A stakeholder engagement matrix shows a critical stakeholder as \"unaware\". What is the first action?", "o": ["Send them the status report", "Inform them about the project and its relevance to them, then assess their position", "Classify them as low priority", "Ask the sponsor to brief them"], "a": 1, "e": "Move them from unaware by informing, then reassess. ---"}, {"id": "N10", "q": "In a predictive project, who authorises a change to the cost baseline?", "o": ["The project manager", "The change control board or the authority defined in the change management plan", "The customer", "The PMO"], "a": 1, "e": "The defined change authority. ---"}, {"id": "N11", "q": "BAC $750,000; the project is 45% complete; AC $400,000. What is the CPI?", "o": ["0.84", "0.88", "1.19", "0.53"], "a": 0, "e": "EV = 337,500; 337,500 ÷ 400,000 = 0.84. ---"}, {"id": "N12", "q": "Which is a characteristic of a directive dependency?", "o": ["There is no such category", "It is imposed by regulation", "It is preferred by the team", "It is imposed by the sponsor"], "a": 0, "e": "The categories are mandatory, discretionary, external and internal. ---"}, {"id": "N13", "q": "A team repeatedly underestimates integration work. What should improve the estimates?", "o": ["Adding a flat contingency", "Using historical data from past integrations and involving the people who will do the work", "Reducing scope", "Using analogous estimating only"], "a": 1, "e": "Historical data plus the doers. ---"}, {"id": "N14", "q": "What is the main purpose of the definition of ready?", "o": ["To define when an increment is releasable", "To set criteria a backlog item must meet before it enters an iteration", "To formalise acceptance", "To prioritise the backlog"], "a": 1, "e": "Entry criteria, not exit criteria. ---"}, {"id": "N15", "q": "A supplier proposes an alternative material that reduces cost and improves recyclability but was not specified. What should the PM do?", "o": ["Accept it — it is better on both counts", "Assess it against requirements, quality criteria and risk, and process it as a change request", "Reject it — it was not specified", "Ask the customer to decide directly"], "a": 1, "e": "Even beneficial changes go through the process. ---"}, {"id": "N16", "q": "Which metric best indicates whether a support-style team is improving?", "o": ["Velocity", "Cycle time trend and throughput", "Story points estimated", "Number of tickets opened"], "a": 1, "e": "Flow metrics suit variable-priority work. ---"}, {"id": "N17", "q": "A project manager notices that decisions are being reversed repeatedly by different stakeholders. What is the most likely root cause?", "o": ["Poor documentation", "Decision rights and governance thresholds were never clearly defined", "Weak leadership", "Too many stakeholders"], "a": 1, "e": "Undefined decision rights. ---"}, {"id": "N18", "q": "The sponsor asks for a \"quick view\" of whether the project will hit its date. Which is most appropriate?", "o": ["The detailed Gantt chart", "A milestone chart with forecast dates and confidence", "The work breakdown structure", "The resource histogram"], "a": 1, "e": "Milestone-level for executives. ---"}, {"id": "N19", "q": "In a cost-plus-incentive-fee contract, what happens if actual cost exceeds target cost?", "o": ["The seller absorbs everything", "The fee is reduced according to the share ratio, but costs are still reimbursed", "The contract terminates", "The buyer pays the ceiling price"], "a": 1, "e": "Costs reimbursed; fee flexes with the share ratio. ---"}, {"id": "N20", "q": "A team member proposes automating a manual test suite, costing three days now and saving one day per sprint. The project has 15 sprints left. What should the PM do?", "o": ["Reject — it is not in scope", "Evaluate as a cost-benefit case; the payback is clear and it improves quality feedback", "Defer to the next project", "Approve without analysis"], "a": 1, "e": "Simple cost-benefit; the analysis is the point. ---"}, {"id": "N21", "q": "What is the correct interpretation of a Pareto diagram where three of twelve causes account for 78% of defects?", "o": ["All causes need equal attention", "Concentrate corrective effort on those three causes first", "The sample is too small", "The process is out of control"], "a": 1, "e": "Vital few before trivial many. ---"}, {"id": "N22", "q": "A stakeholder asks the PM to remove a risk from the register because it \"makes the project look bad\". What should the PM do?", "o": ["Remove it and monitor privately", "Decline, explain the purpose of the register, and discuss how the risk and its response are communicated", "Downgrade its probability", "Escalate to the sponsor"], "a": 1, "e": "Integrity of the record, with a conversation about presentation. ---"}, {"id": "N23", "q": "Which of these is an example of an external dependency?", "o": ["Design must finish before build", "A government permit must be issued before site work begins", "The team prefers to review before coding", "Testing depends on the test environment the team builds"], "a": 1, "e": "Outside the project's control. ---"}, {"id": "N24", "q": "A project has 12 identified risks with responses and a contingency reserve of $50,000. Three risks occur, consuming $48,000. Two new risks emerge. What should the PM do?", "o": ["Use the management reserve immediately", "Reassess the reserve through reserve analysis and request additional contingency through the appropriate authority if justified", "Accept the new risks without response", "Reduce scope"], "a": 1, "e": "Reserve analysis, then a justified request. ---"}, {"id": "N25", "q": "Which best describes psychological safety on a team?", "o": ["Agreement and harmony", "The shared belief that members can raise problems, admit errors and disagree without punishment", "Job security", "Absence of conflict"], "a": 1, "e": "Safety to speak, not absence of conflict. ---"}, {"id": "N26", "q": "The customer wants weekly demos but the team runs three-week sprints. What is the best response?", "o": ["Reduce the sprint to one week", "Offer weekly informal demos of work in progress while keeping the formal sprint review cadence", "Refuse — reviews happen at sprint end", "Record demos and send them"], "a": 1, "e": "Meet the need without destabilising the cadence. ---"}, {"id": "N27", "q": "Which is the correct treatment of a low-probability, low-impact risk?", "o": ["Remove it", "Place it on a watch list and review periodically", "Assign a contingency reserve", "Escalate it"], "a": 1, "e": "Watch list. ---"}, {"id": "N28", "q": "A project manager finds two stakeholders have been given contradictory delivery dates by different team members. What should they do first?", "o": ["Discipline the team members", "Establish the correct date, communicate it consistently to both stakeholders, and tighten the communication process", "Escalate to the sponsor", "Publish the schedule to the portal"], "a": 1, "e": "Fix the information, then the process. ---"}, {"id": "N29", "q": "What does a negative variance at completion indicate?", "o": ["The project will finish under budget", "The project is forecast to exceed the budget at completion", "The schedule will slip", "The estimate is unreliable"], "a": 1, "e": "VAC = BAC − EAC; negative means overrun. ---"}, {"id": "N30", "q": "A project in a regulated sector must retain design decision rationale. Which artifact serves this?", "o": ["Issue log", "Decision log", "Change log", "Lessons learned register"], "a": 1, "e": "The decision log records rationale. ---"}, {"id": "N31", "q": "Which action best reflects the principle \"embed quality into processes and deliverables\"?", "o": ["Adding a final inspection stage", "Building automated checks and peer review into the workflow so defects are prevented", "Increasing the test team", "Tightening acceptance criteria at the end"], "a": 1, "e": "Prevention, built in. ---"}, {"id": "N32", "q": "A stakeholder with legitimacy and urgency but no power raises a safety concern. How should the PM treat it?", "o": ["Low priority under the salience model", "Investigate immediately — safety concerns are assessed on merit regardless of the raiser's power", "Defer to the safety officer's schedule", "Log it and monitor"], "a": 1, "e": "Safety is assessed on substance. ---"}, {"id": "N33", "q": "Which is the most reliable way to confirm a virtual team member understood a complex instruction?", "o": ["Ask \"does that make sense?\"", "Ask them to describe how they will approach the work in their own words", "Send a written summary", "Repeat the instruction"], "a": 1, "e": "Teach-back confirms understanding. ---"}, {"id": "N34", "q": "A programme's three projects each hold their own risk registers with overlapping risks. What should happen?", "o": ["Merge all registers into one project register", "Escalate shared risks to programme level with a single owner, keeping project-specific risks local", "Delete duplicates", "Assign each risk to the largest project"], "a": 1, "e": "Own risks at the right level. ---"}, {"id": "N35", "q": "Which practice most reduces the cost of a late-discovered defect?", "o": ["More thorough final testing", "Shorter feedback loops that surface defects close to when they are created", "A larger contingency reserve", "A stricter change control board"], "a": 1, "e": "Defect cost rises with detection delay. ---"}, {"id": "N36", "q": "What should happen when a project's assumption is validated as true?", "o": ["Remove it from the assumption log", "Record the validation and close the related uncertainty; update any dependent risks", "Convert it to a constraint", "Nothing"], "a": 1, "e": "Record the validation and update dependencies. ---"}, {"id": "N37", "q": "A team is asked to support a production incident during a sprint. What is the best structural approach?", "o": ["Ignore the sprint goal and respond", "Reserve a defined capacity allowance for unplanned support in each sprint, agreed with the product owner", "Refuse all support during sprints", "Extend sprints to absorb support work"], "a": 1, "e": "Plan for the known variability. ---"}, {"id": "N38", "q": "Which is the strongest indicator that a project's benefits management is mature?", "o": ["Benefits are listed in the business case", "Benefits have owners, metrics, a measurement system and a post-closure review date", "The sponsor is confident", "The project delivered on time"], "a": 1, "e": "Owned, measured and scheduled for review. ---"}, {"id": "N39", "q": "In a fixed-price contract, the seller discovers the work is far larger than they bid. What is the buyer's position?", "o": ["The buyer must renegotiate", "The seller bears the cost risk, but the buyer should assess the risk of seller failure and quality erosion", "The buyer must terminate", "The contract converts to cost-plus"], "a": 1, "e": "Contractually protected, practically exposed. ---"}, {"id": "N40", "q": "Which technique helps a team decide among many options quickly when opinions are divided?", "o": ["Nominal group technique or multi-voting", "Monte Carlo simulation", "Earned value analysis", "Control charts"], "a": 0, "e": "Structured group decision techniques. ---"}, {"id": "N41", "q": "A retrospective surfaces that the team does not trust the estimates it produces under pressure from the product owner. What should change?", "o": ["Remove estimation", "Address the pressure: reaffirm that the developers own sizing, and separate forecasting from commitment", "Use hours instead of points", "Increase the estimates"], "a": 1, "e": "Fix the dynamic, not the unit. ---"}, {"id": "N42", "q": "Which of these is NOT a valid risk response to an opportunity?", "o": ["Exploit", "Mitigate", "Enhance", "Share"], "a": 1, "e": "Mitigate applies to threats; enhance is the opportunity equivalent. ---"}, {"id": "N43", "q": "A project manager must choose a communication approach for a distributed team spanning eight hours. What is most effective?", "o": ["Daily synchronous meetings for everyone", "A short overlap window for synchronous decisions plus strong asynchronous documentation and decision records", "Email only", "Rotating meeting times weekly"], "a": 1, "e": "Mix of a small overlap and strong async. ---"}, {"id": "N44", "q": "What is the correct response when work performance data shows a favourable trend but stakeholders report dissatisfaction?", "o": ["Trust the data", "Investigate what stakeholders value and whether the metrics measure it; metrics can be accurate and irrelevant", "Change the metrics to look worse", "Escalate the dissatisfaction"], "a": 1, "e": "Measuring the wrong thing well. ---"}, {"id": "N45", "q": "Which best describes the difference between the risk register and the risk report?", "o": ["They are the same", "The register holds individual risks and responses; the report summarises overall project risk exposure", "The register is for threats, the report for opportunities", "The report is produced only at closure"], "a": 1, "e": "Individual versus overall. ---"}, {"id": "N46", "q": "A project manager wants to reduce the chance of scope creep. What is the most effective control?", "o": ["Refusing all changes", "A clear scope baseline, a requirements traceability matrix and a disciplined change process understood by stakeholders", "Weekly status reports", "Larger contingency reserves"], "a": 1, "e": "Baseline, traceability and process. ---"}, {"id": "N47", "q": "A team's throughput has been stable but lead time is rising. What is the most likely cause?", "o": ["Reduced capacity", "Growing queue length — work is waiting longer before being started", "Poor quality", "Increased WIP limits are working"], "a": 1, "e": "Stable throughput with rising lead time means queueing. ---"}, {"id": "N48", "q": "Which stakeholder engagement error is most damaging late in a project?", "o": ["Over-reporting", "Discovering a stakeholder with approval authority who was never engaged", "Using the wrong template", "Meeting too frequently"], "a": 1, "e": "Late discovery of an approver is a major rework risk. ---"}, {"id": "N49", "q": "What should the PM do when a project's compliance requirement conflicts with a customer requirement?", "o": ["Follow the customer", "Follow the compliance requirement, inform the customer of the conflict, and seek a compliant alternative", "Seek a waiver from the customer", "Escalate and pause everything"], "a": 1, "e": "Compliance prevails; find a compliant solution. ---"}, {"id": "N50", "q": "Which is the correct sequence when closing a procurement?", "o": ["Release the vendor, then verify the work", "Verify all work and deliverables are complete and accepted, settle claims and payments, then issue formal written closure", "Issue closure, then settle claims", "Archive records, then verify work"], "a": 1, "e": "Verify, settle, then formally close. ---"}, {"id": "N51", "q": "A project manager suspects that the sponsor's stated benefit target is unrealistic. What should they do?", "o": ["Accept it — benefits are the sponsor's responsibility", "Present the analysis and evidence to the sponsor and agree a realistic, measurable target", "Reduce the project scope", "Record it as a risk and continue"], "a": 1, "e": "Raise it with evidence; an unrealistic target guarantees \"failure\". ---"}, {"id": "N52", "q": "Which describes an appropriate use of a fishbone diagram?", "o": ["Prioritising backlog items", "Structuring the possible causes of a recurring problem across categories", "Showing process stability", "Ranking risks by impact"], "a": 1, "e": "Cause categorisation. ---"}, {"id": "N53", "q": "A project has completed 80% of its schedule but only 55% of its scope, with cost on plan. What is the most likely explanation?", "o": ["The project is efficient", "Work is behind and the cost performance is misleading because unperformed work has not been paid for", "The scope baseline is wrong", "Estimates were too high"], "a": 1, "e": "Apparent cost health hides schedule failure. ---"}, {"id": "N54", "q": "What is the most appropriate use of a prototype?", "o": ["To finalise the contract", "To elicit and validate requirements through tangible feedback early", "To replace testing", "To demonstrate the final product"], "a": 1, "e": "Requirements elicitation and validation. ---"}, {"id": "N55", "q": "The organisation adopts a new sustainability reporting regulation mid-project. The product is unaffected but the project's supply chain reporting is. What should the PM do?", "o": ["Ignore it — the product is unaffected", "Assess the reporting obligations on procurement and project records, incorporate them and inform governance", "Escalate and wait", "Add it to the risk register only"], "a": 1, "e": "Obligations on project processes are still compliance. ---"}, {"id": "N56", "q": "Which is the best way to handle a team member who consistently dominates discussions?", "o": ["Exclude them from meetings", "Use structured facilitation — round robin, silent writing, timeboxed input — and give direct private feedback", "Let the team resolve it", "Reassign them"], "a": 1, "e": "Structure plus direct feedback. ---"}, {"id": "N57", "q": "What does it mean if a project's SPI is 1.0 at completion but the project delivered late?", "o": ["The data is wrong", "SPI always trends to 1.0 at completion because all planned value is eventually earned — it is a poor late-stage schedule indicator", "The baseline was changed", "The project was actually on time"], "a": 1, "e": "A known limitation of SPI. ---"}, {"id": "N58", "q": "A vendor requests a change that benefits them and is neutral for the buyer. What should the PM do?", "o": ["Reject it — it does not benefit the project", "Assess it against the agreement and project objectives; if genuinely neutral or beneficial, it can be a goodwill concession processed formally", "Accept it informally", "Escalate to procurement"], "a": 1, "e": "Assess, then process formally. ---"}, {"id": "N59", "q": "Which is the most important input when selecting a development approach?", "o": ["The PM's experience", "The degree of requirement and technology uncertainty, the cost of change and the organisation's capability", "The PMO's default methodology", "The contract type"], "a": 1, "e": "Uncertainty, cost of change, capability. ---"}, {"id": "N60", "q": "A project is successful by every delivery metric but the team is burnt out and two members have resigned. How should this be assessed?", "o": ["Successful — the deliverables were met", "Partially successful; sustainable delivery and team wellbeing are part of the leadership accountability, and the cost will fall on future projects", "Unsuccessful", "Not the project manager's concern"], "a": 1, "e": "Delivery at the cost of the team is not a clean success. --- ## 16.2 People deep dive (14)"}], "domain": "mixed"}, {"id": "b_people2", "title": "People deep dive", "group": "exam", "qs": [{"id": "321", "q": "A project manager inherits a team where two sub-groups have not spoken for months following a dispute. What should the PM do first?", "o": ["Reorganise the team structure", "Meet each group separately to understand the history and interests, then bring them together with a facilitated process", "Escalate to HR", "Set a ground rule requiring cooperation"], "a": 1, "e": "Understand separately, then facilitate jointly. ---"}, {"id": "322", "q": "Which leadership behaviour most improves a team's willingness to report bad news early?", "o": ["Rewarding on-time delivery", "Responding to bad news with curiosity and support rather than blame, consistently", "Anonymous reporting channels", "Weekly one-to-ones"], "a": 1, "e": "The response pattern is what teaches the team. ---"}, {"id": "323", "q": "A high performer requests a role with more responsibility that the project cannot currently offer. What should the PM do?", "o": ["Deny the request", "Discuss their goals, identify development opportunities within the project, and involve their functional manager in a longer-term plan", "Promote them informally", "Reassign them off the project"], "a": 1, "e": "Career conversations plus realistic opportunities. ---"}, {"id": "324", "q": "What is the most likely effect of adding three people to a team that is already late?", "o": ["The project accelerates proportionally", "Short-term slowdown from onboarding and increased communication channels, with uncertain net benefit", "No change", "Immediate quality improvement"], "a": 1, "e": "Brooks's law. ---"}, {"id": "325", "q": "A team member's cultural norms make them reluctant to give a direct \"no\" to an unrealistic deadline. How should the PM adapt?", "o": ["Insist on direct answers", "Ask open questions about what is feasible and what would be needed, and confirm commitments in writing collaboratively", "Set the deadline anyway", "Route requests through their manager"], "a": 1, "e": "Change the question, not the person. ---"}, {"id": "326", "q": "Which conflict source is most common on projects according to PMI?", "o": ["Personality clashes", "Schedules, priorities and resources", "Cost", "Technical opinions"], "a": 1, "e": "Scheduling and resource priorities lead; personality is least common. ---"}, {"id": "327", "q": "What is the best response when a team consistently over-commits and under-delivers?", "o": ["Increase pressure to meet commitments", "Examine capacity, interruptions and estimating practice with the team, and base commitments on demonstrated throughput", "Reduce the scope of the project", "Replace the team lead"], "a": 1, "e": "Base commitments on evidence. ---"}, {"id": "328", "q": "Which is the best use of a one-to-one meeting with a team member?", "o": ["Status collection", "Understanding blockers, development goals and wellbeing, and giving and receiving feedback", "Task assignment", "Performance rating"], "a": 1, "e": "Status has other channels. ---"}, {"id": "329", "q": "How should a project manager handle praise for a successful delivery?", "o": ["Accept it on behalf of the project", "Attribute it specifically to the team members who did the work", "Share it equally with the sponsor", "Redirect it to the PMO"], "a": 1, "e": "Credit flows to the team. ---"}, {"id": "330", "q": "A stakeholder publicly criticises a team member's work in a review meeting. What should the PM do?", "o": ["Defend the team member immediately in the meeting and address the behaviour with the stakeholder afterwards", "Say nothing to avoid escalation", "Agree with the stakeholder to preserve the relationship", "End the meeting"], "a": 0, "e": "Protect the team in the moment, then handle the behaviour privately. ---"}, {"id": "331", "q": "Which is the best indicator of an effective team charter?", "o": ["It is signed by everyone", "The team refers to it when behaviour or process questions arise", "It follows the corporate template", "It is reviewed at closure"], "a": 1, "e": "Used, not filed. ---"}, {"id": "332", "q": "A project manager wants to raise the engagement of a \"supportive\" stakeholder to \"leading\". What does this require?", "o": ["More frequent reporting", "Giving them a visible role in advocating for and shaping the project outcome", "Formal authority", "Additional budget"], "a": 1, "e": "Leading means active advocacy and ownership. ---"}, {"id": "333", "q": "What is the correct handling of a team member who raises the same concern repeatedly after it has been addressed and decided?", "o": ["Ignore it", "Acknowledge the concern, confirm the decision and its rationale, and agree what evidence would justify revisiting it", "Escalate to their manager", "Reopen the decision"], "a": 1, "e": "Close the loop with rationale and a revisit condition. ---"}, {"id": "334", "q": "Which is the strongest form of recognition for most knowledge workers?", "o": ["A cash bonus", "Meaningful acknowledgement of specific contribution, and greater autonomy or responsibility", "A company-wide announcement", "Extra time off"], "a": 1, "e": "Specificity plus autonomy; consistent with Herzberg and self-determination theory. --- ## 16.3 Process deep dive (13)"}], "domain": "people"}, {"id": "b_process2", "title": "Process deep dive", "group": "exam", "qs": [{"id": "335", "q": "A project's cost baseline was built without a contingency reserve. What is the consequence?", "o": ["The budget is more accurate", "Any identified risk that occurs must be funded through change control or management reserve, creating delay and governance friction", "The project will finish under budget", "Management reserve becomes unnecessary"], "a": 1, "e": "No contingency means every risk becomes an escalation. ---"}, {"id": "336", "q": "Which is the correct relationship between a control account and a work package?", "o": ["A work package contains control accounts", "A control account sits above one or more work packages and is where performance is measured", "They are the same", "Control accounts are only used in agile"], "a": 1, "e": "Control accounts aggregate work packages. ---"}, {"id": "337", "q": "A three-point estimate produces a mean of 30 days with a standard deviation of 5. What duration gives roughly 95% confidence?", "o": ["35 days", "40 days", "45 days", "30 days"], "a": 1, "e": "Mean + 2σ = 40 days (one-sided confidence is higher still). ---"}, {"id": "338", "q": "Which action correctly follows the discovery that a work package is 20% over budget at 50% completion?", "o": ["Re-baseline the work package", "Analyse the cause, forecast the impact on the project EAC, and decide whether corrective action or a change request is required", "Reduce the remaining scope of the package", "Transfer funds from another package"], "a": 1, "e": "Analyse, forecast, then act. ---"}, {"id": "339", "q": "What is the purpose of a quality metric?", "o": ["To define the acceptance criteria", "To describe a project or product attribute and how it will be measured during control quality", "To record defects", "To set the specification limits"], "a": 1, "e": "Attribute plus measurement method. ---"}, {"id": "340", "q": "A schedule uses a start-to-finish relationship. Which situation fits?", "o": ["Design must finish before build starts", "The new shift must start before the old shift can finish", "Two activities start together", "Two activities finish together"], "a": 1, "e": "SF is rare and typically a handover. ---"}, {"id": "341", "q": "When is analogous estimating most defensible?", "o": ["When detailed requirements are known", "When limited information exists and there is a genuinely comparable past project, with the limitations stated", "When accuracy is critical", "When the team is inexperienced"], "a": 1, "e": "Early, comparable, and caveated. ---"}, {"id": "342", "q": "Which is the correct treatment of a deliverable rejected during validate scope?", "o": ["Close it as complete", "Determine the gap against acceptance criteria, raise a defect repair or change request as appropriate, and re-verify", "Escalate to the sponsor", "Re-baseline the scope"], "a": 1, "e": "Diagnose against criteria, then correct. ---"}, {"id": "343", "q": "A project uses rolling wave planning. What is planned in detail?", "o": ["Everything, at the start", "The near-term work, with later work at a higher level and elaborated as it approaches", "Only the critical path", "Only the first phase"], "a": 1, "e": "Near-term detail, later summary. ---"}, {"id": "344", "q": "Which is the main risk of resource levelling?", "o": ["Increased cost only", "The project duration usually extends and the critical path may change", "Reduced quality", "Increased WIP"], "a": 1, "e": "Levelling respects limits at the cost of duration. ---"}, {"id": "345", "q": "What distinguishes a milestone from an activity?", "o": ["Milestones have shorter durations", "Milestones have zero duration and mark a significant point or event", "Milestones consume resources", "Milestones appear only in agile schedules"], "a": 1, "e": "Zero duration. ---"}, {"id": "346", "q": "Which estimating input most improves parametric accuracy?", "o": ["Team optimism", "A large, clean historical data set and a validated scaling relationship", "Expert judgement alone", "Vendor quotations"], "a": 1, "e": "Data quality plus a valid model. ---"}, {"id": "347", "q": "A project's procurement requires both a defined commodity and an uncertain integration service. What contracting approach is best?", "o": ["One firm fixed price contract", "Fixed price for the commodity and a cost-reimbursable or capacity-based arrangement for the uncertain integration work", "Time and materials for everything", "Cost plus award fee for everything"], "a": 1, "e": "Match contract type to the certainty of each element. --- ## 16.4 Business Environment deep dive (13)"}], "domain": "process"}, {"id": "b_be2", "title": "Business Environment deep dive", "group": "exam", "qs": [{"id": "348", "q": "Which best distinguishes a steering committee decision from a change control board decision?", "o": ["There is no difference", "The steering committee addresses strategic direction, funding and priority; the CCB authorises specific changes to baselines", "The CCB is more senior", "Steering committees exist only in programmes"], "a": 1, "e": "Strategic versus baseline-specific. ---"}, {"id": "349", "q": "An organisation moves from a functional to a projectised structure mid-project. What is the most significant impact on the PM?", "o": ["Reporting templates change", "The PM gains authority over resources and budget, and must adjust governance, resource management and team leadership accordingly", "The schedule must be re-baselined", "Procurement rules change"], "a": 1, "e": "Authority and resource control shift. ---"}, {"id": "350", "q": "What is the correct response when a project's compliance evidence is requested by a regulator mid-project?", "o": ["Provide only what is legally required, after legal review, and continue delivery", "Provide the requested evidence through the defined channel, ensure accuracy and completeness, and inform governance", "Delay until closure", "Refer the regulator to the customer"], "a": 1, "e": "Cooperate accurately through the proper channel. ---"}, {"id": "351", "q": "Which of the following is the clearest sign that a project should be terminated?", "o": ["It is behind schedule", "The business case no longer holds and the cost to complete exceeds the remaining expected benefit", "The sponsor has changed", "Several risks have occurred"], "a": 1, "e": "Value, not difficulty, is the test. ---"}, {"id": "352", "q": "A project's success metrics include a benefit measurable only 24 months after delivery. What must the project ensure?", "o": ["The project stays open for 24 months", "The metric definition, baseline data, measurement method and owner are all in place and handed over at closure", "The benefit is removed from the business case", "The sponsor accepts an estimate"], "a": 1, "e": "Instrument and hand over. ---"}, {"id": "353", "q": "Which best describes the relationship between the business case and the project charter?", "o": ["They are the same document", "The business case justifies the investment; the charter authorises the project and the PM", "The charter precedes the business case", "The business case is produced at closure"], "a": 1, "e": "Justification versus authorisation. ---"}, {"id": "354", "q": "A supplier's country imposes new export controls affecting a critical component. What is the PM's correct sequence?", "o": ["Escalate, then assess", "Assess the impact on schedule, cost and compliance; activate fallback options; raise a change request; inform governance", "Change supplier immediately", "Continue and monitor"], "a": 1, "e": "Assess, respond, formalise, inform. ---"}, {"id": "355", "q": "What is the primary risk of a controlling PMO on an experienced team?", "o": ["Insufficient support", "Process compliance can become an end in itself, adding overhead without improving outcomes", "Loss of resources", "Reduced budget"], "a": 1, "e": "Compliance overhead without value. ---"}, {"id": "356", "q": "An organisation's lessons learned repository is rarely used by new projects. What is the most effective improvement?", "o": ["Mandate its use", "Make lessons searchable, specific and actionable, and embed the relevant ones into templates, checklists and planning steps", "Increase the volume of lessons captured", "Assign a librarian"], "a": 1, "e": "Embed into the workflow rather than relying on voluntary search. ---"}, {"id": "357", "q": "Which is the correct treatment of an assumption that underpins a regulatory approval?", "o": ["Record it in the assumption log only", "Record it, validate it explicitly with the regulator or counsel, and track the related risk until it is confirmed", "Treat it as a constraint", "Escalate it as an issue"], "a": 1, "e": "High-consequence assumptions get active validation. ---"}, {"id": "358", "q": "A project manager is asked to sign off on work they did not oversee and cannot verify. What should they do?", "o": ["Sign, relying on the team's assurance", "Decline to certify what they cannot verify; obtain the evidence or have the accountable person sign", "Sign with a verbal caveat", "Escalate to the sponsor for instruction"], "a": 1, "e": "Do not certify what you cannot verify. ---"}, {"id": "359", "q": "What is the most effective structural response to repeated cross-project resource conflicts?", "o": ["Escalating each conflict individually", "Raising the pattern to portfolio or PMO level so that prioritisation and capacity planning are addressed systemically", "Hiring contractors", "Reducing project scope"], "a": 1, "e": "Systemic problems need a systemic fix. ---"}, {"id": "360", "q": "Which best defines organisational agility in PMI's framing?", "o": ["Using Scrum across the organisation", "The organisation's ability to sense external change and reconfigure its work and priorities quickly in response", "Shorter project durations", "Reduced documentation"], "a": 1, "e": "Sensing and reconfiguring, not a specific framework."}], "domain": "be"}, {"id": "b_multi", "title": "Multiple-response", "group": "advanced", "qs": [{"id": "MS1", "q": "Which of the following are components of the scope baseline? (Select THREE)", "o": ["Project scope statement", "Work breakdown structure", "Requirements traceability matrix", "WBS dictionary", "Project schedule"], "m": 1, "a": [0, 1, 3], "e": "The scope baseline is the scope statement, the WBS and the WBS dictionary. ---"}, {"id": "MS2", "q": "Which are valid risk responses for threats? (Select THREE)", "o": ["Exploit", "Mitigate", "Transfer", "Enhance", "Avoid"], "m": 1, "a": [1, 2, 4], "e": "Exploit and enhance apply to opportunities. ---"}, {"id": "MS3", "q": "Which are characteristics of a servant leader? (Select TWO)", "o": ["Assigns daily tasks to team members", "Removes impediments blocking the team", "Reports individual performance rankings weekly", "Creates an environment where the team can self-organise"], "m": 1, "a": [1, 3], "e": "Serving and enabling, not directing or ranking. ---"}, {"id": "MS4", "q": "Which items belong inside the cost baseline? (Select TWO)", "o": ["Work package cost estimates", "Management reserve", "Contingency reserve", "Profit margin"], "m": 1, "a": [0, 2], "e": "Management reserve sits outside the cost baseline. ---"}, {"id": "MS5", "q": "Which are enterprise environmental factors? (Select THREE)", "o": ["Government regulations", "Lessons learned repository", "Marketplace conditions", "Organisational culture", "Change control procedures"], "m": 1, "a": [0, 2, 3], "e": "B and E are organisational process assets. ---"}, {"id": "MS6", "q": "Which techniques compress a schedule? (Select TWO)", "o": ["Crashing", "Resource levelling", "Fast tracking", "Rolling wave planning"], "m": 1, "a": [0, 2], "e": "Levelling usually extends duration. ---"}, {"id": "MS7", "q": "Which are Scrum accountabilities? (Select THREE)", "o": ["Product Owner", "Project Manager", "Scrum Master", "Developers", "Steering committee"], "m": 1, "a": [0, 2, 3], "e": "Scrum defines exactly three. ---"}, {"id": "MS8", "q": "Which are costs of conformance? (Select TWO)", "o": ["Training", "Warranty claims", "Inspection", "Scrap"], "m": 1, "a": [0, 2], "e": "Prevention and appraisal are conformance; scrap and warranty are non-conformance. ---"}, {"id": "MS9", "q": "Which of these are outputs of the closing process? (Select THREE)", "o": ["Final lessons learned in the repository", "Formal acceptance of deliverables", "Approved change requests", "Released resources", "The scope baseline"], "m": 1, "a": [0, 1, 3], "e": "Change requests and baselines belong to earlier processes. ---"}, {"id": "MS10", "q": "Which conditions favour an adaptive approach? (Select THREE)", "o": ["Requirements are volatile", "The cost of change is high", "Incremental delivery creates value", "The customer can engage continuously", "The work is safety-critical with fixed regulatory design"], "m": 1, "a": [0, 2, 3], "e": "B and E favour predictive. ---"}, {"id": "MS11", "q": "Which are elements of the PMI Code of Ethics? (Select FOUR)", "o": ["Responsibility", "Efficiency", "Respect", "Fairness", "Honesty"], "m": 1, "a": [0, 2, 3, 4], "e": "Efficiency is not one of the four values. ---"}, {"id": "MS12", "q": "Which describe the product owner's accountabilities? (Select TWO)", "o": ["Ordering the product backlog", "Deciding how much work the team takes into a sprint", "Maximising the value of the product", "Facilitating the retrospective"], "m": 1, "a": [0, 2], "e": "Capacity is the developers'; facilitation is typically the Scrum Master's. ---"}, {"id": "MS13", "q": "Which are valid uses of the management reserve? (Select TWO)", "o": ["Funding an unforeseen event outside the risk register", "Funding an identified risk that has occurred", "Requires management approval before use", "Controlled directly by the project manager"], "m": 1, "a": [0, 2], "e": "B and D describe contingency reserve. ---"}, {"id": "MS14", "q": "Which tools support root cause analysis? (Select TWO)", "o": ["Fishbone diagram", "Control chart", "Five Whys", "Resource histogram"], "m": 1, "a": [0, 2], "e": "Control charts show stability; histograms show allocation. ---"}, {"id": "MS15", "q": "Which are types of PMO? (Select THREE)", "o": ["Supportive", "Predictive", "Controlling", "Directive", "Iterative"], "m": 1, "a": [0, 2, 3], "e": "The three degrees of control. ---"}, {"id": "MS16", "q": "Which are true of total float? (Select TWO)", "o": ["It equals LS − ES", "It is always zero on the critical path unless there is an imposed date", "It measures delay without affecting the immediate successor", "It is calculated only in agile projects"], "m": 1, "a": [0, 1], "e": "C describes free float. ---"}, {"id": "MS17", "q": "Which are valid agile estimation techniques? (Select THREE)", "o": ["Planning poker", "Affinity grouping", "Earned value analysis", "T-shirt sizing", "Monte Carlo simulation"], "m": 1, "a": [0, 1, 3], "e": "Relative sizing methods. ---"}, {"id": "MS18", "q": "Which belong in the issue log? (Select THREE)", "o": ["Issue owner", "Target resolution date", "Probability of occurrence", "Current status", "Risk response strategy"], "m": 1, "a": [0, 1, 3], "e": "Probability and response strategy belong to the risk register. ---"}, {"id": "MS19", "q": "Which actions are appropriate when a compliance requirement is discovered mid-project? (Select THREE)", "o": ["Assess the impact on scope, schedule, cost and risk", "Defer it until after delivery", "Raise a change request", "Update the risk register", "Remove a lower-priority requirement to compensate without approval"], "m": 1, "a": [0, 2, 3], "e": "Never defer compliance, never adjust scope unilaterally. ---"}, {"id": "MS20", "q": "Which are characteristics of a well-formed user story (INVEST)? (Select THREE)", "o": ["Independent", "Inflexible", "Valuable", "Testable", "Lengthy"], "m": 1, "a": [0, 2, 3], "e": "Independent, Negotiable, Valuable, Estimable, Small, Testable. ---"}, {"id": "MS21", "q": "Which are appropriate uses of interactive communication? (Select TWO)", "o": ["Delivering news of a major delay", "Distributing the weekly metrics pack", "Resolving a disagreement between two stakeholders", "Publishing the project glossary"], "m": 1, "a": [0, 2], "e": "Sensitive and complex matters need richness. ---"}, {"id": "MS22", "q": "Which statements about the definition of done are correct? (Select TWO)", "o": ["It applies to the increment as a whole", "It is set by the product owner alone", "It is a shared quality standard for releasability", "It replaces acceptance criteria for individual stories"], "m": 1, "a": [0, 2], "e": "Team-level standard; story acceptance criteria still apply. ---"}, {"id": "MS23", "q": "Which are valid sources of project risk identification? (Select THREE)", "o": ["Assumption and constraint analysis", "SWOT analysis", "Earned value analysis", "Delphi technique", "Resource levelling"], "m": 1, "a": [0, 1, 3], "e": "EVA is performance analysis; levelling is scheduling. ---"}, {"id": "MS24", "q": "Which are signs that a process is out of control on a control chart? (Select TWO)", "o": ["A point beyond the upper control limit", "Seven consecutive points on the same side of the mean", "A point outside the specification limit but within control limits", "Variation within ±1σ"], "m": 1, "a": [0, 1], "e": "C indicates a defect, not necessarily process instability. ---"}, {"id": "MS25", "q": "Which activities belong to validate scope? (Select TWO)", "o": ["Obtaining formal customer acceptance", "Inspecting deliverables against acceptance criteria with the customer", "Verifying correctness against requirements internally", "Measuring defect density"], "m": 1, "a": [0, 1], "e": "C and D are control quality. ---"}, {"id": "MS26", "q": "Which are appropriate responses to a resistant stakeholder? (Select THREE)", "o": ["Meet privately to understand their concerns", "Escalate to their manager immediately", "Involve them meaningfully in shaping the solution", "Adjust the approach if their objection is valid", "Reduce their access to project information"], "m": 1, "a": [0, 2, 3], "e": "Understand, involve, adapt. ---"}, {"id": "MS27", "q": "Which are outputs of quantitative risk analysis? (Select TWO)", "o": ["A prioritised list based on subjective scoring", "A probability distribution of project cost or duration", "Sensitivity analysis showing influential variables", "A risk breakdown structure"], "m": 1, "a": [1, 2], "e": "A is qualitative; D is a planning artifact. ---"}, {"id": "MS28", "q": "Which apply to a firm fixed price contract? (Select TWO)", "o": ["The seller carries the cost risk", "Suited to well-defined scope", "The buyer reimburses actual costs", "The fee varies with performance"], "m": 1, "a": [0, 1], "e": "C and D describe reimbursable and incentive arrangements. ---"}, {"id": "MS29", "q": "Which are responsibilities in closing a phase? (Select THREE)", "o": ["Validate readiness for transition to operations", "Capture lessons learned", "Baseline the schedule", "Close procurements", "Conduct qualitative risk analysis"], "m": 1, "a": [0, 1, 3], "e": "C and E belong to planning and execution. ---"}, {"id": "MS30", "q": "Which are valid ways to earn PDUs? (Select THREE)", "o": ["Attending a webinar", "Working as a practitioner, up to 8 per cycle", "Sitting the PMP exam again", "Volunteering for PMI", "Paying the renewal fee"], "m": 1, "a": [0, 1, 3], "e": "Education and giving back. ---"}, {"id": "MS31", "q": "Which describe hybrid approaches? (Select TWO)", "o": ["Predictive governance with iterative delivery inside phases", "Abandoning change control entirely", "Different approaches for different components with an integrated release plan", "Running Scrum with no product owner"], "m": 1, "a": [0, 2], "e": "Hybrid combines, it does not remove governance. ---"}, {"id": "MS32", "q": "Which elements belong in a team charter? (Select THREE)", "o": ["Decision-making process", "Meeting guidelines", "Project budget", "Conflict resolution process", "Contract terms"], "m": 1, "a": [0, 1, 3], "e": "Working agreements, not commercial terms. ---"}, {"id": "MS33", "q": "Which statements about velocity are correct? (Select TWO)", "o": ["It should be used to compare teams", "It is best used as a rolling average for that team's forecasting", "It should be set as a performance target", "It recalibrates when team membership changes"], "m": 1, "a": [1, 3], "e": "Never for comparison, never as a target. ---"}, {"id": "MS34", "q": "Which are appropriate first actions when a supplier reports a delay? (Select TWO)", "o": ["Assess the impact on the critical path and dependent work", "Immediately invoke liquidated damages", "Meet the supplier to understand the cause and agree a recovery plan", "Replace the supplier"], "m": 1, "a": [0, 2], "e": "Assess and engage before contractual remedies. ---"}, {"id": "MS35", "q": "Which belong to the cost of non-conformance? (Select TWO)", "o": ["Rework", "Process documentation", "Warranty claims", "Equipment calibration"], "m": 1, "a": [0, 2], "e": "Internal and external failure. ---"}, {"id": "MS36", "q": "Which statements about the change log are correct? (Select TWO)", "o": ["Rejected change requests are recorded", "Only approved changes are recorded", "It records the decision and its rationale", "It is created only in agile projects"], "m": 1, "a": [0, 2], "e": "All requests, with decisions and rationale. ---"}, {"id": "MS37", "q": "Which practices support sustainability on a project? (Select THREE)", "o": ["Life-cycle cost analysis including disposal", "Supplier ESG criteria in source selection", "Deferring environmental assessment to operations", "Design for X targeting recyclability", "Excluding environmental impact from the risk register"], "m": 1, "a": [0, 1, 3], "e": "Sustainability is planned in, not deferred out. ---"}, {"id": "MS38", "q": "Which are appropriate controls for responsible AI use on a project? (Select FOUR)", "o": ["Human review of consequential AI-assisted decisions", "Checking data classification before input", "Treating AI forecasts as authoritative", "Maintaining an audit trail of AI-assisted decisions", "Disclosing AI use where stakeholders would expect to know"], "m": 1, "a": [0, 1, 3, 4], "e": "C is the error: an AI forecast is one input, never authoritative. ---"}, {"id": "MS39", "q": "Which are true of the 2026 exam structure? (Select THREE)", "o": ["180 questions with 170 scored", "240 minutes", "Three 10-minute breaks", "A case-study section followed by independent questions", "Domains weighted People 42%, Process 50%, Business Environment 8%"], "m": 1, "a": [0, 1, 3], "e": "Two breaks, and the weights are 33/41/26. ---"}, {"id": "MS40", "q": "Which actions are appropriate when the business case is no longer viable? (Select TWO)", "o": ["Continue because significant cost has already been incurred", "Analyse the remaining cost to complete against the remaining expected benefit", "Present options including termination to the sponsor with a recommendation", "Reduce scope quietly to preserve the budget"], "m": 1, "a": [1, 2], "e": "Ignore sunk cost; escalate with a recommendation."}], "domain": "mixed"}, {"id": "b_case", "title": "Case-study sets", "group": "formats", "qs": [{"id": "C1.1", "q": "What is the most significant risk to the project's value that the scenario reveals?", "o": ["The SPI of 0.88", "Ward staff are unprepared for a change in clinical workflow, threatening adoption and patient safety", "The firm fixed price contract", "The part-time infrastructure team"], "a": 1, "e": "A clinical workflow change nobody has prepared staff for threatens both adoption and safety; that outweighs a modest schedule variance.", "sc": 0}, {"id": "C1.2", "q": "What should the project manager do about the reassigned engineers?", "o": ["Escalate to the CMO immediately", "Review the resource commitments, assess the schedule impact, and negotiate with the IT director on timing and duration", "Accept the reassignment and re-baseline", "Ask the vendor to perform the infrastructure work"], "a": 1, "e": "In a weak matrix, negotiate with the resource owner using the plan and the impact analysis before escalating.", "sc": 0}, {"id": "C1.3", "q": "The DPO's absence since initiation is best described as:", "o": ["Acceptable, because consultation happened at the start", "A stakeholder engagement gap on a high-power stakeholder with regulatory authority over patient data", "The vendor's responsibility", "A low-priority communication issue"], "a": 1, "e": "Patient data migration puts the DPO in the manage-closely quadrant throughout, not just at initiation.", "sc": 0}, {"id": "C1.4", "q": "Given CPI 0.97 and SPI 0.88, what is the most accurate interpretation?", "o": ["The project is in good shape overall", "Cost efficiency is close to plan but work is falling behind; with a fixed go-live date, schedule is the pressing constraint", "The project will finish under budget", "The vendor is underperforming"], "a": 1, "e": "The fixed date makes the schedule variance the critical signal.", "sc": 0}, {"id": "C1.5", "q": "Which action should come first in addressing the ward staff issue?", "o": ["Postpone go-live", "Engage the clinical leadership to assess the scope of the workflow change and plan training, communication and support as part of transition", "Ask the vendor to change the entry process back", "Issue a training email to all ward staff"], "a": 1, "e": "Assess with the clinical owners, then plan organisational change; a mass email is not change management.", "sc": 0}, {"id": "C2.1", "q": "Based on current velocity, what is the forecast?", "o": ["The scope will be completed on time", "About 19 to 20 sprints are needed against 9 remaining, so the fixed scope cannot be delivered by the end date at current velocity", "The team needs to work faster", "The scope will be completed with two sprints to spare"], "a": 1, "e": "610 ÷ 32 ≈ 19 sprints; 18 weeks is 9 sprints.", "sc": 1}, {"id": "C2.2", "q": "What is the underlying structural problem?", "o": ["Low team velocity", "A fixed-scope, fixed-price contract combined with an adaptive delivery approach and an unempowered product owner", "Sprint length is too long", "The marketing director's personality"], "a": 1, "e": "The contract model, the approach and the decision rights are misaligned.", "sc": 1}, {"id": "C2.3", "q": "How should the new feature requests be handled?", "o": ["Developers accept small requests to maintain goodwill", "Redirect them to the product owner for backlog ordering, and make the trade-off against the fixed scope visible", "Reject all new requests", "Add them to the current sprint"], "a": 1, "e": "Protect the backlog and the team; show the trade-off.", "sc": 1}, {"id": "C2.4", "q": "What should the project manager propose to the customer?", "o": ["Adding developers to reach the scope", "A conversation about prioritising the most valuable features within the remaining capacity, with a contract variation to reflect it, and an empowered product owner", "Extending sprints to three weeks", "Continuing and invoking the contract at the end"], "a": 1, "e": "Reset scope by value, align the contract, fix the decision rights.", "sc": 1}, {"id": "C3.1", "q": "What should the project manager do first?", "o": ["Begin designing the filtration stage", "Assess the regulation's impact on scope, schedule, cost, risk and compliance, with the design team and specialists", "Wait for the sponsor to return", "Ask the regulator for an exemption"], "a": 1, "e": "Impact assessment comes before design work or escalation.", "sc": 2}, {"id": "C3.2", "q": "With the sponsor on leave, how should the PM proceed with governance?", "o": ["Wait three weeks", "Use the governance structure's delegated authority or escalation path — a deputy sponsor or the steering committee — to raise the change without delay", "Make the decision alone", "Inform the sponsor on return"], "a": 1, "e": "Governance should define who acts in the sponsor's absence; a compliance deadline cannot wait.", "sc": 2}, {"id": "C3.3", "q": "Which reserve most likely funds the additional filtration stage?", "o": ["The remaining contingency reserve", "The management reserve, via approved change control, because this is a new requirement rather than an identified risk", "The project's profit margin", "The operations budget"], "a": 1, "e": "A new regulation is an unknown unknown; it is funded via management reserve and change control.", "sc": 2}, {"id": "C3.4", "q": "What does 60% contingency consumption at 40% completion indicate, independent of the regulation?", "o": ["Normal consumption", "Identified risks are materialising faster than planned; perform reserve analysis and report the exposure", "The reserve was too large", "The baseline needs re-estimating"], "a": 1, "e": "Reserve burn outpacing progress is an early warning in its own right.", "sc": 2}, {"id": "C4.1", "q": "What is the most likely cause of low adoption in APAC?", "o": ["The regional director's personality", "A genuine fit problem: the system's process does not match the region's sales model", "Lack of training", "Poor communication from the project"], "a": 1, "e": "The usage analysis points to a real process mismatch.", "sc": 3}, {"id": "C4.2", "q": "How should the PM respond to the sponsor's instruction?", "o": ["Implement mandatory usage as directed", "Share the analysis with the sponsor, recommend addressing the process fit, and propose a path to adoption that involves the regional director", "Refuse the instruction", "Escalate to the steering committee"], "a": 1, "e": "Bring the evidence and a better option to the sponsor; forcing a misfit process damages value.", "sc": 3}, {"id": "C4.3", "q": "What is the best way to engage the regional director?", "o": ["Report her non-compliance", "Meet her to understand the sales model in depth and involve her in designing the configuration change", "Go around her to her team", "Ask the sponsor to instruct her"], "a": 1, "e": "The resistant stakeholder here is right; involve her in the fix.", "sc": 3}, {"id": "C4.4", "q": "What lesson should be captured?", "o": ["Regional directors should be mandated to comply", "Regional process variations must be identified during requirements, not after rollout", "Rollouts should be regional rather than global", "Usage should be mandatory from day one"], "a": 1, "e": "The failure was upstream, in requirements.", "sc": 3}, {"id": "C5.1", "q": "Under the CPIF contract, what happens to the vendor's fee as costs exceed target?", "o": ["It stays fixed", "It reduces according to the share ratio, while allowable costs continue to be reimbursed", "It increases", "It is forfeited entirely"], "a": 1, "e": "Reimbursed costs, reduced fee.", "sc": 4}, {"id": "C5.2", "q": "How should the claim be handled?", "o": ["Reject it entirely", "Accept it entirely to preserve the relationship", "Negotiate: acknowledge the three genuine specification gaps through a formal change, and decline the five with the rationale", "Refer it straight to arbitration"], "a": 2, "e": "Separate the valid from the invalid, handled through the contract's claims process.", "sc": 4}, {"id": "C5.3", "q": "What should the PM do about the lead engineer's absence?", "o": ["Invoke a contractual attendance clause", "Contact them directly to understand the reason and re-establish the working relationship", "Report it to the vendor's management", "Ignore it"], "a": 1, "e": "Direct contact first; the relationship matters to delivery.", "sc": 4}, {"id": "C5.4", "q": "Which preventive action would most have reduced this dispute?", "o": ["A firm fixed price contract", "More rigorous requirements definition and review with the vendor before contract award", "A shorter contract", "Weekly penalty reviews"], "a": 1, "e": "The genuine gaps were the buyer's; better upstream definition prevents claims.", "sc": 4}, {"id": "C6.1", "q": "What is the most likely reason the forecasts diverge?", "o": ["The team is being pessimistic", "The model lacks information about current conditions — the blockers and the new supplier are outside its training data", "The AI tool is broken", "The historical data is fabricated"], "a": 1, "e": "Models trained on history cannot see novel current conditions.", "sc": 5}, {"id": "C6.2", "q": "What should the PM report to the steering committee?", "o": ["The AI forecast, since the committee prefers it", "Both forecasts, the reasons they differ, and the PM's evidence-based assessment and recommendation", "The team's forecast only", "An average of the two"], "a": 1, "e": "Transparency about both and an accountable recommendation.", "sc": 5}, {"id": "C6.3", "q": "What is the PM's accountability here?", "o": ["The PMO owns the tool, so the forecast is the PMO's responsibility", "The PM remains accountable for the forecast they present; AI output is one input to judgement", "The vendor of the AI tool is accountable", "The steering committee is accountable"], "a": 1, "e": "Human accountability for AI-assisted decisions.", "sc": 5}, {"id": "C6.4", "q": "What should the PM recommend to the PMO?", "o": ["Discontinue the tool", "Feed current-state indicators such as blockers and supplier status into the tool, and require human validation of forecasts before governance use", "Use only the AI tool in future", "Nothing"], "a": 1, "e": "Improve the inputs and keep a human in the loop.", "sc": 5}, {"id": "C7.1", "q": "What should the PM do about the net-zero commitment?", "o": ["Ignore it — it is not in the business case", "Raise the gap between the business case and the organisational commitment with the sponsor, with a life-cycle cost comparison of including sustainable features now versus retrofitting", "Add solar without approval", "Defer it to operations"], "a": 1, "e": "Organisational commitments must be reconciled with the business case, using whole-life cost.", "sc": 6}, {"id": "C7.2", "q": "Which cost measure best supports the decision?", "o": ["Initial construction cost", "Life-cycle cost including operation, energy, maintenance and retrofit", "Cost of quality", "Contingency reserve"], "a": 1, "e": "Whole-life cost reveals the retrofit penalty.", "sc": 6}, {"id": "C7.3", "q": "How should the community group be treated?", "o": ["Out of scope", "As stakeholders: identify, analyse their concerns, and plan engagement and mitigations such as traffic routing and working hours", "Refer them to the council", "Engage only if they escalate"], "a": 1, "e": "Communities affected by the project are stakeholders.", "sc": 6}, {"id": "C7.4", "q": "Which of these best reflects PMI's sustainability principle in this scenario?", "o": ["Sustainability is a separate project for later", "Sustainability considerations should be integrated into requirements, cost, risk and stakeholder planning now", "Sustainability applies only to environmental projects", "Sustainability is the sponsor's decision alone"], "a": 1, "e": "Integrate across all project areas.", "sc": 6}, {"id": "C8.1", "q": "What should the PM do first?", "o": ["Continue delivery as planned", "Seek urgent clarity on sponsorship and whether the project's business case still stands in the merged organisation", "Stop all work", "Tell the vendor to proceed"], "a": 1, "e": "Without a sponsor and a valid business case, the project has no mandate.", "sc": 7}, {"id": "C8.2", "q": "How should the PM respond to the vendor?", "o": ["Authorise the next phase to avoid delay", "Explain that a decision is pending, and check the contract for options to defer the phase without penalty while governance is resolved", "Terminate the contract", "Ignore the request"], "a": 1, "e": "Do not commit new spend without a mandate; use the contract's flexibility.", "sc": 7}, {"id": "C8.3", "q": "How should the PM handle the team's anxiety?", "o": ["Reassure them that the project is safe", "Be honest about what is known and unknown, keep them informed as decisions are made, and support them", "Say nothing until there is news", "Encourage them to look for other roles"], "a": 1, "e": "Honesty and regular communication; false reassurance destroys trust.", "sc": 7}, {"id": "C8.4", "q": "If the merged organisation decides the existing platform makes your project redundant, what should the PM recommend?", "o": ["Complete the project anyway, since 55% has been spent", "Terminate and formally close the project, capturing lessons and transferring any reusable assets", "Pause indefinitely", "Merge the two platforms"], "a": 1, "e": "Sunk cost is irrelevant; close properly.", "sc": 7}, {"id": "C9.1", "q": "What is the most significant risk in this scenario?", "o": ["The consultancy has left", "Two critical clusters have never been rehearsed, and the full rehearsal already overruns the window", "The operations director's inflexibility", "The regulators' involvement"], "a": 1, "e": "Untested critical components plus a known overrun make failure on the night likely.", "sc": 8}, {"id": "C9.2", "q": "What should the project manager do first about the unrehearsed clusters?", "o": ["Include them on the night and hope", "Engage the cluster owners, explain the risk, and schedule their participation in a rehearsal before the cutover", "Escalate the owners to the operations director", "Remove them from scope"], "a": 1, "e": "Go to the owners directly; escalation follows if they still cannot commit.", "sc": 8}, {"id": "C9.3", "q": "The operations director insists the date is fixed. What is the PM's correct response?", "o": ["Accept the date and the risk", "Present the rehearsal evidence and options — scope phasing, an extended window, a rollback plan, or a date change — with their risks, and let governance decide", "Refuse to proceed", "Move the date unilaterally"], "a": 1, "e": "Evidence and options to the decision-maker; the PM does not silently accept or unilaterally override.", "sc": 8}, {"id": "C9.4", "q": "Which artifact most needs to exist and be tested before the cutover?", "o": ["The lessons learned register", "A rehearsed rollback plan with clear go/no-go criteria and decision authority", "The communications plan", "The WBS dictionary"], "a": 1, "e": "On a single-window cutover, the ability to back out safely is the critical control.", "sc": 8}, {"id": "C10.1", "q": "Which leadership approach best suits a volunteer team?", "o": ["Directive, with firm deadlines and consequences", "Motivation through purpose, autonomy and recognition, with flexible and asynchronous working", "Transactional, tying rewards to output", "Laissez-faire, letting volunteers self-organise without support"], "a": 1, "e": "Volunteers are intrinsically motivated; formal authority and rewards are largely unavailable.", "sc": 9}, {"id": "C10.2", "q": "How should the PM handle the architect who overrides others?", "o": ["Remove him from the team", "Speak with him privately, acknowledge his expertise, and agree a team decision-making process that others can contribute to", "Let the team resolve it", "Give him final authority on all design decisions"], "a": 1, "e": "Private conversation plus an agreed decision process; the expertise is valuable, the behaviour is the problem.", "sc": 9}, {"id": "C10.3", "q": "What is the most realistic way to forecast the launch date for the donor?", "o": ["Use the original plan's date", "Base forecasts on the team's demonstrated throughput, give a range, and review it monthly", "Ask volunteers to commit more hours", "Add a large buffer to the original date"], "a": 1, "e": "Forecast from evidence, communicate a range, and update it.", "sc": 9}, {"id": "C10.4", "q": "What would most improve delivery reliability?", "o": ["Mandatory meetings", "Smaller work items, asynchronous collaboration, and assigning critical-path work to the paid staff", "Recruiting more volunteers", "Weekly reports to the donor"], "a": 1, "e": "Design the work around the team's real availability, and put dependable capacity on the critical path.", "sc": 9}, {"id": "C11.1", "q": "What is the most urgent issue?", "o": ["Synergy savings", "The unflagged change-of-control clauses, which could allow major customers to exit", "The monthly meeting cadence", "Staff anxiety"], "a": 1, "e": "A contractual exposure that could remove major customers affects the value of the whole acquisition.", "sc": 10}, {"id": "C11.2", "q": "How should the PM handle the change-of-control finding?", "o": ["Resolve it within the integration team", "Escalate immediately to the steering committee and legal, without waiting for the monthly meeting, with the facts and the potential impact", "Wait for the next steering meeting", "Contact the customers directly"], "a": 1, "e": "It exceeds the project's authority and cannot wait for the regular cadence.", "sc": 10}, {"id": "C11.3", "q": "What should the PM do about the finance lead's likely departure?", "o": ["Nothing — it is her decision", "Treat it as a critical knowledge risk: begin structured knowledge transfer now, and raise retention options with HR and the sponsor", "Ask her manager to persuade her to stay", "Replace her immediately"], "a": 1, "e": "Capture tacit knowledge urgently and explore retention through the proper channels.", "sc": 10}, {"id": "C11.4", "q": "Which change management action would most reduce further attrition?", "o": ["Accelerating the integration", "Honest, regular communication about what is known and unknown, with clear timelines for decisions affec
