ause the sprint is committed"], "a": 1, "e": "Backlog changes are normal; the PO decides order. ---"}, {"id": "142", "q": "When does a risk become an issue?", "o": ["When its probability exceeds 50%", "When it occurs and is now affecting the project", "When it exceeds the risk threshold", "When the response fails"], "a": 1, "e": "Occurrence converts a risk into an issue. ---"}, {"id": "143", "q": "An impediment has been on the team's board unresolved for three weeks. What does this indicate?", "o": ["The impediment is not important", "The impediment-removal process is failing and should be escalated with a recommendation", "The team lacks skills", "The board needs redesigning"], "a": 1, "e": "Persistent impediments are a governance failure. ---"}, {"id": "144", "q": "What should a project manager include when escalating an issue to the sponsor?", "o": ["The issue only, so the sponsor can decide freely", "The issue, the impact, what has already been tried, the options and a recommendation", "A request for more budget", "A copy of the risk register"], "a": 1, "e": "Escalation without a recommendation is abdication. ---"}, {"id": "145", "q": "Which model diagnoses which stage of individual change adoption a person is stuck at?", "o": ["Tuckman", "ADKAR", "Kotter", "Maslow"], "a": 1, "e": "Awareness, Desire, Knowledge, Ability, Reinforcement. ---"}, {"id": "146", "q": "According to the Satir change model, what should leaders expect immediately after a significant change is introduced?", "o": ["An immediate performance improvement", "A temporary drop in performance during the chaos phase", "No change in performance", "Permanent performance decline"], "a": 1, "e": "Performance dips before integration; leaders must support the team through it. ---"}, {"id": "147", "q": "Which framework is used to scan the external environment across political, economic, social, technological, legal and environmental dimensions?", "o": ["SWOT", "PESTLE", "RACI", "MoSCoW"], "a": 1, "e": "PESTLE. ---"}, {"id": "148", "q": "A project delivers the system on time and on budget, but six months later almost nobody uses it. What failed?", "o": ["Quality control", "Organisational change management and adoption", "Scope validation", "Procurement"], "a": 1, "e": "Output delivered, outcome not achieved. ---"}, {"id": "149", "q": "Who is typically accountable for realising the project's benefits?", "o": ["The project manager", "The benefits owner, often the sponsor or a business owner", "The PMO", "The steering committee"], "a": 1, "e": "The PM delivers outputs and enables outcomes; benefits ownership sits in the business. ---"}, {"id": "150", "q": "Which is the correct definition of compliance?", "o": ["Meeting the customer's expectations", "Conforming to applicable laws, regulations, standards, contracts and internal policies", "Following the project management plan", "Achieving quality targets"], "a": 1, "e": "Compliance is conformance to rules. ---"}, {"id": "151", "q": "A team is under schedule pressure and proposes skipping a mandatory safety inspection to recover two days. What should the PM do?", "o": ["Approve it and inspect afterwards", "Refuse; safety and compliance requirements are never traded against schedule, and escalate the schedule problem instead", "Approve it if the sponsor agrees", "Reduce the inspection scope"], "a": 1, "e": "Non-negotiable. ---"}, {"id": "152", "q": "Which activity ensures improvements survive beyond the project?", "o": ["Holding retrospectives", "Updating the organisational process assets and lessons learned repository", "Reporting to the steering committee", "Documenting the issue log"], "a": 1, "e": "Improvements must be institutionalised. ---"}, {"id": "153", "q": "A project manager is offered an expensive gift by a bidding vendor during tender evaluation. What should they do?", "o": ["Accept it if it is customary locally", "Decline it, disclose the offer through the defined channel, and record it", "Accept it and declare it after the award", "Return it privately without telling anyone"], "a": 1, "e": "Disclose; the appearance of influence is itself the problem. ---"}, {"id": "154", "q": "Which best describes the relationship between organisational governance and project governance?", "o": ["They are independent", "Project governance operates within and is constrained by organisational governance", "Project governance overrides organisational governance during execution", "Only large projects have governance"], "a": 1, "e": "Nested layers of authority. ---"}, {"id": "155", "q": "A project's success metrics were never agreed with the sponsor. At closure there is disagreement about whether the project succeeded. What was the root failure?", "o": ["Poor communication", "Success metrics were not defined and agreed during governance setup", "Scope was poorly defined", "The business case was weak"], "a": 1, "e": "Define success metrics up front; it is an explicit ECO enabler. ---"}, {"id": "156", "q": "What is the purpose of a compliance audit on a project?", "o": ["To find someone to blame", "To measure the extent to which the project conforms to applicable requirements and identify gaps", "To evaluate team performance", "To close procurements"], "a": 1, "e": "Measurement and gap identification. ---"}, {"id": "157", "q": "The organisation restructures and the project's sponsor leaves. What should the PM do first?", "o": ["Continue as planned", "Confirm the new sponsor and governance arrangements, and re-validate the business case and priorities with them", "Escalate to the PMO", "Pause the project"], "a": 1, "e": "Sponsor continuity is a governance essential. ---"}, {"id": "158", "q": "Which type of risk response is used when a risk is outside the project's authority to address?", "o": ["Mitigate", "Transfer", "Escalate", "Accept"], "a": 2, "e": "Escalation transfers ownership to the appropriate level; the risk then leaves the project register. ---"}, {"id": "159", "q": "A project manager identifies a security vulnerability in a supplier's component. What is the best first action?", "o": ["Record it in the risk register and continue", "Assess the impact and exposure, notify the supplier and governance, and determine the remediation approach", "Replace the supplier", "Disclose it publicly"], "a": 1, "e": "Assess, notify appropriately, remediate. ---"}, {"id": "160", "q": "The organisation's risk appetite is low, but the project team has accepted several high-impact risks without reserves. What is wrong?", "o": ["Nothing — acceptance is a valid response", "Risk responses must align with organisational risk appetite and thresholds; this should be escalated and reviewed", "The risks should be transferred", "The risk register needs restructuring"], "a": 1, "e": "Responses must respect the organisation's appetite. ---"}, {"id": "161", "q": "Which statement about lessons learned is correct?", "o": ["They are captured at project closure", "They are captured continuously in the register and transferred to the repository at closure", "They are optional on small projects", "They belong to the PMO, not the project"], "a": 1, "e": "Continuous capture, final transfer. ---"}, {"id": "162", "q": "A steering committee asks for a decision the project manager is authorised to make. What should the PM do?", "o": ["Defer to the committee", "Make the decision, inform the committee, and clarify the decision rights going forward", "Escalate anyway to be safe", "Ask the sponsor"], "a": 1, "e": "Exercise your authority and clarify governance. ---"}, {"id": "163", "q": "Which best describes the value of a customer-centric PMO?", "o": ["It enforces methodology consistently", "It focuses on what project teams need to succeed rather than on compliance for its own sake", "It reports to the CEO", "It manages all projects directly"], "a": 1, "e": "Service orientation over enforcement. ---"}, {"id": "164", "q": "What is the appropriate response when a project manager discovers that a colleague falsified compliance evidence?", "o": ["Discuss it privately and let them correct it", "Report it through the organisation's defined ethics or compliance channel", "Ignore it if no harm resulted", "Raise it at the next team meeting"], "a": 1, "e": "The Code of Ethics requires reporting unethical conduct through proper channels. ---"}, {"id": "165", "q": "A change request would improve product quality but delay delivery by three weeks. Who decides?", "o": ["The project manager", "The team", "The CCB or the authority defined in the change management plan", "The customer"], "a": 2, "e": "The defined decision authority; the PM may have delegated authority for smaller changes. ---"}, {"id": "166", "q": "Which is the best use of a compliance dashboard?", "o": ["Reporting team productivity", "Showing the current status of compliance requirements, evidence and open gaps to governance", "Tracking change requests", "Measuring stakeholder satisfaction"], "a": 1, "e": "Visibility of compliance status. ---"}, {"id": "167", "q": "A regulatory body announces that a required certification will take four months longer than planned. What should the PM do?", "o": ["Proceed with delivery and certify later", "Assess schedule and cost impact, raise a change request, update the risk register, and inform the sponsor and steering committee", "Escalate and await instruction", "Find an alternative certifier without checking validity"], "a": 1, "e": "Full impact assessment then formal governance route. ---"}, {"id": "168", "q": "Which of these best represents an OPA update the project should make?", "o": ["Revising the organisation's procurement policy", "Adding the project's lessons learned, metrics and templates to the knowledge repository", "Changing the corporate quality standard", "Updating the organisational chart"], "a": 1, "e": "Projects update knowledge repositories; the PMO owns policies and procedures. ---"}, {"id": "169", "q": "An external audit finds that the project's change log has gaps. What is the most likely consequence?", "o": ["Minor administrative finding", "Loss of traceability between approved changes and baselines, undermining performance measurement and audit defensibility", "The project must be cancelled", "The CCB must be replaced"], "a": 1, "e": "Traceability is the point of the log. ---"}, {"id": "170", "q": "Kotter's model emphasises generating short-term wins. Why?", "o": ["To meet interim milestones", "To build momentum and credibility for the change, and to convert sceptics", "To satisfy the sponsor", "To justify the budget"], "a": 1, "e": "Visible early wins sustain change effort. ---"}, {"id": "171", "q": "Which is the correct treatment of sunk costs in a continue/stop decision?", "o": ["Include them to justify continuing", "Exclude them; only future costs and benefits are relevant", "Amortise them across remaining phases", "Report them to the CCB for approval"], "a": 1, "e": "Sunk costs are always irrelevant to forward decisions. ---"}, {"id": "172", "q": "A project's benefits will be realised 18 months after closure. What must the project do?", "o": ["Extend the project until benefits are realised", "Ensure a measurement system exists and hand benefits tracking to a named owner at closure", "Report estimated benefits as actual at closure", "Nothing — benefits are outside project scope"], "a": 1, "e": "Instrument and hand over. ---"}, {"id": "173", "q": "What is the main purpose of a value stream map?", "o": ["To show the organisational hierarchy", "To visualise the flow of work and identify waste and delay", "To prioritise the backlog", "To assess stakeholder influence"], "a": 1, "e": "Lean tool for flow and waste. ---"}, {"id": "174", "q": "Which is a threat to compliance most likely to be overlooked?", "o": ["The regulation itself", "Subcontractors and suppliers not subject to direct control", "The project schedule", "The quality plan"], "a": 1, "e": "Supply chain is the common compliance blind spot. ---"}, {"id": "175", "q": "A project manager is asked to report a green status when the project is genuinely amber. What should they do?", "o": ["Report green to preserve the relationship", "Report accurately, with the supporting analysis and a recovery recommendation", "Report amber but omit the cause", "Ask the sponsor to decide the status"], "a": 1, "e": "Honesty is a mandatory standard. --- ## 9.4 Agile and hybrid (30 questions)"}], "domain": "be"}, {"id": "b_agile", "title": "Agile & hybrid", "group": "core", "qs": [{"id": "176", "q": "A sprint ends with two stories incomplete. What happens?", "o": ["The sprint is extended by two days", "The incomplete stories return to the product backlog and are reconsidered for a future sprint", "The stories are marked done with a caveat", "The team works the weekend to finish them"], "a": 1, "e": "Sprints are never extended; unfinished work goes back to the backlog. ---"}, {"id": "177", "q": "Who can cancel a sprint?", "o": ["The Scrum Master", "The developers", "The product owner", "The sponsor"], "a": 2, "e": "Only the PO, and only if the sprint goal becomes obsolete. ---"}, {"id": "178", "q": "What is the purpose of the daily scrum?", "o": ["To report status to the Scrum Master", "For developers to inspect progress toward the sprint goal and adapt their plan", "For the PO to reprioritise", "To assign tasks for the day"], "a": 1, "e": "It is the developers' planning event. ---"}, {"id": "179", "q": "During a sprint review, stakeholders request significant changes to a completed feature. What should happen?", "o": ["The team fixes it within the current sprint", "The feedback is captured as backlog items for the product owner to order", "A change request goes to the CCB", "The feature is rolled back"], "a": 1, "e": "Feedback becomes backlog; the PO prioritises. ---"}, {"id": "180", "q": "Which agile chart best shows progress when scope is changing?", "o": ["Sprint burndown", "Release burnup", "Velocity chart", "Control chart"], "a": 1, "e": "A burnup separates the scope line from the completed line. ---"}, {"id": "181", "q": "A Kanban team's cumulative flow diagram shows a widening band at \"testing\". What does this mean?", "o": ["Testing is efficient", "Work is accumulating at testing — a bottleneck", "Throughput has increased", "WIP limits are too low"], "a": 1, "e": "Widening bands indicate a constraint. ---"}, {"id": "182", "q": "What does INVEST describe?", "o": ["A prioritisation technique", "The characteristics of a well-formed user story", "A scaling framework", "An estimation method"], "a": 1, "e": "Independent, Negotiable, Valuable, Estimable, Small, Testable. ---"}, {"id": "183", "q": "What is a spike in agile?", "o": ["A sudden increase in velocity", "A timeboxed research or prototyping task to reduce uncertainty", "An unplanned defect", "An escalation to the sponsor"], "a": 1, "e": "Bought learning. ---"}, {"id": "184", "q": "Why should velocity never be compared between teams?", "o": ["Teams work on different products", "Story points are relative to each team's own baseline and are not a common unit", "Velocity is confidential", "Velocity varies by sprint length only"], "a": 1, "e": "Points are team-relative. ---"}, {"id": "185", "q": "What is the correct definition of lead time?", "o": ["Time from work starting to completion", "Time from customer request to delivery", "Time between sprints", "Time spent in testing"], "a": 1, "e": "Lead time is the customer's experience; cycle time starts when work begins. ---"}, {"id": "186", "q": "The product owner is unavailable for most of the sprint and the team is blocked on decisions. What should the Scrum Master do?", "o": ["Make the decisions on the PO's behalf", "Escalate the PO's availability as an impediment and work to resolve it", "Pause the sprint", "Ask the sponsor to appoint a new PO"], "a": 1, "e": "PO unavailability is an impediment; removing it is the SM's job. ---"}, {"id": "187", "q": "Which prioritisation technique divides cost of delay by job size?", "o": ["MoSCoW", "Kano", "WSJF", "Dot voting"], "a": 2, "e": "Weighted shortest job first. ---"}, {"id": "188", "q": "In the Kano model, what happens to \"delighter\" features over time?", "o": ["They remain delighters", "They become expected basic features", "They lose value entirely", "They become performance features permanently"], "a": 1, "e": "Delighters decay into expectations. ---"}, {"id": "189", "q": "A hybrid project needs to report agile team progress to a steering committee that expects milestone status. What is the best approach?", "o": ["Convert story points to percentage complete", "Map release increments to milestones and report milestone achievement alongside flow metrics", "Report velocity directly", "Produce a separate predictive schedule for reporting"], "a": 1, "e": "Translate at the boundary using real increments, not invented percentages. ---"}, {"id": "190", "q": "Which contract structure best supports agile delivery with an external vendor?", "o": ["Firm fixed price for the full scope", "Master services agreement with capacity-based or per-iteration work orders", "Cost plus award fee with annual review", "Time and materials with no cap"], "a": 1, "e": "Buys capacity and allows scope to flex. ---"}, {"id": "191", "q": "A team's definition of done excludes performance testing, and performance defects reach production. What should the team do?", "o": ["Add a separate performance testing phase", "Update the definition of done to include performance criteria", "Increase the sprint length", "Assign a dedicated tester"], "a": 1, "e": "The DoD is the quality gate. ---"}, {"id": "192", "q": "What is the purpose of backlog refinement?", "o": ["To assign stories to team members", "To add detail, estimates and order to backlog items so they are ready for future sprints", "To close completed stories", "To report progress to stakeholders"], "a": 1, "e": "Ongoing preparation. ---"}, {"id": "193", "q": "A stakeholder insists on a fixed scope, fixed date and fixed budget for a project with highly uncertain requirements. What should the PM do?", "o": ["Agree and manage the risk", "Explain the trade-off, propose fixing two constraints and varying the third, and offer an incremental approach with defined checkpoints", "Refuse the project", "Add a large contingency and proceed"], "a": 1, "e": "Surface the trade-off and propose a workable structure. ---"}, {"id": "194", "q": "Which scaling framework uses Program Increment planning and Agile Release Trains?", "o": ["LeSS", "Nexus", "SAFe", "Disciplined Agile"], "a": 2, "e": "SAFe. ---"}, {"id": "195", "q": "In a hybrid project, where should change control apply to the agile component?", "o": ["To every story added to the backlog", "To changes in committed release scope, budget, date or contractual obligations", "Nowhere", "Only at closure"], "a": 1, "e": "Governance at the boundary, flexibility inside. ---"}, {"id": "196", "q": "A team is new to agile and the organisation has a strong command-and-control culture. What is the greatest risk to adoption?", "o": ["Lack of tooling", "The culture will not support self-organisation, so agile practices become ceremony without substance", "The team's technical skills", "Sprint length selection"], "a": 1, "e": "Culture determines whether the approach can actually work. ---"}, {"id": "197", "q": "Which best describes a retrospective's output?", "o": ["A status report", "A small number of owned, actionable improvements the team commits to trying", "A list of complaints", "Updated velocity"], "a": 1, "e": "Actionable and owned. ---"}, {"id": "198", "q": "A project has stable, regulated hardware requirements and volatile software requirements. What is the best approach?", "o": ["Fully predictive", "Fully agile", "Hybrid — predictive for hardware, adaptive for software, with an integrated release plan", "Predictive with daily stand-ups"], "a": 2, "e": "Match the approach to the nature of each component. ---"}, {"id": "199", "q": "What does \"money for nothing, change for free\" allow in an agile contract?", "o": ["The vendor to charge for change requests", "The customer to swap equal-sized backlog items freely and terminate early with partial payment", "The vendor to terminate without penalty", "Unlimited scope increase"], "a": 1, "e": "A standard agile contracting arrangement. ---"}, {"id": "200", "q": "A team's velocity drops sharply for two sprints after three members are replaced. What should the Scrum Master report?", "o": ["A performance problem requiring intervention", "An expected effect of team change; forecast should be revised and the team supported through re-forming", "That the estimates were wrong", "That the sprint length should increase"], "a": 1, "e": "New teams re-form; velocity recalibrates. ---"}, {"id": "201", "q": "Which practice most directly supports the agile principle of sustainable pace?", "o": ["Overtime during the final sprint", "Committing to a velocity the team can maintain indefinitely and protecting the team from mid-sprint additions", "Extending sprints when work is unfinished", "Increasing WIP limits"], "a": 1, "e": "Realistic commitment plus protection. ---"}, {"id": "202", "q": "What is the main purpose of a Scrum of Scrums?", "o": ["To report to management", "To coordinate across teams and surface cross-team dependencies and impediments", "To replace the daily scrum", "To conduct joint sprint planning"], "a": 1, "e": "Cross-team coordination. ---"}, {"id": "203", "q": "In Kanban, what is the effect of lowering WIP limits?", "o": ["Throughput increases indefinitely", "Cycle time decreases and bottlenecks become visible", "Lead time increases", "Quality decreases"], "a": 1, "e": "Little's Law plus visibility. ---"}, {"id": "204", "q": "Which statement about the product owner is correct?", "o": ["The PO estimates the work", "The PO is a single person accountable for maximising product value and ordering the backlog", "The PO runs the daily scrum", "The PO is the same as the project sponsor"], "a": 1, "e": "One person, accountable for value and order. ---"}, {"id": "205", "q": "A distributed agile team struggles with collaboration across five time zones. What is the most effective response?", "o": ["Move everyone to one time zone's working hours", "Establish a core overlap window, strengthen asynchronous practices and written decision records, and reduce dependency between locations", "Increase meeting frequency", "Switch to a predictive approach"], "a": 1, "e": "Structural adaptation rather than forcing synchronous working. --- ## 9.5 Calculation drills (15 questions)"}], "domain": "process"}, {"id": "b_calc", "title": "Calculation drills", "group": "core", "qs": [{"id": "206", "q": "BAC $600,000; EV $240,000; AC $300,000; PV $300,000. What is the VAC assuming typical variances?", "o": ["−$150,000", "−$300,000", "+$150,000", "$0"], "a": 0, "e": "CPI = 0.8; EAC = 600,000 ÷ 0.8 = 750,000; VAC = 600,000 − 750,000 = −150,000. ---"}, {"id": "207", "q": "A team of 5 adds 4 members. How many total channels result?", "o": ["10", "36", "45", "26"], "a": 1, "e": "9 × 8 ÷ 2 = 36. ---"}, {"id": "208", "q": "O = 10, M = 15, P = 32. PERT estimate?", "o": ["17", "19", "15.5", "20"], "a": 0, "e": "(10 + 60 + 32) ÷ 6 = 102 ÷ 6 = 17. ---"}, {"id": "209", "q": "Using question 208's values, what is the 95.45% confidence range?", "o": ["13.3 to 20.7", "9.7 to 24.3", "6 to 28", "17 to 32"], "a": 1, "e": "σ = (32−10)/6 = 3.67; ±2σ = 17 ± 7.33 = 9.67 to 24.33. ---"}, {"id": "210", "q": "Risks: 40% × $60,000 loss; 15% × $100,000 loss; 25% × $40,000 gain. Net EMV?", "o": ["−$29,000", "−$39,000", "+$10,000", "−$49,000"], "a": 0, "e": "−24,000 − 15,000 + 10,000 = −29,000. ---"}, {"id": "211", "q": "FPIF: target cost $500,000, target fee $50,000, ceiling $600,000, 60/40 share. What is the PTA?", "o": ["$583,333", "$550,000", "$600,000", "$516,667"], "a": 0, "e": "((600,000 − 550,000) ÷ 0.60) + 500,000 = 83,333 + 500,000 = $583,333. ---"}, {"id": "212", "q": "Backlog 420 points; velocities 35, 40, 45, 40. Sprints remaining?", "o": ["9", "10", "11", "12"], "a": 2, "e": "Average 40; 420 ÷ 40 = 10.5 → 11 sprints. ---"}, {"id": "213", "q": "BAC $1,000,000; EV $400,000; AC $500,000. TCPI to BAC?", "o": ["0.80", "1.20", "1.25", "1.50"], "a": 1, "e": "(1,000,000 − 400,000) ÷ (1,000,000 − 500,000) = 600,000 ÷ 500,000 = 1.20. ---"}, {"id": "214", "q": "Paths: A→B→E = 3+8+6; A→C→E = 3+11+6; A→D→E = 3+5+6. What is the float on B?", "o": ["0", "3", "6", "8"], "a": 1, "e": "Critical path A→C→E = 20; A→B→E = 17; float = 3. ---"}, {"id": "215", "q": "An asset costs $90,000, has a salvage value of $10,000 and a useful life of 8 years. Annual straight-line depreciation?", "o": ["$11,250", "$10,000", "$12,500", "$8,000"], "a": 1, "e": "(90,000 − 10,000) ÷ 8 = $10,000. ---"}, {"id": "216", "q": "WIP = 24 items; throughput = 6 items per week. Average cycle time?", "o": ["2 weeks", "4 weeks", "6 weeks", "0.25 weeks"], "a": 1, "e": "Little's Law: 24 ÷ 6 = 4 weeks. ---"}, {"id": "217", "q": "Project X: NPV $80,000, IRR 14%. Project Y: NPV $80,000, IRR 19%. Which is preferred?", "o": ["X", "Y", "Either", "Insufficient data"], "a": 1, "e": "Equal NPV, higher IRR wins. ---"}, {"id": "218", "q": "EV $270,000; PV $300,000; AC $250,000. Which statement is true?", "o": ["Ahead of schedule, over budget", "Behind schedule, under budget", "Ahead of schedule, under budget", "Behind schedule, over budget"], "a": 1, "e": "SV = −30,000 (behind); CV = +20,000 (under budget). ---"}, {"id": "219", "q": "BAC $800,000; EV $200,000; AC $250,000; the overrun was a one-off. What is the EAC?", "o": ["$1,000,000", "$850,000", "$800,000", "$750,000"], "a": 1, "e": "Atypical: AC + (BAC − EV) = 250,000 + 600,000 = $850,000. ---"}, {"id": "220", "q": "A project has three activities in sequence with variances of 4, 9 and 16. What is the path standard deviation?", "o": ["29", "5.39", "9", "7"], "a": 1, "e": "Sum variances = 29; √29 = 5.39. (Variances add; standard deviations do not.) ---"}], "domain": "process"}, {"id": "b_mock", "title": "Mock exam (60)", "group": "exam", "qs": [{"id": "M1", "q": "A project manager joins a project already in execution and finds no stakeholder register. What should they do first?", "o": ["Continue delivery and build the register at the next phase gate", "Identify and analyse stakeholders, then plan engagement", "Ask the sponsor for a list of stakeholders", "Escalate the gap to the PMO"], "a": 1, "e": "Stakeholder identification and engagement planning come first."}, {"id": "M2", "q": "CPI is 1.05 and SPI is 0.82. What is the situation?", "o": ["Over budget and ahead of schedule", "Under budget and behind schedule", "Under budget and ahead of schedule", "Over budget and behind schedule"], "a": 1, "e": "CPI>1 under budget; SPI<1 behind schedule."}, {"id": "M3", "q": "During a sprint, the product owner asks the team to swap a committed story for a new one of equal size. What should happen?", "o": ["Refuse — the sprint is committed", "The team and PO discuss the impact on the sprint goal and decide together", "Raise a change request", "Extend the sprint"], "a": 1, "e": "Team and PO renegotiate scope within the sprint goal."}, {"id": "M4", "q": "A supplier informs the PM of a possible three-week delay to a critical component. There is no schedule reserve. What should the PM do first?", "o": ["Tell the sponsor the date is still safe", "Instruct the team to compress the schedule", "Assess the impact and evaluate response options with the team", "Escalate to the sponsor for direction"], "a": 2, "e": "Assess impact and options with the team before reporting or acting."}, {"id": "M5", "q": "Which is the strongest evidence that compliance requirements have been properly managed?", "o": ["A compliance section exists in the project plan", "Requirements are traced into scope, tested, evidenced and audited, with gaps reported to governance", "The legal team approved the contract", "No regulator has raised a concern"], "a": 1, "e": "Traced, tested, evidenced and audited, with gaps reported."}, {"id": "M6", "q": "A team member tells the PM privately that a colleague is falsifying test results. What should the PM do?", "o": ["Confront the colleague in the team meeting", "Investigate through the appropriate channel and report through the organisation's ethics process", "Ask the informant to gather more evidence", "Take no action without proof"], "a": 1, "e": "Investigate and report through the ethics channel."}, {"id": "M7", "q": "Which tool would best identify why the same defect keeps recurring?", "o": ["Pareto diagram", "Cause-and-effect (fishbone) diagram and root cause analysis", "Control chart", "Scatter diagram"], "a": 1, "e": "Fishbone plus root cause analysis finds recurring causes."}, {"id": "M8", "q": "A hybrid project's steering committee wants monthly milestone reporting while the delivery team works in two-week sprints. What should the PM do?", "o": ["Change the team to monthly iterations", "Map release increments to milestones and report both increment delivery and milestone status", "Report velocity to the committee", "Report only at milestone dates"], "a": 1, "e": "Map increments to milestones; report both."}, {"id": "M9", "q": "What is the first step when an identified risk occurs?", "o": ["Execute the workaround", "Move it to the issue log, assign an owner, and implement the planned response", "Escalate to the sponsor", "Update the risk register probability to 100%"], "a": 1, "e": "It becomes an issue; execute the planned response."}, {"id": "M10", "q": "A key stakeholder consistently misses review meetings but complains about decisions afterward. What should the PM do?", "o": ["Proceed without them and document their absence", "Meet them to understand the barrier to attendance and agree an engagement approach that works", "Escalate to their manager", "Record the complaints in the issue log"], "a": 1, "e": "Understand the barrier, then agree an approach."}, {"id": "M11", "q": "BAC $300,000; EV $90,000; AC $120,000. What is the EAC assuming performance continues?", "o": ["$330,000", "$360,000", "$400,000", "$420,000"], "a": 2, "e": "CPI 0.75; EAC = 300,000 / 0.75 = $400,000."}, {"id": "M12", "q": "Which of these is a cost of conformance?", "o": ["Rework", "Warranty claims", "Training the team on the quality process", "Scrap"], "a": 2, "e": "Training is a prevention cost, i.e. conformance."}, {"id": "M13", "q": "A project manager wants stakeholders to confirm they understood a complex technical change. Which approach is best?", "o": ["Email the change with a read receipt", "Publish it to the project portal", "Present it in a workshop and use structured questions and feedback to confirm understanding", "Include it in the monthly report"], "a": 2, "e": "Interactive workshop with structured feedback confirms understanding."}, {"id": "M14", "q": "The team proposes using a generative AI tool to summarise confidential client requirements. What should the PM do?", "o": ["Approve it — it saves time", "Check organisational policy, data classification and client contract terms before any use, and require human verification of outputs", "Refuse all AI use on the project", "Approve it if the outputs are reviewed afterwards"], "a": 1, "e": "Policy, data classification and contract first; verify outputs."}, {"id": "M15", "q": "Which document defines who approves changes, at what thresholds?", "o": ["Scope management plan", "Change management plan", "Project charter", "Communications management plan"], "a": 1, "e": "The change management plan defines approval authority and thresholds."}, {"id": "M16", "q": "A team's velocity has been stable but the release burnup shows the total scope line rising steadily. What is happening?", "o": ["The team is underperforming", "Scope is growing; the release date will slip unless scope or capacity changes", "Estimates are inflated", "The burnup chart is misconfigured"], "a": 1, "e": "Rising scope line on a burnup means scope growth."}, {"id": "M17", "q": "Which is the best example of an opportunity response using \"enhance\"?", "o": ["Buying insurance", "Partnering with a specialist firm to share the upside", "Assigning additional expert resources to increase the likelihood a productivity gain materialises", "Accepting the opportunity and monitoring"], "a": 2, "e": "Enhance increases probability or impact of an opportunity."}, {"id": "M18", "q": "A project manager inherits a project where the sponsor and the customer disagree about the definition of success. What should the PM do?", "o": ["Follow the sponsor, who owns the budget", "Facilitate agreement on explicit success metrics with both parties and record them in governance", "Deliver to the scope baseline and let them resolve it", "Escalate to the PMO"], "a": 1, "e": "Facilitate agreed success metrics and record them."}, {"id": "M19", "q": "Which technique reduces the influence of dominant personalities when gathering expert input?", "o": ["Brainstorming", "Delphi technique", "Focus group", "Interview"], "a": 1, "e": "Delphi is anonymous and iterative."}, {"id": "M20", "q": "A project has a critical path of 40 days and a near-critical path of 38 days. The PM crashes the critical path by 4 days. What is the new project duration?", "o": ["34 days", "36 days", "38 days", "40 days"], "a": 2, "e": "The 38-day near-critical path becomes critical after crashing."}, {"id": "M21", "q": "What is the purpose of a fallback plan?", "o": ["To respond to an issue with no planned response", "To be executed if the primary risk response proves ineffective", "To reduce the probability of a risk", "To transfer risk to a third party"], "a": 1, "e": "A fallback is used if the primary response fails."}, {"id": "M22", "q": "A functional manager complains that the PM is \"managing their staff\". What is the most likely underlying problem?", "o": ["The PM is exceeding their authority", "Roles, responsibilities and authority were not clearly established and agreed", "The organisation should be projectised", "The team member reported the PM"], "a": 1, "e": "Roles, responsibilities and authority were never agreed."}, {"id": "M23", "q": "Which is true about a directive PMO?", "o": ["It provides templates and coaching only", "It requires compliance with frameworks but does not manage projects", "Project managers report to it and it manages the projects", "It exists only in agile organisations"], "a": 2, "e": "Directive PMOs manage the projects and own the PMs."}, {"id": "M24", "q": "A project's business case assumed a regulatory approval that has now been refused. What should the PM do?", "o": ["Find an alternative route to approval and continue", "Assess the impact, prepare options including termination, and escalate to the sponsor with a recommendation", "Continue the parts of the project unaffected", "Cancel the project immediately"], "a": 1, "e": "Assess, prepare options including termination, escalate with a recommendation."}, {"id": "M25", "q": "Which of these is a valid use of contingency reserve?", "o": ["Funding an approved scope change", "Funding the response to an identified risk that has occurred", "Covering a cost overrun caused by poor estimating on unrelated work", "Funding an unforeseen event outside the risk register"], "a": 1, "e": "Contingency funds identified risks that occur."}, {"id": "M26", "q": "A team repeatedly delivers features the customer does not use. What should change?", "o": ["Increase velocity", "Involve the customer in defining and prioritising by value, and validate assumptions with real usage data", "Improve the definition of done", "Increase testing coverage"], "a": 1, "e": "Involve the customer in value-based prioritisation and validate with usage."}, {"id": "M27", "q": "Which approach should a PM take when a stakeholder's engagement level needs to move from neutral to supportive?", "o": ["Increase the frequency of reports", "Identify what that stakeholder values, involve them meaningfully and demonstrate how the project serves their interests", "Ask the sponsor to endorse the project publicly", "Reclassify them as low priority"], "a": 1, "e": "Understand what they value and involve them meaningfully."}, {"id": "M28", "q": "A quality audit reveals the team is producing excellent documentation nobody reads. What should the PM do?", "o": ["Continue — documentation is required", "Tailor the artifacts to what is actually needed and useful, reducing waste", "Require stakeholders to read it", "Move the documentation to a wiki"], "a": 1, "e": "Tailor artifacts to real need; unread documentation is waste."}, {"id": "M29", "q": "What is the correct order of the closing activities?", "o": ["Release resources, obtain acceptance, close procurements, capture lessons", "Obtain acceptance, validate transition readiness, close procurements, capture lessons, release resources, archive", "Capture lessons, obtain acceptance, release resources", "Close procurements, release resources, obtain acceptance"], "a": 1, "e": "Acceptance, transition readiness, procurements, lessons, resources, archive."}, {"id": "M30", "q": "A project requires 35 days but the mandated date allows 30. What should the PM do first?", "o": ["Accept the date and hope for the best", "Analyse compression options with their cost and risk, and present the trade-offs to the sponsor", "Reduce scope unilaterally", "Escalate that the date is impossible"], "a": 1, "e": "Analyse compression options and present trade-offs."}, {"id": "M31", "q": "In a matrix organisation, who typically controls the project budget in a strong matrix?", "o": ["The functional manager", "The project manager", "The PMO", "The sponsor only"], "a": 1, "e": "The PM controls the budget in a strong matrix."}, {"id": "M32", "q": "Which is the best interpretation of a CPI of 1.0 with an SPI of 0.7?", "o": ["The project is performing well overall", "Cost efficiency is on plan but the project is significantly behind schedule; investigate whether work is simply not being done", "The project will finish early", "The estimates were too conservative"], "a": 1, "e": "On-plan cost with poor schedule often means work is not being done."}, {"id": "M33", "q": "What should a project manager do when the team proposes an improvement that would breach an organisational standard?", "o": ["Approve it if it improves outcomes", "Assess the value and seek a formal exception or waiver through governance before proceeding", "Reject it", "Implement it and document the deviation"], "a": 1, "e": "Seek a formal exception through governance."}, {"id": "M34", "q": "Which of the following is a discretionary dependency?", "o": ["Concrete must cure before the structure is loaded", "A permit must be issued before construction begins", "The team prefers to complete design review before starting build", "A supplier must deliver before installation"], "a": 2, "e": "A preference is discretionary logic."}, {"id": "M35", "q": "A project manager notices that the same three risks have remained \"open\" with no response executed for two months. What is the problem?", "o": ["The risks are low priority", "Risk responses are planned but not implemented — implement responses is an execution activity that is being skipped", "The register format is wrong", "The risks should be closed"], "a": 1, "e": "Planned responses are not being implemented."}, {"id": "M36", "q": "Which best describes the relationship between outputs, outcomes and benefits?", "o": ["They are synonyms", "Outputs are what is built; outcomes are the resulting change; benefits are the measurable gains", "Benefits precede outcomes", "Outputs are measured after closure"], "a": 1, "e": "Output built, outcome changed, benefit measured."}, {"id": "M37", "q": "A team requests a two-day training course that will improve delivery quality. The budget has no training line. What should the PM do?", "o": ["Refuse", "Assess the cost and benefit, and raise the funding request through the appropriate authority", "Fund it from the contingency reserve", "Ask the team to train in their own time"], "a": 1, "e": "Assess cost and benefit, request funding via the right authority."}, {"id": "M38", "q": "During the final week of a project, the customer requests a minor cosmetic change. What should the PM do?", "o": ["Implement it as a gesture of goodwill", "Log it as a change request, assess the impact including on closure, and follow the process", "Refuse because the project is closing", "Add it to the operations backlog without discussion"], "a": 1, "e": "Log it and follow the change process, including the closure impact."}, {"id": "M39", "q": "What does a tornado diagram show?", "o": ["Risk probability over time", "Which variables have the greatest impact on the outcome", "Cumulative flow", "Defect distribution"], "a": 1, "e": "Tornado diagrams rank variables by influence."}, {"id": "M40", "q": "A newly formed team is arguing about how decisions will be made. What should the PM do?", "o": ["Make the decisions themselves until the team matures", "Facilitate the creation of a team charter covering decision-making and ground rules", "Escalate to the sponsor", "Reassign the most disruptive members"], "a": 1, "e": "Facilitate a team charter covering decisions and ground rules."}, {"id": "M41", "q": "Which is the correct treatment when the project manager holds delegated authority to approve changes below $10,000 and a $6,000 change is requested?", "o": ["Send it to the CCB anyway", "Assess the impact, approve or reject within their authority, record the decision and communicate it", "Implement it without recording", "Ask the sponsor to confirm"], "a": 1, "e": "Act within delegated authority, record and communicate."}, {"id": "M42", "q": "A project's carbon footprint significantly exceeds the organisation's published commitment. The PM was not given sustainability requirements. What is the root failure?", "o": ["The team's execution", "Sustainability requirements were not identified and incorporated into scope, quality and compliance planning", "The procurement process", "The sponsor's briefing"], "a": 1, "e": "Sustainability requirements were never identified or incorporated."}, {"id": "M43", "q": "Which statement about crashing is correct?", "o": ["It reduces cost", "It shortens duration by adding resources, increasing cost and possibly risk", "It overlaps activities", "It has no effect on the critical path"], "a": 1, "e": "Crashing adds resources, cost and possibly risk."}, {"id": "M44", "q": "An agile team's stakeholders keep adding work mid-sprint through informal requests to developers. What should the Scrum Master do?", "o": ["Allow it to maintain goodwill", "Redirect all requests to the product owner and reinforce the sprint goal with stakeholders", "Extend the sprint", "Increase the sprint backlog"], "a": 1, "e": "Redirect to the PO and reinforce the sprint goal."}, {"id": "M45", "q": "What is the primary reason to hold a lessons-learned session at the end of each phase rather than only at project end?", "o": ["It is required by the PMO", "Knowledge is fresh, and improvements can be applied to the remaining phases", "It shortens the closing process", "It provides content for the status report"], "a": 1, "e": "Fresh knowledge can improve the remaining phases."}, {"id": "M46", "q": "BAC $500,000; the project is 30% complete; AC $180,000; PV $175,000. What is the CV?", "o": ["−$30,000", "−$5,000", "+$25,000", "−$25,000"], "a": 0, "e": "EV 150,000 − AC 180,000 = −$30,000."}, {"id": "M47", "q": "Which of these is the strongest indicator that a change control process is failing?", "o": ["Many change requests are submitted", "Baselines are being updated without corresponding approved change requests", "The CCB meets weekly", "Some changes are rejected"], "a": 1, "e": "Baselines changing without approved requests breaks traceability."}, {"id": "M48", "q": "A stakeholder asks why the project is spending money on prevention activities when no defects have occurred. What is the best response?", "o": ["Reduce prevention spending to save cost", "Explain that prevention reduces the far higher cost of internal and external failure, evidenced by the cost of quality analysis", "Reassign the budget to appraisal", "Escalate the question to the sponsor"], "a": 1, "e": "Prevention reduces far higher failure costs."}, {"id": "M49", "q": "In Kanban, what is the effect of classes of service?", "o": ["They set WIP limits", "They define how different types of work are prioritised and handled through the system", "They determine team roles", "They replace the definition of done"], "a": 1, "e": "Classes of service define how work types are prioritised and flow."}, {"id": "M50", "q": "A project team in a highly regulated industry wants to adopt continuous deployment. What must be established first?", "o": ["A faster build pipeline", "That the regulatory and governance framework permits it, with the required controls and evidence built into the pipeline", "Stakeholder approval of the tooling", "A new definition of done"], "a": 1, "e": "Confirm the regulatory framework permits it, with controls and evidence."}, {"id": "M51", "q": "What is the best response when the sponsor asks the PM to omit a known risk from the steering report to \"avoid alarming people\"?", "o": ["Comply — the sponsor is the authority", "Report the risk accurately, offering to frame it with the mitigation plan and current exposure", "Report it verbally only", "Escalate to the PMO"], "a": 1, "e": "Report accurately, framed with mitigation."}, {"id": "M52", "q": "Which is the correct sequence in integrated change control?", "o": ["Approve, assess, implement, communicate", "Request, log, assess impact, decide, communicate, implement, update baselines", "Implement, assess, approve, document", "Log, implement, assess, approve"], "a": 1, "e": "Request, log, assess, decide, communicate, implement, update."}, {"id": "M53", "q": "A risk with a low probability but catastrophic impact has been accepted. What should be in place?", "o": ["Nothing further", "A contingent response with a defined trigger, and possibly a fallback plan", "Insurance in all cases", "Removal from the register"], "a": 1, "e": "A contingent response with a trigger, possibly a fallback."}, {"id": "M54", "q": "Which is the most reliable way to forecast the completion of an agile release?", "o": ["The product owner's target date", "Remaining backlog divided by a rolling average velocity, with a range rather than a single date", "The original estimate", "The number of stories remaining"], "a": 1, "e": "Rolling average velocity giving a range, not a single date."}, {"id": "M55", "q": "A project manager finds that two subsidiary plans contradict each other. What should they do?", "o": ["Follow the more recent plan", "Reconcile the inconsistency, update the integrated project management plan, and communicate the change", "Ask the sponsor which to follow", "Ignore the less important plan"], "a": 1, "e": "Reconcile, update the integrated plan, communicate."}, {"id": "M56", "q": "What best describes the purpose of the assumption log?", "o": ["To record risks", "To track assumptions and constraints so they can be validated, with invalidation triggering impact assessment", "To document the project's scope", "To record stakeholder expectations"], "a": 1, "e": "Assumptions tracked and validated; invalidation triggers assessment."}, {"id": "M57", "q": "A team member is working 60-hour weeks to meet a deadline and quality is deteriorating. What should the PM do?", "o": ["Recognise their commitment publicly", "Address the workload and the underlying schedule problem; unsustainable pace degrades quality and is a leading indicator of failure", "Add another person to the task", "Reduce the quality standard temporarily"], "a": 1, "e": "Unsustainable pace degrades quality; fix the schedule problem."}, {"id": "M58", "q": "Which of these is the best measure of an information radiator's effectiveness?", "o": ["It is visually attractive", "The team updates it and uses it, and anyone walking past can see the current state without asking", "It is included in the status report", "It is stored in the project repository"], "a": 1, "e": "The team updates and uses it; state is visible without asking."}, {"id": "M59", "q": "A PM must select between two suppliers: one is cheaper, the other has verified sustainable sourcing and better references. The evaluation criteria were never weighted. What should the PM do?", "o": ["Select the cheaper supplier", "Establish and agree weighted source selection criteria with stakeholders, then evaluate both against them", "Select the supplier with better references", "Escalate the decision to the sponsor"], "a": 1, "e": "Agree weighted criteria, then evaluate both."}, {"id": "M60", "q": "Which is the most complete definition of project success under the 2026 framing?", "o": ["Delivered on time, on budget and in scope", "All deliverables accepted by the customer", "Delivered value worth the effort and expense, including the traditional constraints and the realisation of intended outcomes", "No outstanding issues at closure"], "a": 2, "e": "Delivered value worth the effort, including outcomes."}], "domain": "mixed"}, {"id": "b_adv_sit", "title": "Advanced situational", "group": "advanced", "qs": [{"id": "221", "q": "A project is 70% complete. The sponsor announces a reorganisation that moves the project under a new business unit with different priorities. The PM has not met the new leadership. What should the PM do first?", "o": ["Continue delivering to the existing plan until told otherwise", "Meet the new leadership to confirm sponsorship, governance and continued alignment of the business case", "Pause the project pending clarity", "Escalate to the PMO"], "a": 1, "e": "Sponsorship and governance continuity must be re-established before anything else. ---"}, {"id": "222", "q": "During integration testing, the team finds that a vendor component fails under load. The contract is firm fixed price and the vendor insists the component meets the written specification. Review shows the specification omitted the load requirement. What should the PM do?", "o": ["Demand the vendor fix it at their cost", "Acknowledge the specification gap, assess options and cost, and negotiate a change to the agreement", "Replace the vendor", "Accept the component and mitigate in the internal system"], "a": 1, "e": "The gap is the buyer's; handle it as a procurement change, not a claim. ---"}, {"id": "223", "q": "Two weeks before a regulatory submission, a team member reports that a test result in the evidence pack was transcribed incorrectly, understating an emission figure. Correcting it will delay submission. What should the PM do?", "o": ["Submit and correct in the next cycle", "Correct the evidence before submission, assess the delay, and inform governance and the regulator as required", "Submit with a footnote", "Ask legal whether disclosure is required before acting"], "a": 1, "e": "Accuracy of regulatory evidence is non-negotiable; correct first, then manage the schedule consequence. ---"}, {"id": "224", "q": "A hybrid programme has three agile delivery teams and one predictive infrastructure team. Integration keeps failing because the infrastructure team delivers in one large release at the end. What is the best structural fix?", "o": ["Move the infrastructure team to sprints", "Introduce integration milestones and interim infrastructure deliveries aligned to the agile teams' release cadence", "Delay the agile teams until infrastructure is ready", "Add an integration team"], "a": 1, "e": "Synchronise cadences at defined integration points; you do not need to change the whole approach. ---"}, {"id": "225", "q": "A project manager inherits a project with a CPI of 1.1 and an SPI of 1.05, but the customer is dissatisfied and the sponsor is considering cancellation. What is the most likely explanation?", "o": ["The earned value data is wrong", "The project is delivering the plan efficiently but the plan is not delivering the value the customer needs", "The customer has unrealistic expectations", "The schedule baseline is out of date"], "a": 1, "e": "On-plan performance with poor satisfaction means the wrong thing is being built. ---"}, {"id": "226", "q": "A key supplier in a politically unstable region is the sole source for a critical component. What is the most appropriate risk response?", "o": ["Accept, since no alternative exists", "Mitigate by qualifying a second source and holding buffer inventory, and escalate residual exposure to governance", "Transfer through insurance", "Avoid by cancelling the component"], "a": 1, "e": "Reduce probability and impact; escalate what remains. ---"}, {"id": "227", "q": "The team wants to adopt a new framework mid-project because a similar team reported success with it. Delivery is currently on track. What should the PM do?", "o": ["Approve to encourage innovation", "Assess the cost, disruption and benefit against the current performance, and consider piloting a specific practice rather than a wholesale change", "Refuse — the project is on track", "Defer to the PMO's standard"], "a": 1, "e": "Evaluate before changing a working system; incremental adoption beats wholesale change mid-flight. ---"}, {"id": "228", "q": "A stakeholder repeatedly approves deliverables without reviewing them, then raises objections weeks later. What should the PM do?", "o": ["Continue obtaining sign-off as evidence", "Address the review process with the stakeholder: agree realistic review windows, a clear acceptance checklist and the consequences of late objections", "Escalate to the sponsor", "Remove them from the approval path"], "a": 1, "e": "Fix the process with the person; sign-off as a trap is not engagement. ---"}, {"id": "229", "q": "During a case review, you find the risk register has 140 entries, most with no owner and no response. What is the first corrective action?", "o": ["Delete the low-priority risks", "Re-run qualitative analysis to prioritise, assign owners to the significant risks, and plan responses for those", "Escalate the risk process failure to the PMO", "Convert the register to a RAID log"], "a": 1, "e": "Prioritise and assign; volume without ownership is noise. ---"}, {"id": "230", "q": "A project manager finds that the schedule shows 100% resource utilisation across all team members for six months. What is the concern?", "o": ["The team is efficient", "There is no capacity for variability, rework or absence; the schedule is fragile and will slip", "Resource levelling is required", "Costs will exceed the baseline"], "a": 1, "e": "Full utilisation removes all slack; queueing theory guarantees delay. ---"}, {"id": "231", "q": "The customer asks the PM to add a feature and offers to fund it directly, bypassing the contract's change process. What should the PM do?", "o": ["Accept the funding and deliver the feature", "Decline the informal arrangement and route the request through the contractual change process", "Deliver it at no cost as goodwill", "Refer the customer to the vendor"], "a": 1, "e": "Contractual and governance integrity; informal side deals create legal and audit exposure. ---"}, {"id": "232", "q": "Midway through a project, the organisation announces a cost-saving initiative requiring a 15% budget reduction across all projects. What should the PM do first?", "o": ["Cut the contingency reserve", "Analyse options — scope reduction, phasing, approach change — with their impact on value and risk, and present trade-offs to the sponsor", "Reduce the team size", "Escalate that the reduction is not feasible"], "a": 1, "e": "Options and trade-offs, not a unilateral cut. ---"}, {"id": "233", "q": "A quality issue is discovered that affects 40 units already shipped to the customer. The defect is cosmetic and the customer has not noticed. What should the PM do?", "o": ["Say nothing unless the customer raises it", "Inform the customer promptly, explain the defect and propose a remedy", "Replace them quietly during the next service visit", "Log it and address it in the final report"], "a": 1, "e": "Proactive disclosure is an ethical obligation and protects the relationship. ---"}, {"id": "234", "q": "A programme manager asks the project manager to reallocate two developers to another project this sprint. The sprint goal would be jeopardised. What should the PM do?", "o": ["Comply — the programme manager outranks the PM", "Explain the impact on the sprint goal and commitments, and negotiate timing, such as the start of the next sprint", "Refuse", "Ask the team to absorb the loss"], "a": 1, "e": "Surface the impact and negotiate; sprint boundaries are natural change points. ---"}, {"id": "235", "q": "After go-live, defect volumes are low but user adoption is 22% of target. What does the project team most likely miss?", "o": ["Quality control", "Organisational change management — training, communication, incentives and support for the behavioural change", "Requirements traceability", "Performance testing"], "a": 1, "e": "Technically correct, behaviourally unadopted. ---"}, {"id": "236", "q": "The PM notices that decisions made in one team's stand-up frequently contradict another team's assumptions. What is the best structural response?", "o": ["Combine the teams", "Establish a cross-team coordination mechanism such as a Scrum of Scrums and a shared decision log", "Route all decisions through the PM", "Increase reporting frequency"], "a": 1, "e": "Coordination plus a shared record of decisions. ---"}, {"id": "237", "q": "During a sprint review, the sponsor says the increment is \"not what I expected\" though it matches the accepted user stories. What is the most likely cause?", "o": ["The team built the wrong thing", "Acceptance criteria and the sponsor's expectations diverged; expectation alignment and earlier involvement were insufficient", "The definition of done is inadequate", "The product owner failed"], "a": 1, "e": "Conformance to criteria does not guarantee expectation alignment; engage earlier and more often. ---"}, {"id": "238", "q": "A team member raises that a proposed design would exclude users with visual impairments, which is not in the requirements but is covered by accessibility legislation in the target market. What should the PM do?", "o": ["Note it as a nice-to-have for a future release", "Treat it as a compliance requirement: assess, raise a change request, and update scope, quality criteria and risk", "Ask the customer whether they want it", "Escalate to legal and wait"], "a": 1, "e": "Legislated accessibility is compliance, not an optional feature. ---"}, {"id": "239", "q": "A vendor proposes using a generative AI tool to produce the project's technical documentation at a lower price. What should the PM establish before agreeing?", "o": ["Nothing — it is the vendor's method", "IP ownership, confidentiality of input data, accuracy verification, and whether contractual and regulatory requirements permit it", "That the tool is the market leader", "The cost saving only"], "a": 1, "e": "Method changes with IP, confidentiality and compliance implications need explicit agreement. ---"}, {"id": "240", "q": "A project's benefits will only be realised if a partner organisation changes its process, which is outside the project's control. What should the PM do?", "o": ["Exclude the benefit from the business case", "Document the dependency and the assumption, engage the partner, and escalate the risk to benefits realisation to the sponsor and benefits owner", "Expand the project scope to include the partner", "Treat it as an issue"], "a": 1, "e": "External dependency on benefits is a governance-level risk. ---"}, {"id": "241", "q": "The PM discovers the previous project manager committed to a delivery date with the customer that was never reflected in the schedule baseline. What should the PM do?", "o": ["Deliver to the baseline", "Clarify the commitment with the customer and sponsor, assess feasibility against the baseline, and resolve the discrepancy formally", "Update the baseline to match the commitment", "Escalate the previous PM's conduct"], "a": 1, "e": "Surface and reconcile the discrepancy with both parties. ---"}, {"id": "242", "q": "A project is running on a critical chain schedule. The project buffer has been 60% consumed at 40% completion. What does this indicate?", "o": ["The project is ahead", "Buffer consumption is outpacing progress; investigate causes and act before the buffer is exhausted", "The buffer was too small", "The critical chain should be recalculated"], "a": 1, "e": "Buffer burn versus progress is the critical chain control signal. ---"}, {"id": "243", "q": "The team proposes reducing test coverage to recover two weeks. The product is a medical device. What should the PM do?", "o": ["Approve with the sponsor's agreement", "Refuse; regulated safety-critical testing is not a schedule lever. Present alternative recovery options and escalate the schedule problem", "Reduce coverage only on low-risk modules", "Ask the regulator for a waiver"], "a": 1, "e": "Safety and regulatory requirements are not tradeable. ---"}, {"id": "244", "q": "A newly identified stakeholder has high power, high interest and is hostile to the project's objectives. What is the first action?", "o": ["Escalate to the sponsor for a mandate", "Meet them to understand their objections and interests, and determine whether the project can address them", "Minimise their exposure to project information", "Classify them as a risk and monitor"], "a": 1, "e": "Understand the position before deciding on strategy. ---"}, {"id": "245", "q": "Mid-project, the team discovers a far simpler technical solution that would reduce cost by 30% but requires abandoning six weeks of completed work. What should the PM do?", "o": ["Continue — the work is already paid for", "Evaluate the option on remaining cost and benefit, ignoring sunk cost, and raise a change request if favourable", "Split the difference and use both approaches", "Defer to the next release"], "a": 1, "e": "Sunk cost is irrelevant; evaluate forward. ---"}, {"id": "246", "q": "A functional manager consistently assigns the project's least experienced staff. Quality is suffering. What should the PM do first?", "o": ["Escalate to the sponsor", "Meet the functional manager with evidence of the quality impact and negotiate a staffing approach, including mentoring or partial senior involvement", "Request contractors", "Lower the quality standard"], "a": 1, "e": "Evidence-based negotiation with the person who controls the resource. ---"}, {"id": "247", "q": "A distributed team's retrospectives have become silent, with only the two most senior members speaking. What should the facilitator change?", "o": ["Cancel retrospectives", "Use anonymous input collection and structured round-robin formats to surface all voices before discussion", "Reduce attendance to the senior members", "Extend the meeting"], "a": 1, "e": "Change the format to counter dominance and asymmetry. ---"}, {"id": "248", "q": "Six months after closure, the benefits owner reports that the expected savings cannot be measured because the baseline data was never captured. Whose failure is this?", "o": ["The benefits owner's", "The project's — verifying that a measurement system is in place is an explicit project responsibility before closure", "The finance team's", "Nobody's; benefits are outside project control"], "a": 1, "e": "\"Verify a measurement system is in place\" is an ECO enabler. ---"}, {"id": "249", "q": "A team is asked to estimate a project in a domain none of them has worked in. What is the best approach?", "o": ["Use analogous estimates from a different domain", "Run spikes or a discovery phase to reduce uncertainty, present a wide range with explicit assumptions, and refine progressively", "Add a 100% contingency", "Decline to estimate"], "a": 1, "e": "Reduce uncertainty, then estimate with honest ranges. ---"}, {"id": "250", "q": "The sponsor asks the PM to add a scope item and says the budget will \"come from somewhere\". What should the PM do?", "o": ["Add it and manage within the existing budget", "Raise a change request with a costed impact assessment and require the funding source to be identified before approval", "Refuse until funding is confirmed", "Fund it from the management reserve"], "a": 1, "e": "Formalise the change and the funding together. --- ## 15.2 Process and predictive (20)"}], "domain": "mixed"}, {"id": "b_adv_proc", "title": "Advanced process", "group": "advanced", "qs": [{"id": "251", "q": "A schedule network has these paths: A-B-D-F = 24; A-C-D-F = 27; A-C-E-F = 25. The team crashes C by 4 days. What is the new project duration?", "o": ["23", "24", "25", "27"], "a": 1, "e": "A-C-D-F becomes 23 and A-C-E-F becomes 21, but A-B-D-F remains 24, which is now the critical path. ---"}, {"id": "252", "q": "Which statement about the performance measurement baseline is correct?", "o": ["It includes the management reserve", "It combines the scope, schedule and cost baselines", "It is created at closure", "It is the same as the project management plan"], "a": 1, "e": "The three baselines together. ---"}, {"id": "253", "q": "A work package has a budget of $40,000 and is 50% complete. Actual cost is $26,000. What is the CPI for that package?", "o": ["0.65", "0.77", "1.30", "1.54"], "a": 1, "e": "EV = $20,000; CPI = 20,000 ÷ 26,000 = 0.77. ---"}, {"id": "254", "q": "Which technique should be used to decide whether to develop a capability internally or purchase it?", "o": ["Alternatives analysis", "Make-or-buy analysis", "Cost of quality", "Reserve analysis"], "a": 1, "e": "Make-or-buy. ---"}, {"id": "255", "q": "A contract has a ceiling price. Which contract types can include one?", "o": ["CPFF only", "FPIF and cost-reimbursable with a not-to-exceed clause", "T&M only", "FFP only"], "a": 1, "e": "Ceilings cap buyer exposure in incentive and reimbursable arrangements. ---"}, {"id": "256", "q": "Which is true of the WBS?", "o": ["It lists activities in sequence", "It is deliverable-oriented and contains 100% of the project scope", "It shows resource assignments", "It replaces the schedule"], "a": 1, "e": "Deliverable-oriented and complete. ---"}, {"id": "257", "q": "During control quality, the team finds a deliverable does not meet a requirement. What should happen?", "o": ["Escalate to the customer", "Raise a defect repair, correct the deliverable, and re-verify before validate scope", "Proceed to validate scope and let the customer decide", "Raise a change request to modify the requirement"], "a": 1, "e": "Correct internally, then seek acceptance. ---"}, {"id": "258", "q": "Which estimating approach is most appropriate for a repetitive activity with strong historical data?", "o": ["Analogous", "Parametric", "Expert judgement", "Three-point"], "a": 1, "e": "Statistical relationship with reliable data. ---"}, {"id": "259", "q": "A project's cost baseline is $900,000 and the management reserve is $90,000. What is the project budget?", "o": ["$810,000", "$900,000", "$990,000", "Insufficient information"], "a": 2, "e": "Cost baseline plus management reserve. ---"}, {"id": "260", "q": "When should quality audits be conducted?", "o": ["Only at closure", "At planned intervals throughout the project, and at random if required", "Only after a defect is found", "Only on regulated projects"], "a": 1, "e": "Planned and periodic. ---"}, {"id": "261", "q": "Which of the following creates a secondary risk?", "o": ["Accepting a risk with a contingency reserve", "Outsourcing a task to a specialist vendor, introducing vendor dependency risk", "Avoiding a risk by removing the feature", "Monitoring a low-priority risk"], "a": 1, "e": "The response itself creates new exposure. ---"}, {"id": "262", "q": "The critical path has zero float but the project has a mandated end date 5 days earlier than the calculated finish. What is the float on the critical path?", "o": ["0 days", "+5 days", "−5 days", "Undefined"], "a": 2, "e": "Negative float indicates the schedule cannot meet the imposed date. ---"}, {"id": "263", "q": "Which action is appropriate when total float on the critical path is negative?", "o": ["Accept and monitor", "Apply compression techniques or negotiate the constraint, then present options to the sponsor", "Re-baseline the schedule", "Level resources"], "a": 1, "e": "Compress or renegotiate; do not silently re-baseline. ---"}, {"id": "264", "q": "What is the purpose of the procurement statement of work?", "o": ["To define the project's overall scope", "To describe the procurement item in sufficient detail for sellers to determine whether they can supply it and at what price", "To list the evaluation criteria", "To record the contract terms"], "a": 1, "e": "The SOW scopes what is being bought. ---"}, {"id": "265", "q": "A project uses a T&M contract with no cap. What is the buyer's main exposure?", "o": ["Poor quality", "Unlimited cost growth and weak incentive for the seller to be efficient", "Delayed delivery", "IP ownership"], "a": 1, "e": "Uncapped T&M puts all cost risk on the buyer. ---"}, {"id": "266", "q": "Which is the correct use of a checklist in quality management?", "o": ["To record defect causes", "To ensure a set of required steps or characteristics is systematically verified", "To show frequency distribution", "To measure process stability"], "a": 1, "e": "Systematic verification. ---"}, {"id": "267", "q": "Which is the best response when actual costs are consistently under budget but deliverables are late?", "o": ["Celebrate the cost performance", "Investigate whether planned work is simply not being performed — favourable CPI with poor SPI often means work has not started", "Reduce the budget", "Reallocate funds to other projects"], "a": 1, "e": "Under-spend plus schedule slip usually means unperformed work, not efficiency. ---"}, {"id": "268", "q": "What should happen to the risk register when a risk is escalated?", "o": ["It remains open and monitored by the project", "Ownership transfers to the appropriate level and the risk is closed on the project register, with the escalation recorded", "It is deleted", "It becomes an issue"], "a": 1, "e": "Escalated risks leave the project register once accepted at the higher level. ---"}, {"id": "269", "q": "A team wants to reduce the WBS decomposition effort on a short, low-risk project. What principle applies?", "o": ["Progressive elaboration", "Tailoring", "The 100% rule", "Rolling wave planning"], "a": 1, "e": "Adapt the depth of process to the context. ---"}, {"id": "270", "q": "Which best describes configuration management's role?", "o": ["Approving changes to baselines", "Controlling the identification, versioning, status and verification of the product's characteristics", "Recording lessons learned", "Managing procurement documents"], "a": 1, "e": "Product versions and characteristics. --- ## 15.3 Agile and hybrid (15)"}], "domain": "process"}, {"id": "b_adv_agile", "title": "Advanced agile & hybrid", "group": "advanced", "qs": [{"id": "271", "q": "A team's definition of done requires security scanning, but the security team has a three-week queue. What should the Scrum Master do?", "o": ["Remove security scanning from the DoD", "Treat the queue as an impediment: work with the security function to establish capacity, automation or an embedded reviewer", "Complete sprints without scanning and scan later", "Extend sprints to three weeks"], "a": 1, "e": "Fix the constraint, do not weaken the quality gate. ---"}, {"id": "272", "q": "In SAFe, what is the purpose of PI planning?", "o": ["To estimate the backlog", "To align multiple teams on objectives, dependencies and risks for the coming program increment", "To conduct retrospectives", "To assign work to individuals"], "a": 1, "e": "Cross-team alignment event. ---"}, {"id": "273", "q": "A Kanban team has a WIP limit of 5 in development but consistently has 9 items there. What should happen?", "o": ["Raise the limit to 9", "Stop starting new work, resolve why the limit is being breached, and restore the discipline", "Remove WIP limits", "Add developers"], "a": 1, "e": "Breaching the limit defeats the mechanism; understand the cause. ---"}, {"id": "274", "q": "Which best describes an increment in Scrum?", "o": ["Everything completed in a sprint, regardless of the definition of done", "A usable step toward the product goal that meets the definition of done, additive to prior increments", "The sprint backlog", "The release"], "a": 1, "e": "Usable, DoD-compliant, cumulative. ---"}, {"id": "275", "q": "What should the product owner do when stakeholders disagree about priority?", "o": ["Escalate to the sponsor", "Make the final ordering decision after considering stakeholder input and value", "Let the team decide", "Deliver all items equally"], "a": 1, "e": "The PO is a single accountable decision-maker. ---"}, {"id": "276", "q": "A hybrid project's agile teams report in story points and the finance function reports in earned value. What is the best reconciliation?", "o": ["Convert story points to hours and then to cost", "Use completed, accepted increments as earned value, with the cost baseline mapped to releases rather than individual stories", "Abandon earned value", "Report both separately with no reconciliation"], "a": 1, "e": "Earn value on accepted increments at release granularity. ---"}, {"id": "277", "q": "Which is a valid reason to shorten iteration length?", "o": ["To increase velocity", "To increase feedback frequency in a high-uncertainty environment", "To reduce meeting overhead", "To fit more stories per iteration"], "a": 1, "e": "Shorter iterations buy faster feedback. ---"}, {"id": "278", "q": "A team has no product owner and the PM is making all priority decisions. What is the risk?", "o": ["The team will be less productive", "Priorities will not reflect real business value and stakeholder input, and accountability for value is unclear", "Velocity will fall", "Retrospectives will be less effective"], "a": 1, "e": "Value accountability is missing. ---"}, {"id": "279", "q": "What is the best measure of agile team progress?", "o": ["Hours logged", "Working, accepted product increments delivered", "Story points estimated", "Tasks moved on the board"], "a": 1, "e": "Working product is the primary measure of progress. ---"}, {"id": "280", "q": "In a hybrid project, when should a formal change request be raised for backlog changes?", "o": ["Every time an item is added", "When the change affects committed release scope, budget, contractual obligations or the agreed date", "Never", "Only for removals"], "a": 1, "e": "Boundary-level governance. ---"}, {"id": "281", "q": "An agile team's stakeholders never attend sprint reviews. What is the consequence and the best response?", "o": ["No consequence; publish the increment instead", "Feedback loops break down, increasing the risk of building the wrong thing — investigate barriers and redesign the review to suit stakeholders", "Cancel sprint reviews", "Make attendance mandatory"], "a": 1, "e": "Find why and adapt; the feedback matters more than the ritual. ---"}, {"id": "282", "q": "Which technique is best for slicing a large epic into deliverable increments?", "o": ["Planning poker", "Story mapping with release slices", "Velocity tracking", "WIP limits"], "a": 1, "e": "Story maps reveal journey-based slices. ---"}, {"id": "283", "q": "A team's retrospective identifies that the organisation's approval process adds four days to every release. This is outside the team's control. What should happen?", "o": ["Accept it", "Escalate it as an organisational impediment with data on the cost of delay, seeking a governance change", "Reduce release frequency", "Bypass the approval"], "a": 1, "e": "Escalate organisational impediments with evidence. ---"}, {"id": "284", "q": "What distinguishes iterative from incremental delivery?", "o": ["They are identical", "Iterative refines the same deliverable through cycles; incremental adds usable pieces", "Iterative is agile; incremental is predictive", "Incremental requires a fixed timebox"], "a": 1, "e": "Refinement versus addition. ---"}, {"id": "285", "q": "A team is asked to guarantee a fixed scope on a fixed date with a fixed team. What should the PM propose?", "o": ["Accept and add contingency", "Explain that all three cannot be fixed; propose fixing two and varying the third, with incremental delivery and defined checkpoints", "Refuse the project", "Increase the team size"], "a": 1, "e": "Surface the constraint trade-off. --- ## 15.4 Governance, compliance and ethics (20)"}], "domain": "process"}, {"id": "b_adv_gov", "title": "Governance, compliance, ethics", "group": "advanced", "qs": [{"id": "286", "q": "A project manager is also a minority shareholder in a company bidding for project work. What must they do?", "o": ["Nothing, as the holding is small", "Disclose the interest immediately and recuse themselves from the evaluation and award decision", "Disclose it after the award", "Sell the shares"], "a": 1, "e": "Disclose and recuse; the size of the interest is not the test. ---"}, {"id": "287", "q": "Which of the following best defines a governance threshold?", "o": ["The project's risk appetite", "A pre-agreed measurable trigger that requires escalation or a specific decision", "The change control board's authority level", "The contingency reserve"], "a": 1, "e": "Objective, pre-agreed trigger. ---"}, {"id": "288", "q": "An internal audit finds that project status reports have consistently understated risk exposure. What is the most serious consequence?", "o": ["Additional audit scrutiny", "Governance decisions were made on inaccurate information, undermining the decision-making system itself", "The PM's performance rating", "Delayed benefits realisation"], "a": 1, "e": "Governance depends on information integrity. ---"}, {"id": "289", "q": "Who owns organisational process assets such as change control procedures?", "o": ["The project manager", "The organisation, typically administered by the PMO; projects use them and update knowledge repositories", "The sponsor", "The CCB"], "a": 1, "e": "Projects use processes and update knowledge bases. ---"}, {"id": "290", "q": "A regulation requires seven-year retention of design evidence. The project's document system is decommissioned at closure. What should the PM do?", "o": ["Print and store the documents personally", "Ensure the retention requirement is included in the transition plan and that evidence is migrated to a compliant repository with an owner", "Extend the project", "Note it as a risk and close"], "a": 1, "e": "Compliance obligations must survive closure via transition. ---"}, {"id": "291", "q": "A project manager suspects a colleague has misrepresented their certification status. What should they do?", "o": ["Ignore it", "Report the concern through the organisation's or PMI's defined channel", "Confront them publicly", "Inform the client"], "a": 1, "e": "Mandatory reporting of ethics violations through proper channels. ---"}, {"id": "292", "q": "Which best describes the difference between risk appetite and risk threshold?", "o": ["They are the same", "Appetite is the general willingness to accept uncertainty; threshold is the measurable level at which action is required", "Appetite is quantitative; threshold is qualitative", "Appetite applies to projects; threshold applies to portfolios"], "a": 1, "e": "General disposition versus measurable trigger. ---"}, {"id": "293", "q": "A country where the project operates permits a practice prohibited by the organisation's code of conduct. What governs?", "o": ["Local law", "The stricter of the two — the organisatio
