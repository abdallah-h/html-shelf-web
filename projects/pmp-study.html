<li><strong>Survey<\/strong> changes continually — assign someone; make it a standing agenda item<\/li>\n<li><strong>Assess the impact on scope/backlog<\/strong> and on the business case<\/li>\n<li><strong>Prioritise<\/strong> — reorder the backlog, raise change requests, revise the risk register<\/li>\n<li><strong>Escalate<\/strong> to the sponsor when the business case itself is threatened<\/li>\n<li><strong>Continually review<\/strong> — this is not a one-off at initiation<\/li>\n<\/ol>\n<h3>Typical scenarios<\/h3>\n<ul>\n<li>A new regulation is announced mid-project → assess compliance impact, raise a change request, update the risk register, inform governance<\/li>\n<li>A competitor launches first → re-examine the business case with the sponsor; the value may have changed; reprioritise the backlog to differentiate<\/li>\n<li>A currency movement blows the vendor budget → finance task: quantify, check contract terms (FPEPA?), consult governance, consider reserves<\/li>\n<li>A key supplier is sanctioned or fails → procurement and risk: activate the fallback, assess schedule impact, escalate<\/li>\n<li>The organisation restructures mid-project → stakeholder re-identification, governance re-confirmation, sponsor continuity check<\/li>\n<\/ul>\n<hr />", "subs": [{"t": "4.1 Governance", "a": "s4-h1"}, {"t": "4.2 Compliance", "a": "s4-h2"}, {"t": "4.3 Managing and controlling changes", "a": "s4-h3"}, {"t": "4.4 Impediments, issues and problems", "a": "s4-h4"}, {"t": "4.5 Risk", "a": "s4-h5"}, {"t": "4.6 Continuous improvement", "a": "s4-h6"}, {"t": "4.7 Supporting organisational change", "a": "s4-h7"}, {"t": "4.8 Evaluating the external business environment", "a": "s4-h8"}], "text": " this domain tripled in weight. most experienced pms under-study it and lose the exam here. eco tasks: governance · compliance · change control · impediments and issues · risk · continuous improvement · organisational change · external environment. 4.1 governance project governance is the framework of authority, decision rights, accountability, rules, procedures, reporting and ethics within which the project operates. it answers: who decides what, on what evidence, and who is accountable for the outcome? establishing governance using opas, define: - structure — sponsor, steering committee, ccb, pmo relationship, escalation hierarchy - rules and procedures — what needs approval, by whom, in what form - reporting — cadence, format, audience, thresholds - ethics — code of conduct, conflict-of-interest handling, whistleblowing route - policies — procurement, security, data, safety, sustainability - decision rights — which decisions the pm can make alone, which need the sponsor, which need the committee - success metrics — defined up front and agreed, covering delivery and value escalation paths and thresholds a threshold is a pre-agreed measurable trigger for escalation. examples: cost variance beyond 10%, schedule slip beyond 5 days on the critical path, any safety incident, any risk with emv above $50k, any change above $25k. good governance defines the threshold before the situation arises. on the exam: if a scenario describes a pm deciding ad hoc whether something warrants escalation, the underlying failure is that no threshold was defined. governance levels organisational governance (enterprise-wide: strategy, portfolio, compliance, risk appetite) → portfolio governance → programme governance → project governance . each constrains the one below. steering committee vs ccb vs pmo steering committee — strategic oversight across the project's life; funding, priority, scope direction, sponsor support ccb — authorises or rejects specific change requests against baselines pmo — organisational function providing standards, support or direction (below) types of pmo type degree of control what it does supportive low templates, best practices, training, lessons learned, coaching. a repository and consultancy. controlling moderate requires compliance with frameworks, methodologies, templates, governance forms. audits. directive high takes control of projects; project managers report to the pmo. also: agile/value delivery office (vdo) — coaching, removing organisational impediments, enabling flow rather than enforcing process. enterprise pmo (epmo) — reports to the c-suite, links strategy to portfolio. the pmo's value proposition includes standardisation, resource optimisation, cross-project visibility, capability building and strategic alignment. a customer-centric pmo focuses on what project teams need rather than what the pmo wants to enforce. defining success metrics modern pmi success metrics cover four layers: 1. delivery: scope, schedule, cost, quality 2. adoption: usage, transition success, training completion 3. value/benefit: revenue, cost saving, satisfaction, strategic contribution 4. sustainability/impact: environmental, social, governance outcomes agree them with the sponsor and stakeholders before execution, define who measures them and when, and note that most value metrics are measured after the project closes — hence the handover of benefits tracking. 4.2 compliance compliance = conforming to rules — laws, regulations, standards, contractual terms and internal policy. the compliance process (matching the eco enablers) confirm requirements — regulatory, legal, contractual, security, health and safety, environmental/sustainability, data privacy, industry standard, internal policy. source them from the regulator, legal counsel, the contract and the pmo — not from memory. classify categories — group them so you can assign owners and evidence requirements. determine potential threats to compliance — where could we fail? supplier practices, undocumented work, schedule pressure, data handling, subcontractor labour standards. use methods to support compliance — build requirements into the wbs and acceptance criteria, design controls into the process, train the team, audit, use checklists, maintain an evidence trail. analyse consequences of non-compliance — fines, licence loss, injunction, contract termination, criminal liability, reputational damage, project cancellation, harm to people. determine the approach and actions — prevention, detection, correction. assign owners and dates. measure the extent of compliance — audits, inspections, compliance dashboards, third-party certification. exam rules compliance is never traded off against cost or schedule. any option that says \"proceed and address the regulation later\" is wrong. safety concerns stop work. immediately. if you discover non-compliance, report it through the defined channel. do not conceal it, and do not quietly fix it without informing governance. compliance requirements become scope , quality criteria , risks and costs — they must appear in the plan, not as an afterthought. regulatory change during a project is an external environment trigger: assess impact, raise a change request, escalate. 4.3 managing and controlling changes the integrated change control process request — anyone can raise one; capture it formally in the change log log — every request, approved or not assess impact — across all constraints: scope, schedule, cost, quality, resources, risk, benefits, compliance, stakeholders. this is the step candidates skip. decide — pm within delegated authority, otherwise the ccb communicate the decision and its status — to the requester and affected stakeholders implement approved changes update baselines, plans and documents; adjust the rtm; re-baseline only when authorised change control in each approach predictive — formal, baseline-protecting, ccb-driven. adaptive — changes to backlog content and order are normal and require no change request; the product owner decides. what does need governance: changing the release date, the budget, the team, or a contractual commitment. hybrid — agile inside the boundary, formal change control at the boundary. define clearly where the boundary sits — that definition ous improvement lessons learned register maintained continuously; repository updated at closure retrospectives — regular, blameless, action-producing. a retrospective that produces no changed behaviour is theatre. kaizen — small continuous improvements. kaizen events / blitzes for focused improvement. pdca / deming cycle — plan, do, check, act process analysis and value stream mapping — find waste and delays the seven wastes (lean/timwood): transport, inventory, motion, waiting, overproduction, overprocessing, defects (plus unused talent) update opas — improvements must feed back into templates, checklists and standards or they die with the project retrospective formats: start/stop/continue, 4ls (liked, learned, lacked, longed for), sailboat, timeline, mad/sad/glad improvement is a task in the business environment domain now, meaning the exam frames it as organisational learning, not just team hygiene 4.7 supporting organisational change delivering an output is not success; adoption is. assessing organisational culture consider: tolerance for risk and failure, decision-making style (consensus vs hierarchical), attitude to change, degree of formality, communication norms, reward systems, history of previous change efforts. culture determines what approach can actually work. change models adkar — awareness of the need, desire to support, knowledge of how, ability to implement, reinforcement to sustain. diagnostic: find which letter the individual is stuck on and act there. kotter's 8 steps — create urgency; build a guiding coalition; form a vision; communicate the vision; empower action and remove obstacles; generate short-term wins; consolidate gains; anchor in the culture. virginia satir change model — late status quo → foreign element → chaos → transforming idea → practice and integration → new status quo. explains why performance drops after a change is introduced; leaders must expect and support the chaos phase. bridges' transition model — ending/losing/letting go → neutral zone → new beginning. change is external; transition is psychological. lewin — unfreeze, change, refreeze. practical change management on a project identify who must behave differently and how build a change impact assessment per affected group communicate early, repeatedly and through trusted voices recruit change champions in the affected groups provide training and post-go-live support (hypercare) measure adoption, not just deployment plan the transition to operations: support model, documentation, runbooks, service levels 4.8 evaluating the external business environment this eco task is new in emphasis and reliably tested. scanning pestle — political, economic, social, technological, legal, environmental swot — internal strengths and weaknesses, external opportunities and threats porter's five forces , competitor analysis, market research regulatory monitoring and horizon scanning supply-chain and geopolitical monitoring technology watch — including ai capability shifts that could make your solution obsolete responding survey changes continually — assign someone; make it a standing agenda item assess the impact on scope/backlog and on the business case prioritise — reorder the backlog, raise change requests, revise the risk register escalate to the sponsor when the business case itself is threatened continually review — this is not a one-off at initiation typical scenarios a new regulation is announced mid-project → assess compliance impact, raise a change request, update the risk register, inform governance a competitor launches first → re-examine the business case with the sponsor; the value may have changed; reprioritise the backlog to differentiate a currency movement blows the vendor budget → finance task: quantify, check contract terms (fpepa?), consult governance, consider reserves a key supplier is sanctioned or fails → procurement and risk: activate the fallback, assess schedule impact, escalate the organisation restructures mid-project → stakeholder re-identification, governance re-confirmation, sponsor continuity check "}, {"id": "s5", "title": "Part 5 — Agile and hybrid in depth", "html": "<p><em>Roughly 60% of exam items involve adaptive or hybrid approaches. This part is not optional even for predictive practitioners.<\/em><\/p>\n<h2 id=\"s5-h1\">5.1 The Agile Manifesto<\/h2>\n<p><strong>Four values<\/strong> — we value the items on the left <em>more<\/em>, not exclusively:\n1. <strong>Individuals and interactions<\/strong> over processes and tools\n2. <strong>Working software (product)<\/strong> over comprehensive documentation\n3. <strong>Customer collaboration<\/strong> over contract negotiation\n4. <strong>Responding to change<\/strong> over following a plan<\/p>\n<p><strong>Twelve principles<\/strong> — key ones for the exam:\n- Highest priority: satisfy the customer through early and continuous delivery of valuable product\n- Welcome changing requirements, even late\n- Deliver frequently, preferring shorter timescales\n- Business people and developers work together daily\n- Build projects around motivated individuals; give them the environment and support, and trust them\n- Face-to-face conversation is the most efficient method\n- Working product is the primary measure of progress\n- <strong>Sustainable pace<\/strong> indefinitely\n- Continuous attention to technical excellence and good design\n- <strong>Simplicity<\/strong> — maximising the work not done\n- The best architectures, requirements and designs emerge from <strong>self-organising<\/strong> teams\n- At regular intervals the team <strong>reflects and adjusts<\/strong><\/p>\n<h2 id=\"s5-h2\">5.2 Scrum<\/h2>\n<h3>Accountabilities<\/h3>\n<ul>\n<li><strong>Product Owner<\/strong> — maximises product value; owns and orders the Product Backlog; single person, not a committee; available to the team; makes the final call on what is built.<\/li>\n<li><strong>Scrum Master<\/strong> — serves the team, the PO and the organisation; coaches self-management; removes impediments; ensures events happen and are productive; is <strong>not<\/strong> a task assigner or status collector.<\/li>\n<li><strong>Developers<\/strong> — cross-functional, self-managing, collectively accountable for creating the Increment; decide <em>how<\/em> the work is done and how much to take on.<\/li>\n<\/ul>\n<p>Team size: typically 10 or fewer.<\/p>\n<h3>Events<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Event<\/th>\n<th>Timebox (1-month sprint)<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>The Sprint<\/strong><\/td>\n<td>≤1 month, fixed<\/td>\n<td>Container for all other events; produces a usable increment<\/td>\n<\/tr>\n<tr>\n<td><strong>Sprint Planning<\/strong><\/td>\n<td>≤8 hrs<\/td>\n<td>Why (Sprint Goal), what (selected backlog items), how (plan)<\/td>\n<\/tr>\n<tr>\n<td><strong>Daily Scrum<\/strong><\/td>\n<td>15 min<\/td>\n<td>Developers inspect progress toward the Sprint Goal and adapt the plan. Not a status report to the SM or PM.<\/td>\n<\/tr>\n<tr>\n<td><strong>Sprint Review<\/strong><\/td>\n<td>≤4 hrs<\/td>\n<td>Inspect the increment with stakeholders; adapt the backlog. Working product, not slides.<\/td>\n<\/tr>\n<tr>\n<td><strong>Sprint Retrospective<\/strong><\/td>\n<td>≤3 hrs<\/td>\n<td>Inspect people, interactions, process, tools; commit to improvements<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Backlog refinement<\/strong> is an ongoing activity, not a formal event.<\/p>\n<h3>Artifacts and commitments<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Artifact<\/th>\n<th>Commitment<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Product Backlog<\/td>\n<td><strong>Product Goal<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sprint Backlog<\/td>\n<td><strong>Sprint Goal<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Increment<\/td>\n<td><strong>Definition of Done<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Rules that appear as exam answers<\/h3>\n<ul>\n<li>A sprint is <strong>never extended<\/strong>. If work is unfinished, it returns to the backlog.<\/li>\n<li>Only the <strong>Product Owner<\/strong> can cancel a sprint, and only if the Sprint Goal becomes obsolete.<\/li>\n<li>Scope within a sprint may be <strong>renegotiated<\/strong> with the PO as more is learned; the Sprint Goal stays.<\/li>\n<li>Nobody assigns tasks to developers — they pull work.<\/li>\n<li>Stakeholders who bypass the PO to ask a developer for a feature are redirected to the PO.<\/li>\n<li>The team's capacity commitment is the team's to make.<\/li>\n<\/ul>\n<h2 id=\"s5-h3\">5.3 Kanban<\/h2>\n<p><strong>Six practices:<\/strong> visualise the workflow · limit work in progress · manage flow · make policies explicit · implement feedback loops · improve collaboratively and evolve experimentally.<\/p>\n<p><strong>Core concepts:<\/strong>\n- <strong>Pull system<\/strong> — work is pulled when capacity frees, not pushed\n- <strong>WIP limits<\/strong> — the central mechanism; they surface bottlenecks and reduce cycle time\n- <strong>Little's Law<\/strong> — Cycle time = WIP ÷ Throughput. Halve WIP and you roughly halve cycle time.\n- <strong>Cumulative flow diagram (CFD)<\/strong> — bands widening indicate a bottleneck; the vertical gap is WIP, the horizontal gap is cycle time\n- <strong>Classes of service<\/strong> — expedite, fixed date, standard, intangible\n- <strong>Lead time<\/strong> (customer request → delivery) vs <strong>cycle time<\/strong> (work started → done)\n- No prescribed roles, no timeboxes, continuous flow; good for support, operations and variable-priority work<\/p>\n<h2 id=\"s5-h4\">5.4 Extreme Programming (XP)<\/h2>\n<p>Practices worth knowing: <strong>pair programming<\/strong>, <strong>test-driven development (TDD)<\/strong>, <strong>continuous integration<\/strong>, <strong>refactoring<\/strong>, <strong>simple design<\/strong>, <strong>collective code ownership<\/strong>, <strong>coding standards<\/strong>, <strong>small releases<\/strong>, <strong>sustainable pace (40-hour week)<\/strong>, <strong>on-site customer<\/strong>, <strong>metaphor<\/strong>, <strong>planning game<\/strong>.<\/p>\n<p>XP values: simplicity, communication, feedback, courage, respect.<\/p>\n<h2 id=\"s5-h5\">5.5 Lean<\/h2>\n<p>Principles: identify value · map the value stream · create flow · establish pull · pursue perfection.\nThe <strong>seven wastes<\/strong>: transport, inventory, motion, waiting, overproduction, overprocessing, defects (plus unused human potential).\nKey ideas: small batch sizes, reduce queue length, limit WIP, optimise the whole not the part, decide as late as responsibly possible, build quality in.<\/p>\n<h2 id=\"s5-h6\">5.6 Estimation in agile<\/h2>\n<ul>\n<li><strong>Story points<\/strong> — relative size combining complexity, effort and uncertainty. Not hours. Not comparable between teams.<\/li>\n<li><strong>Planning poker<\/strong> — Fibonacci-ish scale (1,2,3,5,8,13,20,40,100); simultaneous reveal prevents anchoring; discuss outliers; re-vote.<\/li>\n<li><strong>Affinity estimation<\/strong> — rapidly group many items by relative size.<\/li>\n<li><strong>T-shirt sizing<\/strong> — XS to XL for coarse, early sizing.<\/li>\n<li><strong>Ideal days<\/strong> — effort with no interruptions.<\/li>\n<li><strong>Velocity<\/strong> — points completed per iteration; use a rolling average of 3–5 iterations; use only for that team's forecasting.<\/li>\n<li><strong>Spike<\/strong> — a timeboxed research task to reduce uncertainty before estimating.<\/li>\n<li><strong>Wideband Delphi<\/strong> — anonymous, iterative expert estimation.<\/li>\n<\/ul>\n<p>Never convert points to hours. Never compare teams by velocity. Never set velocity as a target — it becomes a lie.<\/p>\n<h2 id=\"s5-h7\">5.7 Prioritisation techniques<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Technique<\/th>\n<th>How it works<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MoSCoW<\/strong><\/td>\n<td>Must have, Should have, Could have, Won't have (this time)<\/td>\n<\/tr>\n<tr>\n<td><strong>Kano model<\/strong><\/td>\n<td>Basic/threshold (dissatisfiers if missing), performance (linear), delighters (excitement). Delighters decay into basics over time.<\/td>\n<\/tr>\n<tr>\n<td><strong>WSJF<\/strong><\/td>\n<td>Cost of delay ÷ job size. Highest first. Used in SAFe.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost of delay<\/strong><\/td>\n<td>Economic loss per time unit of not having the feature<\/td>\n<\/tr>\n<tr>\n<td><strong>100-point / dot voting<\/strong><\/td>\n<td>Stakeholders distribute a fixed budget of points<\/td>\n<\/tr>\n<tr>\n<td><strong>Paired comparison<\/strong><\/td>\n<td>Compare items two at a time<\/td>\n<\/tr>\n<tr>\n<td><strong>Value/effort matrix<\/strong><\/td>\n<td>Quick wins first (high value, low effort)<\/td>\n<\/tr>\n<tr>\n<td><strong>Pareto<\/strong><\/td>\n<td>The 20% delivering 80% of the value<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s5-h8\">5.8 Agile metrics and radiators<\/h2>\n<ul>\n<li><strong>Velocity chart<\/strong>, <strong>sprint burndown<\/strong> (work remaining in the sprint), <strong>release burndown/burnup<\/strong> (burnup separates scope change from progress — preferred when scope moves)<\/li>\n<li><strong>Cumulative flow diagram<\/strong>, <strong>cycle time / lead time scatterplot<\/strong>, <strong>throughput<\/strong><\/li>\n<li><strong>Escaped defects<\/strong>, <strong>defect density<\/strong>, <strong>test coverage<\/strong>, <strong>build failure rate<\/strong><\/li>\n<li><strong>Earned value in agile:<\/strong> SPI ≈ actual velocity ÷ planned velocity; CPI still applies<\/li>\n<li><strong>Team mood / happiness charts<\/strong>, <strong>Net Promoter Score<\/strong><\/li>\n<li><strong>Information radiators<\/strong> must be big, visible, current and self-updating. A dashboard only the PM sees is not a radiator.<\/li>\n<\/ul>\n<h2 id=\"s5-h9\">5.9 Servant leadership in practice<\/h2>\n<p>What the servant leader does: removes impediments · shields the team from disruption · provides resources and environment · facilitates rather than directs · coaches and grows people · encourages self-organisation · asks questions instead of giving answers · celebrates the team's success.<\/p>\n<p>What they do not do: assign tasks · measure individuals against each other · commit the team's capacity on the team's behalf · take credit · decide technical approach unilaterally.<\/p>\n<p><strong>Coaching vs mentoring vs facilitating vs directing<\/strong> — know the distinction. Coaching draws the answer out; mentoring shares experience; facilitating enables a group to reach its own decision; directing tells.<\/p>\n<h2 id=\"s5-h10\">5.10 Scaling frameworks<\/h2>\n<ul>\n<li><strong>SAFe<\/strong> (Scaled Agile Framework) — Agile Release Trains, PI (Program Increment) Planning, WSJF prioritisation, Lean portfolio management<\/li>\n<li><strong>LeSS<\/strong> (Large-Scale Scrum) — one product backlog, one PO, multiple teams, minimal added process<\/li>\n<li><strong>Nexus<\/strong> — 3–9 Scrum teams, Nexus Integration Team, focus on integration dependencies<\/li>\n<li><strong>Scrum of Scrums<\/strong> — representatives from each team meet to coordinate and surface cross-team impediments<\/li>\n<li><strong>Disciplined Agile (DA)<\/strong> — PMI's own toolkit; context-driven \"choose your way of working\"<\/li>\n<li><strong>Spotify model<\/strong> — squads, tribes, chapters, guilds (a culture description, not a framework)<\/li>\n<\/ul>\n<h2 id=\"s5-h11\">5.11 Agile contracting<\/h2>\n<p>Fixed-scope, fixed-price contracts fight against agile. Alternatives:\n- <strong>Master services agreement (MSA)<\/strong> with lightweight statements of work per increment\n- <strong>Graduated fixed price<\/strong> — the rate varies with delivery performance\n- <strong>Fixed price per iteration / capacity-based<\/strong> — buy team capacity, not scope\n- <strong>Not-to-exceed with fixed fee<\/strong>\n- <strong>Incremental delivery with go/no-go gates<\/strong>\n- <strong>Early termination for convenience<\/strong>, with payment for value delivered and an incentive for finishing early\n- <strong>Money for nothing, change for free<\/strong> — the customer may swap equal-sized items freely and may cancel early, paying a portion of the remaining value<\/p>\n<h2 id=\"s5-h12\">5.12 Designing a hybrid approach<\/h2>\n<p>Common patterns:\n1. <strong>Agile execution inside a predictive shell<\/strong> — charter, business case, budget and phase gates are formal; delivery inside each phase is iterative.\n2. <strong>Predictive front end, agile build, predictive deployment<\/strong> — heavy analysis and regulatory design up front, iterative build, controlled release.\n3. <strong>Split by component<\/strong> — infrastructure and hardware predictive, software adaptive, integrated through a shared release plan.\n4. <strong>Agile team inside a predictive programme<\/strong> — the team runs sprints and reports milestone-level progress upward.\n5. <strong>Predictive team with agile practices borrowed<\/strong> — daily stand-ups, retrospectives, kanban board, without changing the contract.<\/p>\n<p><strong>Design questions to ask:<\/strong> Where is uncertainty highest? Where is the cost of change highest? What does governance actually require (versus what it habitually does)? Where does the customer want visibility? What can the team realistically operate?<\/p>\n<p><strong>Integration points are the risk.<\/strong> Define explicitly: how agile progress converts into milestone reporting, where change control kicks in, how a fixed contract accommodates a variable backlog, and how dependencies between differently-paced teams are synchronised.<\/p>\n<hr />", "subs": [{"t": "5.1 The Agile Manifesto", "a": "s5-h1"}, {"t": "5.2 Scrum", "a": "s5-h2"}, {"t": "5.3 Kanban", "a": "s5-h3"}, {"t": "5.4 Extreme Programming (XP)", "a": "s5-h4"}, {"t": "5.5 Lean", "a": "s5-h5"}, {"t": "5.6 Estimation in agile", "a": "s5-h6"}, {"t": "5.7 Prioritisatio of scrums — representatives from each team meet to coordinate and surface cross-team impediments disciplined agile (da) — pmi's own toolkit; context-driven \"choose your way of working\" spotify model — squads, tribes, chapters, guilds (a culture description, not a framework) 5.11 agile contracting fixed-scope, fixed-price contracts fight against agile. alternatives: - master services agreement (msa) with lightweight statements of work per increment - graduated fixed price — the rate varies with delivery performance - fixed price per iteration / capacity-based — buy team capacity, not scope - not-to-exceed with fixed fee - incremental delivery with go/no-go gates - early termination for convenience , with payment for value delivered and an incentive for finishing early - money for nothing, change for free — the customer may swap equal-sized items freely and may cancel early, paying a portion of the remaining value 5.12 designing a hybrid approach common patterns: 1. agile execution inside a predictive shell — charter, business case, budget and phase gates are formal; delivery inside each phase is iterative. 2. predictive front end, agile build, predictive deployment — heavy analysis and regulatory design up front, iterative build, controlled release. 3. split by component — infrastructure and hardware predictive, software adaptive, integrated through a shared release plan. 4. agile team inside a predictive programme — the team runs sprints and reports milestone-level progress upward. 5. predictive team with agile practices borrowed — daily stand-ups, retrospectives, kanban board, without changing the contract. design questions to ask: where is uncertainty highest? where is the cost of change highest? what does governance actually require (versus what it habitually does)? where does the customer want visibility? what can the team realistically operate? integration points are the risk. define explicitly: how agile progress converts into milestone reporting, where change control kicks in, how a fixed contract accommodates a variable backlog, and how dependencies between differently-paced teams are synchronised. "}, {"id": "s6", "title": "Part 6 — AI, sustainability and value delivery", "html": "<h2 id=\"s6-h1\">6.1 AI in project management<\/h2>\n<p>The 2026 JTA added AI as a formal input. It is not a separate domain — it appears inside estimating, risk, reporting, quality, governance and ethics.<\/p>\n<h3>Where AI is used on projects<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Area<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Estimating<\/td>\n<td>Historical-data models for duration and cost; probabilistic forecasting<\/td>\n<\/tr>\n<tr>\n<td>Schedule<\/td>\n<td>Risk simulation, dependency detection, resource optimisation<\/td>\n<\/tr>\n<tr>\n<td>Risk<\/td>\n<td>Pattern detection in early-warning indicators; automated scanning of registers<\/td>\n<\/tr>\n<tr>\n<td>Reporting<\/td>\n<td>Auto-generated status summaries, dashboards, anomaly flagging<\/td>\n<\/tr>\n<tr>\n<td>Requirements<\/td>\n<td>Summarising stakeholder input, detecting ambiguity, generating test cases<\/td>\n<\/tr>\n<tr>\n<td>Quality<\/td>\n<td>Defect prediction, automated code review, test generation<\/td>\n<\/tr>\n<tr>\n<td>Stakeholders<\/td>\n<td>Sentiment analysis on survey and channel data<\/td>\n<\/tr>\n<tr>\n<td>Procurement<\/td>\n<td>Bid comparison, contract clause analysis<\/td>\n<\/tr>\n<tr>\n<td>Knowledge<\/td>\n<td>Searchable lessons-learned bases; retrieval over project archives<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Adoption strategy<\/h3>\n<ol>\n<li>Start with a <strong>defined problem<\/strong> and a baseline metric — not with the tool<\/li>\n<li>Confirm <strong>data quality, availability and ownership<\/strong><\/li>\n<li>Check <strong>policy and legal constraints<\/strong> (data residency, client confidentiality, IP, procurement rules)<\/li>\n<li><strong>Pilot small<\/strong>, measure against the baseline<\/li>\n<li>Train people; change the process, not just the tooling<\/li>\n<li>Scale only what demonstrably worked; retire what did not<\/li>\n<\/ol>\n<h3>Responsible use — the exam's emphasis<\/h3>\n<ul>\n<li><strong>The project manager remains accountable.<\/strong> AI assists; it does not decide. Human review is required for consequential decisions.<\/li>\n<li><strong>Bias<\/strong> — models reflect their training data; check outputs for systematic bias in resourcing, evaluation or selection decisions.<\/li>\n<li><strong>Hallucination and confabulation<\/strong> — verify factual outputs, especially figures, citations and compliance statements.<\/li>\n<li><strong>Confidentiality<\/strong> — never put client, personal or commercially sensitive project data into an unapproved tool. This is a compliance and possibly legal breach.<\/li>\n<li><strong>Intellectual property<\/strong> — know who owns AI-generated outputs under your contract.<\/li>\n<li><strong>Transparency<\/strong> — disclose AI use where stakeholders would reasonably expect to know, and where governance requires it.<\/li>\n<li><strong>Skill erosion and over-reliance<\/strong> — teams that stop thinking lose the ability to catch AI errors.<\/li>\n<li><strong>Traceability<\/strong> — keep an audit trail of AI-assisted decisions.<\/li>\n<li><strong>Regulation<\/strong> — AI-specific law (e.g. the EU AI Act) may create compliance obligations for the product you are building.<\/li>\n<\/ul>\n<h3>How AI questions are framed<\/h3>\n<p>Wrong answers typically involve: acting on an AI output without verification; feeding confidential data into a public tool; replacing stakeholder engagement with generated summaries; treating an AI forecast as fact; or adopting AI because a senior stakeholder read an article.<\/p>\n<p>Right answers typically involve: validating the output, checking the policy, keeping a human in the loop, piloting and measuring, being transparent, and treating AI as one input to judgement.<\/p>\n<h2 id=\"s6-h2\">6.2 Sustainability<\/h2>\n<h3>Framing<\/h3>\n<p><strong>Triple bottom line:<\/strong> people, planet, profit. <strong>ESG:<\/strong> environmental, social, governance. PMI links project sustainability to the <strong>UN Sustainable Development Goals<\/strong>.<\/p>\n<p>PMBOK 8 makes <em>Integrate sustainability within all project areas<\/em> one of the six principles. It is therefore a lens applied across every domain, not a chapter.<\/p>\n<h3>Where sustainability shows up<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Area<\/th>\n<th>Sustainability consideration<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Business case<\/td>\n<td>Whole-life value including environmental and social cost<\/td>\n<\/tr>\n<tr>\n<td>Scope / requirements<\/td>\n<td>Sustainability requirements and acceptance criteria<\/td>\n<\/tr>\n<tr>\n<td>Quality<\/td>\n<td>Design for sustainability; cost of quality includes waste and remediation<\/td>\n<\/tr>\n<tr>\n<td>Cost<\/td>\n<td><strong>Life-cycle cost / total cost of ownership<\/strong>, including operation and disposal<\/td>\n<\/tr>\n<tr>\n<td>Procurement<\/td>\n<td>Supplier ESG standards, labour practices, transport footprint, local sourcing<\/td>\n<\/tr>\n<tr>\n<td>Risk<\/td>\n<td>Environmental permits, climate exposure, reputational risk, social licence to operate<\/td>\n<\/tr>\n<tr>\n<td>Compliance<\/td>\n<td>Environmental regulation, reporting obligations, carbon disclosure<\/td>\n<\/tr>\n<tr>\n<td>Resources<\/td>\n<td>Materials, energy, waste, reuse, circularity<\/td>\n<\/tr>\n<tr>\n<td>Stakeholders<\/td>\n<td>Communities, regulators, NGOs, future users<\/td>\n<\/tr>\n<tr>\n<td>Closure<\/td>\n<td>Decommissioning, recycling, handover of environmental obligations<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Exam framing<\/h3>\n<p>Sustainability is a <strong>source of requirements, risks, costs and constraints<\/strong> — treat it exactly as you would treat a regulatory requirement. Options that dismiss an environmental or social impact as out of scope are usually wrong; options that assess the impact, record it, and bring it into planning and governance are usually right.<\/p>\n<p><strong>Greenwashing<\/strong> — claiming sustainability benefits you cannot evidence — is both an ethics and a compliance failure.<\/p>\n<h2 id=\"s6-h3\">6.3 Value delivery in depth<\/h2>\n<h3>Defining value with stakeholders<\/h3>\n<p>Value is subjective and must be made explicit. Run a session to answer:\n- What outcomes matter, to whom?\n- How will we measure them?\n- What is the minimum worth doing?\n- What would make us stop?<\/p>\n<p>Capture it in the business case, the benefits management plan and the success metrics.<\/p>\n<h3>The benefits management plan<\/h3>\n<p>Contents: target benefits, strategic alignment, timeframe for realisation, <strong>benefits owner<\/strong>, <strong>metrics<\/strong> (direct and indirect), assumptions, risks to realisation, and how benefits will be <strong>sustained<\/strong> after the project ends.<\/p>\n<p>Most benefits are realised <em>after<\/em> the project closes. Part of closure is handing benefits tracking to a named owner with a working measurement system.<\/p>\n<h3>Delivering value incrementally<\/h3>\n<p>Benefits of incremental delivery: earlier cash flow, earlier learning, reduced risk of total failure, ability to stop when enough value is delivered, stakeholder confidence.<\/p>\n<p>When incremental delivery is <strong>not<\/strong> possible: a bridge half-built delivers nothing. Then deliver <em>learning<\/em> incrementally instead — prototypes, models, simulations, pilots.<\/p>\n<h3>Measuring value<\/h3>\n<ul>\n<li>Leading indicators (adoption rate, usage, engagement) vs lagging indicators (revenue, cost saving)<\/li>\n<li>Instrument before you launch — you cannot measure retrospectively what you never captured<\/li>\n<li><strong>Verify a measurement system is in place<\/strong> is an explicit ECO enabler for a reason<\/li>\n<\/ul>\n<h3>Deciding to stop<\/h3>\n<p>The most valuable decision a PM can make is sometimes to recommend termination. Triggers: the business case no longer holds, a competitor made the solution obsolete, the cost to complete exceeds the remaining benefit, a regulatory change has invalidated the approach. Sunk cost is irrelevant. Present the analysis and the recommendation to the sponsor.<\/p>\n<hr />", "subs": [{"t": "6.1 AI in project management", "a": "s6-h1"}, {"t": "6.2 Sustainability", "a": "s6-h2"}, {"t": "6.3 Value delivery in depth", "a": "s6-h3"}], "text": " 6.1 ai in project management the 2026 jta added ai as a formal input. it is not a separate domain — it appears inside estimating, risk, reporting, quality, governance and ethics. where ai is used on projects area use estimating historical-data models for duration and cost; probabilistic forecasting schedule risk simulation, dependency detection, resource optimisation risk pattern detection in early-warning indicators; automated scanning of registers reporting auto-generated status summaries, dashboards, anomaly flagging requirements summarising stakeholder input, detecting ambiguity, generating test cases quality defect prediction, automated code review, test generation stakeholders sentiment analysis on survey and channel data procurement bid comparison, contract clause analysis knowledge searchable lessons-learned bases; retrieval over project archives adoption strategy start with a defined problem and a baseline metric — not with the tool confirm data quality, availability and ownership check policy and legal constraints (data residency, client confidentiality, ip, procurement rules) pilot small , measure against the baseline train people; change the process, not just the tooling scale only what demonstrably worked; retire what did not responsible use — the exam's emphasis the project manager remains accountable. ai assists; it does not decide. human review is required for consequential decisions. bias — models reflect their trai ost of ownership , including operation and disposal procurement supplier esg standards, labour practices, transport footprint, local sourcing risk environmental permits, climate exposure, reputational risk, social licence to operate compliance environmental regulation, reporting obligations, carbon disclosure resources materials, energy, waste, reuse, circularity stakeholders communities, regulators, ngos, future users closure decommissioning, recycling, handover of environmental obligations exam framing sustainability is a source of requirements, risks, costs and constraints — treat it exactly as you would treat a regulatory requirement. options that dismiss an environmental or social impact as out of scope are usually wrong; options that assess the impact, record it, and bring it into planning and governance are usually right. greenwashing — claiming sustainability benefits you cannot evidence — is both an ethics and a compliance failure. 6.3 value delivery in depth defining value with stakeholders value is subjective and must be made explicit. run a session to answer: - what outcomes matter, to whom? - how will we measure them? - what is the minimum worth doing? - what would make us stop? capture it in the business case, the benefits management plan and the success metrics. the benefits management plan contents: target benefits, strategic alignment, timeframe for realisation, benefits owner , metrics (direct and indirect), assumptions, risks to realisation, and how benefits will be sustained after the project ends. most benefits are realised after the project closes. part of closure is handing benefits tracking to a named owner with a working measurement system. delivering value incrementally benefits of incremental delivery: earlier cash flow, earlier learning, reduced risk of total failure, ability to stop when enough value is delivered, stakeholder confidence. when incremental delivery is not possible: a bridge half-built delivers nothing. then deliver learning incrementally instead — prototypes, models, simulations, pilots. measuring value leading indicators (adoption rate, usage, engagement) vs lagging indicators (revenue, cost saving) instrument before you launch — you cannot measure retrospectively what you never captured verify a measurement system is in place is an explicit eco enabler for a reason deciding to stop the most valuable decision a pm can make is sometimes to recommend termination. triggers: the business case no longer holds, a competitor made the solution obsolete, the cost to complete exceeds the remaining benefit, a regulatory change has invalidated the approach. sunk cost is irrelevant. present the analysis and the recommendation to the sponsor. "}, {"id": "s7", "title": "Part 7 — Formulas with worked examples", "html": "<p>Memorise these. Brain-dump them in the untimed tutorial at the start of the exam.<\/p>\n<h2 id=\"s7-h1\">7.1 Earned value management<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Formula<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>PV — Planned Value<\/td>\n<td>Planned % complete × BAC<\/td>\n<\/tr>\n<tr>\n<td>EV — Earned Value<\/td>\n<td>Actual % complete × BAC<\/td>\n<\/tr>\n<tr>\n<td>AC — Actual Cost<\/td>\n<td>measured<\/td>\n<\/tr>\n<tr>\n<td><strong>CV<\/strong> — Cost Variance<\/td>\n<td><strong>EV − AC<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>SV<\/strong> — Schedule Variance<\/td>\n<td><strong>EV − PV<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>CPI<\/strong> — Cost Performance Index<\/td>\n<td><strong>EV ÷ AC<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>SPI<\/strong> — Schedule Performance Index<\/td>\n<td><strong>EV ÷ PV<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>EAC<\/strong> typical<\/td>\n<td><strong>BAC ÷ CPI<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>EAC<\/strong> atypical<\/td>\n<td><strong>AC + (BAC − EV)<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>EAC<\/strong> with schedule pressure<\/td>\n<td><strong>AC + [(BAC − EV) ÷ (CPI × SPI)]<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>EAC<\/strong> new estimate<\/td>\n<td><strong>AC + bottom-up ETC<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>ETC<\/strong><\/td>\n<td><strong>EAC − AC<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>VAC<\/strong><\/td>\n<td><strong>BAC − EAC<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>TCPI<\/strong> to BAC<\/td>\n<td><strong>(BAC − EV) ÷ (BAC − AC)<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>TCPI<\/strong> to EAC<\/td>\n<td><strong>(BAC − EV) ÷ (EAC − AC)<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Rules:<\/strong> every <em>variance<\/em> is EV <strong>minus<\/strong>; every <em>index<\/em> is EV <strong>divided by<\/strong>. Negative variance = bad. Index below 1 = bad.<\/p>\n<h3>Worked example 1<\/h3>\n<p>A project has BAC = $200,000. It is 40% through the schedule and the plan says 50% of the work should be complete. Actual completion is 40%. Actual cost to date is $95,000.<\/p>\n<ul>\n<li>PV = 50% × 200,000 = <strong>$100,000<\/strong><\/li>\n<li>EV = 40% × 200,000 = <strong>$80,000<\/strong><\/li>\n<li>AC = <strong>$95,000<\/strong><\/li>\n<li>CV = 80,000 − 95,000 = <strong>−$15,000<\/strong> (over budget)<\/li>\n<li>SV = 80,000 − 100,000 = <strong>−$20,000<\/strong> (behind schedule)<\/li>\n<li>CPI = 80,000 ÷ 95,000 = <strong>0.84<\/strong><\/li>\n<li>SPI = 80,000 ÷ 100,000 = <strong>0.80<\/strong><\/li>\n<li>EAC (typical) = 200,000 ÷ 0.84 = <strong>$238,095<\/strong><\/li>\n<li>ETC = 238,095 − 95,000 = <strong>$143,095<\/strong><\/li>\n<li>VAC = 200,000 − 238,095 = <strong>−$38,095<\/strong> (will overrun)<\/li>\n<li>TCPI to BAC = (200,000 − 80,000) ÷ (200,000 − 95,000) = 120,000 ÷ 105,000 = <strong>1.14<\/strong> — you must run 14% more efficiently than planned from here, while you have been running at 0.84. That is almost certainly not achievable: the honest move is to re-forecast and escalate.<\/li>\n<\/ul>\n<h3>Worked example 2<\/h3>\n<p>BAC = $500,000. EV = $300,000. AC = $250,000. The overrun so far was caused by a one-off customs charge that will not recur.<\/p>\n<p>Atypical formula applies: EAC = AC + (BAC − EV) = 250,000 + (500,000 − 300,000) = <strong>$450,000<\/strong>.\nVAC = 500,000 − 450,000 = <strong>+$50,000<\/strong> — expected underrun. (Note CPI here is 1.2, i.e. favourable; the atypical formula assumes the remaining work runs to plan.)<\/p>\n<h2 id=\"s7-h2\">7.2 Estimating<\/h2>\n<ul>\n<li><strong>Triangular (simple average):<\/strong> (O + M + P) ÷ 3<\/li>\n<li><strong>Beta / PERT:<\/strong> <strong>(O + 4M + P) ÷ 6<\/strong><\/li>\n<li><strong>Standard deviation (σ):<\/strong> <strong>(P − O) ÷ 6<\/strong><\/li>\n<li><strong>Variance:<\/strong> σ² = [(P − O) ÷ 6]²<\/li>\n<li>Confidence ranges: ±1σ = <strong>68.27%<\/strong> · ±2σ = <strong>95.45%<\/strong> · ±3σ = <strong>99.73%<\/strong> · ±6σ = <strong>99.99966%<\/strong><\/li>\n<\/ul>\n<h3>Worked example<\/h3>\n<p>Optimistic 8 days, Most likely 14 days, Pessimistic 32 days.<\/p>\n<ul>\n<li>PERT = (8 + 4×14 + 32) ÷ 6 = (8 + 56 + 32) ÷ 6 = 96 ÷ 6 = <strong>16 days<\/strong><\/li>\n<li>σ = (32 − 8) ÷ 6 = <strong>4 days<\/strong><\/li>\n<li>68.27% confidence range: 16 ± 4 = <strong>12 to 20 days<\/strong><\/li>\n<li>95.45% range: 16 ± 8 = <strong>8 to 24 days<\/strong><\/li>\n<li>99.73% range: 16 ± 12 = <strong>4 to 28 days<\/strong><\/li>\n<\/ul>\n<p>For a path of several activities, the path variance is the <strong>sum of the activity variances<\/strong>; the path standard deviation is the <strong>square root of that sum<\/strong> (not the sum of the σs).<\/p>\n<h2 id=\"s7-h3\">7.3 Schedule<\/h2>\n<ul>\n<li><strong>Total float<\/strong> = LS − ES = LF − EF<\/li>\n<li><strong>Free float<\/strong> = ES(successor) − EF(current) − 1 (or the delay possible without affecting the successor's early start)<\/li>\n<li><strong>Forward pass:<\/strong> EF = ES + duration − 1<\/li>\n<li><strong>Backward pass:<\/strong> LS = LF − duration + 1<\/li>\n<li><strong>Critical path<\/strong> = the longest path; total float = 0 (or the minimum float if the project has an imposed end date)<\/li>\n<\/ul>\n<h3>Worked example<\/h3>\n<p>Paths: A→B→D = 4+7+5 = <strong>16 days<\/strong>. A→C→D = 4+3+5 = <strong>12 days<\/strong>.<\/p>\n<p>Critical path = A→B→D = 16 days. Activity C has 16 − 12 = <strong>4 days of total float<\/strong>.\nIf C is delayed 3 days, the project is unaffected. If C is delayed 6 days, the project slips 2 days and A→C→D becomes critical.<\/p>\n<h2 id=\"s7-h4\">7.4 Communication channels<\/h2>\n<p><strong>n(n − 1) ÷ 2<\/strong><\/p>\n<p>Team of 8: 8 × 7 ÷ 2 = <strong>28 channels<\/strong>. Add 2 people → 10 × 9 ÷ 2 = 45 channels. <strong>Channels added = 17.<\/strong><\/p>\n<h2 id=\"s7-h5\">7.5 Financial<\/h2>\n<ul>\n<li><strong>ROI<\/strong> = (Benefit − Cost) ÷ Cost × 100<\/li>\n<li><strong>BCR<\/strong> = Benefits ÷ Costs (&gt;1 viable)<\/li>\n<li><strong>PV (present value)<\/strong> = FV ÷ (1 + r)ⁿ<\/li>\n<li><strong>NPV<\/strong> = Σ discounted cash inflows − initial investment (choose the <strong>highest<\/strong>)<\/li>\n<li><strong>IRR<\/strong> = the discount rate where NPV = 0 (choose the <strong>highest<\/strong>)<\/li>\n<li><strong>Payback period<\/strong> = time to recover the investment (choose the <strong>shortest<\/strong>, but it is the weakest criterion)<\/li>\n<li><strong>Straight-line depreciation<\/strong> = (cost − salvage value) ÷ useful life<\/li>\n<li><strong>Sunk cost<\/strong> — ignore in every forward-looking decision<\/li>\n<\/ul>\n<h3>Worked example<\/h3>\n<p>Project A: NPV $120,000, payback 4 years. Project B: NPV $95,000, payback 2 years.\nChoose <strong>A<\/strong> — NPV outranks payback period. Payback ignores everything after the payback point and ignores the time value of money.<\/p>\n<h2 id=\"s7-h6\">7.6 Procurement<\/h2>\n<ul>\n<li><strong>PTA<\/strong> = ((Ceiling Price − Target Price) ÷ Buyer's share ratio) + Target Cost<\/li>\n<li><strong>Final fee<\/strong> = Target Fee + ((Target Cost − Actual Cost) × Seller's share)<\/li>\n<li><strong>Final price<\/strong> = Actual Cost + Final Fee, capped at the ceiling price<\/li>\n<\/ul>\n<h3>Worked example<\/h3>\n<p>FPIF: Target cost $100,000 · Target fee $10,000 · Target price $110,000 · Ceiling price $125,000 · Share ratio 70/30 (buyer/seller).<\/p>\n<p>PTA = ((125,000 − 110,000) ÷ 0.70) + 100,000 = (15,000 ÷ 0.70) + 100,000 = 21,429 + 100,000 = <strong>$121,429<\/strong>.<\/p>\n<p>Beyond an actual cost of $121,429, the seller absorbs 100% of further cost.<\/p>\n<p>If actual cost is $90,000: fee = 10,000 + ((100,000 − 90,000) × 0.30) = 10,000 + 3,000 = $13,000. Final price = 90,000 + 13,000 = <strong>$103,000<\/strong>.<\/p>\n<h2 id=\"s7-h7\">7.7 Risk<\/h2>\n<p><strong>EMV<\/strong> = Probability × Impact, summed across outcomes. Threats negative, opportunities positive.<\/p>\n<h3>Worked example<\/h3>\n<ul>\n<li>Risk 1: 30% chance of a $50,000 loss → EMV = <strong>−$15,000<\/strong><\/li>\n<li>Risk 2: 20% chance of a $30,000 loss → EMV = <strong>−$6,000<\/strong><\/li>\n<li>Opportunity 3: 40% chance of a $25,000 gain → EMV = <strong>+$10,000<\/strong><\/li>\n<\/ul>\n<p>Total EMV = −15,000 − 6,000 + 10,000 = <strong>−$11,000<\/strong>. That is the contingency reserve indicated by these risks.<\/p>\n<p><strong>Decision tree:<\/strong> compare branches on (path cost + EMV of outcomes). Choose the branch with the best expected value, then sanity-check against risk appetite.<\/p>\n<h2 id=\"s7-h8\">7.8 Agile<\/h2>\n<ul>\n<li><strong>Velocity<\/strong> = points completed per iteration (rolling average of 3–5)<\/li>\n<li><strong>Iterations remaining<\/strong> = points remaining ÷ average velocity<\/li>\n<li><strong>Cycle time<\/strong> = WIP ÷ Throughput (<strong>Little's Law<\/strong>)<\/li>\n<li><strong>Burn rate<\/strong> = cost per iteration<\/li>\n<li><strong>Agile SPI<\/strong> ≈ actual velocity ÷ planned velocity<\/li>\n<\/ul>\n<h3>Worked example<\/h3>\n<p>Backlog remaining = 260 points. Velocity over the last four sprints: 28, 32, 30, 30 → average <strong>30<\/strong>.\n260 ÷ 30 = 8.67 → <strong>9 sprints<\/strong>. At 2-week sprints and $40,000 per sprint: 18 weeks and <strong>$360,000<\/strong> remaining cost.<\/p>\n<h2 id=\"s7-h9\">7.9 Quality<\/h2>\n<ul>\n<li><strong>Control limits<\/strong> are typically <strong>±3σ<\/strong> from the mean and are set by the <em>process<\/em>.<\/li>\n<li><strong>Specification limits<\/strong> are set by the <em>customer<\/em> and must sit outside the control limits.<\/li>\n<li><strong>Rule of seven<\/strong> — seven consecutive points on one side of the mean indicates an out-of-control process even within limits.<\/li>\n<li><strong>Six Sigma<\/strong> = 3.4 defects per million opportunities.<\/li>\n<li><strong>Cost of quality<\/strong> = conformance (prevention + appraisal) + non-conformance (internal + external failure).<\/li>\n<\/ul>\n<hr />", "subs": [{"t": "7.1 Earned value management", "a": "s7-h1"}, {"t": "7.2 Estimating", "a": "s7-h2"}, {"t": "7.3 Schedule", "a": "s7-h3"}, {"t": "7.4 Communication channels", "a": "s7-h4"}, {"t": "7.5 Financial", "a": "s7-h5"}, {"t": "7.6 Procurement", "a": "s7-h6"}, {"t": "7.7 Risk", "a": "s7-h7"}, {"t": "7.8 Agile", "a": "s7-h8"}, {"t": "7.9 Quality", "a": "s7-h9"}], "text": " memorise these. brain-dump them in the untimed tutorial at the start of the exam. 7.1 earned value management term formula pv — planned value planned % complete × bac ev — earned value actual % complete × bac ac — actual cost measured cv — cost variance ev − ac sv — schedule variance ev − pv cpi — cost performance index ev ÷ ac spi — schedule performance index ev ÷ pv eac typical bac ÷ cpi eac atypical ac + (bac − ev) eac with schedule pressure ac + [(bac − ev) ÷ (cpi × spi)] eac new estimate ac + bottom-up etc etc eac − ac vac bac − eac tcpi to bac (bac − ev) ÷ (bac − ac) tcpi to eac (bac − ev) ÷ (eac − ac) rules: every variance is ev minus ; every index is ev divided by . negative variance = bad. index below 1 = bad. worked example 1 a project has bac = $200,000. it is 40% through the schedule and the plan says 50% of the work should be complete. actual completion is 40%. actual cost to date is $95,000. pv = 50% × 200,000 = $100,000 ev = 40% × 200,000 = $80,000 ac = $95,000 cv = 80,000 − 95,000 = −$15,000 (over budget) sv = 80,000 − 100,000 = −$20,000 (behind schedule) cpi = 80,000 ÷ 95,000 = 0.84 spi = 80,000 ÷ 100,000 = 0.80 eac (typical) = 200,000 ÷ 0.84 = $238,095 etc = 238,095 − 95,000 = $143,095 vac = 200,000 − 238,095 = −$38,095 (will overrun) tcpi to bac = (200,000 − 80,000) ÷ (200,000 − 95,000) = 120,000 ÷ 105,000 = 1.14 — you must run 14% more efficiently than planned from here, while you have been running at 0.84. that is almost certainly not achievable: the honest move is to re-forecast and escalate. worked example 2 bac = $500,000. ev = $300,000. ac = $250,000. the overrun so far was caused by a one-off customs charge that will not recur. atypical formula applies: eac = ac + (bac − ev) = 250,000 + (500,000 − 300,000) = $450,000 . vac = 500,000 − 450,000 = +$50,000 — expected underrun. (note cpi here is 1.2, i.e. favourable; the atypical formula assumes the remaining work runs to plan.) 7.2 estimating triangular (simple average): (o + m + p) ÷ 3 beta / pert: (o + 4m + p) ÷ 6 standard deviation (σ): (p − o) ÷ 6 variance: σ² = [(p − o) ÷ 6]² confidence ranges: ±1σ = 68.27% · ±2σ = 95.45% · ±3σ = 99.73% · ±6σ = 99.99966% worked example optimistic 8 days, most likely 14 days, pessimistic 32 days. pert = (8 + 4×14 + 32) ÷ 6 = (8 + 56 + 32) ÷ 6 = 96 ÷ 6 = 16 days σ = (32 − 8) ÷ 6 = 4 days 68.27% confidence range: 16 ± 4 = 12 to 20 days 95.45% range: 16 ± 8 = 8 to 24 days 99.73% range: 16 ± 12 = 4 to 28 days for a path of several activities, the path variance is the sum of the activity variances ; the path standard deviation is the square root of that sum (not the sum of the σs). 7.3 schedule total float = ls − es = lf − ef free float = es(successor) − ef(current) − 1 (or the delay possible without affecting the successor's early start) forward pass: ef = es + duration − 1 backward pass: ls = lf − duration + 1 critical path = the longest path; total float = 0 (or the minimum float if the project has an imposed end date) worked example paths: a→b→d = 4+7+5 = 16 days . a→c→d = 4+3+5 = 12 days . critical path = a→b→d = 16 days. activity c has 16 − 12 = 4 days of total float . if c is delayed 3 days, the project is unaffected. if c is delayed 6 days, the project slips 2 days and a→c→d becomes critical. 7.4 communication channels n(n − 1) ÷ 2 team of 8: 8 × 7 ÷ 2 = 28 channels . add 2 people → 10 × 9 ÷ 2 = 45 channels. channels added = 17. 7.5 financial roi = (benefit − cost) ÷ cost × 100 bcr = benefits ÷ costs (&gt;1 viable) pv (present value) = fv ÷ (1 + r)ⁿ npv = σ discounted cash inflows − initial investment (choose the highest ) irr = the discount rate where npv = 0 (choose the highest ) payback period = time to recover the investment (choose the shortest , but it is the weakest criterion) straight-line depreciation = (cost − salvage value) ÷ useful life sunk cost — ignore in every forward-looking decision worked example project a: npv $120,000, payback 4 years. project b: npv $95,000, payback 2 years. choose a — npv outranks payback period. payback ignores everything after the payback point and ignores the time value of money. 7.6 procurement pta = ((ceiling price − target price) ÷ buyer's share ratio) + target cost final fee = target fee + ((target cost − actual cost) × seller's share) final price = actual cost + final fee, capped at the ceiling price worked example fpif: target cost $100,000 · target fee $10,000 · target price $110,000 · ceiling price $125,000 · share ratio 70/30 (buyer/seller). pta = ((125,000 − 110,000) ÷ 0.70) + 100,000 = (15,000 ÷ 0.70) + 100,000 = 21,429 + 100,000 = $121,429 . beyond an actual cost of $121,429, the seller absorbs 100% of further cost. if actual cost is $90,000: fee = 10,000 + ((100,000 − 90,000) × 0.30) = 10,000 + 3,000 = $13,000. final price = 90,000 + 13,000 = $103,000 . 7.7 risk emv = probability × impact, summed across outcomes. threats negative, opportunities positive. worked example risk 1: 30% chance of a $50,000 loss → emv = −$15,000 risk 2: 20% chance of a $30,000 loss → emv = −$6,000 opportunity 3: 40% chance of a $25,000 gain → emv = +$10,000 total emv = −15,000 − 6,000 + 10,000 = −$11,000 . that is the contingency reserve indicated by these risks. decision tree: compare branches on (path cost + emv of outcomes). choose the branch with the best expected value, then sanity-check against risk appetite. 7.8 agile velocity = points completed per iteration (rolling average of 3–5) iterations remaining = points remaining ÷ average velocity cycle time = wip ÷ throughput ( little's law ) burn rate = cost per iteration agile spi ≈ actual velocity ÷ planned velocity worked example backlog remaining = 260 points. velocity over the last four sprints: 28, 32, 30, 30 → average 30 . 260 ÷ 30 = 8.67 → 9 sprints . at 2-week sprints and $40,000 per sprint: 18 weeks and $360,000 remaining cost. 7.9 quality control limits are typically ±3σ from the mean and are set by the process . specification limits are set by the customer and must sit outside the control limits. rule of seven — seven consecutive points on one side of the mean indicates an out-of-control process even within limits. six sigma = 3.4 defects per million opportunities. cost of quality = conformance (prevention + appraisal) + non-conformance (internal + external failure). "}, {"id": "s8", "title": "Part 8 — The PMI mindset", "html": "<p>More people fail on mindset than on knowledge. Two options are usually technically defensible; PMI wants a specific character of project manager.<\/p>\n<h2 id=\"s8-h1\">8.1 The twenty rules<\/h2>\n<ol>\n<li><strong>Never do nothing.<\/strong> \"Take no action\", \"wait\", \"let it resolve itself\" are almost always wrong.<\/li>\n<li><strong>Never escalate first.<\/strong> Gather facts, assess impact, try to resolve at your level. Escalate with a recommendation when it genuinely exceeds your authority.<\/li>\n<li><strong>Never go around a person.<\/strong> Problem with a team member → talk to the team member. Problem with a stakeholder → talk to the stakeholder.<\/li>\n<li><strong>Understand before acting.<\/strong> When information is missing, the first step is analyse / assess / investigate / review the plan / meet the person.<\/li>\n<li><strong>But act when the analysis is done.<\/strong> If the scenario says the impact is already assessed, the next step is the action, not more analysis.<\/li>\n<li><strong>Follow the process.<\/strong> Changes → change control. Risks → register. Issues → issue log. Lessons → repository.<\/li>\n<li><strong>Consult the plan.<\/strong> \"Review the [X] management plan\" is right far more often than it feels. The agreed answer usually already exists.<\/li>\n<li><strong>Be proactive.<\/strong> Prevention beats correction; risk management beats issue management; \"what should the PM have done?\" is nearly always a planning answer.<\/li>\n<li><strong>Serve the team.<\/strong> Remove impediments. Do not assign tasks to a self-organising team. Do not accept work thrown directly at developers.<\/li>\n<li><strong>Never trade away quality, safety, ethics or compliance.<\/strong> Instant elimination for any option that does.<\/li>\n<li><strong>Never gold plate and never allow scope creep.<\/strong><\/li>\n<li><strong>Collaborate first in conflict.<\/strong> Problem-solving beats compromise beats smoothing beats forcing beats avoiding.<\/li>\n<li><strong>Engage resistance, do not overrule it.<\/strong> Find the cause first.<\/li>\n<li><strong>Be transparent.<\/strong> Hiding bad news is always wrong. So is escalating before you have facts.<\/li>\n<li><strong>Communicate in the right mode.<\/strong> Complex, sensitive, contentious → interactive, face to face.<\/li>\n<li><strong>Value first.<\/strong> In adaptive contexts, deliver the highest-value item and get feedback.<\/li>\n<li><strong>Tailor.<\/strong> There is no universal process; the right amount depends on context.<\/li>\n<li><strong>Involve the team.<\/strong> Estimates, approach and commitments come from the people doing the work.<\/li>\n<li><strong>Document decisions, not just outcomes.<\/strong> Rationale is what future teams need.<\/li>\n<li><strong>Keep the sponsor informed, and bring options.<\/strong> Escalation without a recommendation is abdication.<\/li>\n<\/ol>\n<h2 id=\"s8-h2\">8.2 Reading the question<\/h2>\n<p><strong>Identify the context first.<\/strong> Words like <em>sprint, backlog, product owner, iteration, retrospective, velocity, stand-up<\/em> signal adaptive — answers referencing CCBs and baselines are usually wrong there. Words like <em>baseline, WBS, CCB, phase gate, earned value, change request<\/em> signal predictive — answers about the product owner reordering the backlog are wrong there.<\/p>\n<p><strong>Identify the call:<\/strong>\n- <em>First<\/em> — the earliest correct step (usually analyse or consult)\n- <em>Next<\/em> — the step after what has already happened in the scenario\n- <em>Best<\/em> — the highest-quality of several defensible actions\n- <em>Most likely cause<\/em> — a diagnosis, not an action\n- <em>Should have done<\/em> — prevention, almost always a planning answer\n- <em>Except / not<\/em> — read twice; candidates lose marks to inverted questions under time pressure<\/p>\n<p><strong>Ignore the noise.<\/strong> Long scenarios usually contain one decisive sentence. Find who is affected, what has changed, and what the PM controls.<\/p>\n<p><strong>Eliminate, then choose on mindset.<\/strong> Two options are usually clearly wrong. Between the last two, pick the one that is more proactive, more collaborative, more process-respecting and more value-focused.<\/p>\n<h2 id=\"s8-h3\">8.3 Trap answers and why they are wrong<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Trap<\/th>\n<th>Why wrong<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Escalate to the sponsor immediately<\/td>\n<td>Skipped analysis and your own authority<\/td>\n<\/tr>\n<tr>\n<td>Add resources to recover the schedule<\/td>\n<td>Brooks's law; also no impact assessment<\/td>\n<\/tr>\n<tr>\n<td>Tell the customer the change is impossible<\/td>\n<td>You did not evaluate it<\/td>\n<\/tr>\n<tr>\n<td>Update the schedule to reflect the delay<\/td>\n<td>Absorbed a change without control<\/td>\n<\/tr>\n<tr>\n<td>Ask the functional manager to speak to their employee<\/td>\n<td>You went around a person<\/td>\n<\/tr>\n<tr>\n<td>Have the team work overtime<\/td>\n<td>Unsustainable pace, no analysis<\/td>\n<\/tr>\n<tr>\n<td>Remove a feature to save time<\/td>\n<td>Scope change without a request<\/td>\n<\/tr>\n<tr>\n<td>Hold a meeting (when a plan or log answers it)<\/td>\n<td>Wasteful; consult the artifact<\/td>\n<\/tr>\n<tr>\n<td>Document the issue and continue<\/td>\n<td>Logging is not resolving<\/td>\n<\/tr>\n<tr>\n<td>Accept the risk because the probability is low<\/td>\n<td>Only valid if analysis supports it and it is recorded<\/td>\n<\/tr>\n<tr>\n<td>Extend the sprint to finish the work<\/td>\n<td>Sprints are never extended<\/td>\n<\/tr>\n<tr>\n<td>Let the developer build what the stakeholder asked for<\/td>\n<td>Bypasses the product owner<\/td>\n<\/tr>\n<tr>\n<td>Proceed and address the regulation later<\/td>\n<td>Compliance is never deferred<\/td>\n<\/tr>\n<tr>\n<td>Use the AI output to update the forecast<\/td>\n<td>Not without human verification<\/td>\n<\/tr>\n<tr>\n<td>Continue because we have already invested so much<\/td>\n<td>Sunk cost fallacy<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s8-h4\">8.4 Quick decision heuristics<\/h2>\n<ul>\n<li>Someone is confused → <strong>communicate / clarify<\/strong><\/li>\n<li>Someone is unhappy → <strong>meet them, understand the cause<\/strong><\/li>\n<li>Something changed → <strong>assess impact → change request<\/strong><\/li>\n<li>Something is uncertain → <strong>risk register<\/strong><\/li>\n<li>Something is happening now and hurting → <strong>issue log + resolve<\/strong><\/li>\n<li>You do not know something → <strong>the plan, the register, or the person who knows<\/strong><\/li>\n<li>Work is blocked → <strong>remove the impediment<\/strong><\/li>\n<li>The team is arguing → <strong>facilitate collaboration<\/strong><\/li>\n<li>The scope crept → <strong>change control, and find why control failed<\/strong><\/li>\n<li>The business case is dead → <strong>escalate a recommendation, possibly to terminate<\/strong><\/li>\n<\/ul>\n<hr />", "subs": [{"t": "8.1 The twenty rules", "a": "s8-h1"}, {"t": "8.2 Reading the question", "a": "s8-h2"}, {"t": "8.3 Trap answers and why they are wrong", "a": "s8-h3"}, {"t": "8.4 Quick decision heuristics", "a": "s8-h4"}], "text": " more people fail on mindset than on knowledge. two options are usually technically defensible; pmi wants a specific character of project manager. 8.1 the twenty rules never do nothing. \"take no action\", \"wait\", \"let it resolve itself\" are almost always wrong. never escalate first. gather facts, assess impact, try to resolve at your level. escalate with a recommendation when it genuinely exceeds your authority. never go around a person. problem with a team member → talk to the team member. problem with a stakeholder → talk to the stakeholder. understand before acting. when information is missing, the first step is analyse / assess / investigate / review the plan / meet the person. but act when the analysis is done. if the scenario says the impact is already assessed, the next step is the action, not more analysis. follow the process. changes → change control. risks → register. issues → issue log. lessons → repository. consult the plan. \"review the [x] management plan\" is right far more often than it feels. the agreed answer usually already exists. be proactive. prevention beats correction; risk management beats issue management; \"what
