and<\/strong> for a stage → work accumulating there; that stage is the bottleneck.<\/li>\n<li><strong>Flat top band<\/strong> → nothing is being completed.<\/li>\n<li><strong>Flat bottom band<\/strong> → nothing new is entering.<\/li>\n<li><strong>Vertical distance<\/strong> between the entry and exit lines at a point in time = <strong>work in progress<\/strong>.<\/li>\n<li><strong>Horizontal distance<\/strong> between the two lines = <strong>average cycle time<\/strong>.<\/li>\n<li><strong>Parallel, evenly spaced bands<\/strong> = stable flow. That is the goal.<\/li>\n<\/ul>\n<h2 id=\"s13-h9\">17.9 Agile forecasting<\/h2>\n<p><strong>Problem.<\/strong> 340 story points remain. Velocities over the last five two-week sprints: 24, 31, 28, 30, 27. The team costs $52,000 per sprint.<\/p>\n<p><strong>Step 1 — rolling average velocity.<\/strong> (24 + 31 + 28 + 30 + 27) ÷ 5 = <strong>28<\/strong>\n<strong>Step 2 — sprints remaining.<\/strong> 340 ÷ 28 = 12.1 → <strong>13 sprints<\/strong>\n<strong>Step 3 — duration.<\/strong> 13 × 2 weeks = <strong>26 weeks<\/strong>\n<strong>Step 4 — cost.<\/strong> 13 × 52,000 = <strong>$676,000<\/strong><\/p>\n<p><strong>Step 5 — give a range, not a point.<\/strong> Use the lowest and highest observed velocities:\n340 ÷ 31 = 11 sprints (optimistic) · 340 ÷ 24 = 15 sprints (pessimistic)\nReport <strong>11 to 15 sprints, most likely 13<\/strong>. A single-date agile forecast is a false promise.<\/p>\n<h2 id=\"s13-h10\">17.10 Financial comparison<\/h2>\n<p><strong>Problem.<\/strong> Three project options:\n| Option | NPV | IRR | Payback | Initial cost |\n|---|---|---|---|---|\n| A | $340,000 | 14% | 4.0 yrs | $500,000 |\n| B | $290,000 | 22% | 1.8 yrs | $200,000 |\n| C | $340,000 | 19% | 3.1 yrs | $450,000 |<\/p>\n<ul>\n<li><strong>On NPV alone:<\/strong> A and C tie at $340,000.<\/li>\n<li><strong>Tiebreak on IRR:<\/strong> C at 19% beats A at 14%. <strong>Choose C.<\/strong><\/li>\n<li><strong>If capital is constrained:<\/strong> B returns more per dollar invested and pays back fastest. With a hard capital limit of $250,000, B is the only feasible option.<\/li>\n<li><strong>Never choose on payback period alone<\/strong> — it ignores the time value of money and everything after the payback point.<\/li>\n<\/ul>\n<hr />", "subs": [{"t": "17.1 Reading a network diagram end to end", "a": "s13-h1"}, {"t": "17.2 A full earned value case", "a": "s13-h2"}, {"t": "17.3 Three-point estimating across a path", "a": "s13-h3"}, {"t": "17.4 Decision tree with EMV", "a": "s13-h4"}, {"t": "17.5 Contingency reserve from EMV", "a": "s13-h5"}, {"t": "17.6 FPIF contract arithmetic", "a": "s13-h6"}, {"t": "17.7 Reading a control chart", "a": "s13-h7"}, {"t": "17.8 Reading a cumulative flow diagram", "a": "s13-h8"}, {"t": "17.9 Agile forecasting", "a": "s13-h9"}, {"t": "17.10 Financial comparison", "a": "s13-h10"}], "text": " step-by-step methods for the calculation types that appear on the exam. learn the procedure ; the numbers change. 17.1 reading a network diagram end to end problem. activities: a (3 days, start) → b (5) and c (2); b → d (4); c → d; d → e (3, finish). find the critical path, the project duration and the float on c. step 1 — list every path. - a-b-d-e = 3 + 5 + 4 + 3 = 15 days - a-c-d-e = 3 + 2 + 4 + 3 = 12 days step 2 — the longest path is critical. a-b-d-e at 15 days. project duration = 15 days. step 3 — float on the non-critical path. 15 − 12 = 3 days of total float shared along a-c-d-e; since a, d and e are on the critical path with zero float, all 3 days sit on c . step 4 — forward pass (es = earliest start, ef = earliest finish, using ef = es + duration − 1): | activity | es | ef | |---|---|---| | a | 1 | 3 | | b | 4 | 8 | | c | 4 | 5 | | d | 9 | 12 | | e | 13 | 15 | d starts at 9 because it waits for b (the later predecessor), not c. step 5 — backward pass (ls = lf − duration + 1), starting from lf of e = 15: | activity | ls | lf | total float (ls − es) | |---|---|---|---| | e | 13 | 15 | 0 | | d | 9 | 12 | 0 | | c | 7 | 8 | 3 | | b | 4 | 8 | 0 | | a | 1 | 3 | 0 | common traps. using the earlier predecessor for a merge point. forgetting the −1/+1 when the convention is whole days. assuming only one critical path exists — two paths of equal length are both critical. 17.2 a full earned value case problem. a 12-month project, bac $960,000, planned to spend evenly. at the end of month 5, 35% of the work is complete and $420,000 has been spent. the overruns are expected to continue. step 1 — planned value. planned progress at month 5 = 5 ÷ 12 = 41.67%. pv = 0.4167 × 960,000 = $400,000 step 2 — earned value. ev = 0.35 × 960,000 = $336,000 step 3 — actual cost. ac = $420,000 step 4 — variances. cv = 336,000 − 420,000 = −$84,000 (over budget) sv = 336,000 − 400,000 = −$64,000 (behind schedule) step 5 — indices. cpi = 336,000 ÷ 420,000 = 0.80 spi = 336,000 ÷ 400,000 = 0.84 step 6 — forecast. overruns continue, so the typical formula applies: eac = bac ÷ cpi = 960,000 ÷ 0.80 = $1,200,000 etc = 1,200,000 − 420,000 = $780,000 vac = 960,000 − 1,200,000 = −$240,000 step 7 — is recovery realistic? tcpi to bac = (960,000 − 336,000) ÷ (960,000 − 420,000) = 624,000 ÷ 540,000 = 1.16 you have been running at 0.80 and would need 1.16 — a 45% improvement in cost efficiency. not credible. the correct action is to re-forecast, report the variance with the analysis, and present options to the sponsor. if the overrun had been a one-off (say a single customs charge), the atypical formula applies instead: eac = ac + (bac − ev) = 420,000 + 624,000 = $1,044,000 if schedule pressure is also driving cost: eac = ac + [(bac − ev) ÷ (cpi × spi)] = 420,000 + (624,000 ÷ 0.672) = 420,000 + 928,571 = $1,348,571 which formula the exam wants is signalled by the wording: \"current performance will continue\" → bac ÷ cpi. \"the variance was atypical / will not recur\" → ac + (bac − ev). \"both cost and schedule performance affect the remainder\" → the cpi × spi version. 17.3 three-point estimating across a path problem. three sequential activities: | activity | o | m | p | |---|---|---|---| | x | 4 | 6 | 14 | | y | 10 | 12 | 20 | | z | 6 | 9 | 18 | step 1 — pert each activity. (o + 4m + p) ÷ 6 x = (4 + 24 + 14) ÷ 6 = 7 y = (10 + 48 + 20) ÷ 6 = 13 z = (6 + 36 + 18) ÷ 6 = 10 path mean = 7 + 13 + 10 = 30 days step 2 — standard deviation each. (p − o) ÷ 6 x = 10 ÷ 6 = 1.67 · y = 10 ÷ 6 = 1.67 · z = 12 ÷ 6 = 2.00 step 3 — variances (σ²). 2.78 + 2.78 + 4.00 = 9.56 step 4 — path standard deviation. √9.56 = 3.09 days step 5 — confidence ranges. 68.27%: 30 ± 3.09 → 26.9 to 33.1 days 95.45%: 30 ± 6.18 → 23.8 to 36.2 days 99.73%: 30 ± 9.27 → 20.7 to 39.3 days the critical point: variances add, standard deviations do not. adding 1.67 + 1.67 + 2.00 = 5.34 is wrong. 17.4 decision tree with emv problem. build in-house or buy? - build: costs $400,000. 70% chance it works first time (value $1,200,000); 30% chance of rework costing a further $250,000 (value still $1,200,000). - buy: costs $650,000. 90% chance of smooth integration (value $1,200,000); 10% chance of integration problems costing $100,000 (value $1,200,000). step 1 — expected cost of each branch. build: 400,000 + (0.30 × 250,000) = 400,000 + 75,000 = $475,000 buy: 650,000 + (0.10 × 100,000) = 650,000 + 10,000 = $660,000 step 2 — expected net value. build: 1,200,000 − 475,000 = $725,000 buy: 1,200,000 − 660,000 = $540,000 step 3 — decide. build has the higher expected value. but check against risk appetite: the build branch has a 30% chance of a visible overrun. if the organisation's appetite is low or the overrun would breach a threshold, the lower-variance option may still be chosen. emv informs the decision; it does not make it. 17.5 contingency reserve from emv problem. risk register: | risk | probability | impact | |---|---|---| | supplier delay | 30% | −$90,000 | | rework from spec change | 45% | −$40,000 | | currency movement | 20% | −$150,000 | | early vendor discount | 35% | +$60,000 | step 1 — emv per risk. −27,000 · −18,000 · −30,000 · +21,000 step 2 — sum. −27,000 − 18,000 − 30,000 + 21,000 = −$54,000 step 3 — interpretation. the indicated contingency reserve is $54,000 . note that it covers the portfolio of risks, not any single one — if the currency risk alone occurs, it consumes $150,000 and the reserve is inadequate. that is why reserve analysis and monte carlo simulation are used on larger projects, and why reserve consumption is monitored against progress. 17.6 fpif contract arithmetic problem. target cost $400,000 · target fee $40,000 · target price $440,000 · ceiling price $500,000 · share ratio 75/25 (buyer/seller). point of total assumption: pta = ((ceiling − target price) ÷ buyer's share) + target cost pta = ((500,000 − 440,000) ÷ 0.75) + 400,000 = 80,000 + 400,000 = $480,000 above an actual cost of $480,000 the seller absorbs every further dollar. case a — underrun. actual cost $370,000. saving = 30,000. seller's share = 25% = $7,500. fee = 40,000 + 7,500 = $47,500. final price = 370,000 + 47,500 = $417,500. case b — overrun. actual cost $450,000. overrun = 50,000. seller absorbs 25% = $12,500. fee = 40,000 − 12,500 = $27,500. final price = 450,000 + 27,500 = $477,500 (below the ceiling). case c — heavy overrun. actual cost $520,000. computed price would exceed the ceiling, so the final price is capped at $500,000 . the seller's effective fee is negative: they are paid $500,000 against $520,000 of cost, losing $20,000. 17.7 reading a control chart given a process with a mean of 50, upper control limit 56, lower control limit 44, and customer specification limits of 40 and 60: any point outside 44–56 → out of control. investigate the assignable cause. seven consecutive points above or below 50 → out of control even if all are within limits (the rule of seven). the process has shifted. a point at 58 → inside the specification limits but outside the control limits. the customer would accept the unit, but the process is unstable and will eventually produce defects. act on it. specification limits narrower than control limits → the process is not capable of meeting the requirement; no amount of inspection fixes that. the process must be improved. 17.8 reading a cumulative flow diagram widening band for a stage → work accumulating there; that stage is the bottleneck. flat top band → nothing is being completed. flat bottom band → nothing new is entering. vertical distance between the entry and exit lines at a point in time = work in progress . horizontal distance between the two lines = average cycle time . parallel, evenly spaced bands = stable flow. that is the goal. 17.9 agile forecasting problem. 340 story points remain. velocities over the last five two-week sprints: 24, 31, 28, 30, 27. the team costs $52,000 per sprint. step 1 — rolling average velocity. (24 + 31 + 28 + 30 + 27) ÷ 5 = 28 step 2 — sprints remaining. 340 ÷ 28 = 12.1 → 13 sprints step 3 — duration. 13 × 2 weeks = 26 weeks step 4 — cost. 13 × 52,000 = $676,000 step 5 — give a range, not a point. use the lowest and highest observed velocities: 340 ÷ 31 = 11 sprints (optimistic) · 340 ÷ 24 = 15 sprints (pessimistic) report 11 to 15 sprints, most likely 13 . a single-date agile forecast is a false promise. 17.10 financial comparison problem. three project options: | option | npv | irr | payback | initial cost | |---|---|---|---|---| | a | $340,000 | 14% | 4.0 yrs | $500,000 | | b | $290,000 | 22% | 1.8 yrs | $200,000 | | c | $340,000 | 19% | 3.1 yrs | $450,000 | on npv alone: a and c tie at $340,000. tiebreak on irr: c at 19% beats a at 14%. choose c. if capital is constrained: b returns more per dollar invested and pays back fastest. with a hard capital limit of $250,000, b is the only feasible option. never choose on payback period alone — it ignores the time value of money and everything after the payback point. "}, {"id": "s14", "title": "Part 18 — ECO self-assessment", "html": "<p>Rate yourself on every task before booking. <strong>1 = could not explain it · 2 = recognise it · 3 = can explain it · 4 = can apply it under exam pressure.<\/strong> Anything below 3 is a study target. Revisit after each mock.<\/p>\n<h2 id=\"s14-h1\">People (33%)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Rate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Develop and maintain a common vision; diagnose misalignment at root cause<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Identify conflict sources, analyse context, apply the right resolution mode<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Establish ground rules and manage violations<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Set team expectations, empower the team, define roles and responsibilities<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Choose an appropriate leadership style for the situation and the person<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Represent the team's voice and support varied experience and perspectives<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Identify, analyse and prioritise stakeholders<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Tailor communication to stakeholder needs; execute the engagement plan<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Build trust and influence without formal authority<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Align and manage internal and external customer expectations<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Monitor customer satisfaction and respond<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Identify critical knowledge; enable tacit and explicit knowledge transfer<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Define a communication strategy and establish feedback loops<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Understand reporting requirements and support governance reporting<\/td>\n<td>☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s14-h2\">Process (41%)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Rate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Assess complexity and recommend a development approach and execution strategy<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Create and maintain an integrated project management plan<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Estimate effort and resources; assess plans for dependencies and gaps<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Define scope, obtain agreement and decompose it (WBS or backlog)<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Identify value components; prioritise by value; deliver incrementally<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Verify that a benefits measurement system exists<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Plan and optimise resources, including physical resources<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Plan procurement, select contract types, negotiate and manage suppliers<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Analyse financial needs; quantify contingency; track spend; manage reserves<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Gather quality requirements; manage cost of quality and sustainability<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Ensure regulatory compliance within quality planning<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Prepare, baseline and control the schedule for the chosen approach<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Develop metrics; create, maintain and make artifacts accessible<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Measure progress, communicate status and analyse variance<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Manage closure: acceptance, transition readiness, procurement and financial closeout<\/td>\n<td>☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s14-h3\">Business Environment (26%)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Rate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Establish governance structure, rules, reporting, ethics and policies<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Define success metrics and escalation paths and thresholds<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Confirm, classify and measure compliance requirements<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Analyse threats to compliance and the consequences of non-compliance<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Execute integrated change control and communicate change status<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Evaluate, prioritise and remove impediments; manage the issue log<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Recognise when a risk becomes an issue<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Identify, analyse, respond to and monitor risk, including security and sustainability<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Apply lessons learned and update organisational process assets<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Assess organisational culture and the impact of organisational change<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Survey and prioritise external environment changes affecting scope and backlog<\/td>\n<td>☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s14-h4\">Cross-cutting<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Capability<\/th>\n<th>Rate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Recall every formula without notes<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Apply the PMI mindset consistently under time pressure<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Switch correctly between predictive, adaptive and hybrid framing<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Read and answer case-study sets efficiently<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Interpret charts and diagrams (control chart, CFD, burnup, network, tornado)<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>Handle AI and sustainability scenarios<\/td>\n<td>☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />", "subs": [{"t": "People (33%)", "a": "s14-h1"}, {"t": "Process (41%)", "a": "s14-h2"}, {"t": "Business Environment (26%)", "a": "s14-h3"}, {"t": "Cross-cutting", "a": "s14-h4"}], "text": " rate yourself on every task before booking. 1 = could not explain it · 2 = recognise it · 3 = can explain it · 4 = can apply it under exam pressure. anything below 3 is a study target. revisit after each mock. people (33%) task rate develop and maintain a common vision; diagnose misalignment at root cause ☐ identify conflict sources, analyse context, apply the right resolution mode ☐ establish ground rules and manage violations ☐ set team expectations, empower the team, define roles and responsibilities ☐ choose an appropriate leadership style for the situation and the person ☐ represent the team's voice and support varied experience and perspectives ☐ identify, analyse and prioritise stakeholders ☐ tailor communication to stakeholder needs; execute the engagement plan ☐ build trust and influence without formal authority ☐ align and manage internal and external customer expectations ☐ monitor customer satisfaction and respond ☐ identify critical knowledge; enable tacit and explicit knowledge transfer ☐ define a communication strategy and establish feedback loops ☐ understand reporting requirements and support governance reporting ☐ process (41%) task rate assess complexity and recommend a development approach and execution strategy ☐ create and maintain an integrated project management plan ☐ estimate effort and resources; assess plans for dependencies and gaps ☐ define scope, obtain agreement and decompose it (wbs or backlog) ☐ identify value components; prioritise by value; deliver incrementally ☐ verify that a benefits measurement system exists ☐ plan and optimise resources, including physical resources ☐ plan procurement, select contract types, negotiate and manage suppliers ☐ analyse financial needs; quantify contingency; track spend; manage reserves ☐ gather quality requirements; manage cost of quality and sustainability ☐ ensure regulatory compliance within quality planning ☐ prepare, baseline and control the schedule for the chosen approach ☐ develop metrics; create, maintain and make artifacts accessible ☐ measure progress, communicate status and analyse variance ☐ manage closure: acceptance, transition readiness, procurement and financial closeout ☐ business environment (26%) task rate establish governance structure, rules, reporting, ethics and policies ☐ define success metrics and escalation paths and thresholds ☐ confirm, classify and measure compliance requirements ☐ analyse threats to compliance and the consequences of non-compliance ☐ execute integrated change control and communicate change status ☐ evaluate, prioritise and remove impediments; manage the issue log ☐ recognise when a risk becomes an issue ☐ identify, analyse, respond to and monitor risk, including security and sustainability ☐ apply lessons learned and update organisational process assets ☐ assess organisational culture and the impact of organisational change ☐ survey and prioritise external environment changes affecting scope and backlog ☐ cross-cutting capability rate recall every formula without notes ☐ apply the pmi mindset consistently under time pressure ☐ switch correctly between predictive, adaptive and hybrid framing ☐ read and answer case-study sets efficiently ☐ interpret charts and diagrams (control chart, cfd, burnup, network, tornado) ☐ handle ai and sustainability scenarios ☐ "}, {"id": "s15", "title": "Part 19 — The 30-day final sprint", "html": "<p>For the last month before the exam, once you have already covered the material. Roughly 2 hours a day.<\/p>\n<h2 id=\"s15-h1\">Week 1 — diagnose and rebuild<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Focus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Full 180-question exam simulation, cold, timed. Do not study first. Record the domain breakdown.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Error log the whole mock. Categorise each miss: knowledge, mindset, misread or rushed.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Weakest domain — re-read the guide part, then drill 50 questions from that bank.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Second weakest domain — same pattern.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Formulas: write the whole sheet from blank paper. Then the Formulas flashcard deck and 25 calculation questions.<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Mindset: Part 8 plus the scenario playbook. Drill 50 situational questions, writing one line of reasoning for each.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Rest, or light flashcards only.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s15-h2\">Week 2 — Business Environment and agile<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Focus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>8<\/td>\n<td>Governance, PMO types, escalation thresholds, success metrics. Drill the governance bank.<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Compliance end to end, plus the consequences of non-compliance.<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Risk: full process, all ten response strategies, secondary and residual risk, EMV and decision trees.<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Change control, issues and impediments. Predictive versus agile versus hybrid handling of the same change.<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Scrum, Kanban, XP, metrics and servant leadership. Drill the agile banks.<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Hybrid design: where governance sits, how reporting translates, how contracts adapt.<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Mock exam 2, timed. Compare the domain breakdown with day 1.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s15-h3\">Week 3 — Process depth and endurance<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Focus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>15<\/td>\n<td>Scope: requirements, RTM, WBS, validate versus control, scope creep.<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>Schedule: network diagrams, float, compression, levelling versus smoothing. Work Part 17.1 twice.<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>Cost and finance: baselines, reserves, funding reconciliation, NPV/IRR/BCR.<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>Quality: cost of quality, control charts, Pareto, audits, prevention over inspection.<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>Procurement: all contract types, PTA, source selection, agile contracting.<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>People: conflict, motivation theories, Tuckman, EI, stakeholder analysis models.<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>Full 180-question exam simulation, timed, with breaks.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s15-h4\">Week 4 — consolidate and taper<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Focus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22<\/td>\n<td>Error log review across all mocks. Look for repeated <em>patterns<\/em>, not individual facts.<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>Drill every flagged question. Clear the ones you now know.<\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>AI, sustainability, value delivery, benefits management.<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>Models, methods and artifacts (Part 12). Flashcard the glossary and acronyms.<\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>Mixed custom quiz, 100 questions, all banks, exam mode.<\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>Weakest remaining bank, drilled to 85%.<\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>Light: formulas, mindset rules, the scenario playbook. No new material.<\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>Logistics: confirm the test centre or run the OnVUE system test. ID ready. Sleep early.<\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>Rest. Nothing heavier than a flashcard skim in the morning. Exam.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Rules for the sprint.<\/strong> No new resources after day 1 — switching courses now costs more than it gains. Every mock is timed and uninterrupted. The error log is the centre of the whole month; if you only do one thing, do that.<\/p>\n<hr />", "subs": [{"t": "Week 1 — diagnose and rebuild", "a": "s15-h1"}, {"t": "Week 2 — Business Environment and agile", "a": "s15-h2"}, {"t": "Week 3 — Process depth and endurance", "a": "s15-h3"}, {"t": "Week 4 — consolidate and taper", "a": "s15-h4"}], "text": " for the last month before the exam, once you have already covered the material. roughly 2 hours a day. week 1 — diagnose and rebuild day focus 1 full 180-question exam simulation, cold, timed. do not study first. record the domain breakdown. 2 error log the whole mock. categorise each miss: knowledge, mindset, misread or rushed. 3 weakest domain — re-read the guide part, then drill 50 questions from that bank. 4 second weakest domain — same pattern. 5 formulas: write the whole sheet from blank paper. then the formulas flashcard deck and 25 calculation questions. 6 mindset: part 8 plus the scenario playbook. drill 50 situational questions, writing one line of reasoning for each. 7 rest, or light flashcards only. week 2 — business environment and agile day focus 8 governance, pmo types, escalation thresholds, success metrics. drill the governance bank. 9 compliance end to end, plus the consequences of non-compliance. 10 risk: full process, all ten response strategies, secondary and residual risk, emv and decision trees. 11 change control, issues and impediments. predictive versus agile versus hybrid handling of the same change. 12 scrum, kanban, xp, metrics and servant leadership. drill the agile banks. 13 hybrid design: where governance sits, how reporting translates, how contracts adapt. 14 mock exam 2, timed. compare the domain breakdown with day 1. week 3 — process depth and endurance day focus 15 scope: requirements, rtm, wbs, validate versus control, scope creep. 16 schedule: network diagrams, float, compression, levelling versus smoothing. work part 17.1 twice. 17 cost and finance: baselines, reserves, funding reconciliation, npv/irr/bcr. 18 quality: cost of quality, control charts, pareto, audits, prevention over inspection. 19 procurement: all contract types, pta, source selection, agile contracting. 20 people: conflict, motivation theories, tuckman, ei, stakeholder analysis models. 21 full 180-question exam simulation, timed, with breaks. week 4 — consolidate and taper day focus 22 error log review across all mocks. look for repeated patterns , not individual facts. 23 drill every flagged question. clear the ones you now know. 24 ai, sustainability, value delivery, benefits management. 25 models, methods and artifacts (part 12). flashcard the glossary and acronyms. 26 mixed custom quiz, 100 questions, all banks, exam mode. 27 weakest remaining bank, drilled to 85%. 28 light: formulas, mindset rules, the scenario playbook. no new material. 29 logistics: confirm the test centre or run the onvue system test. id ready. sleep early. 30 rest. nothing heavier than a flashcard skim in the morning. exam. rules for the sprint. no new resources after day 1 — switching courses now costs more than it gains. every mock is timed and uninterrupted. the error log is the centre of the whole month; if you only do one thing, do that. "}], "banks": [{"id": "b_people", "title": "People domain", "group": "core", "qs": [{"id": "1", "q": "Three new members join a team that had been delivering consistently for six months. Within two weeks, disagreements about technical approach increase sharply. What is happening?", "o": ["The team is under-resourced", "The team has regressed to the storming stage", "The new members are underperforming", "The project manager has lost authority"], "a": 1, "e": "Tuckman's stages restart when membership changes; a performing team reverts to forming/storming. ---"}, {"id": "2", "q": "A senior stakeholder repeatedly gives instructions directly to developers that contradict the agreed plan. Work is slipping. What should the project manager do?", "o": ["Instruct the team to ignore the stakeholder", "Escalate to the sponsor immediately", "Meet the stakeholder to review roles, authority and the impact of the conflicting direction", "Update the plan to match the stakeholder's instructions"], "a": 2, "e": "Address the person directly first; escalation and plan changes both come later, if at all. ---"}, {"id": "3", "q": "Two team members disagree strongly about a design decision and the argument is becoming personal. The project manager has time available. Which conflict approach is best?", "o": ["Withdraw and let them settle it", "Force a decision based on the PM's technical view", "Collaborate — facilitate a discussion to find the underlying concerns and a solution both accept", "Compromise — take half of each proposal"], "a": 2, "e": "Collaborating/problem-solving is PMI's preferred approach when time and willingness exist. ---"}, {"id": "4", "q": "A project manager notices a normally vocal team member has stopped contributing in meetings since a difficult sprint review. What should the PM do first?", "o": ["Raise it in the next retrospective", "Speak with the person privately to understand what has changed", "Reassign them to less visible work", "Report the change to their functional manager"], "a": 1, "e": "Private, direct, empathetic conversation; raising it publicly or going to their manager are both wrong. ---"}, {"id": "5", "q": "Which stakeholder analysis tool shows the difference between where a stakeholder is and where they need to be?", "o": ["Power/interest grid", "Salience model", "Stakeholder engagement assessment matrix", "RACI chart"], "a": 2, "e": "It plots current (C) against desired (D) engagement across unaware/resistant/neutral/supportive/leading. ---"}, {"id": "6", "q": "A stakeholder with high power and low interest has been sending occasional critical emails. How should they be managed?", "o": ["Manage closely with detailed weekly reports", "Keep satisfied — concise, high-level updates and prompt responses to concerns", "Monitor with minimal effort", "Keep informed through the project wiki"], "a": 1, "e": "High power, low interest = keep satisfied; over-communicating detail irritates them. ---"}, {"id": "7", "q": "The project manager wants to transfer critical expertise held by one senior engineer who is due to rotate off the project. What is the most effective approach?", "o": ["Ask the engineer to write a detailed handover document", "Record a video walkthrough of the system", "Pair the engineer with successors for several weeks and hold knowledge-sharing sessions", "Add the engineer's notes to the lessons learned repository"], "a": 2, "e": "The knowledge at risk is tacit; tacit knowledge transfers through interaction, not documents. ---"}, {"id": "8", "q": "During a daily stand-up, a developer reports being blocked by another department for three days. What should the Scrum Master do?", "o": ["Assign the task to another developer", "Record it in the risk register", "Work to remove the impediment, escalating to the other department's manager if needed", "Extend the sprint to accommodate the delay"], "a": 2, "e": "Removing impediments is the core servant-leadership duty; sprints are never extended. ---"}, {"id": "9", "q": "A project manager must deliver bad news about a six-week delay to the customer. Which communication method is most appropriate?", "o": ["Email with a detailed variance analysis attached", "Post the revised schedule on the project portal", "A face-to-face or video meeting, followed by written confirmation", "Include it in the next monthly status report"], "a": 2, "e": "Sensitive, complex news requires interactive communication; written follow-up records it. ---"}, {"id": "10", "q": "A team of 7 grows to 11. How many additional communication channels are created?", "o": ["4", "21", "34", "55"], "a": 2, "e": "11×10/2 = 55; 7×6/2 = 21; 55 − 21 = **34**. ---"}, {"id": "11", "q": "A functional manager pulls a key resource off the project without notice. What should the project manager do first?", "o": ["Escalate to the sponsor", "Review the resource management plan and the agreed commitments, then negotiate with the functional manager", "Recruit a contractor", "Re-baseline the schedule"], "a": 1, "e": "Consult the plan, then negotiate directly; escalation follows if negotiation fails. ---"}, {"id": "12", "q": "Which motivation theory best explains why a salary increase failed to improve a bored team's engagement?", "o": ["Maslow's hierarchy of needs", "Herzberg's two-factor theory", "McGregor's Theory X", "Vroom's expectancy theory"], "a": 1, "e": "Salary is a hygiene factor: it prevents dissatisfaction but does not motivate. ---"}, {"id": "13", "q": "A project manager has strong technical credibility with the team but no authority to reward or penalise. Which form of power is being used?", "o": ["Formal", "Referent", "Expert", "Reward"], "a": 2, "e": "Expert power derives from knowledge and is the most effective form for a PM. ---"}, {"id": "14", "q": "The team charter is being drafted. Who should create it?", "o": ["The project manager alone", "The sponsor", "The team, facilitated by the project manager", "The PMO, using the standard template"], "a": 2, "e": "Ownership by the team is what makes ground rules enforceable. ---"}, {"id": "15", "q": "A remote team member in a different time zone consistently misses the daily stand-up. What is the best response?", "o": ["Remove them from the stand-up", "Require them to attend regardless", "Discuss with the team and adjust the meeting time or format to accommodate the time zone", "Ask them to send written updates instead of attending"], "a": 2, "e": "Virtual teams need deliberate accommodation; the team adapts the practice. ---"}, {"id": "16", "q": "A key stakeholder is classified as \"resistant\" but needs to be \"supportive\". What is the first step?", "o": ["Increase the frequency of status reports to them", "Meet them privately to understand the reason for their resistance", "Ask the sponsor to instruct them to cooperate", "Exclude them from decisions to avoid obstruction"], "a": 1, "e": "Understand the cause before acting; resistance usually has a reason worth hearing. ---"}, {"id": "17", "q": "Which statement about servant leadership is correct?", "o": ["The leader assigns tasks and monitors completion", "The leader removes obstacles and enables the team to self-organise", "The leader makes all technical decisions to ensure consistency", "The leader reports individual performance to management weekly"], "a": 1, "e": "Serving, enabling and removing impediments define the role. ---"}, {"id": "18", "q": "A project manager discovers that a team member has been overstating progress in status updates. What should the PM do first?", "o": ["Report the behaviour to HR", "Discuss it privately with the team member to understand why and correct the reporting", "Remove reporting responsibility from them", "Escalate to the sponsor as a governance issue"], "a": 1, "e": "Address it directly and privately first; the cause may be pressure or fear, not dishonesty. ---"}, {"id": "19", "q": "Which technique gathers anonymous input from experts across several rounds to avoid dominance by senior voices?", "o": ["Brainstorming", "Nominal group technique", "Delphi technique", "Focus group"], "a": 2, "e": "Delphi uses anonymity and iteration to build consensus. ---"}, {"id": "20", "q": "During a retrospective, the same complaint appears for the fourth time with no action taken. What is the underlying problem?", "o": ["The team lacks discipline", "Retrospective actions are not being owned, tracked and implemented", "The retrospective is too long", "The Scrum Master is not directive enough"], "a": 1, "e": "Retrospectives must produce owned, tracked improvements or they are theatre. ---"}, {"id": "21", "q": "Two project managers need the same specialist in the same week. What should they do?", "o": ["Escalate to the PMO immediately", "Negotiate between themselves based on priority, criticality and float, then escalate only if unresolved", "The PM with the more senior sponsor takes the resource", "Split the resource 50/50"], "a": 1, "e": "Negotiate first; escalate with a recommendation if agreement fails. ---"}, {"id": "22", "q": "A vendor's team and the internal team are blaming each other for integration defects. What should the PM do first?", "o": ["Invoke the contract's penalty clause", "Bring both parties together to analyse root causes of the defects collaboratively", "Replace the vendor", "Assign all integration work internally"], "a": 1, "e": "Collaborate on root cause; contractual escalation is a later, costlier step. ---"}, {"id": "23", "q": "Which is the best indicator that a project has a genuinely shared vision?", "o": ["The charter is signed", "The vision statement is displayed in the team area", "Separately questioned stakeholders describe the project's purpose consistently", "The kick-off meeting was well attended"], "a": 2, "e": "Shared understanding, not shared documentation, is the test. ---"}, {"id": "24", "q": "A high-performing team member is demotivated because the work has become repetitive. According to Herzberg, what would help?", "o": ["A bonus", "Improved office facilities", "Greater responsibility and more challenging work", "Clearer company policies"], "a": 2, "e": "Responsibility, achievement and growth are motivators; the others are hygiene factors. ---"}, {"id": "25", "q": "Stakeholders from three countries have conflicting expectations about reporting formality. What should the PM do?", "o": ["Use the format required by the largest stakeholder group", "Use the organisation's standard template for everyone", "Tailor communication approach and format per stakeholder group while keeping the underlying information consistent", "Ask the sponsor to decide"], "a": 2, "e": "Tailor form to the audience; never tailor the substance. ---"}, {"id": "26", "q": "A team member raises a concern about a design flaw but is dismissed by two senior colleagues. Over the next week they stop raising issues. What has been damaged?", "o": ["Team velocity", "Psychological safety", "The definition of done", "The communications management plan"], "a": 1, "e": "Without psychological safety, risks and defects stop surfacing. ---"}, {"id": "27", "q": "Which activity best demonstrates active listening?", "o": ["Preparing your response while the other person speaks", "Paraphrasing what was said and asking clarifying questions before responding", "Taking detailed notes silently", "Agreeing to avoid conflict"], "a": 1, "e": "Reflecting and clarifying confirms understanding. ---"}, {"id": "28", "q": "During sprint planning, the product owner pressures the team to commit to 20% more points than their average velocity. What should the Scrum Master do?", "o": ["Support the product owner to maximise value", "Remind the group that the developers determine how much work they can take into the sprint", "Split the difference at 10%", "Escalate to the sponsor"], "a": 1, "e": "Capacity commitment belongs to the developers; the PO owns order, not volume. ---"}, {"id": "29", "q": "A project manager needs to influence a stakeholder who reports to a different executive and has no obligation to cooperate. Which is the most effective approach?", "o": ["Use formal authority granted by the charter", "Build a relationship, understand their objectives and show how the project supports them", "Ask the sponsor to instruct them", "Document their non-cooperation in the issue log"], "a": 1, "e": "Influence through referent power and mutual interest works where authority does not exist. ---"}, {"id": "30", "q": "A team is co-located except for two members working remotely, who feel excluded from decisions. What should the PM do?", "o": ["Require the remote members to relocate", "Adopt practices that include remote members by default: video-first meetings, shared digital boards, written decision records", "Have the co-located team decide and inform the remote members", "Schedule a monthly visit"], "a": 1, "e": "Deliberate inclusion practices; ad hoc fixes do not address the structural exclusion. ---"}, {"id": "31", "q": "Which document records project-specific behaviours the team has agreed to, including meeting norms and conflict handling?", "o": ["Communications management plan", "Team charter", "Resource management plan", "Project charter"], "a": 1, "e": "The team charter holds ground rules and working agreements. ---"}, {"id": "32", "q": "A project manager gives detailed instructions to an experienced, competent but recently demotivated team member. Performance does not improve. What went wrong?", "o": ["The instructions were unclear", "The leadership style did not match the person's readiness — they needed support, not direction", "The team member should be replaced", "The task was too complex"], "a": 1, "e": "Situational leadership: high competence, low commitment calls for supporting, not directing. ---"}, {"id": "33", "q": "Which is the strongest sign that a conflict was genuinely resolved rather than smoothed over?", "o": ["Both parties stopped raising the issue", "Both parties agree on the solution and the underlying cause has been addressed", "The PM made a decision and both accepted it", "The team's velocity recovered"], "a": 1, "e": "Smoothing hides the issue; collaboration resolves the cause. ---"}, {"id": "34", "q": "A stakeholder who was never identified during initiation raises major objections in month four. What is the root failure?", "o": ["The change control process", "The communications plan", "Stakeholder identification was treated as a one-off activity rather than an iterative one", "The sponsor's engagement"], "a": 2, "e": "Stakeholder identification continues throughout the project. ---"}, {"id": "35", "q": "How should a project manager handle a team member from a culture where disagreeing with a senior person publicly is unacceptable?", "o": ["Require them to speak up in meetings like everyone else", "Provide alternative channels — private conversations, written input, anonymous feedback — to surface their views", "Accept that their input will be limited", "Assign them only technical tasks"], "a": 1, "e": "Adapt the channel to get the input; do not lose the perspective. ---"}, {"id": "36", "q": "What is the primary purpose of a project kick-off meeting?", "o": ["To assign tasks", "To establish shared understanding of purpose, scope, roles, approach and success criteria", "To review the budget", "To satisfy a PMO requirement"], "a": 1, "e": "Alignment is the point. ---"}, {"id": "37", "q": "A team consistently delivers on time but a recent engagement survey shows low morale and rising overtime. What should the PM do?", "o": ["Nothing — delivery is on target", "Address the sustainability of the pace with the team, adjust commitments and workload", "Introduce a bonus scheme", "Increase the sprint length"], "a": 1, "e": "Sustainable pace is an agile principle and a leading indicator of future failure. ---"}, {"id": "38", "q": "A project manager is asked by a senior executive to share confidential information about another project. What should they do?", "o": ["Share it, since the executive outranks them", "Politely decline and direct the executive to the appropriate owner of that information", "Share a summarised version", "Share it and note the disclosure in the issue log"], "a": 1, "e": "The Code of Ethics requires protecting confidential information regardless of who asks. ---"}, {"id": "39", "q": "Which is the best way to establish a feedback loop in project communications?", "o": ["Send a read receipt request on all emails", "Build in structured opportunities for recipients to confirm understanding and raise questions — reviews, retrospectives, check-ins, surveys", "Increase reporting frequency", "Publish all information to the portal"], "a": 1, "e": "A feedback loop requires two-way, structured confirmation. ---"}, {"id": "40", "q": "A resistant stakeholder's technical objection turns out to be correct. What should the project manager do?", "o": ["Proceed as planned to avoid appearing indecisive", "Acknowledge the objection, incorporate the correction through change control, and credit the stakeholder", "Quietly adjust the design", "Escalate the disagreement"], "a": 1, "e": "Being right matters more than being consistent; handle it through the process and build trust. ---"}, {"id": "41", "q": "A team member asks the PM directly what they should work on next in a self-organising agile team. What is the best response?", "o": ["Assign them the highest-priority backlog item", "Encourage them to pull the next item with the team based on the sprint goal and current work in progress", "Tell them to ask the product owner", "Escalate to the Scrum Master"], "a": 1, "e": "Self-organising teams pull work; the PM does not assign it. ---"}, {"id": "42", "q": "Which of these best defines emotional intelligence in a project context?", "o": ["Avoiding conflict with stakeholders", "Recognising and managing your own and others' emotions to guide behaviour and relationships", "Being popular with the team", "Suppressing emotional reactions during pressure"], "a": 1, "e": "Awareness and regulation, not suppression or popularity. ---"}, {"id": "43", "q": "A senior stakeholder frequently changes priorities, causing team churn. What should the PM do first?", "o": ["Refuse further changes", "Analyse the pattern and impact, then meet the stakeholder with data on the cost of churn and agree a decision cadence", "Escalate to the PMO", "Add buffer to every iteration"], "a": 1, "e": "Bring evidence to the person; agree a working arrangement. ---"}, {"id": "44", "q": "In a matrix organisation, a team member's functional manager assigns them operational work that conflicts with project deadlines. What is the best first action?", "o": ["Escalate to the sponsor", "Have the team member refuse the operational work", "Discuss with the functional manager, referencing the agreed resource commitments and the project impact", "Re-plan the schedule around the reduced availability"], "a": 2, "e": "Negotiate with the person who controls the resource before escalating or re-planning. ---"}, {"id": "45", "q": "What should a project manager do when a team member's performance issue stems from a skill gap?", "o": ["Replace them", "Provide training, coaching or pairing, and adjust assignments while they build the skill", "Report it in the project performance appraisal", "Reduce their workload permanently"], "a": 1, "e": "Developing the team is an explicit PM responsibility. ---"}, {"id": "46", "q": "What best describes the difference between team performance assessments and project performance appraisals?", "o": ["They are the same thing", "Assessments evaluate the team's effectiveness to improve it; appraisals evaluate individuals for HR purposes", "Assessments are conducted by HR; appraisals by the PM", "Assessments are annual; appraisals are per sprint"], "a": 1, "e": "Know the distinction; it is commonly tested. ---"}, {"id": "47", "q": "A project manager wants to keep the shared vision current as the market shifts. What is the best practice?", "o": ["Restate the vision in every status report", "Re-validate the vision with key stakeholders at phase gates, major changes and release planning", "Lock the vision at the charter stage for stability", "Delegate vision maintenance to the product owner"], "a": 1, "e": "Vision is revisited at defined points, not frozen and not constantly restated. ---"}, {"id": "48", "q": "Which is the best example of an information radiator?", "o": ["A weekly status email to stakeholders", "A large, always-visible task board and burndown chart in the team space, updated by the team", "A monthly steering committee deck", "A shared folder of project documents"], "a": 1, "e": "Big, visible, current and self-updating. ---"}, {"id": "49", "q": "A project manager must build trust quickly with a sceptical client team after a previous project failed. What is most effective?", "o": ["Present an ambitious plan showing rapid delivery", "Make small, specific commitments and meet them consistently, communicating openly about issues", "Emphasise the PM's credentials and experience", "Avoid discussing the previous failure"], "a": 1, "e": "Trust is built through demonstrated reliability and transparency. ---"}, {"id": "50", "q": "A stakeholder demands weekly one-hour briefings that duplicate information already in the published dashboard. What should the PM do?", "o": ["Refuse, citing efficiency", "Comply to preserve the relationship", "Meet them to understand what need the briefing serves, then agree a format that meets it efficiently", "Delegate the briefings to a team member"], "a": 2, "e": "The stated request is not the underlying need; understand it, then tailor. --- ## 9.2 Process domain (60 questions)"}], "domain": "people"}, {"id": "b_process", "title": "Process domain", "group": "core", "qs": [{"id": "51", "q": "A project has BAC $400,000, EV $180,000, AC $200,000, PV $200,000. What is the CPI?", "o": ["0.80", "0.90", "1.11", "1.00"], "a": 1, "e": "CPI = EV ÷ AC = 180,000 ÷ 200,000 = 0.90. ---"}, {"id": "52", "q": "Using the data in question 51, what is the EAC assuming current cost performance continues?", "o": ["$360,000", "$400,000", "$444,444", "$420,000"], "a": 2, "e": "EAC = BAC ÷ CPI = 400,000 ÷ 0.90 = $444,444. ---"}, {"id": "53", "q": "Which document authorises the project and the project manager's authority?", "o": ["Project management plan", "Business case", "Project charter", "Scope statement"], "a": 2, "e": "The charter, issued by the sponsor. ---"}, {"id": "54", "q": "Who should issue the project charter?", "o": ["The project manager", "The sponsor or an initiator external to the project", "The PMO", "The customer"], "a": 1, "e": "The PM may draft it but cannot authorise their own authority. ---"}, {"id": "55", "q": "A deliverable has passed internal testing. What happens next?", "o": ["It is closed out", "Validate scope — obtain formal acceptance from the customer", "Control quality", "It is added to the lessons learned register"], "a": 1, "e": "Control quality (internal) precedes validate scope (customer acceptance). ---"}, {"id": "56", "q": "Which is the correct definition of the scope baseline?", "o": ["The WBS only", "The scope statement, WBS and WBS dictionary", "The requirements documentation and RTM", "The scope statement and the schedule"], "a": 1, "e": "All three components. ---"}, {"id": "57", "q": "The 100% rule states that:", "o": ["All team members must be 100% allocated", "The WBS includes 100% of the work defined by the project scope, and nothing more", "100% of requirements must be traceable", "Quality must be 100% conforming"], "a": 1, "e": "Anything not in the WBS is out of scope. ---"}, {"id": "58", "q": "A project has two paths: A→B→C = 22 days and A→D→C = 17 days. What is the total float on D?", "o": ["0 days", "5 days", "17 days", "22 days"], "a": 1, "e": "22 − 17 = 5 days of float on the non-critical path. ---"}, {"id": "59", "q": "The sponsor asks for the project to finish two weeks earlier and has approved additional budget. Which technique fits best?", "o": ["Fast tracking", "Crashing", "Resource levelling", "Scope reduction"], "a": 1, "e": "Crashing adds resources and costs money; budget has been approved. ---"}, {"id": "60", "q": "Which schedule compression technique adds risk of rework without adding cost?", "o": ["Crashing", "Fast tracking", "Resource smoothing", "Critical chain buffering"], "a": 1, "e": "Fast tracking overlaps activities that were sequential. ---"}, {"id": "61", "q": "Which resource optimisation technique can change the critical path?", "o": ["Resource smoothing", "Resource levelling", "Fast tracking", "Parametric estimating"], "a": 1, "e": "Levelling respects resource limits and usually extends duration; smoothing works only within float. ---"}, {"id": "62", "q": "Optimistic 6, most likely 10, pessimistic 26. What is the PERT (beta) estimate?", "o": ["12", "14", "10", "13.5"], "a": 0, "e": "(6 + 40 + 26) ÷ 6 = 72 ÷ 6 = 12. ---"}, {"id": "63", "q": "Using question 62's values, what is the standard deviation?", "o": ["2.67", "3.33", "4.0", "5.0"], "a": 1, "e": "(26 − 6) ÷ 6 = 3.33. ---"}, {"id": "64", "q": "A risk is identified that could add $80,000 of cost with 25% probability. What contingency does EMV suggest?", "o": ["$80,000", "$25,000", "$20,000", "$0"], "a": 2, "e": "0.25 × 80,000 = $20,000. ---"}, {"id": "65", "q": "Which reserve is controlled by the project manager and sits inside the cost baseline?", "o": ["Management reserve", "Contingency reserve", "Profit margin", "Funding limit"], "a": 1, "e": "Contingency covers known unknowns and is inside the baseline. ---"}, {"id": "66", "q": "A cost estimate is required at initiation with minimal information. Which method is most appropriate?", "o": ["Bottom-up", "Parametric", "Analogous", "Three-point"], "a": 2, "e": "Analogous is fast, cheap, top-down and suitable when detail is unavailable. ---"}, {"id": "67", "q": "Which contract type places the most cost risk on the seller?", "o": ["Cost plus fixed fee", "Time and materials", "Firm fixed price", "Cost plus award fee"], "a": 2, "e": "The seller absorbs all cost overrun under FFP. ---"}, {"id": "68", "q": "FPIF contract: target cost $200,000, target fee $20,000, ceiling price $240,000, share ratio 80/20 buyer/seller. What is the PTA?", "o": ["$200,000", "$225,000", "$230,000", "$240,000"], "a": 1, "e": "((240,000 − 220,000) ÷ 0.80) + 200,000 = 25,000 + 200,000 = $225,000. ---"}, {"id": "69", "q": "Which document links each requirement to its origin and to the deliverable that satisfies it?", "o": ["WBS dictionary", "Requirements traceability matrix", "Scope statement", "Configuration management plan"], "a": 1, "e": "The RTM. ---"}, {"id": "70", "q": "During execution, the customer asks for an additional feature \"since it's small\". What should the project manager do?", "o": ["Add it to keep the customer happy", "Refuse because the scope is baselined", "Log a change request and assess the impact on all constraints before any decision", "Add it to the backlog for a future release without discussion"], "a": 2, "e": "Every change goes through the process; assessment precedes decision. ---"}, {"id": "71", "q": "What is gold plating?", "o": ["Delivering more than the requirements without authorisation", "Uncontrolled expansion of customer-requested scope", "Exceeding the quality standard agreed with the customer", "Using premium materials to reduce defects"], "a": 0, "e": "Team-initiated extras; always wrong. ---"}, {"id": "72", "q": "A team consistently finds defects only during customer acceptance. Which cost category is rising?", "o": ["Prevention", "Appraisal", "Internal failure", "External failure"], "a": 3, "e": "Defects found by the customer are external failure costs. ---"}, {"id": "73", "q": "A control chart shows seven consecutive points below the mean, all within control limits. What does this indicate?", "o": ["The process is in control", "The process is out of control and should be investigated", "The specification limits are too tight", "The sample size is too small"], "a": 1, "e": "The rule of seven. ---"}, {"id": "74", "q": "Which quality tool helps identify the small number of causes producing most defects?", "o": ["Control chart", "Scatter diagram", "Pareto diagram", "Histogram"], "a": 2, "e": "Pareto applies the 80/20 rule and orders causes by frequency. ---"}, {"id": "75", "q": "Which of these correctly distinguishes quality from grade?", "o": ["Grade is measured; quality is subjective", "Low grade may be acceptable; low quality is not", "Quality refers to features; grade refers to conformance", "They are interchangeable"], "a": 1, "e": "A low-grade product that fully meets its requirements is acceptable. ---"}, {"id": "76", "q": "A project manager needs to determine what resources are required and when. Which artifact shows availability?", "o": ["RACI chart", "Resource breakdown structure", "Resource calendar", "Resource histogram"], "a": 2, "e": "Calendars show availability; histograms show allocation. ---"}, {"id": "77", "q": "In a RACI chart, how many people should be \"Accountable\" for a single activity?", "o": ["At least two", "Exactly one", "As many as are involved", "None — accountability is collective"], "a": 1, "e": "Exactly one A per row. ---"}, {"id": "78", "q": "Which procurement document is used when the buyer needs a solution proposal for a complex requirement?", "o": ["RFI", "RFQ", "RFP", "Purchase order"], "a": 2, "e": "RFP for solution-based, complex procurement; RFQ is price-driven for defined items. ---"}, {"id": "79", "q": "A bidder emails the buyer asking a clarifying question during the tender period. What should the buyer do?", "o": ["Answer the bidder privately", "Ignore the question", "Share the question and answer with all bidders", "Disqualify the bidder for contacting the buyer"], "a": 2, "e": "Fairness requires all sellers receive the same information. ---"}, {"id": "80", "q": "What is the purpose of an independent cost estimate in procurement?", "o": ["To negotiate a lower price", "To benchmark seller proposals and detect unrealistic or inflated bids", "To satisfy audit requirements", "To determine the contract type"], "a": 1, "e": "A sanity check against the bids received. ---"}, {"id": "81", "q": "A vendor's deliverable is late and the contract has a liquidated damages clause. What should the PM do first?", "o": ["Invoke the clause", "Terminate the contract", "Meet the vendor to understand the cause and agree a recovery plan, while documenting the breach", "Escalate to legal"], "a": 2, "e": "Work the relationship and the recovery first; contractual remedies are documented but not the opening move. ---"}, {"id": "82", "q": "Work performance data becomes work performance information when it is:", "o": ["Collected from the team", "Analysed in context to support a decision", "Distributed to stakeholders", "Stored in the repository"], "a": 1, "e": "Data → analysed information → packaged reports. ---"}, {"id": "83", "q": "A project is 60% complete by schedule and 45% complete by work. SPI is:", "o": ["1.33", "0.75", "0.45", "Cannot be determined"], "a": 1, "e": "SPI = EV ÷ PV = 45% ÷ 60% = 0.75. ---"}, {"id": "84", "q": "Which formula gives the efficiency required on remaining work to finish at the original budget?", "o": ["(BAC − EV) ÷ (EAC − AC)", "(BAC − EV) ÷ (BAC − AC)", "BAC ÷ CPI", "EAC − AC"], "a": 1, "e": "TCPI to BAC. ---"}, {"id": "85", "q": "A project's TCPI to BAC is 1.28 and its current CPI is 0.82. What should the PM conclude?", "o": ["Performance is improving", "The original budget is very unlikely to be achieved; re-forecast and escalate", "The estimates were too conservative", "TCPI and CPI are unrelated"], "a": 1, "e": "Needing 1.28 while delivering 0.82 is not credible. ---"}, {"id": "86", "q": "What must happen before a project can be formally closed?", "o": ["All change requests are approved", "All deliverables are accepted, procurements closed, lessons captured and transition validated", "The final invoice is paid", "The team has been reassigned"], "a": 1, "e": "All closure activities; acceptance is necessary but not sufficient. ---"}, {"id": "87", "q": "A project is cancelled at the sponsor's direction in month five. What should the PM do?", "o": ["Stop work and release the team immediately", "Follow the closing process — document status, capture lessons, close procurements, archive records, release resources formally", "Archive the files and move on", "Request a post-implementation review in six months"], "a": 1, "e": "Cancelled projects are still formally closed. ---"}, {"id": "88", "q": "Which estimating technique uses a statistical relationship between historical data and other variables?", "o": ["Analogous", "Parametric", "Bottom-up", "Expert judgement"], "a": 1, "e": "For example, cost per square metre. ---"}, {"id": "89", "q": "What is a planning package?", "o": ["A completed work package", "Work within a control account that has known content but no detailed activities yet", "A bundle of change requests", "A set of templates from the PMO"], "a": 1, "e": "Used in rolling wave planning. ---"}, {"id": "90", "q": "Which dependency type must be respected because of physical or contractual necessity?", "o": ["Discretionary", "Mandatory", "External", "Internal"], "a": 1, "e": "Mandatory (hard logic); discretionary logic is what you break when fast-tracking. ---"}, {"id": "91", "q": "A project must comply with a new data protection regulation discovered mid-execution. What is the PM's first step?", "o": ["Continue and address compliance at the end", "Assess the impact on scope, schedule, cost and risk, then raise a change request and inform governance", "Escalate to the sponsor without analysis", "Stop the project"], "a": 1, "e": "Assess, then formalise through change control and governance. ---"}, {"id": "92", "q": "Which agile artifact corresponds most closely to the scope baseline in predictive projects?", "o": ["Sprint backlog", "Product backlog", "Increment", "Definition of done"], "a": 1, "e": "The product backlog holds the evolving scope. ---"}, {"id": "93", "q": "A team completed 34, 30, 28 and 32 points in the last four sprints. 310 points remain. Approximately how many sprints are left?", "o": ["8", "9", "10", "11"], "a": 2, "e": "Average velocity 31; 310 ÷ 31 = 10 sprints. ---"}, {"id": "94", "q": "Which technique would best help decide between three delivery options with different costs and uncertain outcomes?", "o": ["Pareto analysis", "Decision tree analysis using EMV", "Control chart", "Affinity diagram"], "a": 1, "e": "Decision trees compare options by expected monetary value. ---"}, {"id": "95", "q": "What is the purpose of a Monte Carlo simulation?", "o": ["To identify risks", "To produce a probability distribution of project cost or completion dates", "To prioritise the backlog", "To measure quality conformance"], "a": 1, "e": "Quantitative analysis producing confidence levels. ---"}, {"id": "96", "q": "Which tool shows which variables have the greatest influence on project outcomes?", "o": ["Tornado diagram (sensitivity analysis)", "Cumulative flow diagram", "Fishbone diagram", "Histogram"], "a": 0, "e": "Sensitivity analysis, displayed as a tornado diagram. ---"}, {"id": "97", "q": "The team discovers midway that an assumption in the plan is false. What should the PM do?", "o": ["Note it in the lessons learned register", "Update the assumption log, assess the impact, and raise a risk or change request as appropriate", "Ignore it if the schedule is unaffected", "Escalate to the sponsor immediately"], "a": 1, "e": "An invalidated assumption is a trigger for impact assessment. ---"}, {"id": "98", "q": "Which best defines a work package?", "o": ["The highest level of the WBS", "The lowest level of the WBS, where cost and duration are estimated", "A group of related activities in the schedule", "A deliverable accepted by the customer"], "a": 1, "e": "Below it come activities, which belong to the schedule. ---"}, {"id": "99", "q": "Which of these is a valid reason to select a predictive approach?", "o": ["The customer wants frequent feedback", "Requirements are stable and the cost of change is high", "The team is cross-functional and co-located", "Value can be delivered incrementally"], "a": 1, "e": "Stability and high cost of change favour predictive. ---"}, {"id": "100", "q": "A hybrid project uses sprints inside formal phase gates. Where does change control apply?", "o": ["To every backlog change", "At the phase boundary and for changes to committed scope, budget, date or contract", "Nowhere — agile removes change control", "Only at project closure"], "a": 1, "e": "Agile inside the boundary, governance at the boundary. ---"}, {"id": "101", "q": "A supplier delivers a component that meets the specification but not the customer's actual need. What went wrong?", "o": ["Quality control", "Requirements collection and validation", "Procurement administration", "Configuration management"], "a": 1, "e": "Conformance to a wrong requirement is a requirements failure. ---"}, {"id": "102", "q": "Which financial measure should drive project selection when options conflict?", "o": ["Payback period", "Net present value", "Total cost", "Number of benefits listed"], "a": 1, "e": "NPV accounts for the time value of money and total return. ---"}, {"id": "103", "q": "Two projects: A has NPV $250,000 and payback 5 years; B has NPV $180,000 and payback 2 years. Which should be selected on financial grounds alone?", "o": ["A", "B", "Either, they are equivalent", "Neither, more data is needed"], "a": 0, "e": "NPV outranks payback period. ---"}, {"id": "104", "q": "The project has spent $600,000 of a $1,000,000 budget and the business case is no longer viable. What should the PM recommend?", "o": ["Continue, since most of the budget is committed", "Reduce scope to fit the remaining budget", "Present the analysis to the sponsor with a recommendation to terminate", "Pause and revisit in six months"], "a": 2, "e": "Sunk cost is irrelevant; recommend termination if value is gone. ---"}, {"id": "105", "q": "Which is the correct sequence for handling a newly identified risk?", "o": ["Respond, analyse, record", "Record in the risk register, analyse qualitatively (and quantitatively if warranted), plan a response, assign an owner", "Escalate, then record", "Add contingency, then record"], "a": 1, "e": "Identify → record → analyse → respond → own → monitor. ---"}, {"id": "106", "q": "What is a workaround?", "o": ["A planned response to an identified risk", "An unplanned response to an issue that had no prior response plan", "A fallback plan", "A contingent response strategy"], "a": 1, "e": "Unplanned, reactive. ---"}, {"id": "107", "q": "A risk response creates a new risk. What is it called?", "o": ["Residual risk", "Secondary risk", "Contingent risk", "Fallback risk"], "a": 1, "e": "Secondary risk arises from implementing a response; residual risk is what remains after. ---"}, {"id": "108", "q": "Which is an example of transferring a threat?", "o": ["Adding redundancy to a critical system", "Purchasing insurance for equipment loss", "Changing the design to eliminate the hazard", "Setting a contingency reserve"], "a": 1, "e": "Transfer shifts the impact to a third party for a premium; the risk still exists. ---"}, {"id": "109", "q": "Which opportunity response makes certain the opportunity is realised?", "o": ["Enhance", "Share", "Exploit", "Accept"], "a": 2, "e": "Exploit removes the uncertainty and ensures it happens. ---"}, {"id": "110", "q": "A project's quality plan specifies inspection at every stage but the defect rate remains high. What is the most likely underlying problem?", "o": ["Inspectors are not competent", "Quality is being inspected in rather than built in; prevention is insufficient", "The specification limits are too tight", "Sample sizes are too small"], "a": 1, "e": "Prevention over inspection. ---"}, {"id": "111", "q": "In a predictive project, the schedule has slipped and the PM updates the schedule baseline to reflect actual dates. What is wrong?", "o": ["Nothing, the baseline should reflect reality", "Baselines change only through approved change control; otherwise variance becomes invisible", "The PM should have updated the cost baseline too", "The PM should have used resource levelling"], "a": 1, "e": "Silently re-baselining destroys the ability to measure performance. ---"}, {"id": "112", "q": "What does the S-curve on a cost report represent?", "o": ["The critical path", "Cumulative planned or actual expenditure over time", "Resource allocation", "Risk exposure over time"], "a": 1, "e": "Cumulative spend. ---"}, {"id": "113", "q": "The team wants to reduce documentation on a low-risk internal project. What principle supports this?", "o": ["Progressive elaboration", "Tailoring", "Rolling wave planning", "Configuration management"], "a": 1, "e": "Adapt the process to the context. ---"}, {"id": "114", "q": "Which activity is part of the Closing focus area?", "o": ["Validating scope", "Transitioning deliverables to operations and capturing final lessons learned", "Developing the schedule", "Conducting procurements"], "a": 1, "e": "Transition and closure activities. ---"}, {"id": "115", "q": "Which is the best measure that a project delivered value?", "o": ["Delivered on time and on budget", "All deliverables accepted", "Intended benefits are being realised and measured after handover", "No outstanding change requests"], "a": 2, "e": "Value is realised through benefits, usually after closure. ---"}, {"id": "116", "q": "A project manager needs to reduce cycle time on a Kanban board. According to Little's Law, what is the most direct lever?", "o": ["Increase throughput by adding people", "Reduce work in progress", "Increase the WIP limit", "Extend the iteration length"], "a": 1, "e": "Cycle time = WIP ÷ throughput; lowering WIP lowers cycle time. ---"}, {"id": "117", "q": "Which is true of the definition of done?", "o": ["It is set by the product owner", "It is a shared standard that an increment must meet to be releasable", "It is the same as acceptance criteria for a single story", "It is defined once at project start and never changed"], "a": 1, "e": "Team-level standard; acceptance criteria are story-specific. ---"}, {"id": "118", "q": "A quality audit finds the team is not following the documented change control process. What should the PM do?", "o": ["Update the documentation to match what the team does", "Investigate why the process is not being followed, then correct the process or the practice and address the gap", "Discipline the team", "Report the finding and continue"], "a": 1, "e": "Understand the cause; either the process is wrong or the practice is. ---"}, {"id": "119", "q": "What should trigger the use of a management reserve?", "o": ["An identified risk occurring", "A previously unidentified event affecting the project, approved by management", "A cost overrun on a work package", "A scope change requested by the customer"], "a": 1, "e": "Management reserve is for unknown unknowns and requires approval. ---"}, {"id": "120", "q": "Which describes the difference between validate scope and control quality?", "o": ["Validate scope is internal; control quality is external", "Control quality checks correctness internally; validate scope obtains customer acceptance", "They occur simultaneously", "Control quality applies only to agile projects"], "a": 1, "e": "Verify first, then validate. ---"}, {"id": "121", "q": "A team is estimating a highly uncertain piece of research work. What is the best approach?", "o": ["Bottom-up estimate with 20% contingency", "Run a timeboxed spike to reduce uncertainty, then estimate", "Use an analogous estimate from an unrelated project", "Ask the sponsor for a target and plan to it"], "a": 1, "e": "Spikes exist precisely for this. ---"}, {"id": "122", "q": "The project's funding is released in quarterly tranches that are lower than the planned spend in Q2. What should the PM do?", "o": ["Ignore it — the total is sufficient", "Perform funding limit reconciliation and reschedule work to fit the funding profile, or request a change", "Use the management reserve", "Delay supplier payments"], "a": 1, "e": "Reconcile the spend profile with the funding limits. ---"}, {"id": "123", "q": "Which is a leading indicator of project health?", "o": ["Final acceptance sign-off", "Rising defect discovery rate and growing impediment backlog", "Total spend to date", "Number of deliverables produced"], "a": 1, "e": "Leading indicators warn before outcomes materialise. ---"}, {"id": "124", "q": "What is the primary purpose of the WBS dictionary?", "o": ["To define project terminology", "To provide detailed information about each WBS component, including acceptance criteria and resources", "To list all stakeholders", "To record change requests"], "a": 1, "e": "Detail behind each component. ---"}, {"id": "125", "q": "A component is delivered that works but consumes far more energy than the organisation's sustainability standard allows. What is the correct classification?", "o": ["Out of scope", "A quality non-conformance against a stated requirement", "A change request from the customer", "A risk that has not yet occurred"], "a": 1, "e": "Sustainability standards are requirements; failing them is a quality failure. ---"}, {"id": "126", "q": "Which agile practice most directly reduces the risk of building the wrong thing?", "o": ["Daily stand-up", "Sprint review with stakeholders inspecting working product", "Definition of done", "Velocity tracking"], "a": 1, "e": "Frequent inspection of real output by real stakeholders. ---"}, {"id": "127", "q": "Which of these is NOT part of the cost baseline?", "o": ["Work package cost estimates", "Contingency reserve", "Management reserve", "Control account budgets"], "a": 2, "e": "Management reserve sits outside the cost baseline. ---"}, {"id": "128", "q": "A project manager wants to know whether the process itself is stable. Which tool is appropriate?", "o": ["Pareto diagram", "Control chart", "Scatter diagram", "Affinity diagram"], "a": 1, "e": "Control charts show process stability over time. ---"}, {"id": "129", "q": "During closure, the operations team says it cannot support the new system. What went wrong?", "o": ["Quality control was insufficient", "Transition readiness was not validated and planned during the project", "The scope baseline was incorrect", "Procurement was not closed"], "a": 1, "e": "\"Validate readiness for transition\" is an explicit closure enabler. ---"}, {"id": "130", "q": "A cost variance of −$40,000 with a BAC of $2,000,000 is within the organisation's 5% tolerance. What should the PM do?", "o": ["Escalate immediately", "Continue monitoring, document the variance and analyse the trend", "Use the management reserve", "Re-baseline the cost"], "a": 1, "e": "Within threshold; monitor the trend rather than escalating or re-baselining. --- ## 9.3 Business Environment domain (45 questions)"}], "domain": "process"}, {"id": "b_be", "title": "Business Environment", "group": "core", "qs": [{"id": "131", "q": "Which best describes project governance?", "o": ["The project management plan", "The framework of authority, decision rights, accountability, procedures and reporting within which the project operates", "The PMO's methodology", "The change control board"], "a": 1, "e": "Governance is the decision and accountability framework. ---"}, {"id": "132", "q": "What is the primary purpose of defining escalation thresholds at the start of a project?", "o": ["To reduce the number of escalations", "To pre-agree measurable triggers so escalation is objective rather than a judgement call each time", "To protect the project manager", "To satisfy the PMO"], "a": 1, "e": "Thresholds make escalation objective and timely. ---"}, {"id": "133", "q": "A PMO provides templates, training and lessons learned but does not require compliance. What type is it?", "o": ["Directive", "Controlling", "Supportive", "Enterprise"], "a": 2, "e": "Supportive PMOs have low control. ---"}, {"id": "134", "q": "A PMO in which project managers report directly to the PMO and it manages the projects is:", "o": ["Supportive", "Controlling", "Directive", "Advisory"], "a": 2, "e": "Directive PMOs have high control. ---"}, {"id": "135", "q": "A new environmental regulation is announced that affects the product under development. What should the PM do first?", "o": ["Continue as planned until the regulation takes effect", "Assess the impact on scope, schedule, cost, risk and the business case, then raise a change request and inform governance", "Escalate to the sponsor without analysis", "Add it to the risk register and monitor"], "a": 1, "e": "Assess, then formalise. Compliance is never deferred. ---"}, {"id": "136", "q": "A competitor launches a similar product first. What is the correct project response?", "o": ["Accelerate delivery at any cost", "Re-examine the business case with the sponsor and reprioritise the backlog based on revised value", "Cancel the project", "Continue as planned — the plan is baselined"], "a": 1, "e": "The external environment changed; revisit value and reprioritise. ---"}, {"id": "137", "q": "A project manager discovers a supplier is using labour practices that violate the organisation's code of conduct, though they are legal in that country. What should the PM do?", "o": ["Continue — it is legal locally", "Raise it through the compliance and governance channels and assess the contractual and reputational implications", "Terminate the contract immediately without consultation", "Note it in the lessons learned register"], "a": 1, "e": "Legality is not the only standard; escalate through the proper channel. ---"}, {"id": "138", "q": "Which of these is an organisational process asset?", "o": ["Market conditions", "The organisation's lessons learned repository", "Government regulations", "Stakeholder risk appetite"], "a": 1, "e": "OPAs are owned by the organisation; the others are EEFs. ---"}, {"id": "139", "q": "Which of these is an enterprise environmental factor?", "o": ["Change control procedures", "Historical project databases", "Legal and regulatory restrictions", "Project templates"], "a": 2, "e": "External conditions the project does not control. ---"}, {"id": "140", "q": "What is the correct handling of a change request that the CCB rejects?", "o": ["Delete it from the change log", "Record the decision and rationale in the change log and communicate it to the requester and affected stakeholders", "Implement a reduced version", "Resubmit it with a lower cost estimate"], "a": 1, "e": "Rejected changes are still logged and communicated. ---"}, {"id": "141", "q": "In an agile project, a stakeholder requests a new feature. What happens?", "o": ["A change request is raised for CCB approval", "The product owner adds it to the backlog and orders it against everything else", "The team adds it to the current sprint", "It is rejected bec
