  var ctl=null, st=document.getElementById('gst'), gg=document.getElementById('gg'), gs=document.getElementById('gs');
  gs.addEventListener('click',function(){ if(ctl) ctl.abort(); });
  gg.addEventListener('click',function(){
    var d=document.getElementById('gd').value, t=document.getElementById('gt').value.trim(),
        l=document.getElementById('gl').value, n=parseInt(document.getElementById('gn').value,10);
    var prompt=RULES+'\n\nWrite '+n+' original PMP exam practice questions. Domain: '+d+'.'+(t?' Focus topic: '+t+'.':'')+' Difficulty: '+l+'. '+
      'Each must be a realistic situational scenario with four plausible options and exactly one best answer that reflects the PMI mindset. '+
      'Vary which option letter is correct. Do not copy real exam questions. '+
      'Reply with only a JSON array, no other text, each item shaped exactly like: '+
      '{"q":"question text","o":["option A","option B","option C","option D"],"a":0,"e":"one or two sentence explanation"} '+
      'where "a" is the zero-based index of the correct option.';
    ctl=new AbortController(); gg.disabled=true; gs.disabled=false; st.textContent='Writing questions… this usually takes 20–60 seconds.';
    SAMPLE.json(prompt,{signal:ctl.signal,cache:false}).then(function(arr){
      if(!Array.isArray(arr)) throw {code:'invalid_json'};
      var qs=arr.filter(function(x){ return x&&typeof x.q==='string'&&Array.isArray(x.o)&&x.o.length===4&&typeof x.a==='number'&&x.a>=0&&x.a<4; })
        .map(function(x,i){ return {id:'AI'+(i+1),q:x.q,o:x.o.map(String),a:x.a,e:String(x.e||'')}; });
      if(!qs.length) throw {code:'invalid_json'};
      startQuiz(qs,'AI-generated · '+d+(t?' · '+t:''),'ai','practice',false,qs.length);
    }).catch(function(e){ st.textContent=aiErr(e)||'Stopped.'; gg.disabled=false; gs.disabled=true; });
  });
  document.getElementById('bartitle').textContent='Generate new questions';
  markNav('#/gen'); window.scrollTo(0,0);
}

/* ---------- search ---------- */
function renderSearch(){
  view.innerHTML='<h1>Search</h1><input type="search" id="sq" placeholder="e.g. float, EMV, servant leadership, PTA" autocomplete="off">'+
    '<div id="sr" style="margin-top:1rem"></div>';
  var box=document.getElementById('sq'), out=document.getElementById('sr');
  function run(){
    var t=box.value.trim().toLowerCase();
    if(t.length<2){ out.innerHTML='<p class="note">Type at least two characters. Searches the full guide and all 380 questions.</p>'; return; }
    var h='', nS=0, nQ=0;
    SEC.forEach(function(s){
      var p=s.text.indexOf(t);
      if(p>-1 && nS<12){
        nS++;
        var snip=s.text.slice(Math.max(0,p-70),p+110);
        h+='<a class="res" href="#/s/'+s.id+'"><b>'+esc(s.title)+'</b><small>…'+
          esc(snip).replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),function(m){return '<mark>'+m+'</mark>';})+'…</small></a>';
      }
    });
    var qh='';
    BANKS.forEach(function(b){ b.qs.forEach(function(q){
      if(nQ>=12) return;
      if((q.q+' '+q.e+' '+(q.l||[]).join(' ')+' '+(q.r||[]).join(' ')).toLowerCase().indexOf(t)>-1){
        nQ++;
        qh+='<a class="res" href="#/q/'+b.id+'"><b>Q'+esc(q.id)+' · '+esc(b.title)+'</b><small>'+esc(q.q.slice(0,150))+'…</small></a>';
      }
    });});
    out.innerHTML=(h?'<h3>Guide ('+nS+')</h3>'+h:'')+(qh?'<h3>Questions ('+nQ+'+)</h3>'+qh:'')||'<p class="note">No matches.</p>';
  }
  box.addEventListener('input',run); run(); box.focus();
  document.getElementById('bartitle').textContent='Search';
  markNav('#/search'); window.scrollTo(0,0);
}

/* ---------- progress ---------- */
function renderProgress(){
  var readN=Object.keys(store.read).length;
  var scores=BANKS.filter(function(b){return store.best[b.id]!=null;});
  var avg=scores.length?Math.round(scores.reduce(function(a,b){return a+store.best[b.id];},0)/scores.length):0;
  var h='<h1>My progress</h1><div class="kpi">'+
    '<div><b>'+readN+'/'+SEC.length+'</b><small>guide sections read</small></div>'+
    '<div><b>'+scores.length+'/'+BANKS.length+'</b><small>banks attempted</small></div>'+
    '<div><b>'+(scores.length?avg+'%':'–')+'</b><small>average best score</small></div></div>';
  var dom={people:[0,0],process:[0,0],be:[0,0],mixed:[0,0]}, bs={};
  Object.keys(store.stat).forEach(function(id){
    var b=QBANK[id]; if(!b) return; var st=store.stat[id], d=BK[b].domain||'mixed';
    dom[d][0]+=st[0]; dom[d][1]+=st[1];
    if(!bs[b]) bs[b]=[0,0]; bs[b][0]+=st[0]; bs[b][1]+=st[1];
  });
  function pc(a){ return a[1]?Math.round(a[0]/a[1]*100)+'%':'–'; }
  h+='<h3>Accuracy by domain</h3><p class="note">Across every answer you have given, including repeats.</p><div class="kpi">'+
    '<div><b>'+pc(dom.people)+'</b><small>People · '+dom.people[1]+' answers</small></div>'+
    '<div><b>'+pc(dom.process)+'</b><small>Process · '+dom.process[1]+' answers</small></div>'+
    '<div><b>'+pc(dom.be)+'</b><small>Business Env · '+dom.be[1]+' answers</small></div>'+
    '<div><b>'+pc(dom.mixed)+'</b><small>Mixed / formats · '+dom.mixed[1]+' answers</small></div></div>';
  var weak=Object.keys(bs).filter(function(b){return bs[b][1]>=8;})
    .sort(function(a,b){return bs[a][0]/bs[a][1]-bs[b][0]/bs[b][1];}).slice(0,3);
  if(weak.length){
    h+='<h3>Focus next</h3><p class="note">Your three lowest-accuracy banks with at least 8 answers.</p><div class="grid">'+
      weak.map(function(b){ return '<a class="card" href="#/q/'+b+'"><b>'+esc(BK[b].title)+'</b><small>'+pc(bs[b])+' accuracy · '+bs[b][1]+' answers</small></a>'; }).join('')+'</div>';
  }
  h+='<h3>Bank scores</h3><div class="grid">';
  BANKS.forEach(function(b){
    var s=store.best[b.id];
    h+='<button class="card" data-b="'+b.id+'"><b>'+esc(b.title)+'</b><small>'+
      (s!=null?'best '+s+'%':'not attempted')+' · '+b.qs.length+' questions</small>'+
      '<span class="bar"><i style="width:'+(s||0)+'%;background:'+((s||0)>=75?'var(--ok)':'var(--accent)')+'"></i></span></button>';
  });
  h+='</div>';
  var ck=0, ct=0; DECKS.forEach(function(d){ ct+=d.cards.length; d.cards.forEach(function(c){ if(store.known[d.id+'|'+c.f]) ck++; }); });
  h+='<h3>Flashcards</h3><div class="grid">';
  DECKS.forEach(function(d){
    var k=0; d.cards.forEach(function(c){ if(store.known[d.id+'|'+c.f]) k++; });
    var p=Math.round(k/d.cards.length*100);
    h+='<a class="card" href="#/f/'+d.id+'"><b>'+esc(d.title)+'</b><small>'+k+' of '+d.cards.length+' known</small>'+
       '<span class="bar"><i style="width:'+p+'%"></i></span></a>';
  });
  h+='</div>';
  h+='<h3>Readiness gates</h3><ul>'+
    '<li>'+(avg>=75?'✓':'○')+' Averaging 75%+ across attempted banks</li>'+
    '<li>'+(store.best.b_mock>=75?'✓':'○')+' Mock exam at 75%+</li>'+
    '<li>'+(readN>=SEC.length?'✓':'○')+' All guide sections read</li>'+
    '<li>'+((store.best.b_be>=75&&store.best.b_adv_gov>=75)?'✓':'○')+' Business Environment and governance banks at 75%+</li>'+
    '<li>'+(store.best.fullexam>=75?'✓':'○')+' Full 180-question exam simulation at 75%+</li>'+
    '<li>'+(ck>=Math.round(ct*0.8)?'✓':'○')+' 80% of flashcards marked known ('+ck+' of '+ct+')</li>'+
    '<li>'+(dueQuestions().length===0&&Object.keys(store.srs).length>200?'✓':'○')+' Review queue clear</li></ul>';
  h+='<h3>Back up or move your progress</h3><p class="note">Progress lives in this browser only. Copy the code below to keep a backup or move to another device, and paste a code to restore.</p>'+
    '<textarea class="bk" id="bk" spellcheck="false"></textarea>'+
    '<div class="row"><button class="ib" id="bkx">Show my backup code</button><button class="ib" id="bkcp">Copy</button><button class="ib" id="bki">Restore from pasted code</button></div>';
  if(DL) h+='<div class="row"><button class="ib" id="dlb">Download backup (.json)</button><button class="ib" id="dle">Download error log (.csv)</button></div>';
  h+='<div class="row"><button class="ib" id="reset">Reset all progress</button></div>';
  view.innerHTML=h;
  function dlSave(name, text, type){
    if(!DL) return;
    DL.save({filename:name, data:new Blob([text],{type:type})}).catch(function(e){
      if(e&&e.code!=='declined') alert('Download unavailable here.'); });
  }
  var dlb=document.getElementById('dlb');
  if(dlb) dlb.addEventListener('click',function(){ dlSave('pmp-progress-backup.json', JSON.stringify(store), 'application/json'); });
  var dle=document.getElementById('dle');
  if(dle) dle.addEventListener('click',function(){
    function c(v){ v=String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }
    var rows=[['Question ID','Bank','Question','Correct answer','Attempts','Times correct','Accuracy %','Flagged'].map(c).join(',')];
    Object.keys(store.stat).forEach(function(id){
      var st=store.stat[id]; if(st[0]===st[1]) return;
      var q=ALLQ.filter(function(x){return x.id===id;})[0]; if(!q) return;
      rows.push([id, BK[QBANK[id]].title, q.q, corrText(q), st[1], st[0], Math.round(st[0]/st[1]*100), store.flag[id]?'yes':''].map(c).join(','));
    });
    if(rows.length===1){ alert('No missed questions yet.'); return; }
    dlSave('pmp-error-log.csv', rows.join('\n'), 'text/csv');
  });
  var ta=document.getElementById('bk');
  document.getElementById('bkx').addEventListener('click',function(){ ta.value=JSON.stringify(store); ta.select(); });
  document.getElementById('bkcp').addEventListener('click',function(){
    if(!ta.value) ta.value=JSON.stringify(store);
    ta.select();
    try{ navigator.clipboard.writeText(ta.value).then(function(){ alert('Copied.'); },function(){ document.execCommand('copy'); }); }
    catch(e){ try{ document.execCommand('copy'); }catch(_){} }
  });
  document.getElementById('bki').addEventListener('click',function(){
    try{ var o=JSON.parse(ta.value); if(!o||typeof o!=='object'||!o.best) throw 0;
      if(!confirm('Replace your current progress with this backup?')) return;
      store=o; ['read','best','flag','known','srs','plan','stat'].forEach(function(k){ if(!store[k]) store[k]={}; });
      save(); buildNav(); renderProgress(); alert('Restored.');
    }catch(e){ alert('That does not look like a valid backup code.'); }
  });
  [].forEach.call(view.querySelectorAll('.card'),function(c){
    c.addEventListener('click',function(){ go('#/q/'+c.dataset.b); });
  });
  document.getElementById('reset').addEventListener('click',function(){
    if(confirm('Clear everything: read markers, scores, flags, flashcards, review schedule and plan?')){ store={read:{},best:{},flag:{},known:{},srs:{},plan:{},stat:{}}; save(); buildNav(); renderProgress(); }
  });
  document.getElementById('bartitle').textContent='My progress';
  markNav('#/progress'); window.scrollTo(0,0);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',function(e){
  if(!Q || !document.querySelector('.stem')) return;
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  var n=parseInt(e.key,10);
  var opts=view.querySelectorAll('.opt');
  if(n>=1 && n<=opts.length && !opts[n-1].disabled){ opts[n-1].click(); e.preventDefault(); return; }
  if(e.key==='Enter'){
    var b=document.getElementById('next')||document.getElementById('check');
    if(b){ b.click(); e.preventDefault(); }
  }
  if(e.key==='f'||e.key==='F'){ var f=document.getElementById('flag'); if(f) f.click(); }
});

/* ---------- router ---------- */
function route(){
  var h=location.hash||'#/s/'+SEC[0].id;
  if(h.indexOf('#/')!==0){ // in-page anchor
    var el=document.getElementById(h.slice(1));
    if(el) el.scrollIntoView();
    return;
  }
  document.body.classList.remove('menu');
  if(Q && h.indexOf('#/q/')!==0){ if(tick)clearInterval(tick); Q=null; }
  var p=h.split('/');
  if(p[1]==='s') renderSection(p[2]);
  else if(p[1]==='q') renderSetup(p[2]);
  else if(p[1]==='practice') renderPractice();
  else if(p[1]==='custom') renderCustom();
  else if(p[1]==='fullexam') renderFullExam();
  else if(p[1]==='review') renderReview();
  else if(p[1]==='tutor') renderTutor();
  else if(p[1]==='gen') renderGen();
  else if(p[1]==='calc') renderCalc();
  else if(p[1]==='planner') renderPlanner();
  else if(p[1]==='flagged') renderFlagged();
  else if(p[1]==='f') renderDeck(p[2]);
  else if(p[1]==='search') renderSearch();
  else if(p[1]==='progress') renderProgress();
  else renderSection(SEC[0].id);
}
window.addEventListener('hashchange',route);

document.getElementById('menu').addEventListener('click',function(){ document.body.classList.toggle('menu'); });
document.getElementById('bd').addEventListener('click',function(){ document.body.classList.remove('menu'); });
document.getElementById('go-search').addEventListener('click',function(){ go('#/search'); });
document.getElementById('go-theme').addEventListener('click',function(){
  var r=document.documentElement, cur=r.getAttribute('data-theme');
  if(!cur){ cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
  r.setAttribute('data-theme', cur==='dark'?'light':'dark');
  try{ localStorage.setItem('pmptheme', r.getAttribute('data-theme')); }catch(e){}
});
try{ var th=localStorage.getItem('pmptheme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}

buildNav();
route();
})();
</script>
</body>
