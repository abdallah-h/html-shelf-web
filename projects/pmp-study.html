 who is affected, what has changed, and what the pm controls. eliminate, then choose on mindset. two options are usually clearly wrong. between the last two, pick the one that is more proactive, more collaborative, more process-respecting and more value-focused. 8.3 trap answers and why they are wrong trap why wrong escalate to the sponsor immediately skipped analysis and your own authority add resources to recover the schedule brooks's law; also no impact assessment tell the customer the change is impossible you did not evaluate it update the schedule to reflect the delay absorbed a change without control ask the functional manager to speak to their employee you went around a person have the team work overtime unsustainable pace, no analysis remove a feature to save time scope change without a request hold a meeting (when a plan or log answers it) wasteful; consult the artifact document the issue and continue logging is not resolving accept the risk because the probability is low only valid if analysis supports it and it is recorded extend the sprint to finish the work sprints are never extended let the developer build what the stakeholder asked for bypasses the product owner proceed and address the regulation later compliance is never deferred use the ai output to update the forecast not without human verification continue because we have already invested so much sunk cost fallacy 8.4 quick decision heuristics someone is confused → communicate / clarify someone is unhappy → meet them, understand the cause something changed → assess impact → change request something is uncertain → risk register something is happening now and hurting → issue log + resolve you do not know something → the plan, the register, or the person who knows work is blocked → remove the impediment the team is arguing → facilitate collaboration the scope crept → change control, and find why control failed the business case is dead → escalate a recommendation, possibly to terminate "}, {"id": "s9", "title": "Part 11 — Study plan and readiness", "html": "<h2 id=\"s9-h1\">11.1 The 12-week plan<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>Focus<\/th>\n<th>Deliverable<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>Join PMI · choose a 35-hour course · start the application · <strong>book the exam for week 12<\/strong><\/td>\n<td>Exam booked<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Part 1 Foundations<\/td>\n<td>Approach comparison table written from memory<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Part 3.1–3.2 Integration and scope<\/td>\n<td>Build a WBS for a real project<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Part 3.3 Schedule<\/td>\n<td>20 float and critical-path problems<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Part 3.4–3.5 Finance and quality<\/td>\n<td>Contract-type table from memory<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Part 4.5 Risk + Part 7 formulas<\/td>\n<td>Write the whole formula sheet blank<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Part 5.1–5.8 Agile<\/td>\n<td>Run a mock sprint planning and retrospective<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Part 5.9–5.12 Servant leadership, scaling, hybrid<\/td>\n<td>Design a hybrid approach for a real scenario<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Part 2 People domain<\/td>\n<td>Questions 1–50, error log<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Part 4 Business Environment<\/td>\n<td>Questions 131–175, error log<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Part 6 AI, sustainability, value + <strong>full 180-question mock<\/strong><\/td>\n<td>Mock 1 score and error log<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Error-log remediation · mocks 2 and 3 · practise case and graphic formats<\/td>\n<td>≥75% consistently<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Mock 4 · formulas · Part 8 mindset · rest 24 hours before<\/td>\n<td>Pass<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s9-h2\">11.2 Readiness gates<\/h2>\n<p>Do not sit the exam until all of these are true:<\/p>\n<ul>\n<li>[ ] Scoring <strong>75%+<\/strong> consistently on PMI Study Hall or equivalent ECO-aligned mocks<\/li>\n<li>[ ] Can write the full formula sheet from blank paper in under 3 minutes<\/li>\n<li>[ ] Can explain the difference between predictive, agile and hybrid handling of the <em>same<\/em> scenario<\/li>\n<li>[ ] Completed at least <strong>two full 180-question mocks<\/strong> under real conditions, with breaks<\/li>\n<li>[ ] Error log shows mindset errors falling, not just knowledge errors<\/li>\n<li>[ ] Comfortable with case-study sets and graphic interpretation questions<\/li>\n<li>[ ] Business Environment score is not your lowest domain<\/li>\n<\/ul>\n<h2 id=\"s9-h3\">11.3 Error log template<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Date<\/th>\n<th>Q ref<\/th>\n<th>Topic<\/th>\n<th>My answer<\/th>\n<th>Correct<\/th>\n<th>Why I was wrong<\/th>\n<th>Principle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><em>knowledge gap / mindset / misread / rushed<\/em><\/td>\n<td><em>e.g. assess before escalating<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Review it weekly. Mindset errors that recur are worth more attention than any new topic.<\/p>\n<h2 id=\"s9-h4\">11.4 Resources<\/h2>\n<p><strong>Essential:<\/strong> the 2026 ECO PDF · PMI Certification Handbook · a 35-hour ECO-aligned course · <strong>PMI Study Hall<\/strong>.\n<strong>Strongly recommended:<\/strong> PMBOK Guide 8th Edition (free with membership) · Agile Practice Guide · Process Groups: A Practice Guide.\n<strong>Third-party (verify 2026 ECO alignment before buying):<\/strong> Andrew Ramdayal / TIA · David McLachlan (free YouTube question walkthroughs) · Rita Mulcahy · Joseph Phillips · ATP bootcamps.\n<strong>Free:<\/strong> PMI's Introduction to PMP course · PMIstandards+ · local PMI chapter study groups · r/pmp lessons-learned posts.<\/p>\n<p><strong>Avoid:<\/strong> anyone selling \"real exam questions\" or guaranteeing a pass. Using leaked material can get your certification permanently revoked.<\/p>\n<h2 id=\"s9-h5\">11.5 Exam-day protocol<\/h2>\n<p><strong>Before:<\/strong> sleep; nothing new in the final 24 hours; eat properly.\n<strong>Test centre:<\/strong> arrive 30 minutes early; two forms of ID with names matching your PMI profile exactly; nothing goes in with you.\n<strong>Online:<\/strong> system test days in advance on the same machine and network; check in 30 minutes early; clear desk, closed door, no interruptions; wired connection if possible.\n<strong>During:<\/strong> brain-dump formulas in the untimed tutorial · read each case scenario once carefully · <strong>review the case section before you break, because you cannot return<\/strong> · flag anything over 2 minutes · take both breaks · answer everything · trust your first instinct on mindset questions.\n<strong>After:<\/strong> provisional result on screen at a test centre; official result in your PMI account; domain ratings tell you where to focus if you need a retake.<\/p>\n<h2 id=\"s9-h6\">11.6 After you pass<\/h2>\n<ul>\n<li>Claim the digital badge; update your CV and LinkedIn<\/li>\n<li>Diarise the renewal date — <strong>three years<\/strong><\/li>\n<li><strong>60 PDUs<\/strong> per cycle: minimum 35 education (with at least 8 in each Talent Triangle area — Ways of Working, Power Skills, Business Acumen), maximum 25 giving back (of which working as a practitioner caps at 8)<\/li>\n<li>Log PDUs at ccrs.pmi.org <strong>as you earn them<\/strong>, not in the final month<\/li>\n<li>Renewal fee ~$60 member / ~$150 non-member<\/li>\n<\/ul>\n<hr />\n<p><em>Independent study aid. Fees, policies and dates change — verify against pmi.org and the current PMI Certification Handbook before making decisions or payments.<\/em><\/p>", "subs": [{"t": "11.1 The 12-week plan", "a": "s9-h1"}, {"t": "11.2 Readiness gates", "a": "s9-h2"}, {"t": "11.3 Error log template", "a": "s9-h3"}, {"t": "11.4 Resources", "a": "s9-h4"}, {"t": "11.5 Exam-day protocol", "a": "s9-h5"}, {"t": "11.6 After you pass", "a": "s9-h6"}], "text": " 11.1 the 12-week plan week focus deliverable 0 join pmi · choose a 35-hour course · start the application · book the exam for week 12 exam booked 1 part 1 foundations approach comparison table written from memory 2 part 3.1–3.2 integration and scope build a wbs for a real project 3 part 3.3 schedule 20 float and critical-path problems 4 part 3.4–3.5 finance and quality contract-type table from memory 5 part 4.5 risk + part 7 formulas write the whole formula sheet blank 6 part 5.1–5.8 agile run a mock sprint planning and retrospective 7 part 5.9–5.12 servant leadership, scaling, hybrid design a hybrid approach for a real scenario 8 part 2 people domain questions 1–50, error log 9 part 4 business environment questions 131–175, error log 10 part 6 ai, sustainability, value + full 180-question mock mock 1 score and error log 11 error-log remediation · mocks 2 and 3 · practise case and graphic formats ≥75% consistently 12 mock 4 · formulas · part 8 mindset · rest 24 hours before pass 11.2 readiness gates do not sit the exam until all of these are true: [ ] scoring 75%+ consistently on pmi study hall or equivalent eco-aligned mocks [ ] can write the full formula sheet from blank paper in under 3 minutes [ ] can explain the difference between predictive, agile and hybrid handling of the same scenario [ ] completed at least two full 180-question mocks under real conditions, with breaks [ ] error log shows mindset errors falling, not just knowledge errors [ ] comfortable with case-study sets and graphic interpretation questions [ ] business environment score is not your lowest domain 11.3 error log template date q ref topic my answer correct why i was wrong principle knowledge gap / mindset / misread / rushed e.g. assess before escalating review it weekly. mindset errors that recur are worth more attention than any new topic. 11.4 resources essential: the 2026 eco pdf · pmi certification handbook · a 35-hour eco-aligned course · pmi study hall . strongly recommended: pmbok guide 8th edition (free with membership) · agile practice guide · process groups: a practice guide. third-party (verify 2026 eco alignment before buying): andrew ramdayal / tia · david mclachlan (free youtube question walkthroughs) · rita mulcahy · joseph phillips · atp bootcamps. free: pmi's introduction to pmp course · pmistandards+ · local pmi chapter study groups · r/pmp lessons-learned posts. avoid: anyone selling \"real exam questions\" or guaranteeing a pass. using leaked material can get your certification permanently revoked. 11.5 exam-day protocol before: sleep; nothing new in the final 24 hours; eat properly. test centre: arrive 30 minutes early; two forms of id with names matching your pmi profile exactly; nothing goes in with you. online: system test days in advance on the same machine and network; check in 30 minutes early; clear desk, closed door, no interruptions; wired connection if possible. during: brain-dump formulas in the untimed tutorial · read each case scenario once carefully · review the case section before you break, because you cannot return · flag anything over 2 minutes · take both breaks · answer everything · trust your first instinct on mindset questions. after: provisional result on screen at a test centre; official result in your pmi account; domain ratings tell you where to focus if you need a retake. 11.6 after you pass claim the digital badge; update your cv and linkedin diarise the renewal date — three years 60 pdus per cycle: minimum 35 education (with at least 8 in each talent triangle area — ways of working, power skills, business acumen), maximum 25 giving back (of which working as a practitioner caps at 8) log pdus at ccrs.pmi.org as you earn them , not in the final month renewal fee ~$60 member / ~$150 non-member independent study aid. fees, policies and dates change — verify against pmi.org and the current pmi certification handbook before making decisions or payments. "}, {"id": "s10", "title": "Part 12 — Models, methods and artifacts reference", "html": "<p>PMI's Eighth Edition separates <strong>models<\/strong> (ways of thinking), <strong>methods<\/strong> (ways of doing) and <strong>artifacts<\/strong> (things produced). Exam questions frequently name one and ask when to use it. This is the reference list.<\/p>\n<h2 id=\"s10-h1\">12.1 Models<\/h2>\n<h3>Situational leadership models<\/h3>\n<ul>\n<li><strong>Situational Leadership II<\/strong> — adapt style to follower competence and commitment: Directing (low competence, high commitment) → Coaching (some competence, low commitment) → Supporting (high competence, variable commitment) → Delegating (high competence, high commitment).<\/li>\n<li><strong>OSCAR model<\/strong> — Outcome, Situation, Choices, Actions, Review. A coaching conversation structure.<\/li>\n<\/ul>\n<h3>Communication models<\/h3>\n<ul>\n<li><strong>Cross-cultural communication<\/strong> — sender's encoding is filtered by their culture; the receiver decodes through theirs. Mismatch is the default, not the exception.<\/li>\n<li><strong>Effectiveness of communication channels<\/strong> — richness declines from face-to-face → video → phone → written. Choose richness to match complexity and sensitivity.<\/li>\n<li><strong>Gulf of execution and evaluation<\/strong> — the gap between what a user wants to do and what the system allows (execution), and between what the system shows and what the user understands (evaluation). A usability and requirements model.<\/li>\n<\/ul>\n<h3>Motivation models<\/h3>\n<p>Hygiene and motivational factors (Herzberg) · Intrinsic vs extrinsic motivation · Theory of Needs (McClelland) · Theory X, Y and Z · <strong>Pink's autonomy, mastery, purpose<\/strong>.<\/p>\n<h3>Change models<\/h3>\n<ul>\n<li><strong>Managing change in organisations<\/strong> — PMI's own framework: formulate change, plan change, implement change, manage transition, sustain change.<\/li>\n<li><strong>ADKAR<\/strong> · <strong>Kotter's 8-step<\/strong> · <strong>Virginia Satir change model<\/strong> · <strong>Bridges' transition model<\/strong> · <strong>Lewin's unfreeze-change-refreeze<\/strong>.<\/li>\n<\/ul>\n<h3>Complexity models<\/h3>\n<ul>\n<li><strong>Cynefin framework<\/strong> — classify the situation and match the response:<\/li>\n<li><em>Clear/simple<\/em> — sense, categorise, respond. Best practice applies.<\/li>\n<li><em>Complicated<\/em> — sense, analyse, respond. Good practice; expertise required.<\/li>\n<li><em>Complex<\/em> — probe, sense, respond. Emergent practice; safe-to-fail experiments. <strong>Agile lives here.<\/strong><\/li>\n<li><em>Chaotic<\/em> — act, sense, respond. Novel practice; establish order first.<\/li>\n<li><em>Confused/disorder<\/em> — you do not know which domain you are in. Break the situation into parts.<\/li>\n<li><strong>Stacey matrix<\/strong> — plot requirement certainty against technology certainty: close to agreement and certainty → simple/predictive; far from both → chaos; the middle zone is complex and suits adaptive approaches.<\/li>\n<\/ul>\n<h3>Project team development models<\/h3>\n<p>Tuckman's ladder · <strong>Drexler-Sibbet team performance model<\/strong> (orientation, trust building, goal clarification, commitment, implementation, high performance, renewal).<\/p>\n<h3>Other models worth knowing<\/h3>\n<ul>\n<li><strong>Conflict model (Thomas-Kilmann)<\/strong> — the five conflict-handling modes.<\/li>\n<li><strong>Negotiation<\/strong> — principled negotiation: separate the people from the problem, focus on interests not positions, invent options for mutual gain, insist on objective criteria. Know your <strong>BATNA<\/strong> and <strong>ZOPA<\/strong> (zone of possible agreement).<\/li>\n<li><strong>Planning models<\/strong> — process groups, cadence, rolling wave.<\/li>\n<li><strong>Process groups as focus areas<\/strong> — Initiating, Planning, Executing, Monitoring and Controlling, Closing.<\/li>\n<li><strong>Salience model<\/strong> — power, legitimacy, urgency.<\/li>\n<\/ul>\n<h2 id=\"s10-h2\">12.2 Methods<\/h2>\n<h3>Data gathering and analysis<\/h3>\n<p>Benchmarking · brainstorming · check sheets · checklists · focus groups · interviews · market research · questionnaires and surveys · <strong>Delphi<\/strong> · nominal group technique · observation and job shadowing · statistical sampling.<\/p>\n<p><strong>Analysis methods:<\/strong> alternatives analysis · assumption and constraint analysis · cost-benefit analysis · <strong>cost of quality<\/strong> · decision tree · <strong>earned value analysis<\/strong> · <strong>expected monetary value<\/strong> · <strong>influence diagram<\/strong> · life-cycle assessment (environmental impact across the whole life) · make-or-buy · probability and impact matrix · process analysis · <strong>regression analysis<\/strong> · reserve analysis · <strong>root cause analysis<\/strong> · <strong>sensitivity analysis<\/strong> · simulation (Monte Carlo) · stakeholder analysis · SWOT · <strong>trend analysis<\/strong> · <strong>value stream mapping<\/strong> · variance analysis · what-if scenario analysis.<\/p>\n<h3>Estimating methods<\/h3>\n<p>Affinity grouping · analogous · function point · multipoint (three-point) · parametric · relative estimating · single-point · story point · <strong>wideband Delphi<\/strong> · bottom-up.<\/p>\n<h3>Meetings and events<\/h3>\n<p>Backlog refinement · bidder conference · change control board · daily standup · <strong>iteration planning<\/strong> · <strong>iteration review<\/strong> · kickoff · lessons learned meeting · planning meeting · project closeout · <strong>retrospective<\/strong> · risk review · status meeting · steering committee · <strong>release planning<\/strong>.<\/p>\n<h3>Other methods<\/h3>\n<p>Timeboxing · voting (unanimity, majority, plurality, fist of five, Roman voting) · multicriteria decision analysis · <strong>prioritisation schema<\/strong> (MoSCoW, Kano, WSJF, paired comparison, 100 points) · <strong>impact mapping<\/strong> · <strong>net promoter score<\/strong> · <strong>planning poker<\/strong>.<\/p>\n<h2 id=\"s10-h3\">12.3 Artifacts<\/h2>\n<h3>Strategy artifacts<\/h3>\n<p>Business case · business model canvas · project brief · <strong>project charter<\/strong> · <strong>roadmap<\/strong> · <strong>benefits management plan<\/strong> · project vision statement.<\/p>\n<h3>Logs and registers<\/h3>\n<p><strong>Assumption log<\/strong> · <strong>backlog<\/strong> · <strong>change log<\/strong> · <strong>issue log<\/strong> · <strong>lessons learned register<\/strong> · <strong>risk register<\/strong> · <strong>stakeholder register<\/strong> · <strong>impediment log<\/strong> · <strong>RAID log<\/strong> (risks, assumptions, issues, dependencies) · <strong>decision log<\/strong> · <strong>defect log<\/strong>.<\/p>\n<h3>Plans<\/h3>\n<p>Change control plan · communications management plan · cost management plan · iteration plan · procurement management plan · <strong>project management plan<\/strong> · quality management plan · release plan · requirements management plan · resource management plan · risk management plan · scope management plan · schedule management plan · stakeholder engagement plan · test plan.<\/p>\n<h3>Hierarchy charts<\/h3>\n<p><strong>WBS<\/strong> · <strong>OBS<\/strong> (organisational breakdown structure) · <strong>RBS<\/strong> (resource <em>or<\/em> risk breakdown structure) · product breakdown structure · <strong>story map<\/strong>.<\/p>\n<h3>Baselines<\/h3>\n<p><strong>Scope baseline<\/strong> · <strong>schedule baseline<\/strong> · <strong>cost baseline<\/strong> · <strong>performance measurement baseline<\/strong> (the three combined) · milestone schedule · budget.<\/p>\n<h3>Visual data and information<\/h3>\n<p>Affinity diagram · burndown/burnup chart · <strong>cause-and-effect diagram<\/strong> · <strong>cumulative flow diagram<\/strong> · <strong>control chart<\/strong> · <strong>dashboard<\/strong> · flowchart · <strong>Gantt chart<\/strong> · <strong>histogram<\/strong> · <strong>information radiator<\/strong> · <strong>lead time chart<\/strong> · <strong>prioritisation matrix<\/strong> · <strong>project schedule network diagram<\/strong> · probability and impact matrix · <strong>requirements traceability matrix<\/strong> · <strong>responsibility assignment matrix (RACI)<\/strong> · <strong>S-curve<\/strong> · <strong>scatter diagram<\/strong> · <strong>stakeholder engagement assessment matrix<\/strong> · <strong>throughput chart<\/strong> · use case · <strong>value stream map<\/strong> · <strong>velocity chart<\/strong>.<\/p>\n<h3>Reports<\/h3>\n<p>Quality report · risk report · status report · <strong>work performance report<\/strong>.<\/p>\n<h3>Agreements and contracts<\/h3>\n<p>Fixed price (FFP, FPIF, FPEPA) · cost reimbursable (CPFF, CPIF, CPAF) · time and materials · indefinite delivery indefinite quantity (IDIQ) · <strong>memorandum of understanding (MOU)<\/strong> · <strong>service level agreement (SLA)<\/strong> · <strong>master services agreement (MSA)<\/strong> · basic ordering agreement · non-disclosure agreement.<\/p>\n<h3>Other artifacts<\/h3>\n<p>Activity list · bid documents (RFI, RFQ, RFP) · <strong>metrics<\/strong> · <strong>project calendar<\/strong> · <strong>requirements documentation<\/strong> · <strong>project team charter<\/strong> · <strong>user story<\/strong> · <strong>definition of done<\/strong> · <strong>definition of ready<\/strong> · <strong>acceptance criteria<\/strong> · <strong>test and evaluation documents<\/strong>.<\/p>\n<h2 id=\"s10-h4\">12.4 The artifact-to-situation quick map<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Reach for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nobody agrees what \"done\" means<\/td>\n<td>Definition of done / acceptance criteria<\/td>\n<\/tr>\n<tr>\n<td>A requirement seems to have vanished<\/td>\n<td>Requirements traceability matrix<\/td>\n<\/tr>\n<tr>\n<td>Two people think they own the same decision<\/td>\n<td>RACI chart<\/td>\n<\/tr>\n<tr>\n<td>A stakeholder is blindsiding you late<\/td>\n<td>Stakeholder register + engagement assessment matrix<\/td>\n<\/tr>\n<tr>\n<td>A risk keeps materialising<\/td>\n<td>Risk register + root cause analysis<\/td>\n<\/tr>\n<tr>\n<td>Nobody knows the current status<\/td>\n<td>Information radiator / dashboard<\/td>\n<\/tr>\n<tr>\n<td>Work is stalling between stages<\/td>\n<td>Cumulative flow diagram + WIP limits<\/td>\n<\/tr>\n<tr>\n<td>The same defect recurs<\/td>\n<td>Fishbone diagram + Pareto<\/td>\n<\/tr>\n<tr>\n<td>Estimates are always wrong<\/td>\n<td>Historical data, parametric or three-point estimating, reserve analysis<\/td>\n<\/tr>\n<tr>\n<td>Something was decided but nobody remembers why<\/td>\n<td>Decision log<\/td>\n<\/tr>\n<tr>\n<td>An assumption turned out false<\/td>\n<td>Assumption log → impact assessment<\/td>\n<\/tr>\n<tr>\n<td>Scope keeps growing<\/td>\n<td>Change log + scope baseline + RTM<\/td>\n<\/tr>\n<tr>\n<td>You need to choose between uncertain options<\/td>\n<td>Decision tree with EMV<\/td>\n<\/tr>\n<tr>\n<td>The environment shifted<\/td>\n<td>PESTLE scan + business case review<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />", "subs": [{"t": "12.1 Models", "a": "s10-h1"}, {"t": "12.2 Methods", "a": "s10-h2"}, {"t": "12.3 Artifacts", "a": "s10-h3"}, {"t": "12.4 The artifact-to-situation quick map", "a": "s10-h4"}], "text": " pmi's eighth edition separates models (ways of thinking), methods (ways of doing) and artifacts (things produced). exam questions frequently name one and ask when to use it. this is the reference list. 12.1 models situational leadership models situational leadership ii — adapt style to follower competence and commitment: directing (low competence, high commitment) → coaching (some competence, low commitment) → supporting (high competence, variable commitment) → delegating (high competence, high commitment). oscar model — outcome, situation, choices, actions, review. a coaching conversation structure. communication models cross-cultural communication — sender's encoding is filtered by their culture; the receiver decodes through theirs. mismatch is the default, not the exception. effectiveness of communication channels — richness declines from face-to-face → video → phone → written. choose richness to match complexity and sensitivity. gulf of execution and evaluation — the gap between what a user wants to do and what the system allows (execution), and between what the system shows and what the user understands (evaluation). a usability and requirements model. motivation models hygiene and motivational factors (herzberg) · intrinsic vs extrinsic motivation · theory of needs (mcclelland) · theory x, y and z · pink's autonomy, mastery, purpose . change models managing change in organisations — pmi's own framework: formulate change, plan change, implement change, manage transition, sustain change. adkar · kotter's 8-step · virginia satir change model · bridges' transition model · lewin's unfreeze-change-refreeze . complexity models cynefin framework — classify the situation and match the response: clear/simple — sense, categorise, respond. best practice applies. complicated — sense, analyse, respond. good practice; expertise required. complex — probe, sense, respond. emergent practice; safe-to-fail experiments. agile lives here. chaotic — act, sense, respond. novel practice; establish order first. confused/disorder — you do not know which domain you are in. break the situation into parts. stacey matrix — plot requirement certainty against technology certainty: close to agreement and certainty → simple/predictive; far from both → chaos; the middle zone is complex and suits adaptive approaches. project team development models tuckman's ladder · drexler-sibbet team performance model (orientation, trust building, goal clarification, commitment, implementation, high performance, renewal). other models worth knowing conflict model (thomas-kilmann) — the five conflict-handling modes. negotiation — principled negotiation: separate the people from the problem, focus on interests not positions, invent options for mutual gain, insist on objective criteria. know your batna and zopa (zone of possible agreement). planning models — process groups, cadence, rolling wave. process groups as focus areas — initiating, planning, executing, monitoring and controlling, closing. salience model — power, legitimacy, urgency. 12.2 methods data gathering and analysis benchmarking · brainstorming · check sheets · checklists · focus groups · interviews · market research · questionnaires and surveys · delphi · nominal group technique · observation and job shadowing · statistical sampling. analysis methods: alternatives analysis · assumption and constraint analysis · cost-benefit analysis · cost of quality · decision tree · earned value analysis · expected monetary value · influence diagram · life-cycle assessment (environmental impact across the whole life) · make-or-buy · probability and impact matrix · process analysis · regression analysis · reserve analysis · root cause analysis · sensitivity analysis · simulation (monte carlo) · stakeholder analysis · swot · trend analysis · value stream mapping · variance analysis · what-if scenario analysis. estimating methods affinity grouping · analogous · function point · multipoint (three-point) · parametric · relative estimating · single-point · story point · wideband delphi · bottom-up. meetings and events backlog refinement · bidder conference · change control board · daily standup · iteration planning · iteration review · kickoff · lessons learned meeting · planning meeting · project closeout · retrospective · risk review · status meeting · steering committee · release planning . other methods timeboxing · voting (unanimity, majority, plurality, fist of five, roman voting) · multicriteria decision analysis · prioritisation schema (moscow, kano, wsjf, paired comparison, 100 points) · impact mapping · net promoter score · planning poker . 12.3 artifacts strategy artifacts business case · business model canvas · project brief · project charter · roadmap · benefits management plan · project vision statement. logs and registers assumption log · backlog · change log · issue log · lessons learned register · risk register · stakeholder register · impediment log · raid log (risks, assumptions, issues, dependencies) · decision log · defect log . plans change control plan · communications management plan · cost management plan · iteration plan · procurement management plan · project management plan · quality management plan · release plan · requirements management plan · resource management plan · risk management plan · scope management plan · schedule management plan · stakeholder engagement plan · test plan. hierarchy charts wbs · obs (organisational breakdown structure) · rbs (resource or risk breakdown structure) · product breakdown structure · story map . baselines scope baseline · schedule baseline · cost baseline · performance measurement baseline (the three combined) · milestone schedule · budget. visual data and information affinity diagram · burndown/burnup chart · cause-and-effect diagram · cumulative flow diagram · control chart · dashboard · flowchart · gantt chart · histogram · information radiator · lead time chart · prioritisation matrix · project schedule network diagram · probability and impact matrix · requirements traceability matrix · responsibility assignment matrix (raci) · s-curve · scatter diagram · stakeholder engagement assessment matrix · throughput chart · use case · value stream map · velocity chart . reports quality report · risk report · status report · work performance report . agreements and contracts fixed price (ffp, fpif, fpepa) · cost reimbursable (cpff, cpif, cpaf) · time and materials · indefinite delivery indefinite quantity (idiq) · memorandum of understanding (mou) · service level agreement (sla) · master services agreement (msa) · basic ordering agreement · non-disclosure agreement. other artifacts activity list · bid documents (rfi, rfq, rfp) · metrics · project calendar · requirements documentation · project team charter · user story · definition of done · definition of ready · acceptance criteria · test and evaluation documents . 12.4 the artifact-to-situation quick map situation reach for nobody agrees what \"done\" means definition of done / acceptance criteria a requirement seems to have vanished requirements traceability matrix two people think they own the same decision raci chart a stakeholder is blindsiding you late stakeholder register + engagement assessment matrix a risk keeps materialising risk register + root cause analysis nobody knows the current status information radiator / dashboard work is stalling between stages cumulative flow diagram + wip limits the same defect recurs fishbone diagram + pareto estimates are always wrong historical data, parametric or three-point estimating, reserve analysis something was decided but nobody remembers why decision log an assumption turned out false assumption log → impact assessment scope keeps growing change log + scope baseline + rtm you need to choose between uncertain options decision tree with emv the environment shifted pestle scan + business case review "}, {"id": "s11", "title": "Part 13 — Scenario playbook", "html": "<p>Fifty situations that recur on the exam, with the correct first move and the reasoning. Learn the <em>pattern<\/em>, not the wording.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Situation<\/th>\n<th>Correct first move<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>A stakeholder demands a change mid-execution<\/td>\n<td>Log the change request and assess impact across all constraints<\/td>\n<td>Never accept or refuse before analysis<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>The team discovers a defect after customer sign-off<\/td>\n<td>Log it, assess severity and impact, inform the customer, agree a remedy<\/td>\n<td>Transparency; hiding is never right<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>A risk in the register has occurred<\/td>\n<td>Move it to the issue log, assign an owner, execute the planned response<\/td>\n<td>Risks that occur become issues<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>An unforeseen event with no planned response occurs<\/td>\n<td>Implement a workaround, then record the lesson and update the register<\/td>\n<td>Workarounds are for unplanned events<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>A team member's performance drops suddenly<\/td>\n<td>Speak with them privately to understand the cause<\/td>\n<td>Direct, private, empathetic<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Two team members are in open conflict<\/td>\n<td>Facilitate a collaborative problem-solving conversation<\/td>\n<td>Collaborate first<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>A functional manager removes a resource<\/td>\n<td>Consult the resource plan, negotiate with the manager<\/td>\n<td>Negotiate before escalating<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>The sponsor asks you to hide bad news<\/td>\n<td>Report accurately with mitigation options<\/td>\n<td>Honesty is mandatory<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>You are offered a gift by a bidder<\/td>\n<td>Decline and disclose through the defined channel<\/td>\n<td>Appearance of influence is the problem<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>A new regulation affects the product<\/td>\n<td>Assess impact, raise a change request, inform governance<\/td>\n<td>Compliance never deferred<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>A competitor launches first<\/td>\n<td>Re-examine the business case with the sponsor; reprioritise<\/td>\n<td>External change → value reassessment<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Velocity drops after team changes<\/td>\n<td>Explain the re-forming effect, revise the forecast<\/td>\n<td>Teams regress when membership changes<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>A sprint's work is unfinished<\/td>\n<td>Return items to the backlog; do not extend<\/td>\n<td>Sprints are fixed<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>A stakeholder asks a developer directly for a feature<\/td>\n<td>Redirect to the product owner<\/td>\n<td>Protect the backlog and the PO's role<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>The PO is unavailable and decisions stall<\/td>\n<td>Treat as an impediment and work to resolve it<\/td>\n<td>SM removes impediments<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>An impediment has been open for weeks<\/td>\n<td>Escalate with a recommendation<\/td>\n<td>Persistent blockers are governance failures<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>The schedule has slipped and you want it to look correct<\/td>\n<td>Do not re-baseline; report the variance and propose recovery<\/td>\n<td>Silent re-baselining hides performance<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>You are asked to skip a safety inspection<\/td>\n<td>Refuse; escalate the schedule problem instead<\/td>\n<td>Safety is non-negotiable<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>A vendor is late<\/td>\n<td>Meet them, find the cause, agree recovery, document<\/td>\n<td>Relationship first, remedies documented<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>The vendor and internal teams blame each other<\/td>\n<td>Bring both together for root cause analysis<\/td>\n<td>Collaboration over contract<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>Requirements are unclear and volatile<\/td>\n<td>Recommend an adaptive or hybrid approach<\/td>\n<td>Match approach to uncertainty<\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>Requirements are stable and change is expensive<\/td>\n<td>Recommend predictive<\/td>\n<td>Match approach to context<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>Governance wants gates; the team wants iterations<\/td>\n<td>Design a hybrid with defined boundary controls<\/td>\n<td>Hybrid is the answer to both<\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>Nobody agrees on what success means<\/td>\n<td>Facilitate agreement on explicit success metrics; record in governance<\/td>\n<td>Define success before measuring it<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>A stakeholder emerges in month four<\/td>\n<td>Add to the register, analyse, plan engagement<\/td>\n<td>Identification is iterative<\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>A resistant stakeholder blocks progress<\/td>\n<td>Meet privately to understand the cause<\/td>\n<td>Understand before acting<\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>The resistant stakeholder turns out to be right<\/td>\n<td>Incorporate the correction through change control and credit them<\/td>\n<td>Being right beats being consistent<\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>Reports are being ignored<\/td>\n<td>Ask recipients what decisions they need to make; tailor the report<\/td>\n<td>Communication serves decisions<\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>Bad news must be delivered<\/td>\n<td>Interactive communication, then written confirmation<\/td>\n<td>Richness matches sensitivity<\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>A team is working excessive overtime<\/td>\n<td>Address the pace and the underlying schedule problem<\/td>\n<td>Sustainable pace<\/td>\n<\/tr>\n<tr>\n<td>31<\/td>\n<td>An expert is leaving the project<\/td>\n<td>Pair and shadow before they go<\/td>\n<td>Tacit knowledge transfers through interaction<\/td>\n<\/tr>\n<tr>\n<td>32<\/td>\n<td>Lessons learned are only captured at the end<\/td>\n<td>Capture continuously in the register<\/td>\n<td>Continuous capture<\/td>\n<\/tr>\n<tr>\n<td>33<\/td>\n<td>An improvement never reaches other projects<\/td>\n<td>Update the OPA repository<\/td>\n<td>Institutionalise improvements<\/td>\n<\/tr>\n<tr>\n<td>34<\/td>\n<td>A retrospective produces no change<\/td>\n<td>Make actions owned, tracked and time-bound<\/td>\n<td>Actions or it is theatre<\/td>\n<\/tr>\n<tr>\n<td>35<\/td>\n<td>CPI 0.8 and TCPI 1.3<\/td>\n<td>Re-forecast and escalate with options<\/td>\n<td>The original budget is unachievable<\/td>\n<\/tr>\n<tr>\n<td>36<\/td>\n<td>A cost variance sits within threshold<\/td>\n<td>Monitor and analyse the trend<\/td>\n<td>Thresholds exist so you do not over-escalate<\/td>\n<\/tr>\n<tr>\n<td>37<\/td>\n<td>Funding arrives in smaller tranches than planned<\/td>\n<td>Funding limit reconciliation; reschedule or request a change<\/td>\n<td>Match spend to funding<\/td>\n<\/tr>\n<tr>\n<td>38<\/td>\n<td>You must choose between projects<\/td>\n<td>Choose the higher NPV<\/td>\n<td>NPV outranks payback<\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>The business case has collapsed<\/td>\n<td>Prepare options including termination; escalate a recommendation<\/td>\n<td>Sunk cost is irrelevant<\/td>\n<\/tr>\n<tr>\n<td>40<\/td>\n<td>A task will miss the date and there is no float<\/td>\n<td>Assess options and impacts with the team, then present trade-offs<\/td>\n<td>Analyse, then decide with the sponsor<\/td>\n<\/tr>\n<tr>\n<td>41<\/td>\n<td>You are asked to finish earlier with more budget<\/td>\n<td>Crash the cheapest critical-path activities<\/td>\n<td>Crashing costs money<\/td>\n<\/tr>\n<tr>\n<td>42<\/td>\n<td>You are asked to finish earlier with no budget<\/td>\n<td>Consider fast tracking discretionary dependencies, and state the risk<\/td>\n<td>Fast tracking costs risk, not money<\/td>\n<\/tr>\n<tr>\n<td>43<\/td>\n<td>Crashing shortens the critical path below the next path<\/td>\n<td>Stop — the other path becomes critical<\/td>\n<td>Never compress past the next path<\/td>\n<\/tr>\n<tr>\n<td>44<\/td>\n<td>A deliverable passed testing<\/td>\n<td>Proceed to validate scope with the customer<\/td>\n<td>Verify then validate<\/td>\n<\/tr>\n<tr>\n<td>45<\/td>\n<td>The customer refuses to accept a deliverable<\/td>\n<td>Understand the reason against the acceptance criteria; resolve or raise a change<\/td>\n<td>Acceptance criteria are the reference<\/td>\n<\/tr>\n<tr>\n<td>46<\/td>\n<td>A team wants to use an AI tool on confidential data<\/td>\n<td>Check policy, contract and data classification; require human verification<\/td>\n<td>Compliance and accountability<\/td>\n<\/tr>\n<tr>\n<td>47<\/td>\n<td>An AI forecast contradicts the team's judgement<\/td>\n<td>Treat it as one input; verify the data and reconcile with the team<\/td>\n<td>Human in the loop<\/td>\n<\/tr>\n<tr>\n<td>48<\/td>\n<td>The product will exceed the organisation's sustainability commitment<\/td>\n<td>Treat as a requirement breach; assess, report, remediate<\/td>\n<td>Sustainability is a requirement<\/td>\n<\/tr>\n<tr>\n<td>49<\/td>\n<td>Operations says it cannot support the new system<\/td>\n<td>Plan and validate transition readiness before closure<\/td>\n<td>Transition is a closure activity<\/td>\n<\/tr>\n<tr>\n<td>50<\/td>\n<td>The project is cancelled<\/td>\n<td>Run the full closing process anyway<\/td>\n<td>Cancelled projects are formally closed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />", "subs": [], "text": " fifty situations that recur on the exam, with the correct first move and the reasoning. learn the pattern , not the wording. # situation correct first move why 1 a stakeholder demands a change mid-execution log the change request and assess impact across all constraints never accept or refuse before analysis 2 the team discovers a defect after customer sign-off log it, assess severity and impact, inform the customer, agree a remedy transparency; hiding is never right 3 a risk in the register has occurred move it to the issue log, assign an owner, execute the planned response risks that occur become issues 4 an unforeseen event with no planned response occurs implement a workaround, then record the lesson and update the register workarounds are for unplanned events 5 a team member's performance drops suddenly speak with them privately to understand the cause direct, private, empathetic 6 two team members are in open conflict facilitate a collaborative problem-solving conversation collaborate first 7 a functional manager removes a resource consult the resource plan, negotiate with the manager negotiate before escalating 8 the sponsor asks you to hide bad news report accurately with mitigation options honesty is mandatory 9 you are offered a gift by a bidder decline and disclose through the defined channel appearance of influence is the problem 10 a new regulation affects the product assess impact, raise a change request, inform governance compliance never deferred 11 a competitor launches first re-examine the business case with the sponsor; reprioritise external change → value reassessment 12 velocity drops after team changes explain the re-forming effect, revise the forecast teams regress when membership changes 13 a sprint's work is unfinished return items to the backlog; do not extend sprints are fixed 14 a stakeholder asks a developer directly for a feature redirect to the product owner protect the backlog and the po's role 15 the po is unavailable and decisions stall treat as an impediment and work to resolve it sm removes impediments 16 an impediment has been open for weeks escalate with a recommendation persistent blockers are governance failures 17 the schedule has slipped and you want it to look correct do not re-baseline; report the variance and propose recovery silent re-baselining hides performance 18 you are asked to skip a safety inspection refuse; escalate the schedule problem instead safety is non-negotiable 19 a vendor is late meet them, find the cause, agree recovery, document relationship first, remedies documented 20 the vendor and internal teams blame each other bring both together for root cause analysis collaboration over contract 21 requirements are unclear and volatile recommend an adaptive or hybrid approach match approach to uncertainty 22 requirements are stable and change is expensive recommend predictive match approach to context 23 governance wants gates; the team wants iterations design a hybrid with defined boundary controls hybrid is the answer to both 24 nobody agrees on what success means facilitate agreement on explicit success metrics; record in governance define success before measuring it 25 a stakeholder emerges in month four add to the register, analyse, plan engagement identification is iterative 26 a resistant stakeholder blocks progress meet privately to understand the cause understand before acting 27 the resistant stakeholder turns out to be right incorporate the correction through change control and credit them being right beats being consistent 28 reports are being ignored ask recipients what decisions they need to make; tailor the report communication serves decisions 29 bad news must be delivered interactive communication, then written confirmation richness matches sensitivity 30 a team is working excessive overtime address the pace and the underlying schedule problem sustainable pace 31 an expert is leaving the project pair and shadow before they go tacit knowledge transfers through interaction 32 lessons learned are only captured at the end capture continuously in the register continuous capture 33 an improvement never reaches other projects update the opa repository institutionalise improvements 34 a retrospective produces no change make actions owned, tracked and time-bound actions or it is theatre 35 cpi 0.8 and tcpi 1.3 re-forecast and escalate with options the original budget is unachievable 36 a cost variance sits within threshold monitor and analyse the trend thresholds exist so you do not over-escalate 37 funding arrives in smaller tranches than planned funding limit reconciliation; reschedule or request a change match spend to funding 38 you must choose between projects choose the higher npv npv outranks payback 39 the business case has collapsed prepare options including termination; escalate a recommendation sunk cost is irrelevant 40 a task will miss the date and there is no float assess options and impacts with the team, then present trade-offs analyse, then decide with the sponsor 41 you are asked to finish earlier with more budget crash the cheapest critical-path activities crashing costs money 42 you are asked to finish earlier with no budget consider fast tracking discretionary dependencies, and state the risk fast tracking costs risk, not money 43 crashing shortens the critical path below the next path stop — the other path becomes critical never compress past the next path 44 a deliverable passed testing proceed to validate scope with the customer verify then validate 45 the customer refuses to accept a deliverable understand the reason against the acceptance criteria; resolve or raise a change acceptance criteria are the reference 46 a team wants to use an ai tool on confidential data check policy, contract and data classification; require human verification compliance and accountability 47 an ai forecast contradicts the team's judgement treat it as one input; verify the data and reconcile with the team human in the loop 48 the product will exceed the organisation's sustainability commitment treat as a requirement breach; assess, report, remediate sustainability is a requirement 49 operations says it cannot support the new system plan and validate transition readiness before closure transition is a closure activity 50 the project is cancelled run the full closing process anyway cancelled projects are formally closed "}, {"id": "s12", "title": "Part 14 — Extended glossary", "html": "<p><strong>Acceptance criteria<\/strong> — the conditions a deliverable must satisfy to be accepted by the customer.\n<strong>Accepted deliverable<\/strong> — output formally signed off through validate scope.\n<strong>Accuracy<\/strong> — closeness to the true value. Distinct from precision.\n<strong>Activity<\/strong> — a distinct scheduled portion of work, below the work package.\n<strong>Actual cost (AC)<\/strong> — cost incurred for the work performed.\n<strong>Adaptive approach<\/strong> — development approach with emergent requirements delivered iteratively and incrementally.\n<strong>ADKAR<\/strong> — Awareness, Desire, Knowledge, Ability, Reinforcement.\n<strong>Affinity diagram<\/strong> — groups many ideas into related clusters.\n<strong>Agile<\/strong> — family of adaptive approaches based on the Agile Manifesto.\n<strong>Analogous estimating<\/strong> — top-down estimating from similar past work.\n<strong>Assumption<\/strong> — a factor considered true without proof, tracked in the assumption log.\n<strong>Backlog<\/strong> — ordered list of work to be done.\n<strong>Backlog refinement<\/strong> — adding detail, estimates and order to backlog items.\n<strong>Baseline<\/strong> — approved version of scope, schedule or cost, changed only via change control.\n<strong>BATNA<\/strong> — best alternative to a negotiated agreement.\n<strong>Benefits management plan<\/strong> — how and when benefits will be delivered and measured.\n<strong>Benefits owner<\/strong> — the person accountable for realising the benefits, usually in the business.\n<strong>Bidder conference<\/strong> — a meeting with all prospective sellers to ensure equal information.\n<strong>Blocker / impediment<\/strong> — anything preventing the team from progressing.\n<strong>Bottom-up estimating<\/strong> — summing detailed lower-level estimates.\n<strong>Budget at completion (BAC)<\/strong> — total authorised budget.\n<strong>Burndown chart<\/strong> — remaining work over time.\n<strong>Burnup chart<\/strong> — completed work against total scope; shows scope change.\n<strong>Business case<\/strong> — justification for the investment.\n<strong>Cadence<\/strong> — the rhythm of recurring activities.\n<strong>Change control board (CCB)<\/strong> — the body authorised to approve or reject changes.\n<strong>Change log<\/strong> — record of all change requests and their disposition.\n<strong>Change request<\/strong> — formal proposal to modify a baseline or document.\n<strong>Charter<\/strong> — document authorising the project and the PM.\n<strong>Configuration management<\/strong> — control of product versions and characteristics.\n<strong>Constraint<\/strong> — a limiting factor.\n<strong>Contingency reserve<\/strong> — funds or time for identified risks; inside the cost baseline.\n<strong>Contingent response strategy<\/strong> — a response executed only if a defined trigger occurs.\n<strong>Control account<\/strong> — management control point where scope, budget and schedule integrate.\n<strong>Control chart<\/strong> — displays process stability against control limits.\n<strong>Control limits<\/strong> — statistical boundaries of a process, usually ±3σ; set by the process.\n<strong>Cost baseline<\/strong> — approved time-phased budget excluding management reserve.\n<strong>Cost of delay<\/strong> — economic loss per unit time of not having a capability.\n<strong>Cost of quality<\/strong> — conformance plus non-conformance costs.\n<strong>Cost performance index (CPI)<\/strong> — EV ÷ AC.\n<strong>Cost variance (CV)<\/strong> — EV − AC.\n<strong>Crashing<\/strong> — shortening duration by adding resources, at additional cost.\n<strong>Critical chain<\/strong> — the resource-constrained longest path, managed with buffers.\n<strong>Critical path<\/strong> — the longest path through the network; determines minimum duration.\n<strong>Cumulative flow diagram (CFD)<\/strong> — visualises WIP, bottlenecks and cycle time over time.\n<strong>Cycle time<\/strong> — elapsed time from starting work to completing it.\n<strong>Cynefin<\/strong> — sense-making framework classifying situations as clear, complicated, complex or chaotic.\n<strong>Decision tree<\/strong> — analysis comparing options by expected monetary value.\n<strong>Definition of done (DoD)<\/strong> — shared standard for an increment to be releasable.\n<strong>Definition of ready (DoR)<\/strong> — criteria for a backlog item to enter an iteration.\n<strong>Deliverable<\/strong> — any unique, verifiable product, result or capability.\n<strong>Delphi technique<\/strong> — anonymous iterative expert consensus.\n<strong>Dependency<\/strong> — a logical relationship between activities.\n<strong>Development approach<\/strong> — predictive, adaptive or hybrid.\n<strong>Discretionary dependency<\/strong> — preferred rather than required logic.\n<strong>Earned value (EV)<\/strong> — budgeted value of work actually completed.\n<strong>EEF<\/strong> — enterprise environmental factor; conditions outside project control.\n<strong>Emotional intelligence<\/strong> — recognising and managing emotions in self and others.\n<strong>Epic<\/strong> — a large body of work decomposed into features and stories.\n<strong>Escalate<\/strong> — raise beyond your authority, with facts and a recommendation.\n<strong>Estimate at completion (EAC)<\/strong> — forecast total cost.\n<strong>Estimate to complete (ETC)<\/strong> — forecast cost of remaining work.\n<strong>Expected monetary value (EMV)<\/strong> — probability × impact.\n<strong>Explicit knowledge<\/strong> — knowledge that can be codified and documented.\n<strong>Fallback plan<\/strong> — the plan used if the primary risk response fails.\n<strong>Fast tracking<\/strong> — overlapping activities normally done in sequence; adds risk.\n<strong>Feature<\/strong> — a set of related requirements delivering value.\n<strong>Fishbone diagram<\/strong> — cause-and-effect diagram for root cause analysis.\n<strong>Float / slack<\/strong> — permissible delay without affecting the project (total) or the successor (free).\n<strong>Focus areas<\/strong> — PMBOK 8 term for the process groups.\n<strong>Forecast<\/strong> — estimate of future conditions based on current performance.\n<strong>Free float<\/strong> — delay possible without delaying the successor's early start.\n<strong>Functional organisation<\/strong> — hierarchy by specialism; PM authority is minimal.\n<strong>Gold plating<\/strong> — delivering more than required without authorisation.\n<strong>Governance<\/strong> — framework of authority, decision rights and accountability.\n<strong>Grade<\/strong> — a category of features; distinct from quality.\n<strong>Ground rules<\/strong> — agreed behavioural expectations, held in the team charter.\n<strong>Hybrid approach<\/strong> — combination of predictive and adaptive elements.\n<strong>Impediment log<\/strong> — record of blockers and their resolution.\n<strong>Increment<\/strong> — a usable, potentially releasable piece of the product.\n<strong>Incremental delivery<\/strong> — delivering usable pieces successively.\n<strong>Information radiator<\/strong> — large, visible, self-updating display of project state.\n<strong>Issue<\/strong> — a current condition affecting the project; a risk that occurred.\n<strong>Iteration<\/strong> — a fixed timebox producing an increment.\n<strong>Iterative approach<\/strong> — refining the same deliverable through successive cycles.\n<strong>Kanban<\/strong> — flow-based method using visualisation and WIP limits.\n<strong>Kano model<\/strong> — classifies features as basic, performance or delighter.\n<strong>Lag<\/strong> — a delay between dependent activities.\n<strong>Lead<\/strong> — an acceleration allowing overlap between dependent activities.\n<strong>Lead time<\/strong> — elapsed time from customer request to delivery.\n<strong>Lessons learned register<\/strong> — live record during the project.\n<strong>Lessons learned repository<\/strong> — organisational archive; an OPA.\n<strong>Life-cycle cost<\/strong> — total cost of ownership across the whole life, including disposal.\n<strong>Little's Law<\/strong> — cycle time = WIP ÷ throughput.\n<strong>Management reserve<\/strong> — funds for unknown unknowns; outside the cost baseline.\n<strong>Mandatory dependency<\/strong> — hard logic, physically or contractually required.\n<strong>Matrix organisation<\/strong> — dual reporting between functional and project lines.\n<strong>MBI<\/strong> — minimum business increment.\n<strong>Milestone<\/strong> — a significant point with zero duration.\n<strong>Monte Carlo simulation<\/strong> — probabilistic modelling producing outcome distributions.\n<strong>MoSCoW<\/strong> — must, should, could, won't have.\n<strong>MVP<\/strong> — minimum viable product.\n<strong>Net present value (NPV)<\/strong> — discounted future cash flows less investment.\n<strong>Non-conformance cost<\/strong> — internal and external failure costs.\n<strong>OPA<\/strong> — organisational process asset.\n<strong>Opportunity<\/strong> — an uncertain event with positive impact.\n<strong>Outcome<\/strong> — the change resulting from an output.\n<strong>Output<\/strong> — what the project produces.\n<strong>Parametric estimating<\/strong> — estimating using a statistical relationship.\n<strong>Pareto diagram<\/strong> — ordered histogram showing the vital few causes.\n<strong>Payback period<\/strong> — time to recover the investment.\n<strong>Performance measurement baseline<\/strong> — scope, schedule and cost baselines combined.\n<strong>PERT<\/strong> — three-point beta estimate: (O + 4M + P) ÷ 6.\n<strong>PESTLE<\/strong> — political, economic, social, technological, legal, environmental scan.\n<strong>Planned value (PV)<\/strong> — budgeted value of work scheduled.\n<strong>Planning package<\/strong> — control account content not yet decomposed into activities.\n<strong>PMO<\/strong> — project management office: supportive, controlling or directive.\n<strong>Point of total assumption (PTA)<\/strong> — cost beyond which the seller bears all overrun in an FPIF.\n<strong>Portfolio<\/strong> — projects, programmes and operations managed together for strategic objectives.\n<strong>Precision<\/strong> — consistency of repeated measurements.\n<strong>Predictive approach<\/strong> — plan-driven approach with defined scope up front.\n<strong>Prevention cost<\/strong> — cost of preventing defects.\n<strong>Product backlog<\/strong> — the ordered list of everything that might be needed.\n<strong>Product owner<\/strong> — accountable for maximising product value and ordering the backlog.\n<strong>Programme<\/strong> — related projects managed together for benefits not available separately.\n<strong>Progressive elaboration<\/strong> — refining plans as more becomes known.\n<strong>Psychological safety<\/strong> — belief that speaking up will not be punished.\n<strong>Quality<\/strong> — degree to which requirements are fulfilled.\n<strong>RACI<\/strong> — responsible, accountable, consulted, informed.\n<strong>RAID log<\/strong> — risks, assumptions, issues, dependencies.\n<strong>Regression analysis<\/strong> — statistical relationship between variables.\n<strong>Requirements traceability matrix<\/strong> — links requirements to origin and deliverables.\n<strong>Reserve analysis<\/strong> — evaluating the adequacy of contingency and management reserves.\n<strong>Residual risk<\/strong> — risk remaining after responses are implemented.\n<strong>Resource levelling<\/strong> — adjusting dates to resource limits; can change the critical path.\n<strong>Resource smoothing<\/strong> — adjusting within float; does not change the critical path.\n<strong>Retrospective<\/strong> — team review of process producing improvement actions.\n<strong>Risk<\/strong> — an uncertain event that may affect objectives.\n<strong>Risk appetite<\/strong> — degree of uncertainty an organisation will accept for reward.\n<strong>Risk breakdown structure<\/strong> — hierarchical categorisation of risk sources.\n<strong>Risk register<\/strong> — record of individual risks and responses.\n<strong>Risk report<\/strong> — summary of overall project risk.\n<strong>Risk threshold<\/strong> — the measurable level at which action is required.\n<strong>Rolling wave planning<\/strong> — detailed near-term planning, high-level long-term.\n<strong>Root cause analysis<\/strong> — determining the underlying reason for a problem.\n<strong>Rule of seven<\/strong> — seven consecutive points on one side of the mean signals an out-of-control process.\n<strong>S-curve<\/strong> — cumulative cost or effort over time.\n<strong>Salience model<\/strong> — power, legitimacy and urgency classification of stakeholders.\n<strong>Schedule baseline<\/strong> — approved version of the schedule.\n<strong>Schedule performance index (SPI)<\/strong> — EV ÷ PV.\n<strong>Schedule variance (SV)<\/strong> — EV − PV.\n<strong>Scope creep<\/strong> — uncontrolled expansion of scope.\n<strong>Scrum<\/strong> — an agile framework with defined roles, events and artifacts.\n<strong>Secondary risk<\/strong> — a risk created by implementing a risk response.\n<strong>Sensitivity analysis<\/strong> — determining which variables most affect outcomes.\n<strong>Servant leadership<\/strong> — leading by enabling and removing obstacles.\n<strong>Specification limits<\/strong> — customer-set boundaries; wider than control limits.\n<strong>Spike<\/strong> — a timeboxed investigation to reduce uncertainty.\n<strong>Sponsor<\/strong> — provides funding, authority and executive support.\n<strong>Sprint<\/strong> — Scrum's timebox, one month or less.\n<strong>Sprint goal<\/strong> — the single objective of a sprint.\n<strong>Stakeholder<\/strong> — anyone who affects, is affected by, or perceives themselves affected.\n<strong>Stakeholder engagement assessment matrix<\/strong> — current versus desired engagement levels.\n<strong>Story point<\/strong> — a relative measure of size combining complexity, effort and uncertainty.\n<strong>Sunk cost<\/strong> — cost already incurred; irrelevant to future decisions.\n<strong>Sustainability<\/strong> — meeting present needs without compromising future ones; environmental, social and economic.\n<strong>SWOT<\/strong> — strengths, weaknesses, opportunities, threats.\n<strong>Tacit knowledge<\/strong> — experiential knowledge that resists codification.\n<strong>Tailoring<\/strong> — deliberate adaptation of approach and process to context.\n<strong>Technical debt<\/strong> — deferred work that increases future cost.\n<strong>Throughput<\/strong> — items completed per unit of time.\n<strong>Timebox<\/strong> — a fixed, non-extendable period.\n<strong>To-complete performance index (TCPI)<\/strong> — efficiency required on remaining work.\n<strong>Total float<\/strong> — delay possible without delaying the project finish.\n<strong>Transfer<\/strong> — risk response shifting impact to a third party.\n<strong>Trigger / risk trigger<\/strong> — an indicator that a risk is about to occur or has occurred.\n<strong>Triple constraint<\/strong> — scope, schedule, cost; extended by quality, risk, resources and value.\n<strong>Value<\/strong> — the worth or usefulness of something to stakeholders.\n<strong>Value stream map<\/strong> — visualisation of flow and waste.\n<strong>Variance at completion (VAC)<\/strong> — BAC − EAC.\n<strong>Velocity<\/strong> — story points completed per iteration.\n<strong>Verified deliverable<\/strong> — output that has passed control quality.\n<strong>Virtual team<\/strong> — geographically distributed team.\n<strong>WBS<\/strong> — hierarchical decomposition of total project scope.\n<strong>WBS dictionary<\/strong> — detail behind each WBS component.\n<strong>WIP limit<\/strong> — cap on concurrent work items in a workflow stage.\n<strong>Work package<\/strong> — lowest WBS level, where cost and duration are estimated.\n<strong>Work performance data / information / report<\/strong> — raw · analysed · communicated.\n<strong>Workaround<\/strong> — unplanned response to an unanticipated issue.\n<strong>WSJF<\/strong> — weighted shortest job first: cost of delay ÷ job size.\n<strong>ZOPA<\/strong> — zone of possible agreement in a negotiation.<\/p>", "subs": [], "text": " acceptance criteria — the conditions a deliverable must satisfy to be accepted by the customer. accepted deliverable — output formally signed off through validate scope. accuracy — closeness to the true value. distinct from precision. activity — a distinct scheduled portion of work, below the work package. actual e whole life, including disposal. little's law — cycle time = wip ÷ throughput. management reserve — funds for unknown unknowns; outside the cost baseline. mandatory dependency — hard logic, physically or contractually required. matrix organisation — dual reporting between functional and project lines. mbi — minimum business increment. milestone — a significant point with zero duration. monte carlo simulation — probabilistic modelling producing outcome distributions. moscow — must, should, could, won't have. mvp — minimum viable product. net present value (npv) — discounted future cash flows less investment. non-conformance cost — internal and external failure costs. opa — organisational process asset. opportunity — an uncertain event with positive impact. outcome — the change resulting from an output. output — what the project produces. parametric estimating — estimating using a statistical relationship. pareto diagram — ordered histogram showing the vital few causes. payback period — time to recover the investment. performance measurement baseline — scope, schedule and cost baselines combined. pert — three-point beta estimate: (o + 4m + p) ÷ 6. pestle — political, economic, social, technological, legal, environmental scan. planned value (pv) — budgeted value of work scheduled. planning package — control account content not yet decomposed into activities. pmo — project management office: supportive, controlling or directive. point of total assumption (pta) — cost beyond which the seller bears all overrun in an fpif. portfolio — projects, programmes and operations managed together for strategic objectives. precision — consistency of repeated measurements. predictive approach — plan-driven approach with defined scope up front. prevention cost — cost of preventing defects. product backlog — the ordered list of everything that might be needed. product owner — accountable for maximising product value and ordering the backlog. programme — related projects managed together for benefits not available separately. progressive elaboration — refining plans as more becomes known. psychological safety — belief that speaking up will not be punished. quality — degree to which requirements are fulfilled. raci — responsible, accountable, consulted, informed. raid log — risks, assumptions, issues, dependencies. regression analysis — statistical relationship between variables. requirements traceability matrix — links requirements to origin and deliverables. reserve analysis — evaluating the adequacy of contingency and management reserves. residual risk — risk remaining after responses are implemented. resource levelling — adjusting dates to resource limits; can change the critical path. resource smoothing — adjusting within float; does not change the critical path. retrospective — team review of process producing improvement actions. risk — an uncertain event that may affect objectives. risk appetite — degree of uncertainty an organisation will accept for reward. risk breakdown structure — hierarchical categorisation of risk sources. risk register — record of individual risks and responses. risk report — summary of overall project risk. risk threshold — the measurable level at which action is required. rolling wave planning — detailed near-term planning, high-level long-term. root cause analysis — determining the underlying reason for a problem. rule of seven — seven consecutive points on one side of the mean signals an out-of-control process. s-curve — cumulative cost or effort over time. salience model — power, legitimacy and urgency classification of stakeholders. schedule baseline — approved version of the schedule. schedule performance index (spi) — ev ÷ pv. schedule variance (sv) — ev − pv. scope creep — uncontrolled expansion of scope. scrum — an agile framework with defined roles, events and artifacts. secondary risk — a risk created by implementing a risk response. sensitivity analysis — determining which variables most affect outcomes. servant leadership — leading by enabling and removing obstacles. specification limits — customer-set boundaries; wider than control limits. spike — a timeboxed investigation to reduce uncertainty. sponsor — provides funding, authority and executive support. sprint — scrum's timebox, one month or less. sprint goal — the single objective of a sprint. stakeholder — anyone who affects, is affected by, or perceives themselves affected. stakeholder engagement assessment matrix — current versus desired engagement levels. story point — a relative measure of size combining complexity, effort and uncertainty. sunk cost — cost already incurred; irrelevant to future decisions. sustainability — meeting present needs without compromising future ones; environmental, social and economic. swot — strengths, weaknesses, opportunities, threats. tacit knowledge — experiential knowledge that resists codification. tailoring — deliberate adaptation of approach and process to context. technical debt — deferred work that increases future cost. throughput — items completed per unit of time. timebox — a fixed, non-extendable period. to-complete performance index (tcpi) — efficiency required on remaining work. total float — delay possible without delaying the project finish. transfer — risk response shifting impact to a third party. trigger / risk trigger — an indicator that a risk is about to occur or has occurred. triple constraint — scope, schedule, cost; extended by quality, risk, resources and value. value — the worth or usefulness of something to stakeholders. value stream map — visualisation of flow and waste. variance at completion (vac) — bac − eac. velocity — story points completed per iteration. verified deliverable — output that has passed control quality. virtual team — geographically distributed team. wbs — hierarchical decomposition of total project scope. wbs dictionary — detail behind each wbs component. wip limit — cap on concurrent work items in a workflow stage. work package — lowest wbs level, where cost and duration are estimated. work performance data / information / report — raw · analysed · communicated. workaround — unplanned response to an unanticipated issue. wsjf — weighted shortest job first: cost of delay ÷ job size. zopa — zone of possible agreement in a negotiation. "}, {"id": "s13", "title": "Part 17 — Worked calculation walkthroughs", "html": "<p>Step-by-step methods for the calculation types that appear on the exam. Learn the <em>procedure<\/em>; the numbers change.<\/p>\n<h2 id=\"s13-h1\">17.1 Reading a network diagram end to end<\/h2>\n<p><strong>Problem.<\/strong> Activities: A (3 days, start) → B (5) and C (2); B → D (4); C → D; D → E (3, finish). Find the critical path, the project duration and the float on C.<\/p>\n<p><strong>Step 1 — list every path.<\/strong>\n- A-B-D-E = 3 + 5 + 4 + 3 = <strong>15 days<\/strong>\n- A-C-D-E = 3 + 2 + 4 + 3 = <strong>12 days<\/strong><\/p>\n<p><strong>Step 2 — the longest path is critical.<\/strong> A-B-D-E at 15 days. Project duration = 15 days.<\/p>\n<p><strong>Step 3 — float on the non-critical path.<\/strong> 15 − 12 = <strong>3 days<\/strong> of total float shared along A-C-D-E; since A, D and E are on the critical path with zero float, all 3 days sit on <strong>C<\/strong>.<\/p>\n<p><strong>Step 4 — forward pass<\/strong> (ES = earliest start, EF = earliest finish, using EF = ES + duration − 1):\n| Activity | ES | EF |\n|---|---|---|\n| A | 1 | 3 |\n| B | 4 | 8 |\n| C | 4 | 5 |\n| D | 9 | 12 |\n| E | 13 | 15 |<\/p>\n<p>D starts at 9 because it waits for B (the later predecessor), not C.<\/p>\n<p><strong>Step 5 — backward pass<\/strong> (LS = LF − duration + 1), starting from LF of E = 15:\n| Activity | LS | LF | Total float (LS − ES) |\n|---|---|---|---|\n| E | 13 | 15 | 0 |\n| D | 9 | 12 | 0 |\n| C | 7 | 8 | <strong>3<\/strong> |\n| B | 4 | 8 | 0 |\n| A | 1 | 3 | 0 |<\/p>\n<p><strong>Common traps.<\/strong> Using the <em>earlier<\/em> predecessor for a merge point. Forgetting the −1/+1 when the convention is whole days. Assuming only one critical path exists — two paths of equal length are both critical.<\/p>\n<h2 id=\"s13-h2\">17.2 A full earned value case<\/h2>\n<p><strong>Problem.<\/strong> A 12-month project, BAC $960,000, planned to spend evenly. At the end of month 5, 35% of the work is complete and $420,000 has been spent. The overruns are expected to continue.<\/p>\n<p><strong>Step 1 — planned value.<\/strong> Planned progress at month 5 = 5 ÷ 12 = 41.67%.\nPV = 0.4167 × 960,000 = <strong>$400,000<\/strong><\/p>\n<p><strong>Step 2 — earned value.<\/strong> EV = 0.35 × 960,000 = <strong>$336,000<\/strong><\/p>\n<p><strong>Step 3 — actual cost.<\/strong> AC = <strong>$420,000<\/strong><\/p>\n<p><strong>Step 4 — variances.<\/strong>\nCV = 336,000 − 420,000 = <strong>−$84,000<\/strong> (over budget)\nSV = 336,000 − 400,000 = <strong>−$64,000<\/strong> (behind schedule)<\/p>\n<p><strong>Step 5 — indices.<\/strong>\nCPI = 336,000 ÷ 420,000 = <strong>0.80<\/strong>\nSPI = 336,000 ÷ 400,000 = <strong>0.84<\/strong><\/p>\n<p><strong>Step 6 — forecast.<\/strong> Overruns continue, so the typical formula applies:\nEAC = BAC ÷ CPI = 960,000 ÷ 0.80 = <strong>$1,200,000<\/strong>\nETC = 1,200,000 − 420,000 = <strong>$780,000<\/strong>\nVAC = 960,000 − 1,200,000 = <strong>−$240,000<\/strong><\/p>\n<p><strong>Step 7 — is recovery realistic?<\/strong>\nTCPI to BAC = (960,000 − 336,000) ÷ (960,000 − 420,000) = 624,000 ÷ 540,000 = <strong>1.16<\/strong><\/p>\n<p>You have been running at 0.80 and would need 1.16 — a 45% improvement in cost efficiency. Not credible. The correct action is to re-forecast, report the variance with the analysis, and present options to the sponsor.<\/p>\n<p><strong>If the overrun had been a one-off<\/strong> (say a single customs charge), the atypical formula applies instead:\nEAC = AC + (BAC − EV) = 420,000 + 624,000 = <strong>$1,044,000<\/strong><\/p>\n<p><strong>If schedule pressure is also driving cost:<\/strong>\nEAC = AC + [(BAC − EV) ÷ (CPI × SPI)] = 420,000 + (624,000 ÷ 0.672) = 420,000 + 928,571 = <strong>$1,348,571<\/strong><\/p>\n<p>Which formula the exam wants is signalled by the wording: <em>\"current performance will continue\"<\/em> → BAC ÷ CPI. <em>\"the variance was atypical / will not recur\"<\/em> → AC + (BAC − EV). <em>\"both cost and schedule performance affect the remainder\"<\/em> → the CPI × SPI version.<\/p>\n<h2 id=\"s13-h3\">17.3 Three-point estimating across a path<\/h2>\n<p><strong>Problem.<\/strong> Three sequential activities:\n| Activity | O | M | P |\n|---|---|---|---|\n| X | 4 | 6 | 14 |\n| Y | 10 | 12 | 20 |\n| Z | 6 | 9 | 18 |<\/p>\n<p><strong>Step 1 — PERT each activity.<\/strong> (O + 4M + P) ÷ 6\nX = (4 + 24 + 14) ÷ 6 = <strong>7<\/strong>\nY = (10 + 48 + 20) ÷ 6 = <strong>13<\/strong>\nZ = (6 + 36 + 18) ÷ 6 = <strong>10<\/strong>\nPath mean = 7 + 13 + 10 = <strong>30 days<\/strong><\/p>\n<p><strong>Step 2 — standard deviation each.<\/strong> (P − O) ÷ 6\nX = 10 ÷ 6 = 1.67 · Y = 10 ÷ 6 = 1.67 · Z = 12 ÷ 6 = 2.00<\/p>\n<p><strong>Step 3 — variances (σ²).<\/strong> 2.78 + 2.78 + 4.00 = <strong>9.56<\/strong><\/p>\n<p><strong>Step 4 — path standard deviation.<\/strong> √9.56 = <strong>3.09 days<\/strong><\/p>\n<p><strong>Step 5 — confidence ranges.<\/strong>\n68.27%: 30 ± 3.09 → <strong>26.9 to 33.1 days<\/strong>\n95.45%: 30 ± 6.18 → <strong>23.8 to 36.2 days<\/strong>\n99.73%: 30 ± 9.27 → <strong>20.7 to 39.3 days<\/strong><\/p>\n<p><strong>The critical point:<\/strong> variances add, standard deviations do not. Adding 1.67 + 1.67 + 2.00 = 5.34 is wrong.<\/p>\n<h2 id=\"s13-h4\">17.4 Decision tree with EMV<\/h2>\n<p><strong>Problem.<\/strong> Build in-house or buy?\n- <strong>Build:<\/strong> costs $400,000. 70% chance it works first time (value $1,200,000); 30% chance of rework costing a further $250,000 (value still $1,200,000).\n- <strong>Buy:<\/strong> costs $650,000. 90% chance of smooth integration (value $1,200,000); 10% chance of integration problems costing $100,000 (value $1,200,000).<\/p>\n<p><strong>Step 1 — expected cost of each branch.<\/strong>\nBuild: 400,000 + (0.30 × 250,000) = 400,000 + 75,000 = <strong>$475,000<\/strong>\nBuy: 650,000 + (0.10 × 100,000) = 650,000 + 10,000 = <strong>$660,000<\/strong><\/p>\n<p><strong>Step 2 — expected net value.<\/strong>\nBuild: 1,200,000 − 475,000 = <strong>$725,000<\/strong>\nBuy: 1,200,000 − 660,000 = <strong>$540,000<\/strong><\/p>\n<p><strong>Step 3 — decide.<\/strong> Build has the higher expected value. But check against risk appetite: the build branch has a 30% chance of a visible overrun. If the organisation's appetite is low or the overrun would breach a threshold, the lower-variance option may still be chosen. <strong>EMV informs the decision; it does not make it.<\/strong><\/p>\n<h2 id=\"s13-h5\">17.5 Contingency reserve from EMV<\/h2>\n<p><strong>Problem.<\/strong> Risk register:\n| Risk | Probability | Impact |\n|---|---|---|\n| Supplier delay | 30% | −$90,000 |\n| Rework from spec change | 45% | −$40,000 |\n| Currency movement | 20% | −$150,000 |\n| Early vendor discount | 35% | +$60,000 |<\/p>\n<p><strong>Step 1 — EMV per risk.<\/strong>\n−27,000 · −18,000 · −30,000 · +21,000<\/p>\n<p><strong>Step 2 — sum.<\/strong> −27,000 − 18,000 − 30,000 + 21,000 = <strong>−$54,000<\/strong><\/p>\n<p><strong>Step 3 — interpretation.<\/strong> The indicated contingency reserve is <strong>$54,000<\/strong>. Note that it covers the <em>portfolio<\/em> of risks, not any single one — if the currency risk alone occurs, it consumes $150,000 and the reserve is inadequate. That is why reserve analysis and Monte Carlo simulation are used on larger projects, and why reserve consumption is monitored against progress.<\/p>\n<h2 id=\"s13-h6\">17.6 FPIF contract arithmetic<\/h2>\n<p><strong>Problem.<\/strong> Target cost $400,000 · Target fee $40,000 · Target price $440,000 · Ceiling price $500,000 · Share ratio 75/25 (buyer/seller).<\/p>\n<p><strong>Point of total assumption:<\/strong>\nPTA = ((Ceiling − Target price) ÷ Buyer's share) + Target cost\nPTA = ((500,000 − 440,000) ÷ 0.75) + 400,000 = 80,000 + 400,000 = <strong>$480,000<\/strong><\/p>\n<p>Above an actual cost of $480,000 the seller absorbs every further dollar.<\/p>\n<p><strong>Case A — underrun. Actual cost $370,000.<\/strong>\nSaving = 30,000. Seller's share = 25% = $7,500.\nFee = 40,000 + 7,500 = $47,500. <strong>Final price = 370,000 + 47,500 = $417,500.<\/strong><\/p>\n<p><strong>Case B — overrun. Actual cost $450,000.<\/strong>\nOverrun = 50,000. Seller absorbs 25% = $12,500.\nFee = 40,000 − 12,500 = $27,500. <strong>Final price = 450,000 + 27,500 = $477,500<\/strong> (below the ceiling).<\/p>\n<p><strong>Case C — heavy overrun. Actual cost $520,000.<\/strong>\nComputed price would exceed the ceiling, so <strong>the final price is capped at $500,000<\/strong>. The seller's effective fee is negative: they are paid $500,000 against $520,000 of cost, losing $20,000.<\/p>\n<h2 id=\"s13-h7\">17.7 Reading a control chart<\/h2>\n<p>Given a process with a mean of 50, upper control limit 56, lower control limit 44, and customer specification limits of 40 and 60:<\/p>\n<ul>\n<li><strong>Any point outside 44–56<\/strong> → out of control. Investigate the assignable cause.<\/li>\n<li><strong>Seven consecutive points above or below 50<\/strong> → out of control even if all are within limits (the rule of seven). The process has shifted.<\/li>\n<li><strong>A point at 58<\/strong> → inside the specification limits but outside the control limits. The customer would accept the unit, but the <em>process<\/em> is unstable and will eventually produce defects. Act on it.<\/li>\n<li><strong>Specification limits narrower than control limits<\/strong> → the process is not capable of meeting the requirement; no amount of inspection fixes that. The process must be improved.<\/li>\n<\/ul>\n<h2 id=\"s13-h8\">17.8 Reading a cumulative flow diagram<\/h2>\n<ul>\n<li><strong>Widening b
