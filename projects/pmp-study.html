<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMP Study — 2026 Exam</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fbfaf7; --surface:#fff; --surface2:#f4f1ec; --ink:#1b1917; --muted:#65605a;
  --line:#e2ddd5; --accent:#8c4a24; --accent-ink:#fff; --soft:#f3e9e1;
  --ok:#2c6a46; --oksoft:#e8f2ec; --bad:#a3352b; --badsoft:#f9e9e7;
  --shadow:0 2px 14px rgba(40,30,20,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141317; --surface:#1d1c21; --surface2:#26242b; --ink:#ebe8e2; --muted:#a29b92;
  --line:#33303a; --accent:#e29d6b; --accent-ink:#1b1917; --soft:#2b232a;
  --ok:#7cc79a; --oksoft:#1d2a23; --bad:#e8887c; --badsoft:#2c1f1f;
  --shadow:0 2px 16px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#141317; --surface:#1d1c21; --surface2:#26242b; --ink:#ebe8e2; --muted:#a29b92;
  --line:#33303a; --accent:#e29d6b; --accent-ink:#1b1917; --soft:#2b232a;
  --ok:#7cc79a; --oksoft:#1d2a23; --bad:#e8887c; --badsoft:#2c1f1f;
  --shadow:0 2px 16px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);
 border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem}
header .ttl{font-weight:700;font-size:.88rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.ib{background:none;border:1px solid var(--line);border-radius:.45rem;color:var(--ink);
 font:inherit;font-size:.78rem;padding:.32rem .55rem;cursor:pointer;white-space:nowrap}
.ib:hover{background:var(--surface2)}
.ib.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

/* layout */
.wrap{display:flex;max-width:72rem;margin:0 auto}
nav{width:16.5rem;flex:0 0 16.5rem;border-right:1px solid var(--line);background:var(--surface);
 padding:.8rem .6rem 4rem;overflow-y:auto;position:sticky;
 top:calc(env(safe-area-inset-top,0px) + 45px);height:calc(100vh - 45px - env(safe-area-inset-top,0px))}
nav h4{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
 margin:1.1rem .5rem .35rem;font-weight:700}
nav h4:first-child{margin-top:.2rem}
nav a{display:block;padding:.34rem .5rem;border-radius:.4rem;color:var(--ink);text-decoration:none;
 font-size:.83rem;line-height:1.35;margin-bottom:1px}
nav a:hover{background:var(--surface2)}
nav a.on{background:var(--soft);color:var(--accent);font-weight:600}
nav a .n{float:right;color:var(--muted);font-size:.72rem;font-weight:400}
nav a.done::after{content:" ✓";color:var(--ok);font-weight:700}
main{flex:1;min-width:0;padding:1.1rem 1.2rem 5rem}
.backdrop{display:none}
@media (max-width:860px){
  nav{position:fixed;left:0;top:0;bottom:0;height:auto;width:17rem;z-index:60;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow);
    padding-top:calc(env(safe-area-inset-top,0px) + .8rem);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 3rem)}
  body.menu nav{transform:none}
  body.menu .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50}
  main{padding:.9rem .85rem 4rem}
}
@media (min-width:861px){ #menu{display:none} }

/* reading content */
article h1{font-size:1.6rem;line-height:1.2;margin:.3rem 0 1rem;letter-spacing:-.01em}
article h2{font-size:1.18rem;margin:2.1rem 0 .6rem;padding-top:.8rem;border-top:2px solid var(--accent);
 color:var(--accent);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 60px)}
article h3{font-size:1.02rem;margin:1.5rem 0 .4rem}
article h4{font-size:.9rem;margin:1.1rem 0 .3rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
article p{margin:.65rem 0}
article ul,article ol{margin:.55rem 0;padding-left:1.3rem}
article li{margin:.28rem 0}
article hr{border:0;border-top:1px solid var(--line);margin:1.6rem 0}
article a{color:var(--accent)}
article code{background:var(--surface2);padding:.1em .34em;border-radius:.25rem;font-size:.88em}
article blockquote{margin:1rem 0;padding:.7rem .9rem;background:var(--soft);
 border-left:3px solid var(--accent);border-radius:0 .4rem .4rem 0}
article blockquote p{margin:.25rem 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.9rem 0;border:1px solid var(--line);
 border-radius:.5rem;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.83rem}
th,td{padding:.45rem .6rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:650;white-space:nowrap}
tr:last-child td{border-bottom:0}

.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.2rem 0 1.2rem}
.chips a{font-size:.72rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:1rem;
 text-decoration:none;color:var(--muted);background:var(--surface)}
.chips a:hover{border-color:var(--accent);color:var(--accent)}
.pager{display:flex;gap:.5rem;align-items:center;margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);flex-wrap:wrap}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.7rem;margin:1rem 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.8rem .85rem;
 cursor:pointer;text-align:left;font:inherit;color:inherit;display:block;width:100%}
.card:hover{border-color:var(--accent)}
.card b{display:block;font-size:.92rem;margin-bottom:.15rem}
.card small{color:var(--muted);font-size:.76rem}
.card .bar{height:4px;background:var(--surface2);border-radius:2px;margin-top:.5rem;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--ok)}

/* quiz */
.qmeta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:.5rem}
.prog{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:1rem}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stem{font-size:1.02rem;line-height:1.55;margin:.4rem 0 1rem}
.stem .qn{color:var(--accent);font-weight:700;margin-right:.35rem}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--surface);color:var(--ink);
 border:1px solid var(--line);border-radius:.55rem;padding:.65rem .8rem;margin-bottom:.5rem;cursor:pointer;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{display:inline-block;width:1.3rem;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--oksoft)}
.opt.right .l{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.opt.wrong .l{color:var(--bad)}
.fb{border-radius:.55rem;padding:.7rem .85rem;margin:.6rem 0 .2rem;font-size:.92rem}
.fb.g{background:var(--oksoft);border:1px solid var(--ok)}
.fb.r{background:var(--badsoft);border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:.2rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.score{font-size:2.6rem;font-weight:700;line-height:1;margin:.3rem 0}
.score.g{color:var(--ok)} .score.r{color:var(--bad)}
.rev{border:1px solid var(--line);border-radius:.55rem;padding:.7rem .85rem;margin-bottom:.6rem;background:var(--surface);font-size:.9rem}
.rev .t{font-weight:600;margin-bottom:.35rem}
.rev .mine{color:var(--bad)} .rev .corr{color:var(--ok)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.warn{color:var(--bad)}

/* search + misc */
input[type=search],input[type=number]{font:inherit;padding:.5rem .7rem;border:1px solid var(--line);
 border-radius:.5rem;background:var(--surface);color:var(--ink);width:100%}
.res{display:block;padding:.6rem .7rem;border:1px solid var(--line);border-radius:.5rem;margin-bottom:.5rem;
 text-decoration:none;color:inherit;background:var(--surface)}
.res:hover{border-color:var(--accent)}
.res b{display:block;font-size:.88rem;color:var(--accent)}
.res small{color:var(--muted);font-size:.8rem;display:block;margin-top:.15rem}
mark{background:var(--soft);color:var(--accent);padding:0 .12em;border-radius:.2rem}
.note{font-size:.82rem;color:var(--muted);margin:.5rem 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.6rem;margin:1rem 0}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:.55rem;padding:.7rem}
.kpi b{display:block;font-size:1.5rem;line-height:1.1}
.kpi small{color:var(--muted);font-size:.74rem}
label.ck{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;cursor:pointer}
.scen{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:.5rem;
 padding:.1rem .9rem .4rem;margin:0 0 1rem;font-size:.92rem}
.scen summary{cursor:pointer;font-weight:650;font-size:.8rem;color:var(--accent);padding:.5rem 0;letter-spacing:.02em}
.scen p{margin:.2rem 0 .6rem;line-height:1.6}
.mrow{display:grid;grid-template-columns:1fr;gap:.35rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:.55rem;
 margin-bottom:.5rem;background:var(--surface)}
.mrow b{font-size:.9rem}
.mrow select{font:inherit;font-size:.86rem;padding:.4rem .5rem;border:1px solid var(--line);border-radius:.4rem;
 background:var(--bg);color:var(--ink);width:100%}
.mrow.right{border-color:var(--ok);background:var(--oksoft)}
.mrow.wrong{border-color:var(--bad);background:var(--badsoft)}
.mrow .fix{font-size:.8rem;color:var(--ok)}
textarea.bk{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;min-height:7rem;padding:.5rem;
 border:1px solid var(--line);border-radius:.5rem;background:var(--surface);color:var(--ink)}
.kbd{font-size:.72rem;color:var(--muted)}
.hs{cursor:pointer;outline:none}
.hs .hsr{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:fill .12s}
.hs:hover .hsr,.hs:focus .hsr{stroke:var(--accent)}
.hs.sel .hsr{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.hs.right .hsr{fill:var(--oksoft);stroke:var(--ok);stroke-width:2.5}
.hs.wrong .hsr{fill:var(--badsoft);stroke:var(--bad);stroke-width:2.5}
.hs.sel .hsl{stroke-width:5 !important}
.hs.right .hsl{stroke:var(--ok) !important;stroke-width:5 !important}
.hs.wrong .hsl{stroke:var(--bad) !important;stroke-width:5 !important}
.tutor{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:.55rem;padding:.7rem .85rem;
 margin:.6rem 0;background:var(--surface);font-size:.92rem;white-space:pre-wrap;line-height:1.55}
.tutor .who{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.3rem}
.chat{display:flex;flex-direction:column;gap:.55rem;margin:1rem 0}
.bub{padding:.6rem .8rem;border-radius:.7rem;max-width:92%;white-space:pre-wrap;line-height:1.55;font-size:.93rem}
.bub.u{align-self:flex-end;background:var(--soft);border:1px solid var(--line)}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
textarea.in{font:inherit;width:100%;min-height:4.5rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:.5rem;
 background:var(--surface);color:var(--ink);resize:vertical}
select.in{font:inherit;padding:.45rem .6rem;border:1px solid var(--line);border-radius:.5rem;background:var(--surface);color:var(--ink)}
.brk{text-align:center;padding:1.5rem 1rem}
.brk .big{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;margin:.5rem 0}
.secmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:.3rem;margin:1rem 0}
.secmap button{font:inherit;font-size:.78rem;padding:.35rem 0;border:1px solid var(--line);border-radius:.35rem;
 background:var(--surface);color:var(--ink);cursor:pointer}
.secmap button.done{background:var(--soft);border-color:var(--accent)}
.secmap button.fl{box-shadow:inset 0 -3px 0 var(--bad)}
@media print{header,nav,.pager,.chips{display:none}main{padding:0}}
</style>
</head>

</header>

</div>
<script id="DATA" type="application/json">{"sections": [{"id": "s0", "title": "Part 0 — Exam mechanics and eligibility", "html": "<h2 id=\"s0-h1\">0.1 Eligibility<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Education<\/th>\n<th>Experience (within last 10 years)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Upper-secondary / high school / GED (EQF 4, ISCED 3–4)<\/td>\n<td>60 months / 5 years leading projects<\/td>\n<\/tr>\n<tr>\n<td>Associate's, higher certificate, advanced vocational (EQF 5, ISCED 5)<\/td>\n<td>48 months / 4 years<\/td>\n<\/tr>\n<tr>\n<td>Bachelor's or higher (EQF 6, ISCED 6)<\/td>\n<td>36 months / 3 years<\/td>\n<\/tr>\n<tr>\n<td>Bachelor's or postgraduate from a PMI GAC-accredited programme<\/td>\n<td>24 months / 2 years<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Plus <strong>35 hours of ECO-aligned training<\/strong> (waived if you hold an active CAPM).<\/p>\n<p>Rules that catch people out:\n- Experience must be <strong>non-overlapping<\/strong>. Jan–Mar on Project A plus Feb–May on Project B = 5 months, not 7.\n- Counted in <strong>months<\/strong>, not projects.\n- Must be <strong>leading and directing<\/strong> — not participating.\n- Professional setting only. No school projects, no home renovations, no wedding planning.\n- From <strong>1 December 2026<\/strong>, live instructor-led training counts only from an ATP, China REP, or accredited academic programme. Self-paced on-demand from any provider still counts.<\/p>\n<h2 id=\"s0-h2\">0.2 Costs (US, from 6 August 2026)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Member<\/th>\n<th>Non-member<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Exam<\/td>\n<td>$445<\/td>\n<td>$675<\/td>\n<\/tr>\n<tr>\n<td>Retake<\/td>\n<td>~$275<\/td>\n<td>~$375<\/td>\n<\/tr>\n<tr>\n<td>Renewal (3 years)<\/td>\n<td>~$60<\/td>\n<td>~$150<\/td>\n<\/tr>\n<tr>\n<td>PMI membership<\/td>\n<td>~$139–159/yr + $10 one-off<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Join PMI first: membership + member exam ≈ $594 versus $675 for the non-member exam alone.<\/p>\n<h2 id=\"s0-h3\">0.3 Exam structure<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Questions<\/td>\n<td>180 (170 scored, 10 unscored pretest)<\/td>\n<\/tr>\n<tr>\n<td>Time<\/td>\n<td>240 minutes<\/td>\n<\/tr>\n<tr>\n<td>Breaks<\/td>\n<td>Two 10-minute breaks — first after the case-study section, second mid-way through independent questions<\/td>\n<\/tr>\n<tr>\n<td>Sections<\/td>\n<td>Case-study section, then independent questions. <strong>Once you break you cannot return to the previous section.<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Question types<\/td>\n<td>Case/scenario (new), graphic-based (new), multiple choice, multiple response, enhanced matching, matching, point-and-click, pull-down list. The last four are <strong>test-centre only<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Delivery<\/td>\n<td>Pearson VUE test centre (recommended) or OnVUE online proctored<\/td>\n<\/tr>\n<tr>\n<td>Retakes<\/td>\n<td>3 attempts within a 1-year eligibility period<\/td>\n<\/tr>\n<tr>\n<td>Scoring<\/td>\n<td>No published pass mark. Domain ratings: Above Target / Target / Below Target / Needs Improvement. Aim for 75–80% on ECO-aligned mocks.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Pacing: ~80 seconds per question. Check the clock at Q45 (60 min), Q90 (120 min), Q135 (180 min).<\/p>\n<hr />", "subs": [{"t": "0.1 Eligibility", "a": "s0-h1"}, {"t": "0.2 Costs (US, from 6 August 2026)", "a": "s0-h2"}, {"t": "0.3 Exam structure", "a": "s0-h3"}], "text": " 0.1 eligibility education experience (within last 10 years) upper-secondary / high school / ged (eqf 4, isced 3–4) 60 months / 5 years leading projects associate's, higher certificate, advanced vocational (eqf 5, isced 5) 48 months / 4 years bachelor's or higher (eqf 6, isced 6) 36 months / 3 years bachelor's or postgraduate from a pmi gac-accredited programme 24 months / 2 years plus 35 hours of eco-aligned training (waived if you hold an active capm). rules that catch people out: - experience must be non-overlapping . jan–mar on project a plus feb–may on project b = 5 months, not 7. - counted in months , not projects. - must be leading and directing — not participating. - professional setting only. no school projects, no home renovations, no wedding planning. - from 1 december 2026 , live instructor-led training counts only from an atp, china rep, or accredited academic programme. self-paced on-demand from any provider still counts. 0.2 costs (us, from 6 august 2026) item member non-member exam $445 $675 retake ~$275 ~$375 renewal (3 years) ~$60 ~$150 pmi membership ~$139–159/yr + $10 one-off — join pmi first: membership + member exam ≈ $594 versus $675 for the non-member exam alone. 0.3 exam structure questions 180 (170 scored, 10 unscored pretest) time 240 minutes breaks two 10-minute breaks — first after the case-study section, second mid-way through independent questions sections case-study section, then independent questions. once you break you cannot return to the previous section. question types case/scenario (new), graphic-based (new), multiple choice, multiple response, enhanced matching, matching, point-and-click, pull-down list. the last four are test-centre only . delivery pearson vue test centre (recommended) or onvue online proctored retakes 3 attempts within a 1-year eligibility period scoring no published pass mark. domain ratings: above target / target / below target / needs improvement. aim for 75–80% on eco-aligned mocks. pacing: ~80 seconds per question. check the clock at q45 (60 min), q90 (120 min), q135 (180 min). "}, {"id": "s1", "title": "Part 1 — Foundations", "html": "<h2 id=\"s1-h1\">1.1 What a project is<\/h2>\n<p>A <strong>project<\/strong> is a temporary initiative in a unique context undertaken to create value.<\/p>\n<ul>\n<li><strong>Temporary<\/strong> — it has a beginning and an end. \"Temporary\" says nothing about duration; a ten-year dam is temporary, a two-week maintenance cycle may be operations.<\/li>\n<li><strong>Unique<\/strong> — driven by distinct goals, environment, approach, stakeholders or constraints. Building the tenth identical house on an estate is still unique because the ground, weather, crew and market differ.<\/li>\n<li><strong>Creates value<\/strong> — this is the Eighth Edition's framing. Projects exist to produce outcomes worth more than they cost.<\/li>\n<\/ul>\n<p><strong>Project vs operations:<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Project<\/th>\n<th>Operations<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Temporary<\/td>\n<td>Ongoing<\/td>\n<\/tr>\n<tr>\n<td>Unique output<\/td>\n<td>Repetitive output<\/td>\n<\/tr>\n<tr>\n<td>Ends when objectives are met<\/td>\n<td>Sustains the business<\/td>\n<\/tr>\n<tr>\n<td>Team disbands<\/td>\n<td>Team persists<\/td>\n<\/tr>\n<tr>\n<td>Success = value delivered<\/td>\n<td>Success = efficiency and continuity<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Projects <strong>hand over<\/strong> to operations. A transition that is not planned is a classic exam failure — \"validate readiness for transition\" is an explicit ECO enabler.<\/p>\n<p><strong>Why projects are initiated<\/strong> — the \"business needs\" categories:\n- Regulatory or legal requirement\n- Stakeholder request\n- Technological advance\n- Market demand\n- Business or process improvement\n- Social need\n- Environmental consideration<\/p>\n<h2 id=\"s1-h2\">1.2 Portfolio, programme, project, operations<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>Contains<\/th>\n<th>Concerned with<\/th>\n<th>Success measured by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Portfolio<\/strong><\/td>\n<td>Programmes, projects, operations<\/td>\n<td>Doing the <em>right<\/em> things; strategic alignment; investment balance<\/td>\n<td>Aggregate value, strategic contribution<\/td>\n<\/tr>\n<tr>\n<td><strong>Programme<\/strong><\/td>\n<td>Related projects and sub-programmes<\/td>\n<td>Benefits that only arise from managing components together<\/td>\n<td>Benefits realised<\/td>\n<\/tr>\n<tr>\n<td><strong>Project<\/strong><\/td>\n<td>Work packages / increments<\/td>\n<td>Delivering a specific output or outcome<\/td>\n<td>Value delivered, objectives met<\/td>\n<\/tr>\n<tr>\n<td><strong>Operations<\/strong><\/td>\n<td>Recurring work<\/td>\n<td>Running the business<\/td>\n<td>Efficiency, continuity<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Key distinction: components sit in a <strong>programme<\/strong> because managing them together produces benefits you could not get separately (shared infrastructure, sequenced rollout). They sit in a <strong>portfolio<\/strong> simply because they compete for the same funds and attention.<\/p>\n<h2 id=\"s1-h3\">1.3 The value delivery system<\/h2>\n<p>PMI's Eighth Edition frames everything as a <strong>system for value delivery<\/strong>: strategy → portfolio → programmes and projects → products → operations → value to stakeholders, with <strong>information flowing back<\/strong> to strategy.<\/p>\n<p><strong>Value<\/strong> = the worth, importance or usefulness of something. It is judged by the stakeholder, not the deliverer. Value can be:\n- Financial (revenue, cost avoidance)\n- Strategic (market position, capability)\n- Social (community benefit)\n- Environmental (reduced impact)<\/p>\n<p><strong>Project success — the modern definition:<\/strong> the project delivered value worth the effort and expense. This <em>builds on<\/em> the traditional metrics (scope, schedule, cost, quality) rather than replacing them. On the exam, an option that hits the schedule but destroys value is wrong.<\/p>\n<p><strong>Outputs vs outcomes vs benefits:<\/strong>\n- <strong>Output<\/strong> — what you build (a trained workforce, an app, a bridge).\n- <strong>Outcome<\/strong> — the change that results (people use the app; traffic flows).\n- <strong>Benefit<\/strong> — the measurable gain (23% fewer support calls; 12 minutes saved per commuter).<\/p>\n<p>The project manager is accountable for outputs and increasingly for enabling outcomes; the <strong>benefits owner<\/strong> (often the sponsor) is accountable for benefits. This distinction is now heavily tested.<\/p>\n<h2 id=\"s1-h4\">1.4 The six principles (PMBOK 8)<\/h2>\n<ol>\n<li><strong>Adopt a holistic view<\/strong> — see the project as a system inside a larger system. Second-order effects matter.<\/li>\n<li><strong>Focus on value<\/strong> — continually evaluate whether the project still justifies its investment.<\/li>\n<li><strong>Embed quality into processes and deliverables<\/strong> — build quality in, do not inspect it in.<\/li>\n<li><strong>Be an accountable leader<\/strong> — model integrity, take ownership, serve the team.<\/li>\n<li><strong>Integrate sustainability within all project areas<\/strong> — environmental, social and economic impact are project concerns.<\/li>\n<li><strong>Build an empowered culture<\/strong> — psychological safety, distributed decision-making, diversity of thought.<\/li>\n<\/ol>\n<p>These map to how PMI wants you to <em>behave<\/em>. When two answers are technically correct, the one that reflects a principle wins.<\/p>\n<h2 id=\"s1-h5\">1.5 The seven performance domains (PMBOK 8)<\/h2>\n<p><strong>Governance · Scope · Schedule · Finance · Stakeholders · Resources · Risk<\/strong><\/p>\n<p>They interact continuously — they are not phases. Each has processes, tailoring considerations, and \"check results\" indicators.<\/p>\n<p>Note what changed from the Seventh Edition: <em>Governance<\/em> and <em>Finance<\/em> are now named domains (a major signal about the 26% Business Environment weighting), while Team, Planning, Project Work, Delivery, Measurement and Uncertainty were reorganised.<\/p>\n<h2 id=\"s1-h6\">1.6 The five focus areas (process groups, restored)<\/h2>\n<p><strong>Initiating · Planning · Executing · Monitoring and Controlling · Closing<\/strong>, containing roughly 40 non-prescriptive processes.<\/p>\n<p>They are <strong>not sequential phases<\/strong>. On a predictive project they overlap; on an adaptive project they repeat every iteration. Monitoring and Controlling runs throughout.<\/p>\n<p>Classic mapping (useful for predictive questions):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Focus area<\/th>\n<th>Core activities<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Initiating<\/td>\n<td>Charter, identify stakeholders, assign PM, high-level scope and risks<\/td>\n<\/tr>\n<tr>\n<td>Planning<\/td>\n<td>All subsidiary plans, baselines, WBS, schedule, budget, risk register<\/td>\n<\/tr>\n<tr>\n<td>Executing<\/td>\n<td>Do the work, develop and manage the team, manage communications and engagement, conduct procurements, manage quality<\/td>\n<\/tr>\n<tr>\n<td>Monitoring &amp; Controlling<\/td>\n<td>Measure performance, control scope/schedule/cost/quality/resources/risk/procurement, <strong>integrated change control<\/strong>, validate scope<\/td>\n<\/tr>\n<tr>\n<td>Closing<\/td>\n<td>Close project or phase, final lessons learned, release resources, close procurements, transition<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s1-h7\">1.7 Life cycles and development approaches<\/h2>\n<p><strong>Project life cycle<\/strong> = the series of phases from start to finish.\n<strong>Development approach<\/strong> = how the deliverable is built (predictive, adaptive, hybrid).\n<strong>Delivery cadence<\/strong> = how often you release (single, multiple, periodic, continuous).<\/p>\n<p>These three are independent. You can have an iterative development approach with a single delivery at the end.<\/p>\n<h3>Comparison<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Predictive<\/th>\n<th>Iterative<\/th>\n<th>Incremental<\/th>\n<th>Adaptive/Agile<\/th>\n<th>Hybrid<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Requirements<\/td>\n<td>Fixed up front<\/td>\n<td>Refined through prototypes<\/td>\n<td>Fixed per increment<\/td>\n<td>Emergent<\/td>\n<td>Mixed<\/td>\n<\/tr>\n<tr>\n<td>Delivery<\/td>\n<td>Once at the end<\/td>\n<td>Once, after refinement<\/td>\n<td>Frequent partial deliveries<\/td>\n<td>Frequent, value-ordered<\/td>\n<td>Both<\/td>\n<\/tr>\n<tr>\n<td>Goal<\/td>\n<td>Manage cost<\/td>\n<td>Correctness of the solution<\/td>\n<td>Speed to partial value<\/td>\n<td>Value and feedback<\/td>\n<td>Balance<\/td>\n<\/tr>\n<tr>\n<td>Change<\/td>\n<td>Controlled, costly<\/td>\n<td>Expected within cycles<\/td>\n<td>Between increments<\/td>\n<td>Welcomed<\/td>\n<td>Controlled at boundaries<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Iterative vs incremental<\/strong> — a frequent exam distinction. Iterative = building the <em>same thing better<\/em> through successive refinement (a painting you keep improving). Incremental = building <em>more of the thing<\/em> in usable pieces (a wall, brick by brick). Agile is usually both.<\/p>\n<h3>Selecting an approach<\/h3>\n<p>Choose <strong>predictive<\/strong> when:\n- Requirements are stable and well understood\n- The regulatory or contractual environment demands up-front definition\n- The cost of change is high (construction, hardware, safety-critical)\n- Delivery in pieces provides no value\n- Teams are distributed or contractually separated<\/p>\n<p>Choose <strong>adaptive<\/strong> when:\n- Requirements are uncertain or volatile\n- Rapid feedback is available and valuable\n- The customer can be continuously engaged\n- The cost of change is low\n- Partial delivery has real value\n- The team is small, co-located or well-connected, cross-functional and dedicated<\/p>\n<p>Choose <strong>hybrid<\/strong> when the project has both kinds of work. In practice this is most projects.<\/p>\n<p><strong>Suitability filters PMI uses:<\/strong> culture (does the organisation tolerate self-organisation?), team (size, skills, dedication, distribution), and project (criticality, rate of change, delivery options, requirement stability, incremental value).<\/p>\n<h2 id=\"s1-h8\">1.8 Tailoring<\/h2>\n<p>Tailoring is the deliberate adaptation of approach, governance, processes, artifacts and engagement to the context. It is a <strong>principle-level obligation<\/strong>, not an optional extra.<\/p>\n<p><strong>The tailoring process:<\/strong>\n1. Select the initial development approach\n2. Tailor for the organisation (governance, mandated methods, compliance)\n3. Tailor for the project (size, criticality, team, duration, stakeholder complexity)\n4. Implement ongoing improvement (retrospectives feed back into the process)<\/p>\n<p><strong>What you can tailor:<\/strong> life cycle and approach, processes (add, remove, modify, blend, align), engagement (people, empowerment, integration), tools, methods, artifacts.<\/p>\n<p><strong>What you cannot tailor away:<\/strong> ethics, compliance, safety, and organisational governance requirements.<\/p>\n<p>Exam trigger: whenever an answer says \"follow the standard process regardless of context\", it is usually wrong; whenever an answer says \"assess the project's characteristics and adapt the process\", it is usually right.<\/p>\n<h2 id=\"s1-h9\">1.9 Organisational structures<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Structure<\/th>\n<th>PM authority<\/th>\n<th>PM role<\/th>\n<th>Budget controlled by<\/th>\n<th>Resource availability<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Organic / simple<\/td>\n<td>Little or none<\/td>\n<td>Part-time coordinator<\/td>\n<td>Owner/operator<\/td>\n<td>Little<\/td>\n<\/tr>\n<tr>\n<td>Functional<\/td>\n<td>Little or none<\/td>\n<td>Part-time<\/td>\n<td>Functional manager<\/td>\n<td>Little<\/td>\n<\/tr>\n<tr>\n<td>Weak matrix<\/td>\n<td>Low<\/td>\n<td>Part-time coordinator/expediter<\/td>\n<td>Functional manager<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr>\n<td>Balanced matrix<\/td>\n<td>Low to moderate<\/td>\n<td>Full-time<\/td>\n<td>Mixed<\/td>\n<td>Low to moderate<\/td>\n<\/tr>\n<tr>\n<td>Strong matrix<\/td>\n<td>Moderate to high<\/td>\n<td>Full-time<\/td>\n<td>Project manager<\/td>\n<td>Moderate to high<\/td>\n<\/tr>\n<tr>\n<td>Projectised<\/td>\n<td>High to almost total<\/td>\n<td>Full-time<\/td>\n<td>Project manager<\/td>\n<td>High<\/td>\n<\/tr>\n<tr>\n<td>Virtual / hybrid<\/td>\n<td>Mixed<\/td>\n<td>Mixed<\/td>\n<td>Mixed<\/td>\n<td>Mixed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Project expediter<\/strong> = staff assistant, no decision authority. <strong>Project coordinator<\/strong> = some authority, reports higher up. Both appear in weak matrices.<\/p>\n<p>In a <strong>functional or weak matrix<\/strong>, the PM's main tool is influence, and negotiating for resources with functional managers is a constant task. Exam scenarios about resource conflict in a matrix almost always want you to negotiate with the functional manager — <em>after<\/em> checking the resource management plan.<\/p>\n<h2 id=\"s1-h10\">1.10 EEFs and OPAs<\/h2>\n<p><strong>Enterprise Environmental Factors (EEFs)<\/strong> — conditions that influence the project but that the team does not control.\n- <em>Internal:<\/em> culture, structure, governance, geographic distribution, infrastructure, IT software, resource availability, employee capability\n- <em>External:<\/em> marketplace conditions, social and cultural influences, legal restrictions, commercial databases, academic research, government standards, financial considerations, physical environment<\/p>\n<p><strong>Organisational Process Assets (OPAs)<\/strong> — plans, processes, policies, procedures and knowledge bases the organisation owns and the project <em>uses and updates<\/em>.\n- <em>Processes, policies and procedures:<\/em> templates, guidelines, change control procedures, financial controls, issue and defect management procedures. These are <strong>updated by the PMO, not by the project<\/strong>.\n- <em>Organisational knowledge repositories:<\/em> configuration management, financial data, historical information, <strong>lessons learned repository<\/strong>, issue and defect databases, metrics files. These <strong>are<\/strong> updated by the project.<\/p>\n<p>Memory hook: <strong>EEF = the weather (you adapt to it). OPA = your toolbox (you use it and put things back).<\/strong><\/p>\n<h2 id=\"s1-h11\">1.11 Project management roles<\/h2>\n<ul>\n<li><strong>Sponsor<\/strong> — provides funding and executive support, champions the project, resolves issues beyond the PM's authority, owns the business case and usually the benefits. Escalation target.<\/li>\n<li><strong>Project manager<\/strong> — leads the project team, delivers objectives, integrates everything.<\/li>\n<li><strong>Project management team<\/strong> — those directly involved in management activities.<\/li>\n<li><strong>Project team<\/strong> — everyone doing the work.<\/li>\n<li><strong>Product owner / customer<\/strong> — defines value and priority (adaptive contexts).<\/li>\n<li><strong>Functional manager<\/strong> — owns the resources and their technical development.<\/li>\n<li><strong>PMO<\/strong> — see Part 4.<\/li>\n<li><strong>Steering committee<\/strong> — governance body making cross-project decisions.<\/li>\n<li><strong>Change control board (CCB)<\/strong> — approves or rejects change requests.<\/li>\n<\/ul>\n<h2 id=\"s1-h12\">1.12 The PMI Code of Ethics and Professional Conduct<\/h2>\n<p>Four values, each with <strong>aspirational<\/strong> standards (what you strive for) and <strong>mandatory<\/strong> standards (what you must do):<\/p>\n<ol>\n<li><strong>Responsibility<\/strong> — own your decisions and their consequences; report unethical conduct; only take assignments you are qualified for; protect confidential information.<\/li>\n<li><strong>Respect<\/strong> — negotiate in good faith; do not use power to influence others for personal benefit; do not act abusively; respect cultural norms.<\/li>\n<li><strong>Fairness<\/strong> — disclose conflicts of interest proactively; no favouritism, no discrimination, no nepotism; impartial decision-making.<\/li>\n<li><strong>Honesty<\/strong> — truthful communication; no deception; do not create false impressions or omit material facts.<\/li>\n<\/ol>\n<p><strong>Exam rules derived from the Code:<\/strong>\n- Disclose any conflict of interest immediately and remove yourself from the decision.\n- Report violations through proper channels — even if the violator is senior.\n- Never accept gifts that could appear to influence a decision; check organisational policy and local custom, then disclose.\n- Never misrepresent status, qualifications or experience.\n- Culturally sensitive practices that are <em>legal and customary<\/em> may be accepted; bribery never is.<\/p>\n<hr />", "subs": [{"t": "1.1 What a project is", "a": "s1-h1"}, {"t": "1.2 Portfolio, programme, project, operations", "a": "s1-h2"}, {"t": "1.3 The value delivery system", "a": "s1-h3"}, {"t": "1.4 The six principles (PMBOK 8)", "a": "s1-h4"}, {"t": "1.5 The seven performance domains (PMBOK 8)", "a": "s1-h5"}, {"t": "1.6 The five focus areas (process groups, restored)", "a": "s1-h6"}, {"t": "1.7 Life cycles and development approaches", "a": "s1-h7"}, {"t": "1.8 Tailoring", "a": "s1-h8"}, {"t": "1.9 Organisational structures", "a": "s1-h9"}, {"t": "1.10 EEFs and OPAs", "a": "s1-h10"}, {"t": "1.11 Project management roles", "a": "s1-h11"}, {"t": "1.12 The PMI Code of Ethics and Professional Conduct", "a": "s1-h12"}], "text": " 1.1 what a project is a project is a temporary initiative in a unique context undertaken to create value. temporary — it has a beginning and an end. \"temporary\" says nothing about duration; a ten-year dam is temporary, a two-week maintenance cycle may be operations. unique — driven by distinct goals, environment, approach, stakeholders or constraints. building the tenth identical house on an estate is still unique because the ground, weather, crew and market differ. creates value — this is the eighth edition's framin ll, brick by brick). agile is usually both. selecting an approach choose predictive when: - requirements are stable and well understood - the regulatory or contractual environment demands up-front definition - the cost of change is high (construction, hardware, safety-critical) - delivery in pieces provides no value - teams are distributed or contractually separated choose adaptive when: - requirements are uncertain or volatile - rapid feedback is available and valuable - the customer can be continuously engaged - the cost of change is low - partial delivery has real value - the team is small, co-located or well-connected, cross-functional and dedicated choose hybrid when the project has both kinds of work. in practice this is most projects. suitability filters pmi uses: culture (does the organisation tolerate self-organisation?), team (size, skills, dedication, distribution), and project (criticality, rate of change, delivery options, requirement stability, incremental value). 1.8 tailoring tailoring is the deliberate adaptation of approach, governance, processes, artifacts and engagement to the context. it is a principle-level obligation , not an optional extra. the tailoring process: 1. select the initial development approach 2. tailor for the organisation (governance, mandated methods, compliance) 3. tailor for the project (size, criticality, team, duration, stakeholder complexity) 4. implement ongoing improvement (retrospectives feed back into the process) what you can tailor: life cycle and approach, processes (add, remove, modify, blend, align), engagement (people, empowerment, integration), tools, methods, artifacts. what you cannot tailor away: ethics, compliance, safety, and organisational governance requirements. exam trigger: whenever an answer says \"follow the standard process regardless of context\", it is usually wrong; whenever an answer says \"assess the project's characteristics and adapt the process\", it is usually right. 1.9 organisational structures structure pm authority pm role budget controlled by resource availability organic / simple little or none part-time coordinator owner/operator little functional little or none part-time functional manager little weak matrix low part-time coordinator/expediter functional manager low balanced matrix low to moderate full-time mixed low to moderate strong matrix moderate to high full-time project manager moderate to high projectised high to almost total full-time project manager high virtual / hybrid mixed mixed mixed mixed project expediter = staff assistant, no decision authority. project coordinator = some authority, reports higher up. both appear in weak matrices. in a functional or weak matrix , the pm's main tool is influence, and negotiating for resources with functional managers is a constant task. exam scenarios about resource conflict in a matrix almost always want you to negotiate with the functional manager — after checking the resource management plan. 1.10 eefs and opas enterprise environmental factors (eefs) — conditions that influence the project but that the team does not control. - internal: culture, structure, governance, geographic distribution, infrastructure, it software, resource availability, employee capability - external: marketplace conditions, social and cultural influences, legal restrictions, commercial databases, academic research, government standards, financial considerations, physical environment organisational process assets (opas) — plans, processes, policies, procedures and knowledge bases the organisation owns and the project uses and updates . - processes, policies and procedures: templates, guidelines, change control procedures, financial controls, issue and defect management procedures. these are updated by the pmo, not by the project . - organisational knowledge repositories: configuration management, financial data, historical information, lessons learned repository , issue and defect databases, metrics files. these are updated by the project. memory hook: eef = the weather (you adapt to it). opa = your toolbox (you use it and put things back). 1.11 project management roles sponsor — provides funding and executive support, champions the project, resolves issues beyond the pm's authority, owns the business case and usually the benefits. escalation target. project manager — leads the project team, delivers objectives, integrates everything. project management team — those directly involved in management activities. project team — everyone doing the work. product owner / customer — defines value and priority (adaptive contexts). functional manager — owns the resources and their technical development. pmo — see part 4. steering committee — governance body making cross-project decisions. change control board (ccb) — approves or rejects change requests. 1.12 the pmi code of ethics and professional conduct four values, each with aspirational standards (what you strive for) and mandatory standards (what you must do): responsibility — own your decisions and their consequences; report unethical conduct; only take assignments you are qualified for; protect confidential information. respect — negotiate in good faith; do not use power to influence others for personal benefit; do not act abusively; respect cultural norms. fairness — disclose conflicts of interest proactively; no favouritism, no discrimination, no nepotism; impartial decision-making. honesty — truthful communication; no deception; do not create false impressions or omit material facts. exam rules derived from the code: - disclose any conflict of interest immediately and remove yourself from the decision. - report violations through proper channels — even if the violator is senior. - never accept gifts that could appear to influence a decision; check organisational policy and local custom, then disclose. - never misrepresent status, qualifications or experience. - culturally sensitive practices that are legal and customary may be accepted; bribery never is. "}, {"id": "s2", "title": "Part 2 — People domain (33%)", "html": "<p><em>ECO Tasks: develop a common vision · manage conflicts · lead the project team · engage stakeholders · align stakeholder expectations · manage stakeholder expectations · ensure knowledge transfer · plan and manage communication<\/em><\/p>\n<h2 id=\"s2-h1\">2.1 Develop a common vision<\/h2>\n<p>A <strong>shared vision<\/strong> is a concise statement of why the project exists and what success looks like, understood the same way by everyone.<\/p>\n<p><strong>How to create one:<\/strong>\n- Facilitate a session with key stakeholders rather than writing it and announcing it\n- Anchor it to the business case and the value the project delivers\n- Test it: ask three stakeholders separately to state the goal. Divergent answers mean you do not have a shared vision\n- Capture it visibly — a project charter, a vision statement, a product vision box, an elevator pitch<\/p>\n<p><strong>Tools:<\/strong>\n- <strong>Project charter<\/strong> — the formal anchor in predictive contexts\n- <strong>Product vision statement<\/strong> / <strong>elevator statement<\/strong> — \"For [target customer] who [need], the [product] is a [category] that [key benefit]. Unlike [alternative], our product [differentiator].\"\n- <strong>Kick-off meeting<\/strong> — the moment of alignment\n- <strong>Information radiators<\/strong> — keep the vision current and visible<\/p>\n<p><strong>Keeping it current:<\/strong> re-validate the vision when the business case changes, when a major change request lands, at phase gates, and at release planning. A vision no one revisits becomes a poster.<\/p>\n<p><strong>Root-cause analysis of misalignment<\/strong> — when people pull in different directions, do not just restate the vision. Ask why: conflicting incentives? unclear success metrics? a stakeholder who was never consulted? Use <strong>5 Whys<\/strong>, fishbone (Ishikawa) diagrams, or a simple stakeholder interview round.<\/p>\n<h2 id=\"s2-h2\">2.2 Team development and leadership<\/h2>\n<h3>Tuckman's ladder<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Behaviour<\/th>\n<th>What the leader does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Forming<\/strong><\/td>\n<td>Polite, tentative, dependent on the leader<\/td>\n<td>Provide direction, clarify purpose and roles<\/td>\n<\/tr>\n<tr>\n<td><strong>Storming<\/strong><\/td>\n<td>Conflict over approach, roles, authority<\/td>\n<td>Coach; surface and resolve conflict; hold ground rules<\/td>\n<\/tr>\n<tr>\n<td><strong>Norming<\/strong><\/td>\n<td>Norms settle, trust builds<\/td>\n<td>Facilitate; step back<\/td>\n<\/tr>\n<tr>\n<td><strong>Performing<\/strong><\/td>\n<td>Self-organising, high output<\/td>\n<td>Delegate; remove impediments<\/td>\n<\/tr>\n<tr>\n<td><strong>Adjourning<\/strong><\/td>\n<td>Work completes, team disbands<\/td>\n<td>Recognise, capture lessons, transition people<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Teams <strong>regress<\/strong> when membership changes. Adding three people to a performing team sends it back to forming/storming — a very common exam scenario.<\/p>\n<h3>Leadership styles<\/h3>\n<ul>\n<li><strong>Directive<\/strong> — you decide and tell. Appropriate in crisis, safety, or with genuinely inexperienced teams.<\/li>\n<li><strong>Transactional<\/strong> — reward and penalty based on performance against targets.<\/li>\n<li><strong>Transformational<\/strong> — inspire through vision, individual attention, intellectual stimulation.<\/li>\n<li><strong>Servant leadership<\/strong> — serve the team first: remove impediments, provide what they need, shield from distraction, develop people. <em>PMI's default preference.<\/em><\/li>\n<li><strong>Laissez-faire<\/strong> — hands off. Only appropriate for genuinely mature, self-organising teams; otherwise it reads as abdication.<\/li>\n<li><strong>Charismatic<\/strong>, <strong>interactional<\/strong> (a blend), <strong>situational<\/strong> (adapt to the team's maturity for the task).<\/li>\n<\/ul>\n<p><strong>Situational leadership (Hersey-Blanchard)<\/strong> — the right style depends on follower readiness: directing → coaching → supporting → delegating as competence and commitment rise. If a question describes a capable but demotivated team member, the answer is <em>supporting<\/em>, not <em>directing<\/em>.<\/p>\n<h3>Management vs leadership<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Management<\/th>\n<th>Leadership<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Positional authority<\/td>\n<td>Relational influence<\/td>\n<\/tr>\n<tr>\n<td>Maintains, administers<\/td>\n<td>Develops, innovates<\/td>\n<\/tr>\n<tr>\n<td>Focuses on systems<\/td>\n<td>Focuses on people<\/td>\n<\/tr>\n<tr>\n<td>Asks how and when<\/td>\n<td>Asks what and why<\/td>\n<\/tr>\n<tr>\n<td>Does things right<\/td>\n<td>Does the right things<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>PMI wants both, and leans toward leadership.<\/p>\n<h3>Powers of the project manager<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Power<\/th>\n<th>Source<\/th>\n<th>PMI's view<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Expert<\/strong><\/td>\n<td>Your knowledge and credibility<\/td>\n<td><strong>Best<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Reward<\/strong><\/td>\n<td>Ability to give something valued<\/td>\n<td><strong>Good<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Referent<\/strong><\/td>\n<td>Relationships, respect, association<\/td>\n<td>Good<\/td>\n<\/tr>\n<tr>\n<td><strong>Formal / legitimate / positional<\/strong><\/td>\n<td>Your role<\/td>\n<td>Neutral<\/td>\n<\/tr>\n<tr>\n<td><strong>Penalty / coercive<\/strong><\/td>\n<td>Ability to punish<\/td>\n<td><strong>Worst<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Also seen: informational, situational, persuasive, ingratiating, pressure-based, guilt-based, avoiding.<\/p>\n<h3>Motivation theories<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Theory<\/th>\n<th>Core idea<\/th>\n<th>Exam application<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Maslow's hierarchy<\/strong><\/td>\n<td>Physiological → safety → belonging → esteem → self-actualisation. Lower needs must be met first<\/td>\n<td>A team worried about redundancy will not respond to a stretch goal<\/td>\n<\/tr>\n<tr>\n<td><strong>Herzberg's two-factor<\/strong><\/td>\n<td><em>Hygiene factors<\/em> (salary, conditions, policy, supervision) prevent dissatisfaction but do not motivate. <em>Motivators<\/em> (achievement, recognition, the work itself, responsibility, growth) motivate<\/td>\n<td>A pay rise will not fix boredom<\/td>\n<\/tr>\n<tr>\n<td><strong>McGregor's X and Y<\/strong><\/td>\n<td>Theory X: people avoid work, need control. Theory Y: people are self-motivated, seek responsibility<\/td>\n<td>PMI assumes Theory Y<\/td>\n<\/tr>\n<tr>\n<td><strong>McClelland's needs<\/strong><\/td>\n<td>Achievement (nAch), Affiliation (nAff), Power (nPow) — everyone has a dominant driver<\/td>\n<td>Give the achiever challenging solo goals; give the affiliator team work<\/td>\n<\/tr>\n<tr>\n<td><strong>Vroom's expectancy<\/strong><\/td>\n<td>Motivation = expectancy × instrumentality × valence. People act when they believe effort leads to performance, performance leads to reward, and they value the reward<\/td>\n<td>If the team thinks the target is unreachable, no incentive works<\/td>\n<\/tr>\n<tr>\n<td><strong>Ouchi's Theory Z<\/strong><\/td>\n<td>Long-term employment and holistic concern build loyalty and productivity<\/td>\n<td>Cultural context questions<\/td>\n<\/tr>\n<tr>\n<td><strong>Self-determination (Pink)<\/strong><\/td>\n<td>Autonomy, mastery, purpose<\/td>\n<td>The agile motivation model<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Emotional intelligence (EI)<\/h3>\n<p>Four (or five) components:\n1. <strong>Self-awareness<\/strong> — recognising your own emotions and their effect\n2. <strong>Self-regulation / self-management<\/strong> — controlling impulses, adapting\n3. <strong>Social awareness / empathy<\/strong> — reading others' emotions and perspectives\n4. <strong>Relationship management / social skill<\/strong> — influencing, managing conflict, building bonds\n(<em>Motivation<\/em> is sometimes listed as a fifth.)<\/p>\n<p>EI is heavily tested because PMI treats it as the underlying capability behind conflict management, stakeholder engagement and team leadership. When an option involves <em>noticing how someone feels and responding to it<\/em>, it scores well.<\/p>\n<h3>Building high-performing teams<\/h3>\n<ul>\n<li><strong>Team charter<\/strong> — created <em>by the team<\/em>, covering shared values, meeting guidelines, communication norms, decision-making process, conflict resolution process, and ground rules. It is the reference point when behaviour slips.<\/li>\n<li><strong>Ground rules<\/strong> — explicit, agreed, enforced. Violations are addressed by the team first, then by the PM.<\/li>\n<li><strong>Psychological safety<\/strong> — the belief you can speak up without punishment. Without it, risks go unreported and quality collapses.<\/li>\n<li><strong>Colocation / tight matrix<\/strong> — physical proximity. <strong>Virtual teams<\/strong> need deliberate compensation: video on, overlap hours, explicit written norms, more frequent check-ins.<\/li>\n<li><strong>Team-building<\/strong> — a continuous activity, not an away day. Starts at forming and never stops.<\/li>\n<li><strong>Recognition and rewards<\/strong> — must be achievable, tied to performance under the person's control, culturally appropriate, and preferably immediate. Zero-sum awards (\"employee of the month\") can damage team cohesion.<\/li>\n<li><strong>Training<\/strong> — build the skills the project needs; charge to the project budget where it is project-specific.<\/li>\n<li><strong>Diversity and inclusion<\/strong> — varied perspectives improve decisions; the PM must ensure quieter voices are heard.<\/li>\n<\/ul>\n<h3>Team performance assessments vs project performance appraisals<\/h3>\n<ul>\n<li><strong>Team performance assessments<\/strong> evaluate the <em>team's<\/em> effectiveness (skills, cohesion, turnover) and are used to improve the team.<\/li>\n<li><strong>Project performance appraisals<\/strong> evaluate <em>individuals<\/em> and feed HR processes.\nDo not confuse them on the exam.<\/li>\n<\/ul>\n<h2 id=\"s2-h3\">2.3 Managing conflict<\/h2>\n<p>Conflict is inevitable and, handled well, productive. Sources: scheduling priorities, resource availability, technical opinions, administrative procedures, cost, and personality — roughly in that order of frequency. Personality conflict is the least common and the hardest.<\/p>\n<h3>The five techniques<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Technique<\/th>\n<th>Also called<\/th>\n<th>Outcome<\/th>\n<th>When appropriate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Collaborate / problem solve<\/strong><\/td>\n<td>Confronting<\/td>\n<td><strong>Win-win<\/strong><\/td>\n<td>Almost always. Addresses root cause, builds commitment. Needs time and trust.<\/td>\n<\/tr>\n<tr>\n<td><strong>Compromise / reconcile<\/strong><\/td>\n<td>Bargaining<\/td>\n<td>Lose-lose<\/td>\n<td>When both parties have equal power and you need a quick, workable settlement. Nobody is fully satisfied.<\/td>\n<\/tr>\n<tr>\n<td><strong>Smooth / accommodate<\/strong><\/td>\n<td><\/td>\n<td>Lose-win<\/td>\n<td>To preserve harmony when the issue matters more to them than to you; to buy time. Does not resolve.<\/td>\n<\/tr>\n<tr>\n<td><strong>Force / direct<\/strong><\/td>\n<td>Compete<\/td>\n<td>Win-lose<\/td>\n<td>Emergencies, safety, ethics, or when a decision must be made now. Breeds resentment.<\/td>\n<\/tr>\n<tr>\n<td><strong>Withdraw / avoid<\/strong><\/td>\n<td>Retreat<\/td>\n<td>Lose-lose (deferred)<\/td>\n<td>When emotions are too high, when you lack information, when the issue is trivial, or when someone else should own it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>PMI's hierarchy:<\/strong> collaborate &gt; compromise &gt; smooth &gt; force &gt; withdraw. Choose collaborate unless the scenario explicitly rules it out (no time, safety emergency, trivial issue, or emotions too hot for a productive conversation).<\/p>\n<h3>The escalation ladder for conflict<\/h3>\n<ol>\n<li><strong>The parties resolve it themselves<\/strong> — encourage this first in a self-organising team.<\/li>\n<li><strong>The PM facilitates<\/strong> a conversation between them.<\/li>\n<li><strong>The PM decides<\/strong>, using the team charter and ground rules.<\/li>\n<li><strong>Escalate to the sponsor or functional manager<\/strong> — only when it exceeds your authority or involves conduct.<\/li>\n<\/ol>\n<p>Never skip to step 4. Never go to someone's manager before speaking to the person.<\/p>\n<h3>Ground rule violations<\/h3>\n<p>Address them promptly and privately first. Refer to the team charter the team itself wrote. Repeated violations become a performance matter. Ignoring them signals that the rules are optional.<\/p>\n<h2 id=\"s2-h4\">2.4 Stakeholder engagement<\/h2>\n<h3>The process<\/h3>\n<p><strong>Identify → Analyse → Plan engagement → Manage/execute → Monitor.<\/strong><\/p>\n<p>Stakeholder identification is <strong>iterative<\/strong> — new stakeholders appear throughout, especially at phase boundaries and when the external environment shifts.<\/p>\n<h3>Identification<\/h3>\n<p>Sources: project charter, business documents, agreements, EEFs, OPAs, the sponsor, the existing team, other project managers, industry regulators, community groups. Techniques: brainstorming, expert judgement, questionnaires, document analysis.<\/p>\n<h3>Analysis models<\/h3>\n<p><strong>Power/Interest grid<\/strong> (also power/influence, impact/influence):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Low interest<\/th>\n<th>High interest<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>High power<\/strong><\/td>\n<td>Keep satisfied<\/td>\n<td><strong>Manage closely<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Low power<\/strong><\/td>\n<td>Monitor (minimum effort)<\/td>\n<td>Keep informed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Salience model<\/strong> — classify by three attributes:\n- <strong>Power<\/strong> (ability to impose will), <strong>Legitimacy<\/strong> (appropriate involvement), <strong>Urgency<\/strong> (need for immediate attention)\n- One attribute = <em>latent<\/em> (dormant, discretionary, demanding); two = <em>expectant<\/em> (dominant, dependent, dangerous); three = <em>definitive<\/em> — highest priority.<\/p>\n<p><strong>Directions of influence<\/strong> — upward (senior management, sponsor), downward (the team), outward (vendors, regulators, users, the public), sideward (peer PMs).<\/p>\n<p><strong>Prioritisation<\/strong> matters when there are many stakeholders and limited attention. Re-prioritise as the project moves through phases.<\/p>\n<h3>Stakeholder engagement assessment matrix<\/h3>\n<p>Plot each stakeholder's <strong>current (C)<\/strong> and <strong>desired (D)<\/strong> engagement level:<\/p>\n<p><strong>Unaware → Resistant → Neutral → Supportive → Leading<\/strong><\/p>\n<p>The gap between C and D drives your engagement actions. This artifact is frequently the correct answer to \"what tool should the PM use to determine where to focus engagement effort?\"<\/p>\n<h3>Handling resistance<\/h3>\n<ol>\n<li><strong>Understand the cause.<\/strong> Fear of job loss? Loss of control? Past project failure? Genuine technical objection? Being excluded from the decision?<\/li>\n<li><strong>Meet them individually<\/strong>, not in a group where they must defend a position publicly.<\/li>\n<li><strong>Listen actively<\/strong>, acknowledge the concern, and ask what would address it.<\/li>\n<li><strong>Involve them<\/strong> — resistance often dissolves when someone is given a real role.<\/li>\n<li><strong>Adjust<\/strong> if their objection is right. Sometimes the resistant stakeholder is the only one telling the truth.<\/li>\n<li><strong>Escalate<\/strong> only if the resistance is blocking delivery and is outside your influence.<\/li>\n<\/ol>\n<p><strong>Wrong answers:<\/strong> ignoring them, going around them to their boss, overruling with sponsor authority as a first move, or \"documenting the resistance in the issue log\" and doing nothing else.<\/p>\n<h3>Building trust and influence<\/h3>\n<ul>\n<li>Deliver on small commitments consistently<\/li>\n<li>Be transparent about bad news early<\/li>\n<li>Speak the stakeholder's language — finance for the CFO, risk for the regulator, users for the product owner<\/li>\n<li>Tailor the <em>form<\/em> of communication, not the <em>truth<\/em> of it<\/li>\n<li>Use referent and expert power, not positional<\/li>\n<\/ul>\n<h3>Managing customer expectations<\/h3>\n<ul>\n<li>Identify both <strong>internal<\/strong> and <strong>external<\/strong> customer expectations explicitly — many are unstated<\/li>\n<li>Align the outcome to those expectations continuously, not just at acceptance<\/li>\n<li>Monitor satisfaction actively: surveys, NPS, review meetings, acceptance feedback, complaint trends<\/li>\n<li>When expectation and scope diverge, that is a change request conversation, not a quiet accommodation<\/li>\n<\/ul>\n<h2 id=\"s2-h5\">2.5 Knowledge transfer<\/h2>\n<h3>Explicit vs tacit knowledge<\/h3>\n<ul>\n<li><strong>Explicit<\/strong> — codifiable: documents, procedures, data, drawings. Managed with repositories, wikis, templates, document control.<\/li>\n<li><strong>Tacit<\/strong> — experience, judgement, \"how things really work here\". Cannot be written down effectively. Transferred through <strong>interaction<\/strong>: pairing, shadowing, mentoring, storytelling, communities of practice, work-shadowing, coaching.<\/li>\n<\/ul>\n<p>Most exam questions about knowledge transfer are really about tacit knowledge: the answer involves <strong>people talking to people<\/strong>, not \"write a document\".<\/p>\n<h3>Managing project knowledge<\/h3>\n<ol>\n<li><strong>Identify<\/strong> knowledge critical to the project — what would hurt if that person left tomorrow?<\/li>\n<li><strong>Gather<\/strong> it — lessons learned register maintained <em>throughout<\/em>, not at the end.<\/li>\n<li><strong>Foster an environment<\/strong> for transfer — psychological safety, time allocated, pairing, communities of practice, knowledge cafés, retrospectives, seminars.<\/li>\n<\/ol>\n<p><strong>Lessons learned register<\/strong> (live, during the project) → <strong>lessons learned repository<\/strong> (the organisational OPA, updated at closure). Lessons learned are captured <em>continuously<\/em>; capturing them only at the end is a wrong answer.<\/p>\n<p><strong>Knowledge loss risks:<\/strong> single points of expertise, contractor turnover, team disbanding at closure, undocumented decisions. Mitigations: cross-training, pairing, decision logs, documented rationale (<em>why<\/em> a choice was made, not just what).<\/p>\n<h2 id=\"s2-h6\">2.6 Communication<\/h2>\n<h3>The model<\/h3>\n<p>Sender → <strong>encode<\/strong> → transmit (through <em>noise<\/em>) → receive → <strong>decode<\/strong> → <strong>feedback/acknowledge<\/strong> → response.<\/p>\n<p><strong>Noise<\/strong> = anything that distorts: language, jargon, culture, distraction, technology failure, emotional state, assumptions.\n<strong>Feedback loops<\/strong> are how you confirm the message was understood, not just delivered. \"Establish a feedback loop\" is an explicit ECO enabler.<\/p>\n<h3>Methods<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Examples<\/th>\n<th>Use for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Interactive<\/strong><\/td>\n<td>Meetings, calls, video, conversations, stand-ups<\/td>\n<td>Complex, sensitive, contentious or urgent matters; anything needing shared understanding<\/td>\n<\/tr>\n<tr>\n<td><strong>Push<\/strong><\/td>\n<td>Email, reports, memos, voicemail, letters<\/td>\n<td>Distributing information to specific recipients. <strong>No guarantee of understanding.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Pull<\/strong><\/td>\n<td>Intranet, wiki, knowledge repository, dashboards, e-learning<\/td>\n<td>Large volumes, large audiences, self-service<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>If the scenario involves misunderstanding, conflict, or bad news, the answer is almost always <strong>interactive<\/strong>.<\/p>\n<h3>Dimensions<\/h3>\n<ul>\n<li>Internal / external<\/li>\n<li>Formal (reports, contracts, minutes) / informal (chat, corridor conversation, email)<\/li>\n<li>Vertical (up and down the hierarchy) / horizontal (peer to peer)<\/li>\n<li>Official / unofficial<\/li>\n<li>Written / oral<\/li>\n<li>Verbal / non-verbal (tone, body language — roughly half of the message in face-to-face communication)<\/li>\n<\/ul>\n<h3>Communications management plan<\/h3>\n<p>Must answer, per stakeholder or group: <strong>what<\/strong> information, <strong>why<\/strong>, <strong>who<\/strong> produces it, <strong>who<\/strong> receives it, <strong>when/how often<\/strong>, <strong>through what medium<\/strong>, in <strong>what format and language<\/strong>, with <strong>what escalation path<\/strong> and <strong>what glossary of terms<\/strong>. Include the method for updating the plan itself.<\/p>\n<h3>Channels<\/h3>\n<p><strong>n(n − 1) / 2<\/strong>, where n is the number of people. Six people = 15 channels. Ten people = 45. Adding one person to a team of ten adds ten channels. This is why small teams communicate better and why \"add people to fix a late project\" is wrong.<\/p>\n<h3>Meetings<\/h3>\n<ul>\n<li>Have a <strong>purpose<\/strong> and an <strong>agenda<\/strong> distributed in advance<\/li>\n<li>Invite only those who need to be there<\/li>\n<li>Start and finish on time<\/li>\n<li>Assign action items with owners and dates<\/li>\n<li>Distribute minutes/decisions promptly<\/li>\n<li>The PM <strong>facilitates<\/strong>; in agile, the team runs many of its own events<\/li>\n<\/ul>\n<h3>Reporting<\/h3>\n<ul>\n<li><strong>Work performance data<\/strong> (raw observations: hours logged, defects found) → <strong>work performance information<\/strong> (analysed: CPI, forecast completion) → <strong>work performance reports<\/strong> (packaged for a decision-maker: status report, dashboard, briefing).<\/li>\n<li>Tailor reports to the audience: the sponsor wants exceptions and decisions, the team wants detail, the regulator wants evidence.<\/li>\n<li>Support <strong>governance<\/strong> reporting requirements — an explicit ECO enabler. Know your reporting cadence, thresholds and escalation triggers.<\/li>\n<li><strong>Information radiators<\/strong> (agile): big, visible, self-updating displays — task boards, burndowns, impediment lists, CFDs.<\/li>\n<\/ul>\n<h3>Active listening<\/h3>\n<p>Pay attention → withhold judgement → reflect and paraphrase → clarify with questions → summarise → share your view last. When an exam option includes \"listen to understand the concern\", it is usually the right early step.<\/p>\n<h3>Cross-cultural communication<\/h3>\n<p>Be aware of high-context vs low-context cultures, attitudes to hierarchy and disagreement, time orientation, and directness norms. Tailor form and channel; never tailor honesty. When in doubt on the exam: ask, do not assume.<\/p>\n<hr />", "subs": [{"t": "2.1 Develop a common vision", "a": "s2-h1"}, {"t": "2.2 Team development and leadership", "a": "s2-h2"}, {"t": "2.3 Managing conflict", "a": "s2-h3"}, {"t": "2.4 Stakeholder engagement", "a": "s2-h4"}, {"t": "2.5 Knowledge transfer", "a": "s2-h5"}, {"t": "2.6 Communication", "a": "s2-h6"}], "text": " eco tasks: develop a common vision · manage conflicts · lead the project team · engage stakeholders · align stakeholder expectations · manage stakeholder expectations · ensure knowledge transfer · plan and manage communication 2.1 develop a common vision a shared vision is a concise statement of why the project exists and what success looks like, understood the same way by everyone. how to create one: - facilitate a session with key stakeholders rather than writing it and announcing it - anchor it to the business case and the value the project delivers - test it: ask three stakeholders separately to state the goal. divergent answers mean you do not have a shared vision - capture it visibly — a project charter, a vision statement, a product vision box, an elevator pitch tools: - project charter — the formal anchor in predictive contexts - product vision statement / elevator statement — \"for [target customer] who [need], the [product] is a [category] that [key benefit]. unlike [alternative], our product [differentiator].\" - kick-off meeting — the moment of alignment - information radiators — keep the vision current and visible keeping it current: re-validate the vision when the business case changes, when a major change request lands, at phase gates, and at release planning. a vision no one revisits becomes a poster. root-cause analysis of misalignment — when people pull in different directions, do not just restate the vision. ask why: conflicting incentives? unclear success metrics? a stakeholder who was never consulted? use 5 whys , fishbone (ishikawa) diagrams, or a simple stakeholder interview round. 2.2 team development and leadership tuckman's ladder stage behaviour what the leader does forming polite, tentative, dependent on the leader provide direction, clarify purpose and roles storming conflict over approach, roles, authority coach; surface and resolve conflict; hold ground rules norming norms settle, trust builds facilitate; step back performing self-organising, high output delegate; remove impediments adjourning work completes, team disbands recognise, capture lessons, transition people teams regress when membership changes. adding three people to a performing team sends it back to forming/storming — a very common exam scenario. leadership styles directive — you decide and tell. appropriate in crisis, safety, or with genuinely inexperienced teams. transactional — reward and penalty based on performance against targets. transformational — inspire through vision, individual attention, intellectual stimulation. servant leadership — serve the team first: remove impediments, provide what they need, shield from distraction, develop people. pmi's default preference. laissez-faire — hands off. only appropriate for genuinely mature, self-organising teams; otherwise it reads as abdication. charismatic , interactional (a blend), situational (adapt to the team's maturity for the task). situational leadership (hersey-blanchard) — the right style depends on follower readiness: directing → coaching → supporting → delegating as competence and commitment rise. if a question describes a capable but demotivated team member, the answer is supporting , not directing . management vs leadership management leadership positional authority relational influence maintains, administers develops, innovates focuses on systems focuses on people asks how and when asks what and why does things right does the right things pmi wants both, and leans toward leadership. powers of the project manager power source pmi's view expert your knowledge and credibility best reward ability to give something valued good referent relationships, respect, association good formal / legitimate / positional your role neutral penalty / coercive ability to punish worst also seen: informational, situational, persuasive, ingratiating, pressure-based, guilt-based, avoiding. motivation theories theory core idea exam application maslow's hierarchy physiological → safety → belonging → esteem → self-actualisation. lower needs must be met first a team worried about redundancy will not respond to a stretch goal herzberg's two-factor hygiene factors (salary, conditions, policy, supervision) prevent dissatisfaction but do not motivate. motivators (achievement, recognition, the work itself, responsibility, growth) motivate a pay rise will not fix boredom mcgregor's x and y theory x: people avoid work, need control. theory y: people are self-motivated, seek responsibility pmi assumes theory y mcclelland's needs achievement (nach), affiliation (naff), power (npow) — everyone has a dominant driver give the achiever challenging solo goals; give the affiliator team work vroom's expectancy motivation = expectancy × instrumentality × valence. people act when they believe effort leads to performance, performance leads to reward, and they value the reward if the team thinks the target is unreachable, no incentive works ouchi's theory z long-term employment and holistic concern build loyalty and productivity cultural context questions self-determination (pink) autonomy, mastery, purpose the agile motivation model emotional intelligence (ei) four (or five) components: 1. self-awareness — recognising your own emotions and their effect 2. self-regulation / self-management — controlling impulses, adapting 3. social awareness / empathy — reading others' emotions and perspectives 4. relationship management / social skill — influencing, managing conflict, building bonds ( motivation is sometimes listed as a fifth.) ei is heavily tested because pmi treats it as the underlying capability behind conflict management, stakeholder engagement and team leadership. when an option involves noticing how someone feels and responding to it , it scores well. building high-performing teams team charter — created by the team , covering shared values, meeting guidelines, communication norms, decision-making process, conflict resolution process, and ground rules. it is the reference point when behaviour slips. ground rules — explicit, agreed, enforced. violations are addressed by the team first, then by the pm. psychological safety — the belief you can speak up without punishment. without it, risks go unreported and quality collapses. colocation / tight matrix — physical proximity. virtual teams need deliberate compensation: video on, overlap hours, explicit written norms, more frequent check-ins. team-building — a continuous activity, not an away day. starts at forming and never stops. recognition and rewards — must be achievable, tied to performance under the person's control, culturally appropriate, and preferably immediate. zero-sum awards (\"employee of the month\") can damage team cohesion. training — build the skills the project needs; charge to the project budget where it is project-specific. diversity and inclusion — varied perspectives improve decisions; the pm must ensure quieter voices are heard. team performance assessments vs project performance appraisals team performance assessments evaluate the team's effectiveness (skills, cohesion, turnover) and are used to improve the team. project performance appraisals evaluate individuals and feed hr processes. do not confuse them on the exam. 2.3 managing conflict conflict is inevitable and, handled well, productive. sources: scheduling priorities, resource availability, technical opinions, administrative procedures, cost, and personality — roughly in that order of frequency. personality conflict is the least common and the hardest. the five techniques technique also called outcome when appropriate collaborate / problem solve confronting win-win almost always. addresses root cause, builds commitment. needs time and trust. compromise / reconcile bargaining lose-lose when both parties have equal power and you need a quick, workable settlement. nobody is fully satisfied. smooth / accommodate lose-win to preserve harmony when the issue matters more to them than to you; to buy time. does not resolve. force / direct compete win-lose emergencies, safety, ethics, or when a decision must be made now. breeds resentment. withdraw / avoid retreat lose-lose (deferred) when emotions are too high, when you lack information, when the issue is trivial, or when someone else should own it. pmi's hierarchy: collaborate &gt; compromise &gt; smooth &gt; force &gt; withdraw. choose collaborate unless the scenario explicitly rules it out (no time, safety emergency, trivial issue, or emotions too hot for a productive conversation). the escalation ladder for conflict the parties resolve it themselves — encourage this first in a self-organising team. the pm facilitates a conversation between them. the pm decides , using the team charter and ground rules. escalate to the sponsor or functional manager — only when it exceeds your authority or involves conduct. never skip to step 4. never go to someone's manager before speaking to the person. ground rule violations address them promptly and privately first. refer to the team charter the team itself wrote. repeated violations become a performance matter. ignoring them signals that the rules are optional. 2.4 stakeholder engagement the process identify → analyse → plan engagement → manage/execute → monitor. stakeholder identification is iterative — new stakeholders appear throughout, especially at phase boundaries and when the external environment shifts. identification sources: project charter, business documents, agreements, eefs, opas, the sponsor, the existing team, other project managers, industry regulators, community groups. techniques: brainstorming, expert judgement, questionnaires, document analysis. analysis models power/interest grid (also power/influence, impact/influence): low interest high interest high power keep satisfied manage closely low power monitor (minimum effort) keep informed salience model — classify by three attributes: - power (ability to impose will), legitimacy (appropriate involvement), urgency (need for immediate attention) - one attribute = latent (dormant, discretionary, demanding); two = expectant (dominant, dependent, dangerous); three = definitive — highest priority. directions of influence — upward (senior management, sponsor), downward (the team), outward (vendors, regulators, users, the public), sideward (peer pms). prioritisation matters when there are many stakeholders and limited attention. re-prioritise as the project moves through phases. stakeholder engagement assessment matrix plot each stakeholder's current (c) and desired (d) engagement level: unaware → resistant → neutral → supportive → leading the gap between c and d drives your engagement actions. this artifact is frequently the correct answer to \"what tool should the pm use to determine where to focus engagement effort?\" handling resistance understand the cause. fear of job loss? loss of control? past project failure? genuine technical objection? being excluded from the decision? meet them individually , not in a group where they must defend a position publicly. listen actively , acknowledge the concern, and ask what would address it. involve them — resistance often dissolves when someone is given a real role. adjust if their objection is right. sometimes the resistant stakeholder is the only one telling the truth. escalate only if the resistance is blocking delivery and is outside your influence. wrong answers: ignoring them, going around them to their boss, overruling with sponsor authority as a first move, or \"documenting the resistance in the issue log\" and doing nothing else. building trust and influence deliver on small commitments consistently be transparent about bad news early speak the stakeholder's language — finance for the cfo, risk for the regulator, users for the product owner tailor the form of communication, not the truth of it use referent and expert power, not positional managing customer expectations identify both internal and external customer expectations explicitly — many are unstated align the outcome to those expectations continuously, not just at acceptance monitor satisfaction actively: surveys, nps, review meetings, acceptance feedback, complaint
