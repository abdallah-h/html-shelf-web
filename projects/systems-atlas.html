IV(`Fundamentals`,`Medium`,`What is graceful degradation and why design for it?`,`<p>Graceful degradation means that when part of the system fails or is overloaded, you disable or simplify a feature rather than letting the whole product crash. For example, if the recommendations service is down, show a generic list instead of erroring the whole page; if the cache is down, serve from the database (slower) rather than failing. You design for it because failure is inevitable, and partial availability is far better than total outage — it contains the blast radius and preserves the core user journey. It pairs with circuit breakers (fail fast to a fallback) and fail-open defaults for non-critical dependencies.</p>`);
IV(`Fundamentals`,`Medium`,`How do you think about back-of-the-envelope numbers in a design?`,`<p>I round hard and use anchors: a day ≈ 10^5 seconds, peak ≈ 2–5× average, memory is ~1000× faster than disk, a cross-continent round trip ≈ 100 ms. From users and behavior I derive QPS, storage, and the read:write ratio, then let those drive the design — a high read ratio means cache/CDN; huge media means object storage; high writes mean wide-column and maybe sharding. The goal isn't precision but order of magnitude: the numbers tell me whether I'm building for thousands or hundreds of millions, which are completely different systems, and they prevent both over- and under-engineering.</p>`);
IV(`Caching`,`Medium`,`What eviction policy would you choose and why?`,`<p>The default is <strong>LRU</strong> (least recently used), which assumes temporal locality — recently accessed items are likely to be accessed again — and works well for most caches. <strong>LFU</strong> (least frequently used) is better when popularity is stable over time and you want to keep genuinely hot items even if not recently touched, but it adapts poorly to shifting workloads. FIFO is simple but ignores access patterns. I'd pick LRU as a safe default, consider LFU (or a hybrid like LRU-K/TinyLFU) for workloads with a stable hot set, and always size the cache and set TTLs based on the data's freshness needs and the hit-rate I can measure.</p>`);
IV(`Scaling & distribution`,`Medium`,`What is the difference between L4 and L7 load balancing?`,`<p><strong>L4</strong> (transport layer) load balancers route based on IP and port without inspecting the payload — they're very fast and protocol-agnostic, good for raw TCP/UDP throughput. <strong>L7</strong> (application layer) balancers understand HTTP, so they can route by URL path, headers, or cookies, terminate TLS, do content-based routing, and support features like sticky sessions and request rewriting — at some CPU cost. In practice you often use both: L4 for sheer speed at the edge, L7 (an API gateway) for smart application routing. The choice depends on whether you need application awareness or just fast connection distribution.</p>`);
IV(`Databases & storage`,`Medium`,`When would you use a graph database or a search index?`,`<p>A <strong>graph database</strong> (Neo4j) is the right tool when relationships are the primary thing you query — many-to-many traversals like "friends of friends," recommendation paths, fraud rings, or dependency graphs — where relational joins would be deep and expensive. A <strong>search index</strong> (Elasticsearch) is for full-text search and analytics — ranking documents by relevance, faceted filtering, fuzzy matching — which relational <code>LIKE</code> queries handle poorly. Both are typically used <em>alongside</em> a primary store rather than replacing it: you keep the system of record in a relational/document store and feed the graph or search index via events/CDC, accepting eventual consistency in the derived index.</p>`);
IV(`Messaging & events`,`Medium`,`When would you choose synchronous vs. asynchronous communication?`,`<p>Use <strong>synchronous</strong> (REST/gRPC request-response) when the caller genuinely needs the result to proceed and the operation is fast — it's simple to reason about and debug. Use <strong>asynchronous</strong> (queues/events) when the caller doesn't need to wait, when you want to decouple services, absorb traffic spikes, or improve resilience (the consumer can be down and catch up). Async is ideal for work that can happen in the background (sending emails, updating search indexes, processing uploads). The trade-off: sync couples services temporally and risks cascading failures; async adds decoupling and resilience but makes the flow harder to trace and forces you to handle eventual consistency and duplicate delivery.</p>`);
IV(`Architecture`,`Medium`,`What is the modular monolith and why is it a good default?`,`<p>A modular monolith is a single deployable application divided internally into well-defined modules that communicate only through explicit interfaces and never reach into each other's data. It gives you the operational simplicity of a monolith — one build, one deploy, easy local development, straightforward transactions and debugging — while enforcing the clean boundaries that make future extraction into services possible. It's a good default for new systems because most early-stage products don't have the team-scale or independent-scaling problems that justify microservices, and premature microservices impose distribution costs (network calls, distributed debugging, per-service infra) before you have the problems they solve. You split out a module into a service later, when you feel a concrete pain.</p>`);
IV(`API design`,`Medium`,`How would you design idempotent APIs for a payment flow?`,`<p>Every mutating call carries a client-generated <strong>idempotency key</strong>. On the first request with a given key, the server executes and stores the result keyed by that ID; on any retry with the same key, it returns the stored result instead of executing again — so a network retry can't double-charge. I store keys with a TTL and scope them per endpoint and user. For the multi-step flow I use idempotent operations end-to-end so even a full retry of the chain moves money once, and I handle the "unknown outcome" case (a provider timeout) by <em>querying</em> the provider's status rather than blindly retrying. GET/PUT/DELETE are naturally idempotent; POST needs the explicit key. This is table stakes for anything touching money.</p>`);
IV(`Security`,`Medium`,`What is defense in depth and zero-trust?`,`<p><strong>Defense in depth</strong> means layering multiple independent security controls so that breaching one still leaves others standing — network segmentation, authentication, authorization, input validation, encryption, and monitoring all reinforcing each other, on the assumption that any single layer can fail. <strong>Zero-trust</strong> is the modern posture of trusting no network location implicitly: instead of assuming the internal network is safe, you authenticate and encrypt <em>every</em> hop, including service-to-service traffic (mTLS), and authorize each request. Together they mean a breach at one point — a compromised credential, a foothold inside the network — can't cascade into total compromise, because the attacker still faces authentication, authorization, and encryption at every step.</p>`);
IV(`Observability & reliability`,`Medium`,`Why are blameless postmortems important?`,`<p>Because the goal after an incident is to prevent recurrence, and blame prevents that. If people fear punishment, they hide mistakes, downplay contributing factors, and the real systemic causes never surface — so the same failure happens again. Blameless postmortems focus on <em>systemic</em> causes with the premise that "systems that allow human error to cause outages are the problem, not the people." If a single mistyped command can take down production, the fix isn't "be more careful" — it's guardrails (confirmation, canaries, automated rollback) so the mistake can't cause catastrophe. The key output is concrete action items with owners, tracked to completion; a postmortem that changes nothing is theater.</p>`);
IV(`Deployment`,`Medium`,`What is infrastructure as code and why does it matter?`,`<p>Infrastructure as code (Terraform, CloudFormation, Pulumi) defines your servers, networks, and cloud resources in version-controlled, declarative files that are applied automatically, instead of clicking through a console. It matters because it gives infrastructure the same benefits version control gave code: it's <strong>reproducible</strong> (spin up an identical environment for staging, DR, or a new region on demand), <strong>reviewable</strong> (changes go through pull requests), <strong>auditable</strong> (git history shows who changed what), and <strong>consistent</strong> (staging truly matches production, killing a class of environment-specific bugs). It kills configuration drift and "works on the server someone set up last year," and it's what makes the whole automated deployment pipeline possible.</p>`);
</script>

IV(`System design`,`Medium`,`Design a distributed cache like Redis Cluster.`,`<p><strong>Requirements:</strong> low-latency key-value access, horizontal scale, high availability. <strong>Design:</strong> partition the keyspace across nodes with <strong>consistent hashing</strong> (virtual nodes for balance) so adding/removing a node moves only ~1/N of keys. Replicate each partition (primary + replicas) for availability with automatic failover. Clients (or a proxy) route each key to its owning node. <strong>Deep dives:</strong> eviction policy (LRU) and memory limits, handling hot keys (client-side caching or key replication), consistency of replicas (async replication → possible stale reads on failover), and rebalancing when the cluster changes. It's essentially the key-value-store design: partitioning, replication, and membership/failure handling.</p>`);
IV(`System design`,`Hard`,`Design a real-time leaderboard for a game.`,`<p><strong>Crux:</strong> rank millions of players by score and answer "top N" and "my rank" in real time. Use a <strong>sorted set</strong> (Redis ZSET): O(log n) score updates and rank queries, giving instant top-N and a player's rank. Shard by game/region if one instance can't hold it. For huge player counts, keep a global top-N materialized and compute approximate ranks for the long tail (exact rank among tens of millions is expensive and rarely needed precisely). <strong>Deep dives:</strong> tie-breaking, time-windowed leaderboards (daily/weekly via separate sets), persistence/backup of the in-memory structure, and read scaling with replicas. Writes are frequent (every score), reads are frequent (every view), so the in-memory sorted structure is the key choice.</p>`);
IV(`System design`,`Medium`,`Design a file storage/sync service like Dropbox.`,`<p><strong>Design:</strong> store file <strong>chunks</strong> in object storage (dedup identical chunks by content hash to save space and bandwidth), and metadata (file tree, versions, chunk lists) in a database. Clients sync by comparing local and server metadata and transferring only changed chunks. A notification channel (long-poll/WebSocket) pushes changes to other devices. <strong>Deep dives:</strong> chunking and deduplication, conflict resolution when two devices edit offline (versioning, or last-writer-wins with conflict copies), efficient sync (only diffs), and large-file uploads via pre-signed URLs directly to object storage. Consistency is eventual across devices; the metadata store is the source of truth for the file tree.</p>`);
IV(`System design`,`Medium`,`Design an ad click aggregation system.`,`<p><strong>Shape:</strong> ingest a massive stream of click events and produce near-real-time aggregates (clicks per ad per minute) plus accurate billing. <strong>Design:</strong> events flow into a durable log (Kafka); <strong>stream processors</strong> (Flink) do windowed aggregation; results land in a fast store for dashboards and a durable store for billing. <strong>Deep dives:</strong> exactly-once-ish semantics for billing (idempotency keys, dedup), handling late/out-of-order events (event-time windows with watermarks), fraud/duplicate-click filtering, and reconciling the fast approximate path with a slower accurate batch path (lambda-style). Scale is the challenge — millions of events/sec — so partitioning by ad ID and horizontal stream workers are essential.</p>`);
IV(`System design`,`Hard`,`Design a digital wallet with balances and transfers.`,`<p><strong>Correctness first.</strong> Model money as a <strong>double-entry ledger</strong> (every transfer is a debit and a credit that sum to zero) as the source of truth, in a strongly-consistent store. A transfer between two accounts is a transaction that must be atomic; across services it becomes a <strong>saga</strong> with compensations, or you keep both accounts in one aggregate/service so a local transaction suffices. Use <strong>idempotency keys</strong> so retried transfers don't double-apply, and <strong>event sourcing</strong> for an auditable history of every balance change. <strong>Deep dives:</strong> preventing overdraft with atomic conditional writes, reconciliation, handling concurrent transfers on the same account (optimistic vs. pessimistic locking), and exactly-once effects end-to-end.</p>`);
IV(`System design`,`Medium`,`Design an e-commerce checkout for a flash sale.`,`<p>Two problems. <strong>Load:</strong> a virtual <strong>waiting room</strong> admits users at a sustainable rate, and the product page is edge-cached, so a million simultaneous users don't crush the origin. <strong>Correctness:</strong> never oversell (an <strong>atomic conditional inventory decrement</strong>, <code>UPDATE ... WHERE stock &gt; 0</code>, so exactly one racer wins) and never double-charge (an <strong>idempotency key</strong> on payment). The multi-step checkout is a <strong>saga</strong> with compensations, and events publish via the <strong>outbox</strong> pattern. <strong>Deep dives:</strong> reserving inventory with a TTL hold, handling payment provider timeouts, and what breaks at 10× (the inventory row's write contention — mitigate with sharded counters or queue-based serialization for the hottest items).</p>`);
IV(`Resilience`,`Medium`,`What is a circuit breaker and when does it help?`,`<p>A circuit breaker wraps calls to a dependency and monitors failures. After failures exceed a threshold, it "trips" (opens) and, for a cooldown period, fails fast — returning an error or fallback immediately instead of calling the failing dependency. This prevents a struggling dependency from dragging down its callers: without it, callers pile up threads waiting on timeouts, exhaust their resources, and cascade the failure upward. After the cooldown it lets a trial request through (half-open) to test recovery. It helps most in service-to-service calls where a slow or dead downstream would otherwise cause cascading failures, and it pairs with timeouts, retries with backoff, and fallbacks (cached or default responses).</p>`);
IV(`Resilience`,`Medium`,`What is the bulkhead pattern?`,`<p>Named after the watertight compartments in a ship's hull, the bulkhead pattern isolates resources so a failure in one part can't sink the whole system. Concretely, you partition resource pools — separate thread pools, connection pools, or queues — per dependency or per class of work, so that if one dependency becomes slow and exhausts its pool, other work continues using its own untouched pool. For example, giving a flaky third-party integration its own bounded thread pool means it can't consume all your threads and stall unrelated requests. It's a key resilience pattern (from Nygard's Release It!) that contains the blast radius of a slow or failing component, complementing circuit breakers and timeouts.</p>`);
IV(`Resilience`,`Hard`,`How do you prevent cascading failures in a microservices system?`,`<p>Cascading failure is when one slow/failing service backs up its callers, which back up theirs, until the whole system is down. Defenses, layered: <strong>timeouts</strong> on every call (never wait forever); <strong>circuit breakers</strong> to fail fast when a dependency is unhealthy; <strong>bulkheads</strong> to isolate resource pools so one slow dependency can't exhaust everything; <strong>retries with backoff and jitter</strong> (capped, to avoid retry storms); <strong>load shedding</strong> to reject excess traffic early; and <strong>graceful degradation</strong> with fallbacks so a failed dependency yields a degraded response, not an error. Keeping synchronous call chains short and preferring async where possible also reduces coupling. The theme is containing failure locally and failing fast rather than letting waits and retries amplify it.</p>`);
IV(`Software design`,`Medium`,`What is the Observer pattern and where do you see it?`,`<p>Observer defines a one-to-many dependency: a subject maintains a list of observers and notifies them automatically when its state changes, calling their update method — and the subject doesn't know or care who the observers are (loose coupling). You see it everywhere: UI event listeners, model-view updates, reactive frameworks, and, scaled up across machines with a message broker, event-driven architecture itself. Understanding Observer makes pub/sub and event systems feel familiar — they're the same idea (publishers notify subscribers of changes) at a larger scale. It's one of the most useful GoF patterns to know because it's the in-process ancestor of so much modern architecture.</p>`);
IV(`Software design`,`Medium`,`What are code smells and how do you use them?`,`<p>Code smells are surface symptoms that usually (not always) point to a deeper design problem — a diagnosis, not a diagnosis-proof. Examples: Long Function, Duplicated Code, Feature Envy (a method more interested in another object's data), Shotgun Surgery (one change scattered across many modules), Divergent Change (one module changed for many reasons), Primitive Obsession, and Speculative Generality. Their value, like design patterns, is shared vocabulary: they turn vague unease ("this bothers me") into a named, discussable problem ("that's feature envy") that a code review can act on. I use them to locate where refactoring will pay off, then apply the matching named refactoring — treating the smell as a pointer, and confirming there's a real problem before restructuring.</p>`);
IV(`Software design`,`Hard`,`What makes a module "deep," and why prefer deep modules?`,`<p>A module's value is roughly the functionality it provides divided by the complexity of its interface. A <strong>deep module</strong> provides powerful functionality behind a <em>simple</em> interface — the Unix file API (open, read, write, close, lseek) hides disk drivers, buffering, permissions, and filesystems behind five calls. A <strong>shallow module</strong> has an interface almost as complex as its implementation (fifteen tiny getters, a pass-through "manager"), so it costs interface complexity without hiding much. You prefer deep modules because the interface is the cost every caller pays, while the implementation is hidden; deep modules maximize hidden functionality per unit of interface. This directly challenges the "split everything small" reflex — decomposition that creates many shallow modules increases total complexity.</p>`);
IV(`ML systems`,`Medium`,`How do you handle the cold-start problem in recommendations?`,`<p>Cold start is having little data about a new user or new item. For <strong>new users</strong>, fall back to non-personalized recommendations (popular/trending items), use any available context (location, device, referral), or ask a few onboarding preferences, then personalize as behavior accumulates. For <strong>new items</strong>, rely on content-based features (metadata, embeddings of the item's description) to place them near similar known items until interaction data arrives. Hybrid systems combine collaborative signals (from behavior) with content signals (from features) precisely so the content side carries cold-start cases. The general principle: degrade gracefully to broader signals when specific ones are missing, and blend in personalization as data grows.</p>`);
IV(`ML systems`,`Medium`,`What is model drift and how do you detect and fix it?`,`<p>Model drift is a model getting worse over time because the world changes while the model stays frozen. <strong>Data drift</strong> is when input distributions shift (new user demographics, seasonal changes); <strong>concept drift</strong> is when the learned relationship changes (fraud tactics evolve, tastes shift). You detect it by monitoring input/feature distributions (to catch drift early), prediction distributions, and — where ground truth is available — live accuracy. When drift appears, the fix is usually <strong>retraining</strong> on fresh data, which is why many systems have automated retraining pipelines triggered on a schedule or by drift detection. Designing this monitoring-and-retraining loop in from the start is the ML-specific responsibility that a demo skips but a production system can't.</p>`);
IV(`Behavioral & process`,`Medium`,`How do you approach reviewing someone else's system design?`,`<p>I use the same rubric I'd design by. I check that the <strong>requirements and scale</strong> are stated and drive the choices; that <strong>consistency</strong> is chosen per-feature and justified; that the <strong>data model and storage</strong> follow from access patterns, not hype; that <strong>caching, queues, and CDNs</strong> sit on the hot paths; that <strong>hot keys and contention</strong> are addressed; that there's a <strong>failure walkthrough</strong> with no single point of failure; and that each major choice is framed as a <strong>trade-off</strong> with the 10× break-point named. I ask questions rather than assert, focus on the highest-risk parts, and distinguish genuine problems from stylistic preferences. The goal is to strengthen the design and the designer, not to show off.</p>`);
IV(`Consistency & CAP`,`Medium`,`What is the difference between availability and consistency during a partition?`,`<p>During a network partition, some nodes can't communicate with others, and CAP forces a choice for any given operation. Choosing <strong>consistency</strong> means refusing to serve (or erroring) rather than returning data that might be stale or accepting a write that could conflict — you sacrifice availability to guarantee correctness. Choosing <strong>availability</strong> means continuing to serve reads and accept writes on both sides of the partition, accepting that data may be stale or diverge and must be reconciled later — you sacrifice consistency to stay up. The right choice is per-operation: a bank transfer picks consistency (refuse rather than risk overdraft); a social feed picks availability (show slightly stale posts rather than an error).</p>`);
IV(`Databases & storage`,`Medium`,`What is optimistic vs. pessimistic concurrency control?`,`<p><strong>Pessimistic</strong> control assumes conflicts are likely and prevents them by locking the resource before acting (<code>SELECT ... FOR UPDATE</code>), so others wait — safe but it serializes access and can hurt throughput and cause deadlocks. <strong>Optimistic</strong> control assumes conflicts are rare, so it doesn't lock; instead it proceeds and checks at commit whether the data still matches what it read (via a version number or a conditional <code>WHERE</code> clause), retrying or failing if someone else changed it. Optimistic is ideal for high-volume, low-contention cases (most web requests); pessimistic suits a few ultra-contended rows where retries would thrash. The atomic conditional write (<code>UPDATE ... WHERE still-valid</code>) is optimistic concurrency in its simplest form.</p>`);
IV(`Messaging & events`,`Medium`,`How do you guarantee ordering in a messaging system?`,`<p>Global ordering across a distributed system is expensive and usually unnecessary; what you typically need is ordering <em>within a related group</em>. In Kafka, ordering is guaranteed within a <strong>partition</strong>, so you partition by the key whose order matters — e.g., partition by account ID so all events for one account are ordered, while different accounts process in parallel. Traditional queues offer FIFO modes with similar group-based ordering. The design lesson is to identify the smallest scope that actually needs ordering (a conversation, an account, an aggregate) and partition by that key, which preserves the ordering you need while keeping throughput high through parallelism. Requiring total global order would serialize everything and destroy scalability.</p>`);
IV(`Security`,`Medium`,`How do you store and manage secrets safely?`,`<p>Never in source code, config files committed to git, or environment variables baked into images — hard-coded secrets in repositories are a top cause of breaches. Instead, keep secrets in a dedicated <strong>secrets manager</strong> (HashiCorp Vault, AWS/GCP secret managers), inject them at runtime, scope each secret narrowly (least privilege), and rotate them regularly. Use short-lived, dynamically-generated credentials where possible so a leaked secret expires quickly. Audit access to secrets, and scan your codebase and history for accidentally committed secrets (and rotate any you find). The principle is that secrets are managed centrally and granted just-in-time, not scattered through code and config where they leak and never get rotated.</p>`);
IV(`Observability & reliability`,`Medium`,`What is chaos engineering and why do it?`,`<p>Chaos engineering deliberately injects failures into a system — killing instances, adding network latency, cutting a dependency — under controlled conditions, to verify the system degrades gracefully and to discover weaknesses before they cause real outages. Netflix's Chaos Monkey randomly terminating production instances is the famous example. You do it because the most robust systems are those whose failure modes are <em>known</em> and <em>tested</em>: redundancy and fallbacks that only exist on an architecture diagram often don't actually work when needed. Starting in staging and graduating to production (carefully, with a "blast radius" limit and an abort switch), it builds justified confidence that your resilience mechanisms work, turning unknown failure modes into known, handled ones.</p>`);
IV(`Deployment`,`Medium`,`How does a canary deployment work and what do you watch?`,`<p>A canary deployment releases the new version to a small fraction of traffic first — say 1%, then 5%, 25%, and so on — while the rest stay on the old version. At each step you watch the golden signals for the canary cohort: error rate, latency percentiles, and any business/health metrics, comparing them to the stable version. If the canary degrades, you roll back having exposed only a sliver of users; if it stays healthy, you progressively widen until it's everywhere. It's the safest strategy for risky changes because it limits the blast radius and turns "did this break production?" into an incremental, monitored question. It depends entirely on good observability — a canary is only as good as your ability to see whether it's healthy.</p>`);
IV(`Fundamentals`,`Medium`,`What is a single point of failure and how do you eliminate it?`,`<p>A single point of failure (SPOF) is any component whose failure takes down the whole system — one database, one load balancer, one instance holding critical state. You eliminate SPOFs with <strong>redundancy</strong>: run multiple instances behind a load balancer, replicate databases with automatic failover, deploy across multiple availability zones or regions, and avoid designs where one node holds irreplaceable state. During a design review I do a "what if this box dies?" walkthrough of every component, and anywhere the answer is "the system goes down," I add redundancy or failover. The goal isn't zero failures — it's ensuring no <em>single</em> failure is catastrophic, so the system survives the inevitable component death.</p>`);

IV(`Caching`,`Medium`,`What is cache penetration and how do you prevent it?`,`<p>Cache penetration is when many requests ask for keys that <em>don't exist</em> in the cache or the database — so every request misses the cache and hits the database pointlessly, which an attacker can exploit to bypass the cache entirely and overload the DB. Two defenses: <strong>negative caching</strong> — cache the "not found" result (with a short TTL) so repeated lookups for a missing key are served from the cache; and a <strong>Bloom filter</strong> in front of the store — if it says a key definitely doesn't exist, skip the lookup entirely. Both stop nonexistent-key requests from stampeding the database, complementing the stampede and hot-key defenses.</p>`);
IV(`Architecture`,`Medium`,`What is the API gateway pattern?`,`<p>An API gateway is a single entry point that sits in front of your services and handles cross-cutting concerns so each service doesn't have to: authentication and authorization, rate limiting, routing/load balancing, TLS termination, request/response transformation, and sometimes response aggregation. Clients talk to the gateway, which routes to the right backend. A <strong>Backend-for-Frontend</strong> (BFF) is a gateway variant tailored per client type (one for mobile, one for web), each shaping responses to that client's needs. The benefit is centralizing shared concerns and simplifying clients; the risk is the gateway becoming a bottleneck or a place where too much logic accretes, so you keep it focused on cross-cutting concerns, not business logic.</p>`);
IV(`Architecture`,`Hard`,`How do you think about consistency boundaries when designing services?`,`<p>I start from the invariants the business requires — the rules that must always hold true (an order's total equals the sum of its lines; an account can't go negative). Each such invariant needs to be enforced within a single consistency boundary where a local transaction can guarantee it, which maps to a DDD <strong>aggregate</strong>. I then draw service boundaries so that data which must stay strongly consistent lives together in one service/aggregate, and data that can be eventually consistent is allowed to span services (synchronized via events/sagas). Getting this right avoids the two failure modes: splitting a real invariant across services (now you need distributed transactions), or lumping unrelated data together (losing independence). Consistency requirements, not org charts or table structures, drive the boundaries.</p>`);
IV(`API design`,`Easy`,`What HTTP status codes should an API use and when?`,`<p>Use them meaningfully so clients can branch on them. <strong>2xx</strong> success (200 OK, 201 Created, 202 Accepted for async, 204 No Content). <strong>4xx</strong> client errors — the caller must change something: 400 (malformed), 401 (not authenticated), 403 (authenticated but not allowed), 404 (not found), 409 (conflict, e.g., version mismatch), 422 (validation failed), 429 (rate limited). <strong>5xx</strong> server errors the caller can't fix: 500 (unexpected), 503 (unavailable/overloaded). The key distinctions clients rely on: 401 vs. 403 (who you are vs. what you can do), 400 vs. 500 (your fault vs. mine — clients retry 5xx, not 4xx), and 429 with a <code>Retry-After</code> header so clients back off correctly.</p>`);
IV(`Observability & reliability`,`Medium`,`What is distributed tracing and why is it essential in microservices?`,`<p>Distributed tracing follows a single request as it flows across all the services it touches, recording each hop as a "span" with timing, linked by a shared trace ID propagated through the calls. It's essential in microservices because a single user request might fan out across eight services, and when it's slow, metrics only tell you <em>something</em> is slow while logs are scattered across services — tracing is the only practical way to see <em>where</em> the time actually went and which service is the culprit. Tools like OpenTelemetry standardize the instrumentation. Without it, debugging a slow or failing request in a distributed system means manually correlating logs across many services, which is painfully slow exactly when you need speed.</p>`);
IV(`Deployment`,`Medium`,`Why decouple deployment from release with feature flags?`,`<p>Deploying code and releasing a feature to users are different acts, and separating them is powerful. A <strong>feature flag</strong> is a runtime toggle: you can deploy code with the feature turned off, then enable it independently — gradually to a percentage of users, to internal staff first (dark launch), or as an A/B test — and turn it off instantly if it misbehaves, without a redeploy. This lets you ship continuously (merging small increments behind flags) while controlling exposure, decouples risky releases from deploy timing, and gives an instant kill switch that's far faster than a rollback. The cost is flag management — flags must be cleaned up once permanent, or they accumulate into confusing technical debt.</p>`);
IV(`System design`,`Medium`,`Design a short-lived-code / OTP verification service.`,`<p><strong>Requirements:</strong> generate a one-time code, deliver it (SMS/email), verify it within a short window, and resist abuse. <strong>Design:</strong> generate a random code, store it in a fast store (Redis) keyed by the user/phone with a short <strong>TTL</strong> (auto-expiry), and deliver via a provider adapter (with failover). Verification checks the code and deletes it (single-use). <strong>Abuse defenses:</strong> rate-limit code generation per phone/IP (prevent SMS-pumping cost attacks), limit verification attempts per code (prevent brute force — a 6-digit code needs lockout after a few tries), and add exponential backoff. <strong>Deep dives:</strong> the TTL/expiry model, atomic check-and-delete to prevent races, and provider cost/reliability trade-offs.</p>`);
IV(`Databases & storage`,`Medium`,`What is eventual consistency and where is it acceptable?`,`<p>Eventual consistency guarantees only that, if no new writes occur, all replicas will <em>eventually</em> converge to the same value — reads may be stale in the meantime, but the system stays available and fast. It's acceptable — and usually preferable — wherever brief staleness is harmless or invisible: social media like counts and follower counts, view counters, "last seen" timestamps, product review counts, DNS, and CDN-cached content. It's <em>not</em> acceptable where a stale read causes real harm: account balances, inventory at checkout, or anything where two parties must agree on a single current value. The design skill is recognizing that most data in most systems tolerates eventual consistency, so you reserve expensive strong consistency for the few places that genuinely need it.</p>`);

IV(`Fundamentals`,`Easy`,`What is a load balancer and what does it give you?`,`<p>A load balancer sits in front of a pool of servers and distributes incoming requests across them. It gives you two things at once: <strong>scale</strong> (spread load so no single server is overwhelmed, and add capacity by adding servers behind it) and <strong>availability</strong> (health-check servers and route around dead ones, so one failure doesn't cause an outage). It also enables zero-downtime deploys (drain traffic from a server before updating it). It's one of the most fundamental building blocks — the moment you have more than one server, you need something distributing traffic across them, which is what makes a stateless, horizontally-scaled tier possible.</p>`);
IV(`Fundamentals`,`Medium`,`What are functional vs. non-functional requirements?`,`<p><strong>Functional</strong> requirements are what the system does — the features and behaviors (users can post, follow, and view a feed). <strong>Non-functional</strong> requirements are the qualities it must have while doing them — scale (how many users/QPS), latency targets, availability, consistency needs, durability, security, and cost. In system design, the non-functional requirements usually drive the architecture more than the functional ones: "a URL shortener" is simple functionally, but "at 100k redirects/sec with 99.99% availability" dictates caching, CDNs, and redundancy. That's why the first step of any design is clarifying both, and especially pinning down scale and which qualities matter most, before drawing any boxes.</p>`);
IV(`Scaling & distribution`,`Medium`,`What is database connection pooling and why does it matter?`,`<p>Opening a database connection is expensive (TCP handshake, authentication, session setup), so doing it per request is slow and, at scale, exhausts the database's limited connection slots. A <strong>connection pool</strong> maintains a set of reusable open connections that requests borrow and return, amortizing the setup cost and capping the total connections against the database. It matters because databases have a hard ceiling on concurrent connections, and a fleet of app servers each opening many connections can overwhelm it — the pool bounds and shares them. At very large scale you add a external pooler (like PgBouncer) in front of the database. Misconfigured pools (too small → contention; too large → database overload) are a common, subtle production bottleneck.</p>`);
IV(`Databases & storage`,`Medium`,`What is a materialized view and when would you use one?`,`<p>A materialized view is the precomputed, stored result of a query, refreshed periodically or on change — unlike a regular view, which recomputes on every access. You use one when an expensive query (a complex join or aggregation) is read often but its inputs change relatively infrequently, so paying the computation cost repeatedly is wasteful. For example, a dashboard showing daily aggregates can read a materialized view refreshed hourly instead of scanning millions of rows per page load. The trade-off is staleness (the view lags its sources between refreshes) and storage. It's essentially caching at the database layer, and it's a lighter-weight cousin of CQRS's separate read models.</p>`);
IV(`Consistency & CAP`,`Medium`,`What is a lease and how does it enable safe distributed work?`,`<p>A lease is a time-bounded claim on a resource or task — "I own this for the next 30 seconds." It's the key to at-least-once execution with safety: a worker atomically claims a task with a lease, does the work, and completes it; if the worker crashes, the lease expires and the task becomes reclaimable by another worker, so no task is lost. This avoids the impossible problem of distinguishing a dead worker from a slow one — you don't need to know why it went silent, because the lease simply expires and the work is retried. Because a task can thus run more than once (the original worker might resurface), the work must be <strong>idempotent</strong>. Leases underpin distributed locks, leader election, and job schedulers.</p>`);
IV(`Messaging & events`,`Medium`,`What is a dead-letter queue and why have one?`,`<p>A dead-letter queue (DLQ) is a separate queue where messages are sent after they repeatedly fail to be processed. Without it, a "poison" message — malformed, or referencing deleted data — that always fails would either block the queue (if processing is ordered) or retry forever, consuming resources and never succeeding. Routing it to a DLQ after N attempts gets it out of the main flow so healthy messages keep moving, while preserving the failed message for inspection, debugging, and later replay once you've fixed the cause. You monitor and alert on DLQ depth, since a filling DLQ signals a systematic problem. It's the "quarantine" that separates transient failures (worth retrying) from permanent ones (needing human attention).</p>`);
IV(`Architecture`,`Medium`,`What is the sidecar pattern?`,`<p>The sidecar pattern deploys a helper component alongside your main service (in the same pod/host) to handle cross-cutting concerns without embedding them in the application code — things like TLS, retries, service discovery, metrics, and traffic routing. The most common example is a <strong>service mesh</strong> (Istio, Linkerd), where a proxy sidecar next to each service handles all network communication, giving you mutual TLS, observability, and traffic control uniformly across services regardless of their language. The benefit is consistent infrastructure behavior decoupled from application logic; the cost is added complexity and per-service resource overhead, so it earns its place mainly in larger microservice fleets that need uniform networking and observability.</p>`);
IV(`Software design`,`Medium`,`What is technical debt and how do you manage it?`,`<p>Technical debt is the accumulated cost of shortcuts and deferred quality work — code that's harder to change than it should be. Like financial debt, a little taken deliberately can be worthwhile (ship now, clean up later), but it accrues "interest": every future change in that area is slower and riskier. I manage it by making it <strong>visible</strong> (tracking it, not leaving it implicit), distinguishing <em>deliberate, prudent</em> debt (a conscious trade-off with a payback plan) from <em>reckless</em> debt (sloppiness), and paying it down continuously via the Boy Scout Rule and preparatory refactoring woven into feature work — rather than hoping for a mythical "cleanup sprint." The key judgment is that debt in code you rarely touch matters little; debt in code you change constantly is worth paying down first.</p>`);
IV(`System design`,`Medium`,`Design a commenting system for a high-traffic site.`,`<p><strong>Shape:</strong> read-heavy (many readers, fewer commenters), with threading, sorting, and moderation. Store comments in a database keyed by the parent content, with a parent pointer for threading; <strong>cache</strong> rendered comment threads for hot content (with invalidation on new comments) since reads dominate. Counts (comment count, likes) are eventually consistent and can be denormalized/cached. <strong>Deep dives:</strong> pagination of long threads (cursor-based), sort orders (top vs. newest — precompute or index accordingly), moderation/spam filtering (async pipeline, possibly ML), and the hot-content problem (a viral post's comments — cache aggressively, and handle write contention on counters with sharded counters). Notifications to repliers reuse the notification-service pattern.</p>`);
IV(`Observability & reliability`,`Medium`,`What is load shedding and when do you use it?`,`<p>Load shedding is deliberately rejecting some requests when the system is overloaded, so that it can continue serving the rest well — instead of accepting everything and degrading (or crashing) for everyone. When demand exceeds capacity, you drop or reject excess early (ideally the least important work first — e.g., reject low-priority background requests before user-facing ones), returning a fast 429/503 rather than letting queues grow unbounded and latency explode. You use it as a last line of defense during spikes or partial outages, alongside autoscaling (which lags) and rate limiting (which is per-client). The principle is that partial service is far better than total collapse: shedding 10% of load to keep 90% healthy beats serving 100% terribly.</p>`);
IV(`Security`,`Medium`,`How do you handle authentication in a microservices architecture?`,`<p>Typically you authenticate once at the edge (API gateway) and propagate a verified identity inward, rather than having every service re-authenticate the user from scratch. A common approach: the gateway validates the incoming token (session or OAuth/OIDC), then passes a signed internal token (or the verified claims) to downstream services, which trust it because it came through the gateway over a secured internal channel. Services still enforce <strong>authorization</strong> for their own resources (the gateway can't know every object-level rule). For service-to-service calls, use mutual TLS and/or service identities (a zero-trust posture) so services authenticate each other, not just users. The goal is to authenticate once, propagate identity securely, and authorize everywhere.</p>`);
IV(`Fundamentals`,`Medium`,`What questions do you ask before starting any system design?`,`<p>I scope before designing. <strong>Functional:</strong> what are the core features, and just as importantly, what's explicitly out of scope? <strong>Scale:</strong> how many users (DAU), what request rates, how much data, what's the read:write ratio? <strong>Qualities:</strong> what are the latency targets, availability needs, and — critically — where does this need strong consistency versus tolerate eventual? <strong>Constraints:</strong> existing tech, team size, timeline, budget. These answers do most of the work: they tell me whether I'm building for thousands or hundreds of millions, whether to optimize reads or writes, and where correctness is non-negotiable. Jumping to boxes-and-arrows before clarifying these is the most common way to confidently design the wrong system.</p>`);
</script>

body:`
<div class="callout key"><div class="callout-t">◆ Picture it first</div>Think of Amazon as three buildings joined together: a giant <strong>shop window</strong> (browse and search hundreds of millions of products), a <strong>checkout counter</strong> (cart, payment, "is it in stock?"), and a <strong>warehouse and post office</strong> (pack it, ship it, track it). Each building has very different needs, so we don't build one giant program — we build several smaller ones that talk to each other. That single idea explains almost every decision below.</div>

<h2><span class="h-node"></span>Step 1 — What are we actually building?</h2>
<p>"An Amazon" is huge, so the smartest first move is to <em>shrink the problem</em> to its core and say out loud what we're leaving out. The core shopping journey is: <strong>find a product → look at it → add to cart → pay → get it delivered</strong>, plus reviews and recommendations along the way.</p>
<p><strong>We'll build (features):</strong> search and browse the catalog; a product page with price, stock, and reviews; a cart; checkout and payment; a promise to <em>never sell the same last item twice</em>; placing and tracking an order; personalized "you might also like"; and reviews. <strong>We'll skip (for now):</strong> the seller tools, the robots in the warehouse, ads, and video streaming. Naming what's out of scope is not lazy — it shows you're focusing, which is exactly what a senior engineer does.</p>
<p>Then the qualities that make it <em>hard</em>: it must stay up almost all the time (every minute down loses money), it must be fast (a product page in a blink), and above all it must be <strong>correct where money and stock are involved</strong> — never charge you twice, never sell you something that's out of stock.</p>

<h2><span class="h-node"></span>Step 2 — How big is it? (a quick sanity check)</h2>
<p>Before designing, do rough math so you build the right size of thing. Round hard — you want the shape, not the exact number.</p>
<ul>
<li><strong>How many page views?</strong> Say 300 million people use it a day, each looking at ~30 pages. That's 300M × 30 ÷ 100,000 (seconds in a day) ≈ <strong>90,000 page views every second</strong>. That is enormous.</li>
<li><strong>How many actual purchases?</strong> Maybe 30 million orders a day ≈ <strong>300 orders per second</strong>. Tiny compared to views.</li>
<li><strong>What does that tell us?</strong> People <em>look</em> about 300× more than they <em>buy</em>. So most of our effort goes into serving reads super fast and cheaply (that's where <strong>caching</strong> comes in), while the smaller "buying" path can afford to be slower but must be <strong>bulletproof-correct</strong>.</li>
</ul>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A <strong>cache</strong> is a small, fast copy of popular data kept close by — like writing your three most-called numbers on a sticky note instead of opening the phone book every time. Because people look far more than they buy, sticky notes (caches) do most of the work.</div>

</svg><div class="figure-cap"><b>Read this top to bottom.</b> You (top) hit a <b>CDN</b> that serves images and cached pages from a server near you. Real actions go through the <b>front door</b> (gateway) to small <b>services</b>, each doing one job. The amber ones (Order, Payment, Inventory) handle money and stock, so they get the strict, careful treatment. Services announce what happened on a shared <b>event board</b> so others can react.</div></div>

<h2><span class="h-node"></span>Why many small programs instead of one big one?</h2>
<p>You could imagine one giant program that does everything. It sounds simpler, but it isn't at this size. If everything is tangled together, one team can't change the search code without risking the payment code, one bug can take the whole site down, and you can't make just the "search" part bigger when search gets busy. So we split it into <strong>services</strong> — separate programs, each owning one job (catalog, cart, payment…) and its own data.</p>
<div class="callout note"><div class="callout-t">◆ What's a "service"?</div>Just a small program with one responsibility that others talk to over the network — like separate departments in a company. The <em>Payments</em> department doesn't need to know how <em>Search</em> works; it just needs Search to send a customer over when they're ready to buy. Splitting this way is mainly about letting many teams work without stepping on each other, not about speed.</div>

<h2><span class="h-node"></span>The shop window — catalog, product pages &amp; search</h2>
<p><strong>The catalog</strong> is the list of every product and its details. Since people view products constantly but products change rarely, we lean hard on caching: the assembled product page is kept as a ready-made copy in the CDN and in a fast cache, so almost every view is served instantly without bothering the main database. Product <strong>images</strong> live in cheap "file storage" (think of a giant coat-check) and are delivered by the CDN; the database only stores the <em>link</em> to each image, never the image itself.</p>
<p><strong>Search</strong> is its own specialist. A normal database is bad at "find products matching these words, ranked by relevance," so we keep a separate <strong>search index</strong> (the tool behind it is like the index at the back of a book — it maps words to the products that contain them). It's kept roughly up to date by listening for "product changed" announcements. If a new product shows up in search a few seconds late, nobody is harmed — so here we happily trade perfect freshness for speed and simplicity.</p>
<p><strong>Autocomplete</strong> (suggestions as you type) can't ask the database on every keystroke — far too slow. Instead we <em>precompute</em> the popular completions ahead of time and keep them in memory, so suggestions appear instantly.</p>

<h2><span class="h-node"></span>The cart — where "good enough" beats "perfect"</h2>
<p>Your cart is just a per-person list, and interestingly it's a place where we <em>choose speed over strictness</em>. If your cart occasionally shows a slightly out-of-date state for a moment, that's annoying at worst. So carts live in a very fast store and we don't sweat perfect consistency. The important checks — "is this still in stock? is the price still right?" — happen later, at checkout, not while browsing. Keep the loose part loose, and be strict only at the moment it matters.</p>

<h2><span class="h-node"></span>The hard problem #1 — never sell the last item twice</h2>
<p>Here's a classic trap. One phone is left in stock. Two people tap "Buy" at the exact same millisecond. A naive program checks "is there stock? yes" for both, then subtracts one for both — and now you've sold two phones you don't have. Angry customers, cancelled orders.</p>
<div class="callout key"><div class="callout-t">◆ The one-line fix (worth memorizing)</div>Let the database decide the race, atomically, in a single step: <code>UPDATE stock SET count = count - 1 WHERE sku = ? AND count &gt; 0</code>. In plain English: "subtract one, but only if there's at least one left." The database guarantees only one of the two shoppers can win; the other's update changes nothing and they're told "sorry, just sold out." Two people, one item, exactly one winner — every time.</div>
<p>To make carts pleasant, when you start checkout we place a short <strong>hold</strong> on the item (like a "reserved" sticker) that automatically expires if you wander off, then either confirm it when you pay or release it if you don't.</p>

<h2><span class="h-node"></span>The hard problem #2 — never charge you twice</h2>
<p>Networks are flaky. You tap "Pay," the request is slow, your phone gives up and quietly retries — and now the server might get the <em>same</em> payment twice. The fix is an <strong>idempotency key</strong>: a unique ticket number attached to your payment. The server remembers "I already handled ticket #A1B2 and here's what happened," so if it sees that ticket again, it just replays the first result instead of charging you a second time.</p>
<div class="callout note"><div class="callout-t">◆ Everyday analogy</div>It's like a coat-check ticket. Handing in your ticket twice doesn't get you two coats — the attendant recognizes the number and gives you the one coat you already own. That's exactly how we make "retrying a payment" safe.</div>
<p>Behind that, a <strong>ledger</strong> (a double-entry record, the same idea accountants use) is the source of truth for money, and a background job constantly checks it against the card processor to catch any mismatch. The card processor sits behind a safety switch (a <em>circuit breaker</em>) so if it goes down, checkout fails fast to a backup instead of hanging.</p>

<h2><span class="h-node"></span>Checkout across many departments — the "saga"</h2>
<p>Placing an order touches several services (stock, payment, order, shipping). Normally a database can wrap several steps in one all-or-nothing transaction, but here the steps live in <em>different</em> services, so that's not possible. Instead we use a <strong>saga</strong>: do the steps one at a time, and if a later step fails, run "undo" actions for the earlier ones.</p>
<div class="callout note"><div class="callout-t">◆ What's a saga, really?</div>It's a to-do list with matching "undo" buttons. Reserve the item → charge the card → create the order. If charging the card fails, you press undo on the earlier step: release the item's hold. You can't "un-ship" a package, so you design each step so its undo makes sense (a refund undoes a charge). It's how you get all-or-nothing behavior when a single transaction isn't available.</div>

<div class="figure"><svg viewBox="0 0 660 170" role="img" aria-label="Checkout saga with compensations">

<g stroke="#697285" stroke-width="1.4"><line x1="128" y1="60" x2="140" y2="60"/><polygon points="140,56 148,60 140,64" fill="#697285"/><line x1="264" y1="60" x2="276" y2="60"/><polygon points="276,56 284,60 276,64" fill="#697285"/><line x1="400" y1="60" x2="412" y2="60"/><polygon points="412,56 420,60 412,64" fill="#697285"/><line x1="536" y1="60" x2="548" y2="60"/><polygon points="548,56 556,60 548,64" fill="#697285"/></g>

</svg><div class="figure-cap"><b>Do the steps in order; keep an undo for each.</b> Card declined after we reserved the item? Undo the reservation and cancel the order, so nothing is left half-done.</div></div>

<h2><span class="h-node"></span>Follow one order, start to finish</h2>
<p>Let's make it concrete. Say <strong>Maya</strong> taps "Buy now" on a $30 book:</p>
<ol>
<li>Her tap hits the <strong>front door</strong> (gateway), which checks she's logged in and sends her to the <strong>Order</strong> service.</li>
<li>The saga begins: <strong>Inventory</strong> places a hold on one copy using the "only if in stock" trick. Success.</li>
<li><strong>Payment</strong> charges her card, carrying her unique ticket number so a retry can't double-charge. Success.</li>
<li><strong>Order</strong> records the order as "paid" and puts an announcement on the shared board: "Order placed!"</li>
<li>Everyone listening reacts on their own: <strong>Fulfillment</strong> picks the nearest warehouse with the book; <strong>Notifications</strong> emails Maya a confirmation; <strong>Analytics</strong> counts the sale. None of them had to be called directly — they just heard the announcement.</li>
<li>As the warehouse ships and the courier scans the package, tracking updates flow back and Maya sees "Out for delivery."</li>
</ol>
<p>Notice how the announcement board (events) let five things happen without the Order service knowing or caring about any of them. That decoupling is what keeps a huge system maintainable.</p>

<h2><span class="h-node"></span>Recommendations, reviews, and delivery (the easier parts)</h2>
<p><strong>Recommendations</strong> ("customers also bought…") are powered by machine learning. In simple terms: offline, we study everyone's past purchases to learn which products go together; online, when you view a product we quickly fetch a short list of related items and show the best few. If a recommendation is a little stale, no harm done, so this part is allowed to be "roughly right, very fast."</p>
<p><strong>Reviews</strong> are read a lot and written rarely, and a brand-new review showing up a few seconds late is fine — so they're kept simple and eventually consistent, with new reviews passing through an automatic spam filter before appearing. The star rating you see is a pre-added-up number stored on the product for speed.</p>
<p><strong>Delivery</strong>: once paid, the order is handed to a warehouse (chosen by what's in stock and who's closest), and the package's journey is a stream of scans ("picked," "shipped," "out for delivery") that update your tracking page and trigger notifications.</p>

<h2><span class="h-node"></span>Prime Day — surviving a giant rush</h2>
<p>A mega-sale is two problems at once. <strong>Too many people at once:</strong> we put shoppers through a <strong>virtual waiting room</strong> that lets them in at a pace the system can handle (like a bouncer metering a club), and serve deal pages from the cache so the database isn't hammered. <strong>Everyone fighting over the same few hot items:</strong> the "only if in stock" trick still guarantees correctness, and for the very hottest items we spread the load so a single database row doesn't melt. The key insight: raw traffic is the <em>easy</em> half; the hard half is staying correct while thousands fight over ten units.</p>

<h2><span class="h-node"></span>Which parts must be perfect, and which can be "good enough"?</h2>
<div class="tbl-wrap"><table><thead><tr><th>Part</th><th>How careful?</th><th>Why (in plain terms)</th></tr></thead><tbody>
<tr><td>Stock &amp; checkout</td><td>Perfect (strong)</td><td>Selling the same last item twice is unacceptable</td></tr>
<tr><td>Payments</td><td>Perfect + no-double-charge</td><td>It's people's money; it has to add up</td></tr>
<tr><td>Orders</td><td>Perfect</td><td>You must see your real order status</td></tr>
<tr><td>Cart</td><td>Good enough</td><td>A momentary blip is fine; re-checked at checkout</td></tr>
<tr><td>Search</td><td>Good enough</td><td>A few seconds' delay in indexing is invisible</td></tr>
<tr><td>Reviews &amp; ratings</td><td>Good enough</td><td>An approximate count that lags a bit is fine</td></tr>
<tr><td>Recommendations</td><td>Good enough</td><td>Slightly stale suggestions don't hurt anyone</td></tr>
</tbody></table></div>

<h2><span class="h-node"></span>What breaks when it gets 10× bigger?</h2>
<p>Nothing surprising — the pressure points are predictable. The "looking" traffic is soaked up by adding more caches and CDN capacity (easy, it spreads out naturally). The hottest stock items need to be split more finely so one record isn't a bottleneck. The search and recommendation indexes get repartitioned. The order and payment databases get split by customer. The clever correctness tricks (the "only if in stock" write, the payment ticket, the saga) don't change at all — only <em>how</em> the data is divided up does.</p>

<div class="callout note"><div class="callout-t">◆ The one lesson to remember</div>A giant system is really <strong>many small systems, each built to its own needs</strong>, wired together by announcements. The whole art is being <em>strict</em> exactly where it matters (stock, money) and <em>relaxed</em> everywhere it's safe (search, reviews, suggestions) — so the expensive, careful machinery stays small and the fast, cheap machinery does the heavy lifting.</div>
`

/* ---------- 2) SMALL BUSINESS SITE ---------- */
GUIDE.cases.push({
id:'case-bakery', navTitle:'Small business site', icon:'▦',
title:'Design a small business website (a local bakery)',
scale:'TINY',
tag:'The anti-over-engineering case',
lead:'The exact opposite of Amazon: a website for a neighborhood bakery — menu, hours, a contact form, and a newsletter. The whole lesson is that the right answer here is small, and copying Amazon would be a costly mistake.',
body:`
<div class="callout key"><div class="callout-t">◆ Why bother with a "tiny" case?</div>Because <strong>building too much is a real mistake</strong>, not a safe one. Most websites are nothing like Amazon, and the mark of a good engineer is choosing the <em>simplest thing that does the job</em>. After the Amazon monster, this is a palate cleanser — watch how few moving parts a genuinely good design can have.</div>

<h2><span class="h-node"></span>Step 1 — What does the bakery actually need?</h2>
<p>Rosa owns a bakery. She wants a website that: shows the <strong>menu</strong>, the <strong>story</strong>, the <strong>hours and address</strong>; lets a customer send a <strong>message</strong> ("can you make a custom birthday cake?"); and lets people <strong>join a newsletter</strong> for weekly specials. Maybe someday, order-ahead. That's the entire list. There are no accounts, no payments today, no stock to track, no personalization.</p>

<h2><span class="h-node"></span>Step 2 — How much traffic, really?</h2>
<p>Let's be honest about the numbers instead of imagining she's Amazon. A popular local shop might get a few thousand website visits a day — say 3,000. Spread over a day that's <strong>about one visit every 30 seconds</strong>. Even if a local newspaper features her and traffic jumps 100×, it's a few visits per second — something a single tiny server could serve from a laptop without breaking a sweat.</p>
<div class="callout note"><div class="callout-t">◆ The number that decides everything</div>The "scale" here is essentially <strong>zero</strong>. When you notice that, it should immediately rule out almost every heavy technique. There is nothing here that needs sharding, clusters, or a fleet of servers — and pretending otherwise just adds cost and things that can break.</div>

<div class="figure"><svg viewBox="0 0 660 180" role="img" aria-label="Small business site architecture">
<rect x="30" y="70" width="120" height="44" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="90" y="97" text-anchor="middle" font-size="12" fill="#E7EBF2">Visitor</text>
<line x1="150" y1="92" x2="205" y2="92" stroke="#697285" stroke-width="1.4"/><polygon points="205,88 213,92 205,96" fill="#697285"/>
<rect x="216" y="60" width="150" height="64" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="291" y="88" text-anchor="middle" font-size="12" fill="#E7EBF2">The website (files)</text><text x="291" y="106" text-anchor="middle" font-size="10" fill="#9BA6B7">on a CDN, served worldwide</text>
<rect x="430" y="24" width="200" height="44" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="530" y="46" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Tiny form handler</text><text x="530" y="61" text-anchor="middle" font-size="10" fill="#9BA6B7">wakes up only on submit</text>
<rect x="430" y="116" width="200" height="44" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="530" y="138" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Email service (rented)</text><text x="530" y="153" text-anchor="middle" font-size="10" fill="#9BA6B7">newsletter + notify Rosa</text>
<line x1="366" y1="80" x2="425" y2="52" stroke="#697285" stroke-width="1.3"/><polygon points="419,50 428,50 423,58" fill="#697285"/>
<line x1="530" y1="68" x2="530" y2="112" stroke="#697285" stroke-width="1.3"/><polygon points="526,104 530,112 534,104" fill="#697285"/>
</svg><div class="figure-cap"><b>Almost nothing to run.</b> The website is just files, copied onto a CDN so it loads fast anywhere. The only "action" — sending the contact form — wakes a tiny function that hands the message to a rented email service. No servers to babysit, no database to grow, no departments to coordinate.</div></div>

<h2><span class="h-node"></span>Step 3 — The whole design (it's short)</h2>
<ul>
<li><strong>The website is just files.</strong> The menu, story, and hours are pages built ahead of time (plain HTML, or generated from a simple editor Rosa can use). We put those files on a <strong>CDN</strong> — a network that keeps copies near every visitor. This is nearly free, basically can't fall over, and is very safe (there's no running program for hackers to attack).</li>
<li><strong>The contact form is a tiny function.</strong> When someone hits "Send," a small piece of code runs <em>just for that moment</em>: it checks the message isn't spam and passes it to the email service to reach Rosa. It costs almost nothing because it only runs when used — the rest of the time, it's asleep.</li>
<li><strong>The newsletter is rented.</strong> We don't build an emailing system; we use an existing one. It already handles storing the list, the "unsubscribe" link, and making sure emails don't land in spam — all things that are surprisingly hard to get right.</li>
</ul>

<h2><span class="h-node"></span>What we deliberately did NOT build — and why that's the skill</h2>
<div class="tbl-wrap"><table><thead><tr><th>Tempting to add</th><th>Verdict (in plain terms)</th></tr></thead><tbody>
<tr><td>A database</td><td>Not needed. The pages are fixed; the mailing list lives inside the rented email service.</td></tr>
<tr><td>Separate services / departments</td><td>Silly here — there's barely one job. Splitting nothing into pieces just adds wiring.</td></tr>
<tr><td>Sharding / replication</td><td>There's no database to split, and the CDN already handles the visitors.</td></tr>
<tr><td>An event / message system</td><td>Nothing to stream. One direct function call is clearer and simpler.</td></tr>
<tr><td>Clusters / auto-scaling servers</td><td>Nothing to scale — files and a sleep-until-used function handle spikes on their own.</td></tr>
</tbody></table></div>
<p>Every one of those would add monthly cost, maintenance, and new ways to break — to solve problems this site simply <em>does not have</em>. Choosing to leave them out isn't laziness; <strong>the choosing is the design</strong>.</p>

<h2><span class="h-node"></span>The only genuinely real decisions</h2>
<p>With scale a non-issue, the actual judgment calls are small but worth getting right:</p>
<ul>
<li><strong>Spam on the form</strong> — add a hidden "honeypot" field bots fill in but humans never see (if it's filled, it's a bot), or a light CAPTCHA, and limit how often the function can run.</li>
<li><strong>Emails actually arriving</strong> — use a reputable email service so the newsletter lands in inboxes, not spam folders. This is the sneaky-hard part of "just send an email."</li>
<li><strong>Rosa editing her own site</strong> — give her a simple editor so fixing a typo or a price doesn't require calling a developer.</li>
</ul>

<h2><span class="h-node"></span>When would it need to grow up?</h2>
<p>Only when a <em>real new requirement</em> appears. If Rosa adds proper <strong>order-ahead with online payment</strong>, then — and only then — we'd add a small database (orders, products), a payment service with the same "no double-charge" ticket trick from the Amazon case, and stock tracking if items sell out. We'd borrow Amazon's patterns, but at a fraction of the size. You add machinery when the need arrives, never "just in case."</p>

<div class="callout note"><div class="callout-t">◆ The one lesson to remember</div>Good design means <strong>fitting the solution to the actual problem</strong> — and most problems are small. Reaching for big-company tools "to be safe" is over-engineering: you pay real cost and complexity today to handle problems you may never have. The simplest thing that meets the requirements is usually the best thing.</div>
`
});

lead:'A photo-sharing app where you post pictures, follow people, and scroll a personalized feed. Explained step by step: how a photo travels from your phone to the world, and how everyone gets a feed of the right posts without melting the servers.',
body:`
<div class="callout key"><div class="callout-t">◆ Picture it first</div>Imagine a giant shared photo album that hundreds of millions of people read constantly and add to occasionally. The two interesting questions are: (1) how do we handle all those <strong>photos</strong> (they're big and heavy), and (2) how does each person get a <strong>feed</strong> containing exactly the posts from people they follow, fast, without the servers catching fire? Everything below answers those two.</div>

<h2><span class="h-node"></span>Step 1 — What are we building?</h2>
<p><strong>We'll build:</strong> post a photo with a caption; follow and unfollow people; a home <strong>feed</strong> of recent posts from the people you follow; likes and comments. <strong>We'll skip (for now):</strong> stories, direct messages, reels, and ads — worth naming so we stay focused.</p>

<h2><span class="h-node"></span>Step 2 — How big, and what does that tell us?</h2>
<p>Say 500 million people use it daily. The crucial fact: people <strong>scroll far more than they post</strong>. You might open your feed 20 times a day but post once a week. So this is hugely <em>read-heavy</em> — feed-viewing dwarfs photo-uploading. That single observation drives the whole design: make <em>reading the feed</em> extremely fast and cheap, even if that means doing extra work when someone posts.</p>

<h2><span class="h-node"></span>What happens when you tap "Share"?</h2>
<p>Let's follow a photo from your phone to your followers.</p>
<ol>
<li>Your phone doesn't send the big photo <em>through</em> our servers. Instead it uploads the image <strong>directly</strong> to cheap <strong>file storage</strong> (that giant coat-check again), using a temporary permission slip our server hands out. This keeps our servers free and fast.</li>
<li>That upload kicks off a little <strong>assembly line</strong>: it makes several sizes of your photo (a thumbnail for the grid, a big one for full-screen) so every device gets a well-fitting version.</li>
<li>We save the <strong>details</strong> of the post — who posted it, the caption, the time, and the <em>links</em> to the image sizes — in a database. Again: the database stores links and text, never the heavy image itself.</li>
<li>The image is delivered to viewers by a <strong>CDN</strong>, so it loads from a server near them.</li>
</ol>

<div class="figure"><svg viewBox="0 0 660 190" role="img" aria-label="Instagram upload pipeline">
<g font-size="10.5" fill="#E7EBF2">

</svg><div class="figure-cap"><b>The heavy photo skips our servers.</b> It goes straight to storage, gets resized into a few versions, its details are recorded, and it's delivered by the CDN. Our servers only ever touch small text, never the big image.</div></div>

<h2><span class="h-node"></span>The big question — how does everyone's feed get built?</h2>
<p>Here's the heart of it. When you open the app, we need to show recent posts from everyone you follow, instantly. There are two obvious ways to do it, and each has a fatal flaw on its own.</p>
<div class="callout key"><div class="callout-t">◆ Think of it like a mailroom</div><strong>Way 1 — "deliver on posting" (push):</strong> the moment you post, we copy your post into the mailbox of every follower. Reading is then instant (your feed is just your mailbox). <em>Flaw:</em> if a celebrity with 100 million followers posts, we'd have to make 100 million copies for one post — a stampede. <strong>Way 2 — "gather on reading" (pull):</strong> we store each post once, and when you open the app we run around collecting recent posts from everyone you follow. Posting is cheap. <em>Flaw:</em> reading is slow, and everyone reads constantly.</div>
<p><strong>The real answer is a mix.</strong> For normal accounts, we deliver-on-posting (pre-build followers' feeds — fast reads). For the handful of mega-celebrities you follow, we gather-on-reading (grab their latest posts when you open the app) and blend them in. This avoids the celebrity stampede while keeping feeds fast for everyone. Pre-built feeds live in a very fast store so opening the app feels instant.</p>

</svg><div class="figure-cap"><b>Best of both.</b> Pre-deliver posts from ordinary accounts (instant feeds); grab the few celebrities' posts at read time and mix them in — so one celebrity post never triggers 100 million copies.</div></div>

<h2><span class="h-node"></span>Likes and comments — where "roughly right" is fine</h2>
<p>A photo might get millions of likes. Do we need the count exact to the millisecond? No — if it says 1,240,203 and it's really 1,240,210 for a second, nobody cares. So likes and comments are handled the <em>relaxed</em> way: we count them quickly and approximately and let the number catch up. This is what lets the app stay fast and always-available even under massive activity. (Compare this to Amazon's stock count, which must be exact — same idea, opposite choice, because the <em>consequences</em> differ.)</p>

<h2><span class="h-node"></span>The tricky bits, in plain terms</h2>
<ul>
<li><strong>Celebrities</strong> — a few accounts break the "just copy to everyone" plan, so we special-case them (gather-on-read). Real systems always have a few "hot" items that need special handling.</li>
<li><strong>Ordering the feed</strong> — newest-first is simplest; a "smart" ranked feed (what you're most likely to enjoy) is an extra layer on top.</li>
<li><strong>Endless scroll</strong> — we hand you the feed in pages using a "continue from here" bookmark, so scrolling forever stays efficient.</li>
<li><strong>Photos themselves</strong> — entirely a CDN job; our databases never touch the big files.</li>
</ul>

<div class="callout note"><div class="callout-t">◆ The one lesson to remember</div>A feed app is really a <strong>speed-of-reading problem</strong>: do extra work when someone posts so that reading is instant, keep heavy media on the CDN, let counts be "roughly right" for speed, and special-case the few celebrities who break the simple plan.</div>
