timizes for the <em>interview</em> — it sometimes hand-waves operational messiness, picks the "expected" canonical answer, and stays at a level of detail appropriate for a 45-minute conversation. Don't mistake a chapter for a complete implementation guide.</li></ol><ol><li><strong>It's light on the deep "why."</strong> The book gives you the <em>moves</em> ("use consistent hashing here," "shard by user ID there") more than the underlying <em>reasons</em> those moves work. That's why the near-universal advice is to <strong>read it <em>alongside</em> DDIA (06h)</strong>: Xu shows you <em>what</em> to draw; Kleppmann explains <em>why the mechanisms work and what they truly cost</em> — so you can defend your choices under follow-up questions and adapt them to novel problems, rather than pattern-matching to memorized answers. The two books are perfect complements: performance practice + underlying physics.</li></ol><hr class="divider"><h2><span class="h-node"></span>What to take away</h2><ol><li><strong>Chapter 1's scaling narrative</strong> — the single-server-to-millions evolution — is the mental model behind most real architectures; know why each component (LB, replicas, cache, CDN, queue, shard) gets added.</li><li><strong>Always estimate first</strong> — QPS, storage, read:write ratio — and let the numbers drive the design.</li><li><strong>The 4-step framework</strong> — scope → high-level design → deep dive → wrap-up — is how to structure <em>any</em> design conversation, interview or real.</li><li><strong>Master the building blocks</strong> — consistent hashing, unique IDs (Snowflake), the key-value store internals, rate limiting — they recur across problems.</li><li><strong>Learn the worked designs actively</strong> — design-then-compare, never passive reading, or you'll build recognition without ability.</li><li><strong>It's interview-depth; pair it with DDIA</strong> for the underlying <em>why</em>.</li></ol><p>Use Volume 1 to build core fluency and Volume 2 to stretch into specialized/correctness-heavy domains. Combined with DDIA for theory and the main guide's scenario chapters for guided practice, it's the fastest path to genuine system-design competence.</p><p><strong>Apply it this week:</strong> take one chapter (say, the news feed or the rate limiter), read <em>only</em> its requirements section, close the book, and design the whole thing yourself on paper using the 4-step framework — estimate, sketch, pick storage, handle the hard part. Then compare against Xu's solution and write down every decision you missed and <em>why</em> his differs. That single active exercise teaches more than reading five chapters passively.</p>`});

GUIDE.quizzes.push({title:`Fundamentals II`,questions:[
{q:`What does "eventual consistency" guarantee?`,options:[`Reads always see the latest write`,`Replicas converge to the same value if writes stop`,`Writes never conflict`,`Data is never lost`],answer:1,explain:`Eventual consistency guarantees only that, absent new writes, all replicas eventually converge to the same value — reads may be stale in the meantime.`},
{q:`A system is "highly available" but occasionally returns stale data. Which consistency model is it likely using?`,options:[`Linearizable`,`Strong`,`Eventual`,`Serializable`],answer:2,explain:`Serving stale data to stay responsive is the hallmark of eventual consistency, favored when availability matters more than immediate correctness.`},

/* ===== EXPANDED INTERVIEW BANK ===== */
var IV=(cat,d,q,a)=>GUIDE.interview.push({cat:cat,d:d,q:q,a:a});
IV(`Fundamentals`,`Easy`,`What is vertical scaling and when does it stop working?`,`<p>Vertical scaling means running on a bigger machine — more CPU, RAM, and disk — to handle more load. It's attractive because it needs no code changes and keeps everything simple (one node, easy transactions). It stops working when you hit the largest machine available (a hard ceiling), when the cost curve turns exponential, or when you need redundancy — a single big box is still a single point of failure. At that point you scale horizontally instead, which means many machines, a load balancer, and usually stateless services.</p>`);
IV(`Fundamentals`,`Medium`,`Explain the difference between reliability, availability, and durability.`,`<p><strong>Availability</strong> is the fraction of time the system is up and responding (measured in nines). <strong>Reliability</strong> is whether it does the <em>correct</em> thing — a system can be available but returning wrong answers. <strong>Durability</strong> is the promise that once data is acknowledged, it survives failures and is never lost. They're independent goals: a cache is highly available but not durable; a backup archive is durable but not highly available. Good designs are explicit about which they need where — a payment ledger prizes durability and reliability, a view counter prizes availability.</p>`);
IV(`Fundamentals`,`Medium`,`What does "designing for failure" mean in practice?`,`<p>It means assuming every component will eventually fail and ensuring no single failure is catastrophic. Concretely: add redundancy so there's no single point of failure; use health checks and automatic failover; set timeouts on every remote call; retry with exponential backoff and jitter; wrap flaky dependencies in circuit breakers; isolate resources with bulkheads; and degrade gracefully (turn off a feature rather than crash the app). The mindset shift is treating partial failure as the normal case, not an exception — which is why observability and fast rollback matter as much as the happy-path design.</p>`);
IV(`Fundamentals`,`Hard`,`How do you decide between strong and eventual consistency for a feature?`,`<p>Ask what a stale or slightly wrong read costs. If a stale read causes real harm — double-spending money, overselling inventory, showing a wrong balance — choose strong consistency (and accept the latency and availability cost). If a brief staleness is invisible or harmless — a like count, a view counter, a "seen" list — choose eventual consistency for better latency and availability. Crucially, this is a <em>per-feature</em> decision within one app: checkout is strong, the product's review count is eventual. I'd state the choice explicitly and name the exact guarantee needed (e.g., read-your-own-writes) rather than hand-waving "strong" or "eventual."</p>`);
IV(`Fundamentals`,`Easy`,`Why measure latency in percentiles?`,`<p>Because averages hide the slow tail that users actually feel. If most requests are fast but 1% take five seconds, the average looks fine while a meaningful slice of users has a terrible experience. p95 and p99 expose that tail, and at scale 1% is a huge number of (often your heaviest) users. Tail latency also <em>compounds</em>: a page that makes 10 backend calls, each with a 1% chance of being slow, is slow about 10% of the time. So I set SLOs on percentiles, not means.</p>`);
IV(`Fundamentals`,`Medium`,`What is idempotency and how do you implement it in an API?`,`<p>An operation is idempotent if performing it multiple times has the same effect as performing it once, which makes retries safe. Since clients retry on timeouts, non-idempotent mutations (like "create payment") risk duplicates. The standard implementation is an <strong>idempotency key</strong>: the client sends a unique ID with the request; the server records that key alongside the result of the first successful execution, and on any repeat with the same key it returns the stored result instead of executing again. GET/PUT/DELETE are naturally idempotent by HTTP semantics; POST is not, so create endpoints need explicit keys, stored with a TTL.</p>`);
IV(`Networking`,`Easy`,`When would you use WebSockets versus Server-Sent Events?`,`<p>Use <strong>WebSockets</strong> when you need full-duplex, low-latency, bidirectional communication — chat, multiplayer games, collaborative editing — where both client and server push messages continuously. Use <strong>Server-Sent Events</strong> when you only need one-way server→client streaming — live feeds, notifications, dashboards, or streaming an LLM's tokens — because SSE is simpler, runs over plain HTTP, and auto-reconnects. Both require a stateful connection tier with a session registry mapping each connected user to the server holding their connection, plus a plan for reconnection and failover.</p>`);
IV(`Networking`,`Medium`,`Why can't you trust timeouts to tell you a node is dead?`,`<p>Because in a distributed system you can't distinguish a dead node from a slow node from a slow or dropped network — you only know you didn't get a response, not why. A timeout is therefore a guess: too short and you'll wrongly declare healthy nodes dead (and maybe double-execute work); too long and you hang. This is why designs use explicit protocols — leases, quorums, idempotency, and consensus — rather than assuming "no response means dead." It's also why "exactly once" is so hard: the sender genuinely cannot know whether the receiver processed the message before going silent.</p>`);
IV(`Networking`,`Medium`,`What role does DNS play in a large system's architecture?`,`<p>DNS resolves hostnames to IP addresses and is the first layer of routing. Beyond basic lookup, it enables geo-routing (send users to the nearest region), coarse-grained failover (point away from a dead datacenter), and load distribution across regions. Paired with <strong>anycast</strong> — announcing one IP from many locations — it routes each user to the closest edge automatically. DNS changes propagate slowly (TTLs), so it's good for stable routing and disaster failover but not for fast, fine-grained load balancing, which happens at L4/L7 balancers closer to the servers.</p>`);
IV(`Estimation`,`Medium`,`Walk me through sizing a Twitter-like timeline system.`,`<p>Start from users and behavior. Say 200M DAU, each reading their timeline ~10×/day and posting ~2×/day. Reads = 200M × 10 / 10^5 = 20,000/s (peak ~60–100k); posts = 200M × 2 / 10^5 = 4,000/s. That read:write ratio (~5:1 on these actions, but far higher counting followers) says precompute timelines (fan-out on write) and cache heavily. Storage: 400M posts/day × ~300 bytes ≈ 120 GB/day of text (media separate in object storage). The fan-out math is the real driver — a celebrity with 100M followers would need 100M timeline writes per post, which is why you use a push/pull hybrid. The numbers directly dictate the architecture.</p>`);
IV(`Estimation`,`Easy`,`How much storage does 1 billion 1 KB records need, and what does that imply?`,`<p>1B × 1 KB = 1 TB of raw data, plus index and replication overhead — call it a few TB replicated 3×. That comfortably fits on a small cluster and even, uncompressed, on a single large machine's disk. The implication is important: this is <em>not</em> "big data," so you shouldn't reach for heavy sharding or exotic stores prematurely. A single well-provisioned database with replicas likely suffices, and you add sharding only when growth or throughput actually demands it. Estimation prevents over-engineering as much as under-engineering.</p>`);
</script>
<script>
IV(`Databases & storage`,`Medium`,`How would you scale a relational database that's hitting its limits?`,`<p>I'd go up a ladder, stopping as soon as the pain is relieved. First, <strong>optimize</strong>: add indexes, fix slow queries, tune the schema. Next, add <strong>caching</strong> in front for hot reads. Then add <strong>read replicas</strong> to multiply read capacity (accepting replication lag). If writes are the bottleneck, introduce <strong>queues</strong> to smooth spikes and batch. Only when a single primary genuinely can't hold the data or write load do I <strong>shard</strong> — partitioning by a key that matches the access pattern, using consistent hashing, and accepting the real complexity of cross-shard queries and rebalancing. Each rung adds complexity, so I climb only as far as needed.</p>`);
IV(`Databases & storage`,`Hard`,`Explain LSM-trees versus B-trees and when each wins.`,`<p><strong>B-trees</strong> store data in fixed pages updated <em>in place</em> in a balanced tree; they're read-optimized and predictable, the default in relational databases. <strong>LSM-trees</strong> append writes to an in-memory structure, flush to immutable sorted files, and merge/compact them in the background; because writes are sequential appends, they achieve very high write throughput — but reads may check several files (mitigated by Bloom filters) and compaction consumes I/O (read/space amplification). So B-trees win for read-heavy, update-in-place workloads; LSM-trees (Cassandra, RocksDB) win for write-heavy ingestion like time-series and event streams. Knowing which engine a database uses lets you predict its behavior.</p>`);
IV(`Databases & storage`,`Medium`,`When would you denormalize, and what's the cost?`,`<p>I denormalize when read performance matters more than write simplicity and the joins are expensive at scale — for example, precomputing a feed or embedding a user's display name alongside their posts to avoid a join on every read. The benefit is fast, single-lookup reads. The cost is duplicated data that you must keep in sync: when the source changes, every copy must be updated, which adds write-time complexity and a window of inconsistency. It's a classic trade-off — spend storage and write effort to buy read speed — and it's justified only when reads dominate and the join is a real bottleneck.</p>`);
IV(`Databases & storage`,`Medium`,`How do you store large files like images and videos?`,`<p>Not in the database. I put the bytes in <strong>object storage</strong> (S3/GCS) — cheap, near-infinite, durable — and store only the URL and metadata (owner, size, content type) in the database. Clients upload and download directly to object storage using <strong>pre-signed URLs</strong>, so the app servers never stream large payloads. For delivery, a <strong>CDN</strong> fronts the object storage to serve media from edges near users. This keeps the database small and fast, offloads bandwidth, and scales media independently. Putting blobs in the database bloats it, slows backups, and wastes its expensive transactional capabilities.</p>`);
IV(`Databases & storage`,`Hard`,`What isolation-level bugs have you seen, and how do you prevent them?`,`<p>The subtle ones appear under concurrency at weaker isolation levels. <strong>Lost updates</strong>: two read-modify-write cycles race and one silently overwrites the other — prevented with atomic updates (<code>UPDATE ... SET x = x + 1</code>), row locks, or higher isolation. <strong>Write skew</strong>: two transactions each read shared state and make individually-valid decisions that jointly break an invariant (the two-doctors-both-go-off-call example) — only serializable isolation prevents it. The practical defense is to know your database's default isolation level and which anomalies it permits (often weaker than assumed), use atomic conditional writes for contention, and reach for serializable isolation on the flows where correctness is critical.</p>`);
IV(`Databases & storage`,`Medium`,`How does database sharding complicate your application?`,`<p>Sharding splits data across machines, which relieves capacity but introduces several headaches. <strong>Cross-shard queries</strong> and joins become expensive or impossible, so you design access patterns to hit one shard. <strong>Transactions</strong> spanning shards need sagas or distributed protocols. <strong>Rebalancing</strong> when you add nodes moves data (minimized with consistent hashing). <strong>Hot shards</strong> can form if the shard key is skewed (the celebrity problem). And <strong>unique IDs</strong> can't rely on a single auto-increment, so you use Snowflake-style IDs. Because of all this, I shard as late as possible and pick a shard key that matches the dominant query pattern.</p>`);
IV(`Caching`,`Medium`,`How do you keep a cache consistent with the database?`,`<p>There's no perfect answer — cache invalidation is genuinely hard — so I pick a strategy per use case. <strong>TTL</strong>: accept brief staleness and let entries expire; simplest, good when slightly stale data is fine. <strong>Write-through</strong>: update the cache on every write, keeping it fresh at the cost of write latency. <strong>Explicit invalidation</strong>: delete/refresh the cache entry when the underlying data changes, often driven by change events (CDC). I usually combine a modest TTL with event-driven invalidation for hot data. The key is to decide consciously how much staleness the feature tolerates rather than assuming the cache is always correct.</p>`);
IV(`Caching`,`Hard`,`Design the caching strategy for a read-heavy product page under viral load.`,`<p>Layer caches from the edge inward. Serve static assets and the rendered page fragment from a <strong>CDN</strong> so most traffic never reaches the origin. Behind that, an application cache (Redis) holds the product data with a short TTL. To survive a viral spike, defend against the three hazards: prevent <strong>stampede</strong> when the hot key expires (per-key lock so one request rebuilds while others serve slightly-stale data, plus jittered TTLs); prevent <strong>penetration</strong> for missing IDs (negative caching); and relieve the <strong>hot key</strong> by replicating it across cache nodes or adding a local in-process cache. Finally, make the cache <em>fail-open</em> — if it's down, the origin still serves (perhaps degraded) rather than erroring.</p>`);
IV(`Caching`,`Easy`,`What is a Bloom filter and where would you use one?`,`<p>A Bloom filter is a tiny, probabilistic data structure that answers set membership with one useful asymmetry: it can say "definitely not present" or "possibly present," never a false negative. It uses far less memory than storing the full set. You use it as a cheap pre-check to skip expensive work: before hitting disk or a remote store, ask the Bloom filter — if it says "definitely not present," skip the lookup entirely. Real uses include preventing cache penetration (skip lookups for keys that can't exist), deduplicating URLs in a web crawler, and LSM-tree read paths (skip SSTables that can't contain a key).</p>`);
IV(`Consistency & CAP`,`Medium`,`A user posts a comment but doesn't see it after refreshing. What happened and how do you fix it?`,`<p>Almost certainly replication lag with read-your-writes violated: the write went to the leader, but the refresh read hit a follower replica that hadn't yet received the change, so the user's own comment appears missing. The fix is <strong>read-your-own-writes consistency</strong> — route a user's reads to the leader (or to a replica known to be caught up) for a short window after they write, or read their own recent writes from a cache you updated synchronously. More broadly, I'd name the exact guarantee the feature needs (read-your-writes here, monotonic reads elsewhere) rather than trying to make the whole system strongly consistent, which would cost latency everywhere for a problem localized to a user's own data.</p>`);
IV(`Consistency & CAP`,`Hard`,`What is linearizability and why is it expensive?`,`<p>Linearizability is the strongest single-object consistency guarantee: the system behaves as if there is exactly one copy of the data and every operation takes effect atomically at a single point between its start and finish. It makes a distributed system <em>appear</em> non-distributed, which is wonderful to reason about. It's expensive because guaranteeing it requires coordination — every operation must, in effect, agree on a single global order, which means cross-node communication (consensus or a leader) that adds latency, and during a network partition CAP says you must sacrifice availability to keep it. So you use linearizability only where you truly need it (locks, uniqueness, leader election) and accept weaker, cheaper guarantees elsewhere.</p>`);
IV(`Consistency & CAP`,`Medium`,`Explain the outbox pattern and the bug it prevents.`,`<p>The bug is the <strong>dual-write problem</strong>: a service updates its database and then, as a separate step, publishes an event (to Kafka, say). If the process crashes between the two, you get an inconsistency — the data changed but no event fired, or vice versa. The <strong>outbox pattern</strong> fixes it by writing the state change and the outgoing event into the same database in one local transaction (the event goes into an "outbox" table). Because it's one transaction, both commit or neither does. A separate relay process then reads the outbox and reliably publishes the events. It converts an unsafe distributed dual-write into a safe local transaction plus reliable delivery.</p>`);
</script>

IV(`Architecture`,`Medium`,`When should you NOT use microservices?`,`<p>When you don't have the problem they solve. Microservices exist to give <em>independent deployability and team autonomy</em>, so if a single small team owns the whole product, they add cost with no benefit — network latency, distributed debugging, per-service CI/CD, service discovery, and distributed tracing you now must build and operate. You also shouldn't split when requirements are still fluid (boundaries will be wrong), when your operational maturity can't support it, or when the codebase is small. The default for a new system is a <strong>modular monolith</strong>: strict internal boundaries that preserve the option to extract services later, once you feel a specific, concrete pain like teams blocking each other.</p>`);
IV(`Architecture`,`Hard`,`How do you decompose a monolith into services safely?`,`<p>Incrementally, never a big-bang rewrite ("the only thing a big-bang rewrite guarantees is a big bang"). I use the <strong>strangler fig</strong> pattern: put a façade/proxy in front of the monolith, then peel off one bounded context at a time into a new service, routing that slice of traffic to it while the rest stays in the monolith, until the old system withers. The genuinely hard part is <strong>splitting the database</strong> — I move from shared tables to separate schemas to separate databases in steps, breaking foreign keys and replacing cross-module transactions with sagas. At every step the system fully works, so I can pause, measure, or reverse. I'd only start once teams and CI/CD maturity actually support independent deployment.</p>`);
IV(`Architecture`,`Medium`,`Orchestration vs. choreography — how do you choose?`,`<p>Both coordinate a multi-service workflow. <strong>Orchestration</strong> uses a central coordinator that explicitly directs each step; the flow is visible and easy to debug and change, but the orchestrator is a coupling point and can become a bottleneck. <strong>Choreography</strong> has each service react to events and emit its own, with no central brain; it's maximally decoupled and resilient, but the overall workflow lives nowhere explicit and is harder to trace. I lean orchestration for complex, business-critical flows I need to see and control (like a payment saga), and choreography for loose, evolving reactions where decoupling matters more than visibility. Many systems mix both.</p>`);
IV(`Architecture`,`Medium`,`What is a distributed monolith and how do you avoid building one?`,`<p>A distributed monolith is the worst-of-both-worlds anti-pattern: you've split into services, but they're so coupled that they must be deployed together — via a shared database, chatty synchronous call chains, or lockstep releases. You pay all the costs of distribution (network calls, partial failure, operational overhead) and get none of the benefit (independent deployability). You avoid it by making <strong>independent deployability the litmus test</strong>: each service owns its data (no shared database), communicates through stable interfaces or events, prefers async where possible, and can be deployed alone. Contract testing lets services verify compatibility without integration-testing the whole system, which is what keeps deployments independent.</p>`);
IV(`Architecture`,`Hard`,`When is event sourcing worth its complexity?`,`<p>Event sourcing stores the full sequence of events as the source of truth and derives current state by replaying them. It's worth the significant complexity when you need a complete, immutable <strong>audit trail</strong> (finance, healthcare, anything regulated), when you need <strong>temporal queries</strong> ("what did this look like last Tuesday?"), when you want to <strong>rebuild</strong> or add new read models by replaying history, or when the business naturally thinks in events. The costs are real: eventual consistency, schema evolution of old events, snapshotting to avoid replaying millions of events, and a steeper mental model. For ordinary CRUD it's over-engineering — I'd use it only when the audit/replay/temporal benefits clearly justify it.</p>`);
IV(`Messaging & events`,`Medium`,`How do you handle a message that keeps failing to process?`,`<p>First, make processing <strong>idempotent</strong> so retries are safe. Then retry with <strong>exponential backoff</strong> for transient failures (a brief downstream outage). If a message still fails after N attempts, it's likely a "poison" message (malformed, references deleted data), so route it to a <strong>dead-letter queue</strong> rather than letting it block the pipeline or retry forever. The DLQ lets you inspect, fix, and replay it later, and alert on its depth. The principle is to separate transient failures (retry) from permanent ones (quarantine), so one bad message doesn't stall healthy traffic or amplify load with infinite retries.</p>`);
IV(`Messaging & events`,`Hard`,`How do you achieve "effectively once" processing?`,`<p>True exactly-once across failures is effectively impossible — a consumer can crash after processing but before acknowledging, forcing redelivery. So you build <strong>effectively-once</strong> from two pieces: <strong>at-least-once delivery</strong> (never lose a message) plus <strong>idempotent consumers</strong> (processing a duplicate has no extra effect). Idempotency is usually keyed on a unique message/operation ID that the consumer records; if it sees that ID again, it skips or returns the prior result. For end-to-end correctness you push the idempotency key all the way to the final effect (e.g., the payment), so even if the whole chain retries, the money moves once. The lesson: don't chase exactly-once delivery; make effects idempotent.</p>`);
IV(`Software design`,`Medium`,`How do you decide whether to split a function or class?`,`<p>Use concrete signals rather than a line-count rule. <strong>Signs a split will help:</strong></p><ul><li>You can give the extracted piece a <strong>precise name</strong> that says what it does — <code>calculateShippingCost</code>, not <code>helper2</code>.</li><li>The code mixes <strong>levels of abstraction</strong> — business rules next to string formatting next to SQL.</li><li>It has <strong>more than one reason to change</strong> (tax rules and report layout in the same class).</li><li>Part of it is <strong>hard to test</strong> in isolation, or the same logic is <strong>copied</strong> in several places.</li></ul><p><strong>Signs a split will hurt:</strong></p><ul><li>The new piece needs <strong>five or six parameters</strong> threaded through — the pieces are really one idea.</li><li>You can only name it vaguely (<code>processPart2</code>, <code>doStuff</code>).</li><li>The new function or class would be a <strong>pass-through</strong> that just forwards calls — interface cost with nothing hidden.</li><li>Readers would have to <strong>jump between files</strong> to follow one short, linear flow.</li></ul><p>A handy final test: after the split, can someone understand the <em>caller</em> without opening the <em>callee</em>? If yes, the name and interface are doing their job. If they must read both to understand either, you have added indirection, not clarity.</p>`);
IV(`Software design`,`Medium`,`What's the difference between coupling and cohesion?`,`<p><strong>Coupling</strong> is how much modules depend on each other; you want it <em>loose</em>, so a change in one doesn't ripple into others. <strong>Cohesion</strong> is how well the things inside a module belong together; you want it <em>high</em>, so a module has one clear purpose. The two goals reinforce each other: putting related things together (high cohesion) naturally reduces the connections between modules (loose coupling). Bad designs are the inverse — low cohesion (a "utils" grab-bag) and tight coupling (everything reaches into everything). Most design principles, from SRP to bounded contexts to microservice boundaries, are ultimately about maximizing cohesion and minimizing coupling at different scales.</p>`);
IV(`Software design`,`Hard`,`Explain "define errors out of existence" with an example.`,`<p>It's Ousterhout's idea that the best way to handle an exception is to design so it can't occur, rather than writing more handlers — because every exception a caller must handle is interface complexity multiplied across all callers. His example: a <code>substring</code> method that throws on out-of-range indices forces every caller to bounds-check or wrap in try/catch. Instead, define <code>substring</code> to simply <em>clamp</em> to valid bounds and return whatever overlaps — now no exception exists and no caller code is needed. Other techniques are masking the error inside the module or aggregating many special cases into one general case. The lesson: exception handling is a major source of complexity, and much of it can be removed by better interface design rather than more handlers.</p>`);
</script>

IV(`API design`,`Medium`,`What makes a good error response?`,`<p>It's part of the API and deserves design. I return the correct HTTP status code for the class of error (400 vs. 401 vs. 403 vs. 409 vs. 429 vs. 500) plus a <strong>structured body</strong> with a <em>stable, machine-readable</em> <code>code</code> (so clients branch on it without string-matching my prose), a human-readable <code>message</code>, optional <code>details</code>, and a <code>request_id</code> that ties the response to the exact request in my logs. I never leak stack traces, SQL, or internal hostnames — that's both confusing and a security risk. Consistent, stable error contracts let clients handle failures programmatically and let me reword messages without breaking anyone.</p>`);
IV(`API design`,`Easy`,`REST vs. GraphQL — what problem does GraphQL solve?`,`<p>GraphQL solves over- and under-fetching when many different clients need different slices of the same data. With REST, you either build many bespoke endpoints or send fixed-shape responses that force clients to make extra calls or discard unused fields. GraphQL exposes one endpoint and a typed schema, and each client asks for exactly the fields it wants in a single query — great for a BFF serving mobile and web with different needs. The costs are real: caching is harder (mostly POSTs to one URL), and naive queries can be expensive (the N+1 problem, unbounded nesting), so you add query cost limits and dataloaders. REST remains simpler and more cacheable for public, uniform APIs.</p>`);
IV(`Security`,`Medium`,`How would you secure a REST API?`,`<p>Layered controls. <strong>Authentication</strong> via short-lived tokens (OAuth2/OIDC or signed JWTs with refresh tokens) over TLS. <strong>Authorization</strong> enforced server-side on every request at the object level — checking the caller owns the specific resource, not just that they're logged in (to prevent IDOR). <strong>Input validation</strong> at the boundary and parameterized queries to stop injection. <strong>Rate limiting</strong> and quotas so one client can't degrade the service. <strong>TLS everywhere</strong>, secrets in a vault, least-privilege service accounts, and dependency scanning. Plus good hygiene: no sensitive data in URLs or logs, structured error responses that don't leak internals, and monitoring for anomalies. Security is defense in depth, not one control.</p>`);
IV(`Security`,`Hard`,`How do you design a system to comply with "right to be forgotten"?`,`<p>The hard part is that deletion must reach <em>all</em> copies of a user's data, which tend to sprawl. I'd design for it early: maintain a <strong>data inventory</strong> mapping where PII lives (which services, tables, caches, search indexes, logs, backups, analytics). On a deletion request, I orchestrate deletion across all of them — often via an event ("user deleted") that each service subscribes to and acts on — and handle the tricky cases: logs and backups (retention policies, or crypto-shredding by deleting the user's encryption key so their data becomes unrecoverable), and analytics (anonymize rather than break aggregates). I'd also minimize PII collection and centralize it where possible, because scattered PII is what makes deletion, and breaches, so costly. (General guidance — involve legal for actual compliance.)</p>`);
IV(`Security`,`Medium`,`What is the principle of least privilege and how do you apply it?`,`<p>Least privilege means every user, service, and credential gets the minimum access needed to do its job — nothing more — so a compromise has a small blast radius. I apply it everywhere: a reporting service gets read-only database credentials; a service that only writes to one queue can't read others; human roles (RBAC) grant only the permissions a role needs; cloud IAM policies are scoped narrowly rather than "admin"; and secrets are per-service and rotated. The mindset is to assume any given credential <em>will</em> eventually leak, and design so that when it does, the attacker can do limited damage rather than owning the whole system.</p>`);
IV(`Observability & reliability`,`Hard`,`Design SLOs and an error budget for a checkout service.`,`<p>I'd define a couple of <strong>SLIs</strong> that reflect user experience: the fraction of checkout requests that succeed, and the fraction served under, say, 500 ms. I'd set <strong>SLOs</strong> like "99.9% success and 99% under 500 ms over a rolling 28 days," chosen from what the business actually needs, not reflexively chasing more nines (each costs exponentially more). The 0.1% allowed failure is the <strong>error budget</strong>. I'd alert on <em>burn rate</em> — consuming the budget fast enough to breach the SLO — rather than on every blip, which keeps alerts meaningful. And I'd use the budget as a policy lever: within budget, ship features quickly; if we blow it, freeze feature work and invest in reliability until we're back in bounds. That aligns product and reliability around one number.</p>`);
IV(`Observability & reliability`,`Medium`,`What makes a good on-call and incident process?`,`<p>Sustainable on-call means a rotation large enough that nobody burns out, a low enough page volume that pages stay meaningful (achieved by symptom-based, SLO-tied alerting), good runbooks so responders aren't reverse-engineering the system at 3 a.m., and clear escalation. During an incident: declare it, assign an <strong>incident commander</strong> to coordinate (rather than everyone debugging in parallel), <strong>mitigate first</strong> (roll back, fail over, shed load) to unblock users, communicate status, and only then diagnose root cause. Afterward, a <strong>blameless postmortem</strong> focuses on systemic causes and produces tracked action items — because a system that lets one human mistake cause an outage needs guardrails, not blame. Painful on-call is itself a signal to invest in reliability.</p>`);
IV(`Deployment`,`Medium`,`How do you deploy with zero downtime?`,`<p>Combine a safe rollout strategy with backward-compatible changes. I use <strong>rolling</strong>, <strong>blue-green</strong>, or <strong>canary</strong> deployments so there's no downtime and fast rollback — canary especially, releasing to a small traffic fraction first while watching the golden signals, then widening. Because old and new versions run simultaneously during any rollout, every change must be <strong>backward-compatible</strong>: schema changes go through expand/contract (add new alongside old, migrate, then remove old), and API/event changes are additive. I decouple deploy from release with <strong>feature flags</strong>, so I can ship code dark and turn it on gradually — or kill it instantly without a redeploy. And I make sure rollback is fast and rehearsed, since fast recovery beats trying to prevent every failure.</p>`);
IV(`Deployment`,`Medium`,`Why are frequent small deployments safer than big releases?`,`<p>It's counterintuitive but well-supported: teams that deploy more often are also more stable. A big release bundles dozens of changes, so when something breaks you're hunting the culprit in a haystack and the rollback reverts everything. A small deploy contains one or a few changes, so the culprit is obvious and the rollback is trivial and targeted. Small changes are also easier to review and test, have a smaller blast radius, and keep the deployment pipeline well-practiced rather than a rare, scary event. This is why the DORA metrics (deployment frequency, lead time, change failure rate, time to restore) show speed and stability rising together — good automation makes both possible at once.</p>`);
</script>

IV(`System design`,`Medium`,`Design a chat/messaging app like WhatsApp.`,`<p><strong>Scope:</strong> 1:1 and group messaging, delivery/read receipts, presence, offline delivery. <strong>Shape:</strong> a stateful real-time tier. Clients hold <strong>WebSocket</strong> connections to gateway servers; a <strong>session registry</strong> maps each user to the gateway holding their connection, so a message for user B routes to B's gateway and is pushed down. Messages persist to a <strong>wide-column store</strong> (write-heavy) partitioned by conversation. <strong>Deep dives:</strong> offline delivery (queue messages until the user reconnects), group fan-out (deliver to each member's connection), presence and typing indicators (ephemeral, broadcast, never persisted), and end-to-end ordering per conversation. Failure: a dead gateway triggers client reconnection to a new one, which rehydrates state.</p>`);
IV(`System design`,`Hard`,`Design a distributed job scheduler (cron at scale).`,`<p><strong>Requirements:</strong> one-off, delayed, and recurring jobs; run each on time exactly the intended number of times across a fleet; HA. <strong>Design:</strong> a durable job store indexed on <code>next_run_at</code>; dispatchers poll for due jobs and <strong>atomically claim</strong> each (<code>UPDATE ... SET status='CLAIMED' WHERE status='READY'</code>) so two dispatchers never run the same job, then enqueue to workers. <strong>Deep dives:</strong> claims carry a <strong>lease</strong> so a dead worker's job is reclaimed (at-least-once → tasks must be idempotent); HA via leader election or sharding the job space so there's no SPOF and no double-firing; recurring jobs reschedule on completion; massive delayed loads use timing-wheel/bucketed queues; and don't trust worker wall-clocks — the store is the source of truth for time.</p>`);
IV(`System design`,`Hard`,`Design Google Docs-style collaborative editing.`,`<p><strong>Shape:</strong> multiple users mutating shared text in real time without clobbering each other, with strong <em>eventual</em> convergence. Two approaches: <strong>Operational Transformation</strong> (transform concurrent ops against each other; needs a central server) or <strong>CRDTs</strong> (design ops to commute so replicas merge without coordination; great for offline/P2P, heavier per element). One server "owns" each document for ordering; an append-only <strong>op log</strong> gives durability and history (undo = applying inverse ops), and periodic <strong>snapshots</strong> avoid replaying millions of ops on load. <strong>Deep dives:</strong> presence/cursors (ephemeral, broadcast), offline edits merged on reconnect (CRDTs shine here), and scaling a viral doc by separating few editors from many read-only viewers.</p>`);
IV(`System design`,`Medium`,`Design a typeahead / search autocomplete.`,`<p><strong>Crux:</strong> return top-k completions for a prefix in under ~100 ms at high QPS. You can't query the database per keystroke, so <strong>precompute</strong>: build a trie (or a prefix → top-k table) offline from query logs, and cache hot prefixes in memory. Rankings update in the <strong>background</strong> (batch/stream) from usage, not per request. <strong>Properties:</strong> extremely read-heavy, eventual consistency is fine (a slightly stale ranking is invisible). <strong>Deep dives:</strong> trie storage and sharding by prefix, serving latency (in-memory, edge-cached), personalization vs. global rankings, and handling misspellings. The pattern mirrors feed precompute (push) and CDN edge caching.</p>`);
IV(`System design`,`Hard`,`Design a payment system that never double-charges.`,`<p><strong>Correctness is everything.</strong> Every charge carries a client-generated <strong>idempotency key</strong>; the payment service records the key with the result of the first attempt and returns it on any retry, so network retries can't double-charge. The multi-step flow (authorize → capture → record) is a <strong>saga</strong> with compensations (refund/void on failure). I keep a strongly-consistent <strong>ledger</strong> (double-entry) as the source of truth, use <strong>reconciliation</strong> jobs to compare against the payment provider and catch discrepancies, and design for at-least-once processing with idempotent effects end-to-end so "effectively once" money movement holds even if the whole chain retries. <strong>Deep dives:</strong> idempotency storage/TTL, exactly-once semantics via dedup, and handling provider timeouts (unknown state → query, never blindly retry).</p>`);
IV(`System design`,`Medium`,`Design a notification service (push/SMS/email) at scale.`,`<p><strong>Shape:</strong> one platform, many channels, huge fan-out, unreliable third-party providers. A pipeline: ingest → <strong>dedup</strong> (idempotency key) → load user prefs and <strong>filter</strong> opt-outs/quiet-hours (cheap and legally required) → render templates → route to per-channel queues → channel workers → <strong>provider adapters</strong>. Each provider sits behind a common <strong>Adapter</strong> interface with a <strong>circuit breaker</strong> for failover (SES ↔ SendGrid). <strong>Priority lanes</strong> (bulkheads) keep a password reset from queuing behind a 10M-message marketing blast. Campaign fan-out produces in batches into Kafka partitioned by user. Deep-dive provider rate limits, retries with backoff, and dead-letter handling.</p>`);
IV(`System design`,`Medium`,`Design a web crawler at search-engine scale.`,`<p><strong>Shape:</strong> a massive, polite, never-ending pipeline. The heart is the <strong>URL frontier</strong> — a priority queue that also enforces <strong>politeness</strong> (respect robots.txt and per-host crawl-delay), organized so each host drains at its own rate. Dedup at scale uses a <strong>Bloom filter</strong> in RAM backing an authoritative store, plus content hashing to skip identical pages. Partition the frontier <strong>by host</strong> across nodes, which also enforces politeness (one node per host = one gatekeeper). Fetchers are idempotent so the crawl resumes after crashes. <strong>Deep dives:</strong> freshness/recrawl scheduling by change frequency, spider-trap defenses (depth/size limits), and distributed coordination.</p>`);
IV(`System design`,`Hard`,`Design a "find nearby" proximity service (restaurants/drivers).`,`<p><strong>Crux:</strong> geospatial indexing — raw lat/long comparisons don't scale. Use grid cells (<strong>geohash / S2 / H3</strong>): store entities keyed by cell, and answer "near me" by querying the user's cell plus its neighbors. For live positions (drivers), keep them in an in-memory grid with a <strong>TTL</strong> so stale positions expire, sharded by region. <strong>Deep dives:</strong> cell-size trade-off (too big → many candidates to filter; too small → many neighbor cells to scan), edge-of-cell handling (query neighbors), ranking results by true distance after the coarse cell filter, and separating ephemeral position data (in-memory, lossy) from durable business data (trips, in a database).</p>`);
IV(`System design`,`Medium`,`Design YouTube (upload and playback).`,`<p>Two independent paths. <strong>Upload/transcode</strong> is an async pipeline: the raw upload lands in <strong>object storage</strong>, a queue triggers parallel workers that transcode into multiple resolutions and formats for adaptive bitrate. <strong>Playback</strong> is almost entirely <strong>CDN</strong> — video chunks served from edges near viewers; the app serves only metadata and manifests, never the bytes. Metadata (title, views, comments) lives in databases; the view counter is eventually consistent (approximate is fine). <strong>Deep dives:</strong> adaptive bitrate streaming, thumbnail generation, the transcoding pipeline's parallelism and retries, and recommendations (a separate ML system). What breaks at 10×: transcoding compute (scale workers) and CDN egress (scale the CDN).</p>`);
IV(`System design`,`Hard`,`Design a metrics monitoring and alerting system.`,`<p><strong>Shape:</strong> ingest an enormous stream of timestamped points (100k servers × 500 metrics / 10s ≈ 5M points/s), store them cheaply, and query/alert fast. <strong>Ingest:</strong> agents push to a scalable pipeline (Kafka) into a <strong>time-series database</strong> with columnar/compressed storage. <strong>Downsample</strong> aggressively — keep raw data short-term, rolled-up aggregates long-term — because you can't store 500 billion points/day at full resolution forever. <strong>Query/alert:</strong> a rules engine evaluates alert conditions on burn rate/thresholds and notifies via a deduplicating, escalating notification path. <strong>Deep dives:</strong> cardinality explosions from high-dimensional labels, rollup strategy, and alerting on symptoms tied to SLOs rather than noisy causes.</p>`);
</script>

IV(`Software design`,`Easy`,`When would you use the Strategy pattern?`,`<p>When you have a family of interchangeable algorithms selected at runtime — and especially when you find an <code>if/else</code> or <code>switch</code> chain branching on a type (payment method, shipping rule, file format). Strategy encapsulates each variant behind a common interface, and the caller holds whichever one applies. The payoff is Open/Closed: adding a new variant means adding a class, not editing tested code. In languages with first-class functions, a Strategy is often just a function you pass in — recognizing that keeps you from over-engineering a simple case.</p>`);
IV(`Software design`,`Medium`,`What is "patternitis" and how do you avoid it?`,`<p>Patternitis is forcing design patterns where a simpler solution would do — wrapping trivial code in factories and strategies that add indirection without solving a real problem, producing code more complex than the task. You avoid it by remembering that patterns are <em>tools and vocabulary, not achievements</em>: you get no points for using one. Reach for a pattern only when the problem it addresses is actually present — when something genuinely varies, or coupling is actually causing pain. If a plain function or a simple conditional is clearer, use that. Ousterhout's lens helps: needless patterns create shallow modules that increase complexity.</p>`);
IV(`Software design`,`Hard`,`How do you approach refactoring a large, messy, untested codebase?`,`<p>Carefully and incrementally. First, I get a <strong>safety net</strong>: since refactoring means changing structure without changing behavior, I need tests to verify behavior is unchanged. For untested legacy code, I use Feathers' techniques — find "seams," add characterization tests that capture current behavior, then refactor. I work in <strong>small, behavior-preserving steps</strong>, running tests after each, never more than a minute from green. I prefer <strong>preparatory refactoring</strong> ("make the change easy, then make the easy change") woven into feature work, rather than a big risky "refactoring project." And I let <strong>code smells</strong> (long functions, duplication, feature envy) tell me where to focus, prioritizing the areas I actually need to change.</p>`);
IV(`Software design`,`Medium`,`What's the difference between an entity and a value object in DDD?`,`<p>An <strong>entity</strong> is defined by a continuous <em>identity</em> that persists through changes — a Customer is the same customer even after changing name and address, so it needs a unique ID. A <strong>value object</strong> is defined entirely by its <em>attributes</em>, has no identity, and is ideally immutable — a Money(19.99, USD) or a DateRange is interchangeable with any other having the same values. Using value objects instead of bare primitives is one of the most practical, underused ideas in DDD: it cures "Primitive Obsession," makes concepts explicit and self-validating (rules enforced in the constructor), and keeps them safe to share. Use an entity when individual continuity over time matters; a value object when only the value matters.</p>`);
IV(`Software design`,`Hard`,`Explain aggregates and why they define transactional boundaries.`,`<p>An <strong>aggregate</strong> is a cluster of related objects treated as a single unit for data changes, accessed only through one entry point — the <strong>aggregate root</strong> — which enforces the cluster's invariants. For example, an Order aggregate owns its line items; you never modify a line directly, only through the Order, which can enforce "total must equal the sum of lines." The governing rule is "one transaction modifies one aggregate," which means aggregate boundaries <em>are</em> your consistency boundaries — and, scaled up, they guide transactional, API, and even microservice boundaries. Getting them right (small enough to be efficient, large enough to enforce real invariants) is a subtle, high-value DDD skill.</p>`);
IV(`Software design`,`Medium`,`What is the Dependency Rule in Clean Architecture?`,`<p>Source-code dependencies must point only <em>inward</em>, toward higher-level policy. The concentric circles go Entities (enterprise rules) ← Use Cases (application rules) ← Interface Adapters (controllers, presenters, gateways) ← Frameworks & Drivers (web, DB, UI). Inner circles know nothing about outer ones — the business core never mentions the web framework or database. The mechanism is <strong>dependency inversion</strong>: the core defines interfaces (ports) that outer layers implement, so dependencies point inward even though control flows outward at runtime. The payoff is that "the database is a detail" you can swap, and you can unit-test all business logic with in-memory stand-ins — no web server, no database.</p>`);
IV(`Software design`,`Medium`,`What does "favor composition over inheritance" mean and why?`,`<p>Inheritance is white-box reuse: a subclass depends on its parent's internals, and deep hierarchies become rigid and fragile — a change high in the tree ripples unpredictably, and the structure is fixed at compile time. Composition is black-box reuse: you assemble behavior by holding references to other objects and delegating to them through their interfaces, which you can change at runtime and keep each class focused. So for varying behavior, prefer composing interchangeable parts (Strategy, Decorator) over subclassing. Inheritance is still fine for genuine "is-a" relationships with stable hierarchies, but composition is the more flexible default — one of the two GoF meta-principles.</p>`);
IV(`Software design`,`Medium`,`What is a bounded context and how does it relate to microservices?`,`<p>A bounded context is an explicit boundary within which a particular domain model and its <strong>ubiquitous language</strong> are internally consistent. The key insight is that the same word means different things in different areas — "Product" to Catalog (name, images) differs from Inventory (SKU, stock) and Shipping (weight, dimensions) — so rather than force a monstrous shared model, you draw boundaries and let each context have its own consistent model. Two decades later this became the standard tool for locating <strong>microservice boundaries</strong>: you find your bounded contexts, and those are your service seams. Cutting along business capabilities (contexts) rather than technical layers is what keeps services cohesive and independently deployable.</p>`);
IV(`Software design`,`Easy`,`What is the Decorator pattern good for?`,`<p>Adding responsibilities to an object dynamically by wrapping it in another object that implements the same interface and adds behavior before or after delegating — a flexible alternative to subclassing. The classic example is stacking capabilities: <code>new CachingRepo(new LoggingRepo(new SqlRepo()))</code> adds caching and logging transparently without modifying <code>SqlRepo</code> or creating a combinatorial explosion of subclasses. You'll recognize it everywhere — wrapping an HTTP client with retries, a stream with compression and encryption. It's "favor composition over inheritance" made concrete: build up behavior from wrappers rather than a rigid class hierarchy.</p>`);
</script>
<script>
IV(`ML systems`,`Medium`,`Walk through designing a recommendation system.`,`<p>Frame it as ML first: what are we predicting (likelihood of engagement), what's the label (click/purchase), what business metric matters (engagement vs. revenue vs. diversity)? Then two planes: <strong>offline training</strong> (data → features → train → evaluate → registry) and <strong>online serving</strong> (fetch features + candidate items → rank → return top-k, cached). Use a <strong>feature store</strong> to avoid training/serving skew. The standard structure is <strong>candidate generation then ranking</strong>: cheaply retrieve a few hundred candidates (embeddings/nearest-neighbor, co-occurrence), then rank them precisely with a heavier model. Deep-dive serving latency, the retrieval index, cold-start for new users/items, and — the step beginners skip — drift monitoring plus a retraining pipeline.</p>`);
IV(`ML systems`,`Medium`,`How do you monitor an ML system in production?`,`<p>Beyond the usual golden signals (latency, errors, saturation of the inference service), ML needs <strong>model-quality monitoring</strong>, because a model degrades on its own as the world changes. I track the distribution of <strong>inputs/features</strong> (to catch data drift early, before quality visibly drops), the distribution of <strong>predictions</strong> (a sudden shift is a red flag), and — where ground truth arrives (did the user click? was it actually fraud?) — live <strong>accuracy</strong> metrics. When drift or degradation appears, the response is usually retraining on fresh data, which is why many systems have automated retraining triggered on a schedule or by drift detection. Designing "how does this stay good in six months?" in from the start is what separates a real ML system from a demo.</p>`);
IV(`ML systems`,`Medium`,`How do you safely roll out a new model version?`,`<p>The same way you roll out code, plus ML-specific checks. I version model artifacts in a <strong>registry</strong> so I can roll back instantly. Before full rollout I run the new model as a <strong>shadow</strong> — making predictions on live traffic without acting on them — to compare against the current model safely. Then I <strong>canary</strong> it to a small fraction of real traffic while watching both system metrics (latency, errors) and model-quality metrics, widening only if it holds. If quality regresses, I roll back via the registry. This treats a bad model as a production incident (because it is) and avoids the trap of shipping a model that looked great offline but fails on live data.</p>`);
IV(`ML systems`,`Medium`,`Why separate the training and serving planes?`,`<p>Because they have opposite requirements. <strong>Training</strong> is a batch, throughput-oriented, latency-tolerant workload — it consumes huge historical datasets, runs heavy computation, and a run taking hours is fine. <strong>Serving</strong> (inference) is latency-sensitive and availability-critical — it must return a prediction for a single live request in tens of milliseconds at high QPS with the reliability of any user-facing service. Optimizing one for the other's goals is wasteful or impossible, so they're built and scaled independently (serving is stateless replicas behind a load balancer with caching and batching; training is a data pipeline). Much of ML system design is connecting them correctly — above all, ensuring the features match via a feature store.</p>`);
IV(`ML systems`,`Easy`,`What are embeddings and vector search?`,`<p>An <strong>embedding</strong> is a vector (a list of numbers) representing a piece of data — text, an image, a user — such that similar items land near each other in the vector space. <strong>Vector search</strong> finds the nearest neighbors to a query vector, i.e., the most similar items. Together they power semantic similarity: instead of exact keyword matching, you embed the query and retrieve items whose embeddings are closest. This is the backbone of RAG (retrieve relevant document chunks), recommendations (items similar to what you liked), and semantic search. The engineering challenge is efficient approximate-nearest-neighbor search over millions of high-dimensional vectors, handled by specialized vector indexes/databases.</p>`);
IV(`ML systems`,`Medium`,`What's genuinely different about serving an LLM feature vs. a classic classifier?`,`<p>Several things. <strong>Latency and streaming:</strong> generation is slow and token-by-token, so responses are streamed (SSE/WebSockets) rather than returned at once. <strong>Cost:</strong> inference on large models with long contexts is expensive per call, making caching and prompt-size discipline real design levers. <strong>Non-determinism and evaluation:</strong> the same input can yield different outputs and "correct" is fuzzy, so you evaluate with eval sets, LLM-as-judge, and A/B tests rather than one accuracy number. <strong>New failure modes:</strong> hallucination and prompt injection require guardrails (grounding via RAG, input/output filtering, human-in-the-loop for high-stakes actions). But structurally it's still a retrieval + serving + streaming + caching + evaluation system — familiar pieces with a model API as one component.</p>`);
IV(`Behavioral & process`,`Medium`,`How do you write a design doc and diagram a system so others actually understand it?`,`<p>A good design doc is written for the reader who has to review, build, or operate the system — not as a record of your thinking. A structure that works almost everywhere: <strong>context</strong> (what problem, why now), <strong>goals and explicit non-goals</strong> (non-goals prevent endless scope debates), the <strong>proposal</strong>, <strong>alternatives considered</strong> and why they lost, <strong>risks and open questions</strong>, and the <strong>rollout and rollback plan</strong>. Keep it short enough to be read before the meeting.</p><p>For diagrams, use the <strong>C4 model</strong> and pick the level for the audience: a <em>context</em> diagram (the system as one box among users and other systems) for executives and new joiners; a <em>container</em> diagram (services, databases, queues) for most engineering reviews; <em>component</em> detail only where a reviewer needs it. The most common failure is one enormous diagram that tries to show everything and communicates nothing.</p><p>Then make it a conversation: circulate it early, invite disagreement in writing, and record the final choice and its trade-offs briefly (an ADR) so the <em>why</em> survives after the meeting. Docs that are never read back decay — link them from the code or runbook they describe.</p>`);
</script>

IV(`Scaling & distribution`,`Medium`,`How does a CDN work and what belongs on it?`,`<p>A CDN is a network of edge servers geographically close to users that cache and serve content, so requests are answered nearby instead of from a distant origin. It cuts latency, absorbs huge traffic, and shields your origin. What belongs on it: static assets (images, JS, CSS), media (video chunks), and read-heavy responses that tolerate some staleness. You control freshness with cache-control headers and invalidation. What doesn't belong: per-user, write-heavy, or strongly-consistent data. For video especially, the CDN is the whole story — no origin could serve terabits per second of egress.</p>`);
IV(`Scaling & distribution`,`Hard`,`How would you handle a sudden 10× traffic spike?`,`<p>Layered defenses. <strong>Absorb</strong> what you can at the edge (CDN, cached responses) so most traffic never reaches origin. <strong>Shed load</strong> gracefully — rate limit and reject excess early rather than letting everything degrade, and prefer serving stale-but-available over erroring. <strong>Queue</strong> non-urgent work asynchronously so bursts don't overwhelm synchronous paths. <strong>Autoscale</strong> stateless tiers, knowing there's ramp-up lag. For anticipated spikes (a launch, a flash sale), add a <strong>virtual waiting room</strong> to admit users at a sustainable rate. And ensure the database — usually the real bottleneck — is protected by caches and can't be stampeded. The theme: protect the scarce resource and fail gracefully rather than catastrophically.</p>`);
IV(`Scaling & distribution`,`Medium`,`Explain the read replica pattern and its limitations.`,`<p>You designate one database as the leader for writes and add follower replicas that receive a stream of changes and serve reads, multiplying read capacity — great for read-heavy workloads. The main limitation is <strong>replication lag</strong>: followers are slightly behind, so replica reads can be stale, which breaks read-your-own-writes unless you route a user's recent reads to the leader. Replicas also don't help write throughput (all writes still hit the leader) — for that you need sharding. And they add operational complexity (failover, promoting a replica if the leader dies). So replicas are the right first step for scaling reads, but not a solution for write scaling or for data that must be perfectly fresh.</p>`);
IV(`Databases & storage`,`Medium`,`What is CDC (change data capture) and when is it useful?`,`<p>CDC streams a database's changes (inserts/updates/deletes) as a sequence of events, usually by tailing its transaction log. It's useful whenever other systems need to stay in sync with a database without dual-writes: keeping a <strong>search index</strong> (Elasticsearch) or <strong>cache</strong> updated, feeding a <strong>data warehouse</strong> for analytics, or driving event-driven workflows off database changes. It's the reliable alternative to having application code write to the DB and separately publish events (which risks the dual-write bug). Conceptually it turns your database into a source of an event stream, which is the foundation of Kleppmann's "unbundled database" — a log of changes with derived, rebuildable views.</p>`);
IV(`Consistency & CAP`,`Medium`,`Explain quorum reads and writes in a leaderless system.`,`<p>In leaderless (Dynamo-style) replication, there's no single leader; the client writes to and reads from multiple replicas. With N replicas, a write is sent to and acknowledged by W of them, and a read queries R of them. If you configure <strong>W + R &gt; N</strong>, the write set and read set are guaranteed to overlap in at least one replica, so a read sees the latest acknowledged write — giving strong-ish consistency while tolerating some node failures. Tuning W and R trades consistency, latency, and availability: high W/R is more consistent but slower and less available; low values are faster but riskier. Conflicts from concurrent writes are resolved with version vectors or last-write-wins (which can lose data).</p>`);
IV(`Architecture`,`Medium`,`What is CQRS and when is it worth it?`,`<p>CQRS (Command Query Responsibility Segregation) uses separate models for writes and reads: a rich domain model handles commands, while one or more denormalized, read-optimized views serve queries, kept in sync asynchronously (often via events). It's worth it when read and write patterns diverge sharply — very high read volume with complex query shapes that a single normalized model serves poorly, or when different consumers need very different views. The costs are real: two models to maintain, eventual consistency between them, and more moving parts. For ordinary CRUD it's over-engineering; I reach for it only when the read/write divergence genuinely justifies the added complexity, and it pairs naturally with event sourcing.</p>`);
IV(`Architecture`,`Hard`,`How do you keep data consistent across microservices?`,`<p>You give up cross-service ACID transactions and embrace eventual consistency with explicit patterns. For multi-service workflows, use a <strong>saga</strong>: a sequence of local transactions each with a compensating action to undo on failure. To publish events reliably alongside a local commit, use the <strong>outbox pattern</strong>, avoiding the dual-write bug. For keeping read models or other services' data in sync, propagate changes via events (or CDC), and make consumers idempotent so retries are safe. Where you truly need strong consistency, keep that data within a single service/aggregate so one local transaction suffices. The mindset shift is designing for eventual consistency and idempotency by default, reserving strong consistency for the narrow places it's essential.</p>`);
IV(`Messaging & events`,`Medium`,`What is backpressure and how do you handle it?`,`<p>Backpressure is the mechanism by which an overwhelmed downstream component signals upstream to slow down, preventing it from being flooded faster than it can process. Without it, a fast producer overruns a slow consumer, causing growing queues, memory exhaustion, or dropped messages. You handle it by: using bounded buffers/queues that block or reject when full; having consumers pull at their own pace (Kafka's model) rather than being pushed; applying rate limiting and load shedding at the edges; and scaling consumers horizontally. Monitoring <strong>consumer lag</strong> is the key signal — growing lag means consumers can't keep up and you need to scale out, optimize processing, or shed load.</p>`);
IV(`API design`,`Medium`,`How do you paginate a large collection API?`,`<p>Never return an unbounded list. Two schemes: <strong>offset/limit</strong> (<code>?limit=20&amp;offset=40</code>) is simple and allows jumping to arbitrary pages, but degrades on large offsets (the DB scans and skips) and can skip or duplicate rows when data changes mid-pagination. <strong>Cursor/keyset</strong> (<code>?limit=20&amp;after=cursor</code>) passes an opaque pointer to the last item; the server returns the next page after that point — efficient at any depth and stable under inserts/deletes, at the cost of no random page access. I default to cursor pagination for large or fast-changing datasets and return the next cursor in the response so clients don't construct it themselves.</p>`);
IV(`Security`,`Medium`,`How do sessions and JWTs differ for authentication?`,`<p><strong>Sessions</strong> are stateful: on login the server stores a session record and gives the client a session ID (cookie); each request is validated by looking it up. Easy to revoke (delete the session), but requires shared session storage across servers. <strong>JWTs</strong> are stateless: a signed token carries the claims, and the server verifies the signature without a lookup — great for scaling, but the weakness is you can't easily revoke a JWT before it expires, since there's no server-side record to delete. The common mitigation is short-lived access tokens plus a longer-lived refresh token that <em>is</em> checked against server state, so revocation takes effect quickly. Choose sessions for easy revocation and simplicity, JWTs for stateless scale with the revocation caveat handled.</p>`);
IV(`Security`,`Hard`,`How do you prevent broken object-level authorization (IDOR)?`,`<p>IDOR is the most common serious web vulnerability: the server authenticates the user but forgets to check they own the <em>specific</em> resource, so changing <code>/orders/42</code> to <code>/orders/43</code> leaks someone else's data. Prevention: enforce authorization on the <strong>server</strong>, on <strong>every</strong> request, at the <strong>object level</strong> — for any request touching a specific resource, verify the caller is allowed to touch <em>that</em> resource, not just that they're logged in. Never rely on the UI hiding a button or on unguessable IDs alone. Concretely, scope every query by the authenticated user (e.g., <code>WHERE id = ? AND owner_id = current_user</code>), centralize authorization checks so they can't be forgotten, and test for it explicitly.</p>`);
IV(`Observability & reliability`,`Medium`,`What are the four golden signals and why those?`,`<p>Latency, traffic, errors, and saturation. <strong>Latency</strong> (as percentiles) is how long requests take — directly what users feel. <strong>Traffic</strong> is demand (requests/sec) — context for everything else. <strong>Errors</strong> is the rate of failing requests — the clearest sign something's broken. <strong>Saturation</strong> is how full your most constrained resource is (CPU, memory, connections, queue depth) — the leading indicator of imminent trouble. They're chosen because together they capture user experience and system health with just four numbers: if you can only instrument a few things, these tell you whether users are being served well and whether you're about to run out of headroom. Everything else is detail you add when one of these fires.</p>`);
IV(`Deployment`,`Easy`,`What's the difference between continuous delivery and continuous deployment?`,`<p><strong>Continuous delivery</strong> means every change that passes the pipeline is always in a deployable state — getting it to production is a push-button (or automatic-with-approval) step rather than a project. <strong>Continuous deployment</strong> goes one step further: every change that passes automated checks is deployed to production automatically, with no human gate. Every team benefits from continuous <em>delivery</em> (always being able to ship the current main safely); not every team wants full continuous <em>deployment</em>, since some changes warrant a human decision or a business-timed release. Both rest on the same foundation: a fast, trustworthy automated test suite and a well-practiced, automated pipeline promoting one artifact through environments.</p>`);
