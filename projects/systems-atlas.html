{cat:`API design`,d:`Easy`,q:`REST, gRPC, or GraphQL — when would you use each?`,
a:`<p><strong>REST</strong> for public and cross-team APIs — universally understood, cacheable over HTTP, human-readable, works everywhere. <strong>gRPC</strong> for internal service-to-service calls — binary and fast over HTTP/2, strongly typed via a .proto contract, supports streaming; the downsides are it's not human-readable and not natively browser-callable. <strong>GraphQL</strong> when many different clients (mobile, web, partners) need different slices of the same data — the client asks for exactly the fields it wants in one query, avoiding over- and under-fetching; the costs are harder caching and the risk of expensive nested queries.</p><p>A mature system often uses all three: GraphQL or REST at the edge for clients, gRPC between internal services.</p>`},
{cat:`API design`,d:`Medium`,q:`How do you version an API without breaking existing clients?`,
a:`<p>The best strategy is to rarely need a version at all: prefer <strong>additive, backward-compatible changes</strong>. Adding a new optional field or a new endpoint breaks nobody; removing a field, renaming one, changing a type, or making an optional field required does break callers. So I design responses and requests to tolerate additions.</p><p>When a genuinely breaking change is unavoidable, I introduce a new major version — <strong>URL versioning</strong> (<code>/v2/users</code>, visible and easy to route) or header versioning (cleaner URLs, less visible) — publish a <strong>deprecation timeline</strong>, and run the old and new versions in parallel so clients migrate on their own schedule. I'd also mention that contract-first definitions (OpenAPI) plus consumer-driven contract tests catch accidental breaking changes before they ship.</p>`},
{cat:`API design`,d:`Medium`,q:`How do you make a POST endpoint safe to retry?`,
a:`<p>GET, PUT, and DELETE are naturally idempotent, but POST (create) is not — a retry after a timeout can create a duplicate. The fix is an <strong>idempotency key</strong>: the client generates a unique ID and sends it (usually as a header) with the request. The server records that key together with the result of the first successful execution; if it sees the same key again, it returns the stored result instead of executing again.</p><p>I'd store keys with a TTL (they don't need to live forever) and scope them per endpoint/user. This is exactly how payment APIs prevent double charges. For pagination and bulk endpoints I'd also note the related discipline of bounded, cursor-based responses so retries and large result sets stay safe and efficient.</p>`},

{cat:`Security`,d:`Easy`,q:`What's the difference between authentication and authorization?`,
a:`<p><strong>Authentication (authn)</strong> answers "who is this caller?" — verifying identity via sessions, tokens/JWT, or OAuth/OpenID Connect. <strong>Authorization (authz)</strong> answers "is this authenticated caller allowed to do this?" — enforcing permissions via roles (RBAC) or attributes (ABAC).</p><p>The critical point for interviews: it's easy to authenticate correctly and then forget to authorize on every operation. The most common serious web vulnerability is <strong>broken object-level authorization (IDOR)</strong> — the server confirms you're logged in but doesn't check you own <em>this specific</em> resource, so changing <code>/orders/42</code> to <code>/orders/43</code> exposes someone else's data. Authorization must be enforced server-side, on every request, at the object level — never rely on the UI hiding a button.</p>`},
{cat:`Security`,d:`Medium`,q:`How should you store user passwords, and why?`,
a:`<p>Never in plaintext, and never with fast general-purpose hashes like MD5 or SHA-256 — attackers can brute-force those at billions of guesses per second. Use a <strong>slow, salted, adaptive password-hashing function</strong>: bcrypt, scrypt, or Argon2. "Slow" means deliberately expensive to compute, so brute force is impractical. "Salted" means a unique random salt per user, so identical passwords produce different hashes and precomputed rainbow tables are useless. "Adaptive" means you can increase the cost factor as hardware gets faster.</p><p>I'd add <strong>multi-factor authentication</strong> for anything sensitive, so a stolen password alone isn't enough, and mention that you should never log passwords and should rate-limit login attempts to slow credential stuffing. The broader principle: assume your database could be breached, and store credentials so they're still useless to an attacker who gets them.</p>`},
{cat:`Security`,d:`Medium`,q:`How do you prevent SQL injection and similar attacks?`,
a:`<p>SQL injection happens when untrusted input is concatenated into a query and gets parsed as code — e.g., a username field containing <code>'; DROP TABLE users;--</code>. The near-universal fix is to <strong>never build queries by string concatenation</strong>; use <strong>parameterized queries / prepared statements</strong>, where the query structure is fixed and user input is passed as data that can never be interpreted as SQL.</p><p>This is one instance of a general principle: <strong>separate code from data</strong>, which also defeats command injection and LDAP injection. Alongside it I'd validate input strictly at trust boundaries, use least-privilege database accounts (so even a successful injection has limited power), and for the browser side, contextually encode output to prevent XSS and use anti-CSRF tokens. And I'd keep dependencies patched, since most application code is third-party and its vulnerabilities become yours.</p>`},

{cat:`Observability & reliability`,d:`Medium`,q:`What are the three pillars of observability and when do you use each?`,
a:`<p><strong>Metrics</strong> — numeric time series (request rate, error rate, latency percentiles, saturation). Cheap and aggregate; ideal for dashboards and alerting. They tell you <em>that</em> something is wrong. The four golden signals — latency, traffic, errors, saturation — are the first things to instrument.</p><p><strong>Logs</strong> — timestamped, structured event records with the specific detail metrics lack. Centralized and correlated by request ID, they tell you <em>what</em> happened and <em>why</em>.</p><p><strong>Traces</strong> — the path of one request across all the services it touches, with per-hop timing. In a request that's slow crossing eight services, distributed tracing is the only practical way to find <em>where</em> the time went. The three work together: a metric alert fires, a trace localizes the bad service, logs explain the cause. I'd stress instrumenting from the start — bolting observability on after an outage is far harder, and outages are exactly when you need it.</p>`},
{cat:`Observability & reliability`,d:`Medium`,q:`What are SLIs, SLOs, and error budgets?`,
a:`<p>An <strong>SLI</strong> (Service Level Indicator) is a measurement of service quality — e.g., the fraction of requests served under 300 ms. An <strong>SLO</strong> (Objective) is your target for it — e.g., 99.9% success over a rolling 28 days. An <strong>SLA</strong> is the contractual promise to customers, usually with penalties, and should be looser than your internal SLO so you notice problems before customers do.</p><p>The powerful idea is the <strong>error budget</strong>: if your SLO is 99.9%, then 0.1% failure is explicitly <em>allowed</em>. This reframes reliability from the impossible "never fail" to "stay within budget," and it resolves the perennial fight between shipping features and improving reliability with data: while you're within budget, ship fast; if you blow it, freeze features and invest in reliability until you're back in bounds. It acknowledges that every additional nine costs exponentially more, so you target the reliability the business actually needs.</p>`},
{cat:`Observability & reliability`,d:`Hard`,q:`Design an alerting strategy that engineers won't learn to ignore.`,
a:`<p>The enemy is <strong>alert fatigue</strong> — non-actionable pages train people to ignore alerts, including the important one. My principles: (1) <strong>Alert on symptoms, not causes</strong> — page when <em>users</em> are affected (error rate up, latency up, SLO burning), not on every internal fluctuation like a single high-CPU box that isn't hurting anyone. (2) <strong>Every page must be actionable and urgent</strong> — if a human can't or needn't act right now, make it a ticket or dashboard item, not a page. (3) <strong>Tie alerts to SLO burn rate</strong> — this naturally fires for real problems and stays quiet for noise. (4) <strong>Ruthlessly tune or delete</strong> any alert that fires without being actionable.</p><p>I'd support this with good runbooks (so responders aren't reverse-engineering the system at 3 a.m.), a sustainable on-call rotation, and blameless postmortems that turn each real incident into guardrails so the same failure can't page twice. A healthy rotation gets few pages, each meaningful.</p>`},

{cat:`Deployment`,d:`Medium`,q:`Compare blue-green and canary deployments.`,
a:`<p>Both avoid downtime and enable fast rollback, but optimize differently. <strong>Blue-green</strong> runs two complete production environments: "blue" (current) serves all traffic while "green" (new) is deployed and verified in isolation; you then flip the router to green, and if anything's wrong you flip back to blue instantly. The rollback is a routing change, not a redeploy — but you pay to run two full environments and the switch is all-or-nothing.</p><p><strong>Canary</strong> releases the new version to a <em>small fraction</em> of traffic first (1%, then 5%, then 25%…), watching the golden signals at each step; if the canary group degrades, you roll back having exposed only a sliver of users. It's the safest strategy for risky changes because it <strong>limits the blast radius</strong> and turns "did this break?" into a monitored, incremental question — but it depends on good observability and takes longer to fully roll out. I often combine them with <strong>feature flags</strong> so deploying code and releasing a feature are separate, instantly-reversible decisions.</p>`},
{cat:`Deployment`,d:`Hard`,q:`How do you rename a database column with zero downtime?`,
a:`<p>You can't just rename it in one deploy, because during any rollout old and new versions of the code run simultaneously — the old code still expects the old column and breaks the instant the migration lands. The safe approach is the <strong>expand/contract (parallel change) pattern</strong>, spread across multiple deploys:</p><ul><li><strong>Expand:</strong> add the new column alongside the old one; deploy code that writes to <em>both</em> but still reads the old.</li><li><strong>Migrate:</strong> backfill existing rows into the new column, then deploy code that reads from the new column (both still present).</li><li><strong>Contract:</strong> once nothing reads or writes the old column, drop it in a final deploy.</li></ul><p>Each step is individually backward-compatible, so a running mix of old and new code never breaks. The same principle — never make a change a currently-running previous version can't tolerate — applies to API and event-schema changes. It also keeps rollback safe, since no single step strands the data.</p>`},

{cat:`System design`,d:`Medium`,q:`Design a URL shortener (like bit.ly).`,
a:`<p><strong>Scope:</strong> shorten a long URL to a short key; redirect on access; optional analytics and expiry. <strong>Scale:</strong> estimate — say 50M new links/month ≈ 17 writes/s, each read ~200× ≈ 3,400 reads/s. That 200:1 ratio tells me the whole design is about cached reads.</p><p><strong>Design:</strong> To create, generate a short <strong>key</strong> — either base-62 encode an auto-increment/Snowflake counter (guarantees uniqueness, avoids collisions) or hash the URL and handle collisions. Store <code>key → long URL</code> in a key-value store. To redirect, look up the key (served from cache/CDN, since reads dominate) and return a <code>301</code> (cached by browser, fewer hits) or <code>302</code> (lets you count clicks).</p><p><strong>Deep dives:</strong> key generation strategy and collision handling; the cache-first read path (the DB barely works); custom aliases; analytics via async events to a stream so counting doesn't slow redirects; and expiry via TTL. <strong>What breaks at 10×:</strong> mostly the cache/CDN tier, which scales horizontally — the write path stays trivial.</p>`},
{cat:`System design`,d:`Hard`,q:`Design a social media news feed (like Twitter/Instagram).`,
a:`<p><strong>Scope:</strong> users follow others; a home feed shows recent posts from followees, ranked, loaded frequently. <strong>Scale:</strong> read-heavy (people scroll far more than they post), with a fan-out challenge.</p><p><strong>The core decision — fan-out:</strong> Pure <strong>push</strong> (fan-out on write) precomputes each follower's feed when a post is created — reads are instant, but a celebrity with 100M followers triggers 100M writes per post, a write storm. Pure <strong>pull</strong> (fan-out on read) assembles the feed from followees' posts at read time — cheap writes, but slow reads. The answer is a <strong>hybrid</strong>: push for normal users (precompute), pull for the handful of celebrities each user follows, and merge both at read time.</p><p><strong>Design:</strong> posts in a wide-column store; precomputed feeds in a fast store (Redis lists); a fan-out service triggered by new-post events. <strong>Deep dives:</strong> the celebrity hot-key handling, ranking (chronological vs. scored), pagination, and how feeds are stored and trimmed. This push/pull/hybrid pattern recurs in notifications and chat groups.</p>`},
{cat:`System design`,d:`Hard`,q:`Design a system that prevents double-booking (tickets, seats, inventory).`,
a:`<p>The heart of every "two people must not get the same thing" problem is a single primitive: an <strong>atomic conditional write</strong>. For a seat: <code>UPDATE seats SET status='HELD', held_by=?, expires=now+8min WHERE seat_id=? AND status='AVAILABLE'</code>. Row-level atomicity guarantees exactly one of two racing users succeeds; the other's update affects zero rows and gets "seat just taken, pick another." The same shape decrements inventory (<code>WHERE stock &gt; 0</code>), locks a driver, or claims a scheduled job.</p><p><strong>Full design:</strong> hold seats with a <strong>TTL</strong> so abandoned carts release them; keep seat state in a <strong>strongly consistent</strong> store (this is a Consistency choice — never double-sell). For the load spike (a hot show at 10:00:00), add a <strong>virtual waiting room</strong> to admit users at a sustainable rate and edge-cache the seat map (accepting slight display staleness while the hold operation is authoritative). Money flows through a checkout <strong>saga</strong> with idempotent payment. <strong>Deep dive:</strong> optimistic (conditional write — best for high volume) vs. pessimistic (<code>SELECT FOR UPDATE</code> — serializes, for a few ultra-contended rows) locking.</p>`},
{cat:`System design`,d:`Medium`,q:`Design a rate limiter.`,
a:`<p><strong>Scope:</strong> limit each client (user/API key/IP) to N requests per window, enforced across a fleet of servers, with low added latency. <strong>Algorithm:</strong> I'd use a <strong>token bucket</strong> — each client has a bucket that refills at a steady rate up to a capacity; each request consumes a token; empty bucket = reject. It allows short bursts (up to capacity) while enforcing an average rate, which matches real usage well. (Alternatives: leaky bucket for smooth output, sliding-window counter for precise windows.)</p><p><strong>Distributed enforcement:</strong> the counter must be shared, so store it in <strong>Redis</strong> and use atomic operations to decrement tokens, so all servers see one consistent view. To avoid a Redis round-trip on every request, a two-tier approach: a permissive in-memory local limiter plus periodic sync to the global counter. <strong>Decisions:</strong> fail-open (allow if the limiter is down — favor availability) vs. fail-closed (deny — favor protection), where limits live (gateway), and returning <code>429</code> with a <code>Retry-After</code> header. <strong>Deep dive:</strong> atomic counters and clock/window handling.</p>`},

{cat:`Software design`,d:`Easy`,q:`What does the Single Responsibility Principle really mean?`,
a:`<p>Beyond the loose "a class should do one thing," the sharper definition is: <strong>a module should have one, and only one, reason to change</strong> — it should be responsible to a single actor or stakeholder. If, say, the accounting department's rules and the report's formatting can both force edits to the same class, it has two reasons to change and becomes a fragile battleground where a formatting tweak risks breaking tax logic.</p><p>The benefit is that changes stay localized and the code is easier to test and reuse. In practice I look for classes that mix unrelated concerns — validation, persistence, formatting, and notification in one place — and split them into focused collaborators. It's the most important of the SOLID principles and underlies why we separate concerns at every scale, from functions to services (bounded contexts are SRP applied to whole systems).</p>`},
{cat:`Software design`,d:`Medium`,q:`Clean Code says make functions tiny; A Philosophy of Software Design warns against that. Who's right?`,
a:`<p>Both are chasing the same goal — code that's easy to understand — but they emphasize different failure modes, and mature judgment takes from each. <strong>Clean Code</strong> is right that long functions doing many things at mixed abstraction levels are hard to read, and that extracting well-named small functions makes intent clear. <strong>Ousterhout</strong> is right that decomposition isn't free: every split adds an interface and a relationship to understand, and shattering one coherent idea into a dozen tiny functions can force the reader to ping-pong across the file to reassemble it — <em>increasing</em> cognitive load.</p><p>His concept of <strong>deep modules</strong> (powerful functionality behind a simple interface) reframes the goal: a simple <em>interface</em> matters more than a small <em>implementation</em>. So my answer: split by <strong>clarity and responsibility</strong>, not to hit a line count. Extract when a piece has a clear, nameable job; keep it together when the split would create shallow fragments that hide nothing. The line-count rule is a heuristic, not the goal.</p>`},
{cat:`Software design`,d:`Medium`,q:`What is dependency inversion and why does it matter for testability?`,
a:`<p>The Dependency Inversion Principle says high-level policy (business logic) shouldn't depend on low-level details (databases, frameworks, external APIs) — both should depend on abstractions. Concretely, the business logic defines an interface it needs (say, <code>OrderRepository</code>), expressed in its own terms, and the low-level code <em>implements</em> that interface. So at the source-code level, the database depends on the business logic's interface (inward), even though at runtime the logic calls the database (outward).</p><p>This matters enormously for <strong>testability</strong>: because the business logic depends only on an interface, you can substitute a simple in-memory implementation in tests and verify all your logic with fast unit tests — no database, no web server, no framework. It's also what makes infrastructure swappable (change databases without touching business rules). This inversion is the mechanism behind Clean/Hexagonal architecture, where dependencies point inward toward the domain and the database and framework are replaceable "details."</p>`},

{cat:`ML systems`,d:`Medium`,q:`How does designing an ML system differ from a traditional system?`,
a:`<p>An ML system is still a system — scaling, caching, queues, and databases all apply — but its behavior comes from <strong>data and a learned model</strong>, not just code, which changes three things. First, it has a <strong>two-plane architecture</strong>: an offline <em>training</em> plane (batch, throughput-oriented, latency-tolerant) that builds the model, and an online <em>serving</em> plane (latency-sensitive, availability-critical) that runs inference. They have opposite goals and are scaled separately.</p><p>Second, it introduces ML-specific components: <strong>feature pipelines</strong>, a <strong>feature store</strong> (to serve identical features to training and serving, preventing skew), a model-serving service, and a model registry for versioned rollout/rollback. Third — and most distinctively — it has a failure mode traditional systems don't: the model <strong>silently degrades over time (drift)</strong> as the world changes, so monitoring must track model quality (not just latency/errors) and you need a retraining loop. The question "how does this stay good in six months?" is central, and it's the part beginners forget.</p>`},
{cat:`ML systems`,d:`Medium`,q:`What is training/serving skew and how do you prevent it?`,
a:`<p><strong>Training/serving skew</strong> is when the features a model was trained on don't match the features it sees in production — because they were computed differently in each path. For example, the training pipeline computes "user's 30-day average spend" in a batch job in Python, while the serving path recomputes it in real time in another language with a slightly different definition. The model was effectively trained on different data than it now receives, so its accuracy quietly degrades — an invisible bug until you measure model quality.</p><p>The fix is a <strong>feature store</strong>: a system that computes each feature <em>once</em> and serves it to both training (an offline store, for historical consistency) and serving (an online, low-latency store for inference). Because both paths read the same feature definitions from one source, they're guaranteed to match. It's the single most important correctness component in applied ML — if you take one ML-specific idea into a design, it's "train and serve the same features from one source."</p>`},
{cat:`ML systems`,d:`Hard`,q:`Design a Retrieval-Augmented Generation (RAG) system for answering questions over company docs.`,
a:`<p><strong>Why RAG:</strong> a general LLM's knowledge is frozen and doesn't include your private, current documents, so you ground it by retrieving relevant context at query time. It's largely a retrieval + serving system design.</p><p><strong>Offline (ingestion pipeline):</strong> chunk the documents sensibly, compute <strong>embeddings</strong> (vector representations) for each chunk, and store them in a <strong>vector database</strong> / index. This is a batch feature pipeline that must be refreshed as documents change.</p><p><strong>Online (query path):</strong> embed the user's question, do a <strong>similarity search</strong> (nearest-neighbor) in the vector store to fetch the most relevant chunks, then inject those chunks into the LLM's prompt as context and generate a grounded answer.</p><p><strong>Deep dives &amp; what's different:</strong> quality hinges on <em>retrieval</em> as much as the model (chunking strategy, embedding quality, index freshness, re-ranking). Responses are <strong>streamed</strong> token-by-token (SSE/WebSockets); inference is <strong>expensive</strong>, so cache embeddings and common answers; output is non-deterministic, so <strong>evaluation</strong> uses eval sets and human/A-B feedback rather than one accuracy number; and you need <strong>guardrails</strong> against hallucination and prompt injection (a security concern — untrusted input manipulating the prompt).</p>`},

{cat:`Behavioral & process`,d:`Medium`,q:`How do you approach a system design interview when you don't know the answer?`,
a:`<p>The interview tests your <em>process</em>, not memorized answers, so I lean on the framework. (1) <strong>Clarify and scope</strong> — ask questions to pin down features, explicitly state what's out of scope, and establish scale and what matters most (consistency? latency?). This alone shows senior judgment and prevents solving the wrong problem. (2) <strong>Estimate</strong> — do the back-of-envelope math and let it drive choices. (3) <strong>High-level design</strong> — sketch boxes and arrows, propose APIs and a data model, walk one flow end to end, and get buy-in. (4) <strong>Deep dive</strong> — go deep on the 2–3 hard parts, and (5) wrap up by naming bottlenecks and what breaks at 10×.</p><p>Throughout, I think out loud, frame every choice as a <strong>trade-off</strong> ("I'd use a cache here, trading freshness for latency"), and treat it as a collaboration — checking in with the interviewer rather than monologuing. Admitting "I'm not sure, here's how I'd reason about it" is far stronger than bluffing, because reasoning is exactly what's being assessed.`},
{cat:`Behavioral & process`,d:`Medium`,q:`How do you make a significant technical decision and communicate it?`,
a:`<p>I gather the real requirements and constraints first, then identify the genuine options and evaluate each against the <strong>trade-offs</strong> that matter for <em>this</em> context — there's rarely a universally best choice, only the best fit. I try to disprove my favored option, not just support it, and I involve the people who'll live with the decision.</p><p>Then I write it down as a lightweight <strong>Architecture Decision Record (ADR)</strong>: the context and forces, the options considered, the decision, and its consequences (including what we're giving up). Writing it clarifies the reasoning, creates a shared reference, and — crucially — records <em>why</em> for the future engineer who'll wonder. For reversible decisions I bias toward acting quickly and learning; for hard-to-reverse ones I invest more in analysis and get more input. And I frame the decision as a trade-off to stakeholders rather than as an absolute, which builds trust and invites the useful pushback that catches mistakes.`}
);
</script>

const G=(t,d,x,g)=>GUIDE.glossary.push({t:t,d:d,x:x,g:g});
G(`Scalability`,`The ability to handle growing load by adding resources — vertically (bigger machine) or horizontally (more machines).`,`A coffee shop gets busier: scale up = hire a faster barista; scale out = open more registers. Software usually prefers more registers.`,`Properties & trade-offs`);
G(`Availability`,`Fraction of time the system is up and serving, measured in "nines" (99.99% ≈ 52 min downtime/year).`,`"Four nines" means your site can be down only about one lunch break per year — total.`,`Properties & trade-offs`);
G(`Latency vs. throughput`,`Time for one operation vs. operations per second. Measure latency as percentiles (p50/p95/p99), never averages.`,`A highway: latency = how long your trip takes; throughput = how many cars pass per minute. A jammed 10-lane road has high throughput but bad latency.`,`Properties & trade-offs`);
G(`Consistency (strong vs. eventual)`,`Strong: every read sees the latest write. Eventual: replicas converge soon; reads may be briefly stale.`,`Post a photo: strong = every friend sees it instantly; eventual = some friends see it a few seconds later. Fine for photos, not for bank balances.`,`Properties & trade-offs`);
G(`CAP theorem`,`During a network partition, choose Consistency (refuse/err) or Availability (answer, possibly stale) — not both.`,`Two ATMs lose contact with each other. Either they refuse withdrawals (consistent) or allow them and risk overdraft (available). You can't have both while disconnected.`,`Properties & trade-offs`);
G(`PACELC`,`Extends CAP: even without a partition (Else), you trade Latency vs. Consistency on every request.`,`Waiting for three friends to confirm a plan (consistent) is slower than just asking one (fast, but they might be out of date).`,`Properties & trade-offs`);
G(`Idempotency`,`Doing an operation twice equals doing it once; makes retries safe. Implemented with an idempotency key.`,`Pressing a crosswalk button five times does the same thing as pressing it once. A "pay" button should work the same way so a double-click doesn't charge you twice.`,`Properties & trade-offs`);
G(`Statelessness`,`No per-user state in server memory, so any instance handles any request — enabling easy horizontal scaling and failover.`,`A fast-food counter where any cashier can serve any customer because the order is on the receipt, not in one cashier's head.`,`Properties & trade-offs`);
G(`Trade-off`,`The central idea: every design choice gains something and costs something; "best" is always relative to requirements.`,`A sports car vs. a minivan — neither is "best," it depends on whether you're racing or carrying five kids.`,`Properties & trade-offs`);

G(`Load balancer`,`Distributes traffic across servers for scale and availability. L4 (transport, fast) or L7 (HTTP-aware).`,`The host at a busy restaurant sending each new party to whichever server has the fewest tables.`,`Building blocks`);
G(`API gateway / BFF`,`A single front door adding auth, rate limiting, and routing; a BFF is a gateway tailored per client type.`,`A building's front desk: it checks your ID, tells you which floor, and stops people who shouldn't be there — so the offices don't each need their own guard.`,`Building blocks`);
G(`Cache-aside`,`App checks cache; on a miss reads the DB and populates it. The default caching strategy; risk of staleness until TTL.`,`Keeping a few frequently-called phone numbers on a sticky note by the phone instead of opening the whole directory each time.`,`Building blocks`);
G(`Cache stampede`,`A hot key expires and all requests miss at once, crushing the DB. Fix: per-key lock, jittered TTL, background refresh.`,`A popular item's sticky note falls off, so everyone rushes the directory at the same second. Fix: one person looks it up while others wait.`,`Building blocks`);
G(`CDN`,`A geographically distributed cache for static/media and read-heavy content, served near users to shield the origin.`,`Netflix stores copies of popular shows in your city, so the video comes from down the street instead of across the ocean.`,`Building blocks`);
G(`Consistent hashing`,`Ring-based key→node mapping where membership changes remap only ~1/N of keys; virtual nodes smooth imbalance.`,`Seating guests around a round table by the first letter of their name — adding one more table only reshuffles a small slice, not everyone.`,`Building blocks`);
G(`Message queue`,`Delivers a task to be processed once by one consumer (RabbitMQ, SQS).`,`A ticket spike at a deli counter: each ticket is handled by exactly one worker, and the line smooths out rushes.`,`Building blocks`);
G(`Event log`,`A durable, replayable, append-only log read by many consumer groups at their own pace (Kafka).`,`A shared security-camera recording: many teams can watch it independently, rewind, and re-watch — the footage isn't consumed when one person views it.`,`Building blocks`);
G(`Object storage`,`Cheap, near-infinite file storage (S3). Store files here and only URLs/metadata in the database.`,`A giant coat-check: you hand over the big item and keep only the little claim ticket (the URL) in your pocket.`,`Building blocks`);
G(`Snowflake ID`,`64-bit, time-sortable unique ID (timestamp + machine ID + sequence); generated per machine without coordination.`,`A receipt number like "20260712-REG3-0042": the date sorts it, "REG3" says which register, "0042" is that register's count — no two registers ever clash.`,`Building blocks`);
G(`Bloom filter`,`A tiny probabilistic set answering "definitely not present / maybe present"; skips pointless lookups.`,`A bouncer's memory: "I definitely haven't seen you" (skip the guest list) or "maybe I have" (go check). Cheap, occasionally makes you double-check.`,`Building blocks`);
G(`Sharding`,`Splitting data across machines by hash (even spread) or range (good scans, risk of hot shards).`,`A library too big for one building splits books across branches — by hash (random even split) or by range (A–M here, N–Z there).`,`Building blocks`);
G(`Read replica`,`A copy serving reads to multiply capacity; introduces replication lag (brief staleness).`,`Photocopies of a notice board around the office: everyone can read nearby, but a just-pinned note takes a moment to appear on every copy.`,`Building blocks`);

G(`Monolith`,`The whole app as one deployable unit; simplest to build and operate; scales as a whole.`,`A Swiss Army knife — everything in one tool. Simple to carry; to upgrade the scissors you replace the whole knife.`,`Architecture`);
G(`Modular monolith`,`A monolith with strict internal module boundaries; the recommended default for new systems.`,`A well-organized toolbox: still one box, but each tool has its own labeled tray, so you could later move a tray into its own case.`,`Architecture`);
G(`Microservices`,`Small, independently deployable services owning their own data; buys team autonomy at high operational cost.`,`A food court instead of one big kitchen: each stall runs itself and can renovate without closing the others — but now you manage many stalls.`,`Architecture`);
G(`Distributed monolith`,`Anti-pattern: services coupled so they must deploy together — all the pain of distribution, none of the benefit.`,`A food court where every stall must close whenever one changes its menu — you got the overhead of many stalls with the rigidity of one kitchen.`,`Architecture`);
G(`Event-driven architecture`,`Components communicate via events through a broker; decoupled and resilient, but harder to trace.`,`A wedding: the photographer, caterer, and band all react to "the couple has arrived" without the couple calling each one directly.`,`Architecture`);
G(`Saga`,`A multi-service workflow of local transactions, each with a compensating action to undo on later failure.`,`Booking a trip: reserve flight, then hotel, then car. If the car fails, you cancel the hotel and flight (compensation) — no single "undo everything" button exists.`,`Architecture`);
G(`Outbox pattern`,`Write DB change + outgoing event in one transaction (outbox table); a relay publishes it, avoiding lost/dual-write bugs.`,`Writing a to-do in your journal at the same moment you record the deal — so you can never "make the sale" but forget to tell the shipping team.`,`Architecture`);
G(`CQRS`,`Separate models for writes (rich domain) and reads (denormalized views); justified at extreme read/write divergence.`,`A chef's detailed recipe (write side) vs. the simple photo menu customers browse (read side) — same food, two very different views.`,`Architecture`);
G(`Event sourcing`,`Store the sequence of events as the source of truth; current state is a replay of events.`,`A bank statement: instead of just a balance, you keep every deposit and withdrawal, and the balance is whatever they add up to.`,`Architecture`);
G(`Strangler fig`,`Incrementally divert functionality out of a legacy system until it withers; safe migration, never a big-bang rewrite.`,`Renovating a house room by room while still living in it, instead of demolishing and rebuilding all at once.`,`Architecture`);
G(`Conway's Law`,`Systems mirror the communication structure of the organizations that build them; align service and team boundaries.`,`If four separate teams build a compiler, you tend to get a four-stage compiler — the software's seams follow the org chart.`,`Architecture`);

G(`SOLID`,`Five OO principles: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion.`,`Like kitchen rules: one tool per job, add gadgets without rewiring the kitchen, any blender fits the base, don't force a whisk on someone who wants a spoon.`,`Software design`);
G(`Dependency injection`,`Providing a component's dependencies from outside (enables testing and swapping implementations).`,`A coffee machine that takes whatever beans you hand it, instead of one welded to a single bag — so you can swap in decaf for a test.`,`Software design`);
G(`Bounded context`,`A boundary within which a domain model and language are consistent; the tool for finding service boundaries.`,`"Ticket" means a support case to the help desk and a concert seat to the box office. Each department keeps its own meaning inside its own walls.`,`Software design`);
G(`Value object`,`An immutable object defined by its attributes, not identity (Money, DateRange); cures Primitive Obsession.`,`A $5 bill: any $5 is interchangeable with any other $5 — you care about the value, not which specific note you hold.`,`Software design`);
G(`Aggregate`,`A cluster of objects treated as one consistency unit, accessed through a root; "one transaction per aggregate."`,`An order and its line items: you always change them through the order, which enforces "the total must match the items."`,`Software design`);
G(`Hexagonal / Clean architecture`,`Dependencies point inward toward business logic; frameworks and the database are outer "details."`,`The rules of chess don't care whether you play on wood, an app, or by mail — the board and pieces are swappable "details" around the same core rules.`,`Software design`);
G(`Deep module`,`Powerful functionality behind a simple interface (Unix file API); the opposite of a shallow pass-through module.`,`A car: two pedals and a wheel (simple interface) hide an engine, transmission, and brakes (enormous hidden power).`,`Software design`);
G(`Refactoring`,`Improving internal structure without changing observable behavior, in small safe steps backed by tests.`,`Tidying and reorganizing a kitchen so cooking is easier — without changing any of the recipes you can make.`,`Software design`);
G(`Code smell`,`A surface symptom pointing to a deeper design problem (long function, feature envy, shotgun surgery).`,`A faint gas smell doesn't prove a leak, but it tells you exactly where to look. "This function is 500 lines" is that smell for code.`,`Software design`);
G(`DRY`,`Don't Repeat Yourself: one authoritative representation of each piece of knowledge — not merely similar-looking text.`,`Store the tax rate in one place. If it's copied into ten files, one day you'll update nine and ship a bug.`,`Software design`);

G(`Atomic conditional write`,`UPDATE ... SET ... WHERE <still-valid-condition>; the core primitive preventing double-booking/charging/dispatch.`,`"Give me seat 4A only if it's still free." Two people race for it; the database lets exactly one win and tells the other "already taken."`,`Concurrency & consistency`);
G(`Optimistic vs. pessimistic concurrency`,`Try and detect conflict (conditional update) vs. lock before acting (SELECT FOR UPDATE, which serializes).`,`Optimistic = grab the item and check at checkout if it's still yours. Pessimistic = put it on hold so no one else can touch it while you decide.`,`Concurrency & consistency`);
G(`Lease / visibility timeout`,`A time-bound claim on a task; if the holder dies it becomes reclaimable — enabling at-least-once execution.`,`A library book due back in 3 weeks: if you never return it, it eventually becomes available for someone else to check out.`,`Concurrency & consistency`);
G(`Linearizability`,`The strongest single-object guarantee: behave as if there's one copy, updated atomically.`,`Everyone in the world sees the exact same scoreboard flip at the same instant — no one ever sees a stale score.`,`Concurrency & consistency`);
G(`Isolation levels`,`Read Committed, Snapshot/Repeatable Read, Serializable — each preventing more anomalies (lost updates, write skew, phantoms).`,`Two people editing the same shared spreadsheet: strict isolation makes it feel like they took turns; loose isolation lets edits clobber each other.`,`Concurrency & consistency`);
G(`OT / CRDT`,`Techniques for conflict-free concurrent editing: transform operations against each other (OT) or design them to commute (CRDT).`,`Two people typing in the same Google Doc at once and it still merges sensibly instead of overwriting each other.`,`Concurrency & consistency`);

G(`REST / gRPC / GraphQL`,`Resource-oriented HTTP / binary typed RPC / client-specified-fields query — edge, internal, and multi-client APIs respectively.`,`REST = a public menu anyone can order from; gRPC = fast kitchen-to-kitchen shorthand; GraphQL = "just give me exactly these three ingredients."`,`API & operations`);
G(`Idempotency key`,`A client-supplied unique ID on a mutating request so retries don't cause duplicate effects.`,`Writing a confirmation number on your order so that if you resend it, the store knows it's the same order, not a new one.`,`API & operations`);
G(`Cursor pagination`,`Paging via an opaque pointer to the last item; efficient at any depth and stable under change; no random access.`,`A bookmark that says "continue from here," instead of "go to page 900" (which forces counting past 900 pages every time).`,`API & operations`);
G(`Four golden signals`,`Latency, traffic, errors, saturation — the first things to instrument.`,`A car dashboard: speed (latency), traffic around you, warning lights (errors), and the fuel/temperature gauge (saturation).`,`API & operations`);
G(`SLI / SLO / SLA`,`Indicator (a measurement) / objective (internal target) / agreement (external contractual promise).`,`SLI = your actual commute time; SLO = your personal goal of "under 30 min"; SLA = a promise to your boss with consequences if you're late.`,`API & operations`);
G(`Error budget`,`The allowed unreliability under an SLO; gates feature velocity vs. reliability work.`,`If you're allowed to be late to work 4 times a quarter, that's your budget — spend it freely, but once it's gone, start leaving earlier.`,`API & operations`);
G(`Distributed tracing`,`Following one request across services to see where time went (OpenTelemetry); essential in microservices.`,`A package tracking page showing every hub your parcel passed through and how long it waited at each — so you find the slow one.`,`API & operations`);
G(`Blue-green / canary`,`Two-environment instant-flip deploy / gradual-fraction rollout; both enable safe, fast rollback.`,`Blue-green = a second identical stage you flip a spotlight to. Canary = letting 5 diners try the new dish before serving the whole restaurant.`,`API & operations`);
G(`Feature flag`,`A runtime toggle decoupling deploy from release; enables dark launches, A/B tests, and instant kill switches.`,`A light switch for a feature: the wiring is installed (deployed), but you flip it on when ready — and off instantly if it sparks.`,`API & operations`);
G(`Expand/contract`,`Evolving a schema in backward-compatible steps (add new → migrate → remove old) for zero-downtime changes.`,`Adding a new lane to a highway before closing the old one, so traffic never stops during the switch.`,`API & operations`);
G(`Infrastructure as Code`,`Version-controlled, declarative, automatically-applied infrastructure (Terraform); reproducible and reviewable.`,`A LEGO instruction booklet for your servers: anyone can rebuild the exact same setup, and every change is tracked.`,`API & operations`);

G(`IDOR`,`Broken object-level authorization: failing to check a caller owns the specific resource — a top web vulnerability.`,`Changing "/order/42" to "/order/43" in the address bar and seeing a stranger's order because the site only checked you were logged in, not that it's yours.`,`Security`);
G(`Least privilege`,`Every user/service/credential gets the minimum access needed; limits the blast radius of a compromise.`,`A hotel key card that opens only your room and the gym — not every door in the building.`,`Security`);
G(`Zero-trust`,`Trust no network location implicitly; authenticate and encrypt every hop, including internal traffic.`,`A building where you badge in at every door, not just the front — so someone who slips inside still can't roam freely.`,`Security`);
G(`Parameterized query`,`Passing user input as data, never concatenated into SQL — the fix for injection (separate code from data).`,`A fill-in-the-blank form where the blanks can only ever be words, never new instructions — so nobody can smuggle in "...and delete everything."`,`Security`);
G(`PII`,`Personally identifiable information; carries special handling, retention, and deletion obligations (GDPR/CCPA).`,`Names, emails, addresses, phone numbers — the stuff you'd shred rather than toss in a public bin.`,`Security`);

G(`Training vs. serving plane`,`Batch, throughput-oriented model-building vs. latency-sensitive online inference; built and scaled separately.`,`Training = studying for the exam over weeks; serving = answering each question in seconds during the test.`,`ML systems`);
G(`Feature store`,`Computes features once and serves them to both training and serving, preventing training/serving skew.`,`One shared recipe used both when practicing at home and when cooking for guests — so the dish tastes the same both times.`,`ML systems`);
G(`Model drift`,`A model degrading over time as input distributions (data) or learned relationships (concept) change; needs retraining.`,`A spam filter trained years ago misses today's scams because scammers changed tactics. It needs re-teaching on fresh examples.`,`ML systems`);
G(`Embedding / vector search`,`A vector representation of data, plus nearest-neighbor retrieval over embeddings; the basis of RAG.`,`Placing every song on a giant "sounds-alike" map, then finding neighbors near a song you like to get similar ones.`,`ML systems`);
G(`RAG`,`Retrieval-Augmented Generation: retrieve relevant chunks via embeddings and inject them into an LLM's prompt.`,`An open-book exam: instead of answering from memory, the model first looks up the relevant pages, then writes its answer from them.`,`ML systems`);

GUIDE.books.push({id:"book0",title:"Clean Code",author:"Robert C. Martin · 2008",level:"Code",thesis:"Code is read far more than written, so readability is a core professional duty.",body:`<p>This walkthrough takes you through Clean Code the way the book itself unfolds: it opens with an argument for <em>why</em> clean code matters, then attacks quality one dimension at a time (names, functions, comments, formatting, errors, classes), then shows the ideas in action through real refactorings, and finishes with a checklist of smells. Read this and you'll have the working substance of the book.</p><hr class="divider"><h2><span class="h-node"></span>The opening argument: why any of this matters</h2><p>Martin starts with a claim that sounds obvious but has enormous consequences: <strong>code is read far more than it is written.</strong> When you add a feature, you spend most of your time <em>reading</em> the surrounding code to understand it well enough to change it safely. The ratio of time spent reading vs. writing is easily 10:1. So every minute you spend making code <em>writeable-fast-but-unreadable</em> is stolen from the hundreds of future minutes someone (often you) will spend reading it.</p><p>From this he draws the book's spine: <strong>making code readable is not aesthetic self-indulgence; it is the single most leveraged thing you can do for a team's long-term speed.</strong> He puts it bluntly: <em>"The only way to go fast is to go well."</em> Messy code feels fast today and quietly taxes every future change until the team grinds to a halt — the "wading through mud" experience every experienced developer recognizes. Clean code is what keeps the team moving at a sustainable pace for years.</p><p>He also introduces a moral framing: professionalism. A doctor doesn't skip hand-washing because the patient is impatient; a professional developer doesn't ship a mess because the deadline is close. You are responsible for the quality of what you produce, and "the deadline made me do it" is not an excuse a professional accepts.</p><hr class="divider"><h2><span class="h-node"></span>Names (the highest-leverage skill in the book)</h2><p>Martin argues that naming is where most readability is won or lost, because names are <em>everywhere</em> — every variable, function, class, and file is a naming decision, and a bad one misleads on every read.</p><p>His rules, with the reasoning:</p><p><strong>Use intention-revealing names.</strong> A name should answer three questions: why does this thing exist, what does it do, how is it used? His famous example: a variable <code>int d;</code> with a comment <code>// elapsed time in days</code> should simply be <code>int elapsedTimeInDays</code>. The comment becomes unnecessary because the name carries the intent. He shows a small, cryptic function full of <code>theList</code>, <code>x[0]</code>, and magic numbers, then the <em>same logic</em> with <code>gameBoard</code>, <code>cell</code>, <code>STATUS_VALUE</code>, <code>FLAGGED</code> — identical structure, but now readable. The lesson lands hard: the code didn't get smarter, the <em>names</em> did.</p><p><strong>Avoid disinformation.</strong> Don't call something <code>accountList</code> if it isn't actually a List — the reader will assume list semantics. Don't use names that vary in tiny ways (<code>XYZControllerForEfficientHandlingOfStrings</code> vs. <code>XYZControllerForEfficientStorageOfStrings</code>) — the eye can't distinguish them.</p><p><strong>Make meaningful distinctions.</strong> <code>getActiveAccount()</code>, <code>getActiveAccounts()</code>, <code>getActiveAccountInfo()</code> — a reader has no way to know which to call. Noise words like <code>Info</code>, <code>Data</code>, <code>a</code>, <code>the</code>, <code>Variable</code>, <code>Object</code> add length without meaning.</p><p><strong>Use pronounceable, searchable names.</strong> If you can't say it in a conversation ("gen-why-em-dee-hms"), it's a bad name. And single-letter names or magic numbers can't be searched for — <code>MAX_CLASSES_PER_STUDENT</code> can be grepped; <code>7</code> cannot.</p><p><strong>Class names are nouns</strong> (<code>Customer</code>, <code>Account</code>, <code>AddressParser</code>), <strong>method names are verbs</strong> (<code>postPayment</code>, <code>deletePage</code>, <code>save</code>). Pick one word per concept and stick to it — don't have <code>fetch</code>, <code>retrieve</code>, and <code>get</code> all meaning the same thing across different classes.</p><p>The deeper point: good naming is a <em>design</em> activity. When you struggle to name something, it's often because the thing does too much or its responsibility is unclear — the naming difficulty is diagnostic.</p><hr class="divider"><h2><span class="h-node"></span>Functions (the famous, most-debated chapter)</h2><p>Martin's central rules for functions:</p><p><strong>Small. Then smaller than that.</strong> He claims functions should rarely be 20 lines, and often just 3–5. His argument: a small function that does one obvious thing can be understood at a glance and named precisely.</p><p><strong>Do one thing.</strong> <em>"Functions should do one thing. They should do it well. They should do it only."</em> How do you know a function does one thing? If you can extract another function from it with a name that isn't just a restatement of its implementation, it was doing more than one thing. Another test: everything in the function should be at the <strong>same level of abstraction.</strong> A function that mixes high-level policy (<code>calculatePay</code>) with low-level string manipulation (<code>buffer.append(...)</code>) is jarring — like a paragraph that switches between strategy and typography mid-sentence.</p><p>He introduces the <strong>Stepdown Rule</strong>: code should read top-to-bottom like a narrative, each function followed by those at the next level of abstraction down, so the whole file reads as a descending sequence of "to do X, we do A, B, C; to do A, we do...".</p><p><strong>Few arguments.</strong> Zero is ideal, one or two fine, three is suspect, and more than three needs a very good reason (or a parameter object). Why? Each argument is another thing the reader must hold in their head, and multi-argument functions are hard to test (you must cover combinations). <strong>Flag arguments are especially bad</strong> — <code>render(true)</code> — because a boolean parameter openly announces the function does two things; split it into <code>renderForSuite()</code> and <code>renderForSingleTest()</code>.</p><p><strong>No side effects.</strong> A function named <code>checkPassword</code> that <em>also</em> initializes the session is lying — it has a hidden side effect that couples callers to an order of operations. The name promises one thing; the body does another. This connects to <strong>Command-Query Separation</strong>: a function should either <em>do</em> something (a command that changes state, returns nothing) or <em>answer</em> something (a query that returns a value without changing state) — never both. <code>if (set("username", "bob"))</code> is baffling: is it asking whether "username" is set to "bob", or setting it and reporting success?</p><p><strong>DRY — don't repeat yourself.</strong> Duplication is, in his words, the root of much evil in software: a rule change now must be found and applied in every copy, and the copies drift. Extract the shared logic to one authoritative place.</p><p><strong>Prefer exceptions to returned error codes</strong>, and <strong>extract try/catch bodies into their own functions</strong> so error handling is one thing and the happy path stays clean.</p><p>The honest tension (which the book underplays and later authors attack): taken to an extreme, "tiny functions everywhere" can <em>scatter</em> a single coherent idea across a dozen named fragments, forcing the reader to jump around to reassemble it. Hold the <em>spirit</em> — one clear responsibility per function, consistent abstraction level — more tightly than the literal line count.</p><hr class="divider"><h2><span class="h-node"></span>Comments (a more subtle chapter than its reputation)</h2><p>Martin's provocative headline is <em>"Don't comment bad code — rewrite it,"</em> and he's often caricatured as "comments are bad." His actual position is sharper: <strong>a comment is a failure to express yourself in code, and most comments are compensating for unclear code.</strong> The best comment is the one you made unnecessary by choosing a better name or extracting a well-named function.</p><p>But he explicitly catalogs <strong>good comments</strong> that <em>should</em> exist:</p><ul><li><strong>Legal comments</strong> (copyright, license).</li><li><strong>Informative comments</strong> clarifying something not obvious (the format a regex matches).</li><li><strong>Explanations of intent</strong> — <em>why</em> a decision was made, which the code cannot express.</li><li><strong>Warnings of consequences</strong> ("don't run this test unless you have hours to spare").</li><li><strong>TODOs</strong> and <strong>amplification</strong> of something whose importance isn't obvious.</li><li><strong>Public API documentation</strong> (Javadocs).</li></ul><p>And <strong>bad comments</strong> to eliminate:</p><ul><li><strong>Redundant</strong> comments that just restate the code (<code>i++; // increment i</code>).</li><li><strong>Misleading</strong> comments (worse than none — they lie as the code changes).</li><li><strong>Mandated</strong> comments (a Javadoc on every trivial getter adds noise).</li><li><strong>Journal</strong> comments (change logs — that's what version control is for).</li><li><strong>Commented-out code</strong> — the single worst offender. Delete it. Everyone is afraid to remove it "in case someone needs it," so it accumulates like sediment. Version control remembers; your file shouldn't.</li></ul><p>The rule to carry away: <strong>comments should explain what the code cannot — intent, rationale, warnings — never what the code already says.</strong></p><hr class="divider"><h2><span class="h-node"></span>Formatting, objects vs. data structures, error handling, boundaries</h2><p><strong>Formatting</strong> is communication. Vertical openness (blank lines between concepts), keeping related things close, small files that read top-to-bottom, consistent team conventions — these reduce the friction of reading. The team's style matters more than which style; agree and automate it.</p><p><strong>Objects vs. data structures</strong> draws a distinction people miss: <em>objects</em> hide their data and expose behavior; <em>data structures</em> expose their data and have no meaningful behavior. Mixing them (the "hybrid" — half-exposed data with some methods) gets the worst of both. This leads to the <strong>Law of Demeter</strong> ("don't talk to strangers"): a method should only call methods on its own object, its parameters, objects it creates, and its direct fields — not go rummaging deep through chains like <code>ctxt.getOptions().getScratchDir().getAbsolutePath()</code> (a "train wreck" that couples you to an entire object graph).</p><p><strong>Error handling</strong> should be clean and separable: use exceptions, not error codes (error codes force callers into nested checks that tangle the happy path); <strong>don't return <code>null</code></strong> and <strong>don't pass <code>null</code></strong> — nulls propagate and explode far from their origin (the "billion-dollar mistake"); prefer returning empty collections or using special-case objects. Write the try-catch-finally <em>first</em> when you know code can throw, so you design around the failure from the start.</p><p><strong>Boundaries</strong> — wrap third-party libraries behind your own interfaces so their design (and future breaking changes) don't leak through your whole codebase. Learn a new library by writing <strong>"learning tests"</strong> that exercise your understanding of it; these also alert you when an upgrade changes its behavior.</p><hr class="divider"><h2><span class="h-node"></span>Classes and the case for small, focused classes</h2><p>Classes should be <strong>small</strong> — and "small" is measured in <em>responsibilities</em>, not lines. The <strong>Single Responsibility Principle</strong> says a class should have one reason to change. Martin's example: a <code>SuperDashboard</code> class that both manages GUI components <em>and</em> tracks the software's version number has two entirely unrelated reasons to change; split the version tracking into its own <code>Version</code> class.</p><p>He argues most systems are afflicted by a few enormous "God classes" that do everything, when they should be many small classes each doing one thing — and that developers resist this because "many small classes" feels like more moving parts. But a system of small, well-named, single-purpose classes is far easier to navigate than a handful of monsters, because you can reason about each piece in isolation and the names form a vocabulary. <strong>High cohesion</strong> (a class's methods and variables all belong together, working on the same data) is the goal; when cohesion drops, that's the signal to split.</p><hr class="divider"><h2><span class="h-node"></span>Tests deserve the same care as production code</h2><p>The chapter on unit tests makes a point many developers resist: <strong>test code is not second-class.</strong> Dirty tests are arguably worse than no tests, because they rot, break on every change, and get abandoned — and once the tests are gone, you lose the very thing that lets you change production code without fear. <em>Tests are what keep your production code flexible</em>; they're the safety net that makes refactoring possible.</p><p>His <strong>F.I.R.S.T.</strong> properties of good tests:</p><ul><li><strong>Fast</strong> — slow tests don't get run.</li><li><strong>Independent</strong> — tests don't depend on each other's order or state.</li><li><strong>Repeatable</strong> — same result in any environment, offline, anytime.</li><li><strong>Self-validating</strong> — a boolean pass/fail, not a log you must eyeball.</li><li><strong>Timely</strong> — written just before the production code they cover (TDD).</li></ul><p>And <strong>one concept per test</strong> — keep each test focused so a failure points to a specific cause.</p><hr class="divider"><h2><span class="h-node"></span>The case studies (the part you shouldn't skip)</h2><p>The book's back third is Martin taking real, ugly code and cleaning it in front of you, step by step: an <code>Args</code> command-line parser, a chunk of JUnit, a date library. These chapters are tedious to some readers, but they're where the abstract rules become concrete muscle memory. You <em>watch</em> a 300-line mess become a set of small, clearly-named, single-responsibility classes and functions, with each transformation justified by a principle from earlier chapters. The meta-lesson: <strong>clean code is rarely written clean the first time; it's written working, then cleaned</strong> — which is exactly the bridge to Fowler's <em>Refactoring</em> (06e).</p><hr class="divider"><h2><span class="h-node"></span>The smells-and-heuristics catalog (your review checklist)</h2><p>The final chapter is a numbered list (G1–G36 for general smells, plus categories for names, functions, comments, tests) you can literally use in code review. A representative sampling of the "general" smells:</p><ul><li><strong>Rigidity / fragility:</strong> a change forces a cascade of other changes, or breaks things in unrelated places.</li><li><strong>Duplication</strong> — the same knowledge expressed in multiple places.</li><li><strong>Dead code</strong> — code that's never executed; delete it.</li><li><strong>Vertical separation</strong> — variables and functions defined far from where they're used.</li><li><strong>Inconsistency</strong> — do similar things the same way.</li><li><strong>Feature envy</strong> — a method more interested in another class's data than its own (move it there).</li><li><strong>Obscured intent, magic numbers, misplaced responsibility, functions that do too much.</strong></li></ul><p>The value of the catalog is that it turns vague unease ("this code feels bad") into a named, discussable problem ("that's feature envy") — the same gift that Design Patterns and Refactoring give: <strong>shared vocabulary makes design improvable in conversation.</strong></p><hr class="divider"><h2><span class="h-node"></span>What to take away, and how to hold it</h2><p>The durable core of Clean Code:</p><ol><li><strong>Readability is a professional duty</strong>, because reading dominates writing.</li><li><strong>Names carry most of the meaning</strong> — invest in intention-revealing, searchable, distinct names.</li><li><strong>Functions and classes should each do one thing</strong> at a consistent level of abstraction.</li><li><strong>Comments explain intent the code can't</strong> — and are a red flag that your code might need to be clearer.</li><li><strong>Tests keep production code changeable</strong> and deserve equal care.</li><li><strong>Leave the code cleaner than you found it</strong> (the Boy Scout Rule) — improvement is continuous, not a project.</li></ol><p>And the crucial <em>calibration</em>, which Ousterhout's <em>A Philosophy of Software Design</em> (06d) supplies: apply "small functions" and "few comments" in service of <strong>clarity</strong>, not as ends in themselves. When splitting a function into five makes the idea harder to follow, or when a comment would save the reader real effort, clarity wins over the rule. Read Clean Code for the mindset and the vocabulary; then read 06d immediately as the essential second opinion.</p><p><strong>Apply it this week:</strong> take your ugliest function, rename its three worst variables, extract two well-named helpers so the top level reads like a sentence, delete one commented-out block, and one redundant comment. Near-zero risk, immediate clarity.</p>`});
GUIDE.books.push({id:"book1",title:"The Pragmatic Programmer",author:"Hunt & Thomas · 1999 / 2019",level:"Craft",thesis:"Software development is a craft with learnable habits of thought that transcend any language.",body:`<p>The Pragmatic Programmer isn't structured as an argument that builds to a conclusion; it's a collection of about a hundred short, self-contained tips, grouped into themes, that together form a philosophy of professional software development. Reading it feels like a series of short conversations with a wise senior colleague. This walkthrough follows the book's themes and teaches the ideas that matter most, with the reasoning and examples intact.</p><p>The unifying spirit: <strong>be a pragmatist.</strong> Not a purist chasing theoretical perfection, not a hacker slapping things together — someone who takes responsibility, thinks about trade-offs, and cares about the craft while shipping real software.</p><hr class="divider"><h2><span class="h-node"></span>A Pragmatic Philosophy: taking responsibility</h2><p>The book opens with attitude, because attitude precedes technique.</p><p><strong>It's your life, and you own your work.</strong> Pragmatic programmers take responsibility for what they build. When something goes wrong, the response is <em>"here are the options for fixing it,"</em> not <em>"it's not my fault"</em> or a lame excuse. Before you tell someone why something can't be done, run the excuse past yourself — would it sound convincing, or would you see through it?</p><p><strong>Software entropy and broken windows.</strong> The book's most famous metaphor, borrowed from criminology: a building with one broken window left unrepaired soon has many — the visible neglect signals that no one cares, and decay accelerates. Software rots the same way. One hacky workaround, one commented-out mess, one "we'll fix it later" left in place tells everyone that low quality is acceptable here, and the codebase slides. <strong>Don't live with broken windows.</strong> Fix small problems the moment you see them, or at least visibly board them up (a TODO, a failing test) so they're not mistaken for acceptable. This is the cultural counterpart to Clean Code's Boy Scout Rule.</p><p><strong>Stone soup and the boiled frog.</strong> Two paired fables. In <em>stone soup</em>, villagers who wouldn't share food each contribute one ingredient once they see a pot already started — so if you can't get a big change approved, start something small and good, and let others join. The <em>boiled frog</em> (a frog that won't jump out of slowly heated water) warns of the opposite failure: gradual degradation you stop noticing. Keep an eye on the big picture; disasters usually arrive as an accumulation of small unnoticed changes, not one dramatic event.</p><p><strong>Good-enough software.</strong> Pragmatism means knowing when to stop polishing. Involve users in the trade-off of scope vs. quality vs. time; "good enough" is not "shoddy," it's <em>fit for purpose and shipped</em>, rather than perfect and late. Know when to stop — over-embellishing working software can ruin it.</p><p><strong>Your knowledge portfolio.</strong> Treat what you know like a financial portfolio: invest regularly, diversify (learn different languages and paradigms), manage risk (don't bet everything on one technology), and review. Concretely: learn a new language every year, read technical books, take courses, stay current. Your value as a developer comes from knowledge that must be continually renewed, because the field moves.</p><hr class="divider"><h2><span class="h-node"></span>A Pragmatic Approach: the design ideas that made the book famous</h2><p>This section holds the book's most-cited technical principles.</p><p><strong>DRY — Don't Repeat Yourself.</strong> Stated precisely: <em>"Every piece of knowledge must have a single, unambiguous, authoritative representation within a system."</em> The word that matters is <strong>knowledge</strong>. DRY is <em>not</em> about avoiding text that looks similar; it's about not duplicating a <em>decision</em> or <em>rule</em> so that a change to that rule requires edits in multiple places (where you'll inevitably miss one, and the copies will diverge). The authors distinguish kinds of duplication: <strong>imposed</strong> (you feel forced into it — usually solvable with code generation or better design), <strong>inadvertent</strong> (you didn't realize two things encoded the same knowledge), <strong>impatient</strong> (the lazy copy-paste), and <strong>inter-developer</strong> (two people implement the same thing). The subtle, crucial caveat — which the book is careful about and which the industry constantly gets wrong — is that <strong>two pieces of code that merely look alike but represent <em>different</em> knowledge are not a DRY violation.</strong> Merging them creates a false coupling that will hurt when one rule changes and the other doesn't. (Sandi Metz's corollary: "duplication is far cheaper than the wrong abstraction.")</p><p><strong>Orthogonality.</strong> Two things are orthogonal if changing one has no effect on the other. Design components — modules, layers, services — so they're independent: a change to the database code shouldn't ripple into the UI; a change to one feature shouldn't break an unrelated one. The payoffs are concrete: orthogonal systems are easier to <strong>test</strong> (isolated pieces), <strong>reuse</strong> (self-contained), and <strong>reason about</strong> (localized risk — a bug or a change is confined). The authors give the vivid image of a helicopter, where every control affects every other, as the nightmare of <em>non</em>-orthogonal design. This is loose coupling and high cohesion described in plain language, a decade before "microservices" made the concept fashionable.</p><p><strong>Reversibility.</strong> Because requirements and technology change, avoid decisions that are hard to reverse. Don't wire assumptions ("we'll always use this database," "this will only ever run in one country") deep into the code. Hide such decisions behind abstractions so that when — not if — they change, the blast radius is small. This is the same instinct that later powers Clean Architecture's "the database is a detail."</p><p><strong>Tracer bullets vs. prototypes.</strong> A distinction worth internalizing precisely, because confusing the two causes disasters. <strong>Tracer bullet development</strong> means building a thin but <em>real</em> end-to-end slice of the system first — a minimal path that runs from user input through the layers to output — then fleshing it out. Like tracer rounds that light up the actual trajectory, it gives you immediate feedback on whether the whole architecture <em>lines up</em>, and you always have something that runs and can be demoed. The tracer code is <em>kept and built upon</em>. A <strong>prototype</strong>, by contrast, is throwaway code written to answer one specific question ("will this UI approach work?", "is this algorithm fast enough?") and then <strong>discarded</strong> — its only product is the lesson learned. The catastrophe is shipping a prototype as if it were the real thing: you keep code that was never meant to survive.</p><p><strong>Domain languages and estimating</strong> round out the section: consider expressing solutions in the vocabulary of the problem domain (mini-languages, DSLs), and learn to estimate by giving ranges, refining them, and tracking how your estimates compare to reality so you improve.</p><hr class="divider"><h2><span class="h-node"></span>The Basic Tools: sharpen your instruments</h2><p>A carpenter masters their tools; so should you.</p><p><strong>The power of plain text.</strong> Keep knowledge in plain text, not proprietary binary formats. Plain text is human-readable, greppable, diffable, testable, and outlives the tools that made it. It insures your work against obsolete applications.</p><p><strong>Master your shell and editor.</strong> The command line composes small tools into powerful pipelines in ways GUIs can't. Become fluent in one editor to the point that editing is thoughtless — configure it, learn its shortcuts, make it an extension of your hands.</p><p><strong>Version control everything</strong>, always — and not just code: configuration, documentation, infrastructure. VCS is a time machine and a collaboration backbone.</p><p><strong>Debugging as a discipline.</strong> Debug the <em>problem</em>, not the blame — a defect is not a moral failing, it's a puzzle. Don't panic; the bug is almost certainly in your code, not the compiler or the OS (resist "select isn't broken" — the assumption that the fault lies in someone else's well-tested code is nearly always wrong). Gather data, reproduce reliably, read the actual error message, and use binary search to narrow the cause. <strong>Rubber duck debugging</strong>: explaining the problem aloud, line by line, to an inanimate object (or a patient colleague) very often surfaces the flaw, because articulating it forces you to confront assumptions you'd been skipping.</p><p><strong>Don't use manual procedures.</strong> If you do something more than once, automate it. Humans are bad at repeating steps reliably; scripts aren't. This foreshadows modern CI/CD, infrastructure-as-code, and reproducible builds.</p><hr class="divider"><h2><span class="h-node"></span>Pragmatic Paranoia: you can't write perfect software</h2><p>The premise of this section: <em>you can't write perfect software</em>, so build in defenses.</p><p><strong>Design by Contract (DbC).</strong> Specify, precisely, what each routine promises and requires: <strong>preconditions</strong> (what must be true for it to be called), <strong>postconditions</strong> (what it guarantees on return), and <strong>invariants</strong> (what stays true throughout). Making these explicit — even as assertions or documented expectations — catches violations early and clarifies whose fault a failure is. A routine should do no more and no less than it claims.</p><p><strong>Crash early.</strong> A dead program does far less damage than a crippled one limping along corrupting data. When something happens that "can't happen," don't try to soldier on — fail fast, loudly, close to the fault, before the bad state spreads. <strong>Use assertions</strong> to state things you believe can never occur; if the impossible happens, you want to know immediately, at the source.</p><p><strong>Decoupling and the Law of Demeter.</strong> Minimize what modules know about each other. The Law of Demeter for functions: a method should only call methods belonging to itself, its parameters, objects it creates, and its direct component objects — it shouldn't reach through a chain of objects (<code>a.getB().getC().doSomething()</code>), because that couples it to the entire structure of <code>a</code>'s internals. Loose coupling makes change safe. <em>"Don't talk to strangers."</em></p><p><strong>How to balance resources.</strong> Whoever allocates a resource should free it; finish what you start; nest allocations so cleanup happens in reverse order. Applies to memory, files, locks, connections.</p><hr class="divider"><h2><span class="h-node"></span>Bend or Break, and While You Are Coding</h2><p><strong>Decoupling and configuration.</strong> Keep code flexible: use metadata and configuration to drive behavior rather than hard-coding it, so you can change how the system behaves without changing (and re-deploying) code. Prefer temporal decoupling (via events, queues) where it removes rigid ordering assumptions.</p><p><strong>Don't program by coincidence.</strong> This is one of the book's most important warnings. Programming by coincidence is when your code <em>seems</em> to work but you don't actually understand <em>why</em> — you tried things until the symptom went away. Such code is a minefield: it works by accident, and the accident won't hold. Program <em>deliberately</em>: know why each line works, rely on documented behavior rather than observed-but-unspecified behavior, and be able to explain your code to someone else. If you can't explain why it works, you don't yet understand it — and untested assumptions are where the worst bugs hide.</p><p><strong>Refactor early, refactor often.</strong> Software is grown, not built. When you see code that's poorly structured for the change you need, restructure it (see Fowler, 06e) rather than piling on. Treat refactoring as continuous gardening, not a special event.</p><p><strong>Test to find bugs, and test ruthlessly.</strong> Testing is not about proving code correct — it's about finding the places it's wrong. Write tests, automate them, and test boundary conditions especially. Code that isn't tested doesn't work until proven otherwise. "Find bugs once" — when a bug slips through, add a test so that exact bug can never recur silently.</p><p><strong>Don't gather requirements — dig for them.</strong> Requirements rarely lie on the surface; they're buried under assumptions and politics. Work <em>with</em> users, observe what they actually do (not just what they say), and capture the underlying need, not the surface request.</p><hr class="divider"><h2><span class="h-node"></span>Pragmatic Projects: delighting users</h2><p>The closing section scales the philosophy to teams and delivery.</p><p><strong>Pragmatic teams</strong> apply the same principles collectively: no broken windows tolerated as a group, orthogonal team organization (well-defined responsibilities, clean interfaces between people), ruthless and continuous testing, and clear communication.</p><p><strong>Ubiquitous automation</strong> — automate builds, tests, and deployments so they're reliable and repeatable; humans should make decisions, not perform rote procedures.</p><p><strong>Delight users; don't just deliver code.</strong> The goal isn't to satisfy the letter of a requirements document — it's to meet the user's real underlying needs and exceed the
