<script>
GUIDE.chapters.push({
id:'ch01',num:'01',group:'Foundations',title:'Fundamentals',
lead:'The core concepts every design decision depends on. Master these and the rest of the guide clicks into place — because every later choice is an application of the trade-offs defined here.',
body:`
<div class="callout key"><div class="callout-t">◆ The one idea</div>Every design decision is a <strong>trade-off</strong>. There is rarely a universally "best" option — only the best fit for a specific set of requirements. The whole craft is learning to see the trade-offs and choose deliberately.</div>

<h2><span class="h-node"></span>Scalability</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Think of a busy restaurant. <strong>Scaling up</strong> is hiring one super-fast chef and buying a bigger oven — simple, but there is a ceiling, and if that chef calls in sick you are closed. <strong>Scaling out</strong> is opening more identical food trucks — practically no limit, and if one breaks down the others keep serving. The trick that makes the food-truck approach work is that <em>any</em> truck can serve <em>any</em> customer (that is what "stateless" means).</div>
<p>Scalability is a system's ability to handle growing load by adding resources. There are two directions.</p>
<p><strong>Vertical scaling (scale up)</strong> means a bigger machine — more CPU, RAM, disk. It's simple and needs no code changes, but it hits a hard ceiling (the biggest machine money can buy) and leaves you with a single point of failure.</p>
<p><strong>Horizontal scaling (scale out)</strong> means more machines working together. It's effectively limitless and inherently redundant, but it demands distributed-systems design: load balancing, data partitioning, and — the crucial enabler — <strong>statelessness</strong>. A stateless service keeps no per-user state in its own memory, so any instance can serve any request and you can add or remove instances freely. Push state to a shared store (database, cache) and the web tier becomes trivially scalable.</p>

<h2><span class="h-node"></span>Availability</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>"Nines" are just a way of saying <em>how little downtime</em>. Four nines (99.99%) means the site may be down only about one lunch break — 52 minutes — in an entire year. Each extra nine is far harder and more expensive, so you aim for what the business actually needs, not the biggest number.</div>
<p>Availability is the fraction of time the system is up and serving, measured in "nines." Each nine costs exponentially more to achieve.</p>
<div class="tbl-wrap"><table><thead><tr><th>Availability</th><th>Downtime / year</th><th>Feel</th></tr></thead><tbody>
<tr><td>99% (two nines)</td><td>~3.65 days</td><td>Hobby project</td></tr>
<tr><td>99.9% (three nines)</td><td>~8.8 hours</td><td>Typical SaaS</td></tr>
<tr><td>99.99% (four nines)</td><td>~52 minutes</td><td>Serious product</td></tr>
<tr><td>99.999% (five nines)</td><td>~5 minutes</td><td>Critical infrastructure</td></tr>
</tbody></table></div>
<p>Note that <strong>reliability</strong> (doing the correct thing) is distinct from availability (being up) — a system can be available but returning wrong answers. Both matter.</p>

<h2><span class="h-node"></span>Latency &amp; throughput</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Picture a highway. <strong>Latency</strong> is how long your one trip takes; <strong>throughput</strong> is how many cars pass a point each minute. A jammed ten-lane road moves lots of cars (high throughput) while your own trip crawls (high latency) — which is why we track both, and why "fast on average" can still feel slow for many people.</div>
<div class="figure"><svg viewBox="0 0 660 220" role="img" aria-label="Latency numbers every engineer should know"><text x="0" y="12" font-size="11" fill="#697285" font-family="monospace">LOG SCALE · each gridline ≈ 100× slower</text><text x="184" y="33" text-anchor="end" font-size="12" fill="#E7EBF2">L1 cache reference</text><rect x="196" y="20" width="6" height="18" rx="3" fill="#2DD4BF"/><text x="210" y="33" font-size="11" fill="#9BA6B7" font-family="monospace">1 ns</text><text x="184" y="63" text-anchor="end" font-size="12" fill="#E7EBF2">Main memory (RAM)</text><rect x="196" y="50" width="90.35294117647058" height="18" rx="3" fill="#2DD4BF"/><text x="294.3529411764706" y="63" font-size="11" fill="#9BA6B7" font-family="monospace">100 ns</text><text x="184" y="93" text-anchor="end" font-size="12" fill="#E7EBF2">SSD random read</text><rect x="196" y="80" width="225.88235294117646" height="18" rx="3" fill="#5D6BEC"/><text x="429.88235294117646" y="93" font-size="11" fill="#9BA6B7" font-family="monospace">100 µs</text><text x="184" y="123" text-anchor="end" font-size="12" fill="#E7EBF2">Datacenter round trip</text><rect x="196" y="110" width="257.50588235294117" height="18" rx="3" fill="#5D6BEC"/><text x="461.50588235294117" y="123" font-size="11" fill="#9BA6B7" font-family="monospace">500 µs</text><text x="184" y="153" text-anchor="end" font-size="12" fill="#E7EBF2">Rotational disk seek</text><rect x="196" y="140" width="316.2352941176471" height="18" rx="3" fill="#E8975A"/><text x="520.2352941176471" y="153" font-size="11" fill="#9BA6B7" font-family="monospace">10 ms</text><text x="184" y="183" text-anchor="end" font-size="12" fill="#E7EBF2">Packet CA → Europe</text><rect x="196" y="170" width="369.54352941176467" height="18" rx="3" fill="#E8975A"/><text x="573.5435294117647" y="183" font-size="11" fill="#9BA6B7" font-family="monospace">150 ms</text></svg><div class="figure-cap"><b>Know your latency numbers.</b> Memory is ~1000× faster than SSD, and a cross-continent round trip (~150&nbsp;ms) is ~100,000× slower than memory. This is <em>why</em> we cache, keep data in RAM, and place it near users.</div></div>
<p><strong>Latency</strong> is how long one request takes; <strong>throughput</strong> is how many you handle per second. They're related but independent — you can have high throughput with high latency (a batch pipeline) or low latency with low throughput.</p>
<div class="callout note"><div class="callout-t">◆ Measure percentiles, not averages</div>Always describe latency with percentiles (p50, p95, p99), never the average. Averages hide the slow tail. At scale, p99 represents thousands of your heaviest, most engaged users — and tail latency <em>compounds</em>: if a page makes 10 backend calls and each has a 1% chance of being slow, ~10% of pages are slow.</div>
<p>Some latency numbers worth internalizing: reading from memory is ~100 nanoseconds; from SSD, ~100 microseconds; a same-datacenter round trip, ~500 microseconds; a cross-continent round trip, ~100 milliseconds. Memory is roughly a million times faster than a network round trip across the world — which is <em>why</em> caching and locality matter so much.</p>

<h2><span class="h-node"></span>Consistency, CAP, and PACELC</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Imagine two cash machines that suddenly cannot talk to each other. Either they <strong>refuse</strong> withdrawals until they reconnect (staying correct) or they keep <strong>dispensing</strong> cash and risk letting someone overdraw (staying open). While they are disconnected you cannot have both — that is CAP. The right choice is per-feature: a bank balance refuses; a "likes" counter happily keeps going.</div>
<div class="figure"><svg viewBox="0 0 660 300" role="img" aria-label="CAP theorem triangle"><polygon points="330,40 90,250 570,250" fill="none" stroke="#343D4C" stroke-width="1.5"/><circle cx="330" cy="40" r="6" fill="#5D6BEC"/><text x="330" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#E7EBF2">C</text><text x="330" y="70" text-anchor="middle" font-size="12" fill="#9BA6B7">Consistency</text><circle cx="90" cy="250" r="6" fill="#2DD4BF"/><text x="78" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#E7EBF2">A</text><text x="120" y="286" text-anchor="middle" font-size="12" fill="#9BA6B7">Availability</text><circle cx="570" cy="250" r="6" fill="#E8975A"/><text x="582" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#E7EBF2">P</text><text x="540" y="286" text-anchor="middle" font-size="12" fill="#9BA6B7">Partition tolerance</text><text x="330" y="150" text-anchor="middle" font-size="13" fill="#9AA6FF" font-weight="600">When P happens,</text><text x="330" y="170" text-anchor="middle" font-size="13" fill="#9AA6FF" font-weight="600">you must pick C or A</text><line x1="210" y1="200" x2="255" y2="175" stroke="#697285" stroke-width="1"/><line x1="450" y1="200" x2="405" y2="175" stroke="#697285" stroke-width="1"/></svg><div class="figure-cap"><b>CAP, honestly.</b> Networks partition, so <em>P is not optional</em>. The real choice is per-operation: during a partition, either refuse to answer to stay <b>consistent</b>, or answer with possibly-stale data to stay <b>available</b>.</div></div>
<p>When data lives on multiple machines, <strong>consistency</strong> describes what a reader sees after a write. Under <strong>strong consistency</strong>, every read reflects the latest write. Under <strong>eventual consistency</strong>, replicas converge "soon" and reads may be briefly stale.</p>
<p>The <strong>CAP theorem</strong> states that during a network <em>partition</em> (some nodes can't talk to others), you must choose: stay <strong>Consistent</strong> (refuse or error rather than serve stale data) or stay <strong>Available</strong> (answer, possibly with stale data). You cannot have both while partitioned.</p>
<div class="callout trade"><div class="callout-t">◆ The nuance CAP hides</div><strong>PACELC</strong> completes the picture: during a Partition, choose A or C — <em>Else</em> (normal operation, no partition), you still trade Latency versus Consistency on every request. Waiting for all replicas to agree is slower; answering from one is faster but riskier. So consistency-vs-latency is a constant dial, not just a failure-mode choice.</div>
<p>Crucially, the right choice differs <em>per feature within one app</em>. A bank balance needs strong consistency (C). A YouTube view counter is fine eventually consistent (A) — a slightly stale count beats an error nobody wanted. Learning to make this call per-feature is a core design skill.</p>

<h2><span class="h-node"></span>Back-of-the-envelope estimation</h2>
<div class="callout key"><div class="callout-t">◆ Worked example</div>Say a photo app has 50M daily users, each <em>posting</em> 2 photos and <em>viewing</em> 200. Views = 50M × 200 ÷ 100,000 = <strong>100,000/second</strong>. Posts = 50M × 2 ÷ 100,000 = <strong>1,000/second</strong>. That is a <strong>100-to-1 read-to-write ratio</strong>, which immediately tells you: obsess over caching and a CDN, and the "writing" path is comparatively tiny. Storage: 100M new photos/day × a few MB each is hundreds of TB/day, so photos go to object storage, never the database. Notice how three rough numbers already decided the whole shape of the system.</div>
<div class="callout note"><div class="callout-t">◆ In plain English</div>You are not trying to be exact — you are checking whether you are building for a village or a city. Rounding hard (a day is about 100,000 seconds; peak is a few times the average) is enough to reveal the <em>shape</em> of the system: is it read-heavy? media-heavy? write-heavy? That shape decides the architecture before you draw a single box.</div>
<p>Before designing anything, size it — the numbers tell you what kind of system you're building. A design for 1,000 users and one for 100 million are fundamentally different. Round aggressively.</p>
<div class="schematic"><span class="sch-label">rules of thumb</span><pre>1 day        ≈ 100,000 seconds (10^5)
Peak load    ≈ 2–5× average
1 char       ≈ 1 byte      1 KB ≈ 1,000 chars
Read:write ratios drive the design (high reads → cache/CDN/fan-out)

Example: 50M DAU, 2 writes + 200 reads each per day
  writes  = 50M × 2   / 10^5 = 1,000/s  (peak ~3–5k)
  reads   = 50M × 200 / 10^5 = 100,000/s   → read:write = 100:1
  Verdict: heavily read-optimized. Cache + CDN dominate the design.</pre></div>

<h2><span class="h-node"></span>Idempotency</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>It is the coat-check ticket idea: handing your ticket in twice does not get you two coats. An <strong>idempotent</strong> action can be safely repeated with no extra effect — which is exactly what makes it safe to retry a request after a timeout (the number-one cause of accidental double-charges).</div>
<div class="figure"><svg viewBox="0 0 660 200" role="img" aria-label="Idempotency key preventing duplicate charges"><rect x="30" y="80" width="120" height="44" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="90" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Client</text><rect x="490" y="80" width="140" height="44" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="560" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Server</text><text x="560" y="118" text-anchor="middle" font-size="10" fill="#9BA6B7">records key + result</text><line x1="150" y1="66" x2="482" y2="66" stroke="#2DD4BF" stroke-width="1.5"/><polygon points="482,62 490,66 482,70" fill="#2DD4BF"/><text x="320" y="58" text-anchor="middle" font-size="11" fill="#9BA6B7">charge · key=abc123  →  executes once</text><line x1="490" y1="150" x2="142" y2="150" stroke="#E8975A" stroke-width="1.5"/><polygon points="142,146 150,150 142,154" fill="#E8975A"/><text x="320" y="140" text-anchor="middle" font-size="11" fill="#9BA6B7">timeout? retry · key=abc123</text><text x="320" y="185" text-anchor="middle" font-size="11" fill="#9AA6FF" font-weight="600">← same key → returns stored result, no second charge</text></svg><div class="figure-cap"><b>Idempotency makes retries safe.</b> The client sends a unique key; the server executes once and returns the stored result on any repeat — so a network retry can't double-charge. Table stakes for anything touching money.</div></div>
<p>Networks are unreliable, so clients retry — and a retry must not cause a second effect. An operation is <strong>idempotent</strong> if doing it twice equals doing it once. Implement it with an <strong>idempotency key</strong>: the client sends a unique ID with a mutating request; the server records the key with the first result and, on seeing it again, returns the stored result instead of re-executing. This single mechanism is what makes safe retries — and correct payments — possible.</p>

<h2><span class="h-node"></span>Fault tolerance</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Assume every part will eventually break — the way you fit smoke detectors not because you expect a fire, but because one is always possible. The goal is not zero failures (impossible); it is making sure no <em>single</em> failure can take the whole system down. That means redundancy, timeouts on every call, and failing over automatically.</div>
<p>You can't prevent faults, so you tolerate them. The toolkit: <strong>redundancy</strong> (duplicate components), <strong>failover</strong> (auto-switch to a healthy replica), <strong>health checks</strong> (remove sick nodes from rotation), <strong>timeouts</strong> (never wait forever), <strong>retries with exponential backoff and jitter</strong> (avoid retry storms), <strong>circuit breakers</strong> (stop calling a failing dependency and fail fast), and <strong>bulkheads</strong> (isolate resource pools so one slow dependency can't sink everything). The mindset: assume every component will eventually fail, and design so no single failure is catastrophic.</p>

<div class="callout key"><div class="callout-t">◆ Self-check</div>Can you explain vertical vs. horizontal scaling and why statelessness matters? Why p99 over average? State CAP in one sentence and pick C-or-A for three different features. Estimate the QPS and storage for a photo-sharing app. What does an idempotency key prevent?</div>
`});

lead:'The catalog of approaches — both the high-level architectural styles for structuring whole systems and the code-level methods for structuring software. "How should I design this?" has many answers; this is the menu.',
body:`
<p>"Design" spans two levels. <strong>System design</strong> (architecture, HLD) decides how a whole system is structured — which services exist, how they talk, where data lives. <strong>Software design</strong> (LLD) decides how the code inside a component is structured. This chapter surveys both.</p>

<h2><span class="h-node"></span>Part A — Architectural styles</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>This part is about how you slice a whole system into pieces — one big program (a <strong>monolith</strong>), or many small independent services (<strong>microservices</strong>), and everything in between. The headline lesson: start simple, and split into services only when a real, specific problem forces you to — usually many teams needing to ship without waiting on each other.</div>
<div class="figure"><svg viewBox="0 0 660 170" role="img" aria-label="Monolith to microservices spectrum"><rect x="20" y="40" width="180" height="56" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="110" y="62" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Monolith</text><text x="110" y="78" text-anchor="middle" font-size="10" fill="#9BA6B7">one deployable</text><rect x="240" y="40" width="180" height="56" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="330" y="62" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Modular monolith</text><text x="330" y="78" text-anchor="middle" font-size="10" fill="#9BA6B7">internal boundaries</text><rect x="460" y="40" width="180" height="56" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="550" y="62" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Microservices</text><text x="550" y="78" text-anchor="middle" font-size="10" fill="#9BA6B7">independently deployable</text><line x1="200" y1="68" x2="232" y2="68" stroke="#697285" stroke-width="1.5"/><polygon points="232,64 240,68 232,72" fill="#697285"/><line x1="420" y1="68" x2="452" y2="68" stroke="#697285" stroke-width="1.5"/><polygon points="452,64 460,68 452,72" fill="#697285"/><text x="20" y="122" font-size="11" fill="#9BA6B7">simpler · easy transactions</text><text x="330" y="140" text-anchor="middle" font-size="11.5" fill="#9AA6FF" font-weight="600">← the sensible default for new systems · split only on real, named pain →</text><text x="640" y="122" text-anchor="end" font-size="11" fill="#9BA6B7">team autonomy · high ops cost</text></svg><div class="figure-cap"><b>A spectrum, not a binary.</b> Start at the modular monolith — monolith simplicity with clean internal boundaries — and extract services only when a boundary earns its cost (usually team autonomy).</div></div>
<h3>Monolith</h3>
<p>The whole application as one deployable unit. Simplest to build, test, deploy, and reason about; one codebase, one process, easy transactions. It scales as a whole (you replicate the entire app), and past a certain team size, everyone contending over one codebase slows delivery.</p>
<h3>Modular monolith — the recommended default</h3>
<div class="callout key"><div class="callout-t">◆ Start here</div>For most new systems, build a <strong>modular monolith</strong>: a single deployable, but internally divided into strict modules that communicate only through defined interfaces and never touch each other's data directly. You get a monolith's operational simplicity now, plus the option to extract a module into a service later with minimal surgery. Don't reach for microservices until you feel a specific pain.</div>
<h3>Microservices</h3>
<p>Small, independently deployable services, each owning its own data and modeled around a business capability. The <em>real</em> reason to adopt them is organizational — letting many teams ship in parallel without blocking each other — not performance (they're usually slower, since calls become network hops). The litmus test is <strong>independent deployability</strong>: if you can't deploy one service without deploying others, you've built a <strong>distributed monolith</strong> — all the pain of distribution with none of the autonomy.</p>
<h3>Event-driven architecture</h3>
<p>Components communicate by emitting and reacting to <strong>events</strong> through a broker, rather than calling each other directly. This decouples producers from consumers, smooths traffic spikes (the broker buffers), and improves resilience. The costs: the overall flow is harder to trace, and you must handle duplicate delivery (idempotent consumers) and eventual consistency. <strong>Choreography</strong> (services react to events, no central brain) maximizes decoupling; <strong>orchestration</strong> (a coordinator directs steps) keeps the flow visible.</p>
<h3>Sagas &amp; the outbox</h3>
<p>Since microservices can't share a database transaction, a <strong>saga</strong> models a multi-service workflow as a sequence of local transactions, each with a <strong>compensating action</strong> to undo it if a later step fails. The <strong>outbox pattern</strong> prevents the "DB updated but event lost" bug: write the state change and the outgoing event in one local transaction (to an outbox table); a relay publishes the event reliably.</p>
<h3>CQRS &amp; event sourcing</h3>
<p><strong>CQRS</strong> separates the write model (rich domain logic) from read models (denormalized views), justified when read and write patterns diverge sharply. <strong>Event sourcing</strong> stores the sequence of events as the source of truth, deriving current state by replaying them — giving a full audit log and time travel, at the cost of complexity.</p>
<h3>Serverless</h3>
<p>Deploy functions the cloud runs and scales on demand; pay per invocation. Great for spiky or event-driven workloads and low-ops teams; watch out for cold-start latency and vendor lock-in.</p>
<div class="callout note"><div class="callout-t">◆ Decision guide</div>New product / small team → modular monolith. Many teams blocked on each other → microservices. Spiky, event-triggered work → serverless or event-driven. Heavy read/write divergence at scale → CQRS. Need an audit trail / temporal queries → event sourcing.</div>

<h2><span class="h-node"></span>Part B — Software design methods</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>This part is about keeping the code <em>inside</em> each piece clean and easy to change — the SOLID principles, design patterns, and Domain-Driven Design. Tidy big-picture architecture means little if every individual piece is a tangle on the inside, so the two scales of design work together.</div>
<h3>OOD &amp; SOLID</h3>
<p>Object-oriented design organizes code into objects with data and behavior. The <strong>SOLID</strong> principles keep it changeable: <strong>S</strong>ingle Responsibility (one reason to change), <strong>O</strong>pen/Closed (extend without modifying), <strong>L</strong>iskov Substitution (subtypes are substitutable), <strong>I</strong>nterface Segregation (no fat interfaces), <strong>D</strong>ependency Inversion (depend on abstractions, inject details). Dependency Inversion is the linchpin — it's what lets business logic stay independent of frameworks and databases.</p>
<h3>Design patterns (GoF)</h3>
<p>Named, reusable solutions to recurring problems — a shared vocabulary. The workhorses: <strong>Strategy</strong> (interchangeable algorithms), <strong>Observer</strong> (pub/sub — the ancestor of event systems), <strong>Factory</strong> (defer which class to instantiate), <strong>Adapter</strong> (wrap an incompatible interface), <strong>Decorator</strong> (add behavior by wrapping), <strong>Facade</strong> (simplify a subsystem), <strong>Command</strong> (reify a request → enables queues and undo). Two meta-principles outrank all patterns: <em>program to an interface, not an implementation</em>, and <em>favor composition over inheritance</em>.</p>
<h3>Domain-Driven Design</h3>
<p>Model the business domain faithfully, in close collaboration with domain experts, using a <strong>ubiquitous language</strong> shared by code and conversation. Its most influential idea is the <strong>bounded context</strong> — the same word ("Product") means different things in different areas, so you give each area its own consistent model. Bounded contexts became the standard tool for locating <em>service boundaries</em>.</p>
<h3>Hexagonal / Clean architecture</h3>
<p>Structure an app so dependencies point <em>inward</em>: business logic at the core, knowing nothing of the web, database, or framework (which are "details" at the edges). Achieved via dependency inversion — the core defines interfaces that outer layers implement. The payoff: you can unit-test all business logic with in-memory stand-ins, and swap infrastructure freely.</p>
<h3>TDD, refactoring &amp; design docs</h3>
<p><strong>TDD</strong> (write a failing test → make it pass → refactor) is also a design tool. <strong>Refactoring</strong> improves structure in small, safe, behavior-preserving steps backed by tests. <strong>Design docs / ADRs</strong> capture significant decisions and their alternatives, and the <strong>C4 model</strong> diagrams a system at four zoom levels (Context, Container, Component, Code).</p>

<h2><span class="h-node"></span>How to actually find service boundaries</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>The hardest part of splitting a system is not the code — it is deciding where the lines go. Cut in the wrong place and every feature needs three teams; cut well and most changes touch one service.</div>
<p>Boundaries that work follow <strong>business capabilities</strong> (Orders, Payments, Catalog), not technical layers (a "database service," a "controller service"). Practical tests for a proposed boundary:</p>
<ul>
<li><strong>Can it be deployed alone?</strong> If shipping it always requires shipping something else, it is not a real boundary.</li>
<li><strong>Does it own its data?</strong> If two services share tables, they are one service wearing a disguise.</li>
<li><strong>Do most changes stay inside it?</strong> If a typical feature edits five services, your lines are in the wrong place.</li>
<li><strong>Does it match a team?</strong> Conway's Law says the system will mirror your org chart anyway — so align them deliberately.</li>
<li><strong>Does it enclose an invariant?</strong> Rules that must always hold ("an order total equals the sum of its lines") should live inside one boundary so a single local transaction can enforce them.</li>
</ul>
<div class="callout key"><div class="callout-t">◆ The most common mistake</div>Splitting by technical layer instead of business capability. A "database service" that every other service must call for everything is not a microservice — it is a distributed bottleneck that reintroduces the coupling you were trying to escape.</div>

<h2><span class="h-node"></span>Migrating a monolith without a rewrite</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>The instinct is to rebuild from scratch. Almost every big-bang rewrite runs late, reimplements forgotten rules badly, and ships a worse system. Change it gradually while it keeps running instead.</div>
<p>The <strong>strangler fig</strong> approach, step by step:</p>
<ol>
<li>Put a <strong>façade</strong> (a proxy or gateway) in front of the monolith so all traffic flows through a point you control.</li>
<li>Pick <em>one</em> capability with a clean boundary and modest coupling — a good first candidate is something read-heavy and non-critical.</li>
<li>Build it as a new service, and route just that slice of traffic to it through the façade. Everything else is untouched.</li>
<li><strong>Split its data last, and carefully</strong>: shared tables → separate schemas → separate databases, replacing cross-module transactions with sagas as you go. This is the genuinely hard part, and where most migrations stall.</li>
<li>Repeat, capability by capability, until the monolith withers to nothing (or to a comfortable core you decide to keep).</li>
</ol>
<p>At every step the system fully works, so you can pause, measure, or reverse — which is exactly what a big-bang rewrite cannot offer.</p>

<h2><span class="h-node"></span>When to just keep the monolith</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Microservices are a solution to an organizational problem. If you do not have that problem, they are pure cost — and plenty of very large products run happily as well-structured monoliths.</div>
<p>Stay monolithic when: one team owns the product; requirements are still shifting (boundaries drawn now will be wrong); your deployment and monitoring maturity is limited; or the system is simply not big enough for teams to block each other. Invest in <strong>internal modularity</strong> instead — clear module boundaries, no reaching into another module's data, communication through interfaces. That preserves the option to extract services later, at close to zero cost today.</p>
<div class="callout key"><div class="callout-t">◆ The honest summary</div>Microservices trade <strong>simplicity</strong> for <strong>independence</strong>. Buy independence only when the lack of it is actively hurting you — teams waiting on each other to release. Until then, a modular monolith is faster to build, easier to operate, and much easier to change your mind about.</div>

id:'ch03',num:'03',group:'Foundations',title:'Building Blocks',
lead:'The reusable components you assemble systems from — your LEGO bricks. Know what each does, what it costs, and when to reach for it.',
body:`
<h2><span class="h-node"></span>DNS &amp; anycast</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>DNS is the internet’s phone book: it turns a name like <code>example.com</code> into a numeric address a computer can reach. <strong>Anycast</strong> is like many identical stores sharing one phone number, with your call quietly routed to the nearest branch — so users hit a server close to them.</div>
<p>DNS resolves names to IP addresses and is your first layer of routing — it can direct users to the nearest region and provide coarse failover. <strong>Anycast</strong> announces one IP from many locations, routing each user to the closest.</p>

<h2><span class="h-node"></span>Load balancers</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Like the host at a busy restaurant who seats each new party at the emptiest table — so no single waiter is swamped, and if one section closes, guests are simply sent elsewhere. The moment you have more than one server, you need one of these deciding who goes where.</div>
<div class="figure"><svg viewBox="0 0 660 210" role="img" aria-label="Load balancer distributing to servers"><rect x="255" y="10" width="150" height="50" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="330" y="39" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Load balancer</text><rect x="60" y="140" width="130" height="54" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="125" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Server 1</text><text x="125" y="182" text-anchor="middle" font-size="10.5" fill="#9BA6B7">stateless</text><rect x="265" y="140" width="130" height="54" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="330" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Server 2</text><text x="330" y="182" text-anchor="middle" font-size="10.5" fill="#9BA6B7">stateless</text><rect x="470" y="140" width="130" height="54" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="535" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Server 3</text><text x="535" y="182" text-anchor="middle" font-size="10.5" fill="#9BA6B7">stateless</text><line x1="330" y1="60" x2="125" y2="140" stroke="#697285" stroke-width="1.3"/><line x1="330" y1="60" x2="330" y2="140" stroke="#697285" stroke-width="1.3"/><line x1="330" y1="60" x2="535" y2="140" stroke="#697285" stroke-width="1.3"/><text x="330" y="205" text-anchor="middle" font-size="11.5" fill="#697285">health-checks each server · routes around failures · add capacity by adding identical servers</text></svg><div class="figure-cap"><b>Scale + availability in one box.</b> Because the servers are <em>stateless</em>, any of them can serve any request — so the balancer can add, drain, or route around them freely.</div></div>
<p>Distribute traffic across servers for scale and availability. <strong>L4</strong> balancers route on transport info (fast, protocol-agnostic); <strong>L7</strong> balancers understand HTTP (can route by path, do TLS termination, and more). Algorithms: round-robin, least-connections, weighted, IP-hash. A load balancer is what forces (and enables) a stateless web tier.</p>

<h2><span class="h-node"></span>API gateway &amp; BFF</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A building’s front desk: it checks your ID, tells you which floor to go to, and turns away people who should not be there — so each individual office does not need its own guard. A "BFF" is just a front desk tailored to one kind of visitor (one for the mobile app, one for the website).</div>
<p>An <strong>API gateway</strong> is a single front door for many services, handling auth, rate limiting, routing, and request aggregation so clients don't talk to dozens of services directly. A <strong>BFF</strong> (backend-for-frontend) is a gateway tailored per client type (mobile vs. web), returning exactly the shape each needs.</p>

<h2><span class="h-node"></span>Caching — your highest-leverage tool</h2>
<div class="callout key"><div class="callout-t">◆ Worked example</div>Three classic ways a cache bites back, and the fixes: (1) <strong>Stampede</strong> — a popular item expires and thousands of requests all miss at once and slam the database. Fix: let one request rebuild it while the others wait or serve slightly-stale data. (2) <strong>Penetration</strong> — requests for things that do not exist always miss and hit the database. Fix: cache the "not found" answer too. (3) <strong>Staleness</strong> — the cached copy is out of date. Fix: a sensible expiry time, plus clearing the entry when the real data changes. Getting these three right is most of what "using a cache well" means.</div>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A sticky note with your three most-called numbers kept right by the phone, so you do not open the whole phone book every time. Because the same things get read over and over, that little note ends up doing most of the work — which is why caching is the single biggest speed win in most systems.</div>
<div class="figure"><svg viewBox="0 0 660 150" role="img" aria-label="Caching layers from client to database"><rect x="6" y="45" width="120" height="56" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="66" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Client</text><text x="66" y="87" text-anchor="middle" font-size="10.5" fill="#9BA6B7">browser cache</text><line x1="126" y1="73" x2="148" y2="73" stroke="#697285" stroke-width="1.5"/><polygon points="148,69 156,73 148,77" fill="#697285"/><rect x="156" y="45" width="120" height="56" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="216" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">CDN</text><text x="216" y="87" text-anchor="middle" font-size="10.5" fill="#9BA6B7">edge / static</text><line x1="276" y1="73" x2="298" y2="73" stroke="#697285" stroke-width="1.5"/><polygon points="298,69 306,73 298,77" fill="#697285"/><rect x="306" y="45" width="140" height="56" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="376" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">App cache</text><text x="376" y="87" text-anchor="middle" font-size="10.5" fill="#9BA6B7">Redis · hot rows</text><line x1="446" y1="73" x2="488" y2="73" stroke="#697285" stroke-width="1.5"/><polygon points="488,69 496,73 488,77" fill="#697285"/><rect x="496" y="45" width="150" height="56" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="571" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Database</text><text x="571" y="87" text-anchor="middle" font-size="10.5" fill="#9BA6B7">source of truth</text><text x="330" y="128" text-anchor="middle" font-size="11.5" fill="#697285">each layer absorbs reads so fewer requests reach the slow, expensive origin →</text></svg><div class="figure-cap"><b>Cache on the hot path.</b> A read is cheapest when answered closest to the user. Every layer that hits shields the database — the scarcest resource — from load.</div></div>
<p>A cache stores expensive-to-fetch data close and fast. The default strategy is <strong>cache-aside</strong>: the app checks the cache; on a miss it reads the database and populates the cache. Others: read-through/write-through (cache in-line), write-behind (write to cache, flush later — fast but risks loss).</p>
<div class="callout trade"><div class="callout-t">◆ The three cache hazards</div><strong>Stampede</strong> (a hot key expires and all requests miss at once, crushing the DB) — fix with a per-key lock, jittered TTLs, or background refresh. <strong>Penetration</strong> (requests for keys that don't exist always miss) — fix with negative caching or a Bloom filter. <strong>Hot key</strong> (one key overwhelming one node) — fix by replicating the key or adding a local cache.</div>
<p>Eviction policies decide what to drop when full: LRU (least recently used, the default), LFU, FIFO.</p>

<h2><span class="h-node"></span>CDN</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Streaming services keep copies of popular shows on servers in your city, so the video comes from down the street instead of across the ocean. A <strong>CDN</strong> does that for any web content — images, files, whole pages — putting a copy near every user.</div>
<p>A geographically distributed cache for static content (images, video, JS/CSS) and read-heavy content, serving users from a nearby edge and shielding your origin. Anything static and read-heavy belongs here.</p>

<h2><span class="h-node"></span>Databases — choosing from access patterns</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>There is no single "best" database — it is a toolbox. You pick the tool that matches <em>how you will use the data</em>: quick lookups by key, rich queries and joins, relationship-hopping, or full-text search. The wrong reason to switch is hype; the right reason is a specific access pattern.</div>
<p>Default to a <strong>relational</strong> database (ACID, joins, flexible queries) and move to NoSQL only for a specific pattern or scale reason.</p>
<div class="tbl-wrap"><table><thead><tr><th>Store</th><th>Shape</th><th>Sweet spot</th></tr></thead><tbody>
<tr><td>Relational (SQL)</td><td>Tables, joins, transactions</td><td>The default; anything relational or transactional</td></tr>
<tr><td>Key-value</td><td>key → value</td><td>Caches, sessions, carts (Redis, DynamoDB)</td></tr>
<tr><td>Document</td><td>JSON docs</td><td>Self-contained tree data — profiles, catalogs (MongoDB)</td></tr>
<tr><td>Wide-column</td><td>Partitioned rows</td><td>Massive writes, feeds, time-series (Cassandra)</td></tr>
<tr><td>Graph</td><td>Nodes &amp; edges</td><td>Relationship-heavy queries (Neo4j)</td></tr>
<tr><td>Search</td><td>Inverted index</td><td>Full-text search (Elasticsearch)</td></tr>
<tr><td>Time-series</td><td>Timestamped points</td><td>Metrics, IoT (InfluxDB)</td></tr>
</tbody></table></div>
<p>The scaling ladder: single DB → read replicas (multiply reads, accept replication lag) → caching → sharding (partition data across machines when even replicas aren't enough). Shard by <strong>hash</strong> (even spread, no range scans) or by <strong>range</strong> (good range scans, risk of hot shards). Never use <code>hash % N</code> — it remaps almost everything when N changes; use <strong>consistent hashing</strong>.</p>

<h2><span class="h-node"></span>Object storage</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A giant coat-check: you hand over the big item — a photo, a video, a backup — and keep only the little claim ticket (a link) in your database. Never stuff big files into the database itself; store the file here and the link there.</div>
<p>Cheap, near-infinite storage for files (S3, GCS). Store the file in object storage and only the URL/metadata in your database. Use <strong>pre-signed URLs</strong> so clients upload/download directly, bypassing your servers.</p>

<h2><span class="h-node"></span>Queues vs. event logs</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A <strong>queue</strong> is a deli ticket line: each job is handled once by one worker, then it is gone. An <strong>event log</strong> is a shared security-camera recording: many teams can watch it independently, at their own pace, and rewind to replay history.</div>
<div class="figure"><svg viewBox="0 0 660 250" role="img" aria-label="Message queue versus event log"><line x1="330" y1="16" x2="330" y2="234" stroke="#343D4C" stroke-width="1"/><text x="160" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#9AA6FF">QUEUE</text><rect x="40" y="44" width="80" height="30" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="80" y="63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">msg</text><rect x="128" y="44" width="80" height="30" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="168" y="63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">msg</text><rect x="216" y="44" width="64" height="30" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="248" y="63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">msg</text><line x1="150" y1="110" x2="142" y2="110" stroke="#697285" stroke-width="1.5"/><polygon points="142,106 150,110 142,114" fill="#697285"/><rect x="95" y="120" width="120" height="40" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="155" y="142" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">1 consumer</text><text x="155" y="158" text-anchor="middle" font-size="10" fill="#9BA6B7">processes once</text><text x="160" y="188" text-anchor="middle" font-size="10.5" fill="#9BA6B7">consumed → removed</text><text x="160" y="206" text-anchor="middle" font-size="10.5" fill="#697285">good for tasks/jobs</text><text x="500" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#9AA6FF">EVENT LOG</text><rect x="380" y="44" width="240" height="30" rx="4" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><line x1="380" y1="44" x2="380" y2="74" stroke="#343D4C" stroke-width="1"/><line x1="420" y1="44" x2="420" y2="74" stroke="#343D4C" stroke-width="1"/><line x1="460" y1="44" x2="460" y2="74" stroke="#343D4C" stroke-width="1"/><line x1="500" y1="44" x2="500" y2="74" stroke="#343D4C" stroke-width="1"/><line x1="540" y1="44" x2="540" y2="74" stroke="#343D4C" stroke-width="1"/><line x1="580" y1="44" x2="580" y2="74" stroke="#343D4C" stroke-width="1"/><text x="500" y="64" text-anchor="middle" font-size="10" fill="#9BA6B7">append-only · retained</text><rect x="380" y="120" width="110" height="40" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="435" y="142" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Consumer A</text><text x="435" y="158" text-anchor="middle" font-size="10" fill="#9BA6B7">offset 3</text><rect x="510" y="120" width="110" height="40" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="565" y="142" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Consumer B</text><text x="565" y="158" text-anchor="middle" font-size="10" fill="#9BA6B7">offset 1</text><line x1="435" y1="74" x2="435" y2="120" stroke="#697285" stroke-width="1.2"/><line x1="565" y1="74" x2="565" y2="120" stroke="#697285" stroke-width="1.2"/><text x="500" y="188" text-anchor="middle" font-size="10.5" fill="#9BA6B7">many readers, own pace</text><text x="500" y="206" text-anchor="middle" font-size="10.5" fill="#697285">replayable · event-driven</text></svg><div class="figure-cap"><b>One task, done once vs. a replayable stream.</b> A queue hands each message to a single consumer and deletes it; a log retains events so many consumer groups read independently and can replay history.</div></div>
<p>A <strong>message queue</strong> (RabbitMQ, SQS) delivers a task to be processed once by one consumer — great for offloading work. An <strong>event log</strong> (Kafka) is a durable, replayable, append-only log that many independent consumer groups read at their own pace — great for event-driven architectures and reprocessing history. Both decouple producers from consumers and absorb spikes.</p>

<h2><span class="h-node"></span>Real-time delivery</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A <strong>WebSocket</strong> is a phone call — both sides can talk whenever they like (chat, games). <strong>Server-Sent Events</strong> is a radio broadcast — the station talks and you just listen (live scores, a streaming answer). Pick the phone call only when you truly need both directions.</div>
<p><strong>WebSockets</strong> give full-duplex connections (chat, games). <strong>Server-Sent Events</strong> stream one-way server→client (feeds, token streaming). Both need a stateful connection tier with a session registry mapping each user to the server holding their connection.</p>

<h2><span class="h-node"></span>Other essentials</h2>
<p><strong>Snowflake IDs</strong> — 64-bit, time-sortable, unique IDs generated independently per machine (timestamp + machine ID + sequence). <strong>Bloom filters</strong> — tiny probabilistic sets answering "definitely not present / maybe present," to skip pointless lookups. <strong>Rate limiters</strong> — token bucket (allows bursts), leaky bucket, sliding window.</p>

<div class="schematic"><span class="sch-label">standard modern web architecture</span><pre>          users
            │
        [ DNS / CDN ]  ← static assets served at the edge
            │
     [ Load Balancer ]
            │
   [ API Gateway / BFF ]  ← auth, rate limit, routing
            │
   ┌────────┴────────┐
[ stateless app servers ]  (scale horizontally)
   │        │        │
[ cache ] [ queue ] [ search ]
   │        │
[ primary DB ] → [ read replicas ]   [ object storage ]
   │
[ shards ... ]                        [ analytics / warehouse ]</pre></div>
`});

id:'ch04',num:'04',group:'Foundations',title:'The Design Process',
lead:'A repeatable, four-step framework for designing any system — the same shape whether you are in a real design review or a whiteboard interview. Internalize this and you always know how to start and how to proceed.',
body:`
<p>Facing a blank page, most people freeze or dive into details too early. This framework prevents both. It's the industry-standard structure for a design conversation.</p>

<div class="figure"><svg viewBox="0 0 660 190" role="img" aria-label="The four step design framework"><line x1="30" y1="60" x2="630" y2="60" stroke="#343D4C" stroke-width="2"/><circle cx="85" cy="60" r="9" fill="#5D6BEC"/><text x="85" y="36" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E7EBF2">Scope</text><text x="85" y="88" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2DD4BF">5 min</text><text x="85" y="106" text-anchor="middle" font-size="10.5" fill="#9BA6B7">what &amp; what not</text><circle cx="235" cy="60" r="9" fill="#5D6BEC"/><text x="235" y="36" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E7EBF2">Estimate</text><text x="235" y="88" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2DD4BF">5 min</text><text x="235" y="106" text-anchor="middle" font-size="10.5" fill="#9BA6B7">let numbers decide</text><circle cx="385" cy="60" r="9" fill="#5D6BEC"/><text x="385" y="36" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E7EBF2">High-level</text><text x="385" y="88" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2DD4BF">10 min</text><text x="385" y="106" text-anchor="middle" font-size="10.5" fill="#9BA6B7">boxes, API, one flow</text><circle cx="535" cy="60" r="9" fill="#5D6BEC"/><text x="535" y="36" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E7EBF2">Deep dive</text><text x="535" y="88" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2DD4BF">20 min</text><text x="535" y="106" text-anchor="middle" font-size="10.5" fill="#9BA6B7">the 2-3 hard parts</text><rect x="30" y="130" width="600" height="34" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.3"/><text x="330" y="152" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Wrap up · name the bottlenecks, the single points of failure, and what breaks at 10x</text></svg><div class="figure-cap"><b>The same four steps work for any prompt.</b> Most people lose points by skipping straight to step three — the first two are what stop you confidently designing the wrong system.</div></div>
<h2><span class="h-node"></span>Step 1 — Clarify &amp; scope</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Never start drawing boxes. First work out what you are actually building and — just as important — what you are <em>not</em>. It is like agreeing on the destination before you start driving: five minutes here saves you from confidently building the wrong thing.</div>
<p>Don't draw yet. Ask questions until you know exactly what you're building. List <strong>functional requirements</strong> (what it does) and explicitly state what's <strong>out of scope</strong>. Then pin down <strong>non-functional requirements</strong> — scale (DAU, QPS, data volume), latency targets, and what matters most (consistency? availability? cost?). The two classic failures are designing the wrong thing (assumed scope) and boiling the ocean (didn't cut scope). Agree on a small, explicit feature set first.</p>

<h2><span class="h-node"></span>Step 2 — Estimate</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Do the rough math out loud. The <em>numbers</em>, not your opinion, tell you which design is right: a 100-to-1 read-to-write ratio practically shouts "cache everything," and huge media shouts "use a CDN." Let the estimate make the decision.</div>
<p>Do the back-of-the-envelope math (ch. 01): QPS, storage, bandwidth, read:write ratio. Let the numbers <em>drive</em> the design — they tell you whether you need caching, sharding, a CDN, or none of it. Stating the read:write ratio out loud often decides the whole architecture.</p>

<h2><span class="h-node"></span>Step 3 — High-level design</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Sketch the big pieces, then walk one real request through them from start to finish, and get a nod before going deeper. It is a conversation, not a lecture — the interviewer (or teammate) should be nodding along, not watching a monologue.</div>
<p>Sketch the big boxes and arrows — clients, load balancer, services, databases, caches, queues — plus the core API endpoints and a rough data model. Walk through a primary flow end to end. Get agreement on this shape <em>before</em> going deep; it's a collaboration, not a monologue.</p>

<h2><span class="h-node"></span>Step 4 — Deep dive</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Now go deep on the two or three genuinely hard parts (the interviewer will usually point you at them), and finish honestly: name what would strain first if traffic grew ten times, and how you would relieve it. Ending with "here is what I would watch as it grows" is a strong close.</div>
<p>Go deep on the 2–3 genuinely hard components — the bottleneck under load, the hot-key problem, the consistency-critical flow, the real-time delivery mechanism. This is where you show depth: concrete mechanisms, specific data structures, specific trade-offs. Then <strong>wrap up</strong>: name the bottlenecks, say what breaks at 10× scale, mention operational concerns, and acknowledge the trade-offs you made. Knowing where your design stops working is a strength.</p>

<div class="schematic"><span class="sch-label">one-page checklist</span><pre>1. SCOPE      functional reqs + out-of-scope, stated first
2. SCALE      DAU, QPS, storage, read:write ratio
3. API        key endpoints (idempotency on mutations)
4. DATA       entities + access patterns → pick storage
5. HIGH-LEVEL boxes, arrows, one flow end-to-end
6. DEEP DIVE  the 2–3 hard parts, with mechanisms
7. FAILURE    "what if each box dies?" — no SPOF
8. TRADE-OFFS every big choice framed as a trade-off
9. 10×        what breaks first when load grows 10×</pre></div>

<div class="callout key"><div class="callout-t">◆ Why this works</div>The framework forces you to understand the problem before solving it, to let scale drive choices, to get buy-in before investing in detail, and to spend your time on the parts that actually matter. It's exactly how the worked scenarios in the next chapters proceed — read those with this checklist beside you.</div>

<h2><span class="h-node"></span>Questions worth asking before any design</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Most bad designs are not badly built — they are built for the wrong problem. These questions cost five minutes and routinely save weeks.</div>
<ul>
<li><strong>Who uses this, and to do what?</strong> One clear user journey beats a vague feature list.</li>
<li><strong>How many, and how often?</strong> Thousands or hundreds of millions? That single answer changes almost every later decision.</li>
<li><strong>Read-heavy or write-heavy?</strong> The ratio decides whether you design around caches or around write throughput.</li>
<li><strong>What must never be wrong?</strong> Find the parts where stale or lost data actually hurts — that is where the expensive strict machinery goes, and nowhere else.</li>
<li><strong>What can we ignore?</strong> Saying "out of scope" out loud is a senior move, not a cop-out.</li>
<li><strong>What already exists?</strong> Constraints (existing databases, team skills, budget) are part of the problem, not an afterthought.</li>
</ul>

<h2><span class="h-node"></span>Common traps, and how to avoid them</h2>
<div class="tbl-wrap"><table><thead><tr><th>Trap</th><th>What it looks like</th><th>Do this instead</th></tr></thead><tbody>
<tr><td>Solving too early</td><td>Drawing boxes in minute one</td><td>Clarify scope and scale first</td></tr>
<tr><td>Over-engineering</td><td>Microservices and sharding for 100 users</td><td>Match the design to the real numbers</td></tr>
<tr><td>Ignoring failure</td><td>Only the happy path is described</td><td>Ask "what if this box dies?" for each component</td></tr>
<tr><td>One-size consistency</td><td>"The whole system is strongly consistent"</td><td>Choose per feature; strict only where it matters</td></tr>
<tr><td>Silent designing</td><td>Long pauses, no narration</td><td>Think out loud; state each trade-off</td></tr>
<tr><td>No endgame</td><td>Stopping when the diagram looks full</td><td>Name bottlenecks and what breaks at 10x</td></tr>
</tbody></table></div>
<div class="callout key"><div class="callout-t">◆ The habit that carries everything</div>Narrate every choice as a trade-off: "I will cache here, which costs me freshness and buys me latency." Design is not finding the one right answer — it is knowing what you are giving up, and being able to say why that is the right price for this problem.</div>

`});
