id:'case-uber', navTitle:'Uber (ride-hailing)', icon:'▦',
title:'Design a ride-hailing service like Uber',
scale:'LARGE',
tag:'Maps + real-time matching',
lead:'An app that matches a rider with a nearby driver, tracks the trip live on a map, and handles busy-hour pricing. Explained gently: the whole challenge comes down to answering "who is near me?" millions of times a second.',
body:`
<div class="callout key"><div class="callout-t">◆ Picture it first</div>Think of an old-fashioned taxi <strong>dispatcher</strong> with a radio, except there are millions of taxis and riders, and it all has to happen in seconds on a live map. The single hardest question the whole system keeps asking is: <strong>"which available drivers are near this rider, right now?"</strong> Answer that efficiently and most of the design falls into place.</div>

<h2><span class="h-node"></span>Step 1 — What are we building?</h2>
<p><strong>We'll build:</strong> a rider requests a ride; the app finds nearby available drivers and matches one; both see each other move on a live map; the trip completes and payment happens. <strong>Scale note:</strong> millions of drivers are constantly reporting their location, and in a busy city lots of matches happen at once. So this system is <em>write-heavy</em> on locations (a flood of "I'm here now" updates) and <em>time-critical</em> on matching (nobody waits 30 seconds for a car).</p>

<h2><span class="h-node"></span>The core trick — chop the map into squares</h2>
<p>The naive way to find nearby drivers is to check the distance to <em>every</em> driver in the world and keep the close ones. With millions of drivers, that's hopeless — far too slow, millions of times a second.</p>
<div class="callout key"><div class="callout-t">◆ The chessboard idea</div>Lay a grid over the world map, splitting it into small squares (this is what "geohash," "S2," or "H3" do under the hood). Label every driver by the square they're standing in. Now "find drivers near this rider" becomes "look in the rider's square and the 8 squares around it" — a handful of quick lookups instead of scanning the planet. It's the difference between checking every seat in a stadium versus just checking your own section.</div>

<div class="figure"><svg viewBox="0 0 660 210" role="img" aria-label="Geospatial grid matching">
<g stroke="#343D4C" stroke-width="1">
<line x1="220" y1="30" x2="220" y2="180"/><line x1="330" y1="30" x2="330" y2="180"/><line x1="440" y1="30" x2="440" y2="180"/>
<line x1="110" y1="70" x2="550" y2="70"/><line x1="110" y1="120" x2="550" y2="120"/><line x1="110" y1="30" x2="110" y2="180"/><line x1="550" y1="30" x2="550" y2="180"/><line x1="110" y1="30" x2="550" y2="30"/><line x1="110" y1="180" x2="550" y2="180"/></g>
<rect x="330" y="70" width="110" height="50" fill="#5D6BEC" opacity="0.14"/>
<text x="385" y="99" text-anchor="middle" font-size="10" fill="#9AA6FF">rider's square</text>
<circle cx="360" cy="95" r="6" fill="#5D6BEC"/>
<g fill="#2DD4BF"><circle cx="300" cy="90" r="5"/><circle cx="410" cy="105" r="5"/><circle cx="350" cy="140" r="5"/><circle cx="470" cy="95" r="5"/></g>
<circle cx="160" cy="55" r="5" fill="#697285"/><circle cx="520" cy="160" r="5" fill="#697285"/>
<text x="600" y="95" text-anchor="middle" font-size="10.5" fill="#9BA6B7">only check</text><text x="600" y="110" text-anchor="middle" font-size="10.5" fill="#9BA6B7">nearby squares</text>
</svg><div class="figure-cap"><b>Look only where it matters.</b> Drivers (teal) are filed by map square. A rider (blue) searches just their own square plus the neighbors, ignoring the grey drivers far away. A planet-sized search becomes a few tiny ones.</div></div>

<h2><span class="h-node"></span>Where the "who's near me?" data lives</h2>
<p>Every driver's phone shouts its location every few seconds ("I'm at this square now"). That's a firehose of updates, and here's a freeing realization: this data is <strong>disposable</strong>. If we miss one location update, the next one arrives in a few seconds anyway. So we keep live locations in <strong>fast memory</strong> (not a careful, permanent database), split up by city/region, with each driver's position set to auto-expire — so a driver who turns off the app simply vanishes from the map on their own. Meanwhile the <em>important</em> records (trips, payments) go in a careful, permanent database. Two kinds of data, two very different homes.</p>

<h2><span class="h-node"></span>Follow one ride, start to finish</h2>
<ol>
<li><strong>Sam requests a ride.</strong> The app notes Sam's square and asks the matcher for available drivers in that square and its neighbors.</li>
<li><strong>The matcher ranks candidates</strong> by who's closest / fastest to arrive and best-rated, and offers the trip to the top driver.</li>
<li><strong>Only one driver can grab it.</strong> We use the same "claim it if it's still free" trick from the Amazon stock example, so a driver can't accidentally be assigned to two riders at once.</li>
<li><strong>The trip record is created</strong> in the permanent database and starts moving through its stages.</li>
<li><strong>Live tracking begins.</strong> The driver's moving dot streams to Sam's phone over an always-open connection (so it updates smoothly, not by refreshing).</li>
<li><strong>Trip ends, payment runs</strong> — using the same "no double-charge" ticket idea and undo-able steps (saga) from the Amazon checkout.</li>
</ol>

<div class="figure"><svg viewBox="0 0 660 120" role="img" aria-label="Trip lifecycle states">
<g font-size="10.5" fill="#E7EBF2">
<rect x="8" y="45" width="96" height="36" rx="18" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="56" y="67" text-anchor="middle">requested</text>
<rect x="140" y="45" width="96" height="36" rx="18" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="188" y="67" text-anchor="middle">accepted</text>

<rect x="404" y="45" width="104" height="36" rx="18" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="456" y="67" text-anchor="middle">in progress</text>
<rect x="544" y="45" width="104" height="36" rx="18" fill="#161B24" stroke="#2DD4BF" stroke-width="1.4"/><text x="596" y="67" text-anchor="middle">completed</text>
</g>
<g stroke="#697285" stroke-width="1.4">
<line x1="104" y1="63" x2="132" y2="63"/><polygon points="132,59 140,63 132,67" fill="#697285"/>
<line x1="236" y1="63" x2="264" y2="63"/><polygon points="264,59 272,63 264,67" fill="#697285"/>
<line x1="368" y1="63" x2="396" y2="63"/><polygon points="396,59 404,63 396,67" fill="#697285"/>
<line x1="508" y1="63" x2="536" y2="63"/><polygon points="536,59 544,63 536,67" fill="#697285"/>
</g>
</svg><div class="figure-cap"><b>A trip is a little journey through named stages.</b> Each change is saved and announced, so tracking, receipts, and analytics all stay in step.</div></div>

<h2><span class="h-node"></span>Busy-hour (surge) pricing, simply</h2>
<p>When lots of people want rides but few drivers are around, prices rise to (a) encourage more drivers to come out and (b) ration the limited cars. In plain terms, a separate service watches, per area, "how many people want rides vs. how many cars are free," and nudges a price multiplier up or down. It reads from the very same location firehose the matcher uses, and it's fine for it to be a touch behind real-time — being "roughly right, fast" is good enough here.</p>

<h2><span class="h-node"></span>The tricky bits, in plain terms</h2>
<ul>
<li><strong>Finding nearby drivers fast</strong> → the map-squares trick, kept in fast memory, split by region.</li>
<li><strong>A flood of location updates</strong> → treat them as disposable; keep them in memory with auto-expiry; don't over-engineer their durability.</li>
<li><strong>Never assign one driver to two riders</strong> → the same "claim it only if still free" atomic trick as Amazon's stock.</li>
<li><strong>Live map tracking</strong> → an always-open connection per user so positions stream smoothly.</li>
<li><strong>Two kinds of data</strong> → throwaway real-time positions vs. permanent trip and payment records, stored very differently.</li>
</ul>

<div class="callout note"><div class="callout-t">◆ The one lesson to remember</div>Location apps live or die on one question — <strong>"who's near me?"</strong> — so you chop the map into squares to answer it cheaply, keep the fast-moving position data in memory and disposable, and keep the money and trip records permanent and exact. Two jobs, two very different tools.</div>

<h2><span class="h-node"></span>How big is it? (the numbers that shape everything)</h2>
<p>Rough figures make the design obvious. Say <strong>5 million drivers</strong> are online at peak, each sending a location update every <strong>4 seconds</strong>:</p>
<ul>
<li><strong>Location writes:</strong> 5,000,000 ÷ 4 = <strong>1.25 million updates per second</strong>. That is an enormous write rate — far too much for a traditional database, and the single biggest clue in the whole design.</li>
<li><strong>Ride requests:</strong> perhaps 20 million rides a day ÷ 100,000 seconds ≈ <strong>200 requests/second</strong> average, maybe 1,000 at rush hour. Tiny by comparison.</li>
<li><strong>The ratio</strong> is roughly <strong>6,000 location writes for every ride request</strong>.</li>
</ul>
<div class="callout key"><div class="callout-t">◆ What the numbers decide</div>Almost all the load is <em>location updates that nobody will ever read again</em>. So we keep them in memory, accept losing some, and never write them to durable storage. Meanwhile trips and payments are low-volume but must be perfect — so they get a real database. One system, two completely different storage strategies, chosen purely by the arithmetic.</div>

<h2><span class="h-node"></span>Choosing the grid size (the one real tuning decision)</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Squares that are too big return hundreds of far-away drivers you must filter out. Squares that are too small mean scanning dozens of neighbouring squares to find anyone. Both are slow, in opposite ways.</div>
<div class="tbl-wrap"><table><thead><tr><th>Cell size</th><th>Effect</th><th>Problem</th></tr></thead><tbody>
<tr><td>Too large (a whole district)</td><td>One lookup returns hundreds of drivers</td><td>You then measure distance to all of them</td></tr>
<tr><td>Too small (one block)</td><td>Each cell holds one or two drivers</td><td>You must scan many cells to find enough candidates</td></tr>
<tr><td>Just right (~a few blocks)</td><td>A handful of candidates per lookup</td><td>Varies by density — tune per city</td></tr>
</tbody></table></div>
<p>Note the density problem: the ideal cell in midtown Manhattan is far smaller than in a rural area. Systems like S2 and H3 handle this with <strong>variable resolution</strong> — smaller cells where drivers are dense, larger where they are sparse. There is also an <strong>edge case at cell borders</strong>: a driver 10 metres away but across a boundary would be missed, which is exactly why you always query the neighbouring cells too, not just your own.</p>

<h2><span class="h-node"></span>Matching is more than "who is closest"</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Straight-line distance is the wrong answer. A driver 200 metres away across a river with no bridge is useless; one a kilometre away on a clear road arrives sooner.</div>
<p>So the matcher ranks candidates on several signals:</p>
<ul>
<li><strong>Estimated time of arrival</strong>, using real road routing and current traffic — not raw distance.</li>
<li><strong>Direction of travel</strong> — a driver already heading your way beats one who must turn around.</li>
<li><strong>Driver state</strong> — someone finishing a trip two minutes away may beat an idle driver further out.</li>
<li><strong>Fairness and acceptance</strong> — spreading work across drivers, and favouring those likely to accept.</li>
</ul>
<p>The offer then goes out with a <strong>short timeout</strong> (a driver has seconds to accept). If they decline or do not answer, the system moves to the next candidate — so the matcher is really a small, fast auction loop, not a single query.</p>

<h2><span class="h-node"></span>What happens when things go wrong</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Phones lose signal, apps crash, and drivers go through tunnels. A ride-hailing system is mostly a study in handling unreliable mobile connections gracefully.</div>
<ul>
<li><strong>Driver loses connection mid-trip</strong> — the trip is not cancelled. The phone buffers location points locally and uploads them on reconnect; the trip record on the server is the source of truth, not the phone.</li>
<li><strong>Rider closes the app</strong> — the trip continues; state lives on the server, so reopening just re-subscribes to updates.</li>
<li><strong>A matching server dies</strong> — because live positions are in a replicated in-memory store and trips are in a durable database, another server picks up with no data loss that matters.</li>
<li><strong>Two riders request the same driver simultaneously</strong> — the atomic claim guarantees exactly one wins; the other rider is silently offered the next driver, usually without noticing.</li>
<li><strong>The payment fails after the ride</strong> — the ride still happened, so the trip is completed and the charge is retried or flagged for collection. Never block the physical world on a payment API.</li>
</ul>

<h2><span class="h-node"></span>Why surge pricing is a systems problem, not just a business one</h2>
<p>Surge exists because supply and demand are local and change by the minute. Technically, it is a <strong>stream-processing job</strong>: it consumes the same location firehose the matcher uses, aggregates supply and demand per cell over a short rolling window, and publishes a multiplier that the pricing service reads.</p>
<p>Two design notes: it must be <strong>eventually consistent and fast</strong> (a multiplier a few seconds stale is fine, a slow one is not), and the price a rider is <em>quoted</em> must be <strong>locked for that request</strong> — recalculating mid-checkout so the fare changes as someone taps "confirm" would be both infuriating and, in many places, illegal.</p>

<h2><span class="h-node"></span>What breaks at 10× scale</h2>
<p>The pressure points are predictable. <strong>The location firehose</strong> is first: 12 million updates/second means sharding the in-memory grid by city or region (which is natural, since proximity queries never cross continents) and possibly reducing update frequency for idle drivers. <strong>The matcher</strong> shards the same way — a match in Lagos never needs data from Lima, so this scales almost linearly. <strong>Trips and payments</strong> grow far more slowly and shard by user or trip ID. And because each city is essentially an independent system, the architecture scales by <em>adding cities</em> rather than by making one global system bigger — which is the single most important structural property of the whole design.</p>

`
});
</script>

GUIDE.flashcards.push({name:`API & interfaces`,cards:[
{q:`When do you use gRPC over REST?`,a:`Internal service-to-service calls where speed and a strict typed contract matter. REST stays at the public edge — universal and cacheable.`},
{q:`What makes a change backward-compatible?`,a:`Adding optional fields or new endpoints. Removing, renaming, retyping, or making a field required all break existing clients.`},
{q:`Offset vs. cursor pagination`,a:`Offset lets you jump to any page but slows down at depth and can skip/duplicate rows. Cursor is fast at any depth and stable — the default for large lists.`},
{q:`What belongs in an error response?`,a:`Correct status code, a stable machine-readable code, a human message, and a request ID. Never stack traces or SQL.`},
{q:`4xx vs 5xx — why does it matter?`,a:`4xx = caller's fault (retrying can't help). 5xx = our fault (retry may succeed). Clients automate retry decisions off this.`},
{q:`Three webhook hazards`,a:`Delivery failure (retry with backoff), duplicates (send an event ID, be idempotent), and forgery (sign the payload).`},
{q:`What is an idempotency key for?`,a:`A unique client-supplied ID so a retried POST returns the first result rather than executing twice — essential for payments.`},
]});
GUIDE.flashcards.push({name:`Security essentials`,cards:[
{q:`Authentication vs. authorization`,a:`Authn = who are you (the bouncer). Authz = what you're allowed to do (which rooms your wristband opens). Forgetting the second causes IDOR.`},
{q:`Why must password hashing be slow?`,a:`Fast hashes let attackers test billions of guesses per second on a stolen database. Use bcrypt/scrypt/Argon2 with a per-user salt.`},
{q:`How do you stop SQL injection?`,a:`Parameterized queries — pass input as data so it can never be parsed as SQL. Never concatenate input into a query string.`},
{q:`What is least privilege?`,a:`Every user, service, and credential gets the minimum access needed, so a leak has a small blast radius.`},
{q:`What is zero-trust?`,a:`Trust no network location implicitly — authenticate and encrypt every hop, including internal service-to-service traffic.`},
{q:`Where do secrets belong?`,a:`In a secrets manager, injected at runtime, scoped and rotated — never in source code or version control.`},
{q:`What is defence in depth?`,a:`Layered independent controls, so breaching one (network, edge, identity, app, data) doesn't hand over everything.`},
]});
GUIDE.flashcards.push({name:`Case study patterns`,cards:[
{q:`How does Amazon avoid overselling?`,a:`An atomic conditional write: UPDATE stock SET count=count-1 WHERE sku=? AND count>0. Exactly one racer wins; the other is told it's sold out.`},
{q:`How does a checkout avoid double-charging?`,a:`An idempotency key on the payment — the server records the first result and replays it for any retry with the same key.`},
{q:`Why is a checkout a saga, not a transaction?`,a:`The steps live in different services, so no single ACID transaction spans them. A saga does local steps with compensating undo actions.`},
{q:`How does Instagram build feeds?`,a:`Hybrid fan-out: push (precompute) for normal users, pull (gather at read time) for celebrities, merged when you open the app.`},
{q:`How does Uber answer "who's near me?"`,a:`Grid cells (geohash/S2/H3): index drivers by map square and query the rider's square plus its neighbors — not a global distance scan.`},
{q:`Why keep driver locations in memory with a TTL?`,a:`They're disposable — a new update arrives in seconds — so durability is wasted effort, and expiry removes offline drivers automatically.`},
{q:`Why is a static site right for a small business?`,a:`At ~0.03 requests/second there's no scaling problem. Files on a CDN plus one serverless form handler is cheaper, safer, and has nothing to maintain.`},
{q:`How do you survive a flash sale?`,a:`Two separate tools: a waiting room plus edge caching for the crowd, and an atomic conditional write for the contention.`},
]});

GUIDE.estimation.push({q:`A chat app has 100M DAU sending 40 messages/day. Estimate write QPS, and how much text storage per year.`,
a:`<p><strong>Writes:</strong> 100M × 40 / 10^5 = <strong>40,000 messages/s</strong> average, perhaps 120k at peak → clearly write-heavy, pointing to a wide-column store partitioned by conversation.</p><p><strong>Storage:</strong> 4B messages/day × ~200 bytes ≈ 800 GB/day ≈ <strong>~290 TB/year</strong> of text alone (media separate, in object storage). That scale means partitioning and a retention/archival policy are design requirements, not afterthoughts.</p>`});
GUIDE.estimation.push({q:`You want a 95% cache hit rate on a catalog of 50M products where 1% of products get 80% of traffic. How much cache memory, roughly, at 2 KB per product?`,
a:`<p>The hot 1% is 500,000 products. Caching those costs 500k × 2 KB = <strong>~1 GB</strong> — trivially affordable on a single cache node.</p><p><strong>The lesson:</strong> you don't cache everything. Because traffic is so skewed, caching a tiny fraction of the data captures the overwhelming majority of reads. Always check the skew before sizing a cache — people routinely over-provision by 50×.</p>`});
GUIDE.estimation.push({q:`An API serves 20,000 requests/s. Each request makes 3 database queries at 2 ms each. How many concurrent database connections do you need, roughly?`,
a:`<p>Each request spends 3 × 2 ms = 6 ms in the database. Using Little's Law (concurrency = rate × time): 20,000/s × 0.006 s = <strong>~120 concurrent connections</strong> in flight.</p><p>That's a manageable pool — but note how sensitive it is: if a query slows to 20 ms, you suddenly need ~1,200 connections and will exhaust the database's limit. This is exactly why slow queries cause sudden, total outages rather than gentle slowdowns.</p>`});
GUIDE.estimation.push({q:`A service must stay under 200 ms p99. It calls 4 downstream services sequentially, each with a 50 ms p99. Does it meet the target?`,
a:`<p>Sequentially: 4 × 50 ms = <strong>200 ms</strong> just in downstream calls, before any of your own work — so no, you will breach it.</p><p><strong>Fixes:</strong> call them <em>in parallel</em> where they don't depend on each other (then the total is ~50 ms, the slowest one), cache what you can, or merge the calls. This is why "fan-out then join" beats sequential chains, and why long synchronous chains are an anti-pattern.</p>`});

<script>
/* ===== ADDITIONAL CASE STUDIES ===== */
GUIDE.cases.push({
id:'case-whatsapp', navTitle:'WhatsApp (chat)', icon:'▦',
title:'Design a messaging app like WhatsApp',
scale:'LARGE',
tag:'Real-time + delivery guarantees',
lead:'Billions of messages a day that must arrive instantly, survive the recipient being offline, never appear out of order, and never quietly vanish. Explained step by step, including what makes real-time systems genuinely different.',
body:`
<div class="callout key"><div class="callout-t">◆ Picture it first</div>Most web systems are <strong>pull</strong>: you ask, the server answers, the conversation ends. Chat is <strong>push</strong> — the server must reach out to <em>you</em>, unprompted, the instant something happens. That one difference changes everything: the server has to keep a live line open to every user, remember which line belongs to whom, and cope when a line drops mid-sentence.</div>

<h2><span class="h-node"></span>Step 1 — What are we building?</h2>
<p><strong>We'll build:</strong> one-to-one and group chat; instant delivery; the tick marks (sent, delivered, read); messages that wait for you if your phone is off; typing and online indicators; and media sharing. <strong>We'll skip:</strong> voice and video calls, payments, and the encryption internals (we'll note where encryption sits, but not design the cryptography).</p>
<p>The qualities that make it hard: messages must feel <strong>instant</strong>, must <strong>never be lost</strong>, must arrive <strong>in the right order within a conversation</strong>, and must survive phones that are constantly going offline and back on.</p>

<h2><span class="h-node"></span>Step 2 — How big?</h2>
<ul>
<li>Say <strong>2 billion users</strong>, with maybe 500 million online at once.</li>
<li>At 100 billion messages a day: 100,000,000,000 ÷ 100,000 seconds = <strong>1 million messages per second</strong> on average.</li>
<li>Messages are tiny (a couple of hundred bytes), so text volume is manageable — but the <strong>500 million simultaneously open connections</strong> are the real engineering challenge.</li>
</ul>
<div class="callout note"><div class="callout-t">◆ The number that shapes the design</div>It isn't the message rate — it's the <strong>concurrent connections</strong>. Normal web servers handle brief requests and hang up. Here, half a billion phones each hold a line open for hours. That's why chat systems need a specialised, connection-heavy tier that looks nothing like a typical web tier.</div>

<h2><span class="h-node"></span>The connection tier and the "who is where" registry</h2>
<p>Each phone opens a long-lived <strong>WebSocket</strong> to a gateway server and keeps it open. To deliver a message to Bob, the system must answer one question: <em>which gateway currently holds Bob's connection?</em> That's the <strong>session registry</strong> — a fast in-memory map of <code>user → gateway</code>, updated when someone connects or disconnects.</p>

<div class="figure"><svg viewBox="0 0 660 230" role="img" aria-label="Chat message routing through gateways">
<rect x="20" y="20" width="110" height="40" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="75" y="45" text-anchor="middle" font-size="12" fill="#E7EBF2">Alice</text>
<rect x="530" y="20" width="110" height="40" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="585" y="45" text-anchor="middle" font-size="12" fill="#E7EBF2">Bob</text>
<rect x="20" y="100" width="130" height="44" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.4"/><text x="85" y="120" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Gateway 1</text><text x="85" y="135" text-anchor="middle" font-size="9.5" fill="#9BA6B7">holds Alice's socket</text>
<rect x="510" y="100" width="130" height="44" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.4"/><text x="575" y="120" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Gateway 7</text><text x="575" y="135" text-anchor="middle" font-size="9.5" fill="#9BA6B7">holds Bob's socket</text>
<rect x="240" y="96" width="180" height="52" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="330" y="117" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Session registry</text><text x="330" y="133" text-anchor="middle" font-size="9.5" fill="#9BA6B7">Bob → Gateway 7</text>
<rect x="240" y="180" width="180" height="38" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.3"/><text x="330" y="204" text-anchor="middle" font-size="11" fill="#E7EBF2">Message store (durable)</text>
<g stroke="#697285" stroke-width="1.3">
<line x1="75" y1="60" x2="80" y2="96"/><polygon points="76,88 84,96 84,88" fill="#697285"/>
<line x1="150" y1="118" x2="232" y2="118"/><polygon points="232,114 240,118 232,122" fill="#697285"/>
<line x1="420" y1="118" x2="502" y2="118"/><polygon points="502,114 510,118 502,122" fill="#697285"/>
<line x1="580" y1="96" x2="585" y2="62"/><polygon points="581,70 589,62 589,70" fill="#697285"/>
<line x1="330" y1="148" x2="330" y2="176"/><polygon points="326,168 330,176 334,168" fill="#697285"/></g>
</svg><div class="figure-cap"><b>Two hops and a lookup.</b> Alice's message reaches her gateway, which asks the registry where Bob is, forwards it to Bob's gateway, and that pushes it down Bob's open line. The message is written to durable storage on the way, so it survives even if Bob is offline.</div></div>

<h2><span class="h-node"></span>The delivery guarantee — how a message is never lost</h2>
<div class="callout key"><div class="callout-t">◆ Write first, deliver second</div>The golden rule: <strong>persist the message before acknowledging it</strong>. Alice's phone doesn't show a single tick until the server has durably stored the message. If the server crashed right after acknowledging but before storing, the message would vanish while Alice believes it was sent — the one failure a chat app can never have.</div>
<p>The sequence is: store the message → acknowledge to Alice (one tick) → attempt delivery to Bob → when Bob's phone confirms receipt, mark delivered (two ticks) → when Bob opens the chat, mark read (blue ticks). Each tick is a genuine state transition backed by storage, which is why they're trustworthy.</p>
<p>If Bob is offline, the message simply waits in his <strong>pending queue</strong>. When his phone reconnects, it asks "what did I miss since message #4021?" and the server replays everything after that point. This is why chat works fine after a flight — nothing was lost, just queued.</p>

<h2><span class="h-node"></span>Ordering — why messages never scramble</h2>
<p>Within one conversation, order matters enormously (an answer appearing before its question is nonsense). Across <em>different</em> conversations it doesn't matter at all. So we don't attempt global ordering — which would be extremely expensive — and instead guarantee ordering <strong>per conversation</strong> by giving each conversation a sequence number and storing all its messages in one partition.</p>
<p>This is the general pattern worth remembering: <strong>find the smallest scope that actually needs ordering, and partition by that</strong>. Different conversations then process fully in parallel, so throughput stays enormous while the ordering users notice is perfectly preserved.</p>

<h2><span class="h-node"></span>Group chat — the fan-out question again</h2>
<p>A message to a 200-person group must reach 200 devices. The system looks up each member, finds their gateway in the registry, and pushes to each open connection, queueing for those offline. For normal groups this direct fan-out is fine.</p>
<p>For very large groups (thousands of members), the same celebrity problem from social feeds appears: one message causing thousands of deliveries. The answers are the same family — batch the fan-out, process it asynchronously through a queue rather than in the sender's request, and for broadcast-style groups consider having recipients pull on open rather than pushing to everyone instantly.</p>

<h2><span class="h-node"></span>Presence and typing indicators — the cheap-and-lossy tier</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>"Online" and "typing…" are the opposite of messages: enormous volume, and totally worthless five seconds later. Treating them like messages — storing every keystroke event durably — would generate more write traffic than the entire chat system, for data nobody will ever read again.</div>
<p>So presence lives entirely in memory with a short <strong>heartbeat and TTL</strong>: your phone pings periodically to say "still here," and if the pings stop, you're marked offline automatically. Typing indicators are broadcast directly to whoever is in the conversation and never stored at all. Losing some is completely acceptable.</p>

<h2><span class="h-node"></span>Media, and where encryption sits</h2>
<p>Photos and videos never travel through the messaging path. They're uploaded to <strong>object storage</strong> and the message carries only a link plus a thumbnail — the same pattern as every other system in this guide. End-to-end encryption, where used, means the phones encrypt content before it leaves and the server only ever relays ciphertext it cannot read; note that this makes server-side features like search-across-devices genuinely harder, which is a real trade-off, not an oversight.</p>

<h2><span class="h-node"></span>What breaks at 10× scale</h2>
<p>Connections first: gateways are the constraint, and they scale horizontally as long as the session registry stays fast (it's sharded by user ID and replicated). The message store shards by conversation ID, which is natural since that's also the ordering boundary. The fan-out workers for large groups scale independently. The one thing that <em>doesn't</em> scale by adding machines is a single enormous group chat — that requires changing the delivery model rather than adding capacity, which is the standard shape of hot-key problems.</p>

<div class="callout note"><div class="callout-t">◆ The one lesson to remember</div>Real-time systems are defined by the <strong>open connection</strong>, not the message rate. Keep a live line per user with a registry to find them, <strong>store before you acknowledge</strong> so nothing is ever lost, guarantee order only where it matters (per conversation), and push ephemeral chatter like presence into a cheap, lossy, in-memory tier.</div>
`
});

GUIDE.cases.push({
id:'case-netflix', navTitle:'Netflix (streaming)', icon:'▦',
title:'Design a video streaming service like Netflix',
scale:'HYPERSCALE',
tag:'Bandwidth, CDN & personalization',
lead:'Delivering millions of simultaneous video streams worldwide, in the right quality for each connection, while recommending what to watch next. The key realisation: almost none of this is served by your servers.',
body:`
<div class="callout key"><div class="callout-t">◆ Picture it first</div>Netflix is really <strong>three separate systems wearing one coat</strong>: a small, ordinary web app (browse, search, accounts), a gigantic <strong>video delivery network</strong> that moves almost unimaginable amounts of data, and a <strong>recommendation engine</strong> deciding what you see. The interesting insight is that the video itself never touches Netflix's application servers at all.</div>

<h2><span class="h-node"></span>Step 1 — What are we building?</h2>
<p><strong>We'll build:</strong> browse and search a catalogue; play a video smoothly on any device and connection; resume where you left off across devices; personalized recommendations. <strong>We'll skip:</strong> content licensing, billing details, and the production studio side.</p>

<h2><span class="h-node"></span>Step 2 — The number that dominates everything</h2>
<p>Say <strong>10 million people watching at once</strong>, at an average <strong>5 megabits per second</strong> for HD:</p>
<p style="font-size:16px;text-align:center;color:var(--accent-deep);font-weight:600">10,000,000 × 5 Mbps = 50,000,000 Mbps = <strong>50 terabits per second</strong></p>
<div class="callout key"><div class="callout-t">◆ Let that number sink in</div>50 Tbps is more than the total capacity of many national internet backbones. <strong>No data centre on earth can serve that from one place.</strong> This single number means the architecture isn't "a website with videos" — it's a content delivery problem with a small website attached. Everything else follows from it.</div>
<p>Storage is also large but far less dramatic: a catalogue of, say, 50,000 titles stored in many resolutions and formats might be a few petabytes — big, but a solved problem. It's the <em>egress bandwidth</em>, not the storage, that defines the system.</p>

<h2><span class="h-node"></span>How the video actually reaches you</h2>
<p>Netflix's answer is to put the video <strong>physically close to viewers</strong> — servers full of popular content placed inside internet providers' own data centres, in your city. When you press play, the bytes travel a few miles from your ISP, not across an ocean from a central server.</p>

<div class="figure"><svg viewBox="0 0 660 220" role="img" aria-label="Video delivered from edge servers not origin">
<rect x="250" y="16" width="160" height="42" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="330" y="36" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Origin / storage</text><text x="330" y="51" text-anchor="middle" font-size="9.5" fill="#9BA6B7">master copies, transcoding</text>

</svg><div class="figure-cap"><b>The content comes to you before you ask for it.</b> Popular titles are copied to edge servers worldwide overnight, when networks are quiet. At play time, the bytes travel a short distance — which is the only way 50 Tbps is physically possible.</div></div>

<p>Crucially, this is <strong>predictive</strong>: Netflix knows roughly what will be popular in each region and pushes those files to the right edges in advance, during off-peak hours. It's the difference between a shop stocking its shelves overnight and running to the warehouse for every customer.</p>

<h2><span class="h-node"></span>Why one video is stored dozens of times</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A phone on patchy mobile data and a TV on fibre cannot use the same file. So every title is converted in advance into <strong>many versions</strong> — different resolutions, bitrates, and codecs — and each is chopped into small chunks of a few seconds.</div>
<p>This is the <strong>transcoding pipeline</strong>: an uploaded master file is split into pieces, processed by a large fleet of workers in parallel (each producing one rendition), then reassembled and distributed. It's a classic batch pipeline — slow, expensive, highly parallel, and completely separate from the serving path. It must also be <strong>idempotent and resumable</strong>, because with thousands of chunks, some jobs will always fail and get retried.</p>

<h2><span class="h-node"></span>Adaptive bitrate — how playback stays smooth</h2>
<p>Here's the clever part, and it happens on <em>your device</em>, not the server. The player downloads a small <strong>manifest</strong> listing every available quality level and chunk. It then measures your actual download speed continuously and picks the next chunk accordingly: your connection dips, it grabs a lower-quality chunk; the connection recovers, it steps back up.</p>
<p>That's why video briefly goes blurry instead of freezing — the player chose "keep playing at lower quality" over "stall." Because all the intelligence is in the client and every chunk is just a static file, the servers stay extremely simple: they only serve files. <strong>The scaling trick is making the hard part somebody else's job.</strong></p>

<h2><span class="h-node"></span>The small, ordinary part: browse, search and resume</h2>
<p>Everything that isn't video is a fairly normal web application, and comparatively tiny. The catalogue is read-heavy and cached aggressively. Search uses a search index. "Continue watching" is just a per-user record of title and timestamp, updated periodically during playback (every few seconds, not every frame) and read on any device — which is why you can resume on your phone. It's eventually consistent: if your position is a few seconds stale, nobody notices or cares.</p>

<h2><span class="h-node"></span>Recommendations — the actual product</h2>
<p>With a huge catalogue, what you're shown matters more than what exists. This is an ML system with the usual two planes: <strong>offline</strong>, models learn from viewing history across all users; <strong>online</strong>, serving retrieves candidate titles cheaply and ranks them for you, with results cached per user.</p>
<p>Two details worth knowing: the system personalizes not just <em>which</em> titles appear but <strong>which artwork</strong> is shown for each (different thumbnails appeal to different viewers), and success is measured by A/B tests on real engagement, not offline accuracy. As always, a <strong>feature store</strong> keeps training and serving features identical, and drift monitoring plus retraining keeps quality from decaying.</p>

<h2><span class="h-node"></span>Failure and what breaks at 10×</h2>
<p>The system degrades gracefully by design: if recommendations fail, show generic popular rows rather than an error; if an edge server fails, the player fails over to another edge mid-stream (it's just fetching the next chunk from a different address); if search is down, browsing still works. Playback is protected above everything else, because that's the product.</p>
<p>At 10× the answer is almost entirely "more edges, closer to users" — the delivery tier scales by <em>geographic distribution</em> rather than by a bigger centre. Transcoding scales by adding workers. The web and recommendation tiers grow slowly and conventionally. This is the payoff of the original decision: by pushing bytes to the edge, the part that grows fastest is also the part that scales most naturally.</p>

<div class="callout note"><div class="callout-t">◆ The one lesson to remember</div>Do the bandwidth maths first — it can <strong>completely redefine the problem</strong>. Once you see 50 Tbps, you stop designing a web app with videos and start designing content distribution. Push data close to users ahead of time, precompute every variant you'll need, and move the adaptive decisions to the client so your servers only have to hand out files.</div>
`
});

(function(){
var IV=function(cat,d,q,a){GUIDE.interview.push({cat:cat,d:d,q:q,a:a});};

/* ---- ESTIMATION (was only 2) ---- */
IV(`Estimation`,`Easy`,`What numbers should every engineer have memorized for estimation?`,`<p>A small set of anchors covers almost every calculation:</p><ul><li><strong>A day ≈ 100,000 seconds</strong> (86,400 rounded) — turns "per day" into "per second" instantly.</li><li><strong>Peak ≈ 2–5× average</strong> — always size for peak.</li><li><strong>Memory ≈ 100 ns, SSD ≈ 100 µs, disk seek ≈ 10 ms, cross-continent round trip ≈ 150 ms.</strong> Memory is ~1,000× faster than SSD.</li><li><strong>1 character ≈ 1 byte</strong>; a short text record ≈ 100–500 bytes; a photo ≈ a few MB; an hour of HD video ≈ a few GB.</li><li><strong>Powers of two:</strong> 2^10 ≈ thousand, 2^20 ≈ million, 2^30 ≈ billion.</li></ul><p>With just these you can size QPS, storage, and bandwidth for almost any system in under two minutes — which is the whole point. Precision is not the goal; the right order of magnitude is.</p>`);
IV(`Estimation`,`Medium`,`Estimate the storage and bandwidth for a photo-sharing app with 100M daily users.`,`<p>Assume each user posts 1 photo (3 MB) and views 100 photos per day.</p><p><strong>Writes:</strong> 100M ÷ 100,000 s = <strong>1,000 uploads/second</strong> average, maybe 3,000 at peak.<br><strong>Reads:</strong> 100M × 100 ÷ 100,000 = <strong>100,000 views/second</strong> — a 100:1 read:write ratio, so the design is cache- and CDN-dominated.</p><p><strong>Storage:</strong> 100M photos/day × 3 MB = <strong>300 TB/day</strong>, or ~110 PB/year before thumbnails and replication. That immediately rules out storing images in a database — they go to object storage, with only URLs and metadata in the database.</p><p><strong>Bandwidth:</strong> 100,000 views/s × ~500 KB (a resized version, not the original) ≈ <strong>50 GB/s = 400 Gbps</strong> of egress — a CDN problem, not an origin problem. Notice how each number pushed a specific architectural decision.</p>`);
IV(`Estimation`,`Medium`,`How do you estimate how much memory a cache needs?`,`<p>Start from the <strong>working set</strong> — the data that's actually hot — not the total dataset, because access is almost always heavily skewed (often ~80% of traffic hits ~1–20% of items).</p><p><strong>Example:</strong> 50M products, 2 KB each, but 1% get 80% of traffic. Caching the hot 1% = 500,000 × 2 KB ≈ <strong>1 GB</strong> — trivially cheap, and it captures the large majority of reads. Caching all 50M would be 100 GB for marginal extra benefit.</p><p>Then sanity-check against hit rate: if you need 95% and measure 80%, grow the cache or improve the key strategy. The common mistake is sizing for the whole dataset — teams routinely over-provision caches by 50× because they never checked the skew.</p>`);
IV(`Estimation`,`Hard`,`How do you use Little's Law in a system design?`,`<p><strong>Little's Law:</strong> concurrency = arrival rate × time in system. It's the arithmetic behind sizing thread pools, connection pools, and queues.</p><p><strong>Example:</strong> a service handles 20,000 requests/second and each spends 6 ms in the database (3 queries × 2 ms). Concurrency = 20,000 × 0.006 = <strong>120 concurrent database connections</strong> in flight — a manageable pool.</p><p>The powerful part is the sensitivity: if those queries slow to 20 ms each (60 ms total), you now need 20,000 × 0.06 = <strong>1,200 connections</strong>. You'll exhaust the database's connection limit and the service falls over. <em>This is why a modest query slowdown causes a sudden total outage rather than a gentle degradation</em> — and why connection-pool limits plus timeouts are load-bearing safety features, not tuning details.</p>`);
IV(`Estimation`,`Medium`,`A service must respond in 200 ms at p99 but calls 4 services that each take 50 ms. What do you do?`,`<p>Called <strong>sequentially</strong>, that's 4 × 50 = 200 ms of downstream time alone, before any of your own work — so you'd breach the target on essentially every request.</p><p>Options, roughly in order of preference: (1) <strong>Call them in parallel</strong> where they don't depend on each other — total becomes ~50 ms, the slowest one. (2) <strong>Cache</strong> whatever is stable to remove calls entirely. (3) <strong>Merge or batch</strong> calls so it's one round trip instead of four. (4) <strong>Make non-essential calls asynchronous</strong> and render without them, filling in later. (5) <strong>Set tighter per-call timeouts with fallbacks</strong> so one slow dependency can't blow the whole budget.</p><p>The general lesson: long <em>sequential</em> chains add up ruthlessly, and tail latency compounds — with 4 sequential calls each 1% slow, roughly 4% of requests are slow. Fan out in parallel and join.</p>`);

/* ---- RESILIENCE (was only 3) ---- */
IV(`Resilience`,`Easy`,`Why does every remote call need a timeout?`,`<p>Because without one, a slow or hung dependency doesn't just fail — it consumes your resources indefinitely. Each waiting request holds a thread, a connection, and memory. Under load those accumulate until your service exhausts its pool and stops serving <em>everything</em>, including requests that had nothing to do with the slow dependency.</p><p>That's how one slow downstream service takes down a healthy upstream one, and then its callers, in a cascading failure. A timeout converts an unbounded wait into a fast, contained error you can handle (fall back, serve stale, degrade). The rule of thumb: <strong>a timeout on every network call, always</strong>, set relative to your own latency budget rather than to the dependency's best case.</p>`);
IV(`Resilience`,`Medium`,`What is the difference between failing open and failing closed?`,`<p>It's the decision of what happens when a protective component itself is unavailable. <strong>Fail open</strong> = allow the request through (favour availability). <strong>Fail closed</strong> = reject it (favour safety).</p><p>The right choice depends entirely on what the component protects. If your <em>rate limiter</em> goes down, failing open keeps the product working and risks some abuse — usually correct. If your <em>authentication or authorization</em> service goes down, failing open would let anyone do anything — obviously you fail closed. For a recommendations service, fail open with generic results.</p><p>The mistake isn't picking one or the other; it's <strong>never deciding</strong>, so behaviour under failure is whatever the code accidentally does. Make it an explicit, documented choice per dependency.</p>`);
IV(`Resilience`,`Medium`,`How do retries make an outage worse, and how do you fix that?`,`<p>Retries are the classic way a small problem becomes a total outage. A dependency slows down, every client retries, load <em>triples</em>, the dependency gets slower, more retries pile on — a retry storm that prevents recovery. Worse, retries often stack across layers: 3 retries at three layers is 27 requests for one user action.</p><p>The fixes, combined: <strong>exponential backoff</strong> (wait longer each attempt, giving the dependency room to recover), <strong>jitter</strong> (randomise the delay so clients don't synchronise into waves), a <strong>low retry cap</strong> (2–3, not unlimited), <strong>retry budgets</strong> (cap retries as a fraction of total traffic), <strong>circuit breakers</strong> to stop retrying a dependency that's clearly down, and <strong>retrying only what's safe</strong> — idempotent operations, and only on 5xx/timeout, never on 4xx, which will never succeed.</p>`);
IV(`Resilience`,`Hard`,`Design the resilience strategy for a service with several critical dependencies.`,`<p>I'd classify each dependency first, because the strategy differs: is it <strong>critical</strong> (we can't serve without it) or <strong>optional</strong> (we can degrade)?</p><p><strong>For every call:</strong> a timeout tied to my latency budget; bounded retries with backoff and jitter for idempotent operations; and a circuit breaker so a dead dependency fails fast instead of consuming resources.</p><p><strong>For optional dependencies:</strong> a fallback — cached/stale data, a default, or simply omitting that part of the response (graceful degradation). Recommendations down should mean generic recommendations, not an error page.</p><p><strong>Isolation:</strong> bulkheads — separate connection/thread pools per dependency — so one slow dependency can't consume all my capacity.</p><p><strong>At the edges:</strong> load shedding so I reject excess early rather than degrading for everyone, and rate limits per client.</p><p><strong>Then verify it:</strong> resilience that's never tested usually doesn't work, so I'd inject failures (chaos testing) to confirm the fallbacks actually fire and the circuit breakers actually trip.</p>`);

/* ---- NETWORKING (was only 4) ---- */
IV(`Networking`,`Easy`,`What happens when you type a URL into a browser?`,`<p>A classic warm-up that reveals how much of the stack you understand. The short version: <strong>DNS lookup</strong> resolves the hostname to an IP (checking browser, OS, and resolver caches first). A <strong>TCP connection</strong> is opened (three-way handshake), then a <strong>TLS handshake</strong> negotiates encryption for HTTPS. The browser sends an <strong>HTTP request</strong>, which typically hits a <strong>CDN edge</strong> first — if the content is cached there, it returns immediately without ever reaching the origin.</p><p>Otherwise it reaches a <strong>load balancer</strong>, which routes to an application server; that server may consult caches and databases, and returns a response. The browser then <strong>parses the HTML</strong>, discovers references to CSS, JS and images, and fetches those (often from the CDN in parallel), before rendering. Worth mentioning: connection reuse/HTTP2 multiplexing, and that latency is dominated by round trips, which is why we cache and place content near users.</p>`);
IV(`Networking`,`Medium`,`Why is HTTP/2 faster than HTTP/1.1, and what does HTTP/3 add?`,`<p>Under <strong>HTTP/1.1</strong>, each connection handles one request at a time, so browsers open several parallel connections and still suffer <em>head-of-line blocking</em> — one slow response holds up others queued behind it.</p><p><strong>HTTP/2</strong> adds <strong>multiplexing</strong>: many requests and responses share one connection concurrently, plus header compression and binary framing. That dramatically reduces overhead for pages fetching many small assets. But it still runs over TCP, so a single lost packet stalls <em>all</em> the multiplexed streams (TCP-level head-of-line blocking).</p><p><strong>HTTP/3</strong> moves to QUIC over UDP, so streams are independent — a lost packet only stalls its own stream — and connections establish faster (combining transport and TLS handshakes) and survive network changes (switching from Wi-Fi to mobile keeps the connection). The practical impact is biggest on lossy mobile networks.</p>`);
IV(`Networking`,`Medium`,`What is head-of-line blocking and where does it appear?`,`<p>It's when one stuck item at the front of a queue blocks everything behind it, even though those items are ready. It shows up at several layers, which is why it's worth recognising as a <em>pattern</em>:</p><ul><li><strong>HTTP/1.1</strong> — one slow response blocks the requests queued on that connection.</li><li><strong>TCP</strong> — a lost packet stalls everything after it until retransmitted (this is why HTTP/2 over TCP still blocks, and HTTP/3 over QUIC doesn't).</li><li><strong>Message queues</strong> — a "poison" message that keeps failing blocks the partition behind it, which is why dead-letter queues exist.</li><li><strong>Thread pools</strong> — a few slow requests occupy all threads while fast requests wait, which is what bulkheads prevent.</li></ul><p>The general fixes are the same shape everywhere: <strong>parallel independent lanes</strong> (multiplexing, partitions, separate pools) or <strong>removing the stuck item</strong> (timeouts, dead-letter queues).</p>`);
IV(`Networking`,`Medium`,`How does TLS work at a high level, and why terminate it at the load balancer?`,`<p>TLS gives you encryption, integrity, and server authentication. At a high level: the client and server perform a <strong>handshake</strong> where the server presents a certificate (proving its identity via a chain to a trusted authority), they agree on a cipher, and they derive a shared <strong>session key</strong>. The rest of the traffic is encrypted symmetrically with that key, which is fast. The handshake costs round trips, which is why connection reuse and session resumption matter for latency.</p><p><strong>Terminating at the load balancer</strong> means the LB decrypts incoming TLS and forwards plaintext (or re-encrypts) to backends. The benefits: certificates are managed centrally in one place, expensive handshake work is offloaded from application servers, and the LB can read HTTP to do content-based routing. The trade-off is that traffic behind the LB is unencrypted unless you re-encrypt — which is why <strong>zero-trust</strong> architectures use mTLS internally, so even internal hops are authenticated and encrypted.</p>`);

/* ---- EASY-TIER QUESTIONS (only 21 existed) ---- */
IV(`Caching`,`Easy`,`What is a cache and when should you add one?`,`<p>A cache is a small, fast store holding copies of data that's expensive to fetch or compute, so repeated requests are served quickly without redoing the work. Think of a sticky note with your three most-called numbers next to the phone, instead of opening the phone book each time.</p><p>Add one when reads heavily outnumber writes, the same data is requested repeatedly, the underlying fetch is slow or expensive, and <strong>slightly stale data is acceptable</strong> — that last condition is the one people skip. Don't cache data that must always be perfectly current (an account balance at the moment of a transfer), and don't cache things read once. Always pair a cache with a plan for invalidation and a TTL.</p>`);
IV(`Databases & storage`,`Easy`,`What is an index and why not index every column?`,`<p>An index is a separate data structure (usually a B-tree) that lets the database find rows matching a column's value without scanning the whole table — like the index at the back of a book instead of reading every page.</p><p>You don't index everything because indexes aren't free: <strong>every index must be updated on every insert, update, and delete</strong>, so they slow writes and consume storage. A table with fifteen indexes can have painfully slow writes. Index the columns you actually filter, join, or sort on; use composite indexes matching your common multi-column queries; and periodically drop unused ones. It's the classic read-vs-write trade-off — buy read speed with write speed and space.</p>`);
IV(`Fundamentals`,`Easy`,`What does "stateless" mean and why is it desirable?`,`<p>A stateless service keeps no per-user information in its own memory between requests — everything it needs arrives with the request or comes from a shared store. It's a fast-food counter where any cashier can serve any customer because the order is written on the receipt, not remembered in one cashier's head.</p><p>It's desirable because <strong>any instance can handle any request</strong>. That means you can add or remove servers freely, a dying server loses nothing (the user is simply routed elsewhere), you don't need sticky sessions, and autoscaling becomes trivial. The cost is that state must live somewhere else — sessions in Redis, data in a database, files in object storage — which pushes the hard problems down into the data layer, but makes the application tier almost trivially scalable.</p>`);
IV(`API design`,`Easy`,`What makes an API easy to use?`,`<p>Predictability above all — a developer should be able to guess the next endpoint correctly after learning two. Concretely: <strong>consistent naming</strong> (nouns for resources, plural, with HTTP verbs supplying the action); <strong>consistent shapes</strong> (the same field names and date formats everywhere); <strong>meaningful status codes</strong> so clients can branch programmatically; and <strong>clear errors</strong> with a stable machine-readable code, a human message, and a request ID.</p><p>Beyond that: sensible defaults so simple cases are simple, <strong>always-paginated</strong> list endpoints so nothing ever returns unbounded data, good documentation with real examples, and evolution by <em>adding</em> optional fields rather than changing existing ones. The test is whether someone can integrate successfully without asking you a question.</p>`);
IV(`Security`,`Easy`,`Why can't you trust anything the client sends?`,`<p>Because anything running on a user's device can be modified. Browser dev tools let anyone change form values, JavaScript can be edited or bypassed entirely, and a mobile app's requests can be intercepted and rewritten — or simply replayed with <code>curl</code>, skipping your UI altogether.</p><p>So client-side validation is a <strong>user-experience convenience</strong>, not a security control: it gives instant feedback, but every check that actually matters must be re-enforced on the server. This includes validating input, checking prices and quantities (never trust a price sent by the client), and — most importantly — authorization: verifying the caller is allowed to act on <em>this specific</em> resource, since the absence of that check is the most common serious web vulnerability.</p>`);
IV(`Messaging & events`,`Easy`,`Why use a queue instead of calling a service directly?`,`<p>Four reasons. <strong>Decoupling:</strong> the sender doesn't need the receiver to be online — the message waits. <strong>Absorbing spikes:</strong> a burst of traffic fills the queue rather than overwhelming the consumer, which drains it at its own sustainable pace. <strong>Responsiveness:</strong> the user's request returns immediately once the message is queued, instead of waiting for slow work like sending an email or resizing a video. <strong>Reliability:</strong> if a consumer crashes mid-job, the message is redelivered rather than lost.</p><p>The costs are real too: the result isn't immediate (eventual consistency), you must handle duplicate delivery by making consumers idempotent, and debugging a flow that hops through a queue is harder than following a direct call. Use a queue when the caller doesn't need the answer right now.</p>`);
})();

var IV=function(cat,d,q,a){GUIDE.interview.push({cat:cat,d:d,q:q,a:a});};
IV(`Scaling & distribution`,`Hard`,`How would you run a service active-active across multiple regions?`,`<p>Active-active means every region serves live traffic, so users get low latency and the loss of a whole region is survivable. The hard part is <strong>writes</strong>, because two regions can now change the same data at the same moment.</p><p>Three common strategies, roughly in order of preference: (1) <strong>Home each record to one region</strong> — a user's data "lives" in their home region and all writes for it go there, so there are no conflicts; other regions serve reads from replicas. (2) <strong>Partition by geography</strong> when data is naturally regional (a ride in Lagos never needs Lima's data). (3) Only if you truly need multi-region writes to the same record, use <strong>conflict resolution</strong> — CRDTs, or version vectors plus a merge rule — and accept the complexity.</p><p>Around that: global DNS or anycast routes users to the nearest healthy region; replication between regions is asynchronous, so cross-region reads can be seconds stale; and you must rehearse region failover, because an untested failover plan usually fails. Keep strongly-consistent operations (payments, inventory) homed to a single region rather than spread thin.</p>`);
IV(`Databases & storage`,`Medium`,`What is a write-ahead log and why do databases use one?`,`<p>A write-ahead log (WAL) is an append-only file where a database records every change <strong>before</strong> applying it to the main data files. If the machine crashes halfway through an update, on restart the database replays the log to finish or undo incomplete work — which is how it keeps its promise that a committed transaction is never lost.</p><p>It's fast because appending sequentially to one file is far cheaper than scattering random writes across many pages; the database can then update its real data structures lazily in the background.</p><p>The same log turns out to be enormously useful beyond crash recovery: <strong>replication</strong> works by shipping the WAL to followers, and <strong>change data capture</strong> works by tailing it to stream changes to search indexes, caches, and warehouses. The "log as the source of truth" idea behind Kafka and event sourcing is the same insight, applied at the system level.</p>`);
IV(`Consistency & CAP`,`Hard`,`What is leader election and when do you need it?`,`<p>Leader election is how a group of nodes agrees that exactly one of them is in charge of some job — accepting writes for a partition, running a scheduler, holding a lock. You need it whenever "exactly one" matters and the current holder can die at any time.</p><p>Don't build it yourself: use a consensus system (etcd, ZooKeeper, or Consul, built on Raft/Paxos) or a managed equivalent. The typical pattern is that nodes race to acquire a <strong>lease</strong> with a TTL; the winner renews it periodically; if it stops renewing (crash, network partition), the lease expires and another node takes over.</p><p>The notorious trap is the <strong>zombie leader</strong>: an old leader pauses (a long garbage-collection stall, say), its lease expires, a new leader is elected — then the old one wakes up still believing it's in charge. The fix is a <strong>fencing token</strong>: each new lease comes with a higher number, and the storage layer rejects writes carrying a stale number. Without fencing, leases alone do not prevent two leaders.</p>`);
IV(`Databases & storage`,`Medium`,`How does a search index (inverted index) work?`,`<p>A normal index maps a record to its content. An <strong>inverted index</strong> maps each word to the list of documents containing it — exactly like the index at the back of a book. To search "fast cheap laptop," the engine looks up the three word lists and intersects them, which is dramatically faster than scanning every document.</p><p>Building it involves <strong>tokenizing</strong> text into terms, normalizing them (lower-casing, stemming "running" to "run," dropping very common words), and storing per-term postings lists with positions and frequencies. <strong>Ranking</strong> then scores matches — classically with TF-IDF/BM25 (rare words matter more than common ones), blended with business signals like popularity.</p><p>Design implications: a search index is a <em>derived</em> store kept in sync with the primary database (usually via change data capture), so it's eventually consistent; it's sharded by document; and it's excellent at relevance and full text but not a system of record — keep the truth in your primary database.</p>`);
IV(`Consistency & CAP`,`Hard`,`How do you resolve conflicting writes in a multi-leader or leaderless system?`,`<p>When two replicas accept different writes to the same record concurrently, you must decide the outcome. Options, from simplest to most robust:</p><ul><li><strong>Last-write-wins (LWW)</strong> — keep the write with the latest timestamp. Simple, but it <em>silently discards</em> data, and clocks drift, so "latest" can be wrong. Fine only when losing an update is acceptable.</li><li><strong>Version vectors</strong> — track causality so you can tell "B saw A and replaced it" (not a conflict) from "A and B happened independently" (a real conflict), then surface true conflicts to the application or the user to merge.</li><li><strong>CRDTs</strong> — data types designed so concurrent operations merge automatically and always converge (counters, sets, collaborative text).</li><li><strong>Avoid the conflict</strong> — route all writes for a given record to one home replica, which is often the best answer of all.</li></ul><p>The key interview point is recognizing that LWW is not "conflict resolution" so much as "conflict deletion," and naming what data you're willing to lose.</p>`);
IV(`Deployment`,`Hard`,`How do you migrate from one datastore to another with zero downtime?`,`<p>You never flip everything at once. The standard sequence keeps the old store authoritative until the new one has proven itself:</p><ol><li><strong>Dual write</strong> — the application writes to both old and new stores (ideally via the outbox pattern or change data capture, so a failure can't leave them silently diverged). Reads still come from the old store.</li><li><strong>Backfill</strong> — copy all historical data into the new store in the background, idempotently, so it can be re-run.</li><li><strong>Shadow read and compare</strong> — read from both, serve from the old, and log every mismatch. Fix discrepancies until the mismatch rate is effectively zero.</li><li><strong>Switch reads</strong> gradually (a percentage behind a feature flag), watching errors and latency.</li><li><strong>Stop writing to the old store</strong>, keep it around read-only for a while as a safety net, then decommission.</li></ol><p>Every step is reversible, which is the whole point: at any stage you can flip back to the old store without data loss.</p>`);
IV(`Security`,`Medium`,`How do data residency requirements affect architecture?`,`<p>Residency laws require that certain data (often personal data of a country's citizens) be stored — and sometimes processed — within specific borders. That turns a legal rule into an architectural constraint.</p><p>The usual design is <strong>regional data partitioning</strong>: each user is assigned a home region based on their jurisdiction, and their personal data is stored only there. Global services then hold only non-personal or pseudonymized data, and cross-region requests for personal data are routed to the home region rather than copied out.</p><p>The easy things to get wrong are the side channels: <strong>backups</strong> replicated to another region, <strong>logs and analytics</strong> pipelines that quietly ship personal data abroad, <strong>caches and CDNs</strong> holding personal responses at foreign edges, and <strong>support tooling</strong> accessed from other countries. A data inventory — knowing where every category of personal data flows — is the foundation. (General guidance; involve legal counsel for actual compliance.)</p>`);
IV(`ML systems`,`Medium`,`How do you run a trustworthy A/B test?`,`<p>Randomly split users into control and treatment, change one thing, and compare a metric decided <strong>before</strong> the test starts. The traps are almost all statistical and procedural:</p><ul><li><strong>Pick one primary metric up front.</strong> Checking twenty metrics and reporting the one that moved is how you "discover" effects that are pure noise.</li><li><strong>Compute the sample size in advance</strong> and run to it. Stopping the moment the result looks good ("peeking") massively inflates false positives.</li><li><strong>Randomize by user, not by request</strong>, so one person doesn't bounce between variants.</li><li><strong>Watch guardrail metrics</strong> (latency, errors, revenue) so a "winning" change isn't quietly breaking something else.</li><li><strong>Beware novelty effects</strong> — users click new things because they're new. Run long enough to see the settled behaviour.</li></ul><p>And sanity-check the split itself: if control and treatment don't have the expected sizes (a "sample ratio mismatch"), the experiment is broken and its results can't be trusted.</p>`);
IV(`Resilience`,`Hard`,`What are hedged requests and when are they worth it?`,`<p>A hedged request tackles tail latency: send a request to one replica, and if it hasn't answered within, say, the 95th-percentile latency, send a duplicate to a second replica and use whichever responds first (cancelling the other).</p><p>Because slow responses are usually caused by a momentary problem on one machine (a GC pause, a noisy neighbour, a busy disk) rather than the request itself, the backup copy usually returns quickly. Waiting until the p95 before hedging means only about 5% of requests are duplicated, so the extra load is small while the p99 improves dramatically — a key technique from Google's work on tail latency at scale.</p><p>Only hedge <strong>idempotent reads</strong> — duplicating a write could apply it twice. And cap it: under a real overload, hedging adds load exactly when you can least afford it, so disable it when error rates or saturation rise.</p>`);
IV(`Estimation`,`Medium`,`How would you estimate the monthly cloud cost of a design?`,`<p>Break the design into the handful of line items that dominate, estimate each roughly, and sum — the goal is the right order of magnitude and knowing <em>which</em> component drives cost.</p><ul><li><strong>Compute:</strong> peak QPS ÷ requests one instance handles × headroom → number of instances × hourly price × ~730 hours.</li><li><strong>Storage:</strong> total stored bytes (with replication) × price per GB-month; object storage is far cheaper than database or block storage.</li><li><strong>Egress bandwidth:</strong> often the surprise. Bytes served per month × price per GB — for media-heavy products this can dwarf compute, which is exactly why CDNs pay for themselves.</li><li><strong>Managed services:</strong> databases, queues, and caches priced per node or per request.</li></ul><p>Then ask where the leverage is: caching to cut database load, compressing and CDN-serving media to cut egress, reserved or spot capacity for steady or interruptible work. In an interview, saying "egress will dominate, so the CDN decision is really a cost decision" is the kind of insight that stands out.</p>`);
IV(`Behavioral & process`,`Medium`,`How do you talk about a past outage or design mistake in an interview?`,`<p>This question tests ownership and learning, not perfection — everyone who has shipped real systems has broken something. A clear structure works well: the <strong>situation</strong> (what the system was and what went wrong, briefly), <strong>your role</strong> in it, the <strong>response</strong> (how you detected it, mitigated first, then diagnosed), and — most importantly — <strong>what changed afterwards</strong>.</p><p>Strong answers are specific and blameless: "our deploy lacked a canary, so a bad config reached 100% of traffic; we rolled back in eight minutes, and afterwards I added staged rollouts and an automated rollback on error-rate spikes." Weak answers blame a colleague, stay vague, or pick a trivial "mistake" that is really a disguised boast.</p><p>End on the systemic lesson — the guardrail you added so the class of failure can't recur. That shows you think about systems, not just incidents.</p>`);
IV(`Networking`,`Medium`,`How do you invalidate content cached on a CDN?`,`<p>Three main tools, each with a cost:</p><ul><li><strong>Short TTLs</strong> — content expires on its own after, say, 60 seconds. Simple and self-healing, but it means more requests reach your origin and updates still take up to a TTL to appear.</li><li><strong>Explicit purge</strong> — ask the CDN to drop a path or tag everywhere. Fast, but purges take time to propagate across edges, may be rate-limited, and a purge storm can send a wave of traffic to your origin.</li><li><strong>Versioned URLs</strong> — put a content hash in the filename (<code>app.3f9a2c.js</code>). A new version gets a brand-new URL, so there is nothing to invalidate; old and new never conflict, and you can cache the file "forever."</li></ul><p>The usual strategy combines them: <strong>versioned URLs with very long TTLs for static assets</strong> (the best option whenever you control the reference), short TTLs plus <code>stale-while-revalidate</code> for dynamic pages, and purge reserved for emergencies like taking down content that must disappear now.</p>`);
})();
</script>

<script>
/* ================= INIT ================= */
/* Keyboard accessibility: make click-driven divs reachable and operable */
const A11Y_SEL='.acc-head,.flashcard,.sr-card,.path-card,.book-card,.nav-item,.chip,.opt,.hint-toggle,.card[style*="cursor"]';
function a11yMark(root){
  (root||document).querySelectorAll(A11Y_SEL).forEach(n=>{
    if(n.tagName==='BUTTON'||n.tagName==='A'||n.dataset.a11y)return;
    n.setAttribute('tabindex','0');
    if(!n.getAttribute('role'))n.setAttribute('role','button');
    n.dataset.a11y='1';
  });
}
function wrapFigures(root){
  (root||document).querySelectorAll('.figure > svg').forEach(svg=>{
    const w=document.createElement('div');w.className='fig-scroll';
    w.setAttribute('tabindex','0');w.setAttribute('role','region');
    w.setAttribute('aria-label',(svg.getAttribute('aria-label')||'Diagram')+' (scrolls sideways on small screens)');
    svg.parentNode.insertBefore(w,svg);w.appendChild(svg);
    const hint=document.createElement('div');hint.className='fig-hint';hint.textContent='\u2190 swipe to see the whole diagram \u2192';
    w.parentNode.insertBefore(hint,w.nextSibling);
  });
}
function initA11y(){
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const t=e.target;
    if(!t||!t.dataset||!t.dataset.a11y)return;
    e.preventDefault();
    t.click();
  });
  const mo=new MutationObserver(()=>{wrapFigures(document);a11yMark(document);});
  ['view','navScroll'].forEach(id=>{const n=document.getElementById(id);if(n)mo.observe(n,{childList:true,subtree:true});});
  wrapFigures(document);a11yMark(document);
}
/* Keyboard shortcuts: "/" focus search, Esc clear/close, ← → prev/next chapter */
function initKeys(){
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
    if(e.key==='/'&&!typing){e.preventDefault();const b=$('#search');if(b)b.focus();return;}
    if(e.key==='Escape'){const b=$('#search');if(b&&document.activeElement===b){b.value='';b.blur();}
      const sb=$('#sidebar');if(sb&&sb.classList.contains('open'))sb.classList.remove('open');return;}
    if(typing)return;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      const i=GUIDE.chapters.findIndex(c=>c.id===S.route);
      if(i<0)return;
      const n=e.key==='ArrowRight'?i+1:i-1;
      if(n>=0&&n<GUIDE.chapters.length)go(GUIDE.chapters[n].id);
    }
  });
}
function initApp(){
  loadState();
  initKeys();
  initA11y();
  buildNav();
  updateProgress();
  initSearch();
  route();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp);}else{initApp();}
</script>
