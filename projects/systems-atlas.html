id:'ch05',num:'05',group:'Practice by design',title:'Worked Designs I',
lead:'Seven full systems designed end-to-end with the framework from chapter 04. Read the requirements, then try to design each yourself before reading on — active reproduction is where skill forms.',
body:`
<h2><span class="h-node"></span>1 · URL shortener</h2>
<p><strong>Shape:</strong> extreme read-heavy, cache-first. ~50M new links/month is only ~17 writes/s, but each link is read ~200× → ~3,400 reads/s, a 200:1 ratio. So the design is entirely about cached reads; the DB barely works. Generate a short key (base-62 of a counter, or a hash), store <code>key → long URL</code>, and serve redirects from cache/CDN. A <code>301</code> caches at the browser (fewer hits, no analytics); <code>302</code> lets you count clicks.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Millions of new links, each read hundreds of times. Redirects must be near-instant; brief staleness is harmless. Links may expire or be custom.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Generate keys from a counter, not a hash.</strong> Base-62 encoding an ever-increasing ID guarantees uniqueness with no collision handling; hashing needs collision checks on every write. Then serve every redirect from cache.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">Key generation and the cached read path. Also worth covering: <code>301</code> vs. <code>302</code> (permanent caching vs. click analytics), and pushing analytics onto an async event stream so counting never slows the redirect.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Designing for write throughput. At ~17 writes/s the database is nearly idle — all the engineering belongs on the read side.</div></div></div>

<h2><span class="h-node"></span>2 · Rate limiter</h2>
<p><strong>Shape:</strong> a shared atomic counter. Use a <strong>token bucket</strong> (allows bursts, refills at a steady rate) backed by Redis atomic operations so all app servers share one view of a user's usage. For latency, a two-tier trick: a permissive local limiter plus a periodically-synced global one. Decide <strong>fail-open</strong> (allow if the limiter is down — availability) vs. <strong>fail-closed</strong> (deny — protection) per endpoint.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Enforce per-client limits across a whole fleet of servers, add almost no latency, and behave sensibly when the limiter itself fails.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Token bucket in a shared atomic counter.</strong> It permits short bursts while capping the average rate, and Redis atomic ops give every server one consistent view of a client’s usage.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">Making the counter atomic (so two servers can’t both allow the last request), and the two-tier local+global trick that avoids a network round trip per request.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Forgetting to decide <strong>fail-open vs. fail-closed</strong>. If Redis dies, does traffic flow freely or stop dead? That choice is a design decision, not an accident.</div></div></div>

<h2><span class="h-node"></span>3 · Chat / messaging (WhatsApp)</h2>
<p><strong>Shape:</strong> a stateful real-time tier. Clients hold <strong>WebSocket</strong> connections to gateway servers; a <strong>session registry</strong> maps each user to the server holding their connection, so a message for user B is routed to B's gateway and pushed down. Messages persist to a wide-column store (write-heavy) partitioned by conversation. Presence and typing indicators are ephemeral and lossy — broadcast, never persisted. Group chat is fan-out to each member's connection.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Instant delivery, messages must survive offline recipients, ordering within a conversation, presence and read receipts, huge write volume.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>A stateful connection tier plus a session registry.</strong> Persistent WebSockets mean the server can push instantly; the registry (user → which gateway holds their socket) is what makes routing a message possible at all.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">Offline delivery (queue until reconnect), per-conversation ordering (partition by conversation ID), and what happens when a gateway dies — clients reconnect elsewhere and rehydrate.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Persisting presence and typing indicators. They are ephemeral and lossy by nature; writing them to a database creates enormous pointless write load.</div></div></div>

<h2><span class="h-node"></span>4 · Social news feed</h2>
<div class="figure"><svg viewBox="0 0 660 260" role="img" aria-label="Push versus pull fan-out for feeds"><line x1="330" y1="20" x2="330" y2="240" stroke="#343D4C" stroke-width="1"/><text x="150" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#9AA6FF">PUSH (fan-out on write)</text><circle cx="150" cy="70" r="16" fill="#5D6BEC"/><text x="150" y="75" text-anchor="middle" font-size="10" fill="#fff">post</text><line x1="150" y1="86" x2="60" y2="150" stroke="#697285" stroke-width="1.2"/><circle cx="60" cy="158" r="7" fill="#2DD4BF"/><line x1="150" y1="86" x2="110" y2="150" stroke="#697285" stroke-width="1.2"/><circle cx="110" cy="158" r="7" fill="#2DD4BF"/><line x1="150" y1="86" x2="150" y2="150" stroke="#697285" stroke-width="1.2"/><circle cx="150" cy="158" r="7" fill="#2DD4BF"/><line x1="150" y1="86" x2="190" y2="150" stroke="#697285" stroke-width="1.2"/><circle cx="190" cy="158" r="7" fill="#2DD4BF"/><line x1="150" y1="86" x2="240" y2="150" stroke="#697285" stroke-width="1.2"/><circle cx="240" cy="158" r="7" fill="#2DD4BF"/><text x="150" y="196" text-anchor="middle" font-size="10.5" fill="#9BA6B7">write to every follower feed</text><text x="150" y="218" text-anchor="middle" font-size="10.5" fill="#697285">fast reads · brutal for celebrities</text><text x="510" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#9AA6FF">PULL (fan-out on read)</text><circle cx="510" cy="158" r="16" fill="#5D6BEC"/><text x="510" y="163" text-anchor="middle" font-size="9" fill="#fff">read</text><line x1="510" y1="142" x2="420" y2="78" stroke="#697285" stroke-width="1.2"/><circle cx="420" cy="70" r="7" fill="#E8975A"/><line x1="510" y1="142" x2="470" y2="78" stroke="#697285" stroke-width="1.2"/><circle cx="470" cy="70" r="7" fill="#E8975A"/><line x1="510" y1="142" x2="510" y2="78" stroke="#697285" stroke-width="1.2"/><circle cx="510" cy="70" r="7" fill="#E8975A"/><line x1="510" y1="142" x2="550" y2="78" stroke="#697285" stroke-width="1.2"/><circle cx="550" cy="70" r="7" fill="#E8975A"/><line x1="510" y1="142" x2="600" y2="78" stroke="#697285" stroke-width="1.2"/><circle cx="600" cy="70" r="7" fill="#E8975A"/><text x="510" y="196" text-anchor="middle" font-size="10.5" fill="#9BA6B7">gather from everyone you follow</text><text x="510" y="218" text-anchor="middle" font-size="10.5" fill="#697285">cheap writes · slow reads</text></svg><div class="figure-cap"><b>The feed fan-out trade-off.</b> Real systems use a <em>hybrid</em>: push for normal users (precompute), pull for the few celebrities each user follows, then merge at read time — avoiding the 100M-write storm a celebrity post would cause.</div></div>
<div class="callout key"><div class="callout-t">◆ The fan-out decision</div>Pure <strong>push</strong> (precompute every follower's feed on write) makes reads instant but explodes for celebrities — one post by someone with 100M followers = 100M feed writes. Pure <strong>pull</strong> (assemble the feed at read time) is cheap to write but slow to read. The answer is a <strong>hybrid</strong>: push for normal users, pull for the handful of celebrities each user follows, merged at read time.</div>
<p>Feeds live in a fast store (Redis lists / wide-column). This push/pull/hybrid pattern recurs across notifications, chat groups, and more.</p>

<h2><span class="h-node"></span>5 · E-commerce checkout &amp; flash sale</h2>
<p><strong>Shape:</strong> two problems. The <em>load</em> problem (a million people at 10:00:00) is solved with a <strong>virtual waiting room</strong> that admits users at a sustainable rate, plus edge caching of the product page. The <em>correctness</em> problem (never oversell, never double-charge) is solved with an <strong>atomic conditional write</strong> for inventory (<code>UPDATE ... SET stock=stock-1 WHERE id=? AND stock&gt;0</code> — exactly one racer wins) and an <strong>idempotency key</strong> on payment. The multi-step checkout is a <strong>saga</strong> with compensating actions.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Never oversell; never double-charge; survive a burst of traffic far above normal; keep the browsing experience fast throughout.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Separate the load problem from the correctness problem.</strong> A waiting room and edge caching handle the crowd; an atomic conditional write handles the contention. They are solved with completely different tools.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">The atomic decrement with a TTL hold, the payment idempotency key, and the checkout saga with compensating actions.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Trying to solve contention by scaling up. More servers do not stop two shoppers buying the same last unit — only an atomic conditional write does.</div></div></div>

<h2><span class="h-node"></span>6 · Video streaming (YouTube)</h2>
<p><strong>Shape:</strong> two separate paths. The <strong>upload/transcode path</strong> is an async pipeline: the raw upload lands in object storage, a queue triggers parallel workers that transcode into multiple resolutions and formats (adaptive bitrate). The <strong>watch path</strong> is almost entirely <strong>CDN</strong> — video chunks served from edges near viewers. Metadata (title, views) lives in a database; the video bytes never touch your app servers.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Uploads are heavy and slow; playback must start fast anywhere in the world; storage and egress are enormous; many device types and connection speeds.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Two entirely separate paths.</strong> Upload/transcode is an async batch pipeline; playback is a CDN problem. The application servers never touch video bytes on either path.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">The transcoding pipeline (parallel workers producing multiple renditions, idempotent and resumable) and adaptive bitrate streaming, where the player switches quality as bandwidth changes.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Streaming video through your own servers. At tens of terabits per second, no origin can serve it — the CDN is not an optimization here, it is the architecture.</div></div></div>

<h2><span class="h-node"></span>7 · Ride-hailing (Uber)</h2>
<p><strong>Shape:</strong> geospatial + matching. Driver locations stream into an in-memory <strong>geospatial index</strong> (geohash/S2/H3 cells) with TTL, so "find nearby drivers" queries my cell plus neighbors. Matching a rider to a driver uses an <strong>atomic lock</strong> on the driver (the same conditional-write primitive) so two riders can't grab the same driver. Live location is ephemeral; trip and payment records are durable and strongly consistent.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Answer "who is near me?" constantly and fast; absorb a firehose of location updates; match without double-assigning; track trips live; keep money records exact.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Index by map cell, not coordinates.</strong> Geohash/S2/H3 turns a global proximity scan into a lookup of one cell plus its neighbors.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">The cell-size trade-off (large cells return too many candidates; small cells force scanning many neighbors), and separating disposable in-memory positions from durable trip records.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Storing every location ping durably. These are disposable — the next update arrives in seconds — so memory with a TTL is the right home.</div></div></div>

<div class="callout note"><div class="callout-t">◆ Recurring patterns</div>Notice how the same tools reappear: cache/CDN for read-heavy paths, queues for async work, the push/pull/hybrid fan-out, the stateful connection tier for real-time, and — above all — the <strong>atomic conditional write</strong> for every "two things must not happen at once" problem.</div>
`});

GUIDE.chapters.push({
id:'ch07',num:'07',group:'Practice by design',title:'Worked Designs II',
lead:'Five harder systems introducing problem shapes the first seven did not cover: concurrent editing, large pipelines, fan-out delivery, scheduled execution, and extreme contention.',
body:`
<h2><span class="h-node"></span>8 · Collaborative editor (Google Docs)</h2>
<p><strong>New shape:</strong> multiple users mutating shared data in real time without clobbering each other. Two solutions: <strong>Operational Transformation (OT)</strong> transforms concurrent edit operations against each other so they converge (needs a central server); <strong>CRDTs</strong> design the data so concurrent operations commute, converging without coordination (great for offline/P2P, heavier per-element). One server "owns" each document for ordering; an append-only <strong>op log</strong> gives durability and history (undo = applying inverse operations). Snapshots avoid replaying millions of ops on load.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Many people typing at once with no lost edits, sub-second updates, offline edits merged on reconnect, full history and undo.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Operations, not document snapshots.</strong> Send small edit operations and reconcile them with OT (transform against each other) or CRDTs (designed so order does not matter) — sending whole documents guarantees lost work.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">OT vs. CRDT trade-offs, the append-only op log for history and undo, and snapshots so opening a long document does not replay a million operations.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Last-write-wins on the whole document. Two people typing for ten seconds means one of them silently loses everything.</div></div></div>

<h2><span class="h-node"></span>9 · Web crawler</h2>
<p><strong>New shape:</strong> a massive, polite, never-ending pipeline. The heart is the <strong>URL frontier</strong> — a priority queue that also enforces <strong>politeness</strong> (never hammer one host; respect <code>robots.txt</code> and crawl-delay), organized so each host drains at its own rate. Dedup at scale uses a <strong>Bloom filter</strong> in RAM backing an authoritative store. Partition the frontier <strong>by host</strong> across nodes — which also naturally enforces politeness (one node per host = one gatekeeper). Fetchers are idempotent, so the crawl resumes after any crash.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Fetch billions of pages, never hammer one site, avoid re-fetching duplicates, recrawl often-changing pages more frequently, survive constant crashes.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>The URL frontier is the system.</strong> A priority queue that also enforces politeness per host is where nearly all the design difficulty lives — the downloader itself is trivial.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">Politeness (respecting robots.txt and per-host delays by partitioning the frontier by host), and dedup at scale using a Bloom filter in front of the authoritative store.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Treating it as "just fetch pages in parallel." Without per-host throttling you will be blocked everywhere within minutes.</div></div></div>

<h2><span class="h-node"></span>10 · Notification fan-out (push/SMS/email)</h2>
<p><strong>New shape:</strong> one platform, many channels, huge fan-out, unreliable third-party providers. A pipeline: ingest → dedup (idempotency key) → load prefs / filter opt-outs and quiet hours → render → route to per-channel queues → channel workers → <strong>provider adapters</strong>. Each provider sits behind a common <strong>Adapter</strong> interface with a <strong>circuit breaker</strong> for failover (SES ↔ SendGrid). <strong>Priority lanes</strong> (bulkheads) keep a password reset from sitting behind a 10M-message marketing blast.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">One event may notify millions; several channels with different reliability; respect user preferences and quiet hours; urgent messages must not queue behind bulk ones.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Filter before you fan out, and isolate by priority.</strong> Drop opt-outs early (cheap and legally required), and give urgent notifications their own lane so a marketing blast cannot delay a password reset.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">Provider failover behind a common adapter with a circuit breaker, plus deduplication so a retried event does not notify the same person twice.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">A single shared queue for everything. One bulk campaign then delays every time-critical message in the system.</div></div></div>

<h2><span class="h-node"></span>11 · Distributed job scheduler</h2>
<div class="figure"><svg viewBox="0 0 660 200" role="img" aria-label="Atomic claim with lease"><rect x="240" y="20" width="180" height="40" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="330" y="45" text-anchor="middle" font-size="12" fill="#E7EBF2">Job store (source of truth)</text><rect x="30" y="120" width="150" height="46" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.4"/><text x="105" y="141" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Worker A</text><text x="105" y="157" text-anchor="middle" font-size="10" fill="#2DD4BF">claims job · lease 30s</text><rect x="255" y="120" width="150" height="46" rx="8" fill="#161B24" stroke="#697285" stroke-width="1.4"/><text x="330" y="141" text-anchor="middle" font-size="11.5" fill="#9BA6B7">Worker B</text><text x="330" y="157" text-anchor="middle" font-size="10" fill="#697285">claim fails — already taken</text><rect x="480" y="120" width="150" height="46" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.4"/><text x="555" y="141" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Worker C</text><text x="555" y="157" text-anchor="middle" font-size="10" fill="#E8975A">A died → lease expired → retry</text><g stroke="#697285" stroke-width="1.3"><line x1="300" y1="60" x2="120" y2="114"/><line x1="330" y1="60" x2="330" y2="114"/><line x1="360" y1="60" x2="540" y2="114"/></g><text x="330" y="96" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#9BA6B7">UPDATE ... SET owner=? WHERE status=READY</text></svg><div class="figure-cap"><b>One claim wins; a dead worker releases its job automatically.</b> The atomic conditional update stops two workers running the same job, and the expiring lease means a crash causes a retry rather than a lost job — which is exactly why tasks must be idempotent.</div></div>
<p><strong>New shape:</strong> run tasks at the right time, the right number of times, across a fleet. A durable job store indexed on <code>next_run_at</code>; dispatchers poll for due jobs and <strong>atomically claim</strong> each (<code>UPDATE ... SET status='CLAIMED' WHERE status='READY'</code>) so two dispatchers never run the same job. Claims carry a <strong>lease</strong>; if a worker dies, the lease expires and the job is reclaimed → <strong>at-least-once</strong> execution, which is why tasks must be <strong>idempotent</strong>. HA via leader election or sharding, so there's no single point of failure and no double-firing. Don't trust worker wall-clocks (see DDIA, ch. 08 territory).</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Run jobs at the right time, exactly the intended number of times, across a fleet; survive worker crashes; support recurring and delayed jobs; no single point of failure.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Atomic claim plus a lease.</strong> Workers claim jobs conditionally so two never run the same one, and the lease expires if a worker dies so the job is retried rather than lost.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">Leader election or sharding the job space (so there is no single dispatcher to fail), and why at-least-once execution forces jobs to be idempotent.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Trusting worker clocks. Machine clocks drift; the job store must be the single source of truth for what is due.</div></div></div>

<h2><span class="h-node"></span>12 · Ticketing (Ticketmaster)</h2>
<p><strong>New shape:</strong> flash-sale load <em>plus</em> a spatial constraint — users want <em>specific seats</em>, and two people must never get the same one. Reuse the flash-sale toolkit (waiting room + edge caching of the seat map) for load. For correctness, an <strong>atomic seat hold with TTL</strong>: <code>UPDATE seats SET status='HELD', expires=now+8min WHERE seat_id=? AND status='AVAILABLE'</code> — one racer wins, the other is told "pick another." This is <strong>optimistic</strong> concurrency (try and detect conflict); for a few ultra-contended seats you could use pessimistic <code>SELECT FOR UPDATE</code>, but it serializes access. Seat state lives in a strongly-consistent store; money follows the checkout saga.</p>
<div class="dd-grid"><div class="dd-cell"><div class="dd-h">Requirements that matter</div><div class="dd-b">Enormous instantaneous demand for scarce inventory; absolutely no double-selling; abandoned carts must release seats; the seat map should feel live.</div></div><div class="dd-cell"><div class="dd-h">The key decision</div><div class="dd-b"><strong>Hold seats with an expiring lock.</strong> An atomic conditional update marks a seat HELD with a TTL, so exactly one buyer wins and unfinished checkouts self-release.</div></div><div class="dd-cell"><div class="dd-h">Deep-dive on</div><div class="dd-b">Optimistic vs. pessimistic locking (conditional write for volume, row locks for a few ultra-contended seats), and group bookings as an all-or-nothing claim on adjacent seats.</div></div><div class="dd-cell dd-warn"><div class="dd-h">Classic mistake</div><div class="dd-b">Caching the seat map as the source of truth. Cache it for display, but the hold operation must always hit the authoritative store.</div></div></div>

<div class="callout key"><div class="callout-t">◆ The one primitive to notice above all</div>Across scenarios 5, 7, 9, 11, and 12, the same tiny mechanism solves every contention problem: an <strong>atomic conditional write</strong> — <code>UPDATE ... SET ... WHERE &lt;still-valid-condition&gt;</code> — where exactly one racer's condition holds. Inventory decrement, driver lock, job claim, seat hold: one idea, many costumes. Internalize this and you can solve most "two things must not happen at once" problems on sight.</div>
`});

GUIDE.chapters.push({
id:'ch10',num:'10',group:'The operational craft',title:'API Design',
lead:'An API is a user interface for developers, and it is expensive to change once people depend on it. Make it predictable, hard to misuse, and cheap to evolve.',
body:`
<h2><span class="h-node"></span>Choosing a style</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div><strong>REST</strong> is a public menu anyone can order from (great for outside developers). <strong>gRPC</strong> is fast kitchen-to-kitchen shorthand between your own services. <strong>GraphQL</strong> lets a client say "just give me exactly these three fields," which is handy when many different apps need different slices of the same data.</div>

<div class="tbl-wrap"><table><thead><tr><th>Use case</th><th>Pick</th></tr></thead><tbody>
<tr><td>Public API for third parties</td><td><strong>REST</strong> — universal, cacheable, readable</td></tr>
<tr><td>Internal service-to-service, high throughput</td><td><strong>gRPC</strong> — binary, typed, streaming</td></tr>
<tr><td>Many clients needing different data shapes</td><td><strong>GraphQL</strong> — client picks fields</td></tr>
<tr><td>Simple CRUD backend</td><td><strong>REST</strong></td></tr>
</tbody></table></div>
<p>A mature architecture often uses all three: GraphQL/REST at the edge, gRPC between internal services.</p>

<h2><span class="h-node"></span>Modeling resources (REST)</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Name things as nouns and let the HTTP verb be the action: <code>GET /users/7/orders</code>, not <code>/getUserOrders</code>. Think aisles and shelves in a store (nouns you navigate), not a long list of "goFetchThis" commands.</div>
<p>Resources are <strong>nouns</strong>, the HTTP method is the verb: <code>GET /users/7/orders</code>, not <code>/getUserOrders</code>. Map methods to intent (GET reads, POST creates, PUT replaces, PATCH updates, DELETE removes) and <strong>return correct status codes</strong> — they're part of the contract (<code>201</code> Created, <code>409</code> Conflict, <code>429</code> Too Many Requests, etc.). Above all, be <strong>consistent</strong> across the whole API — inconsistent naming or paging turns every integration into a lookup.</p>

<h2><span class="h-node"></span>The four recurring problems</h2>
<h3>Versioning</h3>
<p>Prefer <strong>additive, backward-compatible changes</strong> so you rarely need a new version — adding an optional field breaks no one; removing or renaming one does. When you must break, use <code>/v2/</code> (or header versioning), publish a deprecation timeline, and run old and new in parallel.</p>
<h3>Pagination</h3>
<p>Never return an unbounded list. <strong>Offset</strong> paging (<code>?limit=20&amp;offset=40</code>) is simple but degrades at large offsets and can skip/duplicate under change. <strong>Cursor (keyset)</strong> paging passes an opaque pointer to the last item — efficient at any depth and stable — at the cost of no random page access. Prefer cursor for large or fast-changing data.</p>
<h3>Idempotency</h3>
<p>Clients retry, so mutating endpoints accept an <strong>idempotency key</strong> (a header): the server stores the first result and returns it on repeats instead of re-executing. GET/PUT/DELETE are naturally idempotent; POST is not — which is exactly why "create" endpoints need explicit keys.</p>
<h3>Error handling</h3>
<p>Use the right status code plus a <strong>structured body</strong> with a stable machine-readable <code>code</code>, a human <code>message</code>, and a <code>request_id</code> (so a caller can point you to the exact log line). Never leak stack traces or SQL.</p>

<div class="callout key"><div class="callout-t">◆ Design for evolution</div>Be <strong>contract-first</strong> — define the spec (OpenAPI, .proto, GraphQL SDL) before implementing, so you get generated clients, mock servers, request validation, and contract testing. Rate-limit and paginate by default. Design the unhappy paths (partial failure, timeout, duplicate) as carefully as the happy one.</div>

<h2><span class="h-node"></span>Pagination — never return everything</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>If an endpoint can return a million rows, one day it will, and it will take down your service. Every list endpoint needs a built-in limit, the same way a vending machine gives you one snack per press rather than emptying the tray.</div>
<p>Two ways to page through a list, with a clear winner at scale:</p>
<div class="tbl-wrap"><table><thead><tr><th></th><th>Offset paging</th><th>Cursor paging</th></tr></thead><tbody>
<tr><td>Looks like</td><td><code>?limit=20&amp;offset=4000</code></td><td><code>?limit=20&amp;after=abc123</code></td></tr>
<tr><td>How it works</td><td>"Skip 4,000 rows, then give me 20"</td><td>"Continue from this exact item"</td></tr>
<tr><td>Deep pages</td><td>Slow — the database counts past every skipped row</td><td>Fast at any depth</td></tr>
<tr><td>If data changes mid-paging</td><td>Rows can be skipped or shown twice</td><td>Stable</td></tr>
<tr><td>Jump to page 900?</td><td>Yes</td><td>No — only next/previous</td></tr>
</tbody></table></div>
<p>Use offset paging for small admin tables where jumping to a page matters. Use <strong>cursor paging</strong> for anything large or fast-moving — feeds, logs, search results — and return the next cursor in the response so clients never build it themselves.</p>

<h2><span class="h-node"></span>Designing errors people can actually handle</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>An error message is part of your product. "Something went wrong" tells a developer nothing; a clear code plus a request ID turns a two-hour mystery into a two-minute fix.</div>
<p>A good error response has four things: the right <strong>status code</strong>, a stable machine-readable <strong>code</strong>, a human <strong>message</strong>, and a <strong>request ID</strong> to find it in your logs.</p>
<div class="tbl-wrap"><table><thead><tr><th>Situation</th><th>Status</th><th>Why this one</th></tr></thead><tbody>
<tr><td>Malformed request body</td><td>400</td><td>The caller must change something</td></tr>
<tr><td>Not logged in / bad token</td><td>401</td><td>We do not know who you are</td></tr>
<tr><td>Logged in, not allowed</td><td>403</td><td>We know you — you just cannot do this</td></tr>
<tr><td>Resource does not exist</td><td>404</td><td>Nothing here (also used to hide private resources)</td></tr>
<tr><td>Version conflict / duplicate</td><td>409</td><td>State clashed with someone else</td></tr>
<tr><td>Failed business validation</td><td>422</td><td>Well-formed but semantically invalid</td></tr>
<tr><td>Too many requests</td><td>429</td><td>Slow down — pair with <code>Retry-After</code></td></tr>
<tr><td>Our bug / dependency down</td><td>500 / 503</td><td>Not the caller's fault — safe to retry</td></tr>
</tbody></table></div>
<div class="callout key"><div class="callout-t">◆ The rule clients depend on</div><strong>4xx means "you fix it," 5xx means "we fix it."</strong> That single distinction is what lets a client library decide automatically whether retrying could ever help. Getting it wrong makes clients hammer you with retries for errors that will never succeed.</div>
<p>Never leak stack traces, SQL, or internal hostnames in an error — it confuses callers and hands attackers a map of your system.</p>

<h2><span class="h-node"></span>Webhooks — when your API calls them back</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Instead of a client asking "is it done yet?" every few seconds (polling), you call their URL the moment something happens. It is the difference between repeatedly checking the mailbox and having the postman ring your doorbell.</div>
<p>Webhooks look simple and have three classic traps, all of which have standard answers:</p>
<ul>
<li><strong>Delivery fails</strong> — the receiver is down. Retry with exponential backoff for a bounded window, then park it and alert. Treat their endpoint as unreliable, because it is.</li>
<li><strong>Duplicates arrive</strong> — because you retried, receivers can get the same event twice. Send a unique event ID and tell receivers to be idempotent — the same coat-check ticket idea as everywhere else.</li>
<li><strong>Anyone can fake a call</strong> — your webhook URL is just a public endpoint. <strong>Sign</strong> each payload with a shared secret so receivers can verify the message genuinely came from you.</li>
</ul>
<div class="figure"><svg viewBox="0 0 660 150" role="img" aria-label="Polling versus webhooks">
<line x1="330" y1="14" x2="330" y2="136" stroke="#343D4C"/>
<text x="160" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#9AA6FF">POLLING</text>
<rect x="30" y="60" width="86" height="34" rx="7" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="73" y="82" text-anchor="middle" font-size="11" fill="#E7EBF2">Client</text>
<rect x="206" y="60" width="86" height="34" rx="7" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="249" y="82" text-anchor="middle" font-size="11" fill="#E7EBF2">API</text>
<g stroke="#697285" stroke-width="1.2">
<line x1="116" y1="70" x2="198" y2="70"/><polygon points="198,66 206,70 198,74" fill="#697285"/>
<line x1="116" y1="84" x2="198" y2="84"/><polygon points="198,80 206,84 198,88" fill="#697285"/></g>
<text x="160" y="112" text-anchor="middle" font-size="10" fill="#9BA6B7">"done yet?" "done yet?" "done yet?"</text>
<text x="160" y="128" text-anchor="middle" font-size="10" fill="#E8975A">wasteful + laggy</text>
<text x="500" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#9AA6FF">WEBHOOK</text>
<rect x="370" y="60" width="86" height="34" rx="7" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="413" y="82" text-anchor="middle" font-size="11" fill="#E7EBF2">Client</text>
<rect x="546" y="60" width="86" height="34" rx="7" fill="#161B24" stroke="#2DD4BF" stroke-width="1.4"/><text x="589" y="82" text-anchor="middle" font-size="11" fill="#E7EBF2">API</text>
<g stroke="#2DD4BF" stroke-width="1.4"><line x1="538" y1="77" x2="464" y2="77"/><polygon points="464,73 456,77 464,81" fill="#2DD4BF"/></g>
<text x="500" y="112" text-anchor="middle" font-size="10" fill="#9BA6B7">"it happened!" — once, instantly</text>
<text x="500" y="128" text-anchor="middle" font-size="10" fill="#2DD4BF">efficient + immediate</text>
</svg><div class="figure-cap"><b>Stop asking; get told.</b> Polling wastes requests and still lags behind reality. A webhook fires once, the moment it matters — at the cost of needing retries, deduplication, and signatures.</div></div>

`});

GUIDE.chapters.push({
id:'ch11',num:'11',group:'The operational craft',title:'Security & Privacy',
lead:'Security is a property of the whole design, cheapest to get right early. Assume every input is hostile, every network is tapped, and every component will eventually be breached — then design so no single failure is catastrophic.',
body:`
<h2><span class="h-node"></span>The mental models</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Two habits underpin everything: <strong>assume you will be breached</strong> (so limit how much damage any one leak can do), and <strong>never trust input</strong> just because it showed up. Security is layers, so that if one fails, others still stand.</div>
<p><strong>Threat modeling</strong>: for any design, ask what you're protecting, from whom, how they'd attack, and the impact — at each trust boundary. <strong>Defense in depth</strong>: never rely on one control; layer them so breaching one leaves others standing. <strong>Least privilege</strong>: every user, service, and credential gets the minimum access needed, so a compromise does limited damage. <strong>Never trust the client</strong>: anything on the user's device can be modified, so client-side validation is UX only — every check that matters is re-enforced server-side.</p>

<h2><span class="h-node"></span>Authentication vs. authorization</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div><strong>Authentication</strong> is the bouncer checking who you are at the door. <strong>Authorization</strong> is which rooms your wristband actually lets you into. The classic bug is checking the first but forgetting the second — letting a logged-in user open <em>someone else’s</em> data just by changing a number in the URL.</div>
<p><strong>Authentication (authn)</strong> proves <em>who</em> you are: sessions (stateful, easy to revoke), tokens/JWT (stateless, scales, but hard to revoke before expiry — mitigate with short lifetimes + refresh tokens), or OAuth 2.0 / OpenID Connect for delegated/federated login. Store passwords with a <strong>slow, salted, adaptive hash</strong> (bcrypt/scrypt/Argon2) — never fast hashes or plaintext — and add MFA for anything sensitive.</p>
<div class="callout trade"><div class="callout-t">◆ The most common breach</div><strong>Authorization (authz)</strong> decides what an authenticated caller may do, and it's where many breaches happen. The top web vulnerability is <strong>broken object-level authorization (IDOR)</strong>: the server checks you're logged in but forgets to check you own <em>this specific</em> resource, so changing <code>/orders/42</code> to <code>/orders/43</code> leaks someone else's data. Enforce authz on the server, on every request, at the object level.</div>

<h2><span class="h-node"></span>Vulnerability classes to design against</h2>
<ul>
<li><strong>Injection (SQL/command)</strong> — untrusted input parsed as code. Fix: parameterized queries — never string-concatenate. (Separate code from data.)</li>
<li><strong>XSS</strong> — attacker script runs in a victim's browser. Fix: contextual output encoding + Content Security Policy.</li>
<li><strong>CSRF</strong> — a logged-in user's browser tricked into a request. Fix: anti-CSRF tokens, SameSite cookies.</li>
<li><strong>Security misconfiguration</strong> — default passwords, open buckets, verbose errors. Fix: secure defaults, least privilege.</li>
<li><strong>Vulnerable dependencies</strong> — most of your code is third-party. Fix: track and scan dependencies, patch promptly.</li>
</ul>

<h2><span class="h-node"></span>Protecting data</h2>
<p>Encrypt <strong>in transit</strong> (TLS everywhere, including internal traffic — <strong>zero-trust</strong>) and <strong>at rest</strong> (databases, backups, object storage). Keep <strong>secrets</strong> in a vault, never in code or git — hard-coded secrets are a top breach cause. And <strong>minimize what you collect and keep</strong>: the safest data is the data you don't have.</p>

<h2><span class="h-node"></span>Privacy &amp; compliance</h2>
<p>Privacy now carries legal teeth (GDPR, CCPA). Know where your <strong>PII</strong> lives — you can't protect or delete what you can't find. Regulations grant rights to access, correct, delete ("right to be forgotten"), and export data, so your architecture must be able to <em>find and delete all of a user's data on request</em> — hard if PII is scattered across services, caches, logs, and backups, so design for it early. Practice <strong>privacy by design</strong>: minimize collection, make privacy the default. (General guidance, not legal advice.)</p>

<h2><span class="h-node"></span>The OWASP greatest hits — what actually goes wrong</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Breaches are rarely exotic. The same handful of mistakes cause most of them, year after year, which is good news: learn these and you have avoided the majority of real-world incidents.</div>
<div class="tbl-wrap"><table><thead><tr><th>Weakness</th><th>What it looks like</th><th>The fix</th></tr></thead><tbody>
<tr><td>Broken access control</td><td>Changing <code>/orders/42</code> to <code>/orders/43</code> shows someone else's order</td><td>Check ownership server-side on every request</td></tr>
<tr><td>Injection</td><td>Input gets treated as code (SQL, shell commands)</td><td>Parameterized queries — never glue input into a command</td></tr>
<tr><td>Cryptographic failures</td><td>Passwords in plain text; secrets in the repo; no TLS</td><td>Slow salted hashes, a secrets manager, TLS everywhere</td></tr>
<tr><td>Insecure design</td><td>No rate limit on login; no thought about abuse</td><td>Threat-model before building, not after launch</td></tr>
<tr><td>Vulnerable dependencies</td><td>An old library with a known public exploit</td><td>Scan and patch dependencies continuously</td></tr>
<tr><td>Security misconfiguration</td><td>Default passwords, a public storage bucket, debug mode on</td><td>Harden by default; check what is exposed</td></tr>
</tbody></table></div>
<div class="callout key"><div class="callout-t">◆ The one-sentence version</div>Almost every breach is <strong>someone was allowed to do something they should not have been</strong> — either because you never checked, or because input was trusted as code. Check authorization on every request, and never let data become instructions.</div>

<h2><span class="h-node"></span>Storing passwords (and why fast hashing is a bug)</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A hash turns a password into scrambled output that cannot be reversed. The counter-intuitive part: for passwords you want a hash that is deliberately SLOW. Fast hashes let an attacker test billions of guesses a second against a stolen database.</div>
<p>Three properties, all required:</p>
<ul>
<li><strong>Slow / adaptive</strong> — use bcrypt, scrypt, or Argon2, and raise the cost as hardware improves. Never MD5 or plain SHA-256; they are built for speed, which is exactly wrong here.</li>
<li><strong>Salted</strong> — mix in a unique random value per user, so two people with the same password get different stored values and precomputed "rainbow tables" are useless.</li>
<li><strong>Never logged</strong> — passwords should never appear in logs, error reports, or analytics.</li>
</ul>
<p>Then assume the database leaks anyway: add <strong>multi-factor authentication</strong> so a stolen password alone is not enough, and rate-limit login attempts to blunt credential-stuffing attacks.</p>

<h2><span class="h-node"></span>Defence in depth, drawn</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Never rely on one wall. A castle has a moat, an outer wall, a gate, and guards — so breaching any single one does not hand over the throne room.</div>
<div class="figure"><svg viewBox="0 0 660 230" role="img" aria-label="Layered security controls">
<rect x="30" y="20" width="600" height="190" rx="12" fill="none" stroke="#343D4C" stroke-width="1.4"/>
<text x="44" y="40" font-size="10.5" fill="#697285" font-family="monospace">NETWORK · TLS everywhere, segmentation</text>
<rect x="70" y="52" width="520" height="146" rx="11" fill="none" stroke="#5D6BEC" stroke-width="1.4"/>
<text x="84" y="72" font-size="10.5" fill="#5D6BEC" font-family="monospace">EDGE · rate limits, WAF, DDoS protection</text>
<rect x="112" y="84" width="436" height="102" rx="10" fill="none" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="126" y="104" font-size="10.5" fill="#2DD4BF" font-family="monospace">IDENTITY · authn + authz on every request</text>
<rect x="156" y="116" width="348" height="58" rx="9" fill="none" stroke="#E8975A" stroke-width="1.4"/>
<text x="170" y="136" font-size="10.5" fill="#E8975A" font-family="monospace">APPLICATION · validate input, parameterize</text>
<rect x="206" y="146" width="248" height="20" rx="6" fill="#161B24" stroke="#9BA6B7" stroke-width="1.2"/>
<text x="330" y="160" text-anchor="middle" font-size="10.5" fill="#E7EBF2">DATA · encrypted, least privilege</text>
</svg><div class="figure-cap"><b>Layers, not a single wall.</b> An attacker who slips past one control still faces the next. Design so no single failure — a leaked credential, an unpatched library — hands over everything.</div></div>

id:'ch12',num:'12',group:'The operational craft',title:'Observability & Operations',
lead:'A design is done when you can run it, know when it misbehaves, and recover when it fails. You cannot operate what you cannot see.',
body:`
<h2><span class="h-node"></span>The three pillars</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Like a car dashboard. <strong>Metrics</strong> are the gauges (speed, fuel, temperature) that tell you something is wrong. <strong>Traces</strong> show which leg of a multi-stop trip was slow. <strong>Logs</strong> are the detailed trip journal explaining exactly what happened and why.</div>
<p><strong>Metrics</strong> — numeric time series; cheap, aggregate, ideal for dashboards and alerts. The <strong>four golden signals</strong> are the first things to instrument: <em>latency</em> (as percentiles), <em>traffic</em>, <em>errors</em>, and <em>saturation</em> (how full your tightest resource is).</p>
<p><strong>Logs</strong> — timestamped event records with the detail metrics lack. To be useful they must be <strong>structured</strong> (machine-parseable), <strong>centralized</strong> (one searchable place), and <strong>correlated</strong> (a request/trace ID ties lines together). Never log secrets or PII.</p>
<p><strong>Traces</strong> — follow one request across services to see where the time went. In a slow request crossing eight services, distributed tracing is the <em>only</em> way to find the culprit. The three work together: metrics say something's wrong, traces localize it, logs explain it.</p>

<h2><span class="h-node"></span>Defining reliability: SLOs &amp; error budgets</h2>
<p>An <strong>SLI</strong> is a measurement (% of requests under 300 ms); an <strong>SLO</strong> is your target for it (99.9% over 28 days); an <strong>SLA</strong> is the contractual promise (keep internal SLOs stricter). The powerful concept is the <strong>error budget</strong>: if the SLO is 99.9%, then 0.1% failure is <em>allowed</em>. This reframes reliability from "never fail" to "stay within budget" and resolves the perennial feature-velocity-vs-reliability fight with data — within budget, ship features; over budget, freeze and fix.</p>

<h2><span class="h-node"></span>Alerting that helps</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A good alert is a smoke detector that only goes off for real fires. Fill a house with detectors that shriek at burnt toast and people yank the batteries out — which is precisely what happens to engineers buried in noisy, non-actionable alerts. So you page a human only when real users are actually being hurt.</div>
<div class="callout trade"><div class="callout-t">◆ Alert on symptoms, not causes</div>Page when <em>users are affected</em> (error rate, latency, SLO burn) — not on every internal fluctuation. Every page must be actionable and urgent, or it trains people to ignore alerts (alert fatigue), including the one that matters. Tie alerts to error-budget burn rate.</div>

<h2><span class="h-node"></span>The human practices</h2>
<p><strong>On-call</strong> must be sustainable — a large enough rotation, low page volume, good runbooks. <strong>Incident response</strong>: assign an incident commander, mitigate first (roll back, fail over, shed load), diagnose after. <strong>Blameless postmortems</strong> focus on <em>systemic</em> causes, not individual fault — because systems that let human error cause outages are the real problem — and their key output is action items with owners, tracked to done. <strong>Chaos engineering</strong> deliberately injects failures to verify your redundancy actually works before real failures find it.</p>

<h2><span class="h-node"></span>Reading a dashboard during an incident</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>When something breaks, you are not browsing charts for fun — you are answering three questions, in order: are users hurt? where is it happening? and what changed?</div>
<ol>
<li><strong>Are users actually hurt?</strong> Look at error rate and latency percentiles against the SLO. If users are fine, you have a curiosity, not an incident — do not wake anyone.</li>
<li><strong>Where?</strong> Use a trace to find which service or dependency is slow. Metrics say "something is wrong"; traces say "it is this hop."</li>
<li><strong>What changed?</strong> Nearly every incident follows a change — a deploy, a config flag, a traffic spike, or a dependency's problem. Overlay deploy markers on your graphs so this is instant to check.</li>
<li><strong>Mitigate first, diagnose second.</strong> Roll back, fail over, or shed load to stop the bleeding. Root cause can wait for the postmortem; users cannot.</li>
</ol>
<div class="callout key"><div class="callout-t">◆ The most useful habit</div>Put <strong>deploy markers</strong> on your dashboards. When a graph turns bad, the first question is always "what changed?" — and seeing a deploy line right at the elbow of the graph answers it in one second instead of twenty minutes.</div>

<h2><span class="h-node"></span>Percentiles, explained properly</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>If nine people wait 1 second and one waits 30, the average is 3.9 seconds — a number nobody experienced. Percentiles describe what real people actually felt, which is why we design around them.</div>
<div class="tbl-wrap"><table><thead><tr><th>Metric</th><th>Means</th><th>Use it for</th></tr></thead><tbody>
<tr><td>p50 (median)</td><td>The typical experience</td><td>Everyday health</td></tr>
<tr><td>p95</td><td>1 in 20 requests are at least this slow</td><td>Realistic SLO targets</td></tr>
<tr><td>p99</td><td>1 in 100 — your heaviest, most valuable users</td><td>Tail latency work</td></tr>
<tr><td>Average</td><td>Hides everything interesting</td><td>Almost nothing</td></tr>
</tbody></table></div>
<p>Tail latency also <strong>compounds</strong>: if one page makes 10 backend calls and each has a 1-in-100 chance of being slow, roughly 1 in 10 page loads hits a slow call. That multiplication is why big systems obsess over p99 rather than shrugging at "only 1%."</p>

<h2><span class="h-node"></span>Error budgets — turning arguments into arithmetic</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>"Ship faster!" versus "make it more reliable!" is an argument nobody wins. An error budget replaces it with a number both sides agree on in advance.</div>
<p>If your SLO is 99.9% success, then 0.1% failure is <em>permitted</em> — that is the budget. Within budget, ship features fast. Blow the budget, and the team freezes features to fix reliability until you are back in bounds. Nobody has to win a debate; the number decides.</p>
<div class="figure"><svg viewBox="0 0 660 170" role="img" aria-label="Error budget burn">
<text x="0" y="16" font-size="11" fill="#697285" font-family="monospace">MONTHLY ERROR BUDGET (99.9% SLO)</text>
<rect x="0" y="30" width="640" height="28" rx="6" fill="#161B24" stroke="#343D4C"/>
<rect x="0" y="30" width="180" height="28" rx="6" fill="#2DD4BF" opacity="0.55"/>
<text x="90" y="49" text-anchor="middle" font-size="11" fill="#06231F" font-weight="600">used 28%</text>
<text x="640" y="49" text-anchor="end" font-size="10.5" fill="#9BA6B7">healthy — keep shipping</text>
<rect x="0" y="86" width="640" height="28" rx="6" fill="#161B24" stroke="#343D4C"/>
<rect x="0" y="86" width="610" height="28" rx="6" fill="#E8975A" opacity="0.65"/>
<text x="120" y="105" text-anchor="middle" font-size="11" fill="#2A2118" font-weight="600">used 95%</text>
<text x="640" y="105" text-anchor="end" font-size="10.5" fill="#E8975A">freeze features, fix reliability</text>
<text x="0" y="146" font-size="11" fill="#9BA6B7">99.9% for a month means about 43 minutes of failure is allowed — spend it deliberately.</text>
</svg><div class="figure-cap"><b>One number ends the debate.</b> The budget makes reliability a shared, measurable resource instead of a matter of opinion — and makes "we are shipping too fast" provable rather than arguable.</div></div>
