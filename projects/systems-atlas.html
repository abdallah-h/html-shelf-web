<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Systems Atlas — A Complete Guide to System & Software Design</title>
<meta name="description" content="A complete, self-contained guide to system and software design: 11 chapters, 4 full case studies, 200+ interview questions, 200+ quiz questions, a 70-term glossary and read-alongs of the 10 essential books.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1219">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/1b2396e3a5b5.css" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#0E1219;
  --surface:#161B24;
  --surface-2:#1E2531;
  --inset:#191F2A;
  --ink:#E7EBF2;
  --ink-soft:#9BA6B7;
  --ink-faint:#848EA2;
  --line:#262D3A;
  --line-strong:#343D4C;
  --accent:#5563E8;
  --accent-text:#8A97F8;
  --accent-deep:#9AA6FF;
  --accent-tint:#1B2140;
  --accent-tint-2:#141A2B;
  --signal:#2DD4BF;
  --signal-tint:#0F2A26;
  --warn:#E8975A;
  --warn-tint:#2A2118;
  --schematic:#0A0E15;
  --schematic-2:#151B29;
  --schematic-ink:#C4CCDE;
  --schematic-line:#28303F;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 16px 44px -14px rgba(0,0,0,.6);
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --nav-w:288px;
  --measure:730px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16.5px;line-height:1.68;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv05","ss01";
}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.2;letter-spacing:-.01em;color:var(--ink);margin:0}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent-tint);color:var(--accent-deep)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ============ LAYOUT ============ */
#shell{display:flex;min-height:100vh}
#nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);position:sticky;top:0;height:100vh;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;overflow:hidden;
}
.brand{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.brand-mark{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand-mark svg{flex:0 0 auto}
.brand-name{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
.nav-scroll{overflow-y:auto;flex:1;padding:12px 12px 28px}
.nav-scroll::-webkit-scrollbar{width:9px}
.nav-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px;border:3px solid var(--surface)}
.nav-group{margin-top:16px}
.nav-group:first-child{margin-top:4px}
.nav-group-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:6px 12px 7px;display:flex;align-items:center;gap:8px}
.nav-group-label::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--accent);opacity:.6;transform:rotate(45deg)}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:var(--radius-sm);
  color:var(--ink-soft);font-size:14.5px;font-weight:450;cursor:pointer;transition:background .13s,color .13s;
  border:1px solid transparent;line-height:1.3;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--accent-tint);color:var(--accent-deep);font-weight:600;border-color:#2C3564}
.nav-num{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex:0 0 22px}
.nav-item.active .nav-num{color:var(--accent-text)}
.nav-item .nav-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:30;background:rgba(14,18,25,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 26px;
}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.menu-btn:hover{background:var(--surface-2)}
.search-wrap{position:relative;flex:1;max-width:440px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none}
#search{
  width:100%;padding:9px 12px 9px 37px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  font-family:var(--body);font-size:14px;color:var(--ink);
}
#search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-tint)}
.topbar-spacer{flex:1}
.progress-chip{
  display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 13px 6px 11px;white-space:nowrap;
}
.progress-ring{--p:0;width:20px;height:20px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);
  -webkit-mask:radial-gradient(circle 6px at center,transparent 98%,#000 100%);
  mask:radial-gradient(circle 6px at center,transparent 98%,#000 100%);}

#view{padding:44px 26px 120px;max-width:1080px;margin:0 auto;width:100%}
.reading{max-width:var(--measure)}

/* ============ PROSE ============ */
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::before{content:"";width:22px;height:1.5px;background:var(--accent);opacity:.5}
.page-title{font-size:clamp(30px,4.2vw,44px);font-weight:700;letter-spacing:-.025em;margin:0 0 12px;line-height:1.08}
.page-lead{font-size:19px;line-height:1.6;color:var(--ink-soft);max-width:var(--measure);margin:0 0 8px}
.prose{max-width:var(--measure)}
.prose h2{font-size:25px;margin:46px 0 4px;letter-spacing:-.02em;scroll-margin-top:80px}
.prose h2 .h-node{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:2px;transform:rotate(45deg);margin-right:11px;vertical-align:middle;opacity:.75}
.prose h3{font-size:18.5px;margin:30px 0 2px;color:var(--ink)}
.prose h4{font-size:15px;font-family:var(--display);margin:22px 0 2px;color:var(--ink-soft);font-weight:600}
.prose p{margin:13px 0}
.prose ul,.prose ol{margin:13px 0;padding-left:22px}
.prose li{margin:7px 0}
.prose li::marker{color:var(--accent-text)}
.prose strong{font-weight:600;color:var(--ink)}
.prose em{color:var(--ink-soft)}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--accent-deep);border:1px solid var(--line)}
.prose a{border-bottom:1px solid var(--accent-tint);text-decoration:none}
.divider{height:1px;background:var(--line);border:0;margin:40px 0}

/* callouts */
.callout{border-radius:var(--radius);padding:16px 18px;margin:22px 0;border:1px solid var(--line);background:var(--surface);position:relative;font-size:15px;line-height:1.6}
.callout .callout-t{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.callout.key{background:var(--accent-tint-2);border-color:#2C3564}
.callout.key .callout-t{color:var(--accent-deep)}
.callout.trade{background:var(--warn-tint);border-color:#3A2E20}
.callout.trade .callout-t{color:var(--warn)}
.callout.note{background:var(--signal-tint);border-color:#1E3A34}
.callout.note .callout-t{color:var(--signal)}

/* schematic (code / diagrams) */
.schematic{background:var(--schematic);color:var(--schematic-ink);border-radius:var(--radius);padding:18px 20px;margin:22px 0;
  font-family:var(--mono);font-size:13px;line-height:1.55;overflow-x:auto;border:1px solid var(--schematic-line);position:relative;
  background-image:linear-gradient(var(--schematic-2) 1px,transparent 1px),linear-gradient(90deg,var(--schematic-2) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px;}
.schematic pre{margin:0;white-space:pre;font-family:inherit;position:relative;z-index:1}
.schematic .sch-label{position:absolute;top:10px;right:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#616C85;z-index:2}

/* tables */
.tbl-wrap{overflow-x:auto;margin:22px 0;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding:11px 15px;border-bottom:1px solid var(--line-strong);background:var(--inset);font-weight:500}
td{padding:11px 15px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td strong{color:var(--ink)}

/* ============ CARDS / GENERIC ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{font-family:var(--body);font-weight:550;font-size:14px;padding:9px 16px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-2);border-color:var(--ink-faint)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);background:var(--surface);white-space:nowrap}
.badge.easy{color:var(--signal);border-color:#1E3A34;background:var(--signal-tint)}
.badge.med{color:var(--warn);border-color:#3A2E20;background:var(--warn-tint)}
.badge.hard{color:#FF8F8F;border-color:#3B2626;background:#2A1A1A}
.badge.acc{color:var(--accent-deep);border-color:#2C3564;background:var(--accent-tint)}

/* ============ HERO / LANDING ============ */
.hero{position:relative;border-radius:20px;overflow:hidden;background:var(--schematic);color:#fff;padding:52px 44px 46px;margin-bottom:34px;border:1px solid var(--schematic-line)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--schematic-2) 1px,transparent 1px),linear-gradient(90deg,var(--schematic-2) 1px,transparent 1px);background-size:30px 30px;opacity:.6}
.hero svg.hero-net{position:absolute;right:-40px;top:-20px;opacity:.5;pointer-events:none}
.hero-content{position:relative;z-index:2;max-width:640px}
.hero .eyebrow{color:#8CA0FF}
.hero .eyebrow::before{background:#8CA0FF}
.hero h1{color:#fff;font-size:clamp(32px,5vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.04;margin-bottom:16px}
.hero h1 em{font-style:normal;color:#93A4FF}
.hero-lead{font-size:18.5px;line-height:1.6;color:#B7C0D4;margin-bottom:26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-cta .btn{padding:11px 20px}
.hero-cta .btn.primary{background:#fff;color:var(--schematic);border-color:#fff}
.hero-cta .btn.primary:hover{background:#E7EAFB}
.hero-cta .btn.line{background:transparent;color:#fff;border-color:#3B4260}
.hero-cta .btn.line:hover{background:rgba(255,255,255,.08)}
.hero-stats{display:flex;gap:30px;margin-top:30px;flex-wrap:wrap}
.hero-stat .n{font-family:var(--display);font-size:27px;font-weight:700;color:#fff}
.hero-stat .l{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7C87A0;margin-top:2px}

.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.path-card{padding:22px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.path-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
.path-card .pc-num{font-family:var(--mono);font-size:12px;color:var(--accent-text);letter-spacing:.1em}
.path-card h3{font-size:19px;margin:10px 0 7px}
.path-card p{font-size:14px;color:var(--ink-soft);margin:0;line-height:1.55}
.path-card .pc-meta{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.05em;display:flex;align-items:center;gap:7px}
.sec-head{margin:40px 0 18px}
.sec-head h2{font-size:23px}
.sec-head p{color:var(--ink-soft);margin:6px 0 0;font-size:15px}

/* ============ FLASHCARDS ============ */
.deck-tabs,.quiz-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 24px}
.chip{font-family:var(--body);font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:.13s}
.chip:hover{background:var(--surface-2);color:var(--ink)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.flash-stage{max-width:600px;margin:0 auto}
.flashcard{perspective:1600px;height:290px;margin-bottom:18px;cursor:pointer}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flashcard.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;box-shadow:var(--shadow)}
.flash-front{background:var(--surface)}
.flash-back{background:var(--schematic);color:var(--schematic-ink);transform:rotateY(180deg);border-color:var(--schematic-line)}
.flash-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;position:absolute;top:16px;left:20px;color:var(--ink-faint)}
.flash-back .flash-tag{color:#616C85}
.flash-q{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.flash-a{font-size:15.5px;line-height:1.62;color:var(--schematic-ink)}
.flash-hint{position:absolute;bottom:15px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em}
.flash-back .flash-hint{color:#5B667E}
.flash-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:4px}
.flash-count{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft)}
.flash-count b{color:var(--ink)}
.flash-nav{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:.13s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.rate-row{display:flex;gap:10px;justify-content:center;margin-top:14px}

/* ============ QUIZ ============ */
.quiz-wrap{max-width:660px}
.quiz-progress{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-bottom:22px}
.quiz-progress i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.q-num{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px}
.q-text{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.32;margin-bottom:20px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;margin-bottom:10px;transition:.13s;font-size:15px;line-height:1.5}
.opt:hover{border-color:var(--line-strong);background:var(--surface-2)}
.opt .opt-key{font-family:var(--mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.opt.correct{border-color:var(--signal);background:var(--signal-tint)}
.opt.correct .opt-key{background:var(--signal);color:#06231F}
.opt.wrong{border-color:#7A3F3F;background:#2A1A1A}
.opt.wrong .opt-key{background:#C4534E;color:#fff}
.opt.disabled{cursor:default;pointer-events:none;opacity:.72}
.opt.disabled.correct,.opt.disabled.wrong{opacity:1}
.explain{border-left:3px solid var(--accent);background:var(--accent-tint-2);padding:13px 16px;border-radius:0 10px 10px 0;margin:6px 0 20px;font-size:14.5px;line-height:1.6;display:none}
.explain.show{display:block;animation:fade .25s}
.explain b{color:var(--accent-deep)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:8px}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-score{font-family:var(--display);font-size:54px;font-weight:700;color:var(--accent-text);line-height:1}
.quiz-score small{font-size:24px;color:var(--ink-faint)}

/* ============ ACCORDION (interview / drills / challenges) ============ */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 22px}
.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.acc-head{display:flex;align-items:flex-start;gap:14px;padding:17px 20px;cursor:pointer;transition:background .12s}
.acc-head:hover{background:var(--surface-2)}
.acc-q{flex:1;font-family:var(--display);font-size:16.5px;font-weight:600;line-height:1.4;color:var(--ink)}
.acc-meta{display:flex;gap:7px;align-items:center;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.acc-chev{flex:0 0 auto;color:var(--ink-faint);transition:transform .22s;margin-top:3px}
.acc.open .acc-chev{transform:rotate(90deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc-body-inner{padding:2px 20px 20px;font-size:15px;line-height:1.66;color:var(--ink-soft);border-top:1px solid var(--line)}
.acc-body-inner p{margin:12px 0}
.acc-body-inner strong{color:var(--ink)}
.acc-body-inner code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--accent-deep)}
.acc-body-inner ul{margin:12px 0;padding-left:20px}
.acc-body-inner li{margin:6px 0}
.acc-body-inner li::marker{color:var(--accent-text)}
.hint-block{margin:10px 0}
.hint-toggle{font-family:var(--mono);font-size:12px;color:var(--accent-text);cursor:pointer;user-select:none;display:inline-flex;gap:7px;align-items:center;padding:6px 0}
.hint-content{display:none;padding:10px 14px;background:var(--inset);border-radius:9px;margin-top:6px;font-size:14.5px;border:1px solid var(--line)}
.hint-content.show{display:block}
.cat-title{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.cat-title::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);border-radius:1px}
.cat-title .cat-count{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-weight:400;letter-spacing:.05em}

/* glossary */
.gloss-search{margin-bottom:20px}
.gloss-group{margin-bottom:26px}
.gloss-item{padding:13px 0;border-bottom:1px solid var(--line)}
.gloss-term{font-family:var(--display);font-weight:600;font-size:15.5px;color:var(--ink)}
.gloss-def{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin-top:3px}
.gloss-item code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--accent-deep)}
.gloss-ex{font-size:13.5px;color:var(--ink-faint);line-height:1.55;margin-top:6px;padding:9px 12px;background:var(--inset);border-radius:8px;border-left:2px solid var(--accent)}
.gloss-ex .ex-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);font-weight:600;margin-right:5px}
.figure{margin:26px 0;padding:20px 18px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.figure svg{display:block;width:100%;height:auto;max-width:660px;margin:0 auto;font-family:var(--body)}
.fig-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;border-radius:8px}
.fig-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fig-hint{display:none}
@media(max-width:720px){
  .fig-scroll svg{width:680px;min-width:680px;max-width:none}
  .fig-hint{display:block;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-faint);margin-top:8px}
}
.figure-cap{margin-top:14px;font-size:13px;color:var(--ink-faint);text-align:center;line-height:1.55}
.figure-cap b{color:var(--ink-soft);font-weight:600}
.dash-panel{margin:8px 0 40px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.dash-title{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink)}
.dash-reset{background:transparent;border:1px solid var(--line-strong);color:var(--ink-faint);font-size:12px;padding:5px 12px;border-radius:20px;cursor:pointer;font-family:var(--body)}
.dash-reset:hover{color:var(--ink);border-color:var(--ink-faint)}
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.dash-cell{min-width:0}
.dash-n{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent-deep);line-height:1}
.dash-n small{font-size:16px;color:var(--ink-faint);font-weight:500}
.dash-l{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.dash-bar{height:5px;background:var(--surface-2);border-radius:5px;margin-top:9px;overflow:hidden}
.dash-bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.dash-note{margin-top:16px;font-size:12px;color:var(--ink-faint)}
.sr-card{padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .15s}
.sr-card:hover{border-color:var(--accent);transform:translateX(2px)}
.sr-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text);margin-bottom:5px}
.sr-label{font-weight:600;font-size:15.5px;color:var(--ink);line-height:1.4;margin-bottom:5px}
.sr-snip{font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 30px}
.dd-cell{background:var(--surface-2);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:9px;padding:13px 15px}
.dd-cell.dd-warn{border-left-color:var(--warn)}
.dd-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:6px}
.dd-cell.dd-warn .dd-h{color:var(--warn)}
.dd-b{font-size:13.5px;line-height:1.6;color:var(--ink-soft)}
.dd-b strong{color:var(--ink)}
.miss-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.miss-q{font-weight:600;color:var(--ink);font-size:14.5px;line-height:1.5;margin-bottom:10px}
.miss-row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;padding:7px 10px;border-radius:7px;margin-bottom:6px}
.miss-row span{font-family:var(--mono);font-weight:600;flex:0 0 auto}
.miss-wrong{background:#2A1A1A;color:#FFB4B4;text-decoration:line-through;text-decoration-color:rgba(255,143,143,.5)}
.miss-right{background:var(--signal-tint);color:var(--signal)}
.miss-ex{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-top:8px}
.star-btn{background:transparent;border:0;color:var(--ink-faint);font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;margin-right:4px;border-radius:6px}
.star-btn:hover{color:var(--warn)}
.star-btn.on{color:var(--warn)}
[data-a11y]:focus-visible,.star-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:640px){.dd-grid{grid-template-columns:1fr}}
@media(max-width:640px){.dash-grid{grid-template-columns:repeat(2,1fr);gap:16px 18px}}

/* books */
.book-card{padding:20px;display:flex;gap:18px;margin-bottom:14px;align-items:flex-start}
.book-spine{width:46px;height:64px;border-radius:4px;flex:0 0 auto;background:linear-gradient(135deg,#3A46C9,#6472F0);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;color:#fff;font-size:18px;box-shadow:var(--shadow)}
.book-body{flex:1;min-width:0}
.book-title{font-family:var(--display);font-size:17px;font-weight:600}
.book-author{font-size:13px;color:var(--ink-faint);font-family:var(--mono);margin:2px 0 8px}
.book-thesis{font-size:14.5px;color:var(--ink-soft);line-height:1.55}
.book-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* empty state */
.empty{text-align:center;padding:60px 20px;color:var(--ink-faint)}
.empty svg{margin-bottom:14px;opacity:.5}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.reveal.in{opacity:1;transform:none}

/* scrolltop */
#toTop{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:0;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:50}
#toTop.show{display:flex}

/* mobile */
.nav-backdrop{display:none}
@media(max-width:920px){
  #nav{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .28s;box-shadow:var(--shadow-lg)}
  #nav.open{transform:none}
  .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(20,23,30,.4);z-index:35}
  .nav-backdrop.show{display:block}
  .menu-btn{display:flex}
  #view{padding:30px 18px 100px}
  .hero{padding:38px 24px}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  .progress-chip .pc-label{display:none}
}
@media(max-width:560px){
  body{font-size:16px}
  #topbar{padding:10px 16px}
  .hero-stats{gap:20px}
}
@media print{
  #sidebar,#topbar,#toTop,.fig-hint,.filter-row,.quiz-tabs,.deck-tabs,.btn,.dash-panel,.sr-card{display:none !important}
  #main,#view{margin:0 !important;padding:0 !important;max-width:100% !important}
  body{background:#fff !important;color:#111 !important}
  .card,.callout,.figure,.tbl-wrap table{border-color:#bbb !important;background:#fff !important;break-inside:avoid}
  h1,h2,h3{color:#111 !important;break-after:avoid}
  p,li{color:#222 !important}
  a{color:#111 !important;text-decoration:underline}
  .figure svg{max-width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="shell">
  <aside id="nav">
    <div class="brand">
      <div class="brand-mark" onclick="go('home')">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <rect x="1" y="1" width="28" height="28" rx="7" fill="#2B44C9"/>
          <circle cx="9" cy="9" r="2.4" fill="#fff"/><circle cx="21" cy="9" r="2.4" fill="#93A4FF"/>
          <circle cx="9" cy="21" r="2.4" fill="#93A4FF"/><circle cx="21" cy="21" r="2.4" fill="#fff"/>
          <path d="M9 9L21 21M21 9L9 21" stroke="#fff" stroke-opacity=".55" stroke-width="1.3"/>
        </svg>
        <div>
          <div class="brand-name">The Systems Atlas</div>
          <div class="brand-sub">Design · Build · Interview</div>
        </div>
      </div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
  </aside>
  <div class="nav-backdrop" id="navBackdrop" onclick="closeNav()"></div>

  <div id="main">
    <header id="topbar">
      <button class="menu-btn" onclick="openNav()" aria-label="Open navigation">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg>
      </button>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input id="search" placeholder="Search topics, terms, questions…" autocomplete="off">
      </div>
      <div class="topbar-spacer"></div>
      <div class="progress-chip"><span class="progress-ring" id="pRing"></span><span><b id="pPct">0%</b> <span class="pc-label">complete</span></span></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14V4M4 9l5-5 5 5"/></svg>
</button>

<script>
/* ================= DATA (populated in chunks) ================= */
window.GUIDE={chapters:[],flashcards:[],quizzes:[],estimation:[],challenges:[],interview:[],glossary:[],books:[],cases:[]};
const S={progress:{},flash:{},done:{},quizBest:{},srs:{},srsSession:0,saved:{},route:'home'};

/* ================= PERSISTENCE ================= */
const PKEY='systemsAtlas.v1';
function saveState(){
  try{
    const flash={};
    for(const k in S.flash){ if(S.flash[k] instanceof Set) flash[k]=Array.from(S.flash[k]); }
    localStorage.setItem(PKEY, JSON.stringify({progress:S.progress,done:S.done,quizBest:S.quizBest,flash:flash,srs:S.srs,srsSession:S.srsSession,saved:S.saved}));
  }catch(e){/* storage unavailable — degrade gracefully */}
}
function loadState(){
  try{
    const raw=localStorage.getItem(PKEY); if(!raw)return;
    const d=JSON.parse(raw);
    S.progress=d.progress||{}; S.done=d.done||{}; S.quizBest=d.quizBest||{}; S.srs=d.srs||{}; S.srsSession=d.srsSession||0; S.saved=d.saved||{};
    if(d.flash){ for(const k in d.flash){ S.flash[k]=new Set(d.flash[k]); } }
  }catch(e){/* ignore corrupt/blocked storage */}
}

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

/* ================= ROUTER ================= */
function go(id){
  const cur=(location.hash||'#home').slice(1);
  if(cur===id){route();return;}   // same route (e.g. a second search) — re-render explicitly
  location.hash=id;
}
window.addEventListener('hashchange',route);
function route(){
  const id=(location.hash||'#home').slice(1);
  if(id!=='mock'&&typeof stopMock==='function')stopMock();
  S.route=id;
  window.scrollTo(0,0);
  render(id);
  buildNav();
  closeNav();
}
function openNav(){$('#nav').classList.add('open');$('#navBackdrop').classList.add('show');}
function closeNav(){$('#nav').classList.remove('open');$('#navBackdrop').classList.remove('show');}

/* ================= NAV ================= */
function navModel(){
  const learn=GUIDE.chapters.map((c,i)=>({id:c.id,num:c.num,t:c.title}));
  return [
    {label:'Start',items:[{id:'home',num:'◆',t:'Overview & paths'}]},
    {label:'Learn',items:learn},
    {label:'Case studies',items:GUIDE.cases.map(c=>({id:c.id,num:c.icon||'▦',t:c.navTitle||c.title}))},
    {label:'Practice',items:[
      {id:'flashcards',num:'✦',t:'Flashcards'},
      {id:'review',num:'✦',t:'Review session'},
      {id:'quizzes',num:'✦',t:'Quizzes'},
      {id:'estimation',num:'✦',t:'Estimation drills'},
      {id:'challenges',num:'✦',t:'Design challenges'},
    ]},
    {label:'Interview',items:[
      {id:'framework',num:'▨',t:'The framework'},
      {id:'mock',num:'▨',t:'Mock interview'},
      {id:'interview',num:'▨',t:'Q&A bank'},
    ]},
    {label:'Reference',items:[
      {id:'reference',num:'▤',t:'Quick reference'},
      {id:'books',num:'▤',t:'Essential books'},
      {id:'glossary',num:'▤',t:'Glossary'},
    ]},
  ];
}
function buildNav(){
  const wrap=$('#navScroll');wrap.innerHTML='';
  navModel().forEach(g=>{
    const grp=el('div','nav-group');
    grp.appendChild(el('div','nav-group-label',esc(g.label)));
    g.items.forEach(it=>{
      const isActive=S.route===it.id||(it.id==='books'&&S.route.indexOf('book')===0);
      const n=el('div','nav-item'+(isActive?' active':''));
      n.innerHTML='<span class="nav-num">'+esc(it.num)+'</span><span class="nav-t">'+esc(it.t)+'</span>';
      n.onclick=()=>go(it.id);
      grp.appendChild(n);
    });
    wrap.appendChild(grp);
  });
}

/* ================= PROGRESS ================= */
function markRead(id){if(!S.progress[id]){S.progress[id]=1;updateProgress();saveState();}}
function updateProgress(){
  const total=GUIDE.chapters.length||1;
  const done=GUIDE.chapters.filter(c=>S.progress[c.id]).length;
  const pct=Math.round(done/total*100);
  $('#pPct').textContent=pct+'%';
  $('#pRing').style.setProperty('--p',pct);
}

/* ================= RENDER DISPATCH ================= */
function render(id){
  const v=$('#view');v.innerHTML='';
  if(id==='home')return renderHome(v);
  if(id==='flashcards')return renderFlashcards(v);
  if(id==='review')return renderReview(v);
  if(id==='quizzes')return renderQuizzes(v);
  if(id==='estimation')return renderEstimation(v);
  if(id==='challenges')return renderChallenges(v);
  if(id==='interview')return renderInterview(v);
  if(id==='framework')return renderFramework(v);
  if(id==='mock')return renderMock(v);
  if(id==='reference')return renderReference(v);
  if(id==='glossary')return renderGlossary(v);
  if(id==='books')return renderBooks(v);
  if(id.indexOf('book')===0){const b=GUIDE.books.find(x=>x.id===id);if(b)return renderBookDetail(v,b);}
  if(id==='search')return renderSearch(v);
  if(id==='cases')return renderCases(v);
  if(id.indexOf('case-')===0){const c=GUIDE.cases.find(x=>x.id===id);if(c)return renderCaseDetail(v,c);}
  const ch=GUIDE.chapters.find(c=>c.id===id);
  if(ch)return renderChapter(v,ch);
  renderHome(v);
}

/* ================= CHAPTER ================= */
function renderChapter(v,ch){
  const wrap=el('div','reading');
  wrap.innerHTML='<div class="eyebrow">'+esc(ch.group||'Chapter')+' · '+esc(ch.num)+'</div>'+
    '<h1 class="page-title">'+esc(ch.title)+'</h1>'+
    (ch.lead?'<p class="page-lead">'+ch.lead+'</p>':'');
  const prose=el('div','prose');prose.innerHTML=ch.body;
  wrap.appendChild(prose);
  // nav footer
  const idx=GUIDE.chapters.findIndex(c=>c.id===ch.id);
  const foot=el('div','',''); foot.style.cssText='display:flex;justify-content:space-between;gap:12px;margin-top:52px;border-top:1px solid var(--line);padding-top:24px;flex-wrap:wrap';
  if(idx>0){const p=GUIDE.chapters[idx-1];foot.appendChild(btnLink('← '+p.title,p.id));}else{foot.appendChild(el('span'));}
  if(idx<GUIDE.chapters.length-1){const n=GUIDE.chapters[idx+1];foot.appendChild(btnLink(n.title+' →',n.id,true));}
  wrap.appendChild(foot);
  v.appendChild(wrap);
  markRead(ch.id);observeReveal();
}
function btnLink(t,id,primary){const b=el('button','btn'+(primary?' primary':''),esc(t));b.onclick=()=>go(id);return b;}

/* ================= HOME ================= */
function renderHome(v){
  const paths=[
    {n:'PATH 01',t:'Fundamentals first',d:'Start with the concepts every decision depends on — scaling, consistency, CAP, estimation.',meta:'Ch. 01 → 04',go:'ch01'},
    {n:'PATH 02',t:'Learn by designing',d:'Full end-to-end case studies — a complete Amazon build, a tiny business site, Instagram, and Uber — plus a dozen more worked designs across the scenario chapters.',meta:'Case studies',go:'cases'},
    {n:'PATH 03',t:'Operate in production',d:'API design, security, observability, and safe deployment — what turns a design into a running system.',meta:'Ch. 10 → 13',go:'ch10'},
    {n:'PATH 04',t:'The modern frontier',d:'Designing ML and LLM systems: training vs. serving, feature stores, drift, and RAG.',meta:'Ch. 14',go:'ch14'},
    {n:'PATH 05',t:'Practice & test yourself',d:'Flashcards, quizzes, estimation drills, and design challenges that build real skill.',meta:'Practice',go:'flashcards'},
    {n:'PATH 06',t:'Interview preparation',d:'A comprehensive bank of interview questions with thorough, model answers across every topic.',meta:'Q&A bank',go:'interview'},
  ];
  const hero=el('div','hero');
  hero.innerHTML=
    '<div class="hero-grid"></div>'+
    '<svg class="hero-net" width="360" height="300" viewBox="0 0 360 300" fill="none">'+
      '<g stroke="#3B4260" stroke-width="1.2">'+
      '<path d="M60 60L180 40M180 40L300 90M60 60L120 170M180 40L200 160M300 90L280 210M120 170L200 160M200 160L280 210M120 170L110 260M280 210L250 270"/>'+
      '</g>'+
      '<g fill="#93A4FF">'+
      '<circle cx="60" cy="60" r="5"/><circle cx="300" cy="90" r="5"/><circle cx="200" cy="160" r="5"/><circle cx="110" cy="260" r="5"/><circle cx="250" cy="270" r="5"/>'+
      '</g><g fill="#5C688C">'+
      '<circle cx="180" cy="40" r="4"/><circle cx="120" cy="170" r="4"/><circle cx="280" cy="210" r="4"/>'+
      '</g>'+
    '</svg>'+
    '<div class="hero-content">'+
      '<div class="eyebrow">A complete learning guide</div>'+
      '<h1>Design systems<br>like an <em>engineer</em>,<br>not a guesser.</h1>'+
      '<p class="hero-lead">Everything from first principles to distributed systems, the operational craft, the essential books, and interview mastery — one interactive atlas. Every idea framed as a trade-off.</p>'+
      '<div class="hero-cta">'+
        '<button class="btn primary" onclick="go(\'ch01\')">Start learning →</button>'+
        '<button class="btn line" onclick="go(\'interview\')">Interview prep</button>'+
      '</div>'+
      '<div class="hero-stats">'+
        '<div class="hero-stat"><div class="n">'+GUIDE.chapters.length+'</div><div class="l">Chapters</div></div>'+
        '<div class="hero-stat"><div class="n">12</div><div class="l">Worked designs</div></div>'+
        '<div class="hero-stat"><div class="n">'+countFlash()+'</div><div class="l">Flashcards</div></div>'+
        '<div class="hero-stat"><div class="n">'+GUIDE.interview.length+'</div><div class="l">Interview Q&A</div></div>'+
      '</div>'+
    '</div>';
  v.appendChild(hero);

  // ---- progress dashboard (from persisted state) ----
  const chRead=GUIDE.chapters.filter(c=>S.progress[c.id]).length;
  let cardsKnown=0; for(const k in S.flash){ if(S.flash[k] instanceof Set) cardsKnown+=S.flash[k].size; }
  const quizzesTried=Object.keys(S.quizBest).length;
  const chDone=GUIDE.challenges.filter((c,i)=>S.done['ch'+i]).length;
  const chPct=Math.round(chRead/(GUIDE.chapters.length||1)*100);
  const dash=el('div','dash-panel');
  dash.innerHTML=
    '<div class="dash-head"><span class="dash-title">Your progress</span>'+
    (chRead+cardsKnown+quizzesTried+chDone>0?'<button class="dash-reset" id="resetBtn">Reset</button>':'')+'</div>'+
    '<div class="dash-grid">'+
      '<div class="dash-cell"><div class="dash-n">'+chRead+'<small>/'+GUIDE.chapters.length+'</small></div><div class="dash-l">Chapters read</div><div class="dash-bar"><i style="width:'+chPct+'%"></i></div></div>'+
      '<div class="dash-cell"><div class="dash-n">'+cardsKnown+'</div><div class="dash-l">Flashcards known</div></div>'+
      '<div class="dash-cell"><div class="dash-n">'+quizzesTried+'<small>/'+GUIDE.quizzes.length+'</small></div><div class="dash-l">Quizzes attempted</div></div>'+
      '<div class="dash-cell"><div class="dash-n">'+chDone+'<small>/'+GUIDE.challenges.length+'</small></div><div class="dash-l">Challenges done</div></div>'+
    '</div>'+
    '<div class="dash-note">Progress saves automatically in this browser.</div>';
  v.appendChild(dash);
  const rb=dash.querySelector('#resetBtn');
  if(rb)rb.onclick=()=>{ if(confirm('Reset all saved progress (chapters, flashcards, quizzes, challenges)?')){ S.progress={};S.done={};S.quizBest={}; for(const k in S.flash){ if(S.flash[k] instanceof Set) delete S.flash[k]; } saveState();updateProgress();renderHome($('#view')); } };

  const sh=el('div','sec-head');sh.innerHTML='<h2>Choose a path</h2><p>Six routes through the material. You can also use the sidebar to jump anywhere.</p>';
  v.appendChild(sh);
  const grid=el('div','grid c3');
  paths.forEach(p=>{
    const c=el('div','card path-card reveal');
    c.innerHTML='<div class="pc-num">'+p.n+'</div><h3>'+esc(p.t)+'</h3><p>'+esc(p.d)+'</p><div class="pc-meta">◆ '+esc(p.meta)+'</div>';
    c.onclick=()=>go(p.go);grid.appendChild(c);
  });
  v.appendChild(grid);

  // whats inside

/* ================= REVEAL OBSERVER ================= */
let _io;
function observeReveal(){
  if(_io)_io.disconnect();
  _io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');_io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal:not(.in)').forEach(n=>_io.observe(n));
}

<script>

/* ---- Spaced repetition scheduling (Leitner-style boxes) ---- */
function srsKey(deckName,i){return deckName+'#'+i;}
function srsGet(k){return (S.srs&&S.srs[k])||null;}
function srsGrade(k,grade){
  if(!S.srs)S.srs={};
  const cur=S.srs[k]||{box:0,due:0};
  // box 0..4 -> intervals in "sessions"; Again resets, Good advances, Easy jumps
  if(grade==='again')cur.box=0;
  else if(grade==='good')cur.box=Math.min(4,cur.box+1);
  else cur.box=Math.min(4,cur.box+2);
  const intervals=[0,1,3,7,16];
  cur.due=(S.srsSession||0)+intervals[cur.box];
  cur.seen=(cur.seen||0)+1;
  // "Again" keeps the card in this session, but sends it to the back of the queue
  // so you work through the other due cards before seeing it again.
  cur.order=(grade==='again')?(S.srsTick=(S.srsTick||0)+1):0;
  S.srs[k]=cur;saveState();
}
function dueCards(){
  const now=S.srsSession||0;const out=[];
  GUIDE.flashcards.forEach((d,di)=>d.cards.forEach((c,ci)=>{
    const rec=srsGet(srsKey(d.name,ci));
    if(!rec||rec.due<=now)out.push({di:di,ci:ci,deck:d,card:c,rec:rec});
  }));
  // cards re-queued by "Again" go last, in the order they were failed
  out.sort((a,b)=>((a.rec&&a.rec.order)||0)-((b.rec&&b.rec.order)||0));
  return out;
}
function renderReview(v){v.innerHTML='';
  const head=el('div','reading');

  head.innerHTML='<div class="eyebrow">Practice · Spaced repetition</div><h1 class="page-title">Review session</h1>'+
    '<p class="page-lead">Cards you find hard come back sooner; cards you know drift further away. Grade yourself honestly — that is what makes it work. <span style="color:var(--signal)">'+learned+' of '+total+' well-learned</span></p>';

    v.appendChild(done);

    row.appendChild(nb);row.appendChild(db);v.appendChild(row);

  }
  if(S.rvIdx==null||S.rvIdx>=all.length)S.rvIdx=0;
  const item=all[S.rvIdx];
  const stage=el('div','flash-stage');
  const fc=el('div','flashcard');

    '<div class="flash-face flash-front"><span class="flash-tag">'+esc(item.deck.name)+'</span><div class="flash-q">'+item.card.q+'</div><span class="flash-hint">click to flip</span></div>'+

  const grade=(g,label,cls)=>{const b=el('button','btn '+cls,label);
    b.onclick=()=>{srsGrade(srsKey(item.deck.name,item.ci),g);S.rvIdx=0;renderReview($('#view'));};return b;};
  rate.appendChild(grade('again','Again','ghost'));

  stage.appendChild(rate);
  const hint=el('p','');hint.style.cssText='text-align:center;color:var(--ink-faint);font-size:12.5px;margin-top:10px';
  hint.textContent='Again = show again soon · Good = coming along · Easy = I know this cold';
  stage.appendChild(hint);
  v.appendChild(stage);
}

  const nav=el('div','flash-nav');

  prev.onclick=()=>{S.flash.i=(idx-1+deck.cards.length)%deck.cards.length;renderFlashcards($('#view'));};
  const shuf=el('button','icon-btn','<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 4h3l6 8h3M2 12h3l2-2.5M11 4h3M12 2l2 2-2 2M9.5 7.5L11 12h3M12 14l2-2-2-2"/></svg>');
  shuf.title='Shuffle';shuf.onclick=()=>{deck.cards.sort(()=>Math.random()-.5);S.flash.i=0;renderFlashcards($('#view'));};
  const next=el('button','icon-btn','<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>');
  next.onclick=()=>{S.flash.i=(idx+1)%deck.cards.length;renderFlashcards($('#view'));};
  nav.appendChild(prev);nav.appendChild(shuf);nav.appendChild(next);
  ctr.appendChild(nav);stage.appendChild(ctr);
  const rate=el('div','rate-row');

  kbtn.onclick=()=>{if(!S.flash[deck.name])S.flash[deck.name]=new Set();known.has(idx)?S.flash[deck.name].delete(idx):S.flash[deck.name].add(idx);saveState();renderFlashcards($('#view'));};
  const rev=el('button','btn ghost','Next card →');rev.onclick=()=>{S.flash.i=(idx+1)%deck.cards.length;renderFlashcards($('#view'));};
  rate.appendChild(kbtn);rate.appendChild(rev);stage.appendChild(rate);

function renderQuizzes(v){v.innerHTML='';

  const head=el('div','reading');

  v.appendChild(tabs);
  const quiz=(S.quiz.qi==='sub'&&S.quizSub)?S.quizSub:GUIDE.quizzes[S.quiz.qi];

    const correct=S.quiz.ans.filter((a,i)=>a===quiz.questions[i].answer).length;

    const prevBest=S.quizBest[quiz.title]||0;
    const isBest=S.quiz.qi!=='sub'&&correct>prevBest;
    if(isBest){S.quizBest[quiz.title]=correct;saveState();}
    const msg=pct>=80?'Excellent — you own this topic.':pct>=60?'Solid. Review the misses and go again.':'Good start. Re-read the chapter, then retry.';
    wrap.innerHTML='<div class="quiz-result"><div class="quiz-score">'+correct+'<small>/'+quiz.questions.length+'</small></div><p style="font-size:17px;margin:14px 0 4px;font-weight:600">'+pct+'% correct'+(isBest&&prevBest>0?' · new best!':'')+'</p><p style="color:var(--ink-soft);margin-top:0">'+msg+'</p>'+(!isBest&&prevBest>0?'<p style="color:var(--ink-faint);font-size:13px;margin-top:6px">Your best: '+prevBest+'/'+quiz.questions.length+'</p>':'')+'</div>';
    const foot=el('div','',''); foot.style.cssText='display:flex;gap:10px;justify-content:center';
    const retry=el('button','btn primary','↻ Retry quiz');retry.onclick=()=>{S.quiz={qi:S.quiz.qi,i:0,ans:[],done:false};renderQuizzes($('#view'));};
    foot.appendChild(retry);
    const missed=quiz.questions.map((qq,i)=>({qq:qq,i:i,pick:S.quiz.ans[i]})).filter(m=>m.pick!==m.qq.answer);
    if(missed.length){
      const retryMissed=el('button','btn','Retry just the '+missed.length+' missed');
      retryMissed.onclick=()=>{
        S.quizSub={title:quiz.title+' — missed',questions:missed.map(m=>m.qq)};
        S.quiz={qi:'sub',i:0,ans:[],done:false};renderQuizzes($('#view'));
      };
      foot.appendChild(retryMissed);
    }
    wrap.appendChild(foot);
    if(missed.length){
      const rv=el('div','');rv.style.cssText='margin-top:28px;text-align:left';
      rv.innerHTML='<div style="font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px">Review your misses</div>'+
        missed.map(m=>{
          const L='ABCD';
          return '<div class="miss-card">'+
            '<div class="miss-q">'+m.qq.q+'</div>'+
            (m.pick!=null?'<div class="miss-row miss-wrong"><span>'+L[m.pick]+'</span>'+m.qq.options[m.pick]+'</div>':'<div class="miss-row miss-wrong"><span>–</span>Not answered</div>')+
            '<div class="miss-row miss-right"><span>'+L[m.qq.answer]+'</span>'+m.qq.options[m.qq.answer]+'</div>'+
            '<div class="miss-ex">'+m.qq.explain+'</div>'+
          '</div>';
        }).join('');
      wrap.appendChild(rv);
    } else {
      const perfect=el('p','','Perfect score — every answer correct.');
      perfect.style.cssText='text-align:center;color:var(--signal);margin-top:18px';
      wrap.appendChild(perfect);
    }
    v.appendChild(wrap);return;
  }
  const q=quiz.questions[S.quiz.i];const answered=S.quiz.ans[S.quiz.i]!=null;
  const prog=el('div','quiz-progress','<i style="width:'+((S.quiz.i)/quiz.questions.length*100)+'%"></i>');
  wrap.appendChild(prog);
  wrap.appendChild(el('div','q-num','Question '+(S.quiz.i+1)+' of '+quiz.questions.length));
  wrap.appendChild(el('div','q-text',q.q));
  q.options.forEach((opt,oi)=>{
    let cls='opt';
    if(answered){cls+=' disabled';if(oi===q.answer)cls+=' correct';else if(oi===S.quiz.ans[S.quiz.i])cls+=' wrong';}
    const o=el('div',cls,'<span class="opt-key">'+String.fromCharCode(65+oi)+'</span><span>'+opt+'</span>');

  wrap.appendChild(ex);
  const foot=el('div','quiz-foot');
  foot.appendChild(el('span','',''));
  if(answered){
    const isLast=S.quiz.i===quiz.questions.length-1;

    foot.appendChild(nx);
  }else{foot.appendChild(el('span','','<span style="font-family:var(--mono);font-size:12px;color:var(--ink-faint)">Pick an answer</span>'));}
  wrap.appendChild(foot);

/* ================= INTERVIEW FRAMEWORK ================= */
function renderFramework(v){
  const w=el('div','reading');
  w.innerHTML=`
<div class="eyebrow">Interview · How to perform</div>
<h1 class="page-title">The system design framework</h1>
<p class="page-lead">A system design interview tests your <em>process</em>, not memorized answers. This is the repeatable four-step structure that works for any prompt, plus a time budget and the habits that separate a strong candidate from a nervous one.</p>

<div class="callout key"><div class="callout-t">◆ The one habit that matters most</div>Think out loud and frame every choice as a <strong>trade-off</strong> ("I'll cache here, trading freshness for latency"). The interviewer is evaluating how you reason, so silent brilliance scores lower than a clearly-narrated, reasonable path.</div>

<h2><span class="h-node"></span>Step 1 — Scope &amp; requirements <span style="color:var(--ink-faint);font-weight:400;font-size:15px">(~5 min)</span></h2>
<p>Never start drawing. First pin down what you're actually building. Ask about:</p>
<ul>
<li><strong>Functional requirements</strong> — the core features. Then state what's explicitly <em>out of scope</em>; narrowing shows senior judgment.</li>
<li><strong>Scale</strong> — DAU, request rate, data volume, and the read:write ratio. These numbers drive every later decision.</li>
<li><strong>Non-functional needs</strong> — latency targets, availability, and crucially <em>where</em> this needs strong consistency vs. tolerates eventual.</li>
</ul>

<h2><span class="h-node"></span>Step 2 — Estimate <span style="color:var(--ink-faint);font-weight:400;font-size:15px">(~5 min)</span></h2>
<p>Do the back-of-envelope math out loud and let it drive the design. QPS from users, storage per day, the read:write ratio. A 100:1 read ratio says "cache and CDN"; huge media says "object storage"; high writes say "wide-column and maybe sharding." The numbers tell you which system you're building.</p>

<h2><span class="h-node"></span>Step 3 — High-level design <span style="color:var(--ink-faint);font-weight:400;font-size:15px">(~10 min)</span></h2>
<p>Sketch the major components and data flow — clients, load balancer, services, databases, caches, queues. Propose the API (a few key endpoints) and the data model. Walk one core request end-to-end. Get the interviewer's buy-in before going deeper — this is a collaboration, not a monologue.</p>

<h2><span class="h-node"></span>Step 4 — Deep dive &amp; wrap-up <span style="color:var(--ink-faint);font-weight:400;font-size:15px">(~20 min)</span></h2>
<p>The interviewer will steer you into the 2–3 hard parts — go deep there: the specific data model, the consistency mechanism, the bottleneck. Then <strong>wrap up</strong>: name the bottlenecks, identify single points of failure, and say what would break at 10× scale and how you'd address it. Ending with "here's what I'd watch as this grows" is a strong finish.</p>

<h2><span class="h-node"></span>A 45-minute cadence</h2>
<div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Phase</th><th>What you're doing</th></tr></thead><tbody>
<tr><td>0–5</td><td>Scope</td><td>Clarify features, scale, consistency needs; state assumptions</td></tr>
<tr><td>5–10</td><td>Estimate</td><td>QPS, storage, read:write ratio — out loud</td></tr>
<tr><td>10–20</td><td>High-level</td><td>Boxes &amp; arrows, API, data model, one flow end-to-end</td></tr>
<tr><td>20–40</td><td>Deep dive</td><td>The 2–3 hard parts, each as a trade-off</td></tr>
<tr><td>40–45</td><td>Wrap-up</td><td>Bottlenecks, SPOFs, what breaks at 10×</td></tr>
</tbody></table></div>

<h2><span class="h-node"></span>Habits that score points</h2>
<ul>
<li><strong>Trade-offs, always.</strong> There's rarely a best answer — say what you gain and give up with each choice.</li>
<li><strong>Drive with numbers.</strong> Let the estimate justify the architecture instead of asserting it.</li>
<li><strong>Collaborate.</strong> Check in, respond to hints, treat the interviewer as a teammate.</li>
<li><strong>Admit uncertainty well.</strong> "I'm not sure, here's how I'd reason about it" beats bluffing — reasoning is what's tested.</li>
<li><strong>Manage time.</strong> Don't rathole on one component; cover the whole design, then deepen.</li>
</ul>

<h2><span class="h-node"></span>Common mistakes</h2>
<ul>
<li>Jumping to a solution before clarifying scope — confidently designing the wrong system.</li>
<li>Over-engineering — reaching for microservices, sharding, or Kafka before the scale justifies them.</li>
<li>Ignoring failure — no redundancy story, no single-point-of-failure walkthrough.</li>
<li>Going silent — the interviewer can't score reasoning they can't hear.</li>
<li>Treating consistency as one global setting instead of a per-feature choice.</li>
</ul>

<div class="callout note"><div class="callout-t">◆ Practice this</div>Open the <b>Design challenges</b> section, pick one, and run all four steps on paper with a timer before looking at the hints. The framework only becomes automatic through reps.</div>
`;
  v.appendChild(w);
  const foot=el('div','');foot.style.cssText='display:flex;gap:12px;margin-top:40px;flex-wrap:wrap';
  const b1=el('button','btn primary','Try a design challenge →');b1.onclick=()=>go('challenges');
  const b2=el('button','btn ghost','Open the Q&A bank →');b2.onclick=()=>go('interview');
  foot.appendChild(b1);foot.appendChild(b2);w.appendChild(foot);
  observeReveal();
}

/* ================= QUICK REFERENCE ================= */
function renderReference(v){
  const w=el('div','reading');
  w.innerHTML=`
<div class="eyebrow">Reference · Cheat sheet</div>
<h1 class="page-title">Quick reference</h1>
<p class="page-lead">The numbers, tables, and decision rules worth memorizing — everything you reach for mid-design in one place.</p>

<h2><span class="h-node"></span>Latency numbers to know</h2>
<div class="tbl-wrap"><table><thead><tr><th>Operation</th><th>Time</th><th>Relative</th></tr></thead><tbody>
<tr><td>L1 cache reference</td><td>~1 ns</td><td>baseline</td></tr>
<tr><td>Main memory (RAM)</td><td>~100 ns</td><td>100×</td></tr>
<tr><td>SSD random read</td><td>~100 µs</td><td>100,000×</td></tr>
<tr><td>Datacenter round trip</td><td>~500 µs</td><td>—</td></tr>
<tr><td>Rotational disk seek</td><td>~10 ms</td><td>10,000,000×</td></tr>
<tr><td>Packet CA → Europe → CA</td><td>~150 ms</td><td>150,000,000×</td></tr>
</tbody></table></div>
<p><strong>Takeaway:</strong> memory is ~1000× faster than SSD; a cross-continent round trip dwarfs everything. This is <em>why</em> we cache, keep hot data in RAM, and put content near users.</p>

<h2><span class="h-node"></span>Powers of two &amp; data sizes</h2>
<div class="tbl-wrap"><table><thead><tr><th>Power</th><th>Exact-ish</th><th>Name</th></tr></thead><tbody>
<tr><td>2^10</td><td>~1 thousand</td><td>Kilobyte (KB)</td></tr>
<tr><td>2^20</td><td>~1 million</td><td>Megabyte (MB)</td></tr>
<tr><td>2^30</td><td>~1 billion</td><td>Gigabyte (GB)</td></tr>
<tr><td>2^40</td><td>~1 trillion</td><td>Terabyte (TB)</td></tr>
<tr><td>2^50</td><td>~1 quadrillion</td><td>Petabyte (PB)</td></tr>
</tbody></table></div>
<p>Handy anchors: 1 char ≈ 1 byte · a day ≈ 86,400 s ≈ <strong>10^5 s</strong> · peak ≈ 2–5× average.</p>

<h2><span class="h-node"></span>Availability — the nines</h2>
<div class="tbl-wrap"><table><thead><tr><th>Availability</th><th>Downtime / year</th><th>Feel</th></tr></thead><tbody>
<tr><td>99% (two)</td><td>~3.65 days</td><td>Hobby project</td></tr>
<tr><td>99.9% (three)</td><td>~8.8 hours</td><td>Typical SaaS</td></tr>
<tr><td>99.99% (four)</td><td>~52 minutes</td><td>Serious product</td></tr>
<tr><td>99.999% (five)</td><td>~5 minutes</td><td>Critical infra</td></tr>
</tbody></table></div>
<p>Each nine costs exponentially more. Target what the business needs, not the most nines.</p>

<h2><span class="h-node"></span>Capacity estimation formulas</h2>
<ul>
<li><strong>QPS</strong> ≈ (DAU × actions per user per day) ÷ 10^5, then × 2–5 for peak.</li>
<li><strong>Storage / day</strong> ≈ writes per day × bytes per write (× replication factor).</li>
<li><strong>Read:write ratio</strong> = read QPS ÷ write QPS → high ratio means cache/CDN-first.</li>
<li><strong>Bandwidth</strong> ≈ concurrent users × bytes per second each (media → CDN problem).</li>
<li><strong>Cache memory</strong> ≈ hot-item count × item size (target the 20% that serves 80% of reads).</li>
</ul>

<h2><span class="h-node"></span>Which database?</h2>
<div class="tbl-wrap"><table><thead><tr><th>Need</th><th>Reach for</th></tr></thead><tbody>
<tr><td>Transactions, joins, flexible queries (default)</td><td>Relational (Postgres/MySQL)</td></tr>
<tr><td>Simple high-scale key lookups, sessions, carts</td><td>Key-value (Redis, DynamoDB)</td></tr>
<tr><td>Self-contained documents, flexible schema</td><td>Document (MongoDB)</td></tr>
<tr><td>Massive writes, time-series, feeds</td><td>Wide-column (Cassandra)</td></tr>
<tr><td>Relationship-heavy traversals</td><td>Graph (Neo4j)</td></tr>
<tr><td>Full-text search, relevance ranking</td><td>Search index (Elasticsearch)</td></tr>
<tr><td>Similarity / embeddings</td><td>Vector DB (for RAG, recommendations)</td></tr>
<tr><td>Large files &amp; media</td><td>Object storage (S3) + CDN</td></tr>
</tbody></table></div>

<h2><span class="h-node"></span>Consistency choices</h2>
<ul>
<li><strong>Strong</strong> — money, inventory at checkout, unique usernames, anything where a stale read causes harm.</li>
<li><strong>Eventual</strong> — like counts, view counts, feeds, "last seen," most social data.</li>
<li><strong>Name the exact guarantee</strong> — read-your-own-writes (see your own post immediately), monotonic reads (never go backwards).</li>
</ul>

<h2><span class="h-node"></span>HTTP status codes</h2>
<div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Meaning</th></tr></thead><tbody>
<tr><td>200 / 201 / 202 / 204</td><td>OK / Created / Accepted (async) / No Content</td></tr>
<tr><td>301 / 302 / 304</td><td>Moved permanently / Found (temp) / Not Modified</td></tr>
<tr><td>400 / 401 / 403</td><td>Bad request / Not authenticated / Forbidden</td></tr>
<tr><td>404 / 409 / 422 / 429</td><td>Not found / Conflict / Validation failed / Rate limited</td></tr>
<tr><td>500 / 502 / 503 / 504</td><td>Server error / Bad gateway / Unavailable / Gateway timeout</td></tr>
</tbody></table></div>
<p>Clients retry <strong>5xx</strong>, not <strong>4xx</strong>. Distinguish 401 (who you are) from 403 (what you can do).</p>

<h2><span class="h-node"></span>Caching strategies</h2>
<ul>
<li><strong>Cache-aside</strong> — app reads DB on miss and populates cache (the default).</li>
<li><strong>Write-through</strong> — write cache + DB together (fresh, slower writes).</li>
<li><strong>Write-behind</strong> — write cache, flush to DB async (fast, risk of loss).</li>
<li>Defend hot keys: <strong>per-key lock</strong> (stampede), <strong>jittered TTL</strong>, <strong>negative caching / Bloom filter</strong> (penetration).</li>
</ul>

<h2><span class="h-node"></span>Resilience patterns</h2>
<ul>
<li><strong>Timeout</strong> — never wait forever on a remote call.</li>
<li><strong>Retry</strong> with exponential backoff + jitter (capped) — for transient failures.</li>
<li><strong>Circuit breaker</strong> — stop calling a failing dependency; fail fast to a fallback.</li>
<li><strong>Bulkhead</strong> — isolate resource pools so one slow dependency can't sink everything.</li>
<li><strong>Load shedding</strong> — reject excess early so the rest stays healthy.</li>
<li><strong>Graceful degradation</strong> — disable a feature rather than crash the product.</li>
</ul>

<h2><span class="h-node"></span>Recurring big ideas</h2>
<ul>
<li><strong>Every decision is a trade-off</strong> — "best" is relative to requirements.</li>
<li><strong>Atomic conditional write</strong> (<code>UPDATE ... WHERE still-valid</code>) — the primitive that prevents double-booking, overselling, and double-charging.</li>
<li><strong>Fan-out: push / pull / hybrid</strong> — precompute for normal users, pull for celebrities.</li>
<li><strong>Idempotency key</strong> — makes retries safe for payments and any create.</li>
<li><strong>At-least-once + idempotent consumers</strong> = effectively once; exactly-once delivery is a myth.</li>
<li><strong>Outbox pattern</strong> — commit state and event in one transaction to avoid the dual-write bug.</li>
<li><strong>Expand/contract</strong> — evolve schemas with zero downtime.</li>
<li><strong>Modular monolith first</strong> — split to microservices only on real, named pain.</li>
<li><strong>Feature store</strong> — train and serve the same features to prevent skew.</li>
<li><strong>Alert on symptoms, not causes</strong> — tie pages to SLO burn; protect error budgets.</li>
</ul>
`;
  v.appendChild(w);
  observeReveal();
}

/* Build a ranked list of matches across everything in the guide */
function searchAll(qRaw){
  const q=(qRaw||'').trim().toLowerCase();
  if(!q)return [];
  const out=[];
  const hit=(text)=>(text||'').toLowerCase().indexOf(q);
  const snip=(text,idx)=>{
    const t=(text||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    const i=t.toLowerCase().indexOf(q); if(i<0)return t.slice(0,150);
    const s=Math.max(0,i-60);
    return (s>0?'…':'')+t.slice(s,i+q.length+90)+'…';
  };
  GUIDE.chapters.forEach(c=>{
    const inTitle=hit(c.title)>=0, inBody=hit(c.lead+' '+c.body)>=0;
    if(inTitle||inBody)out.push({kind:'Chapter',label:c.num+' · '+c.title,id:c.id,snip:snip(inTitle?c.lead:c.body),score:inTitle?0:3});
  });
  GUIDE.cases.forEach(c=>{
    const inTitle=hit(c.title+' '+c.navTitle)>=0, inBody=hit(c.lead+' '+c.body)>=0;
    if(inTitle||inBody)out.push({kind:'Case study',label:c.title,id:c.id,snip:snip(inTitle?c.lead:c.body),score:inTitle?0:3});
  });
  GUIDE.books.forEach(b=>{
    const inTitle=hit(b.title+' '+b.author)>=0, inBody=hit(b.body)>=0;
    if(inTitle||inBody)out.push({kind:'Book',label:b.title,id:b.id,snip:snip(inTitle?b.thesis:b.body),score:inTitle?1:4});
  });
  GUIDE.glossary.forEach(g=>{
    const inTerm=hit(g.t)>=0, inRest=hit(g.d+' '+(g.x||''))>=0;
    if(inTerm||inRest)out.push({kind:'Glossary',label:g.t,id:'glossary',snip:g.d,score:inTerm?1:5,gq:g.t});
  });
  GUIDE.interview.forEach(x=>{
    const inQ=hit(x.q)>=0, inA=hit(x.a)>=0;
    if(inQ||inA)out.push({kind:'Interview',label:x.q,id:'interview',snip:snip(x.a),score:inQ?2:6,iq:x.q});
  });
  out.sort((a,b)=>a.score-b.score);
  return out;
}

  }
  const wrap=el('div','reading');
  results.slice(0,60).forEach(r=>{

    card.innerHTML='<div class="sr-kind">'+esc(r.kind)+'</div><div class="sr-label">'+esc(r.label)+'</div><div class="sr-snip">'+esc(r.snip)+'</div>';
