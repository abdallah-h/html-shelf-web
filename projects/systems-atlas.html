ir expectations. Understand <em>why</em> they want what they asked for.</p><p><strong>Sign your work.</strong> Take pride and ownership. Craftspeople of earlier eras signed their work; you should be equally willing to put your name on yours, because you're proud of its quality.</p><hr class="divider"><h2><span class="h-node"></span>What to take away</h2><p>The Pragmatic Programmer teaches <em>judgment and habits</em> more than techniques. The durable core:</p><ol><li><strong>Own your work</strong> and your continuous learning; don't tolerate broken windows.</li><li><strong>DRY</strong> is about single sources of <em>knowledge</em> — and beware the wrong abstraction more than a little duplication.</li><li><strong>Orthogonality / decoupling</strong> makes systems testable, reusable, and safe to change.</li><li><strong>Reversibility</strong> — hide decisions behind abstractions so change stays cheap.</li><li><strong>Tracer bullets</strong> (real, kept, end-to-end) are not prototypes (throwaway, discarded).</li><li><strong>Don't program by coincidence</strong> — understand <em>why</em> your code works.</li><li><strong>Crash early, assert the impossible, test ruthlessly</strong> — you can't write perfect software, so build defenses.</li><li><strong>Automate everything repeatable</strong>, and treat plain text and version control as foundations.</li></ol><p>The book's strength is breadth and wisdom; its limitation is depth — each tip is a few pages, telling you <em>what</em> to value and giving you the vocabulary, while other books teach the <em>how</em>. Read the 2019 edition for modernized examples (concurrency, the actor model, and updated tooling), read a few tips at a time rather than straight through, and revisit it yearly — different tips will suddenly matter as your career changes.</p><p><strong>Apply it this week:</strong> automate one manual thing you repeat; fix one broken window in your codebase; on your next task, build a tracer bullet — the thinnest end-to-end path that runs — before adding any features; and the next time you fix a bug you don't fully understand, keep digging until you can explain exactly why it happened.</p>`});
GUIDE.books.push({id:"book2",title:"Design Patterns",author:"Gang of Four · 1994",level:"Code",thesis:"Recurring OO design problems have recurring, nameable solutions — a shared vocabulary for design.",body:`<p>This is the book that gave software engineering a shared vocabulary for design. Its structure is simple: a ~70-page introduction explaining what patterns are and stating two principles that matter more than any individual pattern, followed by 23 patterns documented in a strict template. This walkthrough teaches the introduction's ideas and then the patterns you'll actually use, with concrete modern examples, so you come away able to recognize and apply them.</p><hr class="divider"><h2><span class="h-node"></span>What a "design pattern" even is, and why naming them mattered</h2><p>The authors borrowed the idea from the architect Christopher Alexander, who described patterns in building design: <em>"each pattern describes a problem which occurs over and over again in our environment, and then describes the core of the solution to that problem, in such a way that you can use this solution a million times over, without ever doing it the same way twice."</em></p><p>The insight applied to software: experienced OO designers were repeatedly solving the <em>same kinds</em> of problems with the <em>same kinds</em> of solutions, but each reinvented them and described them differently. By naming and cataloging these solutions, the authors gave the field two things:</p><ol><li><strong>A vocabulary.</strong> Once "Observer" and "Strategy" and "Adapter" have agreed meanings, engineers can discuss design at a higher level — <em>"we'll make the payment providers Strategies behind an Adapter"</em> conveys an entire structure in one sentence. <strong>This communication benefit is arguably the book's greatest contribution</strong>, more than any single pattern.</li></ol><ol><li><strong>Captured expertise.</strong> A junior developer can absorb solutions that took experts years to discover, along with their trade-offs.</li></ol><p>Each pattern in the catalog is documented with the same sections: <strong>Intent</strong> (what it does), <strong>Motivation</strong> (a scenario), <strong>Applicability</strong> (when to use it), <strong>Structure</strong> (a class diagram), <strong>Participants</strong> and <strong>Collaborations</strong> (the roles and how they interact), <strong>Consequences</strong> (the trade-offs — the most valuable section, because every pattern <em>costs</em> something), <strong>Implementation</strong>, <strong>Sample Code</strong>, <strong>Known Uses</strong>, and <strong>Related Patterns</strong>.</p><hr class="divider"><h2><span class="h-node"></span>The two principles that outrank all 23 patterns</h2><p>Buried in the introduction are two design principles the authors distilled from the patterns. If you absorbed <em>only</em> these two sentences and forgot every specific pattern, you'd still have most of the book's value.</p><p><strong>1. "Program to an interface, not an implementation."</strong> Depend on an <em>abstract type</em> (an interface or abstract class) rather than a concrete class. Then any object that honors the interface can be substituted, and the code using it doesn't change. Your order-processing code should depend on a <code>PaymentGateway</code> interface, not on <code>StripeClient</code> — so you can swap Stripe for another provider, or a fake for testing, without touching the order logic. Almost every pattern in the book is a specific technique for depending on interfaces and deferring the choice of concrete class.</p><p><strong>2. "Favor object composition over class inheritance."</strong> Inheritance is <em>white-box reuse</em>: the subclass sees and depends on the parent's internals, and deep inheritance hierarchies become rigid and fragile — a change high in the tree ripples down unpredictably, and you're locked into the structure at compile time. Composition is <em>black-box reuse</em>: you assemble behavior by holding references to other objects and delegating to them, defined through their interfaces. Composition is more flexible — you can change the composed parts at runtime — and it keeps each class focused. This principle drives the design of many patterns (Strategy, Decorator, Composite, Bridge all favor composition to gain flexibility inheritance can't).</p><p>The authors also frame the goal of the whole enterprise: <strong>design for change.</strong> They enumerate common causes of redesign (dependence on specific classes, operations, hardware, object representations; tight coupling; inability to alter classes conveniently) and show how each pattern targets one of these, encapsulating the thing most likely to vary so that variation doesn't ripple through the system. <em>"Encapsulate the concept that varies"</em> is the through-line.</p><hr class="divider"><h2><span class="h-node"></span>The three families</h2><p>The 23 patterns fall into three groups by purpose:</p><ul><li><strong>Creational</strong> — abstract <em>how objects are created</em>, so code isn't hard-wired to specific classes.</li><li><strong>Structural</strong> — how objects and classes are <em>composed</em> into larger structures.</li><li><strong>Behavioral</strong> — how objects <em>interact and distribute responsibility</em>.</li></ul><p>We'll go deepest on the patterns you'll actually meet and use, and summarize the rest.</p><hr class="divider"><h2><span class="h-node"></span>Creational patterns: taking control of object creation</h2><p>The problem these solve: <code>new ConcreteClass()</code> hard-wires your code to a specific class, which is exactly the coupling "program to an interface" warns against. Creational patterns move creation behind abstractions.</p><p><strong>Factory Method.</strong> Define an interface for creating an object, but let subclasses (or a method) decide which concrete class to instantiate. Instead of scattering <code>new</code> across your code, a creator method returns an abstract type. Modern example: a <code>Dialog</code> base class has a <code>createButton()</code> factory method; <code>WindowsDialog</code> and <code>WebDialog</code> override it to produce <code>WindowsButton</code> or <code>HTMLButton</code>, while the shared dialog logic works against the abstract <code>Button</code>. The variation (which button) is encapsulated in one overridable method.</p><p><strong>Abstract Factory.</strong> One level up: an interface for creating <em>families</em> of related objects without specifying concrete classes. A <code>GUIFactory</code> produces a matching set — button, checkbox, scrollbar — and you have a <code>WindowsFactory</code> and a <code>MacFactory</code>. Client code asks the factory for widgets and gets a consistent family, never mentioning concrete classes. Use it when products must be used together and you want to swap the whole family at once.</p><p><strong>Builder.</strong> Separate the construction of a complex object from its representation, so the same construction process can build different results, and so you avoid the "telescoping constructor" nightmare (<code>new Pizza(12, true, false, true, true, false, ...)</code> — what do those booleans mean?). Instead: <code>Pizza.builder().size(LARGE).cheese().pepperoni().build()</code>. Each step is named and optional; the object is assembled readably, step by step, and only finalized at <code>build()</code>.</p><p><strong>Singleton.</strong> Ensure a class has exactly one instance and provide global access to it (a config object, a connection pool). <strong>The controversial one.</strong> The authors present it neutrally, but decades of experience revealed its problems: it's <strong>global mutable state in disguise</strong>, which makes code hard to test (you can't easily substitute a fake), hides dependencies (a class secretly reaches for the singleton instead of declaring what it needs), and causes trouble in concurrent code. The modern guidance: you often want "one instance," but you should get there through <strong>dependency injection</strong> (create one instance and pass it to whoever needs it) rather than a globally-accessible Singleton. Recognize the pattern; reach for it rarely.</p><p><strong>Prototype.</strong> Create new objects by cloning an existing "prototype" instance rather than instantiating from scratch — useful when creation is expensive or when you want to produce copies of a runtime-configured object.</p><hr class="divider"><h2><span class="h-node"></span>Structural patterns: composing objects into larger structures</h2><p><strong>Adapter (one of the most useful).</strong> Convert the interface of a class into another interface clients expect, letting classes with incompatible interfaces work together. This is the universal "wrap the thing that doesn't fit" pattern. Real example: you support several payment providers, each with its own SDK and method names (<code>stripe.charges.create()</code>, <code>paypal.makePayment()</code>). You define your own <code>PaymentGateway</code> interface, and write an adapter for each provider that translates your interface into that provider's calls. The rest of your code speaks only your interface; the providers' differences are quarantined in the adapters. Adapters are how you keep third-party messiness (and future breaking changes) from leaking into your codebase — the same instinct as Clean Code's "boundaries."</p><p><strong>Decorator (composition made visible).</strong> Attach additional responsibilities to an object dynamically by wrapping it in another object that implements the same interface and adds behavior before/after delegating. This gives you a flexible alternative to subclassing for extending behavior. Classic example: a data source. <code>new EncryptedStream(new CompressedStream(new FileStream("data")))</code> — each wrapper adds one responsibility (encryption, compression) transparently, and you can stack them in any combination without a combinatorial explosion of subclasses (<code>EncryptedCompressedFileStream</code>, etc.). You'll recognize this pattern everywhere: wrapping a repository with caching and logging, wrapping an HTTP client with retries. It's "favor composition over inheritance" made concrete.</p><p><strong>Facade.</strong> Provide a single, simplified interface to a complicated subsystem. When a subsystem has many classes with intricate interactions, a Facade offers one high-level "front door" for the common cases, so most clients don't need to understand the internals. It reduces coupling between clients and subsystem. (A <code>VideoConverter.convert(file, format)</code> that hides dozens of codec, audio, and bitrate classes.)</p><p><strong>Proxy.</strong> Provide a stand-in that controls access to another object, presenting the same interface. Varieties: a <strong>virtual proxy</strong> delays creating an expensive object until it's actually needed (lazy loading a huge image); a <strong>protection proxy</strong> checks permissions before forwarding; a <strong>remote proxy</strong> represents an object living on another machine (RPC stubs are proxies — you call a local object that transparently forwards over the network). The client can't tell it's talking to a proxy.</p><p><strong>Composite.</strong> Compose objects into tree structures and let clients treat individual objects and compositions uniformly. A file-system where <code>File</code> and <code>Directory</code> both implement a <code>FileSystemItem</code> interface with a <code>size()</code> method — a directory's <code>size()</code> sums its children — so client code can call <code>size()</code> on anything without checking whether it's a file or a folder. Perfect for part-whole hierarchies (UI component trees, org charts, graphics groups).</p><p><strong>Bridge</strong> (decouple an abstraction from its implementation so the two can vary independently — avoids a class explosion when you have two independent dimensions of variation) and <strong>Flyweight</strong> (share fine-grained objects to save memory when you have huge numbers of similar objects, e.g., glyph objects for characters in a document) round out the structural family — useful, but less frequently reached for day to day.</p><hr class="divider"><h2><span class="h-node"></span>Behavioral patterns: distributing responsibility and interaction</h2><p><strong>Strategy (the everyday workhorse).</strong> Define a family of interchangeable algorithms, encapsulate each behind a common interface, and make them swappable at runtime. The canonical example: shipping cost. Instead of a sprawling <code>if (method == GROUND) ... else if (method == AIR) ...</code>, you define a <code>ShippingStrategy</code> interface with implementations <code>GroundShipping</code>, <code>AirShipping</code>, <code>OvernightShipping</code>, and the order holds a reference to whichever strategy applies, calling <code>strategy.calculateCost(order)</code>. Adding a new shipping method means adding a new class — not editing existing, tested code (this is the Open/Closed Principle in action). In languages with first-class functions, a Strategy is often <em>just a function you pass in</em> — recognizing that keeps you from over-engineering.</p><p><strong>Observer (the ancestor of event systems).</strong> Define a one-to-many dependency so that when one object (the "subject") changes state, all its dependents ("observers") are notified automatically. The subject maintains a list of observers and calls their <code>update()</code> method on change; observers can subscribe and unsubscribe at runtime, and the subject doesn't know or care who they are (loose coupling). This is the in-process ancestor of everything pub/sub: UI event listeners, model-view updates, and — scaled up across machines with a message broker — event-driven architecture itself. When you understand Observer, event-driven systems feel familiar.</p><p><strong>Command.</strong> Encapsulate a request as an object, so you can parameterize clients with different requests, queue or log requests, and support undo. Instead of calling an operation directly, you create a <code>Command</code> object with an <code>execute()</code> method (and often an <code>undo()</code>). Because the request is now a first-class object, you can: put commands on a <strong>queue</strong> (deferring or distributing work), keep a <strong>history</strong> of executed commands (enabling undo/redo by calling their inverses), and <strong>log</strong> them for audit or replay. This is why Command underlies task queues, undo systems, and transaction logs — and it connects directly to event sourcing (06f/DDD and 06h/DDIA).</p><p><strong>State.</strong> Allow an object to alter its behavior when its internal state changes, so the object "appears to change its class." Instead of a mess of conditionals checking a status field throughout a class, you represent each state as an object implementing a common interface, and the context delegates to its current state object, which also decides the next state. A document that behaves differently when <code>Draft</code>, <code>Moderation</code>, or <code>Published</code> — with each state object handling actions appropriately and transitioning to the next — is far cleaner than status-flag conditionals sprinkled everywhere. It's a state machine expressed as objects.</p><p><strong>Template Method.</strong> Define the skeleton of an algorithm in a base-class method, deferring some steps to subclasses via overridable methods, so subclasses customize steps without changing the algorithm's structure. A data-processing base class defines <code>process()</code> = <code>readData(); transform(); writeData();</code> and lets subclasses supply the specifics of each step. (Note the relationship to Strategy: Template Method uses inheritance to vary steps; Strategy uses composition to vary the whole algorithm.)</p><p><strong>Chain of Responsibility.</strong> Pass a request along a chain of handlers; each handler decides whether to process it or pass it on. This decouples the sender from the receiver and lets you add/reorder handlers freely. <strong>This is exactly what web middleware pipelines are</strong> — a request passes through authentication, logging, rate-limiting, and routing handlers in sequence, each doing its part or forwarding. Recognizing this pattern makes every web framework's middleware suddenly legible.</p><p>The remaining behavioral patterns — <strong>Iterator</strong> (traverse a collection without exposing its internals; now built into most languages' <code>for-each</code>), <strong>Mediator</strong> (centralize complex many-to-many interactions in one object so components don't reference each other directly), <strong>Memento</strong> (capture and restore an object's state without violating encapsulation — the mechanism behind undo snapshots), <strong>Visitor</strong> (add new operations to a class hierarchy without modifying the classes, by "visiting" each element), and <strong>Interpreter</strong> (represent a simple grammar and interpret sentences in it) — are worth recognizing so you can name them when you see them, even if you reach for them less often.</p><hr class="divider"><h2><span class="h-node"></span>The most important warning: patternitis</h2><p>The book's success created its own disease. Junior developers, thrilled with their new vocabulary, began forcing patterns everywhere — wrapping trivial code in <code>AbstractFactory</code> layers and <code>Strategy</code> hierarchies that added indirection without solving any real problem. The result was code <em>more</em> complex than the problem warranted.</p><p>The corrective, which mature engineers internalize: <strong>patterns are tools and vocabulary, not achievements.</strong> You don't get points for using a pattern. A pattern is justified only when the <em>problem it addresses</em> is actually present — when something genuinely varies, when coupling is actually causing pain. If a plain function or a simple <code>if</code> does the job clearly, use it. Ousterhout's <em>A Philosophy of Software Design</em> (06d) makes this concrete: needless patterns create <em>shallow modules</em> and extra interfaces that increase complexity. Reach for a pattern when the problem matches; otherwise, don't.</p><p>There's also a language caveat. Many GoF patterns exist partly to work around limitations of 1990s statically-typed OO languages. In languages with first-class functions and dynamic features, several patterns <em>collapse</em>: Strategy, Command, and Template Method are frequently just "pass a function," and Iterator is built into the language. Understanding <em>why</em> a pattern exists helps you recognize when your language already gives you the solution for free.</p><hr class="divider"><h2><span class="h-node"></span>What to take away</h2><ol><li><strong>The vocabulary is the point</strong> — naming recurring solutions lets teams discuss design at a higher level.</li><li><strong>The two meta-principles dominate:</strong> program to an interface, not an implementation; favor composition over inheritance.</li><li><strong>Encapsulate what varies</strong> — every pattern isolates one likely axis of change so variation doesn't ripple.</li><li><strong>Learn deeply the seven you'll actually use:</strong> Strategy, Observer, Factory (Method/Abstract), Adapter, Decorator, Facade, Command. Recognize the rest.</li><li><strong>Beware patternitis</strong> — a pattern is justified by a real problem, never by its own elegance; in modern languages some patterns are just functions.</li></ol><p>Most people today <em>learn</em> the patterns from friendlier sources — <em>Head First Design Patterns</em> (highly visual and approachable) or the free Refactoring.Guru site — and keep the GoF book as the authoritative reference. That's a fine path. However you learn them, the payoff is the same: you'll start <em>seeing</em> these structures in every framework and codebase, and you'll be able to name them — which is the first step to using them well.</p><p><strong>Apply it this week:</strong> find a <code>switch</code>/<code>if-else</code> chain in your code that selects behavior based on a type (payment method, file format, notification channel) and refactor it into a <strong>Strategy</strong> — an interface plus one small class per case, chosen by a simple factory. Notice that adding a new case now means adding a class rather than editing tested code. You've just applied the Open/Closed Principle via a pattern, and you'll feel exactly when it's worth it and when it would've been overkill.</p>`});
GUIDE.books.push({id:"book3",title:"A Philosophy of Software Design",author:"John Ousterhout · 2018",level:"Code",thesis:"The enemy is complexity; judge every technique by whether it reduces it. Prefer deep modules.",body:`<p>This is a short book with a single, relentless argument, developed principle by principle, each illustrated with examples — several of which directly and respectfully contradict popular advice from <em>Clean Code</em>. Read this walkthrough and you'll have the substance of Ousterhout's design philosophy, which many engineers consider the best pure software-design book of the last decade.</p><p>The whole book hangs on one claim: <strong>the greatest limitation in building software is our ability to understand the systems we create.</strong> As a program grows, complexity accumulates until no one can hold it in their head, and progress slows to a crawl. Therefore the central goal of design — the thing every technique should serve — is <strong>reducing complexity.</strong></p><hr class="divider"><h2><span class="h-node"></span>What complexity actually is (and why it's the enemy)</h2><p>Ousterhout defines complexity precisely so it becomes something you can <em>diagnose</em>, not just complain about: <strong>complexity is anything related to the structure of a software system that makes it hard to understand or modify.</strong></p><p>He identifies three <strong>symptoms</strong> by which you recognize complexity:</p><ol><li><strong>Change amplification.</strong> A simple conceptual change requires modifications in many places. If changing a banner color means editing that hex value in fifteen files, the design has amplified a one-line change into fifteen. Good design lets a change touch as few places as possible.</li></ol><ol><li><strong>Cognitive load.</strong> How much a developer must know in their head to complete a task. A function that requires you to remember to free a resource, call methods in a specific order, and handle three special cases imposes high cognitive load. Crucially, he notes that "fewer lines of code" is <em>not</em> the same as "less cognitive load" — a compact but cryptic solution can be far more taxing than a longer, clearer one. Simplicity of <em>understanding</em> is what matters.</li></ol><ol><li><strong>Unknown unknowns.</strong> The worst symptom: it's not obvious <em>which</em> pieces of code you must modify to make a change correctly, or <em>what information</em> you'd need to do it right. With change amplification you at least know what to change (just too much of it); with cognitive load you know what to learn. But unknown unknowns mean you can't even tell what you don't know — you make a change that seems right and it breaks something in a distant, unsuspected place. <strong>The most important goal of design is to make a system obvious</strong> — so that a developer can quickly grasp what's needed without hidden surprises.</li></ol><p>And the crucial observation about <em>how</em> complexity arises: <strong>it is incremental.</strong> It doesn't come from one catastrophic decision; it accretes from hundreds of small ones — a bit of duplication here, a leaked assumption there, a slightly-too-broad interface — each individually harmless and easy to justify ("it's just this once"). This is why complexity is so hard to fight: no single change feels like the problem, so nothing triggers a response, and the system slowly ossifies. His conclusion is a mindset: <strong>"you have to sweat the small stuff."</strong> Complexity is fought one small decision at a time; you must be willing to say "this isn't clean enough" about things that seem trivial.</p><hr class="divider"><h2><span class="h-node"></span>Strategic vs. tactical programming (the mindset that determines everything)</h2><p>Before any specific technique, Ousterhout draws a fork in the road that shapes a developer's whole career.</p><p><strong>Tactical programming</strong> is when your main goal is to get something <em>working</em> — a feature done, a bug fixed — as fast as possible. Under this mindset, design is a distraction; you take the shortest path to a green result, adding a little complexity each time (a special case, a quick coupling, a skipped abstraction). Each shortcut is small and rational in isolation. But they compound, and their sum is a system that gets harder to work in every week. The extreme version is the <strong>"tactical tornado"</strong> — the prolific developer who churns out features at heroic speed, is praised by management, and leaves behind a wasteland that everyone <em>else</em> must slowly dig out of. Their velocity is an illusion paid for by the whole team's future.</p><p><strong>Strategic programming</strong> starts from a different premise: <strong>working code is not enough.</strong> The real goal is a <em>good design</em> that also happens to work. Under this mindset you accept that you must invest continuously in the structure of the system — taking a little extra time on each change to keep the design clean, to find better abstractions, to fix small messes as you pass them. Ousterhout suggests a concrete figure: spend roughly <strong>10–20% of your time</strong> on this ongoing investment. It feels slower at first, and slightly slower forever on any single change — but it's the only way to <em>stay</em> fast, because it prevents the complexity accumulation that otherwise strangles a project. The investment compounds in your favor instead of against you.</p><p>The choice between these mindsets, made hundreds of times a week, is what separates codebases that stay pleasant to work in from those that become dreaded. <strong>Great design comes from a consistent strategic attitude, not occasional cleanup sprints.</strong></p><hr class="divider"><h2><span class="h-node"></span>Deep modules vs. shallow modules (the book's signature idea)</h2><p>This is the concept people remember, and it reframes how you think about decomposition.</p><p>The purpose of a module (a class, a function, a service — any unit with an interface and a hidden implementation) is to let you use its functionality <em>without understanding how it works inside.</em> Ousterhout captures the value of a module in a simple ratio:</p><div class="callout key"><div class="callout-t">◆ Key idea</div><strong>A module's benefit = the functionality it provides ÷ the complexity of its interface.</strong></div><p>The interface is the <em>cost</em> — everything a user must learn and keep in mind to use the module. The implementation, however large, is hidden and costs the user nothing (that's the point of the module). So:</p><ul><li>A <strong>deep module</strong> provides <em>powerful functionality</em> through a <em>simple interface</em>. It hides a great deal behind a small door. His favorite example is the <strong>Unix file I/O interface</strong>: essentially five calls — <code>open</code>, <code>read</code>, <code>write</code>, <code>close</code>, <code>lseek</code> — behind which lurk staggering complexity: disk block allocation, buffering and caching, permissions, device drivers, filesystem layouts, crash recovery. The user needs to know almost none of it. That enormous ratio of hidden functionality to interface complexity is what makes it a <em>deep</em> module — and deep modules are what make large systems manageable.</li></ul><ul><li>A <strong>shallow module</strong> is the opposite: its interface is nearly as complicated as its implementation, so it hides little. A method whose signature is as complex as its body, a class of fifteen trivial getters and setters, a "manager" that mostly forwards calls to something else — these add an interface to learn without meaningfully reducing what the caller must understand. <strong>A shallow module is barely worth its interface cost.</strong></li></ul><p>Here is where the book <strong>directly challenges Clean Code's reflex.</strong> Clean Code says: make functions and classes small, split aggressively. Ousterhout's warning: <strong>decomposition is not free.</strong> Every time you split one module into two, you <em>add</em> an interface between them and a relationship the reader must understand. If the split creates two <em>shallow</em> modules where there was one reasonably deep one, you've <em>increased</em> total complexity, not decreased it — you now have more interfaces, more connections, more to hold in your head, without hiding anything new. His stance: <em>"it is more important for a module to have a simple interface than a simple implementation."</em> Sometimes the right move is a <em>larger</em> function or class, if that lets you present a simpler interface to the outside world. <strong>Depth beats smallness.</strong> This is the single most valuable corrective the book offers to the "small at all costs" school.</p><p>He also warns against <strong>"classitis"</strong> — the belief that classes are so good that more of them is always better, leading to swarms of tiny shallow classes that must be assembled with much ceremony to get anything done.</p><hr class="divider"><h2><span class="h-node"></span>Information hiding, leakage, and where change amplification comes from</h2><p>The way to build deep modules is <strong>information hiding</strong>: each module <em>encapsulates a design decision</em> — a piece of knowledge — and hides it behind its interface, so nothing else in the system depends on it. When that decision changes, only that module changes.</p><p>The opposite is <strong>information leakage</strong>: a design decision is reflected in <em>multiple</em> modules, so they're all coupled to it (even if they don't call each other) and all must change together when it changes. His example: two different classes that both know the format of a particular file — a leak, because a format change now touches both. Leakage is where <strong>change amplification</strong> and <strong>unknown unknowns</strong> come from: the knowledge is spread out, so a change ripples, and you can't tell in advance everywhere it ripples to.</p><p>A common cause of leakage he names is <strong>temporal decomposition</strong> — structuring code around the <em>order in which operations happen</em> (read the file, then process it, then write it → three classes) rather than around <em>knowledge</em>. Because the "read" and "write" steps both need to know the file format, that knowledge gets split across the time-ordered pieces and leaks. <strong>Structure around knowledge and responsibility, not around sequence.</strong></p><p>Related guidance:</p><ul><li><strong>Make modules somewhat general-purpose.</strong> A module tailored to exactly today's single caller tends to be shallow and to leak specifics upward. A slightly more general interface ("insert this text at this position," rather than "handle the backspace key") is often <em>deeper</em>, simpler, and more reusable — and, surprisingly, quicker to build and less buggy, because a clean general abstraction has fewer special cases. He offers a heuristic: design the interface to be general enough to cover the current <em>and</em> likely-nearby needs, but no more.</li><li><strong>Different layer, different abstraction.</strong> If adjacent layers of your system expose the <em>same</em> abstraction, a layer probably isn't earning its keep. Two red flags: <strong>pass-through methods</strong> (a method that does nothing but call another method with the same signature — it adds interface without adding value) and <strong>pass-through variables</strong> (a variable threaded through many method calls just to reach a distant user — it forces every intermediate method to know about something irrelevant to it).</li></ul><hr class="divider"><h2><span class="h-node"></span>Pull complexity downward</h2><p>A guiding heuristic for who should bear complexity: <strong>it is more important for a module to have a simple interface than a simple implementation.</strong> When there's unavoidable messiness — an edge case, a configuration decision — it's usually better for the <em>module</em> to absorb it internally than to expose it and make <em>every caller</em> deal with it.</p><p>His reasoning is quantitative: a module is written once but used many times. If the module handles the hard case internally (or provides a sensible default), the complexity is paid <em>once</em>, by the module author. If instead it pushes the decision or the edge-case handling up to callers, that complexity is paid <em>repeatedly</em>, by every caller, forever. So, when in doubt, <strong>pull complexity downward</strong> into the implementation rather than exposing it. (This has limits — don't absorb complexity in ways that make the interface <em>misleading</em> — but as a default it's sound.)</p><hr class="divider"><h2><span class="h-node"></span>Define errors out of existence (a signature, counterintuitive idea)</h2><p>Most developers, taught to handle errors robustly, add more and more exception handling — and each exception a caller must handle is more interface complexity, multiplied across all callers. Ousterhout argues the opposite instinct is often better: <strong>the best way to handle an exception is to design so the exception can't occur in the first place</strong> — to <em>define errors out of existence.</em></p><p>His clearest example: many languages' <code>substring</code> method throws an exception if the indices are out of range, forcing every caller to either check bounds first or wrap the call in a try/catch. But you could instead <em>define</em> <code>substring</code> to simply <em>clamp</em> the range to what's valid and return whatever overlaps — no exception needed, no caller code needed, and the behavior is perfectly sensible. He reports that redesigning APIs this way (and using techniques like <em>masking</em> the exception inside the module, or <em>aggregating</em> many special cases into one general case) drastically reduced the amount of exception-handling code in his systems. The broader lesson: <strong>exception handling is a major source of complexity, and much of it can be eliminated by better interface design rather than by writing more handlers.</strong> Every special case you can make <em>not special</em> is complexity removed at the root.</p><hr class="divider"><h2><span class="h-node"></span>Comments and naming — the direct rebuttal to Clean Code</h2><p>Ousterhout devotes several chapters to comments, and his position squarely opposes the "comments are failures" reputation of Clean Code.</p><p>His argument: <strong>comments are fundamental to good design, not a sign of failure</strong>, because <em>code alone cannot express everything a reader needs to know.</em> Code can express <em>what</em> it does mechanically, but it cannot capture <strong>the abstraction</strong> a module presents (the simplified way to think about it, omitting implementation detail) or the <strong>intent and rationale</strong> behind decisions. If you refuse to write comments, that essential information simply doesn't exist anywhere, and readers must reconstruct it by reading the implementation — which defeats the purpose of having a module at all. <em>"Comments should describe things that aren't obvious from the code."</em></p><p>His most striking technique: <strong>write comments first, as a design tool.</strong> Before implementing a method or class, write its interface comment — the description of the abstraction it offers. This does two things: it forces you to articulate the abstraction cleanly <em>before</em> you're anchored by implementation details, and it acts as a <strong>design test</strong>. If you find the interface comment <em>hard to write simply</em> — if it's long, full of caveats, or keeps referring to internal mechanics — that's a signal the abstraction is muddy or the module is doing too much. A deep module with a clean abstraction has a <em>short, simple</em> interface comment. So the difficulty of the comment becomes a diagnostic for the quality of the design. (This is the inverse of Clean Code's "if you need a comment, your code failed"; Ousterhout says the comment is where the <em>design</em> lives, and struggling to write it reveals a <em>design</em> problem, not a naming one.)</p><p>On <strong>naming</strong>, he agrees with Clean Code that names matter enormously, and adds his own lens: a good name creates an <em>image</em> in the reader's mind that is precise and complete — it should be hard to misinterpret. If you struggle to find a good, precise name for a variable or method, it's often because the underlying thing is ill-defined or has multiple purposes — again, the naming difficulty is diagnostic of a design problem.</p><hr class="divider"><h2><span class="h-node"></span>Consistency, obviousness, and the rest</h2><p>Two closing themes tie it together:</p><ul><li><strong>Consistency reduces cognitive load.</strong> If similar things are done in similar ways throughout a codebase — naming conventions, patterns, coding style — a reader who understands one part can transfer that understanding everywhere, and can safely assume that what looks the same <em>is</em> the same. Inconsistency destroys that leverage. Establish conventions and enforce them.</li></ul><ul><li><strong>Design for obviousness.</strong> The ultimate target from the "unknown unknowns" discussion: code should be <em>obvious</em>, meaning a reader can understand it quickly and form correct expectations without deep study or hidden surprises. Things that undermine obviousness — event-driven control flow that's hard to trace, generic containers that obscure what they hold, code that violates the reader's reasonable assumptions — should be used carefully and documented where they can't be avoided. If someone reads your code and is surprised, or has to ask "wait, how does this even get called?", that's a complexity cost you should try to remove.</li></ul><p>He also gives a balanced note on <strong>taking it too far</strong>: design has diminishing returns, and you <em>can</em> over-invest — over-abstracting, over-generalizing, or obsessing past the point of value. The 10–20% strategic investment is a guideline, not a mandate to gold-plate. The goal is always the <em>practical</em> one: a system that stays understandable and changeable.</p><hr class="divider"><h2><span class="h-node"></span>What to take away</h2><ol><li><strong>Complexity is the enemy</strong>, recognized by change amplification, cognitive load, and (worst) unknown unknowns; it accretes incrementally, so you must sweat the small stuff.</li><li><strong>Be strategic, not tactical</strong> — invest ~10–20% continuously in design; beware the tactical-tornado illusion of speed.</li><li><strong>Prefer deep modules</strong> — powerful functionality behind simple interfaces — over swarms of shallow ones. <em>A simple interface matters more than a simple implementation.</em> This calibrates Clean Code's "make everything small."</li><li><strong>Hide information; prevent leakage.</strong> Encapsulate each design decision in one module; structure around knowledge, not around the sequence of operations.</li><li><strong>Pull complexity downward</strong> — let the module (written once) absorb messiness rather than every caller (many, forever).</li><li><strong>Define errors out of existence</strong> — redesign interfaces so exceptions can't occur, instead of writing ever more handlers.</li><li><strong>Comments capture the abstraction and intent code can't</strong> — write interface comments <em>first</em>, and use the difficulty of writing them as a design test.</li></ol><p>The best way to read this book is <em>right after Clean Code</em>, as the essential second opinion. Where Clean Code gives you rules, Ousterhout gives you <em>criteria</em> — depth, leakage, cognitive load, obviousness — for judging when a rule helps and when it hurts. It's ~190 pages; read all of it, then re-read the deep-modules and define-errors-out-of-existence chapters until they're reflexes.</p><p><strong>Apply it this week:</strong> hunt for one <em>shallow module</em> in your codebase — a class whose interface is nearly as complex as its body, or a layer that mostly forwards calls — and either deepen it (absorb real functionality behind a simpler interface) or remove it. Separately, on your next new method, <strong>write the interface comment before the body</strong>; if the comment is hard to write clearly and simply, treat that as a signal to redesign the method before you implement it.</p>`});
GUIDE.books.push({id:"book4",title:"Refactoring",author:"Martin Fowler · 1999 / 2018",level:"Code",thesis:"Improve the design of working code safely, in small behavior-preserving steps backed by tests.",body:`<p>Refactoring rests on a liberating idea: <strong>you don't have to get the design right up front.</strong> You can improve the design of <em>working</em> code safely, continuously, through a series of small, disciplined, behavior-preserving steps — so software gets <em>better</em> as your understanding grows, instead of decaying. This walkthrough teaches the discipline, the vocabulary of "code smells," the mechanics, and the workflow, following the book's own progression: it opens with a worked example, states the principles, catalogs the smells, and then documents dozens of named refactorings.</p><hr class="divider"><h2><span class="h-node"></span>The opening example: watch a mess become clean (the soul of the book)</h2><p>Fowler begins not with theory but with a demonstration, because the <em>feel</em> of the discipline is the point. He presents a smallish function that prints a bill for a theater company — it computes charges and loyalty credits for performances of different play types and formats a statement. It works. It's also a tangle: one long function doing several things at once, with the calculation logic, the formatting, and the business rules all knotted together.</p><p>Then, step by tiny step, he refactors it in front of you:</p><ul><li>He <strong>extracts</strong> the charge calculation into its own well-named function.</li><li>He <strong>renames</strong> variables so their purpose is clear.</li><li>He <strong>replaces a temporary variable</strong> holding a computed value with a function that computes it (so the value isn't a hidden dependency).</li><li>He <strong>splits the phases</strong> — separating the <em>calculation</em> of the statement data from its <em>formatting</em> — so that adding an HTML version of the statement later requires no duplication of the business logic.</li><li>He introduces polymorphism to handle the different play types cleanly.</li></ul><p>Crucially, <strong>after every single small step, he runs the tests.</strong> The transformation from tangle to clean, well-separated code happens in perhaps forty tiny moves, and at no point is the code broken for more than a moment. By the end you've <em>watched</em> good design emerge from bad through pure mechanical discipline, without a single big rewrite. That experience — "oh, I don't have to be brilliant, I just have to take small safe steps" — is what the book is really teaching. Everything after is elaboration.</p><hr class="divider"><h2><span class="h-node"></span>What refactoring actually is (and the definition the industry abuses)</h2><p>Fowler is precise, because the word gets misused constantly.</p><div class="callout key"><div class="callout-t">◆ Key idea</div><strong>Refactoring (noun):</strong> a change made to the internal structure of software to make it easier to understand and cheaper to modify <strong>without changing its observable behavior.</strong> <strong>Refactoring (verb):</strong> to restructure software by applying a series of refactorings without changing its observable behavior.</div><p>Sit with the phrase <strong>"without changing observable behavior."</strong> That is the whole discipline. Refactoring is <em>not</em>:</p><ul><li>a rewrite ("we're refactoring the payments module" when you mean "we're rebuilding it from scratch" — that's a rewrite, and it's risky);</li><li>adding a feature while you "clean up" (that changes behavior);</li><li>a vague two-week "refactoring project" that leaves the system broken in the middle.</li></ul><p>Real refactoring is a sequence of <strong>small, individually-safe, reversible transformations</strong>, each preserving behavior, with the tests green after every one — so you are <em>never more than a minute or two from working code</em>. If something breaks, you undo the last tiny step, not a week's work. This "always shippable, small steps" property is what makes refactoring low-risk enough to do continuously, and it's exactly what people lose when they misuse the term to mean "big scary rewrite."</p><hr class="divider"><h2><span class="h-node"></span>Why refactor — and when not to</h2><p><strong>Why it's worth doing:</strong></p><ul><li><strong>It improves the design of software.</strong> Without it, design decays under the weight of changes — each change made without regard to structure erodes it, until the code becomes hard to understand and modify. Refactoring is the counter-force that keeps structure healthy.</li><li><strong>It makes software easier to understand.</strong> Often you refactor simply to encode your growing understanding <em>into</em> the code, so the next reader (including future you) gets it for free.</li><li><strong>It helps you find bugs.</strong> Clarifying structure surfaces the confusion where bugs hide.</li><li><strong>It helps you program faster.</strong> This is the counterintuitive economic claim, and the book's core justification. Good internal design doesn't slow you down — it's what <em>lets</em> you go fast, because new features drop into clean code easily and fight you in messy code. Fowler calls this the essential insight: design and speed are allies, not enemies, over any horizon longer than a few days.</li></ul><p><strong>The economic framing</strong> matters because it changes how you justify refactoring to yourself and others. You don't refactor for beauty or to satisfy a rule. You refactor because it will make the <em>next</em> change faster — which is why refactoring rarely needs its own line item or permission. It's woven into the work.</p><p><strong>When <em>not</em> to refactor:</strong></p><ul><li>When the code is such a mess that rewriting is genuinely cheaper (a real judgment call — but the bias should be toward refactoring, because rewrites are famously risky and often reproduce the same mistakes).</li><li>When you don't need to touch or understand that code — don't refactor code you're not working with just because it offends you.</li><li>When you're mid-way through and things are broken — finish or revert; don't leave it half-transformed.</li></ul><hr class="divider"><h2><span class="h-node"></span>Code smells: how you know <em>where</em> to refactor (the most-quoted chapter)</h2><p>Refactorings are the cure; <strong>code smells</strong> are the diagnosis. A "smell" (a term Kent Beck coined for this book) is a surface symptom that <em>usually</em> points to a deeper problem — not a certainty, but a place to look. The genius of the smell vocabulary is the same as the pattern vocabulary: it turns vague unease ("this code bothers me") into a <em>named, discussable</em> thing ("that's Feature Envy"), which makes design improvable in code review. The key smells:</p><ul><li><strong>Mysterious Name.</strong> The commonest and most underrated: a name that doesn't clearly convey purpose. If you can't think of a good name, there may be a deeper design problem.</li><li><strong>Duplicated Code.</strong> The same structure in more than one place → they'll drift, and changes must be made in each. Unify them.</li><li><strong>Long Function.</strong> Long functions hide intent. The cure is aggressive <strong>Extract Function</strong> — Fowler favors short, named functions because the <em>name</em> documents intent and lets you read at a high level without diving into detail. (Note the tension with Ousterhout's "deep modules" caution; Fowler's counterweight is that a <em>good name</em> on a small function buys comprehension — so extract when the piece has a clear, nameable responsibility, not merely to hit a line count.)</li><li><strong>Long Parameter List.</strong> Hard to understand and use; often a sign that some parameters should be bundled into an object, or that the function is doing too much.</li><li><strong>Global Data</strong> and <strong>Mutable Data.</strong> The most dangerous kind of data because a change anywhere can affect anything; encapsulate it so modifications go through controlled points.</li><li><strong>Divergent Change</strong> — one module is changed for <em>many different reasons</em> (it has too many responsibilities; split it so each reason lives in its own module).</li><li><strong>Shotgun Surgery</strong> — the inverse: one conceptual change forces edits across <em>many</em> modules (gather the scattered responsibility into one place). Divergent Change and Shotgun Surgery are mirror images and both point at responsibilities being in the wrong place.</li><li><strong>Feature Envy</strong> — a function in one module that's more interested in another module's data than its own (it keeps reaching over to fetch and manipulate that data). Move the function to where the data lives.</li><li><strong>Data Clumps</strong> — the same few data items appearing together everywhere (e.g., <code>startDate</code> and <code>endDate</code>, or <code>street</code>, <code>city</code>, <code>zip</code>) are begging to become a small object (<code>DateRange</code>, <code>Address</code>).</li><li><strong>Primitive Obsession</strong> — using raw primitives (strings, ints) for concepts that deserve small types. A phone number as a bare string, money as a bare number — wrap them in types that enforce their rules (this is Value Objects from DDD, 06f).</li><li><strong>Repeated Switches</strong> — the same switch/conditional on the same type code in multiple places → polymorphism.</li><li><strong>Large Class</strong> — a class trying to do too much (too many fields/methods) → split by responsibility.</li><li><strong>Speculative Generality</strong> — flexibility, hooks, and abstractions built for a future that never came (YAGNI). Remove them; they add complexity for no current benefit.</li><li><strong>Message Chains</strong> (<code>a.getB().getC().getD()</code> — couples you to a whole navigation path) and <strong>Middle Man</strong> (a class that does nothing but delegate to another) — opposite ends of a delegation spectrum.</li><li><strong>Comments</strong> — Fowler's nuanced take: comments aren't a smell themselves, but they're <em>often</em> used as deodorant over bad code. When you feel the urge to write a comment explaining a confusing block, first try to refactor so the comment becomes unnecessary; if a comment is still needed, write it (this splits the difference between Clean Code and Ousterhout sensibly).</li></ul><hr class="divider"><h2><span class="h-node"></span>Tests: the non-negotiable safety net</h2><p>Fowler is emphatic: <strong>you cannot refactor safely without tests.</strong> Refactoring is "change the code without changing behavior" — and the only way to <em>know</em> you haven't changed behavior is to have tests you can run after each step. Without them, "refactoring" is just "editing and hoping."</p><p>So the book insists on <strong>self-testing code</strong>: a suite of automated tests you can run quickly and that tell you, unambiguously, pass or fail. He advocates writing tests as you go, focusing them on the areas of greatest risk, and running them constantly — the faster and more trustworthy your tests, the smaller and bolder your refactoring steps can be, because the feedback loop is tight. (For <em>legacy</em> code that has no tests, this is the missing prerequisite — pair Refactoring with Michael Feathers' <em>Working Effectively with Legacy Code</em>, which teaches how to get scary untested code under test in the first place, often by carefully introducing "seams.")</p><hr class="divider"><h2><span class="h-node"></span>The catalog and its mechanics (the reference half of the book)</h2><p>The bulk of the book is a catalog of 60-plus named refactorings, each documented with a <strong>Name</strong> (building the shared vocabulary), a <strong>Motivation</strong> (why and when to use it), <strong>Mechanics</strong> (the exact, ordered, safe sequence of small steps — this precision is what makes them reliably behavior-preserving), and a worked <strong>Example</strong>. You don't read this half front-to-back; you consult it. The essential ones to know by name:</p><ul><li><strong>Extract Function / Inline Function</strong> — pull a fragment into its own named function (or the reverse when a function is needless).</li><li><strong>Extract Variable / Inline Variable</strong> — name a sub-expression to clarify it (or remove a pointless temp).</li><li><strong>Change Function Declaration</strong> — rename a function or change its parameters, safely.</li><li><strong>Rename Variable / Rename Field</strong> — the humble, high-value ones.</li><li><strong>Move Function / Move Field</strong> — relocate behavior or data to the module where it belongs (the cure for Feature Envy).</li><li><strong>Extract Class / Inline Class</strong> — split a class that does too much, or merge one that does too little.</li><li><strong>Replace Temp with Query</strong> — replace a temporary variable with a function that computes the value, removing a hidden dependency.</li><li><strong>Replace Conditional with Polymorphism</strong> — turn a type-based switch into a set of subclasses/strategies (the deep cure for Repeated Switches).</li><li><strong>Introduce Parameter Object</strong> — bundle a clump of parameters into a single object (the cure for Data Clumps and Long Parameter List).</li><li><strong>Encapsulate Record / Encapsulate Collection / Encapsulate Variable</strong> — put controlled access in front of data so changes go through one place.</li><li><strong>Separate Query from Modifier</strong> — split a function that both returns a value and has a side effect (Clean Code's Command-Query Separation, as a mechanical refactoring).</li><li><strong>Split Phase</strong> — break a chunk of code that does two sequential things into two clearly separated phases (as in the opening example: compute, then format).</li></ul><p>Modern IDEs have automated many of these — the "Rename," "Extract Method," and "Inline" items in your editor's refactoring menu are <em>literally</em> this book's catalog turned into tooling. That automation makes the steps even safer (the tool guarantees behavior preservation for the mechanical ones), which is one reason the discipline has become mainstream.</p><hr class="divider"><h2><span class="h-node"></span>The workflow: how refactoring fits into real work</h2><p>Fowler gives several practices for <em>when</em> and <em>how</em> to weave refactoring into daily development:</p><ul><li><strong>The Two Hats (Kent Beck's metaphor).</strong> When you work on code, you wear one of two hats at any moment: the <strong>adding-function</strong> hat (you're changing behavior, adding capability, and you don't touch structure) or the <strong>refactoring</strong> hat (you're improving structure and <em>not</em> changing behavior). You switch between them frequently — but you're always aware which hat you're wearing, and you never wear both at once. Mixing them is how you introduce bugs and lose the safety of "behavior unchanged."</li></ul><ul><li><strong>Preparatory refactoring</strong> — the single most useful habit, captured in a line Fowler quotes from Kent Beck: <strong>"For each desired change, make the change easy (warning: this may be hard), then make the easy change."</strong> Before adding a feature, first refactor the surrounding code so that the feature drops in cleanly; then add it. You're not refactoring for its own sake — you're reshaping the ground so the new thing fits, which is usually faster overall than forcing a feature into an awkward structure.</li></ul><ul><li><strong>Comprehension refactoring</strong> — refactor <em>as a way of understanding</em> unfamiliar code. As you puzzle out what a gnarly function does, encode each realization back into the code (a better name, an extracted function), so your understanding is <em>captured</em> rather than lost, and the next person gets it for free. Fowler: refactoring is how you move your understanding <em>from your head into the code itself</em>.</li></ul><ul><li><strong>Litter-pickup refactoring</strong> — when you're in some code for another reason and notice a small mess, tidy it if it's cheap (the Boy Scout Rule again).</li></ul><ul><li><strong>The Rule of Three</strong> (attributed to Don Roberts): the first time you do something, just do it. The second time you do something similar, wince at the duplication but proceed. The <strong>third</strong> time, refactor to remove the duplication. This guards against premature abstraction — you wait until you have enough examples to see the <em>right</em> abstraction, rather than guessing from one or two cases (echoing the Pragmatic Programmer's warning about the wrong abstraction).</li></ul><p>The overarching message about <em>scheduling</em>: refactoring should <strong>not</strong> be a separate, planned phase that management can cut ("we'll refactor next quarter"). It's a continuous activity, folded into feature work in small doses, justified each time by making the current or next change easier. That framing is what keeps it alive in real teams — it never needs its own budget line because it <em>is</em> how you do the feature.</p><hr class="divider"><h2><span class="h-node"></span>What to take away</h2><ol><li><strong>You can improve design after the fact, safely</strong> — in small, behavior-preserving steps with tests green after each. Watch the opening example to feel it.</li><li><strong>Refactoring means "restructure without changing behavior"</strong> — not rewrite, not "clean up while adding a feature." Small, reversible steps; never far from working.</li><li><strong>Code smells name where design is decaying</strong> — Long Function, Duplicated Code, Feature Envy, Shotgun Surgery, Divergent Change, Primitive Obsession, Speculative Generality — turning unease into discussable problems.</li><li><strong>Tests are the precondition</strong> — self-testing code is what makes refactoring safe; without it you're just editing and hoping.</li><li><strong>The catalog gives named, mechanical cures</strong> — Extract Function, Move Function, Replace Conditional with Polymorphism, Introduce Parameter Object — many now automated in your IDE.</li><li><strong>Weave it into daily work</strong> — Two Hats, Preparatory Refactoring ("make the change easy, then make the easy change"), Comprehension Refactoring, the Rule of Three. Not a separate phase.</li><li><strong>The justification is economic</strong> — refactoring makes the <em>next</em> change faster; clean design and speed are allies.</li></ol><p>Refactoring is the practical engine behind <em>evolutionary design</em> — the idea (central to agile development) that you build the simplest thing that works now and continuously reshape it as understanding grows, rather than attempting a perfect Big Design Up Front. It's the natural sequel to Clean Code and Ousterhout: they tell you what good code looks like; Fowler tells you how to <em>get there</em> from wherever you are, safely.</p><p><strong>Apply it this week:</strong> pick a function with a <code>switch</code>/<code>if-else</code> chain on a type code and apply <strong>Replace Conditional with Polymorphism</strong> — or, better, practice the <em>discipline</em> itself: take any messy function and improve it using <strong>only</strong> named refactorings, running your tests after each single step, never more than a minute from green. The habit — small safe steps, always green — is the real lesson, more than any individual refactoring.</p>`});
GUIDE.books.push({id:"book5",title:"Domain-Driven Design",author:"Eric Evans · 2003",level:"Bridge",thesis:"For complex software, model the business itself; bounded contexts define your seams.",body:`<p>DDD makes one big claim: for software that tackles a <strong>complex business domain</strong>, the hardest and most valuable work is not the technology — it's <strong>deeply understanding the business itself and building a model of it that the software faithfully embodies.</strong> This walkthrough teaches the ideas in the order they build on each other, separating the <em>tactical</em> patterns (how to structure a model in code) from the <em>strategic</em> design (how to manage large models across teams) — a separation modern practitioners consider essential, because the strategic half is where the field-changing ideas live.</p><p>The book is famously dense. This read-along gives you its substance without the slog; if you then read the book, read the strategic chapters carefully and mine the rest.</p><hr class="divider"><h2><span class="h-node"></span>The central premise: the model is the point</h2><p>Most complexity in business software, Evans argues, isn't <em>technical</em> — it's in the <strong>domain</strong>: the intricate rules, workflows, and concepts of the business (insurance underwriting, shipping logistics, financial trading, healthcare). If you don't master that complexity, no amount of clean code or clever architecture will save you; you'll build something that technically runs but doesn't correctly reflect how the business actually works, and it will fight its users forever.</p><p>So the heart of DDD is <strong>domain modeling</strong>: developers and <strong>domain experts</strong> (the people who actually understand the business) collaborate closely to distill a <em>model</em> — a rigorous, simplified mental picture of the domain that captures exactly the concepts and rules that matter for the problem at hand. This model isn't a diagram filed away after a design meeting; it's the <em>shared conceptual core</em> that lives simultaneously in the team's understanding, their conversations, <strong>and the code</strong>. When the model and the code are the same thing, the software becomes a faithful, changeable expression of the business.</p><p>Two ideas make this real: the ubiquitous language, and model-driven design.</p><hr class="divider"><h2><span class="h-node"></span>Ubiquitous Language: one vocabulary, used everywhere including the code</h2><p>A recurring failure in software projects: domain experts speak in <em>business</em> terms ("a policy has riders," "we net the positions at end of day"), developers speak in <em>technical</em> terms ("the <code>InsuranceRecordDTO</code> has a <code>List&lt;Adjustment&gt;</code>"), and the two groups translate between their vocabularies in every conversation. That translation is a silent factory of misunderstanding and bugs — subtle meaning is lost each time, and neither side can tell when the model in the code has drifted from the model in the experts' heads.</p><p>DDD's fix is the <strong>Ubiquitous Language</strong>: a single, shared, rigorous vocabulary, developed jointly by developers and domain experts, that is used <em>everywhere</em> — in conversation, in documents, in diagrams, and, most importantly, <strong>in the code itself.</strong> If the business says "Policy" and "Rider," then there is a <code>Policy</code> class and a <code>Rider</code> class — not <code>InsuranceRecord</code> and <code>Adjustment</code>. Method names, class names, and module names come from the domain vocabulary. The test of the language is that a domain expert could read a description of what the code does (or even, with a developer's help, the class and method names) and recognize their own business in it.</p><p>This is more than tidiness. The language and the model <strong>shape each other</strong>: as the team refines the words they use, they refine the model, and vice versa. When you find the language is awkward or ambiguous — when experts use a term two different ways, or developers can't find a clean word — that friction is <em>revealing a flaw in the model</em>, and resolving it improves both. The Ubiquitous Language is thus both a communication tool and a design tool.</p><hr class="divider"><h2><span class="h-node"></span>Model-Driven Design and the tactical building blocks</h2><p>If the model is going to live in the code, you need building blocks for expressing it cleanly. Evans provides a vocabulary of patterns for structuring a domain model. These are the <em>tactical</em> patterns.</p><p><strong>Entities</strong> are objects defined by a <strong>thread of identity</strong> that persists over time and across changes to their attributes. A <code>Customer</code> is the same customer even after they change their name, address, and phone number — because identity, not attributes, defines them. Entities need a unique identifier and care taken that their identity is preserved consistently. Use an Entity when the object's individual continuity through time matters (this specific order, this specific account).</p><p><strong>Value Objects</strong> are the opposite: objects defined <em>entirely by their attributes</em>, with <strong>no identity</strong>, and ideally <strong>immutable</strong>. <code>Money(19.99, "USD")</code>, a <code>DateRange</code>, an <code>Address</code>, a <code>Color</code> — two instances with the same attributes are interchangeable; you don't care <em>which</em> $19.99 you have. Because they're immutable and identity-free, value objects are simple, safe to share, and easy to reason about. <strong>Using Value Objects instead of bare primitives is one of the most practical and underused ideas in the book</strong> — it's the direct cure for Fowler's "Primitive Obsession" smell. Instead of passing a raw <code>decimal</code> for money (which invites bugs: currency mismatches, invalid amounts, rounding chaos), you pass a <code>Money</code> value object that enforces its own rules in its constructor and offers domain-meaningful operations. The concept becomes explicit, self-validating, and reusable.</p><p><strong>Services</strong> hold domain logic that doesn't naturally belong to any single Entity or Value Object. A funds transfer between two accounts isn't really a behavior of <em>one</em> account — it's an operation involving both, so it lives in a <code>TransferService</code>. Domain Services are named from the Ubiquitous Language (they represent a domain <em>activity</em>), are stateless, and should be used sparingly — most logic <em>does</em> belong on an entity or value object, and reaching for a Service too quickly leads to anemic objects with all the behavior drained out into procedural services.</p><p><strong>Aggregates and Aggregate Roots</strong> — the most consequential tactical pattern. As a model grows, objects reference each other in a tangle, and it becomes unclear what may change what, and how to keep invariants (rules like "an order's total must equal the sum of its line items") consistent. An <strong>Aggregate</strong> is a cluster of associated Entities and Value Objects that is treated as <strong>a single unit for the purpose of data changes</strong>, with one Entity designated the <strong>Aggregate Root</strong> — the <em>only</em> member outside code is allowed to reference directly. All access and modification go <em>through</em> the root, which enforces the aggregate's invariants. Example: an <code>Order</code> is an aggregate root that owns its <code>OrderLine</code>s (which are inside the aggregate); you never modify an order line directly — you go through the <code>Order</code>, which can enforce "total must match lines" and "can't modify a shipped order." The governing rule Evans states: <strong>one transaction should modify one aggregate.</strong> This quietly does enormous work: aggregates define your <strong>consistency boundaries</strong> (what must be kept consistent together, atomically), and — decades later — they became a primary guide for <strong>transactional boundaries and even microservice/API boundaries</strong> (see 06i). Getting aggregate boundaries right (small enough to be efficient, large enough to enforce real invariants) is one of the subtler skills DDD teaches.</p><p><strong>Domain Events</strong> — first-class objects representing <strong>something meaningful that happened</strong> in the domain: <code>OrderConfirmed</code>, <code>PaymentFailed</code>, <code>ShipmentDispatched</code>. (This concept was added prominently after the original book and is now central to DDD practice.) Domain Events capture business-significant occurrences explicitly, and they're the conceptual bridge to <strong>event-driven architecture</strong> and <strong>event sourcing</strong> — when the things that happen in your domain are named objects, you can publish them, react to them, and even store the sequence of them as your source of truth.</p><p><strong>Repositories</strong> provide a <strong>collection-like interface for accessing aggregates</strong>, hiding the details of persistence. Client code asks a <code>OrderRepository</code> for "the order with this ID" or "orders placed today" and gets back fully-formed <code>Order</code> aggregates, without knowing whether they came from SQL, a document store, or memory. Repositories keep persistence concerns out of the domain model, so the model stays focused on business logic. (You provide a repository per <em>aggregate root</em>, not per table.)</p><p><strong>Factories</strong> encapsulate the creation of complex aggregates, ensuring they're born in a valid state with all invariants satisfied — creation logic that's too complex to sit in a constructor goes here.</p><p>Together these patterns let you express a rich domain model <em>in code</em> while keeping it clean, consistent, and free of infrastructure clutter. But — and modern practitioners stress this — <strong>the tactical patterns are the less important half</strong>, and applying them mechanically to simple problems produces enormous ceremony for no benefit. Their value appears only when the domain logic is genuinely complex.</p><hr class="divider"><h2><span class="h-node"></span>Strategic Design: the enduring, field-changing half</h2><p>The book's second great contribution addresses a problem the tactical patterns don't: <strong>what happens when the domain is too big for one unified model?</strong> In any large system, the dream of a single, consistent, company-wide model <em>always fails</em> — and Evans explains precisely why, then gives you the tools to manage it. This is the part that transcended its era.</p><p><strong>The core insight — the same word means different things in different places.</strong> In a large business, a single term carries <em>different meanings</em> in different areas. "Product" to the <strong>Catalog</strong> team means name, description, images, marketing copy. "Product" to the <strong>Inventory</strong> team means SKU, stock level, warehouse location, reorder threshold. "Product" to the <strong>Shipping</strong> team means weight, dimensions, hazardous-material flags. If you try to build one universal <code>Product</code> class that serves all of them, you get a monstrous object with dozens of fields, most irrelevant to any given user, coupling three teams together and satisfying none. The meanings genuinely differ; forcing them into one model is a category error.</p><p><strong>Bounded Context — the solution.</strong> Instead of one giant model, you divide the domain into <strong>Bounded Contexts</strong>: explicit boundaries within each of which a <em>particular</em> model and Ubiquitous Language apply and are <strong>internally consistent.</strong> Inside the Catalog context, <code>Product</code> means the catalog meaning, unambiguously. Inside Inventory, <code>Product</code> means the inventory meaning. Each context has its own model, its own language, and its own code, and the same word is <em>allowed</em> to mean different things in different contexts because the boundary makes the meaning clear. A bounded context is a context <em>within which</em> a model is valid — cross the boundary and you're in a different model. <strong>This is the single most influential idea in the book</strong>, because two decades later it became the standard answer to <em>"where should the boundaries between microservices go?"</em> — you find your bounded contexts, and those are your service boundaries (more in 06i). Aligning software boundaries with the natural conceptual and linguistic boundaries of the business is what makes systems decomposable at all.</p><p><strong>Context Mapping.</strong> Once you have multiple bounded contexts, you must manage how they <em>relate</em> — because they still have to work together. A <strong>Context Map</strong> documents the relationships between contexts and the patterns governing them:</p><ul><li><strong>Shared Kernel</strong> — two contexts share a small common model (kept deliberately small, changed only by agreement).</li><li><strong>Customer/Supplier</strong> — one context (downstream) depends on another (upstream); they negotiate the interface, with the upstream committing to the downstream's needs.</li><li><strong>Conformist</strong> — the downstream simply accepts the upstream's model as-is (often because the upstream won't accommodate them).</li><li><strong>Anti-Corruption Layer (ACL)</strong> — the important defensive one: when you must integrate with a messy, legacy, or external model you don't control, you build a <strong>translation layer</strong> at the boundary that converts between that foreign model and your own clean model, so their mess <em>cannot leak into and corrupt</em> your model. The ACL is a quarantine — inside your context, your model stays pure; the translation happens at the border. (This is the same instinct as the Adapter pattern and Clean Code's "boundaries," applied at the scale of whole subsystems.)</li></ul><p><strong>Distillation and the Core Domain.</strong> Not all parts of a large domain are equally important. Evans urges you to identify the <strong>Core Domain</strong> — the part of the business that is your actual competitive differentiator, the reason the software is worth building at all — and to focus your <em>best people and deepest modeling effort there</em>. Meanwhile, <strong>Generic Subdomains</strong> (things every business needs but that don't differentiate you — authentication, notification, standard reporting) should be bought off the shelf, outsourced, or kept deliberately simple. The strategic mistake is lavishing your best modeling on a generic subdomain while the core — the thing that actually matters — gets neglected. Distillation is about directing scarce design energy where it produces the most business value.</p><hr class="divider"><h2><span class="h-node"></span>How the two halves relate, and how to actually use the book</h2><p>The tactical patterns (Entities, Value Objects, Aggregates, Repositories, Domain Events) are for building a clean model <em>inside</em> a single bounded context. The strategic patterns (Bounded Contexts, Context Maps, Distillation) are for managing <em>many</em> models across a large system and multiple teams. You generally decide the strategic structure first (what are the contexts, how do they relate, where's the core), then apply tactical patterns within the contexts that warrant the investment.</p><p>The <strong>common misuse</strong>, which the community warns about repeatedly: cargo-culting the <em>tactical</em> patterns onto a simple CRUD application. If your "domain logic" is really just storing and retrieving records with minimal rules, then aggregates, repositories, domain services, and value objects everywhere are pure ceremony — you'll write mountains of boilerplate for no benefit, and you'll (rightly) conclude DDD is over-engineering. <strong>DD
