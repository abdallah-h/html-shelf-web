id:'ch13',num:'13',group:'The operational craft',title:'Deployment & Release',
lead:'How you get code to production is part of your design. Make deployments frequent, small, automated, and reversible — the opposite of every adjective is where outages come from.',
body:`
<div class="callout key"><div class="callout-t">◆ The counterintuitive foundation</div>Teams that deploy <em>more</em> frequently are <em>more</em> stable, not less. A big release hides the culprit among dozens of changes; a small one makes the cause obvious and the rollback trivial. Small changes are easier to review, test, and reverse, and keep the pipeline well-practiced.</div>

<h2><span class="h-node"></span>CI/CD</h2>
<div class="figure"><svg viewBox="0 0 660 170" role="img" aria-label="Deployment pipeline stages"><rect x="20" y="46" width="100" height="46" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="70" y="74" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Commit</text><rect x="140" y="46" width="120" height="46" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="200" y="68" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Build once</text><text x="200" y="84" text-anchor="middle" font-size="9.5" fill="#9BA6B7">immutable artifact</text><rect x="290" y="46" width="120" height="46" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="350" y="68" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Test</text><text x="350" y="84" text-anchor="middle" font-size="9.5" fill="#9BA6B7">unit → integration</text><rect x="430" y="46" width="120" height="46" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.4"/><text x="490" y="68" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Staging</text><text x="490" y="84" text-anchor="middle" font-size="9.5" fill="#9BA6B7">production-like</text><rect x="555" y="46" width="95" height="46" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.4"/><text x="602" y="68" text-anchor="middle" font-size="11.5" fill="#E7EBF2">Production</text><text x="615" y="84" text-anchor="middle" font-size="9.5" fill="#9BA6B7">canary → full</text><line x1="120" y1="69" x2="132" y2="69" stroke="#697285" stroke-width="1.4"/><polygon points="132,65 140,69 132,73" fill="#697285"/><line x1="260" y1="69" x2="272" y2="69" stroke="#697285" stroke-width="1.4"/><polygon points="272,65 280,69 272,73" fill="#697285"/><line x1="410" y1="69" x2="422" y2="69" stroke="#697285" stroke-width="1.4"/><polygon points="422,65 430,69 422,73" fill="#697285"/><line x1="530" y1="69" x2="542" y2="69" stroke="#697285" stroke-width="1.4"/><polygon points="542,65 550,69 542,73" fill="#697285"/><text x="330" y="126" text-anchor="middle" font-size="11" fill="#9BA6B7">one artifact is promoted through every stage — only configuration changes</text><text x="330" y="146" text-anchor="middle" font-size="11" fill="#E8975A">…and every stage can be rolled back in one step</text></svg><div class="figure-cap"><b>Build once, promote everywhere.</b> Rebuilding per environment means production runs something you never tested. The artifact stays identical; only the injected configuration differs.</div></div>
<div class="callout note"><div class="callout-t">◆ In plain English</div><strong>Continuous integration</strong> means everyone’s changes are merged and tested automatically, many times a day, so problems surface while they are small. <strong>Continuous delivery</strong> means the tested code is always ready to ship at the push of a button. Together they turn releases from a scary event into a routine, boring non-event — which is exactly what you want.</div>
<div class="figure"><svg viewBox="0 0 660 230" role="img" aria-label="Blue-green versus canary deployment"><line x1="330" y1="16" x2="330" y2="214" stroke="#343D4C" stroke-width="1"/><text x="160" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#9AA6FF">BLUE-GREEN</text><rect x="40" y="50" width="110" height="40" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="95" y="72" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Blue</text><text x="95" y="88" text-anchor="middle" font-size="10" fill="#9BA6B7">live</text><rect x="170" y="50" width="110" height="40" rx="8" fill="#161B24" stroke="#9BA6B7" stroke-width="1.5"/><text x="225" y="72" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7EBF2">Green</text><text x="225" y="88" text-anchor="middle" font-size="10" fill="#9BA6B7">new</text><text x="160" y="120" text-anchor="middle" font-size="18" fill="#E8975A">⇅ flip</text><text x="160" y="150" text-anchor="middle" font-size="10.5" fill="#9BA6B7">switch all traffic at once</text><text x="160" y="168" text-anchor="middle" font-size="10.5" fill="#697285">instant rollback = flip back</text><text x="500" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#9AA6FF">CANARY</text><rect x="390" y="50" width="220" height="26" rx="4" fill="#161B24" stroke="#343D4C"/><rect x="390" y="50" width="22" height="26" rx="4" fill="#5D6BEC"/><text x="620" y="68" text-anchor="end" font-size="10" fill="#9BA6B7">1%</text><rect x="390" y="86" width="220" height="26" rx="4" fill="#161B24" stroke="#343D4C"/><rect x="390" y="86" width="70" height="26" rx="4" fill="#5D6BEC"/><text x="620" y="104" text-anchor="end" font-size="10" fill="#9BA6B7">25%</text><rect x="390" y="122" width="220" height="26" rx="4" fill="#5D6BEC"/><text x="620" y="140" text-anchor="end" font-size="10" fill="#fff">100%</text><text x="500" y="168" text-anchor="middle" font-size="10.5" fill="#697285">widen only while healthy</text></svg><div class="figure-cap"><b>Two safe-release strategies.</b> Blue-green flips all traffic between two full environments (instant rollback). Canary exposes a small slice first and widens only while the golden signals stay healthy — the safest for risky changes.</div></div>
<p><strong>Continuous Integration</strong>: developers merge to a shared main frequently, and every merge triggers an automated build and test suite, catching integration problems while small — which requires a fast, trustworthy test suite and an always-green main. <strong>Continuous Delivery</strong>: every change that passes is always in a deployable state. The pipeline promotes <em>one</em> artifact (a container image) through each environment — never rebuild per environment.</p>

<h2><span class="h-node"></span>Release strategies</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>The goal of every strategy here is the same: put new code in front of users <em>without</em> risking a big outage, and be able to undo it instantly. Whether you flip between two environments or trickle the change out to 1% of users first, you are buying yourself a safe, fast "undo" button.</div>
<p><strong>Rolling</strong> — update instances gradually, no downtime (old and new run together, so changes must be compatible). <strong>Blue-green</strong> — two full environments; flip traffic to the new one, flip back instantly to roll back. <strong>Canary</strong> — release to 1% of traffic first, watch the golden signals, then progressively widen; the safest strategy for risky changes because it limits the blast radius. <strong>Feature flags</strong> — decouple deploy from release: ship code turned off, enable it gradually, and kill a broken feature instantly without a redeploy.</p>

<h2><span class="h-node"></span>The compatibility discipline</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>During any rollout, the old and new versions of your code run <em>at the same time</em> for a while. So every change must be one the old version can still live with — like renovating a house room by room while you are still living in it, never knocking out a wall the rest of the house depends on.</div>
<div class="callout trade"><div class="callout-t">◆ Zero-downtime schema changes</div>Because old and new versions run simultaneously during any rollout, changes must be backward-compatible. You cannot just rename a database column. Use <strong>expand/contract</strong> across multiple deploys: (1) add the new column alongside the old, writing both; (2) backfill and switch reads to the new; (3) once nothing uses the old, remove it. Each step is individually safe under a running mix of versions.</div>

<h2><span class="h-node"></span>IaC, testing &amp; rollback</h2>
<p><strong>Infrastructure as Code</strong> (Terraform) makes infrastructure version-controlled, reviewable, and reproducible — killing "works on the server Jane set up." The <strong>test pyramid</strong>: many fast unit tests, fewer integration tests, few slow end-to-end tests; plus <strong>contract tests</strong> so services deploy independently and <strong>load tests</strong> to find limits before users do. Finally, <strong>fast rollback</strong> is what makes deploying safe — optimizing <em>time to restore</em> is often more valuable than trying to prevent every failure.</p>

<h2><span class="h-node"></span>The testing pyramid — where to spend your effort</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Not all tests are equal. A few slow, realistic tests plus many fast, focused ones beats the reverse. The shape matters because slow, flaky tests get ignored, and ignored tests protect nothing.</div>
<div class="tbl-wrap"><table><thead><tr><th>Level</th><th>How many</th><th>Speed</th><th>Catches</th></tr></thead><tbody>
<tr><td><strong>Unit</strong> — one function or class, no database</td><td>Many (the base)</td><td>Milliseconds</td><td>Logic errors, edge cases</td></tr>
<tr><td><strong>Integration</strong> — a service with its real database/queue</td><td>Some</td><td>Seconds</td><td>Wiring, queries, serialization</td></tr>
<tr><td><strong>End-to-end</strong> — the whole system through the UI</td><td>Few (the tip)</td><td>Minutes</td><td>Critical user journeys only</td></tr>
</tbody></table></div>
<div class="callout key"><div class="callout-t">◆ The failure mode to avoid</div>An <strong>inverted pyramid</strong> — mostly end-to-end tests. They are slow, brittle, and fail for unrelated reasons, so the team starts re-running them until they pass ("just flaky") and eventually trusts nothing. A suite people distrust is worse than no suite, because it costs time and provides false comfort.</div>
<p>For services that call each other, add <strong>contract tests</strong>: the consumer declares what it expects, and the provider's build verifies it still delivers that. This is what lets services deploy independently without spinning up the entire system to test.</p>

<h2><span class="h-node"></span>Rollback: your most important safety feature</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>You will ship bugs — everyone does. What separates a shrug from an outage is how fast you can undo it. Optimize for recovery time, not for never failing.</div>
<ul>
<li><strong>Make rollback boring.</strong> It should be one command or one click, practised often enough that nobody hesitates at 3 a.m.</li>
<li><strong>Keep every change independently reversible.</strong> This is why backward-compatible schema steps matter — if a deploy cannot be rolled back because the database moved on, you have lost your safety net.</li>
<li><strong>Prefer rolling back over "rolling forward with a quick fix."</strong> A hotfix written under pressure is how one incident becomes two. Restore the known-good state first, then fix calmly.</li>
<li><strong>Feature flags beat redeploys.</strong> Turning a flag off takes seconds; a rollback takes minutes.</li>
</ul>

<h2><span class="h-node"></span>The four metrics that predict delivery health (DORA)</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Years of research found four numbers that separate high-performing teams. The surprising result: speed and stability rise together — teams that deploy more often also break things less.</div>
<div class="tbl-wrap"><table><thead><tr><th>Metric</th><th>Question it answers</th><th>Good looks like</th></tr></thead><tbody>
<tr><td>Deployment frequency</td><td>How often do we ship?</td><td>On demand, many times a day</td></tr>
<tr><td>Lead time for change</td><td>Commit to production — how long?</td><td>Under an hour</td></tr>
<tr><td>Change failure rate</td><td>What share of deploys cause a problem?</td><td>Low (roughly under 15%)</td></tr>
<tr><td>Time to restore</td><td>How fast do we recover?</td><td>Under an hour</td></tr>
</tbody></table></div>
<p>The counter-intuitive lesson: <strong>deploying more often makes you safer</strong>. Small changes have an obvious culprit and a trivial rollback, while big quarterly releases bundle dozens of changes so failures are hard to diagnose and terrifying to reverse.</p>

<h2><span class="h-node"></span>Environments and configuration</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>The same build should travel from staging to production unchanged. If you rebuild for each environment, you are not testing what you ship.</div>
<ul>
<li><strong>Build once, promote the artifact.</strong> One immutable image moves through environments; only configuration differs.</li>
<li><strong>Configuration lives outside the code</strong> — injected at runtime, with secrets from a secrets manager, never baked into the image or committed.</li>
<li><strong>Keep staging genuinely production-like.</strong> The bugs you miss are exactly the ones that live in the differences.</li>
<li><strong>Infrastructure as code</strong> so environments are reproducible and reviewable rather than hand-assembled and slowly divergent.</li>
</ul>

`});

GUIDE.chapters.push({
id:'ch14',num:'14',group:'The frontier',title:'ML & AI System Design',
lead:'An ML system is still a system — everything in this guide applies. What is different: behavior comes from data and a learned model, which adds new components, a new failure mode (the model silently gets worse), and a two-plane architecture.',
body:`
<div class="callout key"><div class="callout-t">◆ The core shift</div>Traditional software behavior is defined by the <strong>code</strong> you write. ML system behavior is defined by the <strong>data</strong> you feed it and the <strong>model</strong> that learns from it. That shift is the source of everything new here.</div>

<h2><span class="h-node"></span>The two planes</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div><strong>Training</strong> is studying for an exam over weeks — slow, thorough, done in big batches. <strong>Serving</strong> is answering each question in seconds during the test — fast and always available. Because those needs are opposite, the two are built and scaled as separate systems.</div>
<p><strong>Training (offline)</strong> builds the model from large historical datasets — a batch, throughput-oriented, latency-tolerant pipeline (hours are fine). <strong>Serving (online)</strong> runs the trained model on live requests (<strong>inference</strong>) — a latency-sensitive, availability-critical request/response service (tens of ms). They have opposite optimization goals, so they're built and scaled separately, and much of ML design is connecting them correctly.</p>

<h2><span class="h-node"></span>The ML-specific components</h2>
<p><strong>Feature pipeline</strong> — models consume engineered <strong>features</strong>, not raw data; computing them (batch + streaming) is much of the real work. <strong>Feature store</strong> — the key correctness component: it computes features once and serves them to <em>both</em> training and serving, preventing <strong>training/serving skew</strong> (features computed differently in each, silently degrading accuracy). <strong>Model serving</strong> — the model wrapped in a scalable inference service (caching, request batching, CPU vs. GPU trade-offs). <strong>Model registry</strong> — versioned artifacts, enabling staged rollout and rollback of models like any deploy.</p>

<h2><span class="h-node"></span>The failure mode unique to ML: drift</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A spam filter trained years ago misses today’s scams — not because the code broke, but because the world moved on. That is <strong>drift</strong>: the model quietly gets worse as reality changes, so you must watch its quality and re-teach it on fresh examples. This ongoing upkeep is the part beginners forget.</div>
<div class="callout trade"><div class="callout-t">◆ Models decay on their own</div>A frozen model gets <em>worse</em> over time because the world changes. <strong>Data drift</strong>: input distributions shift. <strong>Concept drift</strong>: the learned relationship changes (fraud tactics evolve). So ML monitoring goes beyond latency/errors — you track prediction and feature distributions and, where you get ground truth, live accuracy. The fix is <strong>retraining</strong> on fresh data, often automated. "How does this model stay good in six months?" is the question beginners skip.</div>

<h2><span class="h-node"></span>LLM / GenAI systems &amp; RAG</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div><strong>RAG</strong> is an open-book exam. Instead of answering purely from memory, the model first looks up the most relevant pages from your documents, then writes its answer using them — which is how you get a general model to answer accurately about your private, up-to-date data.</div>
<div class="figure"><svg viewBox="0 0 660 250" role="img" aria-label="RAG pipeline offline and online"><text x="0" y="16" font-size="11" fill="#697285" font-family="monospace">OFFLINE · ingestion</text><rect x="6" y="26" width="120" height="44" rx="8" fill="#161B24" stroke="#9BA6B7" stroke-width="1.5"/><text x="66" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Documents</text><line x1="126" y1="48" x2="142" y2="48" stroke="#697285" stroke-width="1.5"/><polygon points="142,44 150,48 142,52" fill="#697285"/><rect x="150" y="26" width="120" height="44" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="210" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Embed chunks</text><line x1="270" y1="48" x2="292" y2="48" stroke="#697285" stroke-width="1.5"/><polygon points="292,44 300,48 292,52" fill="#697285"/><rect x="300" y="26" width="140" height="44" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="370" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Vector DB</text><text x="370" y="68" text-anchor="middle" font-size="10.5" fill="#9BA6B7">store vectors</text><text x="0" y="130" font-size="11" fill="#697285" font-family="monospace">ONLINE · query</text><rect x="6" y="140" width="120" height="44" rx="8" fill="#161B24" stroke="#9BA6B7" stroke-width="1.5"/><text x="66" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">User query</text><line x1="126" y1="162" x2="142" y2="162" stroke="#697285" stroke-width="1.5"/><polygon points="142,158 150,162 142,166" fill="#697285"/><rect x="150" y="140" width="120" height="44" rx="8" fill="#161B24" stroke="#5D6BEC" stroke-width="1.5"/><text x="210" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Embed query</text><line x1="270" y1="162" x2="292" y2="162" stroke="#697285" stroke-width="1.5"/><polygon points="292,158 300,162 292,166" fill="#697285"/><rect x="300" y="140" width="140" height="44" rx="8" fill="#161B24" stroke="#2DD4BF" stroke-width="1.5"/><text x="370" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">Similarity search</text><text x="370" y="182" text-anchor="middle" font-size="10.5" fill="#9BA6B7">top-k chunks</text><line x1="440" y1="162" x2="462" y2="162" stroke="#697285" stroke-width="1.5"/><polygon points="462,158 470,162 462,166" fill="#697285"/><rect x="470" y="140" width="120" height="44" rx="8" fill="#161B24" stroke="#E8975A" stroke-width="1.5"/><text x="530" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#E7EBF2">LLM</text><text x="530" y="182" text-anchor="middle" font-size="10.5" fill="#9BA6B7">+ context</text><line x1="370" y1="70" x2="370" y2="140" stroke="#697285" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="366,132 370,140 374,132" fill="#697285"/><text x="404" y="108" font-size="10" fill="#697285">retrieve</text></svg><div class="figure-cap"><b>RAG grounds the model in your data.</b> Offline, documents are embedded into a vector store. Online, the query is embedded, the most relevant chunks are retrieved, and they are injected into the prompt — so answer quality hinges on <em>retrieval</em> as much as the model.</div></div>
<p>Many teams <em>consume</em> a model via API, shifting work to retrieval, prompting, and evaluation. <strong>Retrieval-Augmented Generation (RAG)</strong> grounds an LLM in your data: (1) offline, chunk documents, compute <strong>embeddings</strong>, store them in a <strong>vector database</strong>; (2) online, embed the query, do a <strong>similarity search</strong> for relevant chunks; (3) inject those chunks into the prompt as context. Quality hinges on the <em>retrieval</em> step as much as the model. What's genuinely different: responses are <strong>streamed</strong> token-by-token; inference is <strong>expensive</strong> (caching matters); output is non-deterministic so <strong>evaluation is harder</strong>; and new failure modes (hallucination, prompt injection) need <strong>guardrails</strong>.</p>

<div class="callout key"><div class="callout-t">◆ Designing one in an interview</div>Extend the ch. 04 framework: frame it as an ML problem (what are we predicting? what's the label? what business metric?), estimate scale, design the data/features (avoiding skew), sketch both planes, deep-dive the feature store and serving latency — and never forget the monitoring-and-retraining loop that keeps the model good.</div>

<h2><span class="h-node"></span>The ML lifecycle, end to end</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A model is not a feature you ship once — it is a loop you keep turning. Most ML failures in production are not bad maths; they are a broken loop.</div>
<ol>
<li><strong>Frame the problem.</strong> What are you predicting, what is the label, and which business metric actually improves? Getting this wrong makes everything downstream irrelevant.</li>
<li><strong>Collect and prepare data</strong> — usually the longest, least glamorous phase.</li>
<li><strong>Engineer features</strong>, storing definitions in a feature store so training and serving cannot drift apart.</li>
<li><strong>Train and evaluate</strong> against a held-out set and a meaningful baseline (often "the simple rule we use today").</li>
<li><strong>Deploy</strong> via a model registry, shadow first, then canary.</li>
<li><strong>Monitor</strong> for drift and quality, and <strong>retrain</strong> — which loops back to step 2.</li>
</ol>
<div class="callout key"><div class="callout-t">◆ Always build the baseline first</div>Before any model, implement the dumbest sensible rule — most popular item, last value, a simple threshold. Surprisingly often it captures most of the value at a fraction of the cost, and when a model does win, the baseline is what proves it. Skipping this is how teams spend six months to beat a three-line heuristic by 2%.</div>

<h2><span class="h-node"></span>Evaluating a model without fooling yourself</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Accuracy is a trap. If 1 in 1,000 transactions is fraud, a model that says "never fraud" is 99.9% accurate and completely useless. You need metrics that match what the mistakes actually cost.</div>
<div class="tbl-wrap"><table><thead><tr><th>Metric</th><th>Answers</th><th>Care about it when</th></tr></thead><tbody>
<tr><td>Precision</td><td>Of the ones we flagged, how many were right?</td><td>False alarms are expensive (blocking good customers)</td></tr>
<tr><td>Recall</td><td>Of all the real cases, how many did we catch?</td><td>Misses are expensive (undetected fraud, missed disease)</td></tr>
<tr><td>Accuracy</td><td>What fraction did we get right overall?</td><td>Classes are balanced — rarely true in practice</td></tr>
</tbody></table></div>
<p>Precision and recall trade against each other: catching more real cases means more false alarms. The right balance is a <em>business</em> decision, not a mathematical one — so ask "what does each kind of mistake cost us?" before tuning anything.</p>
<p>Two ways teams routinely fool themselves: <strong>data leakage</strong> (a feature secretly contains the answer — "was this order refunded?" when predicting fraud), which produces spectacular offline scores and terrible live results; and <strong>evaluating on the training data</strong>, which measures memorization rather than learning.</p>

<h2><span class="h-node"></span>Offline metrics vs. what actually happened</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>A model that scores better in testing can still make the product worse. The only verdict that counts is measured on real users.</div>
<p>So the deployment path is: prove it offline on a held-out set → run it in <strong>shadow</strong> (predicting on live traffic without acting on the results) → <strong>A/B test</strong> against the current model on real users, measuring the business metric, not just model accuracy → then roll out. Plenty of models with better offline scores lose the A/B test, because offline data cannot capture how users react to changed behaviour.</p>

<h2><span class="h-node"></span>What makes LLM features different</h2>
<div class="callout note"><div class="callout-t">◆ In plain English</div>Building with a large language model reuses everything you already know — caching, queues, streaming, evaluation — but four things genuinely change.</div>
<ul>
<li><strong>Latency and streaming.</strong> Generation is slow and token-by-token, so responses stream (SSE) instead of arriving at once. Perceived speed is a design feature.</li>
<li><strong>Cost per call is real.</strong> Long prompts and big models cost meaningful money per request, so caching, prompt size, and model choice are engineering levers, not details.</li>
<li><strong>Non-determinism.</strong> The same input can give different outputs, so testing uses evaluation sets, human review, and A/B tests rather than exact-match assertions.</li>
<li><strong>New failure modes.</strong> <em>Hallucination</em> (confidently wrong answers — mitigate by grounding with RAG and citing sources) and <em>prompt injection</em> (untrusted text in the prompt hijacking instructions — treat model input like any other untrusted input, and never let a model take a dangerous action without a check).</li>
</ul>
<div class="callout key"><div class="callout-t">◆ The mental shift</div>Treat the model as an <strong>unreliable, expensive, slow external service that returns plausible text</strong>. Every good instinct then follows: cache it, time it out, validate its output, stream it, monitor its quality, and never let it act unsupervised on anything that matters.</div>

GUIDE.flashcards.push({name:`Fundamentals`,cards:[
{q:`Vertical vs. horizontal scaling`,a:`Up = a bigger machine (simple, but a ceiling and a single point of failure). Out = more machines (limitless, redundant, needs distributed design and usually statelessness).`},
{q:`Why p99 latency beats the average`,a:`Averages hide the slow tail. At scale, p99 is thousands of your heaviest users, and tail latency compounds across many backend calls.`},
{q:`State the CAP theorem`,a:`During a network partition you must choose Consistency (refuse/err) or Availability (answer, possibly stale) — not both.`},
{q:`What does PACELC add to CAP?`,a:`Even with no partition (Else), you trade Latency vs. Consistency on every request. It's a constant dial, not just a failure-mode choice.`},
{q:`What is idempotency and why does it matter?`,a:`Doing an operation twice equals doing it once. It makes retries safe. Implement it with a client-supplied idempotency key.`},
{q:`Why does statelessness matter?`,a:`No per-user state in server memory means any instance can serve any request, so you can add/remove servers freely — trivial horizontal scaling and failover.`},
{q:`Four nines of availability = ?`,a:`99.99% availability ≈ 52 minutes of downtime per year. Each additional nine costs exponentially more.`},
{q:`How do you estimate QPS from users?`,a:`QPS ≈ (users × actions per day) / 100,000. One day ≈ 10^5 seconds. Multiply by 2–5 for peak.`},
]});
GUIDE.flashcards.push({name:`Building blocks`,cards:[
{q:`Cache-aside strategy`,a:`App checks the cache; on a miss it reads the DB and populates the cache. The default. Risk: staleness until TTL.`},
{q:`Cache stampede and its fix`,a:`A hot key expires and all requests miss at once, crushing the DB. Fix: a per-key lock so one refreshes, jittered TTLs, or background refresh.`},
{q:`Message queue vs. event log`,a:`Queue = a task done once by one consumer (SQS, RabbitMQ). Log = durable, replayable, read by many consumer groups (Kafka).`},
{q:`What does consistent hashing solve?`,a:`Adding or removing a node remaps only ~1/N of keys, versus nearly all with hash % N. Essential for distributed caches and shards.`},
{q:`At-least-once delivery implies what?`,a:`Duplicates will happen, so consumers must be idempotent (dedupe by message/idempotency ID).`},
{q:`WebSocket vs. SSE`,a:`WebSocket = full-duplex, both directions (chat, games). SSE = one-way server to client stream (feeds, token streaming).`},
{q:`When do you reach for a CDN?`,a:`Any static or media content, and read-heavy geo-distributed content — serve it from an edge near users and shield the origin.`},
{q:`SQL vs. NoSQL default choice`,a:`Default to relational (ACID, joins, flexible queries). Move to NoSQL only for a specific access pattern or scale reason.`},
{q:`What is a Bloom filter?`,a:`A tiny probabilistic set answering "definitely not present / maybe present" — used to skip pointless lookups (dedup, cache penetration).`},
]});
GUIDE.flashcards.push({name:`Approaches & patterns`,cards:[
{q:`Why is a modular monolith the default?`,a:`Monolith simplicity plus strict internal module boundaries, so you can extract a service later. Best for new systems.`},
{q:`The real reason to adopt microservices`,a:`Independent deployability and team autonomy — an organizational technology. Not performance (they're usually slower).`},
{q:`What is a distributed monolith?`,a:`Services that must deploy together, share a DB, or form chatty sync chains: all the pain of distribution with none of the independence. An anti-pattern.`},
{q:`What is a saga?`,a:`A multi-service workflow as a sequence of local transactions, each with a compensating action to undo it if a later step fails.`},
{q:`The outbox pattern prevents what?`,a:`The dual-write bug: DB updated but event lost (or vice versa). Write the change and the event in one local transaction to an outbox table; a relay publishes it.`},
{q:`The two GoF meta-principles`,a:`Program to an interface, not an implementation; and favor composition over inheritance.`},
{q:`What is a bounded context (DDD)?`,a:`An explicit boundary within which a domain model and language are consistent — the same word can mean different things elsewhere. The tool for finding service boundaries.`},
{q:`Clean/Hexagonal core rule`,a:`Dependencies point inward; the business core knows nothing of the web, DB, or framework (they're details). Achieved via dependency inversion.`},
{q:`Deep vs. shallow module (Ousterhout)`,a:`Deep = powerful functionality behind a simple interface (Unix file API). Shallow = an interface nearly as complex as its implementation. Prefer deep.`},
]});
GUIDE.flashcards.push({name:`Operations & delivery`,cards:[
{q:`The four golden signals`,a:`Latency (as percentiles), traffic, errors, saturation. The first things to instrument.`},
{q:`Which pillar localizes a slow request across services?`,a:`Distributed tracing. Metrics tell you something is wrong; traces localize where; logs explain why.`},
{q:`What is an error budget?`,a:`The allowed unreliability under an SLO (0.1% for 99.9%). Within budget, ship features; over budget, freeze and fix.`},
{q:`Alert on symptoms or causes?`,a:`Symptoms — page when users are affected. Cause-based alerts create noise and alert fatigue. Every page must be actionable and urgent.`},
{q:`Blue-green vs. canary`,a:`Blue-green: two full environments, flip traffic, flip back to roll back. Canary: release to a small traffic fraction first, watch, then widen. Canary limits blast radius best.`},
{q:`What do feature flags decouple?`,a:`Deployment from release. Ship code turned off, enable gradually, and kill a broken feature instantly without a redeploy.`},
{q:`Expand/contract pattern`,a:`Zero-downtime schema change in steps: add new alongside old (write both) → backfill and switch reads → remove old. Each step is safe under a running mix of versions.`},
{q:`Why blameless postmortems?`,a:`Systems that let human error cause outages are the real problem, not people. Blame drives issues underground; blamelessness surfaces them. Key output: tracked action items.`},
]});
GUIDE.flashcards.push({name:`ML & AI systems`,cards:[
{q:`Why split training and serving planes?`,a:`Opposite goals: training is batch, throughput-oriented, latency-tolerant; serving is latency-sensitive, availability-critical. Built and scaled separately.`},
{q:`What is training/serving skew?`,a:`Features computed differently in training vs. serving, silently degrading model accuracy. A feature store prevents it by computing features once for both.`},
{q:`Model works at launch, worse in 3 months — why?`,a:`Drift. Data drift (inputs shift) or concept drift (the learned relationship changes). Detect via distribution/accuracy monitoring; fix by retraining on fresh data.`},
{q:`Walk through RAG`,a:`Offline: chunk docs, embed them, store in a vector DB. Online: embed the query, similarity-search for relevant chunks, inject them into the prompt. Retrieval quality drives answer quality.`},
{q:`What is a feature store?`,a:`A system that computes features once and serves them to both training (offline) and serving (online), guaranteeing they match. Prevents skew.`},
{q:`One thing beginners skip in ML design`,a:`The monitoring-and-retraining loop — "how does this model stay good in six months?" Drift makes it mandatory.`},
]});

/* ---------- QUIZZES ---------- */
GUIDE.quizzes.push({title:`Fundamentals`,questions:[
{q:`A view counter on a video page briefly shows a slightly stale number during a network partition. Which CAP choice is this, and is it appropriate?`,
options:[`Consistency — and it's wrong, counts must be exact`,`Availability — and it's appropriate; a stale count beats an error`,`Neither; CAP doesn't apply to counters`,`It violates CAP entirely`],answer:1,
explain:`A view count is a classic <b>Availability</b> choice — a slightly stale or approximate number is fine, and nobody audits it, so serving it beats erroring. Contrast with a bank balance, which must choose Consistency.`},
{q:`Your service keeps user session data in each server's memory. What's the main scaling problem?`,
options:[`It uses too much disk`,`It's stateful, so requests must stick to one server and failover loses state`,`Sessions are inherently insecure`,`Nothing — this is best practice`],answer:1,
explain:`In-memory session state makes the service <b>stateful</b>: requests must be routed back to the same server, and if it dies the state is lost. Push session state to a shared store (e.g., Redis) so the web tier is stateless and any server can handle any request.`},
{q:`Why report p99 latency instead of the average?`,
options:[`p99 is easier to compute`,`Averages hide the slow tail that affects many real users, and tail latency compounds`,`p99 is always lower than the average`,`Averages aren't supported by monitoring tools`],answer:1,
explain:`Averages mask outliers. At scale, the p99 tail is thousands of (often your heaviest) users, and slow tails <b>compound</b> across multiple backend calls, so a page making 10 calls can be slow far more than 1% of the time.`},
{q:`A "create payment" request times out and the client retries, creating two charges. What's the fix?`,
options:[`Make the endpoint faster`,`Retry fewer times`,`Require an idempotency key so the server dedupes retries`,`Use a stronger database`],answer:2,
explain:`An <b>idempotency key</b> — a unique client-generated ID on the request — lets the server record the first result and return it on any repeat instead of re-executing. This is table stakes for anything touching money.`},
{q:`You need to shard data across nodes. Why avoid server = hash(key) % N?`,
options:[`It's too slow to compute`,`When N changes, nearly every key remaps — a catastrophic reshuffle`,`It only works for numbers`,`It isn't random enough`],answer:1,
explain:`With <code>hash % N</code>, changing the node count remaps almost every key, invalidating caches and moving huge amounts of data. <b>Consistent hashing</b> remaps only ~1/N of keys on a membership change.`},
]});
GUIDE.quizzes.push({title:`Architecture`,questions:[
{q:`A teammate says "let's use microservices so the app runs faster." What's the flaw?`,
options:[`Microservices are always faster`,`Microservices usually add latency; their real benefit is team autonomy and independent deployability`,`Nothing, they're correct`,`Microservices reduce operational cost`],answer:1,
explain:`Microservices typically make a system <b>slower</b> (calls become network hops) and more complex. The real justification is organizational — independent deployability lets many teams ship in parallel. No org problem, no need.`},
{q:`Two services share one database so they can join each other's tables. Why is this dangerous?`,
options:[`Joins are slow`,`It couples them through the schema, so they can no longer deploy or evolve independently`,`Databases can't be shared technically`,`It uses too much storage`],answer:1,
explain:`A shared database is the number-one killer of microservices: it couples services through the schema, forcing coordinated changes and destroying independent deployability — a distributed monolith. Each service should own its data privately.`},
{q:`Which is the correct definition of refactoring?`,
options:[`Rewriting a module from scratch`,`Cleaning up code while adding a feature`,`Restructuring code in small steps without changing observable behavior`,`A scheduled two-week cleanup phase`],answer:2,
explain:`Refactoring means improving internal structure <b>without changing observable behavior</b>, in small safe steps with tests green after each. It is not a rewrite, not bundled with feature changes, and not a separate phase.`},
{q:`What does the Dependency Inversion Principle enable architecturally?`,
options:[`Faster database queries`,`Business logic that depends on abstractions, so frameworks and databases become swappable, testable details`,`Fewer classes`,`Automatic scaling`],answer:1,
explain:`Dependency inversion lets high-level business logic depend on interfaces it owns, which outer layers implement. That's what makes the database and framework "details" you can swap, and lets you unit-test logic with in-memory stand-ins.`},
{q:`When is CQRS justified?`,
options:[`Always, for every CRUD app`,`When read and write patterns diverge sharply enough to warrant separate models`,`Only in monoliths`,`Whenever you use a cache`],answer:1,
explain:`CQRS (separate write and read models) adds real complexity, justified only when read and write access patterns diverge dramatically. For ordinary CRUD it's over-engineering.`},
]});
GUIDE.quizzes.push({title:`Reliability & ops`,questions:[
{q:`Which alert is well-designed?`,
options:[`Page when any single server's CPU exceeds 80%`,`Page when the checkout error rate breaches its SLO burn rate`,`Page on every deploy`,`Page when a log line contains the word "warning"`],answer:1,
explain:`Alert on <b>symptoms that affect users</b> (SLO burn), not internal causes. A single high-CPU box that isn't hurting anyone is noise; noise causes alert fatigue and trained-in blindness.`},
{q:`What is an error budget for?`,
options:[`Tracking cloud spend`,`Turning the reliability-vs-feature-velocity argument into data`,`Counting bugs`,`Measuring latency`],answer:1,
explain:`If your SLO allows 0.1% failure, that's your <b>budget</b>. Within it, ship features fast; blow it, and freeze features to invest in reliability. It aligns teams around one number.`},
{q:`During a major incident, what should you do first?`,
options:[`Find the root cause`,`Write the postmortem`,`Mitigate — stop the bleeding (roll back, fail over, shed load)`,`Notify legal`],answer:2,
explain:`Priority order is <b>restore service first, diagnose after</b>. Mitigate to unblock users (roll back, fail over, shed load); understanding the root cause can wait for the blameless postmortem.`},
{q:`You must rename a database column with zero downtime. What's the safe approach?`,
options:[`Rename it in a single deploy`,`Take the site down briefly`,`Expand/contract: add new alongside old, migrate, then remove old`,`Rename it directly in production at low traffic`],answer:2,
explain:`Old and new code run together during a rollout, so a rename breaks the old version instantly. <b>Expand/contract</b> sequences it into individually backward-compatible steps: add new, write both, backfill, switch reads, then remove old.`},
{q:`Why do more frequent, smaller deploys tend to be more stable?`,
options:[`They use less compute`,`A small change makes the culprit obvious and rollback trivial; big releases hide the cause`,`They skip testing`,`They avoid the database`],answer:1,
explain:`Small deploys have a small blast radius and an obvious culprit when something breaks, and they keep the pipeline well-practiced. Big, rare releases bundle many changes, making failures hard to diagnose.`},
]});
GUIDE.quizzes.push({title:`ML systems`,questions:[
{q:`Why are the training and serving planes built separately?`,
options:[`Different programming languages`,`They have opposite goals: batch throughput vs. low-latency availability`,`Security isolation`,`To save money only`],answer:1,
explain:`Training is a batch, throughput-oriented, latency-tolerant workload; serving is a latency-sensitive, availability-critical request/response service. Opposite optimization goals, so they're designed and scaled separately.`},
{q:`A model was accurate at launch but is worse three months later with no code change. What happened?`,
options:[`The code has a bug`,`Model drift — the world changed while the model stayed frozen`,`The database is slow`,`The cache is stale`],answer:1,
explain:`This is <b>drift</b> — data drift (input distributions shift) or concept drift (the learned relationship changes). It's the failure mode unique to ML, detected by monitoring distributions/accuracy and fixed by retraining on fresh data.`},
{q:`What does a feature store prevent?`,
options:[`Slow inference`,`Training/serving skew — features computed differently in each path`,`Model overfitting`,`Data breaches`],answer:1,
explain:`A feature store computes features once and serves them to both training and serving, guaranteeing they match. That prevents <b>training/serving skew</b>, an invisible accuracy killer.`},
{q:`In a RAG system, which step most determines answer quality?`,
options:[`The prompt's font`,`Retrieval — finding the right chunks to give the model`,`The model's temperature only`,`The vector database's brand`],answer:1,
explain:`RAG quality hinges on <b>retrieval</b> as much as the model — if you fetch the wrong context, even a great model answers poorly. Chunking strategy, embedding quality, and index freshness all matter.`},
]});
</script>
<script>
/* ---------- ESTIMATION DRILLS ---------- */
GUIDE.estimation.push({q:`A photo app has 50M DAU; each uploads 2 photos/day at 3 MB, and views 200 photos/day. Estimate upload QPS, view QPS, and daily storage.`,
a:`<p><strong>Uploads:</strong> 50M × 2 / 10^5 = <strong>1,000/s</strong> average (peak ~3–5k).</p><p><strong>Views:</strong> 50M × 200 / 10^5 = <strong>100,000/s</strong> → read:write ≈ 100:1 → heavily read-optimized (cache + CDN).</p><p><strong>Storage:</strong> 100M photos/day × 3 MB = <strong>300 TB/day</strong> (plus thumbnails). Media dominates → object storage + CDN; the DB holds only metadata/URLs.</p>`});
GUIDE.estimation.push({q:`A chat app has 20M DAU sending 50 messages/day, ~200 bytes each. Estimate send QPS and daily text storage.`,
a:`<p><strong>Send QPS:</strong> 20M × 50 / 10^5 = <strong>10,000/s</strong> average (peak ~30–50k) → write-heavy → wide-column store.</p><p><strong>Text/day:</strong> 1B messages × 200 B = <strong>200 GB/day</strong> of text (media stored separately in object storage).</p>`});
GUIDE.estimation.push({q:`A URL shortener creates 50M links/month, each read ~200× over its life. Estimate write QPS, read QPS, and the ratio.`,
a:`<p><strong>Writes:</strong> 50M / (30 × 10^5) ≈ <strong>17/s</strong> — tiny.</p><p><strong>Reads:</strong> 17 × 200 ≈ <strong>3,400/s</strong>.</p><p><strong>Ratio ≈ 200:1</strong> → design entirely around cached reads; the database barely works.</p>`});
GUIDE.estimation.push({q:`A metrics system has 100k servers each emitting 500 metrics every 10 s. Estimate ingest points/sec and points/day.`,
a:`<p><strong>Per second:</strong> 100k × 500 / 10 = <strong>5,000,000 points/s</strong>.</p><p><strong>Per day:</strong> 5M × 10^5 = <strong>5 × 10^11 = 500 billion points/day</strong> → needs a time-series store, aggressive downsampling/rollups, and columnar/compressed storage.</p>`});
GUIDE.estimation.push({q:`You must store 200M items keyed by a 16-byte UUID with a 1 KB value each. How much raw storage, and does it fit on one machine?`,
a:`<p>200M × (~1 KB + overhead) ≈ <strong>200+ GB</strong>. That fits on one large machine's disk today — but for availability and throughput you'd replicate (3×) and likely shard as it grows. The number tells you: <em>not "big data" yet</em> — don't over-engineer.</p>`});
GUIDE.estimation.push({q:`A video platform streams to 10M concurrent viewers at an average 5 Mbps. Estimate the egress bandwidth.`,
a:`<p>10M × 5 Mbps = <strong>50,000,000 Mbps = 50 Tbps</strong> of egress. No origin serves that — it's <strong>entirely a CDN problem</strong>. Your servers handle metadata and manifests; the CDN handles the bytes from edges near viewers.</p>`});
GUIDE.estimation.push({q:`A social feed has 100M DAU each loading their feed 10×/day. If a feed read touches ~5 backend calls, estimate feed reads/sec and total backend calls/sec.`,
a:`<p><strong>Feed reads:</strong> 100M × 10 / 10^5 = <strong>10,000/s</strong> (peak ~30–50k).</p><p><strong>Backend calls:</strong> ~5× that = <strong>50,000/s</strong> — which is exactly why you precompute feeds (fan-out on write) rather than assembling them from many calls at read time.</p>`});
GUIDE.estimation.push({q:`An e-commerce flash sale expects 1M users hitting "buy" within the first 10 seconds for 10,000 items. What does the math tell you to build?`,
a:`<p><strong>Peak attempt rate:</strong> ~1M / 10 s = <strong>100,000 attempts/s</strong> against 10k units of inventory — a 100:1 losers-to-winners ratio. Two conclusions: (1) a <strong>virtual waiting room</strong> to admit users at a sustainable rate, and (2) an <strong>atomic conditional write</strong> on inventory so the 100k racers can't oversell 10k items. Raw throughput isn't the hard part — contention correctness is.</p>`});

/* ---------- DESIGN CHALLENGES ---------- */
GUIDE.challenges.push({title:`Design a pastebin (Pastebin / GitHub Gist)`,
prompt:`Users paste text (sometimes large), get a shareable link, and read pastes back. Support optional expiry and private/unlisted pastes. Run the full framework.`,
hints:[`Very close to the URL shortener: read-heavy, cache-first, key/ID generation. Estimate the read:write ratio first — it drives everything.`,`Store large paste bodies in object storage and only metadata (id, owner, expiry, visibility) in the database. Serve reads from cache/CDN.`,`Deep-dive: key generation (base-62 counter or hash), the cached read path, and TTL/expiry handling (lazy on read, or a sweeper). Privacy = unguessable keys + an authorization check for private pastes.`]});
GUIDE.challenges.push({title:`Design a search autocomplete (typeahead)`,
prompt:`As a user types, return the top-k completions for their prefix in under 100 ms at high QPS.`,
hints:[`The crux is serving top-k for a prefix fast. You cannot query the database per keystroke — precompute.`,`Build a trie (or a prefix → top-k table) offline from query logs; cache hot prefixes in memory. Update rankings in the background (batch/stream), not per request.`,`Read-heavy, eventual consistency is fine (a slightly stale ranking is invisible). Compare the pattern to feed precompute (push) and CDN edge caching.`]});
GUIDE.challenges.push({title:`Design a "nearby drivers" proximity service`,
prompt:`Given a rider's location, return available drivers within a radius, with live-updating positions, at city scale.`,
hints:[`The crux is geospatial indexing. Raw lat/long comparisons don't scale.`,`Use grid cells (geohash / S2 / H3): store live driver positions in an in-memory grid keyed by cell, with a TTL so stale positions expire. Query the rider's cell plus its neighbors.`,`Split ephemeral lossy data (positions, in memory) from durable business data (trips, in a DB). Deep-dive: cell-size trade-off (too big = many candidates; too small = many neighbor cells) and edge-of-cell handling.`]});
GUIDE.challenges.push({title:`Design an e-commerce inventory + order system for Black Friday`,
prompt:`Handle a massive burst of concurrent buyers for limited stock. Never oversell, never double-charge, stay responsive under the spike.`,
hints:[`Two separate problems: the load spike and the correctness guarantees. Solve them with different tools.`,`Load: a virtual waiting room admits users at a sustainable rate; edge-cache the product page. Correctness: an atomic conditional inventory decrement (UPDATE ... WHERE stock &gt; 0) and an idempotency key on payment.`,`Model the multi-step checkout as a saga with compensating actions, and use the outbox pattern to publish "order placed" events reliably. Deep-dive: never oversell (conditional write) and never double-charge (payment idempotency).`]});
GUIDE.challenges.push({title:`Design a rate-limited public API platform`,
prompt:`Offer third parties an API with per-key rate limits, authentication, routing, and usage metering for billing.`,
hints:[`Combine a rate limiter with an API gateway's other duties. Start with the limiter algorithm.`,`Use a token bucket backed by atomic Redis counters shared across all gateway nodes. For latency, a two-tier local + global counter. Decide fail-open vs. fail-closed per endpoint.`,`The gateway also does auth (token validation), routing, and usage metering (emit usage events to a stream for billing). Deep-dive: distributed atomic counters and keeping them consistent without adding latency to every request.`]});
GUIDE.challenges.push({title:`Design a feature-flag / config service`,
prompt:`Serve feature flags and config to thousands of app instances with very low latency, and it must never take down the apps it serves.`,
hints:[`Read-heavy and latency-critical. The key non-functional requirement is fail-safe: if the service is unreachable, apps must keep working on last-known-good defaults.`,`Push config to clients via SSE/long-poll or an SDK with a local cache and background refresh. Flag changes want strong-ish consistency but graceful stale fallback.`,`Deep-dive: the fail-open behavior (never block the app), propagation latency vs. consistency, and gradual rollout of a flag to a percentage of users.`]});
GUIDE.challenges.push({title:`Design a video-conferencing signaling & presence system`,
prompt:`Handle room membership, presence, and the signaling needed to establish calls (not the audio/video media path itself).`,
hints:[`This is a stateful real-time problem, like the chat gateway. The media itself usually flows peer-to-peer or via an SFU — note it as out of scope.`,`Clients hold WebSocket connections to signaling servers; a session registry maps user → server. Presence via heartbeats with TTL; room membership tracked per room.`,`Deep-dive: the stateful connection tier, reconnection and failover (rehydrate room state), and fan-out of signaling messages to room members.`]});
GUIDE.challenges.push({title:`Design a recommendation system ("recommended for you")`,
prompt:`Show each user a personalized ranked list of items, updated as their behavior and the catalog change. Design it as an ML system.`,
hints:[`Frame it as ML: what are you predicting (likelihood of engagement)? What's the label (click/purchase)? What business metric are you really optimizing?`,`Two planes: offline training (data → features → train → evaluate → registry) and online serving (fetch features + candidate items → rank via the model → return top-k, cached). Use a feature store to avoid training/serving skew.`,`Deep-dive: candidate generation vs. ranking (retrieve a few hundred candidates cheaply, then rank precisely), serving latency, and — the step beginners skip — monitoring for drift and a retraining pipeline to keep recommendations fresh.`]});
</script>
<script>
/* ---------- INTERVIEW BANK · PART 1 ---------- */
GUIDE.interview.push(
{cat:`Fundamentals`,d:`Easy`,q:`What's the difference between latency and throughput?`,
a:`<p><strong>Latency</strong> is how long a single operation takes (e.g., 50 ms per request). <strong>Throughput</strong> is how many operations complete per unit time (e.g., 10,000 requests/sec). They're related but independent — you can have high throughput with high latency (a batch pipeline processing millions of records but each taking a while) or low latency with low throughput (a fast service handling few requests).</p><p>Always discuss latency as <strong>percentiles</strong> (p50, p95, p99), not averages, because averages hide the slow tail that real users feel. When designing, know which one the requirement is really about — a trading system cares about tail latency; a nightly report cares about throughput.</p>`},
{cat:`Fundamentals`,d:`Medium`,q:`Explain the CAP theorem and how you'd apply it to a real feature.`,
a:`<p>CAP says that when a <strong>network partition</strong> occurs (nodes can't all communicate), a distributed system must choose between <strong>Consistency</strong> (every read sees the latest write, so you refuse or error rather than serve stale data) and <strong>Availability</strong> (you always answer, possibly with stale data). You can't have both <em>while partitioned</em>.</p><p>The key insight for interviews is that the choice is <strong>per-feature</strong>, not per-system. In an e-commerce app: the <em>inventory/checkout</em> path chooses Consistency (never oversell), while the <em>product reviews</em> or <em>view counts</em> choose Availability (a slightly stale count is fine). I'd also mention <strong>PACELC</strong>: even without a partition, you trade Latency vs. Consistency on every request, so it's a constant dial. Strong consistency costs latency; eventual consistency buys speed and availability at the price of temporary staleness.</p>`},
{cat:`Fundamentals`,d:`Medium`,q:`How do you make a service horizontally scalable?`,
a:`<p>The foundation is <strong>statelessness</strong>: keep no per-request or per-user state in a server's local memory, so any instance can handle any request. Push state to shared stores — sessions to Redis, data to the database, files to object storage. Then put a <strong>load balancer</strong> in front and you can add or remove identical instances freely, with automatic failover when one dies.</p><p>Beyond the web tier, scaling out means handling data: read replicas to multiply reads, caching to absorb hot reads, and sharding (via consistent hashing) when a single database can't hold or serve the load. I'd also mention using queues to decouple slow work from the request path, so bursts don't overwhelm the system. The mindset: design so adding a machine adds capacity, with no single point of failure.</p>`},
{cat:`Fundamentals`,d:`Hard`,q:`Walk me through estimating the scale of a system before designing it.`,
a:`<p>I round aggressively and let the numbers drive decisions. I start from users (DAU) and their behavior. Rules of thumb: one day ≈ 10^5 seconds, peak ≈ 2–5× average, 1 char ≈ 1 byte.</p><p><strong>Example — a photo app, 50M DAU, 2 uploads + 200 views/day:</strong> writes = 50M × 2 / 10^5 = 1,000/s; reads = 50M × 200 / 10^5 = 100,000/s. That's a <strong>100:1 read:write ratio</strong>, which immediately tells me the design is dominated by caching and a CDN, not by write throughput. Storage = 100M photos/day × 3 MB ≈ 300 TB/day, which says media goes to object storage with only URLs in the database.</p><p>The point isn't precision — it's that these numbers decide the architecture. A high read ratio means cache-first; huge media means object storage + CDN; high write rates point to wide-column stores and sharding. Stating them out loud early prevents designing the wrong system.</p>`},

{cat:`Databases & storage`,d:`Easy`,q:`When would you choose NoSQL over a relational database?`,
a:`<p>My default is <strong>relational</strong> — ACID transactions, joins, flexible ad-hoc queries, and mature tooling cover most needs. I move to NoSQL for a <em>specific</em> reason, matching the store to the access pattern:</p><ul><li><strong>Key-value</strong> (Redis, DynamoDB) — simple lookups by key at massive scale: sessions, carts, caches.</li><li><strong>Document</strong> (MongoDB) — self-contained tree data read/written as a whole: profiles, catalogs, with schema flexibility.</li><li><strong>Wide-column</strong> (Cassandra) — huge write volumes and time-series/feed access by partition key: activity feeds, metrics.</li><li><strong>Graph</strong> (Neo4j) — relationship-heavy traversals: social graphs, fraud rings.</li></ul><p>The wrong reason is hype ("NoSQL scales"). The right reason is a concrete access pattern or scale requirement that relational can't serve well. Many systems use <strong>polyglot persistence</strong> — several stores, each for the job it fits.</p>`},
{cat:`Databases & storage`,d:`Medium`,q:`Explain database replication and the consistency issues it introduces.`,
a:`<p>Replication keeps copies of data on multiple nodes for read scaling and fault tolerance. The common model is <strong>single-leader</strong>: writes go to a leader that streams a change log to follower replicas; reads can hit any replica.</p><p>The catch is <strong>replication lag</strong> — followers are briefly behind the leader, so reads can be stale. This causes specific anomalies with named fixes: <strong>read-your-own-writes</strong> (a user posts a comment then doesn't see it because the read hit a lagging replica — fix by reading a user's own recent writes from the leader), <strong>monotonic reads</strong> (seeing a value, then an older one — fix by pinning a user to one replica), and <strong>consistent prefix reads</strong> (seeing effects before causes). I'd name the exact guarantee the feature needs rather than vaguely saying "strong" or "eventual." Other models: <strong>multi-leader</strong> (multi-region writes, with conflict resolution) and <strong>leaderless</strong> quorums (Dynamo-style, w + r &gt; n).</p>`},
{cat:`Databases & storage`,d:`Medium`,q:`What is sharding, and how do you decide a sharding key?`,
a:`<p>Sharding (partitioning) splits data across machines when one can't hold or serve it. Two schemes: <strong>hash sharding</strong> (partition by hash of the key — even spread, no hot spots from sequential keys, but range scans are scattered) and <strong>range sharding</strong> (partition by key ranges — great range scans, but risks hot shards, e.g., partitioning by timestamp sends all today's writes to one shard).</p><p>The sharding key should (1) spread load evenly, (2) match your dominant access pattern so most queries hit one shard, and (3) avoid hot spots. For a chat app, shard by conversation ID so a conversation's messages are co-located. I'd never use <code>hash % N</code> — changing N remaps almost everything — but <strong>consistent hashing</strong>, which remaps only ~1/N of keys when the node set changes. I'd also flag the hard parts: cross-shard queries, rebalancing, and the "celebrity" hot-key problem, which may need special handling like replicating that key.</p>`},
{cat:`Databases & storage`,d:`Hard`,q:`Explain how a database transaction's isolation levels differ and why it matters.`,
a:`<p>Isolation controls how concurrent transactions interfere, and it's a spectrum — weaker levels are faster but permit subtle bugs. <strong>Read Committed</strong> stops dirty reads but allows non-repeatable reads. <strong>Snapshot Isolation / Repeatable Read</strong> gives each transaction a consistent snapshot (via MVCC), fixing non-repeatable reads, but still allows <em>write skew</em> and <em>phantoms</em>. <strong>Serializable</strong> is the strongest — transactions behave as if run one at a time — preventing all anomalies, implemented via two-phase locking, actual serial execution, or serializable snapshot isolation.</p><p>Why it matters: the dangerous anomalies are subtle. <strong>Lost updates</strong> (two read-modify-writes, one overwrites the other) and <strong>write skew</strong> (two transactions each read shared state and make individually-valid decisions that jointly violate an invariant — e.g., two on-call doctors both cancel because "someone else is on call," leaving nobody) only appear under concurrency and are brutal to debug. In an interview I'd say: know your database's <em>default</em> isolation level and which anomalies it permits, because the defaults are often weaker than developers assume.</p>`},

{cat:`Caching`,d:`Easy`,q:`Explain cache-aside and its main risk.`,
a:`<p><strong>Cache-aside (lazy loading)</strong> is the default caching strategy: the application checks the cache first; on a miss, it reads from the database and writes the result into the cache; subsequent reads hit the cache. It's simple and only caches what's actually requested.</p><p>The main risk is <strong>staleness</strong>: when the underlying data changes, the cache still holds the old value until it expires (TTL) or is explicitly invalidated. So you pair it with an invalidation strategy — either a short TTL (accept brief staleness) or active invalidation on write. The classic follow-up is cache invalidation being "one of the two hard problems in computer science" — I'd discuss write-through (update cache on write) as an alternative that trades write latency for freshness.</p>`},
{cat:`Caching`,d:`Medium`,q:`What is a cache stampede and how do you prevent it?`,
a:`<p>A <strong>cache stampede</strong> (thundering herd) happens when a popular cached key expires and, in the instant before it's repopulated, a flood of concurrent requests all miss the cache and hit the database simultaneously — potentially overwhelming it. It's especially dangerous for viral/hot keys.</p><p>Fixes, which I'd combine: (1) a <strong>per-key lock</strong> — the first request to miss acquires a lock and refreshes the cache while others wait or serve slightly-stale data; (2) <strong>jittered/staggered TTLs</strong> so many keys don't expire at the same instant; (3) <strong>background refresh</strong> of known-hot keys before they expire, so users never hit a cold cache; and (4) serving stale-while-revalidate. I'd also mention the related <strong>cache penetration</strong> problem (requests for non-existent keys always miss), solved with negative caching or a Bloom filter.</p>`},
{cat:`Caching`,d:`Medium`,q:`Where would you place caches in a typical web architecture?`,
a:`<p>Caching happens at many layers, and I'd place it wherever reads are hot and repeated:</p><ul><li><strong>Browser / client cache</strong> — avoid the request entirely for static assets.</li><li><strong>CDN / edge</strong> — static content and read-heavy responses served near users, shielding the origin.</li><li><strong>Application cache</strong> (Redis/Memcached) — computed results, database query results, session data.</li><li><strong>Database cache</strong> — the DB's own buffer pool; and read replicas act as a scaling layer.</li></ul><p>The guiding principle is to cache on the hot read paths and to move data as close to the user as its freshness requirements allow. I'd always address <strong>invalidation</strong> explicitly — a cache is only useful if you have a plan for when its data changes — and note the trade-off: caching trades freshness and complexity for latency and load reduction.</p>`},

{cat:`Scaling & distribution`,d:`Medium`,q:`What is consistent hashing and what problem does it solve?`,
a:`<p>When you distribute keys across N nodes with <code>node = hash(key) % N</code>, changing N (adding or removing a node) remaps <em>almost every</em> key to a different node — a catastrophic reshuffle that invalidates caches and moves huge amounts of data.</p><p><strong>Consistent hashing</strong> solves this by placing both nodes and keys on a hash ring; a key belongs to the next node clockwise. When a node is added or removed, only the keys between it and its neighbor move — about <strong>1/N of keys</strong>, not all of them. To keep the load balanced (a few nodes could otherwise own large arcs), each physical node is placed at many points on the ring as <strong>virtual nodes</strong>. It's the foundation of distributed caches (Memcached clients), and databases like Cassandra and DynamoDB. Great follow-up territory: how virtual nodes smooth imbalance and how this handles a hot key (replicating it).</p>`},
{cat:`Scaling & distribution`,d:`Hard`,q:`How would you design a system to generate unique IDs across many servers?`,
a:`<p>The requirements are usually: globally unique, roughly time-ordered (sortable), and generatable without a central bottleneck. A database auto-increment fails because it's a single point of contention and doesn't work across shards.</p><p>The standard answer is a <strong>Snowflake-style ID</strong>: a 64-bit integer packed as [timestamp | machine ID | per-machine sequence number]. The timestamp makes IDs roughly sortable by creation time; the machine ID ensures two machines never collide; the sequence number distinguishes IDs generated in the same millisecond on one machine. Each server generates IDs locally with no coordination, so it scales horizontally and has no bottleneck. I'd mention trade-offs: clock skew between machines can affect ordering (so you rely on the machine ID for uniqueness, not perfect global time order), and you must allocate machine IDs carefully. Alternatives: UUIDs (128-bit, random, unique but not sortable and larger) or a central ticket server (simpler, but a bottleneck).</p>`},
{cat:`Scaling & distribution`,d:`Medium`,q:`A single feature (a celebrity's posts) is overwhelming one shard. How do you handle it?`,
a:`<p>This is the <strong>hot key / celebrity problem</strong> — even with good hashing, one key can attract disproportionate traffic. Several approaches, often combined:</p><ul><li><strong>Replicate the hot key</strong> across multiple nodes and spread reads, or add a dedicated local cache layer in front so most reads never reach the shard.</li><li><strong>Hybrid fan-out</strong> (for feeds): don't push a celebrity's post to 100M follower feeds (a write storm) — instead, pull the celebrity's posts at read time and merge them into each follower's precomputed feed. This is exactly why social feeds use a push/pull hybrid.</li><li><strong>Sub-partition</strong> the hot entity's data further if the volume warrants it.</li></ul><p>The general lesson: uniform sharding handles uniform load, but real traffic has hot spots, so you design explicit special-casing for the few keys that dominate.</p>`},

{cat:`Architecture`,d:`Medium`,q:`Monolith or microservices — how do you decide?`,
a:`<p>I default to a <strong>modular monolith</strong> for new systems: one deployable, but with strict internal module boundaries (modules talk through interfaces, never touch each other's data). It's simpler to build, test, deploy, and reason about, and it preserves the option to extract services later.</p><p>I'd adopt <strong>microservices</strong> only when I feel a <em>specific</em> pain that they solve — most importantly, <strong>independent deployability</strong>: multiple teams blocked on each other in one codebase, or a component that must scale or be deployed independently. The real driver is organizational (team autonomy), not performance — microservices usually add latency and a lot of operational overhead (per-service CI/CD, distributed tracing, service discovery, contract testing). The failure mode to avoid is the <strong>distributed monolith</strong>: services that must deploy together or share a database, giving all the pain of distribution with none of the benefit. My summary line: "monolith first; split when a boundary earns its cost."</p>`},
{cat:`Architecture`,d:`Medium`,q:`How do microservices communicate, and what are the trade-offs?`,
a:`<p>Two broad styles. <strong>Synchronous</strong> request/response (REST, gRPC): simple to reason about and easy to debug, but it creates temporal coupling (both services must be up) and risks cascading failures (a slow downstream service backs up its callers). <strong>Asynchronous</strong> event-driven (messages/events via a broker like Kafka): decouples services, smooths spikes, and improves resilience (a consumer can be down and catch up later), but the overall flow is harder to trace and you must handle duplicate delivery (idempotent consumers) and eventual consistency.</p><p>Within async, <strong>orchestration</strong> (a central coordinator directs each step) keeps a complex workflow visible but is a coupling point; <strong>choreography</strong> (services react to events independently) maximizes decoupling but the workflow lives nowhere explicit. My guidance: prefer async to reduce coupling, keep synchronous chains short, add timeouts/retries/circuit breakers on every call, and use sagas for multi-service transactions.</p>`},
{cat:`Architecture`,d:`Hard`,q:`Explain the saga pattern and when you'd use it.`,
a:`<p>Because microservices each own their data, you can't wrap a change spanning multiple services in a single ACID transaction. A <strong>saga</strong> handles this: it models a business workflow as a sequence of <em>local</em> transactions, one per service, where each step publishes an event that triggers the next. If a later step fails, the saga runs <strong>compensating actions</strong> to undo the earlier steps (e.g., cancel the reservation, refund the payment) — semantic rollbacks rather than a real transaction rollback.</p><p>Example — booking a trip across flight, hotel, and car services: reserve flight → reserve hotel → reserve car; if the car fails, compensate by cancelling the hotel and flight. You'd use a saga whenever a workflow spans services and needs all-or-nothing <em>business</em> semantics without a distributed transaction. Trade-offs: you accept eventual consistency (intermediate states are visible) and you must design idempotent steps and compensations carefully. I'd pair it with the <strong>outbox pattern</strong> to publish each step's event reliably.</p>`},

{cat:`Messaging & events`,d:`Easy`,q:`Message queue vs. event log — what's the difference?`,
a:`<p>A <strong>message queue</strong> (RabbitMQ, SQS) delivers each message to <em>one</em> consumer, which processes it once and the message is then removed. It's ideal for distributing tasks/work — one job, done once. An <strong>event log</strong> (Kafka) is an append-only, durable, <em>replayable</em> log; multiple independent consumer groups each read the whole stream at their own pace, and events are retained.</p><p>The practical difference: with a queue, once a task is consumed it's gone; with a log, you can add a new consumer that reprocesses all of history, or replay after fixing a bug. So I'd use a queue for "do this task" (send email, resize image) and a log for "broadcast that this happened" where many systems react and you may want to reprocess (event-driven architectures, feeding search indexes and warehouses via change data capture).</p>`},
{cat:`Messaging & events`,d:`Medium`,q:`How do you guarantee a message isn't lost or processed twice?`,
a:`<p>Perfect "exactly-once" delivery is effectively impossible across failures — a consumer can crash after processing but before acknowledging, forcing redelivery. So real systems provide <strong>at-least-once</strong> delivery (never lose a message, but duplicates can happen) and make consumers <strong>idempotent</strong> so processing a duplicate has no extra effect — giving "effectively once." Idempotency is typically achieved by having each message carry a unique ID and having the consumer dedupe on it (record processed IDs, or design the operation to be naturally idempotent).</p><p>To avoid <em>losing</em> messages, the producer side needs care too: the classic bug is updating your database and then publishing an event as two separate steps, where one can fail. The <strong>outbox pattern</strong> fixes it — write the state change and the event into an outbox table in one local transaction, and a relay reliably publishes from the outbox. I'd also mention dead-letter queues for messages that repeatedly fail, so poison messages don't block the pipeline.</p>`}
);
</script>
