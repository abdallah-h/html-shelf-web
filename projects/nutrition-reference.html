<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المرجع التعليمي في التغذية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/1761f18404c7.css" rel="stylesheet">
<style>
:root{
  --ink:#14201C; --ink-2:#38504A; --muted:#6D847C;
  --paper:#EBF0EC; --surface:#FFFFFF; --surface-2:#F5F8F5;
  --line:#D3DED6; --line-2:#BCCCC0;
  --accent:#1D6B58; --accent-soft:#DCEAE2; --accent-deep:#12463A;
  --warn:#9A6410; --warn-soft:#F6EBD6;
  --danger:#9E332C; --danger-soft:#F7E2DF;
  --ok:#2F6B34;
  --sans:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  --serif:'Amiri','Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --nav:320px;
  --r:10px;
  --hover:#FFFFFF; --head:rgba(235,240,236,.92); --th:#14201C; --th-fg:#EBF0EC;
  --code-bg:#14201C; --code-fg:#DCEAE2; --on-accent:#FFFFFF; --field:#FFFFFF; --rev:#FFFAF0;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16.5px;line-height:1.85;-webkit-text-size-adjust:100%}

/* ====== شريط النطاق المرجعي: العنصر المميز ====== */
.rangebar{position:relative;height:8px;border-radius:99px;background:
  linear-gradient(270deg,var(--danger-soft) 0 22%,var(--warn-soft) 22% 48%,var(--accent-soft) 48% 100%);
  overflow:hidden}
.rangebar i{position:absolute;top:-3px;width:3px;height:14px;background:var(--accent-deep);
  border-radius:2px;transition:right .5s cubic-bezier(.2,.8,.2,1)}

/* ====== الهيكل ====== */
header.top{position:sticky;top:0;z-index:50;background:var(--head);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1400px;margin:0 auto;padding:.55rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:nowrap}
.brand{font-family:var(--serif);font-size:1.28rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--accent);font-family:var(--sans);font-size:.68rem;font-weight:600;
  display:block;line-height:1;letter-spacing:.04em;margin-top:2px}
.tabs{display:flex;gap:.2rem;margin-inline-start:auto;flex:none}
.tab{border:1px solid transparent;background:none;font:inherit;font-size:.9rem;font-weight:500;
  color:var(--ink-2);padding:.4rem .85rem;border-radius:99px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
#burger{display:none;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;
  width:38px;height:34px;cursor:pointer;font-size:1.1rem;line-height:1}
.progwrap{max-width:1400px;margin:0 auto;padding:0 1rem .5rem}
.trackbar{position:relative;height:3px;border-radius:99px;background:var(--line)}
.trackbar i{position:absolute;top:-3px;height:9px;width:3px;border-radius:2px;
  background:var(--accent);transition:right .4s cubic-bezier(.2,.8,.2,1)}
.trackbar b{position:absolute;top:0;height:3px;right:0;background:var(--accent-soft);
  border-radius:99px;transition:width .4s}

.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:var(--nav) 1fr;gap:1.5rem;
  padding:1.25rem 1rem 5rem;align-items:start}

/* ====== التنقل ====== */
nav.side{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.85rem}
nav.side::-webkit-scrollbar{width:7px}
nav.side::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
.search{width:100%;font:inherit;font-size:.9rem;padding:.55rem .75rem;border:1px solid var(--line-2);
  border-radius:8px;background:var(--surface-2);margin-bottom:.6rem}
.search:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--hover)}
.navsec{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.09em;
  margin:.9rem .35rem .35rem;text-transform:uppercase}
.navlink{display:flex;gap:.55rem;align-items:baseline;padding:.42rem .55rem;border-radius:7px;
  color:var(--ink-2);text-decoration:none;font-size:.885rem;line-height:1.5;cursor:pointer;border:none;
  background:none;width:100%;text-align:right;font-family:inherit}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.navnum{font-family:var(--mono);font-size:.7rem;color:var(--muted);min-width:1.5rem;flex:none}
.navlink.on .navnum{color:var(--accent)}

/* ====== المحتوى ====== */
main{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:2rem clamp(1rem,3.5vw,2.6rem)}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--accent);
  text-transform:uppercase;margin-bottom:.4rem}
article{max-width:74ch}
article h1{font-family:var(--serif);font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.3;
  margin:.1rem 0 1.4rem;font-weight:700;letter-spacing:-.01em}
article h2{font-family:var(--serif);font-size:1.6rem;margin:2.6rem 0 .8rem;font-weight:700;
  padding-bottom:.4rem;border-bottom:2px solid var(--accent-soft)}
article h3{font-size:1.16rem;font-weight:700;margin:1.9rem 0 .55rem;color:var(--accent-deep)}
article h4{font-size:1rem;font-weight:700;margin:1.3rem 0 .4rem;color:var(--ink-2)}
article p{margin:.75rem 0}
article ul,article ol{margin:.7rem 0;padding-inline-start:1.35rem}
article li{margin:.34rem 0}
article strong{font-weight:600;color:var(--ink)}
article hr{border:none;border-top:1px solid var(--line);margin:2.2rem 0}
article code{font-family:var(--mono);font-size:.87em;background:var(--surface-2);
  border:1px solid var(--line);padding:.08em .38em;border-radius:5px;direction:ltr;display:inline-block}
pre.calc{font-family:var(--mono);font-size:.85rem;background:var(--code-bg);color:var(--code-fg);
  padding:1rem 1.1rem;border-radius:var(--r);overflow-x:auto;direction:ltr;text-align:left;line-height:1.75}
pre.calc code{background:none;border:none;color:inherit;padding:0}

blockquote{margin:1.1rem 0;padding:.85rem 1.1rem;border-radius:var(--r);
  border-inline-start:4px solid var(--accent);background:var(--accent-soft)}
blockquote.danger{border-color:var(--danger);background:var(--danger-soft)}
blockquote.model{border-color:var(--warn);background:var(--warn-soft)}
blockquote>*:first-child{margin-top:0}
blockquote>*:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto;margin:1.15rem 0;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.895rem;min-width:min(100%,480px)}
th{background:var(--th);color:var(--th-fg);font-weight:600;text-align:right;padding:.6rem .8rem;
  font-size:.83rem;white-space:nowrap}
td{unicode-bidi:plaintext;padding:.6rem .8rem;border-top:1px solid var(--line);vertical-align:top;line-height:1.65}
tbody tr:nth-child(even){background:var(--surface-2)}
td.warn{background:var(--warn-soft)}
td.no{background:var(--danger-soft)}
td.yes{background:var(--accent-soft)}
.mermaid{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:1rem;margin:1.2rem 0;overflow-x:auto;text-align:center;direction:ltr;
  font-family:var(--mono);font-size:.8rem;white-space:pre-wrap}

.pager{display:flex;justify-content:space-between;gap:.6rem;margin-top:2.5rem;
  padding-top:1.2rem;border-top:1px solid var(--line)}
.pbtn{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:.7rem .9rem;cursor:pointer;font:inherit;text-align:right;color:var(--ink-2);font-size:.85rem}
.pbtn:hover{border-color:var(--accent);color:var(--accent-deep)}
.pbtn b{display:block;font-size:.92rem;color:var(--ink);font-weight:600;margin-top:.12rem}
.pbtn[disabled]{opacity:.35;cursor:default}

/* ====== الاختبارات ====== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:.85rem;margin-top:1.2rem}
.bookcard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:1rem 1.1rem;cursor:pointer;text-align:right;font:inherit;transition:.15s}
.bookcard:hover{border-color:var(--accent);background:var(--hover);transform:translateY(-2px)}
.bookcard h4{margin:0 0 .3rem;font-size:1rem;color:var(--ink)}
.bookcard p{margin:0;font-size:.83rem;color:var(--muted);line-height:1.6}
.bookcard .n{font-family:var(--mono);font-size:.72rem;color:var(--accent);margin-top:.5rem;display:block}

.qhead{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;
  padding-bottom:.9rem;border-bottom:1px solid var(--line);margin-bottom:1.3rem}
.counter{font-family:var(--mono);font-size:.85rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.qtext{font-size:1.12rem;font-weight:600;line-height:1.75;margin:.4rem 0 1.1rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:right;font:inherit;font-size:.95rem;
  background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r);
  padding:.72rem .9rem;cursor:pointer;line-height:1.6;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--hover)}
.opt .k{font-family:var(--mono);font-size:.78rem;color:var(--muted);flex:none;
  border:1px solid var(--line-2);border-radius:5px;width:1.4rem;height:1.4rem;
  display:grid;place-items:center;margin-top:.15rem}
.opt.right{border-color:var(--ok);background:var(--accent-soft)}
.opt.right .k{background:var(--ok);color:var(--on-accent);border-color:var(--ok)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .k{background:var(--danger);color:var(--on-accent);border-color:var(--danger)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.opt:disabled .k{color:var(--muted)}
.opt.right:disabled .k,.opt.wrong:disabled .k{color:var(--on-accent);-webkit-text-fill-color:var(--on-accent)}
.explain{margin-top:1rem;padding:.85rem 1rem;background:var(--warn-soft);
  border-inline-start:4px solid var(--warn);border-radius:var(--r);font-size:.92rem;line-height:1.75}
.explain b{color:var(--warn)}
.qnav{display:flex;gap:.6rem;margin-top:1.5rem}
.btn{font:inherit;font-size:.92rem;font-weight:600;padding:.65rem 1.4rem;border-radius:99px;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:hover{background:var(--accent-deep)}
.btn.ghost{background:none;color:var(--accent-deep)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.4;cursor:default}

.result{text-align:center;padding:1.5rem 0}
.score{font-family:var(--serif);font-size:4rem;font-weight:700;line-height:1;color:var(--accent-deep)}
.verdict{font-size:1.05rem;font-weight:600;margin:.5rem 0 1.4rem}
.rangelabels{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:.7rem;color:var(--muted);margin-top:.4rem}
.review{margin-top:2rem;text-align:right}
.rev{padding:.75rem .9rem;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:.55rem;font-size:.9rem;background:var(--surface-2)}
.rev.bad{border-inline-start:4px solid var(--danger)}
.rev.good{border-inline-start:4px solid var(--ok)}
.rev p{margin:.3rem 0 0;font-size:.85rem;color:var(--ink-2)}


.ltr{unicode-bidi:isolate;direction:ltr;display:inline-block}
td.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent-deep)}

.revbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;
  background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);
  padding:.7rem 1rem;margin:0 0 1.6rem;font-size:.9rem}
.reveal{margin:.6rem 0 1.4rem}
.revbtn{font:inherit;font-size:.85rem;font-weight:600;color:var(--warn);background:var(--rev);margin-top:.5rem;
  border:1.5px dashed var(--warn);border-radius:var(--r);padding:.55rem .9rem;cursor:pointer;width:100%;text-align:right}
.revbtn:hover{background:var(--warn-soft)}
.hidbox.hid{display:none}
.hidbox{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--warn)}
.hidbox>*:first-child{margin-top:0}
.reveal blockquote{margin-top:.5rem}


.mealgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}
.flist{max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);padding:.4rem}
.fitem{display:grid;grid-template-columns:1fr auto;gap:0 .6rem;width:100%;text-align:right;font:inherit;
  background:none;border:none;border-bottom:1px solid var(--line);padding:.55rem .5rem;cursor:pointer}
.fitem:hover{background:var(--accent-soft)}
.fitem b{font-size:.92rem;font-weight:600}
.fitem span{grid-column:1;font-size:.78rem;color:var(--muted)}
.fitem i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:700;color:var(--accent);
  border:1px solid var(--accent);border-radius:6px;width:1.6rem;height:1.6rem;display:grid;place-items:center}
.mtab{font-size:.85rem;min-width:0}
.mtab td small{display:block;font-size:.72rem;color:var(--muted)}
.qty{white-space:nowrap}
.qty button{font:inherit;width:1.6rem;height:1.6rem;border:1px solid var(--line-2);background:var(--hover);border-radius:6px;cursor:pointer}
.qty span{display:inline-block;min-width:2rem;text-align:center;font-weight:600}
@media(max-width:980px){.mealgrid{grid-template-columns:1fr}.flist{max-height:300px}}

.card-table td:first-child{width:28%;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);white-space:nowrap}
.card-table tbody tr:nth-child(even){background:transparent}
.card-table td{border-top:1px solid var(--line)}
.card-table tr:first-child td{border-top:none}
@media(max-width:600px){.card-table td:first-child{white-space:normal;width:34%}}
.jump{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);
  padding:1.1rem 1.2rem;margin:1.2rem 0 1.8rem}
.jump p{margin:.3rem 0 .9rem;font-size:.95rem;line-height:1.8}
/* ====== الأدوات ====== */
.toolrow{display:flex;gap:.6rem;margin:1.2rem 0 .4rem;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.75rem;margin-bottom:1.4rem}
.fld{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;color:var(--ink-2);font-weight:500}
.fld input,.fld select{font:inherit;font-size:.95rem;color:var(--ink);padding:.55rem .7rem;
  border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);width:100%}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--hover)}
.resbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem}
.restab{width:100%;border-collapse:collapse;font-size:.93rem;min-width:0}
.restab th{background:none;color:var(--ink-2);font-weight:500;text-align:right;padding:.5rem .2rem;
  border-bottom:1px solid var(--line);white-space:normal;font-size:.9rem}
.restab td{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:600;text-align:left;padding:.5rem .2rem;
  border-top:none;border-bottom:1px solid var(--line);direction:rtl;unicode-bidi:plaintext}
.restab tr.hi td{color:var(--accent-deep)}
.restab tr.bad td{color:var(--danger)}
.restab tr.warnc td{color:var(--warn)}
.restab tr:last-child th,.restab tr:last-child td{border-bottom:none}
.calcwarn{margin-top:.8rem;padding:.7rem .9rem;background:var(--warn-soft);
  border-inline-start:4px solid var(--warn);border-radius:8px;font-size:.88rem;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.4rem}
.chip{font:inherit;font-size:.8rem;padding:.3rem .7rem;border-radius:99px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1rem;text-align:center;background:var(--surface-2);border:1.5px solid var(--line-2);
  border-radius:var(--r);padding:2rem 1.2rem;cursor:pointer;transition:.15s}
.flash:hover{border-color:var(--accent)}
.flash.open{background:var(--accent-soft);border-color:var(--accent)}
.fq{font-size:1.2rem;font-weight:600;line-height:1.7;max-width:46ch}
.fa{font-family:var(--sans);font-size:1.02rem;line-height:1.95;color:var(--accent-deep);
  max-width:52ch;border-top:1px solid var(--line-2);padding-top:1rem;unicode-bidi:plaintext}
.ftap{font-size:.8rem;color:var(--muted);letter-spacing:.05em}
.gitem{border:1px solid var(--line);border-radius:var(--r);padding:.7rem .9rem;margin-bottom:.5rem;
  background:var(--surface-2)}
.gitem b{font-family:var(--sans);font-size:.95rem;color:var(--accent-deep)}
.gtag{font-size:.7rem;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;
  padding:.05rem .5rem;margin-inline-start:.5rem}
.gitem p{margin:.3rem 0 0;font-size:.9rem;line-height:1.7;color:var(--ink-2)}

/* ====== البحث ====== */
.hit{display:block;width:100%;text-align:right;font:inherit;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r);padding:.75rem .9rem;margin-bottom:.55rem;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit b{display:block;font-size:.92rem;color:var(--accent-deep)}
.hit span{font-size:.83rem;color:var(--muted);display:block;margin-top:.15rem}
mark{background:var(--warn-soft);color:inherit;padding:0 .15em;border-radius:3px}

@media(max-width:980px){
  .shell{grid-template-columns:1fr;padding-top:.75rem}
  nav.side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:60;border-radius:0;
    max-height:100vh;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  html[dir=rtl] nav.side{inset:0 0 0 auto;transform:translateX(100%)}
  html nav.side.open,html[dir=rtl] nav.side.open{transform:translateX(0)}
  #burger{display:block}
  .brand span{display:none}
  .tab{padding:.35rem .55rem;font-size:.78rem}
  .brand{font-size:1rem;flex:1}
  .topin{padding:.5rem .7rem;gap:.4rem}
  .progwrap{padding:0 .7rem .4rem}
  .tablewrap{margin-inline:-.4rem}
  article h1{font-size:1.5rem}
  article h2{font-size:1.3rem}
  body{font-size:16px}
  .card{padding:1.4rem 1rem}
}
@media print{
  #theme,.copyrow,#backTools,.kbd{display:none!important}
  :root{--paper:#fff;--surface:#fff;--surface-2:#fff;--ink:#000}
  header.top,nav.side,.pager,.progwrap{display:none}
  .shell{display:block;padding:0}.card{border:none;padding:0}
  article{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.scrim{display:none}
.scrim.on{display:block;position:fixed;inset:0;background:rgba(20,32,28,.4);z-index:55}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E2EBE6; --ink-2:#B6C7BF; --muted:#869C92;
  --paper:#0E1513; --surface:#151F1B; --surface-2:#1B2823;
  --line:#28372F; --line-2:#3A4D44;
  --accent:#4DB08F; --accent-soft:#1B352C; --accent-deep:#8ED6BD;
  --warn:#E2A94C; --warn-soft:#352A15;
  --danger:#E8786F; --danger-soft:#3A1D1A; --ok:#6CC27B;
  --hover:#22312B; --head:rgba(14,21,19,.92); --th:#0A100D; --th-fg:#D5E2DB;
  --code-bg:#0A100D; --code-fg:#BFE3D3; --on-accent:#0B1210; --field:#22312B; --rev:#2A2214;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#E2EBE6; --ink-2:#B6C7BF; --muted:#869C92;

<script>var SECTIONS=[{"i": 0, "group": "guide", "tag": "مقدمة", "num": "—", "short": "الغلاف والفهرس", "html": "<h1>الدليل الشامل في التغذية</h1>\n<h3>تغذية عامة · تغذية رياضية · تغذية علاجية · تقييم الحالة الغذائية · إرشاد غذائي</h3>\n<h4>مع مراجعة تفصيلية لأهم المراجع العلمية + أمثلة تطبيقية + بنك أسئلة</h4>\n<hr>\n<h2>كيف تستخدم هذا الدليل؟</h2>\n<p>الدليل مكتوب بأسلوب \"علمي مبسّط\": كل مفهوم يُشرح أولًا بلغة عادية، ثم يُثبَّت بالرقم والمعادلة والدليل. وهو مقسّم إلى ستة أجزاء:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>الجزء</th><th>المحتوى</th><th>لمن؟</th></tr></thead><tbody><tr><td>الأول</td><td>أساسيات التغذية العامة</td><td>نقطة البداية للجميع</td></tr><tr><td>الثاني</td><td>تغذية الرياضيين</td><td>مدربون، أخصائيو أداء</td></tr><tr><td>الثالث</td><td>التغذية العلاجية</td><td>أخصائيو تغذية إكلينيكية، أطباء</td></tr><tr><td>الرابع</td><td>تقييم الحالة الغذائية</td><td>كل من يتعامل مع حالات</td></tr><tr><td>الخامس</td><td>الإرشاد الغذائي وتغيير السلوك</td><td>كل من يجلس أمام عميل</td></tr><tr><td>السادس</td><td>مراجعة تفصيلية لأفضل الكتب</td><td>لبناء مكتبتك ومسار قراءتك</td></tr></tbody></table></div>\n<p>ثم: <strong>أمثلة تطبيقية شاملة</strong> + <strong>بنك أسئلة</strong> (اختيار من متعدد، حسابات، حالات) + <strong>ملاحق جداول</strong>.</p>\n<h3>الفهرس</h3>\n<ol><li><strong>التغذية العامة</strong> — المرجعيات الغذائية · الطاقة والمعادلات · الكربوهيدرات · البروتين · الدهون · المغذيات الدقيقة · الماء · الأنماط الغذائية · قراءة البطاقة</li><li><strong>تغذية الرياضيين</strong> — أنظمة الطاقة · الكربوهيدرات · البروتين · الدهون · السوائل · المكملات · توافر الطاقة و RED-S · قطع الوزن · خطط نموذجية</li><li><strong>التغذية العلاجية</strong> — السكري · القلب والضغط والدهون · السمنة وجراحاتها · الكلى · الكبد · الجهاز الهضمي · النقرس وفقر الدم والرعاية الحرجة · تفاعلات الدواء والغذاء</li><li><strong>تقييم الحالة الغذائية</strong> — إطار ABCDEF · القياسات · التحاليل · العلامات الإكلينيكية · أدوات المسح و GLIM · حالة محلولة</li><li><strong>الإرشاد الغذائي</strong> — عملية الرعاية التغذوية و PES · نظريات السلوك · المقابلة التحفيزية · أهداف SMART · الأخلاقيات</li><li><strong>أفضل الكتب</strong> — 24 مرجعًا بالتفصيل + مسار قراءة 12 شهرًا + كيف تقرأ ورقة علمية</li><li><strong>دراسات حالة شاملة</strong> (5 حالات)</li><li><strong>بنك الأسئلة الأساسي</strong> — 40 اختيار من متعدد + حسابات + مقالية</li><li><strong>مراحل الحياة والصيام</strong> — الحمل · الرضاعة · الفطام · الأطفال والمراهقون · كبار السن · رمضان</li><li><strong>المطبخ العربي</strong> — جداول أطعمة · تقدير الحصص باليد · خطط وجبات جاهزة · استبدالات</li><li><strong>حالات إضافية</strong> — الغدة الدرقية · PCOS · الهشاشة · الحساسية وعدم التحمل · الميكروبيوم · سلامة الغذاء · سوء تغذية الأطفال</li><li><strong>نماذج عمل جاهزة</strong> — استمارة تقييم · توثيق ADIME · ورقة متابعة · قالب تقرير</li><li><strong>بنك الأسئلة الموسّع</strong> — بشرح <em>لماذا</em> كل خيار خاطئ</li><li><strong>الدعم التغذوي</strong> — خوارزمية القرار · التغذية المعوية (الطرق والتركيبات والمضاعفات) · التغذية الوريدية وحساباتها · متلازمة الأمعاء القصيرة</li><li><strong>فسيولوجيا الشهية والوزن</strong> — اللبتين والجريلين · التكيف الأيضي · أدوية GLP-1 والبروتوكول التغذوي معها · الاضطرابات الأيضية الوراثية</li><li><strong>اضطرابات الأكل</strong> — الأنواع · علامات الإنذار · مؤشرات الخطر الطبي · ما تفعله وما لا تفعله</li><li><strong>الدراسات المحورية</strong> — من مينيسوتا إلى DiRECT</li><li><strong>تفنيد الخرافات</strong> — 17 ادعاءً شائعًا + كيف تكشف الادعاء الزائف</li><li><strong>الممارسة المهنية</strong> — نطاق الممارسة · هيكل الجلسة · التغذية عن بُعد · أخلاقيات المحتوى · خطة 6 أسابيع</li><li><strong>سياقات رياضية إضافية</strong> — المراهق · الدورة الشهرية · الحرارة · الارتفاع · السفر · ذوو الإعاقة · النباتي</li><li><strong>الساعة البيولوجية</strong> — النوم وهرمونات الشهية · توقيت الوجبات · بروتوكول العاملين بالورديات</li><li><strong>التئام الجروح وقرح الفراش</strong> — المراحل والاحتياجات وعوامل التعطيل</li><li><strong>الصحة العامة</strong> — العبء المزدوج · الأمن الغذائي · التدعيم · السياسات</li><li><strong>الصحة النفسية والمناعة</strong> — محور الأمعاء-الدماغ · حدود ما يستطيعه الغذاء</li><li><strong>مخططات بصرية</strong> — مسارات الأيض · خوارزمية فقد الوزن · NCP · حلقة الدفاع عن الوزن</li><li><strong>خطة مذاكرة بالتكرار المتباعد</strong> — 40 بطاقة نواة + برنامج 8 أسابيع</li><li><strong>20 دراسة حالة متدرجة</strong> بثلاثة مستويات مع النماذج المرجعية</li><li><strong>نظام الامتحانات</strong> — ثلاثة امتحانات + بطاقة تقييم ذاتي<ul><li><strong>الملاحق</strong> — جداول التوصيات · التحويلات · علامات الإحالة · المصطلحات · المصادر · مسرد المختصرات · <strong>صفحة السلامة</strong></li></ul></li></ol>\n<blockquote class=\"note\"><p><strong>تنبيه مهني:</strong> هذا الدليل مادة تعليمية. لا يُستخدم لتشخيص أو علاج حالة فردية بعينها، ولا يغني عن متابعة أخصائي تغذية إكلينيكي مرخّص أو طبيب معالج، خصوصًا في الأمراض المزمنة والحمل والطفولة واضطرابات الأكل.</p></blockquote>\n<hr>", "text": "الدليل الشامل في التغذية تغذية عامة · تغذية رياضية · تغذية علاجية · تقييم الحالة الغذائية · إرشاد غذائي مع مراجعة تفصيلية لأهم المراجع العلمية + أمثلة تطبيقية + بنك أسئلة كيف تستخدم هذا الدليل؟ الدليل مكتوب بأسلوب \"علمي مبسّط\": كل مفهوم يُشرح أولًا بلغة عادية، ثم يُثبَّت بالرقم والمعادلة والدليل. وهو مقسّم إلى ستة أجزاء: الجزء المحتوى لمن؟ الأول أساسيات التغذية العامة نقطة البداية للجميع الثاني تغذية الرياضيين مدربون، أخصائيو أداء الثالث التغذية العلاجية أخصائيو تغذية إكلينيكية، أطباء الرابع تقييم الحالة الغذائية كل من يتعامل مع حالات الخامس الإرشاد الغذائي وتغيير السلوك كل من يجلس أمام عميل السادس مراجعة تفصيلية لأفضل الكتب لبناء مكتبتك ومسار قراءتك ثم: أمثلة تطبيقية شاملة + بنك أسئلة (اختيار من متعدد، حسابات، حالات) + ملاحق جداول . الفهرس 1. التغذية العامة — المرجعيات الغذائية · الطاقة والمعادلات · الكربوهيدرات · البروتين · الدهون · المغذيات الدقيقة · الماء · الأنماط الغذائية · قراءة البطاقة 2. تغذية الرياضيين — أنظمة الطاقة · الكربوهيدرات · البروتين · الدهون · السوائل · المكملات · توافر الطاقة و RED S · قطع الوزن · خطط نموذجية 3. التغذية العلاجية — السكري · القلب والضغط والدهون · السمنة وجراحاتها · الكلى · الكبد · الجهاز الهضمي · النقرس وفقر الدم والرعاية الحرجة · تفاعلات الدواء والغذاء 4. تقييم الحالة الغذائية — إطار ABCDEF · القياسات · التحاليل · العلامات الإكلينيكية · أدوات المسح و GLIM · حالة محلولة 5. الإرشاد الغذائي — عملية الرعاية التغذوية و PES · نظريات السلوك · المقابلة التحفيزية · أهداف SMART · الأخلاقيات 6. أفضل الكتب — 24 مرجعًا بالتفصيل + مسار قراءة 12 شهرًا + كيف تقرأ ورقة علمية 7. دراسات حالة شاملة (5 حالات) 8. بنك الأسئلة الأساسي — 40 اختيار من متعدد + حسابات + مقالية 9. مراحل الحياة والصيام — الحمل · الرضاعة · الفطام · الأطفال والمراهقون · كبار السن · رمضان 10. المطبخ العربي — جداول أطعمة · تقدير الحصص باليد · خطط وجبات جاهزة · استبدالات 11. حالات إضافية — الغدة الدرقية · PCOS · الهشاشة · الحساسية وعدم التحمل · الميكروبيوم · سلامة الغذاء · سوء تغذية الأطفال 12. نماذج عمل جاهزة — استمارة تقييم · توثيق ADIME · ورقة متابعة · قالب تقرير 13. بنك الأسئلة الموسّع — بشرح لماذا كل خيار خاطئ 14. الدعم التغذوي — خوارزمية القرار · التغذية المعوية (الطرق والتركيبات والمضاعفات) · التغذية الوريدية وحساباتها · متلازمة الأمعاء القصيرة 15. فسيولوجيا الشهية والوزن — اللبتين والجريلين · التكيف الأيضي · أدوية GLP 1 والبروتوكول التغذوي معها · الاضطرابات الأيضية الوراثية 16. اضطرابات الأكل — الأنواع · علامات الإنذار · مؤشرات الخطر الطبي · ما تفعله وما لا تفعله 17. الدراسات المحورية — من مينيسوتا إلى DiRECT 18. تفنيد الخرافات — 17 ادعاءً شائعًا + كيف تكشف الادعاء الزائف 19. الممارسة المهنية — نطاق الممارسة · هيكل الجلسة · التغذية عن بُعد · أخلاقيات المحتوى · خطة 6 أسابيع 20. سياقات رياضية إضافية — المراهق · الدورة الشهرية · الحرارة · الارتفاع · السفر · ذوو الإعاقة · النباتي 21. الساعة البيولوجية — النوم وهرمونات الشهية · توقيت الوجبات · بروتوكول العاملين بالورديات 22. التئام الجروح وقرح الفراش — المراحل والاحتياجات وعوامل التعطيل 23. الصحة العامة — العبء المزدوج · الأمن الغذائي · التدعيم · السياسات 24. الصحة النفسية والمناعة — محور الأمعاء الدماغ · حدود ما يستطيعه الغذاء 25. مخططات بصرية — مسارات الأيض · خوارزمية فقد الوزن · NCP · حلقة الدفاع عن الوزن 26. خطة مذاكرة بالتكرار المتباعد — 40 بطاقة نواة + برنامج 8 أسابيع 27. 20 دراسة حالة متدرجة بثلاثة مستويات مع النماذج المرجعية 28. نظام الامتحانات — ثلاثة امتحانات + بطاقة تقييم ذاتي الملاحق — جداول التوصيات · التحويلات · علامات الإحالة · المصطلحات · المصادر · مسرد المختصرات · صفحة السلامة تنبيه مهني: هذا الدليل مادة تعليمية. لا يُستخدم لتشخيص أو علاج حالة فردية بعينها، ولا يغني عن متابعة أخصائي تغذية إكلينيكي مرخّص أو طبيب معالج، خصوصًا في الأمراض المزمنة والحمل والطفولة واضطرابات الأكل."}, {"i": 1, "group": "guide", "tag": "أساسيات", "num": "1", "short": "أساسيات التغذية العامة", "html": "<h1>الجزء الأول: أساسيات التغذية العامة</h1>\n<h2>1.1 ما هي التغذية؟ الإطار الكبير</h2>\n<p>التغذية علم يدرس كيف يحصل الجسم على المادة والطاقة من الغذاء، وكيف يحوّلها ويستخدمها ويخزّنها ويتخلص من فضلاتها. أربع كلمات تلخّص المسار:</p>\n<p><strong>الهضم ← الامتصاص ← الأيض (التمثيل الغذائي) ← الإخراج</strong></p>\n<p>وتنقسم مكونات الغذاء إلى:</p>\n<ul><li><strong>مغذيات كبرى (Macronutrients):</strong> كربوهيدرات، بروتين، دهون — تعطي طاقة، ونحتاجها بالجرامات.</li><li><strong>مغذيات دقيقة (Micronutrients):</strong> فيتامينات ومعادن — لا تعطي طاقة، ونحتاجها بالملليجرامات والميكروجرامات، لكنها تُشغِّل الإنزيمات التي تحرق الطاقة.</li><li><strong>الماء</strong> — المذيب والوسط الذي يحدث فيه كل شيء.</li><li><strong>الألياف والمركبات النباتية النشطة (Phytochemicals)</strong> — لا تُصنَّف كمغذيات أساسية لكن أثرها الصحي ضخم.</li></ul>\n<h3>مصطلحات المرجعيات الغذائية (DRIs) — لا تخلط بينها</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المصطلح</th><th>المعنى العملي</th></tr></thead><tbody><tr><td><strong>EAR</strong> (المتوسط التقديري للاحتياج)</td><td>الكمية التي تكفي 50% من الأفراد — تُستخدم لتقييم <em>المجموعات</em></td></tr><tr><td><strong>RDA</strong> (المقرر الغذائي الموصى به)</td><td>الكمية التي تكفي 97–98% من الأصحاء — هدف <em>الفرد</em></td></tr><tr><td><strong>AI</strong> (المدخول الكافي)</td><td>يُستخدم حين لا تكفي الأدلة لحساب RDA</td></tr><tr><td><strong>UL</strong> (الحد الأعلى المأمون)</td><td>الحد الذي فوقه يزيد خطر السُّمية</td></tr><tr><td><strong>AMDR</strong> (النطاق المقبول لتوزيع المغذيات)</td><td>كربوهيدرات 45–65% · دهون 20–35% · بروتين 10–35% من الطاقة</td></tr></tbody></table></div>\n<p><strong>خطأ شائع:</strong> استخدام RDA لتقييم فرد والحكم بأنه \"ناقص\". RDA هدف تخطيطي، والحكم بالنقص يحتاج تقييمًا متعدد المحاور (سنشرحه في الجزء الرابع).</p>\n<hr>\n<h2>1.2 الطاقة: العملة الأساسية</h2>\n<h3>القيم الحرارية (عوامل Atwater)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المكوّن</th><th>سعر حراري/جرام</th></tr></thead><tbody><tr><td>كربوهيدرات</td><td>4</td></tr><tr><td>بروتين</td><td>4</td></tr><tr><td>دهون</td><td>9</td></tr><tr><td>كحول</td><td>7</td></tr><tr><td>ألياف (تخمّر قولوني)</td><td>~2</td></tr></tbody></table></div>\n<h3>مكونات إنفاق الطاقة اليومي (TDEE)</h3>\n<ol><li><strong>BMR/RMR — معدل الأيض الأساسي (60–75%)</strong>: طاقة البقاء على قيد الحياة. أكبر محدد له هو <strong>الكتلة الخالية من الدهون (FFM)</strong>.</li><li><strong>TEF — الأثر الحراري للطعام (~10%)</strong>: طاقة الهضم. البروتين الأعلى (20–30% من سعراته)، الكربوهيدرات (5–10%)، الدهون (0–3%).</li><li><strong>EAT — طاقة التمرين المقصود</strong> (متغيرة جدًا).</li><li><strong>NEAT — النشاط غير الرياضي</strong> (مشي، وقوف، حركة عفوية): أكثر مكوّن يتغيّر بين الأفراد، وقد يفرق مئات السعرات يوميًا. وهو السبب الرئيسي في \"ثبات الوزن\" أثناء الرجيم؛ الجسم يقلل حركته العفوية تلقائيًا.</li></ol>\n<h3>معادلات تقدير BMR</h3>\n<p><strong>Mifflin-St Jeor</strong> (الأدق للعموم، والموصى بها في المراجع الإكلينيكية):</p>\n<pre class=\"calc\"><code>رجال:  BMR = (10 × الوزن كجم) + (6.25 × الطول سم) − (5 × العمر) + 5\nنساء:  BMR = (10 × الوزن كجم) + (6.25 × الطول سم) − (5 × العمر) − 161</code></pre>\n<p><strong>Katch-McArdle</strong> (الأفضل لمن نعرف نسبة دهونه — رياضيون):</p>\n<pre class=\"calc\"><code>BMR = 370 + (21.6 × الكتلة الخالية من الدهون بالكجم)</code></pre>\n<p><strong>Harris-Benedict</strong> (قديمة، تميل للمبالغة ~5%).</p>\n<p>ثم: <code>TDEE = BMR × معامل النشاط</code></p>\n<div class=\"tablewrap\"><table><thead><tr><th>النشاط</th><th>المعامل</th></tr></thead><tbody><tr><td>خامل (مكتبي، بدون تمرين)</td><td>1.2</td></tr><tr><td>خفيف (1–3 أيام/أسبوع)</td><td>1.375</td></tr><tr><td>متوسط (3–5 أيام)</td><td>1.55</td></tr><tr><td>عالٍ (6–7 أيام)</td><td>1.725</td></tr><tr><td>عالٍ جدًا (عمل بدني + تمرين مزدوج)</td><td>1.9</td></tr></tbody></table></div>\n<blockquote class=\"note\"><p><strong>القاعدة الذهبية:</strong> المعادلة نقطة بداية وليست حقيقة. الدليل الحقيقي هو <strong>متابعة الوزن ومحيط الخصر أسبوعيًا لمدة 2–3 أسابيع</strong> ثم التعديل بـ 10–15%.</p></blockquote>\n<h3>مثال محسوب (1)</h3>\n<blockquote class=\"note\"><p>رجل، 30 سنة، 85 كجم، 178 سم، يتمرن 4 أيام/أسبوع، يريد إنقاص الدهون.</p></blockquote>\n<ul><li>BMR = (10×85) + (6.25×178) − (5×30) + 5 = 850 + 1112.5 − 150 + 5 = <strong>1817.5 kcal</strong></li><li>TDEE = 1817.5 × 1.55 ≈ <strong>2817 kcal</strong></li><li>عجز 20% ≈ 560 kcal → الهدف ≈ <strong>2250 kcal/يوم</strong> (متوقع فقد ~0.5 كجم/أسبوع)</li><li>بروتين 1.8 جم/كجم = 153 جم (612 kcal)</li><li>دهون 0.8 جم/كجم = 68 جم (612 kcal)</li><li>كربوهيدرات = (2250 − 1224) ÷ 4 ≈ <strong>256 جم</strong></li></ul>\n<hr>\n<h2>1.3 الكربوهيدرات</h2>\n<h3>التصنيف</h3>\n<ul><li><strong>بسيطة:</strong> أحادية (جلوكوز، فركتوز، جلاكتوز) وثنائية (سكروز، لاكتوز، مالتوز).</li><li><strong>معقدة:</strong> نشا (أميلوز/أميلوبكتين)، جليكوجين (مخزون حيواني)، ألياف.</li></ul>\n<h3>الوظائف</h3>\n<p>وقود مفضّل للمخ (~120 جم جلوكوز/يوم) وكرات الدم الحمراء، وقود التمارين عالية الشدة، \"موفّر للبروتين\" (Protein-sparing)، وضروري لأكسدة الدهون بكفاءة (\"الدهون تحترق في لهيب الكربوهيدرات\").</p>\n<h3>المؤشر الجلايسيمي (GI) والحمل الجلايسيمي (GL)</h3>\n<ul><li><strong>GI:</strong> سرعة رفع السكر مقارنة بمرجع (جلوكوز = 100). منخفض <span class=\"ltr\">≤55</span>، متوسط 56–69، مرتفع <span class=\"ltr\">≥70.</span></li><li><strong>GL = (GI × جرامات الكربوهيدرات المتاحة) ÷ 100</strong> — وهو الأهم عمليًا لأنه يحسب <em>الكمية</em> أيضًا.</li></ul>\n<p>مثال: البطيخ GI مرتفع (~72) لكن الحصة تحتوي كربوهيدرات قليلة → GL ≈ 5 فقط. لذلك \"البطيخ ممنوع للسكري\" معلومة خاطئة بالحجم المعتدل.</p>\n<h3>الألياف</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>النوع</th><th>أمثلة</th><th>الأثر</th></tr></thead><tbody><tr><td>ذائبة/لزجة</td><td>شوفان (بيتا جلوكان)، بقوليات، تفاح (بكتين)، سيليوم</td><td>تخفض LDL والسكر بعد الأكل، تُبطئ إفراغ المعدة</td></tr><tr><td>غير ذائبة</td><td>نخالة القمح، قشور الخضار</td><td>تزيد حجم البراز وتسرّع العبور</td></tr><tr><td><strong>مقاومة/بريبايوتك</strong></td><td>نشا مقاوم، إينولين</td><td>غذاء لبكتيريا القولون → أحماض دهنية قصيرة السلسلة (بيوتيرات)</td></tr></tbody></table></div>\n<p><strong>التوصية:</strong> 25–38 جم/يوم (أو 14 جم لكل 1000 kcal). الزيادة تدريجية مع ماء كافٍ، وإلا انتفاخ.</p>\n<hr>\n<h2>1.4 البروتين</h2>\n<h3>الأساسيات</h3>\n<p>20 حمضًا أمينيًا، منها <strong>9 أساسية</strong> (لا يصنّعها الجسم): هستيدين، أيزوليوسين، ليوسين، ليسين، ميثيونين، فينيل ألانين، ثريونين، تريبتوفان، فالين.</p>\n<h3>تقييم الجودة</h3>\n<ul><li><strong>PDCAAS</strong>: نظام قديم سقفه 1.0 (بروتين اللبن، البيض، الصويا = 1.0).</li><li><strong>DIAAS</strong>: النظام الأحدث والأدق (يقيس الهضم في نهاية اللفائفي، ويسمح بقيم &gt;1.0). بروتين الحليب ≈ 1.18، البيض ≈ 1.13، القمح ≈ 0.45.</li></ul>\n<h3>الاحتياج</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الفئة</th><th>جم/كجم/يوم</th></tr></thead><tbody><tr><td>RDA للحد الأدنى (منع النقص)</td><td>0.8</td></tr><tr><td>بالغ نشط/صحة عامة</td><td>1.0–1.4</td></tr><tr><td>رياضي قوة</td><td>1.6–2.2</td></tr><tr><td>أثناء عجز حراري شديد + حفاظ على العضل</td><td>2.2–2.7</td></tr><tr><td>كبار السن (مقاومة الابتناء)</td><td>1.0–1.5</td></tr><tr><td>مرض حاد/حروق</td><td>1.5–2.0+</td></tr><tr><td>فشل كلوي مزمن (بدون غسيل)</td><td>0.6–0.8 (بإشراف)</td></tr></tbody></table></div>\n<p><strong>مفاهيم مهمة:</strong></p>\n<ul><li><strong>عتبة الليوسين:</strong> ~2.5–3 جم ليوسين في الوجبة (≈ 25–30 جم بروتين عالي الجودة) لتحفيز أقصى لبناء البروتين العضلي (MPS).</li><li><strong>الظاهرة العضلية الكاملة (Muscle-full effect):</strong> الزيادة فوق الحد لا تزيد التحفيز خطيًا — لذلك التوزيع على 3–5 وجبات أفضل من وجبة عملاقة.</li><li><strong>أسطورة:</strong> \"البروتين العالي يضر الكلى السليمة\" — لا يوجد دليل قوي على ذلك في الأصحاء. الحذر مطلوب فقط مع مرض كلوي قائم.</li></ul>\n<hr>\n<h2>1.5 الدهون</h2>\n<h3>التصنيف</h3>\n<ul><li><strong>مشبعة (SFA):</strong> حيوانية، زيت جوز الهند والنخيل. توصية: &lt;10% من الطاقة (&lt;7% مع خطر قلبي).</li><li><strong>أحادية غير مشبعة (MUFA):</strong> زيت زيتون، أفوكادو، مكسرات — نجم النمط المتوسطي.</li><li><strong>متعددة غير مشبعة (PUFA):</strong><ul><li><strong>أوميجا-6 (لينوليك)</strong> — أساسي؛ زيوت نباتية.</li><li><strong>أوميجا-3 (ألفا-لينولينيك ALA)</strong> — أساسي؛ كتان، جوز، شيا. تحويله إلى <strong>EPA/DHA</strong> ضعيف جدًا (&lt;5–10%)، لذلك الأسماك الدهنية 2 مرات/أسبوع أو مكمل.</li></ul></li><li><strong>متحولة (Trans):</strong> صناعية → يجب أن تقترب من الصفر (ترفع LDL وتخفض HDL معًا).</li></ul>\n<h3>الكوليسترول الغذائي</h3>\n<p>لم يعد الشغل الشاغل؛ التأثير الأكبر على LDL يأتي من <strong>الدهون المشبعة والمتحولة</strong>، لكن هناك أفرادًا \"مستجيبين مفرطين (Hyper-responders)\".</p>\n<hr>\n<h2>1.6 المغذيات الدقيقة — جدول عملي</h2>\n<h3>فيتامينات ذائبة في الدهون</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الفيتامين</th><th>الوظيفة</th><th>مصادر</th><th>علامة النقص</th><th>ملاحظة سمّية</th></tr></thead><tbody><tr><td>A (ريتينول)</td><td>الإبصار، المناعة، الظهارة</td><td>كبد، جزر (بيتاكاروتين)</td><td>العشى الليلي، جفاف الملتحمة</td><td>سمّية كبدية ومشوّه للجنين بجرعات عالية</td></tr><tr><td>D</td><td>امتصاص الكالسيوم، المناعة</td><td>شمس، أسماك دهنية، مدعّم</td><td>كساح/لين العظام، آلام عضلية</td><td>UL 4000 IU؛ فرط كالسيوم</td></tr><tr><td>E</td><td>مضاد أكسدة غشائي</td><td>زيوت، مكسرات</td><td>انحلال دم، اعتلال أعصاب (نادر)</td><td>تعارض مع مضادات التخثر</td></tr><tr><td>K</td><td>تخثر الدم، أوستيوكالسين</td><td>خضار ورقية (K1)، مخمرات (K2)</td><td>نزيف</td><td>يتعارض مع الوارفارين → <strong>ثبات المدخول</strong> لا منعه</td></tr></tbody></table></div>\n<h3>فيتامينات ذائبة في الماء (مختارات)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الفيتامين</th><th>الدور</th><th>النقص</th></tr></thead><tbody><tr><td>B1 ثيامين</td><td>أيض الكربوهيدرات (بيروفات ديهيدروجينيز)</td><td>بري بري، اعتلال فيرنيكه (كحوليون، متلازمة إعادة التغذية)</td></tr><tr><td>B2/B3</td><td>نواقل إلكترون FAD/NAD</td><td>التهاب الفم / البلاجرا (الإسهال، الجلد، الخرف)</td></tr><tr><td>B6</td><td>نقل مجموعة أمين، تصنيع الهيم</td><td>فقر دم، اعتلال أعصاب (وأيضًا من الجرعة الزائدة!)</td></tr><tr><td>B9 فولات</td><td>تصنيع DNA</td><td>فقر دم ضخم الأرومات، عيوب الأنبوب العصبي</td></tr><tr><td>B12 كوبالامين</td><td>ميثيونين سينثيز، غمد الميالين</td><td>فقر دم + أعراض عصبية؛ خطر عالٍ في النباتيين، الميتفورمين، مثبطات مضخة البروتون، جراحات المعدة</td></tr><tr><td>C</td><td>تصنيع الكولاجين، امتصاص الحديد غير الهيمي</td><td>الإسقربوط، ضعف التئام الجروح</td></tr></tbody></table></div>\n<h3>معادن أساسية</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المعدن</th><th>ملاحظات عملية</th></tr></thead><tbody><tr><td><strong>حديد</strong></td><td>هيمي (حيواني، امتصاص 15–35%) مقابل غير هيمي (نباتي، 2–20%). المعزِّز: فيتامين C. المثبِّط: فيتات، تانينات الشاي، كالسيوم.</td></tr><tr><td><strong>كالسيوم</strong></td><td>1000–1200 مجم/يوم؛ الامتصاص يحتاج فيتامين D؛ جرعات مقسّمة <span class=\"ltr\">≤500</span> مجم.</td></tr><tr><td><strong>زنك</strong></td><td>المناعة والتئام الجروح؛ الجرعات العالية المزمنة تسبب نقص نحاس.</td></tr><tr><td><strong>صوديوم</strong></td><td>&lt;2000 مجم/يوم (≈5 جم ملح)؛ 70–80% منه من الأطعمة المصنّعة لا من مملحة المائدة.</td></tr><tr><td><strong>بوتاسيوم</strong></td><td>3500–4700 مجم/يوم؛ خافض للضغط — <strong>لكن يُقيَّد بشدة في الفشل الكلوي</strong>.</td></tr><tr><td><strong>يود</strong></td><td>الغدة الدرقية؛ الملح المدعّم.</td></tr><tr><td><strong>سيلينيوم</strong></td><td>ديودينيز، جلوتاثيون بيروكسيداز؛ نافذة الأمان ضيقة.</td></tr></tbody></table></div>\n<hr>\n<h2>1.7 الماء والسوائل</h2>\n<ul><li>الاحتياج التقريبي: <strong>30–35 مل/كجم/يوم</strong> للبالغ (أو 1 مل لكل kcal)، ويزيد مع الحرارة، الحمى (+10–15% لكل درجة)، الإسهال، الرياضة.</li><li><strong>دليل الترطيب الأسهل:</strong> لون البول (فاتح كالقش = جيد) + عدم الشعور بالعطش المستمر + وزن صباحي ثابت.</li></ul>\n<hr>\n<h2>1.8 الأنماط الغذائية المدعومة بالأدلة</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>النمط</th><th>الفكرة</th><th>أقوى دليل</th></tr></thead><tbody><tr><td><strong>المتوسطي</strong></td><td>زيت زيتون، خضار، بقول، أسماك، مكسرات، حبوب كاملة، لحوم حمراء قليلة</td><td>تقليل أحداث القلب والأوعية (دراسة PREDIMED)</td></tr><tr><td><strong>DASH</strong></td><td>نفس الأساس + منتجات ألبان قليلة الدسم + تقييد صوديوم</td><td>خفض ضغط الدم بفعالية موثقة</td></tr><tr><td><strong>النباتي/النباتي الصرف</strong></td><td>كثافة ألياف عالية</td><td>تحسين الدهون والوزن — بشرط تعويض B12، حديد، زنك، أوميجا-3، كالسيوم</td></tr><tr><td><strong>منخفض الكربوهيدرات</strong></td><td>تحكم أسرع في السكر والدهون الثلاثية</td><td>فعّال، والالتزام طويل المدى هو التحدي</td></tr><tr><td><strong>الصيام المتقطع</strong></td><td>أداة لتقليل الطاقة</td><td>نتائجه ≈ العجز الحراري المكافئ؛ ليس سحرًا</td></tr></tbody></table></div>\n<blockquote class=\"note\"><p><strong>الخلاصة الصادقة:</strong> لا يوجد نمط واحد \"الأفضل\". الأفضل هو النمط الذي: (1) يحقق التوازن الحراري المطلوب، (2) يوفّر البروتين والمغذيات الدقيقة، (3) <strong>يستطيع الشخص الالتزام به سنوات</strong>. الالتزام هو المتغير الأقوى في كل الدراسات المقارِنة.</p></blockquote>\n<hr>\n<h2>1.9 قراءة البطاقة الغذائية — مهارة عملية</h2>\n<ol><li><strong>ابدأ بحجم الحصة</strong> — كل الأرقام تُقاس عليه، وأشهر خدعة تسويقية هي تصغير الحصة.</li><li><strong>قارن لكل 100 جم</strong> بين المنتجات، لا لكل عبوة.</li><li><strong>السكريات المضافة</strong> غير \"إجمالي السكريات\" (الذي يشمل سكر الحليب والفاكهة الطبيعي).</li><li><strong>قائمة المكونات مرتّبة تنازليًا بالوزن</strong> — إذا كان السكر ضمن أول ثلاثة مكونات، انتبه. وابحث عن أسماءه المتعددة (شراب جلوكوز، دكستروز، مالتودكسترين، شراب ذرة عالي الفركتوز، عصير قصب مبخّر).</li><li><strong>\"خالٍ من الدهون\" ≠ قليل السعرات</strong>، و<strong>\"طبيعي\" ادعاء غير منظّم</strong> في أغلب الأسواق.</li></ol>\n<hr>", "text": "الجزء الأول: أساسيات التغذية العامة 1.1 ما هي التغذية؟ الإطار الكبير التغذية علم يدرس كيف يحصل الجسم على المادة والطاقة من الغذاء، وكيف يحوّلها ويستخدمها ويخزّنها ويتخلص من فضلاتها. أربع كلمات تلخّص المسار: الهضم ← الامتصاص ← الأيض (التمثيل الغذائي) ← الإخراج وتنقسم مكونات الغذاء إلى: مغذيات كبرى (Macronutrients): كربوهيدرات، بروتين، دهون — تعطي طاقة، ونحتاجها بالجرامات. مغذيات دقيقة (Micronutrients): فيتامينات ومعادن — لا تعطي طاقة، ونحتاجها بالملليجرامات والميكروجرامات، لكنها تُشغِّل الإنزيمات التي تحرق الطاقة. الماء — المذيب والوسط الذي يحدث فيه كل شيء. الألياف والمركبات النباتية النشطة (Phytochemicals) — لا تُصنَّف كمغذيات أساسية لكن أثرها الصحي ضخم. مصطلحات المرجعيات الغذائية (DRIs) — لا تخلط بينها المصطلح المعنى العملي EAR (المتوسط التقديري للاحتياج) الكمية التي تكفي 50% من الأفراد — تُستخدم لتقييم المجموعات RDA (المقرر الغذائي الموصى به) الكمية التي تكفي 97–98% من الأصحاء — هدف الفرد AI (المدخول الكافي) يُستخدم حين لا تكفي الأدلة لحساب RDA UL (الحد الأعلى المأمون) الحد الذي فوقه يزيد خطر السُّمية AMDR (النطاق المقبول لتوزيع المغذيات) كربوهيدرات 45–65% · دهون 20–35% · بروتين 10–35% من الطاقة خطأ شائع: استخدام RDA لتقييم فرد والحكم بأنه \"ناقص\". RDA هدف تخطيطي، والحكم بالنقص يحتاج تقييمًا متعدد المحاور (سنشرحه في الجزء الرابع). 1.2 الطاقة: العملة الأساسية القيم الحرارية (عوامل Atwater) المكوّن سعر حراري/جرام كربوهيدرات 4 بروتين 4 دهون 9 كحول 7 ألياف (تخمّر قولوني) ~2 مكونات إنفاق الطاقة اليومي (TDEE) 1. BMR/RMR — معدل الأيض الأساسي (60–75%) : طاقة البقاء على قيد الحياة. أكبر محدد له هو الكتلة الخالية من الدهون (FFM) . 2. TEF — الأثر الحراري للطعام (~10%) : طاقة الهضم. البروتين الأعلى (20–30% من سعراته)، الكربوهيدرات (5–10%)، الدهون (0–3%). 3. EAT — طاقة التمرين المقصود (متغيرة جدًا). 4. NEAT — النشاط غير الرياضي (مشي، وقوف، حركة عفوية): أكثر مكوّن يتغيّر بين الأفراد، وقد يفرق مئات السعرات يوميًا. وهو السبب الرئيسي في \"ثبات الوزن\" أثناء الرجيم؛ الجسم يقلل حركته العفوية تلقائيًا. معادلات تقدير BMR Mifflin St Jeor (الأدق للعموم، والموصى بها في المراجع الإكلينيكية): رجال: BMR = (10 × الوزن كجم) + (6.25 × الطول سم) − (5 × العمر) + 5 نساء: BMR = (10 × الوزن كجم) + (6.25 × الطول سم) − (5 × العمر) − 161 Katch McArdle (الأفضل لمن نعرف نسبة دهونه — رياضيون): BMR = 370 + (21.6 × الكتلة الخالية من الدهون بالكجم) Harris Benedict (قديمة، تميل للمبالغة ~5%). ثم: TDEE = BMR × معامل النشاط النشاط المعامل خامل (مكتبي، بدون تمرين) 1.2 خفيف (1–3 أيام/أسبوع) 1.375 متوسط (3–5 أيام) 1.55 عالٍ (6–7 أيام) 1.725 عالٍ جدًا (عمل بدني + تمرين مزدوج) 1.9 القاعدة الذهبية: المعادلة نقطة بداية وليست حقيقة. الدليل الحقيقي هو متابعة الوزن ومحيط الخصر أسبوعيًا لمدة 2–3 أسابيع ثم التعديل بـ 10–15%. مثال محسوب (1) رجل، 30 سنة، 85 كجم، 178 سم، يتمرن 4 أيام/أسبوع، يريد إنقاص الدهون. BMR = (10×85) + (6.25×178) − (5×30) + 5 = 850 + 1112.5 − 150 + 5 = 1817.5 kcal TDEE = 1817.5 × 1.55 ≈ 2817 kcal عجز 20% ≈ 560 kcal → الهدف ≈ 2250 kcal/يوم (متوقع فقد ~0.5 كجم/أسبوع) بروتين 1.8 جم/كجم = 153 جم (612 kcal) دهون 0.8 جم/كجم = 68 جم (612 kcal) كربوهيدرات = (2250 − 1224) ÷ 4 ≈ 256 جم 1.3 الكربوهيدرات التصنيف بسيطة: أحادية (جلوكوز، فركتوز، جلاكتوز) وثنائية (سكروز، لاكتوز، مالتوز). معقدة: نشا (أميلوز/أميلوبكتين)، جليكوجين (مخزون حيواني)، ألياف. الوظائف وقود مفضّل للمخ (~120 جم جلوكوز/يوم) وكرات الدم الحمراء، وقود التمارين عالية الشدة، \"موفّر للبروتين\" (Protein sparing)، وضروري لأكسدة الدهون بكفاءة (\"الدهون تحترق في لهيب الكربوهيدرات\"). المؤشر الجلايسيمي (GI) والحمل الجلايسيمي (GL) GI: سرعة رفع السكر مقارنة بمرجع (جلوكوز = 100). منخفض ≤55، متوسط 56–69، مرتفع ≥70. GL = (GI × جرامات الكربوهيدرات المتاحة) ÷ 100 — وهو الأهم عمليًا لأنه يحسب الكمية أيضًا. مثال: البطيخ GI مرتفع (~72) لكن الحصة تحتوي كربوهيدرات قليلة → GL ≈ 5 فقط. لذلك \"البطيخ ممنوع للسكري\" معلومة خاطئة بالحجم المعتدل. الألياف النوع أمثلة الأثر ذائبة/لزجة شوفان (بيتا جلوكان)، بقوليات، تفاح (بكتين)، سيليوم تخفض LDL والسكر بعد الأكل، تُبطئ إفراغ المعدة غير ذائبة نخالة القمح، قشور الخضار تزيد حجم البراز وتسرّع العبور مقاومة/بريبايوتك نشا مقاوم، إينولين غذاء لبكتيريا القولون → أحماض دهنية قصيرة السلسلة (بيوتيرات) التوصية: 25–38 جم/يوم (أو 14 جم لكل 1000 kcal). الزيادة تدريجية مع ماء كافٍ، وإلا انتفاخ. 1.4 البروتين الأساسيات 20 حمضًا أمينيًا، منها 9 أساسية (لا يصنّعها الجسم): هستيدين، أيزوليوسين، ليوسين، ليسين، ميثيونين، فينيل ألانين، ثريونين، تريبتوفان، فالين. تقييم الجودة PDCAAS : نظام قديم سقفه 1.0 (بروتين اللبن، البيض، الصويا = 1.0). DIAAS : النظام الأحدث والأدق (يقيس الهضم في نهاية اللفائفي، ويسمح بقيم 1.0). بروتين الحليب ≈ 1.18، البيض ≈ 1.13، القمح ≈ 0.45. الاحتياج الفئة جم/كجم/يوم RDA للحد الأدنى (منع النقص) 0.8 بالغ نشط/صحة عامة 1.0–1.4 رياضي قوة 1.6–2.2 أثناء عجز حراري شديد + حفاظ على العضل 2.2–2.7 كبار السن (مقاومة الابتناء) 1.0–1.5 مرض حاد/حروق 1.5–2.0+ فشل كلوي مزمن (بدون غسيل) 0.6–0.8 (بإشراف) مفاهيم مهمة: عتبة الليوسين: ~2.5–3 جم ليوسين في الوجبة (≈ 25–30 جم بروتين عالي الجودة) لتحفيز أقصى لبناء البروتين العضلي (MPS). الظاهرة العضلية الكاملة (Muscle full effect): الزيادة فوق الحد لا تزيد التحفيز خطيًا — لذلك التوزيع على 3–5 وجبات أفضل من وجبة عملاقة. أسطورة: \"البروتين العالي يضر الكلى السليمة\" — لا يوجد دليل قوي على ذلك في الأصحاء. الحذر مطلوب فقط مع مرض كلوي قائم. 1.5 الدهون التصنيف مشبعة (SFA): حيوانية، زيت جوز الهند والنخيل. توصية: <10% من الطاقة (<7% مع خطر قلبي). أحادية غير مشبعة (MUFA): زيت زيتون، أفوكادو، مكسرات — نجم النمط المتوسطي. متعددة غير مشبعة (PUFA): أوميجا 6 (لينوليك) — أساسي؛ زيوت نباتية. أوميجا 3 (ألفا لينولينيك ALA) — أساسي؛ كتان، جوز، شيا. تحويله إلى EPA/DHA ضعيف جدًا (<5–10%)، لذلك الأسماك الدهنية 2 مرات/أسبوع أو مكمل. متحولة (Trans): صناعية → يجب أن تقترب من الصفر (ترفع LDL وتخفض HDL معًا). الكوليسترول الغذائي لم يعد الشغل الشاغل؛ التأثير الأكبر على LDL يأتي من الدهون المشبعة والمتحولة ، لكن هناك أفرادًا \"مستجيبين مفرطين (Hyper responders)\". 1.6 المغذيات الدقيقة — جدول عملي فيتامينات ذائبة في الدهون الفيتامين الوظيفة مصادر علامة النقص ملاحظة سمّية A (ريتينول) الإبصار، المناعة، الظهارة كبد، جزر (بيتاكاروتين) العشى الليلي، جفاف الملتحمة سمّية كبدية ومشوّه للجنين بجرعات عالية D امتصاص الكالسيوم، المناعة شمس، أسماك دهنية، مدعّم كساح/لين العظام، آلام عضلية UL 4000 IU؛ فرط كالسيوم E مضاد أكسدة غشائي زيوت، مكسرات انحلال دم، اعتلال أعصاب (نادر) تعارض مع مضادات التخثر K تخثر الدم، أوستيوكالسين خضار ورقية (K1)، مخمرات (K2) نزيف يتعارض مع الوارفارين → ثبات المدخول لا منعه فيتامينات ذائبة في الماء (مختارات) الفيتامين الدور النقص B1 ثيامين أيض الكربوهيدرات (بيروفات ديهيدروجينيز) بري بري، اعتلال فيرنيكه (كحوليون، متلازمة إعادة التغذية) B2/B3 نواقل إلكترون FAD/NAD التهاب الفم / البلاجرا (الإسهال، الجلد، الخرف) B6 نقل مجموعة أمين، تصنيع الهيم فقر دم، اعتلال أعصاب (وأيضًا من الجرعة الزائدة!) B9 فولات تصنيع DNA فقر دم ضخم الأرومات، عيوب الأنبوب العصبي B12 كوبالامين ميثيونين سينثيز، غمد الميالين فقر دم + أعراض عصبية؛ خطر عالٍ في النباتيين، الميتفورمين، مثبطات مضخة البروتون، جراحات المعدة C تصنيع الكولاجين، امتصاص الحديد غير الهيمي الإسقربوط، ضعف التئام الجروح معادن أساسية المعدن ملاحظات عملية حديد هيمي (حيواني، امتصاص 15–35%) مقابل غير هيمي (نباتي، 2–20%). المعزِّز: فيتامين C. المثبِّط: فيتات، تانينات الشاي، كالسيوم. كالسيوم 1000–1200 مجم/يوم؛ الامتصاص يحتاج فيتامين D؛ جرعات مقسّمة ≤500 مجم. زنك المناعة والتئام الجروح؛ الجرعات العالية المزمنة تسبب نقص نحاس. صوديوم <2000 مجم/يوم (≈5 جم ملح)؛ 70–80% منه من الأطعمة المصنّعة لا من مملحة المائدة. بوتاسيوم 3500–4700 مجم/يوم؛ خافض للضغط — لكن يُقيَّد بشدة في الفشل الكلوي . يود الغدة الدرقية؛ الملح المدعّم. سيلينيوم ديودينيز، جلوتاثيون بيروكسيداز؛ نافذة الأمان ضيقة. 1.7 الماء والسوائل الاحتياج التقريبي: 30–35 مل/كجم/يوم للبالغ (أو 1 مل لكل kcal)، ويزيد مع الحرارة، الحمى (+10–15% لكل درجة)، الإسهال، الرياضة. دليل الترطيب الأسهل: لون البول (فاتح كالقش = جيد) + عدم الشعور بالعطش المستمر + وزن صباحي ثابت. 1.8 الأنماط الغذائية المدعومة بالأدلة النمط الفكرة أقوى دليل المتوسطي زيت زيتون، خضار، بقول، أسماك، مكسرات، حبوب كاملة، لحوم حمراء قليلة تقليل أحداث القلب والأوعية (دراسة PREDIMED) DASH نفس الأساس + منتجات ألبان قليلة الدسم + تقييد صوديوم خفض ضغط الدم بفعالية موثقة النباتي/النباتي الصرف كثافة ألياف عالية تحسين الدهون والوزن — بشرط تعويض B12، حديد، زنك، أوميجا 3، كالسيوم منخفض الكربوهيدرات تحكم أسرع في السكر والدهون الثلاثية فعّال، والالتزام طويل المدى هو التحدي الصيام المتقطع أداة لتقليل الطاقة نتائجه ≈ العجز الحراري المكافئ؛ ليس سحرًا الخلاصة الصادقة: لا يوجد نمط واحد \"الأفضل\". الأفضل هو النمط الذي: (1) يحقق التوازن الحراري المطلوب، (2) يوفّر البروتين والمغذيات الدقيقة، (3) يستطيع الشخص الالتزام به سنوات . الالتزام هو المتغير الأقوى في كل الدراسات المقارِنة. 1.9 قراءة البطاقة الغذائية — مهارة عملية 1. ابدأ بحجم الحصة — كل الأرقام تُقاس عليه، وأشهر خدعة تسويقية هي تصغير الحصة. 2. قارن لكل 100 جم بين المنتجات، لا لكل عبوة. 3. السكريات المضافة غير \"إجمالي السكريات\" (الذي يشمل سكر الحليب والفاكهة الطبيعي). 4. قائمة المكونات مرتّبة تنازليًا بالوزن — إذا كان السكر ضمن أول ثلاثة مكونات، انتبه. وابحث عن أسماءه المتعددة (شراب جلوكوز، دكستروز، مالتودكسترين، شراب ذرة عالي الفركتوز، عصير قصب مبخّر). 5. \"خالٍ من الدهون\" ≠ قليل السعرات ، و \"طبيعي\" ادعاء غير منظّم في أغلب الأسواق."}, {"i": 2, "group": "guide", "tag": "رياضي", "num": "2", "short": "تغذية الرياضيين", "html": "<h1>الجزء الثاني: تغذية الرياضيين</h1>\n<h2>2.1 أنظمة الطاقة — الأساس الفسيولوجي</h2>\n<p>كل انقباض عضلي يستهلك <strong>ATP</strong>، ومخزونه يكفي 1–2 ثانية فقط. لذلك للجسم ثلاثة أنظمة لإعادة إنتاجه:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>النظام</th><th>الوقود</th><th>الذروة</th><th>المدة</th><th>مثال رياضي</th></tr></thead><tbody><tr><td><strong>الفوسفاجين (ATP-PCr)</strong></td><td>كرياتين فوسفات</td><td>فوري</td><td>0–10 ثوانٍ</td><td>رفعة قصوى، عدو 40م</td></tr><tr><td><strong>الجليكوليتي (اللاهوائي)</strong></td><td>جليكوجين عضلي → لاكتات</td><td>10–30 ثانية</td><td>حتى ~2 دقيقة</td><td>400م، جولة ملاكمة، تكرارات 8–12</td></tr><tr><td><strong>الأكسدي (الهوائي)</strong></td><td>كربوهيدرات + دهون (+ بروتين قليل)</td><td>بعد دقيقتين</td><td>ساعات</td><td>ماراثون، دراجات، كرة قدم</td></tr></tbody></table></div>\n<p><strong>التطبيق:</strong> الرياضة عالية الشدة تعتمد على الجليكوجين → الكربوهيدرات ليست اختيارية للاعب القوة أو الرياضات الجماعية. أما شدة منخفضة طويلة فتعتمد أكثر على الدهون.</p>\n<p><strong>نقطة تقاطع الوقود (Crossover concept):</strong> كلما زادت الشدة، زادت مساهمة الكربوهيدرات ونقصت الدهون نسبيًا. وأقصى معدل أكسدة دهون (FATmax) يكون عادةً حول 55–65% من VO₂max.</p>\n<hr>\n<h2>2.2 الكربوهيدرات للرياضي</h2>\n<h3>التوصيات اليومية (بناء على حجم التدريب)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>حجم التدريب</th><th>جم/كجم/يوم</th></tr></thead><tbody><tr><td>نشاط خفيف / مهاري</td><td>3–5</td></tr><tr><td>متوسط (~1 ساعة/يوم)</td><td>5–7</td></tr><tr><td>عالٍ (1–3 ساعات شدة متوسطة–عالية)</td><td>6–10</td></tr><tr><td>عالٍ جدًا (&gt;4–5 ساعات/يوم)</td><td>8–12</td></tr></tbody></table></div>\n<h3>حول التمرين</h3>\n<ul><li><strong>قبل بـ 3–4 ساعات:</strong> وجبة 1–4 جم/كجم كربوهيدرات، بروتين معتدل، دهون وألياف قليلة (لتقليل انزعاج المعدة).</li><li><strong>أثناء التمرين:</strong><ul><li>&lt; 45 دقيقة: لا حاجة (ربما مضمضة كربوهيدرات — <strong>Mouth rinse</strong> — لها أثر عصبي مركزي حقيقي في الجهد القصير).</li><li>45–75 دقيقة: كميات صغيرة.</li><li>1–2.5 ساعة: <strong>30–60 جم/ساعة</strong>.</li><li>&gt; 2.5–3 ساعات: <strong>حتى 90 جم/ساعة</strong> بشرط استخدام <strong>مصادر متعددة النقل</strong> (جلوكوز:فركتوز بنسبة 2:1 أو 1:0.8) لتجاوز تشبّع ناقل SGLT1.</li></ul></li><li><strong>بعد التمرين:</strong> إذا كان التعافي قصيرًا (&lt;8 ساعات) → 1–1.2 جم/كجم/ساعة لأول 4 ساعات. أما مع 24 ساعة راحة، فالمجموع اليومي هو المهم وليس التوقيت.</li></ul>\n<h3>تحميل الكربوهيدرات (Carbohydrate loading)</h3>\n<p>البروتوكول الحديث: <strong>10–12 جم/كجم/يوم لمدة 36–48 ساعة</strong> مع تقليل حاد للحمل التدريبي. لا حاجة لمرحلة \"الاستنزاف\" القاسية القديمة. متوقع زيادة وزن ماء 1–2 كجم (كل 1 جم جليكوجين يحتجز ~3 جم ماء).</p>\n<h3>مفاهيم متقدمة</h3>\n<ul><li><strong>Train low, compete high:</strong> أداء بعض جلسات التدريب منخفضة الشدة بمخزون جليكوجين منخفض لتحفيز تكيفات ميتوكوندرية (PGC-1α)، مع ضمان توافر الكربوهيدرات في المنافسات والجلسات المكثفة. أداة متقدمة تحتاج إشرافًا؛ سوء استخدامها = إرهاق ومناعة ضعيفة.</li><li><strong>تدريب الأمعاء (Gut training):</strong> الأمعاء قابلة للتدريب — يجب تجربة استراتيجية التغذية في التدريب قبل السباق، وليس يوم السباق.</li></ul>\n<hr>\n<h2>2.3 البروتين للرياضي</h2>\n<ul><li><strong>الكمية:</strong> 1.6–2.2 جم/كجم/يوم تغطي أغلب الحالات. المراجعات التحليلية تُظهر أن الفائدة تصل إلى هضبة حول <strong>1.6 جم/كجم</strong>، مع هامش أمان حتى 2.2.</li><li><strong>الجرعة:</strong> 0.3–0.4 جم/كجم لكل وجبة (≈ 25–40 جم).</li><li><strong>التوزيع:</strong> 4 وجبات كل 3–4 ساعات ≈ الأمثل.</li><li><strong>قبل النوم:</strong> 30–40 جم كازين (بروتين بطيء) يحسّن التخليق البروتيني الليلي والتعافي.</li><li><strong>\"النافذة الابتنائية\":</strong> ليست 30 دقيقة كما شاع. النافذة تمتد لساعات، وأهميتها ترتفع فقط إذا تمرنت صائمًا أو بعد فترة طويلة من آخر وجبة.</li><li><strong>النوع:</strong> واي (سريع، غني بالليوسين) ممتاز حول التمرين؛ الكازين للاستمرارية؛ مصادر نباتية تحتاج كمية أكبر (~20–40%) ودمجًا لتغطية الليسين والميثيونين.</li></ul>\n<hr>\n<h2>2.4 الدهون للرياضي</h2>\n<ul><li>الحد الأدنى: <strong>20% من الطاقة</strong> (وأقل من ذلك يهدد الفيتامينات الذائبة في الدهون والهرمونات).</li><li>الحمية الكيتونية للرياضات عالية الشدة: تزيد أكسدة الدهون لكنها <strong>تُضعف الاقتصاد الحركي والأداء عالي الشدة</strong> — غير موصى بها للنخبة في رياضات الانفجار والتحمل العالي الشدة.</li></ul>\n<hr>\n<h2>2.5 السوائل والإلكتروليتات</h2>\n<h3>حساب معدل التعرق (احسبه بنفسك)</h3>\n<pre class=\"calc\"><code>معدل التعرق (لتر/ساعة) =\n[(الوزن قبل − الوزن بعد بالكجم) + (السوائل المشروبة باللتر) − (البول باللتر)] ÷ مدة التمرين بالساعات</code></pre>\n<h3>القواعد</h3>\n<ul><li>فقدان <strong>&gt;2% من وزن الجسم</strong> يبدأ في خفض الأداء (خصوصًا في الحر).</li><li>أثناء التمرين: اشرب لتعويض معظم — لا كل — الفقد؛ لا تشرب أكثر من معدل تعرقك.</li><li><strong>الصوديوم:</strong> مهم في الجهد &gt;2 ساعة أو المتعرقين بغزارة (300–700 مجم/لتر).</li><li><strong>⚠️ نقص صوديوم الدم المرتبط بالمجهود (Hyponatremia):</strong> خطر حقيقي وقد يكون قاتلًا، سببه <strong>الإفراط في شرب الماء الخالي من الإلكتروليتات</strong>. الأعراض: صداع، غثيان، تشوش، انتفاخ. القاعدة: \"اشرب حسب العطش\" أطمن بكثير من \"اشرب أكثر ما تستطيع\".</li><li><strong>بعد التمرين:</strong> 1.25–1.5 لتر لكل كجم مفقود، مع صوديوم.</li></ul>\n<hr>\n<h2>2.6 المكملات — تصنيف عملي</h2>\n<h3>الفئة أ: أدلة قوية</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المكمل</th><th>البروتوكول</th><th>الآلية والملاحظات</th></tr></thead><tbody><tr><td><strong>كرياتين مونوهيدرات</strong></td><td>3–5 جم/يوم يوميًا (أو تحميل 20 جم/يوم مقسّمة 5–7 أيام)</td><td>أكثر مكمل أداء مدروس وأمانه ممتاز في الأصحاء. يزيد القوة والكتلة وقد يفيد الإدراك. لا يحتاج تدوير.</td></tr><tr><td><strong>كافيين</strong></td><td>3–6 مجم/كجم قبل 45–60 دقيقة</td><td>مضاد لمستقبلات الأدينوزين → تقليل الإحساس بالجهد. الاستجابة تختلف وراثيًا (CYP1A2). تجنبه مساءً.</td></tr><tr><td><strong>بيتا-ألانين</strong></td><td>3.2–6.4 جم/يوم لمدة 4+ أسابيع</td><td>يرفع الكارنوزين العضلي → تنظيم الحموضة في الجهد 1–4 دقائق. العرَض: تنميل (Paresthesia) — قلّله بالجرعات المقسّمة.</td></tr><tr><td><strong>بيكربونات الصوديوم</strong></td><td>0.2–0.3 جم/كجم قبل 60–150 دقيقة</td><td>مصدّ خارج خلوي؛ اضطراب معوي شائع → جرّبه في التدريب أولًا.</td></tr><tr><td><strong>نترات/عصير البنجر</strong></td><td>6–8 mmol نترات، 2–3 ساعات قبل</td><td>↑ أكسيد النيتريك → تحسين اقتصاد الأكسجين، خصوصًا لغير النخبة.</td></tr><tr><td><strong>بروتين مصل اللبن</strong></td><td>حسب الحاجة</td><td>وسيلة راحة لتحقيق هدف البروتين، وليس سحرًا.</td></tr></tbody></table></div>\n<h3>الفئة ب: سياق محدد</h3>\n<p>فيتامين D (عند النقص)، حديد (عند إثبات النقص بالتحاليل — <strong>لا يُكمَّل عشوائيًا</strong>)، أوميجا-3، كارنيتين (أدلة محدودة)، HMB (يفيد أساسًا غير المدربين/كبار السن).</p>\n<h3>الفئة ج/د: ضعيفة أو ممنوعة</h3>\n<p>معظم \"حارقات الدهون\"، BCAA منفردة (غير مجدية مع بروتين كافٍ)، الجلوتامين للرياضي السليم، وأي مادة ضمن قائمة المنشطات المحظورة.</p>\n<blockquote class=\"danger\"><p><strong>⚠️ تحذير التلوث:</strong> دراسات متكررة وجدت منتجات ملوثة بمنشطات غير معلنة. الرياضي الخاضع للاختبار <strong>مسؤول مسؤولية صارمة</strong> عمّا في جسده → استخدم منتجات معتمدة من برامج فحص طرف ثالث (مثل Informed Sport أو NSF Certified for Sport).</p></blockquote>\n<hr>\n<h2>2.7 توافر الطاقة و RED-S</h2>\n<pre class=\"calc\"><code>توافر الطاقة (EA) = (الطاقة المتناولة − طاقة التمرين) ÷ الكتلة الخالية من الدهون بالكجم</code></pre>\n<ul><li>الأمثل: <strong><span class=\"ltr\">≥45</span> kcal/kg FFM/يوم</strong></li><li>منخفض: <strong>&lt;30</strong> → اضطراب هرموني.</li></ul>\n<p><strong>RED-S (نقص الطاقة النسبي في الرياضة)</strong> أوسع من \"ثالوث الرياضيات\" القديم ويصيب الجنسين: اضطراب الدورة/انخفاض التستوستيرون، هشاشة العظام وكسور الإجهاد، ضعف المناعة، اضطراب المزاج، هبوط الأداء، مشاكل قلبية ومعوية. علاجه غذائي/نفسي وليس تدريبيًا فقط.</p>\n<hr>\n<h2>2.8 قطع الوزن في رياضات الأوزان (نظرة سلامة)</h2>\n<p>المسار الآمن: خسارة تدريجية (0.5–1% من وزن الجسم/أسبوع) على مدى أسابيع، ثم ضبط بسيط عبر تقليل الألياف والمخلفات وتلاعب معتدل بالصوديوم والماء. <strong>الممارسات الخطرة</strong> (تجفيف قسري، ساونا مطوّلة، مدرات، تقيؤ) سببت وفيات موثّقة ويجب رفضها مهنيًا.</p>\n<hr>\n<h2>2.9 ثلاث خطط نموذجية</h2>\n<h3>(أ) لاعب قوة/كمال أجسام — 80 كجم، مرحلة زيادة</h3>\n<ul><li>سعرات: TDEE + 10–15%</li><li>بروتين 2.0 جم/كجم = 160 جم · دهون 1.0 = 80 جم · باقي كربوهيدرات (~380–420 جم)</li><li>4–5 وجبات، 40 جم بروتين لكل وجبة، وجبة قبل النوم كازين</li><li>كرياتين 5 جم يوميًا · كافيين قبل الجلسات الثقيلة</li></ul>\n<h3>(ب) عدّاء ماراثون — 60 كجم، أسبوع السباق</h3>\n<ul><li>تحميل: 10 جم/كجم = 600 جم كربوهيدرات في اليومين الأخيرين، دهون وألياف منخفضة</li><li>الفطار قبل السباق بـ 3 ساعات: 2 جم/كجم كربوهيدرات (120 جم) سهلة الهضم</li><li>أثناء السباق: 60–90 جم/ساعة (جل + مشروب) + 500–700 مجم صوديوم/لتر</li><li>بعد: 1.2 جم/كجم/ساعة كربوهيدرات + 0.3 جم/كجم بروتين</li></ul>\n<h3>(ج) لاعب كرة قدم — 75 كجم، يوم مباراة مساءً</h3>\n<ul><li>إفطار وغداء غنيان بالكربوهيدرات (إجمالي 6–8 جم/كجم لليوم)</li><li>وجبة ما قبل المباراة بـ 3 ساعات (1–3 جم/كجم)، سناك خفيف قبل ساعة</li><li>أثناء الاستراحة: مشروب كربوهيدرات ~30 جم + سوائل</li><li>بعد المباراة خلال ساعة: 1 جم/كجم كربوهيدرات + 25–40 جم بروتين + سوائل مالحة</li></ul>\n<hr>", "text": "الجزء الثاني: تغذية الرياضيين 2.1 أنظمة الطاقة — الأساس الفسيولوجي كل انقباض عضلي يستهلك ATP ، ومخزونه يكفي 1–2 ثانية فقط. لذلك للجسم ثلاثة أنظمة لإعادة إنتاجه: النظام الوقود الذروة المدة مثال رياضي الفوسفاجين (ATP PCr) كرياتين فوسفات فوري 0–10 ثوانٍ رفعة قصوى، عدو 40م الجليكوليتي (اللاهوائي) جليكوجين عضلي → لاكتات 10–30 ثانية حتى ~2 دقيقة 400م، جولة ملاكمة، تكرارات 8–12 الأكسدي (الهوائي) كربوهيدرات + دهون (+ بروتين قليل) بعد دقيقتين ساعات ماراثون، دراجات، كرة قدم التطبيق: الرياضة عالية الشدة تعتمد على الجليكوجين → الكربوهيدرات ليست اختيارية للاعب القوة أو الرياضات الجماعية. أما شدة منخفضة طويلة فتعتمد أكثر على الدهون. نقطة تقاطع الوقود (Crossover concept): كلما زادت الشدة، زادت مساهمة الكربوهيدرات ونقصت الدهون نسبيًا. وأقصى معدل أكسدة دهون (FATmax) يكون عادةً حول 55–65% من VO₂max. 2.2 الكربوهيدرات للرياضي التوصيات اليومية (بناء على حجم التدريب) حجم التدريب جم/كجم/يوم نشاط خفيف / مهاري 3–5 متوسط (~1 ساعة/يوم) 5–7 عالٍ (1–3 ساعات شدة متوسطة–عالية) 6–10 عالٍ جدًا ( 4–5 ساعات/يوم) 8–12 حول التمرين قبل بـ 3–4 ساعات: وجبة 1–4 جم/كجم كربوهيدرات، بروتين معتدل، دهون وألياف قليلة (لتقليل انزعاج المعدة). أثناء التمرين: < 45 دقيقة: لا حاجة (ربما مضمضة كربوهيدرات — Mouth rinse — لها أثر عصبي مركزي حقيقي في الجهد القصير). 45–75 دقيقة: كميات صغيرة. 1–2.5 ساعة: 30–60 جم/ساعة . 2.5–3 ساعات: حتى 90 جم/ساعة بشرط استخدام مصادر متعددة النقل (جلوكوز:فركتوز بنسبة 2:1 أو 1:0.8) لتجاوز تشبّع ناقل SGLT1. بعد التمرين: إذا كان التعافي قصيرًا (<8 ساعات) → 1–1.2 جم/كجم/ساعة لأول 4 ساعات. أما مع 24 ساعة راحة، فالمجموع اليومي هو المهم وليس التوقيت. تحميل الكربوهيدرات (Carbohydrate loading) البروتوكول الحديث: 10–12 جم/كجم/يوم لمدة 36–48 ساعة مع تقليل حاد للحمل التدريبي. لا حاجة لمرحلة \"الاستنزاف\" القاسية القديمة. متوقع زيادة وزن ماء 1–2 كجم (كل 1 جم جليكوجين يحتجز ~3 جم ماء). مفاهيم متقدمة Train low, compete high: أداء بعض جلسات التدريب منخفضة الشدة بمخزون جليكوجين منخفض لتحفيز تكيفات ميتوكوندرية (PGC 1α)، مع ضمان توافر الكربوهيدرات في المنافسات والجلسات المكثفة. أداة متقدمة تحتاج إشرافًا؛ سوء استخدامها = إرهاق ومناعة ضعيفة. تدريب الأمعاء (Gut training): الأمعاء قابلة للتدريب — يجب تجربة استراتيجية التغذية في التدريب قبل السباق، وليس يوم السباق. 2.3 البروتين للرياضي الكمية: 1.6–2.2 جم/كجم/يوم تغطي أغلب الحالات. المراجعات التحليلية تُظهر أن الفائدة تصل إلى هضبة حول 1.6 جم/كجم ، مع هامش أمان حتى 2.2. الجرعة: 0.3–0.4 جم/كجم لكل وجبة (≈ 25–40 جم). التوزيع: 4 وجبات كل 3–4 ساعات ≈ الأمثل. قبل النوم: 30–40 جم كازين (بروتين بطيء) يحسّن التخليق البروتيني الليلي والتعافي. \"النافذة الابتنائية\": ليست 30 دقيقة كما شاع. النافذة تمتد لساعات، وأهميتها ترتفع فقط إذا تمرنت صائمًا أو بعد فترة طويلة من آخر وجبة. النوع: واي (سريع، غني بالليوسين) ممتاز حول التمرين؛ الكازين للاستمرارية؛ مصادر نباتية تحتاج كمية أكبر (~20–40%) ودمجًا لتغطية الليسين والميثيونين. 2.4 الدهون للرياضي الحد الأدنى: 20% من الطاقة (وأقل من ذلك يهدد الفيتامينات الذائبة في الدهون والهرمونات). الحمية الكيتونية للرياضات عالية الشدة: تزيد أكسدة الدهون لكنها تُضعف الاقتصاد الحركي والأداء عالي الشدة — غير موصى بها للنخبة في رياضات الانفجار والتحمل العالي الشدة. 2.5 السوائل والإلكتروليتات حساب معدل التعرق (احسبه بنفسك) معدل التعرق (لتر/ساعة) = [(الوزن قبل − الوزن بعد بالكجم) + (السوائل المشروبة باللتر) − (البول باللتر)] ÷ مدة التمرين بالساعات القواعد فقدان 2% من وزن الجسم يبدأ في خفض الأداء (خصوصًا في الحر). أثناء التمرين: اشرب لتعويض معظم — لا كل — الفقد؛ لا تشرب أكثر من معدل تعرقك. الصوديوم: مهم في الجهد 2 ساعة أو المتعرقين بغزارة (300–700 مجم/لتر). ⚠️ نقص صوديوم الدم المرتبط بالمجهود (Hyponatremia): خطر حقيقي وقد يكون قاتلًا، سببه الإفراط في شرب الماء الخالي من الإلكتروليتات . الأعراض: صداع، غثيان، تشوش، انتفاخ. القاعدة: \"اشرب حسب العطش\" أطمن بكثير من \"اشرب أكثر ما تستطيع\". بعد التمرين: 1.25–1.5 لتر لكل كجم مفقود، مع صوديوم. 2.6 المكملات — تصنيف عملي الفئة أ: أدلة قوية المكمل البروتوكول الآلية والملاحظات كرياتين مونوهيدرات 3–5 جم/يوم يوميًا (أو تحميل 20 جم/يوم مقسّمة 5–7 أيام) أكثر مكمل أداء مدروس وأمانه ممتاز في الأصحاء. يزيد القوة والكتلة وقد يفيد الإدراك. لا يحتاج تدوير. كافيين 3–6 مجم/كجم قبل 45–60 دقيقة مضاد لمستقبلات الأدينوزين → تقليل الإحساس بالجهد. الاستجابة تختلف وراثيًا (CYP1A2). تجنبه مساءً. بيتا ألانين 3.2–6.4 جم/يوم لمدة 4+ أسابيع يرفع الكارنوزين العضلي → تنظيم الحموضة في الجهد 1–4 دقائق. العرَض: تنميل (Paresthesia) — قلّله بالجرعات المقسّمة. بيكربونات الصوديوم 0.2–0.3 جم/كجم قبل 60–150 دقيقة مصدّ خارج خلوي؛ اضطراب معوي شائع → جرّبه في التدريب أولًا. نترات/عصير البنجر 6–8 mmol نترات، 2–3 ساعات قبل ↑ أكسيد النيتريك → تحسين اقتصاد الأكسجين، خصوصًا لغير النخبة. بروتين مصل اللبن حسب الحاجة وسيلة راحة لتحقيق هدف البروتين، وليس سحرًا. الفئة ب: سياق محدد فيتامين D (عند النقص)، حديد (عند إثبات النقص بالتحاليل — لا يُكمَّل عشوائيًا )، أوميجا 3، كارنيتين (أدلة محدودة)، HMB (يفيد أساسًا غير المدربين/كبار السن). الفئة ج/د: ضعيفة أو ممنوعة معظم \"حارقات الدهون\"، BCAA منفردة (غير مجدية مع بروتين كافٍ)، الجلوتامين للرياضي السليم، وأي مادة ضمن قائمة المنشطات المحظورة. ⚠️ تحذير التلوث: دراسات متكررة وجدت منتجات ملوثة بمنشطات غير معلنة. الرياضي الخاضع للاختبار مسؤول مسؤولية صارمة عمّا في جسده → استخدم منتجات معتمدة من برامج فحص طرف ثالث (مثل Informed Sport أو NSF Certified for Sport). 2.7 توافر الطاقة و RED S توافر الطاقة (EA) = (الطاقة المتناولة − طاقة التمرين) ÷ الكتلة الخالية من الدهون بالكجم الأمثل: ≥45 kcal/kg FFM/يوم منخفض: <30 → اضطراب هرموني. RED S (نقص الطاقة النسبي في الرياضة) أوسع من \"ثالوث الرياضيات\" القديم ويصيب الجنسين: اضطراب الدورة/انخفاض التستوستيرون، هشاشة العظام وكسور الإجهاد، ضعف المناعة، اضطراب المزاج، هبوط الأداء، مشاكل قلبية ومعوية. علاجه غذائي/نفسي وليس تدريبيًا فقط. 2.8 قطع الوزن في رياضات الأوزان (نظرة سلامة) المسار الآمن: خسارة تدريجية (0.5–1% من وزن الجسم/أسبوع) على مدى أسابيع، ثم ضبط بسيط عبر تقليل الألياف والمخلفات وتلاعب معتدل بالصوديوم والماء. الممارسات الخطرة (تجفيف قسري، ساونا مطوّلة، مدرات، تقيؤ) سببت وفيات موثّقة ويجب رفضها مهنيًا. 2.9 ثلاث خطط نموذجية (أ) لاعب قوة/كمال أجسام — 80 كجم، مرحلة زيادة سعرات: TDEE + 10–15% بروتين 2.0 جم/كجم = 160 جم · دهون 1.0 = 80 جم · باقي كربوهيدرات (~380–420 جم) 4–5 وجبات، 40 جم بروتين لكل وجبة، وجبة قبل النوم كازين كرياتين 5 جم يوميًا · كافيين قبل الجلسات الثقيلة (ب) عدّاء ماراثون — 60 كجم، أسبوع السباق تحميل: 10 جم/كجم = 600 جم كربوهيدرات في اليومين الأخيرين، دهون وألياف منخفضة الفطار قبل السباق بـ 3 ساعات: 2 جم/كجم كربوهيدرات (120 جم) سهلة الهضم أثناء السباق: 60–90 جم/ساعة (جل + مشروب) + 500–700 مجم صوديوم/لتر بعد: 1.2 جم/كجم/ساعة كربوهيدرات + 0.3 جم/كجم بروتين (ج) لاعب كرة قدم — 75 كجم، يوم مباراة مساءً إفطار وغداء غنيان بالكربوهيدرات (إجمالي 6–8 جم/كجم لليوم) وجبة ما قبل المباراة بـ 3 ساعات (1–3 جم/كجم)، سناك خفيف قبل ساعة أثناء الاستراحة: مشروب كربوهيدرات ~30 جم + سوائل بعد المباراة خلال ساعة: 1 جم/كجم كربوهيدرات + 25–40 جم بروتين + سوائل مالحة"}, {"i": 3, "group": "guide", "tag": "علاجي", "num": "3", "short": "التغذية العلاجية", "html": "<h1>الجزء الثالث: التغذية العلاجية (Medical Nutrition Therapy)</h1>\n<blockquote class=\"note\"><p><strong>قاعدة حاكمة:</strong> التغذية العلاجية جزء من خطة علاجية متكاملة. الأرقام أدناه <em>نطاقات مرجعية</em> تُعدَّل حسب التحاليل والأدوية ووظائف الأعضاء وحالة المريض، وبقرار الفريق الطبي.</p></blockquote>\n<h2>3.1 داء السكري</h2>\n<h3>الفروق الجوهرية</h3>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th>النوع الأول</th><th>النوع الثاني</th></tr></thead><tbody><tr><td>الآلية</td><td>نقص إنسولين مطلق (مناعي ذاتي)</td><td>مقاومة إنسولين + قصور تدريجي في خلايا بيتا</td></tr><tr><td>محور التغذية</td><td>مطابقة الإنسولين للكربوهيدرات</td><td>إنقاص الوزن وتحسين الحساسية</td></tr></tbody></table></div>\n<h3>أهم مبادئ التدخل</h3>\n<ol><li><strong>إنقاص 5–10% من الوزن</strong> يحسّن السكر التراكمي والضغط والدهون. وإنقاص 10–15% قد يحقق <strong>هدأة (Remission)</strong> في السكري النوع الثاني الحديث (كما أظهرت تجربة DiRECT).</li><li><strong>حساب الكربوهيدرات (Carb Counting):</strong> حجر الأساس في النوع الأول.<ul><li><strong>نسبة الإنسولين للكربوهيدرات (ICR):</strong> تقدير أولي = 500 ÷ الجرعة اليومية الكلية (TDD).</li><li><strong>عامل الحساسية (ISF):</strong> = 1800 ÷ TDD (لسريع المفعول).</li></ul></li><li><strong>جودة الكربوهيدرات:</strong> حبوب كاملة، بقول، خضار — GL منخفض، وألياف <span class=\"ltr\">≥25</span>–30 جم.</li><li><strong>البروتين:</strong> 15–20% من الطاقة ما لم توجد اعتلال كلوي.</li><li><strong>نقص السكر (Hypoglycemia):</strong> قاعدة <strong>15–15</strong>: تناول 15 جم كربوهيدرات سريعة (نصف كوب عصير، 3 أقراص جلوكوز)، أعد القياس بعد 15 دقيقة، وكرّر إن لزم، ثم اتبعها بوجبة تحتوي بروتينًا/نشا.</li><li><strong>الرياضة + إنسولين:</strong> خطر هبوط سكر يمتد حتى 24 ساعة بعد المجهود → تعديل الجرعة أو سناك كربوهيدرات.</li><li><strong>الكحول:</strong> يمنع تحرر الجلوكوز الكبدي → هبوط سكر متأخر ومخادع.</li></ol>\n<h3>مثال تطبيقي</h3>\n<blockquote class=\"note\"><p>مريض نوع أول، TDD = 40 وحدة. ICR = 500÷40 ≈ <strong>1 وحدة لكل 12.5 جم كربوهيدرات</strong>. ISF = 1800÷40 = <strong>45 مجم/دل لكل وحدة</strong>. وجبة تحتوي 60 جم كربوهيدرات وسكره 200 والهدف 110: جرعة الوجبة = 60÷12.5 ≈ 4.8 وحدة · جرعة التصحيح = (200−110)÷45 = 2 وحدة → <strong>≈ 6.8 وحدة</strong> (بإشراف طبي وتعديل فردي).</p></blockquote>\n<hr>\n<h2>3.2 أمراض القلب والأوعية وارتفاع الضغط ودهون الدم</h2>\n<h3>الضغط — نمط DASH</h3>\n<ul><li>صوديوم <strong>&lt;2300 مجم/يوم</strong>، والأفضل <strong>1500 مجم</strong> لمن لديه ضغط مرتفع (خفض ~5–6/3 mmHg).</li><li>بوتاسيوم، ماغنسيوم، كالسيوم عالية (خضار، فاكهة، ألبان قليلة الدسم).</li><li>الوزن: كل 1 كجم فقد ≈ 1 mmHg خفض تقريبًا.</li><li>تقليل الكحول والتدخين، ونشاط هوائي منتظم.</li></ul>\n<h3>دهون الدم</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الهدف</th><th>التدخل</th></tr></thead><tbody><tr><td>↓ LDL</td><td>استبدال المشبعة بأحادية/متعددة غير المشبعة؛ ألياف ذائبة 5–10 جم/يوم؛ <strong>ستيرولات نباتية 2 جم/يوم</strong> (↓ ~8–10%)؛ خسارة وزن</td></tr><tr><td>↓ الدهون الثلاثية</td><td>تقليل السكريات المضافة والكحول؛ فقد وزن؛ أوميجا-3 (EPA/DHA 2–4 جم بإشراف)</td></tr><tr><td>↑ HDL</td><td>نشاط بدني، ترك التدخين (الغذاء أثره محدود)</td></tr></tbody></table></div>\n<h3>قصور القلب</h3>\n<p>تقييد صوديوم (عادة 2000 مجم)، مراقبة الوزن اليومي (زيادة &gt;2 كجم في 3 أيام = احتباس)، تقييد سوائل في الحالات المتقدمة (1.5–2 لتر)، والانتباه لـ <strong>الدنف القلبي (Cardiac cachexia)</strong> الذي يحتاج دعمًا بروتينيًا وسعرات.</p>\n<hr>\n<h2>3.3 السمنة وإدارة الوزن</h2>\n<ul><li><strong>العجز الآمن:</strong> 500–750 kcal/يوم → 0.5–0.75 كجم/أسبوع.</li><li><strong>البروتين المرتفع</strong> (1.2–1.6 جم/كجم) يحافظ على الكتلة العضلية ويزيد الشبع.</li><li><strong>تدريب المقاومة</strong> ضروري وليس اختياريًا.</li><li><strong>التكيف الأيضي:</strong> انخفاض RMR وNEAT مع الفقد → فترات <strong>صيانة (Diet breaks)</strong> مفيدة نفسيًا وأيضيًا.</li><li>الأدوية الحديثة (منبهات GLP-1) غيّرت المشهد لكنها تتطلب مراقبة تغذوية دقيقة: انخفاض حاد للمدخول → <strong>خطر نقص البروتين والمغذيات الدقيقة وفقدان كتلة عضلية</strong>؛ التدخل الغذائي هنا محوري.</li></ul>\n<h3>بعد جراحات السمنة</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المرحلة</th><th>المحتوى</th></tr></thead><tbody><tr><td>1</td><td>سوائل صافية</td></tr><tr><td>2</td><td>سوائل كاملة/بروتين مخفّف</td></tr><tr><td>3</td><td>مهروس</td></tr><tr><td>4</td><td>طري ثم عادي (خلال 6–8 أسابيع)</td></tr></tbody></table></div>\n<p>قواعد مدى الحياة: <strong>بروتين 60–80+ جم/يوم</strong>، وجبات صغيرة متكررة، مضغ جيد، فصل السوائل عن الطعام (30 دقيقة)، <strong>مكملات إلزامية</strong>: فيتامينات متعددة، B12، حديد، كالسيوم سيترات، فيتامين D، ثيامين. مراقبة <strong>متلازمة الإغراق (Dumping)</strong> مع السكريات المركزة.</p>\n<hr>\n<h2>3.4 أمراض الكلى المزمنة (CKD)</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المرحلة</th><th>تقدير GFR</th><th>محاور التغذية</th></tr></thead><tbody><tr><td>1–2</td><td><span class=\"ltr\">≥60</span></td><td>ضبط ضغط وسكر، صوديوم &lt;2300</td></tr><tr><td>3–4</td><td>15–59</td><td><strong>بروتين 0.55–0.8 جم/كجم</strong>، تقييد فوسفور، مراقبة بوتاسيوم</td></tr><tr><td>5 (بدون غسيل)</td><td>&lt;15</td><td>نفس التقييد بإشراف دقيق</td></tr><tr><td><strong>غسيل دموي</strong></td><td>—</td><td><strong>بروتين 1.0–1.2 جم/كجم</strong> (لتعويض الفقد)، سوائل مقيّدة، بوتاسيوم وفوسفور مقيّدان</td></tr><tr><td><strong>غسيل بريتوني</strong></td><td>—</td><td>بروتين 1.2–1.3؛ احتساب السعرات الممتصة من الجلوكوز في المحلول</td></tr></tbody></table></div>\n<p><strong>نقاط عملية:</strong></p>\n<ul><li><strong>الفوسفور:</strong> تجنّب الفوسفات المضاف (أخطر من العضوي لأن امتصاصه ~100%) — ابحث عن \"PHOS\" في المكونات (مشروبات غازية داكنة، لحوم مصنعة، أجبان مطبوخة).</li><li><strong>البوتاسيوم:</strong> يُقيَّد حسب التحليل لا روتينيًا. تقنية <strong>النقع والسلق (Leaching)</strong> تقلل بوتاسيوم البطاطس والخضار.</li><li><strong>بدائل الملح</strong> تحتوي كلوريد بوتاسيوم → <strong>خطرة</strong> في الفشل الكلوي.</li><li><strong>حصوات الكلى (أكسالات كالسيوم):</strong> ماء <span class=\"ltr\">≥2.5</span> لتر، تقليل صوديوم وبروتين حيواني، <strong>الحفاظ على كالسيوم غذائي طبيعي</strong> (تقييده يزيد الحصوات لأنه لا يرتبط بالأكسالات في الأمعاء)، تقليل الأطعمة عالية الأكسالات (سبانخ، شاي أسود، مكسرات) في المستجيبين.</li></ul>\n<hr>\n<h2>3.5 أمراض الكبد</h2>\n<ul><li><strong>الكبد الدهني (MASLD/NAFLD):</strong> التدخل الأول والأقوى هو <strong>فقد 7–10% من الوزن</strong>؛ تقليل الفركتوز المضاف والكحول؛ النمط المتوسطي؛ قهوة (أدلة رصدية إيجابية).</li><li><strong>تليف الكبد:</strong> سوء التغذية شائع جدًا ويُغفَل بسبب الاستسقاء.<ul><li>طاقة 30–35 kcal/كجم · <strong>بروتين 1.2–1.5 جم/كجم</strong> (لا يُقيَّد إلا نادرًا وباستثناءات).</li><li><strong>وجبة ليلية خفيفة غنية بالكربوهيدرات (50 جم)</strong> لتقصير فترة الصيام الليلي ومنع هدم العضلات.</li><li>الاستسقاء: صوديوم &lt;2000 مجم.</li><li>الاعتلال الدماغي الكبدي: العلاج هو اللاكتيولوز/الريفاكسيمين وليس تجويع المريض من البروتين؛ قد تُستخدم مصادر نباتية/ألبان و<strong>BCAA</strong>.</li></ul></li></ul>\n<hr>\n<h2>3.6 الجهاز الهضمي</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الحالة</th><th>جوهر التدخل</th></tr></thead><tbody><tr><td><strong>الارتجاع (GERD)</strong></td><td>وجبات صغيرة، عدم الاستلقاء 3 ساعات بعد الأكل، رفع رأس السرير، إنقاص وزن، وتجنّب المحفزات <strong>الفردية</strong> (دهون عالية، شوكولاتة، نعناع، حمضيات، قهوة) — لا قائمة منع موحدة للجميع</td></tr><tr><td><strong>السيلياك</strong></td><td><strong>امتناع تام مدى الحياة عن الجلوتين</strong> (قمح، شعير، شيلم)، الانتباه للتلوث المتقاطع، ومراقبة نقص الحديد/الفولات/B12/D؛ الشوفان النقي مسموح لأغلب المرضى</td></tr><tr><td><strong>القولون العصبي (IBS)</strong></td><td><strong>حمية FODMAP منخفضة</strong> بثلاث مراحل: تقييد 2–6 أسابيع ← إعادة إدخال منهجية ← تخصيص. <strong>لا تُترك كحمية دائمة</strong> لأنها تضر ميكروبيوم القولون</td></tr><tr><td><strong>أمراض الأمعاء الالتهابية (IBD)</strong></td><td>أثناء النوبة: تقليل ألياف غير ذائبة، طاقة وبروتين عاليان، مراقبة حديد وB12 (خصوصًا بعد استئصال اللفائفي) وفيتامين D. في الهدأة: نظام متنوع. <strong>EEN</strong> (تغذية معوية حصرية) علاج أول فعّال في كرون عند الأطفال</td></tr><tr><td><strong>الإمساك</strong></td><td>ألياف تدريجية + سوائل + حركة؛ الألياف بلا ماء تزيد المشكلة</td></tr><tr><td><strong>عدم تحمل اللاكتوز</strong></td><td>ليس منعًا كاملًا؛ أغلب المرضى يتحملون 12 جم لاكتوز (كوب لبن) مع وجبة، والزبادي والأجبان الصلبة عادة مقبولة</td></tr></tbody></table></div>\n<hr>\n<h2>3.7 حالات أخرى مهمة</h2>\n<h3>النقرس</h3>\n<ul><li>تقليل <strong>البيورينات</strong> عالية المصدر الحيواني: اللحوم العضوية، المحاريات، السردين والأنشوجة، مرق اللحم.</li><li>تجنّب <strong>الفركتوز المضاف والبيرة</strong> (تحديدًا).</li><li>البيورينات النباتية (بقول، سبانخ) <strong>لا ترتبط</strong> بزيادة النوبات.</li><li>ألبان قليلة الدسم واقية · ماء وفير · إنقاص وزن تدريجي (الصيام القاسي يفجّر نوبة).</li></ul>\n<h3>فقر الدم بنقص الحديد</h3>\n<ul><li>حديد هيمي + فيتامين C · تجنّب الشاي والقهوة والكالسيوم مع الوجبة (بفاصل ساعتين).</li><li>المكمل: جرعة <strong>يومًا بعد يوم</strong> قد تكون أفضل امتصاصًا من التقسيم اليومي (لأن الهيبسيدين يرتفع بعد الجرعة).</li></ul>\n<h3>الأمراض الحرجة / الحروق / الإنتان</h3>\n<ul><li>طاقة: 25–30 kcal/كجم (والأدق هو <strong>قياس السعرات غير المباشر Indirect calorimetry</strong>).</li><li>بروتين: 1.2–2.0 جم/كجم (وأعلى في الحروق).</li><li><strong>قاعدة ذهبية:</strong> إذا كانت الأمعاء تعمل — استخدمها (تغذية معوية Enteral خلال 24–48 ساعة) لحفظ سلامة الحاجز المعوي؛ التغذية الوريدية (Parenteral) عند تعذّر المعوية.</li></ul>\n<h3>⚠️ متلازمة إعادة التغذية (Refeeding Syndrome)</h3>\n<ul><li><strong>من الخطر:</strong> صيام &gt;5 أيام، BMI منخفض جدًا، فقد وزن سريع، إدمان كحول، فقدان شهية عصبي.</li><li><strong>الآلية:</strong> عودة الكربوهيدرات ← ارتفاع الإنسولين ← دخول الفوسفات والبوتاسيوم والماغنسيوم إلى الخلايا ← <strong>انخفاض حاد في فوسفات الدم</strong> ← فشل قلبي تنفسي وقد يقود للوفاة.</li><li><strong>الوقاية:</strong> ابدأ بـ <strong>10–15 kcal/كجم/يوم</strong> وارفع تدريجيًا خلال 4–7 أيام، <strong>أعطِ الثيامين قبل التغذية</strong>، وراقب الفوسفات والبوتاسيوم والماغنسيوم يوميًا في البداية.</li></ul>\n<h3>السرطان</h3>\n<p>مواجهة الدنف (Cachexia)، طاقة 25–30 kcal/كجم وبروتين 1.2–1.5، إدارة الأعراض (غثيان، تغيّر التذوق، التهاب الغشاء المخاطي، جفاف الفم) بأطعمة كثيفة الطاقة وصغيرة الحجم. <strong>لا يوجد نظام غذائي يعالج السرطان</strong>، والحميات التقييدية القاسية تزيد سوء التغذية وتضر النتائج.</p>\n<hr>\n<h2>3.8 تفاعلات الدواء والغذاء — الأشهر</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الدواء</th><th>التفاعل</th></tr></thead><tbody><tr><td>وارفارين</td><td>فيتامين K → <strong>ثبّت المدخول</strong> ولا تمنعه</td></tr><tr><td>مثبطات MAO</td><td>التيرامين (أجبان معتّقة، مخللات، لحوم مقددة) → أزمة ضغط</td></tr><tr><td>الستاتينات</td><td><strong>الجريب فروت</strong> يثبط CYP3A4 → ارتفاع تركيز الدواء</td></tr><tr><td>ليفوثيروكسين</td><td>كالسيوم/حديد/صويا/قهوة → على معدة فارغة بفاصل 4 ساعات عن المعادن</td></tr><tr><td>ميتفورمين</td><td>نقص B12 على المدى الطويل</td></tr><tr><td>مثبطات مضخة البروتون</td><td>نقص B12، ماغنسيوم، وامتصاص الكالسيوم</td></tr><tr><td>مدرات اللوب (فوروسيميد)</td><td>فقد بوتاسيوم وماغنسيوم</td></tr><tr><td>مدرات موفّرة للبوتاسيوم / ACEi</td><td>خطر <strong>فرط</strong> بوتاسيوم → حذر من بدائل الملح</td></tr><tr><td>تتراسيكلين/كينولونات</td><td>تُثبَّط بالكالسيوم والحديد</td></tr></tbody></table></div>\n<hr>", "text": "الجزء الثالث: التغذية العلاجية (Medical Nutrition Therapy) قاعدة حاكمة: التغذية العلاجية جزء من خطة علاجية متكاملة. الأرقام أدناه نطاقات مرجعية تُعدَّل حسب التحاليل والأدوية ووظائف الأعضاء وحالة المريض، وبقرار الفريق الطبي. 3.1 داء السكري الفروق الجوهرية النوع الأول النوع الثاني الآلية نقص إنسولين مطلق (مناعي ذاتي) مقاومة إنسولين + قصور تدريجي في خلايا بيتا محور التغذية مطابقة الإنسولين للكربوهيدرات إنقاص الوزن وتحسين الحساسية أهم مبادئ التدخل 1. إنقاص 5–10% من الوزن يحسّن السكر التراكمي والضغط والدهون. وإنقاص 10–15% قد يحقق هدأة (Remission) في السكري النوع الثاني الحديث (كما أظهرت تجربة DiRECT). 2. حساب الكربوهيدرات (Carb Counting): حجر الأساس في النوع الأول. نسبة الإنسولين للكربوهيدرات (ICR): تقدير أولي = 500 ÷ الجرعة اليومية الكلية (TDD). عامل الحساسية (ISF): = 1800 ÷ TDD (لسريع المفعول). 3. جودة الكربوهيدرات: حبوب كاملة، بقول، خضار — GL منخفض، وألياف ≥25–30 جم. 4. البروتين: 15–20% من الطاقة ما لم توجد اعتلال كلوي. 5. نقص السكر (Hypoglycemia): قاعدة 15–15 : تناول 15 جم كربوهيدرات سريعة (نصف كوب عصير، 3 أقراص جلوكوز)، أعد القياس بعد 15 دقيقة، وكرّر إن لزم، ثم اتبعها بوجبة تحتوي بروتينًا/نشا. 6. الرياضة + إنسولين: خطر هبوط سكر يمتد حتى 24 ساعة بعد المجهود → تعديل الجرعة أو سناك كربوهيدرات. 7. الكحول: يمنع تحرر الجلوكوز الكبدي → هبوط سكر متأخر ومخادع. مثال تطبيقي مريض نوع أول، TDD = 40 وحدة. ICR = 500÷40 ≈ 1 وحدة لكل 12.5 جم كربوهيدرات . ISF = 1800÷40 = 45 مجم/دل لكل وحدة . وجبة تحتوي 60 جم كربوهيدرات وسكره 200 والهدف 110: جرعة الوجبة = 60÷12.5 ≈ 4.8 وحدة · جرعة التصحيح = (200−110)÷45 = 2 وحدة → ≈ 6.8 وحدة (بإشراف طبي وتعديل فردي). 3.2 أمراض القلب والأوعية وارتفاع الضغط ودهون الدم الضغط — نمط DASH صو
