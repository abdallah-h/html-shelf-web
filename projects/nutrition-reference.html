"group": "guide", "tag": "حالات", "num": "27", "short": "20 دراسة حالة متدرجة", "html": "<h1>الجزء السابع والعشرون: 20 دراسة حالة متدرجة</h1>\n<blockquote class=\"note\"><p><strong>طريقة الاستخدام:</strong> اقرأ الحالة، اكتب إجابتك كاملة (تقييم + PES + خطة + متابعة)، <strong>ثم</strong> اقرأ النموذج. المقارنة هي التعلم.</p></blockquote>\n<h2>المستوى الأول: حالات أساسية</h2>\n<p><strong>حالة 1 — موظف مكتبي</strong></p>\n<blockquote class=\"model\"><p>رجل 34 سنة، 92 كجم، 180 سم، خامل، يريد إنقاص الوزن، لا أمراض.</p><p><strong>النموذج:</strong> BMI 28.4. BMR = (10×92)+(6.25×180)−(5×34)+5 = 920+1125−170+5 = 1880 · TDEE ×1.2 = 2256 · الهدف ~1800. بروتين 1.4×92 ≈ 129 جم، دهون 0.8×92 ≈ 74 جم، كربوهيدرات ≈ 235 جم. الأولوية: رفع NEAT وبدء مقاومة يومين/أسبوع. متابعة الوزن ومحيط الخصر أسبوعيًا وتعديل بـ10% بعد 3 أسابيع.</p></blockquote>\n<p><strong>حالة 2 — طالبة نباتية</strong></p>\n<blockquote class=\"model\"><p>فتاة 20 سنة، نباتية صرفة منذ سنة، تعب وشحوب، Hb 10.8، MCV 74.</p><p><strong>النموذج:</strong> MCV منخفض → نقص حديد أرجح. اطلب فيريتين وتشبع ترانسفيرين وCRP وB12. تدخل: مصادر حديد نباتية (عدس، طحينة، سبانخ، مدعّمات) <strong>مع فيتامين C</strong>، فصل الشاي والقهوة والكالسيوم عن الوجبة بساعتين، <strong>B12 مكمل إلزامي</strong>. مكمل حديد بقرار طبي (يومًا بعد يوم قد يكون أفضل امتصاصًا). أعد الصورة بعد 8–12 أسبوعًا.</p></blockquote>\n<p><strong>حالة 3 — ضغط مرتفع حديث</strong></p>\n<blockquote class=\"model\"><p>رجل 50 سنة، ضغط 148/92، BMI 29، يأكل خارج المنزل يوميًا.</p><p><strong>النموذج:</strong> نمط DASH + صوديوم &lt;2000 مجم (المصدر الرئيسي هو الأطعمة المصنعة والمطاعم لا مملحة المائدة). فقد 5–7% من الوزن. رفع البوتاسيوم بالخضار والفاكهة. نشاط هوائي 150 دقيقة/أسبوع. تقليل الأكل خارج المنزل إلى 3 مرات/أسبوع كهدف أول قابل للتحقيق.</p></blockquote>\n<p><strong>حالة 4 — لاعب مبتدئ يريد تضخيم</strong></p>\n<blockquote class=\"model\"><p>شاب 21 سنة، 65 كجم، 178 سم، يتمرن 4 أيام، يريد زيادة عضل.</p><p><strong>النموذج:</strong> BMI 20.5. BMR = (10×65)+(6.25×178)−(5×21)+5 = <strong>1662</strong> · TDEE ×1.55 ≈ <strong>2577</strong> → الهدف ≈ <strong>2840</strong> (فائض 10%). بروتين 1.8×65 ≈ 117 جم (468 kcal)، دهون 0.9×65 ≈ 59 جم (531 kcal)، كربوهيدرات = (2840−999)÷4 ≈ <strong>460 جم</strong>. 5 وجبات، 30 جم بروتين لكل واحدة، كازين قبل النوم. كرياتين 5 جم. <strong>التوقع الواقعي:</strong> 0.25–0.5% من وزن الجسم أسبوعيًا — أسرع من ذلك يعني دهونًا.</p></blockquote>\n<p><strong>حالة 5 — سيدة حامل في الشهر الخامس</strong></p>\n<blockquote class=\"model\"><p>28 سنة، BMI قبل الحمل 22، زادت 4 كجم حتى الآن، إمساك وحرقة.</p><p><strong>النموذج:</strong> الزيادة المستهدفة 11.5–16 كجم إجمالًا و~0.4 كجم/أسبوع الآن → المسار جيد. +340 kcal. حديد 27 مجم، فولات، كالسيوم، DHA، يود. الإمساك: ألياف تدريجية + سوائل + حركة. الحرقة: وجبات صغيرة، عدم الاستلقاء بعد الأكل، رفع رأس السرير. <strong>راجع قائمة الممنوعات</strong> (الأجبان غير المبسترة، اللحوم النيئة، الكبد، أسماك الزئبق العالي، كافيين &lt;200 مجم).</p></blockquote>\n<p><strong>حالة 6 — طفل انتقائي</strong></p>\n<blockquote class=\"model\"><p>طفل 4 سنوات، يرفض الخضار، وزنه على المنحنى 25 والطول 50، نشيط.</p><p><strong>النموذج:</strong> النمو <strong>طبيعي</strong> → لا داعي للقلق الطبي. الانتقائية طبيعية في هذا العمر. التدخل سلوكي: مسؤولية مقسّمة (الأهل: ماذا ومتى وأين — الطفل: هل وكم)، تعرّض متكرر بلا ضغط (10–15 مرة)، تقديم الخضار مع طعام محبوب، إشراك الطفل في التحضير، <strong>ممنوع الإجبار أو الرشوة بالحلوى أو التعليق السلبي</strong>. متابعة منحنى النمو.</p></blockquote>\n<h2>المستوى الثاني: حالات مركّبة</h2>\n<p><strong>حالة 7 — سكري نوع 2 + سمنة + كبد دهني</strong></p>\n<blockquote class=\"model\"><p>رجل 47 سنة، 108 كجم، 172 سم، HbA1c 7.8%، ALT مرتفع، سونار: كبد دهني.</p><p><strong>النموذج:</strong> BMI 36.5. <strong>PES:</strong> زيادة مدخول الطاقة مرتبطة بأنماط أكل غير منتظمة ومشروبات محلاة، كما يتضح من BMI 36.5 وHbA1c 7.8% وALT مرتفع. الخطة: عجز 500–700 kcal، <strong>هدف فقد 10% (11 كجم)</strong> — كافٍ لتحسين ملموس في الكبد الدهني والسكر معًا. بروتين 1.4 جم/كجم على وزن معدّل، إلغاء الفركتوز المضاف والمشروبات، نمط متوسطي، ألياف 30 جم، مقاومة + هوائي. مراقبة B12 مع الميتفورمين. إعادة HbA1c وALT بعد 3 شهور.</p></blockquote>\n<p><strong>حالة 8 — قصور كلوي على غسيل دموي</strong></p>\n<blockquote class=\"model\"><p>سيدة 62 سنة، 60 كجم، غسيل 3 مرات/أسبوع، بوتاسيوم 5.8، فوسفور 6.2، ألبيومين 3.2.</p><p><strong>النموذج:</strong> بروتين <strong>1.0–1.2 → 60–72 جم/يوم</strong> (الغسيل يفقد أحماضًا أمينية). طاقة 30–35 kcal/كجم = 1800–2100. <strong>بوتاسيوم مرتفع:</strong> منع الموز والبرتقال والمشمش والطماطم المركزة والبطاطس (إلا بسلق وتصفية)، <strong>ومنع بدائل الملح تمامًا</strong>. <strong>فوسفور مرتفع:</strong> منع المضافات (PHOS) والمشروبات الغازية الداكنة واللحوم المصنعة والأجبان المطبوخة + الالتزام برابطات الفوسفات <strong>مع الوجبة لا بعدها</strong>. سوائل مقيّدة حسب الإدرار المتبقي. متابعة تحاليل شهرية.</p></blockquote>\n<p><strong>حالة 9 — رياضي قتالي يقطع وزنًا</strong></p>\n<blockquote class=\"danger\"><p>ملاكم 24 سنة، 78 كجم، يجب أن يصل 70 كجم خلال 3 أسابيع.</p><p><strong>النموذج:</strong> 8 كجم في 3 أسابيع = <strong>معدل خطر</strong>. المسار الآمن 0.5–1%/أسبوع ≈ 2.5 كجم فقط. <strong>التوصية المهنية: تعديل التوقعات أو تغيير فئة الوزن.</strong> إن أصرّ: عجز معتدل مع بروتين 2.2–2.7 جم/كجم للحفاظ على العضل، ثم في آخر 3–5 أيام تقليل الألياف والمخلفات وتلاعب معتدل بالصوديوم. <strong>مرفوض تمامًا:</strong> التجفيف القسري، الساونا المطولة، المدرات، التقيؤ — مارسات تسببت في وفيات موثقة. إعادة تغذية وإماهة منظمة بعد الوزن.</p></blockquote>\n<p><strong>حالة 10 — مريض بعد جراحة تكميم بـ6 شهور</strong></p>\n<blockquote class=\"model\"><p>سيدة 38 سنة، فقدت 32 كجم، تعب وتساقط شعر، بروتين مقدّر 45 جم/يوم.</p><p><strong>النموذج:</strong> البروتين <strong>ناقص</strong> (الهدف 60–80+ جم). التعب والتساقط متوقعان من نقص البروتين والحديد والزنك. اطلب: صورة دم، فيريتين، B12، فيتامين D، زنك، PTH وكالسيوم. التدخل: <strong>البروتين أولًا في كل وجبة</strong>، مسحوق بروتين إن لزم، وجبات صغيرة متكررة، فصل السوائل 30 دقيقة، مضغ جيد. <strong>مراجعة الالتزام بالمكملات مدى الحياة</strong> (متعدد، B12، حديد، كالسيوم سيترات، D). راقب متلازمة الإغراق.</p></blockquote>\n<p><strong>حالة 11 — مريضة قولون عصبي بعد حمية طويلة</strong></p>\n<blockquote class=\"model\"><p>33 سنة، على FODMAP منخفضة منذ 14 شهرًا، تحسّن جزئي، تخاف من إعادة أي صنف، فقدت 6 كجم.</p><p><strong>النموذج:</strong> <strong>المشكلة الآن ليست القولون العصبي بل التقييد المزمن.</strong> FODMAP ليست حمية دائمة — 14 شهرًا يضر الميكروبيوم ويخاطر بنقص المغذيات. الخطة: <strong>إعادة إدخال منهجية</strong> مجموعة كل 3 أيام مع تسجيل الأعراض، لتحديد المحفزات الفعلية (غالبًا 1–2 مجموعة فقط لا كلها). التعامل مع القلق الغذائي بالتدرج والتطمين، وتقييم اضطراب أكل/أورثوريكسيا وإحالة نفسية إن لزم.</p></blockquote>\n<p><strong>حالة 12 — مسنّ مقيم بدار رعاية مع قرحة فراش</strong></p>\n<blockquote class=\"model\"><p>81 سنة، 52 كجم، قرحة درجة 3 على العجز، مدخول ضعيف، ألبيومين 2.9، CRP 40.</p><p><strong>النموذج:</strong> الألبيومين منخفض بسبب <strong>الالتهاب</strong> (CRP 40) لا التغذية وحدها. الاحتياج: طاقة 30–35 × 52 = 1560–1820 · <strong>بروتين 1.5–2.0 = 78–104 جم</strong> · سوائل 30–35 مل/كجم. أطعمة كثيفة + ONS عالي البروتين + مكمل أرجينين/زنك/فيتامين C <strong>بقرار إكلينيكي</strong>. <strong>الأهم تمريضيًا:</strong> إعادة التموضع كل ساعتين — بدونها لن تلتئم مهما كانت التغذية. متابعة أسبوعية للقرحة والوزن والمدخول.</p></blockquote>\n<p><strong>حالة 13 — عامل ورديات ليلية</strong></p>\n<blockquote class=\"model\"><p>رجل 40 سنة، يعمل 7 مساءً–7 صباحًا، زاد 9 كجم في سنتين، سكر صائم 108، دهون ثلاثية 240.</p><p><strong>النموذج:</strong> تنافر بيولوجي كلاسيكي. الخطة: الوجبة الرئيسية <strong>قبل</strong> الوردية، وجبات ليلية صغيرة بروتينية-خضارية، <strong>تجنّب الأكل 2–5 فجرًا</strong>، كافيين في النصف الأول من الوردية فقط، وجبة خفيفة بعد الوردية ثم نوم في ظلام تام. تقليل السكريات المضافة (للثلاثية) + نشاط منتظم. متابعة السكر الصائم والثلاثية بعد 3 شهور.</p></blockquote>\n<p><strong>حالة 14 — رياضية على دواء GLP-1</strong></p>\n<blockquote class=\"danger\"><p>سيدة 36 سنة، 96 كجم، على منبه GLP-1 منذ 4 شهور، فقدت 14 كجم، غثيان، مدخول ~900 kcal، بروتين ~40 جم.</p><p><strong>النموذج:</strong> <strong>علامة إنذار</strong> — المدخول منخفض جدًا والبروتين نصف الحد الأدنى → خطر فقد عضلي كبير ونقص مغذيات. الخطة: <strong>البروتين أولًا في الطبق</strong>، هدف <span class=\"ltr\">≥1.2</span>–1.6 جم/كجم (على وزن معدّل ≈ 90–110 جم)، مصادر سائلة (زبادي، مخفوق، لبن) عند ضعف الشهية، <strong>تدريب مقاومة إلزامي 2–3 مرات/أسبوع</strong>. إدارة الغثيان: وجبات صغيرة جدًا متكررة، تقليل الدهون والمقليات، أطعمة باردة، عدم شرب كميات كبيرة مع الطعام. فيتامين متعدد + متابعة B12 وD والحديد. تنسيق مع الطبيب حول الجرعة.</p></blockquote>\n<h2>المستوى الثالث: حالات معقدة</h2>\n<p><strong>حالة 15 — عناية مركزة على تنفس صناعي</strong></p>\n<blockquote class=\"model\"><p>رجل 68 سنة، 75 كجم، إنتان رئوي، يوم 2 من التهوية، مستقر ديناميكيًا، أمعاء تعمل.</p><p><strong>النموذج:</strong> <strong>ابدأ تغذية معوية خلال 24–48 ساعة</strong> (الأمعاء تعمل → استخدمها). الطاقة 25 × 75 ≈ 1875 (والأمثل قياس السعرات غير المباشر). بروتين 1.2–2.0 × 75 = 90–150 جم. تركيبة قياسية 1.5 kcal/مل ← ~1250 مل/يوم ≈ 52 مل/ساعة مستمر. <strong>رأس السرير 30–45°</strong> لتقليل الشفط. راقب التبقي المعدي والسكر والفوسفات. <strong>في المرحلة الحادة المبكرة تُعطى طاقة أقل (تغذية تحفيزية/هيبوكالورية) وتُرفع تدريجيًا</strong> — الإفراط المبكر ضار.</p></blockquote>\n<p><strong>حالة 16 — تليّف كبد + استسقاء + اعتلال دماغي خفيف</strong></p>\n<blockquote class=\"model\"><p>رجل 57 سنة، وزنه مع الاستسقاء 78 كجم (الجاف المقدّر ~70)، ألبيومين 2.6، أمونيا مرتفعة، صوديوم 128.</p><p><strong>النموذج:</strong> احسب على <strong>الوزن الجاف 70 كجم</strong>. طاقة 30–35 = 2100–2450 · <strong>بروتين 1.2–1.5 = 84–105 جم — لا تقيّده</strong>؛ علاج الاعتلال هو اللاكتيولوز/الريفاكسيمين. فضّل مصادر نباتية وألبان (تحمّل أفضل) وفكّر في BCAA. <strong>وجبة ليلية 50 جم كربوهيدرات</strong> لتقصير الصيام الليلي ومنع هدم العضل. صوديوم &lt;2000 مجم للاستسقاء. <strong>نقص الصوديوم هنا تخفيفي</strong> → تقييد سوائل لا زيادة ملح. فيتامينات ذائبة في الدهون وثيامين وزنك.</p></blockquote>\n<p><strong>حالة 17 — مراهقة رياضية باشتباه اضطراب أكل</strong></p>\n<blockquote class=\"model\"><p>عداءة 16 سنة، فقدت 7 كجم في 4 شهور، انقطعت الدورة، تتمرن يوميًا حتى مع الإصابة، تأكل وحدها، تحسب السعرات باستمرار.</p><p><strong>النموذج:</strong> <strong>علامات إنذار واضحة</strong> (فقد سريع + انقطاع طمث + تمرين قهري + عزلة + هوس بالأرقام). <strong>لا تعطِ خطة سعرات ولا تناقش أرقامًا.</strong> الإجراء: (1) <strong>إحالة عاجلة</strong> لطبيب + معالج نفسي متخصص في اضطرابات الأكل. (2) فحص طبي: نبض، ضغط انتصابي، إلكتروليتات، ECG. (3) إشراك الأسرة (العلاج الأسري FBT خط أول للمراهقين). (4) <strong>تعليق التدريب</strong> حتى التقييم الطبي. (5) وزن أعمى ولغة محايدة عن الجسم. (6) إذا بدأت إعادة تغذية → مراقبة الفوسفات والبوتاسيوم والماغنسيوم.</p></blockquote>\n<p><strong>حالة 18 — متلازمة الأمعاء القصيرة على PN منزلية</strong></p>\n<blockquote class=\"model\"><p>رجل 45 سنة، بقي 90 سم أمعاء دقيقة بلا صمام لفائفي، مع قولون، على PN 5 ليالٍ/أسبوع، إخراج عالٍ، ماغنسيوم منخفض.</p><p><strong>النموذج:</strong> استئصال اللفائفي → فقد B12 والأملاح الصفراوية → <strong>B12 حقنًا مدى الحياة</strong>، ومراقبة أكسالات (حصوات) وحصوات مرارة. الاستراتيجية: وجبات صغيرة متكررة، <strong>فصل السوائل عن الطعام</strong>، <strong>محاليل إماهة متساوية التوتر</strong> (لا ماء عاديًا كثيرًا ولا عصائر مركزة — كلاهما يزيد الإخراج)، MCT مفيد لوجود القولون، تقييد أكسالات. <strong>الماغنسيوم منخفض</strong> (فقد معوي شائع) → تعويض وريدي غالبًا لأن الفموي يزيد الإسهال. راقب مضاعفات القسطرة (CLABSI) وIFALD، وشجّع أقصى تكيف معوي لتقليل ليالي PN.</p></blockquote>\n<p><strong>حالة 19 — سيدة PKU حامل</strong></p>\n<blockquote class=\"model\"><p>29 سنة، مصابة بـ PKU، توقفت عن النظام منذ المراهقة، حامل في الأسبوع 6.</p><p><strong>النموذج:</strong> <strong>طوارئ أيضية-إنجابية.</strong> ارتفاع الفينيل ألانين الأمومي مُشوّه للجنين (متلازمة PKU الأمومية: صغر رأس، عيوب قلبية، إعاقة ذهنية) — <strong>والضرر يحدث مبكرًا جدًا</strong>. الإجراء: <strong>إحالة فورية لمركز أيض متخصص</strong>، عودة صارمة لتقييد الفينيل ألانين مع التركيبة الطبية الخالية منه، مراقبة مستويات الفينيل ألانين <strong>أسبوعيًا</strong>، وضمان طاقة وبروتين وتيروسين كافية للحمل. <strong>الأسبارتام ممنوع تمامًا.</strong> هذه حالة لا تُدار خارج فريق متخصص.</p></blockquote>\n<p><strong>حالة 20 — طفل بسوء تغذية حاد شديد</strong></p>\n<blockquote class=\"danger\"><p>طفل 18 شهرًا، MUAC 10.8 سم، وذمة في القدمين، إسهال، خامل، رفض الرضاعة.</p><p><strong>النموذج:</strong> <strong>SAM مع مضاعفات</strong> (وذمة + خمول + فقدان شهية + إسهال) → <strong>إدخال مستشفى فورًا</strong> وبروتوكول WHO المرحلي. الترتيب الحرج: (1) عالج <strong>نقص السكر وانخفاض الحرارة والجفاف والإلكتروليتات والعدوى أولًا</strong>. (2) <strong>لا تُستخدم محاليل الإماهة العادية</strong> — تُستخدم صيغة خاصة منخفضة الصوديوم بإشراف. (3) تغذية حذرة جدًا (F-75) في مرحلة الاستقرار — <strong>الإفراط المبكر قاتل</strong> (متلازمة إعادة التغذية وفشل قلبي). (4) لا حديد في المرحلة الأولى (يزيد خطر العدوى) — يُضاف في مرحلة التأهيل. (5) انتقال تدريجي إلى F-100/RUTF مع عودة الشهية واختفاء الوذمة. (6) تحفيز حسي ونفسي وتثقيف الأم قبل الخروج.</p></blockquote>\n<hr>", "text": "الجزء السابع والعشرون: 20 دراسة حالة متدرجة طريقة الاستخدام: اقرأ الحالة، اكتب إجابتك كاملة (تقييم + PES + خطة + متابعة)، ثم اقرأ النموذج. المقارنة هي التعلم. المستوى الأول: حالات أساسية حالة 1 — موظف مكتبي رجل 34 سنة، 92 كجم، 180 سم، خامل، يريد إنقاص الوزن، لا أمراض. النموذج: BMI 28.4. BMR = (10×92)+(6.25×180)−(5×34)+5 = 920+1125−170+5 = 1880 · TDEE ×1.2 = 2256 · الهدف ~1800. بروتين 1.4×92 ≈ 129 جم، دهون 0.8×92 ≈ 74 جم، كربوهيدرات ≈ 235 جم. الأولوية: رفع NEAT وبدء مقاومة يومين/أسبوع. متابعة الوزن ومحيط الخصر أسبوعيًا وتعديل بـ10% بعد 3 أسابيع. حالة 2 — طالبة نباتية فتاة 20 سنة، نباتية صرفة منذ سنة، تعب وشحوب، Hb 10.8، MCV 74. النموذج: MCV منخفض → نقص حديد أرجح. اطلب فيريتين وتشبع ترانسفيرين وCRP وB12. تدخل: مصادر حديد نباتية (عدس، طحينة، سبانخ، مدعّمات) مع فيتامين C ، فصل الشاي والقهوة والكالسيوم عن الوجبة بساعتين، B12 مكمل إلزامي . مكمل حديد بقرار طبي (يومًا بعد يوم قد يكون أفضل امتصاصًا). أعد الصورة بعد 8–12 أسبوعًا. حالة 3 — ضغط مرتفع حديث رجل 50 سنة، ضغط 148/92، BMI 29، يأكل خارج المنزل يوميًا. النموذج: نمط DASH + صوديوم <2000 مجم (المصدر الرئيسي هو الأطعمة المصنعة والمطاعم لا مملحة المائدة). فقد 5–7% من الوزن. رفع البوتاسيوم بالخضار والفاكهة. نشاط هوائي 150 دقيقة/أسبوع. تقليل الأكل خارج المنزل إلى 3 مرات/أسبوع كهدف أول قابل للتحقيق. حالة 4 — لاعب مبتدئ يريد تضخيم شاب 21 سنة، 65 كجم، 178 سم، يتمرن 4 أيام، يريد زيادة عضل. النموذج: BMI 20.5. BMR = (10×65)+(6.25×178)−(5×21)+5 = 1662 · TDEE ×1.55 ≈ 2577 → الهدف ≈ 2840 (فائض 10%). بروتين 1.8×65 ≈ 117 جم (468 kcal)، دهون 0.9×65 ≈ 59 جم (531 kcal)، كربوهيدرات = (2840−999)÷4 ≈ 460 جم . 5 وجبات، 30 جم بروتين لكل واحدة، كازين قبل النوم. كرياتين 5 جم. التوقع الواقعي: 0.25–0.5% من وزن الجسم أسبوعيًا — أسرع من ذلك يعني دهونًا. حالة 5 — سيدة حامل في الشهر الخامس 28 سنة، BMI قبل الحمل 22، زادت 4 كجم حتى الآن، إمساك وحرقة. النموذج: الزيادة المستهدفة 11.5–16 كجم إجمالًا و~0.4 كجم/أسبوع الآن → المسار جيد. +340 kcal. حديد 27 مجم، فولات، كالسيوم، DHA، يود. الإمساك: ألياف تدريجية + سوائل + حركة. الحرقة: وجبات صغيرة، عدم الاستلقاء بعد الأكل، رفع رأس السرير. راجع قائمة الممنوعات (الأجبان غير المبسترة، اللحوم النيئة، الكبد، أسماك الزئبق العالي، كافيين <200 مجم). حالة 6 — طفل انتقائي طفل 4 سنوات، يرفض الخضار، وزنه على المنحنى 25 والطول 50، نشيط. النموذج: النمو طبيعي → لا داعي للقلق الطبي. الانتقائية طبيعية في هذا العمر. التدخل سلوكي: مسؤولية مقسّمة (الأهل: ماذا ومتى وأين — الطفل: هل وكم)، تعرّض متكرر بلا ضغط (10–15 مرة)، تقديم الخضار مع طعام محبوب، إشراك الطفل في التحضير، ممنوع الإجبار أو الرشوة بالحلوى أو التعليق السلبي . متابعة منحنى النمو. المستوى الثاني: حالات مركّبة حالة 7 — سكري نوع 2 + سمنة + كبد دهني رجل 47 سنة، 108 كجم، 172 سم، HbA1c 7.8%، ALT مرتفع، سونار: كبد دهني. النموذج: BMI 36.5. PES: زيادة مدخول الطاقة مرتبطة بأنماط أكل غير منتظمة ومشروبات محلاة، كما يتضح من BMI 36.5 وHbA1c 7.8% وALT مرتفع. الخطة: عجز 500–700 kcal، هدف فقد 10% (11 كجم) — كافٍ لتحسين ملموس في الكبد الدهني والسكر معًا. بروتين 1.4 جم/كجم على وزن معدّل، إلغاء الفركتوز المضاف والمشروبات، نمط متوسطي، ألياف 30 جم، مقاومة + هوائي. مراقبة B12 مع الميتفورمين. إعادة HbA1c وALT بعد 3 شهور. حالة 8 — قصور كلوي على غسيل دموي سيدة 62 سنة، 60 كجم، غسيل 3 مرات/أسبوع، بوتاسيوم 5.8، فوسفور 6.2، ألبيومين 3.2. النموذج: بروتين 1.0–1.2 → 60–72 جم/يوم (الغسيل يفقد أحماضًا أمينية). طاقة 30–35 kcal/كجم = 1800–2100. بوتاسيوم مرتفع: منع الموز والبرتقال والمشمش والطماطم المركزة والبطاطس (إلا بسلق وتصفية)، ومنع بدائل الملح تمامًا . فوسفور مرتفع: منع المضافات (PHOS) والمشروبات الغازية الداكنة واللحوم المصنعة والأجبان المطبوخة + الالتزام برابطات الفوسفات مع الوجبة لا بعدها . سوائل مقيّدة حسب الإدرار المتبقي. متابعة تحاليل شهرية. حالة 9 — رياضي قتالي يقطع وزنًا ملاكم 24 سنة، 78 كجم، يجب أن يصل 70 كجم خلال 3 أسابيع. النموذج: 8 كجم في 3 أسابيع = معدل خطر . المسار الآمن 0.5–1%/أسبوع ≈ 2.5 كجم فقط. التوصية المهنية: تعديل التوقعات أو تغيير فئة الوزن. إن أصرّ: عجز معتدل مع بروتين 2.2–2.7 جم/كجم للحفاظ على العضل، ثم في آخر 3–5 أيام تقليل الألياف والمخلفات وتلاعب معتدل بالصوديوم. مرفوض تمامًا: التجفيف القسري، الساونا المطولة، المدرات، التقيؤ — مارسات تسببت في وفيات موثقة. إعادة تغذية وإماهة منظمة بعد الوزن. حالة 10 — مريض بعد جراحة تكميم بـ6 شهور سيدة 38 سنة، فقدت 32 كجم، تعب وتساقط شعر، بروتين مقدّر 45 جم/يوم. النموذج: البروتين ناقص (الهدف 60–80+ جم). التعب والتساقط متوقعان من نقص البروتين والحديد والزنك. اطلب: صورة دم، فيريتين، B12، فيتامين D، زنك، PTH وكالسيوم. التدخل: البروتين أولًا في كل وجبة ، مسحوق بروتين إن لزم، وجبات صغيرة متكررة، فصل السوائل 30 دقيقة، مضغ جيد. مراجعة الالتزام بالمكملات مدى الحياة (متعدد، B12، حديد، كالسيوم سيترات، D). راقب متلازمة الإغراق. حالة 11 — مريضة قولون عصبي بعد حمية طويلة 33 سنة، على FODMAP منخفضة منذ 14 شهرًا، تحسّن جزئي، تخاف من إعادة أي صنف، فقدت 6 كجم. النموذج: المشكلة الآن ليست القولون العصبي بل التقييد المزمن. FODMAP ليست حمية دائمة — 14 شهرًا يضر الميكروبيوم ويخاطر بنقص المغذيات. الخطة: إعادة إدخال منهجية مجموعة كل 3 أيام مع تسجيل الأعراض، لتحديد المحفزات الفعلية (غالبًا 1–2 مجموعة فقط لا كلها). التعامل مع القلق الغذائي بالتدرج والتطمين، وتقييم اضطراب أكل/أورثوريكسيا وإحالة نفسية إن لزم. حالة 12 — مسنّ مقيم بدار رعاية مع قرحة فراش 81 سنة، 52 كجم، قرحة درجة 3 على العجز، مدخول ضعيف، ألبيومين 2.9، CRP 40. النموذج: الألبيومين منخفض بسبب الالتهاب (CRP 40) لا التغذية وحدها. الاحتياج: طاقة 30–35 × 52 = 1560–1820 · بروتين 1.5–2.0 = 78–104 جم · سوائل 30–35 مل/كجم. أطعمة كثيفة + ONS عالي البروتين + مكمل أرجينين/زنك/فيتامين C بقرار إكلينيكي . الأهم تمريضيًا: إعادة التموضع كل ساعتين — بدونها لن تلتئم مهما كانت التغذية. متابعة أسبوعية للقرحة والوزن والمدخول. حالة 13 — عامل ورديات ليلية رجل 40 سنة، يعمل 7 مساءً–7 صباحًا، زاد 9 كجم في سنتين، سكر صائم 108، دهون ثلاثية 240. النموذج: تنافر بيولوجي كلاسيكي. الخطة: الوجبة الرئيسية قبل الوردية، وجبات ليلية صغيرة بروتينية خضارية، تجنّب الأكل 2–5 فجرًا ، كافيين في النصف الأول من الوردية فقط، وجبة خفيفة بعد الوردية ثم نوم في ظلام تام. تقليل السكريات المضافة (للثلاثية) + نشاط منتظم. متابعة السكر الصائم والثلاثية بعد 3 شهور. حالة 14 — رياضية على دواء GLP 1 سيدة 36 سنة، 96 كجم، على منبه GLP 1 منذ 4 شهور، فقدت 14 كجم، غثيان، مدخول ~900 kcal، بروتين ~40 جم. النموذج: علامة إنذار — المدخول منخفض جدًا والبروتين نصف الحد الأدنى → خطر فقد عضلي كبير ونقص مغذيات. الخطة: البروتين أولًا في الطبق ، هدف ≥1.2–1.6 جم/كجم (على وزن معدّل ≈ 90–110 جم)، مصادر سائلة (زبادي، مخفوق، لبن) عند ضعف الشهية، تدريب مقاومة إلزامي 2–3 مرات/أسبوع . إدارة الغثيان: وجبات صغيرة جدًا متكررة، تقليل الدهون والمقليات، أطعمة باردة، عدم شرب كميات كبيرة مع الطعام. فيتامين متعدد + متابعة B12 وD والحديد. تنسيق مع الطبيب حول الجرعة. المستوى الثالث: حالات معقدة حالة 15 — عناية مركزة على تنفس صناعي رجل 68 سنة، 75 كجم، إنتان رئوي، يوم 2 من التهوية، مستقر ديناميكيًا، أمعاء تعمل. النموذج: ابدأ تغذية معوية خلال 24–48 ساعة (الأمعاء تعمل → استخدمها). الطاقة 25 × 75 ≈ 1875 (والأمثل قياس السعرات غير المباشر). بروتين 1.2–2.0 × 75 = 90–150 جم. تركيبة قياسية 1.5 kcal/مل ← ~1250 مل/يوم ≈ 52 مل/ساعة مستمر. رأس السرير 30–45° لتقليل الشفط. راقب التبقي المعدي والسكر والفوسفات. في المرحلة الحادة المبكرة تُعطى طاقة أقل (تغذية تحفيزية/هيبوكالورية) وتُرفع تدريجيًا — الإفراط المبكر ضار. حالة 16 — تليّف كبد + استسقاء + اعتلال دماغي خفيف رجل 57 سنة، وزنه مع الاستسقاء 78 كجم (الجاف المقدّر ~70)، ألبيومين 2.6، أمونيا مرتفعة، صوديوم 128. النموذج: احسب على الوزن الجاف 70 كجم . طاقة 30–35 = 2100–2450 · بروتين 1.2–1.5 = 84–105 جم — لا تقيّده ؛ علاج الاعتلال هو اللاكتيولوز/الريفاكسيمين. فضّل مصادر نباتية وألبان (تحمّل أفضل) وفكّر في BCAA. وجبة ليلية 50 جم كربوهيدرات لتقصير الصيام الليلي ومنع هدم العضل. صوديوم <2000 مجم للاستسقاء. نقص الصوديوم هنا تخفيفي → تقييد سوائل لا زيادة ملح. فيتامينات ذائبة في الدهون وثيامين وزنك. حالة 17 — مراهقة رياضية باشتباه اضطراب أكل عداءة 16 سنة، فقدت 7 كجم في 4 شهور، انقطعت الدورة، تتمرن يوميًا حتى مع الإصابة، تأكل وحدها، تحسب السعرات باستمرار. النموذج: علامات إنذار واضحة (فقد سريع + انقطاع طمث + تمرين قهري + عزلة + هوس بالأرقام). لا تعطِ خطة سعرات ولا تناقش أرقامًا. الإجراء: (1) إحالة عاجلة لطبيب + معالج نفسي متخصص في اضطرابات الأكل. (2) فحص طبي: نبض، ضغط انتصابي، إلكتروليتات، ECG. (3) إشراك الأسرة (العلاج الأسري FBT خط أول للمراهقين). (4) تعليق التدريب حتى التقييم الطبي. (5) وزن أعمى ولغة محايدة عن الجسم. (6) إذا بدأت إعادة تغذية → مراقبة الفوسفات والبوتاسيوم والماغنسيوم. حالة 18 — متلازمة الأمعاء القصيرة على PN منزلية رجل 45 سنة، بقي 90 سم أمعاء دقيقة بلا صمام لفائفي، مع قولون، على PN 5 ليالٍ/أسبوع، إخراج عالٍ، ماغنسيوم منخفض. النموذج: استئصال اللفائفي → فقد B12 والأملاح الصفراوية → B12 حقنًا مدى الحياة ، ومراقبة أكسالات (حصوات) وحصوات مرارة. الاستراتيجية: وجبات صغيرة متكررة، فصل السوائل عن الطعام ، محاليل إماهة متساوية التوتر (لا ماء عاديًا كثيرًا ولا عصائر مركزة — كلاهما يزيد الإخراج)، MCT مفيد لوجود القولون، تقييد أكسالات. الماغنسيوم منخفض (فقد معوي شائع) → تعويض وريدي غالبًا لأن الفموي يزيد الإسهال. راقب مضاعفات القسطرة (CLABSI) وIFALD، وشجّع أقصى تكيف معوي لتقليل ليالي PN. حالة 19 — سيدة PKU حامل 29 سنة، مصابة بـ PKU، توقفت عن النظام منذ المراهقة، حامل في الأسبوع 6. النموذج: طوارئ أيضية إنجابية. ارتفاع الفينيل ألانين الأمومي مُشوّه للجنين (متلازمة PKU الأمومية: صغر رأس، عيوب قلبية، إعاقة ذهنية) — والضرر يحدث مبكرًا جدًا . الإجراء: إحالة فورية لمركز أيض متخصص ، عودة صارمة لتقييد الفينيل ألانين مع التركيبة الطبية الخالية منه، مراقبة مستويات الفينيل ألانين أسبوعيًا ، وضمان طاقة وبروتين وتيروسين كافية للحمل. الأسبارتام ممنوع تمامًا. هذه حالة لا تُدار خارج فريق متخصص. حالة 20 — طفل بسوء تغذية حاد شديد طفل 18 شهرًا، MUAC 10.8 سم، وذمة في القدمين، إسهال، خامل، رفض الرضاعة. النموذج: SAM مع مضاعفات (وذمة + خمول + فقدان شهية + إسهال) → إدخال مستشفى فورًا وبروتوكول WHO المرحلي. الترتيب الحرج: (1) عالج نقص السكر وانخفاض الحرارة والجفاف والإلكتروليتات والعدوى أولًا . (2) لا تُستخدم محاليل الإماهة العادية — تُستخدم صيغة خاصة منخفضة الصوديوم بإشراف. (3) تغذية حذرة جدًا (F 75) في مرحلة الاستقرار — الإفراط المبكر قاتل (متلازمة إعادة التغذية وفشل قلبي). (4) لا حديد في المرحلة الأولى (يزيد خطر العدوى) — يُضاف في مرحلة التأهيل. (5) انتقال تدريجي إلى F 100/RUTF مع عودة الشهية واختفاء الوذمة. (6) تحفيز حسي ونفسي وتثقيف الأم قبل الخروج."}, {"i": 28, "group": "guide", "tag": "أسئلة", "num": "28", "short": "نظام الامتحانات", "html": "<h1>الجزء الثامن والعشرون: نظام الامتحانات</h1>\n<h2>امتحان (1) — الأساسيات | 20 سؤالًا | 30 دقيقة | النجاح 70%</h2>\n<p>غطِّ الأجزاء 1–2 والملاحق. استخدم <strong>بنك الأسئلة في الجزء الثامن، أسئلة 1–20</strong>، بلا رجوع للدليل، واحسب درجتك من المفتاح.</p>\n<blockquote class=\"note\"><p><strong>أقل من 14/20؟</strong> أعد الجزء 1 وبطاقات الطاقة والماكروز قبل التقدم.</p></blockquote>\n<h2>امتحان (2) — الإكلينيكي والتقييم | 20 سؤالًا + حالتان | 60 دقيقة</h2>\n<ul><li>الأسئلة 21–40 من الجزء الثامن + الأسئلة 7–15 من الجزء 13.</li><li><strong>حالتان مكتوبتان:</strong> اختر حالتين من المستوى الثاني (7–14) واكتب لكل منهما: التقييم · PES · الاحتياجات المحسوبة · الخطة · مؤشرات المتابعة.</li></ul>\n<blockquote class=\"note\"><p><strong>معيار النجاح:</strong> حساب صحيح للطاقة والبروتين + صياغة PES سليمة + ذكر مؤشر متابعة واحد قابل للقياس على الأقل.</p></blockquote>\n<h2>امتحان (3) — الشامل | 90 دقيقة</h2>\n<ol><li><strong>20 سؤال اختيار</strong> مختلطة من كل بنوك الأسئلة.</li><li><strong>4 مسائل حسابية:</strong> TDEE وماكروز · معدل تعرق · جرعة إنسولين (ICR + ISF) · وصفة تغذية معوية بحساب الماء الحر.</li><li><strong>حالة معقدة واحدة</strong> من المستوى الثالث (15–20) بتقرير كامل حسب قالب الجزء 12.4.</li><li><strong>سؤال سلامة:</strong> اذكر خمس علامات إحالة فورية وماذا تفعل في كل منها.</li><li><strong>سؤال إرشادي:</strong> اكتب ردًا مكتوبًا على عميل يقول \"جربت كل حاجة وفشلت\" باستخدام OARS.</li></ol>\n<h2>بطاقة تقييم ذاتي</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المهارة</th><th>لسه محتاج مذاكرة</th><th>متوسط</th><th>متقن</th></tr></thead><tbody><tr><td>حساب الطاقة والماكروز</td><td></td><td></td><td></td></tr><tr><td>قراءة التحاليل وتفسيرها بحذر</td><td></td><td></td><td></td></tr><tr><td>صياغة PES</td><td></td><td></td><td></td></tr><tr><td>تقدير احتياجات المريض المرضي</td><td></td><td></td><td></td></tr><tr><td>الدعم التغذوي المعوي والوريدي</td><td></td><td></td><td></td></tr><tr><td>التعرف على علامات الإحالة</td><td></td><td></td><td></td></tr><tr><td>مهارات المقابلة التحفيزية</td><td></td><td></td><td></td></tr><tr><td>تفنيد المعلومات المضللة</td><td></td><td></td><td></td></tr></tbody></table></div>\n<hr>", "text": "الجزء الثامن والعشرون: نظام الامتحانات امتحان (1) — الأساسيات 20 سؤالًا 30 دقيقة النجاح 70% غطِّ الأجزاء 1–2 والملاحق. استخدم بنك الأسئلة في الجزء الثامن، أسئلة 1–20 ، بلا رجوع للدليل، واحسب درجتك من المفتاح. أقل من 14/20؟ أعد الجزء 1 وبطاقات الطاقة والماكروز قبل التقدم. امتحان (2) — الإكلينيكي والتقييم 20 سؤالًا + حالتان 60 دقيقة الأسئلة 21–40 من الجزء الثامن + الأسئلة 7–15 من الجزء 13. حالتان مكتوبتان: اختر حالتين من المستوى الثاني (7–14) واكتب لكل منهما: التقييم · PES · الاحتياجات المحسوبة · الخطة · مؤشرات المتابعة. معيار النجاح: حساب صحيح للطاقة والبروتين + صياغة PES سليمة + ذكر مؤشر متابعة واحد قابل للقياس على الأقل. امتحان (3) — الشامل 90 دقيقة 1. 20 سؤال اختيار مختلطة من كل بنوك الأسئلة. 2. 4 مسائل حسابية: TDEE وماكروز · معدل تعرق · جرعة إنسولين (ICR + ISF) · وصفة تغذية معوية بحساب الماء الحر. 3. حالة معقدة واحدة من المستوى الثالث (15–20) بتقرير كامل حسب قالب الجزء 12.4. 4. سؤال سلامة: اذكر خمس علامات إحالة فورية وماذا تفعل في كل منها. 5. سؤال إرشادي: اكتب ردًا مكتوبًا على عميل يقول \"جربت كل حاجة وفشلت\" باستخدام OARS. بطاقة تقييم ذاتي المهارة لسه محتاج مذاكرة متوسط متقن حساب الطاقة والماكروز قراءة التحاليل وتفسيرها بحذر صياغة PES تقدير احتياجات المريض المرضي الدعم التغذوي المعوي والوريدي التعرف على علامات الإحالة مهارات المقابلة التحفيزية تفنيد المعلومات المضللة"}, {"i": 29, "group": "guide", "tag": "ملاحق", "num": "29", "short": "الملاحق", "html": "<h1>الملاحق</h1>\n<h2>ملحق أ: جدول التوصيات السريع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الفئة</th><th>الطاقة (kcal/كجم)</th><th>البروتين (جم/كجم)</th></tr></thead><tbody><tr><td>بالغ سليم صيانة</td><td>25–35</td><td>0.8–1.2</td></tr><tr><td>إنقاص وزن</td><td>عجز 500–750 kcal</td><td>1.2–1.6</td></tr><tr><td>رياضي قوة</td><td>حسب الهدف</td><td>1.6–2.2</td></tr><tr><td>رياضي تحمل</td><td>مرتفع (كربوهيدرات 6–10)</td><td>1.2–1.7</td></tr><tr><td>كبار السن</td><td>27–30</td><td>1.0–1.5</td></tr><tr><td>مريض حرج</td><td>25–30</td><td>1.2–2.0</td></tr><tr><td>CKD 3–4 (بلا غسيل)</td><td>30–35</td><td>0.55–0.8</td></tr><tr><td>غسيل دموي</td><td>30–35</td><td>1.0–1.2</td></tr><tr><td>تليّف كبد</td><td>30–35</td><td>1.2–1.5</td></tr><tr><td>ما بعد جراحة السمنة</td><td>حسب المرحلة</td><td>60–80 جم/يوم (كمية مطلقة)</td></tr><tr><td>خطر إعادة تغذية</td><td>ابدأ 10–15 وتدرّج</td><td>يُؤجَّل الرفع حتى الاستقرار</td></tr></tbody></table></div>\n<h2>ملحق ب: تحويلات ومعادلات سريعة</h2>\n<pre class=\"calc\"><code>1 كجم دهن جسم ≈ 7700 kcal\n1 رطل = 0.4536 كجم · 1 بوصة = 2.54 سم\n1 جم صوديوم = 2.5 جم ملح · 1 جم ملح = 400 مجم صوديوم\n1 جم نيتروجين = 6.25 جم بروتين\nسكر الدم: mg/dL ÷ 18 = mmol/L\nتقدير متوسط الجلوكوز = (28.7 × HbA1c) − 46.7\nالوزن المعدّل للسمنة = الوزن المثالي + 0.25 × (الفعلي − المثالي)</code></pre>\n<h2>ملحق ج: علامات إنذار تستدعي الإحالة الفورية</h2>\n<ul><li>فقد وزن غير مفسَّر · عسر بلع · قيء مستمر · دم في البراز أو القيء</li><li>ألم صدر · تورّم مفاجئ · اصفرار العينين</li><li>سلوكيات تطهير أو تقييد شديد أو انشغال مفرط بالجسم (اشتباه اضطراب أكل)</li><li>أفكار إيذاء الذات · أعراض عصبية جديدة (تنميل، ارتباك)</li></ul>\n<h2>ملحق د: مصطلحات إنجليزي–عربي</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الإنجليزية</th><th>العربية</th></tr></thead><tbody><tr><td>Macronutrients / Micronutrients</td><td>مغذيات كبرى / دقيقة</td></tr><tr><td>Basal Metabolic Rate (BMR)</td><td>معدل الأيض الأساسي</td></tr><tr><td>Total Daily Energy Expenditure</td><td>إجمالي إنفاق الطاقة اليومي</td></tr><tr><td>Thermic Effect of Food</td><td>الأثر الحراري للطعام</td></tr><tr><td>Fat-Free Mass</td><td>الكتلة الخالية من الدهون</td></tr><tr><td>Glycemic Index / Load</td><td>المؤشر / الحمل الجلايسيمي</td></tr><tr><td>Muscle Protein Synthesis</td><td>تخليق البروتين العضلي</td></tr><tr><td>Energy Availability</td><td>توافر الطاقة</td></tr><tr><td>Medical Nutrition Therapy</td><td>التغذية العلاجية الطبية</td></tr><tr><td>Refeeding Syndrome</td><td>متلازمة إعادة التغذية</td></tr><tr><td>Enteral / Parenteral Nutrition</td><td>تغذية معوية / وريدية</td></tr><tr><td>Nutrition Care Process</td><td>عملية الرعاية التغذوية</td></tr><tr><td>Motivational Interviewing</td><td>المقابلة التحفيزية</td></tr><tr><td>Self-efficacy</td><td>الكفاءة الذاتية</td></tr><tr><td>Cachexia</td><td>الدنف (الهزال المرضي)</td></tr><tr><td>Sarcopenia</td><td>ضمور العضلات المرتبط بالعمر</td></tr></tbody></table></div>\n<h2>ملحق هـ: مصادر إرشادية موثوقة للمتابعة</h2>\n<ul><li><strong>ESPEN</strong> (الجمعية الأوروبية للتغذية السريرية والأيض) — إرشادات مجانية</li><li><strong>ASPEN</strong> (الأمريكية للتغذية الوريدية والمعوية)</li><li><strong>Academy of Nutrition and Dietetics — Evidence Analysis Library</strong></li><li><strong>ADA (الجمعية الأمريكية للسكري)</strong> — معايير الرعاية السنوية</li><li><strong>KDIGO</strong> (أمراض الكلى) · <strong>NICE</strong> (بريطانيا) · <strong>WHO / FAO</strong></li><li><strong>ISSN</strong> و<strong>AIS Supplement Framework</strong> للتغذية الرياضية</li><li><strong>PubMed / Cochrane Library</strong> للأبحاث والمراجعات المنهجية</li></ul>\n<hr>\n<hr>\n<h2>ملحق و: مسرد المختصرات</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المختصر</th><th>المعنى</th></tr></thead><tbody><tr><td><strong>ADIME</strong></td><td>Assessment–Diagnosis–Intervention–Monitoring/Evaluation (قالب التوثيق)</td></tr><tr><td><strong>AI / EAR / RDA / UL</strong></td><td>مستويات المرجعيات الغذائية</td></tr><tr><td><strong>AMDR</strong></td><td>النطاق المقبول لتوزيع المغذيات</td></tr><tr><td><strong>BIA</strong></td><td>تحليل المقاومة الحيوية الكهربية</td></tr><tr><td><strong>BMR / RMR</strong></td><td>معدل الأيض الأساسي / أثناء الراحة</td></tr><tr><td><strong>CKD</strong></td><td>مرض الكلى المزمن</td></tr><tr><td><strong>CLABSI</strong></td><td>إنتان مجرى الدم المرتبط بالقسطرة المركزية</td></tr><tr><td><strong>CRP</strong></td><td>البروتين التفاعلي سي (مؤشر التهاب)</td></tr><tr><td><strong>DASH</strong></td><td>النهج الغذائي لوقف ارتفاع الضغط</td></tr><tr><td><strong>DEXA</strong></td><td>قياس امتصاص الأشعة السينية مزدوج الطاقة</td></tr><tr><td><strong>DIAAS / PDCAAS</strong></td><td>مقاييس جودة البروتين</td></tr><tr><td><strong>EA</strong></td><td>توافر الطاقة</td></tr><tr><td><strong>EN / PN</strong></td><td>تغذية معوية / وريدية</td></tr><tr><td><strong>FFM</strong></td><td>الكتلة الخالية من الدهون</td></tr><tr><td><strong>FODMAP</strong></td><td>سكريات قابلة للتخمر قصيرة السلسلة</td></tr><tr><td><strong>GI / GL</strong></td><td>المؤشر / الحمل الجلايسيمي</td></tr><tr><td><strong>GLIM</strong></td><td>المبادرة العالمية لمعايير سوء التغذية</td></tr><tr><td><strong>GLP-1 / GIP</strong></td><td>هرمونات إنكريتينية</td></tr><tr><td><strong>HbA1c</strong></td><td>السكر التراكمي</td></tr><tr><td><strong>ICR / ISF</strong></td><td>نسبة الإنسولين للكربوهيدرات / عامل الحساسية</td></tr><tr><td><strong>MNT</strong></td><td>التغذية العلاجية الطبية</td></tr><tr><td><strong>MPS</strong></td><td>تخليق البروتين العضلي</td></tr><tr><td><strong>MUAC</strong></td><td>محيط منتصف العضد</td></tr><tr><td><strong>MUST / NRS-2002 / MNA / SGA</strong></td><td>أدوات مسح وتقييم التغذية</td></tr><tr><td><strong>NCP / PES</strong></td><td>عملية الرعاية التغذوية / صياغة التشخيص التغذوي</td></tr><tr><td><strong>NEAT / EAT / TEF</strong></td><td>مكونات إنفاق الطاقة</td></tr><tr><td><strong>ONS</strong></td><td>مكملات غذائية فموية</td></tr><tr><td><strong>PEG / PEJ</strong></td><td>فغر معدي / صائمي بالمنظار</td></tr><tr><td><strong>PKU / MSUD / MCAD</strong></td><td>اضطرابات أيضية وراثية</td></tr><tr><td><strong>RED-S</strong></td><td>نقص الطاقة النسبي في الرياضة</td></tr><tr><td><strong>SAM / MAM</strong></td><td>سوء تغذية حاد شديد / معتدل</td></tr><tr><td><strong>TDEE / TDD</strong></td><td>إجمالي إنفاق الطاقة اليومي / الجرعة اليومية الكلية للإنسولين</td></tr><tr><td><strong>TTM / HBM / SCT / SDT</strong></td><td>نظريات تغيير السلوك</td></tr></tbody></table></div>\n<hr>\n<hr>\n<h2>ملحق ز: صفحة السلامة — تنبيهات حرجة في مكان واحد</h2>\n<blockquote class=\"danger\"><p>هذه أخطر النقاط في الدليل مجمّعة. راجعها قبل أي حالة.</p></blockquote>\n<h3>أخطاء قد تقتل</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الموقف</th><th>الخطأ</th><th>الصواب</th></tr></thead><tbody><tr><td>مريض صائم &gt;5 أيام أو نحيف جدًا</td><td>البدء بتغذية كاملة \"لتعويضه بسرعة\"</td><td><strong>10–15 kcal/كجم + ثيامين قبل التغذية</strong> + مراقبة الفوسفات يوميًا</td></tr><tr><td>مريض كلوي أو على ACEi/مدرات موفّرة للبوتاسيوم</td><td>نصحه ببديل الملح \"الصحي\"</td><td><strong>بدائل الملح = كلوريد بوتاسيوم → فرط بوتاسيوم قد يوقف القلب</strong></td></tr><tr><td>طفل بسوء تغذية حاد شديد</td><td>محلول إماهة عادي + تغذية مكثفة</td><td>صيغ خاصة + بروتوكول WHO المرحلي + <strong>لا حديد في المرحلة الأولى</strong></td></tr><tr><td>رياضي تحمّل</td><td>\"اشرب أكثر ما تقدر\"</td><td><strong>نقص صوديوم الدم من فرط الماء قاتل</strong> — اشرب حسب العطش + صوديوم</td></tr><tr><td>مراهقة بعلامات اضطراب أكل</td><td>إعطاؤها خطة سعرات لأنها طلبتها</td><td><strong>إحالة فورية</strong> — ولا مناقشة أرقام إطلاقًا</td></tr><tr><td>مريض سكري صائم وسكره 62</td><td>\"أكمل لحد المغرب\"</td><td><strong>إفطار فوري</strong></td></tr><tr><td>حامل مصابة بـ PKU</td><td>متابعة عادية</td><td><strong>طوارئ</strong> — إحالة لمركز أيض متخصص فورًا</td></tr><tr><td>مريض تليّف كبد باعتلال دماغي</td><td>تقييد البروتين</td><td><strong>لا تقيّده</strong> — العلاج لاكتيولوز/ريفاكسيمين</td></tr><tr><td>حالة قطع وزن سريعة</td><td>تجفيف/ساونا/مدرات</td><td><strong>مرفوض مهنيًا — تسبّب وفيات موثقة</strong></td></tr><tr><td>مريض على وارفارين</td><td>منعه من الخضار الورقية</td><td><strong>ثبّت المدخول</strong> ولا تمنعه</td></tr></tbody></table></div>\n<h3>خمس علامات توقف فورًا وتُحيل</h3>\n<ol><li>أفكار إيذاء الذات أو الانتحار.</li><li>اضطراب إلكتروليتات أو بطء نبض أو إغماء متكرر.</li><li>فقد وزن غير مفسَّر + أعراض حمراء (دم، عسر بلع، قيء مستمر).</li><li>علامات اضطراب أكل نشط.</li><li>أي حالة خارج نطاق ترخيصك أو كفاءتك — <strong>الإحالة ليست فشلًا، إنها كفاءة.</strong></li></ol>\n<h3>ثلاث جمل تحمي مهنتك</h3>\n<ul><li>\"ده خارج نطاق تخصصي، هحوّلك لـ...\"</li><li>\"الرقم ده محتاج تحليل، مش تخمين.\"</li><li>\"مش هأديك خطة قبل ما أفهم الصورة كاملة.\"</li></ul>\n<hr>\n<h2>خاتمة: ثلاث قواعد تلخّص المهنة كلها</h2>\n<ol><li><strong>الأساسيات تصنع 90% من النتيجة:</strong> توازن الطاقة، بروتين كافٍ، أطعمة كاملة متنوعة، نوم، حركة، ماء. التفاصيل المتقدمة تصنع الـ 10% الأخيرة — ولا تصلح أبدًا لتعويض إهمال الأساسيات.</li><li><strong>قيّم قبل أن تتدخل، وتابع بعد أن تتدخل.</strong> الخطة بلا تقييم تخمين، وبلا متابعة مجرد ورقة.</li><li><strong>الالتزام يهزم الكمال.</strong> أفضل نظام غذائي هو الذي سيتبعه هذا الشخص تحديدًا، في حياته الحقيقية، لسنوات.</li></ol>\n<hr>\n<p><em>تم إعداد هذا الدليل كمادة تعليمية شاملة. راجع دائمًا أحدث إصدارات الإرشادات المعتمدة، ولا تُطبّق أي بروتوكول علاجي دون إشراف مهني مرخّص.</em></p>\n<hr>", "text": "الملاحق ملحق أ: جدول التوصيات السريع الفئة الطاقة (kcal/كجم) البروتين (جم/كجم) بالغ سليم صيانة 25–35 0.8–1.2 إنقاص وزن عجز 500–750 kcal 1.2–1.6 رياضي قوة حسب الهدف 1.6–2.2 رياضي تحمل مرتفع (كربوهيدرات 6–10) 1.2–1.7 كبار السن 27–30 1.0–1.5 مريض حرج 25–30 1.2–2.0 CKD 3–4 (بلا غسيل) 30–35 0.55–0.8 غسيل دموي 30–35 1.0–1.2 تليّف كبد 30–35 1.2–1.5 ما بعد جراحة السمنة حسب المرحلة 60–80 جم/يوم (كمية مطلقة) خطر إعادة تغذية ابدأ 10–15 وتدرّج يُؤجَّل الرفع حتى الاستقرار ملحق ب: تحويلات ومعادلات سريعة 1 كجم دهن جسم ≈ 7700 kcal 1 رطل = 0.4536 كجم · 1 بوصة = 2.54 سم 1 جم صوديوم = 2.5 جم ملح · 1 جم ملح = 400 مجم صوديوم 1 جم نيتروجين = 6.25 جم بروتين سكر الدم: mg/dL ÷ 18 = mmol/L تقدير متوسط الجلوكوز = (28.7 × HbA1c) − 46.7 الوزن المعدّل للسمنة = الوزن المثالي + 0.25 × (الفعلي − المثالي) ملحق ج: علامات إنذار تستدعي الإحالة الفورية فقد وزن غير مفسَّر · عسر بلع · قيء مستمر · دم في البراز أو القيء ألم صدر · تورّم مفاجئ · اصفرار العينين سلوكيات تطهير أو تقييد شديد أو انشغال مفرط بالجسم (اشتباه اضطراب أكل) أفكار إيذاء الذات · أعراض عصبية جديدة (تنميل، ارتباك) ملحق د: مصطلحات إنجليزي–عربي الإنجليزية العربية Macronutrients / Micronutrients مغذيات كبرى / دقيقة Basal Metabolic Rate (BMR) معدل الأيض الأساسي Total Daily Energy Expenditure إجمالي إنفاق الطاقة اليومي Thermic Effect of Food الأثر الحراري للطعام Fat Free Mass الكتلة الخالية من الدهون Glycemic Index / Load المؤشر / الحمل الجلايسيمي Muscle Protein Synthesis تخليق البروتين العضلي Energy Availability توافر الطاقة Medical Nutrition Therapy التغذية العلاجية الطبية Refeeding Syndrome متلازمة إعادة التغذية Enteral / Parenteral Nutrition تغذية معوية / وريدية Nutrition Care Process عملية الرعاية التغذوية Motivational Interviewing المقابلة التحفيزية Self efficacy الكفاءة الذاتية Cachexia الدنف (الهزال المرضي) Sarcopenia ضمور العضلات المرتبط بالعمر ملحق هـ: مصادر إرشادية موثوقة للمتابعة ESPEN (الجمعية الأوروبية للتغذية السريرية والأيض) — إرشادات مجانية ASPEN (الأمريكية للتغذية الوريدية والمعوية) Academy of Nutrition and Dietetics — Evidence Analysis Library ADA (الجمعية الأمريكية للسكري) — معايير الرعاية السنوية KDIGO (أمراض الكلى) · NICE (بريطانيا) · WHO / FAO ISSN و AIS Supplement Framework للتغذية الرياضية PubMed / Cochrane Library للأبحاث والمراجعات المنهجية ملحق و: مسرد المختصرات المختصر المعنى ADIME Assessment–Diagnosis–Intervention–Monitoring/Evaluation (قالب التوثيق) AI / EAR / RDA / UL مستويات المرجعيات الغذائية AMDR النطاق المقبول لتوزيع المغذيات BIA تحليل المقاومة الحيوية الكهربية BMR / RMR معدل الأيض الأساسي / أثناء الراحة CKD مرض الكلى المزمن CLABSI إنتان مجرى الدم المرتبط بالقسطرة المركزية CRP البروتين التفاعلي سي (مؤشر التهاب) DASH النهج الغذائي لوقف ارتفاع الضغط DEXA قياس امتصاص الأشعة السينية مزدوج الطاقة DIAAS / PDCAAS مقاييس جودة البروتين EA توافر الطاقة EN / PN تغذية معوية / وريدية FFM الكتلة الخالية من الدهون FODMAP سكريات قابلة للتخمر قصيرة السلسلة GI / GL المؤشر / الحمل الجلايسيمي GLIM المبادرة العالمية لمعايير سوء التغذية GLP 1 / GIP هرمونات إنكريتينية HbA1c السكر التراكمي ICR / ISF نسبة الإنسولين للكربوهيدرات / عامل الحساسية MNT التغذية العلاجية الطبية MPS تخليق البروتين العضلي MUAC محيط منتصف العضد MUST / NRS 2002 / MNA / SGA أدوات مسح وتقييم التغذية NCP / PES عملية الرعاية التغذوية / صياغة التشخيص التغذوي NEAT / EAT / TEF مكونات إنفاق الطاقة ONS مكملات غذائية فموية PEG / PEJ فغر معدي / صائمي بالمنظار PKU / MSUD / MCAD اضطرابات أيضية وراثية RED S نقص الطاقة النسبي في الرياضة SAM / MAM سوء تغذية حاد شديد / معتدل TDEE / TDD إجمالي إنفاق الطاقة اليومي / الجرعة اليومية الكلية للإنسولين TTM / HBM / SCT / SDT نظريات تغيير السلوك ملحق ز: صفحة السلامة — تنبيهات حرجة في مكان واحد هذه أخطر النقاط في الدليل مجمّعة. راجعها قبل أي حالة. أخطاء قد تقتل الموقف الخطأ الصواب مريض صائم 5 أيام أو نحيف جدًا البدء بتغذية كاملة \"لتعويضه بسرعة\" 10–15 kcal/كجم + ثيامين قبل التغذية + مراقبة الفوسفات يوميًا مريض كلوي أو على ACEi/مدرات موفّرة للبوتاسيوم نصحه ببديل الملح \"الصحي\" بدائل الملح = كلوريد بوتاسيوم → فرط بوتاسيوم قد يوقف القلب طفل بسوء تغذية حاد شديد محلول إماهة عادي + تغذية مكثفة صيغ خاصة + بروتوكول WHO المرحلي + لا حديد في المرحلة الأولى رياضي تحمّل \"اشرب أكثر ما تقدر\" نقص صوديوم الدم من فرط الماء قاتل — اشرب حسب العطش + صوديوم مراهقة بعلامات اضطراب أكل إعطاؤها خطة سعرات لأنها طلبتها إحالة فورية — ولا مناقشة أرقام إطلاقًا مريض سكري صائم وسكره 62 \"أكمل لحد المغرب\" إفطار فوري حامل مصابة بـ PKU متابعة عادية طوارئ — إحالة لمركز أيض متخصص فورًا مريض تليّف كبد باعتلال دماغي تقييد البروتين لا تقيّده — العلاج لاكتيولوز/ريفاكسيمين حالة قطع وزن سريعة تجفيف/ساونا/مدرات مرفوض مهنيًا — تسبّب وفيات موثقة مريض على وارفارين منعه من الخضار الورقية ثبّت المدخول ولا تمنعه خمس علامات توقف فورًا وتُحيل 1. أفكار إيذاء الذات أو الانتحار. 2. اضطراب إلكتروليتات أو بطء نبض أو إغماء متكرر. 3. فقد وزن غير مفسَّر + أعراض حمراء (دم، عسر بلع، قيء مستمر). 4. علامات اضطراب أكل نشط. 5. أي حالة خارج نطاق ترخيصك أو كفاءتك — الإحالة ليست فشلًا، إنها كفاءة. ثلاث جمل تحمي مهنتك \"ده خارج نطاق تخصصي، هحوّلك لـ...\" \"الرقم ده محتاج تحليل، مش تخمين.\" \"مش هأديك خطة قبل ما أفهم الصورة كاملة.\" خاتمة: ثلاث قواعد تلخّص المهنة كلها 1. الأساسيات تصنع 90% من النتيجة: توازن الطاقة، بروتين كافٍ، أطعمة كاملة متنوعة، نوم، حركة، ماء. التفاصيل المتقدمة تصنع الـ 10% الأخيرة — ولا تصلح أبدًا لتعويض إهمال الأساسيات. 2. قيّم قبل أن تتدخل، وتابع بعد أن تتدخل. الخطة بلا تقييم تخمين، وبلا متابعة مجرد ورقة. 3. الالتزام يهزم الكمال. أفضل نظام غذائي هو الذي سيتبعه هذا الشخص تحديدًا، في حياته الحقيقية، لسنوات. تم إعداد هذا الدليل كمادة تعليمية شاملة. راجع دائمًا أحدث إصدارات الإرشادات المعتمدة، ولا تُطبّق أي بروتوكول علاجي دون إشراف مهني مرخّص."}, {"i": 30, "group": "books", "tag": "مكتبة المراجع", "num": "—", "short": "مدخل المكتبة والمقارنة", "html": "<h1>مكتبة المراجع: قراءة معمّقة</h1>\n<p>هذا القسم يمشي معك داخل عشرة من أهم مراجع التغذية في العالم. لكل كتاب فصل كامل يحتوي على: بطاقة تعريف، خريطة الكتاب قسمًا قسمًا، المفاهيم المحورية مشروحة بالتفصيل، الأرقام التي يجب أن تخرج بها، مثال تطبيقي بأسلوب الكتاب نفسه، الأخطاء الشائعة عند قراءته، خطة مذاكرة أسبوعية، نقاط القوة والضعف، أسئلة للتأمل، وماذا تقرأ بعده.</p>\n<p>ولكل كتاب <strong>بنك من 30 سؤالًا</strong> في تبويب <strong>الاختبارات</strong>.</p>\n<blockquote class=\"note\"><p><strong>ملاحظة أمانة:</strong> هذه الفصول شرح بأسلوبنا لمحتوى الكتب ومنهجها وأفكارها المحورية، وليست نقلًا لنصوصها ولا بديلًا عن قراءتها. ترتيب الفصول وعناوينها الدقيقة يختلف بين الطبعات، لذلك نصف المحاور الكبرى لا أرقام الفصول. والأرقام الإكلينيكية تُراجَع دائمًا مع أحدث الإرشادات.</p></blockquote>\n<h2>الكتب العشرة في نظرة واحدة</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الكتاب</th><th>المجال</th><th>المستوى</th><th>أفضل استخدام</th><th>السؤال الذي يجيب عنه</th></tr></thead><tbody><tr><td><strong>Whitney &amp; Rolfes</strong></td><td>أساسيات</td><td>تمهيدي</td><td>البداية وتعليم الجمهور</td><td>ما المفاهيم الأساسية؟ وكيف أقيّم الادعاءات؟</td></tr><tr><td><strong>Gropper</strong></td><td>أيض</td><td>متقدم</td><td>فهم الآليات</td><td>لماذا يحدث ما يحدث في الجسم؟</td></tr><tr><td><strong>McArdle</strong></td><td>فسيولوجيا الجهد</td><td>متوسط–متقدم</td><td>أساس التغذية الرياضية</td><td>كيف يعمل الجسم تحت الحمل؟</td></tr><tr><td><strong>Burke</strong></td><td>تغذية رياضية</td><td>متقدم</td><td>العمل مع الرياضيين</td><td>ماذا يحتاج هذا الرياضي الآن؟</td></tr><tr><td><strong>Lee &amp; Nieman</strong></td><td>تقييم</td><td>متوسط–متقدم</td><td>إتقان أدوات التقييم</td><td>ما حدود أداتي؟ ومتى تخدعني؟</td></tr><tr><td><strong>Krause</strong></td><td>إكلينيكي</td><td>متقدم</td><td>مرجع دائم</td><td>كيف أتعامل مع أي مريض بمنهج واحد؟</td></tr><tr><td><strong>Nelms</strong></td><td>إكلينيكي</td><td>متوسط</td><td>التعلّم بالحالات</td><td>لماذا هذا التدخل لهذا المرض؟</td></tr><tr><td><strong>ASPEN</strong></td><td>دعم تغذوي</td><td>متخصص</td><td>المستشفى والعناية المركزة</td><td>الأنبوب أم الوريد؟ وكيف؟</td></tr><tr><td><strong>Miller &amp; Rollnick</strong></td><td>إرشاد</td><td>لكل الممارسين</td><td>تغيير السلوك</td><td>لماذا لا يتغير العميل؟ وكيف أساعده؟</td></tr><tr><td><strong>BDA Manual</strong></td><td>ممارسة</td><td>ممارس</td><td>التنفيذ اليومي</td><td>ماذا أفعل بالضبط ومع من؟</td></tr></tbody></table></div>\n<h2>كيف ترتبط الكتب ببعضها؟</h2>\n<div class=\"mermaid\">graph TD\n    A[Whitney &amp; Rolfes&lt;br/&gt;الأساسيات] --&gt; B[Gropper&lt;br/&gt;الأيض]\n    A --&gt; C[McArdle&lt;br/&gt;فسيولوجيا الجهد]\n    B --&gt; D[Nelms&lt;br/&gt;التعلّم الإكلينيكي]\n    B --&gt; C\n    C --&gt; E[Burke&lt;br/&gt;التغذية الرياضية]\n    D --&gt; F[Krause&lt;br/&gt;المرجع الإكلينيكي]\n    F --&gt; G[ASPEN&lt;br/&gt;الدعم التغذوي]\n    H[Lee &amp; Nieman&lt;br/&gt;التقييم] --&gt; F\n    H --&gt; E\n    I[Miller &amp; Rollnick&lt;br/&gt;الإرشاد] --&gt; J[الممارسة الفعلية]\n    F --&gt; J\n    E --&gt; J\n    K[BDA Manual&lt;br/&gt;التنفيذ] --&gt; J</div>\n<h2>ثلاث طرق لقراءة هذه المكتبة</h2>\n<p><strong>1. القراءة الخطية (للطالب):</strong> ابدأ بـ Whitney، ثم Gropper، ثم Lee &amp; Nieman، ثم Nelms مع Krause كمرجع، ثم تخصصك (Burke أو ASPEN)، مع Miller &amp; Rollnick بالتوازي طوال الوقت.</p>\n<p><strong>2. القراءة حسب الحاجة (للممارس):</strong> افتح فصل الكتاب المرتبط بالحالة التي أمامك، واقرأ \"المفاهيم المحورية\" و\"المثال التطبيقي\" أولًا، ثم ارجع للباقي.</p>\n<p><strong>3. القراءة للامتحان:</strong> ركّز على جداول \"أرقام يجب أن تخرج بها\" في كل كتاب، ثم بنوك الأسئلة في تبويب الاختبارات، ثم أسئلة التأمل.</p>\n<h2>مبدأ واحد يربط كل الكتب</h2>\n<p>كل كتاب جيد في هذه القائمة يعلّمك الشيء نفسه بطريقة مختلفة: <strong>افهم الآلية، اعرف حدود أداتك، واحترم الإنسان الذي أمامك.</strong> Gropper يعلّمك الآلية، Lee &amp; Nieman يعلّمك حدود الأداة، Miller &amp; Rollnick يعلّمك احترام الإنسان — والباقي تطبيقات لهذه المبادئ الثلاثة في سياقات مختلفة.</p>", "text": "مكتبة المراجع: قراءة معمّقة هذا القسم يمشي معك داخل عشرة من أهم مراجع التغذية في العالم. لكل كتاب فصل كامل يحتوي على: بطاقة تعريف، خريطة الكتاب قسمًا قسمًا، المفاهيم المحورية مشروحة بالتفصيل، الأرقام التي يجب أن تخرج بها، مثال تطبيقي بأسلوب الكتاب نفسه، الأخطاء الشائعة عند قراءته، خطة مذاكرة أسبوعية، نقاط القوة والضعف، أسئلة للتأمل، وماذا تقرأ بعده. ولكل كتاب بنك من 30 سؤالًا في تبويب الاختبارات . ملاحظة أمانة: هذه الفصول شرح بأسلوبنا لمحتوى الكتب ومنهجها وأفكارها المحورية، وليست نقلًا لنصوصها ولا بديلًا عن قراءتها. ترتيب الفصول وعناوينها الدقيقة يختلف بين الطبعات، لذلك نصف المحاور الكبرى لا أرقام الفصول. والأرقام الإكلينيكية تُراجَع دائمًا مع أحدث الإرشادات. الكتب العشرة في نظرة واحدة الكتاب المجال المستوى أفضل استخدام السؤال الذي يجيب عنه Whitney & Rolfes أساسيات تمهيدي البداية وتعليم الجمهور ما المفاهيم الأساسية؟ وكيف أقيّم الادعاءات؟ Gropper أيض متقدم فهم الآليات لماذا يحدث ما يحدث في الجسم؟ McArdle فسيولوجيا الجهد متوسط–متقدم أساس التغذية الرياضية كيف يعمل الجسم تحت الحمل؟ Burke تغذية رياضية متقدم العمل مع الرياضيين ماذا يحتاج هذا الرياضي الآن؟ Lee & Nieman تقييم متوسط–متقدم إتقان أدوات التقييم ما حدود أداتي؟ ومتى تخدعني؟ Krause إكلينيكي متقدم مرجع دائم كيف أتعامل مع أي مريض بمنهج واحد؟ Nelms إكلينيكي متوسط التعلّم بالحالات لماذا هذا التدخل لهذا المرض؟ ASPEN دعم تغذوي متخصص المستشفى والعناية المركزة الأنبوب أم الوريد؟ وكيف؟ Miller & Rollnick إرشاد لكل الممارسين تغيير السلوك لماذا لا يتغير العميل؟ وكيف أساعده؟ BDA Manual ممارسة ممارس التنفيذ اليومي ماذا أفعل بالضبط ومع من؟ كيف ترتبط الكتب ببعضها؟ mermaid graph TD A[Whitney & Rolfes<br/ الأساسيات] B[Gropper<br/ الأيض] A C[McArdle<br/ فسيولوجيا الجهد] B D[Nelms<br/ التعلّم الإكلينيكي] B C C E[Burke<br/ التغذية الرياضية] D F[Krause<br/ المرجع الإكلينيكي] F G[ASPEN<br/ الدعم التغذوي] H[Lee & Nieman<br/ التقييم] F H E I[Miller & Rollnick<br/ الإرشاد] J[الممارسة الفعلية] F J E J K[BDA Manual<br/ التنفيذ] J ثلاث طرق لقراءة هذه المكتبة 1. القراءة الخطية (للطالب): ابدأ بـ Whitney، ثم Gropper، ثم Lee & Nieman، ثم Nelms مع Krause كمرجع، ثم تخصصك (Burke أو ASPEN)، مع Miller & Rollnick بالتوازي طوال الوقت. 2. القراءة حسب الحاجة (للممارس): افتح فصل الكتاب المرتبط بالحالة التي أمامك، واقرأ \"المفاهيم المحورية\" و\"المثال التطبيقي\" أولًا، ثم ارجع للباقي. 3. القراءة للامتحان: ركّز على جداول \"أرقام يجب أن تخرج بها\" في كل كتاب، ثم بنوك الأسئلة في تبويب الاختبارات، ثم أسئلة التأمل. مبدأ واحد يربط كل الكتب كل كتاب جيد في هذه القائمة يعلّمك الشيء نفسه بطريقة مختلفة: افهم الآلية، اعرف حدود أداتك، واحترم الإنسان الذي أمامك. Gropper يعلّمك الآلية، Lee & Nieman يعلّمك حدود الأداة، Miller & Rollnick يعلّمك احترام الإنسان — والباقي تطبيقات لهذه المبادئ الثلاثة في سياقات مختلفة."}, {"i": 31, "group": "books", "tag": "مكتبة المراجع", "num": "1", "short": "Krause — الإكلينيكي", "html": "<h1>Krause and Mahan's Food &amp; the Nutrition Care Process</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المؤلفون</strong></td><td>Janice L. Raymond و Kelly Morrow في الطبعات الحديثة، امتدادًا لسلسلة L. Kathleen Mahan و Sylvia Escott-Stump</td></tr><tr><td><strong>المستوى</strong></td><td>متقدم — مرجعي</td></tr><tr><td><strong>الحجم</strong></td><td>أكثر من ألف صفحة بقطع كبير</td></tr><tr><td><strong>الجمهور</strong></td><td>طلاب التغذية الإكلينيكية، أخصائيو المستشفيات، المتقدمون لامتحانات الترخيص</td></tr><tr><td><strong>الطابع</strong></td><td>مرجع شامل منظم حول عملية الرعاية التغذوية</td></tr><tr><td><strong>الرفيق المثالي</strong></td><td>Nelms &amp; Sucher للتعلّم بالحالات، وإرشادات ADA و KDIGO و ESPEN للتحديث</td></tr></tbody></table></div>\n<h2>لماذا يُعدّ \"مرجع المهنة\"؟</h2>\n<p>قبل أن تُوحَّد لغة التغذية الإكلينيكية، كانت الكتب تعرض الأمراض كقوائم: هذا مسموح وهذا ممنوع. ما فعله هذا الكتاب عبر طبعاته المتتالية هو أنه نقل المهنة من <strong>قوائم الأطعمة</strong> إلى <strong>عملية تفكير</strong>. كل فصل مرضي فيه يسير على المسار نفسه: ما الذي حدث في الجسم؟ كيف نقيّمه؟ ما المشكلة التغذوية تحديدًا؟ ماذا نفعل؟ وكيف نعرف أننا نجحنا؟</p>\n<p>النتيجة أن القارئ الذي يُنهي الكتاب لا يخرج بمعلومات عن مئة مرض، بل بطريقة واحدة يطبقها على أي مريض — حتى على مرض لم يقرأ عنه. هذه هي القيمة الحقيقية، وهي سبب بقاء الكتاب المرجع الأول في برامج التغذية الإكلينيكية لعقود.</p>\n<h2>خريطة الكتاب</h2>\n<h3>القسم الأول: تقييم الحالة الغذائية</h3>\n<p>يبدأ الكتاب بالأساس الذي يُبنى عليه كل شيء: كيف تعرف ما يحتاجه المريض قبل أن تقرر ما تعطيه.</p>\n<ul><li><strong>المدخول والهضم والامتصاص:</strong> شرح للجهاز الهضمي من منظور تغذوي — أين يُمتص كل مغذٍّ، وماذا يحدث عند استئصال جزء من الأمعاء أو تعطّل وظيفة عضو. هذا الفصل هو مفتاح فهم سوء الامتصاص لاحقًا.</li><li><strong>تقدير الاحتياجات من الطاقة:</strong> المعادلات التنبؤية (Mifflin-St Jeor و Harris-Benedict وغيرهما)، وحدودها، ومتى يجب اللجوء إلى قياس السعرات غير المباشر.</li><li><strong>التقييم الإكلينيكي:</strong> القياسات الجسمية، التحاليل وتفسيرها في سياق الالتهاب، و<strong>الفحص البدني الموجّه للتغذية (NFPE)</strong>.</li><li><strong>التقييم السلوكي والبيئي:</strong> الأمن الغذائي، الثقافة، القدرة على الطهي والشراء، الدعم الاجتماعي.</li><li><strong>تفاعلات الدواء والغذاء:</strong> فصل كامل يؤسس لفكرة أن الدواء جزء من التقييم الغذائي لا شيء منفصل عنه.</li></ul>\n<h3>القسم الثاني: التشخيص التغذوي والتدخل</h3>\n<ul><li><strong>عملية الرعاية التغذوية (NCP)</strong> بخطواتها الأربع، واللغة الموحدة للتشخيص.</li><li><strong>صياغة PES</strong> مع أمثلة كثيرة وتمييز دقيق بين التشخيص التغذوي والطبي.</li><li><strong>توصيل الغذاء والمغذيات:</strong> الأنظمة المعدّلة (القوام، الصوديوم، البقايا، البروتين...)، المكملات الفموية، التغذية المعوية والوريدية.</li><li><strong>التثقيف والإرشاد:</strong> نظريات تغيير السلوك، المقابلة التحفيزية، التخطيط للتعليم.</li></ul>\n<h3>القسم الثالث: التغذية عبر مراحل الحياة</h3>\n<p>الحمل والرضاعة، الرضّع، الطفولة، المراهقة، البلوغ، الشيخوخة. يتميز بربط كل مرحلة باحتياجاتها الخاصة ومخاطرها التغذوية، مع تركيز على النوافذ الحرجة: فولات ما قبل الحمل، حديد الرضيع بعد الشهر السادس، كتلة العظام في المراهقة، الساركوبينيا في الشيخوخة.</p>\n<h3>القسم الرابع: التغذية للصحة والأداء</h3>\n<p>ضبط الوزن، اضطرابات الأكل، التغذية الرياضية، صحة العظام، صحة الفم والأسنان. فصل ضبط الوزن فيه عرض متوازن لأنماط الحميات المختلفة دون انحياز لموضة بعينها.</p>\n<h3>القسم الخامس: التغذية العلاجية الطبية</h3>\n<p>الجزء الأكبر من الكتاب، بفصل لكل جهاز:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>الجهاز</th><th>أهم ما يغطيه</th></tr></thead><tbody><tr><td>الغدد الصماء</td><td>السكري بأنواعه، الغدة الدرقية، الكظرية، متلازمة تكيّس المبايض</td></tr><tr><td>القلب والأوعية</td><td>تصلب الشرايين، دهون الدم، ارتفاع الضغط، قصور القلب</td></tr><tr><td>الكلى</td><td>الإصابة الحادة، المرض المزمن بمراحله، الغسيل، الحصوات، الزراعة</td></tr><tr><td>الكبد والمرارة والبنكرياس</td><td>الكبد الدهني، التليف ومضاعفاته، التهاب البنكرياس</td></tr><tr><td>الجهاز الهضمي العلوي</td><td>الارتجاع، القرحة، خزل المعدة، جراحات المعدة</td></tr><tr><td>الجهاز الهضمي السفلي</td><td>السيلياك، الأمعاء الالتهابية، القولون العصبي، الأمعاء القصيرة</td></tr><tr><td>الرئة</td><td>الانسداد الرئوي المزمن، التليف الكيسي، الفشل التنفسي</td></tr><tr><td>الأعصاب</td><td>السكتة، باركنسون، الخرف، الصرع، عسر البلع</td></tr><tr><td>السرطان</td><td>الدنف، إدارة الأعراض، التغذية أثناء العلاج</td></tr><tr><td>المناعة والحساسية</td><td>الحساسية الغذائية، عدم التحمل، نقص المناعة</td></tr><tr><td>الرعاية الحرجة</td><td>الاستجابة الأيضية للإجهاد، الإنتان، الرضّة، الحروق</td></tr><tr><td>الاضطرابات الوراثية</td><td>بيلة الفينيل كيتون واضطرابات الأيض الخلقية</td></tr><tr><td>الصحة النفسية</td><td>الاكتئاب، الفصام، الإدمان وعلاقتها بالتغذية</td></tr></tbody></table></div>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. التشخيص التغذوي ليس التشخيص الطبي</h3>\n<p>هذه أهم فكرة في الكتاب كله. الطبيب يشخّص \"داء السكري النوع الثاني\". أخصائي التغذية لا يكرر هذا التشخيص، بل يسأل: <strong>ما المشكلة التغذوية التي أستطيع حلها؟</strong> قد تكون:</p>\n<ul><li>\"مدخول مفرط من الكربوهيدرات\" إذا كان المريض يأكل كميات كبيرة.</li><li>\"معرفة محدودة بالغذاء والتغذية\" إذا كان لا يعرف ما يرفع سكره.</li><li>\"عدم انتظام توقيت الوجبات\" إذا كان يتخطى الإفطار ثم يأكل بشراهة ليلًا.</li></ul>\n<p>لكل مريض سكري تشخيص تغذوي مختلف، وبالتالي تدخل مختلف. هذا التمييز يحدد مسؤوليتك المهنية بدقة، ويمنعك من الوقوع في فخ \"خطة السكري الجاهزة\".</p>\n<h3>2. صياغة PES كأداة تفكير</h3>\n<p>المشكلة (P) <strong>مرتبطة بـ</strong> السبب (E) <strong>كما يتضح من</strong> العلامات والأعراض (S).</p>\n<p>يشدد الكتاب على ثلاث قواعد:</p>\n<ul><li><strong>السبب يجب أن يكون قابلًا للتدخل.</strong> \"مرتبطة بالتقدم في العمر\" صياغة ضعيفة لأنك لا تستطيع تغيير العمر. \"مرتبطة بصعوبة المضغ بسبب أطقم أسنان غير مناسبة\" صياغة قوية لأنها تقود إلى تدخل.</li><li><strong>العلامات يجب أن تكون قابلة للقياس</strong> حتى تستطيع المتابعة عليها لاحقًا.</li><li><strong>المشكلة الواحدة = صياغة واحدة.</strong> المريض قد يحمل أكثر من تشخيص تغذوي، ويُرتَّب حسب الأولوية.</li></ul>\n<h3>3. الفحص البدني الموجّه للتغذية</h3>\n<p>مهارة يمنحها الكتاب وزنًا كبيرًا، وتُهمَل كثيرًا في التعليم. الفكرة: يمكنك تقدير فقد الدهون والعضل بعينيك ويديك، دون أي جهاز.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضع</th><th>ما تبحث عنه</th><th>الدلالة</th></tr></thead><tbody><tr><td>الصدغان</td><td>تقعّر</td><td>فقد عضلي</td></tr><tr><td>الترقوة والكتف</td><td>بروز العظام</td><td>فقد عضلي</td></tr><tr><td>ما بين عظام اليد</td><td>تجويف بين الإبهام والسبابة</td><td>فقد عضلي</td></tr><tr><td>تحت العين</td><td>هالات غائرة</td><td>فقد دهون</td></tr><tr><td>الذراع الخلفي</td><td>ثنية جلدية رقيقة</td><td>فقد دهون</td></tr><tr><td>الكاحلان والعجز</td><td>انطباع بالضغط</td><td>وذمة (تخفي فقد الوزن)</td></tr><tr><td>الشعر والجلد والفم</td><td>تساقط، تشقق، التهاب لسان</td><td>نقص مغذيات دقيقة</td></tr></tbody></table></div>\n<p>الدرس العملي: الوذمة قد تُبقي وزن المريض ثابتًا بينما يفقد عضله فعليًا — والفحص البدني يكشف ما يخفيه الميزان.</p>\n<h3>4. التحاليل في سياق الالتهاب</h3>\n<p>يعيد الكتاب صياغة فهم التحاليل البروتينية: الألبيومين والبريألبيومين ليسا مؤشرين للحالة الغذائية في المريض الملتهب، بل مؤشران لشدة المرض والتنبؤ بالمضاعفات. انخفاضهما في مريض الإنتان لا يعني أنه \"لم يأكل كفاية\"، ولن يرتفعا بإعطاء البروتين ما دام الالتهاب نشطًا.</p>\n<h3>5. المتابعة كجزء من الخطة لا ملحق لها</h3>\n<p>كل تدخل في الكتاب يأتي معه <strong>مؤشر متابعة</strong> و<strong>موعد</strong>. إن لم تستطع تسمية ما ستقيسه بعد أسبوعين، فأنت لم تضع خطة بعد. والمتابعة قد تعيدك إلى التقييم إن تبيّن أن التشخيص كان خاطئًا.</p>\n<h3>6. الأدوية جزء من التقييم</h3>\n<p>كل فصل مرضي يحتوي على جدول بالأدوية الشائعة وتأثيراتها الغذائية. هذا ما يفرّق أخصائي التغذية الإكلينيكي عن مصمّم الأنظمة: الأول يعرف أن مريض الميتفورمين يحتاج متابعة B12، وأن مريض الوارفارين يحتاج ثباتًا في فيتامين K لا منعه، وأن مريض المدرات قد يفقد البوتاسيوم والماغنسيوم.</p>\n<h2>أرقام يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الرقم</th></tr></thead><tbody><tr><td>تقدير الطاقة العام للبالغ</td><td>25–35 kcal/كجم</td></tr><tr><td>الطاقة في الرعاية الحرجة</td><td>25–30 kcal/كجم، والأدق القياس غير المباشر</td></tr><tr><td>البروتين للمريض الحرج</td><td>1.2–2.0 جم/كجم</td></tr><tr><td>البروتين في الكلى قبل الغسيل</td><td>0.55–0.8 جم/كجم</td></tr><tr><td>البروتين مع الغسيل الدموي</td><td>1.0–1.2 جم/كجم</td></tr><tr><td>البروتين في تليّف الكبد</td><td>1.2–1.5 جم/كجم</td></tr><tr><td>الصوديوم في القلب والضغط</td><td>أقل من 2000–2300 مجم/يوم</td></tr><tr><td>فقد الوزن ذو الدلالة</td><td>أكثر من 5% في شهر أو 10% في ستة أشهر</td></tr><tr><td>السوائل للبالغ</td><td>30–35 مل/كجم</td></tr><tr><td>بداية التغذية في خطر إعادة التغذية</td><td>10–15 kcal/كجم مع ثيامين</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — مريض بعد سكتة دماغية:</strong> رجل 72 سنة، أُدخل منذ 5 أيام بسكتة، يعاني عسر بلع، يأكل أقل من ربع الوجبات، وزنه 68 كجم (المعتاد 74 كجم)، ألبيومين 3.0 و CRP 45.</p>\n<p><strong>التقييم:</strong> فقد 8% من الوزن (جزء منه سابق للدخول)، مدخول ضعيف جدًا لخمسة أيام، الألبيومين منخفض بسبب الالتهاب أساسًا، والفحص البدني يُظهر تقعّرًا صدغيًا.</p>\n<p><strong>التشخيص التغذوي (PES):</strong> مدخول فموي غير كافٍ <strong>مرتبط بـ</strong> عسر البلع بعد السكتة <strong>كما يتضح من</strong> تناول أقل من 25% من الوجبات لخمسة أيام وفقد 8% من الوزن.</p>\n<p><strong>التدخل:</strong> إحالة لأخصائي التخاطب لتحديد القوام الآمن · طاقة 25–30 kcal/كجم ≈ 1700–2000 kcal · بروتين 1.2–1.5 جم/كجم ≈ 82–102 جم · إذا بقي المدخول أقل من 60% من الاحتياج خلال 5–7 أيام، يُنظر في تغذية معوية · مراقبة خطر إعادة التغذية.</p>\n<p><strong>المتابعة:</strong> المدخول الفعلي يوميًا، الوزن مرتين أسبوعيًا، الفوسفات والبوتاسيوم والماغنسيوم في أول أيام التغذية، وإعادة تقييم القوام مع أخصائي التخاطب.</p></blockquote>\n<p>لاحظ كيف أن التشخيص التغذوي ليس \"سكتة دماغية\"، وكيف أن كل تدخل مرتبط بمؤشر يُقاس.</p>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>قراءته من الغلاف للغلاف.</strong> حجمه يجعل ذلك مرهقًا وغير مفيد. هو مرجع، لا رواية.</li><li><strong>حفظ الأرقام دون فهم سياقها.</strong> الأرقام تتغير مع تحديث الإرشادات؛ المنطق الذي يقف خلفها هو ما يبقى.</li><li><strong>الخلط بين التشخيصين الطبي والتغذوي</strong> في صياغة PES — أكثر خطأ يقع فيه المبتدئون.</li><li><strong>الاعتماد عليه وحده دون الإرشادات المحدّثة.</strong> بعض التوصيات تتقادم بين طبعة وأخرى، خصوصًا في السكري والكلى.</li><li><strong>تجاهل فصول التقييم</strong> والقفز مباشرة إلى الأمراض. من لا يتقن التقييم لا يحسن التدخل.</li></ul>\n<h2>كيف تذاكره: خطة ثمانية أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>الهضم والامتصاص وتقدير الطاقة</td><td>احسب احتياج 5 حالات بمعادلات مختلفة وقارن</td></tr><tr><td>2</td><td>التقييم الإكلينيكي والفحص البدني</td><td>افحص 3 أشخاص فعليًا وسجّل ملاحظاتك</td></tr><tr><td>3</td><td>NCP وصياغة PES</td><td>اكتب 15 صياغة لحالات متنوعة</td></tr><tr><td>4</td><td>توصيل الغذاء والدعم التغذوي</td><td>صمم نظامًا معدّل القوام ووصفة معوية</td></tr><tr><td>5</td><td>السكري والغدد</td><td>حل حالتين كاملتين</td></tr><tr><td>6</td><td>القلب والكلى</td><td>حل حالتين كاملتين</td></tr><tr><td>7</td><td>الجهاز الهضمي والكبد</td><td>حل حالتين كاملتين</td></tr><tr><td>8</td><td>الرعاية الحرجة والسرطان</td><td>حل حالة معقدة متعددة الأجهزة</td></tr></tbody></table></div>\n<p>بعد ذلك يصبح الكتاب مرجعًا: افتح فصل المرض عند كل حالة جديدة، واقرأه مرتين — قبل الحالة وبعدها.</p>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> الشمول الذي لا يضاهيه كتاب آخر، والمنهج الموحد عبر كل الفصول، وجداول تفاعلات الأدوية، والملاحق الغنية بالمعادلات والقيم المرجعية.</p>\n<p><strong>الضعف:</strong> التوجه الأمريكي في الوحدات ونظام الرعاية وأنماط الغذاء، والحجم المرهق للمبتدئ، وتفاوت عمق الفصول لأنها مكتوبة بأقلام متعددة، وتقادم بعض التوصيات بين الطبعات.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>لماذا يُعدّ \"مدخول بروتين غير كافٍ\" تشخيصًا تغذويًا مقبولًا بينما \"نقص ألبيومين الدم\" ليس كذلك؟</li><li>مريض وزنه ثابت لكنه ضعيف ومتورّم الساقين — ما الذي يخبرك به الفحص البدني ولا يخبرك به الميزان؟</li><li>اكتب صياغة PES لنفسك عن عادة غذائية تريد تغييرها، وحدد مؤشر متابعة لها.</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Nelms &amp; Sucher</strong> لتحويل المعرفة إلى مهارة عبر الحالات · <strong>ASPEN Core Curriculum</strong> إذا كنت ستعمل في العناية المركزة · <strong>Lee &amp; Nieman</strong> لتعميق مهارة التقييم · <strong>الإرشادات المحدّثة</strong> (ADA للسكري، KDIGO للكلى، ESPEN للتغذية الإكلينيكية) لإبقاء معرفتك حديثة.</p>", "text": "Krause and Mahan's Food & the Nutrition Care Process المؤلفون Janice L. Raymond و Kelly Morrow في الطبعات الحديثة، امتدادًا لسلسلة L. Kathleen Mahan و Sylvia Escott Stump المستوى متقدم — مرجعي الحجم أكثر من ألف صفحة بقطع كبير الجمهور طلاب التغذية الإكلينيكية، أخصائيو المستشفيات، المتقدمون لامتحانات الترخيص الطابع مرجع شامل منظم حول عملية الرعاية التغذوية الرفيق المثالي Nelms & Sucher للتعلّم بالحالات، وإرشادات ADA و KDIGO و ESPEN للتحديث لماذا يُعدّ \"مرجع المهنة\"؟ قبل أن تُوحَّد لغة التغذية الإكلينيكية، كانت الكتب تعرض الأمراض كقوائم: هذا مسموح وهذا ممنوع. ما فعله هذا الكتاب عبر طبعاته المتتالية هو أنه نقل المهنة من قوائم الأطعمة إلى عملية تفكير . كل فصل مرضي فيه يسير على المسار نفسه: ما الذي حدث في الجسم؟ كيف نقيّمه؟ ما المشكلة التغذوية تحديدًا؟ ماذا نفعل؟ وكيف نعرف أننا نجحنا؟ النتيجة أن القارئ الذي يُنهي الكتاب لا يخرج بمعلومات عن مئة مرض، بل بطريقة واحدة يطبقها على أي مريض — حتى على مرض لم يقرأ عنه. هذه هي القيمة الحقيقية، وهي سبب بقاء الكتاب المرجع الأول في برامج التغذية الإكلينيكية لعقود. خريطة الكتاب القسم الأول: تقييم الحالة الغذائية يبدأ الكتاب بالأساس الذي يُبنى عليه كل شيء: كيف تعرف ما يحتاجه المريض قبل أن تقرر ما تعطيه. المدخول والهضم والامتصاص: شرح للجهاز الهضمي من منظور تغذوي — أين يُمتص كل مغذٍّ، وماذا يحدث عند استئصال جزء من الأمعاء أو تعطّل وظيفة عضو. هذا الفصل هو مفتاح فهم سوء الامتصاص لاحقًا. تقدير الاحتياجات من الطاقة: المعادلات التنبؤية (Mifflin St Jeor و Harris Benedict وغيرهما)، وحدودها، ومتى يجب اللجوء إلى قياس السعرات غير المباشر. التقييم الإكلينيكي: القياسات الجسمية، التحاليل وتفسيرها في سياق الالتهاب، و الفحص البدني الموجّه للتغذية (NFPE) . التقييم السلوكي والبيئي: الأمن الغذائي، الثقافة، القدرة على الطهي والشراء، الدعم الاجتماعي. تفاعلات الدواء والغذاء: فصل كامل يؤسس لفكرة أن الدواء جزء من التقييم الغذائي لا شيء منفصل عنه. القسم الثاني: التشخيص التغذوي والتدخل عملية الرعاية التغذوية (NCP) بخطواتها الأربع، واللغة الموحدة للتشخيص. صياغة PES مع أمثلة كثيرة وتمييز دقيق بين التشخيص التغذوي والطبي. توصيل الغذاء والمغذيات: الأنظمة المعدّلة (القوام، الصوديوم، البقايا، البروتين...)، المكملات الفموية، التغذية المعوية والوريدية. التثقيف والإرشاد: نظريات تغيير السلوك، المقابلة التحفيزية، التخطيط للتعليم. القسم الثالث: التغذية عبر مراحل الحياة الحمل والرضاعة، الرضّع، الطفولة، المراهقة، البلوغ، الشيخوخة. يتميز بربط كل مرحلة باحتياجاتها الخاصة ومخاطرها التغذوية، مع تركيز على النوافذ الحرجة: فولات ما قبل الحمل، حديد الرضيع بعد الشهر السادس، كتلة العظام في المراهقة، الساركوبينيا في الشيخوخة. القسم الرابع: التغذية للصحة والأداء ضبط الوزن، اضطرابات الأكل، التغذية الرياضية، صحة العظام، صحة الفم والأسنان. فصل ضبط الوزن فيه عرض متوازن لأنماط الحميات المختلفة دون انحياز لموضة بعينها. القسم الخامس: التغذية العلاجية الطبية الجزء الأكبر من الكتاب، بفصل لكل جهاز: الجهاز أهم ما يغطيه الغدد الصماء السكري بأنواعه، الغدة الدرقية، الكظرية، متلازمة تكيّس المبايض القلب والأوعية تصلب الشرايين، دهون الدم، ارتفاع الضغط، قصور القلب الكلى الإصابة الحادة، المرض المزمن بمراحله، الغسيل، الحصوات، الزراعة الكبد والمرارة والبنكرياس الكبد الدهني، التليف ومضاعفاته، التهاب البنكرياس الجهاز الهضمي العلوي الارتجاع، القرحة، خزل المعدة، جراحات المعدة الجهاز الهضمي السفلي السيلياك، الأمعاء الالتهابية، القولون العصبي، الأمعاء القصيرة الرئة الانسداد الرئوي المزمن، التليف الكيسي، الفشل التنفسي الأعصاب السكتة، باركنسون، الخرف، الصرع، عسر البلع السرطان الدنف، إدارة الأعراض، التغذية أثناء العلاج المناعة والحساسية الحساسية الغذائية، عدم التحمل، نقص المناعة الرعاية الحرجة الاستجابة الأيضية للإجهاد، الإنتان، الرضّة، الحروق الاضطرابات الوراثية بيلة الفينيل كيتون واضطرابات الأيض الخلقية الصحة النفسية الاكتئاب، الفصام، الإدمان وعلاقتها بالتغذية المفاهيم المحورية بالتفصيل 1. التشخيص التغذوي ليس التشخيص الطبي هذه أهم فكرة في الكتاب كله. الطبيب يشخّص \"داء السكري النوع الثاني\". أخصائي التغذية لا يكرر هذا التشخيص، بل يسأل: ما المشكلة التغذوية التي أستطيع حلها؟ قد تكون: \"مدخول مفرط من الكربوهيدرات\" إذا كان المريض يأكل كميات كبيرة. \"معرفة محدودة بالغذاء والتغذية\" إذا كان لا يعرف ما يرفع سكره. \"عدم انتظام توقيت الوجبات\" إذا كان يتخطى الإفطار ثم يأكل بشراهة ليلًا. لكل مريض سكري تشخيص تغذوي مختلف، وبالتالي تدخل مختلف. هذا التمييز يحدد مسؤوليتك المهنية بدقة، ويمنعك من الوقوع في فخ \"خطة السكري الجاهزة\". 2. صياغة PES كأداة تفكير المشكلة (P) مرتبطة بـ السبب (E) كما يتضح من العلامات والأعراض (S). يشدد الكتاب على ثلاث قواعد: السبب يجب أن يكون قابلًا للتدخل. \"مرتبطة بالتقدم في العمر\" صياغة ضعيفة لأنك لا تستطيع تغيير العمر. \"مرتبطة بصعوبة المضغ بسبب أطقم أسنان غير مناسبة\" صياغة قوية لأنها تقود إلى تدخل. العلامات يجب أن تكون قابلة للقياس حتى تستطيع المتابعة عليها لاحقًا. المشكلة الواحدة = صياغة واحدة. المريض قد يحمل أكثر من تشخيص تغذوي، ويُرتَّب حسب الأولوية. 3. الفحص البدني الموجّه للتغذية مهارة يمنحها الكتاب وزنًا كبيرًا، وتُهمَل كثيرًا في التعليم. الفكرة: يمكنك تقدير فقد الدهون والعضل بعينيك ويديك، دون أي جهاز. الموضع ما تبحث عنه الدلالة الصدغان تقعّر فقد عضلي الترقوة والكتف بروز العظام فقد عضلي ما بين عظام اليد تجويف بين الإبهام والسبابة فقد عضلي تحت العين هالات غائرة فقد دهون الذراع الخلفي ثنية جلدية رقيقة فقد دهون الكاحلان والعجز انطباع بالضغط وذمة (تخفي فقد الوزن) الشعر والجلد والفم تساقط، تشقق، التهاب لسان نقص مغذيات دقيقة الدرس العملي: الوذمة قد تُبقي وزن المريض ثابتًا بينما يفقد عضله فعليًا — والفحص البدني يكشف ما يخفيه الميزان. 4. التحاليل في سياق الالتهاب يعيد الكتاب صياغة فهم التحاليل البروتينية: الألبيومين والبريألبيومين ليسا مؤشرين للحالة الغذائية في المريض الملتهب، بل مؤشران لشدة المرض والتنبؤ بالمضاعفات. انخفاضهما في مريض الإنتان لا يعني أنه \"لم يأكل كفاية\"، ولن يرتفعا بإعطاء البروتين ما دام الالتهاب نشطًا. 5. المتابعة كجزء من الخطة لا ملحق لها كل تدخل في الكتاب يأتي معه مؤشر متابعة و موعد . إن لم تستطع تسمية ما ستقيسه بعد أسبوعين، فأنت لم تضع خطة بعد. والمتابعة قد تعيدك إلى التقييم إن تبيّن أن التشخيص كان خاطئًا. 6. الأدوية جزء من التقييم كل فصل مرضي يحتوي على جدول بالأدوية الشائعة وتأثيراتها الغذائية. هذا ما يفرّق أخصائي التغذية الإكلينيكي عن مصمّم الأنظمة: الأول يعرف أن مريض الميتفورمين يحتاج متابعة B12، وأن مريض الوارفارين يحتاج ثباتًا في فيتامين K لا منعه، وأن مريض المدرات قد يفقد البوتاسيوم والماغنسيوم. أرقام يجب أن تخرج بها الموضوع الرقم تقدير الطاقة العام للبالغ 25–35 kcal/كجم الطاقة في الرعاية الحرجة 25–30 kcal/كجم، والأدق القياس غير المباشر البروتين للمريض الحرج 1.2–2.0 جم/كجم البروتين في الكلى قبل الغسيل 0.55–0.8 جم/كجم البروتين مع الغسيل الدموي 1.0–1.2 جم/كجم البروتين في تليّف الكبد 1.2–1.5 جم/كجم الصوديوم في القلب والضغط أقل من 2000–2300 مجم/يوم فقد الوزن ذو الدلالة أكثر من 5% في شهر أو 10% في ستة أشهر السوائل للبالغ 30–35 مل/كجم بداية التغذية في خطر إعادة التغذية 10–15 kcal/كجم مع ثيامين مثال تطبيقي بأسلوب الكتاب مثال — مريض بعد سكتة دماغية: رجل 72 سنة، أُدخل منذ 5 أيام بسكتة، يعاني عسر بلع، يأكل أقل من ربع الوجبات، وزنه 68 كجم (المعتاد 74 كجم)، ألبيومين 3.0 و CRP 45. التقييم: فقد 8% من الوزن (جزء منه سابق للدخول)، مدخول ضعيف جدًا لخمسة أيام، الألبيومين منخفض بسبب الالتهاب أساسًا، والفحص البدني يُظهر تقعّرًا صدغيًا. التشخيص التغذوي (PES): مدخول فموي غير كافٍ مرتبط بـ عسر البلع بعد السكتة كما يتضح من تناول أقل من 25% من الوجبات لخمسة أيام وفقد 8% من الوزن. التدخل: إحالة لأخصائي التخاطب لتحديد القوام الآمن · طاقة 25–30 kcal/كجم ≈ 1700–2000 kcal · بروتين 1.2–1.5 جم/كجم ≈ 82–102 جم · إذا بقي المدخول أقل من 60% من الاحتياج خلال 5–7 أيام، يُنظر في تغذية معوية · مراقبة خطر إعادة التغذية. المتابعة: المدخول الفعلي يوميًا، الوزن مرتين أسبوعيًا، الفوسفات والبوتاسيوم والماغنسيوم في أول أيام التغذية، وإعادة تقييم القوام مع أخصائي التخاطب. لاحظ كيف أن التشخيص التغذوي ليس \"سكتة دماغية\"، وكيف أن كل تدخل مرتبط بمؤشر يُقاس. أخطاء شائعة عند قراءة الكتاب قراءته من الغلاف للغلاف. حجمه يجعل ذلك مرهقًا وغير مفيد. هو مرجع، لا رواية. حفظ الأرقام دون فهم سياقها. الأرقام تتغير مع تحديث الإرشادات؛ المنطق الذي يقف خلفها هو ما يبقى. الخلط بين التشخيصين الطبي والتغذوي في صياغة PES — أكثر خطأ يقع فيه المبتدئون. الاعتماد عليه وحده دون الإرشادات المحدّثة. بعض التوصيات تتقادم بين طبعة وأخرى، خصوصًا في السكري والكلى. تجاهل فصول التقييم والقفز مباشرة إلى الأمراض. من لا يتقن التقييم لا يحسن التدخل. كيف تذاكره: خطة ثمانية أسابيع الأسبوع المحتوى التطبيق 1 الهضم والامتصاص وتقدير الطاقة احسب احتياج 5 حالات بمعادلات مختلفة وقارن 2 التقييم الإكلينيكي والفحص البدني افحص 3 أشخاص فعليًا وسجّل ملاحظاتك 3 NCP وصياغة PES اكتب 15 صياغة لحالات متنوعة 4 توصيل الغذاء والدعم التغذوي صمم نظامًا معدّل القوام ووصفة معوية 5 السكري والغدد حل حالتين كاملتين 6 القلب والكلى حل حالتين كاملتين 7 الجهاز الهضمي والكبد حل حالتين كاملتين 8 الرعاية الحرجة والسرطان حل حالة معقدة متعددة الأجهزة بعد ذلك يصبح الكتاب مرجعًا: افتح فصل المرض عند كل حالة جديدة، واقرأه مرتين — قبل الحالة وبعدها. نقاط القوة والضعف القوة: الشمول الذي لا يضاهيه كتاب آخر، والمنهج الموحد عبر كل الفصول، وجداول تفاعلات الأدوية، والملاحق الغنية بالمعادلات والقيم المرجعية. الضعف: التوجه الأمريكي في الوحدات ونظام الرعاية وأنماط الغذاء، والحجم المرهق للمبتدئ، وتفاوت عمق الفصول لأنها مكتوبة بأقلام متعددة، وتقادم بعض التوصيات بين الطبعات. أسئلة للتأمل بعد القراءة 1. لماذا يُعدّ \"مدخول بروتين غير كافٍ\" تشخيصًا تغذويًا مقبولًا بينما \"نقص ألبيومين الدم\" ليس كذلك؟ 2. مريض وزنه ثابت لكنه ضعيف ومتورّم الساقين — ما الذي يخبرك به الفحص البدني ولا يخبرك به الميزان؟ 3. اكتب صياغة PES لنفسك عن عادة غذائية تريد تغييرها، وحدد مؤشر متابعة لها. ماذا تقرأ بعده؟ Nelms & Sucher لتحويل المعرفة إلى مهارة عبر الحالات · ASPEN Core Curriculum إذا كنت ستعمل في العناية المركزة · Lee & Nieman لتعميق مهارة التقييم · الإرشادات المحدّثة (ADA للسكري، KDIGO للكلى، ESPEN للتغذية الإكلينيكية) لإبقاء معرفتك حديثة."}, {"i": 32, "group": "books", "tag": "مكتبة المراجع", "num": "2", "short": "Gropper — الأيض", "html": "<h1>Advanced Nutrition and Human Metabolism</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المؤلفون</strong></td><td>Sareen S. Gropper و Jack L. Smith، وانضم إليهما Timothy P. Carr في الطبعات الحديثة</td></tr><tr><td><strong>المستوى</strong></td><td>متقدم — دراسات عليا</td></tr><tr><td><strong>الجمهور</strong></td><td>طلاب البكالوريوس المتقدمون والماجستير، الباحثون، من يريد فهم \"لماذا\"</td></tr><tr><td><strong>الطابع</strong></td><td>كتاب كيمياء حيوية تغذوية وأيض</td></tr><tr><td><strong>ما يسبقه</strong></td><td>Understanding Nutrition أو أي مقرر أساسيات</td></tr><tr><td><strong>ما يليه</strong></td><td>Krause للتطبيق الإكلينيكي، و McArdle للتطبيق الرياضي</td></tr></tbody></table></div>\n<h2>ما الذي يفعله هذا الكتاب ولا يفعله غيره؟</h2>\n<p>معظم كتب التغذية تقول لك <strong>ماذا</strong>: نقص الثيامين يسبب اعتلالًا عصبيًا، ونقص فيتامين C يسبب نزيف اللثة. هذا الكتاب يقول لك <strong>لماذا</strong> — وبعد أن تفهم \"لماذا\"، لن تحتاج إلى حفظ \"ماذا\".</p>\n<p>خذ الثيامين مثالًا. هو إنزيم مساعد لبيروفات ديهيدروجينيز، البوابة التي يعبر منها ناتج تحلل الجلوكوز إلى دورة كريبس. حين ينقص، يتوقف البيروفات عند البوابة ويتحول إلى لاكتات، وتجوع الخلايا الأكثر اعتمادًا على الجلوكوز — وهي الخلايا العصبية. هكذا يصبح الاعتلال العصبي نتيجة منطقية لا معلومة محفوظة. وبالمنطق نفسه تفهم لماذا يُعطى الثيامين <strong>قبل</strong> إعادة تغذية المريض المستنزف: لأن تدفق الجلوكوز المفاجئ يستهلك ما تبقى منه.</p>\n<p>هذه الطريقة في التفكير — اشتقاق النتيجة من الآلية — هي ما يمنحه الكتاب، وهي ما يميز المتخصص الحقيقي.</p>\n<h2>خريطة الكتاب</h2>\n<h3>الأساس الخلوي والهضمي</h3>\n<p>يبدأ بالخلية: الأغشية وأنظمة النقل (انتشار بسيط، مُيسَّر، نقل نشط)، العضيات، وأين يحدث كل مسار. ثم الجهاز الهضمي بالتفصيل: الإنزيمات، الهرمونات المعوية، آليات الامتصاص لكل مغذٍّ، والدورة الكبدية المعوية.</p>\n<h3>الكربوهيدرات</h3>\n<ul><li>البنية والتصنيف، الهضم والامتصاص (ناقلات SGLT1 و GLUT5 و GLUT2).</li><li><strong>تحلل الجلوكوز (Glycolysis):</strong> خطواته، نقاط تنظيمه، ناتجه الصافي.</li><li><strong>دورة كريبس والفوسفتة التأكسدية:</strong> كيف يتحول الأسيتيل كو-أ إلى طاقة.</li><li><strong>مسار البنتوز فوسفات:</strong> مصدر NADPH للتخليق والدفاع المضاد للأكسدة.</li><li><strong>تكوين الجلوكوز وتخليق الجليكوجين وتحلله.</strong></li><li>التنظيم الهرموني: الإنسولين مقابل الجلوكاجون والكورتيزول والأدرينالين.</li></ul>\n<h3>الألياف</h3>\n<p>تصنيفها، خصائصها الفيزيائية (اللزوجة، القابلية للتخمر)، وآثارها على الامتصاص والميكروبيوم والدهون.</p>\n<h3>الدهون</h3>\n<ul><li>الهضم بالأملاح الصفراوية والليباز، وتكوين المذيلات (Micelles).</li><li><strong>النقل:</strong> الكيلوميكرونات، VLDL، LDL، HDL — ومن يحمل ماذا إلى أين.</li><li><strong>بيتا أكسدة</strong> ودور الكارنيتين في إدخال الأحماض الدهنية الطويلة إلى الميتوكوندريا.</li><li><strong>تخليق الأحماض الدهنية</strong> في الحالة الممتلئة.</li><li><strong>الأجسام الكيتونية:</strong> متى تتكون ومن يستخدمها.</li><li>الكوليسترول وتخليقه وتنظيمه، والأيكوسانويدات المشتقة من أوميجا-3 وأوميجا-6.</li></ul>\n<h3>البروتين والأحماض الأمينية</h3>\n<ul><li>الهضم والامتصاص، <strong>دوران البروتين (Protein turnover)</strong>.</li><li><strong>نقل الأمين ونزعه</strong>، و<strong>دورة اليوريا</strong> في الكبد.</li><li>الأحماض الأمينية الجلوكوزية والكيتونية، ومصير الهيكل الكربوني لكل منها.</li><li>الأحماض الأمينية كسلائف: الهيم، النواقل العصبية، الكرياتين، الكارنيتين.</li><li>تقييم جودة البروتين وحالته في الجسم.</li></ul>\n<h3>تكامل الأيض وتوازن الطاقة</h3>\n<p>الفصل الذي يجمع كل ما سبق: كيف تتعاون الأعضاء (الكبد، العضل، الدهون، المخ) في الحالات المختلفة، وكيف يُنظَّم توازن الطاقة.</p>\n<h3>الفيتامينات</h3>\n<p>كل فيتامين بنفس القالب: المصادر، الهضم والامتصاص، النقل، الوظيفة على المستوى الإنزيمي، التفاعلات مع مغذيات أخرى، الإخراج، المرجعيات الغذائية، النقص والسمية، تقييم الحالة.</p>\n<h3>المعادن الكبرى والعناصر النزرة</h3>\n<p>الكالسيوم والفوسفور والماغنسيوم، ثم الحديد والزنك والنحاس واليود والسيلينيوم والمنجنيز والكروم والموليبدنوم وغيرها — بنفس القالب، مع اهتمام خاص بآليات تنظيم الامتصاص.</p>\n<h3>الماء والإلكتروليتات والتطبيقات</h3>\n<p>توازن السوائل والصوديوم والبوتاسيوم والكلور، ثم فصول تطبيقية عن النشاط البدني ومراحل الحياة.</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. الحالات الأيضية الأربع</h3>\n<p>هذا أهم إطار في الكتاب، لأنه يفسّر الرجيم والصيام والسكري وإعادة التغذية دفعة واحدة.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>الحالة</th><th>التوقيت التقريبي</th><th>الهرمون السائد</th><th>ما يحدث</th></tr></thead><tbody><tr><td><strong>ممتلئة (Fed)</strong></td><td>0–4 ساعات بعد الأكل</td><td>الإنسولين</td><td>تخزين: جليكوجين، دهون، بناء بروتين</td></tr><tr><td><strong>ما بعد الامتصاص</strong></td><td>4–16 ساعة</td><td>الجلوكاجون يبدأ</td><td>تحلل الجليكوجين الكبدي لإبقاء السكر</td></tr><tr><td><strong>صيام قصير</strong></td><td>16–48 ساعة</td><td>الجلوكاجون والكورتيزول</td><td>تكوين جلوكوز جديد، تحلل دهون متزايد</td></tr><tr><td><strong>جوع مطوّل</strong></td><td>أكثر من بضعة أيام</td><td>—</td><td>المخ يتحول للكيتونات، تباطؤ الأيض، حفظ البروتين</td></tr></tbody></table></div>\n<p><strong>الدرس الإكلينيكي:</strong> المريض الذي لم يأكل أسبوعًا يعيش في الحالة الرابعة. إعطاؤه كربوهيدرات كثيرة فجأة يقلبه إلى الحالة الأولى بعنف: يرتفع الإنسولين، فتُسحب الفوسفات والبوتاسيوم والماغنسيوم إلى داخل الخلايا لبناء الجليكوجين والبروتين، فينهار مستواها في الدم. هذه هي متلازمة إعادة التغذية — مشتقة بالكامل من فهم الحالات الأيضية.</p>\n<h3>2. لماذا لا تتحول الدهون إلى جلوكوز؟</h3>\n<p>لأن الأحماض الدهنية تتكسر إلى أسيتيل كو-أ، وتفاعل تحويل البيروفات إلى أسيتيل كو-أ <strong>غير عكوس</strong>. لا يوجد طريق صافٍ للعودة. الاستثناء هو الجليسرول (العمود الفقري للدهون الثلاثية) والأحماض الدهنية فردية الكربون.</p>\n<p><strong>النتيجة العملية:</strong> في الصيام الطويل، يحتاج المخ جلوكوزًا لا تستطيع الدهون توفيره، فيُهدم البروتين العضلي لتوفير أحماض أمينية جلوكوزية — إلى أن يتكيف المخ مع الكيتونات فيقل الهدم. لهذا يحتاج المريض المستنزف بروتينًا كافيًا، ولهذا يحمي الحد الأدنى من الكربوهيدرات العضلات.</p>\n<h3>3. الفيتامين = إنزيم مساعد في تفاعل محدد</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الفيتامين</th><th>الشكل النشط</th><th>التفاعل</th><th>النقص المشتق منطقيًا</th></tr></thead><tbody><tr><td>B1 ثيامين</td><td>TPP</td><td>بيروفات ديهيدروجينيز، ترانسكيتولاز</td><td>تعطّل أيض الجلوكوز ← أعراض عصبية وقلبية</td></tr><tr><td>B2 ريبوفلافين</td><td>FAD, FMN</td><td>نقل الإلكترونات</td><td>التهاب الأغشية المخاطية (الفم واللسان)</td></tr><tr><td>B3 نياسين</td><td>NAD, NADP</td><td>الأكسدة والاختزال</td><td>الأنسجة سريعة الدوران: جلد، أمعاء، مخ</td></tr><tr><td>B6</td><td>PLP</td><td>نقل الأمين، تخليق الهيم والنواقل</td><td>فقر دم، أعراض عصبية</td></tr><tr><td>فولات</td><td>THF</td><td>نقل وحدة الكربون الواحدة ← DNA</td><td>خلايا لا تنقسم: فقر دم ضخم الأرومات</td></tr><tr><td>B12</td><td>ميثيل وأدينوسيل كوبالامين</td><td>ميثيونين سينثيز، ميثيل مالونيل كو-أ ميوتاز</td><td>فقر دم ضخم + تلف الميالين</td></tr><tr><td>C</td><td>—</td><td>هيدروكسلة البرولين والليسين</td><td>كولاجين ضعيف: نزيف، جروح لا تلتئم</td></tr><tr><td>K</td><td>—</td><td>كربوكسلة جاما</td><td>عوامل تخثر غير فعالة: نزيف</td></tr></tbody></table></div>\n<p><strong>لماذا يسبب B12 أعراضًا عصبية والفولات لا؟</strong> لأن B12 يعمل في تفاعل ثانٍ (ميثيل مالونيل كو-أ ميوتاز) ضروري لتكوين الميالين، والفولات لا يدخل فيه. لهذا إعطاء الفولات لمريض نقص B12 يصحح فقر الدم ويُخفي التشخيص بينما يستمر التلف العصبي — خطأ خطير يمنعه فهم الآلية.</p>\n<h3>4. تنظيم امتصاص الحديد</h3>\n<p>مثال الكتاب الأوضح على أن <strong>\"الأكل\" ليس \"الامتصاص\"</strong>:</p>\n<ul><li>الحديد يُمتص في الاثناعشر ويخرج من الخلية المعوية إلى الدم عبر <strong>الفيروبورتين</strong>.</li><li>الكبد يفرز <strong>الهيبسيدين</strong> حين يكون مخزون الحديد كافيًا — أو حين يوجد التهاب.</li><li>الهيبسيدين يُغلق الفيروبورتين، فيُحتجز الحديد داخل الخلايا المعوية ويُفقد معها حين تتجدد.</li></ul>\n<p><strong>النتيجة:</strong> في الالتهاب المزمن يرتفع الهيبسيدين، فلا يُمتص الحديد الغذائي ولا يخرج المخزون — فينشأ فقر دم الأمراض المزمنة بفيريتين <strong>مرتفع</strong>. إعطاء حديد فموي هنا لن يفيد كثيرًا، والعلاج هو السيطرة على الالتهاب. وهذا أيضًا سبب أن مكمل الحديد يومًا بعد يوم قد يُمتص أفضل من الجرعة اليومية: كل جرعة ترفع الهيبسيدين لساعات.</p>\n<h3>5. التفاعلات بين المغذيات</h3>\n<ul><li><strong>الزنك والنحاس:</strong> الزنك الزائد يحفّز بروتين الميتالوثيونين الذي يحتجز النحاس ← نقص نحاس قد يسبب فقر دم واعتلالًا عصبيًا.</li><li><strong>فيتامين D والكالسيوم والفوسفور:</strong> الشكل النشط من D يرفع امتصاص الاثنين.</li><li><strong>فيتامين C والحديد:</strong> يختزل الحديد الثلاثي إلى ثنائي القابل للامتصاص.</li><li><strong>الفولات و B12:</strong> متشابكان في دورة الميثيل.</li></ul>\n<h2>أرقام وحقائق يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الحقيقة</th></tr></thead><tbody><tr><td>الناتج الصافي لتحلل الجلوكوز</td><td>2 ATP لكل جزيء جلوكوز</td></tr><tr><td>الناتج الكلي للأكسدة الكاملة للجلوكوز</td><td>نحو 30–32 ATP</td></tr><tr><td>احتياج المخ من الجلوكوز</td><td>نحو 120 جم يوميًا قبل التكيف الكيتوني</td></tr><tr><td>مخزون الجليكوجين الكبدي</td><td>ينفد خلال 12–24 ساعة صيام تقريبًا</td></tr><tr><td>الماء المحتجز مع الجليكوجين</td><td>نحو 3 جم لكل 1 جم</td></tr><tr><td>الأحماض الأمينية الكيتوجينية الصرفة</td><td>الليوسين والليسين</td></tr><tr><td>موقع امتصاص B12</td><td>اللفائفي النهائي بعد ارتباطه بالعامل الداخلي</td></tr><tr><td>الشكل النشط من فيتامين D</td><td>1,25-ثنائي هيدروكسي، يتكوّن في الكلى</td></tr><tr><td>تحويل التريبتوفان إلى نياسين</td><td>نحو 60 مجم تريبتوفان = 1 مجم نياسين</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — اشتقاق لا حفظ:</strong> مريض مدمن كحول، نحيف، أُدخل المستشفى وبدأوا له محلولًا وريديًا
