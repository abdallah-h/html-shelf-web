ديوم <2300 مجم/يوم ، والأفضل 1500 مجم لمن لديه ضغط مرتفع (خفض ~5–6/3 mmHg). بوتاسيوم، ماغنسيوم، كالسيوم عالية (خضار، فاكهة، ألبان قليلة الدسم). الوزن: كل 1 كجم فقد ≈ 1 mmHg خفض تقريبًا. تقليل الكحول والتدخين، ونشاط هوائي منتظم. دهون الدم الهدف التدخل ↓ LDL استبدال المشبعة بأحادية/متعددة غير المشبعة؛ ألياف ذائبة 5–10 جم/يوم؛ ستيرولات نباتية 2 جم/يوم (↓ ~8–10%)؛ خسارة وزن ↓ الدهون الثلاثية تقليل السكريات المضافة والكحول؛ فقد وزن؛ أوميجا 3 (EPA/DHA 2–4 جم بإشراف) ↑ HDL نشاط بدني، ترك التدخين (الغذاء أثره محدود) قصور القلب تقييد صوديوم (عادة 2000 مجم)، مراقبة الوزن اليومي (زيادة 2 كجم في 3 أيام = احتباس)، تقييد سوائل في الحالات المتقدمة (1.5–2 لتر)، والانتباه لـ الدنف القلبي (Cardiac cachexia) الذي يحتاج دعمًا بروتينيًا وسعرات. 3.3 السمنة وإدارة الوزن العجز الآمن: 500–750 kcal/يوم → 0.5–0.75 كجم/أسبوع. البروتين المرتفع (1.2–1.6 جم/كجم) يحافظ على الكتلة العضلية ويزيد الشبع. تدريب المقاومة ضروري وليس اختياريًا. التكيف الأيضي: انخفاض RMR وNEAT مع الفقد → فترات صيانة (Diet breaks) مفيدة نفسيًا وأيضيًا. الأدوية الحديثة (منبهات GLP 1) غيّرت المشهد لكنها تتطلب مراقبة تغذوية دقيقة: انخفاض حاد للمدخول → خطر نقص البروتين والمغذيات الدقيقة وفقدان كتلة عضلية ؛ التدخل الغذائي هنا محوري. بعد جراحات السمنة المرحلة المحتوى 1 سوائل صافية 2 سوائل كاملة/بروتين مخفّف 3 مهروس 4 طري ثم عادي (خلال 6–8 أسابيع) قواعد مدى الحياة: بروتين 60–80+ جم/يوم ، وجبات صغيرة متكررة، مضغ جيد، فصل السوائل عن الطعام (30 دقيقة)، مكملات إلزامية : فيتامينات متعددة، B12، حديد، كالسيوم سيترات، فيتامين D، ثيامين. مراقبة متلازمة الإغراق (Dumping) مع السكريات المركزة. 3.4 أمراض الكلى المزمنة (CKD) المرحلة تقدير GFR محاور التغذية 1–2 ≥60 ضبط ضغط وسكر، صوديوم <2300 3–4 15–59 بروتين 0.55–0.8 جم/كجم ، تقييد فوسفور، مراقبة بوتاسيوم 5 (بدون غسيل) <15 نفس التقييد بإشراف دقيق غسيل دموي — بروتين 1.0–1.2 جم/كجم (لتعويض الفقد)، سوائل مقيّدة، بوتاسيوم وفوسفور مقيّدان غسيل بريتوني — بروتين 1.2–1.3؛ احتساب السعرات الممتصة من الجلوكوز في المحلول نقاط عملية: الفوسفور: تجنّب الفوسفات المضاف (أخطر من العضوي لأن امتصاصه ~100%) — ابحث عن \"PHOS\" في المكونات (مشروبات غازية داكنة، لحوم مصنعة، أجبان مطبوخة). البوتاسيوم: يُقيَّد حسب التحليل لا روتينيًا. تقنية النقع والسلق (Leaching) تقلل بوتاسيوم البطاطس والخضار. بدائل الملح تحتوي كلوريد بوتاسيوم → خطرة في الفشل الكلوي. حصوات الكلى (أكسالات كالسيوم): ماء ≥2.5 لتر، تقليل صوديوم وبروتين حيواني، الحفاظ على كالسيوم غذائي طبيعي (تقييده يزيد الحصوات لأنه لا يرتبط بالأكسالات في الأمعاء)، تقليل الأطعمة عالية الأكسالات (سبانخ، شاي أسود، مكسرات) في المستجيبين. 3.5 أمراض الكبد الكبد الدهني (MASLD/NAFLD): التدخل الأول والأقوى هو فقد 7–10% من الوزن ؛ تقليل الفركتوز المضاف والكحول؛ النمط المتوسطي؛ قهوة (أدلة رصدية إيجابية). تليف الكبد: سوء التغذية شائع جدًا ويُغفَل بسبب الاستسقاء. طاقة 30–35 kcal/كجم · بروتين 1.2–1.5 جم/كجم (لا يُقيَّد إلا نادرًا وباستثناءات). وجبة ليلية خفيفة غنية بالكربوهيدرات (50 جم) لتقصير فترة الصيام الليلي ومنع هدم العضلات. الاستسقاء: صوديوم <2000 مجم. الاعتلال الدماغي الكبدي: العلاج هو اللاكتيولوز/الريفاكسيمين وليس تجويع المريض من البروتين؛ قد تُستخدم مصادر نباتية/ألبان و BCAA . 3.6 الجهاز الهضمي الحالة جوهر التدخل الارتجاع (GERD) وجبات صغيرة، عدم الاستلقاء 3 ساعات بعد الأكل، رفع رأس السرير، إنقاص وزن، وتجنّب المحفزات الفردية (دهون عالية، شوكولاتة، نعناع، حمضيات، قهوة) — لا قائمة منع موحدة للجميع السيلياك امتناع تام مدى الحياة عن الجلوتين (قمح، شعير، شيلم)، الانتباه للتلوث المتقاطع، ومراقبة نقص الحديد/الفولات/B12/D؛ الشوفان النقي مسموح لأغلب المرضى القولون العصبي (IBS) حمية FODMAP منخفضة بثلاث مراحل: تقييد 2–6 أسابيع ← إعادة إدخال منهجية ← تخصيص. لا تُترك كحمية دائمة لأنها تضر ميكروبيوم القولون أمراض الأمعاء الالتهابية (IBD) أثناء النوبة: تقليل ألياف غير ذائبة، طاقة وبروتين عاليان، مراقبة حديد وB12 (خصوصًا بعد استئصال اللفائفي) وفيتامين D. في الهدأة: نظام متنوع. EEN (تغذية معوية حصرية) علاج أول فعّال في كرون عند الأطفال الإمساك ألياف تدريجية + سوائل + حركة؛ الألياف بلا ماء تزيد المشكلة عدم تحمل اللاكتوز ليس منعًا كاملًا؛ أغلب المرضى يتحملون 12 جم لاكتوز (كوب لبن) مع وجبة، والزبادي والأجبان الصلبة عادة مقبولة 3.7 حالات أخرى مهمة النقرس تقليل البيورينات عالية المصدر الحيواني: اللحوم العضوية، المحاريات، السردين والأنشوجة، مرق اللحم. تجنّب الفركتوز المضاف والبيرة (تحديدًا). البيورينات النباتية (بقول، سبانخ) لا ترتبط بزيادة النوبات. ألبان قليلة الدسم واقية · ماء وفير · إنقاص وزن تدريجي (الصيام القاسي يفجّر نوبة). فقر الدم بنقص الحديد حديد هيمي + فيتامين C · تجنّب الشاي والقهوة والكالسيوم مع الوجبة (بفاصل ساعتين). المكمل: جرعة يومًا بعد يوم قد تكون أفضل امتصاصًا من التقسيم اليومي (لأن الهيبسيدين يرتفع بعد الجرعة). الأمراض الحرجة / الحروق / الإنتان طاقة: 25–30 kcal/كجم (والأدق هو قياس السعرات غير المباشر Indirect calorimetry ). بروتين: 1.2–2.0 جم/كجم (وأعلى في الحروق). قاعدة ذهبية: إذا كانت الأمعاء تعمل — استخدمها (تغذية معوية Enteral خلال 24–48 ساعة) لحفظ سلامة الحاجز المعوي؛ التغذية الوريدية (Parenteral) عند تعذّر المعوية. ⚠️ متلازمة إعادة التغذية (Refeeding Syndrome) من الخطر: صيام 5 أيام، BMI منخفض جدًا، فقد وزن سريع، إدمان كحول، فقدان شهية عصبي. الآلية: عودة الكربوهيدرات ← ارتفاع الإنسولين ← دخول الفوسفات والبوتاسيوم والماغنسيوم إلى الخلايا ← انخفاض حاد في فوسفات الدم ← فشل قلبي تنفسي وقد يقود للوفاة. الوقاية: ابدأ بـ 10–15 kcal/كجم/يوم وارفع تدريجيًا خلال 4–7 أيام، أعطِ الثيامين قبل التغذية ، وراقب الفوسفات والبوتاسيوم والماغنسيوم يوميًا في البداية. السرطان مواجهة الدنف (Cachexia)، طاقة 25–30 kcal/كجم وبروتين 1.2–1.5، إدارة الأعراض (غثيان، تغيّر التذوق، التهاب الغشاء المخاطي، جفاف الفم) بأطعمة كثيفة الطاقة وصغيرة الحجم. لا يوجد نظام غذائي يعالج السرطان ، والحميات التقييدية القاسية تزيد سوء التغذية وتضر النتائج. 3.8 تفاعلات الدواء والغذاء — الأشهر الدواء التفاعل وارفارين فيتامين K → ثبّت المدخول ولا تمنعه مثبطات MAO التيرامين (أجبان معتّقة، مخللات، لحوم مقددة) → أزمة ضغط الستاتينات الجريب فروت يثبط CYP3A4 → ارتفاع تركيز الدواء ليفوثيروكسين كالسيوم/حديد/صويا/قهوة → على معدة فارغة بفاصل 4 ساعات عن المعادن ميتفورمين نقص B12 على المدى الطويل مثبطات مضخة البروتون نقص B12، ماغنسيوم، وامتصاص الكالسيوم مدرات اللوب (فوروسيميد) فقد بوتاسيوم وماغنسيوم مدرات موفّرة للبوتاسيوم / ACEi خطر فرط بوتاسيوم → حذر من بدائل الملح تتراسيكلين/كينولونات تُثبَّط بالكالسيوم والحديد"}, {"i": 4, "group": "guide", "tag": "تقييم", "num": "4", "short": "تقييم الحالة الغذائية", "html": "<h1>الجزء الرابع: تقييم الحالة الغذائية (Nutritional Assessment)</h1>\n<h2>4.1 الإطار: ABCDEF</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الحرف</th><th>المحور</th><th>مثال</th></tr></thead><tbody><tr><td><strong>A</strong></td><td>Anthropometric — القياسات الجسمية</td><td>الوزن، الطول، BMI، محيط الخصر، سُمك الجلد</td></tr><tr><td><strong>B</strong></td><td>Biochemical — التحاليل</td><td>ألبيومين، فيريتين، HbA1c، فيتامين D</td></tr><tr><td><strong>C</strong></td><td>Clinical — الفحص الإكلينيكي</td><td>الجلد، الشعر، الأظافر، الفم، الوذمة</td></tr><tr><td><strong>D</strong></td><td>Dietary — التقييم الغذائي</td><td>استرجاع 24 ساعة، سجل الطعام، FFQ</td></tr><tr><td><strong>E</strong></td><td>Environmental/Economic</td><td>الدخل، الأمن الغذائي، الثقافة، من يطبخ</td></tr><tr><td><strong>F</strong></td><td>Functional</td><td>قوة القبضة، سرعة المشي، الأنشطة اليومية</td></tr></tbody></table></div>\n<blockquote class=\"note\"><p><strong>مبدأ أساسي:</strong> لا يوجد مؤشر واحد يشخّص سوء التغذية. التشخيص يكون بتقاطع مؤشرات من محاور مختلفة.</p></blockquote>\n<hr>\n<h2>4.2 A — القياسات الجسمية</h2>\n<h3>مؤشر كتلة الجسم</h3>\n<p><code>BMI = الوزن (كجم) ÷ (الطول بالمتر)²</code></p>\n<div class=\"tablewrap\"><table><thead><tr><th>التصنيف</th><th>BMI</th></tr></thead><tbody><tr><td>نقص وزن</td><td>&lt;18.5</td></tr><tr><td>طبيعي</td><td>18.5–24.9</td></tr><tr><td>زيادة وزن</td><td>25–29.9</td></tr><tr><td>سمنة درجة 1 / 2 / 3</td><td>30–34.9 / 35–39.9 / <span class=\"ltr\">≥40</span></td></tr></tbody></table></div>\n<blockquote class=\"danger\"><p><strong>عتبات آسيوية أدنى:</strong> زيادة الوزن تبدأ من 23 والسمنة من 27.5، لارتفاع الخطر الأيضي عند BMI أقل. <strong>حدود BMI:</strong> لا يميّز العضل من الدهن (رياضي القوة يظهر \"سمينًا\")، ولا يوضح التوزيع، ويضلّل مع الوذمة والاستسقاء والحمل وكبار السن.</p></blockquote>\n<h3>محيط الخصر (مؤشر الدهون الحشوية — الأهم للخطر الأيضي)</h3>\n<ul><li>خطر مرتفع: <strong>&gt;102 سم للرجال، &gt;88 سم للنساء</strong> (وعتبات أدنى للآسيويين: 90/80).</li><li><strong>نسبة الخصر إلى الطول (WHtR):</strong> قاعدة عملية ممتازة → <strong>حافظ على محيط خصرك أقل من نصف طولك</strong>.</li></ul>\n<h3>قياسات إضافية</h3>\n<ul><li><strong>سُمك ثنايا الجلد (Skinfolds):</strong> بمقياس معاير (Harpenden) وبروتوكول موحّد (ISAK). الأدق هو <strong>تتبع مجموع الثنايا (Sum of skinfolds) عبر الزمن</strong> لا تحويله لنسبة دهون بمعادلة تحمل خطأ <span class=\"ltr\">±3</span>–5%.</li><li><strong>محيط منتصف العضد (MUAC):</strong> بديل ممتاز حين يتعذر الوزن (طريح فراش، وذمة)، وأساسي في مسح سوء التغذية الحاد لدى الأطفال.</li><li><strong>BIA (المقاومة الحيوية):</strong> سهل ورخيص لكنه شديد الحساسية للترطيب والوجبة والتمرين → قياس صباحي صائم بشروط ثابتة، وقارن الاتجاه لا الرقم المطلق.</li><li><strong>DEXA:</strong> المعيار العملي الذهبي في البحث؛ يعطي أيضًا كثافة العظام وتوزيع الدهون. مكلف.</li><li><strong>قياس السعرات غير المباشر (Indirect calorimetry):</strong> المعيار الذهبي لقياس REE الفعلي في المرضى الحرجين.</li></ul>\n<h3>حسابات وزن مفيدة</h3>\n<ul><li><strong>% تغيّر الوزن = [(الوزن المعتاد − الوزن الحالي) ÷ الوزن المعتاد] × 100</strong></li><li><strong>دلالة الفقد غير المقصود:</strong> &gt;5% في شهر أو <strong>&gt;10% في 6 أشهر = علامة حمراء</strong> لسوء التغذية.</li></ul>\n<hr>\n<h2>4.3 B — التحاليل وتفسيرها بحذر</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>التحليل</th><th>يقيس</th><th>تحذير التفسير</th></tr></thead><tbody><tr><td><strong>ألبيومين</strong></td><td>ليس مؤشر تغذية جيدًا!</td><td>بروتين طور حاد <strong>سالب</strong>: ينخفض مع الالتهاب والإنتان والكبد والكلى وزيادة السوائل. عمره النصفي ~20 يومًا</td></tr><tr><td><strong>بريألبيومين (ترانستيريتين)</strong></td><td>أسرع استجابة (نصف عمر ~2 يوم)</td><td>يتأثر بالالتهاب أيضًا → لا يُستخدم منفردًا</td></tr><tr><td><strong>CRP</strong></td><td>شدة الالتهاب</td><td>يُقرأ <strong>بجانب</strong> الألبيومين لتمييز الالتهاب عن نقص التغذية</td></tr><tr><td><strong>الهيموجلوبين/MCV</strong></td><td>فقر الدم</td><td>MCV منخفض → حديد/ثلاسيميا · مرتفع → B12/فولات</td></tr><tr><td><strong>فيريتين</strong></td><td>مخزون الحديد</td><td><strong>بروتين طور حاد موجب</strong> → يرتفع كذبًا مع الالتهاب؛ اقرأه مع CRP وتشبع الترانسفيرين</td></tr><tr><td><strong>HbA1c</strong></td><td>متوسط سكر 2–3 شهور</td><td>يضلّل مع فقر الدم الانحلالي، النزيف، الحمل، الهيموجلوبين غير الطبيعي</td></tr><tr><td><strong>25(OH)D</strong></td><td>مخزون فيتامين D</td><td>نقص &lt;20 نانوجرام/مل · غير كافٍ 20–29</td></tr><tr><td><strong>توازن النيتروجين</strong></td><td>الابتناء/الهدم</td><td><code>= (بروتين÷6.25) − (يوريا البول 24س + 4)</code></td></tr><tr><td><strong>كرياتينين/eGFR، يوريا، إلكتروليتات، وظائف كبد، دهون</strong></td><td>أساسية قبل أي خطة علاجية</td><td></td></tr></tbody></table></div>\n<hr>\n<h2>4.4 C — علامات إكلينيكية للنقص</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>العلامة</th><th>يشير إلى</th></tr></thead><tbody><tr><td>شحوب الملتحمة، تقعّر الأظافر (Koilonychia)</td><td>حديد</td></tr><tr><td>تشقق زوايا الفم (Angular cheilitis)، التهاب اللسان</td><td>ريبوفلافين، B6، B12، حديد</td></tr><tr><td>نزيف اللثة، كدمات، شعر \"لولبي\"</td><td>فيتامين C</td></tr><tr><td>العشى الليلي، بقع بيتو</td><td>فيتامين A</td></tr><tr><td>تنمّل، ضعف حس الاهتزاز، فقد التوازن</td><td>B12</td></tr><tr><td>جلد متقشر متصبغ في المناطق المعرضة للشمس</td><td>نياسين (بلاجرا)</td></tr><tr><td>وذمة الطرفين، هزال، ضمور صدغي وبين العظام</td><td>نقص طاقة/بروتين</td></tr><tr><td>تساقط شعر، ضعف التئام جرح</td><td>زنك، بروتين</td></tr><tr><td>تضخم الغدة الدرقية</td><td>يود</td></tr></tbody></table></div>\n<hr>\n<h2>4.5 D — التقييم الغذائي: الأدوات وحدودها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأداة</th><th>آلية</th><th>ميزة</th><th>عيب</th></tr></thead><tbody><tr><td><strong>استرجاع 24 ساعة</strong></td><td>ذكر كل ما أُكل أمس بالتفصيل</td><td>سريع، لا يغيّر السلوك</td><td>يوم واحد لا يمثّل النمط؛ يعتمد على الذاكرة</td></tr><tr><td><strong>سجل الطعام 3–7 أيام</strong></td><td>تسجيل لحظي (يُفضّل بالوزن)</td><td>الأدق للفرد</td><td>عبء عالٍ؛ <strong>يغيّر السلوك أثناء التسجيل</strong></td></tr><tr><td><strong>استبيان تكرار الطعام (FFQ)</strong></td><td>تكرار أطعمة خلال شهور</td><td>ممتاز للأنماط والدراسات الوبائية</td><td>تقدير كمي ضعيف</td></tr><tr><td><strong>تاريخ غذائي (Diet History)</strong></td><td>مقابلة شاملة عن النمط المعتاد</td><td>صورة واقعية</td><td>يحتاج مهارة ووقتًا</td></tr><tr><td><strong>مراقبة الوجبات (Calorie count)</strong></td><td>في المستشفى</td><td>موضوعي</td><td>لوجيستي</td></tr></tbody></table></div>\n<p><strong>تصحيح متعدد المرور (Multiple-pass method):</strong> الأسلوب المعياري لاسترجاع 24 ساعة — 5 مرات: قائمة سريعة ← أطعمة منسية شائعة ← التوقيت والمناسبة ← تفاصيل الكمية والتحضير ← مراجعة نهائية.</p>\n<blockquote class=\"note\"><p><strong>حقيقة مهنية:</strong> التبليغ الناقص (Under-reporting) يصل إلى <strong>20–50%</strong> خصوصًا لدى ذوي السمنة، ويقترن غالبًا بحذف الوجبات الخفيفة والمشروبات والزيوت. الحل ليس اتهام العميل، بل الاعتماد على <strong>النتيجة (تغيّر الوزن)</strong> كمرجع حَكَم.</p></blockquote>\n<hr>\n<h2>4.6 أدوات المسح والتشخيص المعتمدة</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأداة</th><th>الاستخدام</th></tr></thead><tbody><tr><td><strong>MUST</strong></td><td>مسح عام (مجتمع ومستشفى): BMI + فقد الوزن + أثر المرض الحاد</td></tr><tr><td><strong>NRS-2002</strong></td><td>مسح مرضى المستشفيات (يوصي به ESPEN)</td></tr><tr><td><strong>MNA / MNA-SF</strong></td><td>كبار السن</td></tr><tr><td><strong>SGA</strong> (التقييم الشامل الذاتي)</td><td>تقييم إكلينيكي شامل: تاريخ + فحص → درجات A/B/C</td></tr><tr><td><strong>STRONGkids / STAMP</strong></td><td>الأطفال</td></tr><tr><td><strong>معايير GLIM</strong></td><td><strong>الإطار العالمي الحديث لتشخيص سوء التغذية</strong></td></tr></tbody></table></div>\n<h3>معايير GLIM — خطوتان</h3>\n<ol><li><strong>مسح</strong> بأداة معتمدة.</li><li><strong>تشخيص</strong> يتطلب <strong>معيارًا ظاهريًا واحدًا + معيارًا سببيًا واحدًا</strong>:</li></ol>\n<div class=\"tablewrap\"><table><thead><tr><th>ظاهرية (Phenotypic)</th><th>سببية (Etiologic)</th></tr></thead><tbody><tr><td>فقد وزن غير مقصود</td><td>نقص المدخول أو سوء الامتصاص</td></tr><tr><td>انخفاض BMI</td><td>عبء المرض/الالتهاب</td></tr><tr><td>انخفاض الكتلة العضلية</td><td></td></tr></tbody></table></div>\n<p>ثم تُحدَّد الشدة (متوسط/شديد).</p>\n<hr>\n<h2>4.7 حالة تقييم كاملة (نموذج عملي)</h2>\n<blockquote class=\"note\"><p><strong>الحالة:</strong> سيدة 68 سنة، دخلت المستشفى بالتهاب رئوي. الوزن المعتاد 70 كجم، الحالي 61 كجم منذ 4 أشهر. الطول 160 سم. تشتكي ضعف شهية. ألبيومين 2.8 جم/دل، CRP 85 مجم/ل، Hb 10.4، قوة القبضة منخفضة.</p></blockquote>\n<p><strong>التحليل:</strong></p>\n<ul><li>BMI = 61 ÷ (1.6)² = <strong>23.8</strong> → \"طبيعي\" ظاهريًا — وهذا فخ.</li><li>% فقد الوزن = (70−61)÷70 × 100 = <strong>12.9% في 4 أشهر</strong> → <strong>فقد شديد</strong>.</li><li>الألبيومين منخفض لكن CRP مرتفع → الانخفاض <strong>التهابي بالأساس</strong>، فلا يُقرأ كدليل تغذوي مباشر.</li><li><strong>GLIM:</strong> ظاهري (فقد وزن &gt;10%/6 شهور + نقص كتلة عضلية) + سببي (التهاب حاد + نقص مدخول) → <strong>سوء تغذية شديد</strong>.</li></ul>\n<p><strong>الخطة الأولية:</strong></p>\n<ul><li>طاقة: 25–30 kcal/كجم ≈ <strong>1500–1800 kcal</strong> (تدرّج إذا كان خطر إعادة التغذية قائمًا).</li><li>بروتين: 1.2–1.5 جم/كجم ≈ <strong>73–92 جم/يوم</strong>.</li><li>وجبات صغيرة كثيفة الطاقة + مكمل فموي (ONS) بين الوجبات + مكمل متعدد الفيتامينات.</li><li>متابعة: وزن مرتين أسبوعيًا، مدخول فعلي يوميًا، إلكتروليتات (فوسفات/بوتاسيوم/ماغنسيوم)، قوة القبضة أسبوعيًا.</li></ul>\n<hr>", "text": "الجزء الرابع: تقييم الحالة الغذائية (Nutritional Assessment) 4.1 الإطار: ABCDEF الحرف المحور مثال A Anthropometric — القياسات الجسمية الوزن، الطول، BMI، محيط الخصر، سُمك الجلد B Biochemical — التحاليل ألبيومين، فيريتين، HbA1c، فيتامين D C Clinical — الفحص الإكلينيكي الجلد، الشعر، الأظافر، الفم، الوذمة D Dietary — التقييم الغذائي استرجاع 24 ساعة، سجل الطعام، FFQ E Environmental/Economic الدخل، الأمن الغذائي، الثقافة، من يطبخ F Functional قوة القبضة، سرعة المشي، الأنشطة اليومية مبدأ أساسي: لا يوجد مؤشر واحد يشخّص سوء التغذية. التشخيص يكون بتقاطع مؤشرات من محاور مختلفة. 4.2 A — القياسات الجسمية مؤشر كتلة الجسم BMI = الوزن (كجم) ÷ (الطول بالمتر)² التصنيف BMI نقص وزن <18.5 طبيعي 18.5–24.9 زيادة وزن 25–29.9 سمنة درجة 1 / 2 / 3 30–34.9 / 35–39.9 / ≥40 عتبات آسيوية أدنى: زيادة الوزن تبدأ من 23 والسمنة من 27.5، لارتفاع الخطر الأيضي عند BMI أقل. حدود BMI: لا يميّز العضل من الدهن (رياضي القوة يظهر \"سمينًا\")، ولا يوضح التوزيع، ويضلّل مع الوذمة والاستسقاء والحمل وكبار السن. محيط الخصر (مؤشر الدهون الحشوية — الأهم للخطر الأيضي) خطر مرتفع: 102 سم للرجال، 88 سم للنساء (وعتبات أدنى للآسيويين: 90/80). نسبة الخصر إلى الطول (WHtR): قاعدة عملية ممتازة → حافظ على محيط خصرك أقل من نصف طولك . قياسات إضافية سُمك ثنايا الجلد (Skinfolds): بمقياس معاير (Harpenden) وبروتوكول موحّد (ISAK). الأدق هو تتبع مجموع الثنايا (Sum of skinfolds) عبر الزمن لا تحويله لنسبة دهون بمعادلة تحمل خطأ ±3–5%. محيط منتصف العضد (MUAC): بديل ممتاز حين يتعذر الوزن (طريح فراش، وذمة)، وأساسي في مسح سوء التغذية الحاد لدى الأطفال. BIA (المقاومة الحيوية): سهل ورخيص لكنه شديد الحساسية للترطيب والوجبة والتمرين → قياس صباحي صائم بشروط ثابتة، وقارن الاتجاه لا الرقم المطلق. DEXA: المعيار العملي الذهبي في البحث؛ يعطي أيضًا كثافة العظام وتوزيع الدهون. مكلف. قياس السعرات غير المباشر (Indirect calorimetry): المعيار الذهبي لقياس REE الفعلي في المرضى الحرجين. حسابات وزن مفيدة % تغيّر الوزن = [(الوزن المعتاد − الوزن الحالي) ÷ الوزن المعتاد] × 100 دلالة الفقد غير المقصود: 5% في شهر أو 10% في 6 أشهر = علامة حمراء لسوء التغذية. 4.3 B — التحاليل وتفسيرها بحذر التحليل يقيس تحذير التفسير ألبيومين ليس مؤشر تغذية جيدًا! بروتين طور حاد سالب : ينخفض مع الالتهاب والإنتان والكبد والكلى وزيادة السوائل. عمره النصفي ~20 يومًا بريألبيومين (ترانستيريتين) أسرع استجابة (نصف عمر ~2 يوم) يتأثر بالالتهاب أيضًا → لا يُستخدم منفردًا CRP شدة الالتهاب يُقرأ بجانب الألبيومين لتمييز الالتهاب عن نقص التغذية الهيموجلوبين/MCV فقر الدم MCV منخفض → حديد/ثلاسيميا · مرتفع → B12/فولات فيريتين مخزون الحديد بروتين طور حاد موجب → يرتفع كذبًا مع الالتهاب؛ اقرأه مع CRP وتشبع الترانسفيرين HbA1c متوسط سكر 2–3 شهور يضلّل مع فقر الدم الانحلالي، النزيف، الحمل، الهيموجلوبين غير الطبيعي 25(OH)D مخزون فيتامين D نقص <20 نانوجرام/مل · غير كافٍ 20–29 توازن النيتروجين الابتناء/الهدم = (بروتين÷6.25) − (يوريا البول 24س + 4) كرياتينين/eGFR، يوريا، إلكتروليتات، وظائف كبد، دهون أساسية قبل أي خطة علاجية 4.4 C — علامات إكلينيكية للنقص العلامة يشير إلى شحوب الملتحمة، تقعّر الأظافر (Koilonychia) حديد تشقق زوايا الفم (Angular cheilitis)، التهاب اللسان ريبوفلافين، B6، B12، حديد نزيف اللثة، كدمات، شعر \"لولبي\" فيتامين C العشى الليلي، بقع بيتو فيتامين A تنمّل، ضعف حس الاهتزاز، فقد التوازن B12 جلد متقشر متصبغ في المناطق المعرضة للشمس نياسين (بلاجرا) وذمة الطرفين، هزال، ضمور صدغي وبين العظام نقص طاقة/بروتين تساقط شعر، ضعف التئام جرح زنك، بروتين تضخم الغدة الدرقية يود 4.5 D — التقييم الغذائي: الأدوات وحدودها الأداة آلية ميزة عيب استرجاع 24 ساعة ذكر كل ما أُكل أمس بالتفصيل سريع، لا يغيّر السلوك يوم واحد لا يمثّل النمط؛ يعتمد على الذاكرة سجل الطعام 3–7 أيام تسجيل لحظي (يُفضّل بالوزن) الأدق للفرد عبء عالٍ؛ يغيّر السلوك أثناء التسجيل استبيان تكرار الطعام (FFQ) تكرار أطعمة خلال شهور ممتاز للأنماط والدراسات الوبائية تقدير كمي ضعيف تاريخ غذائي (Diet History) مقابلة شاملة عن النمط المعتاد صورة واقعية يحتاج مهارة ووقتًا مراقبة الوجبات (Calorie count) في المستشفى موضوعي لوجيستي تصحيح متعدد المرور (Multiple pass method): الأسلوب المعياري لاسترجاع 24 ساعة — 5 مرات: قائمة سريعة ← أطعمة منسية شائعة ← التوقيت والمناسبة ← تفاصيل الكمية والتحضير ← مراجعة نهائية. حقيقة مهنية: التبليغ الناقص (Under reporting) يصل إلى 20–50% خصوصًا لدى ذوي السمنة، ويقترن غالبًا بحذف الوجبات الخفيفة والمشروبات والزيوت. الحل ليس اتهام العميل، بل الاعتماد على النتيجة (تغيّر الوزن) كمرجع حَكَم. 4.6 أدوات المسح والتشخيص المعتمدة الأداة الاستخدام MUST مسح عام (مجتمع ومستشفى): BMI + فقد الوزن + أثر المرض الحاد NRS 2002 مسح مرضى المستشفيات (يوصي به ESPEN) MNA / MNA SF كبار السن SGA (التقييم الشامل الذاتي) تقييم إكلينيكي شامل: تاريخ + فحص → درجات A/B/C STRONGkids / STAMP الأطفال معايير GLIM الإطار العالمي الحديث لتشخيص سوء التغذية معايير GLIM — خطوتان 1. مسح بأداة معتمدة. 2. تشخيص يتطلب معيارًا ظاهريًا واحدًا + معيارًا سببيًا واحدًا : ظاهرية (Phenotypic) سببية (Etiologic) فقد وزن غير مقصود نقص المدخول أو سوء الامتصاص انخفاض BMI عبء المرض/الالتهاب انخفاض الكتلة العضلية ثم تُحدَّد الشدة (متوسط/شديد). 4.7 حالة تقييم كاملة (نموذج عملي) الحالة: سيدة 68 سنة، دخلت المستشفى بالتهاب رئوي. الوزن المعتاد 70 كجم، الحالي 61 كجم منذ 4 أشهر. الطول 160 سم. تشتكي ضعف شهية. ألبيومين 2.8 جم/دل، CRP 85 مجم/ل، Hb 10.4، قوة القبضة منخفضة. التحليل: BMI = 61 ÷ (1.6)² = 23.8 → \"طبيعي\" ظاهريًا — وهذا فخ. % فقد الوزن = (70−61)÷70 × 100 = 12.9% في 4 أشهر → فقد شديد . الألبيومين منخفض لكن CRP مرتفع → الانخفاض التهابي بالأساس ، فلا يُقرأ كدليل تغذوي مباشر. GLIM: ظاهري (فقد وزن 10%/6 شهور + نقص كتلة عضلية) + سببي (التهاب حاد + نقص مدخول) → سوء تغذية شديد . الخطة الأولية: طاقة: 25–30 kcal/كجم ≈ 1500–1800 kcal (تدرّج إذا كان خطر إعادة التغذية قائمًا). بروتين: 1.2–1.5 جم/كجم ≈ 73–92 جم/يوم . وجبات صغيرة كثيفة الطاقة + مكمل فموي (ONS) بين الوجبات + مكمل متعدد الفيتامينات. متابعة: وزن مرتين أسبوعيًا، مدخول فعلي يوميًا، إلكتروليتات (فوسفات/بوتاسيوم/ماغنسيوم)، قوة القبضة أسبوعيًا."}, {"i": 5, "group": "guide", "tag": "إرشاد", "num": "5", "short": "الإرشاد الغذائي وتغيير السلوك", "html": "<h1>الجزء الخامس: الإرشاد الغذائي وتغيير السلوك</h1>\n<h2>5.1 عملية الرعاية التغذوية (NCP) — لغة المهنة الموحدة</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الخطوة</th><th>المحتوى</th></tr></thead><tbody><tr><td><strong>1. التقييم (Assessment)</strong></td><td>جمع بيانات ABCDEF ومقارنتها بالمعايير</td></tr><tr><td><strong>2. التشخيص التغذوي (Diagnosis)</strong></td><td>صياغة <strong>PES</strong>: المشكلة (Problem) + السبب (Etiology) + العلامات والأعراض (Signs/Symptoms)</td></tr><tr><td><strong>3. التدخل (Intervention)</strong></td><td>خطة غذائية + تثقيف + إرشاد + تنسيق رعاية</td></tr><tr><td><strong>4. المتابعة والتقييم (Monitoring &amp; Evaluation)</strong></td><td>مؤشرات قابلة للقياس ومواعيد مراجعة</td></tr></tbody></table></div>\n<p><strong>مثال صياغة PES:</strong></p>\n<blockquote class=\"note\"><p>\"زيادة المدخول من الطاقة (P) <strong>مرتبطة بـ</strong> الأكل الانفعالي المسائي وقلة الوعي بأحجام الحصص (E) <strong>كما يتضح من</strong> سجل غذائي يظهر متوسط 3100 kcal/يوم وزيادة 6 كجم خلال 8 أشهر ومحيط خصر 112 سم (S).\"</p></blockquote>\n<p>لاحظ: التشخيص التغذوي <strong>ليس</strong> تشخيصًا طبيًا. \"السكري\" تشخيص طبي؛ \"المعرفة الناقصة عن حساب الكربوهيدرات\" تشخيص تغذوي.</p>\n<hr>\n<h2>5.2 نظريات تغيير السلوك (بإيجاز مفيد)</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>النظرية</th><th>الفكرة</th><th>التطبيق</th></tr></thead><tbody><tr><td><strong>النموذج عبر النظري (TTM)</strong></td><td>مراحل: ما قبل التفكير ← التفكير ← التحضير ← الفعل ← الاستمرار (± الانتكاس)</td><td><strong>طابِق التدخل مع المرحلة</strong>؛ لا تعطِ خطة تفصيلية لشخص في مرحلة \"ما قبل التفكير\" — ستفشل</td></tr><tr><td><strong>نموذج المعتقدات الصحية (HBM)</strong></td><td>يتغير السلوك عند إدراك: القابلية، الخطورة، الفوائد، العوائق، محفزات الفعل، الكفاءة الذاتية</td><td>اعمل على <strong>خفض العوائق</strong> أولًا؛ هي غالبًا العامل الحاسم</td></tr><tr><td><strong>النظرية المعرفية الاجتماعية (SCT)</strong></td><td>تفاعل الشخص × السلوك × البيئة؛ <strong>الكفاءة الذاتية</strong> جوهرية</td><td>ابدأ بأهداف صغيرة مضمونة النجاح لبناء الثقة</td></tr><tr><td><strong>نظرية تقرير المصير (SDT)</strong></td><td>الدافع الداخلي يحتاج: الاستقلالية + الكفاءة + الانتماء</td><td>امنح خيارات لا أوامر؛ الدافع الداخلي هو الذي يصمد بعد انتهاء المتابعة</td></tr></tbody></table></div>\n<hr>\n<h2>5.3 المقابلة التحفيزية (Motivational Interviewing)</h2>\n<p>الروح: <strong>شراكة، تقبّل، رحمة، استحضار (Evocation)</strong> — أنت لا تحقن الدافع، بل تستخرجه.</p>\n<h3>مهارات OARS</h3>\n<ul><li><strong>O — Open questions:</strong> \"إيه اللي خلاك تفكر تغيّر أكلك دلوقتي؟\"</li><li><strong>A — Affirmations:</strong> \"إن حضرتك مشيت 3 أيام في أسبوع مزحوم زي ده — دي مثابرة حقيقية.\"</li><li><strong>R — Reflections:</strong> أهم مهارة. \"يعني حاسس إنك عارف المفروض تعمل إيه، بس المشكلة في الوقت مش في المعرفة.\"</li><li><strong>S — Summaries:</strong> لمّ الخيوط وأعد عرضها لتأكيد الفهم والانتقال.</li></ul>\n<h3>مصيدة التصحيح (The Righting Reflex)</h3>\n<p>غريزة الأخصائي في \"تصويب\" العميل بالمعلومة تولّد <strong>مقاومة</strong>. القاعدة: كلما دافعتَ أنت عن التغيير، دافع هو عن البقاء كما هو. اجعله <strong>هو</strong> من ينطق بأسباب التغيير (Change Talk)، وأنصت لها وقوِّها.</p>\n<h3>ميزان القرار وسلم الجاهزية</h3>\n<blockquote class=\"note\"><p>\"من 0 لـ 10، قد إيه مهم بالنسبة لك تقلل السكر؟\" — يقول 6 → <strong>\"وليه 6 مش 3؟\"</strong> (يجعله يذكر أسبابه) — ولا تسأل \"ليه مش 9؟\" لأنها تستدعي الأعذار.</p></blockquote>\n<hr>\n<h2>5.4 صياغة الأهداف: SMART</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الحرف</th><th>المعنى</th><th>❌ سيئ</th><th>✅ جيد</th></tr></thead><tbody><tr><td>S</td><td>محدد</td><td>\"آكل صحي\"</td><td>\"أضيف طبق سلطة\"</td></tr><tr><td>M</td><td>قابل للقياس</td><td>\"أكتر خضار\"</td><td>\"كوبان خضار\"</td></tr><tr><td>A</td><td>قابل للتحقيق</td><td>\"أمشي ساعتين يوميًا من بكرة\"</td><td>\"أمشي 20 دقيقة\"</td></tr><tr><td>R</td><td>ذو صلة</td><td>—</td><td>\"بعد الغدا في العمل\"</td></tr><tr><td>T</td><td>محدد بزمن</td><td>\"قريبًا\"</td><td>\"4 أيام في الأسبوع، لمدة 3 أسابيع\"</td></tr></tbody></table></div>\n<p><strong>أدوات سلوكية عالية العائد:</strong></p>\n<ul><li><strong>نيّة التنفيذ (If-Then):</strong> \"لو حسّيت بجوع بعد العشا، هشرب كوب ماء وآكل تفاحة.\" — أقوى من النوايا العامة بمراحل.</li><li><strong>هندسة البيئة:</strong> غيّر ما هو مرئي وسهل المنال بدل الاعتماد على قوة الإرادة.</li><li><strong>المراقبة الذاتية:</strong> أقوى منبئ منفرد بنجاح ضبط الوزن طويل المدى.</li><li><strong>الوقاية من الانتكاس:</strong> اتفق مسبقًا على أن التعثر <strong>متوقع وطبيعي</strong>، وضع خطة للعودة خلال 24 ساعة.</li></ul>\n<hr>\n<h2>5.5 نموذج حوار إرشادي مختصر</h2>\n<blockquote class=\"note\"><p><strong>العميل:</strong> \"أنا جربت كل الأنظمة وفشلت. مفيش فايدة معايا.\" <strong>❌ رد ضعيف:</strong> \"لأ، لازم تلتزم بس. النظام ده هينجح أكيد.\" <strong>✅ رد فعّال:</strong> <em>(انعكاس + إثبات + سؤال مفتوح)</em> \"واضح إنك بذلت مجهود كتير مرات، والإحساس ده مُتعِب فعلًا. لكن اللي لفت نظري إنك لسه بتحاول — ده معناه إن الموضوع مهم بالنسبة لك. لو بصّينا على المحاولات اللي فاتت، إيه أكتر لحظة حسّيت فيها إنك ماشي كويس؟ وإيه اللي حصل بعدها؟\"</p></blockquote>\n<p>الهدف من الرد الثاني: تفكيك \"الفشل\" إلى بيانات قابلة للتحليل، واستخراج الدافع من العميل نفسه.</p>\n<hr>\n<h2>5.6 أخلاقيات ونطاق الممارسة</h2>\n<ul><li><strong>اعرف حدودك:</strong> التشخيص الطبي، وصف الأدوية، وتعديل جرعات الإنسولين — خارج نطاق أخصائي التغذية غير المرخّص لذلك.</li><li><strong>حالات إحالة إلزامية:</strong> اشتباه اضطراب أكل، اكتئاب/أفكار إيذاء الذات، سوء تغذية شديد، أعراض حمراء (فقد وزن غير مفسّر، دم في البراز، عسر بلع، أعراض عصبية).</li><li><strong>السرية</strong>، والحصول على <strong>موافقة مستنيرة</strong>، والوضوح بشأن التعارض التجاري إذا كنت تبيع مكملات.</li><li><strong>العدالة الثقافية:</strong> الخطة التي تتجاهل ميزانية العميل ومطبخه وصيامه ومعتقده — خطة فاشلة مهما كانت دقيقة علميًا.</li></ul>\n<hr>", "text": "الجزء الخامس: الإرشاد الغذائي وتغيير السلوك 5.1 عملية الرعاية التغذوية (NCP) — لغة المهنة الموحدة الخطوة المحتوى 1. التقييم (Assessment) جمع بيانات ABCDEF ومقارنتها بالمعايير 2. التشخيص التغذوي (Diagnosis) صياغة PES : المشكلة (Problem) + السبب (Etiology) + العلامات والأعراض (Signs/Symptoms) 3. التدخل (Intervention) خطة غذائية + تثقيف + إرشاد + تنسيق رعاية 4. المتابعة والتقييم (Monitoring & Evaluation) مؤشرات قابلة للقياس ومواعيد مراجعة مثال صياغة PES: \"زيادة المدخول من الطاقة (P) مرتبطة بـ الأكل الانفعالي المسائي وقلة الوعي بأحجام الحصص (E) كما يتضح من سجل غذائي يظهر متوسط 3100 kcal/يوم وزيادة 6 كجم خلال 8 أشهر ومحيط خصر 112 سم (S).\" لاحظ: التشخيص التغذوي ليس تشخيصًا طبيًا. \"السكري\" تشخيص طبي؛ \"المعرفة الناقصة عن حساب الكربوهيدرات\" تشخيص تغذوي. 5.2 نظريات تغيير السلوك (بإيجاز مفيد) النظرية الفكرة التطبيق النموذج عبر النظري (TTM) مراحل: ما قبل التفكير ← التفكير ← التحضير ← الفعل ← الاستمرار (± الانتكاس) طابِق التدخل مع المرحلة ؛ لا تعطِ خطة تفصيلية لشخص في مرحلة \"ما قبل التفكير\" — ستفشل نموذج المعتقدات الصحية (HBM) يتغير السلوك عند إدراك: القابلية، الخطورة، الفوائد، العوائق، محفزات الفعل، الكفاءة الذاتية اعمل على خفض العوائق أولًا؛ هي غالبًا العامل الحاسم النظرية المعرفية الاجتماعية (SCT) تفاعل الشخص × السلوك × البيئة؛ الكفاءة الذاتية جوهرية ابدأ بأهداف صغيرة مضمونة النجاح لبناء الثقة نظرية تقرير المصير (SDT) الدافع الداخلي يحتاج: الاستقلالية + الكفاءة + الانتماء امنح خيارات لا أوامر؛ الدافع الداخلي هو الذي يصمد بعد انتهاء المتابعة 5.3 المقابلة التحفيزية (Motivational Interviewing) الروح: شراكة، تقبّل، رحمة، استحضار (Evocation) — أنت لا تحقن الدافع، بل تستخرجه. مهارات OARS O — Open questions: \"إيه اللي خلاك تفكر تغيّر أكلك دلوقتي؟\" A — Affirmations: \"إن حضرتك مشيت 3 أيام في أسبوع مزحوم زي ده — دي مثابرة حقيقية.\" R — Reflections: أهم مهارة. \"يعني حاسس إنك عارف المفروض تعمل إيه، بس المشكلة في الوقت مش في المعرفة.\" S — Summaries: لمّ الخيوط وأعد عرضها لتأكيد الفهم والانتقال. مصيدة التصحيح (The Righting Reflex) غريزة الأخصائي في \"تصويب\" العميل بالمعلومة تولّد مقاومة . القاعدة: كلما دافعتَ أنت عن التغيير، دافع هو عن البقاء كما هو. اجعله هو من ينطق بأسباب التغيير (Change Talk)، وأنصت لها وقوِّها. ميزان القرار وسلم الجاهزية \"من 0 لـ 10، قد إيه مهم بالنسبة لك تقلل السكر؟\" — يقول 6 → \"وليه 6 مش 3؟\" (يجعله يذكر أسبابه) — ولا تسأل \"ليه مش 9؟\" لأنها تستدعي الأعذار. 5.4 صياغة الأهداف: SMART الحرف المعنى ❌ سيئ ✅ جيد S محدد \"آكل صحي\" \"أضيف طبق سلطة\" M قابل للقياس \"أكتر خضار\" \"كوبان خضار\" A قابل للتحقيق \"أمشي ساعتين يوميًا من بكرة\" \"أمشي 20 دقيقة\" R ذو صلة — \"بعد الغدا في العمل\" T محدد بزمن \"قريبًا\" \"4 أيام في الأسبوع، لمدة 3 أسابيع\" أدوات سلوكية عالية العائد: نيّة التنفيذ (If Then): \"لو حسّيت بجوع بعد العشا، هشرب كوب ماء وآكل تفاحة.\" — أقوى من النوايا العامة بمراحل. هندسة البيئة: غيّر ما هو مرئي وسهل المنال بدل الاعتماد على قوة الإرادة. المراقبة الذاتية: أقوى منبئ منفرد بنجاح ضبط الوزن طويل المدى. الوقاية من الانتكاس: اتفق مسبقًا على أن التعثر متوقع وطبيعي ، وضع خطة للعودة خلال 24 ساعة. 5.5 نموذج حوار إرشادي مختصر العميل: \"أنا جربت كل الأنظمة وفشلت. مفيش فايدة معايا.\" ❌ رد ضعيف: \"لأ، لازم تلتزم بس. النظام ده هينجح أكيد.\" ✅ رد فعّال: (انعكاس + إثبات + سؤال مفتوح) \"واضح إنك بذلت مجهود كتير مرات، والإحساس ده مُتعِب فعلًا. لكن اللي لفت نظري إنك لسه بتحاول — ده معناه إن الموضوع مهم بالنسبة لك. لو بصّينا على المحاولات اللي فاتت، إيه أكتر لحظة حسّيت فيها إنك ماشي كويس؟ وإيه اللي حصل بعدها؟\" الهدف من الرد الثاني: تفكيك \"الفشل\" إلى بيانات قابلة للتحليل، واستخراج الدافع من العميل نفسه. 5.6 أخلاقيات ونطاق الممارسة اعرف حدودك: التشخيص الطبي، وصف الأدوية، وتعديل جرعات الإنسولين — خارج نطاق أخصائي التغذية غير المرخّص لذلك. حالات إحالة إلزامية: اشتباه اضطراب أكل، اكتئاب/أفكار إيذاء الذات، سوء تغذية شديد، أعراض حمراء (فقد وزن غير مفسّر، دم في البراز، عسر بلع، أعراض عصبية). السرية ، والحصول على موافقة مستنيرة ، والوضوح بشأن التعارض التجاري إذا كنت تبيع مكملات. العدالة الثقافية: الخطة التي تتجاهل ميزانية العميل ومطبخه وصيامه ومعتقده — خطة فاشلة مهما كانت دقيقة علميًا."}, {"i": 6, "group": "guide", "tag": "مراجع", "num": "6", "short": "أفضل الكتب في المجال", "html": "<h1>الجزء السادس: أفضل الكتب في المجال — مراجعة تفصيلية</h1>\n<blockquote class=\"note\"><p>كل مراجعة أدناه تشرح: <strong>لمن الكتاب؟ · كيف بُني؟ · ما الأفكار المحورية التي ستخرج بها؟ · كيف تقرأه؟ · نقاط ضعفه؟</strong> — بحيث تحصل على خلاصة الكتاب ومنهجه، وليس بديلًا عن قراءته. ملاحظة: أرقام الطبعات تتغيّر باستمرار — تحقق دائمًا من أحدث طبعة متاحة.</p></blockquote>\n<hr>\n<h2>6.1 التغذية العامة والأيض</h2>\n<h3>1) <em>Advanced Nutrition and Human Metabolism</em> — Gropper &amp; Smith</h3>\n<p><strong>لمن:</strong> طلاب الدراسات العليا وكل من يريد فهم \"لماذا\" لا \"ماذا\". هذا هو <strong>كتاب الأيض</strong> المرجعي.</p>\n<p><strong>البناء:</strong> يبدأ بمراجعة الخلية والهضم والامتصاص، ثم يخصص أقسامًا كاملة للكربوهيدرات والدهون والبروتين، ثم توازن الطاقة والتنظيم، ثم الفيتامينات الذائبة في الماء فالذائبة في الدهون، ثم المعادن الكبرى والعناصر النزرة، وأخيرًا فصول عن التغذية والنشاط البدني والتغذية في مراحل الحياة.</p>\n<p><strong>ما ستخرج به:</strong></p>\n<ul><li>خريطة أيضية متكاملة: كيف يمر الجلوكوز من الجليكوليزس إلى دورة كريبس إلى سلسلة نقل الإلكترون، ومتى يتحوّل الجسم من الحالة الممتلئة (Fed) إلى الصائمة (Fasted) إلى الجوع المطوّل، وأين ينشط تكوين الجلوكوز والأجسام الكيتونية.</li><li>فهم دقيق لكل فيتامين كـ <strong>إنزيم مساعد في تفاعل محدد</strong> — وهو ما يجعل أعراض النقص منطقية بدل حفظها.</li><li>تفصيل نادر لتنظيم امتصاص المعادن (خصوصًا محور <strong>الهيبسيدين–الفيروبورتين</strong> في الحديد).</li></ul>\n<p><strong>كيف تقرأه:</strong> ليس للقراءة الخطية. اقرأ فصول الأيض الثلاثة الأولى بعناية شديدة (هي العمود الفقري)، ثم استخدم فصول المغذيات الدقيقة كمرجع عند الحاجة. ارسم المسارات بيدك — لا تكتفِ بالنظر إلى المخططات.</p>\n<p><strong>نقطة ضعف:</strong> كثيف جدًا وقليل التطبيق الإكلينيكي المباشر. لا تبدأ به إذا كنت مبتدئًا.</p>\n<hr>\n<h3>2) <em>Understanding Nutrition</em> — Whitney &amp; Rolfes</h3>\n<p><strong>لمن:</strong> المبتدئ تمامًا، ومن يعلّم التغذية.</p>\n<p><strong>البناء والقيمة:</strong> كتاب تمهيدي بارع تربويًا: يبدأ بالمفاهيم الأساسية والأدلة الغذائية، ثم يمر على كل مغذٍّ، ثم يغطي التحكم في الوزن والرياضة ومراحل الحياة وسلامة الغذاء والأمن الغذائي. أفضل ما فيه هو <strong>صناديق \"Highlight\" و\"Nutrition in Practice\"</strong> التي تفكك الأساطير الشائعة (المكملات، الحميات الرائجة، التسويق الغذائي) بأسلوب نقدي.</p>\n<p><strong>ما ستخرج به:</strong> أساس صلب في المصطلحات + مهارة تقييم الادعاءات الغذائية إعلاميًا + إلمام بحسابات الطاقة والحصص.</p>\n<p><strong>كيف تقرأه:</strong> خطيًا من البداية للنهاية. أنهِ أسئلة نهاية كل فصل.</p>\n<p><strong>نقطة ضعف:</strong> سطحي أيضيًا؛ اعتبره سلّمًا للانتقال إلى Gropper.</p>\n<hr>\n<h3>3) <em>Modern Nutrition in Health and Disease</em> — Ross, Caballero, Cousins وآخرون (المعروف بـ \"Shils\")</h3>\n<p><strong>لمن:</strong> المرجع الموسوعي (Reference) للباحث والأخصائي المتقدم.</p>\n<p><strong>البناء:</strong> مجلد ضخم بفصول يكتبها متخصصون، مقسّم إلى: مغذيات محددة · التغذية في مراحل الحياة · التغذية الوقائية والصحة العامة · التغذية في الأمراض (نظام تلو الآخر).</p>\n<p><strong>قيمته الحقيقية:</strong> حين تحتاج تغطية عميقة ومسندة بالمراجع لموضوع بعينه (مثلًا: التغذية في فشل القلب، أو الأيض النزر للكروم)، هذا هو المكان. القوة والضعف معًا يأتيان من كونه مجموعة فصول مستقلة: عمق عالٍ لكن أسلوب غير متجانس.</p>\n<p><strong>كيف تقرأه:</strong> لا يُقرأ. يُستشار كموسوعة.</p>\n<hr>\n<h3>4) <em>Present Knowledge in Nutrition</em></h3>\n<p>مرجع دوري يلخّص أحدث ما وصل إليه العلم في كل مجال. مثالي لمتابعة تطوّر المعرفة بعد إتقان الأساسيات.</p>\n<hr>\n<h2>6.2 التغذية الرياضية</h2>\n<h3>5) <em>Clinical Sports Nutrition</em> — Louise Burke &amp; Vicki Deakin</h3>\n<p><strong>لمن:</strong> <strong>المرجع الأول عالميًا</strong> لأخصائي التغذية الرياضية. إذا اقتنيت كتابًا واحدًا في هذا المجال، فليكن هذا.</p>\n<p><strong>البناء:</strong> يبدأ بالمنهجية (كيف تقيّم الرياضي، تحليل تركيب الجسم، احتياجات الطاقة)، ثم فصول عن الكربوهيدرات والبروتين والسوائل، ثم اضطرابات الأكل وتوافر الطاقة المنخفض، ثم المكملات ومساعدات الأداء، ثم فصول تطبيقية <strong>بحسب نوع الرياضة</strong>: تحمل، فرق، أوزان، قوة، جماليات، رياضات المضرب، الترياثلون، مع فصول عن الرياضي المراهق والنباتي والمسافر وذوي الإعاقة.</p>\n<p><strong>ما ستخرج به:</strong></p>\n<ul><li><strong>الأهم:</strong> منهج تفكير قائم على \"<strong>التغذية الدورية (Periodized Nutrition)</strong>\" — أن الخطة تتغير مع مرحلة التدريب وهدف كل جلسة، لا خطة واحدة ثابتة.</li><li>تفكيك دقيق ومحايد لاستراتيجيات مثل <em>Train-low</em> والتحميل الكربوهيدراتي والحمية عالية الدهون، مع عرض صريح لما تدعمه الأدلة وما لا تدعمه.</li><li>تعامل ناضج مع مشكلات الواقع: قطع الوزن، السفر عبر المناطق الزمنية، اضطرابات الأكل، الرياضي محدود الميزانية.</li></ul>\n<p><strong>كيف تقرأه:</strong> اقرأ الأقسام العامة كاملة، ثم انتقل مباشرة إلى فصل الرياضة التي تعمل بها. تتبّع المراجع — الكتاب باب لأدبيات ضخمة.</p>\n<p><strong>نقطة ضعف:</strong> ثقيل وأكاديمي؛ يفترض خلفية فسيولوجية.</p>\n<hr>\n<h3>6) <em>Practical Sports Nutrition</em> — Louise Burke</h3>\n<p>النسخة التطبيقية من الكتاب السابق: أمثلة وجبات، دراسات حالة لرياضيين حقيقيين، وحلول لوجستية. <strong>ثنائي مثالي</strong>: النظرية من <em>Clinical</em> والتطبيق من <em>Practical</em>.</p>\n<hr>\n<h3>7) <em>Exercise Physiology: Nutrition, Energy, and Human Performance</em> — McArdle, Katch &amp; Katch</h3>\n<p><strong>لمن:</strong> من يريد أن يفهم الجسم أثناء الحركة، وهو <strong>الأساس الذي تُبنى عليه التغذية الرياضية</strong>.</p>\n<p><strong>البناء:</strong> أقسام عن المغذيات كوقود، ثم أنظمة الطاقة والقياس، ثم الجهاز التنفسي والدوري والعضلي والهرموني، ثم التدريب والتكيفات، ثم تركيب الجسم والوزن، ثم الأداء في بيئات خاصة (حرارة، ارتفاع، غوص)، ثم مساعدات الأداء.</p>\n<p><strong>ما ستخرج به:</strong> فهم عميق لأنظمة الطاقة الثلاثة وتداخلها، وVO₂max وعتبة اللاكتات والاقتصاد الحركي، وكيف تُترجم كل هذه إلى قرارات غذائية.</p>\n<p><strong>كيف تقرأه:</strong> ركّز على أقسام الطاقة والتدريب وتركيب الجسم. الشكل التوضيحي في هذا الكتاب أهم من النص أحيانًا.</p>\n<hr>\n<h3>8) <em>Advanced Sports Nutrition</em> — Dan Benardot</h3>\n<p>أقوى ما فيه هو التركيز على <strong>توزيع الطاقة داخل اليوم</strong>، ومفهوم <strong>العجز الطاقي اللحظي (Within-day energy deficiency)</strong>: أن الرياضي قد يوازن سعراته على مدار اليوم لكنه يقضي ساعات في عجز حاد، مما يضر التركيب الجسمي والهرمونات. مفهوم عملي جدًا ونادر في كتب أخرى.</p>\n<hr>\n<h3>9) <em>NSCA's Guide to Sport and Exercise Nutrition</em> — NSCA</h3>\n<p>تنظيم ممتاز وجسور واضحة بين التدريب والتغذية. مثالي للمدرب الشخصي ومدرب القوة والتكييف.</p>\n<hr>\n<h3>10) <em>The Complete Guide to Sports Nutrition</em> — Anita Bean</h3>\n<p>الأسهل والأكثر قابلية للتطبيق الفوري: لغة بسيطة، جداول عملية، خطط وجبات. <strong>الأنسب للبداية</strong> قبل الانتقال إلى Burke.</p>\n<hr>\n<h3>11) مواقف الجمعيات (Position Stands) — ليست كتبًا لكنها لا تقل أهمية</h3>\n<ul><li><strong>ISSN Position Stands</strong> (البروتين، الكرياتين، الكافيين، توقيت المغذيات، الصيام...) — مقالات مجانية ومحدّثة ومكثّفة.</li><li><strong>موقف مشترك: الأكاديمية الأمريكية للتغذية + ACSM + Dietitians of Canada حول التغذية والأداء الرياضي</strong> — أفضل وثيقة مرجعية واحدة تلخّص كل التوصيات الرقمية.</li><li><strong>تصنيف المكملات في المعهد الأسترالي للرياضة (AIS)</strong> — نظام الفئات A/B/C/D الذي اعتمدنا منطقه في الجزء الثاني.</li></ul>\n<hr>\n<h2>6.3 التغذية العلاجية والإكلينيكية</h2>\n<h3>12) <em>Krause and Mahan's Food &amp; the Nutrition Care Process</em></h3>\n<p><strong>لمن:</strong> <strong>الكتاب المقدّس للتغذية الإكلينيكية.</strong> لا غنى عنه لأي عامل في المجال.</p>\n<p><strong>البناء (وهو منطقي جدًا):</strong></p>\n<ol><li><strong>قسم التقييم:</strong> المدخول، السريري (الأنثروبومتري والتحاليل والفحص)، السلوكي/البيئي.</li><li><strong>قسم التشخيص والتدخل:</strong> عملية الرعاية التغذوية، توصيل الغذاء والمغذيات، التثقيف والإرشاد.</li><li><strong>قسم مراحل الحياة:</strong> حمل ورضاعة، رضّع، أطفال، مراهقة، كبار السن.</li><li><strong>قسم التغذية للصحة والأداء:</strong> ضبط الوزن، الرياضة، صحة العظام، الفم والأسنان.</li><li><strong>قسم التغذية العلاجية:</strong> فصل مستقل لكل جهاز — الغدد الصماء والسكري، القلب والأوعية، الكلى، الكبد والبنكرياس، الجهاز الهضمي (علوي/سفلي)، الرئة، الأمراض العصبية، السرطان، المناعة والحساسية، HIV، الرعاية الحرجة، الأمراض النفسية، الاضطرابات الأيضية الوراثية.</li></ol>\n<p><strong>ما ستخرج به:</strong></p>\n<ul><li><strong>إطار NCP/PES</strong> الذي يُنظّم تفكيرك بالكامل (شرحناه في الجزء الخامس).</li><li>لكل مرض: الفسيولوجيا المرضية ← الأدوية وتفاعلاتها ← التقييم ← الأهداف ← التدخل ← المتابعة. هذا التسلسل نفسه هو ما يجب أن يصبح عادة ذهنية عندك.</li><li>ملاحق ثمينة: معادلات الطاقة، جداول تركيب الأغذية، مستويات الأنظمة العلاجية، أدوات المسح.</li></ul>\n<p><strong>كيف تقرأه:</strong> لا يُقرأ خطيًا. اقرأ قسمي التقييم والتدخل كاملَين (هما المنهج)، ثم فصل المرض الذي أمامك حالة منه. راجع الفصل كلما استقبلت حالة جديدة — ستلاحظ أنك تفهمه بشكل أعمق في كل مرة.</p>\n<p><strong>نقطة ضعف:</strong> أمريكي التوجه (وحدات وأنظمة رعاية)، وضخم بشكل مرهب. ابدأ بفصل واحد.</p>\n<hr>\n<h3>13) <em>Nutrition Therapy and Pathophysiology</em> — Nelms &amp; Sucher</h3>\n<p><strong>بديل/رفيق ممتاز لـ Krause</strong>، وميزته الحاسمة أنه يربط <strong>الفسيولوجيا المرضية بالتدخل الغذائي بشكل صريح</strong> في كل فصل: تفهم <em>لماذا</em> يقيَّد البوتاسيوم في الفشل الكلوي، لا أنه يُقيَّد فحسب. يحتوي على دراسات حالة تعليمية ممتازة مع أسئلة. <strong>الأفضل للتعلّم</strong>، بينما Krause <strong>الأفضل كمرجع</strong>.</p>\n<hr>\n<h3>14) <em>Manual of Dietetic Practice</em> — الجمعية البريطانية لأخصائيي التغذية (BDA)</h3>\n<p>النسخة البريطانية/الأوروبية، وميزته أنه <strong>عملي ومختصر ومنظّم للممارسة اليومية</strong>: بروتوكولات واضحة، وحدات SI، وسياق أنظمة صحية عامة. إذا كنت تعمل خارج الولايات المتحدة، ستجده أقرب لواقعك.</p>\n<hr>\n<h3>15) <em>The ASPEN Adult Nutrition Support Core Curriculum</em></h3>\n<p><strong>المرجع المتخصص في الدعم التغذوي</strong>: التغذية المعوية (Enteral) والوريدية (Parenteral). تركيب المحاليل، اختيار الأنبوب، المضاعفات وإدارتها، الوصول الوريدي، الحالات الحرجة، متلازمة الأمعاء القصيرة، متلازمة إعادة التغذية. إذا كنت ستعمل في المستشفيات أو العناية المركزة، هذا الكتاب غير قابل للاستبدال.</p>\n<p><strong>بجانبه:</strong> <strong>إرشادات ESPEN</strong> (مجانية على الإنترنت): إرشادات منفصلة للعناية المركزة، الكبد، الكلى، السرطان، الجراحة، كبار السن... محدّثة ومسندة ومختصرة.</p>\n<hr>\n<h3>16) <em>Nutrition Care Manual</em> — الأكاديمية الأمريكية للتغذية</h3>\n<p>منصة إلكترونية أكثر منها كتابًا: أنظمة غذائية جاهزة، مواد تثقيفية للمرضى بلغات متعددة، وأدلة قائمة على الأدلة. أداة عمل يومية.</p>\n<hr>\n<h2>6.4 تقييم الحالة الغذائية</h2>\n<h3>17) <em>Nutritional Assessment</em> — Robert Lee &amp; David Nieman</h3>\n<p><strong>المرجع الأشمل والأوضح في التقييم.</strong> يخصص فصلًا لكل محور: التقييم الغذائي وأدواته وأخطائها، الأنثروبومتري بالتفصيل (بروتوكولات القياس نفسها خطوة بخطوة)، التقييم الحيوي (البيوكيميائي)، الفحص الإكلينيكي، والتقييم في الأمراض المزمنة والمجتمع.</p>\n<p><strong>ما ستخرج به:</strong> أهم ما فيه هو <strong>التفكير النقدي في الأداة نفسها</strong>: ما مصادر الخطأ؟ ما الصدق (Validity) والثبات (Reliability)؟ متى تعطيك الأداة رقمًا صحيحًا واستنتاجًا خاطئًا؟ هذا الوعي هو الفرق بين من يجمع أرقامًا ومن يقيّم حالة.</p>\n<p><strong>كيف تقرأه:</strong> خطيًا، مع تطبيق كل تقنية عمليًا على نفسك وعلى زميل. القياس مهارة يدوية لا تُتقن بالقراءة.</p>\n<hr>\n<h3>18) <em>ADA/Academy Pocket Guide to Nutrition Assessment</em> — Charney &amp; Malone</h3>\n<p>مرجع جيب مختصر جدًا: القيم المرجعية، أدوات المسح، معادلات التقدير، جداول التفسير. تحمله معك في الجولة السريرية.</p>\n<hr>\n<h3>19) <em>International Standards for Anthropometric Assessment</em> — ISAK</h3>\n<p>الدليل المعياري لقياسات الجسم: النقاط التشريحية الدقيقة، تقنية القياس، حساب خطأ القياس التقني (TEM). إذا كنت ستقيس ثنايا الجلد بجدية، فهذا الدليل (مع تدريب معتمد) ضرورة.</p>\n<hr>\n<h2>6.5 الإرشاد والاستشارة وتغيير السلوك</h2>\n<h3>20) <em>Motivational Interviewing: Helping People Change</em> — William Miller &amp; Stephen Rollnick</h3>\n<p><strong>الكتاب الأصل</strong> الذي أسّس المنهج كله. يشرح روح المقابلة التحفيزية وعملياتها الأربع: <strong>الإشراك (Engaging) ← التركيز (Focusing) ← الاستحضار (Evoking) ← التخطيط (Planning)</strong>، ومهارات OARS، وكيف تتعرّف على \"حديث التغيير\" و\"حديث المحافظة\" وتستجيب لكل منهما.</p>\n<p><strong>ما ستخرج به:</strong> تحوّل جذري في طريقة جلوسك أمام العميل — من \"خبير يعطي تعليمات\" إلى \"شريك يستخرج دافعًا موجودًا بالفعل\". أهم درس واحد: <strong>مقاومة العميل غالبًا نتاج أسلوبك أنت، لا عناده هو.</strong></p>\n<p><strong>كيف تقرأه:</strong> ببطء، مع تسجيل جلساتك (بإذن) والاستماع إليها. المهارة لا تُكتسب إلا بالممارسة والتغذية الراجعة.</p>\n<hr>\n<h3>21) <em>Motivational Interviewing in Nutrition and Fitness</em> — Dawn Clifford &amp; Laura Curtis</h3>\n<p>ترجمة منهج Miller &amp; Rollnick إلى <strong>سياق التغذية والوزن تحديدًا</strong>، بحوارات نموذجية كثيرة وتمارين. الأقرب للتطبيق المباشر في عيادة التغذية، ويتناول أيضًا نهج <strong>\"الصحة بكل الأحجام\" (HAES)</strong> والتعامل مع وصمة الوزن.</p>\n<hr>\n<h3>22) <em>Nutrition Counseling and Education Skill Development</em> — Holli &amp; Beto</h3>\n<p>كتاب دراسي متكامل: نظريات تغيير السلوك، مهارات الاتصال والإصغاء، إدارة الجلسة، التثقيف الجماعي، تصميم المواد التعليمية، وتوثيق الجلسات. الأفضل إذا أردت <strong>منهجًا أكاديميًا منظمًا</strong> لا مجرد أسلوب.</p>\n<hr>\n<h3>23) <em>Health Behavior: Theory, Research, and Practice</em> — Glanz, Rimer &amp; Viswanath</h3>\n<p>المرجع الأم لنظريات السلوك الصحي (HBM, TTM, SCT, SDT, النموذج البيئي-الاجتماعي، انتشار المستحدثات). إذا كنت تعمل في <strong>الصحة العامة أو تصميم البرامج</strong>، فهذا كتابك.</p>\n<hr>\n<h3>24) قراءات مساندة عالية القيمة</h3>\n<ul><li><em>Intuitive Eating</em> — Tribole &amp; Resch: منهج الأكل الحدسي؛ مهم للتعامل مع من أرهقتهم دورة الحميات، ولمراجعة علاقتك أنت بالطعام كمهني.</li><li><em>Thinking, Fast and Slow</em> — Kahneman: لفهم كيف يتخذ الناس (والمهنيون) قراراتهم فعليًا.</li><li><em>Atomic Habits</em> — James Clear: إطار عملي بسيط لتصميم العادات (المحفّز، الرغبة، الاستجابة، المكافأة) يُترجم مباشرة إلى أهداف غذائية.</li></ul>\n<hr>\n<h2>6.6 مسار قراءة مقترح (12 شهرًا)</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المرحلة</th><th>المدة</th><th>المحتوى</th></tr></thead><tbody><tr><td><strong>1. التأسيس</strong></td><td>شهر 1–2</td><td><em>Understanding Nutrition</em> كاملًا + إرشادات غذائية وطنية</td></tr><tr><td><strong>2. الأيض</strong></td><td>شهر 3–5</td><td><em>Gropper</em> (فصول المغذيات الكبرى بعمق، الدقيقة كمرجع)</td></tr><tr><td><strong>3. الإكلينيكي</strong></td><td>شهر 6–8</td><td><em>Krause</em> (قسما التقييم والتدخل) + <em>Nelms</em> لدراسات الحالة + إرشادات ESPEN</td></tr><tr><td><strong>4. التقييم</strong></td><td>شهر 8–9</td><td><em>Lee &amp; Nieman</em> مع تطبيق عملي</td></tr><tr><td><strong>5. الرياضي</strong></td><td>شهر 9–11</td><td><em>Anita Bean</em> ← <em>Burke Clinical Sports Nutrition</em> + مواقف ISSN</td></tr><tr><td><strong>6. الإرشاد</strong></td><td>شهر 11–12</td><td><em>Miller &amp; Rollnick</em> + <em>Clifford &amp; Curtis</em> مع ممارسة مسجّلة</td></tr><tr><td><strong>مستمر</strong></td><td>يوميًا</td><td>ورقة بحثية واحدة أسبوعيًا + مراجعة حالة واحدة</td></tr></tbody></table></div>\n<h3>كيف تقرأ ورقة علمية بذكاء (وتُحصّن نفسك ضد الضجيج)</h3>\n<ol><li><strong>صمم الدراسة أهم من نتيجتها:</strong> تجربة عشوائية محكمة &gt; دراسة أتراب &gt; دراسة حالات-شواهد &gt; تقرير حالة &gt; رأي خبير.</li><li><strong>الارتباط ليس سببية</strong> — والدراسات الرصدية في التغذية تعاني من عوامل مربكة كثيرة.</li><li><strong>افحص العيّنة:</strong> فئران؟ خلايا؟ 12 طالبًا جامعيًا؟ لا تعمّم على مريضك.</li><li><strong>الأهمية الإحصائية ≠ الأهمية الإكلينيكية:</strong> فرق 0.4 كجم \"معنوي إحصائيًا\" لا يعني شيئًا للمريض.</li><li><strong>الحجم المطلق مقابل النسبي:</strong> \"خفض الخطر 50%\" قد يعني من 2 في الألف إلى 1 في الألف.</li><li><strong>من موّل الدراسة؟</strong> ليس سببًا للرفض، لكنه سبب للتدقيق.</li><li><strong>الأدلة تُبنى على المجموع:</strong> المراجعات المنهجية والتحليلات البعدية أوثق من دراسة مفردة.</li></ol>\n<hr>", "text": "الجزء السادس: أفضل الكتب في المجال — مراجعة تفصيلية كل مراجعة أدناه تشرح: لمن الكتاب؟ · كيف بُني؟ · ما الأفكار المحورية التي ستخرج بها؟ · كيف تقرأه؟ · نقاط ضعفه؟ — بحيث تحصل على خلاصة الكتاب ومنهجه، وليس بديلًا عن قراءته. ملاحظة: أرقام الطبعات تتغيّر باستمرار — تحقق دائمًا من أحدث طبعة متاحة. 6.1 التغذية العامة والأيض 1) Advanced Nutrition and Human Metabolism — Gropper & Smith لمن: طلاب الدراسات العليا وكل من يريد فهم \"لماذا\" لا \"ماذا\". هذا هو كتاب الأيض المرجعي. البناء: يبدأ بمراجعة الخلية والهضم والامتصاص، ثم يخصص أقسامًا كاملة للكربوهيدرات والدهون والبروتين، ثم توازن الطاقة والتنظيم، ثم الفيتامينات الذائبة في الماء فالذائبة في الدهون، ثم المعادن الكبرى والعناصر النزرة، وأخيرًا فصول عن التغذية والنشاط البدني والتغذية في مراحل الحياة. ما ستخرج به: خريطة أيضية متكاملة: كيف يمر الجلوكوز من الجليكوليزس إلى دورة كريبس إلى سلسلة نقل الإلكترون، ومتى يتحوّل الجسم من الحالة الممتلئة (Fed) إلى الصائمة (Fasted) إلى الجوع المطوّل، وأين ينشط تكوين الجلوكوز والأجسام الكيتونية. فهم دقيق لكل فيتامين كـ إنزيم مساعد في تفاعل محدد — وهو ما يجعل أعراض النقص منطقية بدل حفظها. تفصيل نادر لتنظيم امتصاص المعادن (خصوصًا محور الهيبسيدين–الفيروبورتين في الحديد). كيف تقرأه: ليس للقراءة الخطية. اقرأ فصول الأيض الثلاثة الأولى بعناية شديدة (هي العمود الفقري)، ثم استخدم فصول المغذيات الدقيقة كمرجع عند الحاجة. ارسم المسارات بيدك — لا تكتفِ بالنظر إلى المخططات. نقطة ضعف: كثيف جدًا وقليل التطبيق الإكلينيكي المباشر. لا تبدأ به إذا كنت مبتدئًا. 2) Understanding Nutrition — Whitney & Rolfes لمن: المبتدئ تمامًا، ومن يعلّم التغذية. البناء والقيمة: كتاب تمهيدي بارع تربويًا: يبدأ بالمفاهيم الأساسية والأدلة الغذائية، ثم يمر على كل مغذٍّ، ثم يغطي التحكم في الوزن والرياضة ومراحل الحياة وسلامة الغذاء والأمن الغذائي. أفضل ما فيه هو صناديق \"Highlight\" و\"Nutrition in Practice\" التي تفكك الأساطير الشائعة (المكملات، الحميات الرائجة، التسويق الغذائي) بأسلوب نقدي. ما ستخرج به: أساس صلب في المصطلحات + مهارة تقييم الادعاءات الغذائية إعلاميًا + إلمام بحسابات الطاقة والحصص. كيف تقرأه: خطيًا من البداية للنهاية. أنهِ أسئلة نهاية كل فصل. نقطة ضعف: سطحي أيضيًا؛ اعتبره سلّمًا للانتقال إلى Gropper. 3) Modern Nutrition in Health and Disease — Ross, Caballero, Cousins وآخرون (المعروف بـ \"Shils\") لمن: المرجع الموسوعي (Reference) للباحث والأخصائي المتقدم. البناء: مجلد ضخم بفصول يكتبها متخصصون، مقسّم إلى: مغذيات محددة · التغذية في مراحل الحياة · التغذية الوقائية والصحة العامة · التغذية في الأمراض (نظام تلو الآخر). قيمته الحقيقية: حين تحتاج تغطية عميقة ومسندة بالمراجع لموضوع بعينه (مثلًا: التغذية في فشل القلب، أو الأيض النزر للكروم)، هذا هو المكان. القوة والضعف معًا يأتيان من كونه مجموعة فصول مستقلة: عمق عالٍ لكن أسلوب غير متجانس. كيف تقرأه: لا يُقرأ. يُستشار كموسوعة. 4) Present Knowledge in Nutrition مرجع دوري يلخّص أحدث ما وصل إليه العلم في كل مجال. مثالي لمتابعة تطوّر المعرفة بعد إتقان الأساسيات. 6.2 التغذية الرياضية 5) Clinical Sports Nutrition — Louise Burke & Vicki Deakin لمن: المرجع الأول عالميًا لأخصائي التغذية الرياضية. إذا اقتنيت كتابًا واحدًا في هذا المجال، فليكن هذا. البناء: يبدأ بالمنهجية (كيف تقيّم الرياضي، تحليل تركيب الجسم، احتياجات الطاقة)، ثم فصول عن الكربوهيدرات والبروتين والسوائل، ثم اضطرابات الأكل وتوافر الطاقة المنخفض، ثم المكملات ومساعدات الأداء، ثم فصول تطبيقية بحسب نوع الرياضة : تحمل، فرق، أوزان، قوة، جماليات، رياضات المضرب، الترياثلون، مع فصول عن الرياضي المراهق والنباتي والمسافر وذوي الإعاقة. ما ستخرج به: الأهم: منهج تفكير قائم على \" التغذية الدورية (Periodized Nutrition) \" — أن الخطة تتغير مع مرحلة التدريب وهدف كل جلسة، لا خطة واحدة ثابتة. تفكيك دقيق ومحايد لاستراتيجيات مثل Train low والتحميل الكربوهيدراتي والحمية عالية الدهون، مع عرض صريح لما تدعمه الأدلة وما لا تدعمه. تعامل ناضج مع مشكلات الواقع: قطع الوزن، السفر عبر المناطق الزمنية، اضطرابات الأكل، الرياضي محدود الميزانية. كيف تقرأه: اقرأ الأقسام العامة كاملة، ثم انتقل مباشرة إلى فصل الرياضة التي تعمل بها. تتبّع المراجع — الكتاب باب لأدبيات ضخمة. نقطة ضعف: ثقيل وأكاديمي؛ يفترض خلفية فسيولوجية. 6) Practical Sports Nutrition — Louise Burke النسخة التطبيقية من الكتاب السابق: أمثلة وجبات، دراسات حالة لرياضيين حقيقيين، وحلول لوجستية. ثنائي مثالي : النظرية من Clinical والتطبيق من Practical . 7) Exercise Physiology: Nutrition, Energy, and Human Performance — McArdle, Katch & Katch لمن: من يريد أن يفهم الجسم أثناء الحركة، وهو الأساس الذي تُبنى عليه التغذية الرياضية . البناء: أقسام عن المغذيات كوقود، ثم أنظمة الطاقة والقياس، ثم الجهاز التنفسي والدوري والعضلي والهرموني، ثم التدريب والتكيفات، ثم تركيب الجسم والوزن، ثم الأداء في بيئات خاصة (حرارة، ارتفاع، غوص)، ثم مساعدات الأداء. ما ستخرج به: فهم عميق لأنظمة الطاقة الثلاثة وتداخلها، وVO₂max وعتبة اللاكتات والاقتصاد الحركي، وكيف تُترجم كل هذه إلى قرارات غذائية. كيف تقرأه: ركّز على أقسام الطاقة والتدريب وتركيب الجسم. الشكل التوضيحي في هذا الكتاب أهم من النص أحيانًا. 8) Advanced Sports Nutrition — Dan Benardot أقوى ما فيه هو التركيز على توزيع الطاقة داخل اليوم ، ومفهوم العجز الطاقي اللحظي (Within day energy deficiency) : أن الرياضي قد يوازن سعراته على مدار اليوم لكنه يقضي ساعات في عجز حاد، مما يضر التركيب الجسمي والهرمونات. مفهوم عملي جدًا ونادر في كتب أخرى. 9) NSCA's Guide to Sport and Exercise Nutrition — NSCA تنظيم ممتاز وجسور واضحة بين التدريب والتغذية. مثالي للمدرب الشخصي ومدرب القوة والتكييف. 10) The Complete Guide to Sports Nutrition — Anita Bean الأسهل والأكثر قابلية للتطبيق الفوري: لغة بسيطة، جداول عملية، خطط وجبات. الأنسب للبداية قبل الانتقال إلى Burke. 11) مواقف الجمعيات (Position Stands) — ليست كتبًا لكنها لا تقل أهمية ISSN Position Stands (البروتين، الكرياتين، الكافيين، توقيت المغذيات، الصيام...) — مقالات مجانية ومحدّثة ومكثّفة. موقف مشترك: الأكاديمية الأمريكية للتغذية + ACSM + Dietitians of Canada حول التغذية والأداء الرياضي — أفضل وثيقة مرجعية واحدة تلخّص كل التوصيات الرقمية. تصنيف المكملات في المعهد الأسترالي للرياضة (AIS) — نظام الفئات A/B/C/D الذي اعتمدنا منطقه في الجزء الثاني. 6.3 التغذية العلاجية والإكلينيكية 12) Krause and Mahan's Food & the Nutrition Care Process لمن: الكتاب المقدّس للتغذية الإكلينيكية. لا غنى عنه لأي عامل في المجال. البناء (وهو منطقي جدًا): 1. قسم التقييم: المدخول، السريري (الأنثروبومتري والتحاليل والفحص)، السلوكي/البيئي. 2. قسم التشخيص والتدخل: عملية الرعاية التغذوية، توصيل الغذاء والمغذيات، التثقيف والإرشاد. 3. قسم مراحل الحياة: حمل ورضاعة، رضّع، أطفال، مراهقة، كبار السن. 4. قسم التغذية للصحة والأداء: ضبط الوزن، الرياضة، صحة العظام، الفم والأسنان. 5. قسم التغذية العلاجية: فصل مستقل لكل جهاز — الغدد الصماء والسكري، القلب والأوعية، الكلى، الكبد والبنكرياس، الجهاز الهضمي (علوي/سفلي)، الرئة، الأمراض العصبية، السرطان، المناعة والحساسية، HIV، الرعاية الحرجة، الأمراض النفسية، الاضطرابات الأيضية الوراثية. ما ستخرج به: إطار NCP/PES الذي يُنظّم تفكيرك بالكامل (شرحناه في الجزء الخامس). لكل مرض: الفسيولوجيا المرضية ← الأدوية وتفاعلاتها ← التقييم ← الأهداف ← التدخل ← المتابعة. هذا التسلسل نفسه هو ما يجب أن يصبح عادة ذهنية عندك. ملاحق ثمينة: معادلات الطاقة، جداول تركيب الأغذية، مستويات الأنظمة العلاجية، أدوات المسح. كيف تقرأه: لا يُقرأ خطيًا. اقرأ قسمي التقييم والتدخل كاملَين (هما المنهج)، ثم فصل المرض الذي أمامك حالة منه. راجع الفصل كلما استقبلت حالة جديدة — ستلاحظ أنك تفهمه بشكل أعمق في كل مرة. نقطة ضعف: أمريكي التوجه (وحدات وأنظمة رعاية)، وضخم بشكل مرهب. ابدأ بفصل واحد. 13) Nutrition Therapy and Pathophysiology — Nelms & Sucher بديل/رفيق ممتاز لـ Krause ، وميزته الحاسمة أنه يربط الفسيولوجيا المرضية بالتدخل الغذائي بشكل صريح في كل فصل: تفهم لماذا يقيَّد البوتاسيوم في الفشل الكلوي، لا أنه يُقيَّد فحسب. يحتوي على دراسات حالة تعليمية ممتازة مع أسئلة. الأفضل للتعلّم ، بينما Krause الأفضل كمرجع . 14) Manual of Dietetic Practice — الجمعية البريطانية لأخصائيي التغذية (BDA) النسخة البريطانية/الأوروبية، وميزته أنه عملي ومختصر ومنظّم للممارسة اليومية : بروتوكولات واضحة، وحدات SI، وسياق أنظمة صحية عامة. إذا كنت تعمل خارج الولايات المتحدة، ستجده أقرب لواقعك. 15) The ASPEN Adult Nutrition Support Core Curriculum المرجع المتخصص في الدعم التغذوي : التغذية المعوية (Enteral) والوريدية (Parenteral). تركيب المحاليل، اختيار الأنبوب، المضاعفات وإدارتها، الوصول الوريدي، الحالات الحرجة، متلازمة الأمعاء القصيرة، متلازمة إعادة التغذية. إذا كنت ستعمل في المستشفيات أو العناية المركزة، هذا الكتاب غير قابل للاستبدال. بجانبه: إرشادات ESPEN (مجانية على الإنترنت): إرشادات منفصلة للعناية المركزة، الكبد، الكلى، السرطان، الجراحة، كبار السن... محدّثة ومسندة ومختصرة. 16) Nutrition Care Manual — الأكاديمية الأمريكية للتغذية منصة إلكترونية أكثر منها كتابًا: أنظمة غذائية جاهزة، مواد تثقيفية للمرضى بلغات متعددة، وأدلة قائمة على الأدلة. أداة عمل يومية. 6.4 تقييم الحالة الغذائية 17) Nutritional Assessment — Robert Lee & David Nieman المرجع الأشمل والأوضح في التقييم. يخصص فصلًا لكل محور: التقييم الغذائي وأدواته وأخطائها، الأنثروبومتري بالتفصيل (بروتوكولات القياس نفسها خطوة بخطوة)، التقييم الحيوي (البيوكيميائي)، الفحص الإكلينيكي، والتقييم في الأمراض المزمنة والمجتمع. ما ستخرج به: أهم ما فيه هو التفكير النقدي في الأداة نفسها : ما مصادر الخطأ؟ ما الصدق (Validity) والثبات (Reliability)؟ متى تعطيك الأداة رقمًا صحيحًا واستنتاجًا خاطئًا؟ هذا الوعي هو الفرق بين من يجمع أرقامًا ومن يقيّم حالة. كيف تقرأه: خطيًا، مع تطبيق كل تقنية عمليًا على نفسك وعلى زميل. القياس مهارة يدوية لا تُتقن بالقراءة. 18) ADA/Academy Pocket Guide to Nutrition Assessment — Charney & Malone مرجع جيب مختصر جدًا: القيم المرجعية، أدوات المسح، معادلات التقدير، جداول التفسير. تحمله معك في الجولة السريرية. 19) International Standards for Anthropometric Assessment — ISAK الدليل المعياري لقياسات الجسم: النقاط التشريحية الدقيقة، تقنية القياس، حساب خطأ القياس التقني (TEM). إذا كنت ستقيس ثنايا الجلد بجدية، فهذا الدليل (مع تدريب معتمد) ضرورة. 6.5 الإرشاد والاستشارة وتغيير السلوك 20) Motivational Interviewing: Helping People Change — William Miller & Stephen Rollnick الكتاب الأصل الذي أسّس المنهج كله. يشرح روح المقابلة التحفيزية وعملياتها الأربع: الإشراك (Engaging) ← التركيز (Focusing) ← الاستحضار (Evoking) ← التخطيط (Planning) ، ومهارات OARS، وكيف تتعرّف على \"حديث التغيير\" و\"حديث المحافظة\" وتستجيب لكل منهما. ما ستخرج به: تحوّل جذري في طريقة جلوسك أمام العميل — من \"خبير يعطي تعليمات\" إلى \"شريك يستخرج دافعًا موجودًا بالفعل\". أهم درس واحد: مقاومة العميل غالبًا نتاج أسلوبك أنت، لا عناده هو. كيف تقرأه: ببطء، مع تسجيل جلساتك (بإذن) والاستماع إليها. المهارة لا تُكتسب إلا بالممارسة والتغذية الراجعة. 21) Motivational Interviewing in Nutrition and Fitness — Dawn Clifford & Laura Curtis ترجمة منهج Miller & Rollnick إلى سياق التغذية والوزن تحديدًا ، بحوارات نموذجية كثيرة وتمارين. الأقرب للتطبيق المباشر في عيادة التغذية، ويتناول أيضًا نهج \"الصحة بكل الأحجام\" (HAES) والتعامل مع وصمة الوزن. 22) Nutrition Counseling and Education Skill Development — Holli & Beto كتاب دراسي متكامل: نظريات تغيير السلوك، مهارات الاتصال والإصغاء، إدارة الجلسة، التثقيف الجماعي، تصميم المواد التعليمية، وتوثيق الجلسات. الأفضل إذا أردت منهجًا أكاديميًا منظمًا لا مجرد أسلوب. 23) Health Behavior: Theory, Research, and Practice — Glanz, Rimer & Viswanath المرجع الأم لنظريات السلوك الصحي (HBM, TTM, SCT, SDT, النموذج البيئي الاجتماعي، انتشار المستحدثات). إذا كنت تعمل في الصحة العامة أو تصميم البرامج ، فهذا كتابك. 24) قراءات مساندة عالية القيمة Intuitive Eating — Tribole & Resch: منهج الأكل الحدسي؛ مهم للتعامل مع من أرهقتهم دورة الحميات، ولمراجعة علاقتك أنت بالطعام كمهني. Thinking, Fast and Slow — Kahneman: لفهم كيف يتخذ الناس (والمهنيون) قراراتهم فعليًا. Atomic Habits — James Clear: إطار عملي بسيط لتصميم العادات (المحفّز، الرغبة، الاستجابة، المكافأة) يُترجم مباشرة إلى أهداف غذائية. 6.6 مسار قراءة مقترح (12 شهرًا) المرحلة المدة المحتوى 1. التأسيس شهر 1–2 Understanding Nutrition كاملًا + إرشادات غذائية وطنية 2. الأيض شهر 3–5 Gropper (فصول المغذيات الكبرى بعمق، الدقيقة كمرجع) 3. الإكلينيكي شهر 6–8 Krause (قسما التقييم والتدخل) + Nelms لدراسات الحالة + إرشادات ESPEN 4. التقييم شهر 8–9 Lee & Nieman مع تطبيق عملي 5. الرياضي شهر 9–11 Anita Bean ← Burke Clinical Sports Nutrition + مواقف ISSN 6. الإرشاد شهر 11–12 Miller & Rollnick + Clifford & Curtis مع ممارسة مسجّلة مستمر يوميًا ورقة بحثية واحدة أسبوعيًا + مراجعة حالة واحدة كيف تقرأ ورقة علمية بذكاء (وتُحصّن نفسك ضد الضجيج) 1. صمم الدراسة أهم من نتيجتها: تجربة عشوائية محكمة دراسة أتراب دراسة حالات شواهد تقرير حالة رأي خبير. 2. الارتباط ليس سببية — والدراسات الرصدية في التغذية تعاني من عوامل مربكة كثيرة. 3. افحص العيّنة: فئران؟ خلايا؟ 12 طالبًا جامعيًا؟ لا تعمّم على مريضك. 4. الأهمية الإحصائية ≠ الأهمية الإكلينيكية: فرق 0.4 كجم \"معنوي إحصائيًا\" لا يعني شيئًا للمريض. 5. الحجم المطلق مقابل النسبي: \"خفض الخطر 50%\" قد يعني من 2 في الألف إلى 1 في الألف. 6. من موّل الدراسة؟ ليس سببًا للرفض، لكنه سبب للتدقيق. 7. الأدلة تُبنى على المجموع: المراجعات المنهجية والتحليلات البعدية أوثق من دراسة مفردة."}, {"i": 7, "group": "guide", "tag": "حالات", "num": "7", "short": "أمثلة تطبيقية شاملة", "html": "<h1>الجزء السابع: أمثلة تطبيقية شاملة (دراسات حالة)</h1>\n<h2>الحالة 1 — سمنة + مقدمات سكري</h2>\n<blockquote class=\"note\"><p>رجل 42 سنة، 104 كجم، 175 سم، محيط خصر 115 سم. HbA1c = 6.1%، دهون ثلاثية 210، HDL 34، ضغط 138/88. عمل مكتبي، لا يمارس رياضة، يتناول العشاء متأخرًا وكميات كبيرة.</p></blockquote>\n<p><strong>التقييم:</strong> BMI = 104 ÷ (1.75)² = <strong>34</strong> (سمنة درجة 1). محيط خصر عالي الخطورة. المعايير مجتمعة (خصر + ثلاثية مرتفعة + HDL منخفض + ضغط مرتفع + سكر مضطرب) تحقق <strong>المتلازمة الأيضية</strong>.</p>\n<p><strong>PES:</strong> زيادة المدخول من الطاقة والسكريات المضافة (P) مرتبطة بأنماط أكل مسائية وخمول (E) كما يتضح من BMI 34 ومحيط خصر 115 سم ودهون ثلاثية 210 (S).</p>\n<p><strong>الخطة:</strong></p>\n<ul><li>BMR (Mifflin) = (10×104)+(6.25×175)−(5×42)+5 = 1040+1093.75−210+5 = <strong>1929</strong> · TDEE = ×1.3 ≈ <strong>2508</strong></li><li>الهدف: <strong>2000 kcal</strong> (عجز ~500) → ~0.5 كجم/أسبوع؛ هدف أولي <strong>فقد 10% = 10 كجم في 5–6 شهور</strong></li><li>بروتين 1.4 جم/كجم (على وزن معدّل) ≈ 130 جم · ألياف 30–35 جم · صوديوم &lt;2300 مجم · إلغاء المشروبات المحلاة والعصائر</li><li>نشاط: مشي 30 دقيقة × 5 + مقاومة يومان/أسبوع + رفع NEAT (وقوف/سلالم)</li><li>سلوكي: تقديم العشاء ساعتين، طبق نصفه خضار، تسجيل غذائي 3 أيام</li><li><strong>المتابعة:</strong> وزن ومحيط خصر كل أسبوعين؛ إعادة التحاليل بعد 3 شهور</li></ul>\n<hr>\n<h2>الحالة 2 — سكري نوع ثاني + اعتلال كلوي مبكر</h2>\n<blockquote class=\"note\"><p>سيدة 58 سنة، 78 كجم، 158 سم، سكري منذ 9 سنوات، HbA1c 8.4%، eGFR 48، بوتاسيوم 5.2، ضغط 145/85. تتناول ميتفورمين + ACEi.</p></blockquote>\n<p><strong>التحليل:</strong> BMI 31.2 · <strong>CKD مرحلة 3a</strong> · بوتاسيوم في الحد الأعلى — و<strong>ACEi يرفع البوتاسيوم</strong> → منع بدائل الملح تمامًا.</p>\n<p><strong>الخطة:</strong></p>\n<ul><li>طاقة: عجز معتدل لفقد 5–7% من الوزن</li><li><strong>بروتين 0.8 جم/كجم ≈ 62 جم</strong> (تقييد معتدل بإشراف، مع أولوية للجودة)</li><li>صوديوم &lt;2000 مجم · فوسفور: تجنّب المضافات (PHOS) والمشروبات الغازية الداكنة واللحوم المصنعة</li><li>بوتاسيوم: تقليل الموز والبرتقال والبطاطس والطماطم المركزة؛ تعليم تقنية سلق البطاطس والنقع</li><li>كربوهيدرات موزعة بانتظام وGL منخفض · متابعة B12 (ميتفورمين طويل الأمد)</li><li><strong>متابعة:</strong> إلكتروليتات وeGFR كل 3 شهور، سجل سكر</li></ul>\n<hr>\n<h2>الحالة 3 — عدّاءة مسافات + توقف الدورة الشهرية</h2>\n<blockquote class=\"note\"><p>عدّاءة 23 سنة، 52 كجم، 168 سم، نسبة دهون 12%، تجري 90 كم/أسبوع، انقطعت الدورة منذ 8 شهور، كسر إجهاد سابق في الساق، مدخول مقدّر 2100 kcal، تتجنب الدهون \"خوفًا من الوزن\".</p></blockquote>\n<p><strong>الحساب:</strong> طاقة التمرين ≈ 800 kcal/يوم · FFM = 52 × 0.88 ≈ 45.8 كجم <strong>EA = (2100 − 800) ÷ 45.8 ≈ 28 kcal/kg FFM</strong> → <strong>أقل من عتبة 30 → توافر طاقة منخفض.</strong></p>\n<p><strong>التشخيص:</strong> <strong>RED-S</strong> (انقطاع طمث + كسر إجهاد + EA منخفض).</p>\n<p><strong>الخطة:</strong></p>\n<ul><li>زيادة الطاقة تدريجيًا <strong>+300 إلى +500 kcal/يوم</strong> للوصول إلى EA <span class=\"ltr\">≥45</span> (هدف ~3200 kcal)، مع خفض مؤقت لحجم التدريب</li><li>دهون <span class=\"ltr\">≥25</span>% من الطاقة (ضرورية للهرمونات) · كربوهيدرات 7–8 جم/كجم · بروتين 1.6</li><li>كالسيوم 1500 مجم + فيتامين D حسب التحليل</li><li><strong>إحالة إلزامية:</strong> طبيب نساء + طبيب رياضي + دعم نفسي (تقييم اضطراب أكل)</li><li><strong>ملاحظة حاسمة:</strong> لا يُحل هذا الوضع بتعديل التدريب وحده — عودة الدورة مؤشر الشفاء الرئيسي، وقد تستغرق شهورًا.</li></ul>\n<hr>\n<h2>الحالة 4 — مسنّ بعد جراحة + خطر إعادة تغذية</h2>\n<blockquote class=\"note\"><p>رجل 74 سنة، 48 كجم، 170 سم، بعد جراحة قولون، لم يأكل تقريبًا 8 أيام، فوسفات 2.3 مجم/دل (منخفض)، بوتاسيوم 3.2.</p></blockquote>\n<p><strong>التحليل:</strong> BMI = 16.6 (نقص وزن شديد) + صيام &gt;5 أيام + إلكتروليتات منخفضة → <strong>خطر مرتفع جدًا لمتلازمة إعادة التغذية</strong>.</p>\n<p><strong>الخطة:</strong></p>\n<ul><li><strong>ثيامين 200–300 مجم قبل بدء التغذية</strong> + فيتامينات ب ومتعدد</li><li><strong>ابدأ بـ 10 kcal/كجم = 480 kcal/يوم فقط</strong>، وارفع تدريجيًا خلال 4–7 أيام حتى 25–30 kcal/كجم</li><li>تصحيح الفوسفات والبوتاسيوم والماغنسيوم <strong>قبل وأثناء</strong> التغذية</li><li>تغذية معوية (أنبوب) إذا كان المدخول الفموي غير كافٍ — الأمعاء تعمل → استخدمها</li><li><strong>مراقبة يومية</strong> للإلكتروليتات وتوازن السوائل والقلب في أول 3–5 أيام</li><li>بروتين 1.2–1.5 جم/كجم بعد استقرار الطاقة</li></ul>\n<hr>\n<h2>الحالة 5 — قولون عصبي + قلق من الطعام</h2>\n<blockquote class=\"note\"><p>سيدة 31 سنة، انتفاخ وإسهال متقطع، منظار سليم، سيلياك مستبعد. حذفت الجلوتين والألبان والبصل والفواكه من تلقاء نفسها، وتخاف من الأكل خارج المنزل.</p></blockquote>\n<p><strong>الخطة:</strong></p>\n<ol><li>تطمين وتفسير: IBS اضطراب وظيفي حقيقي — الأعراض ليست \"في الخيال\".</li><li>أولًا: أساسيات أثبتت فعاليتها (وجبات منتظمة، تقليل الكافيين والكحول والدهون العالية والمحليات السكرية-الكحولية، مضغ جيد، إدارة التوتر) — كثيرون يتحسنون هنا بلا حمية معقدة.</li><li>إذا لم تكفِ: <strong>FODMAP منخفضة لـ 4 أسابيع فقط</strong> بإشراف، ثم <strong>إعادة إدخال منهجية مجموعة مجموعة</strong> لتحديد المحفزات الفعلية.</li><li><strong>الأهم:</strong> توسيع النظام مجددًا. التقييد المزمن يفقر الميكروبيوم ويغذّي القلق الغذائي.</li><li>راقب علامات <strong>الأكل الصحي المَرَضي (Orthorexia)</strong> والقلق — أحِل نفسيًا عند الحاجة.</li></ol>\n<hr>", "text": "الجزء السابع: أمثلة تطبيقية شاملة (دراسات حالة) الحالة 1 — سمنة + مقدمات سكري رجل 42 سنة، 104 كجم، 175 سم، محيط خصر 115 سم. HbA1c = 6.1%، دهون ثلاثية 210، HDL 34، ضغط 138/88. عمل مكتبي، لا يمارس رياضة، يتناول العشاء متأخرًا وكميات كبيرة. التقييم: BMI = 104 ÷ (1.75)² = 34 (سمنة درجة 1). محيط خصر عالي الخطورة. المعايير مجتمعة (خصر + ثلاثية مرتفعة + HDL منخفض + ضغط مرتفع + سكر مضطرب) تحقق المتلازمة الأيضية . PES: زيادة المدخول من الطاقة والسكريات المضافة (P) مرتبطة بأنماط أكل مسائية وخمول (E) كما يتضح من BMI 34 ومحيط خصر 115 سم ودهون ثلاثية 210 (S). الخطة: BMR (Mifflin) = (10×104)+(6.25×175)−(5×42)+5 = 1040+1093.75−210+5 = 1929 · TDEE = ×1.3 ≈ 2508 الهدف: 2000 kcal (عجز ~500) → ~0.5 كجم/أسبوع؛ هدف أولي فقد 10% = 10 كجم في 5–6 شهور بروتين 1.4 جم/كجم (على وزن معدّل) ≈ 130 جم · ألياف 30–35 جم · صوديوم <2300 مجم · إلغاء المشروبات المحلاة والعصائر نشاط: مشي 30 دقيقة × 5 + مقاومة يومان/أسبوع + رفع NEAT (وقوف/سلالم) سلوكي: تقديم العشاء ساعتين، طبق نصفه خضار، تسجيل غذائي 3 أيام المتابعة: وزن ومحيط خصر كل أسبوعين؛ إعادة التحاليل بعد 3 شهور الحالة 2 — سكري نوع ثاني + اعتلال كلوي مبكر سيدة 58 سنة، 78 كجم، 158 سم، سكري منذ 9 سنوات، HbA1c 8.4%، eGFR 48، بوتاسيوم 5.2، ضغط 145/85. تتناول ميتفورمين + ACEi. التحليل: BMI 31.2 · CKD مرحلة 3a · بوتاسيوم في الحد الأعلى — و ACEi يرفع البوتاسيوم → منع بدائل الملح تمامًا. الخطة: طاقة: عجز معتدل لفقد 5–7% من الوزن بروتين 0.8 جم/كجم ≈ 62 جم (تقييد معتدل بإشراف، مع أولوية للجودة) صوديوم <2000 مجم · فوسفور: تجنّب المضافات (PHOS) والمشروبات الغازية الداكنة واللحوم المصنعة بوتاسيوم: تقليل الموز والبرتقال والبطاطس والطماطم المركزة؛ تعليم تقنية سلق البطاطس والنقع كربوهيدرات موزعة بانتظام وGL منخفض · متابعة B12 (ميتفورمين طويل الأمد) متابعة: إلكتروليتات وeGFR كل 3 شهور، سجل سكر الحالة 3 — عدّاءة مسافات + توقف الدورة الشهرية عدّاءة 23 سنة، 52 كجم، 168 سم، نسبة دهون 12%، تجري 90 كم/أسبوع، انقطعت الدورة منذ 8 شهور، كسر إجهاد سابق في الساق، مدخول مقدّر 2100 kcal، تتجنب الدهون \"خوفًا من الوزن\". الحساب: طاقة التمرين ≈ 800 kcal/يوم · FFM = 52 × 0.88 ≈ 45.8 كجم EA = (2100 − 800) ÷ 45.8 ≈ 28 kcal/kg FFM → أقل من عتبة 30 → توافر طاقة منخفض. التشخيص: RED S (انقطاع طمث + كسر إجهاد + EA منخفض). الخطة: زيادة الطاقة تدريجيًا +300 إلى +500 kcal/يوم للوصول إلى EA ≥ 45 (هدف ~3200 kcal)، مع خفض مؤقت لحجم التدريب دهون ≥25% من الطاقة (ضرورية للهرمونات) · كربوهيدرات 7–8 جم/كجم · بروتين 1.6 كالسيوم 1500 مجم + فيتامين D حسب التحليل إحالة إلزامية: طبيب نساء + طبيب رياضي + دعم نفسي (تقييم اضطراب أكل) ملاحظة حاسمة: لا يُحل هذا الوضع بتعديل التدريب وحده — عودة الدورة مؤشر الشفاء الرئيسي، وقد تستغرق شهورًا. الحالة 4 — مسنّ بعد جراحة + خطر إعادة تغذية رجل 74 سنة، 48 كجم، 170 سم، بعد جراحة قولون، لم يأكل تقريبًا 8 أيام، فوسفات 2.3 مجم/دل (منخفض)، بوتاسيوم 3.2. التحليل: BMI = 16.6 (نقص وزن شديد) + صيام 5 أيام + إلكتروليتات منخفضة → خطر مرتفع جدًا لمتلازمة إعادة التغذية . الخطة: ثيامين 200–300 مجم قبل بدء التغذية + فيتامينات ب ومتعدد ابدأ بـ 10 kcal/كجم = 480 kcal/يوم فقط ، وارفع تدريجيًا خلال 4–7 أيام حتى 25–30 kcal/كجم تصحيح الفوسفات والبوتاسيوم والماغنسيوم قبل وأثناء التغذية تغذية معوية (أنبوب) إذا كان المدخول الفموي غير كافٍ — الأمعاء تعمل → استخدمها مراقبة يومية للإلكتروليتات وتوازن السوائل والقلب في أول 3–5 أيام بروتين 1.2–1.5 جم/كجم بعد استقرار الطاقة الحالة 5 — قولون عصبي + قلق من الطعام سيدة 31 سنة، انتفاخ وإسهال متقطع، منظار سليم، سيلياك مستبعد. حذفت الجلوتين والألبان والبصل والفواكه من تلقاء نفسها، وتخاف من الأكل خارج المنزل. الخطة: 1. تطمين وتفسير: IBS اضطراب وظيفي حقيقي — الأعراض ليست \"في الخيال\". 2. أولًا: أساسيات أثبتت فعاليتها (وجبات منتظمة، تقليل الكافيين والكحول والدهون العالية والمحليات السكرية الكحولية، مضغ جيد، إدارة التوتر) — كثيرون يتحسنون هنا بلا حمية معقدة. 3. إذا لم تكفِ: FODMAP منخفضة لـ 4 أسابيع فقط بإشراف، ثم إعادة إدخال منهجية مجموعة مجموعة لتحديد المحفزات الفعلية. 4. الأهم: توسيع النظام مجددًا. التقييد المزمن يفقر الميكروبيوم ويغذّي القلق الغذائي. 5. راقب علامات الأكل الصحي المَرَضي (Orthorexia) والقلق — أحِل نفسيًا عند الحاجة."}, {"i": 8, "group": "guide", "tag": "أسئلة", "num": "8", "short": "بنك الأسئلة", "html": "<h1>الجزء الثامن: بنك الأسئلة</h1><div class=\"jump\"><div class=\"eyebrow\">نسخة تفاعلية</div><p>أسئلة هذا الجزء متاحة في صيغة تفاعلية داخل تبويب <strong>الاختبارات</strong>: الإجابة تُصحَّح فورًا، والشرح يظهر بعد اختيارك لا قبله، والنتيجة تُعرض على شريط النطاق المرجعي مع مراجعة كاملة لأخطائك. عرض الأسئلة وإجاباتها معًا في صفحة واحدة يلغي فائدة الاختبار.</p><button class=\"btn\" data-jump=\"quiz\">افتح الاختبارات</button></div>\n<h2>أولًا: اختيار من متعدد (40 سؤالًا)</h2>\n<p><strong>التغذية العامة</strong></p>\n<ol><li>الأثر الحراري الأعلى بين المغذيات الكبرى ينتمي إلى: أ) الكربوهيدرات ب) الدهون ج) البروتين د) الكحول</li><li>الحمل الجلايسيمي (GL) يختلف عن المؤشر الجلايسيمي (GI) في أنه يأخذ في الاعتبار: أ) نوع السكر ب) كمية الكربوهيدرات في الحصة ج) محتوى الدهون د) طريقة الطهي</li><li>الفيتامين الذي يتعارض مباشرة مع فعالية الوارفارين: أ) A ب) D ج) E د) K</li><li>أدق معادلة موصى بها لتقدير BMR في عموم البالغين: أ) Harris-Benedict ب) Mifflin-St Jeor ج) Cunningham د) Owen</li><li>أفضل معزّز لامتصاص الحديد غير الهيمي: أ) الكالسيوم ب) فيتامين C ج) التانينات د) الفيتات</li><li>مكوّن إنفاق الطاقة الأكثر تباينًا بين الأفراد: أ) BMR ب) TEF ج) NEAT د) EAT</li><li>DIAAS يتفوق على PDCAAS لأنه: أ) أبسط حسابيًا ب) يقيس الهضم في نهاية اللفائفي ويسمح بقيم &gt;1.0 ج) يهمل الهضم د) يقتصر على النباتات</li><li>نظام AMDR للدهون: أ) 10–20% ب) 20–35% ج) 35–50% د) 45–65%</li><li>النقص الأشهر لدى النباتيين الصرف: أ) فيتامين C ب) B12 ج) فيتامين K د) الصوديوم</li><li>تحويل ALA النباتي إلى EPA/DHA في الجسم: أ) كامل ب) ~50% ج) محدود جدًا (&lt;10%) د) لا يحدث إطلاقًا</li></ol>\n<p><strong>التغذية الرياضية</strong></p>\n<ol><li>نظام الطاقة السائد في جهد أقصى مدته 8 ثوانٍ: أ) ATP-PCr ب) الجليكوليتي ج) الأكسدي د) بيتا أكسدة</li><li>الحد الأقصى لأكسدة الكربوهيدرات خارجية المصدر مع مصادر متعددة النقل: أ) 30 جم/ساعة ب) 60 جم/ساعة ج) 90 جم/ساعة د) 150 جم/ساعة</li><li>جرعة الكرياتين الصيانية اليومية: أ) 1 جم ب) 3–5 جم ج) 10 جم د) 20 جم</li><li>عتبة الليوسين التقريبية لتحفيز أقصى لبناء البروتين العضلي: أ) 0.5 جم ب) 1 جم ج) 2.5–3 جم د) 10 جم</li><li>أعراض التنميل (Paresthesia) مرتبطة بمكمل: أ) الكرياتين ب) بيتا-ألانين ج) الكافيين د) النترات</li><li>عتبة توافر الطاقة المنخفض المرتبط بـ RED-S: أ) &lt;45 ب) &lt;40 ج) &lt;30 د) &lt;20 kcal/kg FFM</li><li>فقدان السوائل الذي يبدأ عنده هبوط الأداء: أ) 0.5% ب) 1% ج) 2% د) 5% من وزن الجسم</li><li>بروتوكول تحميل الكربوهيدرات الحديث: أ) 3 جم/كجم لأسبوع ب) 10–12 جم/كجم لمدة 36–48 ساعة ج) 20 جم/كجم ليوم د) استنزاف قاسٍ 7 أيام</li><li>نقص صوديوم الدم المرتبط بالمجهود سببه الأساسي: أ) قلة الشرب ب) الإفراط في شرب الماء الخالي من الإلكتروليتات ج) الكافيين د) الكربوهيدرات</li><li>جرعة الكافيين الفعالة للأداء: أ) 0.5 مجم/كجم ب) 3–6 مجم/كجم ج) 15 مجم/كجم د) 25 مجم/كجم</li></ol>\n<p><strong>التغذية العلاجية</strong></p>\n<ol><li>البروتين الموصى به لمريض غسيل كلوي دموي: أ) 0.6 ب) 0.8 ج) 1.0–1.2 د) 2.5 جم/كجم</li><li>الاضطراب الإلكتروليتي المميز لمتلازمة إعادة التغذية: أ) فرط صوديوم ب) نقص فوسفات ج) فرط كالسيوم د) نقص كلور</li><li>الفيتامين الواجب إعطاؤه <strong>قبل</strong> بدء التغذية في مرضى سوء التغذية الشديد: أ) C ب) D ج) B1 (ثيامين) د) K</li><li>مريض تليّف كبد بلا اعتلال دماغي — البروتين المناسب: أ) 0.5 ب) 0.8 ج) 1.2–1.5 د) 3.0 جم/كجم</li><li>الفوسفور الأخطر لمريض الكلى: أ) العضوي في اللحوم ب) العضوي في البقول ج) المضافات غير العضوية (PHOS) د) في الحبوب الكاملة</li><li>حمية FODMAP المنخفضة يجب أن تكون: أ) دائمة ب) ثلاث مراحل مع إعادة إدخال ج) بلا إشراف د) للسيلياك</li><li>قاعدة علاج نقص السكر: أ) 5–5 ب) 15–15 ج) 30–30 د) 50–50</li><li>مشروب/طعام يجب تجنبه مع الستاتينات: أ) الليمون ب) الجريب فروت ج) التفاح د) الشاي الأخضر</li><li>الفركتوز المضاف والبيرة يرتبطان بزيادة نوبات: أ) الصداع النصفي ب) النقرس ج) الربو د) السيلياك</li><li>التدخل الأول والأقوى في الكبد الدهني غير الكحولي: أ) مكمل فيتامين E ب) فقد 7–10% من الوزن ج) منع الكربوهيدرات كليًا د) الأدوية</li></ol>\n<p><strong>التقييم والإرشاد</strong></p>\n<ol><li>الألبيومين مؤشر تغذوي ضعيف لأنه: أ) يرتفع مع الجفاف فقط ب) بروتين طور حاد سالب يتأثر بالالتهاب ج) لا يُقاس بدقة د) عمره النصفي ساعتان</li><li>فقد وزن غير مقصود يُعد علامة حمراء إذا تجاوز: أ) 2% في 6 شهور ب) 5% في سنة ج) 10% في 6 شهور د) 20% في سنتين</li><li>أداة المسح الأنسب لكبار السن: أ) MUST ب) NRS-2002 ج) MNA د) STAMP</li><li>تشخيص سوء التغذية بمعايير GLIM يتطلب: أ) معيارًا ظاهريًا فقط ب) معيارًا سببيًا فقط ج) معيارًا ظاهريًا + سببيًا د) ثلاثة معايير سببية</li><li>الفيريتين قد يعطي نتيجة مضللة لأنه: أ) بروتين طور حاد موجب يرتفع مع الالتهاب ب) لا يعكس الحديد ج) يتأثر بالصيام د) يقاس في البول</li><li>صياغة PES تتكون من: أ) الوقاية-التقييم-العلاج ب) المشكلة-السبب-العلامات ج) الخطة-التنفيذ-المتابعة د) الغذاء-الدواء-الرياضة</li><li>\"مصيدة التصحيح\" (Righting Reflex) تعني: أ) تصحيح وزن المريض ب) اندفاع المرشد لتصويب العميل مما يولّد مقاومة ج) تصحيح المعادلة د) إعادة القياس</li><li>في سلم الجاهزية، إذا قال العميل 6، السؤال الأنسب: أ) \"ليه مش 9؟\" ب) \"ليه 6 مش 3؟\" ج) \"ليه بس 6؟\" د) \"لازم توصل 10\"</li><li>الأداة الأدق لتقدير مدخول فرد بعينه: أ) FFQ ب) سجل طعام موزون 3–7 أيام ج) استرجاع 24 ساعة مرة واحدة د) الملاحظة العابرة</li><li>المعيار الذهبي لقياس إنفاق الطاقة في المرضى الحرجين: أ) Mifflin ب) BIA ج) قياس السعرات غير المباشر د) BMI</li></ol>\n<h3>مفتاح الإجابات</h3>\n<p>1-ج · 2-ب · 3-د · 4-ب · 5-ب · 6-ج · 7-ب · 8-ب · 9-ب · 10-ج 11-أ · 12-ج · 13-ب · 14-ج · 15-ب · 16-ج · 17-ج · 18-ب · 19-ب · 20-ب 21-ج · 22-ب · 23-ج · 24-ج · 25-ج · 26-ب · 27-ب · 28-ب · 29-ب · 30-ب 31-ب · 32-ج · 33-ج · 34-ج · 35-أ · 36-ب · 37-ب · 38-ب · 39-ب · 40-ج</p>\n<hr>\n<h2>ثانيًا: أسئلة حسابية (مع الحل)</h2>\n<p><strong>س1:</strong> امرأة 35 سنة، 68 كجم، 165 سم، تتمرن 3 أيام/أسبوع. احسب BMR وTDEE وماكروز عجز 15%.</p>\n<blockquote class=\"note\"><p>BMR = (10×68)+(6.25×165)−(5×35)−161 = 680+1031.25−175−161 = <strong>1375 kcal</strong> TDEE = 1375 × 1.375 ≈ <strong>1891</strong> · الهدف = 1891 × 0.85 ≈ <strong>1607 kcal</strong> بروتين 1.6×68 = 109 جم (436) · دهون 0.8×68 = 54 جم (490) · كربوهيدرات = (1607−926)÷4 ≈ <strong>170 جم</strong></p></blockquote>\n<p><strong>س2:</strong> رياضي 70 كجم؛ الوزن قبل التمرين 70.0 وبعده 68.6، شرب 600 مل، لم يتبول، مدة التمرين 90 دقيقة. احسب معدل التعرق وكمية التعويض.</p>\n<blockquote class=\"note\"><p>الفقد = 1.4 كجم + 0.6 لتر مشروب = <strong>2.0 لتر في 1.5 ساعة → 1.33 لتر/ساعة</strong> التعويض بعد التمرين = 1.4 × 1.5 = <strong>2.1 لتر</strong> مع صوديوم</p></blockquote>\n<p><strong>س3:</strong> مريض سكري نوع أول، TDD = 50 وحدة، سيتناول 75 جم كربوهيدرات، سكره الحالي 240 والهدف 120. احسب الجرعة.</p>\n<blockquote class=\"note\"><p>ICR = 500÷50 = 10 → جرعة الوجبة = 75÷10 = <strong>7.5 وحدة</strong> ISF = 1800÷50 = 36 → التصحيح = (240−120)÷36 ≈ <strong>3.3 وحدة</strong> → المجموع ≈ <strong>10.8 وحدة</strong></p></blockquote>\n<p><strong>س4:</strong> مريض 80 كجم في العناية المركزة. احسب نطاق الطاقة والبروتين.</p>\n<blockquote class=\"note\"><p>الطاقة: 25–30 × 80 = <strong>2000–2400 kcal</strong> · البروتين: 1.2–2.0 × 80 = <strong>96–160 جم</strong></p></blockquote>\n<p><strong>س5:</strong> رياضي 60 كجم، مدخول 2400 kcal، طاقة التمرين 700 kcal، نسبة دهون 15%. احسب EA وفسّر.</p>\n<blockquote class=\"danger\"><p>FFM = 60 × 0.85 = 51 كجم · EA = (2400−700)÷51 = <strong>33.3 kcal/kg FFM</strong> التفسير: أعلى من عتبة الخطر (30) لكن <strong>أقل من الأمثل (45)</strong> → مؤشر إنذار مبكر، ينبغي رفع المدخول.</p></blockquote>\n<p><strong>س6:</strong> مريض وزنه المعتاد 82 كجم وأصبح 71 كجم خلال 5 شهور. هل هذا فقد ذو دلالة؟</p>\n<blockquote class=\"note\"><p>% الفقد = (82−71)÷82 × 100 = <strong>13.4% خلال 5 شهور</strong> → يتجاوز عتبة 10%/6 شهور → <strong>فقد شديد وعلامة حمراء</strong>.</p></blockquote>\n<hr>\n<h2>ثالثًا: أسئلة مقالية وتفكير نقدي</h2>\n<ol><li>اشرح لماذا يُعد الألبيومين مؤشرًا مضللًا لسوء التغذية في المريض الحاد، وما البدائل الأفضل؟</li><li>قارن بين تقييد البروتين في الفشل الكلوي قبل الغسيل وبعده، مع تبرير فسيولوجي لكل حالة.</li><li>ناقش: \"الصيام المتقطع أفضل من العجز الحراري التقليدي لإنقاص الوزن.\" — قيّم العبارة بالأدلة.</li><li>صمّم خطة تغذوية ليوم مباراة لاعب كرة سلة 90 كجم في مباراة الساعة 8 مساءً، مع مبررات لكل قرار.</li><li>اشرح مفهوم \"التغذية الدورية (Periodized Nutrition)\" وكيف يختلف عن الخطة الثابتة.</li><li>مريضة سمنة قالت: \"أنا مش بآكل حاجة أصلًا ومش بنزل.\" — كيف تتعامل معها منهجيًا (تقييميًا وسلوكيًا) دون اتهامها؟</li><li>اكتب صياغة PES كاملة لمريض سكري نوع ثاني لا يعرف حساب الكربوهيدرات.</li><li>ما آلية متلازمة إعادة التغذية، ولماذا يُعطى الثيامين قبل التغذية تحديدًا؟</li><li>حلّل: لماذا لا يُنصح بحمية FODMAP المنخفضة كنظام دائم رغم فعاليتها في تخفيف الأعراض؟</li><li>اشرح لماذا قد ترتفع مؤشرات \"النقص\" في مريض التهابي دون أن يكون النقص حقيقيًا، مستعينًا بالفيريتين وCRP.</li><li>قارن بين BIA وDEXA وثنايا الجلد من حيث الدقة والتكلفة والصلاحية للمتابعة الدورية.</li><li>متى تُحيل عميلًا إلى طبيب أو معالج نفسي فورًا؟ اذكر خمس علامات إنذار.</li></ol>\n<hr>", "text": "الجزء الثامن: بنك الأسئلة أولًا: اختيار من متعدد (40 سؤالًا) التغذية العامة 1. الأثر الحراري الأعلى بين المغذيات الكبرى ينتمي إلى: أ) الكربوهيدرات ب) الدهون ج) البروتين د) الكحول 2. الحمل الجلايسيمي (GL) يختلف عن المؤشر الجلايسيمي (GI) في أنه يأخذ في الاعتبار: أ) نوع السكر ب) كمية الكربوهيدرات في الحصة ج) محتوى الدهون د) طريقة الطهي 3. الفيتامين الذي يتعارض مباشرة مع فعالية الوارفارين: أ) A ب) D ج) E د) K 4. أدق معادلة موصى بها لتقدير BMR في عموم البالغين: أ) Harris Benedict ب) Mifflin St Jeor ج) Cunningham د) Owen 5. أفضل معزّز لامتصاص الحديد غير الهيمي: أ) الكالسيوم ب) فيتامين C ج) التانينات د) الفيتات 6. مكوّن إنفاق الطاقة الأكثر تباينًا بين الأفراد: أ) BMR ب) TEF ج) NEAT د) EAT 7. DIAAS يتفوق على PDCAAS لأنه: أ) أبسط حسابيًا ب) يقيس الهضم في نهاية اللفائفي ويسمح بقيم 1.0 ج) يهمل الهضم د) يقتصر على النباتات 8. نظام AMDR للدهون: أ) 10–20% ب) 20–35% ج) 35–50% د) 45–65% 9. النقص الأشهر لدى النباتيين الصرف: أ) فيتامين C ب) B12 ج) فيتامين K د) الصوديوم 10. تحويل ALA النباتي إلى EPA/DHA في الجسم: أ) كامل ب) ~50% ج) محدود جدًا (<10%) د) لا يحدث إطلاقًا التغذية الرياضية 11. نظام الطاقة السائد في جهد أقصى مدته 8 ثوانٍ: أ) ATP PCr ب) الجليكوليتي ج) الأكسدي د) بيتا أكسدة 12. الحد الأقصى لأكسدة الكربوهيدرات خارجية المصدر مع مصادر متعددة النقل: أ) 30 جم/ساعة ب) 60 جم/ساعة ج) 90 جم/ساعة د) 150 جم/ساعة 13. جرعة الكرياتين الصيانية اليومية: أ) 1 جم ب) 3–5 جم ج) 10 جم د) 20 جم 14. عتبة الليوسين التقريبية لتحفيز أقصى لبناء البروتين العضلي: أ) 0.5 جم ب) 1 جم ج) 2.5–3 جم د) 10 جم 15. أعراض التنميل (Paresthesia) مرتبطة بمكمل: أ) الكرياتين ب) بيتا ألانين ج) الكافيين د) النترات 16. عتبة توافر الطاقة المنخفض المرتبط بـ RED S: أ) <45 ب) <40 ج) <30 د) <20 kcal/kg FFM 17. فقدان السوائل الذي يبدأ عنده هبوط الأداء: أ) 0.5% ب) 1% ج) 2% د) 5% من وزن الجسم 18. بروتوكول تحميل الكربوهيدرات الحديث: أ) 3 جم/كجم لأسبوع ب) 10–12 جم/كجم لمدة 36–48 ساعة ج) 20 جم/كجم ليوم د) استنزاف قاسٍ 7 أيام 19. نقص صوديوم الدم المرتبط بالمجهود سببه الأساسي: أ) قلة الشرب ب) الإفراط في شرب الماء الخالي من الإلكتروليتات ج) الكافيين د) الكربوهيدرات 20. جرعة الكافيين الفعالة للأداء: أ) 0.5 مجم/كجم ب) 3–6 مجم/كجم ج) 15 مجم/كجم د) 25 مجم/كجم التغذية العلاجية 21. البروتين الموصى به لمريض غسيل كلوي دموي: أ) 0.6 ب) 0.8 ج) 1.0–1.2 د)
