\"><table><thead><tr><th>المستوى</th><th>النوع</th><th>ملاحظة</th></tr></thead><tbody><tr><td>الأعلى</td><td>المراجعات المنهجية والتحليلات البعدية للتجارب العشوائية</td><td>بشرط جودة الدراسات المضمّنة</td></tr><tr><td></td><td>التجارب العشوائية المحكمة</td><td>المعيار الذهبي للسببية</td></tr><tr><td></td><td>دراسات الأتراب</td><td>قوية للارتباط، ضعيفة للسببية</td></tr><tr><td></td><td>دراسات الحالات والشواهد</td><td>عرضة لتحيز الاسترجاع</td></tr><tr><td></td><td>سلاسل وتقارير الحالة</td><td>توليد فرضيات</td></tr><tr><td>الأدنى</td><td>رأي الخبير والدراسات الحيوانية والمخبرية</td><td>لا تُعمَّم على البشر مباشرة</td></tr></tbody></table></div>\n<p><strong>تحذير خاص بالتغذية:</strong> التجارب العشوائية صعبة (التعمية شبه مستحيلة، الالتزام ضعيف، الأمراض تستغرق عقودًا)، لذلك تعتمد كثير من التوصيات على تقارب أنواع متعددة من الأدلة.</p>\n<h3>3. مسارات الرعاية والعمل الجماعي</h3>\n<p>الدليل يضع أخصائي التغذية دائمًا <strong>داخل فريق</strong> ضمن <strong>مسار</strong> محدد: من يحيل؟ متى؟ ما المعايير؟ من يتابع؟ متى يُغلق الملف؟</p>\n<div class=\"tablewrap\"><table><thead><tr><th>الحالة</th><th>الفريق النموذجي</th></tr></thead><tbody><tr><td>عسر البلع</td><td>الطبيب، أخصائي التخاطب (يحدد القوام)، التمريض، أخصائي التغذية</td></tr><tr><td>السكري</td><td>الطبيب، ممرض السكري، أخصائي التغذية، أخصائي القدم</td></tr><tr><td>اضطرابات الأكل</td><td>الطبيب النفسي، المعالج النفسي، أخصائي التغذية المتخصص، الطبيب العام</td></tr><tr><td>الكلى</td><td>طبيب الكلى، الصيدلي، أخصائي التغذية الكلوية، تمريض الغسيل</td></tr><tr><td>الدعم التغذوي المنزلي</td><td>الفريق الطبي، الصيدلي، التمريض المجتمعي، أخصائي التغذية</td></tr></tbody></table></div>\n<h3>4. المسح والتدعيم: التدخل المتدرج</h3>\n<p>الدليل يعرض سلّمًا متدرجًا للدعم التغذوي، لا تقفز فيه درجة دون سبب:</p>\n<ol><li><strong>المسح الروتيني</strong> (MUST في المملكة المتحدة) لكل مريض عند الدخول وبانتظام.</li><li><strong>التدعيم الغذائي:</strong> رفع كثافة الأطعمة المعتادة (زيت، زبدة، مسحوق حليب، جبن) دون زيادة حجمها.</li><li><strong>الوجبات الخفيفة الكثيفة</strong> بين الوجبات.</li><li><strong>المكملات الفموية (ONS)</strong> بين الوجبات لا بدلًا منها.</li><li><strong>التغذية المعوية</strong> إن لم تكفِ الخطوات السابقة.</li><li><strong>التغذية الوريدية</strong> إن تعذّر المعوي.</li></ol>\n<h3>5. الكفاءة الثقافية</h3>\n<p>يتعامل الدليل مع التنوع الثقافي والديني كجزء من الممارسة، لا هامش لها:</p>\n<ul><li><strong>الصيام الديني</strong> (رمضان وغيره): تقييم فردي، تكييف الخطة والأدوية بالتنسيق مع الطبيب، لا منع تلقائي ولا تجاهل.</li><li><strong>القيود الغذائية الدينية:</strong> الحلال، الكوشر، النباتية لأسباب دينية — وتأثيرها على المكملات والتركيبات.</li><li><strong>الأنماط الغذائية التقليدية:</strong> بناء الخطة على أطعمة المريض المألوفة لا استبدالها بأطعمة غريبة عنه.</li><li><strong>اللغة ومستوى التعليم الصحي:</strong> المترجمون، المواد المبسطة، التحقق من الفهم.</li></ul>\n<h3>6. التوثيق والإطار المهني</h3>\n<ul><li><strong>التوثيق حماية:</strong> ما لم يُكتب لم يحدث. يشمل التقييم، القرار، المبررات، ما قيل للمريض، وموقفه.</li><li><strong>الموافقة المستنيرة:</strong> شرح ما ستفعله والبدائل والحدود.</li><li><strong>نطاق الممارسة:</strong> ما يحق لأخصائي التغذية فعله قانونيًا في نظامه، ومتى يجب أن يحيل.</li><li><strong>الحماية:</strong> التعامل مع الفئات المعرضة للخطر (أطفال، كبار سن، ذوو إعاقة).</li></ul>\n<h3>7. مؤشرات الجودة</h3>\n<p>كيف تقيس جودة خدمتك؟ الدليل يميز بين:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>نوع المؤشر</th><th>مثال</th></tr></thead><tbody><tr><td><strong>البنية</strong></td><td>وجود أخصائي تغذية لكل عدد معين من الأسرّة</td></tr><tr><td><strong>العملية</strong></td><td>نسبة المرضى الممسوحين خلال 24 ساعة من الدخول</td></tr><tr><td><strong>النتيجة</strong></td><td>نسبة المرضى الذين توقف فقد وزنهم أثناء الإقامة</td></tr></tbody></table></div>\n<h2>أرقام وأدوات يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>المعلومة</th></tr></thead><tbody><tr><td>أداة المسح الأساسية</td><td>MUST: BMI + فقد الوزن غير المقصود + أثر المرض الحاد</td></tr><tr><td>تحويل السكر</td><td>mg/dL ÷ 18 = mmol/L</td></tr><tr><td>الصوديوم والملح</td><td>1 جم صوديوم ≈ 2.5 جم ملح</td></tr><tr><td>الهدف الصحي للملح</td><td>أقل من 6 جم ملح يوميًا في الإرشادات البريطانية (وأقل من 5 جم في WHO)</td></tr><tr><td>سلم الدعم</td><td>مسح ← تدعيم ← وجبات خفيفة ← ONS ← معوي ← وريدي</td></tr><tr><td>إطار السؤال الإكلينيكي</td><td>PICO: المريض، التدخل، المقارنة، النتيجة</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — مريضة مسنّة في المجتمع:</strong> امرأة 79 سنة تعيش وحدها، أحالها الطبيب العام لفقد وزن. درجة MUST = 2 (خطر مرتفع). صيام شهر رمضان على الأبواب وتريد أن تصوم.</p>\n<p><strong>التطبيق بأسلوب الدليل:</strong></p>\n<ol><li><strong>التقييم الشامل:</strong> سبب الفقد (طبي؟ أسنان؟ عزلة؟ دخل؟ قدرة على الطهي؟).</li><li><strong>سلّم الدعم:</strong> ابدأ بالتدعيم الغذائي لأطعمتها المألوفة، ثم الوجبات الخفيفة الكثيفة، ثم ONS إن لزم.</li><li><strong>الكفاءة الثقافية:</strong> لا تمنعها من الصيام تلقائيًا ولا تتجاهل الخطر. ناقش معها ومع طبيبها: هل حالتها تسمح؟ إن صامت، كيف نضمن كثافة السحور والإفطار؟ ما علامات الإفطار الفوري؟ احترم قرارها ضمن حدود السلامة.</li><li><strong>الفريق والمسار:</strong> تنسيق مع الطبيب العام، وربطها بخدمة وجبات منزلية أو دعم اجتماعي، وتحديد موعد متابعة.</li><li><strong>التوثيق:</strong> التقييم، الخطة، النقاش حول الصيام، رأيها وقرارها، والإحالات.</li><li><strong>مؤشر النتيجة:</strong> توقف فقد الوزن خلال 4 أسابيع.</li></ol></blockquote>\n<h2>أخطاء شائعة عند استخدام الدليل</h2>\n<ul><li><strong>استخدامه كمصدر فهم نظري</strong> — هو دليل تنفيذ يفترض أن الفهم موجود.</li><li><strong>الاعتماد على جداوله دون التحقق من التحديث</strong> — الإرشادات تتغير أسرع من الطبعات.</li><li><strong>نقل الأرقام البريطانية حرفيًا</strong> إلى سياق آخر دون مراجعة الإرشادات المحلية.</li><li><strong>إهمال فصول الأخلاقيات والتوثيق</strong> باعتبارها إدارية — هي ما يحميك مهنيًا وقانونيًا.</li></ul>\n<h2>كيف تستخدمه: خطة ستة أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>الممارسة القائمة على الأدلة</td><td>صغ 5 أسئلة PICO من حالاتك وابحث عن إجابتها</td></tr><tr><td>2</td><td>الأخلاقيات والتوثيق والإطار المهني</td><td>راجع توثيقك لآخر 5 حالات بمعايير الدليل</td></tr><tr><td>3</td><td>المسح والدعم التغذوي</td><td>طبّق MUST على 10 حالات وسلّم الدعم</td></tr><tr><td>4</td><td>المجتمع والصحة العامة</td><td>صمم تدخلًا مجتمعيًا بسيطًا بمؤشر نتيجة</td></tr><tr><td>5</td><td>الكفاءة الثقافية</td><td>خطة لمريض صائم ولآخر بقيود غذائية دينية</td></tr><tr><td>6</td><td>الفصول العلاجية حسب حالاتك</td><td>استخدم الجداول الملخصة كمرجع يومي</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> عملي ومختصر، مكتوب للممارس الفعلي، منظور الأنظمة الصحية العامة، اهتمام بالمجتمع والثقافة والأخلاقيات، وجداول جاهزة للاستخدام.</p>\n<p><strong>الضعف:</strong> أقل عمقًا في الفسيولوجيا والآليات من الكتب الأمريكية الكبرى، توجه بريطاني في الإرشادات والمنتجات، وليس بديلًا عن كتاب نظري.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>صغ سؤال PICO لموضوع غذائي تختلف فيه مع زميل، وابحث عن أفضل دليل.</li><li>أي الأضلاع الثلاثة للممارسة القائمة على الأدلة تهمله أنت أكثر في عملك؟</li><li>راجع آخر ملف وثّقته: لو قرأه زميل غدًا، هل يستطيع إكمال الرعاية دون الاتصال بك؟</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Krause أو Nelms</strong> للأساس النظري · <strong>إرشادات NICE و ESPEN</strong> للتحديث المستمر · <strong>دليل جمعيتك المهنية المحلية</strong> لنطاق الممارسة في بلدك.</p>", "text": "Manual of Dietetic Practice الناشر الجمعية البريطانية لأخصائيي التغذية (BDA)، بتحرير جماعي (Joan Gandy محررة رئيسية في طبعات حديثة) المستوى ممارس الجمهور أخصائيو التغذية العاملون، طلاب التدريب الميداني، العاملون في أنظمة صحية عامة الطابع دليل تنفيذ عملي مختصر بمنظور بريطاني وأوروبي الرفيق كتاب نظري (Krause أو Nelms) + إرشادات NICE و ESPEN لماذا قد يناسبك أكثر من Krause؟ Krause مكتوب لنظام رعاية أمريكي، بوحدات أمريكية، وأطعمة أمريكية، وتركيز على المستشفى. أما هذا الدليل فمكتوب لأخصائي يعمل في نظام صحي عام : يتنقل بين المستشفى والعيادة المجتمعية والرعاية الأولية، ويعمل ضمن مسارات رعاية محددة، ويستخدم وحدات SI (mmol/L للسكر مثلًا)، ويتعامل مع مجتمع متعدد الثقافات. لكثير من الأنظمة الصحية خارج الولايات المتحدة — ومنها أنظمة عربية متأثرة بالنموذج البريطاني — هذا أقرب للواقع اليومي. والأهم أنه مكتوب للتنفيذ : ما الذي تفعله بالضبط، بأي ترتيب، ومع من. خريطة الكتاب الجزء الأول: مبادئ الممارسة الممارسة القائمة على الأدلة كعملية منهجية. الأخلاقيات والإطار المهني والقانوني. الاتصال والتثقيف وتغيير السلوك. التقييم الغذائي وأدوات المسح المستخدمة في المملكة المتحدة. التوثيق وإدارة السجلات. الجزء الثاني: التغذية في المجتمع والصحة العامة السياسات الغذائية، التدعيم، البرامج المجتمعية، التغذية في الرعاية الأولية، والفئات المهمشة (اللاجئون، المشردون، ذوو الدخل المنخفض). الجزء الثالث: مراحل الحياة الحمل والرضاعة، الرضّع والأطفال، المراهقون، البالغون، كبار السن — مع اهتمام بالسياقات الثقافية والدينية. الجزء الرابع: الدعم التغذوي المسح، المكملات الفموية، التدعيم الغذائي، التغذية المعوية والوريدية، والدعم في المنزل ودور الرعاية. الجزء الخامس: التغذية العلاجية فصول الأمراض بنفس المنطق: الجهاز الهضمي، الكبد، الكلى، القلب، السكري، السمنة، الحساسية، الأمراض العصبية، السرطان، الصحة النفسية، الاضطرابات الأيضية الوراثية، وغيرها — مع جداول ملخصة قابلة للاستخدام الفوري. الملاحق تركيب الأغذية، التركيبات التجارية، المعادلات، جداول التحويل، القيم المرجعية. المفاهيم المحورية بالتفصيل 1. الممارسة القائمة على الأدلة كعملية لا شعار الخطوة ما تفعله مثال 1. اسأل صياغة سؤال إكلينيكي محدد (إطار PICO) في مرضى القولون العصبي (P)، هل حمية FODMAP المنخفضة (I) مقارنة بالنصائح العامة (C) تقلل الأعراض (O)؟ 2. ابحث البحث المنهجي عن أفضل دليل قواعد البيانات، المراجعات المنهجية، الإرشادات 3. قيّم التقييم النقدي للدليل التصميم، العينة، التحيز، حجم الأثر 4. طبّق دمج الدليل مع خبرتك وتفضيلات المريض هل يستطيع هذا المريض تطبيق الحمية؟ 5. راجع تقييم النتيجة وتعديل الممارسة هل تحسنت الأعراض؟ النقطة الجوهرية: الأدلة وحدها لا تكفي. الممارسة القائمة على الأدلة = أفضل دليل + خبرة الممارس + قيم المريض وظروفه . إهمال أي ضلع يفسد القرار. 2. هرم الأدلة المستوى النوع ملاحظة الأعلى المراجعات المنهجية والتحليلات البعدية للتجارب العشوائية بشرط جودة الدراسات المضمّنة التجارب العشوائية المحكمة المعيار الذهبي للسببية دراسات الأتراب قوية للارتباط، ضعيفة للسببية دراسات الحالات والشواهد عرضة لتحيز الاسترجاع سلاسل وتقارير الحالة توليد فرضيات الأدنى رأي الخبير والدراسات الحيوانية والمخبرية لا تُعمَّم على البشر مباشرة تحذير خاص بالتغذية: التجارب العشوائية صعبة (التعمية شبه مستحيلة، الالتزام ضعيف، الأمراض تستغرق عقودًا)، لذلك تعتمد كثير من التوصيات على تقارب أنواع متعددة من الأدلة. 3. مسارات الرعاية والعمل الجماعي الدليل يضع أخصائي التغذية دائمًا داخل فريق ضمن مسار محدد: من يحيل؟ متى؟ ما المعايير؟ من يتابع؟ متى يُغلق الملف؟ الحالة الفريق النموذجي عسر البلع الطبيب، أخصائي التخاطب (يحدد القوام)، التمريض، أخصائي التغذية السكري الطبيب، ممرض السكري، أخصائي التغذية، أخصائي القدم اضطرابات الأكل الطبيب النفسي، المعالج النفسي، أخصائي التغذية المتخصص، الطبيب العام الكلى طبيب الكلى، الصيدلي، أخصائي التغذية الكلوية، تمريض الغسيل الدعم التغذوي المنزلي الفريق الطبي، الصيدلي، التمريض المجتمعي، أخصائي التغذية 4. المسح والتدعيم: التدخل المتدرج الدليل يعرض سلّمًا متدرجًا للدعم التغذوي، لا تقفز فيه درجة دون سبب: 1. المسح الروتيني (MUST في المملكة المتحدة) لكل مريض عند الدخول وبانتظام. 2. التدعيم الغذائي: رفع كثافة الأطعمة المعتادة (زيت، زبدة، مسحوق حليب، جبن) دون زيادة حجمها. 3. الوجبات الخفيفة الكثيفة بين الوجبات. 4. المكملات الفموية (ONS) بين الوجبات لا بدلًا منها. 5. التغذية المعوية إن لم تكفِ الخطوات السابقة. 6. التغذية الوريدية إن تعذّر المعوي. 5. الكفاءة الثقافية يتعامل الدليل مع التنوع الثقافي والديني كجزء من الممارسة، لا هامش لها: الصيام الديني (رمضان وغيره): تقييم فردي، تكييف الخطة والأدوية بالتنسيق مع الطبيب، لا منع تلقائي ولا تجاهل. القيود الغذائية الدينية: الحلال، الكوشر، النباتية لأسباب دينية — وتأثيرها على المكملات والتركيبات. الأنماط الغذائية التقليدية: بناء الخطة على أطعمة المريض المألوفة لا استبدالها بأطعمة غريبة عنه. اللغة ومستوى التعليم الصحي: المترجمون، المواد المبسطة، التحقق من الفهم. 6. التوثيق والإطار المهني التوثيق حماية: ما لم يُكتب لم يحدث. يشمل التقييم، القرار، المبررات، ما قيل للمريض، وموقفه. الموافقة المستنيرة: شرح ما ستفعله والبدائل والحدود. نطاق الممارسة: ما يحق لأخصائي التغذية فعله قانونيًا في نظامه، ومتى يجب أن يحيل. الحماية: التعامل مع الفئات المعرضة للخطر (أطفال، كبار سن، ذوو إعاقة). 7. مؤشرات الجودة كيف تقيس جودة خدمتك؟ الدليل يميز بين: نوع المؤشر مثال البنية وجود أخصائي تغذية لكل عدد معين من الأسرّة العملية نسبة المرضى الممسوحين خلال 24 ساعة من الدخول النتيجة نسبة المرضى الذين توقف فقد وزنهم أثناء الإقامة أرقام وأدوات يجب أن تخرج بها الموضوع المعلومة أداة المسح الأساسية MUST: BMI + فقد الوزن غير المقصود + أثر المرض الحاد تحويل السكر mg/dL ÷ 18 = mmol/L الصوديوم والملح 1 جم صوديوم ≈ 2.5 جم ملح الهدف الصحي للملح أقل من 6 جم ملح يوميًا في الإرشادات البريطانية (وأقل من 5 جم في WHO) سلم الدعم مسح ← تدعيم ← وجبات خفيفة ← ONS ← معوي ← وريدي إطار السؤال الإكلينيكي PICO: المريض، التدخل، المقارنة، النتيجة مثال تطبيقي بأسلوب الكتاب مثال — مريضة مسنّة في المجتمع: امرأة 79 سنة تعيش وحدها، أحالها الطبيب العام لفقد وزن. درجة MUST = 2 (خطر مرتفع). صيام شهر رمضان على الأبواب وتريد أن تصوم. التطبيق بأسلوب الدليل: 1. التقييم الشامل: سبب الفقد (طبي؟ أسنان؟ عزلة؟ دخل؟ قدرة على الطهي؟). 2. سلّم الدعم: ابدأ بالتدعيم الغذائي لأطعمتها المألوفة، ثم الوجبات الخفيفة الكثيفة، ثم ONS إن لزم. 3. الكفاءة الثقافية: لا تمنعها من الصيام تلقائيًا ولا تتجاهل الخطر. ناقش معها ومع طبيبها: هل حالتها تسمح؟ إن صامت، كيف نضمن كثافة السحور والإفطار؟ ما علامات الإفطار الفوري؟ احترم قرارها ضمن حدود السلامة. 4. الفريق والمسار: تنسيق مع الطبيب العام، وربطها بخدمة وجبات منزلية أو دعم اجتماعي، وتحديد موعد متابعة. 5. التوثيق: التقييم، الخطة، النقاش حول الصيام، رأيها وقرارها، والإحالات. 6. مؤشر النتيجة: توقف فقد الوزن خلال 4 أسابيع. أخطاء شائعة عند استخدام الدليل استخدامه كمصدر فهم نظري — هو دليل تنفيذ يفترض أن الفهم موجود. الاعتماد على جداوله دون التحقق من التحديث — الإرشادات تتغير أسرع من الطبعات. نقل الأرقام البريطانية حرفيًا إلى سياق آخر دون مراجعة الإرشادات المحلية. إهمال فصول الأخلاقيات والتوثيق باعتبارها إدارية — هي ما يحميك مهنيًا وقانونيًا. كيف تستخدمه: خطة ستة أسابيع الأسبوع المحتوى التطبيق 1 الممارسة القائمة على الأدلة صغ 5 أسئلة PICO من حالاتك وابحث عن إجابتها 2 الأخلاقيات والتوثيق والإطار المهني راجع توثيقك لآخر 5 حالات بمعايير الدليل 3 المسح والدعم التغذوي طبّق MUST على 10 حالات وسلّم الدعم 4 المجتمع والصحة العامة صمم تدخلًا مجتمعيًا بسيطًا بمؤشر نتيجة 5 الكفاءة الثقافية خطة لمريض صائم ولآخر بقيود غذائية دينية 6 الفصول العلاجية حسب حالاتك استخدم الجداول الملخصة كمرجع يومي نقاط القوة والضعف القوة: عملي ومختصر، مكتوب للممارس الفعلي، منظور الأنظمة الصحية العامة، اهتمام بالمجتمع والثقافة والأخلاقيات، وجداول جاهزة للاستخدام. الضعف: أقل عمقًا في الفسيولوجيا والآليات من الكتب الأمريكية الكبرى، توجه بريطاني في الإرشادات والمنتجات، وليس بديلًا عن كتاب نظري. أسئلة للتأمل بعد القراءة 1. صغ سؤال PICO لموضوع غذائي تختلف فيه مع زميل، وابحث عن أفضل دليل. 2. أي الأضلاع الثلاثة للممارسة القائمة على الأدلة تهمله أنت أكثر في عملك؟ 3. راجع آخر ملف وثّقته: لو قرأه زميل غدًا، هل يستطيع إكمال الرعاية دون الاتصال بك؟ ماذا تقرأ بعده؟ Krause أو Nelms للأساس النظري · إرشادات NICE و ESPEN للتحديث المستمر · دليل جمعيتك المهنية المحلية لنطاق الممارسة في بلدك."}, {"i": 41, "group": "books", "tag": "مكتبة المراجع", "num": "—", "short": "خريطة اختيار: أي كتاب الآن؟", "html": "<h1>خريطة اختيار: أي كتاب الآن؟</h1>\n<h2>حسب موقفك</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>موقفك</th><th>ابدأ بـ</th><th>ثم</th><th>ولماذا</th></tr></thead><tbody><tr><td>مبتدئ تمامًا</td><td>Whitney &amp; Rolfes</td><td>Krause (قسم التقييم)</td><td>أساس نظيف قبل التخصص</td></tr><tr><td>طالب تغذية إكلينيكية</td><td>Nelms بالحالات</td><td>Krause كمرجع دائم</td><td>التعلم بالاشتقاق ثم المرجعية</td></tr><tr><td>تريد فهم \"لماذا\"</td><td>Gropper</td><td>McArdle</td><td>الآلية أولًا ثم تطبيقها على الجهد</td></tr><tr><td>تعمل في مستشفى</td><td>ASPEN + إرشادات ESPEN</td><td>Krause</td><td>الدعم التغذوي هو عملك اليومي</td></tr><tr><td>تعمل مع رياضيين</td><td>McArdle ← Burk    out.push(['نسبة فقد الوزن', pct.toFixed(1)+'%'+(v.mo>0?' خلال '+v.mo+' شهرًا':'')]);

     var sev = (v.mo<=1&&pct>5)||(v.mo<=3&&pct>7.5)||(v.mo<=6&&pct>10)||(v.mo>6&&pct>10);
     var mod = (v.mo<=1&&pct>2)||(v.mo<=6&&pct>5)||pct>5;
     if(sev){out.push(['الدلالة','فقد شديد — علامة حمراء','bad']);
       warn.push('يستوفي معيار GLIM الظاهري. ابحث عن سبب طبي وقيّم سوء التغذية، وانتبه لخطر إعادة التغذية.');}
     else if(mod){out.push(['الدلالة','فقد ذو دلالة — يستوجب تقييمًا','warnc']);}
     else out.push(['الدلالة','ضمن المتوقع','hi']);
   }
  }
  return {rows:out, warn:warn};
 }},

{id:'ea', cat:'رياضي', title:'توافر الطاقة و RED-S',
 note:'الأمثل 45 فأكثر · منخفض دون 30 kcal لكل كجم كتلة خالية من الدهون.',
 f:[
  {k:'kcal', l:'المدخول اليومي (kcal)', t:'n', v:2400},
  {k:'ex', l:'طاقة التمرين اليومية (kcal)', t:'n', v:700},
  {k:'wt', l:'الوزن (كجم)', t:'n', v:60},
  {k:'bf', l:'نسبة الدهون %', t:'n', v:15}
 ],
 run:function(v){
  var ffm=v.wt*(1-v.bf/100), ea=(v.kcal-v.ex)/ffm, out=[], warn=[];
  out.push(['الكتلة الخالية من الدهون', ffm.toFixed(1)+' كجم']);
  out.push(['توافر الطاقة (EA)', ea.toFixed(1)+' kcal/kg FFM', ea<30?'bad':(ea<45?'warnc':'hi')]);
  var st = ea>=45?'أمثل': ea>=30?'دون الأمثل — إنذار مبكر':'منخفض — نطاق RED-S';
  out.push(['التقييم', st, ea<30?'bad':(ea<45?'warnc':'hi')]);
  var need45=45*ffm+ +v.ex;
  out.push(['المدخول اللازم لـ EA=45', Math.round(need45)+' kcal', '']);
  if(ea<30) warn.push('نطاق RED-S: اضطراب هرموني وخطر كسور إجهاد وضعف مناعة. ارفع المدخول تدريجيًا وقلّل الحمل مؤقتًا، وأحِل طبيًا — خصوصًا مع انقطاع الدورة أو كسر إجهاد سابق.');
  else if(ea<45) warn.push('أعلى من عتبة الخطر لكن دون الأمثل — راقب الوزن والدورة والأداء.');
  return {rows:out, warn:warn};
 }},

{id:'sweat', cat:'رياضي', title:'معدل التعرق وتعويض السوائل',
 note:'اشرب لتعويض معظم الفقد لا كله. لا تتجاوز معدل تعرقك.',
 f:[
  {k:'pre', l:'الوزن قبل التمرين (كجم)', t:'n', v:70, step:0.1},
  {k:'post', l:'الوزن بعد التمرين (كجم)', t:'n', v:68.6, step:0.1},
  {k:'drink', l:'السوائل المشروبة (مل)', t:'n', v:600},
  {k:'urine', l:'البول (مل)', t:'n', v:0},
  {k:'min', l:'مدة التمرين (دقيقة)', t:'n', v:90}
 ],
 run:function(v){
  var lossKg=v.pre-v.post, hrs=v.min/60;
  var totalL=lossKg + v.drink/1000 - v.urine/1000;
  var rate=totalL/hrs, pct=lossKg/v.pre*100, out=[], warn=[];
  out.push(['فقد الوزن', lossKg.toFixed(2)+' كجم ('+pct.toFixed(1)+'% من الوزن)', pct>2?'bad':(pct>1?'warnc':'hi')]);
  out.push(['إجمالي التعرق', totalL.toFixed(2)+' لتر']);
  out.push(['معدل التعرق', rate.toFixed(2)+' لتر/ساعة', 'hi']);
  out.push(['الشرب المقترح أثناء التمرين', Math.round(rate*0.8*1000)+' مل/ساعة (نحو 80% من المعدل)']);
  out.push(['التعويض بعد التمرين', Math.round(lossKg*1400)+' مل (1.25–1.5 لتر لكل كجم)']);
  out.push(['الصوديوم المقترح', totalL>1.5?'500–700 مجم/لتر':'حسب الحاجة (جهد قصير)']);
  if(pct>2) warn.push('تجاوزت 2% من وزن الجسم — نطاق يبدأ عنده هبوط الأداء، ويتفاقم في الحر.');
  if(v.drink/1000 > rate*hrs*1.2) warn.push('كمية الشرب تتجاوز معدل التعرق — خطر نقص صوديوم الدم المرتبط بالمجهود.');
  return {rows:out, warn:warn};
 }},

{id:'carb', cat:'رياضي', title:'احتياج الرياضي من الوقود',
 f:[
  {k:'wt', l:'الوزن (كجم)', t:'n', v:70},
  {k:'load', l:'حجم التدريب', t:'sel', o:[['4','خفيف / مهاري'],['6','متوسط ~ساعة/يوم'],['8','عالٍ 1–3 ساعات'],['10','عالٍ جدًا >4 ساعات'],['11','تحميل قبل السباق'],['0','مخصّص'] ], v:'8'},
  {k:'cust', l:'مخصّص (جم/كجم)', t:'n', v:''},
  {k:'pro', l:'البروتين (جم/كجم)', t:'n', v:1.8, step:0.1},
  {k:'dur', l:'مدة جلسة/سباق (دقيقة)', t:'n', v:120}
 ],
 run:function(v){
  var g = (+v.load)||(+v.cust)||6, out=[], warn=[];
  var carb=g*v.wt, pro=v.pro*v.wt;
  out.push(['الكربوهيدرات اليومية', Math.round(carb)+' جم ('+g+' جم/كجم)', 'hi']);
  out.push(['البروتين اليومي', Math.round(pro)+' جم']);
  out.push(['موزّع على 4 وجبات', Math.round(pro/4)+' جم بروتين لكل وجبة']);
  var d=+v.dur, during;
  if(d<45) during='لا حاجة (أو مضمضة كربوهيدرات)';
  else if(d<75) during='كميات صغيرة عند الحاجة';
  else if(d<150) during='30–60 جم/ساعة';
  else during='حتى 90 جم/ساعة بمصادر متعددة النقل (جلوكوز:فركتوز 2:1)';
  out.push(['أثناء الجهد', during]);
  out.push(['وجبة قبل الجهد بـ3 ساعات', Math.round(1.5*v.wt)+'–'+Math.round(3*v.wt)+' جم كربوهيدرات']);
  out.push(['التعافي أول 4 ساعات (إن لزم)', Math.round(1*v.wt)+' جم كربوهيدرات/ساعة + '+Math.round(0.3*v.wt)+' جم بروتين']);
  if(g>=10) warn.push('نطاق التحميل: 36–48 ساعة فقط مع تقليل حاد للحمل التدريبي. توقّع زيادة وزن ماء 1–2 كجم.');
  if(d>=150) warn.push('درّب أمعاءك على هذه الكمية في التدريب قبل السباق — لا تجرّبها يوم المنافسة.');
  return {rows:out, warn:warn};
 }},

{id:'insulin', cat:'علاجي', title:'جرعة الإنسولين (ICR و ISF)',
 note:'تقديرات أولية فقط. الجرعة الفعلية بقرار الطبيب المعالج وتُعدَّل فرديًا.',
 f:[
  {k:'tdd', l:'الجرعة اليومية الكلية TDD (وحدة)', t:'n', v:40},
  {k:'carb', l:'كربوهيدرات الوجبة (جم)', t:'n', v:60},
  {k:'bg', l:'سكر الدم الحالي (mg/dL)', t:'n', v:200},
  {k:'tgt', l:'السكر المستهدف (mg/dL)', t:'n', v:110}
 ],
 run:function(v){
  var icr=500/v.tdd, isf=1800/v.tdd, out=[], warn=[];
  var meal=v.carb/icr, corr=(v.bg-v.tgt)/isf, tot=meal+corr;
  out.push(['نسبة الإنسولين للكربوهيدرات (ICR)', '1 وحدة لكل '+icr.toFixed(1)+' جم']);
  out.push(['عامل الحساسية (ISF)', isf.toFixed(0)+' mg/dL لكل وحدة']);
  out.push(['جرعة الوجبة', meal.toFixed(1)+' وحدة']);
  out.push(['جرعة التصحيح', corr.toFixed(1)+' وحدة', corr<0?'warnc':'']);
  out.push(['الإجمالي التقديري', Math.max(0,tot).toFixed(1)+' وحدة', 'hi']);
  if(v.bg<70) warn.push('سكر أقل من 70 mg/dL: هذه حالة نقص سكر — طبّق قاعدة 15/15 ولا تعطِ تصحيحًا.');
  if(corr<0) warn.push('السكر تحت الهدف — جرعة التصحيح سالبة، أي تُخصم من جرعة الوجبة بقرار طبي.');
  if(v.bg>300) warn.push('سكر مرتفع جدًا — يستوجب تقييمًا طبيًا وفحص الكيتونات.');
  return {rows:out, warn:warn};
 }},

{id:'need', cat:'علاجي', title:'احتياج المريض من الطاقة والبروتين والسوائل',
 note:'الأدق في المرضى الحرجين هو قياس السعرات غير المباشر.',
 f:[
  {k:'wt', l:'الوزن (كجم)', t:'n', v:70},
  {k:'cond', l:'الحالة', t:'sel', o:[
    ['a','بالغ مستقر / صيانة'],['b','إنقاص وزن مُدار'],['c','كبار السن'],
    ['d','مريض حرج مستقر'],['e','إنتان / رضّة'],['f','حروق واسعة'],
    ['g','قرح فراش أو جروح'],['h','CKD 3–4 بلا غسيل'],['i','غسيل دموي'],
    ['j','غسيل بريتوني'],['k','تليّف كبد'],['l','سرطان / دنف'],['n','سمنة في رعاية حرجة (BMI 30–50)'],['o','سمنة مفرطة في رعاية حرجة (BMI >50)'],['m','خطر إعادة تغذية']], v:'a'}
 ],
 run:function(v){
  var T={a:[25,35,0.8,1.2,'—'],b:[20,25,1.2,1.6,'—'],c:[27,30,1.0,1.5,'—'],
   d:[25,30,1.2,2.0,'ابدأ بأقل النطاق وارفع تدريجيًا'],e:[25,30,1.5,2.0,'مرحلة فرط أيض'],
   f:[30,35,1.5,2.0,'قد يرتفع أكثر حسب مساحة الحرق'],g:[30,35,1.25,2.0,'الضغط عامل حاسم مع التغذية'],
   h:[30,35,0.55,0.8,'قيّد الفوسفور وراقب البوتاسيوم'],i:[30,35,1.0,1.2,'سوائل مقيّدة'],
   j:[30,35,1.2,1.3,'احتسب سعرات الجلوكوز الممتصة من المحلول'],
   k:[30,35,1.2,1.5,'وجبة ليلية 50 جم كربوهيدرات'],l:[25,30,1.2,1.5,'إدارة الأعراض أولوية'],
   m:[10,15,0,0,'ثيامين قبل التغذية · تدرّج 4–7 أيام · راقب الفوسفات يوميًا'],
   n:[11,14,0,0,'تغذية ناقصة السعرات عالية البروتين — الطاقة على الوزن الفعلي والبروتين على الوزن المثالي'],
   o:[22,25,0,0,'الطاقة تُحسب على الوزن المثالي لا الفعلي · بروتين حتى 2.5 جم/كجم وزن مثالي']};
  var r=T[v.cond], out=[], warn=[];
  out.push(['الطاقة', Math.round(r[0]*v.wt)+'–'+Math.round(r[1]*v.wt)+' kcal/يوم ('+r[0]+'–'+r[1]+' kcal/كجم)', 'hi']);
  if(v.cond==='n'||v.cond==='o'){
    out.push(['ملاحظة الوزن','أدخل الوزن المثالي في الحقل أعلاه لحساب البروتين بدقة','warnc']);
    var pl = v.cond==='n'?2.0:2.5;
    out.push(['البروتين', 'حتى '+pl+' جم لكل كجم من الوزن المثالي','hi']);
  }
  else if(r[2]) out.push(['البروتين', Math.round(r[2]*v.wt)+'–'+Math.round(r[3]*v.wt)+' جم/يوم ('+r[2]+'–'+r[3]+' جم/كجم)']);
  else out.push(['البروتين', 'يُؤجَّل رفعه حتى استقرار الإلكتروليتات', 'warnc']);
  out.push(['السوائل', Math.round(30*v.wt)+'–'+Math.round(35*v.wt)+' مل/يوم', '']);
  if(r[4]!=='—') out.push(['ملاحظة', r[4], 'warnc']);
  if(v.cond==='m') warn.push('خطر إعادة التغذية: ابدأ 10–15 kcal/كجم، أعطِ الثيامين قبل التغذية، وراقب الفوسفات والبوتاسيوم والماغنسيوم يوميًا في أول 3–5 أيام.');
  if(v.cond==='h') warn.push('امنع بدائل الملح (كلوريد بوتاسيوم) وتجنّب الفوسفات المضاف في المكونات.');
  return {rows:out, warn:warn};
 }},

{id:'refeed', cat:'علاجي', title:'فرز خطر متلازمة إعادة التغذية',
 note:'استرشادي؛ القرار النهائي إكلينيكي.',
 f:[
  {k:'wt', l:'الوزن (كجم)', t:'n', v:50},
  {k:'bmi', l:'مؤشر كتلة الجسم', t:'n', v:17, step:0.1},
  {k:'fast', l:'أيام بلا مدخول يُذكر', t:'n', v:6},
  {k:'loss', l:'فقد وزن خلال 3–6 شهور (%)', t:'n', v:12},
  {k:'lyte', l:'فوسفات/بوتاسيوم/ماغنسيوم منخفضة قبل التغذية؟', t:'sel', o:[['0','لا'],['1','نعم']], v:'0'},
  {k:'alc', l:'كحول أو أدوية (مدرات/إنسولين/كيماوي/مضادات حموضة)؟', t:'sel', o:[['0','لا'],['1','نعم']], v:'0'}
 ],
 run:function(v){
  var major=0, minor=0;
  if(v.bmi<16) major++; else if(v.bmi<18.5) minor++;
  if(v.loss>15) major++; else if(v.loss>10) minor++;
  if(v.fast>10) major++; else if(v.fast>5) minor++;
  if(+v.lyte) major++;
  if(+v.alc) minor++;
  var high = major>=1 || minor>=2;
  var vhigh = v.bmi<14 || v.fast>15 || major>=2;
  var out=[], warn=[];
  out.push(['معايير كبرى', major]);
  out.push(['معايير صغرى', minor]);
  out.push(['التصنيف', vhigh?'خطر مرتفع جدًا':(high?'خطر مرتفع':'خطر منخفض'), vhigh?'bad':(high?'warnc':'hi')]);
  var start = vhigh?5:(high?10:20);
  out.push(['بداية التغذية المقترحة', start+' kcal/كجم = '+Math.round(start*v.wt)+' kcal/يوم', 'hi']);
  out.push(['الهدف بعد التدرج', '25–30 kcal/كجم = '+Math.round(25*v.wt)+'–'+Math.round(30*v.wt)+' kcal']);
  out.push(['مدة التدرج', vhigh?'حتى 7–10 أيام':(high?'4–7 أيام':'حسب التحمّل')]);
  if(high||vhigh) warn.push('أعطِ الثيامين (200–300 مجم) قبل بدء التغذية وفيتامينات ب، وصحّح الفوسفات والبوتاسيوم والماغنسيوم قبل وأثناء التغذية، وراقبها يوميًا مع مراقبة قلبية.');
  return {rows:out, warn:warn};
 }},

{id:'en', cat:'دعم تغذوي', title:'وصفة التغذية المعوية',
 note:'انتبه للماء الحر: التركيبات المركّزة تحوي نحو 70–75% ماء فقط.',
 f:[
  {k:'kcal', l:'هدف الطاقة (kcal/يوم)', t:'n', v:1750},
  {k:'pro', l:'هدف البروتين (جم/يوم)', t:'n', v:98},
  {k:'den', l:'كثافة التركيبة (kcal/مل)', t:'sel', o:[['1.0','1.0'],['1.2','1.2'],['1.5','1.5'],['2.0','2.0']], v:'1.5'},
  {k:'pph', l:'بروتين التركيبة (جم/100 مل)', t:'n', v:6.3, step:0.1},
  {k:'hrs', l:'ساعات الضخ اليومية', t:'n', v:24},
  {k:'fluid', l:'هدف السوائل الكلي (مل/يوم)', t:'n', v:2100}
 ],
 run:function(v){
  var vol=v.kcal/(+v.den), rate=vol/v.hrs, prov=vol*v.pph/100;
  var freeFrac = (+v.den)>=2?0.70:((+v.den)>=1.5?0.72:((+v.den)>=1.2?0.80:0.85));
  var free=vol*freeFrac, extra=v.fluid-free;
  var out=[], warn=[];
  out.push(['حجم التركيبة', Math.round(vol)+' مل/يوم', 'hi']);
  out.push(['معدل الضخ', rate.toFixed(1)+' مل/ساعة على '+v.hrs+' ساعة', 'hi']);
  out.push(['البروتين المُعطى', prov.toFixed(1)+' جم', prov<v.pro*0.95?'bad':'hi']);
  out.push(['الفارق عن الهدف', (prov-v.pro).toFixed(1)+' جم', prov<v.pro?'warnc':'']);
  out.push(['الماء الحر في التركيبة', Math.round(free)+' مل (~'+Math.round(freeFrac*100)+'%)']);
  out.push(['ماء الغسيل الإضافي المطلوب', Math.round(Math.max(0,extra))+' مل/يوم مقسّمة', extra>0?'hi':'']);
  if(prov<v.pro) warn.push('البروتين ناقص '+Math.round(v.pro-prov)+' جم — أضف مسحوق بروتين معياري أو انتقل لتركيبة عالية البروتين.');
  if(rate>150) warn.push('معدل الضخ مرتفع — قد لا يُتحمَّل؛ راجع الكثافة أو مدّد ساعات الضخ.');
  warn.push('ارفع رأس السرير 30–45 درجة، واغسل الأنبوب بـ30 مل ماء قبل وبعد كل استخدام.');
  return {rows:out, warn:warn};
 }},

{id:'pn', cat:'دعم تغذوي', title:'وصفة التغذية الوريدية',
 note:'الدكستروز 3.4 kcal/جم · حد أكسدة الجلوكوز 4–5 مجم/كجم/دقيقة · المستحلب الدهني حتى 1 جم/كجم.',
 f:[
  {k:'wt', l:'الوزن (كجم)', t:'n', v:70},
  {k:'kcal', l:'هدف الطاقة (kcal/يوم)', t:'n', v:1750},
  {k:'pro', l:'البروتين (جم/كجم)', t:'n', v:1.5, step:0.1},
  {k:'fat', l:'الدهون (جم/كجم)', t:'n', v:0.8, step:0.1},
  {k:'hrs', l:'ساعات التسريب', t:'n', v:24}
 ],
 run:function(v){
  var pg=v.pro*v.wt, pk=pg*4, fg=v.fat*v.wt, fk=fg*9;
  var dk=v.kcal-pk-fk, dg=dk/3.4;
  var rate=dg*1000/v.wt/(v.hrs*60);
  var out=[], warn=[];
  out.push(['أحماض أمينية', Math.round(pg)+' جم ('+Math.round(pk)+' kcal)']);
  out.push(['مستحلب دهني', Math.round(fg)+' جم ('+Math.round(fk)+' kcal)', v.fat>1?'bad':'hi']);
  out.push(['دكستروز', Math.round(dg)+' جم ('+Math.round(dk)+' kcal)', dg<0?'bad':'']);
  out.push(['معدل تسريب الجلوكوز', rate.toFixed(2)+' مجم/كجم/دقيقة', rate>5?'bad':(rate>4?'warnc':'hi')]);
  out.push(['نسبة الطاقة غير البروتينية', Math.round((dk+fk))+' kcal ('+Math.round((dk+fk)/v.kcal*100)+'%)']);
  if(rate>5) warn.push('تجاوز حد أكسدة الجلوكوز (4–5 مجم/كجم/دقيقة) — خطر فرط سكر وتشحّم كبدي وزيادة إنتاج CO₂. قلّل الدكستروز أو أطل التسريب.');
  if(v.fat>1) warn.push('الدهون تتجاوز 1 جم/كجم/يوم — راقب الدهون الثلاثية وخطر فرط تحميل الدهون.');
  if(dg<0) warn.push('البروتين والدهون وحدهما يتجاوزان هدف الطاقة — راجع الأرقام.');
  warn.push('راقب الفوسفات والبوتاسيوم والماغنسيوم والسكر ووظائف الكبد، وافطم إلى المعوي عند تغطية >60%.');
  return {rows:out, warn:warn};
 }},

{id:'preg', cat:'مراحل الحياة', title:'الحمل: الزيادة والاحتياج',
 f:[
  {k:'bmi', l:'BMI قبل الحمل', t:'n', v:22, step:0.1},

function toolsHome(){

    'كل نتيجة تُعرض مع تنبيهات السلامة المرتبطة بها.</p>'+
    '<div class="toolrow">'+
    '<button class="btn" data-t="cards">بطاقات المذاكرة</button>'+
    '<button class="btn ghost" data-t="meal">منشئ الوجبات</button>'+
    '<button class="btn ghost" data-t="gloss">المسرد</button>'+
    '<button class="btn ghost" data-t="dri">المرجعيات الغذائية</button>'+
    '<button class="btn ghost" data-t="labs">القيم المرجعية للتحاليل</button>'+
    '<button class="btn ghost" data-t="drugs">تفاعلات الدواء والغذاء</button></div>';
  Object.keys(cats).forEach(function(k){
    h+='<h2>'+esc2(k)+'</h2><div class="grid">';
    cats[k].forEach(function(c){
      h+='<button class="bookcard" data-c="'+c.id+'"><h4>'+esc2(c.title)+'</h4><p>'+
         esc2(c.note||('حاسبة '+k))+'</p></button>';});
    h+='</div>';
  });
  h+='</article>';
  stage.innerHTML=h;
  stage.querySelectorAll('[data-c]').forEach(function(el){
    el.onclick=function(){openCalc(el.dataset.c);};});
  stage.querySelectorAll('[data-t]').forEach(function(el){
    el.onclick=function(){var t=el.dataset.t;
      t==='cards'?openCards(): t==='gloss'?openGloss(): t==='meal'?openMeal():
      t==='dri'?openDRI(): t==='labs'?openLabs(): openDrugs();};});
  setProg(0);
}

function esc2(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function openCalc(id){
  var c=null; CALCS.forEach(function(x){if(x.id===id)c=x;});
  if(!c){toolsHome();return;}
  S.tool=id;
  var h='<div class="qhead"><div><div class="eyebrow">حاسبة · '+esc2(c.cat)+'</div>'+
        '<strong>'+esc2(c.title)+'</strong></div>'+
        '<button class="btn ghost" id="backTools">كل الأدوات</button></div>';
  if(c.note) h+='<div class="explain" style="margin-bottom:1.1rem">'+esc2(c.note)+'</div>';
  h+='<div class="fields">';
  c.f.forEach(function(f){
    h+='<label class="fld"><span>'+esc2(f.l)+'</span>';
    if(f.t==='sel'){
      h+='<select data-k="'+f.k+'">'+f.o.map(function(o){
        return '<option value="'+o[0]+'"'+((f.v!==undefined?f.v:f.o[0][0])===o[0]?' selected':'')+'>'+esc2(o[1])+'</option>';
      }).join('')+'</select>';
    } else {
      h+='<input type="number" inputmode="decimal" step="'+(f.step||1)+'" data-k="'+f.k+'" value="'+
         (f.v===''?'':f.v)+'">';
    }
    h+='</label>';
  });
  h+='</div><div id="cres"></div>';
  stage.innerHTML=h;
  document.getElementById('backTools').onclick=toolsHome;
  var inputs=stage.querySelectorAll('[data-k]');
  function calc(){
    var v={};
    inputs.forEach(function(el){
      var raw=el.value;
      v[el.dataset.k] = (el.tagName==='SELECT') ? raw : (raw===''?0:parseFloat(raw));
      if(el.tagName!=='SELECT' && isNaN(v[el.dataset.k])) v[el.dataset.k]=0;
      if(el.tagName==='SELECT' && /^-?\d/.test(raw)) v[el.dataset.k]=raw;
    });
    var r;
    try{ r=c.run(v); }catch(e){ document.getElementById('cres').innerHTML=
      '<div class="explain">راجع القيم المدخلة.</div>'; return; }
    var out='<div class="resbox"><div class="eyebrow">النتيجة</div><table class="restab"><tbody>';
    r.rows.forEach(function(row){
      out+='<tr class="'+(row[2]||'')+'"><th>'+esc2(row[0])+'</th><td>'+esc2(row[1])+'</td></tr>';});
    out+='</tbody></table>';
    (r.warn||[]).forEach(function(w){
      out+='<div class="calcwarn">'+esc2(w)+'</div>';});
    out+='<div class="copyrow"><button class="btn ghost" id="cpy">نسخ النتيجة</button>'+
         '<button class="btn ghost" id="prt">طباعة</button><span class="copyok" id="cpyok"></span></div></div>';
    document.getElementById('cres').innerHTML=out;
    var txt=c.title+'\n'+'—'.repeat(20)+'\nالمدخلات:\n';
    c.f.forEach(function(f){
      var el=stage.querySelector('[data-k="'+f.k+'"]'); if(!el||el.value==='')return;
      var val = el.tagName==='SELECT' ? el.options[el.selectedIndex].text : el.value;
      txt+='• '+f.l+': '+val+'\n';});
    txt+='\nالنتيجة:\n';
    r.rows.forEach(function(row){txt+='• '+row[0]+': '+row[1]+'\n';});
    if((r.warn||[]).length){txt+='\nتنبيهات:\n';r.warn.forEach(function(w){txt+='! '+w+'\n';});}
    txt+='\n(تقدير استرشادي — يُراجَع إكلينيكيًا)';
    document.getElementById('cpy').onclick=function(){
      var ok=document.getElementById('cpyok');
      function done(){ok.textContent='تم النسخ';setTimeout(function(){ok.textContent='';},1800);}
      function fallback(){
        var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy');done();}catch(e){ok.textContent='تعذّر النسخ';}
        document.body.removeChild(ta);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}
      else fallback();
    };
    document.getElementById('prt').onclick=function(){window.print();};
  }
  inputs.forEach(function(el){el.oninput=calc;el.onchange=calc;});
  calc();
  setProg(50);
}

function openCards(){
  var cats=[]; CARDS.forEach(function(c){if(cats.indexOf(c[0])<0)cats.push(c[0]);});
  S.cardCat='الكل'; S.cardI=0; S.cardShow=false;
  drawCards(cats);
}
function drawCards(cats){
  var pool = S.cardCat==='الكل'?CARDS:CARDS.filter(function(c){return c[0]===S.cardCat;});
  if(S.cardI>=pool.length)S.cardI=0;
  var c=pool[S.cardI];
  var h='<div class="qhead"><div><div class="eyebrow">بطاقات · استدعاء نشط</div>'+
        '<strong>حاول أن تتذكر قبل الكشف</strong></div>'+
        '<button class="btn ghost" id="backTools">كل الأدوات</button></div>'+
        '<div class="chips"><button class="chip'+(S.cardCat==='الكل'?' on':'')+'" data-cc="الكل">الكل</button>'+
        cats.map(function(k){return '<button class="chip'+(S.cardCat===k?' on':'')+'" data-cc="'+k+'">'+esc2(k)+'</button>';}).join('')+
        '</div><div class="counter" style="margin:.6rem 0">'+(S.cardI+1)+' / '+pool.length+'</div>'+
        '<div class="flash'+(S.cardShow?' open':'')+'" id="flash">'+
        '<div class="fq">'+esc2(c[1])+'</div>'+
        (S.cardShow?'<div class="fa">'+esc2(c[2])+'</div>':'<div class="ftap">اضغط للكشف</div>')+
        '</div><div class="qnav">'+
        '<button class="btn ghost" id="pv">السابقة</button>'+
        '<button class="btn" id="nx" style="margin-inline-start:auto">'+(S.cardShow?'التالية':'اكشف')+'</button></div>';
  stage.innerHTML=h;
  document.getElementById('backTools').onclick=toolsHome;
  document.getElementById('flash').onclick=function(){S.cardShow=!S.cardShow;drawCards(cats);};
  document.getElementById('nx').onclick=function(){
    if(!S.cardShow){S.cardShow=true;}else{S.cardI++;S.cardShow=false;}drawCards(cats);};
  document.getElementById('pv').onclick=function(){
    S.cardI=(S.cardI-1+pool.length)%pool.length;S.cardShow=false;drawCards(cats);};
  stage.querySelectorAll('[data-cc]').forEach(function(el){
    el.onclick=function(){S.cardCat=el.dataset.cc;S.cardI=0;S.cardShow=false;drawCards(cats);};});
  setProg((S.cardI/Math.max(1,pool.length-1))*100);
}

function openGloss(){
  var h='<div class="qhead"><div><div class="eyebrow">مسرد</div>'+
        '<strong>المصطلحات والمختصرات</strong></div>'+
        '<button class="btn ghost" id="backTools">كل الأدوات</button></div>'+
        '<input class="search" id="gq" placeholder="ابحث في '+GLOSS.length+' مصطلحًا…" style="margin-bottom:1rem">'+
        '<div id="glist"></div>';
  stage.innerHTML=h;
  document.getElementById('backTools').onclick=toolsHome;
  function draw(q){
    var L=GLOSS.slice().sort(function(a,b){return a[0].localeCompare(b[0],'ar');}).filter(function(g){
      return !q || g[0].toLowerCase().indexOf(q.toLowerCase())>-1 || g[1].indexOf(q)>-1 || g[2].indexOf(q)>-1;});
    document.getElementById('glist').innerHTML = L.length?
      L.map(function(g){return '<div class="gitem"><b>'+esc2(g[0])+'</b><span class="gtag">'+esc2(g[2])+
        '</span><p>'+esc2(g[1])+'</p></div>';}).join('') :
      '<div class="explain">لا نتائج.</div>';
  }
  draw('');
  document.getElementById('gq').oninput=function(){draw(this.value.trim());};
  setProg(50);
}

<script>/* ===== عارض جدول مرجعي قابل للبحث والفلترة ===== */
function refView(cfg){
  S.tool=cfg.id;
  var cats=[]; cfg.rows.forEach(function(r){var c=r[cfg.catIdx]; if(cats.indexOf(c)<0)cats.push(c);});
  S.refCat='الكل'; S.refQ='';
  function draw(){
    var L=cfg.rows.filter(function(r){
      var okc = S.refCat==='الكل' || r[cfg.catIdx]===S.refCat;
      var q=S.refQ.trim();
      var okq = !q || r.join(' ').toLowerCase().indexOf(q.toLowerCase())>-1;
      return okc && okq;
    });
    var t='<div class="tablewrap"><table><thead><tr>'+
      cfg.head.map(function(x){return '<th>'+esc2(x)+'</th>';}).join('')+'</tr></thead><tbody>';
    L.forEach(function(r){
      t+='<tr>'+cfg.cols.map(function(ci,n){
        var v=r[ci]==null?'':r[ci];
        var cls = (cfg.hiCol===n)?' class="num"':'';
        if(cfg.sevIdx!=null && ci===cfg.sevIdx)
          cls=' class="'+(v==='عالية'?'no':(v==='متوسطة'?'warn':'yes'))+'"';
        return '<td'+cls+'>'+esc2(v)+'</td>';
      }).join('')+'</tr>';
    });
    t+='</tbody></table></div>';
    setTimeout(function(){ if(window.fixBidi) fixBidi(document.getElementById('rbody')); },0);
    document.getElementById('rbody').innerHTML = L.length? t :
      '<div class="explain">لا نتائج مطابقة.</div>';
    document.getElementById('rcount').textContent = L.length+' من '+cfg.rows.length;
  }
  var h='<div class="qhead"><div><div class="eyebrow">مرجع</div><strong>'+esc2(cfg.title)+'</strong></div>'+
        '<button class="btn ghost" id="backTools">كل الأدوات</button></div>';
  if(cfg.note) h+='<div class="explain" style="margin-bottom:1rem">'+cfg.note+'</div>';
  h+='<input class="search" id="rq" placeholder="'+esc2(cfg.ph||'ابحث…')+'" style="margin-bottom:.6rem">'+
     '<div class="chips"><button class="chip on" data-rc="الكل">الكل</button>'+
     cats.map(function(c){return '<button class="chip" data-rc="'+esc2(c)+'">'+esc2(c)+'</button>';}).join('')+
     '</div><div class="counter" id="rcount" style="margin:.5rem 0"></div><div id="rbody"></div>';
  stage.innerHTML=h;
  document.getElementById('backTools').onclick=toolsHome;
  document.getElementById('rq').oninput=function(){S.refQ=this.value;draw();};
  stage.querySelectorAll('[data-rc]').forEach(function(el){
    el.onclick=function(){
      S.refCat=el.dataset.rc;
      stage.querySelectorAll('[data-rc]').forEach(function(x){x.classList.toggle('on',x===el);});
      draw();};});
  draw();
  setProg(50);
}

/* ===== حاسبة الأطفال ===== */
var PEDCALC = {
 id:'ped', cat:'مراحل الحياة', title:'الأطفال: السوائل والطاقة والنمو',
 note:'السوائل بقاعدة Holliday-Segar للصيانة فقط — لا تشمل عجز الجفاف أو الفقد الجاري.',
 f:[
  {k:'wt', l:'الوزن (كجم)', t:'n', v:12, step:0.1},
  {k:'age', l:'العمر', t:'sel', o:[
    ['0.3','0–6 شهور'],['0.8','7–12 شهرًا'],['2','1–3 سنوات'],
    ['5','4–8 سنوات'],['11','9–13 سنة'],['16','14–18 سنة']], v:'2'},
  {k:'sex', l:'الجنس', t:'sel', o:[['m','ذكر'],['f','أنثى']]},
  {k:'muac', l:'محيط منتصف العضد (سم) — من 6 إلى 59 شهرًا', t:'n', v:''},
  {k:'edema', l:'وذمة تنقّرية في القدمين؟', t:'sel', o:[['0','لا'],['1','نعم']], v:'0'},
  {k:'z', l:'الوزن مقابل الطول (Z-score)', t:'n', v:'', step:0.1}
 ],
 run:function(v){
  var w=v.wt, out=[], warn=[];
  var fl = w<=10 ? w*100 : (w<=20 ? 1000+(w-10)*50 : 1500+(w-20)*20);
  out.push(['سوائل الصيانة (Holliday-Segar)', Math.round(fl)+' مل/يوم ≈ '+(fl/24).toFixed(1)+' مل/ساعة', 'hi']);
  var a=+v.age, E;
  if(a<0.5) E=[95,115]; else if(a<1) E=[80,100]; else if(a<4) E=[80,100];
  else if(a<9) E=[65,85]; else if(a<14) E=[50,70]; else E=[40,55];
  out.push(['الطاقة التقديرية', Math.round(E[0]*w)+'–'+Math.round(E[1]*w)+' kcal/يوم ('+E[0]+'–'+E[1]+' kcal/كجم)', 'hi']);
  var P = a<1?[1.2,1.5]:(a<4?[1.0,1.2]:(a<14?[0.95,1.1]:[0.85,1.0]));
  out.push(['البروتين', (P[0]*w).toFixed(0)+'–'+(P[1]*w).toFixed(0)+' جم/يوم ('+P[0]+'–'+P[1]+' جم/كجم)']);
  if(v.muac>0){
   var st = v.muac<11.5?'سوء تغذية حاد شديد (SAM)':(v.muac<12.5?'سوء تغذية حاد معتدل (MAM)':'ضمن الطبيعي');
   out.push(['تصنيف MUAC', st, v.muac<11.5?'bad':(v.muac<12.5?'warnc':'hi')]);
  }
  if(v.z!==0 && v.z!=='' && !isNaN(v.z)){
   var zs = v.z< -3?'هزال شديد':(v.z< -2?'هزال معتدل':(v.z>2?'فوق الطبيعي':'طبيعي'));
   out.push(['تصنيف Z-score', zs, v.z< -3?'bad':(v.z< -2?'warnc':'hi')]);
  }
  var sam = (v.muac>0 && v.muac<11.5) || (+v.edema) || (v.z!=='' && v.z< -3);
  if(sam){
   out.push(['⚠️ التصنيف العام','سوء تغذية حاد شديد','bad']);
   out.push(['بداية التغذية العلاجية', Math.round(80*w)+'–'+Math.round(100*w)+' kcal/يوم (مرحلة الاستقرار F-75)','warnc']);
   warn.push('سوء تغذية حاد شديد: الأولوية قبل التغذية هي تصحيح نقص السكر وانخفاض الحرارة والجفاف والإلكتروليتات وعلاج العدوى. استخدم صيغة إماهة خاصة لا المحاليل العادية، ولا تُعطَ مكملات الحديد في مرحلة الاستقرار. الوذمة أو فقدان الشهية أو المضاعفات تعني إدخال المستشفى.');
   warn.push('التغذية المكثفة المبكرة قد تكون قاتلة (متلازمة إعادة التغذية وفشل قلبي) — التدرّج إلزامي.');
  }
  if(+v.edema && !(v.muac>0 && v.muac<11.5)) warn.push('الوذمة التنقّرية وحدها تصنّف الحالة كسوء تغذية حاد شديد مهما كان الوزن.');
  warn.push('هذه تقديرات للبالغ الصحي من الأطفال؛ النمو يُتابَع دائمًا على منحنيات WHO ويُقيَّم المسار لا النقطة الواحدة. ولا تُوصف حميات إنقاص وزن للأطفال — الهدف عادةً تثبيت الوزن مع استمرار النمو الطولي.');
  return {rows:out, warn:warn};
 }
};

function openMeal(){

    '<div class="mealgrid"><div>'+
    '<input class="search" id="fq" placeholder="ابحث في '+FOODS.length+' صنفًا…">'+
    '<div class="chips" style="margin:.5rem 0"><button class="chip on" data-fc="الكل">الكل</button>'+
    cats.map(function(c){return '<button class="chip" data-fc="'+c+'">'+c+'</button>';}).join('')+'</div>'+
    '<div id="flist" class="flist"></div></div>'+
    '<div><div class="fields" style="grid-template-columns:1fr 1fr;margin-bottom:.8rem">'+
    '<label class="fld"><span>هدف السعرات (اختياري)</span><input type="number" id="tk" value="'+(S.mealTk||'')+'"></label>'+
    '<label class="fld"><span>هدف البروتين جم (اختياري)</span><input type="number" id="tp" value="'+(S.mealTp||'')+'"></label></div>'+
    '<div id="mres"></div></div></div>';
  stage.innerHTML=h;
  document.getElementById('backTools').onclick=toolsHome;
  function drawList(){
    var q=(document.getElementById('fq').value||'').trim();
    var L=FOODS.map(function(f,i){return [f,i];}).filter(function(x){
      return (S.mealCat==='الكل'||x[0][6]===S.mealCat) && (!q||x[0][0].indexOf(q)>-1);});
    document.getElementById('flist').innerHTML=L.map(function(x){
      var f=x[0];
      return '<button class="fitem" data-fi="'+x[1]+'"><b>'+esc2(f[0])+'</b><span>'+esc2(f[1])+
        ' · '+f[2]+' سعرة · '+f[3]+' جم بروتين</span><i>+</i></button>';}).join('')||
      '<div class="explain">لا نتائج.</div>';
    document.querySelectorAll('[data-fi]').forEach(function(el){
      el.onclick=function(){
        var i=+el.dataset.fi, ex=S.meal.filter(function(m){return m.i===i;})[0];
        if(ex) ex.q+=1; else S.meal.push({i:i,q:1});
        drawMeal();};});
  }
  function drawMeal(){
    var T=[0,0,0,0];
    var rows=S.meal.map(function(m,k){
      var f=FOODS[m.i];
      T[0]+=f[2]*m.q;T[1]+=f[3]*m.q;T[2]+=f[4]*m.q;T[3]+=f[5]*m.q;
      return '<tr><td>'+esc2(f[0])+'<small>'+esc2(f[1])+'</small></td>'+

        '<td class="num">'+Math.round(f[2]*m.q)+'</td></tr>';}).join('');
    var tk=+document.getElementById('tk').value, tp=+document.getElementById('tp').value;
    S.mealTk=tk||''; S.mealTp=tp||'';
    var out='';
    if(!S.meal.length){
      out='<div class="resbox"><div class="eyebrow">الوجبة</div><p style="margin:.4rem 0;color:var(--muted)">'+
          'اختر أصنافًا من القائمة لتجميع وجبة أو يوم كامل.</p></div>';
    } else {
      var kc=T[1]*4+T[2]*4+T[3]*9||1;
      out='<div class="resbox"><div class="eyebrow">الوجبة ('+S.meal.length+' صنف)</div>'+
        '<div class="tablewrap" style="margin:.5rem 0"><table class="mtab"><thead><tr><th>الصنف</th><th>الحصص</th><th>kcal</th></tr></thead><tbody>'+
        rows+'</tbody></table></div><table class="restab"><tbody>'+
        '<tr class="hi"><th>إجمالي السعرات</th><td>'+Math.round(T[0])+' kcal</td></tr>'+
        '<tr><th>البروتين</th><td>'+T[1].toFixed(0)+' جم ('+Math.round(T[1]*4/kc*100)+'%)</td></tr>'+
        '<tr><th>الكربوهيدرات</th><td>'+T[2].toFixed(0)+' جم ('+Math.round(T[2]*4/kc*100)+'%)</td></tr>'+
        '<tr><th>الدهون</th><td>'+T[3].toFixed(0)+' جم ('+Math.round(T[3]*9/kc*100)+'%)</td></tr>';
      if(tk) out+='<tr class="'+(Math.abs(T[0]-tk)/tk<0.1?'hi':'warnc')+'"><th>الفرق عن هدف السعرات</th><td>'+
        (T[0]>tk?'زيادة ':'متبقٍ ')+Math.abs(Math.round(T[0]-tk))+' kcal</td></tr>';
      if(tp) out+='<tr class="'+(T[1]>=tp?'hi':'warnc')+'"><th>الفرق عن هدف البروتين</th><td>'+
        (T[1]>=tp?'تحقق الهدف':'ناقص '+Math.round(tp-T[1])+' جم')+'</td></tr>';
      out+='</tbody></table>';
      var fatPct=T[3]*9/kc*100, w=[];
      if(fatPct>40) w.push('الدهون تتجاوز 40% من السعرات — راجع الزيت والمقليات والحلويات.');
      if(T[1]*4/kc*100<12 && T[0]>500) w.push('البروتين أقل من 12% من السعرات — أضف مصدرًا بروتينيًا.');
      var sugary=S.meal.filter(function(m){var c=FOODS[m.i][6];return c==='حلويات'||FOODS[m.i][0]==='مشروب غازي'||FOODS[m.i][0]==='عصير معبأ'||FOODS[m.i][0]==='عصير قصب';});
      if(sugary.length) w.push('تحتوي على حلويات أو مشروبات محلاة — أسرع بنود يمكن تقليلها دون تغيير باقي الوجبة.');
      w.forEach(function(x){out+='<div class="calcwarn">'+esc2(x)+'</div>';});
      out+='<button class="btn ghost" id="mclear" style="margin-top:.9rem">مسح الوجبة</button></div>';
    }
    document.getElementById('mres').innerHTML=out;
    document.querySelectorAll('[data-up]').forEach(function(b){b.onclick=function(){S.meal[+b.dataset.up].q+=0.5;drawMeal();};});
    document.querySelectorAll('[data-dn]').forEach(function(b){b.onclick=function(){
      var k=+b.dataset.dn; S.meal[k].q-=0.5; if(S.meal[k].q<=0)S.meal.splice(k,1); drawMeal();};});
    var c=document.getElementById('mclear'); if(c) c.onclick=function(){S.meal=[];drawMeal();};
  }
  document.getElementById('fq').oninput=drawList;
  document.getElementById('tk').oninput=drawMeal;
  document.getElementById('tp').oninput=drawMeal;
  stage.querySelectorAll('[data-fc]').forEach(function(el){
    el.onclick=function(){S.mealCat=el.dataset.fc;
      stage.querySelectorAll('[data-fc]').forEach(function(x){x.classList.toggle('on',x===el);});drawList();};});
  drawList(); drawMeal(); setProg(50);
}

  lineColor:'#6D847C', fontFamily:'IBM Plex Sans Arabic, sans-serif', fontSize:'13px'}});
}catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function closeNav(){side.classList.remove('open');scrim.classList.remove('on');}
document.getElementById('burger').onclick=function(){
  side.classList.toggle('open');scrim.classList.toggle('on');};
scrim.onclick=closeNav;

/* ============ التنقل ============ */
function buildNav(){
  if(S.view==='tools'){
    var cats={}; CALCS.forEach(function(c){(cats[c.cat]=cats[c.cat]||[]).push(c);});
    var th='<div class="navsec">مذاكرة</div>'+
      '<button class="navlink" data-tt="cards"><span class="navnum">◆</span><span>بطاقات المذاكرة</span></button>'+
      '<button class="navlink" data-tt="gloss"><span class="navnum">◆</span><span>المسرد</span></button>'+
      '<div class="navsec">تطبيق</div>'+
      '<button class="navlink" data-tt="meal"><span class="navnum">◆</span><span>منشئ الوجبات بالأكل العربي</span></button>'+
      '<div class="navsec">جداول مرجعية</div>'+
      '<button class="navlink" data-tt="dri"><span class="navnum">▦</span><span>المرجعيات الغذائية RDA و UL</span></button>'+
      '<button class="navlink" data-tt="labs"><span class="navnum">▦</span><span>القيم المرجعية للتحاليل</span></button>'+
      '<button class="navlink" data-tt="drugs"><span class="navnum">▦</span><span>تفاعلات الدواء والغذاء</span></button>';
    Object.keys(cats).forEach(function(k){
      th+='<div class="navsec">'+esc(k)+'</div>';
      cats[k].forEach(function(c){
        th+='<button class="navlink'+(S.tool===c.id?' on':'')+'" data-tc="'+c.id+'">'+
            '<span class="navnum">ƒ</span><span>'+esc(c.title)+'</span></button>';});
    });
    navlist.innerHTML=th;
    navlist.querySelectorAll('[data-tc]').forEach(function(el){
      el.onclick=function(){openCalc(el.dataset.tc);closeNav();};});
    navlist.querySelectorAll('[data-tt]').forEach(function(el){
      el.onclick=function(){var t=el.dataset.tt;
        t==='cards'?openCards(): t==='gloss'?openGloss(): t==='meal'?openMeal():
        t==='dri'?openDRI(): t==='labs'?openLabs(): openDrugs(); closeNav();};});
    return;
  }
  if(S.view==='quiz'){
    var h='<div class="navsec">بنوك الأسئلة</div>';
    BOOKS.forEach(function(b,i){
      h+='<button class="navlink'+(S.book===b.id?' on':'')+'" data-book="'+b.id+'">'+
         '<span class="navnum">'+(i+1)+'</span><span>'+esc(b.title)+'</span></button>';});
    h+='<div class="navsec">اختبارات المحتوى</div>';
    TOPICS.forEach(function(b,i){
      h+='<button class="navlink'+(S.book===b.id?' on':'')+'" data-book="'+b.id+'">'+
         '<span class="navnum">'+(i+1)+'</span><span>'+esc(b.title)+'</span></button>';});
    navlist.innerHTML=h;
    navlist.querySelectorAll('[data-book]').forEach(function(el){
      el.onclick=function(){startQuiz(el.dataset.book);closeNav();};});
    return;
  }
  var list = S.view==='books' ? SECTIONS.filter(function(s){return s.group==='books';})
                              : SECTIONS.filter(function(s){return s.group!=='books';});
  var out='', last='';
  list.forEach(function(s){
    if(s.tag!==last){out+='<div class="navsec">'+esc(s.tag)+'</div>';last=s.tag;}
    out+='<button class="navlink'+(SECTIONS[S.sec]===s?' on':'')+'" data-i="'+s.i+'">'+
         '<span class="navnum">'+s.num+'</span><span>'+esc(s.short)+'</span></button>';});
  navlist.innerHTML=out;
  navlist.querySelectorAll('[data-i]').forEach(function(el){
    el.onclick=function(){go(+el.dataset.i);closeNav();};});
}

function go(i){
  S.sec=i; S.mode='idle';
  var s=SECTIONS[i];
  stage.innerHTML='<article><div class="eyebrow">'+esc(s.tag)+'</div>'+s.html+'</article>'+pager(i);
  buildNav();
  stage.querySelectorAll('[data-jump]').forEach(function(b){
    b.onclick=function(){var t=document.querySelector('[data-view="'+b.dataset.jump+'"]');if(t)t.click();};});
  stage.querySelectorAll('.pbtn[data-go]').forEach(function(b){
    b.onclick=function(){go(+b.dataset.go);window.scrollTo({top:0});};});
  renderMermaid();
  hideModels();
  fixBidi();
  var pool = S.view==='books'?SECTIONS.filter(function(x){return x.group==='books';})
                             :SECTIONS.filter(function(x){return x.group!=='books';});
  var pos = pool.indexOf(s);
  setProg(pool.length>1 ? (pos/(pool.length-1))*100 : 0);
  window.scrollTo({top:0,behavior:'instant'});
}



function fixBidi(root){
  (root||stage).querySelectorAll('td').forEach(function(td){
    var t=td.textContent;
    if(/[\u0600-\u06FF]/.test(t) && /^[^\u0600-\u06FFA-Za-z]*[A-Za-z]/.test(t)){
      td.setAttribute('dir','rtl'); td.style.unicodeBidi='isolate';
    }
  });
}
window.fixBidi=fixBidi;

function hideModels(){
  var targets=[];
  stage.querySelectorAll('article blockquote').forEach(function(bq){
    var kids=[].slice.call(bq.children);
    var k=kids.findIndex(function(c){return /^(النموذج|الإجابة)/.test(c.textContent.trim());});
    var prev=bq.previousElementSibling;
    var calcAns = prev && prev.tagName==='P' && /^س\d/.test(prev.textContent.trim());
    if(k===-1 && !calcAns) return;
    if(calcAns && k===-1) k=0;
    var box=document.createElement('div'); box.className='hidbox hid';
    kids.slice(k).forEach(function(c){box.appendChild(c);});
    var btn=document.createElement('button'); btn.className='revbtn';
    btn.textContent='اكشف الإجابة النموذجية';
    bq.appendChild(btn); bq.appendChild(box);
    btn.onclick=function(){
      var open=!box.classList.contains('hid');
      box.classList.toggle('hid',open);
      btn.textContent=open?'اكشف الإجابة النموذجية':'أخفِ الإجابة';
    };
    targets.push([box,btn]);
  });
  if(!targets.length) return;
  var art=stage.querySelector('article'), h1=art.querySelector('h1');
  var bar=document.createElement('div'); bar.className='revbar';
  bar.innerHTML='<span>'+targets.length+' إجابة نموذجية مخفية — اكتب إجابتك أولًا ثم قارن.</span>'+
    '<button class="chip" id="revAll">اكشف الكل</button>';
  if(h1) h1.insertAdjacentElement('afterend',bar);
  var all=false;
  document.getElementById('revAll').onclick=function(){
    all=!all;
    targets.forEach(function(t){t[0].classList.toggle('hid',!all);
      t[1].textContent=all?'أخفِ الإجابة':'اكشف الإجابة النموذجية';});
    this.textContent=all?'أخفِ الكل':'اكشف الكل';
  };
}

function pager(i){
  var pool = S.view==='books'?SECTIONS.filter(function(x){return x.group==='books';})
                             :SECTIONS.filter(function(x){return x.group!=='books';});
  var pos=pool.indexOf(SECTIONS[i]);
  var prev=pool[pos-1], next=pool[pos+1];
  return '<div class="pager">'+
   (prev?'<button class="pbtn" data-go="'+prev.i+'">السابق<b>'+esc(prev.short)+'</b></button>':'<button class="pbtn" disabled>البداية</button>')+
   (next?'<button class="pbtn" data-go="'+next.i+'" style="text-align:left">التالي<b>'+esc(next.short)+'</b></button>':'<button class="pbtn" disabled>النهاية</button>')+
   '</div>';
}

function renderMermaid(){
  var els=stage.querySelectorAll('.mermaid');
  if(!els.length||typeof mermaid==='undefined')return;
  els.forEach(function(el,n){
    var src=el.textContent;
    try{ mermaid.render('mm'+Date.now()+n, src).then(function(r){el.innerHTML=r.svg;})
      .catch(function(){el.textContent=src;}); }catch(e){el.textContent=src;}
  });
}

/* ============ التبويبات ============ */
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected','false');});
    t.setAttribute('aria-selected','true');
    S.view=t.dataset.view; search.value='';
    if(S.view==='quiz'){ S.book=null; quizHome(); }
    else if(S.view==='tools'){ S.tool=null; toolsHome(); }
    else{
      var pool=SECTIONS.filter(function(s){return S.view==='books'?s.group==='books':s.group!=='books';});
      go(pool[0].i);
    }
    buildNav();
  };
});

/* ============ البحث ============ */
var timer;
search.oninput=function(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    var q=search.value.trim();
    if(q.length<2){buildNav();return;}
    if(S.view==='tools'||S.view==='quiz'){}
    if(S.view==='tools'){
      var th2='', cnt=0;
      CALCS.forEach(function(c){ if(c.title.indexOf(q)>-1||c.cat.indexOf(q)>-1){
        th2+='<button class="hit" data-tc="'+c.id+'"><b>'+esc(c.title)+'</b><span>حاسبة · '+esc(c.cat)+'</span></button>';cnt++;}});
      GLOSS.forEach(function(g){ if(g[0].toLowerCase().indexOf(q.toLowerCase())>-1||g[1].indexOf(q)>-1){
        th2+='<div class="hit" style="cursor:default"><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></div>';cnt++;}});
      navlist.innerHTML='<div class="navsec">'+cnt+' نتيجة</div>'+(th2||'<div class="navsec">لا نتائج</div>');
      navlist.querySelectorAll('[data-tc]').forEach(function(el){
        el.onclick=function(){openCalc(el.dataset.tc);closeNav();};});
      return;
    }
    var hits=[];
    SECTIONS.forEach(function(s){
      var idx=s.text.indexOf(q);
      if(idx>-1){
        var from=Math.max(0,idx-45);
        hits.push({i:s.i,title:s.short,tag:s.tag,
          snip:(from>0?'…':'')+s.text.slice(from,idx+90).replace(q,'\u0001'+q+'\u0002')+'…'});
      }
    });
    if(!hits.length){navlist.innerHTML='<div class="navsec">لا نتائج</div>';return;}
    navlist.innerHTML='<div class="navsec">'+hits.length+' نتيجة</div>'+hits.slice(0,40).map(function(h){
      return '<button class="hit" data-i="'+h.i+'"><b>'+esc(h.title)+'</b><span>'+
        esc(h.snip).replace('\u0001','<mark>').replace('\u0002','</mark>')+'</span></button>';}).join('');
    navlist.querySelectorAll('[data-i]').forEach(function(el){
      el.onclick=function(){
        var s=SECTIONS[+el.dataset.i];
        if(s.group==='books'&&S.view!=='books'){document.querySelector('[data-view="books"]').setAttribute('aria-selected','true');
          document.querySelector('[data-view="read"]').setAttribute('aria-selected','false');S.view='books';}
        go(+el.dataset.i);closeNav();};});
  },160);
};

/* ============ الاختبارات ============ */
function allBanks(){return BOOKS.concat(TOPICS);}
function findBank(id){var r=null;allBanks().forEach(function(b){if(b.id===id)r=b;});return r;}

function quizHome(){
  var h='<article><div class="eyebrow">الاختبارات</div><h1>بنوك الأسئلة</h1>'+
    '<p>لكل كتاب بنك مستقل من 30 سؤالًا، ولكل محور من محاور الدليل بنك خاص. '+
    'الإجابة تُصحَّح فورًا مع شرح سبب الخطأ، والنتيجة تُعرض على شريط النطاق المرجعي.</p>'+
    '<h2>بنوك الكتب</h2><div class="grid">';
  BOOKS.forEach(function(b){
    h+='<button class="bookcard" data-b="'+b.id+'"><h4>'+esc(b.title)+'</h4><p>'+esc(b.desc)+
       '</p><span class="n">'+b.q.length+' سؤالًا</span></button>';});
  h+='</div><h2>بنوك المحتوى</h2><div class="grid">';
  TOPICS.forEach(function(b){
    h+='<button class="bookcard" data-b="'+b.id+'"><h4>'+esc(b.title)+'</h4><p>'+esc(b.desc)+
       '</p><span class="n">'+b.q.length+' سؤالًا</span></button>';});
  var tot=0,seen2={};allBanks().forEach(function(b){b.q.forEach(function(q){if(!seen2[q[0]]){seen2[q[0]]=1;tot++;}});});
  h+='</div><h2>الاختبار الشامل</h2><p>عيّنة عشوائية من 40 سؤالًا من كل البنوك ('+tot+' سؤالًا متاحًا).</p>'+
     '<button class="btn" data-b="__all">ابدأ الاختبار الشامل</button></article>';
  stage.innerHTML=h;
  stage.querySelectorAll('[data-b]').forEach(function(el){
    el.onclick=function(){startQuiz(el.dataset.b);};});
  setProg(0);
}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function startQuiz(id){
  if(id==='__all'){
    var pool=[], seen={};
    allBanks().forEach(function(b){b.q.forEach(function(q){
      if(!seen[q[0]]){seen[q[0]]=1;pool.push(q);}});});
    S.bank={id:'__all',title:'الاختبار الشامل',q:shuffle(pool).slice(0,40)};
  } else {
    var b=findBank(id); if(!b){quizHome();return;}
    S.bank={id:b.id,title:b.title,desc:b.desc,q:shuffle(b.q.slice())};
  }
  S.book=id; S.qi=0; S.answers=[]; S.mode='quiz';
  buildNav(); renderQ();
}

function renderQ(){
  var b=S.bank, q=b.q[S.qi], n=b.q.length;
  var h='<div class="qhead"><div><div class="eyebrow">اختبار</div><strong>'+esc(b.title)+'</strong></div>'+
        '<span class="counter">'+(S.qi+1)+' / '+n+'</span></div>'+
        '<div class="rangebar"><i style="right:'+((S.qi/n)*100)+'%"></i></div>'+
        '<div class="qtext">'+esc(q[0])+'</div><div class="opts">';
  var keys=['أ','ب','ج','د'];
  var order=shuffle([0,1,2,3]);
  order.forEach(function(orig,pos){
    h+='<button class="opt" data-o="'+orig+'"><span class="k">'+keys[pos]+'</span><span>'+esc(q[1][orig])+'</span></button>';});
  h+='</div><div id="exp"></div><div class="qnav">'+
     '<button class="btn ghost" id="quit">إنهاء</button>'+
     '<button class="btn" id="next" disabled style="margin-inline-start:auto">'+
     (S.qi+1===n?'عرض النتيجة':'السؤال التالي')+'</button></div>'+
     '<div class="kbd">اختصارات: 1–4 أو أ ب ج د للإجابة · Enter للتالي</div>';
  stage.innerHTML=h;
  var done=false;
  stage.querySelectorAll('.opt').forEach(function(el){
    el.onclick=function(){
      if(done)return; done=true;
      var pick=+el.dataset.o, right=q[2];
      S.answers.push({q:q,pick:pick,ok:pick===right});
      stage.querySelectorAll('.opt').forEach(function(o){
        var oi=+o.dataset.o;
        o.disabled=true;
        if(oi===right)o.classList.add('right');
        else if(oi===pick)o.classList.add('wrong');});
      document.getElementById('exp').innerHTML='<div class="explain"><b>'+
        (pick===right?'صح.':'الإجابة: '+keys[order.indexOf(right)]+'.')+'</b> '+esc(q[3])+'</div>';
      document.getElementById('next').disabled=false;
    };
  });
  document.getElementById('next').onclick=function(){
    if(S.qi+1<b.q.length){S.qi++;renderQ();window.scrollTo({top:0});}else{showResult();}};
  document.getElementById('quit').onclick=function(){S.answers.length?showResult():quizHome();};
  setProg((S.qi/b.q.length)*100);
}

function showResult(){
  var ok=0;S.answers.forEach(function(a){if(a.ok)ok++;});
  var pct=Math.round(ok/S.answers.length*100);
  var verdict = pct>=85?'إتقان — انتقل للجزء التالي'
              : pct>=70?'نجاح — راجع ما أخطأت فيه'
              : pct>=50?'يحتاج مراجعة — أعد قراءة القسم'
              : 'ابدأ القسم من جديد قبل إعادة الاختبار';
  var h='<div class="result"><div class="eyebrow">النتيجة</div>'+
    '<div class="score">'+pct+'<span style="font-size:1.6rem">%</span></div>'+
    '<div class="verdict">'+verdict+'</div>'+
    '<div style="max-width:460px;margin:0 auto">'+
    '<div class="rangebar"><i style="right:'+pct+'%"></i></div>'+
    '<div class="rangelabels"><span>0</span><span>50</span><span>70</span><span>85</span><span>100</span></div>'+
    '</div><p style="color:var(--muted);font-size:.9rem">'+ok+' صحيحة من '+S.answers.length+'</p>'+
    '<div class="qnav" style="justify-content:center">'+
    '<button class="btn" id="again">أعد الاختبار</button>'+
    '<button class="btn ghost" id="home">كل البنوك</button></div>';
  var bad=S.answers.filter(function(a){return !a.ok;});
  if(bad.length){
    h+='<div class="review"><h3>مراجعة الأخطاء ('+bad.length+')</h3>';
    bad.forEach(function(a){
      h+='<div class="rev bad"><strong>'+esc(a.q[0])+'</strong>'+
         '<p>الصحيح: '+esc(a.q[1][a.q[2]])+' — '+esc(a.q[3])+'</p></div>';});
    h+='</div>';
  } else { h+='<div class="review"><div class="rev good"><strong>لا أخطاء. كل الإجابات صحيحة.</strong></div></div>'; }
  h+='</div>';
  stage.innerHTML=h;
  document.getElementById('again').onclick=function(){startQuiz(S.book);};
  document.getElementById('home').onclick=function(){S.book=null;quizHome();buildNav();};
  setProg(100);
}

/* ============ الوضع الليلي ============ */
(function(){
  var btn=document.getElementById('theme'); if(!btn)return;
  function isDark(){
    var t=document.documentElement.getAttribute('data-theme');
    if(t) return t==='dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function sync(){ btn.textContent = isDark()?'☀':'☾';
    btn.title = isDark()?'الوضع النهاري':'الوضع الليلي';
    try{ if(typeof mermaid!=='undefined') mermaid.initialize({startOnLoad:false,theme:isDark()?'dark':'base'}); }catch(e){} }
  btn.onclick=function(){
    document.documentElement.setAttribute('data-theme', isDark()?'light':'dark'); sync();
    if(S.view!=='quiz' && S.view!=='tools' && SECTIONS[S.sec]) go(S.sec);
  };
  sync();
})();

/* ============ اختصارات لوحة المفاتيح في الاختبار ============ */
document.addEventListener('keydown',function(e){
  if(S.mode!=='quiz') return;
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
  var map={'1':0,'2':1,'3':2,'4':3,'أ':0,'ب':1,'ج':2,'د':3,'a':0,'b':1,'c':2,'d':3};
  var opts=stage.querySelectorAll('.opt');
  if(opts.length && map.hasOwnProperty(e.key)){
    var o=opts[map[e.key]]; if(o && !o.disabled){ o.click(); e.preventDefault(); }
  } else if(e.key==='Enter' || e.key===' '){
    var n=document.getElementById('next'); if(n && !n.disabled){ n.click(); e.preventDefault(); }
  }
});

/* ============ الإقلاع ============ */
buildNav();
go(0);
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(S.mode==='quiz')return;
  var pool=SECTIONS.filter(function(s){return S.view==='books'?s.group==='books':s.group!=='books';});
  var pos=pool.indexOf(SECTIONS[S.sec]);
  if(e.key==='ArrowLeft'&&pool[pos+1])go(pool[pos+1].i);
  if(e.key==='ArrowRight'&&pool[pos-1])go(pool[pos-1].i);
});
})();
</script>
