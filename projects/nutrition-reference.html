رأس السرير 30–45° دائمًا، ضخ مستمر، وصول ما بعد البواب عند الخطر العالي انسداد الأنبوب غسيل بماء دافئ 30 مل قبل وبعد كل استخدام؛ لا تسحق أقراصًا ممتدة المفعول ؛ استخدم صيغًا سائلة متلازمة إعادة التغذية راجع الجزء الثالث — ابدأ منخفضًا وراقب الفوسفات 14.3 التغذية الوريدية (Parenteral Nutrition — PN) الدواعي فشل معوي، انسداد كامل، ناسور عالي الإخراج، متلازمة الأمعاء القصيرة الشديدة، نقص تروية معوي، عدم تحمل معوي مستمر رغم المحاولات، التهاب مخاطي شديد بعد العلاج الكيميائي. طرق الوصول النوع الأسمولالية المدة PN محيطي (PPN) ≤900 mOsm/L ≤10–14 يومًا، دعم جزئي PN مركزي (TPN) بلا حد عملي طويل المدى — عبر PICC أو قسطرة مركزية المكونات وحساباتها المكوّن القيمة الحرارية ملاحظات دكستروز 3.4 kcal/جم (وليس 4 — لأنه مُميَّه) الحد الأقصى للأكسدة: 4–5 مجم/كجم/دقيقة — تجاوزه يسبب فرط سكر وتشحّم كبدي أحماض أمينية 4 kcal/جم تُحسب ضمن الطاقة أم لا حسب البروتوكول؛ 1.2–2.0 جم/كجم مستحلب دهني 9 kcal/جم (10 kcal/جم للمستحلب لأنه يحوي جليسرول) ≤1 جم/كجم/يوم ؛ الأجيال الحديثة (زيت سمك/زيتون) أفضل من فول الصويا المنفرد إلكتروليتات، عناصر نزرة، فيتامينات — تُضاف يوميًا؛ الثيامين إلزامي مثال حساب: مريض 70 كجم، هدف 1750 kcal، بروتين 1.5 جم/كجم. بروتين = 105 جم (420 kcal) دهون = 0.8 × 70 = 56 جم (~560 kcal) دكستروز = (1750 − 420 − 560) ÷ 3.4 ≈ 226 جم تحقق من معدل التسريب: 226000 مجم ÷ 70 كجم ÷ 1440 دقيقة ≈ 2.2 مجم/كجم/دقيقة ✅ (أقل من 4–5) المضاعفات متعلقة بالقسطرة: إنتان مجرى الدم (CLABSI) — الأخطر؛ تخثر؛ استرواح صدري عند التركيب. أيضية: فرط/نقص سكر، اضطراب إلكتروليتات، فرط دهون ثلاثية، متلازمة إعادة التغذية. كبدية معوية (PNALD/IFALD): ركود صفراوي وتشحّم — الوقاية: تجنّب الإفراط في السعرات ، تحديد الدهون، تغذية معوية تحفيزية (Trophic feeding) ولو بكميات ضئيلة ، ودورية التسريب (Cyclic PN). ضمور الزغابات المعوية مع الحرمان المعوي المطوّل. الفطام ابدأ التغذية المعوية بكميات تحفيزية مبكرًا، وقلّل PN تدريجيًا كلما زاد تحمّل المعوي، وأوقفه عند تغطية 60% من الاحتياج معويًا. 14.4 متلازمة الأمعاء القصيرة (نظرة موجزة) الشدة تتوقف على طول ونوع الأمعاء المتبقية ووجود صمام اللفائفي والقولون . استئصال اللفائفي النهائي → فقد امتصاص B12 والأملاح الصفراوية → إسهال دهني وحصوات مرارة وأكسالات. الاستراتيجية: وجبات صغيرة متكررة، فصل السوائل عن الطعام، محاليل إماهة فموية متساوية التوتر (لا سوائل شديدة التخفيف أو شديدة التركيز — كلاهما يزيد الإخراج)، MCT عند القولون السليم، تعويض B12 حقنًا، ومراقبة الماغنسيوم والزنك."}, {"i": 15, "group": "guide", "tag": "فسيولوجيا", "num": "15", "short": "فسيولوجيا تنظيم الشهية والوزن", "html": "<h1>الجزء الخامس عشر: فسيولوجيا تنظيم الشهية والوزن</h1>\n<blockquote class=\"note\"><p>هذا هو الفصل الذي يفسّر <em>لماذا</em> يفشل معظم الرجيم — ولماذا لوم الإرادة تفسير كسول وغير علمي.</p></blockquote>\n<h2>15.1 محور الأمعاء–الدماغ</h2>\n<p>مركز التحكم في <strong>الوطاء (Hypothalamus)</strong>، وتحديدًا <strong>النواة المقوسة (Arcuate nucleus)</strong> التي تحتوي مجموعتين متضادتين:</p>\n<ul><li><strong>خلايا NPY/AgRP</strong> → تحفّز الجوع.</li><li><strong>خلايا POMC/CART</strong> → تحفّز الشبع.</li></ul>\n<p>وتصل إليها إشارتان:</p>\n<p><strong>(1) إشارات قصيرة المدى (وجبة بوجبة)</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>الهرمون</th><th>المصدر</th><th>الأثر</th></tr></thead><tbody><tr><td><strong>جريلين (Ghrelin)</strong></td><td>المعدة</td><td><strong>الهرمون الوحيد المحفّز للجوع</strong> — يرتفع قبل الوجبات وينخفض بعدها، <strong>ويرتفع بشكل مزمن بعد إنقاص الوزن</strong></td></tr><tr><td><strong>GLP-1</strong></td><td>الخلايا L في الأمعاء</td><td>شبع، إبطاء إفراغ المعدة، تحفيز الإنسولين المعتمد على الجلوكوز</td></tr><tr><td><strong>PYY</strong></td><td>الأمعاء البعيدة</td><td>شبع ممتد</td></tr><tr><td><strong>CCK</strong></td><td>الاثناعشر (استجابة للدهون والبروتين)</td><td>شبع سريع، تحفيز إفراز البنكرياس والصفراء</td></tr><tr><td><strong>GIP</strong></td><td>الأمعاء العليا</td><td>تأثير إنكريتيني</td></tr><tr><td><strong>الإنسولين</strong></td><td>البنكرياس</td><td>إشارة شبع مركزية (بجانب دوره الأيضي)</td></tr></tbody></table></div>\n<p><strong>(2) إشارات طويلة المدى (مخزون الطاقة)</strong></p>\n<ul><li><strong>اللبتين (Leptin):</strong> يُفرَز من الأنسجة الدهنية بما يتناسب مع كتلتها. رسالته للمخ: \"المخزون بخير\".<ul><li><strong>مقاومة اللبتين:</strong> في السمنة يكون اللبتين <strong>مرتفعًا</strong> لا منخفضًا، لكن المخ لا يستجيب له → لذلك حقن اللبتين ليست علاجًا للسمنة (إلا في النقص الجيني النادر).</li><li><strong>عند فقد الوزن ينخفض اللبتين بشكل حاد</strong> → يفسّر المخ ذلك كمجاعة → جوع شديد وانخفاض في إنفاق الطاقة.</li></ul></li></ul>\n<hr>\n<h2>15.2 التكيّف الأيضي والدفاع عن الوزن</h2>\n<p><strong>نموذج نقطة الضبط (Set point) / نطاق الضبط (Settling range):</strong> الجسم يدافع عن وزنه بآليات متعددة، وبقوة أكبر ضد <strong>النقصان</strong> منها ضد الزيادة (منطق تطوري: المجاعة كانت أخطر من الوفرة).</p>\n<p><strong>ما يحدث فعليًا بعد فقد الوزن:</strong></p>\n<ol><li><strong>↓ إنفاق الطاقة أكثر مما تتوقعه المعادلات</strong> (Adaptive thermogenesis) — الكفاءة العضلية تزيد وNEAT ينخفض تلقائيًا (تقليل الحركة العفوية دون وعي).</li><li><strong>↑ جريلين · ↓ لبتين · ↓ PYY و GLP-1</strong> → جوع حقيقي فسيولوجي، وليس \"ضعف إرادة\".</li><li><strong>↑ الانتباه المعرفي للطعام</strong> — تغيّر في استجابة مراكز المكافأة.</li><li><strong>هذه التغيرات قد تستمر شهورًا إلى سنوات</strong> بعد الوصول للهدف.</li></ol>\n<p><strong>درس تجربة مينيسوتا للتجويع (Keys, 1944–45):</strong> رجال أصحاء عُرّضوا لتقييد شديد نصف عام، فظهرت لديهم: هوس بالطعام، اكتئاب وتهيّج، انسحاب اجتماعي، طقوس أكل غريبة، وانخفاض حاد في الأيض — ثم <strong>أكل شرهي عند السماح بالطعام</strong>. الخلاصة العلمية الفارقة: <strong>كثير من \"سلوكيات اضطراب الأكل\" هي نتيجة التقييد، لا سببه.</strong></p>\n<p><strong>التطبيق العملي:</strong></p>\n<ul><li>عجز معتدل &gt; عجز قاسٍ · بروتين مرتفع · تدريب مقاومة للحفاظ على FFM.</li><li><strong>فترات صيانة (Diet breaks)</strong> كل 8–12 أسبوعًا.</li><li><strong>مرحلة الحفاظ ليست نهاية الخطة، بل أطول مراحلها</strong> — يجب التخطيط لها صراحةً من اليوم الأول.</li><li>الوزن المستعاد ليس فشلًا أخلاقيًا؛ إنه النتيجة المتوقعة لبيولوجيا تعمل كما صُمّمت.</li></ul>\n<hr>\n<h2>15.3 أدوية إنقاص الوزن الحديثة (منبهات GLP-1 و GLP-1/GIP)</h2>\n<h3>كيف تعمل؟</h3>\n<p>تحاكي هرمون GLP-1: <strong>تبطئ إفراغ المعدة + تزيد الشبع المركزي + تقلل \"الضجيج الغذائي\" (Food noise)</strong> — أي التفكير القهري المستمر في الطعام. والنتيجة انخفاض تلقائي كبير في المدخول (قد يصل 20–35%). والأجيال المزدوجة (GLP-1/GIP) أقوى أثرًا.</p>\n<h3>⚠️ لماذا الدور التغذوي حاسم هنا؟</h3>\n<p>الدواء يخفض المدخول بشدة <strong>دون أن يضمن جودته</strong> — والمخاطر الثلاث المتوقعة:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>الخطر</th><th>الوقاية</th></tr></thead><tbody><tr><td><strong>فقد كتلة عضلية كبير</strong> (قد يمثّل 25–40% من الوزن المفقود)</td><td><strong>بروتين <span class=\"ltr\">≥1.2</span>–1.6 جم/كجم</strong> موزّع + <strong>تدريب مقاومة إلزامي</strong> — هذه ليست توصية اختيارية</td></tr><tr><td><strong>نقص المغذيات الدقيقة</strong></td><td>فيتامين متعدد، مراقبة B12 والحديد وD والكالسيوم</td></tr><tr><td><strong>الجفاف والإمساك</strong></td><td>سوائل مجدولة + ألياف تدريجية</td></tr></tbody></table></div>\n<h3>إدارة الأعراض الجانبية</h3>\n<ul><li><strong>غثيان (الأشيع):</strong> وجبات صغيرة جدًا ومتكررة، أطعمة باردة أو بلا رائحة قوية، <strong>تقليل الدهون والمقليات</strong> (تبطئ الإفراغ أكثر)، عدم شرب كميات كبيرة مع الطعام، التوقف عند أول إحساس بالامتلاء.</li><li><strong>قيء/ارتجاع:</strong> عدم الاستلقاء بعد الأكل، تقليل حجم اللقمة، المضغ الجيد.</li><li><strong>إمساك:</strong> ألياف + سوائل + حركة.</li><li><strong>خطر هبوط السكر</strong> إذا كان المريض على إنسولين أو سلفونيل يوريا → تعديل الجرعات طبيًا.</li></ul>\n<h3>أولوية الطبق تحت الدواء</h3>\n<p>عندما تكون سعة المعدة محدودة، يتغيّر ترتيب الأولويات: <strong>1) البروتين أولًا ← 2) الخضار ← 3) النشويات والدهون.</strong> والسوائل البروتينية (لبن، زبادي، مخفوق) وسيلة عملية عند ضعف الشهية الشديد.</p>\n<h3>ما بعد التوقف</h3>\n<p>عند إيقاف الدواء يعود الجوع وغالبًا يُستعاد جزء كبير من الوزن — لأن الدواء <strong>يعالج الأعراض لا البيولوجيا الأساسية</strong>. لذلك يجب أن تُبنى <strong>مهارات وعادات مستدامة أثناء فترة العلاج</strong>، لا أن تُؤجَّل إليها.</p>\n<hr>\n<h2>15.4 الاضطرابات الأيضية الوراثية</h2>\n<blockquote class=\"note\"><p><strong>أهمية إقليمية خاصة:</strong> ارتفاع معدلات زواج الأقارب في المنطقة العربية يرفع انتشار الأمراض المتنحية بشكل ملحوظ — والمسح الحديثي الوليدي (Newborn screening) هو خط الدفاع الأول.</p></blockquote>\n<div class=\"tablewrap\"><table><thead><tr><th>المرض</th><th>الخلل</th><th>التدخل الغذائي</th></tr></thead><tbody><tr><td><strong>بيلة الفينيل كيتون (PKU)</strong></td><td>نقص إنزيم فينيل ألانين هيدروكسيلاز</td><td class=\"warn\"><strong>تقييد الفينيل ألانين مدى الحياة</strong> + حليب طبي خاص خالٍ منه + التيروسين يصبح أساسيًا. <strong>⚠️ الأسبارتام ممنوع تمامًا</strong> (يتحلل إلى فينيل ألانين). الإهمال → <strong>إعاقة ذهنية لا رجعة فيها</strong>. النساء الحوامل بـ PKU يحتجن ضبطًا صارمًا قبل الحمل</td></tr><tr><td><strong>الجالاكتوسيميا</strong></td><td>نقص GALT</td><td><strong>منع الجالاكتوز واللاكتوز مدى الحياة</strong> — لا رضاعة طبيعية ولا ألبان؛ حليب صويا. مراقبة الكالسيوم وفيتامين D والعظام</td></tr><tr><td><strong>بيلة شراب القيقب (MSUD)</strong></td><td>خلل أيض BCAA</td><td>تقييد ليوسين وأيزوليوسين وفالين + تركيبة طبية؛ <strong>نوبات الأيض الحادة طوارئ</strong></td></tr><tr><td><strong>اضطرابات أكسدة الأحماض الدهنية (مثل MCAD)</strong></td><td>خلل نقل/أكسدة</td><td><strong>تجنّب الصيام المطوّل</strong> (القاعدة الأهم) + وجبات متكررة + نشا ذرة نيء ليلًا + بروتوكول طوارئ بالجلوكوز عند المرض</td></tr><tr><td><strong>مرض تخزين الجليكوجين</strong></td><td>حسب النوع</td><td>نشا ذرة غير مطهو + تغذية ليلية مستمرة لمنع نقص السكر</td></tr><tr><td><strong>عوز G6PD</strong></td><td>خلل إنزيمي في كرات الدم</td><td class=\"warn\"><strong>⚠️ تجنّب الفول (الفوال) والبقول الواسعة</strong> وبعض الأدوية (سلفا، بريماكين) والنفثالين — يسبب انحلال دم حاد. شائع جدًا في حوض المتوسط والشرق الأوسط</td></tr><tr><td><strong>حساسية الفركتوز الوراثية</strong></td><td>نقص ألدولاز B</td><td>منع الفركتوز والسكروز والسوربيتول</td></tr></tbody></table></div>\n<p><strong>قاعدة مهنية:</strong> هذه الحالات تُدار حصريًا ضمن <strong>فريق أيض متخصص</strong> — دور أخصائي التغذية العام هو <strong>التعرّف والإحالة ودعم الالتزام</strong>، لا وضع البروتوكول.</p>\n<hr>", "text": "الجزء الخامس عشر: فسيولوجيا تنظيم الشهية والوزن هذا هو الفصل الذي يفسّر لماذا يفشل معظم الرجيم — ولماذا لوم الإرادة تفسير كسول وغير علمي. 15.1 محور الأمعاء–الدماغ مركز التحكم في الوطاء (Hypothalamus) ، وتحديدًا النواة المقوسة (Arcuate nucleus) التي تحتوي مجموعتين متضادتين: خلايا NPY/AgRP → تحفّز الجوع. خلايا POMC/CART → تحفّز الشبع. وتصل إليها إشارتان: (1) إشارات قصيرة المدى (وجبة بوجبة) الهرمون المصدر الأثر جريلين (Ghrelin) المعدة الهرمون الوحيد المحفّز للجوع — يرتفع قبل الوجبات وينخفض بعدها، ويرتفع بشكل مزمن بعد إنقاص الوزن GLP 1 الخلايا L في الأمعاء شبع، إبطاء إفراغ المعدة، تحفيز الإنسولين المعتمد على الجلوكوز PYY الأمعاء البعيدة شبع ممتد CCK الاثناعشر (استجابة للدهون والبروتين) شبع سريع، تحفيز إفراز البنكرياس والصفراء GIP الأمعاء العليا تأثير إنكريتيني الإنسولين البنكرياس إشارة شبع مركزية (بجانب دوره الأيضي) (2) إشارات طويلة المدى (مخزون الطاقة) اللبتين (Leptin): يُفرَز من الأنسجة الدهنية بما يتناسب مع كتلتها. رسالته للمخ: \"المخزون بخير\". مقاومة اللبتين: في السمنة يكون اللبتين مرتفعًا لا منخفضًا، لكن المخ لا يستجيب له → لذلك حقن اللبتين ليست علاجًا للسمنة (إلا في النقص الجيني النادر). عند فقد الوزن ينخفض اللبتين بشكل حاد → يفسّر المخ ذلك كمجاعة → جوع شديد وانخفاض في إنفاق الطاقة. 15.2 التكيّف الأيضي والدفاع عن الوزن نموذج نقطة الضبط (Set point) / نطاق الضبط (Settling range): الجسم يدافع عن وزنه بآليات متعددة، وبقوة أكبر ضد النقصان منها ضد الزيادة (منطق تطوري: المجاعة كانت أخطر من الوفرة). ما يحدث فعليًا بعد فقد الوزن: 1. ↓ إنفاق الطاقة أكثر مما تتوقعه المعادلات (Adaptive thermogenesis) — الكفاءة العضلية تزيد وNEAT ينخفض تلقائيًا (تقليل الحركة العفوية دون وعي). 2. ↑ جريلين · ↓ لبتين · ↓ PYY و GLP 1 → جوع حقيقي فسيولوجي، وليس \"ضعف إرادة\". 3. ↑ الانتباه المعرفي للطعام — تغيّر في استجابة مراكز المكافأة. 4. هذه التغيرات قد تستمر شهورًا إلى سنوات بعد الوصول للهدف. درس تجربة مينيسوتا للتجويع (Keys, 1944–45): رجال أصحاء عُرّضوا لتقييد شديد نصف عام، فظهرت لديهم: هوس بالطعام، اكتئاب وتهيّج، انسحاب اجتماعي، طقوس أكل غريبة، وانخفاض حاد في الأيض — ثم أكل شرهي عند السماح بالطعام . الخلاصة العلمية الفارقة: كثير من \"سلوكيات اضطراب الأكل\" هي نتيجة التقييد، لا سببه. التطبيق العملي: عجز معتدل عجز قاسٍ · بروتين مرتفع · تدريب مقاومة للحفاظ على FFM. فترات صيانة (Diet breaks) كل 8–12 أسبوعًا. مرحلة الحفاظ ليست نهاية الخطة، بل أطول مراحلها — يجب التخطيط لها صراحةً من اليوم الأول. الوزن المستعاد ليس فشلًا أخلاقيًا؛ إنه النتيجة المتوقعة لبيولوجيا تعمل كما صُمّمت. 15.3 أدوية إنقاص الوزن الحديثة (منبهات GLP 1 و GLP 1/GIP) كيف تعمل؟ تحاكي هرمون GLP 1: تبطئ إفراغ المعدة + تزيد الشبع المركزي + تقلل \"الضجيج الغذائي\" (Food noise) — أي التفكير القهري المستمر في الطعام. والنتيجة انخفاض تلقائي كبير في المدخول (قد يصل 20–35%). والأجيال المزدوجة (GLP 1/GIP) أقوى أثرًا. ⚠️ لماذا الدور التغذوي حاسم هنا؟ الدواء يخفض المدخول بشدة دون أن يضمن جودته — والمخاطر الثلاث المتوقعة: الخطر الوقاية فقد كتلة عضلية كبير (قد يمثّل 25–40% من الوزن المفقود) بروتين ≥1.2–1.6 جم/كجم موزّع + تدريب مقاومة إلزامي — هذه ليست توصية اختيارية نقص المغذيات الدقيقة فيتامين متعدد، مراقبة B12 والحديد وD والكالسيوم الجفاف والإمساك سوائل مجدولة + ألياف تدريجية إدارة الأعراض الجانبية غثيان (الأشيع): وجبات صغيرة جدًا ومتكررة، أطعمة باردة أو بلا رائحة قوية، تقليل الدهون والمقليات (تبطئ الإفراغ أكثر)، عدم شرب كميات كبيرة مع الطعام، التوقف عند أول إحساس بالامتلاء. قيء/ارتجاع: عدم الاستلقاء بعد الأكل، تقليل حجم اللقمة، المضغ الجيد. إمساك: ألياف + سوائل + حركة. خطر هبوط السكر إذا كان المريض على إنسولين أو سلفونيل يوريا → تعديل الجرعات طبيًا. أولوية الطبق تحت الدواء عندما تكون سعة المعدة محدودة، يتغيّر ترتيب الأولويات: 1) البروتين أولًا ← 2) الخضار ← 3) النشويات والدهون. والسوائل البروتينية (لبن، زبادي، مخفوق) وسيلة عملية عند ضعف الشهية الشديد. ما بعد التوقف عند إيقاف الدواء يعود الجوع وغالبًا يُستعاد جزء كبير من الوزن — لأن الدواء يعالج الأعراض لا البيولوجيا الأساسية . لذلك يجب أن تُبنى مهارات وعادات مستدامة أثناء فترة العلاج ، لا أن تُؤجَّل إليها. 15.4 الاضطرابات الأيضية الوراثية أهمية إقليمية خاصة: ارتفاع معدلات زواج الأقارب في المنطقة العربية يرفع انتشار الأمراض المتنحية بشكل ملحوظ — والمسح الحديثي الوليدي (Newborn screening) هو خط الدفاع الأول. المرض الخلل التدخل الغذائي بيلة الفينيل كيتون (PKU) نقص إنزيم فينيل ألانين هيدروكسيلاز تقييد الفينيل ألانين مدى الحياة + حليب طبي خاص خالٍ منه + التيروسين يصبح أساسيًا. ⚠️ الأسبارتام ممنوع تمامًا (يتحلل إلى فينيل ألانين). الإهمال → إعاقة ذهنية لا رجعة فيها . النساء الحوامل بـ PKU يحتجن ضبطًا صارمًا قبل الحمل الجالاكتوسيميا نقص GALT منع الجالاكتوز واللاكتوز مدى الحياة — لا رضاعة طبيعية ولا ألبان؛ حليب صويا. مراقبة الكالسيوم وفيتامين D والعظام بيلة شراب القيقب (MSUD) خلل أيض BCAA تقييد ليوسين وأيزوليوسين وفالين + تركيبة طبية؛ نوبات الأيض الحادة طوارئ اضطرابات أكسدة الأحماض الدهنية (مثل MCAD) خلل نقل/أكسدة تجنّب الصيام المطوّل (القاعدة الأهم) + وجبات متكررة + نشا ذرة نيء ليلًا + بروتوكول طوارئ بالجلوكوز عند المرض مرض تخزين الجليكوجين حسب النوع نشا ذرة غير مطهو + تغذية ليلية مستمرة لمنع نقص السكر عوز G6PD خلل إنزيمي في كرات الدم ⚠️ تجنّب الفول (الفوال) والبقول الواسعة وبعض الأدوية (سلفا، بريماكين) والنفثالين — يسبب انحلال دم حاد. شائع جدًا في حوض المتوسط والشرق الأوسط حساسية الفركتوز الوراثية نقص ألدولاز B منع الفركتوز والسكروز والسوربيتول قاعدة مهنية: هذه الحالات تُدار حصريًا ضمن فريق أيض متخصص — دور أخصائي التغذية العام هو التعرّف والإحالة ودعم الالتزام ، لا وضع البروتوكول."}, {"i": 16, "group": "guide", "tag": "اضطرابات الأكل", "num": "16", "short": "اضطرابات الأكل", "html": "<h1>الجزء السادس عشر: اضطرابات الأكل</h1>\n<blockquote class=\"danger\"><p><strong>تحذير مهني:</strong> اضطرابات الأكل من أعلى الاضطرابات النفسية معدلًا للوفاة. <strong>لا يعالجها أخصائي التغذية منفردًا</strong> — العلاج فريقي (طبيب + معالج نفسي + أخصائي تغذية متخصص + أحيانًا طبيب نفسي). دور غير المتخصص هو <strong>التعرّف، الأمان، والإحالة</strong>.</p></blockquote>\n<h2>16.1 الأنواع الرئيسية</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الاضطراب</th><th>السمة المحورية</th></tr></thead><tbody><tr><td><strong>فقدان الشهية العصبي (Anorexia Nervosa)</strong></td><td>تقييد شديد للطاقة، خوف مكثّف من زيادة الوزن، اضطراب في إدراك صورة الجسد. <strong>قد يحدث عند أي وزن</strong> — ومصطلح \"غير نمطي\" يصف حالات بوزن طبيعي أو أعلى، وخطورتها الطبية مماثلة</td></tr><tr><td><strong>الشره العصبي (Bulimia Nervosa)</strong></td><td>نوبات شراهة متكررة يتبعها سلوك تعويضي؛ الوزن غالبًا طبيعي فيُغفَل التشخيص</td></tr><tr><td><strong>اضطراب الشراهة (BED)</strong></td><td>نوبات شراهة بلا سلوك تعويضي، مع ضيق وشعور بفقدان السيطرة. <strong>الأكثر شيوعًا</strong></td></tr><tr><td><strong>ARFID</strong></td><td>تجنّب/تقييد غذائي <strong>بلا</strong> قلق على شكل الجسم — بسبب الحسّية أو الخوف من الاختناق أو انعدام الاهتمام. شائع مع التوحد</td></tr><tr><td><strong>الأكل الصحي المَرَضي (Orthorexia)</strong></td><td>هوس بـ\"نقاء\" الطعام يعطّل الحياة — ليس تشخيصًا رسميًا لكنه واقع إكلينيكي متزايد</td></tr></tbody></table></div>\n<hr>\n<h2>16.2 علامات الإنذار (سلوكية وجسدية)</h2>\n<p><strong>سلوكية:</strong> حذف مجموعات غذائية بلا سبب طبي · حساب سعرات قهري · طقوس أكل (تقطيع مبالغ، ترتيب، بطء شديد) · تجنّب الأكل مع الآخرين · تمرين قهري لا يُلغى مهما كانت الظروف · الاختفاء بعد الوجبات · ملابس فضفاضة لإخفاء الجسم · وزن متكرر جدًا أو تجنّب الميزان تمامًا · معرفة غذائية دقيقة مع سلوك متناقض.</p>\n<p><strong>جسدية:</strong> انقطاع أو اضطراب الدورة · برودة مستمرة وشعر ناعم على الجسم (Lanugo) · تساقط شعر وهشاشة أظافر · دوخة وإغماء · <strong>بطء نبض وانخفاض ضغط</strong> · تآكل مينا الأسنان وتضخم الغدد اللعابية وعلامة راسل على مفاصل اليد (مؤشرات تطهير) · اضطرابات هضمية مزمنة · كسور إجهاد متكررة.</p>\n<p><strong>نفسية:</strong> قلق شديد حول وجبات محددة · مزاج متقلب · انسحاب اجتماعي · تفكير أبيض/أسود عن الطعام (\"مسموح/ممنوع\"، \"نظيف/قذر\").</p>\n<hr>\n<h2>16.3 مؤشرات الخطر الطبي التي تستدعي إحالة عاجلة</h2>\n<ul><li>بطء نبض شديد، انخفاض ضغط انتصابي، اضطراب نظم</li><li><strong>اضطراب إلكتروليتات</strong> (خصوصًا انخفاض البوتاسيوم مع التطهير)</li><li>إغماء متكرر، ضعف عضلي شديد، انخفاض حرارة</li><li>فقد وزن سريع جدًا مهما كان الوزن الحالي</li><li><strong>أفكار إيذاء الذات أو انتحار</strong> → طوارئ فورية</li><li>أي مؤشرات لمتلازمة إعادة التغذية</li></ul>\n<hr>\n<h2>16.4 مبادئ التعامل (لأخصائي التغذية العام)</h2>\n<p><strong>افعل:</strong></p>\n<ul><li>استخدم لغة محايدة عن الجسم والطعام؛ لا \"أطعمة جيدة/سيئة\" ولا تعليقات على المظهر (حتى المديح — \"شكلك خسّيت!\" قد يكون محفزًا خطيرًا).</li><li>ركّز على <strong>الوظيفة والصحة والعلاقة بالطعام</strong>، لا على الأرقام.</li><li><strong>الوزن الأعمى (Blind weighing)</strong> — بظهر المريض للميزان — ممارسة معتادة في هذا السياق.</li><li>اسأل بصراحة وبلا حكم؛ الصمت لا يحمي أحدًا.</li><li>أشرك الأسرة، خصوصًا مع المراهقين (العلاج الأسري FBT هو الخط الأول لمراهقي فقدان الشهية).</li><li><strong>أحِل مبكرًا</strong> — التعافي المبكر أعلى نجاحًا بكثير.</li></ul>\n<p><strong>لا تفعل:</strong></p>\n<ul><li>❌ لا تعطِ خطة إنقاص وزن أو حمية تقييدية لمن تظهر عليه العلامات — <strong>ولو طلبها بإلحاح</strong>.</li><li>❌ لا تناقش سعرات وأرقامًا تفصيلية مع مريض نشط الاضطراب (تصبح وقودًا للهوس).</li><li>❌ لا تفترض التشخيص من الوزن — <strong>معظم مرضى اضطرابات الأكل ليسوا نحيلين</strong>.</li><li>❌ لا تدير حالة شديدة خارج نطاق كفاءتك.</li></ul>\n<p><strong>إعادة التغذية:</strong> تتم بإشراف طبي، بمبدأ <strong>البدء المنخفض والتدرج مع مراقبة الفوسفات والبوتاسيوم والماغنسيوم والقلب</strong> (راجع الجزء الثالث). في الحالات الشديدة تُطبَّق بروتوكولات مستشفوية متخصصة.</p>\n<hr>", "text": "الجزء السادس عشر: اضطرابات الأكل تحذير مهني: اضطرابات الأكل من أعلى الاضطرابات النفسية معدلًا للوفاة. لا يعالجها أخصائي التغذية منفردًا — العلاج فريقي (طبيب + معالج نفسي + أخصائي تغذية متخصص + أحيانًا طبيب نفسي). دور غير المتخصص هو التعرّف، الأمان، والإحالة . 16.1 الأنواع الرئيسية الاضطراب السمة المحورية فقدان الشهية العصبي (Anorexia Nervosa) تقييد شديد للطاقة، خوف مكثّف من زيادة الوزن، اضطراب في إدراك صورة الجسد. قد يحدث عند أي وزن — ومصطلح \"غير نمطي\" يصف حالات بوزن طبيعي أو أعلى، وخطورتها الطبية مماثلة الشره العصبي (Bulimia Nervosa) نوبات شراهة متكررة يتبعها سلوك تعويضي؛ الوزن غالبًا طبيعي فيُغفَل التشخيص اضطراب الشراهة (BED) نوبات شراهة بلا سلوك تعويضي، مع ضيق وشعور بفقدان السيطرة. الأكثر شيوعًا ARFID تجنّب/تقييد غذائي بلا قلق على شكل الجسم — بسبب الحسّية أو الخوف من الاختناق أو انعدام الاهتمام. شائع مع التوحد الأكل الصحي المَرَضي (Orthorexia) هوس بـ\"نقاء\" الطعام يعطّل الحياة — ليس تشخيصًا رسميًا لكنه واقع إكلينيكي متزايد 16.2 علامات الإنذار (سلوكية وجسدية) سلوكية: حذف مجموعات غذائية بلا سبب طبي · حساب سعرات قهري · طقوس أكل (تقطيع مبالغ، ترتيب، بطء شديد) · تجنّب الأكل مع الآخرين · تمرين قهري لا يُلغى مهما كانت الظروف · الاختفاء بعد الوجبات · ملابس فضفاضة لإخفاء الجسم · وزن متكرر جدًا أو تجنّب الميزان تمامًا · معرفة غذائية دقيقة مع سلوك متناقض. جسدية: انقطاع أو اضطراب الدورة · برودة مستمرة وشعر ناعم على الجسم (Lanugo) · تساقط شعر وهشاشة أظافر · دوخة وإغماء · بطء نبض وانخفاض ضغط · تآكل مينا الأسنان وتضخم الغدد اللعابية وعلامة راسل على مفاصل اليد (مؤشرات تطهير) · اضطرابات هضمية مزمنة · كسور إجهاد متكررة. نفسية: قلق شديد حول وجبات محددة · مزاج متقلب · انسحاب اجتماعي · تفكير أبيض/أسود عن الطعام (\"مسموح/ممنوع\"، \"نظيف/قذر\"). 16.3 مؤشرات الخطر الطبي التي تستدعي إحالة عاجلة بطء نبض شديد، انخفاض ضغط انتصابي، اضطراب نظم اضطراب إلكتروليتات (خصوصًا انخفاض البوتاسيوم مع التطهير) إغماء متكرر، ضعف عضلي شديد، انخفاض حرارة فقد وزن سريع جدًا مهما كان الوزن الحالي أفكار إيذاء الذات أو انتحار → طوارئ فورية أي مؤشرات لمتلازمة إعادة التغذية 16.4 مبادئ التعامل (لأخصائي التغذية العام) افعل: استخدم لغة محايدة عن الجسم والطعام؛ لا \"أطعمة جيدة/سيئة\" ولا تعليقات على المظهر (حتى المديح — \"شكلك خسّيت!\" قد يكون محفزًا خطيرًا). ركّز على الوظيفة والصحة والعلاقة بالطعام ، لا على الأرقام. الوزن الأعمى (Blind weighing) — بظهر المريض للميزان — ممارسة معتادة في هذا السياق. اسأل بصراحة وبلا حكم؛ الصمت لا يحمي أحدًا. أشرك الأسرة، خصوصًا مع المراهقين (العلاج الأسري FBT هو الخط الأول لمراهقي فقدان الشهية). أحِل مبكرًا — التعافي المبكر أعلى نجاحًا بكثير. لا تفعل: ❌ لا تعطِ خطة إنقاص وزن أو حمية تقييدية لمن تظهر عليه العلامات — ولو طلبها بإلحاح . ❌ لا تناقش سعرات وأرقامًا تفصيلية مع مريض نشط الاضطراب (تصبح وقودًا للهوس). ❌ لا تفترض التشخيص من الوزن — معظم مرضى اضطرابات الأكل ليسوا نحيلين . ❌ لا تدير حالة شديدة خارج نطاق كفاءتك. إعادة التغذية: تتم بإشراف طبي، بمبدأ البدء المنخفض والتدرج مع مراقبة الفوسفات والبوتاسيوم والماغنسيوم والقلب (راجع الجزء الثالث). في الحالات الشديدة تُطبَّق بروتوكولات مستشفوية متخصصة."}, {"i": 17, "group": "guide", "tag": "أدلة", "num": "17", "short": "الدراسات المحورية", "html": "<h1>الجزء السابع عشر: الدراسات المحورية — تعرف الدليل لا التوصية فقط</h1>\n<div class=\"tablewrap\"><table><thead><tr><th>الدراسة</th><th>التصميم</th><th>الخلاصة</th><th>لماذا تهم؟</th></tr></thead><tbody><tr><td><strong>تجربة مينيسوتا للتجويع</strong> (1944)</td><td>تجربة بشرية تاريخية</td><td>التقييد الشديد ينتج هوسًا بالطعام واكتئابًا وانهيارًا للأيض ثم شراهة</td><td>الأساس العلمي لفهم أن كثيرًا من سلوكيات اضطراب الأكل <strong>نتيجة</strong> التقييد</td></tr><tr><td><strong>دراسات الأتراب في فرامنجهام</strong> (منذ 1948)</td><td>أتراب طولية</td><td>أسّست مفهوم <strong>\"عوامل الخطر\"</strong> القلبية (ضغط، كوليسترول، تدخين)</td><td>غيّرت الطب الوقائي كله</td></tr><tr><td><strong>DASH</strong> (1997)</td><td>تجربة عشوائية بتغذية مراقَبة</td><td>النمط الغذائي وحده خفض الضغط بفعالية تقارب دواءً</td><td>أثبتت أن <strong>النمط</strong> أقوى من مغذٍّ منفرد</td></tr><tr><td><strong>PREDIMED</strong> (2013، أُعيد نشرها 2018)</td><td>تجربة عشوائية أولية للوقاية</td><td>النمط المتوسطي المدعّم بزيت الزيتون أو المكسرات قلل الأحداث القلبية الوعائية</td><td>أقوى دليل تدخّلي على نمط غذائي كامل</td></tr><tr><td><strong>Look AHEAD</strong> (2013)</td><td>تجربة عشوائية كبيرة</td><td>التدخل المكثف في نمط الحياة حسّن الوزن والسكر واللياقة، <strong>لكنه لم يقلل الأحداث القلبية</strong> بفارق دال</td><td>درس في التواضع: الفائدة الأيضية لا تُترجم تلقائيًا لكل نتيجة</td></tr><tr><td><strong>DiRECT</strong> (2018)</td><td>عشوائية عنقودية</td><td>برنامج مكثف لإنقاص الوزن حقّق <strong>هدأة سكري النوع الثاني</strong> لدى نسبة معتبرة، والنجاح تناسب طرديًا مع مقدار الوزن المفقود</td><td>نقلت السكري النوع الثاني من \"مرض تقدّمي حتمي\" إلى <strong>حالة قد تنعكس</strong></td></tr><tr><td><strong>LEAP</strong> (2015)</td><td>عشوائية</td><td>الإدخال المبكر للفول السوداني قلل حساسيته بشكل كبير</td><td><strong>عكست</strong> التوصية القديمة بالتأجيل</td></tr><tr><td><strong>DPP — برنامج الوقاية من السكري</strong> (2002)</td><td>عشوائية</td><td>تعديل نمط الحياة تفوّق على الميتفورمين في الوقاية من السكري</td><td>التغذية تدخّل من الدرجة الأولى وليس مكملًا</td></tr><tr><td><strong>دراسات هول عن الأطعمة فائقة التصنيع</strong> (2019)</td><td>تجربة تغذية داخلية مضبوطة</td><td>مع تطابق الماكروز، أكل المشاركون <strong>مئات السعرات الزائدة</strong> يوميًا على النمط فائق التصنيع</td><td>أول دليل سببي على أثر <strong>درجة التصنيع</strong> لا التركيب فقط</td></tr><tr><td><strong>مراجعات Cochrane حول الدهون المشبعة</strong></td><td>مراجعات منهجية</td><td><strong>الاستبدال</strong> (بدهون متعددة غير مشبعة) هو ما يفيد، لا مجرد التقليل</td><td>\"بم استبدلت؟\" سؤال أهم من \"ماذا حذفت؟\"</td></tr><tr><td><strong>الطب العشوائي المندلي (Mendelian randomization)</strong></td><td>منهج جيني</td><td>يقارب السببية باستخدام المتغيرات الجينية</td><td>أداة حديثة تحلّ جزئيًا مشكلة العوامل المربكة في الدراسات الرصدية</td></tr></tbody></table></div>\n<p><strong>درس منهجي عام:</strong> التغذية علم صعب لأن <strong>التعمية شبه مستحيلة</strong>، والتقيّد طويل المدى ضعيف، والتبليغ الغذائي غير دقيق، وفترات المتابعة قصيرة نسبيًا مقارنةً بعمر الأمراض المزمنة. لذلك <strong>تعدد أنواع الأدلة المتقاربة</strong> (رصدية + تدخلية + آلية + مندلية) أقوى من أي دراسة واحدة مهما كانت لامعة.</p>\n<hr>", "text": "الجزء السابع عشر: الدراسات المحورية — تعرف الدليل لا التوصية فقط الدراسة التصميم الخلاصة لماذا تهم؟ تجربة مينيسوتا للتجويع (1944) تجربة بشرية تاريخية التقييد الشديد ينتج هوسًا بالطعام واكتئابًا وانهيارًا للأيض ثم شراهة الأساس العلمي لفهم أن كثيرًا من سلوكيات اضطراب الأكل نتيجة التقييد دراسات الأتراب في فرامنجهام (منذ 1948) أتراب طولية أسّست مفهوم \"عوامل الخطر\" القلبية (ضغط، كوليسترول، تدخين) غيّرت الطب الوقائي كله DASH (1997) تجربة عشوائية بتغذية مراقَبة النمط الغذائي وحده خفض الضغط بفعالية تقارب دواءً أثبتت أن النمط أقوى من مغذٍّ منفرد PREDIMED (2013، أُعيد نشرها 2018) تجربة عشوائية أولية للوقاية النمط المتوسطي المدعّم بزيت الزيتون أو المكسرات قلل الأحداث القلبية الوعائية أقوى دليل تدخّلي على نمط غذائي كامل Look AHEAD (2013) تجربة عشوائية كبيرة التدخل المكثف في نمط الحياة حسّن الوزن والسكر واللياقة، لكنه لم يقلل الأحداث القلبية بفارق دال درس في التواضع: الفائدة الأيضية لا تُترجم تلقائيًا لكل نتيجة DiRECT (2018) عشوائية عنقودية برنامج مكثف لإنقاص الوزن حقّق هدأة سكري النوع الثاني لدى نسبة معتبرة، والنجاح تناسب طرديًا مع مقدار الوزن المفقود نقلت السكري النوع الثاني من \"مرض تقدّمي حتمي\" إلى حالة قد تنعكس LEAP (2015) عشوائية الإدخال المبكر للفول السوداني قلل حساسيته بشكل كبير عكست التوصية القديمة بالتأجيل DPP — برنامج الوقاية من السكري (2002) عشوائية تعديل نمط الحياة تفوّق على الميتفورمين في الوقاية من السكري التغذية تدخّل من الدرجة الأولى وليس مكملًا دراسات هول عن الأطعمة فائقة التصنيع (2019) تجربة تغذية داخلية مضبوطة مع تطابق الماكروز، أكل المشاركون مئات السعرات الزائدة يوميًا على النمط فائق التصنيع أول دليل سببي على أثر درجة التصنيع لا التركيب فقط مراجعات Cochrane حول الدهون المشبعة مراجعات منهجية الاستبدال (بدهون متعددة غير مشبعة) هو ما يفيد، لا مجرد التقليل \"بم استبدلت؟\" سؤال أهم من \"ماذا حذفت؟\" الطب العشوائي المندلي (Mendelian randomization) منهج جيني يقارب السببية باستخدام المتغيرات الجينية أداة حديثة تحلّ جزئيًا مشكلة العوامل المربكة في الدراسات الرصدية درس منهجي عام: التغذية علم صعب لأن التعمية شبه مستحيلة ، والتقيّد طويل المدى ضعيف، والتبليغ الغذائي غير دقيق، وفترات المتابعة قصيرة نسبيًا مقارنةً بعمر الأمراض المزمنة. لذلك تعدد أنواع الأدلة المتقاربة (رصدية + تدخلية + آلية + مندلية) أقوى من أي دراسة واحدة مهما كانت لامعة."}, {"i": 18, "group": "guide", "tag": "أدلة", "num": "18", "short": "تفنيد الخرافات الشائعة", "html": "<h1>الجزء الثامن عشر: تفنيد الخرافات الشائعة</h1>\n<div class=\"tablewrap\"><table><thead><tr><th>الادعاء</th><th>الحقيقة</th></tr></thead><tbody><tr><td><strong>\"الديتوكس ينظف الجسم من السموم\"</strong></td><td>الكبد والكلى والرئتان والجلد تؤدي هذه الوظيفة باستمرار. لا يوجد منتج تجاري أثبت إزالة \"سموم\" محددة، والمروّجون لا يسمّون السم ولا يقيسونه قبل وبعد</td></tr><tr><td><strong>\"الإنسولين هو سبب السمنة\"</strong></td><td>فرضية الكربوهيدرات-إنسولين لم تصمد في التجارب المضبوطة: عند تساوي السعرات والبروتين، لا تتفوق الحميات منخفضة الكربوهيدرات في فقد الدهون. الإنسولين هرمون تخزين، لكن <strong>فائض الطاقة</strong> هو المحرك</td></tr><tr><td><strong>\"وجبات صغيرة متكررة تسرّع الأيض\"</strong></td><td>الأثر الحراري يتناسب مع <strong>إجمالي</strong> ما تأكله لا عدد مرات الأكل. عدد الوجبات مسألة <strong>تفضيل وشبع والتزام</strong></td></tr><tr><td><strong>\"الأكل بعد 8 مساءً يتحول لدهون\"</strong></td><td>الساعة لا تغيّر الفيزياء. الأكل الليلي يرتبط بالوزن لأنه غالبًا <strong>زائد وانفعالي وغير مخطط</strong>، لا لأن الليل سحري</td></tr><tr><td><strong>\"حرق الدهون الموضعي (Spot reduction)\"</strong></td><td>لا يمكن اختيار مكان الحرق؛ التوزيع محدد وراثيًا وهرمونيًا. تمارين البطن تقوّي العضلة تحت الدهن ولا تزيله</td></tr><tr><td><strong>\"السكر يسبب السكري مباشرة\"</strong></td><td>العامل الأكبر هو <strong>زيادة الوزن ومقاومة الإنسولين والوراثة والخمول</strong>. السكر يساهم بشكل رئيسي عبر فائض السعرات (والمشروبات المحلاة أقوى المرتبطات)</td></tr><tr><td><strong>\"الفواكه ممنوعة لمرضى السكري\"</strong></td><td>حصص معتدلة من الفاكهة الكاملة (بأليافها) آمنة ومفيدة. الممنوع هو <strong>العصير والكميات الكبيرة دفعة واحدة</strong></td></tr><tr><td><strong>\"الجلوتين ضار للجميع\"</strong></td><td>ضار للسيلياك وحساسية القمح وبعض حالات الحساسية غير السيلياكية. للأصحاء لا فائدة من حذفه، وقد يقلل الألياف والحبوب الكاملة</td></tr><tr><td><strong>\"البروتين العالي يدمّر الكلى\"</strong></td><td>لا دليل قوي في الكلى السليمة. التقييد لمن لديه <strong>مرض كلوي قائم</strong></td></tr><tr><td><strong>\"الميكروويف يدمّر المغذيات\"</strong></td><td>من أقل طرق الطهي إتلافًا للمغذيات (زمن قصير وماء قليل). المدمّر الحقيقي هو <strong>السلق الطويل في ماء كثير يُسكب</strong></td></tr><tr><td><strong>\"البيض يرفع الكوليسترول ويجب تجنّبه\"</strong></td><td>تأثير الكوليسترول الغذائي محدود لدى الأغلبية؛ الدهون المشبعة والمتحولة أهم. اعتدال معقول ومتابعة فردية</td></tr><tr><td><strong>\"الملح البحري/الوردي أصح\"</strong></td><td>الصوديوم واحد تقريبًا. الفارق في المعادن النزرة ضئيل بلا دلالة صحية — والملح المدعّم باليود قد يكون <strong>الأفضل صحيًا</strong></td></tr><tr><td><strong>\"يجب شرب 8 أكواب ماء بالضبط\"</strong></td><td>الاحتياج فردي (وزن، حرارة، نشاط)، ويشمل الماء الوارد من الطعام والمشروبات كافة</td></tr><tr><td><strong>\"الأطعمة العضوية أعلى قيمة غذائية\"</strong></td><td>الفروق في المحتوى الغذائي صغيرة وغير حاسمة. <strong>أكل خضار وفاكهة غير عضوية أفضل بكثير من عدم أكلها</strong></td></tr><tr><td><strong>\"مكمل X يحرق الدهون\"</strong></td><td>معظم \"الحارقات\" أدلتها ضعيفة أو معدومة، وبعضها خطر (منشطات خفية، سُمية كبدية). العجز الحراري هو ما يحرق</td></tr><tr><td><strong>\"الرجيم القاسي أسرع فيبقى أفضل\"</strong></td><td>أسرع في الميزان، وأعلى في فقد العضل والتكيف الأيضي واستعادة الوزن. <strong>الاستدامة تهزم السرعة</strong></td></tr><tr><td><strong>\"مضادات الأكسدة بجرعات عالية مفيدة دائمًا\"</strong></td><td>مكملاتها بجرعات عالية لم تُظهر فائدة، وبعضها <strong>زاد الضرر</strong> في تجارب كبرى. المصدر الغذائي مختلف عن الحبة المركّزة</td></tr></tbody></table></div>\n<p><strong>كيف تتعرف على الادعاء الزائف؟</strong> ستة أعلام حمراء: وعد بنتيجة سريعة وسهلة · قصص نجاح بدل بيانات · حديث عن \"سموم\" غامضة · تخوين للطب والعلم (\"ما لا يريدون أن تعرفه\") · بيع منتج بواسطة نفس من يقدّم النصيحة · تصنيف الأطعمة إلى \"معجزة\" و\"سم\".</p>\n<hr>", "text": "الجزء الثامن عشر: تفنيد الخرافات الشائعة الادعاء الحقيقة \"الديتوكس ينظف الجسم من السموم\" الكبد والكلى والرئتان والجلد تؤدي هذه الوظيفة باستمرار. لا يوجد منتج تجاري أثبت إزالة \"سموم\" محددة، والمروّجون لا يسمّون السم ولا يقيسونه قبل وبعد \"الإنسولين هو سبب السمنة\" فرضية الكربوهيدرات إنسولين لم تصمد في التجارب المضبوطة: عند تساوي السعرات والبروتين، لا تتفوق الحميات منخفضة الكربوهيدرات في فقد الدهون. الإنسولين هرمون تخزين، لكن فائض الطاقة هو المحرك \"وجبات صغيرة متكررة تسرّع الأيض\" الأثر الحراري يتناسب مع إجمالي ما تأكله لا عدد مرات الأكل. عدد الوجبات مسألة تفضيل وشبع والتزام \"الأكل بعد 8 مساءً يتحول لدهون\" الساعة لا تغيّر الفيزياء. الأكل الليلي يرتبط بالوزن لأنه غالبًا زائد وانفعالي وغير مخطط ، لا لأن الليل سحري \"حرق الدهون الموضعي (Spot reduction)\" لا يمكن اختيار مكان الحرق؛ التوزيع محدد وراثيًا وهرمونيًا. تمارين البطن تقوّي العضلة تحت الدهن ولا تزيله \"السكر يسبب السكري مباشرة\" العامل الأكبر هو زيادة الوزن ومقاومة الإنسولين والوراثة والخمول . السكر يساهم بشكل رئيسي عبر فائض السعرات (والمشروبات المحلاة أقوى المرتبطات) \"الفواكه ممنوعة لمرضى السكري\" حصص معتدلة من الفاكهة الكاملة (بأليافها) آمنة ومفيدة. الممنوع هو العصير والكميات الكبيرة دفعة واحدة \"الجلوتين ضار للجميع\" ضار للسيلياك وحساسية القمح وبعض حالات الحساسية غير السيلياكية. للأصحاء لا فائدة من حذفه، وقد يقلل الألياف والحبوب الكاملة \"البروتين العالي يدمّر الكلى\" لا دليل قوي في الكلى السليمة. التقييد لمن لديه مرض كلوي قائم \"الميكروويف يدمّر المغذيات\" من أقل طرق الطهي إتلافًا للمغذيات (زمن قصير وماء قليل). المدمّر الحقيقي هو السلق الطويل في ماء كثير يُسكب \"البيض يرفع الكوليسترول ويجب تجنّبه\" تأثير الكوليسترول الغذائي محدود لدى الأغلبية؛ الدهون المشبعة والمتحولة أهم. اعتدال معقول ومتابعة فردية \"الملح البحري/الوردي أصح\" الصوديوم واحد تقريبًا. الفارق في المعادن النزرة ضئيل بلا دلالة صحية — والملح المدعّم باليود قد يكون الأفضل صحيًا \"يجب شرب 8 أكواب ماء بالضبط\" الاحتياج فردي (وزن، حرارة، نشاط)، ويشمل الماء الوارد من الطعام والمشروبات كافة \"الأطعمة العضوية أعلى قيمة غذائية\" الفروق في المحتوى الغذائي صغيرة وغير حاسمة. أكل خضار وفاكهة غير عضوية أفضل بكثير من عدم أكلها \"مكمل X يحرق الدهون\" معظم \"الحارقات\" أدلتها ضعيفة أو معدومة، وبعضها خطر (منشطات خفية، سُمية كبدية). العجز الحراري هو ما يحرق \"الرجيم القاسي أسرع فيبقى أفضل\" أسرع في الميزان، وأعلى في فقد العضل والتكيف الأيضي واستعادة الوزن. الاستدامة تهزم السرعة \"مضادات الأكسدة بجرعات عالية مفيدة دائمًا\" مكملاتها بجرعات عالية لم تُظهر فائدة، وبعضها زاد الضرر في تجارب كبرى. المصدر الغذائي مختلف عن الحبة المركّزة كيف تتعرف على الادعاء الزائف؟ ستة أعلام حمراء: وعد بنتيجة سريعة وسهلة · قصص نجاح بدل بيانات · حديث عن \"سموم\" غامضة · تخوين للطب والعلم (\"ما لا يريدون أن تعرفه\") · بيع منتج بواسطة نفس من يقدّم النصيحة · تصنيف الأطعمة إلى \"معجزة\" و\"سم\"."}, {"i": 19, "group": "guide", "tag": "ممارسة", "num": "19", "short": "الممارسة المهنية والعيادة", "html": "<h1>الجزء التاسع عشر: الممارسة المهنية والعيادة</h1>\n<h2>19.1 نطاق الممارسة والمسؤولية</h2>\n<ul><li><strong>اعرف ترخيصك:</strong> ما تسمح به قوانين بلدك تحديدًا (وصف أنظمة علاجية، التعامل مع مرضى، تعديل أدوية — الأخير خارج النطاق دائمًا لغير المرخّص طبيًا).</li><li><strong>التوثيق حماية قانونية:</strong> ما لم يُكتب لم يحدث. وثّق التقييم، والتوصية، والتحذيرات التي أعطيتها، <strong>ورفض المريض للتوصية</strong> إن حدث.</li><li><strong>الموافقة المستنيرة:</strong> اشرح ما ستفعله، والبدائل، والحدود، والمتوقع.</li><li><strong>حدود العلاقة المهنية:</strong> لا استشارات عبر رسائل خاصة بلا ملف، ولا وعود بنتائج مضمونة.</li><li><strong>التأمين المهني</strong> إن كان متاحًا في بلدك.</li></ul>\n<h2>19.2 هيكل الجلسة</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الجلسة</th><th>المدة</th><th>المحتوى</th></tr></thead><tbody><tr><td><strong>الأولى</strong></td><td>45–60 دقيقة</td><td>تقييم شامل + بناء علاقة + هدف واحد أو اثنان فقط (لا تُغرِق العميل)</td></tr><tr><td><strong>المتابعة</strong></td><td>20–30 دقيقة</td><td>مراجعة الأسبوع → معالجة العائق → تعديل الهدف → تثقيف نقطة واحدة</td></tr><tr><td><strong>الإغلاق</strong></td><td>—</td><td>خطة الحفاظ، سيناريوهات الانتكاس، وموعد مراجعة بعيد</td></tr></tbody></table></div>\n<p><strong>قاعدة التثقيف:</strong> <strong>رسالة واحدة أساسية لكل جلسة</strong>. المعلومة الزائدة لا تُنفَّذ. واستخدم <strong>Teach-back</strong>: \"ممكن تقولّي بكلامك إنت هنعمل إيه الأسبوع ده؟\"</p>\n<h2>19.3 التغذية عن بُعد</h2>\n<ul><li><strong>مزايا:</strong> وصول أوسع، متابعة أكثر تكرارًا، صور للوجبات في وقتها الحقيقي.</li><li><strong>تحديات:</strong> غياب القياسات الموضوعية → درّب العميل على قياس محيط الخصر والوزن بشروط ثابتة (صباحًا، بعد الحمام، نفس الملابس)، واطلب صورًا للتحاليل.</li><li><strong>حدود صريحة:</strong> الحالات الحرجة أو غير المستقرة أو المشتبه فيها اضطراب أكل → <strong>تحتاج حضورًا وفريقًا</strong>.</li><li>خصوصية البيانات وأمن المنصة مسؤوليتك.</li></ul>\n<h2>19.4 التواصل والمحتوى الرقمي — أخلاقيات</h2>\n<ul><li>لا تشخّص أو تعطِ خطة فردية لجمهور عام.</li><li>لا تستخدم صور \"قبل وبعد\" بشكل يبيع الوهم أو يصم الأجسام.</li><li><strong>الإفصاح عن أي تعاون تجاري</strong> غير قابل للتفاوض.</li><li>عند تفنيد معلومة خاطئة: <strong>اذكر الصحيح أولًا وبوضوح</strong>، ثم أشر للخطأ بإيجاز، ثم اشرح لماذا انتشر — تكرار الخرافة بلا تصحيح واضح يرسّخها.</li><li>تجنّب لغة \"الطعام النظيف/القذر\" — لها ثمن نفسي حقيقي على متابعيك.</li></ul>\n<h2>19.5 أول 6 أسابيع للممارس الجديد — خطة عملية</h2>\n<ol><li><strong>أسبوع 1–2:</strong> أتقن استمارة التقييم واسترجاع 24 ساعة على 10 متطوعين (أهل وأصدقاء).</li><li><strong>أسبوع 3:</strong> احسب TDEE وماكروز لـ 20 حالة ورقية مختلفة، وقارن نتائجك بمعادلات متعددة.</li><li><strong>أسبوع 4:</strong> اكتب 15 صياغة PES من حالات كتاب Nelms أو حالات هذا الدليل.</li><li><strong>أسبوع 5:</strong> سجّل (بإذن) ثلاث جلسات إرشادية واستمع لها — احسب: كم تكلمت؟ كم سألت أسئلة مفتوحة؟ كم مرة وقعت في \"مصيدة التصحيح\"؟</li><li><strong>أسبوع 6:</strong> ابنِ مكتبتك المرجعية (Krause + دليل جمعيتك المحلية + إرشادات ADA/ESPEN)، وضع لنفسك <strong>بروتوكولًا مكتوبًا</strong> لكل حالة شائعة تتعامل معها.</li></ol>\n<p><strong>عادات مستمرة:</strong> ورقة بحثية أسبوعيًا · مراجعة حالة أسبوعيًا · إشراف/استشارة زميل أخبر منك شهريًا · مراجعة الإرشادات المحدّثة سنويًا.</p>\n<hr>", "text": "الجزء التاسع عشر: الممارسة المهنية والعيادة 19.1 نطاق الممارسة والمسؤولية اعرف ترخيصك: ما تسمح به قوانين بلدك تحديدًا (وصف أنظمة علاجية، التعامل مع مرضى، تعديل أدوية — الأخير خارج النطاق دائمًا لغير المرخّص طبيًا). التوثيق حماية قانونية: ما لم يُكتب لم يحدث. وثّق التقييم، والتوصية، والتحذيرات التي أعطيتها، ورفض المريض للتوصية إن حدث. الموافقة المستنيرة: اشرح ما ستفعله، والبدائل، والحدود، والمتوقع. حدود العلاقة المهنية: لا استشارات عبر رسائل خاصة بلا ملف، ولا وعود بنتائج مضمونة. التأمين المهني إن كان متاحًا في بلدك. 19.2 هيكل الجلسة الجلسة المدة المحتوى الأولى 45–60 دقيقة تقييم شامل + بناء علاقة + هدف واحد أو اثنان فقط (لا تُغرِق العميل) المتابعة 20–30 دقيقة مراجعة الأسبوع → معالجة العائق → تعديل الهدف → تثقيف نقطة واحدة الإغلاق — خطة الحفاظ، سيناريوهات الانتكاس، وموعد مراجعة بعيد قاعدة التثقيف: رسالة واحدة أساسية لكل جلسة . المعلومة الزائدة لا تُنفَّذ. واستخدم Teach back : \"ممكن تقولّي بكلامك إنت هنعمل إيه الأسبوع ده؟\" 19.3 التغذية عن بُعد مزايا: وصول أوسع، متابعة أكثر تكرارًا، صور للوجبات في وقتها الحقيقي. تحديات: غياب القياسات الموضوعية → درّب العميل على قياس محيط الخصر والوزن بشروط ثابتة (صباحًا، بعد الحمام، نفس الملابس)، واطلب صورًا للتحاليل. حدود صريحة: الحالات الحرجة أو غير المستقرة أو المشتبه فيها اضطراب أكل → تحتاج حضورًا وفريقًا . خصوصية البيانات وأمن المنصة مسؤوليتك. 19.4 التواصل والمحتوى الرقمي — أخلاقيات لا تشخّص أو تعطِ خطة فردية لجمهور عام. لا تستخدم صور \"قبل وبعد\" بشكل يبيع الوهم أو يصم الأجسام. الإفصاح عن أي تعاون تجاري غير قابل للتفاوض. عند تفنيد معلومة خاطئة: اذكر الصحيح أولًا وبوضوح ، ثم أشر للخطأ بإيجاز، ثم اشرح لماذا انتشر — تكرار الخرافة بلا تصحيح واضح يرسّخها. تجنّب لغة \"الطعام النظيف/القذر\" — لها ثمن نفسي حقيقي على متابعيك. 19.5 أول 6 أسابيع للممارس الجديد — خطة عملية 1. أسبوع 1–2: أتقن استمارة التقييم واسترجاع 24 ساعة على 10 متطوعين (أهل وأصدقاء). 2. أسبوع 3: احسب TDEE وماكروز لـ 20 حالة ورقية مختلفة، وقارن نتائجك بمعادلات متعددة. 3. أسبوع 4: اكتب 15 صياغة PES من حالات كتاب Nelms أو حالات هذا الدليل. 4. أسبوع 5: سجّل (بإذن) ثلاث جلسات إرشادية واستمع لها — احسب: كم تكلمت؟ كم سألت أسئلة مفتوحة؟ كم مرة وقعت في \"مصيدة التصحيح\"؟ 5. أسبوع 6: ابنِ مكتبتك المرجعية (Krause + دليل جمعيتك المحلية + إرشادات ADA/ESPEN)، وضع لنفسك بروتوكولًا مكتوبًا لكل حالة شائعة تتعامل معها. عادات مستمرة: ورقة بحثية أسبوعيًا · مراجعة حالة أسبوعيًا · إشراف/استشارة زميل أخبر منك شهريًا · مراجعة الإرشادات المحدّثة سنويًا."}, {"i": 20, "group": "guide", "tag": "رياضي", "num": "20", "short": "سياقات رياضية إضافية", "html": "<h1>الجزء العشرون: سياقات رياضية إضافية</h1>\n<h2>20.1 الرياضي المراهق</h2>\n<ul><li><strong>النمو أولًا:</strong> الأولوية للطاقة الكافية لدعم النمو الطولي والبلوغ، <strong>لا لتركيب الجسم</strong>.</li><li><strong>⚠️ لا حميات إنقاص وزن ولا قياس نسبة دهون روتيني</strong> — هذه ممارسات ترفع خطر اضطرابات الأكل بشكل موثق.</li><li>احتياج <strong>الكالسيوم 1300 مجم</strong> وفيتامين D — نافذة بناء ذروة كتلة العظام.</li><li><strong>الحديد</strong> خصوصًا للفتيات بعد البلوغ وللاعبي التحمل.</li><li><strong>المكملات:</strong> الأصل عدم استخدامها؛ الغذاء أولًا. الكرياتين تحديدًا لا يُوصى به روتينيًا تحت 18 سنة لقلة بيانات السلامة طويلة المدى في هذه الفئة.</li><li>الرسالة للمدرب والأهل: <strong>الأداء يتحسن بالنضج والتدريب والنوم</strong>، لا بالتقييد.</li></ul>\n<h2>20.2 الرياضية والدورة الشهرية</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الطور</th><th>الملامح</th><th>التطبيق</th></tr></thead><tbody><tr><td><strong>الجريبي (Follicular)</strong> — بعد الحيض حتى التبويض</td><td>إستروجين صاعد، تحمّل أفضل للشدة العالية، استخدام أفضل للجليكوجين</td><td>مناسب للأحمال الثقيلة والعمل عالي الشدة</td></tr><tr><td><strong>الأصفري (Luteal)</strong> — بعد التبويض</td><td>بروجستيرون مرتفع، <strong>حرارة أساسية أعلى</strong> (+0.3–0.5°م)، ↑ أكسدة دهون، ↑ الحاجة للسوائل والصوديوم، وقد يرتفع الإنفاق الحراري قليلًا</td><td>انتبه للترطيب في الحر، وقد تزيد الشهية طبيعيًا — لا تقاومها بعنف</td></tr></tbody></table></div>\n<ul><li><strong>أعراض ما قبل الحيض:</strong> ماغنسيوم، كالسيوم، B6 (أدلة متوسطة)، انتظام وجبات، تقليل الملح والكافيين.</li><li><strong>الحيض الغزير</strong> سبب شائع لنقص الحديد لدى الرياضيات → افحص الفيريتين.</li><li><strong>⚠️ غياب الدورة ليس علامة \"لياقة عالية\"</strong> — إنه مؤشر إنذار على نقص الطاقة (راجع RED-S).</li><li><strong>ملاحظة علمية أمينة:</strong> أدلة \"تدوير التدريب والتغذية حسب الدورة\" ما زالت محدودة ومتباينة؛ <strong>التتبع الفردي للأعراض والأداء</strong> أنفع من بروتوكول عام صارم.</li></ul>\n<h2>20.3 الحرارة والرطوبة</h2>\n<ul><li>ابدأ <strong>مُرطَّبًا مسبقًا</strong> (5–7 مل/كجم قبل 2–4 ساعات).</li><li>زد <strong>الصوديوم</strong> (500–1000 مجم/لتر في التعرق الغزير أو المتعرقين المالحين — علامة: أثر ملحي أبيض على الملابس والجلد).</li><li><strong>التأقلم الحراري (Heat acclimation)</strong> خلال 7–14 يومًا يقلل فقد الصوديوم ويحسّن الأداء.</li><li><strong>تبريد مسبق (Pre-cooling):</strong> مشروبات مثلجة/آيس سلاش قبل وأثناء الجهد الطويل في الحر.</li><li>⚠️ علامات الإجهاد الحراري: دوخة، غثيان، توقف التعرق، تشوش → <strong>إيقاف فوري وتبريد</strong>.</li></ul>\n<h2>20.4 الارتفاعات</h2>\n<ul><li><strong>↑ الاحتياج للطاقة</strong> (الأيض الأساسي يرتفع) مع <strong>↓ الشهية</strong> في آن — معادلة خطرة تؤدي لفقد وزن وكتلة عضلية.</li><li><strong>↑ فقد السوائل</strong> (التنفس الجاف السريع والبول) → ترطيب استباقي.</li><li><strong>الحديد أساسي</strong> لتكوين كرات الدم الحمراء الجديدة — <strong>افحص الفيريتين قبل الصعود</strong> وعالج النقص، وإلا لن يتحقق التكيف.</li><li>زيادة الاعتماد على الكربوهيدرات (وقود أكفأ من حيث استهلاك الأكسجين).</li><li>مضادات الأكسدة الغذائية مفيدة (إجهاد تأكسدي أعلى) — من الطعام لا الجرعات المركّزة.</li></ul>\n<h2>20.5 السفر عبر المناطق الزمنية</h2>\n<ul><li><strong>اضبط مواعيد الوجبات على توقيت الوجهة فورًا</strong> — الوجبة منبّه قوي للساعة البيولوجية.</li><li>الكافيين أداة توقيت: صباحًا بتوقيت الوجهة لا عشوائيًا.</li><li>الترطيب في الطيران (جو الطائرة جاف جدًا) وتقليل الكحول.</li><li><strong>سلامة الغذاء أولوية قصوى</strong> في الوجهات عالية الخطورة: ماء معبأ، تجنّب النيء والسلطات المغسولة بماء مشكوك فيه والثلج، \"اسلقها أو اقشرها أو انسها\".</li><li>احمل أطعمة مألوفة موثوقة (شوفان، مكسرات، تمر، مسحوق بروتين) — ليس وقت التجريب.</li></ul>\n<h2>20.6 الرياضي ذو الإعاقة (Para-athlete)</h2>\n<ul><li><strong>تقدير الطاقة أصعب:</strong> المعادلات القياسية تبالغ عادةً لدى مصابي إصابة النخاع الشوكي (كتلة عضلية عاملة أقل) — تحتاج تعديلًا وتحققًا بالمتابعة.</li><li><strong>إصابة النخاع الشوكي:</strong> خطر أعلى لهشاشة العظام، حصوات وعدوى المسالك البولية (<strong>الترطيب حاسم</strong>)، الإمساك العصبي (ألياف وسوائل وروتين)، وقرح الفراش (بروتين وزنك وفيتامين C).</li><li><strong>اضطراب التنظيم الحراري</strong> لدى بعض الفئات → استراتيجيات تبريد وترطيب مخصصة.</li><li><strong>البتر:</strong> عدّل تقدير الوزن المثالي والاحتياج الحراري بنسبة الطرف المفقود.</li><li><strong>التصنيف الوظيفي (Classification)</strong> قد يخلق ضغطًا على الوزن → راقب توافر الطاقة واضطرابات الأكل.</li></ul>\n<h2>20.7 الرياضي النباتي</h2>\n<ul><li><strong>بروتين أعلى بنحو 10–20%</strong> (~1.8–2.2 جم/كجم) وتنويع المصادر خلال اليوم.</li><li><strong>مغذيات محل خطر:</strong> B12 (مكمل إلزامي)، حديد (افحص الفيريتين)، زنك، كالسيوم، يود، فيتامين D، أوميجا-3 (EPA/DHA من الطحالب)، <strong>كرياتين وكارنوزين</strong> (مخزونهما أقل طبيعيًا → <strong>الرياضي النباتي غالبًا أكثر المستجيبين لمكمل الكرياتين</strong>).</li><li>الكثافة الطاقية منخفضة والألياف عالية → قد يصعب بلوغ سعرات عالية: استخدم مصادر مركّزة (زبدة مكسرات، زيوت، فواكه مجففة، عصائر معتدلة، مساحيق).</li></ul>\n<hr>\n<p><em>(نهاية الطبعة الموسّعة الثانية)</em></p>\n<hr>", "text": "الجزء العشرون: سياقات رياضية إضافية 20.1 الرياضي المراهق النمو أولًا: الأولوية للطاقة الكافية لدعم النمو الطولي والبلوغ، لا لتركيب الجسم . ⚠️ لا حميات إنقاص وزن ولا قياس نسبة دهون روتيني — هذه ممارسات ترفع خطر اضطرابات الأكل بشكل موثق. احتياج الكالسيوم 1300 مجم وفيتامين D — نافذة بناء ذروة كتلة العظام. الحديد خصوصًا للفتيات بعد البلوغ وللاعبي التحمل. المكملات: الأصل عدم استخدامها؛ الغذاء أولًا. الكرياتين تحديدًا لا يُوصى به روتينيًا تحت 18 سنة لقلة بيانات السلامة طويلة المدى في هذه الفئة. الرسالة للمدرب والأهل: الأداء يتحسن بالنضج والتدريب والنوم ، لا بالتقييد. 20.2 الرياضية والدورة الشهرية الطور الملامح التطبيق الجريبي (Follicular) — بعد الحيض حتى التبويض إستروجين صاعد، تحمّل أفضل للشدة العالية، استخدام أفضل للجليكوجين مناسب للأحمال الثقيلة والعمل عالي الشدة الأصفري (Luteal) — بعد التبويض بروجستيرون مرتفع، حرارة أساسية أعلى (+0.3–0.5°م)، ↑ أكسدة دهون، ↑ الحاجة للسوائل والصوديوم، وقد يرتفع الإنفاق الحراري قليلًا انتبه للترطيب في الحر، وقد تزيد الشهية طبيعيًا — لا تقاومها بعنف أعراض ما قبل الحيض: ماغنسيوم، كالسيوم، B6 (أدلة متوسطة)، انتظام وجبات، تقليل الملح والكافيين. الحيض الغزير سبب شائع لنقص الحديد لدى الرياضيات → افحص الفيريتين. ⚠️ غياب الدورة ليس علامة \"لياقة عالية\" — إنه مؤشر إنذار على نقص الطاقة (راجع RED S). ملاحظة علمية أمينة: أدلة \"تدوير التدريب والتغذية حسب الدورة\" ما زالت محدودة ومتباينة؛ التتبع الفردي للأعراض والأداء أنفع من بروتوكول عام صارم. 20.3 الحرارة والرطوبة ابدأ مُرطَّبًا مسبقًا (5–7 مل/كجم قبل 2–4 ساعات). زد الصوديوم (500–1000 مجم/لتر في التعرق الغزير أو المتعرقين المالحين — علامة: أثر ملحي أبيض على الملابس والجلد). التأقلم الحراري (Heat acclimation) خلال 7–14 يومًا يقلل فقد الصوديوم ويحسّن الأداء. تبريد مسبق (Pre cooling): مشروبات مثلجة/آيس سلاش قبل وأثناء الجهد الطويل في الحر. ⚠️ علامات الإجهاد الحراري: دوخة، غثيان، توقف التعرق، تشوش → إيقاف فوري وتبريد . 20.4 الارتفاعات ↑ الاحتياج للطاقة (الأيض الأساسي يرتفع) مع ↓ الشهية في آن — معادلة خطرة تؤدي لفقد وزن وكتلة عضلية. ↑ فقد السوائل (التنفس الجاف السريع والبول) → ترطيب استباقي. الحديد أساسي لتكوين كرات الدم الحمراء الجديدة — افحص الفيريتين قبل الصعود وعالج النقص، وإلا لن يتحقق التكيف. زيادة الاعتماد على الكربوهيدرات (وقود أكفأ من حيث استهلاك الأكسجين). مضادات الأكسدة الغذائية مفيدة (إجهاد تأكسدي أعلى) — من الطعام لا الجرعات المركّزة. 20.5 السفر عبر المناطق الزمنية اضبط مواعيد الوجبات على توقيت الوجهة فورًا — الوجبة منبّه قوي للساعة البيولوجية. الكافيين أداة توقيت: صباحًا بتوقيت الوجهة لا عشوائيًا. الترطيب في الطيران (جو الطائرة جاف جدًا) وتقليل الكحول. سلامة الغذاء أولوية قصوى في الوجهات عالية الخطورة: ماء معبأ، تجنّب النيء والسلطات المغسولة بماء مشكوك فيه والثلج، \"اسلقها أو اقشرها أو انسها\". احمل أطعمة مألوفة موثوقة (شوفان، مكسرات، تمر، مسحوق بروتين) — ليس وقت التجريب. 20.6 الرياضي ذو الإعاقة (Para athlete) تقدير الطاقة أصعب: المعادلات القياسية تبالغ عادةً لدى مصابي إصابة النخاع الشوكي (كتلة عضلية عاملة أقل) — تحتاج تعديلًا وتحققًا بالمتابعة. إصابة النخاع الشوكي: خطر أعلى لهشاشة العظام، حصوات وعدوى المسالك البولية ( الترطيب حاسم )، الإمساك العصبي (ألياف وسوائل وروتين)، وقرح الفراش (بروتين وزنك وفيتامين C). اضطراب التنظيم الحراري لدى بعض الفئات → استراتيجيات تبريد وترطيب مخصصة. البتر: عدّل تقدير الوزن المثالي والاحتياج الحراري بنسبة الطرف المفقود. التصنيف الوظيفي (Classification) قد يخلق ضغطًا على الوزن → راقب توافر الطاقة واضطرابات الأكل. 20.7 الرياضي النباتي بروتين أعلى بنحو 10–20% (~1.8–2.2 جم/كجم) وتنويع المصادر خلال اليوم. مغذيات محل خطر: B12 (مكمل إلزامي)، حديد (افحص الفيريتين)، زنك، كالسيوم، يود، فيتامين D، أوميجا 3 (EPA/DHA من الطحالب)، كرياتين وكارنوزين (مخزونهما أقل طبيعيًا → الرياضي النباتي غالبًا أكثر المستجيبين لمكمل الكرياتين ). الكثافة الطاقية منخفضة والألياف عالية → قد يصعب بلوغ سعرات عالية: استخدم مصادر مركّزة (زبدة مكسرات، زيوت، فواكه مجففة، عصائر معتدلة، مساحيق). (نهاية الطبعة الموسّعة الثانية)"}, {"i": 21, "group": "guide", "tag": "فسيولوجيا", "num": "21", "short": "التغذية والساعة البيولوجية", "html": "<h1>الجزء الحادي والعشرون: التغذية والساعة البيولوجية (Chrononutrition)</h1>\n<h2>21.1 الفكرة الأساسية</h2>\n<p>لكل خلية في الجسم ساعة جزيئية، وتتحكم فيها <strong>الساعة المركزية</strong> في النواة فوق التصالبية بالوطاء، والتي يضبطها <strong>الضوء</strong> أساسًا. أما ساعات الأعضاء الطرفية (كبد، بنكرياس، عضلات، أنسجة دهنية) فيضبطها بقوة <strong>توقيت الأكل</strong>.</p>\n<blockquote class=\"note\"><p><strong>النتيجة العملية:</strong> الأكل ليس مجرد \"ماذا وكم\"، بل <strong>\"متى\"</strong> — لأن التوقيت إشارة ضبط بيولوجية.</p></blockquote>\n<p><strong>التنافر البيولوجي (Circadian misalignment):</strong> حين تتعارض الساعة المركزية مع ساعات الأعضاء (سهر، ورديات ليلية، أكل ليلي) يحدث:</p>\n<ul><li>↓ حساسية الإنسولين (نفس الوجبة ترفع السكر أكثر ليلًا منها صباحًا)</li><li>↑ الدهون الثلاثية بعد الوجبة</li><li>↑ الالتهاب و↑ خطر السكري والسمنة وأمراض القلب على المدى الطويل</li></ul>\n<hr>\n<h2>21.2 النوم وهرمونات الشهية</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>ما يحدث مع قلة النوم (&lt;6 ساعات)</th><th>الأثر</th></tr></thead><tbody><tr><td>↑ <strong>جريلين</strong> و↓ <strong>لبتين</strong></td><td>جوع أعلى وشبع أقل</td></tr><tr><td>↑ استجابة مراكز المكافأة للطعام عالي السعرات</td><td>اشتهاء الحلويات والنشويات تحديدًا</td></tr><tr><td>↓ حساسية الإنسولين (قد تنخفض بنسبة ملحوظة بعد ليال قليلة فقط)</td><td>ضبط سكر أسوأ</td></tr><tr><td>↑ الكورتيزول المسائي</td><td>تخزين حشوي</td></tr><tr><td>↓ الأداء الرياضي والتعافي، ↑ خطر الإصابة</td><td></td></tr><tr><td>في العجز الحراري: <strong>نسبة أعلى من الوزن المفقود تأتي من العضل لا الدهن</strong></td><td></td></tr></tbody></table></div>\n<p><strong>الخلاصة:</strong> النوم ليس \"نصيحة عامة\" في خطة إنقاص الوزن — إنه <strong>متغير أيضي مباشر</strong>. سبع إلى تسع ساعات هدف علاجي، لا رفاهية.</p>\n<hr>\n<h2>21.3 توقيت الوجبات — ما تدعمه الأدلة</h2>\n<ul><li><strong>حساسية الإنسولين أعلى صباحًا وتنخفض تدريجيًا</strong> خلال اليوم → نفس الكمية من الكربوهيدرات تُحتمَل أفضل في النصف الأول من اليوم.</li><li><strong>الأكل المقيَّد بالوقت المبكر (early Time-Restricted Eating)</strong> — نافذة أكل 8–10 ساعات تنتهي مبكرًا نسبيًا — أظهر تحسنًا في السكر والضغط والدهون <strong>في بعض التجارب حتى بلا فقد وزن</strong>. لكن الأدلة ما زالت متباينة، والفائدة الأكبر في معظم الدراسات تأتي من <strong>انخفاض إجمالي السعرات</strong>.</li><li><strong>إفطار كبير مقابل عشاء كبير:</strong> عند تساوي السعرات، تميل النتائج لصالح توزيع الطاقة نحو <strong>النصف الأول من اليوم</strong> لضبط السكر والشبع — والفروق في الوزن نفسه متواضعة.</li><li><strong>آخر وجبة قبل النوم بـ 2–3 ساعات</strong> — يقلل الارتجاع ويحسّن جودة النوم وضبط السكر الصباحي.</li></ul>\n<blockquote class=\"danger\"><p><strong>تحذير من المبالغة:</strong> التوقيت <strong>مُعدِّل</strong> وليس بديلًا عن توازن الطاقة وجودة الغذاء. من يأكل 3000 سعرة في نافذة 8 ساعات لن ينقص وزنه.</p></blockquote>\n<hr>\n<h2>21.4 العاملون بنظام الورديات — بروتوكول عملي</h2>\n<p>هذه فئة عالية الخطورة أيضيًا ونادرًا ما تُخاطَب بخطط مناسبة.</p>\n<ol><li><strong>اجعل الوجبة الرئيسية قبل الوردية الليلية</strong> (في ساعات النهار/المساء المبكر)، لا في منتصف الليل.</li><li><strong>أثناء الليل:</strong> وجبات صغيرة خفيفة، <strong>بروتين + خضار</strong>، وتقليل الكربوهيدرات الثقيلة والدهون العالية (التحمّل الأيضي ليلًا أضعف والهضم أبطأ).</li><li><strong>تجنّب الأكل بين 2–5 فجرًا</strong> قدر الإمكان (أدنى نقطة في التحمل الأيضي).</li><li><strong>الكافيين:</strong> في النصف الأول من الوردية فقط؛ توقف قبل النوم بـ 6–8 ساعات على الأقل.</li><li><strong>بعد الوردية:</strong> وجبة خفيفة وليست دسمة، ثم نوم في غرفة مظلمة تمامًا وباردة.</li><li><strong>التعرض للضوء الساطع</strong> في بداية الوردية، و<strong>نظارة داكنة في طريق العودة صباحًا</strong> لمساعدة الجسم على النوم.</li><li>راقب: الوزن، محيط الخصر، السكر الصائم، الدهون الثلاثية، وضغط الدم — دوريًا.</li></ol>\n<hr>", "text": "الجزء الحادي والعشرون: التغذية والساعة البيولوجية (Chrononutrition) 21.1 الفكرة الأساسية لكل خلية في الجسم ساعة جزيئية، وتتحكم فيها الساعة المركزية في النواة فوق التصالبية بالوطاء، والتي يضبطها الضوء أساسًا. أما ساعات الأعضاء الطرفية (كبد، بنكرياس، عضلات، أنسجة دهنية) فيضبطها بقوة توقيت الأكل . النتيجة العملية: الأكل ليس مجرد \"ماذا وكم\"، بل \"متى\" — لأن التوقيت إشارة ضبط بيولوجية. التنافر البيولوجي (Circadian misalignment): حين تتعارض الساعة المركزية مع ساعات الأعضاء (سهر، ورديات ليلية، أكل ليلي) يحدث: ↓ حساسية الإنسولين (نفس الوجبة ترفع السكر أكثر ليلًا منها صباحًا) ↑ الدهون الثلاثية بعد الوجبة ↑ الالتهاب و↑ خطر السكري والسمنة وأمراض القلب على المدى الطويل 21.2 النوم وهرمونات الشهية ما يحدث مع قلة النوم (<6 ساعات) الأثر ↑ جريلين و↓ لبتين جوع أعلى وشبع أقل ↑ استجابة مراكز المكافأة للطعام عالي السعرات اشتهاء الحلويات والنشويات تحديدًا ↓ حساسية الإنسولين (قد تنخفض بنسبة ملحوظة بعد ليال قليلة فقط) ضبط سكر أسوأ ↑ الكورتيزول المسائي تخزين حشوي ↓ الأداء الرياضي والتعافي، ↑ خطر الإصابة في العجز الحراري: نسبة أعلى من الوزن المفقود تأتي من العضل لا الدهن الخلاصة: النوم ليس \"نصيحة عامة\" في خطة إنقاص الوزن — إنه متغير أيضي مباشر . سبع إلى تسع ساعات هدف علاجي، لا رفاهية. 21.3 توقيت الوجبات — ما تدعمه الأدلة حساسية الإنسولين أعلى صباحًا وتنخفض تدريجيًا خلال اليوم → نفس الكمية من الكربوهيدرات تُحتمَل أفضل في النصف الأول من اليوم. الأكل المقيَّد بالوقت المبكر (early Time Restricted Eating) — نافذة أكل 8–10 ساعات تنتهي مبكرًا نسبيًا — أظهر تحسنًا في السكر والضغط والدهون في بعض التجارب حتى بلا فقد وزن . لكن الأدلة ما زالت متباينة، والفائدة الأكبر في معظم الدراسات تأتي من انخفاض إجمالي السعرات . إفطار كبير مقابل عشاء كبير: عند تساوي السعرات، تميل النتائج لصالح توزيع الطاقة نحو النصف الأول من اليوم لضبط السكر والشبع — والفروق في الوزن نفسه متواضعة. آخر وجبة قبل النوم بـ 2–3 ساعات — يقلل الارتجاع ويحسّن جودة النوم وضبط السكر الصباحي. تحذير من المبالغة: التوقيت مُعدِّل وليس بديلًا عن توازن الطاقة وجودة الغذاء. من يأكل 3000 سعرة في نافذة 8 ساعات لن ينقص وزنه. 21.4 العاملون بنظام الورديات — بروتوكول عملي هذه فئة عالية الخطورة أيضيًا ونادرًا ما تُخاطَب بخطط مناسبة. 1. اجعل الوجبة الرئيسية قبل الوردية الليلية (في ساعات النهار/المساء المبكر)، لا في منتصف الليل. 2. أثناء الليل: وجبات صغيرة خفيفة، بروتين + خضار ، وتقليل الكربوهيدرات الثقيلة والدهون العالية (التحمّل الأيضي ليلًا أضعف والهضم أبطأ). 3. تجنّب الأكل بين 2–5 فجرًا قدر الإمكان (أدنى نقطة في التحمل الأيضي). 4. الكافيين: في النصف الأول من الوردية فقط؛ توقف قبل النوم بـ 6–8 ساعات على الأقل. 5. بعد الوردية: وجبة خفيفة وليست دسمة، ثم نوم في غرفة مظلمة تمامًا وباردة. 6. التعرض للضوء الساطع في بداية الوردية، و نظارة داكنة في طريق العودة صباحًا لمساعدة الجسم على النوم. 7. راقب: الوزن، محيط الخصر، السكر الصائم، الدهون الثلاثية، وضغط الدم — دوريًا."}, {"i": 22, "group": "guide", "tag": "علاجي", "num": "22", "short": "التغذية والتئام الجروح وقرح الفراش", "html": "<h1>الجزء الثاني والعشرون: التغذية والتئام الجروح وقرح الفراش</h1>\n<h2>22.1 مراحل الالتئام واحتياجاتها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المرحلة</th><th>ما يحدث</th><th>مغذيات محورية</th></tr></thead><tbody><tr><td><strong>الإرقاء والالتهاب</strong> (0–5 أيام)</td><td>تخثر، هجرة خلايا مناعية</td><td>طاقة كافية، فيتامين A، زنك، أوميجا-3</td></tr><tr><td><strong>التكاثر</strong> (3–21 يومًا)</td><td>تكوّن أوعية جديدة، بناء كولاجين، ظهارة</td><td><strong>بروتين، فيتامين C، حديد، نحاس، زنك</strong></td></tr><tr><td><strong>إعادة التشكيل</strong> (21 يومًا – سنة)</td><td>نضج الكولاجين وزيادة قوة الشد</td><td>بروتين مستمر، زنك، ترطيب</td></tr></tbody></table></div>\n<h2>22.2 الاحتياجات في الجروح وقرح الفراش</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المغذي</th><th>التوصية</th></tr></thead><tbody><tr><td><strong>الطاقة</strong></td><td>30–35 kcal/كجم/يوم (وقد ترتفع مع الجروح الواسعة)</td></tr><tr><td><strong>البروتين</strong></td><td><strong>1.25–1.5 جم/كجم</strong>، وحتى <strong>1.5–2.0</strong> في القرح من الدرجات المتقدمة أو تعدد الجروح</td></tr><tr><td><strong>السوائل</strong></td><td>30–35 مل/كجم (الجرح المفرز يفقد سوائل وبروتينًا كثيرًا)</td></tr><tr><td><strong>فيتامين C</strong></td><td>ضروري لتصنيع الكولاجين (هيدروكسيلة البرولين واللايسين) — يُعوّض عند النقص؛ <strong>الجرعات العالية بلا نقص لا تفيد</strong></td></tr><tr><td><strong>الزنك</strong></td><td>يُعوّض عند وجود نقص فقط، ولفترة محدودة (عادة أسبوعان)؛ <strong>الزائد المزمن يسبب نقص نحاس ويضر المناعة</strong></td></tr><tr><td><strong>أرجينين + جلوتامين + HMB</strong></td><td>مكملات متخصصة أظهرت فائدة في <strong>قرح الفراش من الدرجة 3–4</strong> — تُستخدم بقرار إكلينيكي لا روتينيًا</td></tr><tr><td><strong>فيتامين A</strong></td><td>مهم للظهارة؛ له دور خاص لدى مرضى الكورتيزون (يعاكس تثبيطه للالتئام) — بإشراف طبي</td></tr></tbody></table></div>\n<h2>22.3 عوامل تعطّل الالتئام</h2>\n<p>سوء التغذية والبروتين المنخفض · <strong>السكري غير المنضبط</strong> (أهم عامل قابل للتصحيح) · ضعف التروية والتدخين · الجفاف · الكورتيزون والعلاج الكيميائي · العدوى · <strong>الضغط المستمر</strong> (الحل هنا تمريضي: إعادة التموضع كل ساعتين، ومهما كانت التغذية مثالية لن تلتئم القرحة مع استمرار الضغط).</p>\n<p><strong>قاعدة عملية:</strong> إذا كانت القرحة لا تتحسن رغم عناية جيدة → <strong>راجع المدخول الفعلي من البروتين والطاقة أولًا</strong>، فهو السبب الخفي الأشيع.</p>\n<hr>", "text": "الجزء الثاني والعشرون: التغذية والتئام الجروح وقرح الفراش 22.1 مراحل الالتئام واحتياجاتها المرحلة ما يحدث مغذيات محورية الإرقاء والالتهاب (0–5 أيام) تخثر، هجرة خلايا مناعية طاقة كافية، فيتامين A، زنك، أوميجا 3 التكاثر (3–21 يومًا) تكوّن أوعية جديدة، بناء كولاجين، ظهارة بروتين، فيتامين C، حديد، نحاس، زنك إعادة التشكيل (21 يومًا – سنة) نضج الكولاجين وزيادة قوة الشد بروتين مستمر، زنك، ترطيب 22.2 الاحتياجات في الجروح وقرح الفراش المغذي التوصية الطاقة 30–35 kcal/كجم/يوم (وقد ترتفع مع الجروح الواسعة) البروتين 1.25–1.5 جم/كجم ، وحتى 1.5–2.0 في القرح من الدرجات المتقدمة أو تعدد الجروح السوائل 30–35 مل/كجم (الجرح المفرز يفقد سوائل وبروتينًا كثيرًا) فيتامين C ضروري لتصنيع الكولاجين (هيدروكسيلة البرولين واللايسين) — يُعوّض عند النقص؛ الجرعات العالية بلا نقص لا تفيد الزنك يُعوّض عند وجود نقص فقط، ولفترة محدودة (عادة أسبوعان)؛ الزائد المزمن يسبب نقص نحاس ويضر المناعة أرجينين + جلوتامين + HMB مكملات متخصصة أظهرت فائدة في قرح الفراش من الدرجة 3–4 — تُستخدم بقرار إكلينيكي لا روتينيًا فيتامين A مهم للظهارة؛ له دور خاص لدى مرضى الكورتيزون (يعاكس تثبيطه للالتئام) — بإشراف طبي 22.3 عوامل تعطّل الالتئام سوء التغذية والبروتين المنخفض · السكري غير المنضبط (أهم عامل قابل للتصحيح) · ضعف التروية والتدخين · الجفاف · الكورتيزون والعلاج الكيميائي · العدوى · الضغط المستمر (الحل هنا تمريضي: إعادة التموضع كل ساعتين، ومهما كانت التغذية مثالية لن تلتئم القرحة مع استمرار الضغط). قاعدة عملية: إذا كانت القرحة لا تتحسن رغم عناية جيدة → راجع المدخول الفعلي من البروتين والطاقة أولًا ، فهو السبب الخفي الأشيع."}, {"i": 23, "group": "guide", "tag": "صحة عامة", "num": "23", "short": "التغذية والصحة العامة", "html": "<h1>الجزء الثالث والعشرون: التغذية والصحة العامة</h1>\n<h2>23.1 العبء المزدوج لسوء التغذية</h2>\n<blockquote class=\"note\"><p>ظاهرة مميزة للمنطقة العربية ودول الدخل المتوسط: <strong>السمنة ونقص المغذيات الدقيقة يتعايشان — أحيانًا في البيت الواحد، بل في الشخص الواحد.</strong></p></blockquote>\n<p><strong>الأسباب:</strong> التحول الغذائي نحو أطعمة رخيصة عالية الطاقة فقيرة المغذيات، الحضرنة وقلة الحركة، الدعم الحكومي الموجّه للنشويات، ارتفاع سعر الخضار والفاكهة والبروتين، والتسويق المكثف للأطعمة فائقة التصنيع.</p>\n<p><strong>النتيجة الشائعة:</strong> طفل قصير القامة (تقزّم) وزائد الوزن في آن، أو أم مصابة بسمنة <strong>وفقر دم بنقص الحديد</strong> معًا. لذلك <strong>الوزن وحده لا يقيس التغذية</strong> — لا على مستوى الفرد ولا على مستوى السكان.</p>\n<h2>23.2 الأمن الغذائي — أربعة أركان</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الركن</th><th>المعنى</th></tr></thead><tbody><tr><td><strong>التوافر (Availability)</strong></td><td>وجود الغذاء فعليًا (إنتاج، استيراد)</td></tr><tr><td><strong>الوصول (Access)</strong></td><td>القدرة الاقتصادية والمادية على الحصول عليه</td></tr><tr><td><strong>الاستخدام (Utilization)</strong></td><td>جودة الغذاء وسلامته والقدرة على الاستفادة منه (صحة، مياه، معرفة)</td></tr><tr><td><strong>الاستقرار (Stability)</strong></td><td>الثبات عبر الزمن رغم الصدمات (حرب، جفاف، تضخم)</td></tr></tbody></table></div>\n<p><strong>التعامل الإكلينيكي مع انعدام الأمن الغذائي:</strong></p>\n<ul><li>اسأل بلطف وبلا وصم: \"هل حصل إن الأكل خلص في البيت قبل ما ييجي المرتب؟\"</li><li>عدّل الخطة للواقع: البقول والبيض ومعلبات السمك والخضار المجمدة والموسمية = بروتين ومغذيات باقتصاد.</li><li>اربط العميل بالموارد المتاحة (برامج دعم، مطابخ خيرية) بدل وصف خطة يستحيل تنفيذها.</li><li><strong>خطة لا يستطيع العميل شراءها ليست خطة</strong> — إنها إحراج مغلّف بلغة علمية.</li></ul>\n<h2>23.3 التدعيم الغذائي — أنجح تدخلات الصحة العامة</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>التدعيم</th><th>أثره</th></tr></thead><tbody><tr><td><strong>الملح باليود</strong></td><td>قضى على الجويتر المتوطن والقصور الذهني المرتبط بنقص اليود في مناطق واسعة</td></tr><tr><td><strong>الدقيق بالحديد وحمض الفوليك</strong></td><td>↓ فقر الدم و↓ عيوب الأنبوب العصبي بنسب كبيرة</td></tr><tr><td><strong>فيتامين D في الألبان</strong></td><td>↓ الكساح</td></tr><tr><td><strong>فيتامين A للأطفال</strong> (مكملات دورية)</td><td>↓ وفيات الأطفال والعمى في المناطق الموبوءة بالنقص</td></tr></tbody></table></div>\n<h2>23.4 السياسات الغذائية — ما تدعمه الأدلة</h2>\n<ul><li><strong>ضرائب المشروبات المحلاة:</strong> خفّضت الاستهلاك في عدة دول (الأثر يعتمد على حجم الضريبة والبدائل).</li><li><strong>الملصقات الأمامية التحذيرية</strong> (نموذج تشيلي والمكسيك): غيّرت اختيار المستهلك <strong>وأعادت تركيب المنتجات</strong> من قبل الشركات.</li><li><strong>تقييد تسويق الأطعمة غير الصحية للأطفال</strong> · <strong>تقليل الصوديوم والدهون المتحولة</strong> في الإمداد الغذائي (حظر الدهون المتحولة من أنجح تدخلات القرن).</li><li><strong>بيئة المدرسة</strong>: مقاصف وسياسات وتربية غذائية.</li></ul>\n<p><strong>مبدأ حاكم:</strong> التدخلات التي <strong>تغيّر البيئة</strong> أقوى وأعدل من التي تعتمد على قرار الفرد وحده — لأنها تعمل بلا حاجة إلى وعي مستمر أو دخل مرتفع.</p>\n<hr>", "text": "الجزء الثالث والعشرون: التغذية والصحة العامة 23.1 العبء المزدوج لسوء التغذية ظاهرة مميزة للمنطقة العربية ودول الدخل المتوسط: السمنة ونقص المغذيات الدقيقة يتعايشان — أحيانًا في البيت الواحد، بل في الشخص الواحد. الأسباب: التحول الغذائي نحو أطعمة رخيصة عالية الطاقة فقيرة المغذيات، الحضرنة وقلة الحركة، الدعم الحكومي الموجّه للنشويات، ارتفاع سعر الخضار والفاكهة والبروتين، والتسويق المكثف للأطعمة فائقة التصنيع. النتيجة الشائعة: طفل قصير القامة (تقزّم) وزائد الوزن في آن، أو أم مصابة بسمنة وفقر دم بنقص الحديد معًا. لذلك الوزن وحده لا يقيس التغذية — لا على مستوى الفرد ولا على مستوى السكان. 23.2 الأمن الغذائي — أربعة أركان الركن المعنى التوافر (Availability) وجود الغذاء فعليًا (إنتاج، استيراد) الوصول (Access) القدرة الاقتصادية والمادية على الحصول عليه الاستخدام (Utilization) جودة الغذاء وسلامته والقدرة على الاستفادة منه (صحة، مياه، معرفة) الاستقرار (Stability) الثبات عبر الزمن رغم الصدمات (حرب، جفاف، تضخم) التعامل الإكلينيكي مع انعدام الأمن الغذائي: اسأل بلطف وبلا وصم: \"هل حصل إن الأكل خلص في البيت قبل ما ييجي المرتب؟\" عدّل الخطة للواقع: البقول والبيض ومعلبات السمك والخضار المجمدة والموسمية = بروتين ومغذيات باقتصاد. اربط العميل بالموارد المتاحة (برامج دعم، مطابخ خيرية) بدل وصف خطة يستحيل تنفيذها. خطة لا يستطيع العميل شراءها ليست خطة — إنها إحراج مغلّف بلغة علمية. 23.3 التدعيم الغذائي — أنجح تدخلات الصحة العامة التدعيم أثره الملح باليود قضى على الجويتر المتوطن والقصور الذهني المرتبط بنقص اليود في مناطق واسعة الدقيق بالحديد وحمض الفوليك ↓ فقر الدم و↓ عيوب الأنبوب العصبي بنسب كبيرة فيتامين D في الألبان ↓ الكساح فيتامين A للأطفال (مكملات دورية) ↓ وفيات الأطفال والعمى في المناطق الموبوءة بالنقص 23.4 السياسات الغذائية — ما تدعمه الأدلة ضرائب المشروبات المحلاة: خفّضت الاستهلاك في عدة دول (الأثر يعتمد على حجم الضريبة والبدائل). الملصقات الأمامية التحذيرية (نموذج تشيلي والمكسيك): غيّرت اختيار المستهلك وأعادت تركيب المنتجات من قبل الشركات. تقييد تسويق الأطعمة غير الصحية للأطفال · تقليل الصوديوم والدهون المتحولة في الإمداد الغذائي (حظر الدهون المتحولة من أنجح تدخلات القرن). بيئة المدرسة : مقاصف وسياسات وتربية غذائية. مبدأ حاكم: التدخلات التي تغيّر البيئة أقوى وأعدل من التي تعتمد على قرار الفرد وحده — لأنها تعمل بلا حاجة إلى وعي مستمر أو دخل مرتفع."}, {"i": 24, "group": "guide", "tag": "صحة عامة", "num": "24", "short": "التغذية والصحة النفسية والمناعة", "html": "<h1>الجزء الرابع والعشرون: التغذية والصحة النفسية والمناعة</h1>\n<h2>24.1 محور الأمعاء–الدماغ</h2>\n<p>تواصل ثنائي الاتجاه عبر: <strong>العصب الحائر (Vagus)</strong>، النواقل العصبية (<strong>~90% من السيروتونين يُصنَّع في الأمعاء</strong> — رغم أن دوره هناك معوي أساسًا)، الأحماض الدهنية قصيرة السلسلة، والمحور الالتهابي والمناعي.</p>\n<p><strong>ما تدعمه الأدلة:</strong></p>\n<ul><li><strong>الأنماط الغذائية الكاملة (متوسطي) ترتبط بانخفاض معدلات الاكتئاب</strong>، والأنماط الغربية فائقة التصنيع بالعكس — وهناك تجارب تدخلية أولية (مثل تجربة SMILES) أظهرت تحسنًا في أعراض الاكتئاب بتحسين النظام الغذائي كعلاج مساند.</li><li><strong>نقص مغذيات مرتبط بأعراض نفسية:</strong> فيتامين D، B12 وفولات، حديد، ماغنسيوم، أوميجا-3، زنك — <strong>فحصها جزء من التقييم النفسي الجيد</strong>.</li><li><strong>تذبذب سكر الدم</strong> وتخطي الوجبات يفاقمان القلق والتهيّج لدى كثيرين.</li><li><strong>الكافيين الزائد</strong> يحاكي أعراض القلق ويفسد النوم؛ و<strong>الكحول</strong> مثبط ومفاقم للاكتئاب رغم الشعور اللحظي المعاكس.</li></ul>\n<p><strong>⚠️ حدود صريحة:</strong> الغذاء <strong>علاج مساند لا بديل</strong> عن العلاج النفسي أو الدوائي. الترويج لعلاج الاكتئاب بالنظام الغذائي وحده ضار وقد يؤخّر علاجًا منقذًا.</p>\n<h2>24.2 التغذية والمناعة</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المغذي</th><th>الدور المناعي</th></tr></thead><tbody><tr><td><strong>بروتين</strong></td><td>الأجسام المضادة والخلايا المناعية بروتينات — نقصه أسرع طريق لضعف المناعة</td></tr><tr><td><strong>فيتامين D</strong></td><td>تعديل مناعي؛ <strong>تصحيح النقص</strong> مفيد، والجرعات الضخمة بلا نقص ليست كذلك</td></tr><tr><td><strong>زنك</strong></td><td>نضج الخلايا التائية؛ نقصه شائع ومؤثر</td></tr><tr><td><strong>فيتامين C</strong></td><td>يدعم وظيفة العدلات؛ يقلل <strong>مدة</strong> نزلات البرد قليلًا ولا يمنعها</td></tr><tr><td><strong>حديد</strong></td><td>ضروري — لكن <strong>الزيادة تغذّي البكتيريا</strong> أيضًا؛ لا تكمّل بلا إثبات نقص</td></tr><tr><td><strong>سيلينيوم، فيتامين A، أوميجا-3</strong></td><td>أدوار تنظيمية والتهابية</td></tr><tr><td><strong>الألياف والميكروبيوم</strong></td><td>70% من النسيج المناعي حول الأمعاء (GALT)</td></tr></tbody></table></div>\n<p><strong>الحقيقة المزعجة للمسوّقين:</strong> لا يوجد مكمل \"يقوّي المناعة\" فوق المستوى الطبيعي. <strong>تصحيح النقص يعيد المناعة لطبيعتها — والزيادة فوق ذلك لا تعطي مناعة خارقة، وقد تضر.</strong> الأساسيات (نوم، تنوع غذائي، نشاط، تقليل التوتر، لقاحات) تتفوق على أي حبة.</p>\n<hr>", "text": "الجزء الرابع والعشرون: التغذية والصحة النفسية والمناعة 24.1 محور الأمعاء–الدماغ تواصل ثنائي الاتجاه عبر: العصب الحائر (Vagus) ، النواقل العصبية ( ~90% من السيروتونين يُصنَّع في الأمعاء — رغم أن دوره هناك معوي أساسًا)، الأحماض الدهنية قصيرة السلسلة، والمحور الالتهابي والمناعي. ما تدعمه الأدلة: الأنماط الغذائية الكاملة (متوسطي) ترتبط بانخفاض معدلات الاكتئاب ، والأنماط الغربية فائقة التصنيع بالعكس — وهناك تجارب تدخلية أولية (مثل تجربة SMILES) أظهرت تحسنًا في أعراض الاكتئاب بتحسين النظام الغذائي كعلاج مساند. نقص مغذيات مرتبط بأعراض نفسية: فيتامين D، B12 وفولات، حديد، ماغنسيوم، أوميجا 3، زنك — فحصها جزء من التقييم النفسي الجيد . تذبذب سكر الدم وتخطي الوجبات يفاقمان القلق والتهيّج لدى كثيرين. الكافيين الزائد يحاكي أعراض القلق ويفسد النوم؛ و الكحول مثبط ومفاقم للاكتئاب رغم الشعور اللحظي المعاكس. ⚠️ حدود صريحة: الغذاء علاج مساند لا بديل عن العلاج النفسي أو الدوائي. الترويج لعلاج الاكتئاب بالنظام الغذائي وحده ضار وقد يؤخّر علاجًا منقذًا. 24.2 التغذية والمناعة المغذي الدور المناعي بروتين الأجسام المضادة والخلايا المناعية بروتينات — نقصه أسرع طريق لضعف المناعة فيتامين D تعديل مناعي؛ تصحيح النقص مفيد، والجرعات الضخمة بلا نقص ليست كذلك زنك نضج الخلايا التائية؛ نقصه شائع ومؤثر فيتامين C يدعم وظيفة العدلات؛ يقلل مدة نزلات البرد قليلًا ولا يمنعها حديد ضروري — لكن الزيادة تغذّي البكتيريا أيضًا؛ لا تكمّل بلا إثبات نقص سيلينيوم، فيتامين A، أوميجا 3 أدوار تنظيمية والتهابية الألياف والميكروبيوم 70% من النسيج المناعي حول الأمعاء (GALT) الحقيقة المزعجة للمسوّقين: لا يوجد مكمل \"يقوّي المناعة\" فوق المستوى الطبيعي. تصحيح النقص يعيد المناعة لطبيعتها — والزيادة فوق ذلك لا تعطي مناعة خارقة، وقد تضر. الأساسيات (نوم، تنوع غذائي، نشاط، تقليل التوتر، لقاحات) تتفوق على أي حبة."}, {"i": 25, "group": "guide", "tag": "مخططات", "num": "25", "short": "مخططات بصرية", "html": "<h1>الجزء الخامس والعشرون: مخططات بصرية</h1>\n<blockquote class=\"note\"><p>المخططات التالية تُرسم تلقائيًا داخل هذا المرجع. إن لم تظهر مرسومة (اتصال محدود)، فستُعرض كنص بصيغة Mermaid يمكن لصقه في أي محرر يدعمها.</p></blockquote>\n<h2>25.1 مصير المغذيات الكبرى في الأيض</h2>\n<div class=\"mermaid\">graph TD\n    A[كربوهيدرات] --&gt; B[جلوكوز]\n    C[دهون] --&gt; D[أحماض دهنية + جليسرول]\n    E[بروتين] --&gt; F[أحماض أمينية]\n    B --&gt; G[تحلل الجلوكوز&lt;br/&gt;Glycolysis]\n    G --&gt; H[بيروفات]\n    H --&gt; I[أسيتيل كو-أ]\n    D --&gt; J[بيتا أكسدة] --&gt; I\n    F --&gt; K[نزع الأمين] --&gt; I\n    F --&gt; L[دورة اليوريا] --&gt; M[يوريا في البول]\n    I --&gt; N[دورة كريبس]\n    N --&gt; O[NADH / FADH2]\n    O --&gt; P[سلسلة نقل الإلكترون]\n    P --&gt; Q[ATP + ماء]\n    B --&gt; R[تخليق الجليكوجين&lt;br/&gt;كبد وعضلات]\n    I --&gt; S[أجسام كيتونية&lt;br/&gt;عند نقص الكربوهيدرات]</div>\n<h2>25.2 الحالة الممتلئة مقابل الصائمة</h2>\n<div class=\"mermaid\">graph LR\n    A[بعد الأكل&lt;br/&gt;Fed State] --&gt;|إنسولين ↑| B[تخزين الجليكوجين]\n    A --&gt;|إنسولين ↑| C[تخليق الدهون]\n    A --&gt;|إنسولين ↑| D[بناء البروتين]\n    E[صيام قصير&lt;br/&gt;4-16 ساعة] --&gt;|جلوكاجون ↑| F[تحلل الجليكوجين]\n    G[صيام ممتد&lt;br/&gt;أكثر من 24 ساعة] --&gt; H[تكوين جلوكوز جديد]\n    G --&gt; I[تحلل الدهون ↑]\n    I --&gt; J[أجسام كيتونية&lt;br/&gt;وقود للمخ]\n    G --&gt; K[هدم بروتين عضلي&lt;br/&gt;يقل تدريجيًا مع التكيف الكيتوني]</div>\n<h2>25.3 خوارزمية التعامل مع فقد وزن غير مقصود</h2>\n<div class=\"mermaid\">graph TD\n    A[فقد وزن غير مقصود] --&gt; B{أكثر من 5% في شهر&lt;br/&gt;أو 10% في 6 شهور؟}\n    B --&gt;|لا| C[متابعة دورية + تسجيل غذائي]\n    B --&gt;|نعم| D[علامة حمراء - تقييم شامل]\n    D --&gt; E{هل يوجد سبب طبي محتمل؟}\n    E --&gt;|نعم| F[إحالة طبية عاجلة&lt;br/&gt;ورم - عدوى - درقية - سوء امتصاص]\n    E --&gt;|غير واضح| G[تقييم ABCDEF كامل]\n    G --&gt; H{تشخيص GLIM:&lt;br/&gt;معيار ظاهري + سببي؟}\n    H --&gt;|نعم| I[سوء تغذية - حدد الشدة]\n    H --&gt;|لا| J[تدخل وقائي ومتابعة]\n    I --&gt; K{خطر إعادة تغذية؟}\n    K --&gt;|نعم| L[ابدأ 10-15 kcal/kg&lt;br/&gt;ثيامين قبل التغذية&lt;br/&gt;مراقبة الفوسفات يوميًا]\n    K --&gt;|لا| M[25-30 kcal/kg&lt;br/&gt;بروتين 1.2-1.5 g/kg]\n    L --&gt; N[تدرج خلال 4-7 أيام]\n    M --&gt; O[متابعة الوزن والمدخول والوظيفة]\n    N --&gt; O</div>\n<h2>25.4 عملية الرعاية التغذوية (NCP)</h2>\n<div class=\"mermaid\">graph LR\n    A[1. التقييم&lt;br/&gt;Assessment] --&gt p\"><div class=\"eyebrow\">نسخة تفاعلية</div><p>البطاقات الأربعون الواردة في هذا الجزء متاحة كبطاقات تفاعلية في تبويب <strong>أدوات</strong>: ترى السؤال أولًا وتحاول الاستدعاء قبل الكشف — وهذا هو جوهر التكرار المتباعد. الجدول الثابت أدناه يظل مرجعًا للطباعة.</p><button class=\"btn\" data-jump=\"tools\">افتح بطاقات المذاكرة</button></div>\n<h2>26.1 لماذا التكرار المتباعد؟</h2>\n<p>منحنى النسيان يقول إننا نفقد معظم ما نقرأه خلال أيام. والحل ليس إعادة القراءة (وهم الإتقان)، بل <strong>الاستدعاء النشط (Active recall)</strong> على فترات متباعدة.</p>\n<p><strong>الجدول:</strong> راجع بعد <strong>يوم 1 → يوم 3 → يوم 7 → يوم 16 → يوم 35 → يوم 90</strong>. كل مراجعة ناجحة تُبعد الموعد التالي؛ كل فشل يُعيدك للبداية.</p>\n<h2>26.2 بطاقات المفاهيم الأساسية (اصنعها بنفسك — 40 بطاقة نواة)</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الوجه الأمامي</th><th>الوجه الخلفي (تحقّق بعد المحاولة)</th></tr></thead><tbody><tr><td>معادلة Mifflin للرجال</td><td>(10×وزن)+(6.25×طول)−(5×عمر)+5</td></tr><tr><td>معاملات النشاط الخمسة</td><td>1.2 / 1.375 / 1.55 / 1.725 / 1.9</td></tr><tr><td>مكونات TDEE الأربعة</td><td>BMR · TEF · EAT · NEAT</td></tr><tr><td>قيم Atwater</td><td>4 / 4 / 9 / 7</td></tr><tr><td>نطاق AMDR</td><td>كربوهيدرات 45–65 · دهون 20–35 · بروتين 10–35</td></tr><tr><td>عتبة الليوسين</td><td>2.5–3 جم (≈25–30 جم بروتين)</td></tr><tr><td>كربوهيدرات أثناء جهد &gt;2.5 ساعة</td><td>حتى 90 جم/ساعة بمصادر متعددة النقل</td></tr><tr><td>جرعة الكرياتين الصيانية</td><td>3–5 جم يوميًا</td></tr><tr><td>جرعة الكافيين</td><td>3–6 مجم/كجم قبل 45–60 دقيقة</td></tr><tr><td>عتبة توافر الطاقة المنخفض</td><td>&lt;30 kcal/kg FFM</td></tr><tr><td>معادلة EA</td><td>(المدخول − طاقة التمرين) ÷ FFM</td></tr><tr><td>معادلة معدل التعرق</td><td>[(فرق الوزن) + المشروب − البول] ÷ الزمن</td></tr><tr><td>نسبة الإنسولين للكربوهيدرات</td><td>500 ÷ TDD</td></tr><tr><td>عامل الحساسية ISF</td><td>1800 ÷ TDD</td></tr><tr><td>قاعدة نقص السكر</td><td>15 جم كربوهيدرات → إعادة قياس بعد 15 دقيقة</td></tr><tr><td>بروتين CKD قبل الغسيل / بعده</td><td>0.55–0.8 / 1.0–1.2 جم/كجم</td></tr><tr><td>بروتين تليّف الكبد</td><td>1.2–1.5 جم/كجم</td></tr><tr><td>علامة متلازمة إعادة التغذية</td><td>انخفاض الفوسفات</td></tr><tr><td>بداية التغذية في خطر إعادة التغذية</td><td>10–15 kcal/كجم + ثيامين قبلها</td></tr><tr><td>القيمة الحرارية للدكستروز الوريدي</td><td>3.4 kcal/جم</td></tr><tr><td>حد أكسدة الدكستروز</td><td>4–5 مجم/كجم/دقيقة</td></tr><tr><td>حد المستحلب الدهني الوريدي</td><td><span class=\"ltr\">≤1</span> جم/كجم/يوم</td></tr><tr><td>متى نفطم عن PN</td><td>تغطية &gt;60% معويًا</td></tr><tr><td>مكونات ABCDEF</td><td>Anthro · Biochem · Clinical · Dietary · Environment · Function</td></tr><tr><td>عتبة فقد الوزن الخطرة</td><td>&gt;5% شهر · &gt;10% ستة شهور</td></tr><tr><td>معايير GLIM</td><td>ظاهري واحد + سببي واحد</td></tr><tr><td>لماذا الألبيومين مضلل</td><td>بروتين طور حاد سالب — ينخفض بالالتهاب</td></tr><tr><td>لماذا الفيريتين مضلل</td><td>بروتين طور حاد موجب — يرتفع بالالتهاب</td></tr><tr><td>مكونات PES</td><td>مشكلة + سبب + علامات</td></tr><tr><td>مهارات OARS</td><td>أسئلة مفتوحة · إثبات · انعكاس · تلخيص</td></tr><tr><td>مراحل TTM الخمس</td><td>ما قبل التفكير · التفكير · التحضير · الفعل · الاستمرار</td></tr><tr><td>MUAC لسوء التغذية الشديد</td><td>&lt;11.5 سم</td></tr><tr><td>Z-score للشدة</td><td>&lt;−2 معتدل · &lt;−3 شديد</td></tr><tr><td>فارق الماراسموس والكواشيوركور</td><td>الوذمة</td></tr><tr><td>فولات الحمل ومتى</td><td>400–600 ميكروجرام قبل الحمل بـ3 شهور</td></tr><tr><td>زيادة طاقة الحمل</td><td>0 / +340 / +450</td></tr><tr><td>ممنوعات قبل السنة</td><td>العسل · الملح · السكر · اللبن البقري كمشروب</td></tr><tr><td>بروتين كبار السن</td><td>1.0–1.5 جم/كجم</td></tr><tr><td>بروتين تحت GLP-1</td><td><span class=\"ltr\">≥1.2</span>–1.6 جم/كجم + مقاومة</td></tr><tr><td>بروتين قرح الفراش</td><td>1.25–2.0 جم/كجم</td></tr></tbody></table></div>\n<h2>26.3 برنامج 8 أسابيع (ساعة يوميًا)</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>القراءة الجديدة</th><th>الاستدعاء</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>الأجزاء 1–2</td><td>بطاقات الطاقة والماكروز</td><td>احسب TDEE لـ5 أشخاص</td></tr><tr><td>2</td><td>الجزء 3 (نصفه)</td><td>بطاقات السكري والكلى</td><td>حل حالتين</td></tr><tr><td>3</td><td>الجزء 3 (باقيه) + 14</td><td>بطاقات الدعم التغذوي</td><td>احسب وصفة معوية ووريدية</td></tr><tr><td>4</td><td>الجزء 4</td><td>بطاقات التقييم وGLIM</td><td>قيّم 3 حالات كاملة</td></tr><tr><td>5</td><td>الجزء 5 + 16</td><td>بطاقات الإرشاد</td><td>سجّل جلسة وحلّلها</td></tr><tr><td>6</td><td>الأجزاء 9–11</td><td>بطاقات مراحل الحياة</td><td>صمّم 3 خطط وجبات</td></tr><tr><td>7</td><td>الأجزاء 15 + 17 + 18</td><td>بطاقات الفسيولوجيا</td><td>لخّص 5 دراسات محورية</td></tr><tr><td>8</td><td>مراجعة شاملة</td><td>كل البطاقات</td><td><strong>امتحانات الجزء 28</strong></td></tr></tbody></table></div>\n<p><strong>قاعدة ذهبية للمذاكرة:</strong> بعد كل جلسة قراءة، أغلق الدليل واكتب من ذاكرتك <strong>ثلاث نقاط ومثالًا تطبيقيًا واحدًا</strong>. ما لا تستطيع استرجاعه لم تتعلمه بعد.</p>\n<hr>", "text": "الجزء السادس والعشرون: خطة المذاكرة بالتكرار المتباعد 26.1 لماذا التكرار المتباعد؟ منحنى النسيان يقول إننا نفقد معظم ما نقرأه خلال أيام. والحل ليس إعادة القراءة (وهم الإتقان)، بل الاستدعاء النشط (Active recall) على فترات متباعدة. الجدول: راجع بعد يوم 1 → يوم 3 → يوم 7 → يوم 16 → يوم 35 → يوم 90 . كل مراجعة ناجحة تُبعد الموعد التالي؛ كل فشل يُعيدك للبداية. 26.2 بطاقات المفاهيم الأساسية (اصنعها بنفسك — 40 بطاقة نواة) الوجه الأمامي الوجه الخلفي (تحقّق بعد المحاولة) معادلة Mifflin للرجال (10×وزن)+(6.25×طول)−(5×عمر)+5 معاملات النشاط الخمسة 1.2 / 1.375 / 1.55 / 1.725 / 1.9 مكونات TDEE الأربعة BMR · TEF · EAT · NEAT قيم Atwater 4 / 4 / 9 / 7 نطاق AMDR كربوهيدرات 45–65 · دهون 20–35 · بروتين 10–35 عتبة الليوسين 2.5–3 جم (≈25–30 جم بروتين) كربوهيدرات أثناء جهد 2.5 ساعة حتى 90 جم/ساعة بمصادر متعددة النقل جرعة الكرياتين الصيانية 3–5 جم يوميًا جرعة الكافيين 3–6 مجم/كجم قبل 45–60 دقيقة عتبة توافر الطاقة المنخفض <30 kcal/kg FFM معادلة EA (المدخول − طاقة التمرين) ÷ FFM معادلة معدل التعرق [(فرق الوزن) + المشروب − البول] ÷ الزمن نسبة الإنسولين للكربوهيدرات 500 ÷ TDD عامل الحساسية ISF 1800 ÷ TDD قاعدة نقص السكر 15 جم كربوهيدرات → إعادة قياس بعد 15 دقيقة بروتين CKD قبل الغسيل / بعده 0.55–0.8 / 1.0–1.2 جم/كجم بروتين تليّف الكبد 1.2–1.5 جم/كجم علامة متلازمة إعادة التغذية انخفاض الفوسفات بداية التغذية في خطر إعادة التغذية 10–15 kcal/كجم + ثيامين قبلها القيمة الحرارية للدكستروز الوريدي 3.4 kcal/جم حد أكسدة الدكستروز 4–5 مجم/كجم/دقيقة حد المستحلب الدهني الوريدي ≤1 جم/كجم/يوم متى نفطم عن PN تغطية 60% معويًا مكونات ABCDEF Anthro · Biochem · Clinical · Dietary · Environment · Function عتبة فقد الوزن الخطرة 5% شهر · 10% ستة شهور معايير GLIM ظاهري واحد + سببي واحد لماذا الألبيومين مضلل بروتين طور حاد سالب — ينخفض بالالتهاب لماذا الفيريتين مضلل بروتين طور حاد موجب — يرتفع بالالتهاب مكونات PES مشكلة + سبب + علامات مهارات OARS أسئلة مفتوحة · إثبات · انعكاس · تلخيص مراحل TTM الخمس ما قبل التفكير · التفكير · التحضير · الفعل · الاستمرار MUAC لسوء التغذية الشديد <11.5 سم Z score للشدة <−2 معتدل · <−3 شديد فارق الماراسموس والكواشيوركور الوذمة فولات الحمل ومتى 400–600 ميكروجرام قبل الحمل بـ3 شهور زيادة طاقة الحمل 0 / +340 / +450 ممنوعات قبل السنة العسل · الملح · السكر · اللبن البقري كمشروب بروتين كبار السن 1.0–1.5 جم/كجم بروتين تحت GLP 1 ≥1.2–1.6 جم/كجم + مقاومة بروتين قرح الفراش 1.25–2.0 جم/كجم 26.3 برنامج 8 أسابيع (ساعة يوميًا) الأسبوع القراءة الجديدة الاستدعاء التطبيق 1 الأجزاء 1–2 بطاقات الطاقة والماكروز احسب TDEE لـ5 أشخاص 2 الجزء 3 (نصفه) بطاقات السكري والكلى حل حالتين 3 الجزء 3 (باقيه) + 14 بطاقات الدعم التغذوي احسب وصفة معوية ووريدية 4 الجزء 4 بطاقات التقييم وGLIM قيّم 3 حالات كاملة 5 الجزء 5 + 16 بطاقات الإرشاد سجّل جلسة وحلّلها 6 الأجزاء 9–11 بطاقات مراحل الحياة صمّم 3 خطط وجبات 7 الأجزاء 15 + 17 + 18 بطاقات الفسيولوجيا لخّص 5 دراسات محورية 8 مراجعة شاملة كل البطاقات امتحانات الجزء 28 قاعدة ذهبية للمذاكرة: بعد كل جلسة قراءة، أغلق الدليل واكتب من ذاكرتك ثلاث نقاط ومثالًا تطبيقيًا واحدًا . ما لا تستطيع استرجاعه لم تتعلمه بعد."}, {"i": 27,
