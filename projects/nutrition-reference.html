بالجلوكوز، فأصبح مشوّشًا ومرتبك الحركة خلال ساعات.</p>\n<p><strong>الاشتقاق:</strong> الكحول يقلل امتصاص الثيامين وتخزينه ← مخزون منخفض أصلًا ← الجلوكوز الوريدي يتطلب ثيامين لدخول دورة كريبس ← ما تبقى من الثيامين يُستهلك ← الخلايا العصبية تفقد مصدر طاقتها ← اعتلال فيرنيكه الدماغي.</p>\n<p><strong>الاستنتاج العملي:</strong> الثيامين <strong>قبل</strong> الجلوكوز في كل مريض مستنزف أو مدمن كحول. لم تحفظ هذه القاعدة؛ اشتققتها.</p></blockquote>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>النظر إلى المخططات دون رسمها.</strong> المسار الذي تتابعه بعينيك تنساه خلال يوم؛ الذي ترسمه بيدك يبقى.</li><li><strong>البدء به كأول كتاب.</strong> بلا أساس سابق ستغرق في التفاصيل.</li><li><strong>حفظ أسماء الإنزيمات كقائمة.</strong> المهم: أين ينظَّم المسار؟ وما الذي يوقفه؟ وما الذي يحدث حين يتعطل؟</li><li><strong>إهمال فصل تكامل الأيض.</strong> هو الفصل الذي يربط كل شيء، ومن دونه تبقى المسارات جزرًا منفصلة.</li><li><strong>قراءة فصول المغذيات الدقيقة خطيًا.</strong> الأفضل الرجوع إليها عند الحاجة، بعد إتقان المغذيات الكبرى.</li></ul>\n<h2>كيف تذاكره: خطة عشرة أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>الخلية والنقل والهضم</td><td>ارسم أين يُمتص كل مغذٍّ كبير ودقيق</td></tr><tr><td>2–3</td><td>الكربوهيدرات بالكامل</td><td>ارسم التحلل وكريبس وتكوين الجلوكوز من الذاكرة</td></tr><tr><td>4</td><td>الألياف والدهون (الهضم والنقل)</td><td>ارسم رحلة الدهون من الطبق إلى الخلية الدهنية</td></tr><tr><td>5</td><td>أكسدة وتخليق الدهون والكيتونات</td><td>قارن الحالة الممتلئة بالصائمة في جدول</td></tr><tr><td>6</td><td>البروتين ودورة اليوريا</td><td>اشرح لماذا يرتفع الأمونيا في فشل الكبد</td></tr><tr><td>7</td><td>تكامل الأيض</td><td>اكتب ما يحدث في الكبد والعضل والمخ في كل حالة من الأربع</td></tr><tr><td>8</td><td>الفيتامينات الذائبة في الماء</td><td>لكل فيتامين: التفاعل ← النقص المشتق</td></tr><tr><td>9</td><td>الفيتامينات الذائبة في الدهون</td><td>ركّز على D و K وتفاعلاتهما الدوائية</td></tr><tr><td>10</td><td>المعادن</td><td>ركّز على الحديد والزنك والنحاس وتنظيمها</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> عمق علمي لا يقدمه أي كتاب تمهيدي، ومنهج موحد لكل مغذٍّ يسهّل المقارنة، وربط مستمر بين الآلية والأثر الصحي.</p>\n<p><strong>الضعف:</strong> كثافة عالية قد تُحبط القارئ غير المستعد، وتطبيق إكلينيكي محدود مقارنة بكتب الممارسة، وحاجة لخلفية في الكيمياء الحيوية.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>لماذا يرتفع اللاكتات في نقص الثيامين، ولماذا يُعطى الثيامين قبل الجلوكوز لا بعده؟</li><li>ارسم من الذاكرة ما يحدث للفوسفات في الدم عند إطعام مريض جائع، واشرح كل خطوة.</li><li>لماذا لا يفيد مكمل الحديد الفموي كثيرًا في مريض التهاب مفاصل روماتويدي نشط؟</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Krause</strong> لتطبيق هذا الفهم على المرضى · <strong>McArdle</strong> لتطبيقه على الجسم أثناء الجهد · <strong>Present Knowledge in Nutrition</strong> لمتابعة أحدث ما وصل إليه العلم في كل مغذٍّ.</p>", "text": "Advanced Nutrition and Human Metabolism المؤلفون Sareen S. Gropper و Jack L. Smith، وانضم إليهما Timothy P. Carr في الطبعات الحديثة المستوى متقدم — دراسات عليا الجمهور طلاب البكالوريوس المتقدمون والماجستير، الباحثون، من يريد فهم \"لماذا\" الطابع كتاب كيمياء حيوية تغذوية وأيض ما يسبقه Understanding Nutrition أو أي مقرر أساسيات ما يليه Krause للتطبيق الإكلينيكي، و McArdle للتطبيق الرياضي ما الذي يفعله هذا الكتاب ولا يفعله غيره؟ معظم كتب التغذية تقول لك ماذا : نقص الثيامين يسبب اعتلالًا عصبيًا، ونقص فيتامين C يسبب نزيف اللثة. هذا الكتاب يقول لك لماذا — وبعد أن تفهم \"لماذا\"، لن تحتاج إلى حفظ \"ماذا\". خذ الثيامين مثالًا. هو إنزيم مساعد لبيروفات ديهيدروجينيز، البوابة التي يعبر منها ناتج تحلل الجلوكوز إلى دورة كريبس. حين ينقص، يتوقف البيروفات عند البوابة ويتحول إلى لاكتات، وتجوع الخلايا الأكثر اعتمادًا على الجلوكوز — وهي الخلايا العصبية. هكذا يصبح الاعتلال العصبي نتيجة منطقية لا معلومة محفوظة. وبالمنطق نفسه تفهم لماذا يُعطى الثيامين قبل إعادة تغذية المريض المستنزف: لأن تدفق الجلوكوز المفاجئ يستهلك ما تبقى منه. هذه الطريقة في التفكير — اشتقاق النتيجة من الآلية — هي ما يمنحه الكتاب، وهي ما يميز المتخصص الحقيقي. خريطة الكتاب الأساس الخلوي والهضمي يبدأ بالخلية: الأغشية وأنظمة النقل (انتشار بسيط، مُيسَّر، نقل نشط)، العضيات، وأين يحدث كل مسار. ثم الجهاز الهضمي بالتفصيل: الإنزيمات، الهرمونات المعوية، آليات الامتصاص لكل مغذٍّ، والدورة الكبدية المعوية. الكربوهيدرات البنية والتصنيف، الهضم والامتصاص (ناقلات SGLT1 و GLUT5 و GLUT2). تحلل الجلوكوز (Glycolysis): خطواته، نقاط تنظيمه، ناتجه الصافي. دورة كريبس والفوسفتة التأكسدية: كيف يتحول الأسيتيل كو أ إلى طاقة. مسار البنتوز فوسفات: مصدر NADPH للتخليق والدفاع المضاد للأكسدة. تكوين الجلوكوز وتخليق الجليكوجين وتحلله. التنظيم الهرموني: الإنسولين مقابل الجلوكاجون والكورتيزول والأدرينالين. الألياف تصنيفها، خصائصها الفيزيائية (اللزوجة، القابلية للتخمر)، وآثارها على الامتصاص والميكروبيوم والدهون. الدهون الهضم بالأملاح الصفراوية والليباز، وتكوين المذيلات (Micelles). النقل: الكيلوميكرونات، VLDL، LDL، HDL — ومن يحمل ماذا إلى أين. بيتا أكسدة ودور الكارنيتين في إدخال الأحماض الدهنية الطويلة إلى الميتوكوندريا. تخليق الأحماض الدهنية في الحالة الممتلئة. الأجسام الكيتونية: متى تتكون ومن يستخدمها. الكوليسترول وتخليقه وتنظيمه، والأيكوسانويدات المشتقة من أوميجا 3 وأوميجا 6. البروتين والأحماض الأمينية الهضم والامتصاص، دوران البروتين (Protein turnover) . نقل الأمين ونزعه ، و دورة اليوريا في الكبد. الأحماض الأمينية الجلوكوزية والكيتونية، ومصير الهيكل الكربوني لكل منها. الأحماض الأمينية كسلائف: الهيم، النواقل العصبية، الكرياتين، الكارنيتين. تقييم جودة البروتين وحالته في الجسم. تكامل الأيض وتوازن الطاقة الفصل الذي يجمع كل ما سبق: كيف تتعاون الأعضاء (الكبد، العضل، الدهون، المخ) في الحالات المختلفة، وكيف يُنظَّم توازن الطاقة. الفيتامينات كل فيتامين بنفس القالب: المصادر، الهضم والامتصاص، النقل، الوظيفة على المستوى الإنزيمي، التفاعلات مع مغذيات أخرى، الإخراج، المرجعيات الغذائية، النقص والسمية، تقييم الحالة. المعادن الكبرى والعناصر النزرة الكالسيوم والفوسفور والماغنسيوم، ثم الحديد والزنك والنحاس واليود والسيلينيوم والمنجنيز والكروم والموليبدنوم وغيرها — بنفس القالب، مع اهتمام خاص بآليات تنظيم الامتصاص. الماء والإلكتروليتات والتطبيقات توازن السوائل والصوديوم والبوتاسيوم والكلور، ثم فصول تطبيقية عن النشاط البدني ومراحل الحياة. المفاهيم المحورية بالتفصيل 1. الحالات الأيضية الأربع هذا أهم إطار في الكتاب، لأنه يفسّر الرجيم والصيام والسكري وإعادة التغذية دفعة واحدة. الحالة التوقيت التقريبي الهرمون السائد ما يحدث ممتلئة (Fed) 0–4 ساعات بعد الأكل الإنسولين تخزين: جليكوجين، دهون، بناء بروتين ما بعد الامتصاص 4–16 ساعة الجلوكاجون يبدأ تحلل الجليكوجين الكبدي لإبقاء السكر صيام قصير 16–48 ساعة الجلوكاجون والكورتيزول تكوين جلوكوز جديد، تحلل دهون متزايد جوع مطوّل أكثر من بضعة أيام — المخ يتحول للكيتونات، تباطؤ الأيض، حفظ البروتين الدرس الإكلينيكي: المريض الذي لم يأكل أسبوعًا يعيش في الحالة الرابعة. إعطاؤه كربوهيدرات كثيرة فجأة يقلبه إلى الحالة الأولى بعنف: يرتفع الإنسولين، فتُسحب الفوسفات والبوتاسيوم والماغنسيوم إلى داخل الخلايا لبناء الجليكوجين والبروتين، فينهار مستواها في الدم. هذه هي متلازمة إعادة التغذية — مشتقة بالكامل من فهم الحالات الأيضية. 2. لماذا لا تتحول الدهون إلى جلوكوز؟ لأن الأحماض الدهنية تتكسر إلى أسيتيل كو أ، وتفاعل تحويل البيروفات إلى أسيتيل كو أ غير عكوس . لا يوجد طريق صافٍ للعودة. الاستثناء هو الجليسرول (العمود الفقري للدهون الثلاثية) والأحماض الدهنية فردية الكربون. النتيجة العملية: في الصيام الطويل، يحتاج المخ جلوكوزًا لا تستطيع الدهون توفيره، فيُهدم البروتين العضلي لتوفير أحماض أمينية جلوكوزية — إلى أن يتكيف المخ مع الكيتونات فيقل الهدم. لهذا يحتاج المريض المستنزف بروتينًا كافيًا، ولهذا يحمي الحد الأدنى من الكربوهيدرات العضلات. 3. الفيتامين = إنزيم مساعد في تفاعل محدد الفيتامين الشكل النشط التفاعل النقص المشتق منطقيًا B1 ثيامين TPP بيروفات ديهيدروجينيز، ترانسكيتولاز تعطّل أيض الجلوكوز ← أعراض عصبية وقلبية B2 ريبوفلافين FAD, FMN نقل الإلكترونات التهاب الأغشية المخاطية (الفم واللسان) B3 نياسين NAD, NADP الأكسدة والاختزال الأنسجة سريعة الدوران: جلد، أمعاء، مخ B6 PLP نقل الأمين، تخليق الهيم والنواقل فقر دم، أعراض عصبية فولات THF نقل وحدة الكربون الواحدة ← DNA خلايا لا تنقسم: فقر دم ضخم الأرومات B12 ميثيل وأدينوسيل كوبالامين ميثيونين سينثيز، ميثيل مالونيل كو أ ميوتاز فقر دم ضخم + تلف الميالين C — هيدروكسلة البرولين والليسين كولاجين ضعيف: نزيف، جروح لا تلتئم K — كربوكسلة جاما عوامل تخثر غير فعالة: نزيف لماذا يسبب B12 أعراضًا عصبية والفولات لا؟ لأن B12 يعمل في تفاعل ثانٍ (ميثيل مالونيل كو أ ميوتاز) ضروري لتكوين الميالين، والفولات لا يدخل فيه. لهذا إعطاء الفولات لمريض نقص B12 يصحح فقر الدم ويُخفي التشخيص بينما يستمر التلف العصبي — خطأ خطير يمنعه فهم الآلية. 4. تنظيم امتصاص الحديد مثال الكتاب الأوضح على أن \"الأكل\" ليس \"الامتصاص\" : الحديد يُمتص في الاثناعشر ويخرج من الخلية المعوية إلى الدم عبر الفيروبورتين . الكبد يفرز الهيبسيدين حين يكون مخزون الحديد كافيًا — أو حين يوجد التهاب. الهيبسيدين يُغلق الفيروبورتين، فيُحتجز الحديد داخل الخلايا المعوية ويُفقد معها حين تتجدد. النتيجة: في الالتهاب المزمن يرتفع الهيبسيدين، فلا يُمتص الحديد الغذائي ولا يخرج المخزون — فينشأ فقر دم الأمراض المزمنة بفيريتين مرتفع . إعطاء حديد فموي هنا لن يفيد كثيرًا، والعلاج هو السيطرة على الالتهاب. وهذا أيضًا سبب أن مكمل الحديد يومًا بعد يوم قد يُمتص أفضل من الجرعة اليومية: كل جرعة ترفع الهيبسيدين لساعات. 5. التفاعلات بين المغذيات الزنك والنحاس: الزنك الزائد يحفّز بروتين الميتالوثيونين الذي يحتجز النحاس ← نقص نحاس قد يسبب فقر دم واعتلالًا عصبيًا. فيتامين D والكالسيوم والفوسفور: الشكل النشط من D يرفع امتصاص الاثنين. فيتامين C والحديد: يختزل الحديد الثلاثي إلى ثنائي القابل للامتصاص. الفولات و B12: متشابكان في دورة الميثيل. أرقام وحقائق يجب أن تخرج بها الموضوع الحقيقة الناتج الصافي لتحلل الجلوكوز 2 ATP لكل جزيء جلوكوز الناتج الكلي للأكسدة الكاملة للجلوكوز نحو 30–32 ATP احتياج المخ من الجلوكوز نحو 120 جم يوميًا قبل التكيف الكيتوني مخزون الجليكوجين الكبدي ينفد خلال 12–24 ساعة صيام تقريبًا الماء المحتجز مع الجليكوجين نحو 3 جم لكل 1 جم الأحماض الأمينية الكيتوجينية الصرفة الليوسين والليسين موقع امتصاص B12 اللفائفي النهائي بعد ارتباطه بالعامل الداخلي الشكل النشط من فيتامين D 1,25 ثنائي هيدروكسي، يتكوّن في الكلى تحويل التريبتوفان إلى نياسين نحو 60 مجم تريبتوفان = 1 مجم نياسين مثال تطبيقي بأسلوب الكتاب مثال — اشتقاق لا حفظ: مريض مدمن كحول، نحيف، أُدخل المستشفى وبدأوا له محلولًا وريديًا بالجلوكوز، فأصبح مشوّشًا ومرتبك الحركة خلال ساعات. الاشتقاق: الكحول يقلل امتصاص الثيامين وتخزينه ← مخزون منخفض أصلًا ← الجلوكوز الوريدي يتطلب ثيامين لدخول دورة كريبس ← ما تبقى من الثيامين يُستهلك ← الخلايا العصبية تفقد مصدر طاقتها ← اعتلال فيرنيكه الدماغي. الاستنتاج العملي: الثيامين قبل الجلوكوز في كل مريض مستنزف أو مدمن كحول. لم تحفظ هذه القاعدة؛ اشتققتها. أخطاء شائعة عند قراءة الكتاب النظر إلى المخططات دون رسمها. المسار الذي تتابعه بعينيك تنساه خلال يوم؛ الذي ترسمه بيدك يبقى. البدء به كأول كتاب. بلا أساس سابق ستغرق في التفاصيل. حفظ أسماء الإنزيمات كقائمة. المهم: أين ينظَّم المسار؟ وما الذي يوقفه؟ وما الذي يحدث حين يتعطل؟ إهمال فصل تكامل الأيض. هو الفصل الذي يربط كل شيء، ومن دونه تبقى المسارات جزرًا منفصلة. قراءة فصول المغذيات الدقيقة خطيًا. الأفضل الرجوع إليها عند الحاجة، بعد إتقان المغذيات الكبرى. كيف تذاكره: خطة عشرة أسابيع الأسبوع المحتوى التطبيق 1 الخلية والنقل والهضم ارسم أين يُمتص كل مغذٍّ كبير ودقيق 2–3 الكربوهيدرات بالكامل ارسم التحلل وكريبس وتكوين الجلوكوز من الذاكرة 4 الألياف والدهون (الهضم والنقل) ارسم رحلة الدهون من الطبق إلى الخلية الدهنية 5 أكسدة وتخليق الدهون والكيتونات قارن الحالة الممتلئة بالصائمة في جدول 6 البروتين ودورة اليوريا اشرح لماذا يرتفع الأمونيا في فشل الكبد 7 تكامل الأيض اكتب ما يحدث في الكبد والعضل والمخ في كل حالة من الأربع 8 الفيتامينات الذائبة في الماء لكل فيتامين: التفاعل ← النقص المشتق 9 الفيتامينات الذائبة في الدهون ركّز على D و K وتفاعلاتهما الدوائية 10 المعادن ركّز على الحديد والزنك والنحاس وتنظيمها نقاط القوة والضعف القوة: عمق علمي لا يقدمه أي كتاب تمهيدي، ومنهج موحد لكل مغذٍّ يسهّل المقارنة، وربط مستمر بين الآلية والأثر الصحي. الضعف: كثافة عالية قد تُحبط القارئ غير المستعد، وتطبيق إكلينيكي محدود مقارنة بكتب الممارسة، وحاجة لخلفية في الكيمياء الحيوية. أسئلة للتأمل بعد القراءة 1. لماذا يرتفع اللاكتات في نقص الثيامين، ولماذا يُعطى الثيامين قبل الجلوكوز لا بعده؟ 2. ارسم من الذاكرة ما يحدث للفوسفات في الدم عند إطعام مريض جائع، واشرح كل خطوة. 3. لماذا لا يفيد مكمل الحديد الفموي كثيرًا في مريض التهاب مفاصل روماتويدي نشط؟ ماذا تقرأ بعده؟ Krause لتطبيق هذا الفهم على المرضى · McArdle لتطبيقه على الجسم أثناء الجهد · Present Knowledge in Nutrition لمتابعة أحدث ما وصل إليه العلم في كل مغذٍّ."}, {"i": 33, "group": "books", "tag": "مكتبة المراجع", "num": "3", "short": "Burke — الرياضي", "html": "<h1>Clinical Sports Nutrition</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المحرران</strong></td><td>Louise Burke و Vicki Deakin، بمشاركة نخبة من باحثي التغذية الرياضية</td></tr><tr><td><strong>المستوى</strong></td><td>متقدم</td></tr><tr><td><strong>الجمهور</strong></td><td>أخصائيو التغذية الرياضية، طلاب الدراسات العليا، العاملون مع فرق ونخبة</td></tr><tr><td><strong>الطابع</strong></td><td>مرجع منهجي قائم على الأدلة، يمزج العلم بالتطبيق الميداني</td></tr><tr><td><strong>الرفيق</strong></td><td>Practical Sports Nutrition لنفس المؤلفة الأولى، ومواقف ISSN والأكاديمية/ACSM</td></tr><tr><td><strong>ما يسبقه</strong></td><td>McArdle لأساس فسيولوجيا الجهد</td></tr></tbody></table></div>\n<h2>روح الكتاب</h2>\n<p>يبدأ معظم الناس التغذية الرياضية بسؤال خاطئ: \"ما النظام الغذائي الأفضل للرياضيين؟\". هذا الكتاب يرفض السؤال من أساسه. لا يوجد نظام واحد لرياضي واحد، فضلًا عن كل الرياضيين. السؤال الصحيح: <strong>ماذا يحتاج هذا الرياضي، في هذه المرحلة من موسمه، لهذه الجلسة تحديدًا، ولهذا الهدف؟</strong></p>\n<p>الكتاب صادر عن مدرسة المعهد الأسترالي للرياضة (AIS)، التي طورت كثيرًا من المفاهيم الحديثة في المجال، ويتسم بأمانة علمية نادرة في مجال تجاري: حين يكون الدليل ضعيفًا، يقولها صراحة — حتى لو كان المكمل أو الحمية رائجًا.</p>\n<h2>خريطة الكتاب</h2>\n<h3>الأساس المنهجي</h3>\n<ul><li><strong>تقييم الرياضي:</strong> التاريخ الغذائي والتدريبي، الأدوات المناسبة للرياضيين، وتحيزات التبليغ لديهم (خصوصًا في الرياضات الجمالية ورياضات الأوزان).</li><li><strong>تركيب الجسم:</strong> حدود كل طريقة (ثنايا الجلد، DEXA، BIA)، ولماذا يُفضَّل <strong>تتبع مجموع ثنايا الجلد</strong> على تحويله لنسبة دهون، ومخاطر التركيز المهووس على الأرقام.</li><li><strong>احتياجات الطاقة:</strong> صعوبة قياس إنفاق الرياضي، ومفهوم <strong>توافر الطاقة</strong> كبديل أكثر فائدة من \"توازن الطاقة\".</li></ul>\n<h3>المغذيات والوقود</h3>\n<ul><li><strong>الكربوهيدرات:</strong> التوصيات اليومية حسب الحمل، الأكل قبل الجهد وأثناءه وبعده، التحميل، والاستراتيجيات المتقدمة (التدريب بجليكوجين منخفض).</li><li><strong>البروتين:</strong> الكمية والتوزيع والتوقيت والنوع، والبروتين في فترات التعافي من الإصابة.</li><li><strong>الدهون:</strong> الحد الأدنى، والجدل حول الحميات عالية الدهون للتحمل.</li><li><strong>السوائل والإلكتروليتات:</strong> حساب معدل التعرق، الترطيب الفردي، نقص صوديوم الدم.</li><li><strong>المغذيات الدقيقة:</strong> الحديد (فصل مفصّل لأهميته عند الرياضيات ورياضيي التحمل)، الكالسيوم وفيتامين D وصحة العظام.</li></ul>\n<h3>صحة الرياضي</h3>\n<ul><li><strong>توافر الطاقة المنخفض و RED-S:</strong> من أهم فصول الكتاب، يتجاوز \"ثالوث الرياضيات\" القديم.</li><li><strong>اضطرابات الأكل في الرياضة:</strong> عوامل الخطر الخاصة بالرياضيين، التعرف، الإحالة، والتعاون مع الفريق.</li><li><strong>المناعة والجهاز الهضمي:</strong> تأثير الحمل التدريبي، واضطرابات المعدة والأمعاء أثناء الجهد.</li></ul>\n<h3>المكملات ومساعدات الأداء</h3>\n<p>إطار لتقييم أي مكمل (الدليل، السلامة، القانونية، الفائدة للرياضي بعينه)، ثم مراجعة المكملات ذات الدليل القوي، ومناقشة مخاطر التلوث والمنشطات.</p>\n<h3>التطبيق حسب نوع الرياضة</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الفئة</th><th>المحور التغذوي الرئيسي</th></tr></thead><tbody><tr><td>رياضات التحمل</td><td>الوقود أثناء الجهد، التحميل، تدريب الأمعاء، الحديد</td></tr><tr><td>الرياضات الجماعية</td><td>الوقود المتقطع، التعافي بين المباريات المتقاربة</td></tr><tr><td>رياضات القوة والقدرة</td><td>البروتين والتوزيع، الكرياتين، تركيب الجسم</td></tr><tr><td>رياضات الأوزان</td><td>قطع الوزن الآمن، إعادة التغذية بعد الوزن</td></tr><tr><td>الرياضات الجمالية</td><td>توافر الطاقة، اضطرابات الأكل، صحة العظام</td></tr><tr><td>رياضات المضرب</td><td>الترطيب في المباريات الطويلة والحرارة</td></tr><tr><td>الترياثلون والفعاليات المتعددة</td><td>التكامل بين أكثر من نظام طاقة</td></tr></tbody></table></div>\n<h3>فئات خاصة</h3>\n<p>الرياضي المراهق، الرياضي النباتي، الرياضي المسافر، الرياضي ذو الإعاقة، والرياضي في البيئات القاسية (حرارة، ارتفاع).</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. التغذية الدورية (Periodized Nutrition)</h3>\n<p>التدريب يُخطَّط في دورات (تحضيري، تنافسي، انتقالي)، وتختلف كل جلسة في هدفها. فلماذا تبقى التغذية ثابتة؟ يقترح الكتاب أن تتبع الخطة الغذائية الحمل التدريبي:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>اليوم/الجلسة</th><th>الكربوهيدرات</th><th>المنطق</th></tr></thead><tbody><tr><td>يوم راحة أو مهاري خفيف</td><td>3–5 جم/كجم</td><td>لا داعي لملء المخازن</td></tr><tr><td>جلسة تحمل متوسطة</td><td>5–7 جم/كجم</td><td>دعم الجهد والتعافي</td></tr><tr><td>يوم عالي الشدة أو مزدوج</td><td>6–10 جم/كجم</td><td>الأداء يعتمد على الجليكوجين</td></tr><tr><td>ما قبل سباق طويل</td><td>10–12 جم/كجم لمدة 36–48 ساعة</td><td>تحميل</td></tr></tbody></table></div>\n<p>الفكرة الأعمق: <strong>\"الوقود حسب العمل\" (Fuel for the work required)</strong> — كمية الكربوهيدرات تُطابَق مع ما تتطلبه الجلسة، لا تُثبَّت يوميًا.</p>\n<h3>2. توافر الطاقة بدل توازن الطاقة</h3>\n<p>توازن الطاقة يقارن المدخول بالإنفاق الكلي. لكن الرياضي قد يكون \"متوازنًا\" ظاهريًا بينما جسمه في عجز، لأن الجسم يقلل الإنفاق في الوظائف الأخرى (التكاثر، العظام، المناعة) ليوفّر الطاقة للتدريب.</p>\n<pre class=\"calc\"><code>توافر الطاقة = (المدخول − طاقة التمرين) ÷ الكتلة الخالية من الدهون</code></pre>\n<div class=\"tablewrap\"><table><thead><tr><th>القيمة (kcal/kg FFM/يوم)</th><th>الدلالة</th></tr></thead><tbody><tr><td>45 فأكثر</td><td>أمثل لصحة الوظائف</td></tr><tr><td>30–45</td><td>دون الأمثل — مقبول لفترات قصيرة مخططة لإنقاص الوزن</td></tr><tr><td>أقل من 30</td><td>منخفض — اضطراب هرموني وخطر على العظام والمناعة</td></tr></tbody></table></div>\n<h3>3. RED-S: الصورة الكاملة</h3>\n<p>نقص الطاقة النسبي في الرياضة لا يقتصر على \"الدورة الشهرية وكسور العظام\". هو منظومة تمس: الغدد الصماء (الهرمونات الجنسية، الدرقية، هرمون النمو)، العظام، المناعة، القلب، الجهاز الهضمي، النمو والتطور، والصحة النفسية — ويصيب الذكور أيضًا (انخفاض التستوستيرون). والأداء نفسه يتراجع: ضعف التعافي، زيادة الإصابات، انخفاض التركيز والقوة.</p>\n<p><strong>المهم:</strong> العلاج غذائي ونفسي أساسًا، ويتطلب فريقًا، وعودة الدورة الشهرية قد تستغرق شهورًا بعد تصحيح الطاقة.</p>\n<h3>4. الوقود أثناء الجهد</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>مدة الجهد</th><th>الكربوهيدرات</th><th>الشكل</th></tr></thead><tbody><tr><td>أقل من 45 دقيقة</td><td>لا حاجة</td><td>—</td></tr><tr><td>45–75 دقيقة</td><td>كميات صغيرة أو مضمضة</td><td>مضمضة الفم لها أثر عصبي مركزي</td></tr><tr><td>1–2.5 ساعة</td><td>30–60 جم/ساعة</td><td>مصدر واحد كافٍ</td></tr><tr><td>أكثر من 2.5 ساعة</td><td>حتى 90 جم/ساعة</td><td><strong>متعدد النقل</strong> (جلوكوز + فركتوز)</td></tr></tbody></table></div>\n<p><strong>لماذا متعدد النقل؟</strong> الجلوكوز يُمتص عبر ناقل SGLT1 الذي يتشبع عند نحو 60 جم/ساعة. الفركتوز يستخدم ناقلًا مختلفًا (GLUT5)، فإضافته ترفع السقف الكلي وتقلل الاضطراب المعوي.</p>\n<h3>5. الأمعاء قابلة للتدريب</h3>\n<p>مفهوم عملي جدًا: الرياضي الذي لم يعتد تناول 90 جم/ساعة أثناء الجري سيعاني غثيانًا وتقلصات يوم السباق. لكن بالتدرّب على ذلك أسابيعَ، تتكيف الأمعاء (زيادة الناقلات، تحسّن الإفراغ). القاعدة الذهبية: <strong>لا تجرّب شيئًا جديدًا يوم المنافسة.</strong></p>\n<h3>6. التدريب بجليكوجين منخفض (Train low, compete high)</h3>\n<p>أداء بعض الجلسات منخفضة الشدة بمخزون جليكوجين منخفض (مثلًا: جلسة صباحية قبل الإفطار بعد جلسة مسائية بلا تعويض كربوهيدراتي) يحفّز إشارات خلوية تزيد تكوين الميتوكوندريا. لكن الكتاب يحذّر: هي أداة متقدمة للتكيف، تُستخدم بانتقائية، ولا تُطبَّق على الجلسات عالية الشدة أو المنافسات، وسوء استخدامها يقود إلى إرهاق وضعف مناعة وخطر RED-S.</p>\n<h3>7. الحميات عالية الدهون والكيتونية</h3>\n<p>عرض متوازن: نعم، التكيف مع الدهون يرفع أكسدتها بشكل كبير. لكن الدراسات على رياضيي النخبة أظهرت <strong>تراجع الاقتصاد الحركي</strong> (يحتاج الرياضي أكسجينًا أكثر للسرعة نفسها) وضعف الأداء في الجهد عالي الشدة — حيث يحسم السباق عادة. لذلك لا يُنصح بها لرياضيي النخبة في الرياضات التي تعتمد على الشدة العالية.</p>\n<h3>8. إطار تقييم المكملات</h3>\n<p>قبل أي مكمل، أربعة أسئلة:</p>\n<ol><li><strong>هل يوجد دليل</strong> على فائدته في هذا النوع من الأداء تحديدًا؟</li><li><strong>هل هو آمن</strong> بالجرعة المقترحة وللرياضي بعينه؟</li><li><strong>هل هو قانوني</strong> وغير ملوّث؟ (الرياضي مسؤول مسؤولية صارمة عما في جسده)</li><li><strong>هل يستحق</strong> التكلفة والجهد مقارنة بتحسين الأساسيات؟</li></ol>\n<h2>أرقام يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الرقم</th></tr></thead><tbody><tr><td>البروتين اليومي</td><td>1.2–2.0 جم/كجم (رياضيو القوة حتى 2.2)</td></tr><tr><td>البروتين في الوجبة</td><td>0.3 جم/كجم (≈ 20–40 جم) كل 3–5 ساعات</td></tr><tr><td>الوجبة قبل الجهد</td><td>1–4 جم/كجم كربوهيدرات قبل 1–4 ساعات</td></tr><tr><td>التعافي السريع</td><td>1–1.2 جم/كجم/ساعة كربوهيدرات لأول 4 ساعات</td></tr><tr><td>الدهون</td><td>لا تقل عن 20% من الطاقة</td></tr><tr><td>فقد السوائل الحرج</td><td>أكثر من 2% من وزن الجسم</td></tr><tr><td>التعويض بعد الجهد</td><td>1.25–1.5 لتر لكل كجم مفقود</td></tr><tr><td>الكرياتين</td><td>3–5 جم يوميًا</td></tr><tr><td>الكافيين</td><td>3–6 مجم/كجم (وجرعات أقل 1–3 مجم/كجم فعالة أيضًا)</td></tr><tr><td>بيتا-ألانين</td><td>3.2–6.4 جم/يوم لأربعة أسابيع على الأقل</td></tr><tr><td>بيكربونات الصوديوم</td><td>0.2–0.3 جم/كجم</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — عداءة مسافات متوسطة قبل بطولة:</strong> 21 سنة، 54 كجم، تتدرب 6 أيام، تشكو تعبًا مستمرًا وتراجع زمنها، فيريتين 14، الدورة غير منتظمة منذ 4 أشهر، تأكل \"صحيًا\" وتتجنب النشويات مساءً.</p>\n<p><strong>القراءة بعين الكتاب:</strong> ثلاث إشارات تتقاطع — فيريتين منخفض، اضطراب الدورة، وتقييد للكربوهيدرات. الأرجح أنها في توافر طاقة منخفض مع نقص حديد، والتعب والتراجع نتيجة لا سبب.</p>\n<p><strong>الخطة:</strong> حساب EA تقديريًا والعمل على رفعه تدريجيًا · تغذية دورية تطابق الكربوهيدرات مع شدة كل يوم بدل تجنبها مساءً · تقييم طبي لنقص الحديد وتعويضه بقرار طبي · فحص اضطراب الأكل بحساسية · التنسيق مع المدرب لتعديل الحمل مؤقتًا · متابعة الدورة والفيريتين والأداء.</p>\n<p><strong>الدرس:</strong> لا مكمل هنا يحل المشكلة. الحل في الأساسيات: طاقة كافية، وقود مطابق للتدريب، وتصحيح النقص.</p></blockquote>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>القفز إلى فصل المكملات</strong> قبل فهم الطاقة والوقود. المكملات تضيف نسبة مئوية صغيرة فوق أساس سليم، ولا تعوّض أساسًا مختلًا.</li><li><strong>تطبيق أرقام النخبة على الهواة.</strong> 90 جم/ساعة لعداء ماراثون نخبوي ليست بالضرورة مناسبة لهاوٍ يركض 3 ساعات.</li><li><strong>اعتبار Train-low قاعدة عامة</strong> بدل أداة انتقائية.</li><li><strong>إهمال فصول الفئات الخاصة.</strong> المراهقون والنباتيون والرياضيات لهم احتياجات مختلفة جوهريًا.</li></ul>\n<h2>كيف تذاكره: خطة ستة أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>التقييم وتركيب الجسم والطاقة</td><td>احسب EA لثلاثة رياضيين من بياناتهم</td></tr><tr><td>2</td><td>الكربوهيدرات والتغذية الدورية</td><td>صمم أسبوعًا تدريبيًا بكربوهيدرات متغيرة يوميًا</td></tr><tr><td>3</td><td>البروتين والسوائل</td><td>احسب معدل تعرق فعلي لرياضي بعد جلسة</td></tr><tr><td>4</td><td>RED-S واضطرابات الأكل والحديد</td><td>اكتب بروتوكول فحص لرياضية ذات خطر</td></tr><tr><td>5</td><td>المكملات</td><td>قيّم 5 مكملات رائجة بإطار الأسئلة الأربعة</td></tr><tr><td>6</td><td>فصل رياضتك + فئة خاصة</td><td>خطة كاملة لرياضي حقيقي في الموسم</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> المرجع الأكثر احترامًا في المجال، منهج قائم على الأدلة بأمانة، تغطية لكل أنواع الرياضات والفئات، وربط وثيق بين الفسيولوجيا والتطبيق.</p>\n<p><strong>الضعف:</strong> كثافة أكاديمية، افتراض خلفية فسيولوجية، وبطء الطبعات مقارنة بسرعة الأبحاث في المجال — لذلك يُقرن بمواقف الجمعيات المحدّثة.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>لماذا قد يكون رياضي \"متوازن الوزن\" في حالة توافر طاقة منخفض؟</li><li>صمم يومين لنفس الرياضي: يوم راحة ويوم جلستين عاليتي الشدة، وبيّن الفرق في الكربوهيدرات ولماذا.</li><li>لاعب كمال أجسام يسألك عن مكمل جديد رائج — طبّق الأسئلة الأربعة عليه.</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Practical Sports Nutrition</strong> للتطبيق الميداني والوجبات · <strong>McArdle</strong> لتعميق الفسيولوجيا · <strong>مواقف ISSN</strong> و<strong>الموقف المشترك للأكاديمية/ACSM/Dietitians of Canada</strong> للأرقام المحدّثة · <strong>إطار مكملات AIS</strong> للتصنيف العملي.</p>", "text": "Clinical Sports Nutrition المحرران Louise Burke و Vicki Deakin، بمشاركة نخبة من باحثي التغذية الرياضية المستوى متقدم الجمهور أخصائيو التغذية الرياضية، طلاب الدراسات العليا، العاملون مع فرق ونخبة الطابع مرجع منهجي قائم على الأدلة، يمزج العلم بالتطبيق الميداني الرفيق Practical Sports Nutrition لنفس المؤلفة الأولى، ومواقف ISSN والأكاديمية/ACSM ما يسبقه McArdle لأساس فسيولوجيا الجهد روح الكتاب يبدأ معظم الناس التغذية الرياضية بسؤال خاطئ: \"ما النظام الغذائي الأفضل للرياضيين؟\". هذا الكتاب يرفض السؤال من أساسه. لا يوجد نظام واحد لرياضي واحد، فضلًا عن كل الرياضيين. السؤال الصحيح: ماذا يحتاج هذا الرياضي، في هذه المرحلة من موسمه، لهذه الجلسة تحديدًا، ولهذا الهدف؟ الكتاب صادر عن مدرسة المعهد الأسترالي للرياضة (AIS)، التي طورت كثيرًا من المفاهيم الحديثة في المجال، ويتسم بأمانة علمية نادرة في مجال تجاري: حين يكون الدليل ضعيفًا، يقولها صراحة — حتى لو كان المكمل أو الحمية رائجًا. خريطة الكتاب الأساس المنهجي تقييم الرياضي: التاريخ الغذائي والتدريبي، الأدوات المناسبة للرياضيين، وتحيزات التبليغ لديهم (خصوصًا في الرياضات الجمالية ورياضات الأوزان). تركيب الجسم: حدود كل طريقة (ثنايا الجلد، DEXA، BIA)، ولماذا يُفضَّل تتبع مجموع ثنايا الجلد على تحويله لنسبة دهون، ومخاطر التركيز المهووس على الأرقام. احتياجات الطاقة: صعوبة قياس إنفاق الرياضي، ومفهوم توافر الطاقة كبديل أكثر فائدة من \"توازن الطاقة\". المغذيات والوقود الكربوهيدرات: التوصيات اليومية حسب الحمل، الأكل قبل الجهد وأثناءه وبعده، التحميل، والاستراتيجيات المتقدمة (التدريب بجليكوجين منخفض). البروتين: الكمية والتوزيع والتوقيت والنوع، والبروتين في فترات التعافي من الإصابة. الدهون: الحد الأدنى، والجدل حول الحميات عالية الدهون للتحمل. السوائل والإلكتروليتات: حساب معدل التعرق، الترطيب الفردي، نقص صوديوم الدم. المغذيات الدقيقة: الحديد (فصل مفصّل لأهميته عند الرياضيات ورياضيي التحمل)، الكالسيوم وفيتامين D وصحة العظام. صحة الرياضي توافر الطاقة المنخفض و RED S: من أهم فصول الكتاب، يتجاوز \"ثالوث الرياضيات\" القديم. اضطرابات الأكل في الرياضة: عوامل الخطر الخاصة بالرياضيين، التعرف، الإحالة، والتعاون مع الفريق. المناعة والجهاز الهضمي: تأثير الحمل التدريبي، واضطرابات المعدة والأمعاء أثناء الجهد. المكملات ومساعدات الأداء إطار لتقييم أي مكمل (الدليل، السلامة، القانونية، الفائدة للرياضي بعينه)، ثم مراجعة المكملات ذات الدليل القوي، ومناقشة مخاطر التلوث والمنشطات. التطبيق حسب نوع الرياضة الفئة المحور التغذوي الرئيسي رياضات التحمل الوقود أثناء الجهد، التحميل، تدريب الأمعاء، الحديد الرياضات الجماعية الوقود المتقطع، التعافي بين المباريات المتقاربة رياضات القوة والقدرة البروتين والتوزيع، الكرياتين، تركيب الجسم رياضات الأوزان قطع الوزن الآمن، إعادة التغذية بعد الوزن الرياضات الجمالية توافر الطاقة، اضطرابات الأكل، صحة العظام رياضات المضرب الترطيب في المباريات الطويلة والحرارة الترياثلون والفعاليات المتعددة التكامل بين أكثر من نظام طاقة فئات خاصة الرياضي المراهق، الرياضي النباتي، الرياضي المسافر، الرياضي ذو الإعاقة، والرياضي في البيئات القاسية (حرارة، ارتفاع). المفاهيم المحورية بالتفصيل 1. التغذية الدورية (Periodized Nutrition) التدريب يُخطَّط في دورات (تحضيري، تنافسي، انتقالي)، وتختلف كل جلسة في هدفها. فلماذا تبقى التغذية ثابتة؟ يقترح الكتاب أن تتبع الخطة الغذائية الحمل التدريبي: اليوم/الجلسة الكربوهيدرات المنطق يوم راحة أو مهاري خفيف 3–5 جم/كجم لا داعي لملء المخازن جلسة تحمل متوسطة 5–7 جم/كجم دعم الجهد والتعافي يوم عالي الشدة أو مزدوج 6–10 جم/كجم الأداء يعتمد على الجليكوجين ما قبل سباق طويل 10–12 جم/كجم لمدة 36–48 ساعة تحميل الفكرة الأعمق: \"الوقود حسب العمل\" (Fuel for the work required) — كمية الكربوهيدرات تُطابَق مع ما تتطلبه الجلسة، لا تُثبَّت يوميًا. 2. توافر الطاقة بدل توازن الطاقة توازن الطاقة يقارن المدخول بالإنفاق الكلي. لكن الرياضي قد يكون \"متوازنًا\" ظاهريًا بينما جسمه في عجز، لأن الجسم يقلل الإنفاق في الوظائف الأخرى (التكاثر، العظام، المناعة) ليوفّر الطاقة للتدريب. توافر الطاقة = (المدخول − طاقة التمرين) ÷ الكتلة الخالية من الدهون القيمة (kcal/kg FFM/يوم) الدلالة 45 فأكثر أمثل لصحة الوظائف 30–45 دون الأمثل — مقبول لفترات قصيرة مخططة لإنقاص الوزن أقل من 30 منخفض — اضطراب هرموني وخطر على العظام والمناعة 3. RED S: الصورة الكاملة نقص الطاقة النسبي في الرياضة لا يقتصر على \"الدورة الشهرية وكسور العظام\". هو منظومة تمس: الغدد الصماء (الهرمونات الجنسية، الدرقية، هرمون النمو)، العظام، المناعة، القلب، الجهاز الهضمي، النمو والتطور، والصحة النفسية — ويصيب الذكور أيضًا (انخفاض التستوستيرون). والأداء نفسه يتراجع: ضعف التعافي، زيادة الإصابات، انخفاض التركيز والقوة. المهم: العلاج غذائي ونفسي أساسًا، ويتطلب فريقًا، وعودة الدورة الشهرية قد تستغرق شهورًا بعد تصحيح الطاقة. 4. الوقود أثناء الجهد مدة الجهد الكربوهيدرات الشكل أقل من 45 دقيقة لا حاجة — 45–75 دقيقة كميات صغيرة أو مضمضة مضمضة الفم لها أثر عصبي مركزي 1–2.5 ساعة 30–60 جم/ساعة مصدر واحد كافٍ أكثر من 2.5 ساعة حتى 90 جم/ساعة متعدد النقل (جلوكوز + فركتوز) لماذا متعدد النقل؟ الجلوكوز يُمتص عبر ناقل SGLT1 الذي يتشبع عند نحو 60 جم/ساعة. الفركتوز يستخدم ناقلًا مختلفًا (GLUT5)، فإضافته ترفع السقف الكلي وتقلل الاضطراب المعوي. 5. الأمعاء قابلة للتدريب مفهوم عملي جدًا: الرياضي الذي لم يعتد تناول 90 جم/ساعة أثناء الجري سيعاني غثيانًا وتقلصات يوم السباق. لكن بالتدرّب على ذلك أسابيعَ، تتكيف الأمعاء (زيادة الناقلات، تحسّن الإفراغ). القاعدة الذهبية: لا تجرّب شيئًا جديدًا يوم المنافسة. 6. التدريب بجليكوجين منخفض (Train low, compete high) أداء بعض الجلسات منخفضة الشدة بمخزون جليكوجين منخفض (مثلًا: جلسة صباحية قبل الإفطار بعد جلسة مسائية بلا تعويض كربوهيدراتي) يحفّز إشارات خلوية تزيد تكوين الميتوكوندريا. لكن الكتاب يحذّر: هي أداة متقدمة للتكيف، تُستخدم بانتقائية، ولا تُطبَّق على الجلسات عالية الشدة أو المنافسات، وسوء استخدامها يقود إلى إرهاق وضعف مناعة وخطر RED S. 7. الحميات عالية الدهون والكيتونية عرض متوازن: نعم، التكيف مع الدهون يرفع أكسدتها بشكل كبير. لكن الدراسات على رياضيي النخبة أظهرت تراجع الاقتصاد الحركي (يحتاج الرياضي أكسجينًا أكثر للسرعة نفسها) وضعف الأداء في الجهد عالي الشدة — حيث يحسم السباق عادة. لذلك لا يُنصح بها لرياضيي النخبة في الرياضات التي تعتمد على الشدة العالية. 8. إطار تقييم المكملات قبل أي مكمل، أربعة أسئلة: 1. هل يوجد دليل على فائدته في هذا النوع من الأداء تحديدًا؟ 2. هل هو آمن بالجرعة المقترحة وللرياضي بعينه؟ 3. هل هو قانوني وغير ملوّث؟ (الرياضي مسؤول مسؤولية صارمة عما في جسده) 4. هل يستحق التكلفة والجهد مقارنة بتحسين الأساسيات؟ أرقام يجب أن تخرج بها الموضوع الرقم البروتين اليومي 1.2–2.0 جم/كجم (رياضيو القوة حتى 2.2) البروتين في الوجبة 0.3 جم/كجم (≈ 20–40 جم) كل 3–5 ساعات الوجبة قبل الجهد 1–4 جم/كجم كربوهيدرات قبل 1–4 ساعات التعافي السريع 1–1.2 جم/كجم/ساعة كربوهيدرات لأول 4 ساعات الدهون لا تقل عن 20% من الطاقة فقد السوائل الحرج أكثر من 2% من وزن الجسم التعويض بعد الجهد 1.25–1.5 لتر لكل كجم مفقود الكرياتين 3–5 جم يوميًا الكافيين 3–6 مجم/كجم (وجرعات أقل 1–3 مجم/كجم فعالة أيضًا) بيتا ألانين 3.2–6.4 جم/يوم لأربعة أسابيع على الأقل بيكربونات الصوديوم 0.2–0.3 جم/كجم مثال تطبيقي بأسلوب الكتاب مثال — عداءة مسافات متوسطة قبل بطولة: 21 سنة، 54 كجم، تتدرب 6 أيام، تشكو تعبًا مستمرًا وتراجع زمنها، فيريتين 14، الدورة غير منتظمة منذ 4 أشهر، تأكل \"صحيًا\" وتتجنب النشويات مساءً. القراءة بعين الكتاب: ثلاث إشارات تتقاطع — فيريتين منخفض، اضطراب الدورة، وتقييد للكربوهيدرات. الأرجح أنها في توافر طاقة منخفض مع نقص حديد، والتعب والتراجع نتيجة لا سبب. الخطة: حساب EA تقديريًا والعمل على رفعه تدريجيًا · تغذية دورية تطابق الكربوهيدرات مع شدة كل يوم بدل تجنبها مساءً · تقييم طبي لنقص الحديد وتعويضه بقرار طبي · فحص اضطراب الأكل بحساسية · التنسيق مع المدرب لتعديل الحمل مؤقتًا · متابعة الدورة والفيريتين والأداء. الدرس: لا مكمل هنا يحل المشكلة. الحل في الأساسيات: طاقة كافية، وقود مطابق للتدريب، وتصحيح النقص. أخطاء شائعة عند قراءة الكتاب القفز إلى فصل المكملات قبل فهم الطاقة والوقود. المكملات تضيف نسبة مئوية صغيرة فوق أساس سليم، ولا تعوّض أساسًا مختلًا. تطبيق أرقام النخبة على الهواة. 90 جم/ساعة لعداء ماراثون نخبوي ليست بالضرورة مناسبة لهاوٍ يركض 3 ساعات. اعتبار Train low قاعدة عامة بدل أداة انتقائية. إهمال فصول الفئات الخاصة. المراهقون والنباتيون والرياضيات لهم احتياجات مختلفة جوهريًا. كيف تذاكره: خطة ستة أسابيع الأسبوع المحتوى التطبيق 1 التقييم وتركيب الجسم والطاقة احسب EA لثلاثة رياضيين من بياناتهم 2 الكربوهيدرات والتغذية الدورية صمم أسبوعًا تدريبيًا بكربوهيدرات متغيرة يوميًا 3 البروتين والسوائل احسب معدل تعرق فعلي لرياضي بعد جلسة 4 RED S واضطرابات الأكل والحديد اكتب بروتوكول فحص لرياضية ذات خطر 5 المكملات قيّم 5 مكملات رائجة بإطار الأسئلة الأربعة 6 فصل رياضتك + فئة خاصة خطة كاملة لرياضي حقيقي في الموسم نقاط القوة والضعف القوة: المرجع الأكثر احترامًا في المجال، منهج قائم على الأدلة بأمانة، تغطية لكل أنواع الرياضات والفئات، وربط وثيق بين الفسيولوجيا والتطبيق. الضعف: كثافة أكاديمية، افتراض خلفية فسيولوجية، وبطء الطبعات مقارنة بسرعة الأبحاث في المجال — لذلك يُقرن بمواقف الجمعيات المحدّثة. أسئلة للتأمل بعد القراءة 1. لماذا قد يكون رياضي \"متوازن الوزن\" في حالة توافر طاقة منخفض؟ 2. صمم يومين لنفس الرياضي: يوم راحة ويوم جلستين عاليتي الشدة، وبيّن الفرق في الكربوهيدرات ولماذا. 3. لاعب كمال أجسام يسألك عن مكمل جديد رائج — طبّق الأسئلة الأربعة عليه. ماذا تقرأ بعده؟ Practical Sports Nutrition للتطبيق الميداني والوجبات · McArdle لتعميق الفسيولوجيا · مواقف ISSN و الموقف المشترك للأكاديمية/ACSM/Dietitians of Canada للأرقام المحدّثة · إطار مكملات AIS للتصنيف العملي."}, {"i": 34, "group": "books", "tag": "مكتبة المراجع", "num": "4", "short": "McArdle — فسيولوجيا الجهد", "html": "<h1>Exercise Physiology: Nutrition, Energy, and Human Performance</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المؤلفون</strong></td><td>William D. McArdle و Frank I. Katch و Victor L. Katch</td></tr><tr><td><strong>المستوى</strong></td><td>متوسط إلى متقدم</td></tr><tr><td><strong>الجمهور</strong></td><td>طلاب علوم الرياضة والتغذية، أخصائيو التغذية الرياضية، المدربون المتقدمون</td></tr><tr><td><strong>الطابع</strong></td><td>مرجع فسيولوجيا الجهد مع ربط مستمر بالتغذية</td></tr><tr><td><strong>مكانته</strong></td><td>أحد أشهر مراجع فسيولوجيا الجهد في العالم، وتُنسب إليه معادلة Katch-McArdle</td></tr><tr><td><strong>ما يليه</strong></td><td>Burke للتطبيق التغذوي المتخصص</td></tr></tbody></table></div>\n<h2>لماذا يحتاجه أخصائي التغذية؟</h2>\n<p>لأنك لا تستطيع تغذية جسم لا تفهم كيف يعمل تحت الحمل. حين تقول لعداء \"تناول 60 جم كربوهيدرات في الساعة\"، يجب أن تعرف لماذا 60 تحديدًا، ولماذا يحتاجها العداء ولا يحتاجها رافع الأثقال بالقدر نفسه، ولماذا يتغير الوقود المستخدم حين يسرّع العداء. هذا الكتاب يمنحك تلك الإجابات من أساسها.</p>\n<p>ما يميزه عن كتب الفسيولوجيا الأخرى هو العنوان الفرعي نفسه: <strong>التغذية والطاقة والأداء</strong>. التغذية ليست فصلًا ملحقًا فيه، بل خيط يربط كل الأقسام.</p>\n<h2>خريطة الكتاب</h2>\n<h3>القسم الأول: التغذية كأساس</h3>\n<p>المغذيات الكبرى والدقيقة من منظور الجهد، الماء والترطيب، التغذية المثلى للنشاط، والمكملات ومساعدات الأداء.</p>\n<h3>القسم الثاني: تحويل الطاقة</h3>\n<ul><li><strong>الطاقة الحيوية:</strong> ATP كعملة الطاقة، وكيف يُعاد تكوينه.</li><li><strong>أنظمة الطاقة الثلاثة</strong> وتفاعلها.</li><li><strong>قياس إنفاق الطاقة:</strong> قياس السعرات المباشر وغير المباشر، معامل التنفس (RQ)، المكافئات الأيضية (METs).</li><li><strong>إنفاق الطاقة في الراحة والنشاط:</strong> معدل الأيض الأساسي ومحدداته، والتكلفة الطاقية للأنشطة المختلفة.</li></ul>\n<h3>القسم الثالث: أنظمة الجسم أثناء الجهد</h3>\n<ul><li><strong>الجهاز التنفسي:</strong> التهوية، تبادل الغازات، نقل الأكسجين وثاني أكسيد الكربون.</li><li><strong>الجهاز القلبي الوعائي:</strong> النتاج القلبي، حجم الضربة، توزيع الدم أثناء الجهد.</li><li><strong>الجهاز العصبي العضلي:</strong> بنية العضلة، أنواع الألياف، آلية الانقباض، الوحدات الحركية.</li><li><strong>الغدد الصماء:</strong> استجابة الهرمونات للجهد ودورها في تعبئة الوقود.</li></ul>\n<h3>القسم الرابع: التدريب والتكيف</h3>\n<p>مبادئ التدريب (الحمل الزائد، الخصوصية، الفروق الفردية، الانعكاس)، تدريب القدرة اللاهوائية والهوائية، تدريب المقاومة وتكيفاته، والإفراط في التدريب.</p>\n<h3>القسم الخامس: تركيب الجسم وضبط الوزن</h3>\n<p>طرق تقييم تركيب الجسم بالتفصيل، توازن الطاقة، السمنة، ودور النشاط البدني في ضبط الوزن.</p>\n<h3>القسم السادس: الأداء في بيئات خاصة</h3>\n<p>الحرارة والبرودة، الارتفاعات، الغوص، والفضاء — مع التداعيات التغذوية لكل بيئة.</p>\n<h3>القسم السابع: الصحة والشيخوخة</h3>\n<p>النشاط البدني والأمراض المزمنة، والتغيرات المرتبطة بالعمر وتأثير التدريب عليها.</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. أنظمة الطاقة: تعمل معًا لا بالتتابع</h3>\n<p>أكثر خطأ شائع: الاعتقاد بأن الجسم \"يُشغّل\" نظامًا ثم ينتقل للتالي. الحقيقة أن الأنظمة الثلاثة تعمل <strong>في الوقت نفسه منذ اللحظة الأولى</strong>، وما يتغير هو <strong>نسبة مساهمة كل منها</strong>.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>النظام</th><th>الوقود</th><th>السرعة</th><th>السعة</th><th>المساهمة السائدة</th></tr></thead><tbody><tr><td><strong>الفوسفاجين (ATP-PCr)</strong></td><td>فوسفوكرياتين</td><td>أسرع</td><td>صغيرة جدًا</td><td>أول 10 ثوانٍ تقريبًا</td></tr><tr><td><strong>الجليكوليتي</strong></td><td>جلوكوز/جليكوجين ← لاكتات</td><td>سريع</td><td>متوسطة</td><td>10 ثوانٍ إلى دقيقتين</td></tr><tr><td><strong>الأكسدي</strong></td><td>كربوهيدرات ودهون (وقليل بروتين)</td><td>أبطأ</td><td>شبه غير محدودة</td><td>بعد دقيقتين فأكثر</td></tr></tbody></table></div>\n<p><strong>التطبيق التغذوي:</strong> لاعب كرة القدم يستخدم الأنظمة الثلاثة في المباراة الواحدة — عدو قصير (فوسفاجين)، تكرار الجري (جليكوليتي)، والحركة المستمرة 90 دقيقة (أكسدي). لذلك يحتاج كربوهيدرات كافية للجليكوجين، وقد يستفيد من الكرياتين للعدو المتكرر.</p>\n<h3>2. اللاكتات: من متهم إلى وقود</h3>\n<p>الكتاب يصحح فكرة قديمة: اللاكتات ليس \"فضلات\" تسبب ألم العضلات المتأخر. هو ناتج طبيعي لتحلل الجلوكوز السريع، ويُنقل إلى عضلات أخرى والقلب ليُستخدم وقودًا، وإلى الكبد ليُحوَّل جلوكوزًا (دورة كوري). ألم العضلات بعد يوم أو يومين سببه تلف دقيق في الألياف والتهاب، لا اللاكتات.</p>\n<h3>3. المحددات الثلاثة لأداء التحمل</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المحدد</th><th>ما يقيسه</th><th>كيف تؤثر التغذية</th></tr></thead><tbody><tr><td><strong>VO₂max</strong></td><td>أقصى قدرة على استهلاك الأكسجين</td><td>الحديد والهيموجلوبين، كفاية الطاقة للتدريب</td></tr><tr><td><strong>عتبة اللاكتات</strong></td><td>أعلى شدة يمكن الحفاظ عليها</td><td>توافر الجليكوجين، التكيفات من التدريب</td></tr><tr><td><strong>الاقتصاد الحركي</strong></td><td>الأكسجين المطلوب لسرعة معينة</td><td>النترات، تجنّب الحميات التي تضعفه (كالكيتونية)</td></tr></tbody></table></div>\n<p>رياضيان بنفس VO₂max قد يختلف أداؤهما كثيرًا بسبب اختلاف العتبة أو الاقتصاد. لهذا العتبة تتنبأ بأداء التحمل أفضل من VO₂max وحده.</p>\n<h3>4. مفهوم التقاطع (Crossover)</h3>\n<p>مع ارتفاع الشدة، تتحول مساهمة الوقود من الدهون نحو الكربوهيدرات. في الراحة والشدة المنخفضة، الدهون هي الوقود الأكبر. عند نحو 55–65% من VO₂max تبلغ أكسدة الدهون ذروتها المطلقة (<strong>FATmax</strong>). وفوق ذلك تهيمن الكربوهيدرات بشكل متزايد.</p>\n<p><strong>لماذا؟</strong> الكربوهيدرات تنتج طاقة أكثر لكل لتر أكسجين، وتتحلل أسرع، وتتطلب خطوات أقل. حين يحتاج الجسم طاقة بسرعة، يختار الوقود الأسرع.</p>\n<p><strong>النتيجة العملية:</strong> السباق يُحسم عادة في الشدات العالية (الصعود، الهجوم الأخير، العدو النهائي) — حيث الكربوهيدرات هي الوقود. هذه هي الحجة الفسيولوجية لأهمية الكربوهيدرات للمنافسة.</p>\n<h3>5. قياس الطاقة ومعامل التنفس</h3>\n<p><strong>قياس السعرات غير المباشر</strong> يعتمد على أن استهلاك الأكسجين وإنتاج ثاني أكسيد الكربون يعكسان ما يُحرق.</p>\n<pre class=\"calc\"><code>معامل التنفس (RQ) = ثاني أكسيد الكربون المنتج ÷ الأكسجين المستهلك</code></pre>\n<div class=\"tablewrap\"><table><thead><tr><th>RQ</th><th>الوقود السائد</th></tr></thead><tbody><tr><td>0.70</td><td>دهون خالصة</td></tr><tr><td>0.80</td><td>بروتين تقريبًا / خليط</td></tr><tr><td>0.85</td><td>خليط متساوٍ تقريبًا</td></tr><tr><td>1.00</td><td>كربوهيدرات خالصة</td></tr><tr><td>أكبر من 1.0</td><td>تخليق دهون من فائض كربوهيدرات (أو فرط تهوية)</td></tr></tbody></table></div>\n<p>وهذا مهم إكلينيكيًا: في العناية المركزة، RQ أعلى من 1 قد يدل على <strong>فرط تغذية بالكربوهيدرات</strong> — وهو ما يرفع إنتاج CO₂ ويصعّب فطام المريض عن جهاز التنفس.</p>\n<h3>6. محددات معدل الأيض الأساسي</h3>\n<p>أكبر محدد هو <strong>الكتلة الخالية من الدهون</strong> — ومنها اشتُقت معادلة Katch-McArdle: <code>370 + (21.6 × FFM)</code>. بعدها العمر والجنس والهرمونات الدرقية والحرارة والحالة الغذائية. لهذا يفقد من يتبع حمية قاسية جزءًا من معدل أيضه: يفقد كتلة عضلية، ويتكيف هرمونيًا.</p>\n<h3>7. أنواع الألياف العضلية</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الخاصية</th><th>النوع I (بطيء)</th><th>النوع IIa (سريع مؤكسد)</th><th>النوع IIx (سريع جليكوليتي)</th></tr></thead><tbody><tr><td>سرعة الانقباض</td><td>بطيئة</td><td>سريعة</td><td>الأسرع</td></tr><tr><td>مقاومة التعب</td><td>عالية</td><td>متوسطة</td><td>منخفضة</td></tr><tr><td>الميتوكوندريا</td><td>كثيرة</td><td>متوسطة</td><td>قليلة</td></tr><tr><td>الوقود السائد</td><td>أكسدي (دهون وكربوهيدرات)</td><td>مختلط</td><td>جليكوجين</td></tr><tr><td>السائد لدى</td><td>عدائي المسافات</td><td>رياضيي المسافات المتوسطة</td><td>العدّائين ورافعي الأثقال</td></tr></tbody></table></div>\n<h3>8. التكيفات الزمنية لتدريب المقاومة</h3>\n<p>في الأسابيع الأولى تزداد القوة بسرعة دون تغير واضح في حجم العضلة — لأن التحسن <strong>عصبي</strong> أولًا (تجنيد أفضل للوحدات الحركية وتنسيق أعلى). التضخم البنيوي يظهر لاحقًا. وهذا يفسر لماذا لا تتطابق زيادة القوة مع زيادة الكتلة في البداية.</p>\n<h3>9. البيئات القاسية وتداعياتها التغذوية</h3>\n<ul><li><strong>الحرارة:</strong> ارتفاع إنفاق الجليكوجين، زيادة فقد السوائل والصوديوم، أهمية التأقلم (7–14 يومًا) والتبريد المسبق.</li><li><strong>الارتفاع:</strong> ارتفاع الأيض الأساسي مع انخفاض الشهية، زيادة فقد السوائل بالتنفس، ضرورة الحديد الكافي لتكوين كرات دم جديدة، وزيادة الاعتماد على الكربوهيدرات لأنها أكفأ أكسجينيًا.</li></ul>\n<h2>أرقام يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الرقم</th></tr></thead><tbody><tr><td>مخزون ATP العضلي</td><td>يكفي 1–2 ثانية تقريبًا</td></tr><tr><td>مخزون الفوسفوكرياتين</td><td>يكفي نحو 10 ثوانٍ من الجهد الأقصى</td></tr><tr><td>الطاقة لكل لتر أكسجين</td><td>نحو 5 kcal (أعلى قليلًا للكربوهيدرات)</td></tr><tr><td>FATmax</td><td>نحو 55–65% من VO₂max</td></tr><tr><td>1 MET</td><td>نحو 3.5 مل أكسجين/كجم/دقيقة ≈ 1 kcal/كجم/ساعة</td></tr><tr><td>تقدير النبض الأقصى</td><td>220 − العمر (بتباين فردي كبير)</td></tr><tr><td>التأقلم الحراري</td><td>7–14 يومًا</td></tr><tr><td>معادلة Katch-McArdle</td><td>370 + 21.6 × الكتلة الخالية من الدهون</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — تقدير إنفاق جلسة بالـ METs:</strong> رجل 80 كجم يجري ساعة بنشاط يعادل نحو 10 METs.</p>\n<p><strong>الحساب:</strong> 1 MET ≈ 1 kcal/كجم/ساعة ← 10 METs × 80 كجم × 1 ساعة ≈ <strong>800 kcal إجمالي</strong>. ولأن 1 MET من هذه هو أيض الراحة الذي كان سيُنفق على أي حال، فالإنفاق <strong>الإضافي</strong> للتمرين نفسه ≈ 9 × 80 = <strong>720 kcal</strong>.</p>\n<p><strong>لماذا يهم الفرق؟</strong> عند حساب توافر الطاقة أو ميزان الطاقة، استخدام الإجمالي بدل الإضافي يبالغ في تقدير ما \"حرقه\" التمرين — وهو خطأ شائع في تطبيقات اللياقة.</p>\n<p><strong>وأي وقود؟</strong> عند هذه الشدة العالية (نحو 75–80% من VO₂max لمعظم المتدربين) ستكون الكربوهيدرات الوقود السائد — فجلسة كهذه متكررة تتطلب تعويضًا كربوهيدراتيًا جيدًا.</p></blockquote>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>تخيّل أنظمة الطاقة تعمل بالتتابع</strong> — وهو الخطأ الذي يصححه الكتاب صراحة.</li><li><strong>التعامل مع \"منطقة حرق الدهون\"</strong> على أنها الأفضل لإنقاص الوزن. حرق نسبة أعلى من الدهون في الشدة المنخفضة لا يعني حرق دهون أكثر إجمالًا؛ الإجمالي يحدده توازن الطاقة.</li><li><strong>اعتبار 220 − العمر قيمة دقيقة.</strong> هي تقدير بتباين يصل إلى 10–12 نبضة.</li><li><strong>تجاهل الأشكال التوضيحية.</strong> في هذا الكتاب تحمل الأشكال نصف المعلومة.</li><li><strong>قراءة أقسام البيئات الخاصة كلها</strong> إن لم تكن ضرورية لعملك — يمكن الرجوع إليها عند الحاجة.</li></ul>\n<h2>كيف تذاكره: خطة ثمانية أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>الطاقة الحيوية وأنظمة الطاقة</td><td>صنّف 10 رياضات حسب النظام السائد ونسب المساهمة</td></tr><tr><td>2</td><td>قياس الطاقة و RQ و METs</td><td>احسب إنفاق 5 أنشطة لشخصين مختلفي الوزن</td></tr><tr><td>3</td><td>التغذية والجهد (من منظور الكتاب)</td><td>اربط كل نظام طاقة بوقوده وتداعياته الغذائية</td></tr><tr><td>4</td><td>الجهازان التنفسي والقلبي</td><td>اشرح محددات VO₂max</td></tr><tr><td>5</td><td>العضلة والألياف والانقباض</td><td>قارن احتياجات عداء ماراثون ورافع أثقال</td></tr><tr><td>6</td><td>التدريب والتكيف</td><td>اشرح لماذا تزيد القوة قبل الحجم</td></tr><tr><td>7</td><td>تركيب الجسم وضبط الوزن</td><td>قارن 4 طرق قياس من حيث الدقة والكلفة</td></tr><tr><td>8</td><td>البيئات الخاصة</td><td>خطة تغذية لرياضي يتنافس في ارتفاع أو حرارة</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> دمج فريد بين الفسيولوجيا والتغذية، رسوم توضيحية ممتازة، شمول واسع، ومرجعية تاريخية في المجال.</p>\n<p><strong>الضعف:</strong> حجم كبير وتفاصيل قد تتجاوز حاجة أخصائي التغذية في بعض الأقسام (الغوص، الفضاء)، وبعض التوصيات التغذوية تتأخر عن أحدث المواقف المتخصصة.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>لماذا يُعتبر \"التمرين في منطقة حرق الدهون\" نصيحة مضللة لمن يريد إنقاص وزنه؟</li><li>مريض في العناية المركزة RQ لديه 1.1 — ماذا يخبرك ذلك عن تغذيته؟</li><li>لاعب تنس يلعب مباراة 3 ساعات في الحر — أي أنظمة الطاقة يستخدم، وما خطة الترطيب والوقود؟</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Burke — Clinical Sports Nutrition</strong> لترجمة هذه الفسيولوجيا إلى خطط تغذية · <strong>Gropper</strong> لتعميق الأيض على المستوى الجزيئي · <strong>NSCA's Guide to Sport and Exercise Nutrition</strong> لربط التغذية ببرامج القوة والتكييف.</p>", "text": "Exercise Physiology: Nutrition, Energy, and Human Performance المؤلفون William D. McArdle و Frank I. Katch و Victor L. Katch المستوى متوسط إلى متقدم الجمهور طلاب علوم الرياضة والتغذية، أخصائيو التغذية الرياضية، المدربون المتقدمون الطابع مرجع فسيولوجيا الجهد مع ربط مستمر بالتغذية مكانته أحد أشهر مراجع فسيولوجيا الجهد في العالم، وتُنسب إليه معادلة Katch McArdle ما يليه Burke للتطبيق التغذوي المتخصص لماذا يحتاجه أخصائي التغذية؟ لأنك لا تستطيع تغذية جسم لا تفهم كيف يعمل تحت الحمل. حين تقول لعداء \"تناول 60 جم كربوهيدرات في الساعة\"، يجب أن تعرف لماذا 60 تحديدًا، ولماذا يحتاجها العداء ولا يحتاجها رافع الأثقال بالقدر نفسه، ولماذا يتغير الوقود المستخدم حين يسرّع العداء. هذا الكتاب يمنحك تلك الإجابات من أساسها. ما يميزه عن كتب الفسيولوجيا الأخرى هو العنوان الفرعي نفسه: التغذية والطاقة والأداء . التغذية ليست فصلًا ملحقًا فيه، بل خيط يربط كل الأقسام. خريطة الكتاب القسم الأول: التغذية كأساس المغذيات الكبرى والدقيقة من منظور الجهد، الماء والترطيب، التغذية المثلى للنشاط، والمكملات ومساعدات الأداء. القسم الثاني: تحويل الطاقة الطاقة الحيوية: ATP كعملة الطاقة، وكيف يُعاد تكوينه. أنظمة الطاقة الثلاثة وتفاعلها. قياس إنفاق الطاقة: قياس السعرات المباشر وغير المباشر، معامل التنفس (RQ)، المكافئات الأيضية (METs). إنفاق الطاقة في الراحة والنشاط: معدل الأيض الأساسي ومحدداته، والتكلفة الطاقية للأنشطة المختلفة. القسم الثالث: أنظمة الجسم أثناء الجهد الجهاز التنفسي: التهوية، تبادل الغازات، نقل الأكسجين وثاني أكسيد الكربون. الجهاز القلبي الوعائي: النتاج القلبي، حجم الضربة، توزيع الدم أثناء الجهد. الجهاز العصبي العضلي: بنية العضلة، أنواع الألياف، آلية الانقباض، الوحدات الحركية. الغدد الصماء: استجابة الهرمونات للجهد ودورها في تعبئة الوقود. القسم الرابع: التدريب والتكيف مبادئ التدريب (الحمل الزائد، الخصوصية، الفروق الفردية، الانعكاس)، تدريب القدرة اللاهوائية والهوائية، تدريب المقاومة وتكيفاته، والإفراط في التدريب. القسم الخامس: تركيب الجسم وضبط الوزن طرق تقييم تركيب الجسم بالتفصيل، توازن الطاقة، السمنة، ودور النشاط البدني في ضبط الوزن. القسم السادس: الأداء في بيئات خاصة الحرارة والبرودة، الارتفاعات، الغوص، والفضاء — مع التداعيات التغذوية لكل بيئة. القسم السابع: الصحة والشيخوخة النشاط البدني والأمراض المزمنة، والتغيرات المرتبطة بالعمر وتأثير التدريب عليها. المفاهيم المحورية بالتفصيل 1. أنظمة الطاقة: تعمل معًا لا بالتتابع أكثر خطأ شائع: الاعتقاد بأن الجسم \"يُشغّل\" نظامًا ثم ينتقل للتالي. الحقيقة أن الأنظمة الثلاثة تعمل في الوقت نفسه منذ اللحظة الأولى ، وما يتغير هو نسبة مساهمة كل منها . النظام الوقود السرعة السعة المساهمة السائدة الفوسفاجين (ATP PCr) فوسفوكرياتين أسرع صغيرة جدًا أول 10 ثوانٍ تقريبًا الجليكوليتي جلوكوز/جليكوجين ← لاكتات سريع متوسطة 10 ثوانٍ إلى دقيقتين الأكسدي كربوهيدرات ودهون (وقليل بروتين) أبطأ شبه غير محدودة بعد دقيقتين فأكثر التطبيق التغذوي: لاعب كرة القدم يستخدم الأنظمة الثلاثة في المباراة الواحدة — عدو قصير (فوسفاجين)، تكرار الجري (جليكوليتي)، والحركة المستمرة 90 دقيقة (أكسدي). لذلك يحتاج كربوهيدرات كافية للجليكوجين، وقد يستفيد من الكرياتين للعدو المتكرر. 2. اللاكتات: من متهم إلى وقود الكتاب يصحح فكرة قديمة: اللاكتات ليس \"فضلات\" تسبب ألم العضلات المتأخر. هو ناتج طبيعي لتحلل الجلوكوز السريع، ويُنقل إلى عضلات أخرى والقلب ليُستخدم وقودًا، وإلى الكبد ليُحوَّل جلوكوزًا (دورة كوري). ألم العضلات بعد يوم أو يومين سببه تلف دقيق في الألياف والتهاب، لا اللاكتات. 3. المحددات الثلاثة لأداء التحمل المحدد ما يقيسه كيف تؤثر التغذية VO₂max أقصى قدرة على استهلاك الأكسجين الحديد والهيموجلوبين، كفاية الطاقة للتدريب عتبة اللاكتات أعلى شدة يمكن الحفاظ عليها توافر الجليكوجين، التكيفات من التدريب الاقتصاد الحركي الأكسجين المطلوب لسرعة معينة النترات، تجنّب الحميات التي تضعفه (كالكيتونية) رياضيان بنفس VO₂max قد يختلف أداؤهما كثيرًا بسبب اختلاف العتبة أو الاقتصاد. لهذا العتبة تتنبأ بأداء التحمل أفضل من VO₂max وحده. 4. مفهوم التقاطع (Crossover) مع ارتفاع الشدة، تتحول مساهمة الوقود من الدهون نحو الكربوهيدرات. في الراحة والشدة المنخفضة، الدهون هي الوقود الأكبر. عند نحو 55–65% من VO₂max تبلغ أكسدة الدهون ذروتها المطلقة ( FATmax ). وفوق ذلك تهيمن الكربوهيدرات بشكل متزايد. لماذا؟ الكربوهيدرات تنتج طاقة أكثر لكل لتر أكسجين، وتتحلل أسرع، وتتطلب خطوات أقل. حين يحتاج الجسم طاقة بسرعة، يختار الوقود الأسرع. النتيجة العملية: السباق يُحسم عادة في الشدات العالية (الصعود، الهجوم الأخير، العدو النهائي) — حيث الكربوهيدرات هي الوقود. هذه هي الحجة الفسيولوجية لأهمية الكربوهيدرات للمنافسة. 5. قياس الطاقة ومعامل التنفس قياس السعرات غير المباشر يعتمد على أن استهلاك الأكسجين وإنتاج ثاني أكسيد الكربون يعكسان ما يُحرق. معامل التنفس (RQ) = ثاني أكسيد الكربون المنتج ÷ الأكسجين المستهلك RQ الوقود السائد 0.70 دهون خالصة 0.80 بروتين تقريبًا / خليط 0.85 خليط متساوٍ تقريبًا 1.00 كربوهيدرات خالصة أكبر من 1.0 تخليق دهون من فائض كربوهيدرات (أو فرط تهوية) وهذا مهم إكلينيكيًا: في العناية المركزة، RQ أعلى من 1 قد يدل على فرط تغذية بالكربوهيدرات — وهو ما يرفع إنتاج CO₂ ويصعّب فطام المريض عن جهاز التنفس. 6. محددات معدل الأيض الأساسي أكبر محدد هو الكتلة الخالية من الدهون — ومنها اشتُقت معادلة Katch McArdle: 370 + (21.6 × FFM) . بعدها العمر والجنس والهرمونات الدرقية والحرارة والحالة الغذائية. لهذا يفقد من يتبع حمية قاسية جزءًا من معدل أيضه: يفقد كتلة عضلية، ويتكيف هرمونيًا. 7. أنواع الألياف العضلية الخاصية النوع I (بطيء) النوع IIa (سريع مؤكسد) النوع IIx (سريع جليكوليتي) سرعة الانقباض بطيئة سريعة الأسرع مقاومة التعب عالية متوسطة منخفضة الميتوكوندريا كثيرة متوسطة قليلة الوقود السائد أكسدي (دهون وكربوهيدرات) مختلط جليكوجين السائد لدى عدائي المسافات رياضيي المسافات المتوسطة العدّائين ورافعي الأثقال 8. التكيفات الزمنية لتدريب المقاومة في الأسابيع الأولى تزداد القوة بسرعة دون تغير واضح في حجم العضلة — لأن التحسن عصبي أولًا (تجنيد أفضل للوحدات الحركية وتنسيق أعلى). التضخم البنيوي يظهر لاحقًا. وهذا يفسر لماذا لا تتطابق زيادة القوة مع زيادة الكتلة في البداية. 9. البيئات القاسية وتداعياتها التغذوية الحرارة: ارتفاع إنفاق الجليكوجين، زيادة فقد السوائل والصوديوم، أهمية التأقلم (7–14 يومًا) والتبريد المسبق. الارتفاع: ارتفاع الأيض الأساسي مع انخفاض الشهية، زيادة فقد السوائل بالتنفس، ضرورة الحديد الكافي لتكوين كرات دم جديدة، وزيادة الاعتماد على الكربوهيدرات لأنها أكفأ أكسجينيًا. أرقام يجب أن تخرج بها الموضوع الرقم مخزون ATP العضلي يكفي 1–2 ثانية تقريبًا مخزون الفوسفوكرياتين يكفي نحو 10 ثوانٍ من الجهد الأقصى الطاقة لكل لتر أكسجين نحو 5 kcal (أعلى قليلًا للكربوهيدرات) FATmax نحو 55–65% من VO₂max 1 MET نحو 3.5 مل أكسجين/كجم/دقيقة ≈ 1 kcal/كجم/ساعة تقدير النبض الأقصى 220 − العمر (بتباين فردي كبير) التأقلم الحراري 7–14 يومًا معادلة Katch McArdle 370 + 21.6 × الكتلة الخالية من الدهون مثال تطبيقي بأسلوب الكتاب مثال — تقدير إنفاق جلسة بالـ METs: رجل 80 كجم يجري ساعة بنشاط يعادل نحو 10 METs. الحساب: 1 MET ≈ 1 kcal/كجم/ساعة ← 10 METs × 80 كجم × 1 ساعة ≈ 800 kcal إجمالي . ولأن 1 MET من هذه هو أيض الراحة الذي كان سيُنفق على أي حال، فالإنفاق الإضافي للتمرين نفسه ≈ 9 × 80 = 720 kcal . لماذا يهم الفرق؟ عند حساب توافر الطاقة أو ميزان الطاقة، استخدام الإجمالي بدل الإضافي يبالغ في تقدير ما \"حرقه\" التمرين — وهو خطأ شائع في تطبيقات اللياقة. وأي وقود؟ عند هذه الشدة العالية (نحو 75–80% من VO₂max لمعظم المتدربين) ستكون الكربوهيدرات الوقود السائد — فجلسة كهذه متكررة تتطلب تعويضًا كربوهيدراتيًا جيدًا. أخطاء شائعة عند قراءة الكتاب تخيّل أنظمة الطاقة تعمل بالتتابع — وهو الخطأ الذي يصححه الكتاب صراحة. التعامل مع \"منطقة حرق الدهون\" على أنها الأفضل لإنقاص الوزن. حرق نسبة أعلى من الدهون في الشدة المنخفضة لا يعني حرق دهون أكثر إجمالًا؛ الإجمالي يحدده توازن الطاقة. اعتبار 220 − العمر قيمة دقيقة. هي تقدير بتباين يصل إلى 10–12 نبضة. تجاهل الأشكال التوضيحية. في هذا الكتاب تحمل الأشكال نصف المعلومة. قراءة أقسام البيئات الخاصة كلها إن لم تكن ضرورية لعملك — يمكن الرجوع إليها عند الحاجة. كيف تذاكره: خطة ثمانية أسابيع الأسبوع المحتوى التطبيق 1 الطاقة الحيوية وأنظمة الطاقة صنّف 10 رياضات حسب النظام السائد ونسب المساهمة 2 قياس الطاقة و RQ و METs احسب إنفاق 5 أنشطة لشخصين مختلفي الوزن 3 التغذية والجهد (من منظور الكتاب) اربط كل نظام طاقة بوقوده وتداعياته الغذائية 4 الجهازان التنفسي والقلبي اشرح محددات VO₂max 5 العضلة والألياف والانقباض قارن احتياجات عداء ماراثون ورافع أثقال 6 التدريب والتكيف اشرح لماذا تزيد القوة قبل الحجم 7 تركيب الجسم وضبط الوزن قارن 4 طرق قياس من حيث الدقة والكلفة 8 البيئات الخاصة خطة تغذية لرياضي يتنافس في ارتفاع أو حرارة نقاط القوة والضعف القوة: دمج فريد بين الفسيولوجيا والتغذية، رسوم توضيحية ممتازة، شمول واسع، ومرجعية تاريخية في المجال. الضعف: حجم كبير وتفاصيل قد تتجاوز حاجة أخصائي التغذية في بعض الأقسام (الغوص، الفضاء)، وبعض التوصيات التغذوية تتأخر عن أحدث المواقف المتخصصة. أسئلة للتأمل بعد القراءة 1. لماذا يُعتبر \"التمرين في منطقة حرق الدهون\" نصيحة مضللة لمن يريد إنقاص وزنه؟ 2. مريض في العناية المركزة RQ لديه 1.1 — ماذا يخبرك ذلك عن تغذيته؟ 3. لاعب تنس يلعب مباراة 3 ساعات في الحر — أي أنظمة الطاقة يستخدم، وما خطة الترطيب والوقود؟ ماذا تقرأ بعده؟ Burke — Clinical Sports Nutrition لترجمة هذه الفسيولوجيا إلى خطط تغذية · Gropper لتعميق الأيض على المستوى الجزيئي · NSCA's Guide to Sport and Exercise Nutrition لربط التغذية ببرامج القوة والتكييف."}, {"i": 35, "group": "books", "tag": "مكتبة المراجع", "num": "5", "short": "Lee & Nieman — التقييم", "html": "<h1>Nutritional Assessment</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المؤلفان</strong></td><td>Robert D. Lee و David C. Nieman</td></tr><tr><td><strong>المستوى</strong></td><td>متوسط إلى متقدم</td></tr><tr><td><strong>الجمهور</strong></td><td>طلاب التغذية، أخصائيو التغذية الإكلينيكية والمجتمعية، الباحثون في الوبائيات الغذائية</td></tr><tr><td><strong>الطابع</strong></td><td>المرجع الأشمل لأدوات التقييم وحدودها</td></tr><tr><td><strong>الرفيق</strong></td><td>دليل جيب للتقييم (مثل Charney &amp; Malone)، ودليل ISAK للقياسات</td></tr></tbody></table></div>\n<h2>الفكرة المركزية</h2>\n<p>كل من يعمل في التغذية يجمع أرقامًا: وزن، طول، محيط، تحليل، سجل غذائي. قليلون <strong>يقيّمون</strong> فعلًا. الفرق بين الاثنين هو ما يعلّمه هذا الكتاب: أن تعرف حدود أداتك قبل أن تبني عليها استنتاجًا.</p>\n<p>السؤال الذي يطرحه الكتاب على كل أداة: <strong>ما مقدار الخطأ فيها؟ ومتى تعطيني رقمًا صحيحًا واستنتاجًا خاطئًا؟</strong> من يتقن هذا السؤال يتوقف عن قول \"نسبة الدهون عندك 23.4%\" بثقة زائفة، ويبدأ في قول \"نسبة الدهون في حدود 20–27%، والأهم أنها انخفضت مقارنة بالقياس الماضي بنفس الشروط\".</p>\n<h2>خريطة الكتاب</h2>\n<h3>الأساسيات</h3>\n<ul><li><strong>ما هو التقييم الغذائي؟</strong> مستوياته: الفرد، المجموعة، السكان. والفرق بين المسح (Screening) والتقييم (Assessment) والمراقبة (Surveillance).</li><li><strong>المعايير المرجعية:</strong> المرجعيات الغذائية (DRIs) ومتى تُستخدم كل قيمة، والأدلة الغذائية.</li><li><strong>الصدق والثبات:</strong> المفاهيم الإحصائية التي تحكم جودة أي أداة.</li></ul>\n<h3>التقييم الغذائي (Dietary Assessment)</h3>\n<ul><li>استرجاع 24 ساعة، سجل الطعام، استبيان تكرار الطعام، التاريخ الغذائي.</li><li><strong>مصادر الخطأ:</strong> التبليغ الناقص والزائد، الذاكرة، تقدير الحصص، تأثير المراقبة على السلوك، التباين بين الأيام.</li><li><strong>قواعد بيانات تركيب الأغذية:</strong> كيف بُنيت، وحدودها، ولماذا قد تختلف نتيجتان لنفس السجل.</li><li><strong>المؤشرات الحيوية للمدخول (Biomarkers):</strong> مثل الماء المزدوج الوسم لقياس الطاقة، ونيتروجين البول للبروتين.</li></ul>\n<h3>القياسات الجسمية (Anthropometry)</h3>\n<p>بروتوكولات القياس خطوة بخطوة: الوزن، الطول، الطول من الركبة (لمن لا يستطيع الوقوف)، المحيطات، ثنايا الجلد، أطوال الأطراف. ثم المؤشرات المشتقة: BMI، نسبة الخصر للورك، نسبة الخصر للطول، ومنحنيات النمو للأطفال.</p>\n<h3>تركيب الجسم</h3>\n<ul><li><strong>النماذج:</strong> نموذج المكونين (دهون + كتلة خالية)، الثلاثة، الأربعة، والمتعدد.</li><li><strong>الطرق:</strong> الوزن تحت الماء، إزاحة الهواء، DEXA، BIA، ثنايا الجلد، الماء الكلي بالنظائر، التصوير المقطعي والرنين.</li><li>مزايا وعيوب كل طريقة، وأيها يصلح للبحث وأيها للعيادة.</li></ul>\n<h3>التقييم الحيوي (Biochemical)</h3>\n<p>لكل مغذٍّ: أي تحليل يعكس المخزون وأيه يعكس المدخول الحديث، وما الذي يربك التفسير. البروتينات، الحديد، الفيتامينات، المعادن، الدهون، السكر.</p>\n<h3>التقييم الإكلينيكي</h3>\n<p>العلامات الجسدية لنقص المغذيات، التاريخ الطبي، الأدوية، وأدوات المسح المعتمدة.</p>\n<h3>التقييم في سياقات خاصة</h3>\n<p>الأمراض المزمنة، كبار السن، الأطفال، المرضى المقيمون في المستشفى، والتقييم المجتمعي والوبائي.</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. الصدق والثبات: الفرق الذي يغيّر كل شيء</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المفهوم</th><th>السؤال</th><th>مثال</th></tr></thead><tbody><tr><td><strong>الصدق (Validity)</strong></td><td>هل تقيس الأداة ما تدعي قياسه؟</td><td>هل BIA يقيس الدهون فعلًا أم الماء؟</td></tr><tr><td><strong>الثبات (Reliability)</strong></td><td>هل تعطي نفس النتيجة عند التكرار؟</td><td>هل يعطي القياس نفس الرقم مرتين؟</td></tr><tr><td><strong>الدقة (Accuracy)</strong></td><td>ما مدى قرب النتيجة من الحقيقة؟</td><td>الفرق بين DEXA والوزن تحت الماء</td></tr><tr><td><strong>الضبط (Precision)</strong></td><td>ما مدى تقارب النتائج المتكررة؟</td><td>تشتت قياسات ثنية الجلد</td></tr></tbody></table></div>\n<p>الأداة قد تكون <strong>ثابتة لكن غير صادقة</strong>: ميزان يزيد كيلوجرامين دائمًا يعطي رقمًا ثابتًا لكنه خاطئ. والعكس أسوأ: أداة صادقة في المتوسط لكن تشتتها كبير، فلا تصلح للحكم على فرد.</p>\n<h3>2. الخطأ التقني للقياس (TEM)</h3>\n<p>إذا قست ثنية جلد مرتين لنفس الشخص، لن تحصل على الرقم نفسه. الفرق بين القياسات المتكررة يُحسب كخطأ تقني. <strong>إذا كان خطؤك <span class=\"ltr\">±2</span> مم، فلا تستطيع الحكم على تغيّر أقل من ذلك.</strong></p>\n<p><strong>التطبيق:</strong> قبل أن تعلن لعميل أنه \"خسر دهونًا\"، اعرف خطأك أنت. القياس الذي تغيّر بأقل من هامش خطئك ليس تغيّرًا، بل ضجيج.</p>\n<h3>3. التبليغ الناقص قاعدة لا استثناء</h3>\n<p>الكتاب يعرض الأدلة من دراسات الماء المزدوج الوسم (المعيار الذهبي لقياس الطاقة المنفقة في الحياة الحرة): الناس يبلّغون عن مدخول أقل من الحقيقي بشكل منهجي، وبنسب أعلى لدى ذوي السمنة، والنساء، ومن يتبعون حمية.</p>\n<p><strong>ما يُحذف عادة:</strong> الوجبات الخفيفة، المشروبات، الزيوت والصلصات، الحلويات، والأكل \"بين الوجبات\".</p>\n<p><strong>الموقف المهني الصحيح:</strong> لا تحاكم العميل. حسّن طريقة الجمع (المرور المتعدد، صور الحصص، أسئلة عن المنسيات)، واعتمد <strong>النتيجة الموضوعية</strong> (تغيّر الوزن) كحَكَم نهائي بين المدخول المبلّغ والواقع.</p>\n<h3>4. التباين بين الأيام</h3>\n<p>يوم واحد لا يمثل النمط المعتاد لأي شخص. والأهم أن عدد الأيام اللازمة لتقدير دقيق <strong>يختلف حسب المغذي</strong>:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>المغذي</th><th>التباين اليومي</th><th>الأيام اللازمة تقريبًا لتقدير فردي معقول</th></tr></thead><tbody><tr><td>الطاقة</td><td>منخفض نسبيًا</td><td>أيام قليلة</td></tr><tr><td>البروتين والكربوهيدرات</td><td>متوسط</td><td>أسبوع تقريبًا</td></tr><tr><td>فيتامين A و C</td><td>مرتفع جدًا</td><td>أسابيع (لتركّزه في أطعمة لا تُؤكل يوميًا)</td></tr><tr><td>الكوليسترول</td><td>مرتفع</td><td>أسابيع</td></tr></tbody></table></div>\n<p>لهذا يصلح استرجاع 24 ساعة لتقدير متوسط <strong>مجموعة</strong>، لكنه لا يصلح للحكم على أن فردًا ما \"ناقص\" في فيتامين A.</p>\n<h3>5. نماذج تركيب الجسم وافتراضاتها</h3>\n<p><strong>نموذج المكونين</strong> يقسم الجسم إلى دهون وكتلة خالية من الدهون، ويفترض أن الكتلة الخالية <strong>ثابتة الكثافة والترطيب</strong> (نحو 73% ماء). هذا الافتراض ينهار في:</p>\n<ul><li><strong>الوذمة والاستسقاء:</strong> ماء زائد ← تُقدَّر الكتلة الخالية بأكثر من الحقيقة.</li><li><strong>الجفاف:</strong> العكس.</li><li><strong>الحمل والطفولة والشيخوخة:</strong> ترطيب وكثافة مختلفة.</li><li><strong>الرياضيون ذوو العظام الكثيفة:</strong> قد تُقدَّر الدهون بأقل من الحقيقة في الوزن تحت الماء.</li></ul>\n<p><strong>مقارنة عملية:</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>الطريقة</th><th>الدقة</th><th>التكلفة</th><th>للمتابعة الدورية</th></tr></thead><tbody><tr><td>DEXA</td><td>عالية</td><td>مرتفعة</td><td>ممتازة إن توفرت</td></tr><tr><td>الوزن تحت الماء</td><td>عالية</td><td>متوسطة، مرهقة</td><td>محدودة</td></tr><tr><td>ثنايا الجلد</td><td>متوسطة (تعتمد على المهارة)</td><td>منخفضة</td><td><strong>ممتازة بمجموع الثنايا</strong></td></tr><tr><td>BIA</td><td>منخفضة-متوسطة</td><td>منخفضة</td><td>جيدة بشروط ثابتة صارمة</td></tr><tr><td>المحيطات</td><td>منخفضة لنسبة الدهون</td><td>شبه مجانية</td><td>ممتازة لمحيط الخصر والخطر</td></tr></tbody></table></div>\n<h3>6. ما يعكسه التحليل فعلًا</h3>\n<p>السؤال الذي يجب أن تطرحه على كل تحليل: <strong>هل يعكس المخزون، أم المدخول الحديث، أم شيئًا آخر تمامًا؟</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>التحليل</th><th>ما يعكسه</th><th>ما يربكه</th></tr></thead><tbody><tr><td>ألبيومين</td><td>شدة المرض والالتهاب، لا التغذية</td><td>الالتهاب، السوائل، الكبد، الكلى</td></tr><tr><td>فيريتين المصل</td><td>مخزون الحديد</td><td>الالتهاب يرفعه كذبًا</td></tr><tr><td>فيتامين C في البلازما</td><td>المدخول الحديث</td><td>يتغير بسرعة مع الوجبات</td></tr><tr><td>فيتامين C في كرات الدم البيضاء</td><td>المخزون</td><td>—</td></tr><tr><td>فولات المصل</td><td>المدخول الحديث</td><td>—</td></tr><tr><td>فولات كرات الدم الحمراء</td><td>المخزون (آخر 3–4 أشهر)</td><td>—</td></tr><tr><td>الزنك في البلازما</td><td>ضعيف الحساسية</td><td>الالتهاب والوقت من آخر وجبة</td></tr><tr><td>25(OH) فيتامين D</td><td>المخزون</td><td>—</td></tr></tbody></table></div>\n<h3>7. المسح مقابل التقييم</h3>\n<ul><li><strong>المسح:</strong> سريع، يطبقه أي عضو في الفريق، هدفه تحديد من <strong>قد</strong> يكون معرضًا للخطر (MUST، NRS-2002، MNA-SF).</li><li><strong>التقييم:</strong> شامل، يجريه المتخصص، هدفه <strong>التشخيص</strong> وتحديد الشدة ووضع الخطة.</li></ul>\n<p>الخلط بينهما يقود إلى أحد خطأين: إما تقييم شامل لكل مريض (هدر للموارد)، أو الاكتفاء بالمسح وكأنه تشخيص.</p>\n<h2>أرقام يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الرقم</th></tr></thead><tbody><tr><td>فقد الوزن الخطِر</td><td>أكثر من 5% في شهر أو 10% في 6 أشهر</td></tr><tr><td>BMI لنقص الوزن</td><td>أقل من 18.5 (وعتبات أعلى لكبار السن غالبًا)</td></tr><tr><td>عتبات BMI الآسيوية</td><td>زيادة من 23، سمنة من 27.5</td></tr><tr><td>خطر محيط الخصر</td><td>أكثر من 102 سم رجال، 88 سم نساء (90/80 للآسيويين)</td></tr><tr><td>نسبة الخصر للطول</td><td>أقل من 0.5 هدف عام</td></tr><tr><td>ترطيب الكتلة الخالية</td><td>نحو 73%</td></tr><tr><td>فولات الكرات الحمراء</td><td>يعكس المخزون لنحو 120 يومًا (عمر الكرية)</td></tr><tr><td>نصف عمر الألبيومين</td><td>نحو 20 يومًا</td></tr><tr><td>نصف عمر البريألبيومين</td><td>نحو يومين</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — رقمان متناقضان:</strong> عميلة قاست نسبة الدهون على جهاز BIA في الصالة الرياضية صباح الإثنين فكانت 28%، ثم مساء الخميس بعد التمرين وشرب لترين ماء فكانت 24%. تسألك: \"خسرت 4% دهون في 3 أيام؟\"</p>\n<p><strong>التحليل:</strong> مستحيل فسيولوجيًا. BIA يقيس مقاومة الجسم للتيار، والماء يوصل التيار. بعد التمرين وشرب الماء تغير الترطيب وتوزيع السوائل، فانخفضت المقاومة، ففسّرها الجهاز بأنها كتلة خالية أكثر ودهون أقل. التغيّر في <strong>الماء</strong> لا في <strong>الدهون</strong>.</p>\n<p><strong>الموقف المهني:</strong> اشرح لها السبب بهدوء، واطلب منها القياس صباحًا صائمة بعد التبول، بنفس الجهاز ونفس الشروط، مرة كل أسبوعين — وقارن <strong>الاتجاه</strong> لا الرقم. والأفضل: أضف محيط الخصر كمؤشر موازٍ لا يتأثر بالترطيب.</p></blockquote>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>قراءة فصول الأنثروبومتري دون ممارسة.</strong> القياس مهارة يدوية؛ القراءة وحدها لا تصنعها.</li><li><strong>التعامل مع BMI كمؤشر تشخيصي فردي</strong> بدل كونه أداة مسح سكانية.</li><li><strong>استخدام RDA للحكم على نقص فرد.</strong> RDA هدف تخطيطي يغطي 97% من الناس؛ من يأخذ أقل منه ليس بالضرورة ناقصًا.</li><li><strong>إهمال فصل مصادر الخطأ</strong> لأنه \"نظري\". هو أهم فصل عملي في الكتاب.</li><li><strong>تحويل كل قياس إلى نسبة دهون</strong> بمعادلة تحمل خطأ <span class=\"ltr\">±3</span>–5%، بدل تتبع القياس الخام.</li></ul>\n<h2>كيف تذاكره: خطة سبعة أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق العملي</th></tr></thead><tbody><tr><td>1</td><td>المفاهيم والمرجعيات والصدق والثبات</td><td>قِس وزن 5 أشخاص على ميزانين وقارن</td></tr><tr><td>2</td><td>التقييم الغذائي ومصادر خطئه</td><td>طبّق استرجاع 24 ساعة بالمرور المتعدد على 3 أشخاص</td></tr><tr><td>3</td><td>قواعد البيانات والتباين اليومي</td><td>حلل نفس السجل بقاعدتي بيانات وقارن</td></tr><tr><td>4</td><td>الأنثروبومتري</td><td>قِس ثنايا جلد 5 أشخاص مرتين واحسب TEM خاصتك</td></tr><tr><td>5</td><td>تركيب الجسم</td><td>قارن نتائج طريقتين لنفس الشخص</td></tr><tr><td>6</td><td>التقييم الحيوي</td><td>لكل تحليل: هل يعكس مخزونًا أم مدخولًا؟ وما الذي يربكه؟</td></tr><tr><td>7</td><td>الإكلينيكي والمسح</td><td>طبّق MUST و MNA على حالات ورقية</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> الشمول، والتركيز الفريد على حدود الأدوات ومصادر الخطأ، والبروتوكولات العملية التفصيلية، والربط بين التقييم الفردي والسكاني.</p>\n<p><strong>الضعف:</strong> كثافة إحصائية قد تُثقل على من يريد بروتوكولًا سريعًا، وبعض الأدوات الحديثة (مثل معايير GLIM) قد تسبق الطبعة المتاحة لديك.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>لماذا لا يصلح استرجاع 24 ساعة لمرة واحدة للحكم على نقص فيتامين A لدى فرد، بينما يصلح لتقدير متوسط مجموعة؟</li><li>قِس خطأك التقني في ثنية جلد واحدة. ما أصغر تغيّر تستطيع الحكم عليه بثقة؟</li><li>مريض بوذمة واضحة ووزن ثابت — أي أدوات تركيب الجسم تضلّلك، وأيها تثق به؟</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>دليل ISAK للقياسات</strong> مع دورة تدريبية معتمدة إن كنت ستعتمد على ثنايا الجلد · <strong>دليل جيب للتقييم</strong> للاستخدام اليومي · <strong>معايير GLIM وإرشادات ESPEN</strong> لأحدث إطار لتشخيص سوء التغذية.</p>", "text": "Nutritional Assessment المؤلفان Robert D. Lee و David C. Nieman المستوى متوسط إلى متقدم الجمهور طلاب التغذية، أخصائيو التغذية الإكلينيكية والمجتمعية، الباحثون في الوبائيات الغذائية الطابع المرجع الأشمل لأدوات التقييم وحدودها الرفيق دليل جيب للتقييم (مثل Charney & Malone)، ودليل ISAK للقياسات الفكرة المركزية كل من يعمل في التغذية يجمع أرقامًا: وزن، طول، محيط، تحليل، سجل غذائي. قليلون يقيّمون فعلًا. الفرق بين الاثنين هو ما يعلّمه هذا الكتاب: أن تعرف حدود أداتك قبل أن تبني عليها استنتاجًا. السؤال الذي يطرحه الكتاب على كل أداة: ما مقدار الخطأ فيها؟ ومتى تعطيني رقمًا صحيحًا واستنتاجًا خاطئًا؟ من يتقن هذا السؤال يتوقف عن قول \"نسبة الدهون عندك 23.4%\" بثقة زائفة، ويبدأ في قول \"نسبة الدهون في حدود 20–27%، والأهم أنها انخفضت مقارنة بالقياس الماضي بنفس الشروط\". خريطة الكتاب الأساسيات ما هو التقييم الغذائي؟ مستوياته: الفرد، المجموعة، السكان. والفرق بين المسح (Screening) والتقييم (Assessment) والمراقبة (Surveillance). المعايير المرجعية: المرجعيات الغذائية (DRIs) ومتى تُستخدم كل قيمة، والأدلة الغذائية. الصدق والثبات: المفاهيم الإحصائية التي تحكم جودة أي أداة. التقييم الغذائي (Dietary Assessment) استرجاع 24 ساعة، سجل الطعام، استبيان تكرار الطعام، التاريخ الغذائي. مصادر الخطأ: التبليغ الناقص والزائد، الذاكرة، تقدير الحصص، تأثير المراقبة على السلوك، التباين بين الأيام. قواعد بيانات تركيب الأغذية: كيف بُنيت، وحدودها، ولماذا قد تختلف نتيجتان لنفس السجل. المؤشرات الحيوية للمدخول (Biomarkers): مثل الماء المزدوج الوسم لقياس الطاقة، ونيتروجين البول للبروتين. القياسات الجسمية (Anthropometry) بروتوكولات القياس خطوة بخطوة: الوزن، الطول، الطول من الركبة (لمن لا يستطيع الوقوف)، المحيطات، ثنايا الجلد، أطوال الأطراف. ثم المؤشرات المشتقة: BMI، نسبة الخصر للورك، نسبة الخصر للطول، ومنحنيات النمو للأطفال. تركيب الجسم النماذج: نموذج المكونين (دهون + كتلة خالية)، الثلاثة، الأربعة، والمتعدد. الطرق: الوزن تحت الماء، إزاحة الهواء، DEXA، BIA، ثنايا الجلد، الماء الكلي بالنظائر، التصوير المقطعي والرنين. مزايا وعيوب كل طريقة، وأيها يصلح للبحث وأيها للعيادة. التقييم الحيوي (Biochemical) لكل مغذٍّ: أي تحليل يعكس المخزون وأيه يعكس المدخول الحديث، وما الذي يربك التفسير. البروتينات، الحديد، الفيتامينات، المعادن، الدهون، السكر. التقييم الإكلينيكي العلامات الجسدية لنقص المغذيات، التاريخ الطبي، الأدوية، وأدوات المسح المعتمدة. التقييم في سياقات خاصة الأمراض المزمنة، كبار السن، الأطفال، المرضى المقيمون في المستشفى، والتقييم المجتمعي والوبائي. المفاهيم المحورية بالتفصيل 1. الصدق والثبات: الفرق الذي يغيّر كل شيء المفهوم السؤال مثال الصدق (Validity) هل تقيس الأداة ما تدعي قياسه؟ هل BIA يقيس الدهون فعلًا أم الماء؟ الثبات (Reliability) هل تعطي نفس النتيجة عند التكرار؟ هل يعطي القياس نفس الرقم مرتين؟ الدقة (Accuracy) ما مدى قرب النتيجة من الحقيقة؟ الفرق بين DEXA والوزن تحت الماء الضبط (Precision) ما مدى تقارب النتائج المتكررة؟ تشتت قياسات ثنية الجلد الأداة قد تكون ثابتة لكن غير صادقة : ميزان يزيد كيلوجرامين دائمًا يعطي رقمًا ثابتًا لكنه خاطئ. والعكس أسوأ: أداة صادقة في المتوسط لكن تشتتها كبير، فلا تصلح للحكم على فرد. 2. الخطأ التقني للقياس (TEM) إذا قست ثنية جلد مرتين لنفس الشخص، لن تحصل على الرقم نفسه. الفرق بين القياسات المتكررة يُحسب كخطأ تقني. إذا كان خطؤك ±2 مم، فلا تستطيع الحكم على تغيّر أقل من ذلك. التطبيق: قبل أن تعلن لعميل أنه \"خسر دهونًا\"، اعرف خطأك أنت. القياس الذي تغيّر بأقل من هامش خطئك ليس تغيّرًا، بل ضجيج. 3. التبليغ الناقص قاعدة لا استثناء الكتاب يعرض الأدلة من دراسات الماء المزدوج الوسم (المعيار الذهبي لقياس الطاقة المنفقة في الحياة الحرة): الناس يبلّغون عن مدخول أقل من الحقيقي بشكل منهجي، وبنسب أعلى لدى ذوي السمنة، والنساء، ومن يتبعون حمية. ما يُحذف عادة: الوجبات الخفيفة، المشروبات، الزيوت والصلصات، الحلويات، والأكل \"بين الوجبات\". الموقف المهني الصحيح: لا تحاكم العميل. حسّن طريقة الجمع (المرور المتعدد، صور الحصص، أسئلة عن المنسيات)، واعتمد النتيجة الموضوعية (تغيّر الوزن) كحَكَم نهائي بين المدخول المبلّغ والواقع. 4. التباين بين الأيام يوم واحد لا يمثل النمط المعتاد لأي شخص. والأهم أن عدد الأيام اللازمة لتقدير دقيق يختلف حسب المغذي : المغذي التباين اليومي الأيام اللازمة تقريبًا لتقدير فردي معقول الطاقة منخفض نسبيًا أيام قليلة البروتين والكربوهيدرات متوسط أسبوع تقريبًا فيتامين A و C مرتفع جدًا أسابيع (لتركّزه في أطعمة لا تُؤكل يوميًا) الكوليسترول مرتفع أسابيع لهذا يصلح استرجاع 24 ساعة لتقدير متوسط مجموعة ، لكنه لا يصلح للحكم على أن فردًا ما \"ناقص\" في فيتامين A. 5. نماذج تركيب الجسم وافتراضاتها نموذج المكونين يقسم الجسم إلى دهون وكتلة خالية من الدهون، ويفترض أن الكتلة الخالية ثابتة الكثافة والترطيب (نحو 73% ماء). هذا الافتراض ينهار في: الوذمة والاستسقاء: ماء زائد ← تُقدَّر الكتلة الخالية بأكثر من الحقيقة. الجفاف: العكس. الحمل والطفولة والشيخوخة: ترطيب وكثافة مختلفة. الرياضيون ذوو العظام الكثيفة: قد تُقدَّر الدهون بأقل من الحقيقة في الوزن تحت الماء. مقارنة عملية: الطريقة الدقة التكلفة للمتابعة الدورية DEXA عالية مرتفعة ممتازة إن توفرت الوزن تحت الماء عالية متوسطة، مرهقة محدودة ثنايا الجلد متوسطة (تعتمد على المهارة) منخفضة ممتازة بمجموع الثنايا BIA منخفضة متوسطة منخفضة جيدة بشروط ثابتة صارمة المحيطات منخفضة لنسبة الدهون شبه مجانية ممتازة لمحيط الخصر والخطر 6. ما يعكسه التحليل فعلًا السؤال الذي يجب أن تطرحه على كل تحليل: هل يعكس المخزون، أم المدخول الحديث، أم شيئًا آخر تمامًا؟ التحليل ما يعكسه ما يربكه ألبيومين شدة المرض والالتهاب، لا التغذية الالتهاب، السوائل، الكبد، الكلى فيريتين المصل مخزون الحديد الالتهاب يرفعه كذبًا فيتامين C في البلازما المدخول الحديث يتغير بسرعة مع الوجبات فيتامين C في كرات الدم البيضاء المخزون — فولات المصل المدخول الحديث — فولات كرات الدم الحمراء المخزون (آخر 3–4 أشهر) — الزنك في البلازما ضعيف الحساسية الالتهاب والوقت من آخر وجبة 25(OH) فيتامين D المخزون — 7. المسح مقابل التقييم المسح: سريع، يطبقه أي عضو في الفريق، هدفه تحديد من قد يكون معرضًا للخطر (MUST، NRS 2002، MNA SF). التقييم: شامل، يجريه المتخصص، هدفه التشخيص وتحديد الشدة ووضع الخطة. الخلط بينهما يقود إلى أحد خطأين: إما تقييم شامل لكل مريض (هدر للموارد)، أو الاكتفاء بالمسح وكأنه تشخيص. أرقام يجب أن تخرج بها الموضوع الرقم فقد الوزن الخطِر أكثر من 5% في شهر أو 10% في 6 أشهر BMI لنقص الوزن أقل من 18.5 (وعتبات أعلى لكبار السن غالبًا) عتبات BMI الآسيوية زيادة من 23، سمنة من 27.5 خطر محيط الخصر أكثر من 102 سم رجال، 88 سم نساء (90/80 للآسيويين) نسبة الخصر للطول أقل من 0.5 هدف عام ترطيب الكتلة الخالية نحو 73% فولات الكرات الحمراء يعكس المخزون لنحو 120 يومًا (عمر الكرية) نصف عمر الألبيومين نحو 20 يومًا نصف عمر البريألبيومين نحو يومين مثال تطبيقي بأسلوب الكتاب مثال — رقمان متناقضان: عميلة قاست نسبة الدهون على جهاز BIA في الصالة الرياضية صباح الإثنين فكانت 28%، ثم مساء الخميس بعد التمرين وشرب لترين ماء فكانت 24%. تسألك: \"خسرت 4% دهون في 3 أيام؟\" التحليل: مستحيل فسيولوجيًا. BIA يقيس مقاومة الجسم للتيار، والماء يوصل التيار. بعد التمرين وشرب الماء تغير الترطيب وتوزيع السوائل، فانخفضت المقاومة، ففسّرها الجهاز بأنها كتلة خالية أكثر ودهون أقل. التغيّر في الماء لا في الدهون . الموقف المهني: اشرح لها السبب بهدوء، واطلب منها القياس صباحًا صائمة بعد التبول، بنفس الجهاز ونفس الشروط، مرة كل أسبوعين — وقارن الاتجاه لا الرقم. والأفضل: أضف محيط الخصر كمؤشر موازٍ لا يتأثر بالترطيب. أخطاء شائعة عند قراءة الكتاب قراءة فصول الأنثروبومتري دون ممارسة. القياس مهارة يدوية؛ القراءة وحدها لا تصنعها. التعامل مع BMI كمؤشر تشخيصي فردي بدل كونه أداة مسح سكانية. استخدام RDA للحكم على نقص فرد. RDA هدف تخطيطي يغطي 97% من الناس؛ من يأخذ أقل منه ليس بالضرورة ناقصًا. إهمال فصل مصادر الخطأ لأنه \"نظري\". هو أهم فصل عملي في الكتاب. تحويل كل قياس إلى نسبة دهون بمعادلة تحمل خطأ ±3–5%، بدل تتبع القياس الخام. كيف تذاكره: خطة سبعة أسابيع الأسبوع المحتوى التطبيق العملي 1 المفاهيم والمرجعيات والصدق والثبات قِس وزن 5 أشخاص على ميزانين وقارن 2 التقييم الغذائي ومصادر خطئه طبّق استرجاع 24 ساعة بالمرور المتعدد على 3 أشخاص 3 قواعد البيانات والتباين اليومي حلل نفس السجل بقاعدتي بيانات وقارن 4 الأنثروبومتري قِس ثنايا جلد 5 أشخاص مرتين واحسب TEM خاصتك 5 تركيب الجسم قارن نتائج طريقتين لنفس الشخص 6 التقييم الحيوي لكل تحليل: هل يعكس مخزونًا أم مدخولًا؟ وما الذي يربكه؟ 7 الإكلينيكي والمسح طبّق MUST و MNA على حالات ورقية نقاط القوة والضعف القوة: الشمول، والتركيز الفريد على حدود الأدوات ومصادر الخطأ، والبروتوكولات العملية التفصيلية، والربط بين التقييم الفردي والسكاني. الضعف: كثافة إحصائية قد تُثقل على من يريد بروتوكولًا سريعًا، وبعض الأدوات الحديثة (مثل معايير GLIM) قد تسبق الطبعة المتاحة لديك. أسئلة للتأمل بعد القراءة 1. لماذا لا يصلح استرجاع 24 ساعة لمرة واحدة للحكم على نقص فيتامين A لدى فرد، بينما يصلح لتقدير متوسط مجموعة؟ 2. قِس خطأك التقني في ثنية جلد واحدة. ما أصغر تغيّر تستطيع الحكم عليه بثقة؟ 3. مريض بوذمة واضحة ووزن ثابت — أي أدوات تركيب الجسم تضلّلك، وأيها تثق به؟ ماذا تقرأ بعده؟ دليل ISAK للقياسات مع دورة تدريبية معتمدة إن كنت ستعتمد على ثنايا الجلد · دليل جيب للتقييم للاستخدام اليومي · معايير GLIM وإرشادات ESPEN لأحدث إطار لتشخيص سوء التغذية."}, {"i": 36, "group": "books", "tag": "مكتبة المراجع", "num": "6", "short": "Nelms — العلاج والفسيولوجيا", "html": "<h1>Nutrition Therapy and Pathophysiology</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المؤلفان</strong></td><td>Marcia Nelms و Kathryn P. Sucher (بمشاركة مؤلفين آخرين في بعض الطبعات)</td></tr><tr><td><strong>المستوى</strong></td><td>متوسط</td></tr><tr><td><strong>الجمهور</strong></td><td>طلاب التغذية الإكلينيكية، من يستعد للتدريب الميداني، من يريد التعلّم بالحالات</td></tr><tr><td><strong>الطابع</strong></td><td>كتاب تعليمي يربط آلية المرض بالتدخل الغذائي</td></tr><tr><td><strong>العلاقة بـ Krause</strong></td><td>Nelms أفضل للتعلّم، Krause أفضل كمرجع — والاثنان يكمّلان بعضهما</td></tr></tbody></table></div>\n<h2>ما الذي يميّزه؟</h2>\n<p>الفرق بين أخصائي يحفظ وأخصائي يفهم يظهر عند أول حالة لم يقرأ عنها. من حفظ \"مريض الكلى: قيّد البوتاسيوم\" يقف عاجزًا أمام مريض كلى بوتاسيومه <strong>منخفض</strong>. ومن فهم <strong>لماذا</strong> نقيّد البوتاسيوم (الكلية المتضررة تعجز عن إطراحه، وارتفاعه يربك النشاط الكهربائي للقلب) يعرف فورًا أن التقييد يتبع التحليل لا التشخيص.</p>\n<p>هذا الكتاب مبني بالكامل على هذه الفكرة: كل فصل يبدأ بالفسيولوجيا الطبيعية، ثم يشرح ما يعطبه المرض، ثم <strong>يشتق</strong> التدخل الغذائي من هذا العطب. والنتيجة معرفة قابلة للنقل إلى حالات جديدة.</p>\n<h2>خريطة الكتاب</h2>\n<h3>القسم التمهيدي</h3>\n<ul><li><strong>عملية الرعاية التغذوية</strong> وصياغة التشخيص التغذوي.</li><li><strong>التقييم التغذوي</strong> في السياق الإكلينيكي.</li><li><strong>الوراثة والتغذية:</strong> كيف تؤثر الجينات على الاحتياج والاستجابة.</li><li><strong>الالتهاب والاستجابة الأيضية للإجهاد:</strong> الفصل المفتاح الذي يفسر سلوك الجسم في كل مرض حاد.</li><li><strong>تفاعلات الدواء والغذاء</strong> والمكملات العشبية.</li></ul>\n<h3>فصول الأجهزة (بقالب موحّد)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الفصل</th><th>ما يُشتق من الآلية</th></tr></thead><tbody><tr><td><strong>الجهاز الهضمي العلوي</strong></td><td>الارتجاع، القرحة، خزل المعدة، جراحات المعدة ومتلازمة الإغراق</td></tr><tr><td><strong>الجهاز الهضمي السفلي</strong></td><td>سوء الامتصاص، السيلياك، الأمعاء الالتهابية، القولون العصبي، الأمعاء القصيرة</td></tr><tr><td><strong>الكبد والمرارة والبنكرياس</strong></td><td>الكبد الدهني، التليف والاستسقاء والاعتلال الدماغي، التهاب البنكرياس</td></tr><tr><td><strong>القلب والأوعية</strong></td><td>تصلب الشرايين، دهون الدم، ارتفاع الضغط، قصور القلب</td></tr><tr><td><strong>الغدد الصماء</strong></td><td>السكري بأنواعه ومضاعفاته، أمراض الغدة الدرقية</td></tr><tr><td><strong>الكلى</strong></td><td>الإصابة الحادة، المرض المزمن، الغسيل، الزراعة، الحصوات</td></tr><tr><td><strong>الرئة</strong></td><td>الانسداد الرئوي المزمن، التليف الكيسي، الفشل التنفسي</td></tr><tr><td><strong>الأعصاب</strong></td><td>السكتة، الإصابات الدماغية، الأمراض التنكسية، عسر البلع</td></tr><tr><td><strong>السرطان</strong></td><td>الدنف، آثار العلاج، إدارة الأعراض</td></tr><tr><td><strong>الأمراض الحرجة</strong></td><td>الإنتان، الرضّة، الحروق، الدعم التغذوي</td></tr><tr><td><strong>فقر الدم</strong></td><td>أنواعه وأسبابه الغذائية وغير الغذائية</td></tr><tr><td><strong>العدوى والمناعة</strong></td><td>HIV وغيرها من الحالات المستهلكة</td></tr></tbody></table></div>\n<h3>القالب الموحّد لكل فصل</h3>\n<ol><li><strong>التشريح والفسيولوجيا الطبيعية</strong> — ما الذي يفعله العضو حين يعمل.</li><li><strong>الفسيولوجيا المرضية</strong> — ما الذي يتعطل وكيف.</li><li><strong>التشخيص والعلاج الطبي</strong> — بما فيه الأدوية الشائعة.</li><li><strong>التقييم التغذوي</strong> — ما الذي تبحث عنه تحديدًا في هذا المرض.</li><li><strong>التدخل التغذوي</strong> — مشتقًا من الخطوة الثانية.</li><li><strong>دراسة حالة</strong> بأسئلة متدرجة.</li></ol>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. الاستجابة الأيضية للإجهاد</h3>\n<p>أهم فصل تمهيدي، لأنه يفسر لماذا يتصرف المريض الحاد بطريقة تختلف تمامًا عن الجائع البسيط.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>المرحلة</th><th>التوقيت</th><th>الأيض</th><th>الهرمونات</th><th>الدلالة التغذوية</th></tr></thead><tbody><tr><td><strong>الانحسار (Ebb)</strong></td><td>الساعات الأولى</td><td>منخفض، تروية ضعيفة</td><td>ارتفاع الكاتيكولامينات</td><td>الأولوية للإنعاش لا للتغذية</td></tr><tr><td><strong>التدفق (Flow)</strong></td><td>أيام إلى أسابيع</td><td>فرط أيض وهدم شديد</td><td>كورتيزول، جلوكاجون، سيتوكينات</td><td>احتياج بروتين مرتفع، مقاومة للإنسولين</td></tr><tr><td><strong>التعافي</strong></td><td>أسابيع إلى أشهر</td><td>ابتناء تدريجي</td><td>عودة التوازن</td><td>إعادة بناء الكتلة</td></tr></tbody></table></div>\n<p><strong>الفرق الجوهري عن الجوع البسيط:</strong> الجائع البسيط
