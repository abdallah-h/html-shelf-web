 يتكيف بخفض أيضه وحفظ بروتينه. المريض المجهَد <strong>يرفع</strong> أيضه و<strong>يهدم</strong> بروتينه بعنف رغم التغذية — لأن الهدم مدفوع هرمونيًا والتهابيًا، لا بنقص الطعام. لهذا لا تستطيع التغذية وحدها إيقاف فقد العضل في المرحلة الحادة؛ هي تخففه فقط.</p>\n<h3>2. الالتهاب كمربك أكبر</h3>\n<p>يعيد الكتاب هذه الفكرة في كل فصل تقريبًا. الالتهاب:</p>\n<ul><li><strong>يخفض</strong> الألبيومين والبريألبيومين والترانسفيرين (يُعاد توجيه الكبد لإنتاج بروتينات الطور الحاد).</li><li><strong>يرفع</strong> الفيريتين و CRP.</li><li><strong>يزيد</strong> الهدم العضلي.</li><li><strong>يقلل</strong> الشهية.</li><li><strong>يربك</strong> امتصاص الحديد والزنك.</li></ul>\n<p><strong>القاعدة العملية:</strong> لا تفسّر أي مؤشر تغذوي بروتيني أو معدني دون أن تعرف حالة الالتهاب.</p>\n<h3>3. الدنف مقابل الجوع البسيط</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الخاصية</th><th>الجوع البسيط</th><th>الدنف</th></tr></thead><tbody><tr><td>السبب</td><td>نقص الطعام</td><td>المرض والالتهاب</td></tr><tr><td>الأيض</td><td>منخفض (تكيّف)</td><td>مرتفع أو غير منتظم</td></tr><tr><td>فقد العضل</td><td>متأخر (الجسم يحفظه)</td><td>مبكر وشديد</td></tr><tr><td>الاستجابة للتغذية</td><td>ممتازة</td><td>جزئية ومحدودة</td></tr><tr><td>العلاج</td><td>التغذية</td><td>التغذية + علاج المرض + أحيانًا تدخل دوائي ونشاط</td></tr></tbody></table></div>\n<h3>4. الاشتقاق في الكلى</h3>\n<p>مثال نموذجي لطريقة الكتاب:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>ما يعطبه المرض</th><th>النتيجة</th><th>التدخل المشتق</th></tr></thead><tbody><tr><td>انخفاض الترشيح</td><td>تراكم نواتج البروتين (اليوريا)</td><td>تقييد بروتين معتدل قبل الغسيل</td></tr><tr><td>عجز إطراح البوتاسيوم</td><td>ارتفاعه وخطر على القلب</td><td>تقييد <strong>حسب التحليل</strong></td></tr><tr><td>عجز إطراح الفوسفور</td><td>ارتفاعه ← سحب كالسيوم من العظم</td><td>تقييد الفوسفور، خصوصًا المضاف</td></tr><tr><td>نقص تكوين الإريثروبويتين</td><td>فقر دم</td><td>الحديد والأدوية المحفّزة</td></tr><tr><td>نقص تنشيط فيتامين D</td><td>اضطراب الكالسيوم والعظم</td><td>فيتامين D النشط بقرار طبي</td></tr><tr><td>احتباس الصوديوم والماء</td><td>ضغط ووذمة</td><td>تقييد الصوديوم والسوائل</td></tr><tr><td>فقد أحماض أمينية أثناء الغسيل</td><td>زيادة الاحتياج</td><td><strong>رفع</strong> البروتين بعد بدء الغسيل</td></tr></tbody></table></div>\n<p>لاحظ كيف أن البروتين <strong>يُقيَّد</strong> قبل الغسيل و<strong>يُرفع</strong> بعده — تناقض ظاهري يزول تمامًا حين تفهم الآلية.</p>\n<h3>5. الاشتقاق في الكبد</h3>\n<p>حين يتليف الكبد يفقد قدرته على تخزين الجليكوجين، فيدخل المريض حالة \"الصيام المتسارع\": بعد ليلة واحدة دون طعام يبدأ في هدم عضله كما يفعل الشخص السليم بعد أيام. <strong>التدخل المشتق:</strong> وجبة ليلية غنية بالكربوهيدرات لتقصير فترة الصيام، ووجبات متكررة نهارًا، وبروتين كافٍ لا مقيّد — لأن العضل هو ما يتآكل.</p>\n<h3>6. قيمة دراسات الحالة</h3>\n<p>هي جوهر الكتاب. كل حالة تأتي ببيانات مريض كاملة (تاريخ، قياسات، تحاليل، أدوية، تاريخ غذائي)، ثم أسئلة تقودك عبر:</p>\n<ol><li>تفسير البيانات وتحديد غير الطبيعي.</li><li>ربط غير الطبيعي بالفسيولوجيا المرضية.</li><li>حساب الاحتياجات.</li><li>صياغة تشخيص أو أكثر بصيغة PES.</li><li>اقتراح تدخل لكل تشخيص.</li><li>تحديد مؤشرات المتابعة.</li></ol>\n<p><strong>القاعدة:</strong> حلّها كتابةً قبل النظر في أي إجابة. قراءتها فقط تهدر نصف قيمة الكتاب.</p>\n<h2>أرقام يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الرقم</th></tr></thead><tbody><tr><td>البروتين في الكلى قبل الغسيل</td><td>0.55–0.8 جم/كجم</td></tr><tr><td>البروتين مع الغسيل الدموي</td><td>1.0–1.2 جم/كجم</td></tr><tr><td>البروتين مع الغسيل البريتوني</td><td>1.2–1.3 جم/كجم</td></tr><tr><td>البروتين في تليّف الكبد</td><td>1.2–1.5 جم/كجم</td></tr><tr><td>الوجبة الليلية في التليف</td><td>نحو 50 جم كربوهيدرات</td></tr><tr><td>الصوديوم في الاستسقاء</td><td>أقل من 2000 مجم</td></tr><tr><td>البروتين في الحروق</td><td>1.5–2.0 جم/كجم أو أكثر</td></tr><tr><td>ICR التقديرية</td><td>500 ÷ الجرعة اليومية الكلية</td></tr><tr><td>ISF التقديرية</td><td>1800 ÷ الجرعة اليومية الكلية</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — مريض تليّف مع استسقاء:</strong> رجل 58 سنة، وزنه 82 كجم (الجاف المقدّر 74 كجم)، صوديوم 129، ألبيومين 2.5، أمونيا مرتفعة قليلًا، يأكل وجبتين فقط يوميًا، وقال له أحدهم أن \"يقلل البروتين لأنه يضر الكبد\".</p>\n<p><strong>الاشتقاق خطوة بخطوة:</strong></p>\n<ol><li>الوزن الفعلي مضلل بسبب الاستسقاء ← الحساب على <strong>الوزن الجاف 74 كجم</strong>.</li><li>الكبد المتليف لا يخزن جليكوجين كافيًا ← وجبتان يوميًا تعني ساعات طويلة من هدم العضل ← <strong>وجبات متكررة + وجبة ليلية</strong>.</li><li>تقييد البروتين يسرّع فقد العضل، والعضل يساعد على التخلص من الأمونيا ← <strong>بروتين 1.2–1.5 × 74 ≈ 89–111 جم</strong>، مع تفضيل مصادر نباتية وألبان.</li><li>الاستسقاء = احتباس صوديوم وماء ← <strong>صوديوم أقل من 2000 مجم</strong>.</li><li>الصوديوم المنخفض في الدم هنا <strong>تخفيفي</strong> (ماء زائد) ← لا تضف ملحًا؛ يُدار بتقييد السوائل بقرار طبي.</li><li>الطاقة 30–35 × 74 ≈ 2200–2600 kcal.</li></ol>\n<p><strong>التشخيص التغذوي:</strong> مدخول بروتين وطاقة غير كافٍ <strong>مرتبط بـ</strong> معتقدات غذائية خاطئة عن البروتين وقلة عدد الوجبات <strong>كما يتضح من</strong> تناول وجبتين يوميًا وتجنّب البروتين ونقص الكتلة العضلية في الفحص.</p></blockquote>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>قراءة دراسات الحالة دون حلها.</strong> أكبر هدر لقيمة الكتاب.</li><li><strong>القفز إلى قسم \"التدخل\"</strong> دون قراءة الفسيولوجيا المرضية — فتعود للحفظ.</li><li><strong>تجاهل الفصل التمهيدي عن الالتهاب والإجهاد.</strong> هو المفتاح لفهم نصف الفصول التالية.</li><li><strong>التعامل معه كمرجع شامل</strong> بدل كتاب تعليمي — للمرجعية الشاملة استخدم Krause.</li></ul>\n<h2>كيف تذاكره: خطة تسعة أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>NCP والتقييم والالتهاب والإجهاد</td><td>ارسم مراحل الاستجابة للإجهاد ودلالاتها</td></tr><tr><td>2</td><td>الجهاز الهضمي العلوي</td><td>حالة الفصل كتابةً</td></tr><tr><td>3</td><td>الجهاز الهضمي السفلي</td><td>حالة الفصل + اشتقاق تدخل الأمعاء القصيرة</td></tr><tr><td>4</td><td>الكبد والبنكرياس</td><td>حالة الفصل + جدول اشتقاق للتليف</td></tr><tr><td>5</td><td>القلب</td><td>حالة الفصل</td></tr><tr><td>6</td><td>السكري والغدد</td><td>حالة الفصل + حساب ICR/ISF</td></tr><tr><td>7</td><td>الكلى</td><td>جدول الاشتقاق الكامل + حالة الفصل</td></tr><tr><td>8</td><td>الرئة والأعصاب</td><td>حالتا الفصلين</td></tr><tr><td>9</td><td>السرطان والحرجة</td><td>حالة معقدة متعددة الأجهزة</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> الربط الصريح بين الآلية والتدخل، دراسات حالة تعليمية ممتازة، قالب موحد يسهّل المقارنة، ومستوى مناسب للطالب.</p>\n<p><strong>الضعف:</strong> أقل شمولًا من Krause كمرجع، توجه أمريكي في الوحدات والأنظمة، وبعض التوصيات تحتاج مقارنة بالإرشادات المحدّثة.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>لماذا يُقيَّد البروتين قبل الغسيل الكلوي ويُرفع بعده؟ اشرح دون الرجوع للكتاب.</li><li>لماذا لا يستطيع مريض الإنتان الحفاظ على عضله حتى مع تغذية كاملة؟</li><li>مريض كلى بوتاسيومه 3.2 — هل تقيّد البوتاسيوم؟ ولماذا؟</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Krause</strong> كمرجع دائم بجانبك · <strong>ASPEN Core Curriculum</strong> للدعم التغذوي المتخصص · <strong>إرشادات KDIGO و ESPEN و ADA</strong> للأرقام المحدّثة.</p>", "text": "Nutrition Therapy and Pathophysiology المؤلفان Marcia Nelms و Kathryn P. Sucher (بمشاركة مؤلفين آخرين في بعض الطبعات) المستوى متوسط الجمهور طلاب التغذية الإكلينيكية، من يستعد للتدريب الميداني، من يريد التعلّم بالحالات الطابع كتاب تعليمي يربط آلية المرض بالتدخل الغذائي العلاقة بـ Krause Nelms أفضل للتعلّم، Krause أفضل كمرجع — والاثنان يكمّلان بعضهما ما الذي يميّزه؟ الفرق بين أخصائي يحفظ وأخصائي يفهم يظهر عند أول حالة لم يقرأ عنها. من حفظ \"مريض الكلى: قيّد البوتاسيوم\" يقف عاجزًا أمام مريض كلى بوتاسيومه منخفض . ومن فهم لماذا نقيّد البوتاسيوم (الكلية المتضررة تعجز عن إطراحه، وارتفاعه يربك النشاط الكهربائي للقلب) يعرف فورًا أن التقييد يتبع التحليل لا التشخيص. هذا الكتاب مبني بالكامل على هذه الفكرة: كل فصل يبدأ بالفسيولوجيا الطبيعية، ثم يشرح ما يعطبه المرض، ثم يشتق التدخل الغذائي من هذا العطب. والنتيجة معرفة قابلة للنقل إلى حالات جديدة. خريطة الكتاب القسم التمهيدي عملية الرعاية التغذوية وصياغة التشخيص التغذوي. التقييم التغذوي في السياق الإكلينيكي. الوراثة والتغذية: كيف تؤثر الجينات على الاحتياج والاستجابة. الالتهاب والاستجابة الأيضية للإجهاد: الفصل المفتاح الذي يفسر سلوك الجسم في كل مرض حاد. تفاعلات الدواء والغذاء والمكملات العشبية. فصول الأجهزة (بقالب موحّد) الفصل ما يُشتق من الآلية الجهاز الهضمي العلوي الارتجاع، القرحة، خزل المعدة، جراحات المعدة ومتلازمة الإغراق الجهاز الهضمي السفلي سوء الامتصاص، السيلياك، الأمعاء الالتهابية، القولون العصبي، الأمعاء القصيرة الكبد والمرارة والبنكرياس الكبد الدهني، التليف والاستسقاء والاعتلال الدماغي، التهاب البنكرياس القلب والأوعية تصلب الشرايين، دهون الدم، ارتفاع الضغط، قصور القلب الغدد الصماء السكري بأنواعه ومضاعفاته، أمراض الغدة الدرقية الكلى الإصابة الحادة، المرض المزمن، الغسيل، الزراعة، الحصوات الرئة الانسداد الرئوي المزمن، التليف الكيسي، الفشل التنفسي الأعصاب السكتة، الإصابات الدماغية، الأمراض التنكسية، عسر البلع السرطان الدنف، آثار العلاج، إدارة الأعراض الأمراض الحرجة الإنتان، الرضّة، الحروق، الدعم التغذوي فقر الدم أنواعه وأسبابه الغذائية وغير الغذائية العدوى والمناعة HIV وغيرها من الحالات المستهلكة القالب الموحّد لكل فصل 1. التشريح والفسيولوجيا الطبيعية — ما الذي يفعله العضو حين يعمل. 2. الفسيولوجيا المرضية — ما الذي يتعطل وكيف. 3. التشخيص والعلاج الطبي — بما فيه الأدوية الشائعة. 4. التقييم التغذوي — ما الذي تبحث عنه تحديدًا في هذا المرض. 5. التدخل التغذوي — مشتقًا من الخطوة الثانية. 6. دراسة حالة بأسئلة متدرجة. المفاهيم المحورية بالتفصيل 1. الاستجابة الأيضية للإجهاد أهم فصل تمهيدي، لأنه يفسر لماذا يتصرف المريض الحاد بطريقة تختلف تمامًا عن الجائع البسيط. المرحلة التوقيت الأيض الهرمونات الدلالة التغذوية الانحسار (Ebb) الساعات الأولى منخفض، تروية ضعيفة ارتفاع الكاتيكولامينات الأولوية للإنعاش لا للتغذية التدفق (Flow) أيام إلى أسابيع فرط أيض وهدم شديد كورتيزول، جلوكاجون، سيتوكينات احتياج بروتين مرتفع، مقاومة للإنسولين التعافي أسابيع إلى أشهر ابتناء تدريجي عودة التوازن إعادة بناء الكتلة الفرق الجوهري عن الجوع البسيط: الجائع البسيط يتكيف بخفض أيضه وحفظ بروتينه. المريض المجهَد يرفع أيضه و يهدم بروتينه بعنف رغم التغذية — لأن الهدم مدفوع هرمونيًا والتهابيًا، لا بنقص الطعام. لهذا لا تستطيع التغذية وحدها إيقاف فقد العضل في المرحلة الحادة؛ هي تخففه فقط. 2. الالتهاب كمربك أكبر يعيد الكتاب هذه الفكرة في كل فصل تقريبًا. الالتهاب: يخفض الألبيومين والبريألبيومين والترانسفيرين (يُعاد توجيه الكبد لإنتاج بروتينات الطور الحاد). يرفع الفيريتين و CRP. يزيد الهدم العضلي. يقلل الشهية. يربك امتصاص الحديد والزنك. القاعدة العملية: لا تفسّر أي مؤشر تغذوي بروتيني أو معدني دون أن تعرف حالة الالتهاب. 3. الدنف مقابل الجوع البسيط الخاصية الجوع البسيط الدنف السبب نقص الطعام المرض والالتهاب الأيض منخفض (تكيّف) مرتفع أو غير منتظم فقد العضل متأخر (الجسم يحفظه) مبكر وشديد الاستجابة للتغذية ممتازة جزئية ومحدودة العلاج التغذية التغذية + علاج المرض + أحيانًا تدخل دوائي ونشاط 4. الاشتقاق في الكلى مثال نموذجي لطريقة الكتاب: ما يعطبه المرض النتيجة التدخل المشتق انخفاض الترشيح تراكم نواتج البروتين (اليوريا) تقييد بروتين معتدل قبل الغسيل عجز إطراح البوتاسيوم ارتفاعه وخطر على القلب تقييد حسب التحليل عجز إطراح الفوسفور ارتفاعه ← سحب كالسيوم من العظم تقييد الفوسفور، خصوصًا المضاف نقص تكوين الإريثروبويتين فقر دم الحديد والأدوية المحفّزة نقص تنشيط فيتامين D اضطراب الكالسيوم والعظم فيتامين D النشط بقرار طبي احتباس الصوديوم والماء ضغط ووذمة تقييد الصوديوم والسوائل فقد أحماض أمينية أثناء الغسيل زيادة الاحتياج رفع البروتين بعد بدء الغسيل لاحظ كيف أن البروتين يُقيَّد قبل الغسيل و يُرفع بعده — تناقض ظاهري يزول تمامًا حين تفهم الآلية. 5. الاشتقاق في الكبد حين يتليف الكبد يفقد قدرته على تخزين الجليكوجين، فيدخل المريض حالة \"الصيام المتسارع\": بعد ليلة واحدة دون طعام يبدأ في هدم عضله كما يفعل الشخص السليم بعد أيام. التدخل المشتق: وجبة ليلية غنية بالكربوهيدرات لتقصير فترة الصيام، ووجبات متكررة نهارًا، وبروتين كافٍ لا مقيّد — لأن العضل هو ما يتآكل. 6. قيمة دراسات الحالة هي جوهر الكتاب. كل حالة تأتي ببيانات مريض كاملة (تاريخ، قياسات، تحاليل، أدوية، تاريخ غذائي)، ثم أسئلة تقودك عبر: 1. تفسير البيانات وتحديد غير الطبيعي. 2. ربط غير الطبيعي بالفسيولوجيا المرضية. 3. حساب الاحتياجات. 4. صياغة تشخيص أو أكثر بصيغة PES. 5. اقتراح تدخل لكل تشخيص. 6. تحديد مؤشرات المتابعة. القاعدة: حلّها كتابةً قبل النظر في أي إجابة. قراءتها فقط تهدر نصف قيمة الكتاب. أرقام يجب أن تخرج بها الموضوع الرقم البروتين في الكلى قبل الغسيل 0.55–0.8 جم/كجم البروتين مع الغسيل الدموي 1.0–1.2 جم/كجم البروتين مع الغسيل البريتوني 1.2–1.3 جم/كجم البروتين في تليّف الكبد 1.2–1.5 جم/كجم الوجبة الليلية في التليف نحو 50 جم كربوهيدرات الصوديوم في الاستسقاء أقل من 2000 مجم البروتين في الحروق 1.5–2.0 جم/كجم أو أكثر ICR التقديرية 500 ÷ الجرعة اليومية الكلية ISF التقديرية 1800 ÷ الجرعة اليومية الكلية مثال تطبيقي بأسلوب الكتاب مثال — مريض تليّف مع استسقاء: رجل 58 سنة، وزنه 82 كجم (الجاف المقدّر 74 كجم)، صوديوم 129، ألبيومين 2.5، أمونيا مرتفعة قليلًا، يأكل وجبتين فقط يوميًا، وقال له أحدهم أن \"يقلل البروتين لأنه يضر الكبد\". الاشتقاق خطوة بخطوة: 1. الوزن الفعلي مضلل بسبب الاستسقاء ← الحساب على الوزن الجاف 74 كجم . 2. الكبد المتليف لا يخزن جليكوجين كافيًا ← وجبتان يوميًا تعني ساعات طويلة من هدم العضل ← وجبات متكررة + وجبة ليلية . 3. تقييد البروتين يسرّع فقد العضل، والعضل يساعد على التخلص من الأمونيا ← بروتين 1.2–1.5 × 74 ≈ 89–111 جم ، مع تفضيل مصادر نباتية وألبان. 4. الاستسقاء = احتباس صوديوم وماء ← صوديوم أقل من 2000 مجم . 5. الصوديوم المنخفض في الدم هنا تخفيفي (ماء زائد) ← لا تضف ملحًا؛ يُدار بتقييد السوائل بقرار طبي. 6. الطاقة 30–35 × 74 ≈ 2200–2600 kcal. التشخيص التغذوي: مدخول بروتين وطاقة غير كافٍ مرتبط بـ معتقدات غذائية خاطئة عن البروتين وقلة عدد الوجبات كما يتضح من تناول وجبتين يوميًا وتجنّب البروتين ونقص الكتلة العضلية في الفحص. أخطاء شائعة عند قراءة الكتاب قراءة دراسات الحالة دون حلها. أكبر هدر لقيمة الكتاب. القفز إلى قسم \"التدخل\" دون قراءة الفسيولوجيا المرضية — فتعود للحفظ. تجاهل الفصل التمهيدي عن الالتهاب والإجهاد. هو المفتاح لفهم نصف الفصول التالية. التعامل معه كمرجع شامل بدل كتاب تعليمي — للمرجعية الشاملة استخدم Krause. كيف تذاكره: خطة تسعة أسابيع الأسبوع المحتوى التطبيق 1 NCP والتقييم والالتهاب والإجهاد ارسم مراحل الاستجابة للإجهاد ودلالاتها 2 الجهاز الهضمي العلوي حالة الفصل كتابةً 3 الجهاز الهضمي السفلي حالة الفصل + اشتقاق تدخل الأمعاء القصيرة 4 الكبد والبنكرياس حالة الفصل + جدول اشتقاق للتليف 5 القلب حالة الفصل 6 السكري والغدد حالة الفصل + حساب ICR/ISF 7 الكلى جدول الاشتقاق الكامل + حالة الفصل 8 الرئة والأعصاب حالتا الفصلين 9 السرطان والحرجة حالة معقدة متعددة الأجهزة نقاط القوة والضعف القوة: الربط الصريح بين الآلية والتدخل، دراسات حالة تعليمية ممتازة، قالب موحد يسهّل المقارنة، ومستوى مناسب للطالب. الضعف: أقل شمولًا من Krause كمرجع، توجه أمريكي في الوحدات والأنظمة، وبعض التوصيات تحتاج مقارنة بالإرشادات المحدّثة. أسئلة للتأمل بعد القراءة 1. لماذا يُقيَّد البروتين قبل الغسيل الكلوي ويُرفع بعده؟ اشرح دون الرجوع للكتاب. 2. لماذا لا يستطيع مريض الإنتان الحفاظ على عضله حتى مع تغذية كاملة؟ 3. مريض كلى بوتاسيومه 3.2 — هل تقيّد البوتاسيوم؟ ولماذا؟ ماذا تقرأ بعده؟ Krause كمرجع دائم بجانبك · ASPEN Core Curriculum للدعم التغذوي المتخصص · إرشادات KDIGO و ESPEN و ADA للأرقام المحدّثة."}, {"i": 37, "group": "books", "tag": "مكتبة المراجع", "num": "7", "short": "ASPEN — الدعم التغذوي", "html": "<h1>The ASPEN Adult Nutrition Support Core Curriculum</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>الناشر</strong></td><td>الجمعية الأمريكية للتغذية الوريدية والمعوية (ASPEN)، بتحرير جماعي لمتخصصين</td></tr><tr><td><strong>المستوى</strong></td><td>متخصص</td></tr><tr><td><strong>الجمهور</strong></td><td>أخصائيو التغذية في المستشفيات والعناية المركزة، الصيادلة الإكلينيكيون، أطباء الدعم التغذوي، المتقدمون لشهادة الدعم التغذوي</td></tr><tr><td><strong>الطابع</strong></td><td>منهج متكامل للتغذية المعوية والوريدية</td></tr><tr><td><strong>الرفيق</strong></td><td>إرشادات ESPEN المجانية، وإرشادات ASPEN/SCCM للعناية المركزة</td></tr></tbody></table></div>\n<h2>متى تحتاجه؟</h2>\n<p>لحظة دخولك جناح مستشفى أو وحدة عناية مركزة. كل ما يخص <strong>الأنبوب</strong> و<strong>الكيس الوريدي</strong> يجتمع هنا: متى تبدأ، بأي طريق، بأي تركيبة، بأي سرعة، وكيف تتعامل حين يسوء شيء.</p>\n<p>هذا ليس كتابًا للعيادات الخارجية أو التغذية الرياضية. لكنه لا غنى عنه لمن يعمل مع مرضى لا يستطيعون الأكل — وهم أكثر المرضى عرضة للخطر وأكثرهم حاجة لقرارات دقيقة، لأن الخطأ هنا قد يكون قاتلًا.</p>\n<h2>خريطة الكتاب</h2>\n<h3>الأساسيات</h3>\n<ul><li><strong>الاستجابة الأيضية للمرض والإصابة.</strong></li><li><strong>تقييم المريض</strong> وتحديد خطر سوء التغذية.</li><li><strong>تقدير الاحتياجات:</strong> الطاقة (المعادلات مقابل القياس غير المباشر)، البروتين، السوائل.</li><li><strong>الماء والإلكتروليتات والتوازن الحمضي القاعدي.</strong></li><li><strong>المغذيات الدقيقة</strong> في المرض الحاد والمزمن.</li></ul>\n<h3>التغذية المعوية</h3>\n<ul><li><strong>الدواعي وموانع الاستعمال</strong> وتوقيت البدء.</li><li><strong>طرق الوصول:</strong> أنفي معدي، أنفي صائمي، فغر معدي أو صائمي (جراحي أو بالمنظار أو إشعاعي)، وتأكيد موضع الأنبوب.</li><li><strong>التركيبات:</strong> القياسية، المركّزة، عالية البروتين، الببتيدية، المتخصصة بالأمراض، وأدلة كل منها.</li><li><strong>الإعطاء:</strong> دفعات، متقطع، مستمر، دوري.</li><li><strong>المضاعفات:</strong> ميكانيكية، هضمية، أيضية، والشفط.</li><li><strong>إعطاء الأدوية عبر الأنبوب.</strong></li></ul>\n<h3>التغذية الوريدية</h3>\n<ul><li><strong>الدواعي</strong> وتوقيت البدء.</li><li><strong>الوصول الوريدي:</strong> محيطي، مركزي، PICC، المنافذ المزروعة، والعناية بها.</li><li><strong>المكونات:</strong> الدكستروز، الأحماض الأمينية، المستحلبات الدهنية بأجيالها، الإلكتروليتات، الفيتامينات، العناصر النزرة.</li><li><strong>الحسابات والوصفة والتوافق والاستقرار.</strong></li><li><strong>المضاعفات:</strong> المرتبطة بالقسطرة، الأيضية، الكبدية، العظمية.</li></ul>\n<h3>الحالات الخاصة</h3>\n<p>الإنتان، الرضّة، الحروق، الجراحة، التهاب البنكرياس، الفشل الكلوي الحاد والمزمن، الفشل الكبدي، الفشل التنفسي، السرطان، جراحات السمنة، متلازمة الأمعاء القصيرة، الأمراض العصبية، والسمنة لدى المريض الحرج.</p>\n<h3>الدعم التغذوي المنزلي والأخلاقيات</h3>\n<p>الانتقال من المستشفى إلى المنزل، التدريب، المتابعة، ثم <strong>الأخلاقيات ونهاية الحياة</strong> والإطار القانوني لقرارات التغذية الاصطناعية.</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. \"إذا كانت الأمعاء تعمل فاستخدمها\"</h3>\n<p>ليست شعارًا بل خلاصة أدلة. التغذية المعوية:</p>\n<ul><li><strong>تحفظ سلامة الحاجز المخاطي</strong> وتمنع ضمور الزغابات.</li><li><strong>تحافظ على النسيج اللمفاوي المعوي</strong> (جزء كبير من الجهاز المناعي).</li><li><strong>تقلل المضاعفات الإنتانية</strong> مقارنة بالوريدية في كثير من الفئات.</li><li><strong>أرخص وأقل خطرًا</strong> من حيث مضاعفات القسطرة.</li></ul>\n<p><strong>التغذية التحفيزية (Trophic):</strong> حتى كمية صغيرة (10–20 مل/ساعة) لها قيمة في حفظ الأمعاء، حتى لو لم تغطِّ الاحتياج. لهذا تُستمر حتى حين يُضاف الوريدي.</p>\n<h3>2. شجرة اختيار الطريق</h3>\n<pre class=\"calc\"><code>هل يستطيع المريض تغطية احتياجه فمويًا (مع التدعيم والمكملات)؟\n  نعم ← فموي\n  لا ← هل الجهاز الهضمي يعمل وآمن الاستخدام؟\n         نعم ← معوي\n                المدة أقل من 4–6 أسابيع ← أنفي\n                المدة أطول ← فغر\n                خطر شفط عالٍ ← ما بعد البواب\n         لا ← وريدي\n                مؤقت وتركيز منخفض ← محيطي\n                طويل أو تركيز عالٍ ← مركزي</code></pre>\n<h3>3. توقيت البدء</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الحالة</th><th>التوقيت التقريبي</th></tr></thead><tbody><tr><td>مريض حرج مستقر والأمعاء تعمل</td><td>معوي خلال 24–48 ساعة</td></tr><tr><td>مريض حرج كان سليم التغذية ولا يستطيع المعوي</td><td>الوريدي قد يُؤجَّل نحو أسبوع</td></tr><tr><td>مريض حرج مصاب بسوء تغذية مسبق</td><td>الوريدي يُبدأ مبكرًا إن تعذّر المعوي</td></tr><tr><td>غير مستقر ديناميكيًا (جرعات عالية من الرافعات)</td><td>تأجيل المعوي حتى الاستقرار</td></tr></tbody></table></div>\n<h3>4. الإفراط أخطر من التقصير في المرحلة الحادة</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>مضاعفة فرط التغذية</th><th>الآلية</th></tr></thead><tbody><tr><td>فرط سكر الدم</td><td>مقاومة الإنسولين المرتبطة بالإجهاد + دكستروز زائد</td></tr><tr><td>تشحّم الكبد</td><td>تحويل فائض الكربوهيدرات إلى دهون</td></tr><tr><td>زيادة إنتاج CO₂</td><td>تخليق الدهون ينتج CO₂ أكثر ← صعوبة الفطام عن التنفس الاصطناعي</td></tr><tr><td>اضطراب الإلكتروليتات</td><td>انتقال للخلايا (يشبه إعادة التغذية)</td></tr><tr><td>زيادة خطر العدوى</td><td>ارتبط فرط السكر بالمضاعفات الإنتانية</td></tr></tbody></table></div>\n<p>لهذا تُقدَّم الطاقة في الأيام الأولى للمرض الحرج <strong>بشكل تدريجي</strong>، أقل من الهدف الكامل، ثم تُرفع مع الاستقرار — بينما يُعطى البروتين بسخاء.</p>\n<h3>5. حسابات لا يجوز الخطأ فيها</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المكون</th><th>القيمة</th><th>التحذير</th></tr></thead><tbody><tr><td><strong>الدكستروز الوريدي</strong></td><td><strong>3.4 kcal/جم</strong></td><td>ليس 4، لأنه مُميَّه — الخطأ يبالغ في السعرات</td></tr><tr><td>حد أكسدة الجلوكوز</td><td>4–5 مجم/كجم/دقيقة</td><td>فوقه: فرط سكر وتشحّم كبدي</td></tr><tr><td>الأحماض الأمينية</td><td>4 kcal/جم</td><td>—</td></tr><tr><td>المستحلب الدهني 20%</td><td>2 kcal/مل</td><td>بسبب الجليسرول والفوسفوليبيد</td></tr><tr><td>حد الدهون اليومي</td><td>نحو 1 جم/كجم في الغالب</td><td>مع مراقبة الدهون الثلاثية</td></tr><tr><td>حد أسمولالية المحيطي</td><td>نحو 900 mOsm/L</td><td>فوقه: التهاب وريدي ← يلزم مركزي</td></tr><tr><td>الماء الحر في التركيبات المركّزة</td><td>نحو 70–75% فقط</td><td>احسب الغسيل الإضافي</td></tr></tbody></table></div>\n<h3>6. المضاعفات الأيضية الكبرى</h3>\n<ul><li><strong>متلازمة إعادة التغذية:</strong> انخفاض الفوسفات والبوتاسيوم والماغنسيوم مع بدء التغذية، واستنفاد الثيامين. الوقاية: تحديد المعرضين، البدء بطاقة منخفضة، الثيامين قبل التغذية، المراقبة اليومية.</li><li><strong>فرط السكر:</strong> يُدار بضبط الدكستروز والإنسولين حسب البروتوكول، لا بإيقاف التغذية فجأة (خطر نقص سكر ارتدادي).</li><li><strong>الاعتلال الكبدي المرتبط بالتغذية الوريدية (IFALD):</strong> ركود صفراوي وتشحّم. الوقاية: تجنّب فرط السعرات، تحديد الدهون أو استخدام أجيال أحدث منها، الحفاظ على حد أدنى من التغذية المعوية، والتسريب الدوري.</li><li><strong>المرض العظمي الأيضي</strong> مع التغذية الوريدية الطويلة.</li></ul>\n<h3>7. المضاعفات المرتبطة بالقسطرة</h3>\n<p><strong>إنتان مجرى الدم المرتبط بالقسطرة المركزية (CLABSI)</strong> هو الأخطر. الوقاية تعتمد على العناية المعقّمة بالقسطرة، وتخصيص منفذ للتغذية، وتقليل التلاعب بها. ومضاعفات أخرى: التخثر، الانسداد، الاسترواح الصدري عند التركيب.</p>\n<h3>8. مضاعفات المعوي وإدارتها</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المضاعفة</th><th>أول ما تفكر فيه</th></tr></thead><tbody><tr><td>إسهال</td><td><strong>الأدوية</strong> (محاليل السوربيتول، المضادات الحيوية، الماغنسيوم) والعدوى — التركيبة نادرًا ما تكون السبب الأول</td></tr><tr><td>انتفاخ وتبقٍ معدي</td><td>سرعة الضخ، الأدوية المثبطة للحركة، وضعية المريض</td></tr><tr><td>شفط</td><td>رفع رأس السرير 30–45°، ضخ مستمر، وصول ما بعد البواب</td></tr><tr><td>انسداد الأنبوب</td><td>غسيل منتظم بالماء، عدم سحق الأقراص ممتدة المفعول</td></tr><tr><td>إمساك</td><td>السوائل، الألياف، الحركة، الأفيونات</td></tr></tbody></table></div>\n<h3>9. الأخلاقيات</h3>\n<p>يتعامل الكتاب بنضج مع سؤال صعب: التغذية الاصطناعية <strong>تدخّل طبي</strong> مثل أي علاج آخر، لا \"رعاية أساسية\" لا يجوز المساس بها. يمكن رفضها أو إيقافها بقرار مشترك يحترم رغبات المريض وأهداف رعايته — خصوصًا في نهاية الحياة والخرف المتقدم، حيث لا تُظهر الأدلة غالبًا أنها تطيل الحياة أو تحسّن جودتها.</p>\n<h2>أرقام يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الرقم</th></tr></thead><tbody><tr><td>الطاقة للمريض الحرج</td><td>25–30 kcal/كجم (والأدق القياس غير المباشر)</td></tr><tr><td>البروتين للمريض الحرج</td><td>1.2–2.0 جم/كجم</td></tr><tr><td>السمنة في الحرج (BMI 30–50)</td><td>11–14 kcal/كجم فعلي، بروتين حتى 2.0 جم/كجم وزن مثالي</td></tr><tr><td>السمنة المفرطة (BMI أكثر من 50)</td><td>22–25 kcal/كجم وزن مثالي، بروتين حتى 2.5 جم/كجم وزن مثالي</td></tr><tr><td>الفطام عن الوريدي</td><td>عند تغطية أكثر من 60% معويًا</td></tr><tr><td>رفع رأس السرير</td><td>30–45 درجة</td></tr><tr><td>الأنبوب الأنفي مقابل الفغر</td><td>الحد الفاصل نحو 4–6 أسابيع</td></tr><tr><td>بداية التغذية في خطر إعادة التغذية</td><td>10–15 kcal/كجم وأحيانًا أقل</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — وصفة وريدية كاملة:</strong> مريض 70 كجم، استئصال جزء كبير من الأمعاء، لا يمكن استخدام الجهاز الهضمي، الهدف 1750 kcal و 1.5 جم/كجم بروتين، تسريب على 24 ساعة.</p>\n<p><strong>الحساب:</strong></p>\n<ul><li>الأحماض الأمينية: 1.5 × 70 = <strong>105 جم</strong> ← 420 kcal</li><li>الدهون: 0.8 × 70 = <strong>56 جم</strong> ← نحو 560 kcal (ضمن حد 1 جم/كجم)</li><li>الدكستروز: (1750 − 420 − 560) ÷ <strong>3.4</strong> = <strong>226 جم</strong></li><li><strong>التحقق من معدل الجلوكوز:</strong> 226,000 مجم ÷ 70 كجم ÷ 1440 دقيقة = <strong>2.2 مجم/كجم/دقيقة</strong> ← آمن (أقل من 4–5)</li></ul>\n<p><strong>لو أخطأت واستخدمت 4 kcal/جم للدكستروز:</strong> ستحسب 193 جم فقط وتظن أنك أعطيت 1750، بينما الحقيقة أقل — أو العكس إن حسبت السعرات من وزن دكستروز معطى. هذا الخطأ الصغير في المعامل يتراكم يوميًا.</p>\n<p><strong>المتابعة:</strong> السكر كل 6 ساعات في البداية، الإلكتروليتات (خصوصًا الفوسفات والبوتاسيوم والماغنسيوم) يوميًا، وظائف الكبد والدهون الثلاثية أسبوعيًا، والبحث عن أي فرصة لبدء تغذية معوية تحفيزية.</p></blockquote>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>استخدام 4 kcal/جم للدكستروز الوريدي</strong> — أشيع خطأ حسابي في المجال.</li><li><strong>السعي للهدف الكامل من اليوم الأول</strong> في المريض الحرج.</li><li><strong>إيقاف التغذية المعوية عند أول إسهال</strong> دون البحث في الأدوية والعدوى.</li><li><strong>اعتبار الوريدي \"أسهل\" أو \"أضمن\"</strong> لأن الأرقام تصل كاملة — متجاهلًا مخاطره.</li><li><strong>إغفال الأخلاقيات</strong> كأنها خارج اختصاص أخصائي التغذية.</li></ul>\n<h2>كيف تذاكره: خطة ثمانية أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>الاستجابة الأيضية وتقدير الاحتياجات</td><td>احسب احتياج 5 مرضى حرجين بأوزان وحالات مختلفة</td></tr><tr><td>2</td><td>السوائل والإلكتروليتات والحمض القاعدي</td><td>فسّر 5 نتائج إلكتروليتات في سياق التغذية</td></tr><tr><td>3</td><td>المعوي: الوصول والتركيبات</td><td>اختر الطريق والتركيبة لـ 5 حالات</td></tr><tr><td>4</td><td>المعوي: الإعطاء والمضاعفات</td><td>خطة لمريض إسهال على تغذية معوية</td></tr><tr><td>5</td><td>الوريدي: المكونات والحسابات</td><td>اكتب 3 وصفات وريدية كاملة مع التحقق</td></tr><tr><td>6</td><td>الوريدي: المضاعفات</td><td>خطة وقاية من IFALD لمريض طويل الأمد</td></tr><tr><td>7</td><td>الحالات الخاصة</td><td>الحروق، البنكرياس، الأمعاء القصيرة، السمنة الحرجة</td></tr><tr><td>8</td><td>المنزلي والأخلاقيات</td><td>ناقش حالة نهاية حياة مع زميل</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> المرجع الأشمل في الدعم التغذوي، دقة في الحسابات والبروتوكولات، تغطية للأخلاقيات نادرة في كتب التغذية، وتحديث مستمر عبر الطبعات.</p>\n<p><strong>الضعف:</strong> متخصص جدًا وغير مفيد خارج المستشفى، توجه أمريكي في المنتجات المتاحة، ويفترض معرفة إكلينيكية سابقة.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>لماذا قد يضر رفع السعرات إلى الهدف الكامل في اليوم الثاني من دخول مريض إنتان؟</li><li>مريض على تغذية معوية أصيب بإسهال — ما خطواتك بالترتيب قبل تغيير التركيبة؟</li><li>مريض خرف متقدم يرفض الأكل، والأسرة تطلب أنبوبًا — ما الأسئلة التي يجب أن تُطرح قبل القرار؟</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>إرشادات ESPEN</strong> (مجانية ومحدّثة: العناية المركزة، الجراحة، الكبد، الكلى، السرطان) · <strong>إرشادات ASPEN/SCCM للمريض الحرج</strong> · <strong>Krause</strong> للسياق الإكلينيكي الأوسع.</p>", "text": "The ASPEN Adult Nutrition Support Core Curriculum الناشر الجمعية الأمريكية للتغذية الوريدية والمعوية (ASPEN)، بتحرير جماعي لمتخصصين المستوى متخصص الجمهور أخصائيو التغذية في المستشفيات والعناية المركزة، الصيادلة الإكلينيكيون، أطباء الدعم التغذوي، المتقدمون لشهادة الدعم التغذوي الطابع منهج متكامل للتغذية المعوية والوريدية الرفيق إرشادات ESPEN المجانية، وإرشادات ASPEN/SCCM للعناية المركزة متى تحتاجه؟ لحظة دخولك جناح مستشفى أو وحدة عناية مركزة. كل ما يخص الأنبوب و الكيس الوريدي يجتمع هنا: متى تبدأ، بأي طريق، بأي تركيبة، بأي سرعة، وكيف تتعامل حين يسوء شيء. هذا ليس كتابًا للعيادات الخارجية أو التغذية الرياضية. لكنه لا غنى عنه لمن يعمل مع مرضى لا يستطيعون الأكل — وهم أكثر المرضى عرضة للخطر وأكثرهم حاجة لقرارات دقيقة، لأن الخطأ هنا قد يكون قاتلًا. خريطة الكتاب الأساسيات الاستجابة الأيضية للمرض والإصابة. تقييم المريض وتحديد خطر سوء التغذية. تقدير الاحتياجات: الطاقة (المعادلات مقابل القياس غير المباشر)، البروتين، السوائل. الماء والإلكتروليتات والتوازن الحمضي القاعدي. المغذيات الدقيقة في المرض الحاد والمزمن. التغذية المعوية الدواعي وموانع الاستعمال وتوقيت البدء. طرق الوصول: أنفي معدي، أنفي صائمي، فغر معدي أو صائمي (جراحي أو بالمنظار أو إشعاعي)، وتأكيد موضع الأنبوب. التركيبات: القياسية، المركّزة، عالية البروتين، الببتيدية، المتخصصة بالأمراض، وأدلة كل منها. الإعطاء: دفعات، متقطع، مستمر، دوري. المضاعفات: ميكانيكية، هضمية، أيضية، والشفط. إعطاء الأدوية عبر الأنبوب. التغذية الوريدية الدواعي وتوقيت البدء. الوصول الوريدي: محيطي، مركزي، PICC، المنافذ المزروعة، والعناية بها. المكونات: الدكستروز، الأحماض الأمينية، المستحلبات الدهنية بأجيالها، الإلكتروليتات، الفيتامينات، العناصر النزرة. الحسابات والوصفة والتوافق والاستقرار. المضاعفات: المرتبطة بالقسطرة، الأيضية، الكبدية، العظمية. الحالات الخاصة الإنتان، الرضّة، الحروق، الجراحة، التهاب البنكرياس، الفشل الكلوي الحاد والمزمن، الفشل الكبدي، الفشل التنفسي، السرطان، جراحات السمنة، متلازمة الأمعاء القصيرة، الأمراض العصبية، والسمنة لدى المريض الحرج. الدعم التغذوي المنزلي والأخلاقيات الانتقال من المستشفى إلى المنزل، التدريب، المتابعة، ثم الأخلاقيات ونهاية الحياة والإطار القانوني لقرارات التغذية الاصطناعية. المفاهيم المحورية بالتفصيل 1. \"إذا كانت الأمعاء تعمل فاستخدمها\" ليست شعارًا بل خلاصة أدلة. التغذية المعوية: تحفظ سلامة الحاجز المخاطي وتمنع ضمور الزغابات. تحافظ على النسيج اللمفاوي المعوي (جزء كبير من الجهاز المناعي). تقلل المضاعفات الإنتانية مقارنة بالوريدية في كثير من الفئات. أرخص وأقل خطرًا من حيث مضاعفات القسطرة. التغذية التحفيزية (Trophic): حتى كمية صغيرة (10–20 مل/ساعة) لها قيمة في حفظ الأمعاء، حتى لو لم تغطِّ الاحتياج. لهذا تُستمر حتى حين يُضاف الوريدي. 2. شجرة اختيار الطريق هل يستطيع المريض تغطية احتياجه فمويًا (مع التدعيم والمكملات)؟ نعم ← فموي لا ← هل الجهاز الهضمي يعمل وآمن الاستخدام؟ نعم ← معوي المدة أقل من 4–6 أسابيع ← أنفي المدة أطول ← فغر خطر شفط عالٍ ← ما بعد البواب لا ← وريدي مؤقت وتركيز منخفض ← محيطي طويل أو تركيز عالٍ ← مركزي 3. توقيت البدء الحالة التوقيت التقريبي مريض حرج مستقر والأمعاء تعمل معوي خلال 24–48 ساعة مريض حرج كان سليم التغذية ولا يستطيع المعوي الوريدي قد يُؤجَّل نحو أسبوع مريض حرج مصاب بسوء تغذية مسبق الوريدي يُبدأ مبكرًا إن تعذّر المعوي غير مستقر ديناميكيًا (جرعات عالية من الرافعات) تأجيل المعوي حتى الاستقرار 4. الإفراط أخطر من التقصير في المرحلة الحادة مضاعفة فرط التغذية الآلية فرط سكر الدم مقاومة الإنسولين المرتبطة بالإجهاد + دكستروز زائد تشحّم الكبد تحويل فائض الكربوهيدرات إلى دهون زيادة إنتاج CO₂ تخليق الدهون ينتج CO₂ أكثر ← صعوبة الفطام عن التنفس الاصطناعي اضطراب الإلكتروليتات انتقال للخلايا (يشبه إعادة التغذية) زيادة خطر العدوى ارتبط فرط السكر بالمضاعفات الإنتانية لهذا تُقدَّم الطاقة في الأيام الأولى للمرض الحرج بشكل تدريجي ، أقل من الهدف الكامل، ثم تُرفع مع الاستقرار — بينما يُعطى البروتين بسخاء. 5. حسابات لا يجوز الخطأ فيها المكون القيمة التحذير الدكستروز الوريدي 3.4 kcal/جم ليس 4، لأنه مُميَّه — الخطأ يبالغ في السعرات حد أكسدة الجلوكوز 4–5 مجم/كجم/دقيقة فوقه: فرط سكر وتشحّم كبدي الأحماض الأمينية 4 kcal/جم — المستحلب الدهني 20% 2 kcal/مل بسبب الجليسرول والفوسفوليبيد حد الدهون اليومي نحو 1 جم/كجم في الغالب مع مراقبة الدهون الثلاثية حد أسمولالية المحيطي نحو 900 mOsm/L فوقه: التهاب وريدي ← يلزم مركزي الماء الحر في التركيبات المركّزة نحو 70–75% فقط احسب الغسيل الإضافي 6. المضاعفات الأيضية الكبرى متلازمة إعادة التغذية: انخفاض الفوسفات والبوتاسيوم والماغنسيوم مع بدء التغذية، واستنفاد الثيامين. الوقاية: تحديد المعرضين، البدء بطاقة منخفضة، الثيامين قبل التغذية، المراقبة اليومية. فرط السكر: يُدار بضبط الدكستروز والإنسولين حسب البروتوكول، لا بإيقاف التغذية فجأة (خطر نقص سكر ارتدادي). الاعتلال الكبدي المرتبط بالتغذية الوريدية (IFALD): ركود صفراوي وتشحّم. الوقاية: تجنّب فرط السعرات، تحديد الدهون أو استخدام أجيال أحدث منها، الحفاظ على حد أدنى من التغذية المعوية، والتسريب الدوري. المرض العظمي الأيضي مع التغذية الوريدية الطويلة. 7. المضاعفات المرتبطة بالقسطرة إنتان مجرى الدم المرتبط بالقسطرة المركزية (CLABSI) هو الأخطر. الوقاية تعتمد على العناية المعقّمة بالقسطرة، وتخصيص منفذ للتغذية، وتقليل التلاعب بها. ومضاعفات أخرى: التخثر، الانسداد، الاسترواح الصدري عند التركيب. 8. مضاعفات المعوي وإدارتها المضاعفة أول ما تفكر فيه إسهال الأدوية (محاليل السوربيتول، المضادات الحيوية، الماغنسيوم) والعدوى — التركيبة نادرًا ما تكون السبب الأول انتفاخ وتبقٍ معدي سرعة الضخ، الأدوية المثبطة للحركة، وضعية المريض شفط رفع رأس السرير 30–45°، ضخ مستمر، وصول ما بعد البواب انسداد الأنبوب غسيل منتظم بالماء، عدم سحق الأقراص ممتدة المفعول إمساك السوائل، الألياف، الحركة، الأفيونات 9. الأخلاقيات يتعامل الكتاب بنضج مع سؤال صعب: التغذية الاصطناعية تدخّل طبي مثل أي علاج آخر، لا \"رعاية أساسية\" لا يجوز المساس بها. يمكن رفضها أو إيقافها بقرار مشترك يحترم رغبات المريض وأهداف رعايته — خصوصًا في نهاية الحياة والخرف المتقدم، حيث لا تُظهر الأدلة غالبًا أنها تطيل الحياة أو تحسّن جودتها. أرقام يجب أن تخرج بها الموضوع الرقم الطاقة للمريض الحرج 25–30 kcal/كجم (والأدق القياس غير المباشر) البروتين للمريض الحرج 1.2–2.0 جم/كجم السمنة في الحرج (BMI 30–50) 11–14 kcal/كجم فعلي، بروتين حتى 2.0 جم/كجم وزن مثالي السمنة المفرطة (BMI أكثر من 50) 22–25 kcal/كجم وزن مثالي، بروتين حتى 2.5 جم/كجم وزن مثالي الفطام عن الوريدي عند تغطية أكثر من 60% معويًا رفع رأس السرير 30–45 درجة الأنبوب الأنفي مقابل الفغر الحد الفاصل نحو 4–6 أسابيع بداية التغذية في خطر إعادة التغذية 10–15 kcal/كجم وأحيانًا أقل مثال تطبيقي بأسلوب الكتاب مثال — وصفة وريدية كاملة: مريض 70 كجم، استئصال جزء كبير من الأمعاء، لا يمكن استخدام الجهاز الهضمي، الهدف 1750 kcal و 1.5 جم/كجم بروتين، تسريب على 24 ساعة. الحساب: الأحماض الأمينية: 1.5 × 70 = 105 جم ← 420 kcal الدهون: 0.8 × 70 = 56 جم ← نحو 560 kcal (ضمن حد 1 جم/كجم) الدكستروز: (1750 − 420 − 560) ÷ 3.4 = 226 جم التحقق من معدل الجلوكوز: 226,000 مجم ÷ 70 كجم ÷ 1440 دقيقة = 2.2 مجم/كجم/دقيقة ← آمن (أقل من 4–5) لو أخطأت واستخدمت 4 kcal/جم للدكستروز: ستحسب 193 جم فقط وتظن أنك أعطيت 1750، بينما الحقيقة أقل — أو العكس إن حسبت السعرات من وزن دكستروز معطى. هذا الخطأ الصغير في المعامل يتراكم يوميًا. المتابعة: السكر كل 6 ساعات في البداية، الإلكتروليتات (خصوصًا الفوسفات والبوتاسيوم والماغنسيوم) يوميًا، وظائف الكبد والدهون الثلاثية أسبوعيًا، والبحث عن أي فرصة لبدء تغذية معوية تحفيزية. أخطاء شائعة عند قراءة الكتاب استخدام 4 kcal/جم للدكستروز الوريدي — أشيع خطأ حسابي في المجال. السعي للهدف الكامل من اليوم الأول في المريض الحرج. إيقاف التغذية المعوية عند أول إسهال دون البحث في الأدوية والعدوى. اعتبار الوريدي \"أسهل\" أو \"أضمن\" لأن الأرقام تصل كاملة — متجاهلًا مخاطره. إغفال الأخلاقيات كأنها خارج اختصاص أخصائي التغذية. كيف تذاكره: خطة ثمانية أسابيع الأسبوع المحتوى التطبيق 1 الاستجابة الأيضية وتقدير الاحتياجات احسب احتياج 5 مرضى حرجين بأوزان وحالات مختلفة 2 السوائل والإلكتروليتات والحمض القاعدي فسّر 5 نتائج إلكتروليتات في سياق التغذية 3 المعوي: الوصول والتركيبات اختر الطريق والتركيبة لـ 5 حالات 4 المعوي: الإعطاء والمضاعفات خطة لمريض إسهال على تغذية معوية 5 الوريدي: المكونات والحسابات اكتب 3 وصفات وريدية كاملة مع التحقق 6 الوريدي: المضاعفات خطة وقاية من IFALD لمريض طويل الأمد 7 الحالات الخاصة الحروق، البنكرياس، الأمعاء القصيرة، السمنة الحرجة 8 المنزلي والأخلاقيات ناقش حالة نهاية حياة مع زميل نقاط القوة والضعف القوة: المرجع الأشمل في الدعم التغذوي، دقة في الحسابات والبروتوكولات، تغطية للأخلاقيات نادرة في كتب التغذية، وتحديث مستمر عبر الطبعات. الضعف: متخصص جدًا وغير مفيد خارج المستشفى، توجه أمريكي في المنتجات المتاحة، ويفترض معرفة إكلينيكية سابقة. أسئلة للتأمل بعد القراءة 1. لماذا قد يضر رفع السعرات إلى الهدف الكامل في اليوم الثاني من دخول مريض إنتان؟ 2. مريض على تغذية معوية أصيب بإسهال — ما خطواتك بالترتيب قبل تغيير التركيبة؟ 3. مريض خرف متقدم يرفض الأكل، والأسرة تطلب أنبوبًا — ما الأسئلة التي يجب أن تُطرح قبل القرار؟ ماذا تقرأ بعده؟ إرشادات ESPEN (مجانية ومحدّثة: العناية المركزة، الجراحة، الكبد، الكلى، السرطان) · إرشادات ASPEN/SCCM للمريض الحرج · Krause للسياق الإكلينيكي الأوسع."}, {"i": 38, "group": "books", "tag": "مكتبة المراجع", "num": "8", "short": "Miller & Rollnick — المقابلة", "html": "<h1>Motivational Interviewing: Helping People Change</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المؤلفان</strong></td><td>William R. Miller و Stephen Rollnick — مؤسسا المنهج</td></tr><tr><td><strong>المستوى</strong></td><td>لكل من يجلس أمام إنسان يحتاج تغييرًا</td></tr><tr><td><strong>الجمهور</strong></td><td>أخصائيو التغذية، الأطباء، الممرضون، المعالجون، المدربون</td></tr><tr><td><strong>الطابع</strong></td><td>كتاب مهارة لا كتاب معلومات</td></tr><tr><td><strong>أصله</strong></td><td>نشأ المنهج في علاج الإدمان ثم انتشر إلى كل مجالات تغيير السلوك الصحي</td></tr><tr><td><strong>التطبيق الغذائي</strong></td><td>Motivational Interviewing in Nutrition and Fitness (Clifford &amp; Curtis)</td></tr></tbody></table></div>\n<h2>الفكرة التي تقلب الطاولة</h2>\n<p>يدخل معظم أخصائيي التغذية المهنة بافتراض ضمني: المريض لا يتغير لأنه <strong>لا يعرف</strong>. فإن أعطيناه المعلومة الصحيحة سيتغير. لكن المدخن يعرف أن التدخين يقتل، ومريض السكري يعرف أن السكر يضره. المعرفة نادرًا ما تكون المشكلة.</p>\n<p>يطرح هذا الكتاب افتراضًا مختلفًا: معظم الناس <strong>مترددون</strong> — يريدون التغيير ولا يريدونه في الوقت نفسه. والتردد طبيعي لا مرضي. حين يدفعهم المرشد بقوة نحو التغيير، يدافعون تلقائيًا عن الجانب الآخر من ترددهم: \"بس أنا مشغول\"، \"أنا جربت قبل كده\"، \"عيلتي كلها كده\". وكلما سمع الإنسان نفسه يدافع عن البقاء كما هو، ازداد اقتناعًا به.</p>\n<p>النتيجة الصادمة: <strong>مقاومة العميل غالبًا ما يصنعها أسلوب المرشد، لا عناد العميل.</strong></p>\n<h2>خريطة الكتاب</h2>\n<h3>الجزء الأول: ما المقابلة التحفيزية؟</h3>\n<ul><li><strong>التعريف</strong> بمستوياته: الوصف العام، التعريف المهني، والتعريف التقني.</li><li><strong>الروح:</strong> الشراكة، التقبّل، الرحمة، الاستحضار.</li><li><strong>العمليات الأربع:</strong> الإشراك، التركيز، الاستحضار، التخطيط.</li></ul>\n<h3>الجزء الثاني: الإشراك (Engaging)</h3>\n<p>بناء علاقة عمل. المهارات الأساسية: الأسئلة المفتوحة، الإثبات، الانعكاس، التلخيص. وما يعيق الإشراك: فخ الأسئلة والإجابات، فخ الخبير، فخ التشخيص المبكر، فخ اللوم.</p>\n<h3>الجزء الثالث: التركيز (Focusing)</h3>\n<p>تحديد اتجاه الحوار: ماذا نناقش؟ أي سلوك؟ كيف نختار حين تتعدد المشكلات؟ وكيف نقدم المعلومة والنصيحة بطريقة تحترم استقلالية العميل.</p>\n<h3>الجزء الرابع: الاستحضار (Evoking)</h3>\n<p>قلب المنهج: التعرف على <strong>حديث التغيير</strong> وتقويته، والتعامل مع <strong>حديث المحافظة</strong>، والتعامل مع <strong>التنافر</strong> في العلاقة، وتطوير الأمل والثقة.</p>\n<h3>الجزء الخامس: التخطيط (Planning)</h3>\n<p>الانتقال من \"أريد\" إلى \"سأفعل\": متى تعرف أن العميل جاهز، كيف تبني خطة معه لا له، وكيف تدعم الالتزام.</p>\n<h3>الجزء السادس: التطبيق والتعلم</h3>\n<p>كيف تتعلم المنهج، كيف تقيس جودة ممارستك، وتطبيقاته في سياقات مختلفة.</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. الروح قبل التقنية</h3>\n<p>يصرّ الكتاب على أن من يطبق التقنيات دون الروح لا يمارس المقابلة التحفيزية، بل يمارس تلاعبًا بأدوات لطيفة.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>عنصر الروح</th><th>المعنى العملي</th></tr></thead><tbody><tr><td><strong>الشراكة</strong></td><td>أنت خبير في التغذية، والعميل خبير في حياته. الخطة تُبنى معًا.</td></tr><tr><td><strong>التقبّل</strong></td><td>احترام قيمة الإنسان، الاعتراف باستقلاليته، التعاطف الدقيق، والإثبات.</td></tr><tr><td><strong>الرحمة</strong></td><td>العمل لمصلحة العميل الحقيقية، لا لمصلحتك أو لإرضاء رئيسك.</td></tr><tr><td><strong>الاستحضار</strong></td><td>الدافع والحكمة موجودان لدى العميل؛ مهمتك استخراجهما.</td></tr></tbody></table></div>\n<h3>2. مصيدة التصحيح (The Righting Reflex)</h3>\n<p>الرغبة الغريزية لدى أي مهني في \"تصحيح\" مسار العميل: تحذيره، إقناعه، تقديم الحل له. هي نابعة من نية حسنة، لكنها تثير المقاومة.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>❌ رد بدافع التصحيح</th><th>✅ رد بروح المقابلة التحفيزية</th></tr></thead><tbody><tr><td>\"لازم تبطل المشروبات الغازية فورًا، ده سكر خالص.\"</td><td>\"إيه رأيك في كمية المشروبات الغازية اللي بتشربها؟\"</td></tr><tr><td>\"النظام ده هينجح لو التزمت بس.\"</td><td>\"إيه اللي ساعدك في المرات اللي التزمت فيها؟\"</td></tr><tr><td>\"أنت عارف إن ده بيضر الكلى.\"</td><td>\"إيه اللي تعرفه عن تأثير ده على صحتك؟\"</td></tr></tbody></table></div>\n<h3>3. مهارات OARS بالتفصيل</h3>\n<p><strong>الأسئلة المفتوحة (Open questions):</strong> تدعو للسرد لا للإجابة بنعم/لا. لكن الكتاب يحذر من <strong>فخ الأسئلة</strong>: سلسلة أسئلة متتالية تحوّل الجلسة إلى استجواب. القاعدة العملية: <strong>انعكاسان على الأقل لكل سؤال.</strong></p>\n<p><strong>الإثبات (Affirmations):</strong> الاعتراف بقوة حقيقية أو جهد لدى العميل. يختلف عن المديح: المديح حكم من فوق (\"ممتاز!\")، والإثبات اعتراف بشيء فيه (\"واضح إنك بتهتم بصحة أولادك جدًا\").</p>\n<p><strong>الانعكاس (Reflections):</strong> المهارة المركزية. ثلاثة مستويات:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>النوع</th><th>المثال (العميل: \"أنا جربت كل الرجيمات وفشلت\")</th></tr></thead><tbody><tr><td><strong>بسيط</strong> — تكرار أو إعادة صياغة</td><td>\"جربت أنظمة كتير.\"</td></tr><tr><td><strong>مركّب</strong> — إضافة معنى ضمني</td><td>\"تعبت من إنك تحاول وما توصلش.\"</td></tr><tr><td><strong>مزدوج الجانب</strong> — يعكس طرفي التردد</td><td>\"من ناحية حاسس إنه مفيش فايدة، ومن ناحية تانية لسه بتحاول، ودليل ده إنك هنا.\"</td></tr></tbody></table></div>\n<p>الانعكاس المركّب يُشعر العميل بأنه <strong>مفهوم</strong>، وهذا ما يفتح الحوار.</p>\n<p><strong>التلخيص (Summaries):</strong> جمع ما قاله العميل وعرضه عليه — خصوصًا حديث التغيير. وظائفه: جمع الخيوط، الربط بين نقاط متفرقة، والانتقال إلى مرحلة تالية.</p>\n<h3>4. حديث التغيير وحديث المحافظة</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>النوع</th><th>الاختصار</th><th>أمثلة</th></tr></thead><tbody><tr><td><strong>الرغبة</strong></td><td>Desire</td><td>\"نفسي أخس\"</td></tr><tr><td><strong>القدرة</strong></td><td>Ability</td><td>\"أقدر أمشي بعد الشغل\"</td></tr><tr><td><strong>الأسباب</strong></td><td>Reasons</td><td>\"عايز أبقى موجود لأولادي\"</td></tr><tr><td><strong>الحاجة</strong></td><td>Need</td><td>\"لازم أعمل حاجة قبل ما السكر يتعب\"</td></tr><tr><td><strong>الالتزام</strong></td><td>Commitment</td><td>\"هبدأ من بكرة\"</td></tr><tr><td><strong>التفعيل</strong></td><td>Activation</td><td>\"مستعد أجرب\"</td></tr><tr><td><strong>خطوات فعلية</strong></td><td>Taking steps</td><td>\"اشتريت جزمة رياضة\"</td></tr></tbody></table></div>\n<p>القاعدة: <strong>ما يقوله العميل بنفسه يُقنعه أكثر مما تقوله أنت.</strong> فإذا سمعت حديث تغيير، <strong>اعكسه وقوّه</strong> واطلب تفصيلًا: \"إيه اللي هيتغير في حياتك لو عملت كده؟\"</p>\n<p>أما <strong>حديث المحافظة</strong> (\"بس أنا مشغول\") فلا تجادله؛ اعكسه بحياد، أو اعكسه مزدوجًا مع جانب التغيير.</p>\n<h3>5. سلالم الأهمية والثقة</h3>\n<pre class=\"calc\"><code>&quot;من 0 لـ 10، قد إيه مهم بالنسبة لك إنك تقلل السكر؟&quot;\nالعميل: &quot;6&quot;\nالسؤال الصحيح: &quot;وليه 6 مش 3؟&quot;</code></pre>\n<p><strong>لماذا هذا السؤال تحديدًا؟</strong> لأنه يجعل العميل يشرح <strong>أسبابه للتغيير</strong> — أي ينتج حديث تغيير. أما \"ليه مش 9؟\" فيجعله يسرد <strong>عوائقه</strong> — أي ينتج حديث محافظة.</p>\n<p>ثم: \"إيه اللي ممكن يخلي الرقم يبقى 7؟\" — سؤال يفتح باب الحلول دون فرضها.</p>\n<p><strong>سلم الثقة</strong> يعمل بنفس الطريقة، ويُكشف به الفرق المهم: كثيرون يرون التغيير <strong>مهمًا</strong> لكنهم <strong>غير واثقين</strong> من قدرتهم عليه. هؤلاء لا يحتاجون إقناعًا، بل أهدافًا أصغر.</p>\n<h3>6. تقديم المعلومة: استخرج – قدّم – استخرج</h3>\n<p>المعلومة نفسها تُستقبل بطريقة مختلفة تمامًا حسب طريقة تقديمها:</p>\n<ol><li><strong>استخرج:</strong> \"إيه اللي تعرفه عن تأثير الملح على الضغط؟\" (اكتشف ما يعرفه بالفعل، لا تكرره عليه)</li><li><strong>قدّم:</strong> بالاستئذان، باختصار، بلا تهويل: \"تحب أقولك اللي الدراسات بتقوله؟\"</li><li><strong>استخرج:</strong> \"إيه رأيك في ده؟ ينطبق عليك إزاي؟\"</li></ol>\n<h3>7. التنافر بدل \"المقاومة\"</h3>\n<p>في الطبعات الحديثة استبدل المؤلفان مفهوم \"المقاومة\" بـ<strong>التنافر (Discord)</strong>: علامة على أن <strong>العلاقة</strong> تحتاج تعديلًا، لا على أن العميل مشكلة. حين تشعر بالجدال، الدفاع، المقاطعة، أو التجاهل — توقف، وراجع ما تفعله أنت.</p>\n<h2>مهارات ستستخدمها غدًا</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموقف</th><th>الأداة</th></tr></thead><tbody><tr><td>العميل يبدأ الجلسة متوترًا</td><td>سؤال مفتوح + انعكاس للمشاعر</td></tr><tr><td>العميل يقول \"مفيش فايدة\"</td><td>انعكاس مزدوج + سؤال عن نجاح سابق</td></tr><tr><td>تريد إعطاء معلومة</td><td>استخرج – قدّم – استخرج</td></tr><tr><td>العميل متردد</td><td>سلم الأهمية: \"ليه X مش أقل؟\"</td></tr><tr><td>العميل مقتنع لكن غير واثق</td><td>سلم الثقة + تصغير الهدف</td></tr><tr><td>تشعر بالجدال</td><td>توقف عن الدفع، اعكس، اعترف باستقلاليته</td></tr><tr><td>نهاية الجلسة</td><td>تلخيص لحديث التغيير + سؤال: \"إيه الخطوة الجاية؟\"</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — مقارنة جلستين:</strong> امرأة 45 سنة، سكر صائم 118، زائدة الوزن، أرسلها الطبيب.</p>\n<p><strong>الجلسة الأولى (بدافع التصحيح):</strong> الأخصائي: \"السكر عندك في مرحلة ما قبل السكري، ولازم تخسي 7% من وزنك.\" العميلة: \"أنا عارفة، بس الشغل ما بيخلنيش أطبخ.\" الأخصائي: \"ممكن تحضّري الأكل يوم الجمعة للأسبوع كله.\" العميلة: \"جربت، بيبوظ.\" الأخصائي: \"طيب خدي أكل جاهز صحي.\" العميلة: \"غالي.\" <em>(كل اقتراح يقابله \"بس\". العميلة تقنع نفسها بأنها لن تستطيع.)</em></p>\n<p><strong>الجلسة الثانية (بروح المقابلة التحفيزية):</strong> الأخصائي: \"الدكتور بعتك، بس أنا عايزة أعرف رأيك أنتِ. إيه اللي شاغلك في الموضوع؟\" العميلة: \"أمي كان عندها سكر ورجلها اتقطعت.\" الأخصائي: <em>(انعكاس مركّب)</em> \"شفتِ بعينك اللي ممكن يعمله، ومش عايزة ده يحصلك.\" العميلة: \"أبدًا. بس الشغل صعب.\" الأخصائي: <em>(انعكاس مزدوج)</em> \"عندك سبب قوي جدًا تتحركي، وفي نفس الوقت ظروفك صعبة فعلًا.\" العميلة: \"أيوه... يمكن أقدر على حاجة بسيطة.\" الأخصائي: \"زي إيه؟\" <em>(العميلة هي من تقترح الحل الآن — وهذا ما يجعله قابلًا للتنفيذ.)</em></p></blockquote>\n<h2>أخطاء شائعة عند تعلم المنهج</h2>\n<ul><li><strong>البحث عن سكربتات جاهزة.</strong> الكتاب يعلّم مهارة، والمهارة لا تُختصر في عبارات محفوظة.</li><li><strong>استخدام الأسئلة بدل الانعكاسات.</strong> الأسئلة المتتالية استجواب مهذب.</li><li><strong>التظاهر بالروح مع إبقاء الهدف الخفي \"إقناعه\".</strong> العملاء يلتقطون ذلك سريعًا.</li><li><strong>الاستعجال في التخطيط</strong> قبل أن يكون العميل جاهزًا.</li><li><strong>الاعتقاد بأن القراءة تكفي.</strong> الأبحاث تُظهر أن ورشة واحدة دون متابعة وتغذية راجعة لا تغيّر الممارسة الفعلية كثيرًا.</li></ul>\n<h2>كيف تتعلمه فعلًا: خطة ستة أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>القراءة</th><th>التدريب</th></tr></thead><tbody><tr><td>1</td><td>الروح والعمليات الأربع</td><td>راقب نفسك في جلسة: كم مرة وقعت في مصيدة التصحيح؟</td></tr><tr><td>2</td><td>الإشراك و OARS</td><td>في كل جلسة: انعكاسان لكل سؤال</td></tr><tr><td>3</td><td>الانعكاس المركّب</td><td>اكتب 3 انعكاسات بمستويات مختلفة لـ 10 عبارات عملاء</td></tr><tr><td>4</td><td>التركيز وتقديم المعلومة</td><td>طبّق استخرج–قدّم–استخرج في كل نصيحة</td></tr><tr><td>5</td><td>الاستحضار وحديث التغيير</td><td>استخدم السلالم في كل جلسة، وسجّل حديث التغيير</td></tr><tr><td>6</td><td>التخطيط والتنافر</td><td>سجّل جلسة (بإذن) واحسب: نسبة كلامك، عدد الانعكاسات المركّبة</td></tr></tbody></table></div>\n<p><strong>مقياس التقدم:</strong> الممارسون المتمكنون يستخدمون انعكاسات أكثر من الأسئلة، ونسبة كبيرة منها مركّبة، ويتحدث العميل أكثر منهم.</p>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> منهج مدعوم بأدلة واسعة في مجالات صحية متعددة، يغيّر طريقة الممارسة لا المعلومات فقط، وقابل للتطبيق في أي تخصص.</p>\n<p><strong>الضعف:</strong> كتاب مهارة يتطلب تدريبًا عمليًا لا تغني عنه القراءة، وأمثلته عامة لا غذائية — لذلك يُستكمل بكتاب Clifford &amp; Curtis.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>تذكّر آخر مرة نصحت فيها أحدًا بتغيير شيء فرفض. ما الذي فعلته أنت وربما زاد مقاومته؟</li><li>اكتب انعكاسًا مزدوجًا لعميل يقول: \"عارف إن الحلويات مضرة بس هي الحاجة الوحيدة اللي بتبسطني.\"</li><li>لماذا يُعدّ السؤال \"ليه مش 9؟\" ضارًا رغم أنه يبدو بريئًا؟</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Clifford &amp; Curtis — Motivational Interviewing in Nutrition and Fitness</strong> للتطبيق الغذائي المباشر · <strong>Glanz — Health Behavior</strong> لنظريات تغيير السلوك · <strong>تدريب عملي معتمد</strong> مع تغذية راجعة على جلسات مسجلة.</p>", "text": "Motivational Interviewing: Helping People Change المؤلفان William R. Miller و Stephen Rollnick — مؤسسا المنهج المستوى لكل من يجلس أمام إنسان يحتاج تغييرًا الجمهور أخصائيو التغذية، الأطباء، الممرضون، المعالجون، المدربون الطابع كتاب مهارة لا كتاب معلومات أصله نشأ المنهج في علاج الإدمان ثم انتشر إلى كل مجالات تغيير السلوك الصحي التطبيق الغذائي Motivational Interviewing in Nutrition and Fitness (Clifford & Curtis) الفكرة التي تقلب الطاولة يدخل معظم أخصائيي التغذية المهنة بافتراض ضمني: المريض لا يتغير لأنه لا يعرف . فإن أعطيناه المعلومة الصحيحة سيتغير. لكن المدخن يعرف أن التدخين يقتل، ومريض السكري يعرف أن السكر يضره. المعرفة نادرًا ما تكون المشكلة. يطرح هذا الكتاب افتراضًا مختلفًا: معظم الناس مترددون — يريدون التغيير ولا يريدونه في الوقت نفسه. والتردد طبيعي لا مرضي. حين يدفعهم المرشد بقوة نحو التغيير، يدافعون تلقائيًا عن الجانب الآخر من ترددهم: \"بس أنا مشغول\"، \"أنا جربت قبل كده\"، \"عيلتي كلها كده\". وكلما سمع الإنسان نفسه يدافع عن البقاء كما هو، ازداد اقتناعًا به. النتيجة الصادمة: مقاومة العميل غالبًا ما يصنعها أسلوب المرشد، لا عناد العميل. خريطة الكتاب الجزء الأول: ما المقابلة التحفيزية؟ التعريف بمستوياته: الوصف العام، التعريف المهني، والتعريف التقني. الروح: الشراكة، التقبّل، الرحمة، الاستحضار. العمليات الأربع: الإشراك، التركيز، الاستحضار، التخطيط. الجزء الثاني: الإشراك (Engaging) بناء علاقة عمل. المهارات الأساسية: الأسئلة المفتوحة، الإثبات، الانعكاس، التلخيص. وما يعيق الإشراك: فخ الأسئلة والإجابات، فخ الخبير، فخ التشخيص المبكر، فخ اللوم. الجزء الثالث: التركيز (Focusing) تحديد اتجاه الحوار: ماذا نناقش؟ أي سلوك؟ كيف نختار حين تتعدد المشكلات؟ وكيف نقدم المعلومة والنصيحة بطريقة تحترم استقلالية العميل. الجزء الرابع: الاستحضار (Evoking) قلب المنهج: التعرف على حديث التغيير وتقويته، والتعامل مع حديث المحافظة ، والتعامل مع التنافر في العلاقة، وتطوير الأمل والثقة. الجزء الخامس: التخطيط (Planning) الانتقال من \"أريد\" إلى \"سأفعل\": متى تعرف أن العميل جاهز، كيف تبني خطة معه لا له، وكيف تدعم الالتزام. الجزء السادس: التطبيق والتعلم كيف تتعلم المنهج، كيف تقيس جودة ممارستك، وتطبيقاته في سياقات مختلفة. المفاهيم المحورية بالتفصيل 1. الروح قبل التقنية يصرّ الكتاب على أن من يطبق التقنيات دون الروح لا يمارس المقابلة التحفيزية، بل يمارس تلاعبًا بأدوات لطيفة. عنصر الروح المعنى العملي الشراكة أنت خبير في التغذية، والعميل خبير في حياته. الخطة تُبنى معًا. التقبّل احترام قيمة الإنسان، الاعتراف باستقلاليته، التعاطف الدقيق، والإثبات. الرحمة العمل لمصلحة العميل الحقيقية، لا لمصلحتك أو لإرضاء رئيسك. الاستحضار الدافع والحكمة موجودان لدى العميل؛ مهمتك استخراجهما. 2. مصيدة التصحيح (The Righting Reflex) الرغبة الغريزية لدى أي مهني في \"تصحيح\" مسار العميل: تحذيره، إقناعه، تقديم الحل له. هي نابعة من نية حسنة، لكنها تثير المقاومة. ❌ رد بدافع التصحيح ✅ رد بروح المقابلة التحفيزية \"لازم تبطل المشروبات الغازية فورًا، ده سكر خالص.\" \"إيه رأيك في كمية المشروبات الغازية اللي بتشربها؟\" \"النظام ده هينجح لو التزمت بس.\" \"إيه اللي ساعدك في المرات اللي التزمت فيها؟\" \"أنت عارف إن ده بيضر الكلى.\" \"إيه اللي تعرفه عن تأثير ده على صحتك؟\" 3. مهارات OARS بالتفصيل الأسئلة المفتوحة (Open questions): تدعو للسرد لا للإجابة بنعم/لا. لكن الكتاب يحذر من فخ الأسئلة : سلسلة أسئلة متتالية تحوّل الجلسة إلى استجواب. القاعدة العملية: انعكاسان على الأقل لكل سؤال. الإثبات (Affirmations): الاعتراف بقوة حقيقية أو جهد لدى العميل. يختلف عن المديح: المديح حكم من فوق (\"ممتاز!\")، والإثبات اعتراف بشيء فيه (\"واضح إنك بتهتم بصحة أولادك جدًا\"). الانعكاس (Reflections): المهارة المركزية. ثلاثة مستويات: النوع المثال (العميل: \"أنا جربت كل الرجيمات وفشلت\") بسيط — تكرار أو إعادة صياغة \"جربت أنظمة كتير.\" مركّب — إضافة معنى ضمني \"تعبت من إنك تحاول وما توصلش.\" مزدوج الجانب — يعكس طرفي التردد \"من ناحية حاسس إنه مفيش فايدة، ومن ناحية تانية لسه بتحاول، ودليل ده إنك هنا.\" الانعكاس المركّب يُشعر العميل بأنه مفهوم ، وهذا ما يفتح الحوار. التلخيص (Summaries): جمع ما قاله العميل وعرضه عليه — خصوصًا حديث التغيير. وظائفه: جمع الخيوط، الربط بين نقاط متفرقة، والانتقال إلى مرحلة تالية. 4. حديث التغيير وحديث المحافظة النوع الاختصار أمثلة الرغبة Desire \"نفسي أخس\" القدرة Ability \"أقدر أمشي بعد الشغل\" الأسباب Reasons \"عايز أبقى موجود لأولادي\" الحاجة Need \"لازم أعمل حاجة قبل ما السكر يتعب\" الالتزام Commitment \"هبدأ من بكرة\" التفعيل Activation \"مستعد أجرب\" خطوات فعلية Taking steps \"اشتريت جزمة رياضة\" القاعدة: ما يقوله العميل بنفسه يُقنعه أكثر مما تقوله أنت. فإذا سمعت حديث تغيير، اعكسه وقوّه واطلب تفصيلًا: \"إيه اللي هيتغير في حياتك لو عملت كده؟\" أما حديث المحافظة (\"بس أنا مشغول\") فلا تجادله؛ اعكسه بحياد، أو اعكسه مزدوجًا مع جانب التغيير. 5. سلالم الأهمية والثقة \"من 0 لـ 10، قد إيه مهم بالنسبة لك إنك تقلل السكر؟\" العميل: \"6\" السؤال الصحيح: \"وليه 6 مش 3؟\" لماذا هذا السؤال تحديدًا؟ لأنه يجعل العميل يشرح أسبابه للتغيير — أي ينتج حديث تغيير. أما \"ليه مش 9؟\" فيجعله يسرد عوائقه — أي ينتج حديث محافظة. ثم: \"إيه اللي ممكن يخلي الرقم يبقى 7؟\" — سؤال يفتح باب الحلول دون فرضها. سلم الثقة يعمل بنفس الطريقة، ويُكشف به الفرق المهم: كثيرون يرون التغيير مهمًا لكنهم غير واثقين من قدرتهم عليه. هؤلاء لا يحتاجون إقناعًا، بل أهدافًا أصغر. 6. تقديم المعلومة: استخرج – قدّم – استخرج المعلومة نفسها تُستقبل بطريقة مختلفة تمامًا حسب طريقة تقديمها: 1. استخرج: \"إيه اللي تعرفه عن تأثير الملح على الضغط؟\" (اكتشف ما يعرفه بالفعل، لا تكرره عليه) 2. قدّم: بالاستئذان، باختصار، بلا تهويل: \"تحب أقولك اللي الدراسات بتقوله؟\" 3. استخرج: \"إيه رأيك في ده؟ ينطبق عليك إزاي؟\" 7. التنافر بدل \"المقاومة\" في الطبعات الحديثة استبدل المؤلفان مفهوم \"المقاومة\" بـ التنافر (Discord) : علامة على أن العلاقة تحتاج تعديلًا، لا على أن العميل مشكلة. حين تشعر بالجدال، الدفاع، المقاطعة، أو التجاهل — توقف، وراجع ما تفعله أنت. مهارات ستستخدمها غدًا الموقف الأداة العميل يبدأ الجلسة متوترًا سؤال مفتوح + انعكاس للمشاعر العميل يقول \"مفيش فايدة\" انعكاس مزدوج + سؤال عن نجاح سابق تريد إعطاء معلومة استخرج – قدّم – استخرج العميل متردد سلم الأهمية: \"ليه X مش أقل؟\" العميل مقتنع لكن غير واثق سلم الثقة + تصغير الهدف تشعر بالجدال توقف عن الدفع، اعكس، اعترف باستقلاليته نهاية الجلسة تلخيص لحديث التغيير + سؤال: \"إيه الخطوة الجاية؟\" مثال تطبيقي بأسلوب الكتاب مثال — مقارنة جلستين: امرأة 45 سنة، سكر صائم 118، زائدة الوزن، أرسلها الطبيب. الجلسة الأولى (بدافع التصحيح): الأخصائي: \"السكر عندك في مرحلة ما قبل السكري، ولازم تخسي 7% من وزنك.\" العميلة: \"أنا عارفة، بس الشغل ما بيخلنيش أطبخ.\" الأخصائي: \"ممكن تحضّري الأكل يوم الجمعة للأسبوع كله.\" العميلة: \"جربت، بيبوظ.\" الأخصائي: \"طيب خدي أكل جاهز صحي.\" العميلة: \"غالي.\" (كل اقتراح يقابله \"بس\". العميلة تقنع نفسها بأنها لن تستطيع.) الجلسة الثانية (بروح المقابلة التحفيزية): الأخصائي: \"الدكتور بعتك، بس أنا عايزة أعرف رأيك أنتِ. إيه اللي شاغلك في الموضوع؟\" العميلة: \"أمي كان عندها سكر ورجلها اتقطعت.\" الأخصائي: (انعكاس مركّب) \"شفتِ بعينك اللي ممكن يعمله، ومش عايزة ده يحصلك.\" العميلة: \"أبدًا. بس الشغل صعب.\" الأخصائي: (انعكاس مزدوج) \"عندك سبب قوي جدًا تتحركي، وفي نفس الوقت ظروفك صعبة فعلًا.\" العميلة: \"أيوه... يمكن أقدر على حاجة بسيطة.\" الأخصائي: \"زي إيه؟\" (العميلة هي من تقترح الحل الآن — وهذا ما يجعله قابلًا للتنفيذ.) أخطاء شائعة عند تعلم المنهج البحث عن سكربتات جاهزة. الكتاب يعلّم مهارة، والمهارة لا تُختصر في عبارات محفوظة. استخدام الأسئلة بدل الانعكاسات. الأسئلة المتتالية استجواب مهذب. التظاهر بالروح مع إبقاء الهدف الخفي \"إقناعه\". العملاء يلتقطون ذلك سريعًا. الاستعجال في التخطيط قبل أن يكون العميل جاهزًا. الاعتقاد بأن القراءة تكفي. الأبحاث تُظهر أن ورشة واحدة دون متابعة وتغذية راجعة لا تغيّر الممارسة الفعلية كثيرًا. كيف تتعلمه فعلًا: خطة ستة أسابيع الأسبوع القراءة التدريب 1 الروح والعمليات الأربع راقب نفسك في جلسة: كم مرة وقعت في مصيدة التصحيح؟ 2 الإشراك و OARS في كل جلسة: انعكاسان لكل سؤال 3 الانعكاس المركّب اكتب 3 انعكاسات بمستويات مختلفة لـ 10 عبارات عملاء 4 التركيز وتقديم المعلومة طبّق استخرج–قدّم–استخرج في كل نصيحة 5 الاستحضار وحديث التغيير استخدم السلالم في كل جلسة، وسجّل حديث التغيير 6 التخطيط والتنافر سجّل جلسة (بإذن) واحسب: نسبة كلامك، عدد الانعكاسات المركّبة مقياس التقدم: الممارسون المتمكنون يستخدمون انعكاسات أكثر من الأسئلة، ونسبة كبيرة منها مركّبة، ويتحدث العميل أكثر منهم. نقاط القوة والضعف القوة: منهج مدعوم بأدلة واسعة في مجالات صحية متعددة، يغيّر طريقة الممارسة لا المعلومات فقط، وقابل للتطبيق في أي تخصص. الضعف: كتاب مهارة يتطلب تدريبًا عمليًا لا تغني عنه القراءة، وأمثلته عامة لا غذائية — لذلك يُستكمل بكتاب Clifford & Curtis. أسئلة للتأمل بعد القراءة 1. تذكّر آخر مرة نصحت فيها أحدًا بتغيير شيء فرفض. ما الذي فعلته أنت وربما زاد مقاومته؟ 2. اكتب انعكاسًا مزدوجًا لعميل يقول: \"عارف إن الحلويات مضرة بس هي الحاجة الوحيدة اللي بتبسطني.\" 3. لماذا يُعدّ السؤال \"ليه مش 9؟\" ضارًا رغم أنه يبدو بريئًا؟ ماذا تقرأ بعده؟ Clifford & Curtis — Motivational Interviewing in Nutrition and Fitness للتطبيق الغذائي المباشر · Glanz — Health Behavior لنظريات تغيير السلوك · تدريب عملي معتمد مع تغذية راجعة على جلسات مسجلة."}, {"i": 39, "group": "books", "tag": "مكتبة المراجع", "num": "9", "short": "Whitney — الأساسيات", "html": "<h1>Understanding Nutrition</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>المؤلفتان</strong></td><td>Ellie Whitney و Sharon Rady Rolfes</td></tr><tr><td><strong>المستوى</strong></td><td>تمهيدي</td></tr><tr><td><strong>الجمهور</strong></td><td>طلاب السنة الأولى في التغذية والعلوم الصحية، المهتمون بالتغذية من خارج التخصص، من يعلّم التغذية للجمهور</td></tr><tr><td><strong>الطابع</strong></td><td>كتاب دراسي تربوي متدرج، من أكثر كتب التغذية التمهيدية انتشارًا</td></tr><tr><td><strong>ما يليه</strong></td><td>Gropper للأيض، Krause للإكلينيكي</td></tr></tbody></table></div>\n<h2>لماذا يستحق القراءة رغم بساطته؟</h2>\n<p>قد يبدو كتابًا تمهيديًا لا يحتاجه المتخصص. لكنه يقدم شيئين يفتقدهما كثير من الممارسين:</p>\n<p><strong>الأول: أساس نظيف للمفاهيم.</strong> الخلط بين RDA و EAR، أو بين إجمالي السكريات والسكريات المضافة، أو بين المؤشر والحمل الجلايسيمي، يبدأ من أساس مهزوز. هذا الكتاب يبني هذه المفاهيم بدقة وتدرج.</p>\n<p><strong>الثاني: التفكير النقدي في الادعاءات الغذائية.</strong> في عصر يتلقى فيه الجمهور نصائحه من مواقع التواصل، القدرة على تقييم مصدر المعلومة مهارة مهنية أساسية. والكتاب يعلّمها بشكل منهجي، ويقدم نموذجًا لكيفية شرحها للجمهور.</p>\n<h2>خريطة الكتاب</h2>\n<h3>الأساس: العلم وخطط الأكل</h3>\n<ul><li><strong>التغذية كعلم:</strong> طبيعة البحث العلمي، أنواع الدراسات، وكيف تُبنى التوصيات.</li><li><strong>المرجعيات الغذائية (DRIs):</strong> EAR و RDA و AI و UL و AMDR، ومتى يُستخدم كل منها.</li><li><strong>الأدلة الغذائية وأدوات التخطيط:</strong> نماذج الطبق، أنظمة المجموعات الغذائية، البطاقات الغذائية.</li></ul>\n<h3>الهضم والامتصاص والنقل</h3>\n<p>رحلة الطعام عبر الجهاز الهضمي، الإنزيمات والهرمونات، الامتصاص، والجهازان الدوري واللمفاوي في النقل، والمشكلات الهضمية الشائعة.</p>\n<h3>المغذيات الكبرى</h3>\n<ul><li><strong>الكربوهيدرات:</strong> السكريات والنشا والألياف، تنظيم سكر الدم، المؤشر الجلايسيمي، السكريات المضافة والمحليات.</li><li><strong>الدهون:</strong> الأنواع، الكوليسترول، الأحماض الدهنية الأساسية، الدهون المتحولة، الدهون والصحة.</li><li><strong>البروتين:</strong> الأحماض الأمينية، جودة البروتين، الاحتياج، البروتين النباتي والحيواني.</li></ul>\n<h3>الأيض وتوازن الطاقة</h3>\n<p>نظرة مبسطة على تحويل الطعام إلى طاقة، توازن الطاقة، تركيب الجسم، <strong>ضبط الوزن</strong> (زيادة الوزن ونقصه، الحميات الرائجة، الأدوية والجراحة).</p>\n<h3>المغذيات الدقيقة والماء</h3>\n<p>الفيتامينات الذائبة في الماء وفي الدهون، الماء والمعادن الكبرى، العناصر النزرة — كل منها بوظيفته ومصادره ونقصه وسميته.</p>\n<h3>التطبيق عبر الحياة</h3>\n<p>التغذية والنشاط البدني، الحمل والرضاعة، الرضّع والأطفال والمراهقون، البالغون وكبار السن.</p>\n<h3>التغذية والصحة العامة</h3>\n<p>التغذية والأمراض المزمنة، سلامة الغذاء والتقنيات الغذائية، الجوع والأمن الغذائي عالميًا ومحليًا، والاستدامة البيئية.</p>\n<h3>صناديق التفكير النقدي</h3>\n<p>في نهاية الفصول تقريبًا: نقاشات مركّزة حول موضوعات مثيرة للجدل — المكملات، الحميات الرائجة، الأغذية العضوية، المحليات الصناعية، المعلومات الغذائية المضللة، اضطرابات الأكل، وغيرها.</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. المرجعيات الغذائية: من يُستخدم لماذا</h3>\n<p>هذا أهم ما يجب إتقانه في الكتاب، لأن الخلط فيه يقود لأخطاء مهنية حقيقية.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>القيمة</th><th>المعنى</th><th>الاستخدام الصحيح</th><th>الاستخدام الخاطئ</th></tr></thead><tbody><tr><td><strong>EAR</strong></td><td>يكفي 50% من الأصحاء</td><td>تقييم مدخول <strong>المجموعات</strong></td><td>—</td></tr><tr><td><strong>RDA</strong></td><td>يكفي 97–98% من الأصحاء</td><td>هدف <strong>تخطيطي</strong> للفرد</td><td>الحكم بأن فردًا \"ناقص\" لأنه تحته</td></tr><tr><td><strong>AI</strong></td><td>تقدير عند غياب أدلة كافية لـ RDA</td><td>هدف للفرد</td><td>التعامل معه بدقة RDA</td></tr><tr><td><strong>UL</strong></td><td>أعلى مدخول يومي آمن من كل المصادر</td><td>تجنّب السمية</td><td>اعتباره هدفًا</td></tr><tr><td><strong>AMDR</strong></td><td>نطاق توزيع الطاقة على المغذيات الكبرى</td><td>تخطيط النسب</td><td>—</td></tr></tbody></table></div>\n<p><strong>الدرس الأهم:</strong> من يأخذ أقل من RDA ليس بالضرورة ناقصًا. RDA مصممة لتغطي <strong>تقريبًا الجميع</strong>، فهي أعلى من احتياج معظم الناس. للحكم على نقص فرد تحتاج تقييمًا متعدد المحاور، لا مقارنة مدخول برقم.</p>\n<h3>2. قراءة البطاقة الغذائية بذكاء</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الخطوة</th><th>لماذا</th></tr></thead><tbody><tr><td><strong>حجم الحصة أولًا</strong></td><td>كل الأرقام محسوبة عليه، وأشهر حيلة تسويقية تصغيره</td></tr><tr><td><strong>قارن لكل 100 جم</strong></td><td>لا لكل عبوة، لأن العبوات تختلف</td></tr><tr><td><strong>السكريات المضافة لا الإجمالية</strong></td><td>الإجمالية تشمل سكر الحليب والفاكهة الطبيعي</td></tr><tr><td><strong>قائمة المكونات تنازليًا بالوزن</strong></td><td>أول ثلاثة مكونات تخبرك بماهية المنتج</td></tr><tr><td><strong>أسماء السكر المتعددة</strong></td><td>شراب الجلوكوز، الدكستروز، المالتودكسترين، شراب الذرة...</td></tr><tr><td><strong>الادعاءات التسويقية</strong></td><td>\"خالٍ من الدهون\" لا يعني قليل السعرات، و\"طبيعي\" غالبًا غير منظَّم</td></tr></tbody></table></div>\n<h3>3. المؤشر الجلايسيمي مقابل الحمل الجلايسيمي</h3>\n<ul><li><strong>المؤشر (GI):</strong> سرعة رفع الطعام للسكر مقارنة بالجلوكوز — لكمية ثابتة من الكربوهيدرات (50 جم).</li><li><strong>الحمل (GL):</strong> المؤشر × كمية الكربوهيدرات الفعلية في الحصة ÷ 100.</li></ul>\n<p><strong>المثال الكلاسيكي:</strong> البطيخ مؤشره مرتفع، لكن الحصة العادية فيها كربوهيدرات قليلة، فحمله منخفض. لهذا \"البطيخ ممنوع لمرضى السكري\" معلومة مضللة بالحصص المعتدلة.</p>\n<h3>4. كثافة المغذيات</h3>\n<p>مفهوم تخطيطي محوري: كم من المغذيات المفيدة تحصل عليها <strong>لكل سعرة</strong>؟ كوب حليب وكوب مشروب غازي قد يتقاربان في السعرات، لكن الأول يقدم بروتينًا وكالسيومًا وفيتامينات، والثاني سكرًا فقط. التخطيط الجيد يرفع كثافة المغذيات خصوصًا حين تكون السعرات محدودة (حمية، كبار سن، مرض).</p>\n<h3>5. مبادئ تخطيط النظام الغذائي</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المبدأ</th><th>المعنى</th></tr></thead><tbody><tr><td><strong>الكفاية</strong></td><td>تغطية الاحتياج من كل المغذيات</td></tr><tr><td><strong>التوازن</strong></td><td>عدم طغيان مجموعة على أخرى</td></tr><tr><td><strong>التحكم في الطاقة</strong></td><td>السعرات المناسبة للهدف</td></tr><tr><td><strong>كثافة المغذيات</strong></td><td>أكبر فائدة لكل سعرة</td></tr><tr><td><strong>الاعتدال</strong></td><td>لا منع ولا إفراط في أي شيء</td></tr><tr><td><strong>التنوع</strong></td><td>أطعمة مختلفة داخل كل مجموعة وعبر الأيام</td></tr></tbody></table></div>\n<h3>6. تقييم الادعاءات الغذائية</h3>\n<p>يقدم الكتاب إطارًا عمليًا يمكن نقله للجمهور:</p>\n<p><strong>أعلام حمراء في أي ادعاء:</strong></p>\n<ul><li>وعد بنتائج سريعة وسهلة ومضمونة.</li><li>قصص نجاح شخصية بدل بيانات.</li><li>حديث عن \"سموم\" غامضة دون تسميتها أو قياسها.</li><li>تقسيم الأطعمة إلى \"معجزة\" و\"سم\".</li><li>تخوين العلم والأطباء (\"ما لا يريدونك أن تعرفه\").</li><li>من يقدم النصيحة هو من يبيع المنتج.</li><li>الاستشهاد بدراسة واحدة، أو دراسة على الحيوانات، أو دراسة لم تُنشر.</li></ul>\n<p><strong>أسئلة تطرحها على أي مصدر:</strong> من كتبه؟ ما مؤهله؟ ما دليله؟ هل الدليل من دراسات بشرية محكّمة؟ ما مصلحته؟ هل يتفق مع الإجماع العلمي أم يعارضه — ولماذا؟</p>\n<h3>7. الأمن الغذائي والصورة الاجتماعية</h3>\n<p>ما يميز الكتاب عن كتب الأيض البحتة أنه يضع التغذية في سياقها الاجتماعي: الفقر، الوصول للغذاء، البيئة، الثقافة. هذه ليست \"معلومات عامة\"، بل أساس لممارسة واقعية: الخطة التي يعجز العميل عن شرائها أو طهيها ليست خطة.</p>\n<h2>أرقام يجب أن تخرج بها</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الموضوع</th><th>الرقم</th></tr></thead><tbody><tr><td>السعرات في الجرام</td><td>كربوهيدرات 4، بروتين 4، دهون 9، كحول 7</td></tr><tr><td>AMDR</td><td>كربوهيدرات 45–65%، دهون 20–35%، بروتين 10–35%</td></tr><tr><td>RDA للبروتين</td><td>0.8 جم/كجم للبالغ السليم (حد أدنى لا هدف أمثل)</td></tr><tr><td>الألياف</td><td>25–38 جم/يوم أو 14 جم لكل 1000 kcal</td></tr><tr><td>الصوديوم</td><td>أقل من 2300 مجم/يوم (والصحي أقل من 2000)</td></tr><tr><td>الأحماض الأمينية الأساسية</td><td>9</td></tr><tr><td>الأحماض الدهنية الأساسية</td><td>2 (لينوليك وألفا-لينولينيك)</td></tr><tr><td>الماء</td><td>نحو 30–35 مل/كجم</td></tr><tr><td>1 كجم دهن جسم</td><td>نحو 7700 kcal</td></tr><tr><td>منطقة الخطر للطعام</td><td>5–60 °م</td></tr></tbody></table></div>\n<h2>مثال تطبيقي بأسلوب الكتاب</h2>\n<blockquote class=\"model\"><p><strong>مثال — تفكيك منشور رائج:</strong> منشور على مواقع التواصل يقول: \"هذا الشاي العشبي يحرق دهون البطن ويطرد السموم! جربته وخسرت 5 كيلو في أسبوع. دراسة أثبتت أنه يرفع الأيض 300%. اطلبه الآن بخصم 50%.\"</p>\n<p><strong>التحليل بأدوات الكتاب:</strong></p>\n<ul><li><strong>\"يحرق دهون البطن\":</strong> لا يمكن حرق الدهون موضعيًا؛ التوزيع محدد وراثيًا وهرمونيًا.</li><li><strong>\"يطرد السموم\":</strong> أي سموم؟ لم تُسمَّ ولم تُقَس. الكبد والكلى يؤديان هذه الوظيفة.</li><li><strong>\"5 كيلو في أسبوع\":</strong> فقد 5 كجم دهون يتطلب عجزًا يقارب 38,500 kcal في أسبوع — مستحيل. الفقد غالبًا ماء (وكثير من هذه الشاي مدرّ أو ملين).</li><li><strong>\"دراسة أثبتت\":</strong> أي دراسة؟ على من؟ كم شخصًا؟ هل نُشرت؟ رفع الأيض 300% يعادل تمرينًا شاقًا مستمرًا — ادعاء غير منطقي.</li><li><strong>\"اطلبه الآن بخصم\":</strong> من يقدم النصيحة يبيع المنتج — تعارض مصالح صريح.</li></ul>\n<p><strong>الخلاصة للجمهور:</strong> ستة أعلام حمراء في منشور واحد.</p></blockquote>\n<h2>أخطاء شائعة عند قراءة الكتاب</h2>\n<ul><li><strong>التعامل معه كمرجع نهائي.</strong> هو بداية ممتازة، لكنه سطحي أيضيًا وإكلينيكيًا.</li><li><strong>تخطي صناديق التفكير النقدي</strong> لأنها \"جانبية\". هي من أثمن ما في الكتاب.</li><li><strong>حفظ الأرقام دون فهم المرجعيات.</strong> معرفة أن RDA للبروتين 0.8 بلا فهم أنها حد أدنى تقود لأخطاء.</li><li><strong>تجاهل الأسئلة في نهاية الفصول.</strong> تصميمها التربوي جيد ويكشف الفجوات.</li></ul>\n<h2>كيف تذاكره: خطة ثمانية أسابيع</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>الأسبوع</th><th>المحتوى</th><th>التطبيق</th></tr></thead><tbody><tr><td>1</td><td>العلم والمرجعيات والأدلة الغذائية</td><td>اقرأ 5 بطاقات غذائية وقيّمها</td></tr><tr><td>2</td><td>الهضم والكربوهيدرات</td><td>احسب GL لخمسة أطعمة</td></tr><tr><td>3</td><td>الدهون والبروتين</td><td>قارن جودة 5 مصادر بروتين</td></tr><tr><td>4</td><td>الأيض وتوازن الطاقة</td><td>احسب احتياجك وتابعه أسبوعًا</td></tr><tr><td>5</td><td>الفيتامينات</td><td>جدول: الوظيفة، المصدر، النقص، السمية</td></tr><tr><td>6</td><td>المعادن والماء</td><td>ركّز على الحديد والكالسيوم والصوديوم</td></tr><tr><td>7</td><td>مراحل الحياة والنشاط</td><td>صمم يومًا غذائيًا لثلاث فئات عمرية</td></tr><tr><td>8</td><td>سلامة الغذاء والأمن الغذائي والتفكير النقدي</td><td>فكّك 5 منشورات غذائية رائجة</td></tr></tbody></table></div>\n<h2>نقاط القوة والضعف</h2>\n<p><strong>القوة:</strong> تدرج تربوي ممتاز، وضوح في المفاهيم، صناديق التفكير النقدي، شمول للجوانب الاجتماعية، وتمارين ومراجعات مصممة جيدًا.</p>\n<p><strong>الضعف:</strong> سطحي أيضيًا مقارنة بـ Gropper، محدود إكلينيكيًا مقارنة بـ Krause، وأمثلته الغذائية أمريكية.</p>\n<h2>أسئلة للتأمل بعد القراءة</h2>\n<ol><li>شخص يأخذ 60 مجم فيتامين C يوميًا والـ RDA له 90 مجم — هل هو ناقص؟ ماذا تحتاج لتحكم؟</li><li>اختر منتجين متشابهين من السوق وقارن بطاقتيهما بالخطوات الست.</li><li>فكّك أحدث منشور غذائي رأيته بأعلام الكتاب الحمراء.</li></ol>\n<h2>ماذا تقرأ بعده؟</h2>\n<p><strong>Gropper — Advanced Nutrition and Human Metabolism</strong> لتعميق الأيض · <strong>Krause</strong> للتطبيق الإكلينيكي · <strong>Present Knowledge in Nutrition</strong> لمتابعة العلم.</p>", "text": "Understanding Nutrition المؤلفتان Ellie Whitney و Sharon Rady Rolfes المستوى تمهيدي الجمهور طلاب السنة الأولى في التغذية والعلوم الصحية، المهتمون بالتغذية من خارج التخصص، من يعلّم التغذية للجمهور الطابع كتاب دراسي تربوي متدرج، من أكثر كتب التغذية التمهيدية انتشارًا ما يليه Gropper للأيض، Krause للإكلينيكي لماذا يستحق القراءة رغم بساطته؟ قد يبدو كتابًا تمهيديًا لا يحتاجه المتخصص. لكنه يقدم شيئين يفتقدهما كثير من الممارسين: الأول: أساس نظيف للمفاهيم. الخلط بين RDA و EAR، أو بين إجمالي السكريات والسكريات المضافة، أو بين المؤشر والحمل الجلايسيمي، يبدأ من أساس مهزوز. هذا الكتاب يبني هذه المفاهيم بدقة وتدرج. الثاني: التفكير النقدي في الادعاءات الغذائية. في عصر يتلقى فيه الجمهور نصائحه من مواقع التواصل، القدرة على تقييم مصدر المعلومة مهارة مهنية أساسية. والكتاب يعلّمها بشكل منهجي، ويقدم نموذجًا لكيفية شرحها للجمهور. خريطة الكتاب الأساس: العلم وخطط الأكل التغذية كعلم: طبيعة البحث العلمي، أنواع الدراسات، وكيف تُبنى التوصيات. المرجعيات الغذائية (DRIs): EAR و RDA و AI و UL و AMDR، ومتى يُستخدم كل منها. الأدلة الغذائية وأدوات التخطيط: نماذج الطبق، أنظمة المجموعات الغذائية، البطاقات الغذائية. الهضم والامتصاص والنقل رحلة الطعام عبر الجهاز الهضمي، الإنزيمات والهرمونات، الامتصاص، والجهازان الدوري واللمفاوي في النقل، والمشكلات الهضمية الشائعة. المغذيات الكبرى الكربوهيدرات: السكريات والنشا والألياف، تنظيم سكر الدم، المؤشر الجلايسيمي، السكريات المضافة والمحليات. الدهون: الأنواع، الكوليسترول، الأحماض الدهنية الأساسية، الدهون المتحولة، الدهون والصحة. البروتين: الأحماض الأمينية، جودة البروتين، الاحتياج، البروتين النباتي والحيواني. الأيض وتوازن الطاقة نظرة مبسطة على تحويل الطعام إلى طاقة، توازن الطاقة، تركيب الجسم، ضبط الوزن (زيادة الوزن ونقصه، الحميات الرائجة، الأدوية والجراحة). المغذيات الدقيقة والماء الفيتامينات الذائبة في الماء وفي الدهون، الماء والمعادن الكبرى، العناصر النزرة — كل منها بوظيفته ومصادره ونقصه وسميته. التطبيق عبر الحياة التغذية والنشاط البدني، الحمل والرضاعة، الرضّع والأطفال والمراهقون، البالغون وكبار السن. التغذية والصحة العامة التغذية والأمراض المزمنة، سلامة الغذاء والتقنيات الغذائية، الجوع والأمن الغذائي عالميًا ومحليًا، والاستدامة البيئية. صناديق التفكير النقدي في نهاية الفصول تقريبًا: نقاشات مركّزة حول موضوعات مثيرة للجدل — المكملات، الحميات الرائجة، الأغذية العضوية، المحليات الصناعية، المعلومات الغذائية المضللة، اضطرابات الأكل، وغيرها. المفاهيم المحورية بالتفصيل 1. المرجعيات الغذائية: من يُستخدم لماذا هذا أهم ما يجب إتقانه في الكتاب، لأن الخلط فيه يقود لأخطاء مهنية حقيقية. القيمة المعنى الاستخدام الصحيح الاستخدام الخاطئ EAR يكفي 50% من الأصحاء تقييم مدخول المجموعات — RDA يكفي 97–98% من الأصحاء هدف تخطيطي للفرد الحكم بأن فردًا \"ناقص\" لأنه تحته AI تقدير عند غياب أدلة كافية لـ RDA هدف للفرد التعامل معه بدقة RDA UL أعلى مدخول يومي آمن من كل المصادر تجنّب السمية اعتباره هدفًا AMDR نطاق توزيع الطاقة على المغذيات الكبرى تخطيط النسب — الدرس الأهم: من يأخذ أقل من RDA ليس بالضرورة ناقصًا. RDA مصممة لتغطي تقريبًا الجميع ، فهي أعلى من احتياج معظم الناس. للحكم على نقص فرد تحتاج تقييمًا متعدد المحاور، لا مقارنة مدخول برقم. 2. قراءة البطاقة الغذائية بذكاء الخطوة لماذا حجم الحصة أولًا كل الأرقام محسوبة عليه، وأشهر حيلة تسويقية تصغيره قارن لكل 100 جم لا لكل عبوة، لأن العبوات تختلف السكريات المضافة لا الإجمالية الإجمالية تشمل سكر الحليب والفاكهة الطبيعي قائمة المكونات تنازليًا بالوزن أول ثلاثة مكونات تخبرك بماهية المنتج أسماء السكر المتعددة شراب الجلوكوز، الدكستروز، المالتودكسترين، شراب الذرة... الادعاءات التسويقية \"خالٍ من الدهون\" لا يعني قليل السعرات، و\"طبيعي\" غالبًا غير منظَّم 3. المؤشر الجلايسيمي مقابل الحمل الجلايسيمي المؤشر (GI): سرعة رفع الطعام للسكر مقارنة بالجلوكوز — لكمية ثابتة من الكربوهيدرات (50 جم). الحمل (GL): المؤشر × كمية الكربوهيدرات الفعلية في الحصة ÷ 100. المثال الكلاسيكي: البطيخ مؤشره مرتفع، لكن الحصة العادية فيها كربوهيدرات قليلة، فحمله منخفض. لهذا \"البطيخ ممنوع لمرضى السكري\" معلومة مضللة بالحصص المعتدلة. 4. كثافة المغذيات مفهوم تخطيطي محوري: كم من المغذيات المفيدة تحصل عليها لكل سعرة ؟ كوب حليب وكوب مشروب غازي قد يتقاربان في السعرات، لكن الأول يقدم بروتينًا وكالسيومًا وفيتامينات، والثاني سكرًا فقط. التخطيط الجيد يرفع كثافة المغذيات خصوصًا حين تكون السعرات محدودة (حمية، كبار سن، مرض). 5. مبادئ تخطيط النظام الغذائي المبدأ المعنى الكفاية تغطية الاحتياج من كل المغذيات التوازن عدم طغيان مجموعة على أخرى التحكم في الطاقة السعرات المناسبة للهدف كثافة المغذيات أكبر فائدة لكل سعرة الاعتدال لا منع ولا إفراط في أي شيء التنوع أطعمة مختلفة داخل كل مجموعة وعبر الأيام 6. تقييم الادعاءات الغذائية يقدم الكتاب إطارًا عمليًا يمكن نقله للجمهور: أعلام حمراء في أي ادعاء: وعد بنتائج سريعة وسهلة ومضمونة. قصص نجاح شخصية بدل بيانات. حديث عن \"سموم\" غامضة دون تسميتها أو قياسها. تقسيم الأطعمة إلى \"معجزة\" و\"سم\". تخوين العلم والأطباء (\"ما لا يريدونك أن تعرفه\"). من يقدم النصيحة هو من يبيع المنتج. الاستشهاد بدراسة واحدة، أو دراسة على الحيوانات، أو دراسة لم تُنشر. أسئلة تطرحها على أي مصدر: من كتبه؟ ما مؤهله؟ ما دليله؟ هل الدليل من دراسات بشرية محكّمة؟ ما مصلحته؟ هل يتفق مع الإجماع العلمي أم يعارضه — ولماذا؟ 7. الأمن الغذائي والصورة الاجتماعية ما يميز الكتاب عن كتب الأيض البحتة أنه يضع التغذية في سياقها الاجتماعي: الفقر، الوصول للغذاء، البيئة، الثقافة. هذه ليست \"معلومات عامة\"، بل أساس لممارسة واقعية: الخطة التي يعجز العميل عن شرائها أو طهيها ليست خطة. أرقام يجب أن تخرج بها الموضوع الرقم السعرات في الجرام كربوهيدرات 4، بروتين 4، دهون 9، كحول 7 AMDR كربوهيدرات 45–65%، دهون 20–35%، بروتين 10–35% RDA للبروتين 0.8 جم/كجم للبالغ السليم (حد أدنى لا هدف أمثل) الألياف 25–38 جم/يوم أو 14 جم لكل 1000 kcal الصوديوم أقل من 2300 مجم/يوم (والصحي أقل من 2000) الأحماض الأمينية الأساسية 9 الأحماض الدهنية الأساسية 2 (لينوليك وألفا لينولينيك) الماء نحو 30–35 مل/كجم 1 كجم دهن جسم نحو 7700 kcal منطقة الخطر للطعام 5–60 °م مثال تطبيقي بأسلوب الكتاب مثال — تفكيك منشور رائج: منشور على مواقع التواصل يقول: \"هذا الشاي العشبي يحرق دهون البطن ويطرد السموم! جربته وخسرت 5 كيلو في أسبوع. دراسة أثبتت أنه يرفع الأيض 300%. اطلبه الآن بخصم 50%.\" التحليل بأدوات الكتاب: \"يحرق دهون البطن\": لا يمكن حرق الدهون موضعيًا؛ التوزيع محدد وراثيًا وهرمونيًا. \"يطرد السموم\": أي سموم؟ لم تُسمَّ ولم تُقَس. الكبد والكلى يؤديان هذه الوظيفة. \"5 كيلو في أسبوع\": فقد 5 كجم دهون يتطلب عجزًا يقارب 38,500 kcal في أسبوع — مستحيل. الفقد غالبًا ماء (وكثير من هذه الشاي مدرّ أو ملين). \"دراسة أثبتت\": أي دراسة؟ على من؟ كم شخصًا؟ هل نُشرت؟ رفع الأيض 300% يعادل تمرينًا شاقًا مستمرًا — ادعاء غير منطقي. \"اطلبه الآن بخصم\": من يقدم النصيحة يبيع المنتج — تعارض مصالح صريح. الخلاصة للجمهور: ستة أعلام حمراء في منشور واحد. أخطاء شائعة عند قراءة الكتاب التعامل معه كمرجع نهائي. هو بداية ممتازة، لكنه سطحي أيضيًا وإكلينيكيًا. تخطي صناديق التفكير النقدي لأنها \"جانبية\". هي من أثمن ما في الكتاب. حفظ الأرقام دون فهم المرجعيات. معرفة أن RDA للبروتين 0.8 بلا فهم أنها حد أدنى تقود لأخطاء. تجاهل الأسئلة في نهاية الفصول. تصميمها التربوي جيد ويكشف الفجوات. كيف تذاكره: خطة ثمانية أسابيع الأسبوع المحتوى التطبيق 1 العلم والمرجعيات والأدلة الغذائية اقرأ 5 بطاقات غذائية وقيّمها 2 الهضم والكربوهيدرات احسب GL لخمسة أطعمة 3 الدهون والبروتين قارن جودة 5 مصادر بروتين 4 الأيض وتوازن الطاقة احسب احتياجك وتابعه أسبوعًا 5 الفيتامينات جدول: الوظيفة، المصدر، النقص، السمية 6 المعادن والماء ركّز على الحديد والكالسيوم والصوديوم 7 مراحل الحياة والنشاط صمم يومًا غذائيًا لثلاث فئات عمرية 8 سلامة الغذاء والأمن الغذائي والتفكير النقدي فكّك 5 منشورات غذائية رائجة نقاط القوة والضعف القوة: تدرج تربوي ممتاز، وضوح في المفاهيم، صناديق التفكير النقدي، شمول للجوانب الاجتماعية، وتمارين ومراجعات مصممة جيدًا. الضعف: سطحي أيضيًا مقارنة بـ Gropper، محدود إكلينيكيًا مقارنة بـ Krause، وأمثلته الغذائية أمريكية. أسئلة للتأمل بعد القراءة 1. شخص يأخذ 60 مجم فيتامين C يوميًا والـ RDA له 90 مجم — هل هو ناقص؟ ماذا تحتاج لتحكم؟ 2. اختر منتجين متشابهين من السوق وقارن بطاقتيهما بالخطوات الست. 3. فكّك أحدث منشور غذائي رأيته بأعلام الكتاب الحمراء. ماذا تقرأ بعده؟ Gropper — Advanced Nutrition and Human Metabolism لتعميق الأيض · Krause للتطبيق الإكلينيكي · Present Knowledge in Nutrition لمتابعة العلم."}, {"i": 40, "group": "books", "tag": "مكتبة المراجع", "num": "10", "short": "BDA — الممارسة العملية", "html": "<h1>Manual of Dietetic Practice</h1>\n<div class=\"tablewrap\"><table class=\"card-table\"><tbody><tr><td><strong>الناشر</strong></td><td>الجمعية البريطانية لأخصائيي التغذية (BDA)، بتحرير جماعي (Joan Gandy محررة رئيسية في طبعات حديثة)</td></tr><tr><td><strong>المستوى</strong></td><td>ممارس</td></tr><tr><td><strong>الجمهور</strong></td><td>أخصائيو التغذية العاملون، طلاب التدريب الميداني، العاملون في أنظمة صحية عامة</td></tr><tr><td><strong>الطابع</strong></td><td>دليل تنفيذ عملي مختصر بمنظور بريطاني وأوروبي</td></tr><tr><td><strong>الرفيق</strong></td><td>كتاب نظري (Krause أو Nelms) + إرشادات NICE و ESPEN</td></tr></tbody></table></div>\n<h2>لماذا قد يناسبك أكثر من Krause؟</h2>\n<p>Krause مكتوب لنظام رعاية أمريكي، بوحدات أمريكية، وأطعمة أمريكية، وتركيز على المستشفى. أما هذا الدليل فمكتوب لأخصائي يعمل في <strong>نظام صحي عام</strong>: يتنقل بين المستشفى والعيادة المجتمعية والرعاية الأولية، ويعمل ضمن <strong>مسارات رعاية</strong> محددة، ويستخدم <strong>وحدات SI</strong> (mmol/L للسكر مثلًا)، ويتعامل مع مجتمع متعدد الثقافات.</p>\n<p>لكثير من الأنظمة الصحية خارج الولايات المتحدة — ومنها أنظمة عربية متأثرة بالنموذج البريطاني — هذا أقرب للواقع اليومي. والأهم أنه مكتوب <strong>للتنفيذ</strong>: ما الذي تفعله بالضبط، بأي ترتيب، ومع من.</p>\n<h2>خريطة الكتاب</h2>\n<h3>الجزء الأول: مبادئ الممارسة</h3>\n<ul><li><strong>الممارسة القائمة على الأدلة</strong> كعملية منهجية.</li><li><strong>الأخلاقيات والإطار المهني والقانوني.</strong></li><li><strong>الاتصال والتثقيف وتغيير السلوك.</strong></li><li><strong>التقييم الغذائي</strong> وأدوات المسح المستخدمة في المملكة المتحدة.</li><li><strong>التوثيق وإدارة السجلات.</strong></li></ul>\n<h3>الجزء الثاني: التغذية في المجتمع والصحة العامة</h3>\n<p>السياسات الغذائية، التدعيم، البرامج المجتمعية، التغذية في الرعاية الأولية، والفئات المهمشة (اللاجئون، المشردون، ذوو الدخل المنخفض).</p>\n<h3>الجزء الثالث: مراحل الحياة</h3>\n<p>الحمل والرضاعة، الرضّع والأطفال، المراهقون، البالغون، كبار السن — مع اهتمام بالسياقات الثقافية والدينية.</p>\n<h3>الجزء الرابع: الدعم التغذوي</h3>\n<p>المسح، المكملات الفموية، التدعيم الغذائي، التغذية المعوية والوريدية، والدعم في المنزل ودور الرعاية.</p>\n<h3>الجزء الخامس: التغذية العلاجية</h3>\n<p>فصول الأمراض بنفس المنطق: الجهاز الهضمي، الكبد، الكلى، القلب، السكري، السمنة، الحساسية، الأمراض العصبية، السرطان، الصحة النفسية، الاضطرابات الأيضية الوراثية، وغيرها — مع <strong>جداول ملخصة</strong> قابلة للاستخدام الفوري.</p>\n<h3>الملاحق</h3>\n<p>تركيب الأغذية، التركيبات التجارية، المعادلات، جداول التحويل، القيم المرجعية.</p>\n<h2>المفاهيم المحورية بالتفصيل</h2>\n<h3>1. الممارسة القائمة على الأدلة كعملية لا شعار</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الخطوة</th><th>ما تفعله</th><th>مثال</th></tr></thead><tbody><tr><td><strong>1. اسأل</strong></td><td>صياغة سؤال إكلينيكي محدد (إطار PICO)</td><td>في مرضى القولون العصبي (P)، هل حمية FODMAP المنخفضة (I) مقارنة بالنصائح العامة (C) تقلل الأعراض (O)؟</td></tr><tr><td><strong>2. ابحث</strong></td><td>البحث المنهجي عن أفضل دليل</td><td>قواعد البيانات، المراجعات المنهجية، الإرشادات</td></tr><tr><td><strong>3. قيّم</strong></td><td>التقييم النقدي للدليل</td><td>التصميم، العينة، التحيز، حجم الأثر</td></tr><tr><td><strong>4. طبّق</strong></td><td>دمج الدليل مع خبرتك وتفضيلات المريض</td><td>هل يستطيع هذا المريض تطبيق الحمية؟</td></tr><tr><td><strong>5. راجع</strong></td><td>تقييم النتيجة وتعديل الممارسة</td><td>هل تحسنت الأعراض؟</td></tr></tbody></table></div>\n<p><strong>النقطة الجوهرية:</strong> الأدلة وحدها لا تكفي. الممارسة القائمة على الأدلة = <strong>أفضل دليل + خبرة الممارس + قيم المريض وظروفه</strong>. إهمال أي ضلع يفسد القرار.</p>\n<h3>2. هرم الأدلة</h3>\n<div class=\"tablewrap
