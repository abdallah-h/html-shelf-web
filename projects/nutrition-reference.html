2.5 جم/كجم 22. الاضطراب الإلكتروليتي المميز لمتلازمة إعادة التغذية: أ) فرط صوديوم ب) نقص فوسفات ج) فرط كالسيوم د) نقص كلور 23. الفيتامين الواجب إعطاؤه قبل بدء التغذية في مرضى سوء التغذية الشديد: أ) C ب) D ج) B1 (ثيامين) د) K 24. مريض تليّف كبد بلا اعتلال دماغي — البروتين المناسب: أ) 0.5 ب) 0.8 ج) 1.2–1.5 د) 3.0 جم/كجم 25. الفوسفور الأخطر لمريض الكلى: أ) العضوي في اللحوم ب) العضوي في البقول ج) المضافات غير العضوية (PHOS) د) في الحبوب الكاملة 26. حمية FODMAP المنخفضة يجب أن تكون: أ) دائمة ب) ثلاث مراحل مع إعادة إدخال ج) بلا إشراف د) للسيلياك 27. قاعدة علاج نقص السكر: أ) 5–5 ب) 15–15 ج) 30–30 د) 50–50 28. مشروب/طعام يجب تجنبه مع الستاتينات: أ) الليمون ب) الجريب فروت ج) التفاح د) الشاي الأخضر 29. الفركتوز المضاف والبيرة يرتبطان بزيادة نوبات: أ) الصداع النصفي ب) النقرس ج) الربو د) السيلياك 30. التدخل الأول والأقوى في الكبد الدهني غير الكحولي: أ) مكمل فيتامين E ب) فقد 7–10% من الوزن ج) منع الكربوهيدرات كليًا د) الأدوية التقييم والإرشاد 31. الألبيومين مؤشر تغذوي ضعيف لأنه: أ) يرتفع مع الجفاف فقط ب) بروتين طور حاد سالب يتأثر بالالتهاب ج) لا يُقاس بدقة د) عمره النصفي ساعتان 32. فقد وزن غير مقصود يُعد علامة حمراء إذا تجاوز: أ) 2% في 6 شهور ب) 5% في سنة ج) 10% في 6 شهور د) 20% في سنتين 33. أداة المسح الأنسب لكبار السن: أ) MUST ب) NRS 2002 ج) MNA د) STAMP 34. تشخيص سوء التغذية بمعايير GLIM يتطلب: أ) معيارًا ظاهريًا فقط ب) معيارًا سببيًا فقط ج) معيارًا ظاهريًا + سببيًا د) ثلاثة معايير سببية 35. الفيريتين قد يعطي نتيجة مضللة لأنه: أ) بروتين طور حاد موجب يرتفع مع الالتهاب ب) لا يعكس الحديد ج) يتأثر بالصيام د) يقاس في البول 36. صياغة PES تتكون من: أ) الوقاية التقييم العلاج ب) المشكلة السبب العلامات ج) الخطة التنفيذ المتابعة د) الغذاء الدواء الرياضة 37. \"مصيدة التصحيح\" (Righting Reflex) تعني: أ) تصحيح وزن المريض ب) اندفاع المرشد لتصويب العميل مما يولّد مقاومة ج) تصحيح المعادلة د) إعادة القياس 38. في سلم الجاهزية، إذا قال العميل 6، السؤال الأنسب: أ) \"ليه مش 9؟\" ب) \"ليه 6 مش 3؟\" ج) \"ليه بس 6؟\" د) \"لازم توصل 10\" 39. الأداة الأدق لتقدير مدخول فرد بعينه: أ) FFQ ب) سجل طعام موزون 3–7 أيام ج) استرجاع 24 ساعة مرة واحدة د) الملاحظة العابرة 40. المعيار الذهبي لقياس إنفاق الطاقة في المرضى الحرجين: أ) Mifflin ب) BIA ج) قياس السعرات غير المباشر د) BMI مفتاح الإجابات 1 ج · 2 ب · 3 د · 4 ب · 5 ب · 6 ج · 7 ب · 8 ب · 9 ب · 10 ج 11 أ · 12 ج · 13 ب · 14 ج · 15 ب · 16 ج · 17 ج · 18 ب · 19 ب · 20 ب 21 ج · 22 ب · 23 ج · 24 ج · 25 ج · 26 ب · 27 ب · 28 ب · 29 ب · 30 ب 31 ب · 32 ج · 33 ج · 34 ج · 35 أ · 36 ب · 37 ب · 38 ب · 39 ب · 40 ج ثانيًا: أسئلة حسابية (مع الحل) س1: امرأة 35 سنة، 68 كجم، 165 سم، تتمرن 3 أيام/أسبوع. احسب BMR وTDEE وماكروز عجز 15%. BMR = (10×68)+(6.25×165)−(5×35)−161 = 680+1031.25−175−161 = 1375 kcal TDEE = 1375 × 1.375 ≈ 1891 · الهدف = 1891 × 0.85 ≈ 1607 kcal بروتين 1.6×68 = 109 جم (436) · دهون 0.8×68 = 54 جم (490) · كربوهيدرات = (1607−926)÷4 ≈ 170 جم س2: رياضي 70 كجم؛ الوزن قبل التمرين 70.0 وبعده 68.6، شرب 600 مل، لم يتبول، مدة التمرين 90 دقيقة. احسب معدل التعرق وكمية التعويض. الفقد = 1.4 كجم + 0.6 لتر مشروب = 2.0 لتر في 1.5 ساعة → 1.33 لتر/ساعة التعويض بعد التمرين = 1.4 × 1.5 = 2.1 لتر مع صوديوم س3: مريض سكري نوع أول، TDD = 50 وحدة، سيتناول 75 جم كربوهيدرات، سكره الحالي 240 والهدف 120. احسب الجرعة. ICR = 500÷50 = 10 → جرعة الوجبة = 75÷10 = 7.5 وحدة ISF = 1800÷50 = 36 → التصحيح = (240−120)÷36 ≈ 3.3 وحدة → المجموع ≈ 10.8 وحدة س4: مريض 80 كجم في العناية المركزة. احسب نطاق الطاقة والبروتين. الطاقة: 25–30 × 80 = 2000–2400 kcal · البروتين: 1.2–2.0 × 80 = 96–160 جم س5: رياضي 60 كجم، مدخول 2400 kcal، طاقة التمرين 700 kcal، نسبة دهون 15%. احسب EA وفسّر. FFM = 60 × 0.85 = 51 كجم · EA = (2400−700)÷51 = 33.3 kcal/kg FFM التفسير: أعلى من عتبة الخطر (30) لكن أقل من الأمثل (45) → مؤشر إنذار مبكر، ينبغي رفع المدخول. س6: مريض وزنه المعتاد 82 كجم وأصبح 71 كجم خلال 5 شهور. هل هذا فقد ذو دلالة؟ % الفقد = (82−71)÷82 × 100 = 13.4% خلال 5 شهور → يتجاوز عتبة 10%/6 شهور → فقد شديد وعلامة حمراء . ثالثًا: أسئلة مقالية وتفكير نقدي 1. اشرح لماذا يُعد الألبيومين مؤشرًا مضللًا لسوء التغذية في المريض الحاد، وما البدائل الأفضل؟ 2. قارن بين تقييد البروتين في الفشل الكلوي قبل الغسيل وبعده، مع تبرير فسيولوجي لكل حالة. 3. ناقش: \"الصيام المتقطع أفضل من العجز الحراري التقليدي لإنقاص الوزن.\" — قيّم العبارة بالأدلة. 4. صمّم خطة تغذوية ليوم مباراة لاعب كرة سلة 90 كجم في مباراة الساعة 8 مساءً، مع مبررات لكل قرار. 5. اشرح مفهوم \"التغذية الدورية (Periodized Nutrition)\" وكيف يختلف عن الخطة الثابتة. 6. مريضة سمنة قالت: \"أنا مش بآكل حاجة أصلًا ومش بنزل.\" — كيف تتعامل معها منهجيًا (تقييميًا وسلوكيًا) دون اتهامها؟ 7. اكتب صياغة PES كاملة لمريض سكري نوع ثاني لا يعرف حساب الكربوهيدرات. 8. ما آلية متلازمة إعادة التغذية، ولماذا يُعطى الثيامين قبل التغذية تحديدًا؟ 9. حلّل: لماذا لا يُنصح بحمية FODMAP المنخفضة كنظام دائم رغم فعاليتها في تخفيف الأعراض؟ 10. اشرح لماذا قد ترتفع مؤشرات \"النقص\" في مريض التهابي دون أن يكون النقص حقيقيًا، مستعينًا بالفيريتين وCRP. 11. قارن بين BIA وDEXA وثنايا الجلد من حيث الدقة والتكلفة والصلاحية للمتابعة الدورية. 12. متى تُحيل عميلًا إلى طبيب أو معالج نفسي فورًا؟ اذكر خمس علامات إنذار."}, {"i": 9, "group": "guide", "tag": "مراحل الحياة", "num": "9", "short": "التغذية عبر مراحل الحياة + الصيام ورمضان", "html": "<h1>الجزء التاسع: التغذية عبر مراحل الحياة + الصيام ورمضان</h1>\n<h2>9.1 الحمل</h2>\n<h3>زيادة الوزن الموصى بها (حسب BMI قبل الحمل)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>BMI قبل الحمل</th><th>إجمالي الزيادة</th><th>المعدل في الثلثين الثاني والثالث</th></tr></thead><tbody><tr><td>&lt;18.5 (نقص وزن)</td><td>12.5–18 كجم</td><td>~0.5 كجم/أسبوع</td></tr><tr><td>18.5–24.9 (طبيعي)</td><td>11.5–16 كجم</td><td>~0.4 كجم/أسبوع</td></tr><tr><td>25–29.9 (زيادة)</td><td>7–11.5 كجم</td><td>~0.3 كجم/أسبوع</td></tr><tr><td><span class=\"ltr\">≥30</span> (سمنة)</td><td>5–9 كجم</td><td>~0.2 كجم/أسبوع</td></tr><tr><td>توأم (وزن طبيعي)</td><td>17–25 كجم</td><td>—</td></tr></tbody></table></div>\n<h3>الطاقة والمغذيات</h3>\n<ul><li><strong>الطاقة:</strong> لا زيادة في الثلث الأول · <strong>+340 kcal</strong> في الثاني · <strong>+450 kcal</strong> في الثالث. (\"تأكلي لاثنين\" أسطورة — الجنين لا يحتاج وجبة بالغ.)</li><li><strong>البروتين:</strong> +25 جم/يوم (≈1.1 جم/كجم).</li><li><strong>حمض الفوليك:</strong> <strong>400–600 ميكروجرام يوميًا، ويُبدأ قبل الحمل بثلاثة شهور</strong> — لأن الأنبوب العصبي يُغلق في اليوم 28، أي غالبًا قبل أن تعرف المرأة أنها حامل. الجرعة ترتفع إلى <strong>4000 ميكروجرام</strong> لمن سبق لها إنجاب طفل بعيب أنبوب عصبي أو تتناول مضادات صرع (بقرار طبي).</li><li><strong>الحديد:</strong> 27 مجم/يوم — حجم الدم يزيد ~50% وفقر الدم شائع جدًا.</li><li><strong>اليود:</strong> 220 ميكروجرام — نقصه يؤثر على النمو العصبي للجنين.</li><li><strong>الكالسيوم:</strong> 1000 مجم · <strong>فيتامين D</strong> حسب التحليل · <strong>DHA</strong> 200–300 مجم (لنمو المخ والشبكية).</li><li><strong>الكولين:</strong> 450 مجم — مُهمَل كثيرًا رغم أهميته للنمو العصبي (البيض والكبد مصادر ممتازة).</li></ul>\n<h3>⚠️ ممنوعات ومحاذير</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الممنوع</th><th>السبب</th></tr></thead><tbody><tr><td>الكحول</td><td>لا توجد جرعة آمنة — متلازمة الكحول الجنينية</td></tr><tr><td>اللحوم والأسماك والبيض النيئة أو غير المطهوة جيدًا</td><td>ليستيريا، سالمونيلا، توكسوبلازما</td></tr><tr><td>الألبان والأجبان غير المبسترة (القريش البلدي غير المبستر، الأجبان الطرية المعتّقة)</td><td>ليستيريا</td></tr><tr><td>كبد وزيت كبد السمك بكثرة</td><td>فيتامين A الزائد <strong>مشوّه للجنين</strong></td></tr><tr><td>أسماك عالية الزئبق (قرش، أبو سيف، ماكريل ملك، تونة عين كبيرة)</td><td>الزئبق يضر الجهاز العصبي — لكن <strong>السمك عمومًا مفيد</strong>: 2–3 حصص/أسبوع من الأنواع منخفضة الزئبق (سردين، بلطي، سلمون، جمبري)</td></tr><tr><td>الكافيين</td><td>حدّه <strong>&lt;200 مجم/يوم</strong> (≈ كوبان قهوة)</td></tr></tbody></table></div>\n<h3>مشكلات شائعة</h3>\n<ul><li><strong>غثيان الصباح:</strong> وجبات صغيرة متكررة، بسكويت جاف قبل النهوض، زنجبيل، فصل السوائل عن الطعام، تجنّب الروائح المحفّزة.</li><li><strong>سكري الحمل:</strong> كربوهيدرات موزعة (خصوصًا <strong>إفطار منخفض الكربوهيدرات</strong> لأن مقاومة الإنسولين تبلغ ذروتها صباحًا)، مراقبة سكر بعد الوجبات، نشاط بدني آمن.</li><li><strong>الإمساك والحموضة:</strong> ألياف تدريجية + سوائل، وجبات صغيرة، عدم الاستلقاء بعد الأكل.</li></ul>\n<hr>\n<h2>9.2 الرضاعة الطبيعية</h2>\n<ul><li><strong>الطاقة:</strong> +330 إلى +400 kcal/يوم في الستة شهور الأولى.</li><li><strong>السوائل:</strong> ~3 لتر/يوم؛ اشربي كوبًا مع كل رضعة.</li><li><strong>استمرار المكملات:</strong> فيتامينات الحمل + <strong>B12 إلزامي</strong> إن كانت الأم نباتية صرفة (نقصه يسبب ضررًا عصبيًا خطيرًا للرضيع).</li><li><strong>إنقاص الوزن:</strong> آمن بمعدل <span class=\"ltr\">≤0.5</span> كجم/أسبوع بعد الشهر الثاني؛ العجز الشديد (&lt;1800 kcal) قد يقلل إدرار اللبن.</li><li><strong>ما ينتقل للبن:</strong> الكحول (تجنّبيه، والقاعدة: إن كنتِ صاحية بما يكفي للقيادة فأنتِ صاحية للرضاعة)، الكافيين (حدّيه ~300 مجم)، بعض الأدوية (راجعي الطبيب دائمًا).</li><li><strong>أسطورة:</strong> \"الأطعمة المسببة للغازات (كرنب، بقول) تسبب مغصًا للطفل\" — الدليل ضعيف جدًا؛ لا تحذفي أطعمة بلا سبب.</li></ul>\n<hr>\n<h2>9.3 الرضّع والفطام</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>العمر</th><th>التغذية</th></tr></thead><tbody><tr><td>0–6 شهور</td><td><strong>رضاعة طبيعية حصرية</strong> (أو صناعية) — لا ماء ولا أعشاب. فيتامين D مكمل 400 IU يوميًا</td></tr><tr><td>~6 شهور</td><td>بدء <strong>الأطعمة التكميلية</strong> مع استمرار الرضاعة حتى سنتين أو أكثر</td></tr><tr><td>6–8 شهور</td><td>2–3 وجبات/يوم، قوام مهروس ثم مهروس خشن</td></tr><tr><td>9–11 شهر</td><td>3–4 وجبات + سناك، طعام مقطّع ناعم، تشجيع الأكل الذاتي</td></tr><tr><td>12–23 شهر</td><td>3 وجبات + سناكان، طعام العائلة المعدّل</td></tr></tbody></table></div>\n<p><strong>علامات جاهزية الفطام:</strong> جلوس بدعم وثبات الرأس، اختفاء منعكس دفع اللسان، اهتمام بالطعام، قدرة على مسك الطعام وإيصاله للفم.</p>\n<p><strong>قواعد ذهبية:</strong></p>\n<ul><li><strong>الحديد أولًا:</strong> مخزون الحديد ينفد حوالي الشهر السادس → ابدأ بأطعمة غنية بالحديد (لحوم مهروسة، صفار بيض، عدس، حبوب مدعّمة).</li><li><strong>صنف واحد جديد كل 3–5 أيام</strong> لرصد الحساسية.</li><li><strong>⚠️ لا عسل قبل السنة</strong> (خطر التسمم السجقي/البوتيوليزم) · <strong>لا ملح ولا سكر مضاف</strong> · <strong>لا لبن بقري كمشروب أساسي قبل السنة</strong>.</li><li><strong>⚠️ مخاطر الاختناق:</strong> المكسرات الكاملة، العنب الكامل، الجزر النيء، الفشار، قطع اللحم الكبيرة، الحلوى الصلبة.</li><li><strong>الإدخال المبكر للمُحسِّسات (بيض، فول سوداني) من عمر 6 شهور يقلل خطر الحساسية</strong> — عكس النصيحة القديمة بالتأجيل (دراسة LEAP).</li><li><strong>مسؤولية مقسّمة (Division of Responsibility):</strong> الأهل يقرّرون <em>ماذا ومتى وأين</em>، والطفل يقرّر <em>هل يأكل وكم</em>. الإجبار على الأكل يخلق مشاكل طويلة الأمد.</li></ul>\n<hr>\n<h2>9.4 الأطفال والمراهقون</h2>\n<ul><li><strong>متابعة النمو أهم من الوزن المطلق</strong> — استخدم منحنيات WHO/CDC وتابع <strong>المسار (Trajectory)</strong> لا النقطة الواحدة.</li><li><strong>نقص الحديد</strong> أشهر نقص عالميًا في هذه الفئة؛ راقبه خصوصًا مع الفتيات بعد البلوغ.</li><li><strong>الكالسيوم وفيتامين D:</strong> المراهقة هي <strong>نافذة بناء ذروة كتلة العظام</strong> — ما يُبنى هنا لا يُعوّض لاحقًا. الاحتياج 1300 مجم كالسيوم.</li><li><strong>الأكل الانتقائي (Picky eating):</strong> طبيعي في 2–5 سنوات؛ العلاج هو التعرّض المتكرر بلا ضغط (قد يحتاج 10–15 مرة) وليس الإجبار أو الرشوة بالحلوى.</li><li><strong>⚠️ اضطرابات الأكل</strong> تبدأ غالبًا في المراهقة. علامات الإنذار: حذف مجموعات غذائية، هوس بالسعرات، تمرين قهري، اختفاء بعد الوجبات، تقلبات مزاجية، توقف الدورة، انسحاب اجتماعي. <strong>الإحالة المتخصصة فورية — لا تعطِ خطة إنقاص وزن لمراهق يظهر عليه أي من هذه العلامات.</strong></li><li><strong>لا تُوصف حميات تقييدية للأطفال</strong> — الهدف عادةً <strong>تثبيت الوزن مع استمرار النمو الطولي</strong>، لا إنقاصه.</li></ul>\n<hr>\n<h2>9.5 كبار السن</h2>\n<p><strong>التحديات الفسيولوجية:</strong> انخفاض الشهية (شبع مبكر)، ضعف حاستي التذوق والشم، مشاكل الأسنان والبلع، انخفاض حمض المعدة (→ سوء امتصاص B12 والحديد)، <strong>انخفاض الإحساس بالعطش</strong> (→ جفاف صامت)، أدوية متعددة، عزلة اجتماعية ودخل محدود.</p>\n<p><strong>التوصيات:</strong></p>\n<ul><li><strong>بروتين 1.0–1.5 جم/كجم</strong> — أعلى من الشباب بسبب <strong>مقاومة الابتناء (Anabolic resistance)</strong>، مع <strong>توزيع 25–30 جم لكل وجبة</strong>.</li><li><strong>تدريب المقاومة</strong> هو العلاج الأساسي لـ <strong>الساركوبينيا (ضمور العضلات)</strong> — والغذاء وحده لا يكفي.</li><li><strong>فيتامين D + كالسيوم</strong> للوقاية من الكسور · <strong>B12</strong> فحصًا دوريًا.</li><li><strong>الترطيب المجدول</strong> (لا تعتمد على العطش) · <strong>ألياف وسوائل</strong> للإمساك.</li><li><strong>الوقاية من السقوط</strong> بُعد تغذوي أساسي: فيتامين D، بروتين، قوة عضلية.</li><li><strong>صعوبة البلع (Dysphagia):</strong> أقوام معدّلة وسوائل مكثّفة <strong>بتقييم أخصائي تخاطب</strong>، لا باجتهاد شخصي.</li></ul>\n<hr>\n<h2>9.6 الصيام ورمضان</h2>\n<h3>ما الذي يحدث فسيولوجيًا؟</h3>\n<p>في أول 12–16 ساعة يستنفد الجسم الجليكوجين الكبدي، ثم يزيد اعتماده على أكسدة الدهون وإنتاج الأجسام الكيتونية. الصيام آمن للأصحاء، والمشكلة الشائعة <strong>ليست الجوع بل أنماط الإفطار</strong>: كميات ضخمة، سكريات مركزة، قلة سوائل، واضطراب نوم.</p>\n<h3>قواعد عملية</h3>\n<p><strong>السحور</strong> (أخّره قدر الإمكان):</p>\n<ul><li><strong>كربوهيدرات معقدة بطيئة</strong> (شوفان، خبز بلدي/أسمر، فول) + <strong>بروتين</strong> (بيض، جبن قريش، زبادي) + <strong>دهون صحية</strong> (طحينة، مكسرات) + خضار.</li><li>تجنّب المالح الزائد والسكريات السريعة (تزيد العطش والجوع المبكر).</li><li>2–3 أكواب ماء.</li></ul>\n<p><strong>الإفطار:</strong></p>\n<ul><li>ابدأ بـ <strong>تمر (1–3 حبات) + ماء أو لبن</strong>، ثم شوربة، ثم <strong>توقّف 10–15 دقيقة</strong> قبل الطبق الرئيسي — هذا وحده يمنع الإفراط.</li><li>الطبق: نصفه خضار/سلطة، ربعه بروتين، ربعه نشا.</li><li>قلّل المقليات والحلويات الشرقية المُشرَّبة بالشراب (القطايف والكنافة: تُجدول كضيافة لا كعادة يومية).</li></ul>\n<p><strong>السوائل:</strong> 8–12 كوبًا موزعة بين الإفطار والسحور — <strong>لا تشربها دفعة واحدة</strong> (تُطرح في البول). قلّل الكافيين والمشروبات الغازية.</p>\n<p><strong>الرياضة في رمضان:</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>التوقيت</th><th>الأنسب لمن</th></tr></thead><tbody><tr><td>قبل الإفطار بساعة</td><td>حرق دهون، شدة خفيفة–متوسطة فقط</td></tr><tr><td>بعد الإفطار بـ 2–3 ساعات</td><td><strong>الأفضل للتدريب الثقيل والمقاومة</strong> — طاقة وترطيب متاحان</td></tr><tr><td>بعد السحور</td><td>مناسب لمن ينام لاحقًا</td></tr></tbody></table></div>\n<p>الهدف الواقعي في رمضان هو <strong>الحفاظ على العضل</strong> لا بناؤه — بروتين كافٍ (1.6+ جم/كجم موزّع على الإفطار والسحور) وحجم تدريب أقل بشدة محفوظة.</p>\n<h3>⚠️ الصيام في الحالات المرضية</h3>\n<ul><li><strong>السكري:</strong> خطر حقيقي (هبوط سكر، ارتفاع حاد، حماض كيتوني، جفاف). <strong>يجب استشارة الطبيب قبل رمضان</strong> لتعديل الأدوية والجرعات. <strong>افطر فورًا</strong> إذا هبط السكر &lt;70 مجم/دل أو تجاوز 300. مرضى النوع الأول وذوو المضاعفات المتقدمة في فئة خطر عالية جدًا.</li><li><strong>الكلى وحصوات الكلى:</strong> خطر الجفاف؛ تقييم فردي.</li><li><strong>الحمل والرضاعة، الأمراض الحادة، اضطرابات الأكل:</strong> يحتاج تقييمًا طبيًا فرديًا، وقد يكون الصيام غير مناسب.</li><li><strong>مدرات البول ومضادات التخثر وأدوية الضغط:</strong> إعادة جدولة بإشراف طبي.</li></ul>\n<p><strong>بعد رمضان:</strong> تجنّب \"انفجار العيد\" — عودة تدريجية، وثلاث وجبات منتظمة خلال أسبوع.</p>\n<hr>", "text": "الجزء التاسع: التغذية عبر مراحل الحياة + الصيام ورمضان 9.1 الحمل زيادة الوزن الموصى بها (حسب BMI قبل الحمل) BMI قبل الحمل إجمالي الزيادة المعدل في الثلثين الثاني والثالث <18.5 (نقص وزن) 12.5–18 كجم ~0.5 كجم/أسبوع 18.5–24.9 (طبيعي) 11.5–16 كجم ~0.4 كجم/أسبوع 25–29.9 (زيادة) 7–11.5 كجم ~0.3 كجم/أسبوع ≥30 (سمنة) 5–9 كجم ~0.2 كجم/أسبوع توأم (وزن طبيعي) 17–25 كجم — الطاقة والمغذيات الطاقة: لا زيادة في الثلث الأول · +340 kcal في الثاني · +450 kcal في الثالث. (\"تأكلي لاثنين\" أسطورة — الجنين لا يحتاج وجبة بالغ.) البروتين: +25 جم/يوم (≈1.1 جم/كجم). حمض الفوليك: 400–600 ميكروجرام يوميًا، ويُبدأ قبل الحمل بثلاثة شهور — لأن الأنبوب العصبي يُغلق في اليوم 28، أي غالبًا قبل أن تعرف المرأة أنها حامل. الجرعة ترتفع إلى 4000 ميكروجرام لمن سبق لها إنجاب طفل بعيب أنبوب عصبي أو تتناول مضادات صرع (بقرار طبي). الحديد: 27 مجم/يوم — حجم الدم يزيد ~50% وفقر الدم شائع جدًا. اليود: 220 ميكروجرام — نقصه يؤثر على النمو العصبي للجنين. الكالسيوم: 1000 مجم · فيتامين D حسب التحليل · DHA 200–300 مجم (لنمو المخ والشبكية). الكولين: 450 مجم — مُهمَل كثيرًا رغم أهميته للنمو العصبي (البيض والكبد مصادر ممتازة). ⚠️ ممنوعات ومحاذير الممنوع السبب الكحول لا توجد جرعة آمنة — متلازمة الكحول الجنينية اللحوم والأسماك والبيض النيئة أو غير المطهوة جيدًا ليستيريا، سالمونيلا، توكسوبلازما الألبان والأجبان غير المبسترة (القريش البلدي غير المبستر، الأجبان الطرية المعتّقة) ليستيريا كبد وزيت كبد السمك بكثرة فيتامين A الزائد مشوّه للجنين أسماك عالية الزئبق (قرش، أبو سيف، ماكريل ملك، تونة عين كبيرة) الزئبق يضر الجهاز العصبي — لكن السمك عمومًا مفيد : 2–3 حصص/أسبوع من الأنواع منخفضة الزئبق (سردين، بلطي، سلمون، جمبري) الكافيين حدّه <200 مجم/يوم (≈ كوبان قهوة) مشكلات شائعة غثيان الصباح: وجبات صغيرة متكررة، بسكويت جاف قبل النهوض، زنجبيل، فصل السوائل عن الطعام، تجنّب الروائح المحفّزة. سكري الحمل: كربوهيدرات موزعة (خصوصًا إفطار منخفض الكربوهيدرات لأن مقاومة الإنسولين تبلغ ذروتها صباحًا)، مراقبة سكر بعد الوجبات، نشاط بدني آمن. الإمساك والحموضة: ألياف تدريجية + سوائل، وجبات صغيرة، عدم الاستلقاء بعد الأكل. 9.2 الرضاعة الطبيعية الطاقة: +330 إلى +400 kcal/يوم في الستة شهور الأولى. السوائل: ~3 لتر/يوم؛ اشربي كوبًا مع كل رضعة. استمرار المكملات: فيتامينات الحمل + B12 إلزامي إن كانت الأم نباتية صرفة (نقصه يسبب ضررًا عصبيًا خطيرًا للرضيع). إنقاص الوزن: آمن بمعدل ≤0.5 كجم/أسبوع بعد الشهر الثاني؛ العجز الشديد (<1800 kcal) قد يقلل إدرار اللبن. ما ينتقل للبن: الكحول (تجنّبيه، والقاعدة: إن كنتِ صاحية بما يكفي للقيادة فأنتِ صاحية للرضاعة)، الكافيين (حدّيه ~300 مجم)، بعض الأدوية (راجعي الطبيب دائمًا). أسطورة: \"الأطعمة المسببة للغازات (كرنب، بقول) تسبب مغصًا للطفل\" — الدليل ضعيف جدًا؛ لا تحذفي أطعمة بلا سبب. 9.3 الرضّع والفطام العمر التغذية 0–6 شهور رضاعة طبيعية حصرية (أو صناعية) — لا ماء ولا أعشاب. فيتامين D مكمل 400 IU يوميًا ~6 شهور بدء الأطعمة التكميلية مع استمرار الرضاعة حتى سنتين أو أكثر 6–8 شهور 2–3 وجبات/يوم، قوام مهروس ثم مهروس خشن 9–11 شهر 3–4 وجبات + سناك، طعام مقطّع ناعم، تشجيع الأكل الذاتي 12–23 شهر 3 وجبات + سناكان، طعام العائلة المعدّل علامات جاهزية الفطام: جلوس بدعم وثبات الرأس، اختفاء منعكس دفع اللسان، اهتمام بالطعام، قدرة على مسك الطعام وإيصاله للفم. قواعد ذهبية: الحديد أولًا: مخزون الحديد ينفد حوالي الشهر السادس → ابدأ بأطعمة غنية بالحديد (لحوم مهروسة، صفار بيض، عدس، حبوب مدعّمة). صنف واحد جديد كل 3–5 أيام لرصد الحساسية. ⚠️ لا عسل قبل السنة (خطر التسمم السجقي/البوتيوليزم) · لا ملح ولا سكر مضاف · لا لبن بقري كمشروب أساسي قبل السنة . ⚠️ مخاطر الاختناق: المكسرات الكاملة، العنب الكامل، الجزر النيء، الفشار، قطع اللحم الكبيرة، الحلوى الصلبة. الإدخال المبكر للمُحسِّسات (بيض، فول سوداني) من عمر 6 شهور يقلل خطر الحساسية — عكس النصيحة القديمة بالتأجيل (دراسة LEAP). مسؤولية مقسّمة (Division of Responsibility): الأهل يقرّرون ماذا ومتى وأين ، والطفل يقرّر هل يأكل وكم . الإجبار على الأكل يخلق مشاكل طويلة الأمد. 9.4 الأطفال والمراهقون متابعة النمو أهم من الوزن المطلق — استخدم منحنيات WHO/CDC وتابع المسار (Trajectory) لا النقطة الواحدة. نقص الحديد أشهر نقص عالميًا في هذه الفئة؛ راقبه خصوصًا مع الفتيات بعد البلوغ. الكالسيوم وفيتامين D: المراهقة هي نافذة بناء ذروة كتلة العظام — ما يُبنى هنا لا يُعوّض لاحقًا. الاحتياج 1300 مجم كالسيوم. الأكل الانتقائي (Picky eating): طبيعي في 2–5 سنوات؛ العلاج هو التعرّض المتكرر بلا ضغط (قد يحتاج 10–15 مرة) وليس الإجبار أو الرشوة بالحلوى. ⚠️ اضطرابات الأكل تبدأ غالبًا في المراهقة. علامات الإنذار: حذف مجموعات غذائية، هوس بالسعرات، تمرين قهري، اختفاء بعد الوجبات، تقلبات مزاجية، توقف الدورة، انسحاب اجتماعي. الإحالة المتخصصة فورية — لا تعطِ خطة إنقاص وزن لمراهق يظهر عليه أي من هذه العلامات. لا تُوصف حميات تقييدية للأطفال — الهدف عادةً تثبيت الوزن مع استمرار النمو الطولي ، لا إنقاصه. 9.5 كبار السن التحديات الفسيولوجية: انخفاض الشهية (شبع مبكر)، ضعف حاستي التذوق والشم، مشاكل الأسنان والبلع، انخفاض حمض المعدة (→ سوء امتصاص B12 والحديد)، انخفاض الإحساس بالعطش (→ جفاف صامت)، أدوية متعددة، عزلة اجتماعية ودخل محدود. التوصيات: بروتين 1.0–1.5 جم/كجم — أعلى من الشباب بسبب مقاومة الابتناء (Anabolic resistance) ، مع توزيع 25–30 جم لكل وجبة . تدريب المقاومة هو العلاج الأساسي لـ الساركوبينيا (ضمور العضلات) — والغذاء وحده لا يكفي. فيتامين D + كالسيوم للوقاية من الكسور · B12 فحصًا دوريًا. الترطيب المجدول (لا تعتمد على العطش) · ألياف وسوائل للإمساك. الوقاية من السقوط بُعد تغذوي أساسي: فيتامين D، بروتين، قوة عضلية. صعوبة البلع (Dysphagia): أقوام معدّلة وسوائل مكثّفة بتقييم أخصائي تخاطب ، لا باجتهاد شخصي. 9.6 الصيام ورمضان ما الذي يحدث فسيولوجيًا؟ في أول 12–16 ساعة يستنفد الجسم الجليكوجين الكبدي، ثم يزيد اعتماده على أكسدة الدهون وإنتاج الأجسام الكيتونية. الصيام آمن للأصحاء، والمشكلة الشائعة ليست الجوع بل أنماط الإفطار : كميات ضخمة، سكريات مركزة، قلة سوائل، واضطراب نوم. قواعد عملية السحور (أخّره قدر الإمكان): كربوهيدرات معقدة بطيئة (شوفان، خبز بلدي/أسمر، فول) + بروتين (بيض، جبن قريش، زبادي) + دهون صحية (طحينة، مكسرات) + خضار. تجنّب المالح الزائد والسكريات السريعة (تزيد العطش والجوع المبكر). 2–3 أكواب ماء. الإفطار: ابدأ بـ تمر (1–3 حبات) + ماء أو لبن ، ثم شوربة، ثم توقّف 10–15 دقيقة قبل الطبق الرئيسي — هذا وحده يمنع الإفراط. الطبق: نصفه خضار/سلطة، ربعه بروتين، ربعه نشا. قلّل المقليات والحلويات الشرقية المُشرَّبة بالشراب (القطايف والكنافة: تُجدول كضيافة لا كعادة يومية). السوائل: 8–12 كوبًا موزعة بين الإفطار والسحور — لا تشربها دفعة واحدة (تُطرح في البول). قلّل الكافيين والمشروبات الغازية. الرياضة في رمضان: التوقيت الأنسب لمن قبل الإفطار بساعة حرق دهون، شدة خفيفة–متوسطة فقط بعد الإفطار بـ 2–3 ساعات الأفضل للتدريب الثقيل والمقاومة — طاقة وترطيب متاحان بعد السحور مناسب لمن ينام لاحقًا الهدف الواقعي في رمضان هو الحفاظ على العضل لا بناؤه — بروتين كافٍ (1.6+ جم/كجم موزّع على الإفطار والسحور) وحجم تدريب أقل بشدة محفوظة. ⚠️ الصيام في الحالات المرضية السكري: خطر حقيقي (هبوط سكر، ارتفاع حاد، حماض كيتوني، جفاف). يجب استشارة الطبيب قبل رمضان لتعديل الأدوية والجرعات. افطر فورًا إذا هبط السكر <70 مجم/دل أو تجاوز 300. مرضى النوع الأول وذوو المضاعفات المتقدمة في فئة خطر عالية جدًا. الكلى وحصوات الكلى: خطر الجفاف؛ تقييم فردي. الحمل والرضاعة، الأمراض الحادة، اضطرابات الأكل: يحتاج تقييمًا طبيًا فرديًا، وقد يكون الصيام غير مناسب. مدرات البول ومضادات التخثر وأدوية الضغط: إعادة جدولة بإشراف طبي. بعد رمضان: تجنّب \"انفجار العيد\" — عودة تدريجية، وثلاث وجبات منتظمة خلال أسبوع."}, {"i": 10, "group": "guide", "tag": "تطبيق", "num": "10", "short": "التطبيق على المطبخ العربي", "html": "<h1>الجزء العاشر: التطبيق على المطبخ العربي — حصص وخطط وجبات</h1>\n<blockquote class=\"note\"><p><strong>ملاحظة:</strong> القيم تقريبية للتقدير العملي وتختلف بحسب طريقة التحضير وكمية الزيت. للدقة البحثية ارجع إلى جداول تركيب الأغذية المعتمدة (مثل جداول المعهد القومي للتغذية أو USDA FoodData Central).</p></blockquote>\n<h2>10.1 جدول أطعمة شائعة (لكل حصة عملية)</h2>\n<h3>نشويات</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الطعام</th><th>الحصة</th><th>سعرات</th><th>كربوهيدرات (جم)</th><th>بروتين (جم)</th></tr></thead><tbody><tr><td>عيش بلدي</td><td>رغيف متوسط (90 جم)</td><td>~230</td><td>45</td><td>8</td></tr><tr><td>عيش فينو/أبيض</td><td>رغيف</td><td>~150</td><td>30</td><td>5</td></tr><tr><td>أرز أبيض مطبوخ</td><td>كوب (200 جم)</td><td>~260</td><td>56</td><td>5</td></tr><tr><td>مكرونة مسلوقة</td><td>كوب</td><td>~220</td><td>43</td><td>8</td></tr><tr><td>بطاطس مسلوقة</td><td>150 جم</td><td>~130</td><td>30</td><td>3</td></tr><tr><td>كشري (طبق متوسط)</td><td>~400 جم</td><td>~700–900</td><td>130–150</td><td>25</td></tr><tr><td>فريك/برغل مطبوخ</td><td>كوب</td><td>~230</td><td>45</td><td>8</td></tr></tbody></table></div>\n<h3>بقوليات وبروتين نباتي</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الطعام</th><th>الحصة</th><th>سعرات</th><th>بروتين</th></tr></thead><tbody><tr><td>فول مدمس (بدون زيت)</td><td>كوب (250 جم)</td><td>~230</td><td>16</td></tr><tr><td>فول بالزيت</td><td>كوب + ملعقة زيت</td><td>~350</td><td>16</td></tr><tr><td>طعمية/فلافل مقلية</td><td>4 أقراص</td><td>~350–400</td><td>12</td></tr><tr><td>عدس أصفر (شوربة)</td><td>كوب</td><td>~180</td><td>12</td></tr><tr><td>حمص مسلوق</td><td>كوب</td><td>~270</td><td>15</td></tr><tr><td>حمص بالطحينة</td><td>100 جم</td><td>~230</td><td>8</td></tr></tbody></table></div>\n<h3>بروتين حيواني (مطبوخ، بلا زيت زائد)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الطعام</th><th>الحصة</th><th>سعرات</th><th>بروتين</th></tr></thead><tbody><tr><td>صدور فراخ مشوية</td><td>100 جم</td><td>~165</td><td>31</td></tr><tr><td>فراخ بالجلد مشوية</td><td>100 جم</td><td>~230</td><td>27</td></tr><tr><td>لحم بقري قليل الدهن</td><td>100 جم</td><td>~200</td><td>28</td></tr><tr><td>كبدة</td><td>100 جم</td><td>~170</td><td>26</td></tr><tr><td>سمك بلطي مشوي</td><td>100 جم</td><td>~130</td><td>26</td></tr><tr><td>سردين معلب</td><td>علبة (90 جم)</td><td>~190</td><td>22</td></tr><tr><td>جمبري</td><td>100 جم</td><td>~100</td><td>20</td></tr><tr><td>بيضة كاملة</td><td>1 كبيرة</td><td>~72</td><td>6.3</td></tr><tr><td>جبنة قريش</td><td>100 جم</td><td>~100</td><td>14</td></tr><tr><td>جبنة بيضاء مالحة</td><td>30 جم</td><td>~80</td><td>5</td></tr><tr><td>زبادي كامل الدسم</td><td>علبة 170 جم</td><td>~110</td><td>6</td></tr><tr><td>لبن كامل الدسم</td><td>كوب</td><td>~150</td><td>8</td></tr></tbody></table></div>\n<h3>دهون ومكسرات (كثافة عالية — انتبه للكمية)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الطعام</th><th>الحصة</th><th>سعرات</th></tr></thead><tbody><tr><td>زيت (أي نوع)</td><td>ملعقة كبيرة</td><td>~120</td></tr><tr><td>طحينة</td><td>ملعقة كبيرة</td><td>~90</td></tr><tr><td>زبدة/سمنة</td><td>ملعقة كبيرة</td><td>~100</td></tr><tr><td>لوز/عين جمل</td><td>30 جم (حفنة)</td><td>~180</td></tr><tr><td>زيتون</td><td>10 حبات</td><td>~50</td></tr><tr><td>أفوكادو</td><td>نصف ثمرة</td><td>~120</td></tr></tbody></table></div>\n<h3>فاكهة وخضار وحلويات</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الطعام</th><th>الحصة</th><th>سعرات</th></tr></thead><tbody><tr><td>تمر</td><td>3 حبات</td><td>~60–70</td></tr><tr><td>موز</td><td>متوسط</td><td>~105</td></tr><tr><td>مانجو</td><td>متوسطة</td><td>~150</td></tr><tr><td>عنب</td><td>كوب</td><td>~100</td></tr><tr><td>بطيخ</td><td>شريحة كبيرة (300 جم)</td><td>~90</td></tr><tr><td>خضار مطبوخة بالصلصة</td><td>كوب</td><td>~80–150</td></tr><tr><td>سلطة خضراء بلا صوص</td><td>طبق</td><td>~40</td></tr><tr><td>كنافة/بسبوسة</td><td>قطعة متوسطة</td><td>~350–450</td></tr><tr><td>مشروب غازي</td><td>علبة 330 مل</td><td>~140</td></tr><tr><td>عصير مُعبأ</td><td>كوب</td><td>~110–130</td></tr></tbody></table></div>\n<hr>\n<h2>10.2 قواعد تقدير الحصص باليد (بدون ميزان)</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>القياس</th><th>يعادل تقريبًا</th></tr></thead><tbody><tr><td><strong>كف اليد</strong> (بلا أصابع)</td><td>100–120 جم بروتين (≈25–30 جم بروتين)</td></tr><tr><td><strong>قبضة اليد</strong></td><td>كوب خضار أو حصة نشا</td></tr><tr><td><strong>راحة اليد مطبقة (Cupped hand)</strong></td><td>حصة كربوهيدرات (~25–30 جم)</td></tr><tr><td><strong>إبهام كامل</strong></td><td>حصة دهون (~10 جم)</td></tr><tr><td><strong>حفنة صغيرة</strong></td><td>30 جم مكسرات</td></tr></tbody></table></div>\n<hr>\n<h2>10.3 خطط وجبات جاهزة (أكل عربي/مصري)</h2>\n<h3>خطة ~1500 kcal (إنقاص وزن — بروتين ~110 جم)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الوجبة</th><th>المحتوى</th><th>~kcal</th></tr></thead><tbody><tr><td>فطار</td><td>2 بيضة مسلوقة + نصف رغيف بلدي + طبق سلطة + كوب شاي بلا سكر</td><td>300</td></tr><tr><td>سناك</td><td>زبادي 170 جم + تفاحة</td><td>180</td></tr><tr><td>غدا</td><td>120 جم فراخ مشوية + نصف كوب أرز + خضار مطبوخة كوب + سلطة</td><td>500</td></tr><tr><td>سناك</td><td>20 جم مكسرات + خيار</td><td>140</td></tr><tr><td>عشا</td><td>كوب فول بملعقة صغيرة زيت + جبنة قريش 50 جم + طماطم وجرجير</td><td>380</td></tr></tbody></table></div>\n<h3>خطة ~2000 kcal (صيانة — بروتين ~130 جم)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الوجبة</th><th>المحتوى</th><th>~kcal</th></tr></thead><tbody><tr><td>فطار</td><td>كوب فول + رغيف بلدي + بيضة + سلطة + ملعقة طحينة</td><td>550</td></tr><tr><td>سناك</td><td>زبادي + موزة</td><td>215</td></tr><tr><td>غدا</td><td>150 جم لحم/فراخ + كوب أرز + خضار + سلطة بزيت زيتون</td><td>700</td></tr><tr><td>سناك</td><td>30 جم مكسرات</td><td>180</td></tr><tr><td>عشا</td><td>جبنة قريش 100 جم + نصف رغيف + خضار + كوب لبن</td><td>355</td></tr></tbody></table></div>\n<h3>خطة ~2500 kcal (رياضي/زيادة — بروتين ~170 جم)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الوجبة</th><th>المحتوى</th><th>~kcal</th></tr></thead><tbody><tr><td>فطار</td><td>3 بيض + شوفان 60 جم بلبن + موزة + ملعقة زبدة فول سوداني</td><td>750</td></tr><tr><td>قبل التمرين</td><td>تمر 3 حبات + قهوة</td><td>100</td></tr><tr><td>بعد التمرين</td><td>30 جم واي + رغيف بلدي</td><td>350</td></tr><tr><td>غدا</td><td>200 جم فراخ + كوب ونصف أرز + خضار + سلطة</td><td>850</td></tr><tr><td>عشا</td><td>كوب فول + 2 بيضة + جبنة قريش + سلطة</td><td>450</td></tr></tbody></table></div>\n<h3>يوم نباتي متوازن (~1800 kcal، بروتين ~85 جم)</h3>\n<p>فطار: فول + طحينة + عيش بلدي · سناك: حمص بالطحينة + جزر · غدا: كشري بحجم معتدل + سلطة + زبادي نباتي · سناك: مكسرات + تمر · عشا: عدس + خبز + خضار مشوية. <strong>مكملات ضرورية:</strong> B12 (إلزامي)، فيتامين D، وربما حديد وزنك وأوميجا-3 (ALA من الكتان/الجوز).</p>\n<h3>يوم لمريض سكري (~1700 kcal، كربوهيدرات موزعة ~170 جم)</h3>\n<ul><li><strong>فطار (40 جم كربوهيدرات):</strong> نصف رغيف بلدي + كوب فول + بيضة + خضار</li><li><strong>سناك (15):</strong> زبادي سادة + 5 لوزات</li><li><strong>غدا (50):</strong> نصف كوب أرز + 150 جم سمك مشوي + خضار سوتيه + سلطة كبيرة</li><li><strong>سناك (15):</strong> تفاحة صغيرة + جبنة قريش</li><li><strong>عشا (40):</strong> شوربة عدس كوب + نصف رغيف + سلطة + جبن قريش</li></ul>\n<blockquote class=\"note\"><p>المبدأ: <strong>توزيع منتظم + ألياف مع كل وجبة + بروتين يخفض الاستجابة السكرية</strong>.</p></blockquote>\n<h3>يوم لمريض كلى (مرحلة 3–4، بروتين مقيّد، بوتاسيوم وفوسفور منخفضان)</h3>\n<ul><li>فطار: نصف رغيف أبيض + بيضة واحدة + خيار (تجنّب الجبن المطبوخ والمعالج)</li><li>غدا: 80 جم فراخ + أرز أبيض + كوسة/فاصوليا مسلوقة (<strong>بعد سلق وتصفية</strong> لتقليل البوتاسيوم)</li><li>عشا: مكرونة بصلصة طماطم خفيفة + سلطة خس وخيار</li><li>تجنّب: الموز، البرتقال، البطاطس غير المسلوقة والمصفّاة، المكسرات، الشيكولاتة، المشروبات الغازية الداكنة، اللحوم المصنّعة، بدائل الملح.</li></ul>\n<hr>\n<h2>10.4 استبدالات ذكية في المطبخ العربي</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>بدل</th><th>استخدم</th><th>التوفير</th></tr></thead><tbody><tr><td>الطعمية المقلية</td><td>طعمية في الفرن أو الإيرفراير</td><td>150–200 kcal</td></tr><tr><td>زيت غزير في الطبخ</td><td>ملعقة واحدة مقيسة + ماء/مرق</td><td>200–400 kcal/طبق</td></tr><tr><td>الأرز الأبيض وحده</td><td>أرز مخلوط بالشعرية القليلة أو الفريك أو الأرز البني</td><td>ألياف أعلى</td></tr><tr><td>المشروب الغازي</td><td>ماء بالليمون والنعناع</td><td>140 kcal/علبة</td></tr><tr><td>القشطة والكريمة</td><td>زبادي يوناني/لبن قريش مخفوق</td><td>دهون أقل، بروتين أعلى</td></tr><tr><td>السكر في المشروبات</td><td>تقليل تدريجي (ربع ملعقة كل أسبوع)</td><td>~80 kcal/كوب</td></tr><tr><td>الجبن الرومي/المطبوخ</td><td>قريش أو جبن أبيض مصفّى</td><td>صوديوم وفوسفور أقل</td></tr><tr><td>الخبز الأبيض</td><td>البلدي/الأسمر (ألياف أعلى)</td><td>شبع أطول</td></tr></tbody></table></div>\n<p><strong>تنبيه مهم:</strong> أكبر مصدر خفي للسعرات في المطبخ العربي هو <strong>الزيت غير المقيس والمقليات والمشروبات المحلاة</strong> — قياس الزيت بالملعقة وحده قد يوفّر 300–500 kcal يوميًا دون تغيير الأصناف.</p>\n<hr>", "text": "الجزء العاشر: التطبيق على المطبخ العربي — حصص وخطط وجبات ملاحظة: القيم تقريبية للتقدير العملي وتختلف بحسب طريقة التحضير وكمية الزيت. للدقة البحثية ارجع إلى جداول تركيب الأغذية المعتمدة (مثل جداول المعهد القومي للتغذية أو USDA FoodData Central). 10.1 جدول أطعمة شائعة (لكل حصة عملية) نشويات الطعام الحصة سعرات كربوهيدرات (جم) بروتين (جم) عيش بلدي رغيف متوسط (90 جم) ~230 45 8 عيش فينو/أبيض رغيف ~150 30 5 أرز أبيض مطبوخ كوب (200 جم) ~260 56 5 مكرونة مسلوقة كوب ~220 43 8 بطاطس مسلوقة 150 جم ~130 30 3 كشري (طبق متوسط) ~400 جم ~700–900 130–150 25 فريك/برغل مطبوخ كوب ~230 45 8 بقوليات وبروتين نباتي الطعام الحصة سعرات بروتين فول مدمس (بدون ين ~170 جم) الوجبة المحتوى ~kcal فطار 3 بيض + شوفان 60 جم بلبن + موزة + ملعقة زبدة فول سوداني 750 قبل التمرين تمر 3 حبات + قهوة 100 بعد التمرين 30 جم واي + رغيف بلدي 350 غدا 200 جم فراخ + كوب ونصف أرز + خضار + سلطة 850 عشا كوب فول + 2 بيضة + جبنة قريش + سلطة 450 يوم نباتي متوازن (~1800 kcal، بروتين ~85 جم) فطار: فول + طحينة + عيش بلدي · سناك: حمص بالطحينة + جزر · غدا: كشري بحجم معتدل + سلطة + زبادي نباتي · سناك: مكسرات + تمر · عشا: عدس + خبز + خضار مشوية. مكملات ضرورية: B12 (إلزامي)، فيتامين D، وربما حديد وزنك وأوميجا 3 (ALA من الكتان/الجوز). يوم لمريض سكري (~1700 kcal، كربوهيدرات موزعة ~170 جم) فطار (40 جم كربوهيدرات): نصف رغيف بلدي + كوب فول + بيضة + خضار سناك (15): زبادي سادة + 5 لوزات غدا (50): نصف كوب أرز + 150 جم سمك مشوي + خضار سوتيه + سلطة كبيرة سناك (15): تفاحة صغيرة + جبنة قريش عشا (40): شوربة عدس كوب + نصف رغيف + سلطة + جبن قريش المبدأ: توزيع منتظم + ألياف مع كل وجبة + بروتين يخفض الاستجابة السكرية . يوم لمريض كلى (مرحلة 3–4، بروتين مقيّد، بوتاسيوم وفوسفور منخفضان) فطار: نصف رغيف أبيض + بيضة واحدة + خيار (تجنّب الجبن المطبوخ والمعالج) غدا: 80 جم فراخ + أرز أبيض + كوسة/فاصوليا مسلوقة ( بعد سلق وتصفية لتقليل البوتاسيوم) عشا: مكرونة بصلصة طماطم خفيفة + سلطة خس وخيار تجنّب: الموز، البرتقال، البطاطس غير المسلوقة والمصفّاة، المكسرات، الشيكولاتة، المشروبات الغازية الداكنة، اللحوم المصنّعة، بدائل الملح. 10.4 استبدالات ذكية في المطبخ العربي بدل استخدم التوفير الطعمية المقلية طعمية في الفرن أو الإيرفراير 150–200 kcal زيت غزير في الطبخ ملعقة واحدة مقيسة + ماء/مرق 200–400 kcal/طبق الأرز الأبيض وحده أرز مخلوط بالشعرية القليلة أو الفريك أو الأرز البني ألياف أعلى المشروب الغازي ماء بالليمون والنعناع 140 kcal/علبة القشطة والكريمة زبادي يوناني/لبن قريش مخفوق دهون أقل، بروتين أعلى السكر في المشروبات تقليل تدريجي (ربع ملعقة كل أسبوع) ~80 kcal/كوب الجبن الرومي/المطبوخ قريش أو جبن أبيض مصفّى صوديوم وفوسفور أقل الخبز الأبيض البلدي/الأسمر (ألياف أعلى) شبع أطول تنبيه مهم: أكبر مصدر خفي للسعرات في المطبخ العربي هو الزيت غير المقيس والمقليات والمشروبات المحلاة — قياس الزيت بالملعقة وحده قد يوفّر 300–500 kcal يوميًا دون تغيير الأصناف."}, {"i": 11, "group": "guide", "tag": "علاجي", "num": "11", "short": "حالات وموضوعات إضافية", "html": "<h1>الجزء الحادي عشر: حالات وموضوعات إضافية</h1>\n<h2>11.1 الغدة الدرقية</h2>\n<h3>قصور الغدة (Hypothyroidism)</h3>\n<ul><li><strong>الأيض ينخفض</strong> فعليًا لكن بمقدار متواضع (~5–15% في القصور غير المعالَج) — ليس تفسيرًا لكل زيادة وزن، والعلاج الهرموني يعيد الأمور لطبيعتها إلى حد كبير.</li><li><strong>اليود:</strong> ضروري، لكن <strong>الزيادة المفرطة تضر أيضًا</strong> (قد تفاقم هاشيموتو) — لا تعطِ مكملات يود عالية الجرعة أو أعشابًا بحرية بلا تقييم.</li><li><strong>السيلينيوم</strong> (55–100 ميكروجرام) قد يخفض الأجسام المضادة في هاشيموتو — الأدلة متوسطة، والجرعات العالية سامة.</li><li><strong>⚠️ تناول الليفوثيروكسين على معدة فارغة</strong> بفاصل <strong>4 ساعات</strong> عن الكالسيوم والحديد والصويا، و30–60 دقيقة قبل الطعام والقهوة.</li><li><strong>مُدرّات الدرقية (Goitrogens)</strong> في الكرنبيات والصويا: أثرها ضئيل جدًا بالكميات الغذائية العادية، ويقل أكثر بالطهي. <strong>لا تحذفها</strong>.</li></ul>\n<h3>فرط الغدة</h3>\n<p>سعرات وبروتين أعلى (الأيض مرتفع)، كالسيوم وفيتامين D (خطر هشاشة)، تقليل الكافيين، وتقييد اليود قبل بعض العلاجات باليود المشع بقرار طبي.</p>\n<hr>\n<h2>11.2 متلازمة تكيّس المبايض (PCOS)</h2>\n<p><strong>الجوهر:</strong> مقاومة إنسولين + فرط أندروجين + اضطراب تبويض. <strong>التغذية علاج من الخط الأول.</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>المحور</th><th>التدخل</th></tr></thead><tbody><tr><td>الوزن</td><td><strong>فقد 5–10% وحده قد يعيد انتظام التبويض</strong> — وهو أقوى تدخل غذائي مثبت</td></tr><tr><td>الكربوهيدرات</td><td>جودة قبل كمية: GL منخفض، ألياف عالية، تقليل السكريات المضافة والمشروبات المحلاة. الحمية منخفضة الكربوهيدرات مفيدة لكن لا تتفوق جوهريًا على أي نظام يحقق نفس فقد الوزن</td></tr><tr><td>البروتين والدهون</td><td>بروتين معتدل–عالٍ للشبع؛ دهون أحادية غير مشبعة وأوميجا-3</td></tr><tr><td>النمط</td><td>المتوسطي هو الأكثر دعمًا بالأدلة (مضاد للالتهاب)</td></tr><tr><td>النشاط</td><td><strong>مقاومة + هوائي</strong> — يحسّن حساسية الإنسولين بشكل مستقل عن الوزن</td></tr><tr><td>مغذيات محل بحث</td><td>إينوزيتول (myo-inositol)، فيتامين D عند النقص. أدلة واعدة لكن ليست علاجًا سحريًا</td></tr><tr><td>النساء نحيلات الوزن مع PCOS</td><td>لا تُوصف حمية إنقاص وزن — التركيز على الجودة والنشاط ومقاومة الإنسولين</td></tr></tbody></table></div>\n<p><strong>نقطة نفسية مهمة:</strong> معدلات اضطرابات الأكل أعلى في PCOS. الخطاب القائم على الوزن وحده قد يضر — ركّز على السلوكيات والمؤشرات الأيضية.</p>\n<hr>\n<h2>11.3 هشاشة العظام</h2>\n<ul><li><strong>كالسيوم 1000–1200 مجم/يوم</strong> من الغذاء أولًا (ألبان، سردين بالعظم، طحينة، خضار ورقية، مدعّمات). المكمل بجرعات مقسّمة <span class=\"ltr\">≤500</span> مجم.</li><li><strong>فيتامين D 800–1000 IU</strong> (أو حسب التحليل) — بدونه لا يُمتص الكالسيوم.</li><li><strong>بروتين كافٍ</strong> (1.0–1.2 جم/كجم): الاعتقاد القديم بأن البروتين \"يسحب الكالسيوم من العظام\" <strong>غير مدعوم</strong>؛ البروتين المنخفض هو الأخطر على العظم.</li><li><strong>فيتامين K وماغنسيوم</strong> داعمان.</li><li><strong>مُضعِفات:</strong> التدخين، الكحول الزائد، الصوديوم العالي، الكافيين المفرط، الخمول، ونقص الطاقة المزمن.</li><li><strong>تمارين حمل الوزن والمقاومة</strong> لا تقل أهمية عن الغذاء.</li></ul>\n<hr>\n<h2>11.4 الحساسية الغذائية مقابل عدم التحمل — فرق حاسم</h2>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th><strong>الحساسية (Allergy)</strong></th><th><strong>عدم التحمل (Intolerance)</strong></th></tr></thead><tbody><tr><td>الآلية</td><td>مناعية (IgE غالبًا)</td><td>إنزيمية/كيميائية/هضمية</td></tr><tr><td>الجرعة</td><td>كمية ضئيلة تكفي</td><td>يعتمد على الكمية غالبًا</td></tr><tr><td>السرعة</td><td>دقائق إلى ساعتين</td><td>ساعات، متغيرة</td></tr><tr><td>الأعراض</td><td>شرى، تورّم، ضيق تنفس، قيء، <strong>تأق (Anaphylaxis)</strong></td><td>انتفاخ، غازات، إسهال، مغص</td></tr><tr><td>الخطورة</td><td>قد تكون قاتلة</td><td>مزعجة لا قاتلة</td></tr><tr><td>التشخيص</td><td>IgE نوعي + اختبار الوخز + <strong>تحدي غذائي مراقَب</strong> (المعيار الذهبي)</td><td>تشخيص إكلينيكي/اختبار الهيدروجين في الزفير</td></tr></tbody></table></div>\n<p><strong>المسببات الشائعة:</strong> الحليب، البيض، الفول السوداني، المكسرات الشجرية، القمح، الصويا، السمك، المحاريات، السمسم.</p>\n<p><strong>⚠️ تحذيرات مهنية:</strong></p>\n<ul><li><strong>اختبارات IgG الغذائية \"لحساسية الطعام الكامنة\" غير صالحة علميًا</strong> ورفضتها الجمعيات المتخصصة — وجود IgG يدل على <em>التعرّض</em>، لا على الحساسية. لا تبنِ عليها حذفًا غذائيًا.</li><li>الحذف الواسع بلا تشخيص يسبب سوء تغذية وقلقًا غذائيًا، وقد <strong>يزيد</strong> خطر الحساسية عند الأطفال.</li><li>من لديه تأق يجب أن يحمل <strong>حقن الأدرينالين</strong> ويعرف قراءة الملصقات والتلوث المتقاطع.</li></ul>\n<hr>\n<h2>11.5 الميكروبيوم والبروبيوتيك</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>المصطلح</th><th>التعريف</th></tr></thead><tbody><tr><td><strong>بروبيوتيك</strong></td><td>كائنات حية مفيدة (زبادي، مخللات طبيعية، كفير، مكملات)</td></tr><tr><td><strong>بريبايوتك</strong></td><td>ألياف تغذّي البكتيريا النافعة (إينولين، نشا مقاوم، بصل، ثوم، موز أخضر، شوفان)</td></tr><tr><td><strong>سينبيوتيك</strong></td><td>الاثنان معًا</td></tr><tr><td><strong>بوستبيوتيك</strong></td><td>نواتج التخمّر (أحماض دهنية قصيرة السلسلة كالبيوتيرات)</td></tr></tbody></table></div>\n<p><strong>ما نعرفه بثقة:</strong></p>\n<ul><li><strong>تنوّع النبات في الغذاء هو أقوى محدد لتنوع الميكروبيوم</strong> (قاعدة عملية: استهدف 30 نوعًا نباتيًا مختلفًا أسبوعيًا — يشمل البقول والحبوب والمكسرات والأعشاب).</li><li>البروبيوتيك له فائدة مثبتة في حالات محددة: <strong>إسهال المضادات الحيوية، إسهال المسافر، بعض حالات IBS، التهاب الأمعاء الناخر في الخدّج</strong> — والسلالة والجرعة تهمّان (النتائج لا تُعمَّم بين المنتجات).</li><li><strong>ما لا نعرفه:</strong> لا يوجد \"ميكروبيوم مثالي\" محدد، واختبارات الميكروبيوم التجارية المباشرة للمستهلك <strong>سابقة لأوانها إكلينيكيًا</strong> ولا تصلح لبناء خطة علاجية.</li></ul>\n<hr>\n<h2>11.6 سلامة الغذاء</h2>\n<p><strong>المبادئ الخمسة (WHO):</strong> النظافة · فصل النيء عن المطهو · الطهي الجيد · الحفظ في درجة حرارة آمنة · استخدام ماء ومواد خام آمنة.</p>\n<ul><li><strong>منطقة الخطر:</strong> 5–60 °م — لا تترك طعامًا فيها أكثر من ساعتين (أو ساعة في الجو الحار).</li><li><strong>حرارات آمنة للقلب الداخلي:</strong> دواجن 74 °م · لحوم مفرومة 71 °م · قطع لحم كاملة 63 °م + راحة · سمك 63 °م.</li><li><strong>إذابة التجميد</strong> في الثلاجة أو الماء البارد أو الميكروويف — <strong>لا على المطبخ</strong>، ولا تُعاد التجميد بعد الإذابة.</li><li><strong>الفئات عالية الخطورة:</strong> الحوامل، الرضّع، كبار السن، ناقصو المناعة → تجنّب النيء وغير المبستر.</li><li><strong>⚠️ خطر خاص:</strong> الأرز المطبوخ المتروك خارج الثلاجة (سموم Bacillus cereus) — برّده سريعًا وخزّنه.</li></ul>\n<hr>\n<h2>11.7 تقييم سوء التغذية لدى الأطفال (WHO)</h2>\n<h3>المؤشرات</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المؤشر</th><th>يدل على</th></tr></thead><tbody><tr><td><strong>الوزن مقابل الطول (WFH)</strong></td><td><strong>الهزال (Wasting)</strong> — سوء تغذية حاد</td></tr><tr><td><strong>الطول مقابل العمر (HFA)</strong></td><td><strong>التقزّم (Stunting)</strong> — سوء تغذية مزمن</td></tr><tr><td><strong>الوزن مقابل العمر (WFA)</strong></td><td>نقص الوزن (مؤشر مختلط)</td></tr><tr><td><strong>MUAC</strong> (6–59 شهرًا)</td><td>مسح سريع ميداني</td></tr></tbody></table></div>\n<h3>الدرجات المعيارية (Z-scores)</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Z-score</th><th>التصنيف</th></tr></thead><tbody><tr><td>بين −2 و +2</td><td>طبيعي</td></tr><tr><td>&lt; −2</td><td>معتدل</td></tr><tr><td>&lt; −3</td><td><strong>شديد</strong></td></tr><tr><td>MUAC 11.5–12.5 سم</td><td>سوء تغذية حاد معتدل (MAM)</td></tr><tr><td><strong>MUAC &lt; 11.5 سم</strong></td><td><strong>سوء تغذية حاد شديد (SAM)</strong></td></tr></tbody></table></div>\n<h3>السمات الإكلينيكية</h3>\n<ul><li><strong>الماراسموس:</strong> هزال شديد، فقد دهون وعضل، \"وجه الشيخ العجوز\"، <strong>بلا وذمة</strong>.</li><li><strong>الكواشيوركور:</strong> <strong>وذمة تنقّرية في القدمين</strong> (العلامة الفارقة)، كبد متضخم، تغيرات جلد وشعر، فقدان شهية.</li></ul>\n<h3>مبادئ العلاج</h3>\n<ul><li><strong>SAM بمضاعفات</strong> → إدخال مستشفى وبروتوكول WHO المرحلي (استقرار → انتقال → تأهيل)، مع <strong>حذر بالغ من متلازمة إعادة التغذية</strong> وتصحيح نقص السكر والحرارة والجفاف والإلكتروليتات أولًا.</li><li><strong>SAM بلا مضاعفات وشهية سليمة</strong> → علاج مجتمعي بـ <strong>RUTF</strong> (أغذية علاجية جاهزة للاستعمال).</li><li>⚠️ <strong>لا تُعطى محاليل الإماهة العادية</strong> لسوء التغذية الشديد (خطر الصوديوم) — تُستخدم صيغ خاصة (ReSoMal) بإشراف.</li></ul>\n<hr>\n<h2>11.8 موضوعات موجزة أخرى</h2>\n<p><strong>أنواع فقر الدم:</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>النوع</th><th>MCV</th><th>المفتاح التشخيصي</th></tr></thead><tbody><tr><td>نقص حديد</td><td>منخفض</td><td>فيريتين منخفض، تشبع ترانسفيرين منخفض</td></tr><tr><td>ثلاسيميا</td><td>منخفض</td><td>فيريتين طبيعي/مرتفع، رحلان الهيموجلوبين</td></tr><tr><td>نقص B12/فولات</td><td>مرتفع</td><td>B12/فولات منخفض، أعراض عصبية مع B12</td></tr><tr><td>فقر دم الأمراض المزمنة</td><td>طبيعي/منخفض</td><td>فيريتين <strong>مرتفع</strong> + CRP مرتفع</td></tr></tbody></table></div>\n<p><strong>الحمية الكيتونية العلاجية للصرع:</strong> علاج مثبت لصرع الأطفال المقاوم للأدوية (كيتونية كلاسيكية، Atkins معدّلة، MCT) — <strong>تُطبَّق فقط بإشراف فريق عصبي وتغذوي</strong> مع مراقبة النمو والدهون والحصوات وتكميل الفيتامينات.</p>\n<p><strong>الصداع النصفي:</strong> المحفزات فردية (أجبان معتّقة، نترات اللحوم المصنعة، الكحول، الشوكولاتة، انسحاب الكافيين)، وأهم إجراء عام هو <strong>انتظام الوجبات وعدم تخطيها والترطيب والنوم</strong>؛ الماغنسيوم وريبوفلافين وCoQ10 لهما أدلة وقائية متوسطة.</p>\n<p><strong>نقص المناعة/بعد زراعة الأعضاء:</strong> نظام آمن ميكروبيولوجيًا، حذر من الجريب فروت مع مثبطات المناعة (تفاعل CYP3A4 خطر).</p>\n<hr>", "text": "الجزء الحادي عشر: حالات وموضوعات إضافية 11.1 الغدة الدرقية قصور الغدة (Hypothyroidism) الأيض ينخفض فعليًا لكن بمقدار متواضع (~5–15% في القصور غير المعالَج) — ليس تفسيرًا لكل زيادة وزن، والعلاج الهرموني يعيد الأمور لطبيعتها إلى حد كبير. اليود: ضروري، لكن الزيادة المفرطة تضر أيضًا (قد تفاقم هاشيموتو) — لا تعطِ مكملات يود عالية الجرعة أو أعشابًا بحرية بلا تقييم. السيلينيوم (55–100 ميكروجرام) قد يخفض الأجسام المضادة في هاشيموتو — الأدلة متوسطة، والجرعات العالية سامة. ⚠️ تناول الليفوثيروكسين على معدة فارغة بفاصل 4 ساعات عن الكالسيوم والحديد والصويا، و30–60 دقيقة قبل الطعام والقهوة. مُدرّات الدرقية (Goitrogens) في الكرنبيات والصويا: أثرها ضئيل جدًا بالكميات الغذائية العادية، ويقل أكثر بالطهي. لا تحذفها . فرط الغدة سعرات وبروتين أعلى (الأيض مرتفع)، كالسيوم وفيتامين D (خطر هشاشة)، تقليل الكافيين، وتقييد اليود قبل بعض العلاجات باليود المشع بقرار طبي. 11.2 متلازمة تكيّس المبايض (PCOS) الجوهر: مقاومة إنسولين + فرط أندروجين + اضطراب تبويض. التغذية علاج من الخط الأول. المحور التدخل الوزن فقد 5–10% وحده قد يعيد انتظام التبويض — وهو أقوى تدخل غذائي مثبت الكربوهيدرات جودة قبل كمية: GL منخفض، ألياف عالية، تقليل السكريات المضافة والمشروبات المحلاة. الحمية منخفضة الكربوهيدرات مفيدة لكن لا تتفوق جوهريًا على أي نظام يحقق نفس فقد الوزن البروتين والدهون بروتين معتدل–عالٍ للشبع؛ دهون أحادية غير مشبعة وأوميجا 3 النمط المتوسطي هو الأكثر دعمًا بالأدلة (مضاد للالتهاب) النشاط مقاومة + هوائي — يحسّن حساسية الإنسولين بشكل مستقل عن الوزن مغذيات محل بحث إينوزيتول (myo inositol)، فيتامين D عند النقص. أدلة واعدة لكن ليست علاجًا سحريًا النساء نحيلات الوزن مع PCOS لا تُوصف حمية إنقاص وزن — التركيز على الجودة والنشاط ومقاومة الإنسولين نقطة نفسية مهمة: معدلات اضطرابات الأكل أعلى في PCOS. الخطاب القائم على الوزن وحده قد يضر — ركّز على السلوكيات والمؤشرات الأيضية. 11.3 هشاشة العظام كالسيوم 1000–1200 مجم/يوم من الغذاء أولًا (ألبان، سردين بالعظم، طحينة، خضار ورقية، مدعّمات). المكمل بجرعات مقسّمة ≤500 مجم. فيتامين D 800–1000 IU (أو حسب التحليل) — بدونه لا يُمتص الكالسيوم. بروتين كافٍ (1.0–1.2 جم/كجم): الاعتقاد القديم بأن البروتين \"يسحب الكالسيوم من العظام\" غير مدعوم ؛ البروتين المنخفض هو الأخطر على العظم. فيتامين K وماغنسيوم داعمان. مُضعِفات: التدخين، الكحول الزائد، الصوديوم العالي، الكافيين المفرط، الخمول، ونقص الطاقة المزمن. تمارين حمل الوزن والمقاومة لا تقل أهمية عن الغذاء. 11.4 الحساسية الغذائية مقابل عدم التحمل — فرق حاسم الحساسية (Allergy) عدم التحمل (Intolerance) الآلية مناعية (IgE غالبًا) إنزيمية/كيميائية/هضمية الجرعة كمية ضئيلة تكفي يعتمد على الكمية غالبًا السرعة دقائق إلى ساعتين ساعات، متغيرة الأعراض شرى، تورّم، ضيق تنفس، قيء، تأق (Anaphylaxis) انتفاخ، غازات، إسهال، مغص الخطورة قد تكون قاتلة مزعجة لا قاتلة التشخيص IgE نوعي + اختبار الوخز + تحدي غذائي مراقَب (المعيار الذهبي) تشخيص إكلينيكي/اختبار الهيدروجين في الزفير المسببات الشائعة: الحليب، البيض، الفول السوداني، المكسرات الشجرية، القمح، الصويا، السمك، المحاريات، السمسم. ⚠️ تحذيرات مهنية: اختبارات IgG الغذائية \"لحساسية الطعام الكامنة\" غير صالحة علميًا ورفضتها الجمعيات المتخصصة — وجود IgG يدل على التعرّض ، لا على الحساسية. لا تبنِ عليها حذفًا غذائيًا. الحذف الواسع بلا تشخيص يسبب سوء تغذية وقلقًا غذائيًا، وقد يزيد خطر الحساسية عند الأطفال. من لديه تأق يجب أن يحمل حقن الأدرينالين ويعرف قراءة الملصقات والتلوث المتقاطع. 11.5 الميكروبيوم والبروبيوتيك المصطلح التعريف بروبيوتيك كائنات حية مفيدة (زبادي، مخللات طبيعية، كفير، مكملات) بريبايوتك ألياف تغذّي البكتيريا النافعة (إينولين، نشا مقاوم، بصل، ثوم، موز أخضر، شوفان) سينبيوتيك الاثنان معًا بوستبيوتيك نواتج التخمّر (أحماض دهنية قصيرة السلسلة كالبيوتيرات) ما نعرفه بثقة: تنوّع النبات في الغذاء هو أقوى محدد لتنوع الميكروبيوم (قاعدة عملية: استهدف 30 نوعًا نباتيًا مختلفًا أسبوعيًا — يشمل البقول والحبوب والمكسرات والأعشاب). البروبيوتيك له فائدة مثبتة في حالات محددة: إسهال المضادات الحيوية، إسهال المسافر، بعض حالات IBS، التهاب الأمعاء الناخر في الخدّج — والسلالة والجرعة تهمّان (النتائج لا تُعمَّم بين المنتجات). ما لا نعرفه: لا يوجد \"ميكروبيوم مثالي\" محدد، واختبارات الميكروبيوم التجارية المباشرة للمستهلك سابقة لأوانها إكلينيكيًا ولا تصلح لبناء خطة علاجية. 11.6 سلامة الغذاء المبادئ الخمسة (WHO): النظافة · فصل النيء عن المطهو · الطهي الجيد · الحفظ في درجة حرارة آمنة · استخدام ماء ومواد خام آمنة. منطقة الخطر: 5–60 °م — لا تترك طعامًا فيها أكثر من ساعتين (أو ساعة في الجو الحار). حرارات آمنة للقلب الداخلي: دواجن 74 °م · لحوم مفرومة 71 °م · قطع لحم كاملة 63 °م + راحة · سمك 63 °م. إذابة التجميد في الثلاجة أو الماء البارد أو الميكروويف — لا على المطبخ ، ولا تُعاد التجميد بعد الإذابة. الفئات عالية الخطورة: الحوامل، الرضّع، كبار السن، ناقصو المناعة → تجنّب النيء وغير المبستر. ⚠️ خطر خاص: الأرز المطبوخ المتروك خارج الثلاجة (سموم Bacillus cereus) — برّده سريعًا وخزّنه. 11.7 تقييم سوء التغذية لدى الأطفال (WHO) المؤشرات المؤشر يدل على الوزن مقابل الطول (WFH) الهزال (Wasting) — سوء تغذية حاد الطول مقابل العمر (HFA) التقزّم (Stunting) — سوء تغذية مزمن الوزن مقابل العمر (WFA) نقص الوزن (مؤشر مختلط) MUAC (6–59 شهرًا) مسح سريع ميداني الدرجات المعيارية (Z scores) Z score التصنيف بين −2 و +2 طبيعي < −2 معتدل < −3 شديد MUAC 11.5–12.5 سم سوء تغذية حاد معتدل (MAM) MUAC < 11.5 سم سوء تغذية حاد شديد (SAM) السمات الإكلينيكية الماراسموس: هزال شديد، فقد دهون وعضل، \"وجه الشيخ العجوز\"، بلا وذمة . الكواشيوركور: وذمة تنقّرية في القدمين (العلامة الفارقة)، كبد متضخم، تغيرات جلد وشعر، فقدان شهية. مبادئ العلاج SAM بمضاعفات → إدخال مستشفى وبروتوكول WHO المرحلي (استقرار → انتقال → تأهيل)، مع حذر بالغ من متلازمة إعادة التغذية وتصحيح نقص السكر والحرارة والجفاف والإلكتروليتات أولًا. SAM بلا مضاعفات وشهية سليمة → علاج مجتمعي بـ RUTF (أغذية علاجية جاهزة للاستعمال). ⚠️ لا تُعطى محاليل الإماهة العادية لسوء التغذية الشديد (خطر الصوديوم) — تُستخدم صيغ خاصة (ReSoMal) بإشراف. 11.8 موضوعات موجزة أخرى أنواع فقر الدم: النوع MCV المفتاح التشخيصي نقص حديد منخفض فيريتين منخفض، تشبع ترانسفيرين منخفض ثلاسيميا منخفض فيريتين طبيعي/مرتفع، رحلان الهيموجلوبين نقص B12/فولات مرتفع B12/فولات منخفض، أعراض عصبية مع B12 فقر دم الأمراض المزمنة طبيعي/منخفض فيريتين مرتفع + CRP مرتفع الحمية الكيتونية العلاجية للصرع: علاج مثبت لصرع الأطفال المقاوم للأدوية (كيتونية كلاسيكية، Atkins معدّلة، MCT) — تُطبَّق فقط بإشراف فريق عصبي وتغذوي مع مراقبة النمو والدهون والحصوات وتكميل الفيتامينات. الصداع النصفي: المحفزات فردية (أجبان معتّقة، نترات اللحوم المصنعة، الكحول، الشوكولاتة، انسحاب الكافيين)، وأهم إجراء عام هو انتظام الوجبات وعدم تخطيها والترطيب والنوم ؛ الماغنسيوم وريبوفلافين وCoQ10 لهما أدلة وقائية متوسطة. نقص المناعة/بعد زراعة الأعضاء: نظام آمن ميكروبيولوجيًا، حذر من الجريب فروت مع مثبطات المناعة (تفاعل CYP3A4 خطر)."}, {"i": 12, "group": "guide", "tag": "أدوات", "num": "12", "short": "نماذج عمل جاهزة", "html": "<h1>الجزء الثاني عشر: نماذج عمل جاهزة</h1>\n<h2>12.1 استمارة التقييم الأولي</h2>\n<pre class=\"calc\"><code>■ البيانات الأساسية\nالاسم | العمر | الجنس | الوظيفة وساعات العمل | وسيلة التواصل\n\n■ سبب الزيارة والهدف\nالهدف المعلن: ..........\nالهدف الحقيقي عند التعمّق: ..........\nسلم الأهمية (0–10): ....  | سلم الثقة (0–10): ....\nمحاولات سابقة ونتائجها ولماذا توقفت: ..........\n\n■ التاريخ الطبي\nالأمراض المزمنة | الجراحات | الحساسية | التاريخ العائلي\nالأدوية والجرعات (وأوقاتها) | المكملات الحالية\n\n■ القياسات\nالوزن الحالي / المعتاد / الأعلى / الأدنى | الطول | BMI\nمحيط الخصر | محيط الورك | نسبة الدهون (الطريقة) | ضغط الدم\n\n■ التحاليل (التاريخ + القيمة)\nسكر صائم | HbA1c | دهون كاملة | وظائف كلى وكبد | صورة دم | فيتامين D | حديد وفيريتين | درقية\n\n■ النمط الغذائي\nعدد الوجبات ومواعيدها | من يطبخ؟ | الأكل خارج المنزل (مرات/أسبوع)\nمشروبات (ماء/شاي/قهوة/غازية/عصائر) | الأكل الليلي | الأكل الانفعالي\nنفور/تفضيلات | قيود دينية أو ثقافية | الميزانية | صيام دوري؟\n\n■ استرجاع 24 ساعة (بأسلوب المرور المتعدد)\nالوقت | الطعام | الكمية | المكان | الحالة المزاجية\n\n■ النشاط والنوم والتوتر\nنوع التمرين وتكراره وشدته | خطوات يومية | طبيعة العمل (جلوس/حركة)\nساعات النوم وجودته | مستوى التوتر (0–10) | التدخين | الكحول\n\n■ علامات إنذار (نعم/لا)\nفقد وزن غير مفسَّر □ | عسر بلع □ | دم في البراز □ | أعراض عصبية □\nسلوكيات تقييد/تطهير □ | أفكار إيذاء ذات □   → إحالة فورية</code></pre>\n<hr>\n<h2>12.2 قالب توثيق الجلسة (ADIME)</h2>\n<pre class=\"calc\"><code>A — التقييم:  البيانات الموضوعية والذاتية + المقارنة بالمعايير\nD — التشخيص التغذوي (PES):  [المشكلة] مرتبطة بـ [السبب] كما يتضح من [العلامات]\nI — التدخل:   الوصفة الغذائية (سعرات/ماكروز/قيود) + محاور التثقيف + الأهداف السلوكية المتفق عليها\nM/E — المتابعة: المؤشرات + القيم المستهدفة + موعد المراجعة</code></pre>\n<h2>12.3 ورقة المتابعة الدورية</h2>\n<div class=\"tablewrap\"><table><thead><tr><th>التاريخ</th><th>الوزن</th><th>الخصر</th><th>الالتزام (0–10)</th><th>ما نجح</th><th>ما تعثّر</th><th>العائق الأكبر</th><th>هدف الأسبوع القادم</th></tr></thead><tbody><tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<p><strong>أسئلة المتابعة الخمسة (استخدمها في كل جلسة):</strong></p>\n<ol><li>إيه اللي اشتغل معاك الأسبوع اللي فات؟</li><li>إيه أصعب لحظة قابلتك؟ وإيه اللي حصل فيها بالظبط؟</li><li>لو رجعت اللحظة دي تاني، إيه أصغر حاجة ممكن تعملها بشكل مختلف؟</li><li>الخطة دي واقعية بالنسبة لأسبوعك الجاي ولا محتاجة نخففها؟</li><li>من 0 لـ 10، قد إيه واثق إنك تنفّذ هدف الأسبوع ده؟ <em>(لو أقل من 7 → صغّر الهدف)</em></li></ol>\n<h2>12.4 قالب تقرير حالة مختصر</h2>\n<pre class=\"calc\"><code>1. البيانات والشكوى الرئيسية\n2. التقييم (ABCDEF) — النتائج ذات الدلالة فقط\n3. التشخيص التغذوي (PES)\n4. الاحتياجات المقدّرة: الطاقة | البروتين | السوائل | مغذيات خاصة\n5. خطة التدخل: النظام + التثقيف + المكملات + الإحالات\n6. مؤشرات المتابعة وموعد المراجعة\n7. ملاحظات السلامة والتفاعلات الدوائية</code></pre>\n<hr>", "text": "الجزء الثاني عشر: نماذج عمل جاهزة 12.1 استمارة التقييم الأولي ■ البيانات الأساسية الاسم العمر الجنس الوظيفة وساعات العمل وسيلة التواصل ■ سبب الزيارة والهدف الهدف المعلن: .......... الهدف الحقيقي عند التعمّق: .......... سلم الأهمية (0–10): .... سلم الثقة (0–10): .... محاولات سابقة ونتائجها ولماذا توقفت: .......... ■ التاريخ الطبي الأمراض المزمنة الجراحات الحساسية التاريخ العائلي الأدوية والجرعات (وأوقاتها) المكملات الحالية ■ القياسات الوزن الحالي / المعتاد / الأعلى / الأدنى الطول BMI محيط الخصر محيط الورك نسبة الدهون (الطريقة) ضغط الدم ■ التحاليل (التاريخ + القيمة) سكر صائم HbA1c دهون كاملة وظائف كلى وكبد صورة دم فيتامين D حديد وفيريتين درقية ■ النمط الغذائي عدد الوجبات ومواعيدها من يطبخ؟ الأكل خارج المنزل (مرات/أسبوع) مشروبات (ماء/شاي/قهوة/غازية/عصائر) الأكل الليلي الأكل الانفعالي نفور/تفضيلات قيود دينية أو ثقافية الميزانية صيام دوري؟ ■ استرجاع 24 ساعة (بأسلوب المرور المتعدد) الوقت الطعام الكمية المكان الحالة المزاجية ■ النشاط والنوم والتوتر نوع التمرين وتكراره وشدته خطوات يومية طبيعة العمل (جلوس/حركة) ساعات النوم وجودته مستوى التوتر (0–10) التدخين الكحول ■ علامات إنذار (نعم/لا) فقد وزن غير مفسَّر □ عسر بلع □ دم في البراز □ أعراض عصبية □ سلوكيات تقييد/تطهير □ أفكار إيذاء ذات □ → إحالة فورية 12.2 قالب توثيق الجلسة (ADIME) A — التقييم: البيانات الموضوعية والذاتية + المقارنة بالمعايير D — التشخيص التغذوي (PES): [المشكلة] مرتبطة بـ [السبب] كما يتضح من [العلامات] I — التدخل: الوصفة الغذائية (سعرات/ماكروز/قيود) + محاور التثقيف + الأهداف السلوكية المتفق عليها M/E — المتابعة: المؤشرات + القيم المستهدفة + موعد المراجعة 12.3 ورقة المتابعة الدورية التاريخ الوزن الخصر الالتزام (0–10) ما نجح ما تعثّر العائق الأكبر هدف الأسبوع القادم أسئلة المتابعة الخمسة (استخدمها في كل جلسة): 1. إيه اللي اشتغل معاك الأسبوع اللي فات؟ 2. إيه أصعب لحظة قابلتك؟ وإيه اللي حصل فيها بالظبط؟ 3. لو رجعت اللحظة دي تاني، إيه أصغر حاجة ممكن تعملها بشكل مختلف؟ 4. الخطة دي واقعية بالنسبة لأسبوعك الجاي ولا محتاجة نخففها؟ 5. من 0 لـ 10، قد إيه واثق إنك تنفّذ هدف الأسبوع ده؟ (لو أقل من 7 → صغّر الهدف) 12.4 قالب تقرير حالة مختصر 1. البيانات والشكوى الرئيسية 2. التقييم (ABCDEF) — النتائج ذات الدلالة فقط 3. التشخيص التغذوي (PES) 4. الاحتياجات المقدّرة: الطاقة البروتين السوائل مغذيات خاصة 5. خطة التدخل: النظام + التثقيف + المكملات + الإحالات 6. مؤشرات المتابعة وموعد المراجعة 7. ملاحظات السلامة والتفاعلات الدوائية"}, {"i": 13, "group": "guide", "tag": "أسئلة", "num": "13", "short": "بنك الأسئلة الموسّع", "html": "<h1>الجزء الثالث عشر: بنك الأسئلة الموسّع (مع شرح الأخطاء)</h1><div class=\"jump\"><div class=\"eyebrow\">نسخة تفاعلية</div><p>هذه الأسئلة — بشرح سبب خطأ كل خيار — متاحة تفاعليًا في تبويب <strong>الاختبارات</strong> ضمن بنوك المحاور الستة، إضافة إلى 300 سؤال موزّعة على الكتب العشرة.</p><button class=\"btn\" data-jump=\"quiz\">افتح الاختبارات</button></div>\n<h2>القسم أ: مراحل الحياة والصيام</h2>\n<p><strong>1.</strong> الزيادة الحرارية الموصى بها في الثلث الأول من الحمل: أ) صفر تقريبًا ب) +340 ج) +450 د) +600</p>\n<blockquote class=\"note\"><p><strong>الإجابة: أ.</strong> (ب) هي الثلث الثاني و(ج) الثالث. (د) مبالغة تؤدي لزيادة وزن مفرطة. الثلث الأول لا يحتاج طاقة إضافية تُذكر لأن نمو الجنين فيه بطيء.</p></blockquote>\n<p><strong>2.</strong> حمض الفوليك يجب أن يبدأ: أ) عند اكتشاف الحمل ب) في الشهر الثالث ج) <strong>قبل الحمل بثلاثة شهور</strong> د) في الثلث الأخير</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ج.</strong> الأنبوب العصبي يُغلق في اليوم 28 — أي قبل أن تعرف كثير من النساء أنهن حوامل. (أ) و(ب) و(د) كلها <strong>متأخرة جدًا</strong> لتحقيق الوقاية.</p></blockquote>\n<p><strong>3.</strong> الطعام الممنوع تمامًا قبل عمر سنة: أ) البيض ب) <strong>العسل</strong> ج) الفول السوداني المهروس د) الزبادي</p>\n<blockquote class=\"danger\"><p><strong>الإجابة: ب.</strong> خطر التسمم السجقي الرضيعي. (أ) و(ج) العكس صحيح — <strong>إدخالهما المبكر يقلل الحساسية</strong>. (د) الزبادي مسموح من 6 شهور (المحظور هو اللبن البقري كمشروب أساسي).</p></blockquote>\n<p><strong>4.</strong> بروتين كبار السن الموصى به: أ) 0.8 ب) <strong>1.0–1.5</strong> ج) 2.5 د) أقل من الشباب</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ب.</strong> بسبب مقاومة الابتناء. (أ) هو الحد الأدنى لمنع النقص وليس الأمثل، و(د) خطأ شائع خطير يسرّع الساركوبينيا.</p></blockquote>\n<p><strong>5.</strong> أفضل توقيت للتدريب الثقيل في رمضان: أ) قبل الإفطار بساعتين ب) <strong>بعد الإفطار بـ 2–3 ساعات</strong> ج) منتصف النهار د) عند الظهيرة</p>\n<blockquote class=\"danger\"><p><strong>الإجابة: ب.</strong> الطاقة والترطيب متاحان. (أ) مناسب فقط للشدة الخفيفة. (ج) و(د) خطر جفاف وإجهاد حراري.</p></blockquote>\n<p><strong>6.</strong> مريض سكري صائم وسكره هبط إلى 62 مجم/دل: أ) يكمل الصيام ب) ينتظر المغرب ج) <strong>يفطر فورًا</strong> د) يشرب ماء فقط</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ج.</strong> الهبوط عن 70 يستوجب الإفطار الفوري بلا تردد. (د) الماء لا يرفع السكر.</p></blockquote>\n<h2>القسم ب: الحالات الإضافية</h2>\n<p><strong>7.</strong> الغذاء الذي يجب فصله عن الليفوثيروكسين بأربع ساعات: أ) الخس ب) <strong>الكالسيوم والحديد</strong> ج) الأرز د) التفاح</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ب.</strong> يرتبطان بالدواء ويمنعان امتصاصه.</p></blockquote>\n<p><strong>8.</strong> أقوى تدخل غذائي مثبت في PCOS: أ) حذف الجلوتين ب) <strong>فقد 5–10% من الوزن</strong> ج) مكمل الكروم د) الصيام المتقطع حصرًا</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ب.</strong> (أ) لا علاقة له بـ PCOS ما لم يوجد سيلياك. (ج) أدلته ضعيفة. (د) أداة ممكنة لكنها ليست متفوقة على أي طريقة تحقق نفس العجز.</p></blockquote>\n<p><strong>9.</strong> اختبارات IgG الغذائية: أ) معيار ذهبي للحساسية ب) تكشف الحساسية الكامنة ج) <strong>غير صالحة علميًا لتشخيص الحساسية</strong> د) بديل عن اختبار الوخز</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ج.</strong> IgG يعكس التعرّض الطبيعي للطعام لا الحساسية. المعيار الذهبي هو <strong>التحدي الغذائي المراقَب</strong>.</p></blockquote>\n<p><strong>10.</strong> العلامة الفارقة للكواشيوركور: أ) هزال شديد ب) <strong>وذمة تنقّرية في القدمين</strong> ج) قصر القامة د) نحافة الوجه</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ب.</strong> (أ) و(د) سمات الماراسموس. (ج) علامة التقزّم المزمن.</p></blockquote>\n<p><strong>11.</strong> MUAC الذي يشخّص سوء التغذية الحاد الشديد: أ) &lt;14 سم ب) &lt;13 سم ج) <strong>&lt;11.5 سم</strong> د) &lt;10 سم</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ج.</strong> و11.5–12.5 = سوء تغذية حاد معتدل.</p></blockquote>\n<p><strong>12.</strong> مريض التهاب مزمن وفيريتينه مرتفع وHb منخفض وMCV طبيعي — الأرجح: أ) نقص حديد ب) <strong>فقر دم الأمراض المزمنة</strong> ج) نقص B12 د) ثلاسيميا</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ب.</strong> في نقص الحديد (أ) يكون الفيريتين <strong>منخفضًا</strong> وMCV منخفضًا. (ج) يرفع MCV. (د) MCV منخفض مع فيريتين طبيعي.</p></blockquote>\n<p><strong>13.</strong> أقوى محدد لتنوع الميكروبيوم: أ) مكمل بروبيوتيك يومي ب) <strong>تنوّع الأطعمة النباتية</strong> ج) الزبادي فقط د) مضادات حيوية دورية</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ب.</strong> (أ) و(ج) مفيدان في سياقات محددة لكنهما لا يعوّضان نظامًا فقير التنوع. (د) تضر الميكروبيوم.</p></blockquote>\n<p><strong>14.</strong> الأرز المطبوخ المتروك خارج الثلاجة يشكّل خطر: أ) ليستيريا ب) توكسوبلازما ج) <strong>Bacillus cereus</strong> د) نوروفيروس</p>\n<blockquote class=\"note\"><p><strong>الإجابة: ج.</strong> أبواغه تنجو من الطهي وتنتج سمومًا في درجة حرارة الغرفة.</p></blockquote>\n<p><strong>15.</strong> البروتين ومرضى هشاشة العظام: أ) يجب تقييده لأنه يسحب الكالسيوم ب) <strong>يجب أن يكون كافيًا 1.0–1.2 جم/كجم</strong> ج) لا علاقة له د) يُمنع بعد سن 60</p>\n<blockquote class=\"danger\"><p><strong>الإجابة: ب.</strong> الاعتقاد في (أ) قديم وغير مدعوم؛ <strong>البروتين المنخفض</strong> هو عامل الخطر الحقيقي على العظم والعضل معًا.</p></blockquote>\n<h2>القسم ج: أسئلة حالات (تفكير مركّب)</h2>\n<p><strong>16.</strong> سيدة حامل في الأسبوع 10، نباتية صرفة، هيموجلوبين 10.2. ما أهم ثلاثة مكملات وأولوية المتابعة؟</p>\n<blockquote class=\"note\"><p><strong>الإجابة:</strong> (1) <strong>B12</strong> — إلزامي وغير قابل للتفاوض في النباتية الصرفة، ونقصه يضر النمو العصبي للجنين. (2) <strong>حديد</strong> مع فيتامين C وبعيدًا عن الشاي والكالسيوم. (3) <strong>فولات</strong> (وقد بدأ مبكرًا مثاليًا). ويُضاف <strong>DHA</strong> من الطحالب واليود وفيتامين D. المتابعة: صورة دم وفيريتين وB12 كل ثلث حمل.</p></blockquote>\n<p><strong>17.</strong> طفل عمره 3 سنوات، وزن مقابل الطول Z = −3.2، وذمة في القدمين، شهية ضعيفة. التصنيف والخطوة الأولى؟</p>\n<blockquote class=\"note\"><p><strong>الإجابة:</strong> <strong>سوء تغذية حاد شديد (SAM) مع مضاعفات</strong> (وذمة + فقدان شهية) → <strong>إدخال مستشفى</strong> وبروتوكول WHO المرحلي. الخطوة الأولى <strong>ليست</strong> التغذية المكثفة، بل تصحيح نقص السكر وانخفاض الحرارة والجفاف والإلكتروليتات، وبدء تغذية حذرة جدًا (F-75) لتفادي متلازمة إعادة التغذية. <strong>لا تُستخدم محاليل الإماهة العادية.</strong></p></blockquote>\n<p><strong>18.</strong> رجل سكري نوع ثاني على ميتفورمين وجليبنكلاميد، يريد صيام رمضان. أهم أربع نقاط؟</p>\n<blockquote class=\"danger\"><p><strong>الإجابة:</strong> (1) <strong>استشارة الطبيب قبل رمضان</strong> لتعديل الجرعات — الجليبنكلاميد (سلفونيل يوريا) يرفع خطر هبوط السكر بشدة أثناء الصيام وقد يُستبدل. (2) نقل الجرعة الأكبر إلى الإفطار. (3) مراقبة السكر عدة مرات يوميًا — <strong>القياس لا يفطر</strong>. (4) قواعد الإفطار الفوري: &lt;70 أو &gt;300 أو أعراض هبوط. + سحور متأخر غني بالبروتين والألياف وترطيب كافٍ.</p></blockquote>\n<p><strong>19.</strong> سيدة 29 سنة بـ PCOS، BMI 24، دورة غير منتظمة، تسأل عن حمية إنقاص وزن. ردك؟</p>\n<blockquote class=\"danger\"><p><strong>الإجابة:</strong> وزنها في النطاق الطبيعي → <strong>لا تُوصف حمية إنقاص وزن</strong>. التركيز على: جودة الكربوهيدرات وGL منخفض، نمط متوسطي، <strong>تدريب مقاومة + هوائي</strong> (يحسّن حساسية الإنسولين مستقلًا عن الوزن)، فحص فيتامين D، وإحالة لطبيب نساء/غدد. ويجب الانتباه لخطر اضطراب الأكل وتجنّب الخطاب المتمركز حول الوزن.</p></blockquote>\n<p><strong>20.</strong> مسنّ 78 سنة، فقد 6 كجم في 4 شهور، يعيش وحده، يشتكي جفاف الفم وصعوبة المضغ. حلّل واقترح.</p>\n<blockquote class=\"note\"><p><strong>الإجابة:</strong> فقد &gt;5%/شهر → <strong>علامة حمراء</strong>. الأسباب المحتملة متعددة المحاور: أسنان/بلع، أدوية تسبب جفاف الفم أو فقدان شهية، اكتئاب وعزلة، محدودية دخل أو قدرة على الطهي، أو مرض عضوي كامن. <strong>الخطوات:</strong> (1) استبعاد سبب طبي — إحالة. (2) تقييم أسنان وبلع. (3) مراجعة الأدوية. (4) أطعمة طرية كثيفة الطاقة والبروتين + مكمل فموي بين الوجبات. (5) تدخل اجتماعي (وجبات جاهزة، مرافقة أثناء الأكل — الأكل مع آخرين يرفع المدخول فعليًا). (6) متابعة وزن أسبوعية.</p></blockquote>\n<hr>\n<p><em>(نهاية الإضافات — الطبعة الموسّعة)</em></p>\n<hr>", "text": "الجزء الثالث عشر: بنك الأسئلة الموسّع (مع شرح الأخطاء) القسم أ: مراحل الحياة والصيام 1. الزيادة الحرارية الموصى بها في الثلث الأول من الحمل: أ) صفر تقريبًا ب) +340 ج) +450 د) +600 الإجابة: أ. (ب) هي الثلث الثاني و(ج) الثالث. (د) مبالغة تؤدي لزيادة وزن مفرطة. الثلث الأول لا يحتاج طاقة إضافية تُذكر لأن نمو الجنين فيه بطيء. 2. حمض الفوليك يجب أن يبدأ: أ) عند اكتشاف الحمل ب) في الشهر الثالث ج) قبل الحمل بثلاثة شهور د) في الثلث الأخير الإجابة: ج. الأنبوب العصبي يُغلق في اليوم 28 — أي قبل أن تعرف كثير من النساء أنهن حوامل. (أ) و(ب) و(د) كلها متأخرة جدًا لتحقيق الوقاية. 3. الطعام الممنوع تمامًا قبل عمر سنة: أ) البيض ب) العسل ج) الفول السوداني المهروس د) الزبادي الإجابة: ب. خطر التسمم السجقي الرضيعي. (أ) و(ج) العكس صحيح — إدخالهما المبكر يقلل الحساسية . (د) الزبادي مسموح من 6 شهور (المحظور هو اللبن البقري كمشروب أساسي). 4. بروتين كبار السن الموصى به: أ) 0.8 ب) 1.0–1.5 ج) 2.5 د) أقل من الشباب الإجابة: ب. بسبب مقاومة الابتناء. (أ) هو الحد الأدنى لمنع النقص وليس الأمثل، و(د) خطأ شائع خطير يسرّع الساركوبينيا. 5. أفضل توقيت للتدريب الثقيل في رمضان: أ) قبل الإفطار بساعتين ب) بعد الإفطار بـ 2–3 ساعات ج) منتصف النهار د) عند الظهيرة الإجابة: ب. الطاقة والترطيب متاحان. (أ) مناسب فقط للشدة الخفيفة. (ج) و(د) خطر جفاف وإجهاد حراري. 6. مريض سكري صائم وسكره هبط إلى 62 مجم/دل: أ) يكمل الصيام ب) ينتظر المغرب ج) يفطر فورًا د) يشرب ماء فقط الإجابة: ج. الهبوط عن 70 يستوجب الإفطار الفوري بلا تردد. (د) الماء لا يرفع السكر. القسم ب: الحالات الإضافية 7. الغذاء الذي يجب فصله عن الليفوثيروكسين بأربع ساعات: أ) الخس ب) الكالسيوم والحديد ج) الأرز د) التفاح الإجابة: ب. يرتبطان بالدواء ويمنعان امتصاصه. 8. أقوى تدخل غذائي مثبت في PCOS: أ) حذف الجلوتين ب) فقد 5–10% من الوزن ج) مكمل الكروم د) الصيام المتقطع حصرًا الإجابة: ب. (أ) لا علاقة له بـ PCOS ما لم يوجد سيلياك. (ج) أدلته ضعيفة. (د) أداة ممكنة لكنها ليست متفوقة على أي طريقة تحقق نفس العجز. 9. اختبارات IgG الغذائية: أ) معيار ذهبي للحساسية ب) تكشف الحساسية الكامنة ج) غير صالحة علميًا لتشخيص الحساسية د) بديل عن اختبار الوخز الإجابة: ج. IgG يعكس التعرّض الطبيعي للطعام لا الحساسية. المعيار الذهبي هو التحدي الغذائي المراقَب . 10. العلامة الفارقة للكواشيوركور: أ) هزال شديد ب) وذمة تنقّرية في القدمين ج) قصر القامة د) نحافة الوجه الإجابة: ب. (أ) و(د) سمات الماراسموس. (ج) علامة التقزّم المزمن. 11. MUAC الذي يشخّص سوء التغذية الحاد الشديد: أ) <14 سم ب) <13 سم ج) <11.5 سم د) <10 سم الإجابة: ج. و11.5–12.5 = سوء تغذية حاد معتدل. 12. مريض التهاب مزمن وفيريتينه مرتفع وHb منخفض وMCV طبيعي — الأرجح: أ) نقص حديد ب) فقر دم الأمراض المزمنة ج) نقص B12 د) ثلاسيميا الإجابة: ب. في نقص الحديد (أ) يكون الفيريتين منخفضًا وMCV منخفضًا. (ج) يرفع MCV. (د) MCV منخفض مع فيريتين طبيعي. 13. أقوى محدد لتنوع الميكروبيوم: أ) مكمل بروبيوتيك يومي ب) تنوّع الأطعمة النباتية ج) الزبادي فقط د) مضادات حيوية دورية الإجابة: ب. (أ) و(ج) مفيدان في سياقات محددة لكنهما لا يعوّضان نظامًا فقير التنوع. (د) تضر الميكروبيوم. 14. الأرز المطبوخ المتروك خارج الثلاجة يشكّل خطر: أ) ليستيريا ب) توكسوبلازما ج) Bacillus cereus د) نوروفيروس الإجابة: ج. أبواغه تنجو من الطهي وتنتج سمومًا في درجة حرارة الغرفة. 15. البروتين ومرضى هشاشة العظام: أ) يجب تقييده لأنه يسحب الكالسيوم ب) يجب أن يكون كافيًا 1.0–1.2 جم/كجم ج) لا علاقة له د) يُمنع بعد سن 60 الإجابة: ب. الاعتقاد في (أ) قديم وغير مدعوم؛ البروتين المنخفض هو عامل الخطر الحقيقي على العظم والعضل معًا. القسم ج: أسئلة حالات (تفكير مركّب) 16. سيدة حامل في الأسبوع 10، نباتية صرفة، هيموجلوبين 10.2. ما أهم ثلاثة مكملات وأولوية المتابعة؟ الإجابة: (1) B12 — إلزامي وغير قابل للتفاوض في النباتية الصرفة، ونقصه يضر النمو العصبي للجنين. (2) حديد مع فيتامين C وبعيدًا عن الشاي والكالسيوم. (3) فولات (وقد بدأ مبكرًا مثاليًا). ويُضاف DHA من الطحالب واليود وفيتامين D. المتابعة: صورة دم وفيريتين وB12 كل ثلث حمل. 17. طفل عمره 3 سنوات، وزن مقابل الطول Z = −3.2، وذمة في القدمين، شهية ضعيفة. التصنيف والخطوة الأولى؟ الإجابة: سوء تغذية حاد شديد (SAM) مع مضاعفات (وذمة + فقدان شهية) → إدخال مستشفى وبروتوكول WHO المرحلي. الخطوة الأولى ليست التغذية المكثفة، بل تصحيح نقص السكر وانخفاض الحرارة والجفاف والإلكتروليتات، وبدء تغذية حذرة جدًا (F 75) لتفادي متلازمة إعادة التغذية. لا تُستخدم محاليل الإماهة العادية. 18. رجل سكري نوع ثاني على ميتفورمين وجليبنكلاميد، يريد صيام رمضان. أهم أربع نقاط؟ الإجابة: (1) استشارة الطبيب قبل رمضان لتعديل الجرعات — الجليبنكلاميد (سلفونيل يوريا) يرفع خطر هبوط السكر بشدة أثناء الصيام وقد يُستبدل. (2) نقل الجرعة الأكبر إلى الإفطار. (3) مراقبة السكر عدة مرات يوميًا — القياس لا يفطر . (4) قواعد الإفطار الفوري: <70 أو 300 أو أعراض هبوط. + سحور متأخر غني بالبروتين والألياف وترطيب كافٍ. 19. سيدة 29 سنة بـ PCOS، BMI 24، دورة غير منتظمة، تسأل عن حمية إنقاص وزن. ردك؟ الإجابة: وزنها في النطاق الطبيعي → لا تُوصف حمية إنقاص وزن . التركيز على: جودة الكربوهيدرات وGL منخفض، نمط متوسطي، تدريب مقاومة + هوائي (يحسّن حساسية الإنسولين مستقلًا عن الوزن)، فحص فيتامين D، وإحالة لطبيب نساء/غدد. ويجب الانتباه لخطر اضطراب الأكل وتجنّب الخطاب المتمركز حول الوزن. 20. مسنّ 78 سنة، فقد 6 كجم في 4 شهور، يعيش وحده، يشتكي جفاف الفم وصعوبة المضغ. حلّل واقترح. الإجابة: فقد 5%/شهر → علامة حمراء . الأسباب المحتملة متعددة المحاور: أسنان/بلع، أدوية تسبب جفاف الفم أو فقدان شهية، اكتئاب وعزلة، محدودية دخل أو قدرة على الطهي، أو مرض عضوي كامن. الخطوات: (1) استبعاد سبب طبي — إحالة. (2) تقييم أسنان وبلع. (3) مراجعة الأدوية. (4) أطعمة طرية كثيفة الطاقة والبروتين + مكمل فموي بين الوجبات. (5) تدخل اجتماعي (وجبات جاهزة، مرافقة أثناء الأكل — الأكل مع آخرين يرفع المدخول فعليًا). (6) متابعة وزن أسبوعية. (نهاية الإضافات — الطبعة الموسّعة)"}, {"i": 14, "group": "guide", "tag": "دعم تغذوي", "num": "14", "short": "الدعم التغذوي", "html": "<h1>الجزء الرابع عشر: الدعم التغذوي (التغذية المعوية والوريدية)</h1>\n<h2>14.1 خوارزمية القرار</h2>\n<pre class=\"calc\"><code>هل المريض قادر على تغطية &gt;60% من احتياجه فمويًا خلال 5–7 أيام؟\n        │\n   نعم ─┴─ لا\n   │        │\nتدعيم فموي  هل الجهاز الهضمي يعمل (وظيفيًا وآمنًا)؟\n(أطعمة مدعّمة        │\n + ONS)         نعم ─┴─ لا\n                 │        │\n        تغذية معوية    تغذية وريدية (PN)\n                 │\n        المدة المتوقعة؟\n        │\n   &lt;4–6 أسابيع ──→ أنبوب أنفي (معدي/اثناعشري/صائمي)\n   &gt;4–6 أسابيع ──→ فغر (PEG / PEJ)</code></pre>\n<blockquote class=\"note\"><p><strong>القاعدة الحاكمة:</strong> <em>\"If the gut works, use it.\"</em> — التغذية المعوية تحافظ على سلامة الحاجز المعوي وتقلل انتقال البكتيريا والمضاعفات الإنتانية والتكلفة.</p></blockquote>\n<hr>\n<h2>14.2 التغذية المعوية (Enteral Nutrition — EN)</h2>\n<h3>طرق الوصول</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>الطريق</th><th>الاستخدام</th><th>ملاحظات</th></tr></thead><tbody><tr><td><strong>أنفي-معدي (NG)</strong></td><td>الأشيع، قصير المدى</td><td>يستفيد من وظيفة المعدة الهضمية والتحكم في الإفراغ</td></tr><tr><td><strong>أنفي-صائمي (NJ)</strong></td><td>خطر شفط عالٍ، خزل معدي، التهاب بنكرياس حاد</td><td><strong>ضخ مستمر فقط</strong> — لا تتحمل الصائم دفعات</td></tr><tr><td><strong>PEG (فغر معدي بالمنظار)</strong></td><td>&gt;4–6 أسابيع (سكتة، أورام رأس ورقبة، أمراض عصبية)</td><td>يحتاج عناية بموضع الفغر</td></tr><tr><td><strong>PEJ / فغر صائمي</strong></td><td>خطر شفط مستمر، جراحة معدة</td><td></td></tr></tbody></table></div>\n<h3>أنماط الإعطاء</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>النمط</th><th>الوصف</th><th>متى</th></tr></thead><tbody><tr><td><strong>دفعات (Bolus)</strong></td><td>200–400 مل خلال 15–30 دقيقة، 4–6 مرات</td><td>مرضى مستقرون، تغذية معدية، أقرب للفسيولوجي</td></tr><tr><td><strong>متقطع (Intermittent)</strong></td><td>200–500 مل خلال 30–60 دقيقة بالجاذبية/المضخة</td><td>مرونة وحرية حركة</td></tr><tr><td><strong>مستمر (Continuous)</strong></td><td>20–150 مل/ساعة بمضخة</td><td>مرضى حرجون، تغذية صائمية، عدم تحمل</td></tr><tr><td><strong>ليلي (Cyclic)</strong></td><td>10–16 ساعة ليلًا</td><td>فطام تدريجي وتشجيع الأكل الفموي نهارًا</td></tr></tbody></table></div>\n<h3>أنواع التركيبات</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>النوع</th><th>الوصف</th><th>الاستخدام</th></tr></thead><tbody><tr><td><strong>قياسي متعدد البوليمرات</strong></td><td>بروتين وكربوهيدرات ودهون كاملة، 1.0–1.2 kcal/مل</td><td>الأغلبية العظمى</td></tr><tr><td><strong>مركّز عالي السعرات</strong></td><td>1.5–2.0 kcal/مل</td><td>تقييد سوائل (قلب، كلى)</td></tr><tr><td><strong>عالي البروتين</strong></td><td><span class=\"ltr\">≥20</span>% من الطاقة بروتين</td><td>جروح، قرح فراش، حروق، حرج</td></tr><tr><td><strong>شبه عنصري/عنصري</strong></td><td>ببتيدات أو أحماض أمينية حرة + MCT</td><td>سوء امتصاص، أمعاء قصيرة، بنكرياس</td></tr><tr><td><strong>متخصص</strong></td><td>مرضى سكري (بطيء الامتصاص)، كلى (منخفض إلكتروليتات)، رئة</td><td>يُختار بأدلة لا بالاسم التجاري</td></tr><tr><td><strong>بألياف</strong></td><td>يحسّن انتظام الأمعاء</td><td>يُتجنب في نقص التروية المعوية</td></tr></tbody></table></div>\n<h3>حساب عملي (مثال)</h3>\n<blockquote class=\"note\"><p>مريض 70 كجم، الهدف 1750 kcal و 98 جم بروتين. التركيبة: 1.5 kcal/مل، بروتين 6.3 جم/100 مل.</p></blockquote>\n<ul><li>الحجم = 1750 ÷ 1.5 = <strong>1167 مل/يوم</strong> → بضخ مستمر 24 ساعة ≈ <strong>49 مل/ساعة</strong></li><li>البروتين المُعطى = 1167 × 0.063 = <strong>73.5 جم</strong> → <strong>ناقص عن الهدف</strong> → أضف مسحوق بروتين معياري ~25 جم أو انتقل لتركيبة عالية البروتين.</li><li><strong>الماء الحر:</strong> التركيبات المركزة تحتوي ~70–75% ماء فقط → الماء الحر هنا ≈ 1167 × 0.72 ≈ 840 مل. إذا كان الاحتياج 2100 مل → أضف <strong>~1260 مل</strong> كغسيل أنبوب (Flushes) مقسّمة.</li></ul>\n<h3>المضاعفات وإدارتها</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المضاعفة</th><th>التعامل</th></tr></thead><tbody><tr><td><strong>إسهال</strong></td><td>ابحث أولًا عن <strong>الأدوية</strong> (محاليل بسوربيتول، مضادات حيوية، ماغنسيوم) وعن C. difficile — التركيبة نادرًا هي السبب. ثم: بطّئ المعدل، جرّب ألياف/ببتيدات</td></tr><tr><td><strong>إمساك</strong></td><td>ألياف + ماء كافٍ + حركة + مراجعة المسكنات الأفيونية</td></tr><tr><td><strong>انتفاخ/تبقّي معدي</strong></td><td>بطّئ المعدل، رأس السرير 30–45°، فكّر في مُحرِّك معدي أو أنبوب صائمي</td></tr><tr><td class=\"warn\"><strong>⚠️ الشفط (Aspiration)</strong></td><td><strong>الأخطر</strong> — رفع رأس السرير 30–45° دائمًا، ضخ مستمر، وصول ما بعد البواب عند الخطر العالي</td></tr><tr><td><strong>انسداد الأنبوب</strong></td><td>غسيل بماء دافئ 30 مل قبل وبعد كل استخدام؛ <strong>لا تسحق أقراصًا ممتدة المفعول</strong>؛ استخدم صيغًا سائلة</td></tr><tr><td><strong>متلازمة إعادة التغذية</strong></td><td>راجع الجزء الثالث — ابدأ منخفضًا وراقب الفوسفات</td></tr></tbody></table></div>\n<hr>\n<h2>14.3 التغذية الوريدية (Parenteral Nutrition — PN)</h2>\n<h3>الدواعي</h3>\n<p>فشل معوي، انسداد كامل، ناسور عالي الإخراج، متلازمة الأمعاء القصيرة الشديدة، نقص تروية معوي، عدم تحمل معوي مستمر رغم المحاولات، التهاب مخاطي شديد بعد العلاج الكيميائي.</p>\n<h3>طرق الوصول</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>النوع</th><th>الأسمولالية</th><th>المدة</th></tr></thead><tbody><tr><td><strong>PN محيطي (PPN)</strong></td><td><span class=\"ltr\">≤900</span> mOsm/L</td><td><span class=\"ltr\">≤10</span>–14 يومًا، دعم جزئي</td></tr><tr><td><strong>PN مركزي (TPN)</strong></td><td>بلا حد عملي</td><td>طويل المدى — عبر PICC أو قسطرة مركزية</td></tr></tbody></table></div>\n<h3>المكونات وحساباتها</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>المكوّن</th><th>القيمة الحرارية</th><th>ملاحظات</th></tr></thead><tbody><tr><td><strong>دكستروز</strong></td><td><strong>3.4 kcal/جم</strong> (وليس 4 — لأنه مُميَّه)</td><td><strong>الحد الأقصى للأكسدة: 4–5 مجم/كجم/دقيقة</strong> — تجاوزه يسبب فرط سكر وتشحّم كبدي</td></tr><tr><td><strong>أحماض أمينية</strong></td><td>4 kcal/جم</td><td>تُحسب ضمن الطاقة أم لا حسب البروتوكول؛ 1.2–2.0 جم/كجم</td></tr><tr><td><strong>مستحلب دهني</strong></td><td>9 kcal/جم (10 kcal/جم للمستحلب لأنه يحوي جليسرول)</td><td><strong><span class=\"ltr\">≤1</span> جم/كجم/يوم</strong>؛ الأجيال الحديثة (زيت سمك/زيتون) أفضل من فول الصويا المنفرد</td></tr><tr><td>إلكتروليتات، عناصر نزرة، فيتامينات</td><td>—</td><td>تُضاف يوميًا؛ <strong>الثيامين إلزامي</strong></td></tr></tbody></table></div>\n<p><strong>مثال حساب:</strong> مريض 70 كجم، هدف 1750 kcal، بروتين 1.5 جم/كجم.</p>\n<ul><li>بروتين = 105 جم (420 kcal)</li><li>دهون = 0.8 × 70 = 56 جم (~560 kcal)</li><li>دكستروز = (1750 − 420 − 560) ÷ 3.4 ≈ <strong>226 جم</strong></li><li><strong>تحقق من معدل التسريب:</strong> 226000 مجم ÷ 70 كجم ÷ 1440 دقيقة ≈ <strong>2.2 مجم/كجم/دقيقة</strong> ✅ (أقل من 4–5)</li></ul>\n<h3>المضاعفات</h3>\n<ul><li><strong>متعلقة بالقسطرة:</strong> <strong>إنتان مجرى الدم (CLABSI)</strong> — الأخطر؛ تخثر؛ استرواح صدري عند التركيب.</li><li><strong>أيضية:</strong> فرط/نقص سكر، اضطراب إلكتروليتات، فرط دهون ثلاثية، متلازمة إعادة التغذية.</li><li><strong>كبدية معوية (PNALD/IFALD):</strong> ركود صفراوي وتشحّم — الوقاية: <strong>تجنّب الإفراط في السعرات</strong>، تحديد الدهون، <strong>تغذية معوية تحفيزية (Trophic feeding) ولو بكميات ضئيلة</strong>، ودورية التسريب (Cyclic PN).</li><li><strong>ضمور الزغابات المعوية</strong> مع الحرمان المعوي المطوّل.</li></ul>\n<h3>الفطام</h3>\n<p>ابدأ التغذية المعوية بكميات تحفيزية مبكرًا، وقلّل PN تدريجيًا كلما زاد تحمّل المعوي، وأوقفه عند تغطية <strong>&gt;60%</strong> من الاحتياج معويًا.</p>\n<hr>\n<h2>14.4 متلازمة الأمعاء القصيرة (نظرة موجزة)</h2>\n<ul><li>الشدة تتوقف على <strong>طول ونوع الأمعاء المتبقية ووجود صمام اللفائفي والقولون</strong>.</li><li>استئصال اللفائفي النهائي → فقد امتصاص <strong>B12 والأملاح الصفراوية</strong> → إسهال دهني وحصوات مرارة وأكسالات.</li><li>الاستراتيجية: وجبات صغيرة متكررة، فصل السوائل عن الطعام، محاليل إماهة فموية <strong>متساوية التوتر</strong> (لا سوائل شديدة التخفيف أو شديدة التركيز — كلاهما يزيد الإخراج)، MCT عند القولون السليم، تعويض B12 حقنًا، ومراقبة الماغنسيوم والزنك.</li></ul>\n<hr>", "text": "الجزء الرابع عشر: الدعم التغذوي (التغذية المعوية والوريدية) 14.1 خوارزمية القرار هل المريض قادر على تغطية 60% من احتياجه فمويًا خلال 5–7 أيام؟ │ نعم ─┴─ لا │ │ تدعيم فموي هل الجهاز الهضمي يعمل (وظيفيًا وآمنًا)؟ (أطعمة مدعّمة │ + ONS) نعم ─┴─ لا │ │ تغذية معوية تغذية وريدية (PN) │ المدة المتوقعة؟ │ <4–6 أسابيع ──→ أنبوب أنفي (معدي/اثناعشري/صائمي) 4–6 أسابيع ──→ فغر (PEG / PEJ) القاعدة الحاكمة: \"If the gut works, use it.\" — التغذية المعوية تحافظ على سلامة الحاجز المعوي وتقلل انتقال البكتيريا والمضاعفات الإنتانية والتكلفة. 14.2 التغذية المعوية (Enteral Nutrition — EN) طرق الوصول الطريق الاستخدام ملاحظات أنفي معدي (NG) الأشيع، قصير المدى يستفيد من وظيفة المعدة الهضمية والتحكم في الإفراغ أنفي صائمي (NJ) خطر شفط عالٍ، خزل معدي، التهاب بنكرياس حاد ضخ مستمر فقط — لا تتحمل الصائم دفعات PEG (فغر معدي بالمنظار) 4–6 أسابيع (سكتة، أورام رأس ورقبة، أمراض عصبية) يحتاج عناية بموضع الفغر PEJ / فغر صائمي خطر شفط مستمر، جراحة معدة أنماط الإعطاء النمط الوصف متى دفعات (Bolus) 200–400 مل خلال 15–30 دقيقة، 4–6 مرات مرضى مستقرون، تغذية معدية، أقرب للفسيولوجي متقطع (Intermittent) 200–500 مل خلال 30–60 دقيقة بالجاذبية/المضخة مرونة وحرية حركة مستمر (Continuous) 20–150 مل/ساعة بمضخة مرضى حرجون، تغذية صائمية، عدم تحمل ليلي (Cyclic) 10–16 ساعة ليلًا فطام تدريجي وتشجيع الأكل الفموي نهارًا أنواع التركيبات النوع الوصف الاستخدام قياسي متعدد البوليمرات بروتين وكربوهيدرات ودهون كاملة، 1.0–1.2 kcal/مل الأغلبية العظمى مركّز عالي السعرات 1.5–2.0 kcal/مل تقييد سوائل (قلب، كلى) عالي البروتين ≥20% من الطاقة بروتين جروح، قرح فراش، حروق، حرج شبه عنصري/عنصري ببتيدات أو أحماض أمينية حرة + MCT سوء امتصاص، أمعاء قصيرة، بنكرياس متخصص مرضى سكري (بطيء الامتصاص)، كلى (منخفض إلكتروليتات)، رئة يُختار بأدلة لا بالاسم التجاري بألياف يحسّن انتظام الأمعاء يُتجنب في نقص التروية المعوية حساب عملي (مثال) مريض 70 كجم، الهدف 1750 kcal و 98 جم بروتين. التركيبة: 1.5 kcal/مل، بروتين 6.3 جم/100 مل. الحجم = 1750 ÷ 1.5 = 1167 مل/يوم → بضخ مستمر 24 ساعة ≈ 49 مل/ساعة البروتين المُعطى = 1167 × 0.063 = 73.5 جم → ناقص عن الهدف → أضف مسحوق بروتين معياري ~25 جم أو انتقل لتركيبة عالية البروتين. الماء الحر: التركيبات المركزة تحتوي ~70–75% ماء فقط → الماء الحر هنا ≈ 1167 × 0.72 ≈ 840 مل. إذا كان الاحتياج 2100 مل → أضف ~1260 مل كغسيل أنبوب (Flushes) مقسّمة. المضاعفات وإدارتها المضاعفة التعامل إسهال ابحث أولًا عن الأدوية (محاليل بسوربيتول، مضادات حيوية، ماغنسيوم) وعن C. difficile — التركيبة نادرًا هي السبب. ثم: بطّئ المعدل، جرّب ألياف/ببتيدات إمساك ألياف + ماء كافٍ + حركة + مراجعة المسكنات الأفيونية انتفاخ/تبقّي معدي بطّئ المعدل، رأس السرير 30–45°، فكّر في مُحرِّك معدي أو أنبوب صائمي ⚠️ الشفط (Aspiration) الأخطر — رفع
