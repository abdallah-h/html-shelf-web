ا باليقظة والقلق."}, {"q": "لماذا يُعدّ النوم مضاعِفًا لبقية الأنظمة؟", "a": "لأنه يرفع التركيز وضبط الانفعال وجودة القرار والالتزام بالعادات، فيحسّن أداء كل ما تبنيه فوقه."}, {"q": "في «لماذا ننام»: ما النقد الموجّه للكتاب؟", "a": "مراجعات نقدية جادة بشأن دقة بعض الأرقام والادعاءات القاطعة وحدة صياغتها."}, {"q": "ما الجزء الصامد من رسالته؟", "a": "أن النوم أساس للإدراك والصحة وأن الحرمان المزمن مكلف؛ أما الأرقام المحددة فتُقرأ بحذر."}, {"q": "كيف تتعامل مع أرقام الكتاب عمليًا؟", "a": "بأخذ الاتجاه العام لا العتبات الحاسمة، وعدم بناء قرارات طبية عليها بلا مراجعة مصادر أحدث."}, {"q": "ما علاقة النوم بالذاكرة قبل التعلّم وبعده؟", "a": "النوم قبل التعلّم يهيّئ القدرة على التسجيل، والنوم بعده يثبّت ما تعلّمته."}, {"q": "لماذا يُنصح بعدم التضحية بالنوم قبل امتحان أو عرض؟", "a": "لأن الساعات الإضافية من المذاكرة بلا نوم تقلّل التثبيت والاسترجاع وسرعة المعالجة أكثر مما تضيف."}, {"q": "ما أثر الحرمان على ضبط الانفعال؟", "a": "زيادة التفاعل مع المثيرات السلبية وضعف الكبح، فترتفع الحدة وتنخفض جودة العلاقات والقرارات."}, {"q": "كيف يرتبط النوم بالشهية والوزن؟", "a": "عبر تأثيره على هرمونات الجوع والشبع، فيميل المحروم إلى استهلاك سعرات أعلى خصوصًا من السكريات."}, {"q": "ما القيلولة ومتى تنفع؟", "a": "فترة قصيرة تعوّض جزئيًا وترفع اليقظة؛ لكن القيلولة المتأخرة أو الطويلة قد تقلل الضغط النومي ليلًا."}, {"q": "كيف يتقاطع الكتاب مع نيوبورت؟", "a": "في أن جودة التركيز مورد بيولوجي محدود؛ فالنوم شرط مسبق لأي عمل عميق."}, {"q": "كيف يتقاطع مع أتيا؟", "a": "في اعتبار النوم تدخلًا صحيًا مركزيًا لا عادة ثانوية، وربطه بالمخاطر الأيضية والعصبية."}, {"q": "في «لماذا ننام»: كيف يتقاطع مع كلير؟", "a": "في أن ضبط البيئة والإشارات أنجع من الاعتماد على الإرادة؛ فبيئة النوم تصنع العادة."}, {"q": "ما أول تغيير يوصى به لمن يعاني؟", "a": "تثبيت وقت الاستيقاظ يوميًا، وتعرّض صباحي للضوء، ووقف الكافيين بعد الظهر."}, {"q": "ما مؤشر أنك في دَين نومي؟", "a": "الحاجة لمنبه للاستيقاظ دائمًا، والنعاس الشديد بعد الظهر، والنوم الطويل جدًا في العطلة."}, {"q": "في «لماذا ننام»: ما الخلاصة في جملة؟", "a": "ثبّت مواعيدك، اطلب ضوء الصباح، أوقف الكافيين بعد الظهر، وعامل النوم كأساس لا كفائض."}], "52": [{"q": "ما موضوع كتاب الجرأة على القيادة؟", "a": "تطبيق أبحاث الانكشاف والخجل على القيادة: أن القائد الشجاع يبقى حاضرًا في المحادثات الصعبة بدل تجنّبها."}, {"q": "ما المهارات الأربع للقيادة الشجاعة؟", "a": "ممارسة الانكشاف، والعيش وفق القيم، والشجاعة في الثقة، والتعلّم من السقوط."}, {"q": "كيف يمارس القائد الانكشاف؟", "a": "بقيادة بلا يقين كامل، وطلب المساعدة، وقول لا أعرف، والاعتراف بالخطأ علنًا."}, {"q": "كم قيمة توصي براون بتحديدها ولماذا؟", "a": "قيمتان فقط، لأن القائمة الطويلة تصبح شعارات؛ والقيمتان يمكن ترجمتهما إلى سلوك يومي محدد."}, {"q": "كيف تُختبر القيمة عمليًا؟", "a": "بأن تسمّي ثلاثة سلوكيات تدعمها وثلاثة تخالفها، فتصبح قابلة للملاحظة والمساءلة."}, {"q": "في «الجرأة على القيادة»: ماذا يعني اختصار BRAVING؟", "a": "الحدود، والاعتمادية، والمساءلة، والخزنة أي السرية، والنزاهة، وعدم الحكم، والكرم."}, {"q": "ما فائدة BRAVING العملية؟", "a": "أنه يحوّل عبارة أنا لا أثق به الغامضة إلى تشخيص محدد قابل للمعالجة."}, {"q": "ما معنى الوضوح لطف وعدم الوضوح قسوة؟", "a": "أن التلميح والمجاملة الغامضة يطيلان معاناة الطرف الآخر، وأن التوقعات غير المعلنة أول مصادر الاستياء المهني."}, {"q": "ما دروع القيادة الشائعة؟", "a": "الكمالية، والتهكم، والسخرية المموّهة، وطلب الإذن الدائم، والتحكم المفرط."}, {"q": "ما تكلفة هذه الدروع؟", "a": "أنها آليات حماية من الانكشاف تُدفع تكلفتها من ثقة الفريق ومبادرته."}, {"q": "ما خطوات عملية النهوض Rising Strong؟", "a": "التعرّف على أنك مُستثار عاطفيًا، ثم التصفية بكتابة القصة الرديئة الأولى وفحصها، ثم تعديل الرواية والسلوك."}, {"q": "في «الجرأة على القيادة»: ما القصة الرديئة الأولى SFD؟", "a": "القصة التي يرويها عقلك بلا تنقيح، تُكتب كما هي ليُفصل فيها الحقيقة عن الافتراض."}, {"q": "ما جمل افتتاح محادثة التصفية؟", "a": "القصة التي أرويها لنفسي هي…، وأحتاج أن أفهم أكثر عن…، وما الذي أغفله؟"}, {"q": "لماذا تفتح هذه الصيغ الحوار؟", "a": "لأنها تعلن أن ما لديك رواية لا حكم، فتخفض دفاعية الطرف الآخر وتطلب معلومات."}, {"q": "ما الفرق بين هذا الكتاب والجرأة العظيمة؟", "a": "الجرأة العظيمة عن الفرد، وهذا يحوّل المفاهيم نفسها إلى ممارسات فريق قابلة للقياس والتدريب."}, {"q": "كيف يُبنى الأمان النفسي في الفريق؟", "a": "بنمذجة القائد للانكشاف، ومكافأة الإبلاغ عن الأخطاء، ومعالجة السلوك المسيء بسرعة."}, {"q": "ما دور الحدود في القيادة الرحيمة؟", "a": "أن أكثر القادة تعاطفًا هم أوضحهم حدودًا، لأن غياب الحدود يحوّل العطاء إلى استياء."}, {"q": "كيف تتعامل مع كماليتك كقائد؟", "a": "بالتمييز بين السعي للتميّز وبين الخوف من الحكم، وبإطلاق العمل عند مستوى جيد كافٍ لجمع تغذية راجعة."}, {"q": "ما خطر التحكم المفرط؟", "a": "أنه يعطّل نمو الفريق ويحوّل القائد إلى عنق زجاجة، وينتج ثقافة انتظار التعليمات."}, {"q": "كيف تُعالج ثقافة السخرية والتهكم؟", "a": "بتسميتها صراحة كسلوك يقلل الأمان، واستبدالها بنقد مباشر محدد داخل إطار محترم."}, {"q": "ما دور الفضول في القيادة عند براون؟", "a": "أنه بديل عن الدفاع؛ فطرح سؤال بدل الرد يحوّل المواجهة إلى استكشاف."}, {"q": "لماذا تُعدّ المساءلة جزءًا من الثقة؟", "a": "لأن الاعتذار بلا تصحيح لا يبني ثقة؛ والمساءلة تعني تحمّل الأثر والالتزام بتغيير ملموس."}, {"q": "ما الفرق بين النقد الشخصي والملاحظة السلوكية؟", "a": "الأول يمس الهوية فيفعّل الخجل ويغلق التعلّم، والثاني يصف فعلًا وأثره فيبقي الحوار مفتوحًا."}, {"q": "كيف يتقاطع الكتاب مع سكوت؟", "a": "في أن الوضوح لطف، وفي أن السكوت عن المشكلة تعاطف مدمّر لا رحمة."}, {"q": "كيف يتقاطع مع باترسون؟", "a": "في أن الأمان شرط لجودة الحوار، وفي كشف القصص التي نرويها لأنفسنا قبل التصرف."}, {"q": "كيف يتقاطع مع دويك؟", "a": "في أن استقبال النقد كمعلومة لا كتهديد للهوية هو ما يميّز القائد المتعلّم."}, {"q": "ما مؤشر أن قائدًا يعمل من وراء درع؟", "a": "أن يفسّر كل نقد كتهديد، أو يستخدم الفكاهة لتجنّب المواضيع الصعبة، أو يطلب تفاصيل مفرطة عن كل شيء."}, {"q": "ما أول تمرين للفريق؟", "a": "تحديد قيمتين للفريق وترجمتهما إلى سلوكيات ملحوظة، ثم مراجعة شهرية لمدى الالتزام بها."}, {"q": "لماذا يُعدّ الانكشاف مقياسًا للشجاعة لا للضعف؟", "a": "لأن كل فعل شجاع يتضمن مخاطرة وعدم يقين وانكشافًا عاطفيًا، فلا شجاعة بلا احتمال الرفض أو الفشل."}, {"q": "في «الجرأة على القيادة»: ما الخلاصة في جملة؟", "a": "كن واضحًا ومنكشفًا، سمِّ قيمك بسلوكيات، شخّص الثقة بـ BRAVING، وافحص قصتك قبل أن تتصرف بها."}], "53": [{"q": "ما حلقة العادة عند دوهيغ؟", "a": "إشارة ثم روتين ثم مكافأة، ويغذّيها التوقّع الذي يتكوّن مع التكرار."}, {"q": "ما دور التوقّع Craving في الحلقة؟", "a": "أنه ما يجعل الحلقة قهرية؛ فبمجرد ظهور الإشارة يتولّد ترقّب للمكافأة يدفع للروتين تلقائيًا."}, {"q": "لماذا يقول دوهيغ إن العادة لا تُمحى؟", "a": "لأن المسار العصبي يبقى قائمًا؛ والممكن هو استبدال الروتين مع الإبقاء على الإشارة والمكافأة."}, {"q": "ما القاعدة الذهبية لتغيير العادة؟", "a": "احتفظ بالإشارة والمكافأة نفسيهما واستبدل الروتين وحده."}, {"q": "أعطِ مثالًا على تطبيق القاعدة الذهبية.", "a": "إشارة الملل عصرًا مع مكافأة التشتيت الذهني: يُستبدل تصفّح الهاتف بمشي خمس دقائق يحقق نفس المكافأة."}, {"q": "ما خطوات تشخيص العادة الأربع؟", "a": "حدد الروتين، وجرّب المكافآت، واعزل الإشارة، ثم ضع خطة."}, {"q": "ما فئات الإشارات الخمس؟", "a": "المكان، والوقت، والحالة العاطفية، والأشخاص المحيطون، والفعل السابق مباشرة."}, {"q": "كيف تُجرَّب المكافآت عمليًا؟", "a": "بتبديل الروتين بمكافآت مختلفة وتسجيل ما يُسكت الرغبة فعلًا بعد خمس عشرة دقيقة."}, {"q": "ما صيغة الخطة في الخطوة الرابعة؟", "a": "حين يحدث كذا سأفعل كذا لأحصل على كذا."}, {"q": "ما العادات المحورية Keystone Habits؟", "a": "عادات قليلة تُحدث تغييرًا متسلسلًا في مجالات أخرى بلا قصد، كالتمرين المنتظم أو تدوين ما تأكله."}, {"q": "ما الاستراتيجية المستفادة من العادات المحورية؟", "a": "لا تغيّر عشر عادات، غيّر واحدة محورية وستجرّ غيرها."}, {"q": "لماذا تعمل العادات المحورية؟", "a": "لأنها تنتج انتصارات صغيرة تغيّر صورتك عن نفسك، وتخلق بنى وثقافات صغيرة تدعم تغييرات أخرى."}, {"q": "كيف يصف دوهيغ الإرادة؟", "a": "كعضلة تُبنى بالتمرين وتتأثر بالنوم والتوتر ومستوى الطاقة."}, {"q": "ما دور الانتصارات الصغيرة؟", "a": "توليد زخم وتغيير تدريجي في الهوية، فتصبح العادات الأكبر أكثر معقولية."}, {"q": "ما نقاط الضغط عند الأزمة؟", "a": "نوافذ قصيرة تكون فيها العادات الشخصية والمؤسسية قابلة لإعادة التشكيل، ويستخدمها القادة الأذكياء بدل إخمادها سريعًا."}, {"q": "ما دور الاعتقاد في منع الانتكاس؟", "a": "أن الاعتقاد بإمكان التغيير هو ما يصمد تحت الضغط الشديد، ويتقوّى غالبًا داخل مجموعة."}, {"q": "لماذا تنجح مجموعات الدعم من منظور الكتاب؟", "a": "لأنها توفّر إشارات ومكافآت اجتماعية جديدة، وتغذّي الاعتقاد بالقدرة على التغيير."}, {"q": "ما البعد المؤسسي في الكتاب؟", "a": "أن للمؤسسات عادات وروتينات تحدد سلوكها في الأزمات، وأن تغييرها يبدأ من عادة محورية وقيادة تصنع سوابق."}, {"q": "ما البعد المجتمعي في الكتاب؟", "a": "أن الحركات الاجتماعية تنمو عبر روابط قوية بين المعارف وضغط اجتماعي من الروابط الضعيفة، ثم عادات جديدة تجعل المشاركة تلقائية."}, {"q": "ما الفرق بين دوهيغ وكلير؟", "a": "دوهيغ الأساس البحثي والسردي الذي يشرح لماذا تعمل العادة، وكلير الدليل التنفيذي الذي يشرح كيف تبنيها خطوة بخطوة."}, {"q": "كيف يفسّر الكتاب استمرار العادات السيئة رغم الوعي بها؟", "a": "لأن الوعي لا يلغي الحلقة العصبية؛ فبلا استبدال روتين يحقق نفس المكافأة تعود العادة عند ظهور الإشارة."}, {"q": "لماذا يفشل الاعتماد على قوة الإرادة وحدها؟", "a": "لأنها متذبذبة وتستنزفها الضغوط؛ بينما تعمل العادة تلقائيًا بلا استهلاك لموارد القرار."}, {"q": "ما دور التوثيق في تغيير العادة؟", "a": "أن تسجيل الإشارة والشعور والمكافأة يكشف النمط الحقيقي الذي يختلف غالبًا عمّا نفترضه."}, {"q": "كيف تُبنى عادة جديدة من الصفر وفق النموذج؟", "a": "باختيار إشارة واضحة ومكافأة فورية مرضية، ثم التكرار حتى يتكوّن التوقّع الذي يجعل السلوك تلقائيًا."}, {"q": "ما مثال على عادة محورية شخصية؟", "a": "التمرين المنتظم أو ترتيب السرير صباحًا؛ إذ يرتبطان بتحسّن غير مقصود في الأكل والإنفاق والانضباط."}, {"q": "ما علاقة الكتاب بميدوز؟", "a": "أن العادة حلقة تغذية راجعة معزّزة داخل نظام، وتغييرها تدخل عند مستوى البنية لا عند مستوى الأرقام."}, {"q": "ما علاقة الكتاب بنيوبورت؟", "a": "أن الطقوس الثابتة تحوّل الدخول في التركيز إلى روتين تلقائي بدل قرار يومي مكلف."}, {"q": "ما أول تمرين عملي؟", "a": "اختر عادة سيئة واحدة وسجّل لأسبوع الإشارة والحالة العاطفية والمكافأة، ثم صمّم روتينًا بديلًا يحقق نفس المكافأة."}, {"q": "في «قوة العادة»: ما الخطأ الشائع في تطبيق الكتاب؟", "a": "محاول لاتساق: الناس تلتزم بما توصلت إليه بنفسها أضعاف التزامها بما يُملى عليها."}, {"q": "ما وجه الشبه بين الظل عند جرين والخجل عند براون؟", "a": "كلاهما يتناول المكبوت: ما ننكره فينا يخرج مشوّهًا؛ والعلاج في الاعتراف والدمج لا الإنكار."}, {"q": "كيف تكمّل ديوك ما بدأه كانمان؟", "a": "كانمان يشخّص الانحيازات، وديوك تحوّلها إلى انضباط يومي: افصل القرار عن النتيجة، وعبّر بالاحتمالات، واختبر ثقتك بسؤال الرهان."}, {"q": "ما العلاقة بين رأس المال المهني عند نيوبورت والقوى السبع عند هلمر؟", "a": "رأس المال المهني هو المنفعة، والقوة هي المنفعة مع حاجز؛ فالمهارة النادرة تصير قوة حين يصعب تقليدها في وقت قصير."}, {"q": "كيف يتقاطع أتيا مع بيركنز في التخطيط طويل المدى؟", "a": "بيركنز يقول إن للتجارب تاريخ صلاحية تحدده الصحة، وأتيا يقدّم المنهج الذي يمدّ هذا التاريخ عبر تدريب القوة والقدرة الهوائية."}, {"q": "ما الرابط بين البيئة عند كلير وقانون الجهد الأقل وبين نقاط الرفع عند ميدوز؟", "a": "تصميم البيئة تدخّل عند مستوى البنية وهو أعلى رفعًا من مستوى الأرقام؛ ولذلك يتفوق على قرارات الإرادة اليومية."}, {"q": "لماذا يحتاج تطبيق روزنبرج إلى حدود براون؟", "a": "لأن التواصل اللاعنفي يفترض حسن نية نسبيًا؛ ومع الشخصيات المتلاعبة يتحوّل التفهّم بلا حدود إلى استغلال واستياء."}, {"q": "كيف يجيب فوس وفيشر عن نفس اللحظة التفاوضية بطريقتين؟", "a": "فوس يبدأ من الأمان والفهم العاطفي لخفض المقاومة، وفيشر ينتقل بعدها إلى المصالح والمعايير الموضوعية لصياغة صفقة تصمد."}, {"q": "ما القاسم بين إعادة التقييم المعرفي عند جولمان وفك الاندماج عند ديفيد؟", "a": "كلاهما يتدخل عند مستوى التفسير لا الشعور: تغيير الرواية يغيّر شدة الانفعال وما يليه من فعل."}, {"q": "كيف تُقرأ العقلية عند دويك كشرط مسبق لبقية القائمة؟", "a": "لأن كل كتاب يفترض إمكان تغيّرك؛ فبدون الاعتقاد بقابلية التطوير تصير الخطط ترفًا فكريًا لا التزامًا."}, {"q": "ما العلاقة بين قانون جودهارت ونسبة التنفيذ 85% عند موران؟", "a": "نسبة التنفيذ مؤشر نافع ما دام وسيلة؛ فإن صار هدفًا حرفيًا صمّم الناس تكتيكات سهلة لرفع الرقم بلا أثر حقيقي."}, {"q": "كيف يفسّر مانجر ما يصفه تشالديني من ندرة ومنافسة؟", "a": "بتأثير لولابالوزا: اجتماع الندرة والدليل الاجتماعي ورد الفعل المفرط للحرمان في اتجاه واحد ينتج سلوكًا متطرفًا غير خطي."}, {"q": "ما وجه التكامل بين GTD والعمل العميق؟", "a": "GTD يفرّغ العقل من الالتزامات فتقل بقايا الانتباه، ونيوبورت يستثمر الذهن المتفرّغ في كتل تركيز محمية."}, {"q": "كيف يتقاطع فرانكل مع كوفي؟", "a": "في مساحة الاختيار بين المثير والاستجابة؛ كوفي يبني عليها عادة المبادرة، وفرانكل يجعلها آخر الحريات الإنسانية (مع ملاحظة أن نص «المساحة بين المثير والاستجابة» نسبه كوفي لفرانكل ولا يوجد في كتاباته؛ الثابت عن فرانكل «آخر الحريات».)"}, {"q": "لماذا يُعدّ الازدراء عند جوتمان أخطر من النقد عند سكوت؟", "a": "لأن النقد يستهدف سلوكًا قابلًا للتصحيح، بينما الازدراء يعلن دونية الطرف الآخر فيهدم أساس الاحترام الذي تقوم عليه أي تغذية راجعة."}, {"q": "ما العلاقة بين الأدلة الصامتة عند طالب وتقويم نافال؟", "a": "أن نصائح الناجحين تعاني انحياز الناجي؛ فتُقرأ كأدوات تفكير لا كوصفات مضمونة، مع سؤال: كم شخصًا فعل الشيء نفسه وفشل؟"}, {"q": "كيف تجمع بين خطط الأوديسا عند بيرنيت وسيناريوهات شوارتز؟", "a": "الأوديسا تولّد مساراتك الممكنة، والسيناريوهات تولّد العوالم الممكنة؛ وتقاطعهما يعطي القرار المتين الذي ينفع في أغلب المسارات والعوالم."}, {"q": "ما الرابط بين الالتزام الموثوق عند ديكسيت وتقنيات الالتزام عند كلير؟", "a": "كلاهما يقوم على تقييد خياراتك المستقبلية عمدًا؛ ديكسيت لإقناع خصم، وكلير لإقناع نفسك المستقبلية."}, {"q": "كيف يفسّر دوهيغ فشل خطط كثيرة رغم وضوحها؟", "a": "لأن الوعي لا يلغي حلقة الإشارة والمكافأة؛ فبلا روتين بديل يحقق نفس المكافأة تعود العادة عند أول إشارة."}, {"q": "ما العلاقة بين الرافعة بلا إذن عند نافال والعلامة عند هلمر؟", "a": "المحتوى رافعة توزيع، ومع الوقت يتحوّل إلى علامة أي حاجز يصعب تقليده لأن السمعة تحتاج سنوات لبنائها."}, {"q": "كيف يتقاطع بورتر مع تشخيص روميلت في تحليل مسار مهني؟", "a": "بورتر يشخّص جاذبية الملعب بالقوى الخمس، وروميلت يبني على هذا التشخيص سياسة موجّهة وأفعالًا متماسكة."}, {"q": "لماذا يوصي كل من تيتلوك وكانمان وديوك بالسجل المكتوب؟", "a": "لأن الذاكرة تعيد كتابة التاريخ بعد اتضاح النتيجة؛ والسجل المسبق هو الوسيلة الوحيدة لتقييم العملية بصدق."}, {"q": "كيف تجمع بين قاعدة 90% عند مكيون وقانون المال عند نيوبورت؟", "a": "مكيون يعطيك معيار الرفض، ونيوبورت يعطيك الدليل: هل يدفع الناس مقابل هذا الاتجاه؟ فتصير الفرصة مقبولة إن تجاوزت المعيار وأثبتت قيمتها."}, {"q": "ما العلاقة بين محاولات الاتصال عند جوتمان والانتباه الكامل عند جولمان؟", "a": "الاستجابة لمحاولات الاتصال هي التطبيق اليومي للانتباه الكامل؛ وتراكم تجاهلها هو ما يقتل العلاقة لا الخلاف الكبير."}, {"q": "كيف يخدم مبدأ فيا نيجاتيفا عند طالب منهج مكيون؟", "a": "كلاهما يجعل الحذف أقوى من الإضافة: طالب لتقليل الهشاشة، ومكيون لزيادة التركيز — والنتيجة واحدة."}, {"q": "ما وجه الشبه بين الثعلب عند تيتلوك ورجل بمطرقة عند مانجر؟", "a": "كلاهما تحذير من النموذج الواحد: القنفذ يفسّر كل شيء بفكرة، وصاحب المطرقة يرى كل شيء مسمارًا؛ والحل شبكة نماذج."}, {"q": "كيف يتكامل الانعكاس عند مانجر مع التشريح المسبق عند كانمان؟", "a": "الانعكاس يسأل كيف أضمن الفشل عمومًا، والتشريح المسبق يطبّقه على مشروع محدد بتاريخ، فيتحول المبدأ إلى إجراء."}, {"q": "لماذا تحتاج نواة روميلت إلى لماذا فرانكل؟", "a": "لأن الاستراتيجية بلا معنى تنهار عند أول صدمة؛ والتشخيص السليم لا يكفي إن لم يكن الاتجاه مرتبطًا بقيمة تستحق التضحية."}, {"q": "ما العلاقة بين المعرفة الخاصة عند نافال والمورد المحتكر عند هلمر؟", "a": "المعرفة الخاصة هي الصيغة الفردية للمورد المحتكر: وصول لا يملكه غيرك لأنه اكتُسب بمسار لا يمكن اختصاره بدورة."}, {"q": "كيف يفسّر ميدوز فشل خطة تبدو صحيحة بعد شهر من التنفيذ؟", "a": "بالتأخير في النظام: المخزونات تتحرك ببطء، فيُحكم على النظام قبل ظهور أثره ويُستبدل بنظام أسوأ."}, {"q": "ما القاسم بين الهوية عند كلير والهوية عند ستون؟", "a": "كلاهما يرى الهوية محركًا للسلوك؛ كلير يبنيها بأفعال صغيرة، وستون يحميها بجعلها معقدة تحتمل النقد."}, {"q": "كيف تُستخدم القوى الخمس والقوى السبع معًا في قرار مهني واحد؟", "a": "بورتر يجيب: هل الملعب مربح؟ وهلمر يجيب: هل أستطيع بناء حاجز فيه؟ ولا يكفي أحدهما بلا الآخر."}, {"q": "ما العلاقة بين التعاطف المدمّر عند سكوت والتجنّب عند ستون؟", "a": "كلاهما شكل من أشكال المساهمة بالسكوت: تأجيل المحادثة الصعبة يراكم المشكلة ويجعل معالجتها لاحقًا أقسى."}, {"q": "كيف يخدم النوم عند ووكر منهج كانمان في القرار؟", "a": "لأن الحرمان يضعف الكبح ويرفع الاستجابة للمثيرات، فينشط النظام الأول ويضعف النظام الثاني الذي يفترض أن يصححه."}, {"q": "ما الرابط بين اللافتات المبكرة عند شوارتز ونسبة التنفيذ عند موران؟", "a": "كلاهما نظام إنذار: الأولى تكشف تغيّر العالم، والثانية تكشف تعثّر التنفيذ — وبلا إنذار تصل المعلومة متأخرة."}, {"q": "كيف يتقاطع ثيل مع بيرنيت رغم تعارضهما الظاهر؟", "a": "ثيل يطالب برؤية محددة وبيرنيت بتجريب رخيص؛ والتوليف أن تجرّب حتى تتضح القناعة المخالفة للإجماع ثم تلتزم بها بعمق."}, {"q": "ما العلاقة بين الحساب المصرفي العاطفي عند كوفي وBRAVING عند براون؟", "a": "كلاهما يحوّل الثقة من شعور غامض إلى رصيد يتغذى بسلوكيات محددة قابلة للملاحظة والمساءلة."}, {"q": "كيف يفسّر جرانت لماذا يبدو الآخذون أنجح في السنوات الأولى؟", "a": "لأن العائد الفوري يظهر بسرعة بينما تتراكم كلفة السمعة ببطء؛ فالأفق الزمني هو ما يقلب الترتيب."}, {"q": "ما الرابط بين الاختيارية عند طالب والرهانات الصغيرة عند نيوبورت؟", "a": "كلاهما جمع خيارات بتكلفة منخفضة قبل الالتزام؛ وطالب يبرره بعدم القدرة على التنبؤ، ونيوبورت باكتشاف الرسالة عند الحافة."}, {"q": "كيف يخدم إطار سكوت تطبيق مبدأ دويك في فريق؟", "a": "لأن التغذية الراجعة المحددة على الاستراتيجية لا على الشخص هي ما يجعل النقد معلومة لا تهديدًا للهوية."}, {"q": "ما وجه الشبه بين مصفوفة كوفي ومنهج نيوبورت في تقسيم العمل؟", "a": "الربع الثاني عند كوفي هو العمل العميق عند نيوبورت: مهم وغير عاجل، ويحتاج حماية بالجدولة لأنه لا يفرض نفسه."}, {"q": "كيف يفسّر تحليل بورتر ما يسميه ثيل بالمنافسة الطاحنة؟", "a": "بأن حواجز الدخول المنخفضة وقوة المشترين وغياب التمايز تمحو الهوامش، فتصير المنافسة بلا فائض للاستثمار."}, {"q": "ما العلاقة بين الشِّي عند صن تزو وركوب الموجة عند روميلت؟", "a": "كلاهما يقول إن النصر يأتي من الوضعية لا من بذل جهد أكبر داخل وضع خاطئ؛ فالتموضع يسبق الاجتهاد."}, {"q": "كيف تُستخدم مصفوفة ديوك مع سجل تيتلوك في مراجعة سنوية؟", "a": "صنّف قراراتك في المصفوفة الرباعية ثم قارن توقعاتك المسجّلة بالنتائج؛ فتفصل الحظ عن المهارة وتحسّن العملية لا النتيجة."}, {"q": "ما الرابط بين مأساة المشاعات عند  بالنواة: ما التحدي الحقيقي؟ إن كان بناء قوة يصعب تقليدها فاسأل أي المسارين يبني حاجزًا أسرع. ثم قاعدة 90%: هل هذه فرصة تتجاوز معيارك الأهم؟ ثم عدم التماثل: ما أقصى خسارة إن رفضت وإن قبلت؟ وأخيرًا سجل الطاقة: أي المسارين أعطاك انخراطًا حقيقيًا في آخر ثلاثة أشهر؟", "tools": [14, 33, 21, 27]}, {"t": "موظف ممتاز بدأ يتأخر", "s": "موظف كان من الأفضل لديك بدأ يتأخر في التسليم منذ ستة أسابيع، وأنت تؤجل الحديث معه خوفًا من إحراجه.", "q": "ما التصرف؟", "a": "تأجيلك تعاطف مدمّر لا لطف. ابدأ بالحقائق لا بالاستنتاج، وافصل النية عن الأثر، واستخدم التباين: أنا لا أشكك في كفاءتك ولا التزامك، وأنا قلق على المواعيد لأنها تؤثر على الفريق. ثم اسأل عن روايته وأنصت قبل الحل، واختم بقرار محدد: من يفعل ماذا ومتى.", "tools": [38, 7, 6, 4]}, {"t": "مشروع جانبي أم تفرّغ كامل", "s": "لديك مشروع جانبي واعد ووظيفة مستقرة، وتفكر في الاستقالة للتفرغ.", "q": "كيف توازن المخاطرة؟", "a": "طبّق الدمبل: أبقِ الأمان واستثمر جزءًا محدودًا في الرهان الجريء. ولا تستقل قبل قانون المال: هل يدفع الناس فعلًا مقابل ما تقدّمه؟ وقبل ذلك نفّذ ثلاثة نماذج أولية رخيصة. واسأل: ما أقصى خسارة؟ إن كانت تهدد بقاءك فالجواب لا مهما كان العائد.", "tools": [21, 32, 27, 45]}, {"t": "شريك ينسحب عند الخلاف", "s": "كلما نشأ خلاف، ينسحب شريكك ويصمت لأيام، فتزداد أنت إلحاحًا في المتابعة.", "q": "كيف تكسر الحلقة؟", "a": "هذه حلقة القلق والتجنّب: إلحاحك يفعّل خوفه من الابتلاع، وانسحابه يفعّل خوفك من الهجر. اتفقا مسبقًا على استراحة معلنة عشرين دقيقة مع موعد عودة محدد، وعبّر عن احتياجك مباشرة بلا لوم، واستبدل النقد بشكوى لطيفة تصف موقفًا محددًا.", "tools": [11, 40, 4, 1]}, {"t": "سوق يتغيّر بسبب الأتمتة", "s": "أدوات جديدة بدأت تؤدي جزءًا كبيرًا من عملك المهني، وعملاؤك يسألون عن الأسعار.", "q": "ما الخطة؟", "a": "حلّل بالقوى الخمس: البدائل ترتفع وقوة المشترين تزداد. ثم اسأل عن حاجزك: ما الذي يصعب تقليده؟ ابنِ سيناريوهين متعامدين وحدد القرار المتين — غالبًا إتقان الأدوات نفسها ورفع طبقة عملك نحو الحكم والعلاقات وبناء علامة عامة موثقة.", "tools": [17, 16, 28, 32]}, {"t": "خطة سنوية انهارت في فبراير", "s": "كتبت أهدافًا سنوية طموحة في يناير وتوقفت عن متابعتها بعد ستة أسابيع.", "q": "ما الخلل؟", "a": "الخلل في الأفق والقياس لا في العزيمة. حوّل السنة إلى دورة اثني عشر أسبوعًا بهدفين فقط وتكتيكات أسبوعية، وقِس نسبة التنفيذ لا النتيجة، واحجز كتلة استراتيجية أسبوعية، واربط كل هدف بعادة صغيرة مكدّسة على عادة قائمة.", "tools": [30, 29, 33, 14]}, {"t": "اجتماع يتحول إلى مواجهة", "s": "في اجتماع مهم، بدأ زميل يرفع صوته ويتهم فريقك بالتقصير أمام الإدارة.", "q": "كيف تتصرف؟", "a": "لاحظ فقدان الأمان أولًا وأوقف الموضوع. استخدم صوتًا منخفضًا هادئًا وسمِّ شعوره: يبدو أن الموضوع سبّب لك إحباطًا حقيقيًا. ثم سؤال معاير: ما الذي تراه ضروريًا لحل هذا؟ وأجّل الجوهر لاجتماع أصغر بعد استعادة الأمان.", "tools": [6, 5, 1, 7]}, {"t": "عرض عمل بديل بمرتب أعلى", "s": "وصلك عرض عمل بمرتب أعلى 30% من شركة أقل استقرارًا.", "q": "كيف تقيّمه؟", "a": "حدد بديلك الحالي بدقة، ثم قيّم العرض على معايير موضوعية لا على الفارق وحده: هل يبني قوة؟ هل يتيح ممارسة متعمدة؟ ما جودة الفريق؟ استخدم اختبار عشرة عشرة عشرة، واسأل: ما احتمال بقاء الشركة ثلاث سنوات؟ ثم صغ القرار كرهان باحتمال وعائد وخسارة.", "tools": [39, 32, 45, 20]}, {"t": "ركود مهني رغم سنوات الخبرة", "s": "لديك عشر سنوات خبرة لكن دخلك ومسؤولياتك لم تتغير كثيرًا منذ أربع سنوات.", "q": "ما التشخيص؟", "a": "غالبًا عشر سنوات خبرة أو سنة مكررة عشر مرات. المؤشر: هل تعمل أسبوعيًا على شيء يصعب عليك؟ حدد المهارة الفاصلة في مجالك بسؤال ثلاثة من الأفضل، واطلب نقدًا حادًا على عمل واحد، وابنِ حاجزًا: معرفة خاصة أو علامة عامة أو منهج متراكم.", "tools": [32, 16, 24, 49]}, {"t": "إنفاق مؤجَّل إلى التقاعد", "s": "تدّخر بقوة وتؤجل كل رحلة أو تجربة إلى ما بعد الاستقرار المالي.", "q": "هل هذا رشيد؟", "a": "جزئيًا. ارسم دلاء الوقت واكتب التجارب التي لها تاريخ صلاحية جسدي، واحسب نقطة التوقف عن المراكمة، وفكّر في العطاء في وقت أثره لا بعد الوفاة. مع الإبقاء على احتياطي طوارئ وتأمين، فالكتاب عن الوعي بالمقايضة لا عن إلغاء الحكمة المالية.", "tools": [35, 50, 34, 37]}, {"t": "فريق يخفي الأخطاء", "s": "تكتشف أن فريقك يخفي المشكلات حتى تتفاقم، ولا أحد يبلّغ مبكرًا.", "q": "كيف تعالج؟", "a": "هذه مشكلة أمان لا انضباط. ابدأ بطلب النقد لنفسك علنًا وكافئ الصدق بتغيير ملموس، وشخّص الثقة بـ BRAVING، وافصل الخطأ في محاولة مدروسة عن تكرار خطأ معروف، وكن أول من يقول الحقيقة عن الأخبار السيئة.", "tools": [38, 52, 42, 43]}, {"t": "تشتت مزمن رغم القوائم", "s": "تستخدم تطبيقات مهام وتنجز كثيرًا لكنك تشعر أن شيئًا مهمًا لا يتقدم.", "q": "ما المشكلة؟", "a": "كفاءة عالية بلا فعالية. GTD يمنع النسيان ولا يحدد ما يستحق. اكتب نواة استراتيجية في صفحة، وحدد قيدك الأكبر هذا الربع، واحجز كتلة عميقة أسبوعية مخصصة للعمل الأعلى عائدًا، وطبّق سقف ثلاثة مشاريع.", "tools": [48, 14, 46, 31]}, {"t": "صديق يستنزفك بالطلبات", "s": "صديق أو زميل يطلب منك مساعدات متكررة بلا مقابل ولا يتوفر حين تحتاجه.", "q": "ما التصرف؟", "a": "صنّفه بالسلوك لا بالنية: من يأخذ باستمرار يُقابَل بنمط المطابق لا بالعطاء المفتوح. استخدم رفضًا رشيقًا: أنا غير متاح لهذا، أو اعرض بديلًا محدودًا. وتذكّر أن الحدود شرط لاستمرار الكرم لا نقيضه.", "tools": [9, 33, 10, 3]}, {"t": "قرار نجح رغم سوئه", "s": "اتخذت قرارًا متسرعًا بلا بحث ونجح نجاحًا كبيرًا، وتفكر في تكرار الأسلوب.", "q": "ما الخطر؟", "a": "أنت في أخطر خانة: قرار سيئ بنتيجة جيدة، وهي ترسّخ عادة ستدمّرك لاحقًا. افصل الحظ عن المهارة صراحة، وراجع العملية لا النتيجة، وسجّل القرار في دفتر مع توقعك واحتمالك حتى لا تعيد كتابة التاريخ.", "tools": [45, 19, 20, 42]}, {"t": "محادثة عن أجر أقل من السوق", "s": "اكتشفت أن راتبك أقل من متوسط السوق بنسبة واضحة.", "q": "كيف تتفاوض؟", "a": "حسّن بديلك أولًا بجمع عروض حقيقية، وادخل بمعايير موضوعية لا بمشاعر، واستخدم تدقيقًا مسبقًا للاتهام: أنت غالبًا ستشعر أن التوقيت غير مناسب. اطرح سؤالًا معايرًا: كيف يمكننا الوصول إلى النطاق العادل؟ وتفاوض باسم من يعتمدون عليك لا لنفسك فقط.", "tools": [39, 5, 9, 19]}, {"t": "بداية مشروع بشريك", "s": "ستبدأ مشروعًا مع شريك تعرفه منذ سنة فقط.", "q": "ما الذي يجب حسمه قبل البدء؟", "a": "احسم القرارات الصعبة مسبقًا: نموذج اتخاذ القرار، وحدود المسؤولية، وسيناريو الانفصال، والالتزام الزمني. اجعل الالتزام موثوقًا بعقد مكتوب، وقيّم شريكك بنمطه التاريخي في المواقف الصعبة لا بحماسه اليوم.", "tools": [6, 47, 3, 43]}, {"t": "عادة سيئة تعود بعد كل انقطاع", "s": "تنجح في ترك عادة لأسبوعين ثم تعود إليها عند أول ضغط.", "q": "لماذا؟", "a": "لأنك حذفت الروتين بلا بديل يحقق نفس المكافأة. شخّص الإشارة بفئاتها الخمس وجرّب مكافآت بديلة، ثم صمّم روتينًا بديلًا بصيغة محددة، وغيّر البيئة لرفع الاحتكار، وطبّق قاعدة لا تفوّت مرتين.", "tools": [53, 29, 18, 12]}, {"t": "تخطيط لخمس سنوات وأنت غير واثق", "s": "تريد خطة خمسية لكنك لا تعرف ماذا تريد فعلًا.", "q": "من أين تبدأ؟", "a": "لا تبدأ بالأهداف. اكتب بوصلة العمل والحياة، وسجّل الطاقة والانخراط ثلاثة أسابيع، ثم اكتب ثلاث خطط أوديسا، وحوّلها إلى أربعة سيناريوهات، وابدأ بالقرار المتين. الوضوح مخرج للعملية لا شرط لبدئها.", "tools": [27, 28, 37, 12]}, {"t": "طلب من مديرك يتعارض مع أولوياتك", "s": "يطلب منك مديرك مشروعًا جديدًا وأنت محمّل بثلاثة مشاريع.", "q": "كيف ترد؟", "a": "لا ترفض ولا تقبل مباشرة. استخدم صيغة المقايضة: نعم، فما الذي تفضّل أن أؤجّله من الثلاثة؟ فتنقل قرار الأولوية لصاحب الصلاحية، وتحمي سقف العمل الجاري، وتحافظ على العلاقة والوضوح معًا.", "tools": [33, 34, 38, 6]}, {"t": "خلاف متكرر لا ينتهي", "s": "تتكرر نفس الخصومة مع شريكك كل شهرين منذ سنوات.", "q": "هل يمكن حلها؟", "a": "غالبًا لا؛ فأغلب الخلافات دائمة لأنها فروق شخصية. الهدف الحوار بلا تجميد: ابدأ بلطف، وابحث عن الحلم وراء الموقف، وحافظ على نسبة خمسة إلى واحد، واقبل جزءًا من المسؤولية لكسر الدفاعية.", "tools": [40, 7, 4, 11]}, {"t": "فرصة استثمارية بعائد مرتفع", "s": "عُرضت عليك فرصة بعائد كبير من شخص تثق به، والوقت ضيق للقرار.", "q": "ما التحقق اللازم؟", "a": "ضغط الوقت والثقة الشخصية مبدآن للإقناع لا دليلان على الجدوى. اسأل: ما مصلحته؟ وهل يتحمل الخسارة معي؟ وما أقصى خسارة؟ ولا تدخل ما قد يخرجك من اللعبة. وتذكّر أن الفرصة التي لا تحتمل التأجيل أسبوعًا نادرًا ما تكون جيدة.", "tools": [8, 21, 23, 45]}, {"t": "إحساس بالفراغ رغم النجاح", "s": "حققت أهدافك المهنية لكنك تشعر بخواء وملل مستمر.", "q": "ما التشخيص؟", "a": "فراغ وجودي لا مشكلة إنتاجية. السؤال ليس ما معنى الحياة بل ماذا تطلب مني حياتي الآن. راجع قيمك مقابل ساعاتك الفعلية، وابحث عن مساهمة أكبر من ذاتك، وافحص إ let MD;
if(typeof marked!=='undefined'&&marked.parse){marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});MD=t=>marked.parse(t);}
else MD=fallbackMarkdown;
function inline(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');}
function fallbackMarkdown(src){
  const L=String(src).split('\n');let out=[],i=0;
  const list=(tag,it)=>out.push('<'+tag+'>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</'+tag+'>');
  while(i<L.length){let ln=L[i];
    if(/^```/.test(ln)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i])){b.push(L[i]);i++;}i++;
      out.push('<pre><code>'+b.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>');continue;}
    if(/^\|/.test(ln)&&i+1<L.length&&/^\|[\s:|-]+\|?$/.test(L[i+1])){
      const cl=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const h=cl(ln);i+=2;let rows=[];
      while(i<L.length&&/^\|/.test(L[i])){rows.push(cl(L[i]));i++;}
      out.push('<table><thead><tr>'+h.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue;}
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');i++;continue;}
    if(/^(---|___|\*\*\*)\s*$/.test(ln)){out.push('<hr>');i++;continue;}
    if(/^>\s?/.test(ln)){let b=[];while(i<L.length&&/^>\s?/.test(L[i])){b.push(L[i].replace(/^>\s?/,''));i++;}
      out.push('<blockquote>'+fallbackMarkdown(b.join('\n'))+'</blockquote>');continue;}
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){it.push(L[i].replace(/^\s*[-*]\s+/,''));i++;}list('ul',it);continue;}
    if(/^\s*\d+[.)]\s+/.test(ln)){let it=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){it.push(L[i].replace(/^\s*\d+[.)]\s+/,''));i++;}list('ol',it);continue;}
    if(!ln.trim()){i++;continue;}
    let b=[];
    while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|>|\s*[-*]\s|\s*\d+[.)]\s|\||```|---)/.test(L[i])){b.push(L[i]);i++;}
    if(b.length)out.push('<p>'+inline(b.join(' '))+'</p>');else{out.push('<p>'+inline(ln)+'</p>');i++;}
  }
  return out.join('\n');
}

function srsGrade(k,g){
  const c=srsGet(k);
  if(g===0){c.r=0;c.iv=0;c.e=Math.max(1.3,c.e-.2);}
  else{c.r++;
    if(c.r===1)c.iv=g===1?1:(g===3?4:1);
    else if(c.r===2)c.iv=g===1?3:(g===3?10:6);
    else c.iv=Math.round(c.iv*(g===1?1.2:(g===3?c.e+.15:c.e)));
    c.e=Math.max(1.3,c.e+(g===3?.1:(g===1?-.15:0)));
    c.iv=Math.max(1,Math.min(c.iv,365));}
  c.due=today()+c.iv*DAY;store.srs[k]=c;save();
}
function dueList(){const t=today(),o=[];
  DATA.pages.forEach(p=>{if(!p.num||!DATA.qb[p.num])return;
    DATA.qb[p.num].forEach((q,i)=>{const k=K(p.num,i),c=store.srs[k];if(c&&c.due<=t)o.push({b:p.num,i,q,k});});});
  return o;}
function newList(n){const o=[];
  DATA.pages.forEach(p=>{if(!p.num||!DATA.qb[p.num])return;
    DATA.qb[p.num].forEach((q,i)=>{const k=K(p.num,i);if(!store.srs[k])o.push({b:p.num,i,q,k});});});
  return shuffle(o).slice(0,n||20);}

/* ---------- Arabic keyword scoring ---------- */
const STOP=new Set(('من في على عن إلى الى أن ان أنه إن التي الذي الذين هذا هذه ذلك تلك ما لا لم لن هو هي هم كان يكون تكون مع كل بعض غير عند بين أو او أي كما حيث لأن لان لكن قد ثم بل إذا اذا كي حتى بلا بها به فيه فيها له لها منه منها عليه عليها عليك ذات نحو نفس بشكل أكثر اكثر أقل اقل جدا جدًا أيضا أيضًا مثل عبر خلال بعد قبل حين أما اما إذ اذ لدى ضمن دون سوى هناك هنا الآن الان ربما فقط ثمة كذا كذلك بينما لكي حول عليها لأنه لانه أنت انت أنا انا نحن كي هل ليس ليست وهو وهي وهذا التى ولا ولكن حتي مما عما فيما أى').split(/\s+/));
function norm(s){return String(s).replace(/[\u064B-\u0652\u0670\u0640]/g,'')
  .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/[^\u0621-\u064A\u0660-\u06690-9A-Za-z\s]/g,' ').replace(/\s+/g,' ').trim();}
function keywords(a,limit){
  const seen=new Set(),out=[];
  norm(a).split(' ').forEach(w=>{
    if(w.length<4||STOP.has(w))return;
    if(seen.has(w))return;seen.add(w);out.push(w);});
  return out.sort((x,y)=>y.length-x.length).slice(0,limit||10);
}
function scoreAnswer(user,model){
  const kws=keywords(model,10);
  const u=' '+norm(user)+' ';
  const hits=kws.filter(k=>u.includes(k)||u.includes(k.slice(0,Math.max(4,k.length-1))));
  return {kws,hits,pct:kws.length?Math.round(hits.length/kws.length*100):0};
}

/* ---------- mode: MCQ ---------- */
function buildMCQ(b,qs,i){
  const pool=qs.map((q,j)=>({j,a:q.a})).filter(x=>x.j!==i);
  let dis=shuffle(pool).slice(0,3).map(x=>x.a);
  if(dis.length<3){const other=shuffle(allQ().filter(x=>x.b!==b)).slice(0,3-dis.length).map(x=>x.q.a);dis=dis.concat(other);}
  return shuffle([{t:qs[i].a,ok:true}].concat(dis.map(d=>({t:d,ok:false}))));
}
function renderMCQ(m,p,qs){
  const order=S.order&&S.order.length===qs.length?S.order:(S.order=shuffle([...qs.keys()]));
  const idx=Math.min(S.qi,order.length-1),qn=order[idx],q=qs[qn];
  if(!S.mcq||S.mcq.qn!==qn)S.mcq={qn,opts:buildMCQ(p.num,qs,qn),picked:null};
  const st=S.mcq;
  const c=el('<div class="qcard"><div class="qhead"><span class="qnum">'+ar(idx+1)+' / '+ar(order.length)+
    '</span><span class="qsrc">اختر الإجابة الصحيحة</span></div><p class="q">'+esc(q.q)+'</p></div>');
  const LTR='أبجد';
  st.opts.forEach((o,k)=>{
    const b=el('<button class="opt"><span class="kx">'+LTR[k]+'</span><span>'+esc(o.t)+'</span></button>');
    if(st.picked!==null){
      b.disabled=true;
      if(o.ok)b.classList.add('correct');
      else if(st.picked===k)b.classList.add('wrong');
      else b.classList.add('dim');
    }
    b.onclick=()=>{
      if(st.picked!==null)return;
      st.picked=k;
      const ok=o.ok;noteAnswer(ok);srsGrade(K(p.num,qn),ok?2:0);render();};
    c.appendChild(b);});
  if(st.picked!==null){
    const ok=st.opts[st.picked].ok;
    c.appendChild(el('<div class="verdict '+(ok?'ok':'no')+'">'+
      (ok?'<b>صحيح.</b> ':'<b>غير صحيح.</b> الإجابة الصحيحة معلَّمة بالأخضر. ')+
      'سيُعاد عليك هذا السؤال '+(ok?'بعد فترة أطول':'قريبًا')+' تلقائيًا.</div>'));
  }
  m.appendChild(c);
  const row=el('<div class="btnrow"></div>');
  if(st.picked===null){
    const sk=el('<button class="fb">لا أعرف — اعرض الإجابة</button>');
    sk.onclick=()=>{st.picked=st.opts.findIndex(o=>o.ok);noteAnswer(false);srsGrade(K(p.num,qn),0);render();};
    row.appendChild(sk);
  }else{
    const nx=el('<button class="fb pri">السؤال التالي</button>');
    nx.onclick=()=>{S.qi=(idx+1)%order.length;S.mcq=null;render();scrollTo({top:0});};
    row.appendChild(nx);
  }
  const op=el('<button class="fb">افتح شرح الكتاب</button>');
  op.onclick=()=>{S.tab='read';render();};row.appendChild(op);
  m.appendChild(row);
  m.appendChild(el('<div class="progressline"><i style="width:'+((idx+1)/order.length*100).toFixed(1)+'%"></i></div>'));
}

/* ---------- mode: matching ---------- */
function renderMatch(m,p,qs){
  const N=Math.min(5,qs.length);
  if(!S.match){
    const pick=shuffle([...qs.keys()]).slice(0,N);
    S.match={pick,ansOrder:shuffle(pick.slice()),selQ:null,doneQ:[],tries:0,hits:0};
  }
  const st=S.match;
  m.appendChild(el('<div class="eyebrow">اضغط سؤالًا ثم إجابته. '+ar(st.doneQ.length)+' من '+ar(st.pick.length)+' مطابقة صحيحة.</div>'));
  const cols=el('<div class="matchcols"></div>');
  const cq=el('<div class="mcol"><h4>الأسئلة</h4></div>');
  st.pick.forEach(qn=>{
    const dn=st.doneQ.includes(qn);
    const b=el('<button class="mitem '+(dn?'done':'')+(st.selQ===qn?' sel':'')+'">'+esc(qs[qn].q)+'</button>');
    if(!dn)b.onclick=()=>{st.selQ=st.selQ===qn?null:qn;render();};
    cq.appendChild(b);});
  const ca=el('<div class="mcol"><h4>الإجابات</h4></div>');
  st.ansOrder.forEach(qn=>{
    const dn=st.doneQ.includes(qn);
    const b=el('<button class="mitem '+(dn?'done':'')+'">'+esc(qs[qn].a)+'</button>');
    if(!dn)b.onclick=()=>{
      if(st.selQ===null)return;
      st.tries++;
      if(st.selQ===qn){st.doneQ.push(qn);st.hits++;noteAnswer(true);srsGrade(K(p.num,qn),2);st.selQ=null;render();}
      else{noteAnswer(false);srsGrade(K(p.num,st.selQ),0);
        b.classList.add('shake');setTimeout(()=>{st.selQ=null;render();},320);}
    };
    ca.appendChild(b);});
  cols.append(cq,ca);m.appendChild(cols);
  if(st.doneQ.length===st.pick.length){
    m.appendChild(el('<div class="banner"><b>أكملت المجموعة.</b> عدد المحاولات: '+ar(st.tries)+' لـ'+ar(st.pick.length)+' مطابقة.</div>'));
    const b=el('<button class="fb pri">مجموعة جديدة</button>');
    b.onclick=()=>{S.match=null;render();scrollTo({top:0});};
    m.appendChild(el('<div class="btnrow"></div>')).appendChild(b);
  }
}

/* ---------- SRS runner ---------- */
function runSRS(m,items,title){
  if(!S.rev||S.rev.title!==title)S.rev={title,queue:shuffle(items),done:0,total:items.length,shown:false};
  const r=S.rev;
  if(!r.queue.length){
    m.appendChild(el('<div class="banner"><b>انتهت المراجعة.</b> راجعت '+ar(r.done)+' سؤالًا.</div>'));
    const b=el('<button class="fb pri">أضف دفعة جديدة (٢٠)</button>');
    b.onclick=()=>{const nw=newList(20);
      if(!nw.length){alert('لا توجد أسئلة جديدة متبقية.');return;}
      S.rev={title,queue:nw,done:0,total:nw.length,shown:false};render();};
    const row=el('<div class="btnrow"></div>');row.appendChild(b);m.appendChild(row);return;
  }
  const it=r.queue[0];
  m.appendChild(el('<div class="eyebrow">'+title+' · تبقّى '+ar(r.queue.length)+'</div>'));
  const c=el('<div class="qcard"><div class="qhead"><span class="qnum">'+ar(it.b)+
    '</span><span class="qsrc">'+bookTitle(it.b)+'</span></div><p class="q">'+esc(it.q.q)+
    '</p><p class="a'+(r.shown?'':' hidden')+'">'+esc(it.q.a)+'</p></div>');
  m.appendChild(c);
  const row=el('<div class="btnrow"></div>');
  if(!r.shown){const b=el('<button class="fb pri">اعرض الإجابة</button>');
    b.onclick=()=>{r.shown=true;render();};row.appendChild(b);}
  else{
    [['أعدها اليوم',0,'again'],['صعبة',1,'mid'],['جيدة',2,''],['سهلة',3,'know']].forEach(([l,g,cls])=>{
      const b=el('<button class="fb '+cls+'">'+l+'</button>');
      b.onclick=()=>{srsGrade(it.k,g);noteAnswer(g>=2);r.done++;r.shown=false;
        g===0?r.queue.push(r.queue.shift()):r.queue.shift();render();};
      row.appendChild(b);});
  }
  m.appendChild(row);
  const f=el('<div class="footnote"></div>');
  const ch=el('<button class="chip">افتح '+ar(it.b)+'. '+bookTitle(it.b)+'</button>');
  ch.onclick=()=>go(bookIndex(it.b));f.appendChild(ch);m.appendChild(f);
  m.appendChild(el('<div class="progressline"><i style="width:'+(r.total?(r.done/r.total*100).toFixed(1):0)+'%"></i></div>'));
}
function renderReview(m){

function renderExam(m){
  m.appendChild(el('<div class="eyebrow">اختبار عابر للكتب</div>'));
  m.appendChild(el('<h2 class="title" style="margin-bottom:.9rem">اختبار شامل</h2>'));
  if(!S.exam){
    const row=el('<div class="btnrow"></div>');
    [10,20,30].forEach(n=>{const b=el('<button class="fb">'+ar(n)+' سؤالًا</button>');
      b.onclick=()=>{S.exam={items:shuffle(allQ()).slice(0,n),i:0,ans:[],opts:null};render();};row.appendChild(b);});
    m.appendChild(row);
    m.appendChild(el('<p style="color:var(--muted);font-size:.88rem;margin-top:1rem">اختيار من متعدد بأسئلة عشوائية من كل الكتب، بتصحيح فوري ونتيجة نهائية تكشف أضعف كتبك.</p>'));
    return;
  }
  const ex=S.exam;
  if(ex.i>=ex.items.length){
    const right=ex.ans.filter(a=>a).length,pct=Math.round(right/ex.items.length*100);
    m.appendChild(el('<div class="banner"><b>النتيجة: '+ar(right)+' من '+ar(ex.items.length)+' ('+ar(pct)+'%)</b></div>'));
    const by={};
    ex.items.forEach((it,i)=>{by[it.b]=by[it.b]||{r:0,t:0};by[it.b].t++;if(ex.ans[i])by[it.b].r++;});
    const weak=Object.entries(by).map(([b,v])=>({b:+b,p:v.r/v.t})).filter(x=>x.p<1).sort((a,b)=>a.p-b.p).slice(0,6);
    if(weak.length){
      m.appendChild(el('<div class="eyebrow">أضعف الكتب — اضغط للتدرّب عليها</div>'));
      const ch=el('<div class="chips"></div>');
      weak.forEach(w=>{const c=el('<button class="chip">'+ar(w.b)+'. '+bookTitle(w.b)+' — '+ar(Math.round(w.p*100))+'%</button>');
        c.onclick=()=>{S.mode='mcq';go(bookIndex(w.b),'quiz');};ch.appendChild(c);});
      m.appendChild(ch);}
    const row=el('<div class="btnrow" style="margin-top:1.2rem"></div>');
    const b=el('<button class="fb pri">اختبار جديد</button>');b.onclick=()=>{S.exam=null;render();};
    row.appendChild(b);m.appendChild(row);return;
  }
  const it=ex.items[ex.i];
  const qsOf=DATA.qb[it.b];
  if(!ex.opts)ex.opts=buildMCQ(it.b,qsOf,it.i);
  const c=el('<div class="qcard"><div class="qhead"><span class="qnum">'+ar(ex.i+1)+' / '+ar(ex.items.length)+
    '</span><span class="qsrc">'+ar(it.b)+'. '+bookTitle(it.b)+'</span></div><p class="q">'+esc(it.q.q)+'</p></div>');
  const LTR='أبجد';
  ex.opts.forEach((o,k)=>{
    const b=el('<button class="opt"><span class="kx">'+LTR[k]+'</span><span>'+esc(o.t)+'</span></button>');
    if(ex.picked!==undefined&&ex.picked!==null){b.disabled=true;
      if(o.ok)b.classList.add('correct');else if(ex.picked===k)b.classList.add('wrong');else b.classList.add('dim');}
    b.onclick=()=>{if(ex.picked!==undefined&&ex.picked!==null)return;
      ex.picked=k;const ok=o.ok;ex.ans[ex.i]=ok;noteAnswer(ok);srsGrade(K(it.b,it.i),ok?2:0);render();};
    c.appendChild(b);});
  m.appendChild(c);
  const row=el('<div class="btnrow"></div>');
  if(ex.picked===undefined||ex.picked===null){
    const sk=el('<button class="fb">لا أعرف</button>');
    sk.onclick=()=>{ex.picked=ex.opts.findIndex(o=>o.ok);ex.ans[ex.i]=false;noteAnswer(false);srsGrade(K(it.b,it.i),0);render();};
    row.appendChild(sk);
  }else{
    const nx=el('<button class="fb pri">'+(ex.i+1<ex.items.length?'التالي':'اعرض النتيجة')+'</button>');
    nx.onclick=()=>{ex.i++;ex.picked=null;ex.opts=null;render();scrollTo({top:0});};row.appendChild(nx);
  }
  m.appendChild(row);
  m.appendChild(el('<div class="progressline"><i style="width:'+((ex.i+1)/ex.items.length*100).toFixed(1)+'%"></i></div>'));
}

function renderGraph(m){

  m.appendChild(el('<h2 class="title" style="margin-bottom:.8rem">شبكة العلاقات</h2>'));
  const books=BOOKS(),N=books.length,R=300,cx=360,cy=340,pos={};
  books.forEach((p,i)=>{const a=(i/N)*Math.PI*2-Math.PI/2;pos[p.num]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),a};});
  const parts=[...new Set(books.map(b=>b.part))];
  const cols=['#9E6B10','#276B60','#9B3F30','#43558A','#71559B','#3A7448'];
  let svg='<svg class="graph" viewBox="0 0 720 700" xmlns="http://www.w3.org/2000/svg">';
  DATA.graph.forEach(e=>{const a=pos[e[0]],b=pos[e[1]];if(!a||!b)return;
    svg+='<line class="e'+e[0]+' e'+e[1]+'" x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'"/>';});
  books.forEach(p=>{const q=pos[p.num];const col=cols[parts.indexOf(p.part)%cols.length];
    const deg=DATA.graph.filter(e=>e[0]===p.num||e[1]===p.num).length;
    svg+='<circle data-n="'+p.num+'" cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="'+(3+Math.min(deg,8)*.8).toFixed(1)+'" fill="'+col+'"/>';
    const lx=cx+(R+13)*Math.cos(q.a),ly=cy+(R+13)*Math.sin(q.a);
    svg+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+(Math.cos(q.a)<0?'end':'start')+'">'+ar(p.num)+'</text>';});
  svg+='</svg>';
  const w=el('<div>'+svg+'</div>');m.appendChild(w);
  w.querySelectorAll('circle').forEach(c=>{const n=+c.dataset.n;
    c.style.cursor='pointer';
    const hi=on=>w.querySelectorAll('line').forEach(l=>{
      const isit=l.classList.contains('e'+n);
      l.style.stroke=on?(isit?'var(--brass)':'var(--line)'):'';l.style.strokeWidth=on&&isit?'1.7':'';});
    c.addEventListener('mouseenter',()=>hi(true));c.addEventListener('mouseleave',()=>hi(false));
    c.addEventListener('click',()=>go(bookIndex(n)));});
  m.appendChild(el('<div class="eyebrow" style="margin-top:1.4rem">كل الصلات ('+ar(DATA.graph.length)+')</div>'));
  DATA.graph.forEach(e=>{
    const r=el('<button class="result"><div class="where">'+ar(e[0])+'. '+bookTitle(e[0])+' ⟷ '+ar(e[1])+'. '+bookTitle(e[1])+
      '</div><div class="snippet">'+esc(e[2])+'</div></button>');
    r.onclick=()=>go(bookIndex(e[0]));m.appendChild(r);});
}

function download(name,text,type){
  const b=new Blob([text],{type:(type||'text/plain')+';charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}

    r.onclick=()=>{const a=c.querySelector('.a');a.classList.toggle('hidden');

    c.appendChild(r);
    const ch=el('<div class="chips"></div>');
    (s.tools||[]).forEach(n=>{const b=el('<button class="chip">'+ar(n)+'. '+bookTitle(n)+'</button>');
      b.onclick=()=>go(bookIndex(n));ch.appendChild(b);});
    c.appendChild(ch);m.appendChild(c);});
}
function renderSynth(m){
  m.appendChild(el('<div class="eyebrow">أسئلة تربط بين كتابين أو أكثر</div>'));
  m.appendChild(el('<h2 class="title" style="margin-bottom:.9rem">أسئلة تركيبية</h2>'));
  DATA.synth.forEach((q,i)=>{
    const c=el('<div class="qcard"><div class="qhead"><span class="qnum">'+ar(i+1)+'</span></div>'+
      '<p class="q">'+esc(q.q)+'</p><p class="a hidden">'+esc(q.a)+'</p></div>');
    const r=el('<button class="reveal">اعرض الإجابة</button>');
    r.onclick=()=>{const a=c.querySelector('.a');a.classList.toggle('hidden');
      r.textContent=a.classList.contains('hidden')?'اعرض الإجابة':'إخفاء';};
    c.appendChild(r);m.appendChild(c);});
}
function renderExport(m){
  m.appendChild(el('<div class="eyebrow">تصدير ونسخ احتياطي</div>'));
  m.appendChild(el('<h2 class="title" style="margin-bottom:.9rem">تصدير ونسخ احتياطي</h2>'));
  m.appendChild(el('<p style="color:var(--muted);font-size:.87rem">ملفات TSV جاهزة لـAnki (الفاصل Tab، والحقل الثالث وسوم). واحتفظ بنسخة من تقدّمك خصوصًا إن كان تخزين المتصفح غير متاح.</p>'));
  const mk=(items,name)=>{let o='';items.forEach(x=>{o+=x.q.replace(/[\t\n]/g,' ')+'\t'+x.a.replace(/[\t\n]/g,' ')+'\t'+(x.tag||'')+'\n';});download(name,o);};
  const r1=el('<div class="btnrow"></div>');
  const b1=el('<button class="fb">كل الأسئلة ('+ar(TOTALQ)+')</button>');
  b1.onclick=()=>mk(allQ().map(x=>({q:x.q.q,a:x.q.a,tag:'كتاب'+ar(x.b)})),'anki-all.tsv');
  const b2=el('<button class="fb">الأسئلة التركيبية</button>');
  b2.onclick=()=>mk(DATA.synth.map(x=>({q:x.q,a:x.a,tag:'تركيبية'})),'anki-synth.tsv');
  const b3=el('<button class="fb">بطاقات الأفكار</button>');
  b3.onclick=()=>mk(Object.entries(DATA.cards).map(([n,c])=>({q:'الفكرة الجوهرية: '+bookTitle(+n),a:c.idea+' — '+c.b.join(' / '),tag:'أفكار'})),'anki-ideas.tsv');
  const b4=el('<button class="fb">ملاحظاتي</button>');
  b4.onclick=()=>{let o='# ملاحظاتي\n\n';Object.entries(store.notes).forEach(([n,v])=>{if(v&&v.trim())o+='## '+ar(+n)+'. '+bookTitle(+n)+'\n'+v+'\n\n';});download('ملاحظاتي.md',o);};
  r1.append(b1,b2,b3,b4);m.appendChild(r1);
  m.appendChild(el('<div class="eyebrow" style="margin-top:1.6rem">نسخة احتياطية من التقدّم</div>'));
  const r2=el('<div class="btnrow"></div>');
  const ex=el('<button class="fb pri">تنزيل تقدّمي (JSON)</button>');
  ex.onclick=()=>download('تقدّمي.json',JSON.stringify(store),'application/json');
  const imp=el('<button class="fb">استعادة من ملف</button>');
  const inp=el('<input type="file" accept=".json" class="hidden">');
  imp.onclick=()=>inp.click();
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{store=Object.assign(store,JSON.parse(rd.result));save();alert('تمت الاستعادة.');render();}
      catch(e){alert('الملف غير صالح.');}};rd.readAsText(f);};
  r2.append(ex,imp,inp);m.appendChild(r2);
  m.appendChild(el('<div class="eyebrow" style="margin-top:1.6rem">تصدير كتاب بعينه</div>'));
  const ch=el('<div class="chips"></div>');
  BOOKS().filter(p=>DATA.qb[p.num]).forEach(p=>{
    const c=el('<button class="chip">'+ar(p.num)+'. '+p.title.replace(/^[٠-٩]+\.\s*/,'')+'</button>');
    c.onclick=()=>mk(DATA.qb[p.num].map(q=>({q:q.q,a:q.a,tag:'كتاب'+ar(p.num)})),'anki-'+p.num+'.tsv');
    ch.appendChild(c);});
  m.appendChild(ch);
  const f=el('<div class="footnote"></div>');
  const rs=el('<button class="fb again">إعادة ضبط كل التقدّم</button>');
  rs.onclick=()=>{if(confirm('سيُمسح كل التقدّم والملاحظات والقوالب. متأكد؟')){
    store={srs:{},read:{},notes:{},tools:{},stats:{seen:0,ok:0,streak:0,best:0,day:0,dayCount:0}};save();render();}};
  f.appendChild(rs);m.appendChild(f);
}

/* ---------- search ---------- */
function runSearch(term){
  const t=term.trim();
  if(t.length<2){S.view='home';return render();}
  const m=$('#main');m.innerHTML='';
  const rx=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const out=[];
  DATA.pages.forEach((p,i)=>{
    const body=p.body||'';rx.lastIndex=0;
    if(rx.test(p.title)||rx.test(body)){rx.lastIndex=0;const k=body.search(rx);
      out.push({i,where:p.part+' › '+p.title,snip:k>=0?body.slice(Math.max(0,k-60),k+130).replace(/[#*`>|]/g,' '):'',tab:'read'});}
    if(p.num&&DATA.qb[p.num])DATA.qb[p.num].forEach((q,qi)=>{rx.lastIndex=0;
      if(rx.test(q.q)||rx.test(q.a))out.push({i,where:'سؤال '+ar(qi+1)+' › '+p.title,snip:q.q,tab:'quiz'});});});
  DATA.synth.forEach(q=>{rx.lastIndex=0;if(rx.test(q.q)||rx.test(q.a))out.push({sp:'synth',where:'سؤال تركيبي',snip:q.q});});
  DATA.scenarios.forEach(s=>{rx.lastIndex=0;if(rx.test(s.t)||rx.test(s.s)||rx.test(s.a))out.push({sp:'scen',where:'سيناريو › '+s.t,snip:s.s});});
  m.appendChild(el('<div class="eyebrow">نتائج البحث</div>'));
  m.appendChild(el('<h2 class="title" style="margin-bottom:1rem">'+ar(out.length)+' نتيجة</h2>'));
  if(!out.length)return m.appendChild(el('<div class="empty">لا نتائج. جرّب كلمة أقصر أو مصطلحًا من مسرد الملحق أ.</div>'));
  out.slice(0,200).forEach(r=>{
    const d=el('<button class="result"><div class="where">'+r.where+'</div><div class="snippet">…'+esc(r.snip)+'…</div></button>');
    rx.lastIndex=0;
    const sn=d.querySelector('.snippet');sn.innerHTML=sn.innerHTML.replace(rx,x=>'<mark>'+x+'</mark>');
    d.onclick=()=>{$('#search').value='';openNav(false);if(r.sp){S.view=r.sp;render();}else go(r.i,r.tab);};
    m.appendChild(d);});
}

/* ---------- boot ---------- */
const FONTS=['15px','16px','17.5px','19px'];let fi=1;
render();
$('#search').addEventListener('input',e=>runSearch(e.target.value));
$('#reviewBtn').onclick=()=>{S.view='review';S.rev=null;render();scrollTo({top:0});};
$('#navBtn').onclick=()=>openNav(!$('#side').classList.contains('open'));
$('#sideClose').onclick=()=>openNav(false);
$('#backdrop').onclick=()=>openNav(false);
$('#moreBtn').onclick=e=>{e.stopPropagation();$('#popover').classList.toggle('open');};
document.addEventListener('click',()=>$('#popover').classList.remove('open'));
$('#popover').addEventListener('click',e=>{
  const a=e.target.dataset.act;if(!a)return;
  if(a==='home'){S.view='home';S.exam=null;render();}
  if(a==='exam'){S.view='exam';S.exam=null;render();}
  if(a==='font'){fi=(fi+1)%FONTS.length;document.documentElement.style.setProperty('--fs',FONTS[fi]);}
  if(a==='read'){$('#main').classList.toggle('reading');}
  if(a==='theme'){const d=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',d?'light':'dark');
    e.target.textContent=d?'الوضع الليلي':'الوضع النهاري';}
  if(a==='print')window.print();
  $('#popover').classList.remove('open');
});
addEventListener('keydown',e=>{
  if(/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;
  if(e.key==='/'){e.preventDefault();openNav(true);$('#search').focus();}
});
</script>
