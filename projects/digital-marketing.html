rt": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Stage 3 — Advanced / Expert (Year 1–3+)", "title_ar": "المرحلة ٣ — المتقدّم / الخبير (سنة ١–٣+)", "html": "<p><strong>Goal:<\/strong> Move from executing channels to designing strategy, leading growth, and driving business outcomes.<\/p><div class=\"viz\"><div class=\"viz-cap\">The road from zero to expert<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">Months 0–3<\/span><div class=\"pbar\" style=\"width:42%;background:#2749D6\">Foundations — build, publish, measure<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Months 3–12<\/span><div class=\"pbar\" style=\"width:70%;background:#B35C00\">Practitioner — go deep, real budgets<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Year 1–3+<\/span><div class=\"pbar\" style=\"width:100%;background:#2A3040\">Expert — strategy, economics, teams<\/div><\/div><\/div><\/div>\n<h3>Expert-level capabilities<\/h3>\n<ol>\n<li><strong>Strategy &amp; positioning:<\/strong> market research, competitive analysis, brand positioning, pricing psychology, category design.<\/li>\n<li><strong>Full-funnel growth systems:<\/strong> how channels interact — e.g., TikTok awareness → branded search lift → retargeting → email LTV expansion.<\/li>\n<li><strong>Unit economics fluency:<\/strong> CAC, LTV, payback period, contribution margin, blended vs. channel ROAS, marginal returns on spend.<\/li>\n<li><strong>Experimentation programs:<\/strong> running dozens of structured tests per quarter across creative, offers, pages, and channels.<\/li>\n<li><strong>Advanced measurement:<\/strong> incrementality/geo-lift testing, media mix modeling (MMM), server-side tracking, privacy-era attribution.<\/li>\n<li><strong>Team &amp; agency leadership:<\/strong> briefing creatives, managing specialists, setting KPIs, reporting to executives.<\/li>\n<li><strong>Emerging-edge awareness:<\/strong> AI search optimization, retail media networks, community-led growth, zero-party data strategies.<\/li>\n<\/ol>\n<h3>How experts keep learning<\/h3>\n<ul>\n<li>Newsletters/blogs: Marketing Examples, Demand Curve, Ariyh (research-based), Search Engine Land, Marketing Brew.<\/li>\n<li>Podcasts: Marketing School, Perpetual Traffic, Everyone Hates Marketers, Nudge.<\/li>\n<li>Communities: Superpath (content), Demand Curve, Exit Five (B2B), local marketing meetups.<\/li>\n<li>Practice: teardowns of great campaigns, running personal projects, mentoring juniors (teaching cements mastery).<\/li>\n<\/ul>", "html_ar": "<p><strong>الهدف:<\/strong> الانتقال من تنفيذ القنوات إلى تصميم الاستراتيجية وقيادة النمو وتحقيق نتائج الأعمال.<\/p><div class=\"viz\"><div class=\"viz-cap\">الطريق من الصفر إلى الخبرة<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">شهر ٠–٣<\/span><div class=\"pbar\" style=\"width:42%;background:#2749D6\">الأساسيات — ابنِ وانشر وقِس<\/div><\/div><div class=\"phase\"><span class=\"plabel\">شهر ٣–١٢<\/span><div class=\"pbar\" style=\"width:70%;background:#B35C00\">الممارس — تعمّق في قناة بميزانيات حقيقية<\/div><\/div><div class=\"phase\"><span class=\"plabel\">سنة ١–٣+<\/span><div class=\"pbar\" style=\"width:100%;background:#2A3040\">الخبير — استراتيجية واقتصاديات وفرق<\/div><\/div><\/div><\/div>\n<h3>قدرات الخبير<\/h3>\n<ol>\n<li><strong>الاستراتيجية والتموضع:<\/strong> أبحاث السوق، تحليل المنافسين، تموضع العلامة، سيكولوجيا التسعير، تصميم الفئة.<\/li>\n<li><strong>منظومات نمو كاملة القمع:<\/strong> كيف تتفاعل القنوات — مثلًا وعي تيك توك ← ارتفاع بحث العلامة ← إعادة الاستهداف ← توسيع LTV بالبريد.<\/li>\n<li><strong>إتقان اقتصاديات الوحدة:<\/strong> CAC وLTV وفترة الاسترداد وهامش المساهمة وROAS المدمج مقابل القناة والعائد الحدّي للإنفاق.<\/li>\n<li><strong>برامج التجريب:<\/strong> عشرات الاختبارات المنظّمة كل ربع عبر الإبداع والعروض والصفحات والقنوات.<\/li>\n<li><strong>قياس متقدّم:<\/strong> اختبارات الزيادة الفعلية والجغرافية، نمذجة مزيج الوسائط (MMM)، التتبّع من الخادم، الإسناد في عصر الخصوصية.<\/li>\n<li><strong>قيادة الفرق والوكالات:<\/strong> إحاطة المبدعين، إدارة المتخصصين، تحديد المؤشرات، التقرير للإدارة العليا.<\/li>\n<li><strong>وعي بالحافة الجديدة:<\/strong> تحسين الظهور في بحث الذكاء الاصطناعي، شبكات إعلانات التجزئة، النمو عبر المجتمع، بيانات الطرف الصفري.<\/li>\n<\/ol>\n<h3>كيف يواصل الخبراء التعلّم<\/h3>\n<ul>\n<li>نشرات ومدوّنات: Marketing Examples، Demand Curve، Ariyh، Search Engine Land، Marketing Brew.<\/li>\n<li>بودكاست: Marketing School، Perpetual Traffic، Everyone Hates Marketers.<\/li>\n<li>مجتمعات: Superpath، Demand Curve، Exit Five، ولقاءات التسويق المحلية.<\/li>\n<li>الممارسة: تفكيك الحملات العظيمة، مشاريع شخصية، توجيه المبتدئين (التعليم يرسّخ الإتقان).<\/li>\n<\/ul>"}, {"id": "sec-16", "num": 16, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "The Complete Tool Stack (By Category)", "title_ar": "حزمة الأدوات الكاملة (حسب الفئة)", "html": "<table>\n<thead>\n<tr>\n<th>Category<\/th>\n<th>Free / Starter<\/th>\n<th>Professional<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SEO<\/strong><\/td>\n<td>Google Search Console, Bing Webmaster<\/td>\n<td>Ahrefs, Semrush, Screaming Frog, Surfer<\/td>\n<\/tr>\n<tr>\n<td><strong>PPC<\/strong><\/td>\n<td>Google Keyword Planner, Meta Ads Library<\/td>\n<td>Optmyzr, SpyFu, Unbounce<\/td>\n<\/tr>\n<tr>\n<td><strong>Content<\/strong><\/td>\n<td>Google Docs, Hemingway, Canva<\/td>\n<td>Clearscope, BuzzSumo, Figma, Frase<\/td>\n<\/tr>\n<tr>\n<td><strong>Social<\/strong><\/td>\n<td>Buffer (free tier), Metricool<\/td>\n<td>Sprout Social, Hootsuite, Brandwatch<\/td>\n<\/tr>\n<tr>\n<td><strong>Email<\/strong><\/td>\n<td>MailerLite, Mailchimp free<\/td>\n<td>Klaviyo, ActiveCampaign, Kit<\/td>\n<\/tr>\n<tr>\n<td><strong>Video<\/strong><\/td>\n<td>CapCut, DaVinci Resolve, Descript free<\/td>\n<td>Premiere Pro, Descript Pro, Riverside<\/td>\n<\/tr>\n<tr>\n<td><strong>CRO<\/strong><\/td>\n<td>Microsoft Clarity, GA4<\/td>\n<td>Hotjar, VWO, Optimizely<\/td>\n<\/tr>\n<tr>\n<td><strong>Analytics<\/strong><\/td>\n<td>GA4, Looker Studio, GTM<\/td>\n<td>Mixpanel, Amplitude, Triple Whale (e-com)<\/td>\n<\/tr>\n<tr>\n<td><strong>Automation<\/strong><\/td>\n<td>Zapier free, HubSpot free CRM<\/td>\n<td>Make, n8n, HubSpot Pro, Salesforce<\/td>\n<\/tr>\n<tr>\n<td><strong>AI assistance<\/strong><\/td>\n<td>Claude / ChatGPT free tiers<\/td>\n<td>Claude Pro, Jasper, Midjourney, Runway<\/td>\n<\/tr>\n<tr>\n<td><strong>Project mgmt<\/strong><\/td>\n<td>Notion, Trello<\/td>\n<td>Asana, Monday, Airtable<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Rule of thumb:<\/strong> master the free tier before paying. Tools amplify skill; they don't create it.<\/p>", "html_ar": "<table>\n<thead>\n<tr>\n<th>الفئة<\/th>\n<th>مجاني / مبتدئ<\/th>\n<th>احترافي<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>السيو<\/strong><\/td>\n<td>Google Search Console، Bing Webmaster<\/td>\n<td>Ahrefs، Semrush، Screaming Frog، Surfer<\/td>\n<\/tr>\n<tr>\n<td><strong>الإعلانات<\/strong><\/td>\n<td>Google Keyword Planner، مكتبة إعلانات ميتا<\/td>\n<td>Optmyzr، SpyFu، Unbounce<\/td>\n<\/tr>\n<tr>\n<td><strong>المحتوى<\/strong><\/td>\n<td>Google Docs، Hemingway، Canva<\/td>\n<td>Clearscope، BuzzSumo، Figma، Frase<\/td>\n<\/tr>\n<tr>\n<td><strong>التواصل<\/strong><\/td>\n<td>Buffer (مجاني)، Metricool<\/td>\n<td>Sprout Social، Hootsuite، Brandwatch<\/td>\n<\/tr>\n<tr>\n<td><strong>البريد<\/strong><\/td>\n<td>MailerLite، Mailchimp المجاني<\/td>\n<td>Klaviyo، ActiveCampaign، Kit<\/td>\n<\/tr>\n<tr>\n<td><strong>الفيديو<\/strong><\/td>\n<td>CapCut، DaVinci Resolve، Descript<\/td>\n<td>Premiere Pro، Riverside<\/td>\n<\/tr>\n<tr>\n<td><strong>تحسين التحويل<\/strong><\/td>\n<td>Microsoft Clarity، GA4<\/td>\n<td>Hotjar، VWO، Optimizely<\/td>\n<\/tr>\n<tr>\n<td><strong>التحليلات<\/strong><\/td>\n<td>GA4، Looker Studio، GTM<\/td>\n<td>Mixpanel، Amplitude، Triple Whale<\/td>\n<\/tr>\n<tr>\n<td><strong>الأتمتة<\/strong><\/td>\n<td>Zapier المجاني، HubSpot CRM المجاني<\/td>\n<td>Make، n8n، HubSpot Pro، Salesforce<\/td>\n<\/tr>\n<tr>\n<td><strong>الذكاء الاصطناعي<\/strong><\/td>\n<td>Claude / ChatGPT المجاني<\/td>\n<td>Claude Pro، Jasper، Midjourney، Runway<\/td>\n<\/tr>\n<tr>\n<td><strong>إدارة المشاريع<\/strong><\/td>\n<td>Notion، Trello<\/td>\n<td>Asana، Monday، Airtable<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>قاعدة عامة:<\/strong> أتقن النسخة المجانية قبل الدفع. الأدوات تضاعف المهارة؛ لا تصنعها.<\/p>"}, {"id": "sec-17", "num": 17, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Certifications Worth Getting", "title_ar": "الشهادات التي تستحق الحصول عليها", "html": "<ol>\n<li><strong>Google Ads certifications<\/strong> (Skillshop) — Search, Display, Video, Shopping. Free, industry-recognized.<\/li>\n<li><strong>Google Analytics 4 certification<\/strong> (Skillshop) — near-mandatory for any digital role.<\/li>\n<li><strong>HubSpot Academy<\/strong> — Inbound, Content Marketing, Email Marketing, SEO. Free and well-respected.<\/li>\n<li><strong>Meta Blueprint / Meta Certified Media Buying Professional<\/strong> — the standard for paid social.<\/li>\n<li><strong>Semrush SEO Toolkit / SEO certifications<\/strong> — practical and free.<\/li>\n<li><strong>Digital Marketing Institute (DMI) / CIM diplomas<\/strong> — paid, formal credentials valued in corporate/EMEA markets.<\/li>\n<\/ol>\n<p>Certifications open doors; <strong>portfolios and results get you hired.<\/strong> Pair every certificate with a project.<\/p>", "html_ar": "<ol>\n<li><strong>شهادات إعلانات جوجل<\/strong> (Skillshop) — بحث، عرض، فيديو، تسوّق. مجانية ومعترف بها.<\/li>\n<li><strong>شهادة Google Analytics 4<\/strong> — شبه إلزامية لأي دور رقمي.<\/li>\n<li><strong>أكاديمية HubSpot<\/strong> — التسويق الداخلي، المحتوى، البريد، السيو. مجانية ومحترمة.<\/li>\n<li><strong>Meta Blueprint / شهادة مشتري الوسائط من ميتا<\/strong> — المعيار للإعلانات الاجتماعية المدفوعة.<\/li>\n<li><strong>شهادات Semrush في السيو<\/strong> — عملية ومجانية.<\/li>\n<li><strong>دبلومات DMI / CIM<\/strong> — مدفوعة ورسمية، مقدّرة في الشركات الكبرى.<\/li>\n<\/ol>\n<p>الشهادات تفتح الأبواب؛ <strong>ملف الأعمال والنتائج هما ما يوظّفك.<\/strong> اربط كل شهادة بمشروع.<\/p>"}, {"id": "sec-18", "num": 18, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Career Paths & Specializations", "title_ar": "المسارات المهنية والتخصصات", "html": "<ul>\n<li><strong>SEO Specialist → SEO Manager → Head of Organic Growth<\/strong><\/li>\n<li><strong>PPC/Media Buyer → Performance Marketing Manager → Head of Growth<\/strong><\/li>\n<li><strong>Content Writer → Content Strategist → Content/Brand Director<\/strong><\/li>\n<li><strong>Social Media Manager → Community/Creator Lead → Brand Director<\/strong><\/li>\n<li><strong>Email/CRM Specialist → Lifecycle Marketing Manager → Retention Director<\/strong><\/li>\n<li><strong>Marketing Analyst → Marketing Data Scientist → VP Analytics<\/strong><\/li>\n<li><strong>Generalist → Growth Marketer → CMO / Founder / Consultant / Agency Owner<\/strong><\/li>\n<\/ul>\n<p>Freelancing and agency work are common accelerators: you see many industries, budgets, and problems quickly.<\/p>", "html_ar": "<ul>\n<li><strong>أخصائي سيو ← مدير سيو ← رئيس النمو العضوي<\/strong><\/li>\n<li><strong>مشتري وسائط ← مدير تسويق الأداء ← رئيس النمو<\/strong><\/li>\n<li><strong>كاتب محتوى ← استراتيجي محتوى ← مدير المحتوى/العلامة<\/strong><\/li>\n<li><strong>مدير تواصل اجتماعي ← قائد المجتمع/صنّاع المحتوى ← مدير العلامة<\/strong><\/li>\n<li><strong>أخصائي بريد/CRM ← مدير تسويق دورة الحياة ← مدير الاحتفاظ<\/strong><\/li>\n<li><strong>محلّل تسويق ← عالم بيانات تسويقية ← نائب رئيس التحليلات<\/strong><\/li>\n<li><strong>عام ← مسوّق نمو ← مدير تسويق تنفيذي / مؤسس / مستشار / صاحب وكالة<\/strong><\/li>\n<\/ul>\n<p>العمل الحر والوكالات مسرّعات شائعة: ترى صناعات وميزانيات ومشكلات كثيرة بسرعة.<\/p>"}, {"id": "sec-19", "num": 19, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Top 5 Digital Marketing Books (In Detail)", "title_ar": "أفضل ٥ كتب في التسويق الرقمي (بالتفصيل)", "html": "<h3>📘 1. <em>This Is Marketing<\/em> — Seth Godin (2018)<\/h3>\n<p><strong>Why it's #1:<\/strong> Before tactics, you need the right philosophy — and no one reframes marketing like Godin. This book will save you years of spamming tactics that don't work.<\/p><div class=\"viz\"><div class=\"viz-cap\">The shelf — five books, one operating system<\/div><div class=\"shelf\"><div class=\"bookc\" style=\"background:#2749D6\"><b>This Is Marketing<\/b><i>Seth Godin<\/i><em>Philosophy<\/em><\/div><div class=\"bookc\" style=\"background:#2A3040\"><b>Influence<\/b><i>Robert Cialdini<\/i><em>Psychology<\/em><\/div><div class=\"bookc\" style=\"background:#B35C00\"><b>Contagious<\/b><i>Jonah Berger<\/i><em>Virality<\/em><\/div><div class=\"bookc\" style=\"background:#0E7A4F\"><b>Building a StoryBrand<\/b><i>Donald Miller<\/i><em>Messaging<\/em><\/div><div class=\"bookc\" style=\"background:#6B3FC7\"><b>Digital Marketing Strategy<\/b><i>Simon Kingsnorth<\/i><em>The playbook<\/em><\/div><\/div><\/div>\n<p><strong>Core thesis:<\/strong> Marketing is no longer about interrupting the masses; it's about earning the attention and trust of the <strong>smallest viable audience<\/strong> — the specific people whose problem you solve.<\/p>\n<p><strong>Key ideas:<\/strong>\n- <strong>\"People like us do things like this.\"<\/strong> Marketing works by connecting to identity and belonging, not just features.\n- <strong>The smallest viable market:<\/strong> don't try to serve everyone; serve someone so well they tell others.\n- <strong>Tension and status:<\/strong> effective marketing creates the tension of \"will I change or stay the same?\" and speaks to status roles (affiliation vs. dominance).\n- <strong>Permission marketing:<\/strong> the privilege of delivering anticipated, personal, relevant messages to people who want them (the philosophical foundation of email marketing).\n- <strong>Empathy first:<\/strong> \"What change are you trying to make, and for whom?\"<\/p>\n<p><strong>Best for:<\/strong> Beginners setting their mental model, and experienced marketers who've become too tactical.<\/p>\n<p><strong>One-line takeaway:<\/strong> <em>Find your smallest viable audience, make something they'd miss if it were gone, and earn the right to talk to them.<\/em><\/p>\n<h3>📙 2. <em>Influence: The Psychology of Persuasion<\/em> — Robert B. Cialdini (1984; expanded edition 2021)<\/h3>\n<p><strong>Why it matters:<\/strong> Every landing page, ad, email, and social post runs on psychology. Cialdini's research-backed principles are the operating system underneath all persuasion — the most-cited marketing psychology book ever written.<\/p>\n<p><strong>The seven principles (expanded edition):<\/strong>\n1. <strong>Reciprocity<\/strong> — people repay favors; give value first (lead magnets, free tools, generous content).\n2. <strong>Commitment &amp; Consistency<\/strong> — small yeses lead to big yeses (micro-conversions, quizzes, free trials).\n3. <strong>Social Proof<\/strong> — we follow what similar others do (reviews, testimonials, user counts, case studies).\n4. <strong>Authority<\/strong> — credentials and expertise persuade (press logos, certifications, expert endorsements).\n5. <strong>Liking<\/strong> — we buy from people/brands we like and find similar to us (brand personality, founder stories).\n6. <strong>Scarcity<\/strong> — limited availability increases desire (honest deadlines, limited stock, exclusive access).\n7. <strong>Unity<\/strong> (new) — shared identity is the deepest lever (\"we\" beats \"you\").<\/p>\n<p><strong>How marketers use it:<\/strong> It's a checklist for auditing any funnel — which principles are present, which are missing, and which are being used unethically (Cialdini is explicit about ethical lines).<\/p>\n<p><strong>Best for:<\/strong> Anyone writing copy, designing landing pages, or building offers.<\/p>\n<p><strong>One-line takeaway:<\/strong> <em>Persuasion follows predictable psychological rules — learn them, use them ethically, and recognize when they're used on you.<\/em><\/p>\n<h3>📗 3. <em>Contagious: Why Things Catch On<\/em> — Jonah Berger (2013)<\/h3>\n<p><strong>Why it matters:<\/strong> Organic reach, virality, and word-of-mouth are the cheapest growth engines in digital marketing. Berger, a Wharton professor, spent a decade researching why some content and products spread while others die — and turned it into a usable framework.<\/p>\n<p><strong>The STEPPS framework:<\/strong>\n1. <strong>Social Currency<\/strong> — people share things that make them look good, smart, or in-the-know (insider knowledge, remarkable stats, exclusivity).\n2. <strong>Triggers<\/strong> — top of mind = tip of tongue; link your brand to frequent environmental cues (Kit Kat + coffee breaks).\n3. <strong>Emotion<\/strong> — high-arousal emotions (awe, excitement, amusement, anger) drive sharing; sadness suppresses it. \"When we care, we share.\"\n4. <strong>Public<\/strong> — visible behavior is imitable behavior (design for observability: logos, badges, \"shared publicly\" moments).\n5. <strong>Practical Value<\/strong> — genuinely useful content spreads (\"news you can use\": how-tos, deals, checklists).\n6. <strong>Stories<\/strong> — information travels wrapped in narrative; build a \"Trojan horse\" story your product is integral to.<\/p>\n<p><strong>How marketers use it:<\/strong> As a pre-publish checklist for content, campaigns, and even product design — score your idea against all six STEPPS before launch.<\/p>\n<p><strong>Best for:<\/strong> Content marketers, social media managers, and brand builders.<\/p>\n<p><strong>One-line takeaway:<\/strong> <em>Virality isn't luck — it's engineered through social currency, triggers, emotion, visibility, usefulness, and story.<\/em><\/p>\n<h3>📕 4. <em>Building a StoryBrand<\/em> — Donald Miller (2017; revised 2.0 edition 2024)<\/h3>\n<p><strong>Why it matters:<\/strong> The #1 conversion killer in digital marketing is confusing messaging. Miller's SB7 framework is the most practical system ever written for clarifying what you say on websites, ads, and emails — used by hundreds of thousands of businesses.<\/p>\n<p><strong>Core thesis:<\/strong> <strong>The customer is the hero; your brand is the guide.<\/strong> Most companies fail because they position themselves as the hero of the story instead of the Yoda to the customer's Luke Skywalker.<\/p>\n<p><strong>The SB7 Framework — every great message has:<\/strong>\n1. <strong>A Character<\/strong> (the customer) who wants something...\n2. <strong>Has a Problem<\/strong> — external (the visible problem), internal (how it makes them feel), philosophical (why it's just plain wrong)...\n3. <strong>Meets a Guide<\/strong> (your brand) who shows <strong>empathy<\/strong> and <strong>authority<\/strong>...\n4. <strong>Who gives them a Plan<\/strong> — simple 3-step process that removes confusion...\n5. <strong>And Calls them to Action<\/strong> — direct CTAs (\"Buy Now\") and transitional CTAs (lead magnets)...\n6. <strong>That helps them avoid Failure<\/strong> — the stakes of not acting...\n7. <strong>And ends in Success<\/strong> — paint the transformation vividly.<\/p>\n<p><strong>Immediately actionable outputs:<\/strong> a one-liner, a wireframed homepage, a lead generator, and a nurture email sequence — the book is essentially a website-and-funnel copywriting manual in disguise.<\/p>\n<p><strong>Best for:<\/strong> Founders, copywriters, and anyone responsible for a website or landing page.<\/p>\n<p><strong>One-line takeaway:<\/strong> <em>If you confuse, you lose — make the customer the hero, be their guide, and give them a clear plan and call to action.<\/em><\/p>\n<h3>📒 5. <em>Digital Marketing Strategy: An Integrated Approach to Online Marketing<\/em> — Simon Kingsnorth (4th edition, 2024)<\/h3>\n<p><strong>Why it matters:<\/strong> The four books above give you philosophy, psychology, virality, and messaging. This one gives you the <strong>complete professional playbook<\/strong> — the closest thing to a textbook that working digital marketers actually use. It's the \"put it all together\" book.<\/p>\n<p><strong>What it covers (end to end):<\/strong>\n- Building an integrated digital strategy aligned to business goals.\n- Channel-by-channel depth: SEO, paid search, display and programmatic, social media (organic + paid), email/CRM, content strategy, affiliate marketing.\n- Customer experience, personalization, and lifecycle marketing.\n- Analytics, KPIs, dashboards, attribution, and reporting to leadership.\n- Budgeting, resourcing, agency vs. in-house decisions, and team structure.\n- Modern additions in recent editions: AI in marketing, privacy and cookieless measurement, and emerging channels.<\/p>\n<p><strong>Why it earns the #5 slot over flashier titles:<\/strong> Most marketing bestsellers teach one idea. Kingsnorth teaches the <strong>job<\/strong> — how a real strategy document gets built, defended, budgeted, executed, and measured. It's the bridge from \"I know channels\" to \"I can run marketing for a company.\"<\/p>\n<p><strong>Best for:<\/strong> Intermediate marketers moving into strategy or management roles, and anyone who wants one comprehensive reference on the shelf.<\/p>\n<p><strong>One-line takeaway:<\/strong> <em>Channels are tactics; this book teaches you to weave them into one measurable, budgeted, business-aligned strategy.<\/em><\/p>\n<h3>📚 Honorable mentions (your \"next five\")<\/h3>\n<ul>\n<li><em>Made to Stick<\/em> — Chip &amp; Dan Heath (why some ideas survive and others die)<\/li>\n<li><em>Hooked<\/em> — Nir Eyal (habit-forming product and engagement loops)<\/li>\n<li><em>Breakthrough Advertising<\/em> — Eugene Schwartz (advanced copywriting; market awareness stages)<\/li>\n<li><em>Traction<\/em> — Gabriel Weinberg &amp; Justin Mares (the 19 growth channels + Bullseye framework)<\/li>\n<li><em>They Ask, You Answer<\/em> — Marcus Sheridan (content marketing that actually sells)<\/li>\n<\/ul>", "html_ar": "<h3>📘 ١. <em>This Is Marketing (هذا هو التسويق)<\/em> — سيث جودين (٢٠١٨)<\/h3>\n<p><strong>لماذا هو الأول:<\/strong> قبل الأساليب تحتاج الفلسفة الصحيحة. هذا الكتاب يوفّر عليك سنوات من أساليب الإزعاج التي لا تنجح.<\/p><div class=\"viz\"><div class=\"viz-cap\">الرف — خمسة كتب، نظام تشغيل واحد<\/div><div class=\"shelf\"><div class=\"bookc\" style=\"background:#2749D6\"><b>هذا هو التسويق<\/b><i>سيث جودين<\/i><em>الفلسفة<\/em><\/div><div class=\"bookc\" style=\"background:#2A3040\"><b>التأثير<\/b><i>روبرت تشالديني<\/i><em>السيكولوجيا<\/em><\/div><div class=\"bookc\" style=\"background:#B35C00\"><b>المُعدي<\/b><i>جونا بيرجر<\/i><em>الانتشار<\/em><\/div><div class=\"bookc\" style=\"background:#0E7A4F\"><b>بناء StoryBrand<\/b><i>دونالد ميلر<\/i><em>الرسالة<\/em><\/div><div class=\"bookc\" style=\"background:#6B3FC7\"><b>استراتيجية التسويق الرقمي<\/b><i>سايمون كينجزنورث<\/i><em>الدليل العملي<\/em><\/div><\/div><\/div>\n<p><strong>الأطروحة:<\/strong> التسويق لم يعد مقاطعة الجماهير؛ بل كسب انتباه وثقة <strong>أصغر جمهور قابل للحياة<\/strong> — الأشخاص الذين تحلّ مشكلتهم تحديدًا.<\/p>\n<p><strong>أفكار رئيسية:<\/strong> «أناس مثلنا يفعلون أشياء كهذه» (الهوية والانتماء)، أصغر سوق قابل للحياة، التوتر والمكانة، التسويق بالإذن، والتعاطف أولًا: «ما التغيير الذي تريد صنعه، ولمن؟»<\/p>\n<p><strong>الخلاصة:<\/strong> <em>اعثر على أصغر جمهور قابل للحياة، واصنع شيئًا سيفتقدونه لو اختفى، واكسب حق التحدّث إليهم.<\/em><\/p>\n<h3>📙 ٢. <em>Influence (التأثير)<\/em> — روبرت تشالديني (١٩٨٤؛ طبعة موسّعة ٢٠٢١)<\/h3>\n<p><strong>لماذا يهم:<\/strong> كل صفحة هبوط وإعلان وبريد تعمل بالسيكولوجيا. مبادئ تشالديني المبنية على الأبحاث هي نظام التشغيل تحت كل إقناع.<\/p>\n<p><strong>المبادئ السبعة:<\/strong>\n1. <strong>المعاملة بالمثل<\/strong> — قدّم قيمة أولًا.\n2. <strong>الالتزام والاتساق<\/strong> — «نعم» الصغيرة تقود للكبيرة.\n3. <strong>الدليل الاجتماعي<\/strong> — نتبع من يشبهوننا (مراجعات، شهادات).\n4. <strong>السلطة<\/strong> — الخبرة تُقنع.\n5. <strong>الإعجاب<\/strong> — نشتري ممن نحبّهم.\n6. <strong>الندرة<\/strong> — المحدود مرغوب (بصدق).\n7. <strong>الوحدة<\/strong> (جديد) — الهوية المشتركة أعمق رافعة.<\/p>\n<p><strong>الخلاصة:<\/strong> <em>للإقناع قواعد نفسية متوقّعة — تعلّمها واستخدمها بأخلاق.<\/em><\/p>\n<h3>📗 ٣. <em>Contagious (المُعدي)<\/em> — جونا بيرجر (٢٠١٣)<\/h3>\n<p><strong>لماذا يهم:<\/strong> الانتشار العضوي وكلام الناس أرخص محرّكات النمو. بيرجر حوّل عقدًا من الأبحاث إلى إطار عملي.<\/p>\n<p><strong>إطار STEPPS:<\/strong> العملة الاجتماعية (يشارك الناس ما يجمّل صورتهم)، المُحفّزات (ما يخطر بالبال يُقال)، العاطفة (المشاعر عالية الإثارة تدفع المشاركة)، العلنية (السلوك المرئي يُقلَّد)، القيمة العملية (المفيد ينتشر)، القصص (المعلومة تسافر داخل حكاية).<\/p>\n<p><strong>الخلاصة:<\/strong> <em>الانتشار ليس حظًا — بل يُهندَس.<\/em><\/p>\n<h3>📕 ٤. <em>Building a StoryBrand (بناء StoryBrand)<\/em> — دونالد ميلر (٢٠١٧؛ نسخة 2.0 في ٢٠٢٤)<\/h3>\n<p><strong>لماذا يهم:<\/strong> قاتل التحويل الأول هو الرسالة المربكة. إطار SB7 أعمق نظام عملي لتوضيح ما تقوله.<\/p>\n<p><strong>الأطروحة:<\/strong> <strong>العميل هو البطل؛ وعلامتك هي المرشد.<\/strong><\/p>\n<p><strong>إطار SB7:<\/strong> شخصية تريد شيئًا ← لديها مشكلة (خارجية، داخلية، فلسفية) ← تقابل مرشدًا (تعاطف + سلطة) ← يعطيها خطة ← ويدعوها لإجراء ← يجنّبها الفشل ← وينتهي بالنجاح.<\/p>\n<p><strong>الخلاصة:<\/strong> <em>إن أربكت خسرت — اجعل العميل البطل، وكن مرشده.<\/em><\/p>\n<h3>📒 ٥. <em>Digital Marketing Strategy (استراتيجية التسويق الرقمي)<\/em> — سايمون كينجزنورث (الطبعة الرابعة)<\/h3>\n<p><strong>لماذا يهم:<\/strong> الكتب الأربعة السابقة تعطيك الفلسفة والسيكولوجيا والانتشار والرسالة. هذا يعطيك <strong>الدليل المهني الكامل<\/strong> — أقرب شيء لكتاب منهجي يستخدمه المسوّقون فعلًا.<\/p>\n<p><strong>ما يغطيه:<\/strong> بناء استراتيجية متكاملة مرتبطة بأهداف العمل، عمق في كل قناة، تجربة العميل والتخصيص، التحليلات والمؤشرات والإسناد، الميزانية والفرق، والإضافات الحديثة: الذكاء الاصطناعي والقياس في عصر الخصوصية.<\/p>\n<p><strong>الخلاصة:<\/strong> <em>القنوات أساليب؛ هذا الكتاب يعلّمك نسجها في استراتيجية واحدة مقيسة ومموّلة.<\/em><\/p>\n<h3>📚 إضافات مستحقة<\/h3>\n<p><em>Made to Stick<\/em> (الأخوان هيث)، <em>Hooked<\/em> (نير إيال)، <em>Breakthrough Advertising<\/em> (يوجين شوارتز)، <em>Traction<\/em> (واينبرج وماريس)، <em>They Ask, You Answer<\/em> (ماركوس شيريدان).<\/p>"}, {"id": "sec-20", "num": 20, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "90-Day Action Plan", "title_ar": "خطة العمل لـ٩٠ يومًا", "html": "<h3>Days 1–30: Foundations<\/h3>\n<ul>\n<li>[ ] Complete Google Digital Garage fundamentals course<\/li>\n<li>[ ] Build a simple website/blog on a topic you care about<\/li>\n<li>[ ] Install GA4 + Search Console + Microsoft Clarity<\/li>\n<li>[ ] Read <em>This Is Marketing<\/em> and <em>Building a StoryBrand<\/em><\/li>\n<li>[ ] Write your positioning: audience, problem, transformation, one-liner<\/li>\n<\/ul>\n<h3>Days 31–60: Production<\/h3>\n<ul>\n<li>[ ] Publish 8–12 pieces of content (SEO-informed)<\/li>\n<li>[ ] Set up an email list + lead magnet + 3-email welcome sequence<\/li>\n<li>[ ] Post natively on ONE social platform 3–5x/week<\/li>\n<li>[ ] Complete Google Ads Search + GA4 certifications<\/li>\n<li>[ ] Read <em>Influence<\/em> and <em>Contagious<\/em><\/li>\n<\/ul>\n<h3>Days 61–90: Optimization<\/h3>\n<ul>\n<li>[ ] Run a $100–200 paid test campaign (search or social)<\/li>\n<li>[ ] Run your first A/B test (headline or CTA)<\/li>\n<li>[ ] Build a Looker Studio dashboard of your key metrics<\/li>\n<li>[ ] Write your first case study with real numbers<\/li>\n<li>[ ] Read <em>Digital Marketing Strategy<\/em> and draft a 1-page strategy doc<\/li>\n<\/ul>\n<p>Repeat the loop, deeper, every quarter. <strong>Expertise = reps + feedback + reflection.<\/strong><\/p><div class=\"viz\"><div class=\"viz-cap\">90 days, three sprints<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">Days 1–30<\/span><div class=\"pbar\" style=\"width:55%;background:#2749D6\">Foundations: site · tracking · positioning<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Days 31–60<\/span><div class=\"pbar\" style=\"width:78%;background:#B35C00\">Production: content · email list · certifications<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Days 61–90<\/span><div class=\"pbar\" style=\"width:100%;background:#0E7A4F\">Optimization: paid test · A/B · dashboard · case study<\/div><\/div><\/div><\/div>", "html_ar": "<h3>الأيام ١–٣٠: الأساسيات<\/h3>\n<ul>\n<li>[ ] أكمل دورة أساسيات Google Digital Garage<\/li>\n<li>[ ] ابنِ موقعًا/مدوّنة بسيطة في موضوع تحبه<\/li>\n<li>[ ] ثبّت GA4 + Search Console + Microsoft Clarity<\/li>\n<li>[ ] اقرأ <em>This Is Marketing<\/em> و<em>Building a StoryBrand<\/em><\/li>\n<li>[ ] اكتب تموضعك: الجمهور، المشكلة، التحوّل، الجملة الواحدة<\/li>\n<\/ul>\n<h3>الأيام ٣١–٦٠: الإنتاج<\/h3>\n<ul>\n<li>[ ] انشر ٨–١٢ قطعة محتوى مبنية على السيو<\/li>\n<li>[ ] أنشئ قائمة بريد + مغناطيس جذب + سلسلة ترحيب من ٣ رسائل<\/li>\n<li>[ ] انشر أصليًا على منصّة واحدة ٣–٥ مرات أسبوعيًا<\/li>\n<li>[ ] أكمل شهادتي Google Ads Search وGA4<\/li>\n<li>[ ] اقرأ <em>Influence<\/em> و<em>Contagious<\/em><\/li>\n<\/ul>\n<h3>الأيام ٦١–٩٠: التحسين<\/h3>\n<ul>\n<li>[ ] شغّل حملة اختبار مدفوعة بـ١٠٠–٢٠٠ دولار<\/li>\n<li>[ ] نفّذ أول اختبار A/B (عنوان أو دعوة)<\/li>\n<li>[ ] ابنِ لوحة Looker Studio لمؤشراتك الرئيسية<\/li>\n<li>[ ] اكتب أول دراسة حالة بأرقام حقيقية<\/li>\n<li>[ ] اقرأ <em>Digital Marketing Strategy<\/em> واكتب وثيقة استراتيجية من صفحة<\/li>\n<\/ul>\n<p>كرّر الحلقة بعمق أكبر كل ربع. <strong>الخبرة = تكرار + تغذية راجعة + تأمّل.<\/strong><\/p><div class=\"viz\"><div class=\"viz-cap\">٩٠ يومًا، ثلاث دفعات<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">يوم ١–٣٠<\/span><div class=\"pbar\" style=\"width:55%;background:#2749D6\">أساسيات: موقع · تتبّع · تموضع<\/div><\/div><div class=\"phase\"><span class=\"plabel\">يوم ٣١–٦٠<\/span><div class=\"pbar\" style=\"width:78%;background:#B35C00\">إنتاج: محتوى · قائمة بريد · شهادات<\/div><\/div><div class=\"phase\"><span class=\"plabel\">يوم ٦١–٩٠<\/span><div class=\"pbar\" style=\"width:100%;background:#0E7A4F\">تحسين: اختبار مدفوع · A/B · لوحة · دراسة حالة<\/div><\/div><\/div><\/div>"}, {"id": "sec-21", "num": 21, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Glossary of Essential Terms", "title_ar": "مسرد المصطلحات الأساسية", "html": "<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CAC<\/strong><\/td>\n<td>Customer Acquisition Cost — total spend ÷ new customers<\/td>\n<\/tr>\n<tr>\n<td><strong>LTV<\/strong><\/td>\n<td>Lifetime Value — total revenue expected from a customer<\/td>\n<\/tr>\n<tr>\n<td><strong>ROAS<\/strong><\/td>\n<td>Return on Ad Spend — revenue ÷ ad cost<\/td>\n<\/tr>\n<tr>\n<td><strong>CTR<\/strong><\/td>\n<td>Click-Through Rate — clicks ÷ impressions<\/td>\n<\/tr>\n<tr>\n<td><strong>CPC / CPM / CPA<\/strong><\/td>\n<td>Cost per click / per 1,000 impressions / per acquisition<\/td>\n<\/tr>\n<tr>\n<td><strong>CRO<\/strong><\/td>\n<td>Conversion Rate Optimization<\/td>\n<\/tr>\n<tr>\n<td><strong>SERP<\/strong><\/td>\n<td>Search Engine Results Page<\/td>\n<\/tr>\n<tr>\n<td><strong>E-E-A-T<\/strong><\/td>\n<td>Experience, Expertise, Authoritativeness, Trust (Google quality framework)<\/td>\n<\/tr>\n<tr>\n<td><strong>UTM<\/strong><\/td>\n<td>URL tags that identify traffic source/medium/campaign<\/td>\n<\/tr>\n<tr>\n<td><strong>Funnel<\/strong><\/td>\n<td>The path from stranger → visitor → lead → customer → advocate<\/td>\n<\/tr>\n<tr>\n<td><strong>Lead magnet<\/strong><\/td>\n<td>Free value exchanged for an email address<\/td>\n<\/tr>\n<tr>\n<td><strong>Retargeting<\/strong><\/td>\n<td>Ads shown to people who already engaged with you<\/td>\n<\/tr>\n<tr>\n<td><strong>A/B test<\/strong><\/td>\n<td>Comparing two versions to see which performs better<\/td>\n<\/tr>\n<tr>\n<td><strong>UGC<\/strong><\/td>\n<td>User-Generated Content<\/td>\n<\/tr>\n<tr>\n<td><strong>KPI<\/strong><\/td>\n<td>Key Performance Indicator<\/td>\n<\/tr>\n<tr>\n<td><strong>Attribution<\/strong><\/td>\n<td>Assigning credit for a conversion across touchpoints<\/td>\n<\/tr>\n<tr>\n<td><strong>GEO / AEO<\/strong><\/td>\n<td>Optimizing content to be cited by AI answer engines<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>The channels will keep changing. The fundamentals — know your audience, make something they want, say it clearly, measure honestly, and improve relentlessly — never do.<\/em><\/p>", "html_ar": "<table>\n<thead>\n<tr>\n<th>المصطلح<\/th>\n<th>المعنى<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CAC<\/strong><\/td>\n<td>تكلفة اكتساب العميل — الإنفاق ÷ العملاء الجدد<\/td>\n<\/tr>\n<tr>\n<td><strong>LTV<\/strong><\/td>\n<td>قيمة عمر العميل — الإيراد المتوقّع منه<\/td>\n<\/tr>\n<tr>\n<td><strong>ROAS<\/strong><\/td>\n<td>العائد على الإنفاق الإعلاني — الإيراد ÷ تكلفة الإعلان<\/td>\n<\/tr>\n<tr>\n<td><strong>CTR<\/strong><\/td>\n<td>معدّل النقر — النقرات ÷ مرات الظهور<\/td>\n<\/tr>\n<tr>\n<td><strong>CPC / CPM / CPA<\/strong><\/td>\n<td>تكلفة النقرة / الألف ظهور / الاكتساب<\/td>\n<\/tr>\n<tr>\n<td><strong>CRO<\/strong><\/td>\n<td>تحسين معدّل التحويل<\/td>\n<\/tr>\n<tr>\n<td><strong>SERP<\/strong><\/td>\n<td>صفحة نتائج محرك البحث<\/td>\n<\/tr>\n<tr>\n<td><strong>E-E-A-T<\/strong><\/td>\n<td>الخبرة، الاختصاص، السلطة، الثقة (إطار جودة جوجل)<\/td>\n<\/tr>\n<tr>\n<td><strong>UTM<\/strong><\/td>\n<td>وسوم روابط تحدّد المصدر والوسيط والحملة<\/td>\n<\/tr>\n<tr>\n<td><strong>القمع<\/strong><\/td>\n<td>المسار من غريب ← زائر ← عميل محتمل ← عميل ← مروّج<\/td>\n<\/tr>\n<tr>\n<td><strong>مغناطيس الجذب<\/strong><\/td>\n<td>قيمة مجانية مقابل البريد الإلكتروني<\/td>\n<\/tr>\n<tr>\n<td><strong>إعادة الاستهداف<\/strong><\/td>\n<td>إعلانات لمن تفاعل معك سابقًا<\/td>\n<\/tr>\n<tr>\n<td><strong>اختبار A/B<\/strong><\/td>\n<td>مقارنة نسختين لمعرفة الأفضل أداءً<\/td>\n<\/tr>\n<tr>\n<td><strong>UGC<\/strong><\/td>\n<td>المحتوى الذي ينشئه المستخدمون<\/td>\n<\/tr>\n<tr>\n<td><strong>KPI<\/strong><\/td>\n<td>مؤشر الأداء الرئيسي<\/td>\n<\/tr>\n<tr>\n<td><strong>الإسناد<\/strong><\/td>\n<td>توزيع فضل التحويل على نقاط التفاعل<\/td>\n<\/tr>\n<tr>\n<td><strong>GEO / AEO<\/strong><\/td>\n<td>تحسين المحتوى ليستشهد به الذكاء الاصطناعي<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "sec-22", "num": 22, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "Mobile & App Marketing (ASO)", "title_ar": "تسويق الجوال والتطبيقات (ASO)", "html": "<p><strong>What it is:<\/strong> Marketing within the mobile ecosystem — app stores, push notifications, SMS, and in-app experiences. Over 60% of web traffic is mobile.<\/p>\n<ul>\n<li><strong>App Store Optimization (ASO):<\/strong> the \"SEO of app stores\" — optimize app title, subtitle, keywords, screenshots, preview videos, ratings, and reviews for the Apple App Store and Google Play.<\/li>\n<li><strong>Paid user acquisition:<\/strong> Apple Search Ads, Google App Campaigns, Meta app-install campaigns.<\/li>\n<li><strong>Retention channels:<\/strong> push notifications, in-app messaging, SMS (with consent — TCPA/GDPR compliant).<\/li>\n<li><strong>Key metrics:<\/strong> installs, cost per install (CPI), day-1/7/30 retention, DAU/MAU, in-app conversion, churn.<\/li>\n<li><strong>Tools:<\/strong> AppsFlyer / Adjust (mobile attribution), App Radar / Sensor Tower (ASO), OneSignal / Braze (push &amp; lifecycle).<\/li>\n<\/ul>", "html_ar": "<p><strong>ما هو:<\/strong> التسويق داخل منظومة الجوال — متاجر التطبيقات والإشعارات والرسائل النصية والتجارب داخل التطبيق.<\/p>\n<ul>\n<li><strong>تحسين متجر التطبيقات (ASO):<\/strong> «سيو» المتاجر — حسّن العنوان والعنوان الفرعي والكلمات ولقطات الشاشة والفيديو والتقييمات في App Store وGoogle Play.<\/li>\n<li><strong>الاكتساب المدفوع:<\/strong> Apple Search Ads، حملات تطبيقات جوجل، حملات تثبيت ميتا.<\/li>\n<li><strong>قنوات الاحتفاظ:<\/strong> الإشعارات، الرسائل داخل التطبيق، الرسائل النصية (بموافقة).<\/li>\n<li><strong>المقاييس:<\/strong> التثبيتات، تكلفة التثبيت (CPI)، الاحتفاظ في اليوم ١/٧/٣٠، المستخدمون النشطون يوميًا/شهريًا، التحويل داخل التطبيق.<\/li>\n<li><strong>الأدوات:<\/strong> AppsFlyer / Adjust (الإسناد)، App Radar / Sensor Tower (ASO)، OneSignal / Braze.<\/li>\n<\/ul>"}, {"id": "sec-23", "num": 23, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "Local SEO & Google Business Profile", "title_ar": "السيو المحلي وملف نشاطك على جوجل", "html": "<p><strong>What it is:<\/strong> Winning \"near me\" and map-pack searches for businesses with physical locations or service areas.<\/p>\n<ul>\n<li><strong>Google Business Profile (GBP):<\/strong> claim, complete, and actively manage — categories, photos, posts, products, and services.<\/li>\n<li><strong>Reviews:<\/strong> volume, recency, rating, and owner responses are major local ranking factors. Build a review-request system.<\/li>\n<li><strong>NAP consistency:<\/strong> identical Name, Address, Phone across directories (citations) — Yelp, Bing Places, Apple Maps, industry sites.<\/li>\n<li><strong>Local content &amp; links:<\/strong> location pages, local sponsorships, chamber-of-commerce and news links.<\/li>\n<li><strong>Tools:<\/strong> BrightLocal, Whitespark, GBP Insights.<\/li>\n<\/ul>", "html_ar": "<p><strong>ما هو:<\/strong> الفوز بعمليات بحث «بالقرب مني» وحزمة الخريطة للأنشطة ذات المواقع الفعلية أو مناطق الخدمة.<\/p>\n<ul>\n<li><strong>ملف النشاط التجاري على جوجل:<\/strong> طالب به وأكمله وأدره بنشاط — الفئات والصور والمنشورات والمنتجات والخدمات.<\/li>\n<li><strong>المراجعات:<\/strong> العدد والحداثة والتقييم وردود المالك عوامل ترتيب محلية كبرى. ابنِ نظامًا لطلب المراجعات.<\/li>\n<li><strong>اتساق NAP:<\/strong> الاسم والعنوان والهاتف متطابقة في كل الأدلّة.<\/li>\n<li><strong>محتوى وروابط محلية:<\/strong> صفحات المواقع، رعايات محلية، روابط الغرف التجارية والأخبار.<\/li>\n<li><strong>الأدوات:<\/strong> BrightLocal، Whitespark، إحصاءات الملف التجاري.<\/li>\n<\/ul>"}, {"id": "sec-24", "num": 24, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "Digital PR & Online Reputation Management (ORM)", "title_ar": "العلاقات العامة الرقمية وإدارة السمعة", "html": "<div class=\"viz\"><div class=\"viz-cap\">The crisis playbook<\/div><div class=\"flow\"><div class=\"fnode\"><b>Monitor<\/b><span>alerts · listening<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Assess<\/b><span>scale &amp; severity<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>Respond<\/b><span>one voice · fast · human<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Correct<\/b><span>facts + fix<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>Rebuild<\/b><span>positive content<\/span><\/div><\/div><\/div><ul>\n<li><strong>Digital PR:<\/strong> earning coverage and backlinks from journalists and publications — data studies, expert commentary (journalist request platforms), newsjacking, creative campaigns. The highest-leverage link-building method.<\/li>\n<li><strong>ORM:<\/strong> monitoring and shaping what appears when people search your brand — review sites, Glassdoor, Reddit threads, autocomplete. Respond fast, own your branded SERP with controlled assets.<\/li>\n<li><strong>Crisis playbook:<\/strong> monitor → assess → respond with one voice → correct the record → rebuild with positive content.<\/li>\n<li><strong>Tools:<\/strong> Google Alerts, Brand24, Mention, Muck Rack, Prowly.<\/li>\n<\/ul>", "html_ar": "<div class=\"viz\"><div class=\"viz-cap\">دليل إدارة الأزمات<\/div><div class=\"flow\"><div class=\"fnode\"><b>رصد<\/b><span>تنبيهات · استماع<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>تقييم<\/b><span>الحجم والخطورة<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>ردّ<\/b><span>صوت واحد · سريع · متعاطف<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>تصحيح<\/b><span>حقائق + إصلاح<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>إعادة بناء<\/b><span>محتوى إيجابي<\/span><\/div><\/div><\/div><ul>\n<li><strong>العلاقات العامة الرقمية:<\/strong> كسب تغطية وروابط من الصحفيين والمنشورات — دراسات بيانات، تعليقات الخبراء، ركوب الأخبار، حملات إبداعية. أعلى أساليب بناء الروابط أثرًا.<\/li>\n<li><strong>إدارة السمعة:<\/strong> مراقبة وتشكيل ما يظهر عند البحث عن علامتك — مواقع المراجعات، Reddit، الإكمال التلقائي. استجب بسرعة وامتلك صفحة نتائج علامتك بأصول تتحكّم بها.<\/li>\n<li><strong>دليل الأزمات:<\/strong> رصد ← تقييم ← ردّ بصوت واحد ← تصحيح ← إعادة بناء بمحتوى إيجابي.<\/li>\n<li><strong>الأدوات:<\/strong> Google Alerts، Brand24، Mention، Muck Rack.<\/li>\n<\/ul>"}, {"id": "sec-25", "num": 25, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "E-commerce & Marketplace Marketing", "title_ar": "تسويق التجارة الإلكترونية والأسواق", "html": "<ul>\n<li><strong>The e-commerce funnel:<\/strong> product discovery → product page → cart → checkout → post-purchase flows (each stage has its own optimization playbook).<\/li>\n<li><strong>Product feed marketing:<\/strong> Google Shopping / Performance Max and Meta catalog ads live or die on feed quality (titles, images, attributes, price competitiveness).<\/li>\n<li><strong>Amazon &amp; marketplace marketing:<\/strong> Amazon SEO (title, bullets, backend keywords, A+ content), Amazon PPC (Sponsored Products/Brands/Display), review velocity, Buy Box factors.<\/li>\n<li><strong>Key metrics:<\/strong> conversion rate by device, AOV, cart abandonment (~70% average — recovery emails are mandatory), repeat purchase rate, contribution margin per order.<\/li>\n<li><strong>Tools:<\/strong> Shopify + Klaviyo stack, Triple Whale / Northbeam (attribution), Helium 10 / Jungle Scout (Amazon).<\/li>\n<\/ul>", "html_ar": "<ul>\n<li><strong>قمع التجارة الإلكترونية:<\/strong> اكتشاف المنتج ← صفحة المنتج ← السلة ← الدفع ← ما بعد الشراء — لكل مرحلة دليل تحسين.<\/li>\n<li><strong>تسويق خلاصة المنتجات:<\/strong> إعلانات التسوّق وPerformance Max وكتالوج ميتا تعيش وتموت بجودة الخلاصة (العناوين، الصور، السمات، تنافسية السعر).<\/li>\n<li><strong>أمازون والأسواق:<\/strong> سيو أمازون (العنوان، النقاط، الكلمات الخلفية، محتوى A+)، إعلانات أمازون، سرعة المراجعات، عوامل صندوق الشراء.<\/li>\n<li><strong>المقاييس:<\/strong> معدّل التحويل حسب الجهاز، متوسط الطلب، ترك السلة (~٧٠٪ — رسائل الاسترداد إلزامية)، معدّل الشراء المتكرّر، هامش المساهمة لكل طلب.<\/li>\n<li><strong>الأدوات:<\/strong> Shopify + Klaviyo، Triple Whale / Northbeam، Helium 10 / Jungle Scout.<\/li>\n<\/ul>"}, {"id": "sec-26", "num": 26, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "B2B vs. B2C: How the Playbook Changes", "title_ar": "B2B مقابل B2C: كيف تتغيّر اللعبة", "html": "<table>\n<thead>\n<tr>\n<th>Dimension<\/th>\n<th>B2C<\/th>\n<th>B2B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Decision maker<\/td>\n<td>Individual<\/td>\n<td>Buying committee (5–10 people)<\/td>\n<\/tr>\n<tr>\n<td>Sales cycle<\/td>\n<td>Minutes–days<\/td>\n<td>Weeks–months<\/td>\n<\/tr>\n<tr>\n<td>Key channels<\/td>\n<td>Social, search, influencers, email<\/td>\n<td>LinkedIn, SEO, webinars, email, events, ABM<\/td>\n<\/tr>\n<tr>\n<td>Content<\/td>\n<td>Entertaining, emotional<\/td>\n<td>Educational, ROI-focused (still human!)<\/td>\n<\/tr>\n<tr>\n<td>Core metric<\/td>\n<td>ROAS, AOV<\/td>\n<td>Pipeline, SQLs, deal velocity, CAC payback<\/td>\n<\/tr>\n<tr>\n<td>Special plays<\/td>\n<td>UGC, flash sales<\/td>\n<td>Account-Based Marketing (ABM), sales enablement, intent data (Bombora, 6sense)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "html_ar": "<table>\n<thead>\n<tr>\n<th>البُعد<\/th>\n<th>B2C<\/th>\n<th>B2B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>صانع القرار<\/td>\n<td>فرد<\/td>\n<td>لجنة شراء (٥–١٠ أشخاص)<\/td>\n<\/tr>\n<tr>\n<td>دورة البيع<\/td>\n<td>دقائق–أيام<\/td>\n<td>أسابيع–أشهر<\/td>\n<\/tr>\n<tr>\n<td>القنوات الرئيسية<\/td>\n<td>تواصل، بحث، مؤثرون، بريد<\/td>\n<td>لينكدإن، سيو، ندوات، بريد، فعاليات، ABM<\/td>\n<\/tr>\n<tr>\n<td>المحتوى<\/td>\n<td>ترفيهي، عاطفي<\/td>\n<td>تعليمي، مركّز على العائد (وإنساني!)<\/td>\n<\/tr>\n<tr>\n<td>المقياس الأساسي<\/td>\n<td>ROAS، متوسط الطلب<\/td>\n<td>خط الأنابيب، SQLs، سرعة الصفقات، استرداد CAC<\/td>\n<\/tr>\n<tr>\n<td>ألعاب خاصة<\/td>\n<td>محتوى المستخدمين، عروض سريعة<\/td>\n<td>التسويق القائم على الحسابات، تمكين المبيعات، بيانات النيّة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "sec-27", "num": 27, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "Privacy, Legal & Ethics (Non-Negotiable Knowledge)", "title_ar": "الخصوصية والقانون والأخلاقيات", "html": "<ul>\n<li><strong>Regulations:<\/strong> GDPR (EU), CCPA/CPRA (California), CAN-SPAM (US email), CASL (Canada), TCPA (US SMS/calls), ePrivacy/cookie consent rules.<\/li>\n<li><strong>Consent management:<\/strong> cookie banners/CMPs, double opt-in norms, easy unsubscribe, data subject requests.<\/li>\n<li><strong>The signal-loss era:<\/strong> Safari, Firefox, and Brave block third-party cookies by default, Apple's ATT limits app tracking, and consent rules shrink what can be observed. Chrome reversed its planned cookie phase-out in 2025, but the direction is unchanged → first-party &amp; zero-party data strategies, server-side tagging, consent mode, modeled conversions.<\/li>\n<li><strong>Advertising disclosure:<\/strong> FTC rules for influencer/affiliate content (#ad, clear disclosure).<\/li>\n<li><strong>Ethical lines:<\/strong> no dark patterns, fake scarcity, fake reviews, or manipulative targeting of vulnerable groups. Trust compounds; tricks decay.<\/li>\n<\/ul>", "html_ar": "<ul>\n<li><strong>اللوائح:<\/strong> GDPR (أوروبا)، CCPA/CPRA (كاليفورنيا)، CAN-SPAM (بريد أمريكا)، CASL (كندا)، TCPA (الرسائل النصية الأمريكية)، قواعد موافقة الكوكيز.<\/li>\n<li><strong>إدارة الموافقة:<\/strong> لافتات الكوكيز ومنصّات CMP، الاشتراك المزدوج، إلغاء اشتراك سهل، طلبات أصحاب البيانات.<\/li>\n<li><strong>عصر فقدان الإشارات:<\/strong> سفاري وفايرفوكس وبريف تحجب كوكيز الطرف الثالث افتراضيًا، وATT من أبل تحدّ تتبّع التطبيقات، وقواعد الموافقة تقلّص ما يمكن رصده. تراجع كروم عن خطة إلغاء الكوكيز في ٢٠٢٥، لكن الاتجاه لم يتغيّر ← استراتيجيات بيانات الطرف الأول والصفري، التتبّع من الخادم، وضع الموافقة، التحويلات المنمذجة.<\/li>\n<li><strong>الإفصاح الإعلاني:<\/strong> قواعد الإفصاح عن محتوى المؤثرين والعمولة (#إعلان).<\/li>\n<li><strong>الخطوط الأخلاقية:<\/strong> لا أنماط مظلمة، لا ندرة زائفة، لا مراجعات مزيّفة، لا استهداف متلاعب للفئات الضعيفة. الثقة تتراكم؛ الحيل تتآكل.<\/li>\n<\/ul>"}, {"id": "sec-28", "num": 28, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "Budgeting & Media Planning", "title_ar": "الميزانية والتخطيط الإعلامي", "html": "<div class=\"viz\"><div class=\"viz-cap\">The 70 / 20 / 10 budget rule<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">Proven 70%<\/span><div class=\"pbar\" style=\"width:70%;background:#2A3040\">known marginal CPA<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Promising 20%<\/span><div class=\"pbar\" style=\"width:20%;background:#B35C00\">bets<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Tests 10%<\/span><div class=\"pbar\" style=\"width:10%;background:#2749D6\"><\/div><\/div><\/div><\/div><ol>\n<li><strong>Set the goal backward:<\/strong> revenue target → deals/orders needed → leads needed (÷ conversion rates) → traffic needed → budget by channel CPC/CPA.<\/li>\n<li><strong>The 70/20/10 rule:<\/strong> 70% proven channels, 20% promising bets, 10% experiments.<\/li>\n<li><strong>Marginal thinking:<\/strong> every channel has diminishing returns; expert media planners find each channel's efficient frontier and reallocate monthly.<\/li>\n<li><strong>Benchmarks to sanity-check:<\/strong> CAC payback &lt; 12 months (SaaS), CAC:LTV ≥ 1:3, blended MER (marketing efficiency ratio) tracked alongside channel ROAS.<\/li>\n<li><strong>Deliverable to master:<\/strong> a one-page media plan — objective, audience, channels, flighting, budget split, KPIs, and measurement plan.<\/li>\n<\/ol>", "html_ar": "<div class=\"viz\"><div class=\"viz-cap\">قاعدة الميزانية ٧٠ / ٢٠ / ١٠<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">مُثبتة ٧٠٪<\/span><div class=\"pbar\" style=\"width:70%;background:#2A3040\">قنوات معروفة التكلفة الحدّية<\/div><\/div><div class=\"phase\"><span class=\"plabel\">واعدة ٢٠٪<\/span><div class=\"pbar\" style=\"width:20%;background:#B35C00\">رهانات<\/div><\/div><div class=\"phase\"><span class=\"plabel\">تجارب ١٠٪<\/span><div class=\"pbar\" style=\"width:10%;background:#2749D6\"><\/div><\/div><\/div><\/div><ol>\n<li><strong>ابدأ الهدف من الخلف:<\/strong> هدف الإيراد ← الصفقات/الطلبات المطلوبة ← العملاء المحتملون (÷ معدّلات التحويل) ← الزيارات المطلوبة ← الميزانية حسب تكلفة كل قناة.<\/li>\n<li><strong>قاعدة ٧٠/٢٠/١٠:<\/strong> ٧٠٪ قنوات مثبتة، ٢٠٪ رهانات واعدة، ١٠٪ تجارب.<\/li>\n<li><strong>التفكير الحدّي:<\/strong> لكل قناة عوائد متناقصة؛ المخطّط الخبير يجد حدّ الكفاءة لكل قناة ويعيد التوزيع شهريًا.<\/li>\n<li><strong>معايير للتحقق:<\/strong> استرداد CAC أقل من ١٢ شهرًا (SaaS)، نسبة CAC:LTV ≥ ١:٣، ومتابعة MER المدمج بجانب ROAS القنوات.<\/li>\n<li><strong>المُخرَج الذي يجب إتقانه:<\/strong> خطة وسائط من صفحة واحدة — الهدف، الجمهور، القنوات، التوقيت، توزيع الميزانية، المؤشرات، خطة القياس.<\/li>\n<\/ol>"}, {"id": "sec-29", "num": 29, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "Personal Branding & Community-Led Growth", "title_ar": "العلامة الشخصية والنمو عبر المجتمع", "html": "<ul>\n<li><strong>Personal branding:<\/strong> founders/marketers with audiences get cheaper distribution forever. Pick one platform, one niche, post consistently, document your work (\"build in public\").<\/li>\n<li><strong>Community-led growth:<\/strong> owned communities (Slack/Discord/Circle groups, forums) create retention, feedback loops, and word-of-mouth that ads can't buy.<\/li>\n<li><strong>Referral programs:<\/strong> systematize word-of-mouth (give/get incentives, milestone rewards). Tools: ReferralCandy, Viral Loops, GrowSurf.<\/li>\n<\/ul>", "html_ar": "<ul>\n<li><strong>العلامة الشخصية:<\/strong> المؤسسون والمسوّقون أصحاب الجمهور يحصلون على توزيع أرخص للأبد. اختر منصّة واحدة وتخصصًا واحدًا، انشر باستمرار، ووثّق عملك («البناء العلني»).<\/li>\n<li><strong>النمو عبر المجتمع:<\/strong> المجتمعات المملوكة (مجموعات Slack/Discord/Circle) تصنع احتفاظًا وحلقات تغذية راجعة وكلامًا شفهيًا لا تشتريه الإعلانات.<\/li>\n<li><strong>برامج الإحالة:<\/strong> حوّل الكلام الشفهي إلى نظام (حوافز أعطِ/خذ، مكافآت المراحل). أدوات: ReferralCandy، Viral Loops، GrowSurf.<\/li>\n<\/ul>"}, {"id": "sec-30", "num": 30, "part": "Part II — Expanding the Map", "part_ar": "الجزء الثاني — توسيع الخريطة", "title": "Freelancing, Agency & Client Skills", "title_ar": "العمل الحر والوكالات ومهارات العملاء", "html": "<ul>\n<li><strong>Positioning:<\/strong> \"I do [channel] for [niche]\" beats \"I do digital marketing.\"<\/li>\n<li><strong>Discovery &amp; audits:<\/strong> every engagement starts with an audit — it demonstrates value and scopes the work.<\/li>\n<li><strong>Pricing models:<\/strong> hourly → monthly retainer → project → performance/value-based (in order of maturity).<\/li>\n<li><strong>Reporting:<\/strong> monthly reports must connect activity → metrics → business outcomes → next actions. Clients churn from silence, not from bad months.<\/li>\n<li><strong>Contracts:<\/strong> scope, deliverables, timelines, payment terms, and ownership of accounts/data — always in writing.<\/li>\n<\/ul>", "html_ar": "<ul>\n<li><strong>التموضع:<\/strong> «أقدّم [قناة] لـ[تخصص]» يتفوّق على «أقدّم تسويقًا رقميًا».<\/li>\n<li><strong>الاكتشاف والتدقيق:<\/strong> كل تعاقد يبدأ بتدقيق — يُظهر القيمة ويحدّد نطاق العمل.<\/li>\n<li><strong>نماذج التسعير:<\/strong> بالساعة ← اشتراك شهري ← بالمشروع ← بالأداء/القيمة (بترتيب النضج).<\/li>\n<li><strong>التقارير:<\/strong> يجب أن تربط النشاط ← المقاييس ← نتائج الأعمال ← الخطوات التالية. العملاء يرحلون بسبب الصمت لا بسبب شهر سيئ.<\/li>\n<li><strong>العقود:<\/strong> النطاق والمُخرجات والمواعيد وشروط الدفع وملكية الحسابات والبيانات — مكتوبة دائمًا.<\/li>\n<\/ul>"}, {"id": "sec-31", "num": 31, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "Copywriting: The Skill Underneath Every Channel", "title_ar": "كتابة الإعلان: المهارة تحت كل قناة", "html": "<p>Every ad, email, landing page, and post is words. Copy is the highest-ROI skill in this entire guide.<\/p><div class=\"viz\"><div class=\"viz-cap\">AIDA — the oldest funnel-in-a-message<\/div><div class=\"flow\"><div class=\"fnode hot\"><b>Attention<\/b><span>the headline stops the scroll<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Interest<\/b><span>the problem, in their words<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Desire<\/b><span>proof + specific outcome<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>Action<\/b><span>one clear CTA<\/span><\/div><\/div><\/div>\n<h3>The classic frameworks<\/h3>\n<ul>\n<li><strong>AIDA:<\/strong> Attention → Interest → Desire → Action. The oldest funnel-in-a-message structure.<\/li>\n<li><strong>PAS:<\/strong> Problem → Agitate → Solution. The workhorse of ads and emails: name the pain, make it vivid, present the fix.<\/li>\n<li><strong>BAB:<\/strong> Before → After → Bridge. Paint life now, life after, and your product as the bridge.<\/li>\n<li><strong>4 Us (headlines):<\/strong> Useful, Urgent, Unique, Ultra-specific — aim for at least three.<\/li>\n<li><strong>FAB:<\/strong> Feature → Advantage → Benefit (\"256GB storage → holds 60k photos → never delete a memory again\").<\/li>\n<\/ul>\n<h3>Principles the pros live by<\/h3>\n<ol>\n<li><strong>Clarity beats cleverness.<\/strong> If the reader has to think, you lose.<\/li>\n<li><strong>One idea per piece.<\/strong> One audience, one problem, one promise, one CTA.<\/li>\n<li><strong>Specificity is credibility.<\/strong> \"Cut reporting time by 6.5 hours/week\" &gt; \"save time.\"<\/li>\n<li><strong>Write to one person<\/strong> in their language — steal phrases from reviews, support tickets, and interviews (voice-of-customer research).<\/li>\n<li><strong>The first line's only job<\/strong> is to get the second line read (Sugarman's \"slippery slide\").<\/li>\n<li><strong>Market awareness stages (Eugene Schwartz):<\/strong> unaware → problem-aware → solution-aware → product-aware → most-aware. The stage dictates the message: educate the unaware, differentiate for the product-aware, just present the offer to the most-aware.<\/li>\n<\/ol>\n<h3>Practice regimen<\/h3>\n<p>Rewrite 3 headlines daily, hand-copy classic ads (Ogilvy, Halbert), and A/B test everything you ship — copywriting is learned by reps and feedback, not reading.<\/p>", "html_ar": "<p>كل إعلان وبريد وصفحة هبوط ومنشور هو كلمات. الكتابة الإعلانية أعلى مهارة عائدًا في هذا الدليل.<\/p><div class=\"viz\"><div class=\"viz-cap\">AIDA — أقدم قمع داخل رسالة واحدة<\/div><div class=\"flow\"><div class=\"fnode hot\"><b>انتباه<\/b><span>العنوان يوقف التمرير<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>اهتمام<\/b><span>المشكلة بلغة القارئ<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>رغبة<\/b><span>دليل + نتيجة محدّدة<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>إجراء<\/b><span>دعوة واحدة واضحة<\/span><\/div><\/div><\/div>\n<h3>الأطر الكلاسيكية<\/h3>\n<ul>\n<li><strong>AIDA:<\/strong> انتباه ← اهتمام ← رغبة ← إجراء.<\/li>\n<li><strong>PAS:<\/strong> مشكلة ← تهييج ← حل. فرس العمل للإعلانات والبريد.<\/li>\n<li><strong>BAB:<\/strong> قبل ← بعد ← الجسر. ارسم الحياة الآن، وبعد، ومنتجك هو الجسر.<\/li>\n<li><strong>4 Us للعناوين:<\/strong> مفيد، عاجل، فريد، شديد التحديد — استهدف ثلاثة على الأقل.<\/li>\n<li><strong>FAB:<\/strong> خاصية ← ميزة ← منفعة («سعة ٢٥٦ جيجا ← تتسع لـ٦٠ ألف صورة ← لن تحذف ذكرى أبدًا»).<\/li>\n<\/ul>\n<h3>مبادئ المحترفين<\/h3>\n<ol>\n<li><strong>الوضوح يغلب الذكاء.<\/strong> إن اضطر القارئ للتفكير، خسرت.<\/li>\n<li><strong>فكرة واحدة لكل قطعة.<\/strong> جمهور واحد، مشكلة واحدة، وعد واحد، دعوة واحدة.<\/li>\n<li><strong>التحديد مصداقية.<\/strong> «وفّر ٦٫٥ ساعات أسبوعيًا» أقوى من «وفّر الوقت».<\/li>\n<li><strong>اكتب لشخص واحد<\/strong> بلغته — اقتبس من المراجعات وتذاكر الدعم والمقابلات.<\/li>\n<li><strong>وظيفة السطر الأول الوحيدة<\/strong> أن يُقرأ السطر الثاني.<\/li>\n<li><strong>مراحل وعي السوق (يوجين شوارتز):<\/strong> غير واعٍ ← واعٍ بالمشكلة ← واعٍ بالحلول ← واعٍ بالمنتج ← الأكثر وعيًا. المرحلة تحدّد الرسالة.<\/li>\n<\/ol>\n<h3>نظام التمرين<\/h3>\n<p>أعد كتابة ٣ عناوين يوميًا، انسخ إعلانات كلاسيكية بخط يدك (أوجلفي، هالبرت)، واختبر A/B كل ما تنشره.<\/p>"}, {"id": "sec-32", "num": 32, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "SMS, WhatsApp & Conversational Marketing", "title_ar": "الرسائل النصية وواتساب والتسويق التحادثي", "html": "<ul>\n<li><strong>SMS:<\/strong> ~98% open rates within minutes — the most intrusive channel, so use sparingly: flash offers, cart recovery, shipping updates, appointment reminders. Strict consent laws apply (TCPA in the US — express written consent, easy STOP opt-out).<\/li>\n<li><strong>WhatsApp Business:<\/strong> dominant in Europe, LATAM, Middle East, Africa, and Asia — broadcast lists, catalogs, automated flows, and 1:1 commerce. For many markets it outperforms email.<\/li>\n<li><strong>Conversational marketing:<\/strong> chatbots and live chat that qualify, book, and sell in real time (Intercom, Drift, ManyChat for IG/WhatsApp automation).<\/li>\n<li><strong>Rules:<\/strong> value per message must be high, frequency low, timing respectful, opt-out instant.<\/li>\n<li><strong>Metrics:<\/strong> delivery rate, CTR, conversion per message, opt-out rate (keep &lt;1–2% per campaign).<\/li>\n<\/ul>", "html_ar": "<ul>\n<li><strong>الرسائل النصية:<\/strong> معدّل فتح ~٩٨٪ خلال دقائق — أكثر القنوات تطفّلًا، فاستخدمها باعتدال: عروض سريعة، استرداد السلة، تحديثات الشحن، تذكير المواعيد. قوانين موافقة صارمة.<\/li>\n<li><strong>واتساب للأعمال:<\/strong> مهيمن في أوروبا وأمريكا اللاتينية والشرق الأوسط وأفريقيا وآسيا — قوائم بث، كتالوجات، تدفّقات آلية، وتجارة فردية. في أسواق كثيرة يتفوّق على البريد.<\/li>\n<li><strong>التسويق التحادثي:<\/strong> روبوتات ودردشة حيّة تؤهّل وتحجز وتبيع فوريًا (Intercom، Drift، ManyChat).<\/li>\n<li><strong>القواعد:<\/strong> قيمة عالية لكل رسالة، تكرار منخفض، توقيت محترم، إلغاء فوري.<\/li>\n<li><strong>المقاييس:<\/strong> معدّل التسليم، النقر، التحويل لكل رسالة، معدّل الإلغاء (أقل من ١–٢٪ لكل حملة).<\/li>\n<\/ul>"}, {"id": "sec-33", "num": 33, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "Webinars, Podcasts & Event Marketing", "title_ar": "الندوات والبودكاست وتسويق الفعاليات", "html": "<ul>\n<li><strong>Webinars:<\/strong> the strongest B2B mid-funnel weapon — 45–60 min of teaching + Q&amp;A + soft pitch. A single evergreen (automated) webinar can run as a 24/7 sales asset. Benchmarks: 35–45% of registrants attend; email sequences before and after do half the work.<\/li>\n<li><strong>Podcasting (two plays):<\/strong> hosting one builds authority slowly; <strong>being a guest<\/strong> on existing shows borrows audiences immediately — the fastest podcast ROI for most brands.<\/li>\n<li><strong>Virtual &amp; live events:<\/strong> community-building and pipeline acceleration; the content generated (talks, clips, quotes) fuels months of repurposing.<\/li>\n<li><strong>Tools:<\/strong> Zoom/Livestorm/Demio (webinars), Riverside/Descript (podcast production), Luma/Eventbrite (events).<\/li>\n<\/ul>", "html_ar": "<ul>\n<li><strong>الندوات:<\/strong> أقوى سلاح لوسط القمع في B2B — ٤٥–٦٠ دقيقة تعليم + أسئلة + عرض خفيف. ندوة مسجّلة دائمة قد تعمل كأصل بيع على مدار الساعة. يحضر عادة ٣٥–٤٥٪ من المسجّلين.<\/li>\n<li><strong>البودكاست (لعبتان):<\/strong> استضافة بودكاست تبني السلطة ببطء؛ <strong>الظهور كضيف<\/strong> يستعير جماهير فورًا — أسرع عائد لمعظم العلامات.<\/li>\n<li><strong>الفعاليات الافتراضية والحيّة:<\/strong> بناء المجتمع وتسريع الصفقات؛ والمحتوى الناتج يغذّي أشهرًا من إعادة التوظيف.<\/li>\n<li><strong>الأدوات:<\/strong> Zoom/Livestorm/Demio، Riverside/Descript، Luma/Eventbrite.<\/li>\n<\/ul>"}, {"id": "sec-34", "num": 34, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "Growth Frameworks Every Marketer Should Know", "title_ar": "أطر النمو التي يجب أن يعرفها كل مسوّق", "html": "<div class=\"viz\"><div class=\"viz-cap\">AARRR pirate metrics — fix the leakiest stage first<\/div><div class=\"funnel\"><div class=\"fstage\" style=\"width:100%;background:#2A3040\"><span>Acquisition<\/span><small>how do users find you?<\/small><\/div><div class=\"fstage\" style=\"width:84%;background:#2749D6\"><span>Activation<\/span><small>the first 'aha' moment<\/small><\/div><div class=\"fstage\" style=\"width:66%;background:#B35C00\"><span>Retention<\/span><small>do they come back?<\/small><\/div><div class=\"fstage\" style=\"width:50%;background:#0E7A4F\"><span>Referral<\/span><small>do they bring others?<\/small><\/div><div class=\"fstage\" style=\"width:36%;background:#6B3FC7\"><span>Revenue<\/span><small>how do you monetize?<\/small><\/div><\/div><\/div><ul>\n<li><strong>AARRR (Pirate Metrics):<\/strong> Acquisition → Activation → Retention → Referral → Revenue. Diagnose which stage is the constraint before optimizing anything — fixing retention usually beats adding acquisition.<\/li>\n<li><strong>The Bullseye Framework (from <em>Traction<\/em>):<\/strong> brainstorm all 19 channels → rank into outer/promising/inner rings → cheap tests on 3 promising channels → focus everything on the one that works. Most companies get most growth from ONE channel at a time.<\/li>\n<li><strong>ICE / PIE prioritization:<\/strong> score every idea (Impact, Confidence, Ease) — opinion-proof roadmaps.<\/li>\n<li><strong>North Star + input metrics:<\/strong> one metric that captures delivered value, supported by 3–5 input metrics teams can directly move.<\/li>\n<li><strong>The growth loop model:<\/strong> modern growth thinking replaces funnels with loops — e.g., content loop (content → traffic → email → sharing → more traffic) or viral loop (user → invites → new users). Loops compound; funnels only drain.<\/li>\n<\/ul>", "html_ar": "<div class=\"viz\"><div class=\"viz-cap\">مقاييس AARRR — أصلح المرحلة الأكثر تسريبًا أولًا<\/div><div class=\"funnel\"><div class=\"fstage\" style=\"width:100%;background:#2A3040\"><span>الاكتساب<\/span><small>كيف يجدونك؟<\/small><\/div><div class=\"fstage\" style=\"width:84%;background:#2749D6\"><span>التفعيل<\/span><small>لحظة «آها» الأولى<\/small><\/div><div class=\"fstage\" style=\"width:66%;background:#B35C00\"><span>الاحتفاظ<\/span><small>هل يعودون؟<\/small><\/div><div class=\"fstage\" style=\"width:50%;background:#0E7A4F\"><span>الإحالة<\/span><small>هل يجلبون غيرهم؟<\/small><\/div><div class=\"fstage\" style=\"width:36%;background:#6B3FC7\"><span>الإيراد<\/span><small>كيف تحقّق الدخل؟<\/small><\/div><\/div><\/div><ul>\n<li><strong>AARRR (مقاييس القراصنة):<\/strong> الاكتساب ← التفعيل ← الاحتفاظ ← الإحالة ← الإيراد. شخّص المرحلة المقيِّدة قبل تحسين أي شيء — إصلاح الاحتفاظ غالبًا يغلب زيادة الاكتساب.<\/li>\n<li><strong>إطار الهدف (Bullseye) من كتاب <em>Traction<\/em>:<\/strong> فكّر في القنوات الـ١٩ ← رتّبها في حلقات ← اختبارات رخيصة على ٣ قنوات واعدة ← ركّز كل شيء على القناة التي تنجح.<\/li>\n<li><strong>ترتيب ICE / PIE:<\/strong> قيّم كل فكرة (الأثر، الثقة، السهولة) — خطط عمل محصّنة من الآراء.<\/li>\n<li><strong>نجم الشمال + مقاييس المُدخلات:<\/strong> مقياس واحد يجسّد القيمة المقدَّمة، مدعوم بـ٣–٥ مقاييس يحرّكها الفريق مباشرة.<\/li>\n<li><strong>نموذج حلقات النمو:<\/strong> التفكير الحديث يستبدل القمع بالحلقات — حلقة محتوى (محتوى ← زيارات ← بريد ← مشاركة ← زيارات أكثر) أو حلقة فيروسية. الحلقات تتراكم؛ القمع يُستنزف.<\/li>\n<\/ul>"}, {"id": "sec-35", "num": 35, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "Competitive Analysis: A Repeatable System", "title_ar": "تحليل المنافسين: نظام قابل للتكرار", "html": "<ol>\n<li><strong>Identify:<\/strong> 3 direct + 2 aspirational competitors.<\/li>\n<li><strong>Traffic &amp; SEO:<\/strong> their top pages and keywords (Ahrefs/Semrush), content velocity, link sources.<\/li>\n<li><strong>Paid:<\/strong> ads and angles in Meta Ads Library and Google Ads Transparency Center; landing pages they send traffic to.<\/li>\n<li><strong>Social &amp; community:<\/strong> formats that work for them, engagement quality, influencer partnerships.<\/li>\n<li><strong>Email:<\/strong> subscribe to everything — map their flows, frequency, and offers.<\/li>\n<li><strong>Positioning &amp; pricing:<\/strong> message, guarantees, packaging; read their 1-star and 5-star reviews (gold for your copy).<\/li>\n<li><strong>Synthesize:<\/strong> a gap map — what they all do (table stakes), what none do (opportunity), what you can do 10x better (wedge).\nRepeat quarterly; competitors are a free R&amp;D department.<\/li>\n<\/ol>", "html_ar": "<ol>\n<li><strong>حدّد:<\/strong> ٣ منافسين مباشرين + ٢ تطلّعيين.<\/li>\n<li><strong>الزيارات والسيو:<\/strong> أهم صفحاتهم وكلماتهم، سرعة المحتوى، مصادر الروابط.<\/li>\n<li><strong>المدفوع:<\/strong> إعلاناتهم وزواياها في مكتبة إعلانات ميتا ومركز شفافية إعلانات جوجل، وصفحات الهبوط.<\/li>\n<li><strong>التواصل والمجتمع:<\/strong> الصيغ الناجحة لديهم، جودة التفاعل، شراكات المؤثرين.<\/li>\n<li><strong>البريد:<\/strong> اشترك في كل شيء — ارسم تدفّقاتهم وتكرارهم وعروضهم.<\/li>\n<li><strong>التموضع والتسعير:<\/strong> الرسالة والضمانات والباقات؛ اقرأ مراجعاتهم بنجمة وبخمس نجوم (ذهب لكتابتك).<\/li>\n<li><strong>التركيب:<\/strong> خريطة فجوات — ما يفعلونه جميعًا (أساسيات)، ما لا يفعله أحد (فرصة)، ما تستطيع فعله أفضل بعشر مرات (إسفين).<\/li>\n<\/ol>\n<p>كرّر كل ربع؛ المنافسون قسم بحث وتطوير مجاني.<\/p>"}, {"id": "sec-36", "num": 36, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "The 15 Most Common Digital Marketing Mistakes", "title_ar": "أكثر ١٥ خطأ شيوعًا في التسويق الرقمي", "html": "<ol>\n<li>Selling to everyone (no positioning) — the root cause of weak results everywhere downstream.<\/li>\n<li>Launching campaigns before tracking works.<\/li>\n<li>Optimizing channel metrics (CTR, ROAS) while blended economics decay.<\/li>\n<li>All TOFU content, no BOFU — traffic without revenue.<\/li>\n<li>Judging SEO in weeks or paid in days — wrong time horizons.<\/li>\n<li>Batch-and-blast email to an unsegmented, unauthenticated list.<\/li>\n<li>Copy-pasting the same creative to every platform.<\/li>\n<li>Testing tiny things on tiny traffic (unpowered A/B tests).<\/li>\n<li>Scaling budget faster than creative supply.<\/li>\n<li>Ignoring retention/LTV — treating marketing as pure acquisition.<\/li>\n<li>Believing platform attribution without incrementality checks.<\/li>\n<li>Chasing every new channel/trend before mastering one.<\/li>\n<li>Buying tools to solve skill problems.<\/li>\n<li>Reporting activity (\"we published 12 posts\") instead of outcomes.<\/li>\n<li>Making it about the brand, not the customer — the hero problem.<\/li>\n<\/ol>", "html_ar": "<ol>\n<li>البيع للجميع (بلا تموضع) — جذر النتائج الضعيفة في كل مكان.<\/li>\n<li>إطلاق الحملات قبل أن يعمل التتبّع.<\/li>\n<li>تحسين مقاييس القناة بينما تتآكل الاقتصاديات المدمجة.<\/li>\n<li>محتوى أعلى القمع فقط — زيارات بلا إيراد.<\/li>\n<li>الحكم على السيو بالأسابيع أو المدفوع بالأيام.<\/li>\n<li>إرسال جماعي لقائمة غير مقسّمة وغير موثّقة.<\/li>\n<li>نسخ الإبداع نفسه لكل منصّة.<\/li>\n<li>اختبار أشياء صغيرة على زيارات قليلة.<\/li>\n<li>توسيع الميزانية أسرع من إمداد الإبداع.<\/li>\n<li>تجاهل الاحتفاظ وLTV.<\/li>\n<li>تصديق إسناد المنصّات بلا اختبارات زيادة فعلية.<\/li>\n<li>مطاردة كل قناة جديدة قبل إتقان واحدة.<\/li>\n<li>شراء أدوات لحل مشكلات مهارة.<\/li>\n<li>التقرير عن النشاط بدل النتائج.<\/li>\n<li>جعل القصة عن العلامة لا العميل — مشكلة البطل.<\/li>\n<\/ol>"}, {"id": "sec-37", "num": 37, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "Ready-to-Use Templates", "title_ar": "قوالب جاهزة للاستخدام", "html": "<h3>37.1 Buyer Persona (one-pager)<\/h3>\n<blockquote>\n<p><strong>Name/segment:<\/strong> — <strong>Role &amp; demographics:<\/strong> — <strong>Goals (top 3):<\/strong> — <strong>Pains (top 3):<\/strong> — <strong>Watering holes<\/strong> (where they hang out/learn): — <strong>Objections to buying:<\/strong> — <strong>Trigger events<\/strong> that start the search: — <strong>Exact quotes<\/strong> from reviews/interviews: — <strong>What \"success\" looks like to them:<\/strong><\/p>\n<\/blockquote>\n<h3>37.2 One-Page Marketing Strategy<\/h3>\n<blockquote>\n<p><strong>Objective<\/strong> (SMART): — <strong>Target segment &amp; positioning statement:<\/strong> For [audience] who [need], [brand] is the [category] that [key benefit], unlike [alternative]. — <strong>Offer &amp; pricing:<\/strong> — <strong>3 channels + why:<\/strong> — <strong>Budget split &amp; CAC target:<\/strong> — <strong>KPIs &amp; review cadence:<\/strong> — <strong>90-day milestones:<\/strong><\/p>\n<\/blockquote>\n<h3>37.3 Campaign Brief<\/h3>\n<blockquote>\n<p><strong>Campaign name / dates:<\/strong> — <strong>Goal &amp; primary KPI:<\/strong> — <strong>Audience &amp; insight:<\/strong> — <strong>Single-minded message:<\/strong> — <strong>Offer &amp; CTA:<\/strong> — <strong>Channels &amp; formats:<\/strong> — <strong>Budget:<\/strong> — <strong>Assets needed &amp; owners:<\/strong> — <strong>Measurement plan (UTMs, events):<\/strong> — <strong>Risks/dependencies:<\/strong><\/p>\n<\/blockquote>\n<h3>37.4 Content Brief (for writers or AI)<\/h3>\n<blockquote>\n<p><strong>Target keyword &amp; intent:<\/strong> — <strong>Audience &amp; awareness stage:<\/strong> — <strong>Angle/unique take:<\/strong> — <strong>Must-answer questions (from PAA/sales calls):<\/strong> — <strong>Outline (H2s):<\/strong> — <strong>Internal links in/out:<\/strong> — <strong>CTA &amp; conversion goal:<\/strong> — <strong>Word count &amp; tone reference:<\/strong> — <strong>Sources/data to cite:<\/strong><\/p>\n<\/blockquote>\n<h3>37.5 Monthly Client/Executive Report Structure<\/h3>\n<blockquote>\n<ol>\n<li><strong>Headline summary<\/strong> (3 bullets: what happened, why, what's next) → 2. <strong>KPIs vs. targets<\/strong> (table + trend) → 3. <strong>What worked / what didn't<\/strong> (honest) → 4. <strong>Insights<\/strong> (the \"so what\") → 5. <strong>Next month's actions &amp; asks<\/strong> → 6. Appendix: channel detail.<\/li>\n<\/ol>\n<\/blockquote>\n<h3>37.6 UTM Naming Convention<\/h3>\n<blockquote>\n<p>All lowercase, hyphens, no spaces. <code>utm_source<\/code> = platform (google, meta, klaviyo). <code>utm_medium<\/code> = type (cpc, paid-social, email, organic-social). <code>utm_campaign<\/code> = initiative-year (spring-sale-2026). <code>utm_content<\/code> = creative/placement variant. Keep a shared spreadsheet as the single registry.<\/p>\n<\/blockquote>", "html_ar": "<h3>٣٧.١ شخصية المشتري (صفحة واحدة)<\/h3>\n<blockquote>\n<p><strong>الاسم/الشريحة:<\/strong> — <strong>الدور والديموغرافيا:<\/strong> — <strong>الأهداف (أهم ٣):<\/strong> — <strong>الآلام (أهم ٣):<\/strong> — <strong>أماكن التواجد والتعلّم:<\/strong> — <strong>اعتراضات الشراء:<\/strong> — <strong>أحداث تبدأ البحث:<\/strong> — <strong>اقتباسات حرفية من المراجعات:<\/strong> — <strong>كيف يبدو النجاح عندهم:<\/strong><\/p>\n<\/blockquote>\n<h3>٣٧.٢ استراتيجية تسويق من صفحة واحدة<\/h3>\n<blockquote>\n<p><strong>الهدف (SMART):<\/strong> — <strong>الشريحة وبيان التموضع:<\/strong> لـ[الجمهور] الذي [الحاجة]، [العلامة] هي [الفئة] التي [المنفعة]، بخلاف [البديل]. — <strong>العرض والسعر:<\/strong> — <strong>٣ قنوات + السبب:<\/strong> — <strong>توزيع الميزانية وهدف CAC:<\/strong> — <strong>المؤشرات وإيقاع المراجعة:<\/strong> — <strong>محطّات ٩٠ يومًا:<\/strong><\/p>\n<\/blockquote>\n<h3>٣٧.٣ إحاطة الحملة<\/h3>\n<blockquote>\n<p><strong>اسم الحملة / التواريخ:<\/strong> — <strong>الهدف والمؤشر الأساسي:<\/strong> — <strong>الجمهور والبصيرة:<\/strong> — <strong>الرسالة الواحدة:<\/strong> — <strong>العرض والدعوة:<\/strong> — <strong>القنوات والصيغ:<\/strong> — <strong>الميزانية:<\/strong> — <strong>الأصول والمسؤولون:<\/strong> — <strong>خطة القياس (UTM، أحداث):<\/strong> — <strong>المخاطر:<\/strong><\/p>\n<\/blockquote>\n<h3>٣٧.٤ إحاطة المحتوى (للكتّاب أو الذكاء الاصطناعي)<\/h3>\n<blockquote>\n<p><strong>الكلمة المستهدفة والنيّة:<\/strong> — <strong>الجمهور ومرحلة الوعي:<\/strong> — <strong>الزاوية الفريدة:<\/strong> — <strong>أسئلة يجب الإجابة عنها:<\/strong> — <strong>المخطّط (H2):<\/strong> — <strong>الروابط الداخلية:<\/strong> — <strong>الدعوة وهدف التحويل:<\/strong> — <strong>الطول والنبرة:<\/strong> — <strong>مصادر وبيانات:<\/strong><\/p>\n<\/blockquote>\n<h3>٣٧.٥ هيكل التقرير الشهري<\/h3>\n<blockquote>\n<ol start=\"١\">\n<li><strong>ملخّص رئيسي<\/strong> (٣ نقاط: ماذا حدث، لماذا، ما التالي) ← ٢. <strong>المؤشرات مقابل الأهداف<\/strong> ← ٣. <strong>ما نجح وما لم ينجح<\/strong> (بصدق) ← ٤. <strong>البصائر<\/strong> ← ٥. <strong>إجراءات الشهر القادم والطلبات<\/strong> ← ٦. ملحق: تفاصيل القنوات.<\/li>\n<\/ol>\n<\/blockquote>\n<h3>٣٧.٦ تسمية UTM<\/h3>\n<blockquote>\n<p>كلها أحرف صغيرة وشرطات بلا مسافات. <code>utm_source<\/code> = المنصّة (google، meta، klaviyo). <code>utm_medium<\/code> = النوع (cpc، paid-social، email). <code>utm_campaign<\/code> = المبادرة-السنة. <code>utm_content<\/code> = نسخة الإبداع. احتفظ بجدول مشترك كسجلّ وحيد.<\/p>\n<\/blockquote>"}, {"id": "sec-38", "num": 38, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "Skills Matrix: What \"Good\" Looks Like at Each Level", "title_ar": "مصفوفة المهارات: ما معنى «جيّد» في كل مستوى", "html": "<table>\n<thead>\n<tr>\n<th>Skill<\/th>\n<th>Beginner can...<\/th>\n<th>Intermediate can...<\/th>\n<th>Expert can...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SEO<\/td>\n<td>Explain intent, write optimized posts<\/td>\n<td>Audit sites, build clusters, earn links<\/td>\n<td>Lead migrations, programmatic SEO, AI-search strategy<\/td>\n<\/tr>\n<tr>\n<td>Paid<\/td>\n<td>Launch a basic campaign<\/td>\n<td>Structure accounts, cut waste, test creative<\/td>\n<td>Design measurement (incrementality/MMM), scale profitably<\/td>\n<\/tr>\n<tr>\n<td>Content<\/td>\n<td>Write clear posts on a calendar<\/td>\n<td>Run TOFU→BOFU engines with repurposing<\/td>\n<td>Build content moats: original data, brand voice, distribution<\/td>\n<\/tr>\n<tr>\n<td>Social<\/td>\n<td>Post consistently, natively<\/td>\n<td>Engineer formats from analytics, manage community<\/td>\n<td>Turn organic into paid creative pipelines and brand equity<\/td>\n<\/tr>\n<tr>\n<td>Email<\/td>\n<td>Build a list + welcome flow<\/td>\n<td>Segment, automate lifecycle, protect deliverability<\/td>\n<td>Drive 25–35% of revenue; predictive lifecycle programs<\/td>\n<\/tr>\n<tr>\n<td>Analytics<\/td>\n<td>Read GA4, tag UTMs<\/td>\n<td>Build dashboards, run valid tests<\/td>\n<td>Triangulate MMM + attribution + experiments for the board<\/td>\n<\/tr>\n<tr>\n<td>Copy<\/td>\n<td>Apply PAS/AIDA cleanly<\/td>\n<td>Match message to awareness stage, test systematically<\/td>\n<td>Create positioning and campaign platforms that define brands<\/td>\n<\/tr>\n<tr>\n<td>Strategy<\/td>\n<td>Follow a plan<\/td>\n<td>Build channel plans from unit economics<\/td>\n<td>Set portfolio strategy, budgets, teams, and the narrative<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "html_ar": "<table>\n<thead>\n<tr>\n<th>المهارة<\/th>\n<th>المبتدئ يستطيع...<\/th>\n<th>المتوسط يستطيع...<\/th>\n<th>الخبير يستطيع...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>السيو<\/td>\n<td>شرح النيّة، كتابة مقالات محسّنة<\/td>\n<td>تدقيق المواقع، بناء العناقيد، كسب الروابط<\/td>\n<td>قيادة نقل المواقع، السيو البرمجي، استراتيجية بحث الذكاء الاصطناعي<\/td>\n<\/tr>\n<tr>\n<td>المدفوع<\/td>\n<td>إطلاق حملة أساسية<\/td>\n<td>هيكلة الحسابات، قطع الهدر، اختبار الإبداع<\/td>\n<td>تصميم القياس (الزيادة الفعلية/MMM)، التوسّع بربحية<\/td>\n<\/tr>\n<tr>\n<td>المحتوى<\/td>\n<td>كتابة واضحة على جدول<\/td>\n<td>تشغيل محرّكات محتوى كاملة القمع<\/td>\n<td>بناء خنادق محتوى: بيانات أصلية، صوت علامة، توزيع<\/td>\n<\/tr>\n<tr>\n<td>التواصل<\/td>\n<td>نشر أصلي منتظم<\/td>\n<td>هندسة الصيغ من التحليلات، إدارة المجتمع<\/td>\n<td>تحويل العضوي إلى خط إبداع مدفوع وقيمة علامة<\/td>\n<\/tr>\n<tr>\n<td>البريد<\/td>\n<td>قائمة + سلسلة ترحيب<\/td>\n<td>تقسيم، أتمتة دورة الحياة، حماية التسليم<\/td>\n<td>تحقيق ٢٥–٣٥٪ من الإيراد؛ برامج تنبّؤية<\/td>\n<\/tr>\n<tr>\n<td>التحليلات<\/td>\n<td>قراءة GA4، وسم UTM<\/td>\n<td>بناء لوحات، اختبارات صحيحة<\/td>\n<td>الجمع بين MMM والإسناد والتجارب لمجلس الإدارة<\/td>\n<\/tr>\n<tr>\n<td>الكتابة<\/td>\n<td>تطبيق PAS/AIDA بنظافة<\/td>\n<td>مطابقة الرسالة لمرحلة الوعي<\/td>\n<td>صنع منصّات تموضع وحملات تعرّف العلامات<\/td>\n<\/tr>\n<tr>\n<td>الاستراتيجية<\/td>\n<td>اتباع خطة<\/td>\n<td>بناء خطط قنوات من اقتصاديات الوحدة<\/td>\n<td>تحديد المحفظة والميزانيات والفرق والسردية<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "sec-39", "num": 39, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقان", "title": "Frequently Asked Questions", "title_ar": "أسئلة شائعة", "html": "<p><strong>Do I need a degree?<\/strong> No — portfolios, certifications, and demonstrated results outweigh degrees in most hiring.\n<strong>How long to become job-ready?<\/strong> 3–6 months of focused daily practice with real projects gets most people to junior-role readiness.\n<strong>Which specialization pays best?<\/strong> Performance marketing/growth and marketing analytics typically lead; but mastery in ANY channel out-earns mediocrity in all.\n<strong>Should I learn everything at once?<\/strong> No — T-shape: broad literacy (this guide) + one deep specialization chosen by month 3.\n<strong>Is digital marketing saturated?<\/strong> Entry-level generalists, yes; specialists who can prove revenue impact are permanently scarce.\n<strong>Will AI take marketing jobs?<\/strong> It's compressing execution work; it's expanding demand for strategists, creatives, and operators who direct AI. Be the director.\n<strong>Paid course or free resources?<\/strong> Free covers 90% (Google, HubSpot, Meta academies + practice). Pay only for structure, community, or specialized depth.<\/p>", "html_ar": "<p><strong>هل أحتاج شهادة جامعية؟<\/strong> لا — ملف الأعمال والشهادات المهنية والنتائج تتفوّق على الشهادات في معظم التوظيف.<\/p>\n<p><strong>كم يستغرق الوصول لجاهزية العمل؟<\/strong> ٣–٦ أشهر من الممارسة اليومية المركّزة بمشاريع حقيقية تكفي معظم الناس لوظيفة مبتدئة.<\/p>\n<p><strong>أي تخصص يدفع أكثر؟<\/strong> تسويق الأداء/النمو وتحليلات التسويق في المقدّمة عادة؛ لكن الإتقان في أي قناة يتفوّق على الأداء المتوسط في كل القنوات.<\/p>\n<p><strong>هل أتعلّم كل شيء مرة واحدة؟<\/strong> لا — شكل T: إلمام واسع (هذا الدليل) + تخصص عميق واحد تختاره بحلول الشهر الثالث.<\/p>\n<p><strong>هل المجال مشبع؟<\/strong> للعامّين المبتدئين نعم؛ أما المتخصصون القادرون على إثبات أثر الإيراد فنادرون دائمًا.<\/p>\n<p><strong>هل سيأخذ الذكاء الاصطناعي وظائف التسويق؟<\/strong> يضغط أعمال التنفيذ، ويوسّع الطلب على الاستراتيجيين والمبدعين والمشغّلين الذين يوجّهونه. كن الموجِّه.<\/p>\n<p><strong>دورة مدفوعة أم مصادر مجانية؟<\/strong> المجاني يغطي ٩٠٪ (أكاديميات جوجل وHubSpot وميتا + الممارسة). ادفع فقط مقابل الهيكلة أو المجتمع أو العمق المتخصص.<\/p>"}, {"id": "sec-40", "num": 40, "part": "Part III — Mastery Layer", "part_ar": "الجزء الثالث — طبقة الإتقا
