function go(tab, id){
  if(!VALID[tab](id)) id = defaults(tab);
  if(!(tab==='interview' && id==='quiz')) S.quiz.on = false;
  S.tab = tab; S.id = id;
  if(id !== 'home') S.last = {tab, id};
  save(); setHash(true); closeMenu(); render(); window.scrollTo(0,0);
}
function onRoute(){ const r = parseHash(); if(r && (r.tab!==S.tab || r.id!==S.id)){ S.tab=r.tab; S.id=r.id; S.quiz.on=false; render(); window.scrollTo(0,0); } }
window.addEventListener('popstate', onRoute);
window.addEventListener('hashchange', onRoute);

/* ---------- theme & language ---------- */
const isDark = () => S.theme ? S.theme==='dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){ const r = document.documentElement; S.theme ? r.setAttribute('data-theme', S.theme) : r.removeAttribute('data-theme'); }
function toggleTheme(){ S.theme = isDark() ? 'light' : 'dark'; save(); render(); }
function toggleLang(){ S.lang = AR() ? 'en' : 'ar'; save(); render(); }

/* ---------- counts ---------- */
const totalChecks = () => Object.values(DATA.mcq).reduce((a,b) => a + b.length, 0);
function correctChecks(){ let c = 0; for(const [k,v] of Object.entries(S.mcq)){ const [n,i] = k.split('-'); const m = DATA.mcq[n] && DATA.mcq[n][+i]; if(m && m.a===v) c++; } return c; }

/* ---------- render ---------- */
function render(){
  const r = document.documentElement; r.lang = S.lang; r.dir = AR() ? 'rtl' : 'ltr'; applyTheme();
  renderTop(); renderSide(); renderMain();
}
function renderTop(){
  $('#brand').innerHTML = T('brand');
  [['learn','📚'],['practice','🧪'],['interview','💼']].forEach(([t,e]) => {
    const b = $('#tab-'+t); b.innerHTML = `<span aria-hidden="true">${e}</span> ${T(t)}`; b.setAttribute('aria-selected', S.tab===t); });
  $('#langBtn').textContent = T('lang');
  $('#themeBtn').textContent = isDark() ? '☀️' : '🌙';
  $('#pill').innerHTML = F('pill', {d:N(S.done.size), g:N(DATA.guide.length), p:N(S.prac.size), pt:N(DATA.practice.length), k:N(S.known.size), q:N(DATA.questions.length)});
}
function navBtn(tab, id, n, t, done, snip){
  return `<button class="nav-item${S.tab===tab && S.id===id ? ' active' : ''}${done ? ' done' : ''}" onclick="go('${tab}','${id}')"><span class="n">${n}</span><span class="t">${esc(t)}${snip ? `<small class="snip">${esc(snip)}</small>` : ''}</span></button>`;
}
function renderSide(){
  const inp = $('#sq'); inp.placeholder = T('search'); inp.style.display = S.tab==='interview' ? 'none' : '';
  const q = S.side.trim().toLowerCase(); let h = '';
  if(S.tab === 'learn'){
    if(!q) h += navBtn('learn','home','⌂',T('start'));
    let part = ''; let any = false;
    DATA.guide.forEach(s => { const m = q ? matchOf(s,q) : {hit:true};
      if(!m.hit) return; any = true;
      if(s.part !== part){ part = s.part; h += `<div class="part-label">${esc(L(s,'part'))}</div>`; }
      h += navBtn('learn', s.id, N(s.num), L(s,'title'), S.done.has(s.id), m.snip); });
    if(q && !any) h += `<div class="side-empty">${T('nores')}</div>`;
  } else if(S.tab === 'practice'){
    let any = false;
    DATA.practice.forEach(p => { const m = q ? matchOf(p,q) : {hit:true}; if(!m.hit) return; any = true;
      h += navBtn('practice', p.id, N(p.num), L(p,'title'), S.prac.has(p.id), m.snip); });
    if(q && !any) h += `<div class="side-empty">${T('nores')}</div>`;
  } else {
    h += navBtn('interview','drill','▤',T('qbank') + ' (' + N(DATA.questions.length) + ')');
    h += navBtn('interview','quiz','⚡',T('quiz'));
    h += navBtn('interview','career','✎',T('career'));
    h += `<div class="part-label">${T('topics')}</div>`;
    DATA.intSections.forEach((s,i) => { h += `<button class="nav-item${S.sec===s && S.id==='drill' ? ' active' : ''}" onclick="jumpTopic(${i})"><span class="n">§</span><span class="t">${esc(secName(s))}</span></button>`; });
  }
  $('#nav').innerHTML = h;
}
function jumpTopic(i){ S.sec = DATA.intSections[i]; go('interview','drill'); }

function renderMain(){
  const m = $('#main'); let h = '';
  if(S.tab === 'learn') h = S.id==='home' ? viewHome() : viewSection(S.id);
  else if(S.tab === 'practice') h = viewPractice(S.id);
  else h = S.id==='quiz' ? viewQuiz() : S.id==='career' ? viewCareer() : viewDrill();
  m.innerHTML = h;
  m.querySelectorAll('.section-body table').forEach(t => { if(!t.parentElement.classList.contains('table-wrap')){ const w = document.createElement('div'); w.className='table-wrap'; t.parentNode.insertBefore(w,t); w.appendChild(t); } });
}

/* ---------- views ---------- */
function titleOf(tab, id){
  if(tab==='learn'){ const s = DATA.guide.find(x => x.id===id); return s ? `${N(s.num)}. ${L(s,'title')}` : ''; }
  if(tab==='practice'){ const p = DATA.practice.find(x => x.id===id); return p ? L(p,'title') : ''; }
  return id==='quiz' ? T('quiz') : id==='career' ? T('career') : T('qbank');
}
function progRow(l, v, t){ return `<div class="prow"><span>${l}</span><div class="bar"><i style="width:${t ? Math.round(100*v/t) : 0}%"></i></div><b>${N(v)}/${N(t)}</b></div>`; }
function viewHome(){
  const g = DATA.guide.length, pt = DATA.practice.length, q = DATA.questions.length, ck = totalChecks();
  const last = S.last && VALID[S.last.tab] && VALID[S.last.tab](S.last.id) ? titleOf(S.last.tab, S.last.id) : '';
  return `<section class="hero"><div class="eyebrow">${T('hero_eye')}</div>
  <h1>${T('hero_a')}<span class="swipe">${T('hero_b')}</span></h1>
  <p class="lede">${F('hero_lede', {ch:N(g), pr:N(pt), ck:N(ck), q:N(q)})}</p>
  <div class="hero-cta">${last ? `<button class="btn primary" onclick="go('${S.last.tab}','${S.last.id}')">${T('cont')}${esc(last)}</button>` : `<button class="btn primary" onclick="go('learn','sec-1')">${T('start1')}</button>`}
  <button class="btn" onclick="go('interview','drill')">${T('jump')}</button></div>
  <div class="card"><h3>${T('prog_t')}</h3>${progRow(T('p_ch'), S.done.size, g)}${progRow(T('p_pr'), S.prac.size, pt)}${progRow(T('p_q'), S.known.size, q)}${progRow(T('p_ck'), correctChecks(), ck)}</div>
  ${DATA.home[S.lang]}
  <div class="section-body"><h3>${T('how_t')}</h3><p>${T('how_l')}</p><p>${T('how_p')}</p><p>${T('how_i')}</p><blockquote><p>${T('how_q')}</p></blockquote></div>
  <div class="reset-row"><button class="mini" onclick="resetAll(this)">${T('reset')}</button></div></section>`;
}
function mcqHTML(num){
  const qs = DATA.mcq[num]; if(!qs) return '';
  let ok = 0, answered = 0;
  const items = qs.map((m, i) => {
    const k = num + '-' + i, ch = S.mcq[k], opts = (AR() && m.o_ar) ? m.o_ar : m.o;
    if(ch !== undefined){ answered++; if(ch === m.a) ok++; }
    const btns = opts.map((o, j) => { let c = ''; if(ch !== undefined){ if(j === m.a) c = ' right'; else if(j === ch) c = ' wrong'; }
      return `<button class="mopt${c}" ${ch !== undefined ? 'disabled' : ''} onclick="pick('${k}',${j})">${esc(o)}</button>`; }).join('');
    const why = ch !== undefined ? `<p class="mwhy">${ch === m.a ? '✓' : '✗'} ${esc((AR() && m.w_ar) ? m.w_ar : m.w)}</p>` : '';
    return `<div class="mcq"><p class="mq">${N(i+1)}. ${esc((AR() && m.q_ar) ? m.q_ar : m.q)}</p><div class="mopts">${btns}</div>${why}</div>`;
  }).join('');
  return `<section class="check" aria-label="${T('check')}"><div class="check-head"><b>${T('check')}</b><span>${N(ok)}/${N(qs.length)}</span>${answered ? `<button class="mini" onclick="resetCheck(${num})">${T('retry')}</button>` : ''}</div>${items}</section>`;
}
function pick(k, j){ S.mcq[k] = j; save(); const y = window.scrollY; renderMain(); window.scrollTo(0, y); }
function resetCheck(num){ Object.keys(S.mcq).forEach(k => { if(k.startsWith(num + '-')) delete S.mcq[k]; }); save(); const y = window.scrollY; renderMain(); window.scrollTo(0, y); }
function pager(list, i, tab){
  const prev = list[i-1], next = list[i+1];
  const lab = o => { const t = L(o,'title'); return esc(t.length > 30 ? t.slice(0,30) + '…' : t); };
  return `<div class="pager">${prev ? `<button class="btn ghost" onclick="go('${tab}','${prev.id}')">${T('prev')}: ${lab(prev)}</button>` : ''}${next ? `<button class="btn primary" onclick="go('${tab}','${next.id}')">${T('next')}: ${lab(next)}</button>` : ''}</div>`;
}
function viewSection(id){
  const i = DATA.guide.findIndex(s => s.id===id), s = DATA.guide[i], done = S.done.has(id), f = fb(s,'html');
  return `<div class="eyebrow">${esc(L(s,'part'))} · ${F('chapter_of', {n:N(s.num), t:N(DATA.guide.length)})}</div>
  <h1 class="doc"><span class="swipe">${esc(L(s,'title'))}</span>${f ? pill() : ''}</h1>
  ${f ? `<div class="fallback">${T('fallback')}</div>` : ''}
  <div class="section-body">${L(s,'html')}</div>
  ${mcqHTML(s.num)}
  <div class="sec-footer"><button class="btn ${done ? 'done' : ''}" onclick="toggleDone('${id}')">${done ? T('marked') : T('mark_done')}</button>${pager(DATA.guide, i, 'learn')}</div>`;
}
function toggleDone(id){ S.done.has(id) ? S.done.delete(id) : S.done.add(id); save(); renderTop(); renderSide(); const y = window.scrollY; renderMain(); window.scrollTo(0, y); }
function viewPractice(id){
  const i = DATA.practice.findIndex(p => p.id===id), p = DATA.practice[i], done = S.prac.has(id), f = fb(p,'html');
  return `<div class="eyebrow">${F('module_of', {n:N(p.num), t:N(DATA.practice.length)})}</div>
  <h1 class="doc"><span class="swipe">${esc(L(p,'title'))}</span>${f ? pill() : ''}</h1>
  ${f ? `<div class="fallback">${T('fallback')}</div>` : ''}
  <div class="note">${T('legend')}</div>
  <div class="section-body">${L(p,'html').replace(/\{\{REVEAL\}\}/g, T('reveal'))}</div>
  <div class="sec-footer"><button class="btn ${done ? 'done' : ''}" onclick="togglePrac('${id}')">${done ? T('marked') : T('mark_mod')}</button>${pager(DATA.practice, i, 'practice')}</div>`;
}
function togglePrac(id){ S.prac.has(id) ? S.prac.delete(id) : S.prac.add(id); save(); renderTop(); renderSide(); const y = window.scrollY; renderMain(); window.scrollTo(0, y); }

/* ---------- interview drill ---------- */
function filtered(){ const q = S.q.trim().toLowerCase();
  return DATA.questions.filter(x => (S.sec==='All' || x.section===S.sec) && (!S.lvl || x.level===S.lvl) &&
    (!q || (x.q + ' ' + x.a + ' ' + (x.q_ar||'') + ' ' + (x.a_ar||'')).toLowerCase().includes(q))); }
function qCard(x){
  const k = S.known.has(x.n), f = AR() && !x.q_ar;
  return `<article class="qcard${k ? ' known' : ''}" id="qc-${x.n}">
  <button class="qhead" onclick="toggleQ(${x.n})" aria-expanded="false"><span class="qnum">Q${N(x.n)}</span>
  <span class="qtext"><span class="qtag">${esc(secName(x.section))}</span>${esc(L(x,'q'))}${f ? pill() : ''}</span><span class="qstars">${stars(x.level)}</span></button>
  <div class="qbody">${L(x,'a')}</div><div class="qact"><button class="mini know" onclick="toggleKnown(${x.n})">${k ? T('known') : T('mark_known')}</button></div></article>`;
}
function drillList(){ const qs = filtered(); return {html: qs.map(qCard).join('') || `<p style="color:var(--soft)">${T('nomatch')}</p>`, n: qs.length}; }
function viewDrill(){
  const chips = ['All', ...DATA.intSections].map(s => `<button class="chip" aria-pressed="${S.sec===s}" onclick="setSec(${s==='All' ? -1 : DATA.intSections.indexOf(s)})">${esc(s==='All' ? T('all') : secName(s))}</button>`).join('');
  const lv = [0,1,2,3].map(l => `<button class="chip lvl" aria-pressed="${S.lvl===l}" onclick="setLvl(${l})">${l ? stars(l) + ' ' + T('lv' + l) : T('lv0')}</button>`).join('');
  const mastery = DATA.intSections.map(s => { const set = DATA.questions.filter(x => x.section===s), k = set.filter(x => S.known.has(x.n)).length;
    return `<div class="m-row"><span class="m-label">${esc(secName(s))}</span><div class="bar"><i style="width:${set.length ? Math.round(100*k/set.length) : 0}%"></i></div><span class="m-count">${N(k)}/${N(set.length)}</span></div>`; }).join('');
  const L1 = drillList();
  return `<div class="eyebrow">${T('int_eye')}</div>
  <h1 class="doc"><span class="swipe">${F('int_a', {q:N(DATA.questions.length)})}</span>${T('int_b')}</h1>
  <div class="note">${T('int_how')}</div><div class="note">${T('int_tip')}</div>
  <details class="mastery"><summary>${T('mastery')} — ${N(S.known.size)}/${N(DATA.questions.length)}</summary><div class="m-grid">${mastery}</div></details>
  <div class="filters">${chips}</div><div class="filters">${lv}</div>
  <div class="toolbar"><input class="isearch" id="isearch" type="search" placeholder="${T('sq')}" value="${esc(S.q)}" oninput="setQ(this.value)"><span class="count" id="qcount">${F('shown', {n:N(L1.n), k:N(S.known.size)})}</span></div>
  <div id="qlist">${L1.html}</div>`;
}
function setSec(i){ S.sec = i < 0 ? 'All' : DATA.intSections[i]; renderSide(); renderMain(); }
function setLvl(l){ S.lvl = l; renderMain(); }
let qT; function setQ(v){ clearTimeout(qT); qT = setTimeout(() => { S.q = v; const r = drillList(); $('#qlist').innerHTML = r.html; $('#qcount').textContent = F('shown', {n:N(r.n), k:N(S.known.size)}); }, 180); }
function toggleQ(n){ const c = $('#qc-' + n); const o = c.classList.toggle('open'); c.querySelector('.qhead').setAttribute('aria-expanded', o); }
function toggleKnown(n){ S.known.has(n) ? S.known.delete(n) : S.known.add(n); save(); renderTop();
  const c = $('#qc-' + n); if(c){ const k = S.known.has(n); c.classList.toggle('known', k); c.querySelector('.know').textContent = k ? T('known') : T('mark_known'); }
  const cnt = $('#qcount'); if(cnt) cnt.textContent = F('shown', {n:N(filtered().length), k:N(S.known.size)}); }

/* ---------- quiz ---------- */
function viewQuiz(){
  const z = S.quiz;
  if(!z.on) return `<div class="eyebrow">${T('quiz')}</div><h1 class="doc"><span class="swipe">${T('quiz')}</span></h1>
    <div class="section-body"><p>${T('quiz_lead')}</p><p class="meta">${esc(S.sec==='All' ? T('all') : secName(S.sec))} · ${S.lvl ? T('lv' + S.lvl) : T('lv0')}</p></div>
    <div class="ctrls"><button class="btn primary" onclick="startQuiz(false)">${T('quiz_go')}</button><button class="btn" onclick="startQuiz(true)">${T('quiz_unk')}</button></div>`;
  if(!z.pool.length) return `<div class="stage rev"><div class="stage-q">${T('empty_pool')}</div><div class="ctrls"><button class="btn" onclick="endQuiz()">${T('back')}</button></div></div>`;
  const x = z.pool[z.i];
  if(!x) return `<div class="stage rev"><div class="meta">${T('session')}</div><div class="stage-q">${F('quiz_done', {ok:N(z.ok), t:N(z.ok + z.no)})}</div>
    <div class="stage-a"><p>${z.no ? T('tip') : T('tip_clean')}</p></div><div class="ctrls"><button class="btn primary" onclick="startQuiz(false)">${T('quiz_again')}</button><button class="btn" onclick="endQuiz()">${T('back')}</button></div></div>`;
  return `<div class="eyebrow">${T('quiz')}</div><div class="stage${z.rev ? ' rev' : ''}">
    <div class="meta">${F('card', {i:N(z.i + 1), t:N(z.pool.length)})} · ${esc(secName(x.section))} · ${stars(x.level)}</div>
    <div class="stage-q">${esc(L(x,'q'))}${AR() && !x.q_ar ? pill() : ''}</div><div class="stage-a">${L(x,'a')}</div>
    <div class="ctrls">${z.rev ? `<button class="btn primary" onclick="scoreQ(true)">${T('quiz_ok')}</button><button class="btn" onclick="scoreQ(false)">${T('quiz_no')}</button>` : `<button class="btn primary" onclick="revQ()">${T('quiz_rev')}</button>`}
    <button class="btn ghost" onclick="endQuiz()">${T('quiz_end')}</button></div>
    <div class="score"><span class="ok">✓ ${N(z.ok)}</span><span class="no">✗ ${N(z.no)}</span></div></div>`;
}
function startQuiz(unk){ let p = filtered(); if(unk) p = p.filter(x => !S.known.has(x.n));
  for(let i = p.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  S.quiz = {on:true, pool:p.slice(0,20), i:0, ok:0, no:0, rev:false}; renderMain(); }
function revQ(){ S.quiz.rev = true; renderMain(); }
function scoreQ(ok){ const z = S.quiz, x = z.pool[z.i]; if(ok){ z.ok++; S.known.add(x.n); } else { z.no++; S.known.delete(x.n); }
  z.i++; z.rev = false; save(); renderTop(); renderMain(); }
function endQuiz(){ S.quiz.on = false; renderMain(); }
function viewCareer(){ const f = AR() && !DATA.appendix_ar;
  return `<div class="eyebrow">${T('career_eye')}</div><h1 class="doc"><span class="swipe">${T('career_h')}</span>${f ? pill() : ''}</h1>
  ${f ? `<div class="fallback">${T('fallback')}</div>` : ''}<div class="section-body">${(AR() && DATA.appendix_ar) ? DATA.appendix_ar : DATA.appendix}</div>`; }

/* ---------- chrome ---------- */
function closeMenu(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#overlay').classList.toggle('show'); });
let sT; $('#sq').addEventListener('input', e => { clearTimeout(sT); sT = setTimeout(() => { S.side = e.target.value; renderSide(); }, 150); });
document.addEventListener('keydown', e => {
  if(/input|textarea/i.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const list = S.tab==='learn' ? DATA.guide : S.tab==='practice' ? DATA.practice : null; if(!list) return;
  const i = list.findIndex(o => o.id===S.id); if(i < 0) return;
  const fwd = (e.key==='ArrowRight') !== AR(); const t = list[i + (fwd ? 1 : -1)]; if(t) go(S.tab, t.id);
});
window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.open = true));
if(window.matchMedia){ try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(!S.theme) renderTop(); }); }catch(e){} }

/* ---------- boot ---------- */
load();
const r0 = parseHash();
if(r0){ S.tab = r0.tab; S.id = r0.id; }
setHash(false); render();
</script>
</body>
</html>
