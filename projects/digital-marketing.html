ن", "title": "How to Use This Guide System", "title_ar": "كيف تستخدم منظومة هذا الدليل", "html": "<ol>\n<li><strong>Read<\/strong> the guide (Parts I–III) once for the map.<\/li>\n<li><strong>Do<\/strong> the 90-Day Action Plan (Section 20) — this is where learning actually happens.<\/li>\n<li><strong>Practice<\/strong> with the companion <strong>Examples &amp; Test Cases<\/strong> file — solve each test case before reading the solution.<\/li>\n<li><strong>Drill<\/strong> the <strong>215 Interview Questions<\/strong> file — first as flashcards, then out loud, then in mock interviews.<\/li>\n<li><strong>Re-score<\/strong> yourself on the Self-Assessment Checklist monthly; study whatever scores ≤3.<\/li>\n<li><strong>Ship real work<\/strong> — a niche site, a client, your employer's campaigns. The guide is the map; the territory is a live campaign with real money and real stakes.<\/li>\n<\/ol>", "html_ar": "<ol>\n<li><strong>اقرأ<\/strong> الدليل مرة واحدة لترى الخريطة.<\/li>\n<li><strong>نفّذ<\/strong> خطة الـ٩٠ يومًا (الفصل ٢٠) — هنا يحدث التعلّم فعلًا.<\/li>\n<li><strong>تدرّب<\/strong> في مساحة التدريب — حلّ كل حالة قبل كشف الحل.<\/li>\n<li><strong>تمرّن<\/strong> على بنك أسئلة المقابلة — أولًا كبطاقات، ثم بصوت عالٍ، ثم في مقابلات تجريبية.<\/li>\n<li><strong>أعد تقييم نفسك<\/strong> شهريًا بقائمة التقييم الذاتي؛ وادرس كل ما يحصل على ٣ أو أقل.<\/li>\n<li><strong>اشحن عملًا حقيقيًا<\/strong> — موقع متخصص، عميل، أو حملات جهة عملك. الدليل خريطة؛ والأرض هي حملة حيّة بأموال حقيقية.<\/li>\n<\/ol>"}, {"id": "sec-41", "num": 41, "part": "Part IV — Frontier & Regional", "part_ar": "الجزء الرابع — الحدود الجديدة والأسواق الإقليمية", "title": "AI Search Optimization (GEO / AEO)", "title_ar": "تحسين الظهور في بحث الذكاء الاصطناعي (GEO / AEO)", "html": "<p><strong>What it is:<\/strong> Making your brand the source that AI answer engines — Google's AI Overviews and AI Mode, ChatGPT search, Perplexity, Claude, Copilot — retrieve, trust, and cite. Classic SEO wins the blue links; GEO (Generative Engine Optimization) wins the answer above them.<\/p><div class=\"viz\"><div class=\"viz-cap\">How AI answer engines choose their sources<\/div><div class=\"flow\"><div class=\"fnode\"><b>Retrieval<\/b><span>the engine searches &amp; gathers pages<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>Extraction<\/b><span>favors clean, quotable answers<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Trust<\/b><span>third-party consensus<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>Synthesis<\/b><span>answer + citation<\/span><\/div><\/div><\/div>\n<h3>How AI answers choose sources<\/h3>\n<ol>\n<li><strong>Retrieval:<\/strong> the engine runs searches (often several \"fan-out\" queries) and pulls candidate pages — so crawlability and classic rankings still matter.<\/li>\n<li><strong>Extraction:<\/strong> it favors passages that answer cleanly — definitions, numbered steps, comparison tables, statistics with sources.<\/li>\n<li><strong>Trust weighting:<\/strong> brands mentioned consistently across reputable third-party sources (reviews, press, Reddit, Wikipedia, industry lists) get cited more often.<\/li>\n<li><strong>Synthesis:<\/strong> the model writes an answer and attributes some claims — the citation is the visibility; the click is a bonus.<\/li>\n<\/ol>\n<h3>The GEO playbook<\/h3>\n<ul>\n<li><strong>Answer-first formatting:<\/strong> open each section with a 40–60 word direct answer, then go deep. Use question-style headings that mirror real prompts.<\/li>\n<li><strong>Be quotable:<\/strong> original statistics, named frameworks, crisp definitions — content worth citing beats content worth skimming.<\/li>\n<li><strong>Entity clarity:<\/strong> the same brand name, description, and facts across your site, Google Business Profile, LinkedIn, directories, and Wikidata where eligible; add Organization, Product, and FAQ schema.<\/li>\n<li><strong>Earn third-party mentions:<\/strong> digital PR, review platforms, expert roundups, community discussions — AI engines lean on what others say about you.<\/li>\n<li><strong>Stay fresh:<\/strong> visible \"last updated\" dates on key pages; stale facts get dropped.<\/li>\n<li><strong>Decide on AI crawlers deliberately:<\/strong> review robots.txt rules for AI bots as a business decision, not a default.<\/li>\n<\/ul>\n<h3>Measuring AI visibility<\/h3>\n<p>Track a fixed set of buyer prompts (for example, 50 questions) monthly across the major assistants: are you mentioned, cited, and described accurately? Watch AI-platform referral traffic in GA4, branded search volume, and share of voice against competitors. Dedicated AI-visibility tools are young — spot-check them manually.<\/p>\n<h3>What doesn't change<\/h3>\n<p>Helpful, expert, original content and a trusted brand. GEO rewards the same fundamentals as SEO, with more weight on clarity, citations, and off-site reputation, and less on raw keyword targeting.<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> أن تجعل علامتك المصدر الذي تسترجعه محركات الإجابة بالذكاء الاصطناعي — ملخّصات جوجل بالذكاء الاصطناعي ووضع AI Mode، وبحث ChatGPT، وPerplexity، وClaude، وCopilot — وتثق به وتستشهد به. السيو الكلاسيكي يفوز بالروابط الزرقاء؛ وGEO يفوز بالإجابة فوقها.<\/p><div class=\"viz\"><div class=\"viz-cap\">كيف تختار محركات الذكاء الاصطناعي مصادرها<\/div><div class=\"flow\"><div class=\"fnode\"><b>الاسترجاع<\/b><span>يبحث المحرك ويجمع الصفحات<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>الاستخراج<\/b><span>يفضّل الإجابات الواضحة<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>الثقة<\/b><span>إشارات الطرف الثالث<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>التركيب<\/b><span>إجابة + استشهاد<\/span><\/div><\/div><\/div>\n<h3>كيف تختار إجابات الذكاء الاصطناعي مصادرها<\/h3>\n<ol>\n<li><strong>الاسترجاع:<\/strong> يجري المحرك عمليات بحث (غالبًا عدة استعلامات متفرّعة) ويجمع صفحات مرشّحة — لذا تبقى قابلية الزحف والترتيب الكلاسيكي مهمّين.<\/li>\n<li><strong>الاستخراج:<\/strong> يفضّل الفقرات التي تجيب بوضوح — تعريفات، خطوات مرقّمة، جداول مقارنة، إحصاءات بمصادرها.<\/li>\n<li><strong>وزن الثقة:<\/strong> العلامات المذكورة باستمرار عبر مصادر خارجية موثوقة (مراجعات، صحافة، Reddit، ويكيبيديا، قوائم القطاع) يُستشهد بها أكثر.<\/li>\n<li><strong>التركيب:<\/strong> يكتب النموذج الإجابة وينسب بعض الادعاءات — الاستشهاد هو الظهور، والنقرة مكافأة.<\/li>\n<\/ol>\n<h3>دليل GEO<\/h3>\n<ul>\n<li><strong>الإجابة أولًا:<\/strong> افتتح كل قسم بإجابة مباشرة من ٤٠–٦٠ كلمة ثم تعمّق. استخدم عناوين بصيغة أسئلة تحاكي الأسئلة الحقيقية.<\/li>\n<li><strong>كن قابلًا للاقتباس:<\/strong> إحصاءات أصلية، أطر مسمّاة، تعريفات حاسمة.<\/li>\n<li><strong>وضوح الكيان:<\/strong> الاسم والوصف والحقائق نفسها عبر موقعك وملفك على جوجل ولينكدإن والأدلّة وWikidata حيث يحق؛ أضف بيانات Organization وProduct وFAQ المنظّمة.<\/li>\n<li><strong>اكسب الإشارات الخارجية:<\/strong> علاقات عامة رقمية، منصّات مراجعات، تجميعات الخبراء، نقاشات المجتمعات.<\/li>\n<li><strong>حافظ على الحداثة:<\/strong> تاريخ «آخر تحديث» ظاهر على الصفحات المهمة.<\/li>\n<li><strong>قرّر بشأن زواحف الذكاء الاصطناعي عمدًا:<\/strong> راجع قواعد robots.txt كقرار عمل لا كإعداد افتراضي.<\/li>\n<\/ul>\n<h3>قياس الظهور في الذكاء الاصطناعي<\/h3>\n<p>تتبّع مجموعة ثابتة من أسئلة المشترين (مثلًا ٥٠ سؤالًا) شهريًا عبر المساعدات الرئيسية: هل تُذكر؟ هل يُستشهد بك؟ هل تُوصف بدقة؟ راقب زيارات الإحالة من منصّات الذكاء الاصطناعي في GA4، وحجم بحث العلامة، وحصّة الصوت مقابل المنافسين. أدوات القياس المتخصصة حديثة — تحقّق منها يدويًا.<\/p>\n<h3>ما الذي لا يتغيّر<\/h3>\n<p>المحتوى المفيد الخبير الأصلي والعلامة الموثوقة. GEO يكافئ أساسيات السيو نفسها، مع وزن أكبر للوضوح والاستشهادات والسمعة الخارجية، ووزن أقل لاستهداف الكلمات الخام.<\/p>"}, {"id": "sec-42", "num": 42, "part": "Part IV — Frontier & Regional", "part_ar": "الجزء الرابع — الحدود الجديدة والأسواق الإقليمية", "title": "Marketing in MENA & Arabic-Speaking Markets", "title_ar": "التسويق في الشرق الأوسط وشمال أفريقيا والأسواق العربية", "html": "<p><strong>Why it gets its own chapter:<\/strong> the Middle East and North Africa combine some of the world's highest smartphone and social usage (the Gulf) with large, fast-growing, price-sensitive markets (Egypt, Morocco, Iraq). Playbooks copied from the US or Europe often underperform here.<\/p><div class=\"viz\"><div class=\"viz-cap\">Four realities that change the playbook<\/div><div class=\"eq-row\"><div class=\"eq-tile\"><b>WhatsApp<\/b><span>the region's CRM<\/span><\/div><div class=\"eq-op\">+<\/div><div class=\"eq-tile\"><b>Ramadan<\/b><span>the peak season<\/span><\/div><div class=\"eq-op\">+<\/div><div class=\"eq-tile\"><b>Dialect<\/b><span>wins on social<\/span><\/div><div class=\"eq-op\">+<\/div><div class=\"eq-tile\"><b>Cash on delivery<\/b><span>design for confirmation<\/span><\/div><\/div><\/div>\n<h3>Channel realities<\/h3>\n<ul>\n<li><strong>WhatsApp is the CRM.<\/strong> Customers expect to ask, negotiate, and confirm orders on WhatsApp — build click-to-WhatsApp ads, catalog flows, and fast human replies into the funnel.<\/li>\n<li><strong>Snapchat and TikTok punch above their weight,<\/strong> especially with under-35s in Saudi Arabia and the Gulf.<\/li>\n<li><strong>Facebook is still a mass channel<\/strong> in Egypt, Iraq, and North Africa, alongside Instagram and TikTok.<\/li>\n<li><strong>YouTube dominates long-form Arabic video;<\/strong> X (Twitter) carries outsized weight for news and public conversation in the Gulf.<\/li>\n<\/ul>\n<h3>Language &amp; creative<\/h3>\n<ul>\n<li><strong>MSA vs. dialect:<\/strong> Modern Standard Arabic signals formality and suits corporate, legal, and pan-Arab content; dialect (Egyptian, Khaleeji, Levantine, Maghrebi) wins in social ads and video. Egyptian is the most widely understood dialect across the region.<\/li>\n<li><strong>Arabic SEO:<\/strong> people search in Arabic, in dialect, in Arabizi/\"Franco\" (Arabic in Latin letters), and in English — research all four. Quality Arabic content is scarcer, so strong pages can rank faster.<\/li>\n<li><strong>RTL design:<\/strong> mirror layouts, not just text — navigation, directional icons, progress bars, carousels.<\/li>\n<li><strong>Transcreate, don't translate:<\/strong> humor, references, and imagery need local adaptation.<\/li>\n<\/ul>\n<h3>Calendar &amp; commerce<\/h3>\n<ul>\n<li><strong>Ramadan<\/strong> is the region's peak season for media consumption and spending, with attention shifting to the evening and late night (Iftar to Suhoor). Eid al-Fitr and Eid al-Adha follow with gifting spikes.<\/li>\n<li><strong>White Friday / Yellow Friday<\/strong> replace Black Friday branding in many markets; 11.11 and back-to-school matter too.<\/li>\n<li><strong>Cash on delivery (COD)<\/strong> remains a large share of e-commerce orders in Egypt and parts of the region — design for order confirmation, refusal rates, and failed-delivery costs. BNPL services (Tabby, Tamara, valU) and wallets are growing fast.<\/li>\n<li><strong>Trust signals:<\/strong> local phone numbers, local-currency pricing, Arabic customer service, and visible return policies lift conversion noticeably.<\/li>\n<\/ul>\n<h3>Compliance snapshot<\/h3>\n<p>Data-protection laws now exist across the region — Saudi Arabia's PDPL, the UAE's PDPL, Egypt's Personal Data Protection Law — and influencer advertising is licensed in some markets (for example, the UAE and Saudi Arabia). Check current rules per country before launching.<\/p>\n<h3>MENA quick-start checklist<\/h3>\n<ul>\n<li>[ ] Click-to-WhatsApp funnel with replies under 5 minutes<\/li>\n<li>[ ] Dialect-specific ad creative for each target country<\/li>\n<li>[ ] Arabic + Arabizi + English keyword research<\/li>\n<li>[ ] Ramadan plan locked 6–8 weeks ahead<\/li>\n<li>[ ] COD confirmation flow and refusal-rate tracking<\/li>\n<li>[ ] Local payment options and Arabic support visible on site<\/li>\n<\/ul>", "html_ar": "<p><strong>لماذا له فصل خاص:<\/strong> تجمع المنطقة بين بعض أعلى معدّلات استخدام الهواتف والتواصل في العالم (الخليج) وأسواق كبيرة سريعة النمو حسّاسة للسعر (مصر، المغرب، العراق). الأدلّة المنسوخة من أمريكا أو أوروبا كثيرًا ما تُخفق هنا.<\/p><div class=\"viz\"><div class=\"viz-cap\">أربع حقائق تغيّر اللعبة في المنطقة<\/div><div class=\"eq-row\"><div class=\"eq-tile\"><b>واتساب<\/b><span>CRM المنطقة<\/span><\/div><div class=\"eq-op\">+<\/div><div class=\"eq-tile\"><b>رمضان<\/b><span>موسم الذروة<\/span><\/div><div class=\"eq-op\">+<\/div><div class=\"eq-tile\"><b>اللهجة<\/b><span>تفوز في التواصل<\/span><\/div><div class=\"eq-op\">+<\/div><div class=\"eq-tile\"><b>الدفع عند الاستلام<\/b><span>صمّم للتأكيد<\/span><\/div><\/div><\/div>\n<h3>واقع القنوات<\/h3>\n<ul>\n<li><strong>واتساب هو الـCRM.<\/strong> يتوقّع العملاء أن يسألوا ويفاوضوا ويؤكّدوا الطلبات على واتساب — ابنِ إعلانات «انقر لواتساب» وتدفّقات الكتالوج والردود البشرية السريعة داخل القمع.<\/li>\n<li><strong>سناب شات وتيك توك أقوى من حجمهما،<\/strong> خاصة مع من هم دون ٣٥ في السعودية والخليج.<\/li>\n<li><strong>فيسبوك ما زال قناة جماهيرية<\/strong> في مصر والعراق وشمال أفريقيا، بجانب إنستجرام وتيك توك.<\/li>\n<li><strong>يوتيوب يهيمن على الفيديو العربي الطويل؛<\/strong> وX (تويتر) له وزن كبير في الأخبار والنقاش العام في الخليج.<\/li>\n<\/ul>\n<h3>اللغة والإبداع<\/h3>\n<ul>\n<li><strong>الفصحى أم اللهجة:<\/strong> الفصحى توحي بالرسمية وتناسب المحتوى المؤسسي والقانوني والعربي العام؛ اللهجة (المصرية، الخليجية، الشامية، المغاربية) تفوز في إعلانات التواصل والفيديو. اللهجة المصرية الأوسع فهمًا في المنطقة.<\/li>\n<li><strong>السيو العربي:<\/strong> يبحث الناس بالفصحى وباللهجة وبـ«الفرانكو» (عربي بحروف لاتينية) وبالإنجليزية — ابحث في الأربعة. المحتوى العربي الجيد أندر، فالصفحات القوية قد تترتّب أسرع.<\/li>\n<li><strong>تصميم من اليمين لليسار:<\/strong> اعكس التخطيط لا النص فقط — التنقّل، الأيقونات الاتجاهية، أشرطة التقدّم، الكاروسيل.<\/li>\n<li><strong>أعد الإبداع لا تترجم:<\/strong> الفكاهة والمراجع والصور تحتاج تكييفًا محليًا.<\/li>\n<\/ul>\n<h3>التقويم والتجارة<\/h3>\n<ul>\n<li><strong>رمضان<\/strong> موسم الذروة لاستهلاك الوسائط والإنفاق، مع انتقال الانتباه إلى المساء والليل المتأخر (من الإفطار حتى السحور). يليه عيد الفطر وعيد الأضحى مع ذروات الهدايا.<\/li>\n<li><strong>الجمعة البيضاء / الصفراء<\/strong> تحلّ محلّ «الجمعة السوداء» في أسواق كثيرة؛ و١١.١١ والعودة للمدارس مهمّة أيضًا.<\/li>\n<li><strong>الدفع عند الاستلام<\/strong> ما زال حصّة كبيرة من طلبات التجارة الإلكترونية في مصر وأجزاء من المنطقة — صمّم لتأكيد الطلب ومعدّلات الرفض وتكلفة التوصيل الفاشل. خدمات «اشترِ الآن وادفع لاحقًا» (تابي، تمارا، ڤاليو) والمحافظ تنمو بسرعة.<\/li>\n<li><strong>إشارات الثقة:<\/strong> أرقام هواتف محلية، أسعار بالعملة المحلية، خدمة عملاء بالعربية، وسياسات إرجاع ظاهرة ترفع التحويل بوضوح.<\/li>\n<\/ul>\n<h3>لمحة الامتثال<\/h3>\n<p>قوانين حماية البيانات موجودة الآن عبر المنطقة — نظام حماية البيانات الشخصية السعودي، والقانون الإماراتي، وقانون حماية البيانات الشخصية المصري — كما أن إعلانات المؤثرين مرخّصة في بعض الأسواق (مثل الإمارات والسعودية). تحقّق من القواعد الحالية لكل دولة قبل الإطلاق.<\/p>\n<h3>قائمة البدء في المنطقة<\/h3>\n<ul>\n<li>[ ] قمع «انقر لواتساب» بردود أقل من ٥ دقائق<\/li>\n<li>[ ] إبداع إعلاني بلهجة كل دولة مستهدفة<\/li>\n<li>[ ] بحث كلمات بالعربية + الفرانكو + الإنجليزية<\/li>\n<li>[ ] خطة رمضان مكتملة قبل ٦–٨ أسابيع<\/li>\n<li>[ ] تدفّق تأكيد الدفع عند الاستلام وتتبّع معدّل الرفض<\/li>\n<li>[ ] خيارات دفع محلية ودعم عربي ظاهر على الموقع<\/li>\n<\/ul>"}], "practice": [{"id": "prac-1", "num": 1, "title": "Fundamentals & Funnel Math", "title_ar": "الأساسيات وحسابات القمع", "html": "<h3>🔧 Worked Example — The core equation in action<\/h3>\n<p>An online course business:\n- Traffic: 20,000 visitors/month\n- Conversion rate: 1.5% → 300 sales\n- Price: $100 → <strong>$30,000/month revenue<\/strong><\/p>\n<p>Three ways to double revenue, compared:\n| Lever | Change | New revenue | Typical cost |\n|---|---|---|---|\n| Traffic | 20k → 40k visits | $60,000 | High (ads/content at scale) |\n| Conversion | 1.5% → 3% | $60,000 | Medium (CRO program) |\n| Value | Add $50 order bump taken by 40% | $36,000 (+ higher LTV) | Low (one offer page) |<\/p>\n<p><strong>Lesson:<\/strong> experts stack levers — a 30% lift in each lever = 1.3³ ≈ <strong>2.2x revenue<\/strong>.<\/p>\n<h3>🧪 Test Case — CAC vs. LTV decision<\/h3>\n<p><strong>Given:<\/strong> SaaS at $50/month, average customer stays 14 months, gross margin 80%. Google Ads delivers signups at $180 CAC.\n<strong>Question:<\/strong> Is this channel viable? What's the payback period?<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><ul>\n<li>LTV = $50 × 14 × 0.80 = <strong>$560<\/strong><\/li>\n<li>LTV:CAC = 560/180 ≈ <strong>3.1:1<\/strong> ✅ (healthy threshold ≥3:1)<\/li>\n<li>Payback = 180 ÷ (50 × 0.80) = <strong>4.5 months<\/strong> ✅ (target &lt;12)<\/li>\n<li>Verdict: viable — and there's headroom to scale spend until marginal CAC pushes the ratio toward 3:1.<\/li>\n<\/ul><\/details><h3>🏋️ Exercise<\/h3>\n<p>Take any business you know. Estimate its traffic, conversion rate, and average value. Write three concrete initiatives — one per lever — and rank them by expected impact ÷ effort.<\/p>", "html_ar": "<h3>🔧 مثال محلول — المعادلة الجوهرية عمليًا<\/h3>\n<p>شركة دورات أونلاين:\n- الزيارات: 20,000 زائر شهريًا\n- معدّل التحويل: 1.5% ← 300 عملية بيع\n- السعر: 100$ ← <strong>إيراد 30,000$ شهريًا<\/strong><\/p>\n<p>ثلاث طرق لمضاعفة الإيراد:<\/p>\n<table>\n<thead>\n<tr>\n<th>الرافعة<\/th>\n<th>التغيير<\/th>\n<th>الإيراد الجديد<\/th>\n<th>التكلفة المعتادة<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>الزيارات<\/td>\n<td>من 20 ألفًا إلى 40 ألف زيارة<\/td>\n<td>60,000$<\/td>\n<td>عالية (إعلانات/محتوى)<\/td>\n<\/tr>\n<tr>\n<td>التحويل<\/td>\n<td>من 1.5% إلى 3%<\/td>\n<td>60,000$<\/td>\n<td>متوسطة (برنامج CRO)<\/td>\n<\/tr>\n<tr>\n<td>القيمة<\/td>\n<td>إضافة عرض 50$ يأخذه 40%<\/td>\n<td>36,000$ (+ LTV أعلى)<\/td>\n<td>منخفضة (صفحة عرض واحدة)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>الدرس:<\/strong> الخبراء يجمعون الروافع — رفع كل رافعة 30% = 1.3³ ≈ <strong>2.2× الإيراد<\/strong>.<\/p>\n<h3>🧪 حالة اختبار — CAC مقابل LTV<\/h3>\n<p><strong>المعطى:<\/strong> SaaS بـ50$ شهريًا، يبقى العميل 14 شهرًا، الهامش الإجمالي 80%. إعلانات جوجل تجلب تسجيلات بـCAC قدره 180$.\n<strong>السؤال:<\/strong> هل القناة مجدية؟ وما فترة الاسترداد؟<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><ul>\n<li>LTV = 50 × 14 × 0.80 = <strong>560$<\/strong><\/li>\n<li>LTV:CAC = 560/180 ≈ <strong>3.1:1<\/strong> ✅ (الحد الصحي ≥ 3:1)<\/li>\n<li>الاسترداد = 180 ÷ (50 × 0.80) = <strong>4.5 أشهر<\/strong> ✅ (الهدف أقل من 12)<\/li>\n<li>الحكم: مجدية — وهناك مساحة لزيادة الإنفاق حتى يقترب CAC الحدّي من نسبة 3:1.<\/li>\n<\/ul><\/details><h3>🏋️ تمرين<\/h3>\n<p>اختر نشاطًا تعرفه. قدّر زياراته ومعدّل تحويله ومتوسط قيمته. اكتب ثلاث مبادرات — واحدة لكل رافعة — ورتّبها حسب الأثر ÷ الجهد.<\/p>"}, {"id": "prac-2", "num": 2, "title": "SEO", "title_ar": "تحسين محركات البحث", "html": "<h3>🔧 Worked Example — Keyword-to-page mapping<\/h3>\n<p>A yoga studio in Austin researches keywords:<\/p>\n<table>\n<thead>\n<tr>\n<th>Keyword<\/th>\n<th>Volume<\/th>\n<th>Intent<\/th>\n<th>Page to build<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>yoga classes austin<\/td>\n<td>1,900<\/td>\n<td>Transactional/local<\/td>\n<td>Homepage + GBP<\/td>\n<\/tr>\n<tr>\n<td>hot yoga austin<\/td>\n<td>880<\/td>\n<td>Transactional<\/td>\n<td>Service page: Hot Yoga<\/td>\n<\/tr>\n<tr>\n<td>yoga for lower back pain<\/td>\n<td>8,100<\/td>\n<td>Informational<\/td>\n<td>Blog post → CTA to beginner class<\/td>\n<\/tr>\n<tr>\n<td>best yoga studios austin<\/td>\n<td>720<\/td>\n<td>Commercial<\/td>\n<td>Get listed in roundups (digital PR) + reviews<\/td>\n<\/tr>\n<tr>\n<td>how much do yoga classes cost<\/td>\n<td>1,300<\/td>\n<td>Commercial<\/td>\n<td>Pricing/FAQ page (They Ask, You Answer)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lesson:<\/strong> one keyword cluster = one page; intent decides the format, not volume.<\/p>\n<h3>🧪 Test Case — Diagnose the ranking problem<\/h3>\n<p><strong>Given:<\/strong> A page targeting \"best CRM for real estate\" has great content but sits at position 28. Site DR is 25; the top 10 results have DR 60–85 and 40+ referring domains each. On-page score is fine.\n<strong>Question:<\/strong> What's the bottleneck and the plan?<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Authority gap — content quality can't overcome a 40-referring-domain deficit on a commercial term. Plan: (a) build links to the page/site via original data + digital PR, (b) meanwhile target longer-tail versions winnable at DR 25 (\"best CRM for solo real estate agents\"), (c) strengthen internal links from existing ranking pages, (d) revisit the head term when DR grows.<\/p><\/details><h3>🧪 Test Case — Traffic drop triage<\/h3>\n<p><strong>Given:<\/strong> Organic traffic −45% starting the 12th of the month. Rankings in Search Console look stable. GA4 shows the drop across all channels, not just organic.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>If ALL channels dropped and rankings held → it's a <strong>tracking problem<\/strong>, not an SEO problem. Check: GA4 tag firing (Tag Assistant), recent site deploys removing the tag, consent-banner changes blocking analytics. (This trap catches real marketers monthly.)<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Run a free audit on any site: check indexation (<code>site:domain.com<\/code>), speed (PageSpeed Insights), titles/H1s on 5 key pages, and find 3 internal-link opportunities. Write a 1-page prioritized findings memo.<\/p>", "html_ar": "<h3>🔧 مثال محلول — ربط الكلمات بالصفحات<\/h3>\n<p>استوديو يوجا في القاهرة يبحث في الكلمات:<\/p>\n<table>\n<thead>\n<tr>\n<th>الكلمة<\/th>\n<th>الحجم<\/th>\n<th>النيّة<\/th>\n<th>الصفحة المطلوبة<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>كلاسات يوجا القاهرة<\/td>\n<td>1,900<\/td>\n<td>شرائية/محلية<\/td>\n<td>الرئيسية + ملف جوجل<\/td>\n<\/tr>\n<tr>\n<td>يوجا ساخنة القاهرة<\/td>\n<td>880<\/td>\n<td>شرائية<\/td>\n<td>صفحة خدمة: اليوجا الساخنة<\/td>\n<\/tr>\n<tr>\n<td>يوجا لآلام أسفل الظهر<\/td>\n<td>8,100<\/td>\n<td>معلوماتية<\/td>\n<td>مقال ← دعوة لكلاس المبتدئين<\/td>\n<\/tr>\n<tr>\n<td>أفضل استوديو يوجا<\/td>\n<td>720<\/td>\n<td>تجارية<\/td>\n<td>الظهور في القوائم + المراجعات<\/td>\n<\/tr>\n<tr>\n<td>سعر كلاسات اليوجا<\/td>\n<td>1,300<\/td>\n<td>تجارية<\/td>\n<td>صفحة أسعار وأسئلة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>الدرس:<\/strong> مجموعة كلمات واحدة = صفحة واحدة؛ والنيّة تحدّد الصيغة لا الحجم.<\/p>\n<h3>🧪 حالة اختبار — شخّص مشكلة الترتيب<\/h3>\n<p><strong>المعطى:<\/strong> صفحة تستهدف «أفضل CRM للعقارات» بمحتوى ممتاز لكنها في المركز 28. سلطة الموقع 25؛ أول 10 نتائج سلطتها 60–85 ولكل منها 40+ نطاقًا محيلًا. السيو الداخلي جيد.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>فجوة سلطة — جودة المحتوى لا تعوّض عجز 40 نطاقًا محيلًا في كلمة تجارية. الخطة: (أ) ابنِ روابط عبر بيانات أصلية وعلاقات عامة رقمية، (ب) استهدف مؤقتًا صيغًا أطول يمكن الفوز بها، (ج) قوِّ الروابط الداخلية من صفحات مترتّبة، (د) عُد للكلمة الرئيسية حين تنمو السلطة.<\/p><\/details><h3>🧪 حالة اختبار — فرز انخفاض الزيارات<\/h3>\n<p><strong>المعطى:<\/strong> الزيارات العضوية −45% بدءًا من يوم 12. الترتيب في Search Console مستقر. GA4 يُظهر الانخفاض في كل القنوات لا العضوية فقط.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>إن انخفضت <strong>كل<\/strong> القنوات وبقي الترتيب → إنها <strong>مشكلة تتبّع<\/strong> لا سيو. افحص: عمل وسم GA4، إطلاقات حديثة أزالت الوسم، تغييرات لافتة الموافقة التي تحجب التحليلات.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>دقّق أي موقع مجانًا: الفهرسة (<code>site:domain.com<\/code>)، السرعة (PageSpeed Insights)، العناوين وH1 في 5 صفحات رئيسية، و3 فرص ربط داخلي. اكتب مذكّرة نتائج مرتّبة من صفحة واحدة.<\/p>"}, {"id": "prac-3", "num": 3, "title": "PPC / Paid Media", "title_ar": "الإعلانات المدفوعة", "html": "<h3>🔧 Worked Example — Building a search campaign backward from economics<\/h3>\n<p>Divorce lawyer, average case value $8,000, closes 20% of consultations, wants ≤10% marketing cost.\n- Allowed cost per case: $800 → allowed <strong>CPA per consultation = $160<\/strong>\n- Landing page converts 8% → allowed <strong>CPC = $160 × 0.08 = $12.80<\/strong>\n- \"divorce lawyer austin\" CPCs run ~$15 → slightly underwater at current CVR.\n- <strong>Plan:<\/strong> raise CVR to 12% (allowed CPC becomes $19.20) via message-matched page + call tracking + social proof, THEN scale spend. CRO unlocked the channel.<\/p>\n<h3>🧪 Test Case — Where's the wasted spend?<\/h3>\n<p><strong>Given (search terms report):<\/strong>\n| Search term | Clicks | Cost | Conversions |\n|---|---|---|---|\n| emergency plumber near me | 210 | $1,470 | 31 |\n| plumber salary texas | 95 | $380 | 0 |\n| free plumbing advice | 64 | $256 | 0 |\n| water heater replacement cost | 180 | $900 | 12 |<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Add negatives: \"salary,\" \"jobs,\" \"free,\" \"advice\" (−$636 waste ≈ 21% of spend). \"Cost\" queries convert (research-with-intent) — keep, and build a pricing page to lift their CVR. Winner CPA: emergency = $47, water heater = $75 — shift budget toward emergency terms and check dayparting (emergencies are 24/7).<\/p><\/details><h3>🧪 Test Case — ROAS trap<\/h3>\n<p><strong>Given:<\/strong> Meta reports 5.2x ROAS. Blended MER is 2.1x and flat for 3 months while Meta spend doubled. New-customer share of Meta conversions: 22%.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Meta is largely claiming existing customers and organic demand (retargeting + view-through inflation). Actions: split campaigns/reporting by new vs. returning, cap retargeting budget, run a geo-holdout incrementality test, judge scaling by MER and new-customer CPA — not platform ROAS.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>In Meta Ads Library, find 5 ads from one competitor that have run 60+ days (longevity ≈ working). Reverse-engineer each: hook, angle, proof, offer, CTA. Write 3 ad concepts of your own using different angles.<\/p>", "html_ar": "<h3>🔧 مثال محلول — بناء حملة بحث من الاقتصاديات للخلف<\/h3>\n<p>محامي أحوال شخصية: متوسط قيمة القضية 8,000$، يغلق 20% من الاستشارات، ويريد ألا تتجاوز تكلفة التسويق 10%.\n- التكلفة المسموحة لكل قضية: 800$ ← <strong>CPA مسموح لكل استشارة = 160$<\/strong>\n- صفحة الهبوط تحوّل 8% ← <strong>CPC مسموح = 160 × 0.08 = 12.80$<\/strong>\n- تكلفة النقرة الفعلية ~15$ ← خاسر قليلًا بالتحويل الحالي.\n- <strong>الخطة:<\/strong> ارفع التحويل إلى 12% (يصبح CPC المسموح 19.20$) بصفحة متطابقة الرسالة وتتبّع مكالمات ودليل اجتماعي، <strong>ثم<\/strong> وسّع الإنفاق. الـCRO فتح القناة.<\/p>\n<h3>🧪 حالة اختبار — أين الإنفاق المهدر؟<\/h3>\n<p><strong>المعطى (تقرير مصطلحات البحث):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>مصطلح البحث<\/th>\n<th>النقرات<\/th>\n<th>التكلفة<\/th>\n<th>التحويلات<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>سبّاك طوارئ قريب مني<\/td>\n<td>210<\/td>\n<td>1,470$<\/td>\n<td>31<\/td>\n<\/tr>\n<tr>\n<td>راتب السبّاك<\/td>\n<td>95<\/td>\n<td>380$<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>نصائح سباكة مجانية<\/td>\n<td>64<\/td>\n<td>256$<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>تكلفة تغيير السخّان<\/td>\n<td>180<\/td>\n<td>900$<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>أضف كلمات سلبية: «راتب»، «وظائف»، «مجاني»، «نصائح» (هدر 636$ ≈ 21% من الإنفاق). استعلامات «التكلفة» تحوّل (بحث بنيّة) — أبقِها وابنِ صفحة أسعار لرفع تحويلها. CPA الفائز: الطوارئ 47$، السخّان 75$ — انقل الميزانية نحو الطوارئ وافحص الجدولة (الطوارئ على مدار الساعة).<\/p><\/details><h3>🧪 حالة اختبار — فخ ROAS<\/h3>\n<p><strong>المعطى:<\/strong> ميتا تُبلغ عن ROAS ‏5.2×. MER المدمج 2.1× وثابت منذ 3 أشهر رغم مضاعفة إنفاق ميتا. نسبة العملاء الجدد من تحويلات ميتا: 22%.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>ميتا تنسب لنفسها عملاء حاليين وطلبًا عضويًا (تضخّم إعادة الاستهداف والمشاهدة). الإجراءات: افصل الحملات والتقارير بين الجدد والعائدين، حدّد سقفًا لميزانية إعادة الاستهداف، أجرِ اختبار حجب جغرافي، واحكم على التوسّع بـMER وCPA العملاء الجدد — لا ROAS المنصّة.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>في مكتبة إعلانات ميتا، اعثر على 5 إعلانات لمنافس تعمل منذ 60+ يومًا (الاستمرار ≈ النجاح). فكّك كل واحد: الخطّاف، الزاوية، الدليل، العرض، الدعوة. اكتب 3 مفاهيم إعلانية بزوايا مختلفة.<\/p>"}, {"id": "prac-4", "num": 4, "title": "Content Marketing", "title_ar": "التسويق بالمحتوى", "html": "<h3>🔧 Worked Example — Hub &amp; spoke build<\/h3>\n<p>B2B payroll software targets \"payroll\" topical authority:\n- <strong>Pillar:<\/strong> \"Small Business Payroll: The Complete Guide\" (4,000 words, targets \"small business payroll\")\n- <strong>Spokes:<\/strong> payroll taxes by state → how to run payroll manually → payroll software vs. accountant (BOFU!) → payroll compliance checklist (lead magnet) → common payroll mistakes\n- All spokes link to the pillar and to each other; the comparison spoke and checklist carry the conversion load.\n<strong>Result pattern:<\/strong> BOFU comparison post = 3% of traffic, 40% of content-sourced demos.<\/p>\n<h3>🧪 Test Case — Fix this content program<\/h3>\n<p><strong>Given:<\/strong> A startup published 120 blog posts in a year. Traffic: 60k/month. Demo requests from blog: 11/month. Posts are all \"what is X\" definitions.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Classic all-TOFU program. Fix: (1) add BOFU content — \"[Product] vs [Competitor],\" pricing explainer, use-case pages, case studies; (2) add contextual CTAs and a content-upgrade lead magnet to the top 20 posts; (3) retarget blog readers; (4) update/consolidate the 80 posts with no traffic; (5) measure conversions per post, not volume published.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Take one long article (yours or anyone's) and repurpose it into: a LinkedIn text post, a 30-second video script, a 5-slide carousel outline, and a newsletter blurb. Time yourself — the target is under 90 minutes for all four.<\/p>", "html_ar": "<h3>🔧 مثال محلول — بناء المحور والأذرع<\/h3>\n<p>برنامج رواتب B2B يستهدف السلطة في موضوع «الرواتب»:\n- <strong>الركيزة:<\/strong> «رواتب الشركات الصغيرة: الدليل الكامل» (4,000 كلمة)\n- <strong>الأذرع:<\/strong> ضرائب الرواتب ← تشغيل الرواتب يدويًا ← برنامج الرواتب مقابل المحاسب (أسفل القمع!) ← قائمة الامتثال (مغناطيس جذب) ← أخطاء الرواتب الشائعة\n- كل الأذرع ترتبط بالركيزة وببعضها؛ ومقال المقارنة والقائمة يحملان عبء التحويل.\n<strong>النمط المعتاد:<\/strong> مقال المقارنة = 3% من الزيارات و40% من طلبات العروض من المحتوى.<\/p>\n<h3>🧪 حالة اختبار — أصلح برنامج المحتوى<\/h3>\n<p><strong>المعطى:<\/strong> شركة ناشئة نشرت 120 مقالًا في سنة. الزيارات 60 ألفًا شهريًا. طلبات العروض من المدوّنة: 11 شهريًا. كل المقالات تعريفات «ما هو X».<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>برنامج أعلى قمع بالكامل. الإصلاح: (1) أضف محتوى أسفل القمع — «[منتجك] مقابل [منافس]»، شرح الأسعار، صفحات حالات الاستخدام، دراسات الحالة؛ (2) دعوات سياقية وترقية محتوى في أهم 20 مقالًا؛ (3) أعد استهداف قرّاء المدوّنة؛ (4) حدّث أو ادمج الـ80 مقالًا بلا زيارات؛ (5) قِس التحويل لكل مقال لا عدد المنشور.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>خذ مقالًا طويلًا وحوّله إلى: منشور لينكدإن، سكريبت فيديو 30 ثانية، مخطّط كاروسيل من 5 شرائح، وفقرة نشرة. الهدف: أقل من 90 دقيقة للأربعة.<\/p>"}, {"id": "prac-5", "num": 5, "title": "Social Media", "title_ar": "مواقع التواصل", "html": "<h3>🔧 Worked Example — Reading a retention graph<\/h3>\n<p>A 45-second Reel shows: 100% start → 55% at 3s → 40% at 15s → 35% at 44s.\n- The 45% drop in 3 seconds = weak hook (fix: cut the intro, open on the payoff or claim).\n- The flat 15s→44s tail = content holds once people commit.\n<strong>Next iteration:<\/strong> same body, three new hooks tested. Hook B holds 70% at 3s → reach triples with identical content. <strong>The hook was the product.<\/strong><\/p>\n<h3>🧪 Test Case — Which post do you scale?<\/h3>\n<p><strong>Given (same account, same week):<\/strong>\n| Post | Reach | Likes | Comments | Saves | Shares | Link clicks |\n|---|---|---|---|---|---|---|\n| A | 40,000 | 2,100 | 40 | 55 | 60 | 25 |\n| B | 9,000 | 400 | 85 | 610 | 240 | 190 |<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Post B. Saves (6.8% of reach) and shares signal high value; 190 clicks from 9k reach crushes A's 25 from 40k. A is empty-calorie reach. Actions: turn B's format into a series, boost B as an ad, and put a stronger CTA on it.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Pick one platform. For 7 days: post daily using one repeatable format, spend 20 min/day commenting meaningfully in your niche, and log reach/saves/follows per post. Identify your outlier and produce 3 variations of it in week two.<\/p>", "html_ar": "<h3>🔧 مثال محلول — قراءة منحنى الاحتفاظ<\/h3>\n<p>ريل مدته 45 ثانية: 100% بداية ← 55% عند 3ث ← 40% عند 15ث ← 35% عند 44ث.\n- هبوط 45% في 3 ثوانٍ = خطّاف ضعيف (احذف المقدمة، ابدأ بالنتيجة أو الادعاء).\n- الذيل المستقر من 15ث إلى 44ث = المحتوى يحتفظ بمن التزم.\n<strong>التكرار التالي:<\/strong> نفس الجسم، ثلاثة خطّافات جديدة. الخطّاف (ب) يحتفظ بـ70% عند 3ث ← يتضاعف الوصول ثلاث مرات بنفس المحتوى. <strong>الخطّاف كان المنتج.<\/strong><\/p>\n<h3>🧪 حالة اختبار — أي منشور توسّع؟<\/h3>\n<p><strong>المعطى (نفس الحساب، نفس الأسبوع):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>المنشور<\/th>\n<th>الوصول<\/th>\n<th>إعجابات<\/th>\n<th>تعليقات<\/th>\n<th>حفظ<\/th>\n<th>مشاركة<\/th>\n<th>نقرات<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>أ<\/td>\n<td>40,000<\/td>\n<td>2,100<\/td>\n<td>40<\/td>\n<td>55<\/td>\n<td>60<\/td>\n<td>25<\/td>\n<\/tr>\n<tr>\n<td>ب<\/td>\n<td>9,000<\/td>\n<td>400<\/td>\n<td>85<\/td>\n<td>610<\/td>\n<td>240<\/td>\n<td>190<\/td>\n<\/tr>\n<\/tbody>\n<\/table><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>المنشور (ب). الحفظ (6.8% من الوصول) والمشاركة يدلّان على قيمة عالية؛ و190 نقرة من 9 آلاف وصول تسحق 25 من 40 ألفًا. (أ) وصول فارغ. الإجراءات: حوّل صيغة (ب) لسلسلة، روّجها كإعلان، وأضف دعوة أقوى.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اختر منصّة. لمدة 7 أيام: انشر يوميًا بصيغة واحدة قابلة للتكرار، علّق 20 دقيقة يوميًا في تخصصك، وسجّل الوصول والحفظ والمتابعات. حدّد المنشور الشاذ وأنتج 3 نسخ منه في الأسبوع الثاني.<\/p>"}, {"id": "prac-6", "num": 6, "title": "Email Marketing", "title_ar": "البريد الإلكتروني", "html": "<h3>🔧 Worked Example — Abandoned cart flow that pays for the software<\/h3>\n<p>Store: 10,000 monthly sessions, 3% reach cart (300), 70% abandon (210 carts), AOV $85.\nFlow: Email 1 at 1h (reminder) → Email 2 at 24h (objection handling + reviews) → Email 3 at 72h (10% incentive, expiring).\nRecovery at a typical 8%: 210 × 0.08 × $85 = <strong>$1,428/month ≈ $17k/year<\/strong> from three automated emails written once.<\/p>\n<h3>🧪 Test Case — Deliverability diagnosis<\/h3>\n<p><strong>Given:<\/strong> Open rate fell from 38% → 16% in six weeks. Sends unchanged. Complaint rate 0.4%. List grew 30% via a giveaway. Domain has SPF but no DKIM/DMARC.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Multiple compounding causes: giveaway added low-intent subscribers (engagement dilution → inbox-placement decay), complaints above the ~0.1–0.3% danger line, and missing authentication now penalized by Gmail/Yahoo bulk-sender rules. Fix order: (1) publish DKIM + DMARC now, (2) segment sends to engaged-90-days only to rebuild reputation, (3) run a win-back then sunset giveaway subscribers, (4) stop list-buying-style growth tactics.<\/p><\/details><h3>🧪 Test Case — Which subject line won?<\/h3>\n<p><strong>Given:<\/strong> A/B test, 10,000 recipients per arm. Arm A: 24% opens, 210 clicks, 18 purchases. Arm B: 31% opens, 195 clicks, 26 purchases.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>B — but not because of opens (unreliable post-Apple-privacy). Decide on the pre-chosen business metric: purchases (26 vs. 18, ~+44%). Clicks were similar, so B's audience was better qualified by the subject's framing. Lesson: pick the decision metric before the test; opens are directional only.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Write a 5-email welcome sequence for any brand: (1) deliver + quick win, (2) founder story, (3) best content/social proof, (4) objection-crusher FAQ, (5) first offer with deadline. One idea per email, one CTA per email.<\/p>", "html_ar": "<h3>🔧 مثال محلول — تدفّق السلة المتروكة يدفع ثمن البرنامج<\/h3>\n<p>متجر: 10,000 جلسة شهريًا، 3% تصل للسلة (300)، 70% يتركونها (210 سلة)، متوسط الطلب 85$.\nالتدفّق: رسالة 1 بعد ساعة (تذكير) ← رسالة 2 بعد 24 ساعة (اعتراضات + مراجعات) ← رسالة 3 بعد 72 ساعة (حافز 10% ينتهي).\nاسترداد بنسبة 8% معتادة: 210 × 0.08 × 85 = <strong>1,428$ شهريًا ≈ 17 ألف دولار سنويًا<\/strong> من ثلاث رسائل تُكتب مرة واحدة.<\/p>\n<h3>🧪 حالة اختبار — تشخيص التسليم<\/h3>\n<p><strong>المعطى:<\/strong> معدّل الفتح هبط من 38% إلى 16% في ستة أسابيع. الإرسال لم يتغيّر. الشكاوى 0.4%. القائمة نمت 30% عبر مسابقة هدايا. النطاق به SPF دون DKIM أو DMARC.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>أسباب متراكمة: المسابقة أضافت مشتركين منخفضي النيّة (تخفيف التفاعل ← تراجع الوصول للوارد)، الشكاوى فوق خط الخطر (~0.1–0.3%)، وغياب التوثيق يُعاقب الآن من جيميل وياهو. ترتيب الإصلاح: (1) انشر DKIM وDMARC فورًا، (2) أرسل للمتفاعلين خلال 90 يومًا فقط لإعادة بناء السمعة، (3) استعادة ثم إنهاء مشتركي المسابقة، (4) أوقف أساليب النمو الشبيهة بشراء القوائم.<\/p><\/details><h3>🧪 حالة اختبار — أي عنوان فاز؟<\/h3>\n<p><strong>المعطى:<\/strong> اختبار A/B بـ10,000 مستلم لكل فرع. (أ): فتح 24%، 210 نقرة، 18 عملية شراء. (ب): فتح 31%، 195 نقرة، 26 عملية شراء.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>(ب) — لكن ليس بسبب الفتح (غير موثوق بعد خصوصية أبل). احكم بمقياس العمل المحدّد مسبقًا: المشتريات (26 مقابل 18، ~+44%). النقرات متقاربة، فصياغة (ب) أهّلت جمهورًا أفضل. الدرس: حدّد مقياس القرار قبل الاختبار.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اكتب سلسلة ترحيب من 5 رسائل لأي علامة: (1) تسليم + مكسب سريع، (2) قصة المؤسس، (3) أفضل محتوى/دليل اجتماعي، (4) أسئلة تهدم الاعتراضات، (5) أول عرض بموعد نهائي. فكرة واحدة ودعوة واحدة لكل رسالة.<\/p>"}, {"id": "prac-7", "num": 7, "title": "Video & YouTube", "title_ar": "الفيديو ويوتيوب", "html": "<h3>🔧 Worked Example — Packaging before production<\/h3>\n<p>Topic: \"how to make sourdough.\"\n- Weak: title \"Sourdough Tutorial Part 3,\" thumbnail = kitchen wide shot.\n- Strong: title \"The 15-Minute Sourdough Method (No Kneading),\" thumbnail = extreme close-up of an open crumb + \"15 MIN?!\"\nSame video content; the strong package wins because YouTube optimizes for CTR × watch time — <strong>decide the promise (title/thumbnail) first, then make the video that delivers it.<\/strong><\/p>\n<h3>🧪 Test Case — Read the YouTube analytics<\/h3>\n<p><strong>Given:<\/strong> Video A: 9% CTR, 25% average view duration. Video B: 3.5% CTR, 62% AVD. Both got ~20k impressions.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>A over-promises (great package, content disappoints — clickbait decay; fix the delivery or honesty). B under-promises (great content nobody clicks; fix title/thumbnail). B is the better asset: re-package B with 3 thumbnail tests. The dream is A's package on B's retention.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Script a 30-second short with this structure: Hook (0–3s: the claim), Setup (3–8s: the stakes), Payoff steps (8–25s), CTA (25–30s). Film it on your phone in one take. Post it. Perfectionism is the enemy of reps.<\/p>", "html_ar": "<h3>🔧 مثال محلول — التغليف قبل الإنتاج<\/h3>\n<p>الموضوع: «كيف تصنع خبز الساوردو».\n- ضعيف: عنوان «شرح الساوردو الجزء 3»، صورة مصغّرة = لقطة واسعة للمطبخ.\n- قوي: عنوان «طريقة الساوردو في 15 دقيقة (بدون عجن)»، صورة مصغّرة = لقطة قريبة لقلب الخبز + «15 دقيقة؟!»\nنفس المحتوى؛ التغليف القوي يفوز لأن يوتيوب يحسّن للنقر × وقت المشاهدة — <strong>قرّر الوعد أولًا ثم اصنع الفيديو الذي يفي به.<\/strong><\/p>\n<h3>🧪 حالة اختبار — اقرأ تحليلات يوتيوب<\/h3>\n<p><strong>المعطى:<\/strong> فيديو (أ): نقر 9%، متوسط مشاهدة 25%. فيديو (ب): نقر 3.5%، متوسط مشاهدة 62%. كلاهما ~20 ألف ظهور.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>(أ) يبالغ في الوعد (تغليف رائع، محتوى مخيّب — أصلح المحتوى أو الصدق). (ب) يقلّل الوعد (محتوى رائع لا ينقره أحد — أصلح العنوان والصورة). (ب) الأصل الأفضل: أعد تغليفه باختبار 3 صور مصغّرة. الحلم: تغليف (أ) على احتفاظ (ب).<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اكتب سكريبت فيديو قصير 30 ثانية: خطّاف (0–3ث: الادعاء)، تمهيد (3–8ث: الرهان)، خطوات المكافأة (8–25ث)، دعوة (25–30ث). صوّره بهاتفك في لقطة واحدة وانشره. الكمالية عدو التكرار.<\/p>"}, {"id": "prac-8", "num": 8, "title": "Affiliate & Influencer", "title_ar": "العمولة والمؤثرون", "html": "<h3>🔧 Worked Example — Micro-influencer campaign math<\/h3>\n<p>DTC supplement brand, $60 AOV, 65% margin. Deal: 10 micro-influencers (20–50k followers), $300 flat + 15% commission + unique codes.\nResults: creator average 45 sales → 450 orders.\n- Revenue: $27,000 · Cost: $3,000 flat + $4,050 commission = $7,050 → <strong>3.8x ROAS<\/strong>\n- Bonus: 10 UGC videos licensed for ads — the best one becomes the top-performing Meta ad (its real value often exceeds the direct sales).<\/p>\n<h3>🧪 Test Case — Spot the fake influencer<\/h3>\n<p><strong>Given:<\/strong> Creator with 180k followers, 320 average likes, comments like \"🔥🔥\" and \"nice pic bro\" from accounts with no posts. Asked for audience demographics, they decline. Rate: $2,500/post.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Red flags everywhere: engagement rate 0.18% (healthy is 1–5%+), bot-pattern comments, refusal to share audience data. Pass — or offer commission-only. Vetting rule: pay for engaged, relevant audiences, not follower counts.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Build a one-page influencer brief for any product: campaign goal, key message + mandatory disclosure (#ad), creative freedom boundaries, deliverables, timeline, usage rights, tracking code/link, and payment terms.<\/p>", "html_ar": "<h3>🔧 مثال محلول — حسابات حملة مؤثرين مايكرو<\/h3>\n<p>علامة مكمّلات، متوسط طلب 60$، هامش 65%. الصفقة: 10 مؤثرين (20–50 ألف متابع)، 300$ ثابت + 15% عمولة + أكواد فريدة.\nالنتائج: متوسط 45 عملية بيع لكل مؤثر ← 450 طلبًا.\n- الإيراد: 27,000$ · التكلفة: 3,000$ ثابت + 4,050$ عمولة = 7,050$ ← <strong>ROAS ‏3.8×<\/strong>\n- مكافأة: 10 فيديوهات UGC مرخّصة للإعلانات — أفضلها يصبح أعلى إعلان أداءً على ميتا (قيمته الحقيقية غالبًا تتجاوز المبيعات المباشرة).<\/p>\n<h3>🧪 حالة اختبار — اكتشف المؤثر المزيّف<\/h3>\n<p><strong>المعطى:<\/strong> صانع محتوى بـ180 ألف متابع، متوسط 320 إعجابًا، تعليقات مثل «🔥🔥» و«صورة حلوة يا باشا» من حسابات بلا منشورات. يرفض مشاركة ديموغرافيا الجمهور. سعره 2,500$ للمنشور.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>علامات تحذير في كل مكان: تفاعل 0.18% (الصحي 1–5%+)، تعليقات بنمط الروبوتات، رفض مشاركة البيانات. ارفض — أو اعرض عمولة فقط. القاعدة: ادفع مقابل جماهير متفاعلة ملائمة لا أعداد متابعين.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اكتب إحاطة مؤثر من صفحة لأي منتج: هدف الحملة، الرسالة الأساسية + الإفصاح الإلزامي (#إعلان)، حدود الحرية الإبداعية، المُخرجات، الجدول، حقوق الاستخدام، كود/رابط التتبّع، وشروط الدفع.<\/p>"}, {"id": "prac-9", "num": 9, "title": "CRO", "title_ar": "تحسين التحويل", "html": "<h3>🔧 Worked Example — Full CRO cycle on a SaaS pricing page<\/h3>\n<p><strong>Research:<\/strong> recordings show 40% of users scroll past plans to the FAQ, hover between two tiers, and exit; survey exit question reveals confusion: \"not sure which plan fits me.\"\n<strong>Hypothesis:<\/strong> Because users can't self-select a plan, adding a \"most popular\" badge + a 3-question plan-picker quiz will increase trial starts.\n<strong>Test:<\/strong> A/B, 50/50, decision metric = trial starts, minimum run 2 full weeks.\n<strong>Result:<\/strong> +18% trial starts (baseline 4.2% → 5.0%), significant at 95%. Rolled out; follow-up test targets the quiz's recommendation copy.<\/p>\n<h3>🧪 Test Case — Sample size reality check<\/h3>\n<p><strong>Given:<\/strong> Landing page gets 2,000 visits/month, converts at 3%. Marketer wants to A/B test a headline hoping for +10% relative lift.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>~60 conversions/month total. Detecting a 10% relative lift (3.0%→3.3%) needs roughly 25,000–35,000 visitors <em>per variant<\/em> — over two years of traffic. Verdict: don't A/B test. Instead: make bigger, sequential changes (redesign vs. before/after cohorts), use qualitative research, and copy proven patterns. A/B testing is a high-traffic sport.<\/p><\/details><h3>🧪 Test Case — Prioritize the backlog (ICE)<\/h3>\n<p><strong>Given:<\/strong>\n| Idea | Impact | Confidence | Ease |\n|---|---|---|---|\n| Rewrite hero headline to outcome-focused | 8 | 7 | 9 |\n| Add exit-intent popup | 5 | 6 | 8 |\n| Rebuild checkout as single page | 9 | 6 | 2 |\n| Add 3 customer video testimonials | 6 | 7 | 5 |<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>ICE scores: headline 504, popup 240, checkout 108, testimonials 210 → <strong>headline first<\/strong> (classic result: highest-traffic element, near-zero cost). Checkout stays on the roadmap as a project, not a test.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Install Microsoft Clarity (free) on any site you control. After one week, watch 10 session recordings and write down 3 observed friction points and one hypothesis in the format: \"Because we observed X, we believe Y will improve Z.\"<\/p>", "html_ar": "<h3>🔧 مثال محلول — دورة CRO كاملة على صفحة أسعار SaaS<\/h3>\n<p><strong>البحث:<\/strong> التسجيلات تُظهر أن 40% يمرّون فوق الخطط إلى الأسئلة، يتردّدون بين باقتين، ثم يخرجون؛ واستبيان الخروج يكشف الحيرة: «لا أعرف أي خطة تناسبني».\n<strong>الفرضية:<\/strong> لأن المستخدمين لا يستطيعون اختيار خطة، فإن إضافة شارة «الأكثر شيوعًا» + اختبار من 3 أسئلة لاختيار الخطة سيزيد بدء التجارب.\n<strong>الاختبار:<\/strong> A/B بنسبة 50/50، مقياس القرار = بدء التجارب، أسبوعان كاملان على الأقل.\n<strong>النتيجة:<\/strong> +18% بدء تجارب (من 4.2% إلى 5.0%)، دال عند 95%. أُطلق؛ والاختبار التالي يستهدف نص توصية الاختبار.<\/p>\n<h3>🧪 حالة اختبار — واقع حجم العيّنة<\/h3>\n<p><strong>المعطى:<\/strong> صفحة هبوط بـ2,000 زيارة شهريًا وتحويل 3%. المسوّق يريد اختبار عنوان آملًا رفعًا نسبيًا 10%.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>~60 تحويلًا شهريًا. اكتشاف رفع 10% (من 3.0% إلى 3.3%) يحتاج تقريبًا 25,000–35,000 زائر <strong>لكل نسخة<\/strong> — أكثر من سنتين من الزيارات. الحكم: لا تختبر A/B. بدلًا من ذلك: تغييرات أكبر تسلسلية، بحث نوعي، ونسخ أنماط مثبتة. A/B رياضة الزيارات العالية.<\/p><\/details><h3>🧪 حالة اختبار — رتّب القائمة (ICE)<\/h3>\n<p><strong>المعطى:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>الفكرة<\/th>\n<th>الأثر<\/th>\n<th>الثقة<\/th>\n<th>السهولة<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>إعادة كتابة العنوان الرئيسي حول النتيجة<\/td>\n<td>8<\/td>\n<td>7<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>نافذة نيّة الخروج<\/td>\n<td>5<\/td>\n<td>6<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>إعادة بناء الدفع في صفحة واحدة<\/td>\n<td>9<\/td>\n<td>6<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>3 شهادات فيديو للعملاء<\/td>\n<td>6<\/td>\n<td>7<\/td>\n<td>5<\/td>\n<\/tr>\n<\/tbody>\n<\/table><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>النتائج: العنوان 504، النافذة 240، الدفع 108، الشهادات 210 ← <strong>العنوان أولًا<\/strong> (نتيجة كلاسيكية: أكثر عنصر مشاهدة بتكلفة شبه صفرية). إعادة بناء الدفع تبقى مشروعًا في الخطة لا اختبارًا.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>ثبّت Microsoft Clarity المجاني على موقع تتحكّم فيه. بعد أسبوع، شاهد 10 تسجيلات واكتب 3 نقاط احتكاك وفرضية واحدة بصيغة: «لأننا لاحظنا X، نعتقد أن Y سيحسّن Z».<\/p>"}, {"id": "prac-10", "num": 10, "title": "Analytics", "title_ar": "التحليلات", "html": "<h3>🔧 Worked Example — UTM discipline<\/h3>\n<p>A campaign link for a spring-sale email:\n<code>https://store.com/sale?utm_source=klaviyo&amp;utm_medium=email&amp;utm_campaign=spring-sale-2026&amp;utm_content=header-cta<\/code>\nNow GA4 can answer: did the header CTA or footer CTA drive more revenue? Which campaign, which channel? Without UTMs this traffic lands in \"direct\" — unmeasurable. <strong>Rule:<\/strong> every link you control gets tagged; document the naming convention (lowercase, hyphens, no spaces) in a shared sheet.<\/p>\n<h3>🧪 Test Case — Attribution storytelling<\/h3>\n<p><strong>Given (one customer's journey):<\/strong> TikTok video view → Google search \"brand name\" → click brand search ad → visit, no purchase → abandoned-cart email → purchase ($120).\n<strong>Question:<\/strong> Who gets credit under last-click? What's the risk of that model?<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Last-click credits the email; the brand-search ad claims it in Google's view. TikTok — which created the demand — gets zero. Risk: budget reallocation away from demand creation toward demand harvesting, which slowly starves the funnel. Mitigation: view multiple models, track branded-search volume as a TikTok KPI, run incrementality tests.<\/p><\/details><h3>🧪 Test Case — Build the weekly report<\/h3>\n<p><strong>Given:<\/strong> E-com store data this week: spend $8,400, revenue $21,000 (last week $19,500 on $7,000), sessions 41k (flat), CVR 2.1% (down from 2.3%), AOV $92 (up from $85), email revenue share 24%.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>MER fell 2.79→2.50: spend grew 20% but revenue grew only 7.7% — diminishing returns on the marginal spend. CVR dip offset by AOV gain (likely mix shift to higher-priced items). Action: identify which campaigns absorbed the extra $1,400 and check their marginal CPA; hold spend flat next week and test creative instead of budget.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Build a one-page Looker Studio dashboard for any GA4 property: sessions by channel, conversions by channel, top landing pages, and week-over-week trend. Add one text box: \"This week's insight and action.\"<\/p>", "html_ar": "<h3>🔧 مثال محلول — انضباط UTM<\/h3>\n<p>رابط حملة بريدية لتخفيضات الربيع:\n<code>https://store.com/sale?utm_source=klaviyo&amp;utm_medium=email&amp;utm_campaign=spring-sale-2026&amp;utm_content=header-cta<\/code>\nالآن يجيب GA4: هل دعوة الترويسة أم التذييل حقّقت إيرادًا أكثر؟ أي حملة وأي قناة؟ بدون UTM تذهب هذه الزيارات إلى «مباشر» — غير قابلة للقياس. <strong>القاعدة:<\/strong> كل رابط تتحكّم فيه يُوسَم؛ ووثّق قاعدة التسمية في جدول مشترك.<\/p>\n<h3>🧪 حالة اختبار — قصة الإسناد<\/h3>\n<p><strong>المعطى (رحلة عميل):<\/strong> مشاهدة فيديو تيك توك ← بحث جوجل عن اسم العلامة ← نقر إعلان بحث العلامة ← زيارة بلا شراء ← رسالة سلة متروكة ← شراء (120$).\n<strong>السؤال:<\/strong> من يأخذ الفضل في آخر نقرة؟ وما خطر هذا النموذج؟<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>آخر نقرة تنسب الفضل للبريد؛ وجوجل ينسبه لإعلان العلامة. تيك توك — الذي صنع الطلب — يحصل على صفر. الخطر: نقل الميزانية من صناعة الطلب لحصاده، ما يجوّع القمع ببطء. العلاج: انظر لنماذج متعدّدة، تابع حجم بحث العلامة كمؤشر لتيك توك، وأجرِ اختبارات زيادة فعلية.<\/p><\/details><h3>🧪 حالة اختبار — ابنِ التقرير الأسبوعي<\/h3>\n<p><strong>المعطى:<\/strong> متجر هذا الأسبوع: إنفاق 8,400$، إيراد 21,000$ (الأسبوع الماضي 19,500$ بإنفاق 7,000$)، جلسات 41 ألفًا (ثابتة)، تحويل 2.1% (من 2.3%)، متوسط طلب 92$ (من 85$)، حصّة إيراد البريد 24%.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>MER هبط من 2.79 إلى 2.50: الإنفاق زاد 20% والإيراد 7.7% فقط — عوائد متناقصة على الإنفاق الحدّي. انخفاض التحويل عوّضه ارتفاع متوسط الطلب (غالبًا تحوّل في المزيج نحو منتجات أغلى). الإجراء: حدّد الحملات التي امتصّت الـ1,400$ الإضافية وافحص CPA الحدّي لها؛ ثبّت الإنفاق الأسبوع القادم واختبر الإبداع بدل الميزانية.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>ابنِ لوحة Looker Studio من صفحة واحدة لأي حساب GA4: الجلسات حسب القناة، التحويلات حسب القناة، أهم صفحات الهبوط، والاتجاه الأسبوعي. أضف مربّع نص: «بصيرة هذا الأسبوع والإجراء».<\/p>"}, {"id": "prac-11", "num": 11, "title": "Marketing Automation & AI", "title_ar": "الأتمتة والذكاء الاصطناعي", "html": "<h3>🔧 Worked Example — Lead scoring model<\/h3>\n<p>B2B webinar platform scores leads:\n- Fit: +20 company size 50+, +15 title contains \"marketing,\" −30 student/free email domain\n- Behavior: +10 pricing page, +15 attends webinar, +5 each email click, −10 inactive 30 days\n- Threshold: ≥50 = MQL → routed to sales within 5 minutes (speed-to-lead is a top conversion factor); 20–49 = nurture track; &lt;20 = newsletter only.\n<strong>Result pattern:<\/strong> sales works 40% fewer leads with a higher close rate — both teams happier.<\/p>\n<h3>🧪 Test Case — Design the workflow<\/h3>\n<p><strong>Given:<\/strong> SaaS free trial, 14 days. 60% of trials never complete setup; setup-completers convert to paid at 35%, non-completers at 4%.\n<strong>Question:<\/strong> Design the automation.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Trigger on signup → Day 0 welcome with ONE action (complete setup) → branch: if setup NOT done in 48h → email 2 (video walkthrough) + in-app message; still not done day 5 → offer live onboarding call (human intervention where math justifies it) → completers enter feature-adoption sequence → day 11 trial-ending + upgrade offer → non-converters get a 7-day extension offer, then downgrade-to-newsletter. The entire flow optimizes ONE metric: setup completion, because it 9x's conversion.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Using Zapier/Make free tier, automate: new form submission → row in a sheet → notification in Slack/email → contact added to your email tool. This four-step zap is the \"hello world\" of marketing ops.<\/p>", "html_ar": "<h3>🔧 مثال محلول — نموذج تسجيل العملاء<\/h3>\n<p>منصّة ندوات B2B تسجّل العملاء:\n- الملاءمة: +20 حجم الشركة 50+، +15 المسمّى يحتوي «تسويق»، −30 طالب أو بريد مجاني\n- السلوك: +10 صفحة الأسعار، +15 حضور ندوة، +5 لكل نقرة بريد، −10 خمول 30 يومًا\n- العتبة: ≥50 = MQL ← يُوجَّه للمبيعات خلال 5 دقائق (سرعة الرد من أهم عوامل التحويل)؛ 20–49 = مسار تغذية؛ أقل من 20 = النشرة فقط.\n<strong>النمط المعتاد:<\/strong> المبيعات تعمل على عملاء أقل بـ40% بمعدّل إغلاق أعلى — والفريقان أسعد.<\/p>\n<h3>🧪 حالة اختبار — صمّم التدفّق<\/h3>\n<p><strong>المعطى:<\/strong> تجربة SaaS مجانية 14 يومًا. 60% لا يكملون الإعداد؛ من يكملونه يتحوّلون للدفع بنسبة 35%، ومن لا يكملونه بنسبة 4%.\n<strong>السؤال:<\/strong> صمّم الأتمتة.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>مُشغِّل عند التسجيل ← يوم 0 ترحيب بإجراء <strong>واحد<\/strong> (أكمل الإعداد) ← تفرّع: إن لم يكتمل خلال 48 ساعة ← رسالة 2 (فيديو شرح) + رسالة داخل التطبيق؛ إن لم يكتمل يوم 5 ← عرض مكالمة إعداد حيّة (تدخّل بشري حيث تبرّره الحسابات) ← المكملون يدخلون سلسلة تبنّي الخصائص ← يوم 11 انتهاء التجربة + عرض الترقية ← غير المتحوّلين يحصلون على عرض تمديد 7 أيام ثم النشرة. التدفّق كله يحسّن مقياسًا <strong>واحدًا<\/strong>: إكمال الإعداد، لأنه يضاعف التحويل 9 مرات.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>باستخدام Zapier أو Make المجاني، أتمت: إرسال نموذج جديد ← صف في جدول ← إشعار في Slack أو البريد ← إضافة جهة الاتصال لأداة البريد. هذا «Hello World» عمليات التسويق.<\/p>"}, {"id": "prac-12", "num": 12, "title": "Budgeting & Strategy", "title_ar": "الميزانية والاستراتيجية", "html": "<h3>🔧 Worked Example — Backward budget plan<\/h3>\n<p>Goal: 200 new customers next quarter. Historical: site converts visitors→lead at 4%, lead→customer 10%.\n- Customers needed: 200 → leads needed: 2,000 → visits needed: 50,000\n- Channel plan (blended): SEO/content 15k visits (existing momentum, ~$6k content cost), paid search 20k visits at $1.5 CPC = $30k, paid social 15k visits at $0.8 = $12k\n- Budget: <strong>$48k → implied CAC $240.<\/strong> Check vs. LTV $900 → 3.75:1 ✅. Now the plan is defensible in any boardroom.<\/p>\n<h3>🧪 Test Case — The 70/20/10 allocation<\/h3>\n<p><strong>Given:<\/strong> $50k/quarter. Proven: Google Search (3.2x MER contribution). Promising: TikTok ads (early tests at breakeven). Unproven ideas: podcast sponsorships, influencer seeding.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>$35k Google (scale until marginal CPA breaches target), $10k TikTok (creative-testing budget with a kill/scale decision gate at week 6), $5k split across two experiments with defined success metrics (e.g., promo-code redemptions, branded-search lift). Every dollar has a job and a review date.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Write a one-page media plan for an imaginary product: objective, audience, 3 channels with budget split and rationale, KPIs per channel, and the date/criteria you'll use to kill or scale each.<\/p>", "html_ar": "<h3>🔧 مثال محلول — خطة الميزانية من الخلف<\/h3>\n<p>الهدف: 200 عميل جديد الربع القادم. تاريخيًا: الموقع يحوّل الزوّار إلى عملاء محتملين بنسبة 4%، والعملاء المحتملين إلى عملاء بنسبة 10%.\n- العملاء المطلوبون: 200 ← العملاء المحتملون: 2,000 ← الزيارات: 50,000\n- خطة القنوات (مدمجة): سيو/محتوى 15 ألف زيارة (زخم قائم، ~6 آلاف دولار محتوى)، بحث مدفوع 20 ألف زيارة بتكلفة نقرة 1.5$ = 30 ألف دولار، تواصل مدفوع 15 ألف زيارة بـ0.8$ = 12 ألف دولار\n- الميزانية: <strong>48 ألف دولار ← CAC ضمني 240$.<\/strong> قارنه بـLTV قدره 900$ ← ‏3.75:1 ✅. الآن الخطة قابلة للدفاع أمام أي مجلس إدارة.<\/p>\n<h3>🧪 حالة اختبار — توزيع 70/20/10<\/h3>\n<p><strong>المعطى:<\/strong> 50 ألف دولار للربع. مثبت: بحث جوجل (مساهمة MER ‏3.2×). واعد: إعلانات تيك توك (اختبارات مبكرة عند التعادل). أفكار غير مثبتة: رعاية بودكاست، بذر مؤثرين.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>35 ألفًا لجوجل (توسّع حتى يتجاوز CPA الحدّي الهدف)، 10 آلاف لتيك توك (ميزانية اختبار إبداع مع بوابة قرار إيقاف/توسيع في الأسبوع 6)، و5 آلاف مقسّمة على تجربتين بمقاييس نجاح محدّدة (مثل استخدام أكواد الخصم، ارتفاع بحث العلامة). لكل دولار مهمة وتاريخ مراجعة.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اكتب خطة وسائط من صفحة واحدة لمنتج خيالي: الهدف، الجمهور، 3 قنوات بتوزيع الميزانية والمبرّر، مؤشرات لكل قناة، والتاريخ والمعايير التي ستستخدمها لإيقاف أو توسيع كل منها.<\/p>"}, {"id": "prac-13", "num": 13, "title": "Local SEO & E-commerce Quick Cases", "title_ar": "السيو المحلي والتجارة الإلكترونية", "html": "<h3>🧪 Test Case — Local visibility<\/h3>\n<p><strong>Given:<\/strong> Dentist ranks #1 organically but doesn't appear in the map pack. GBP exists but has 4 photos, 12 reviews (competitor average: 150+), and the category is \"doctor.\"<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Map pack ≠ organic. Fix GBP: correct primary category (\"Dentist\") + secondary categories, weekly photos/posts, review-generation system (post-appointment SMS with direct link; respond to every review), build local citations with consistent NAP, and embed the map/schema on the site. Reviews volume + category are the levers.<\/p><\/details><h3>🧪 Test Case — E-commerce funnel leak<\/h3>\n<p><strong>Given:<\/strong> 100,000 sessions → 8,000 product views (8%) → 1,200 add-to-cart (15%) → 900 reach checkout (75%) → 270 purchase (30% checkout completion). Industry checkout completion ~45–55%.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>The leak is checkout completion (30% vs. ~50% benchmark ≈ 180 lost orders). Suspects in order: surprise shipping costs (the #1 abandonment cause), forced account creation, limited payment options (add wallets/BNPL), and slow mobile checkout. Also low product-view rate (8%) suggests weak on-site discovery — but fix the bottom of the funnel first: it pays back on ALL traffic immediately.<\/p><\/details><hr />", "html_ar": "<h3>🧪 حالة اختبار — الظهور المحلي<\/h3>\n<p><strong>المعطى:<\/strong> طبيب أسنان في المركز الأول عضويًا لكنه لا يظهر في حزمة الخريطة. الملف التجاري على جوجل موجود لكن به 4 صور، و12 مراجعة (متوسط المنافسين 150+)، والفئة «طبيب».<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>حزمة الخريطة ≠ الترتيب العضوي. أصلح الملف: الفئة الأساسية الصحيحة («طبيب أسنان») + فئات ثانوية، صور ومنشورات أسبوعية، نظام لتوليد المراجعات (رسالة بعد الموعد برابط مباشر؛ والرد على كل مراجعة)، اقتباسات محلية بـNAP متّسق، وتضمين الخريطة والبيانات المنظّمة في الموقع. عدد المراجعات والفئة هما الرافعتان.<\/p><\/details><h3>🧪 حالة اختبار — تسريب قمع التجارة الإلكترونية<\/h3>\n<p><strong>المعطى:<\/strong> 100,000 جلسة ← 8,000 مشاهدة منتج (8%) ← 1,200 إضافة للسلة (15%) ← 900 يصلون للدفع (75%) ← 270 عملية شراء (إكمال دفع 30%). معيار القطاع لإكمال الدفع ~45–55%.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>التسريب في إكمال الدفع (30% مقابل ~50% ≈ 180 طلبًا ضائعًا). المشتبه بهم بالترتيب: تكاليف شحن مفاجئة (السبب الأول للترك)، فرض إنشاء حساب، خيارات دفع محدودة (أضف المحافظ و«اشترِ الآن وادفع لاحقًا»)، وبطء الدفع على الجوال. انخفاض مشاهدة المنتجات (8%) يشير أيضًا لضعف الاكتشاف داخل الموقع — لكن أصلح أسفل القمع أولًا: يعود أثره على <strong>كل<\/strong> الزيارات فورًا.<\/p><\/details>"}, {"id": "prac-14", "num": 14, "title": "Capstone Simulation — Put It All Together", "title_ar": "محاكاة ختامية شاملة", "html": "<p><strong>Scenario:<\/strong> You've joined \"BrewMate,\" a $40 smart coffee-scale DTC brand. Monthly: $60k revenue, $25k ad spend (all Meta, 2.4x reported ROAS, MER 2.4 and falling), 45k sessions, 1.9% CVR, 12k email list generating 8% of revenue, no SEO presence, 6k Instagram followers.<\/p>\n<p><strong>Your 90-day plan (model answer):<\/strong>\n1. <strong>Week 1–2, foundation:<\/strong> verify tracking (GA4 + CAPI + UTMs), install Clarity, baseline every metric above.\n2. <strong>Diversify capture:<\/strong> launch Google brand + high-intent search (\"coffee scale,\" \"pour over scale\") — cheap conversions Meta is probably claiming anyway.\n3. <strong>Email to 20%+ of revenue:<\/strong> popup with a brew-guide lead magnet (target 3% opt-in), build abandoned-cart, browse, and post-purchase flows (recipes → accessories cross-sell).\n4. <strong>CRO sprint:<\/strong> message-matched landing page for ads (not the homepage), reviews above the fold, test bundle offer to raise $40 AOV (the real constraint — low AOV caps allowable CAC).\n5. <strong>Creative engine for Meta:<\/strong> 15 UGC-style creatives via micro-influencer seeding (product + commission); scale winners, cap retargeting.\n6. <strong>SEO seed:<\/strong> hub-and-spoke around \"coffee brewing ratios/guides\" — high-volume, perfect-fit informational demand feeding email capture.\n7. <strong>Measure:<\/strong> weekly MER, new-customer CPA, email revenue share, CVR — with a geo-holdout on Meta in month 3 to test incrementality.\n<strong>Success at day 90:<\/strong> MER ≥2.8, email ≥18% of revenue, CVR ≥2.4%, one non-Meta channel proven.<\/p>", "html_ar": "<p><strong>السيناريو:<\/strong> انضممت إلى «BrewMate»، علامة مباشرة للمستهلك تبيع ميزان قهوة ذكي بـ40$. شهريًا: إيراد 60 ألف دولار، إنفاق إعلاني 25 ألفًا (كله ميتا، ROAS مُبلغ 2.4× وMER ‏2.4 ويتراجع)، 45 ألف جلسة، تحويل 1.9%، قائمة بريد 12 ألفًا تحقّق 8% من الإيراد، لا حضور في السيو، 6 آلاف متابع على إنستجرام.<\/p>\n<p><strong>خطتك لـ90 يومًا (إجابة نموذجية):<\/strong>\n1. <strong>الأسبوع 1–2، الأساس:<\/strong> تحقّق من التتبّع (GA4 + CAPI + UTM)، ثبّت Clarity، وسجّل خط الأساس لكل مقياس أعلاه.\n2. <strong>نوّع الالتقاط:<\/strong> أطلق بحث جوجل للعلامة + نيّة عالية («ميزان قهوة»، «ميزان بور أوفر») — تحويلات رخيصة تنسبها ميتا لنفسها غالبًا على أي حال.\n3. <strong>البريد إلى 20%+ من الإيراد:<\/strong> نافذة بمغناطيس «دليل التحضير» (هدف 3% اشتراك)، وابنِ تدفّقات السلة المتروكة والتصفّح وما بعد الشراء (وصفات ← بيع متقاطع للإكسسوارات).\n4. <strong>دفعة CRO:<\/strong> صفحة هبوط متطابقة الرسالة للإعلانات (لا الرئيسية)، مراجعات أعلى الصفحة، واختبار عرض حزمة لرفع متوسط الطلب البالغ 40$ (القيد الحقيقي — متوسط الطلب المنخفض يحدّ CAC المسموح).\n5. <strong>محرّك إبداع لميتا:<\/strong> 15 إبداعًا بأسلوب UGC عبر بذر مؤثرين مايكرو (منتج + عمولة)؛ وسّع الفائزين وحدّد سقف إعادة الاستهداف.\n6. <strong>بذرة السيو:<\/strong> محور وأذرع حول «نسب ودلائل تحضير القهوة» — طلب معلوماتي كبير ملائم تمامًا يغذّي التقاط البريد.\n7. <strong>القياس:<\/strong> MER أسبوعيًا، CPA العملاء الجدد، حصّة إيراد البريد، التحويل — مع اختبار حجب جغرافي على ميتا في الشهر الثالث لقياس الزيادة الفعلية.<\/p>\n<p><strong>النجاح في اليوم 90:<\/strong> MER ≥ ‏2.8، البريد ≥ 18% من الإيراد، التحويل ≥ 2.4%، وقناة واحدة مثبتة خارج ميتا.<\/p>"}, {"id": "prac-15", "num": 15, "title": "Self-Assessment Checklist", "title_ar": "قائمة تقييم ذاتي", "html": "<p>Rate yourself 1–5 on each; anything ≤3 tells you what to study next:<\/p>\n<ul>\n<li>[ ] I can calculate CAC, LTV, ROAS, MER and explain their relationships<\/li>\n<li>[ ] I can do keyword research and map keywords to pages by intent<\/li>\n<li>[ ] I can build and structure a search campaign from scratch<\/li>\n<li>[ ] I can read a search-terms report and cut waste<\/li>\n<li>[ ] I can design a content hub with TOFU/MOFU/BOFU balance<\/li>\n<li>[ ] I can explain why a social post over/under-performed using retention and engagement signals<\/li>\n<li>[ ] I can build a welcome sequence and an abandoned-cart flow<\/li>\n<li>[ ] I can diagnose a deliverability problem<\/li>\n<li>[ ] I can set up GA4 events, UTMs, and a basic dashboard<\/li>\n<li>[ ] I can form a CRO hypothesis from research and know when A/B testing is (in)valid<\/li>\n<li>[ ] I can design a lead-scoring model and a lifecycle workflow<\/li>\n<li>[ ] I can build a budget backward from a revenue goal<\/li>\n<li>[ ] I can explain attribution's limits to an executive without jargon<\/li>\n<\/ul>\n<p><strong>Score 52–65:<\/strong> expert-track. <strong>39–51:<\/strong> strong intermediate. <strong>Below 39:<\/strong> you now know exactly which chapters to revisit — that's the point.<\/p>\n<p><em>Knowledge is what you can explain; skill is what you can execute under constraints. Every test case above has appeared, in some form, as a real interview question or a real Monday-morning problem.<\/em><\/p>", "html_ar": "<p>قيّم نفسك من 1 إلى 5 في كل بند؛ كل ما يحصل على 3 أو أقل يخبرك بما تدرسه بعد ذلك:<\/p>\n<ul>\n<li>[ ] أستطيع حساب CAC وLTV وROAS وMER وشرح العلاقات بينها<\/li>\n<li>[ ] أستطيع بحث الكلمات وربطها بالصفحات حسب النيّة<\/li>\n<li>[ ] أستطيع بناء حملة بحث وهيكلتها من الصفر<\/li>\n<li>[ ] أستطيع قراءة تقرير مصطلحات البحث وقطع الهدر<\/li>\n<li>[ ] أستطيع تصميم محور محتوى بتوازن TOFU/MOFU/BOFU<\/li>\n<li>[ ] أستطيع شرح سبب تفوّق منشور أو إخفاقه بإشارات الاحتفاظ والتفاعل<\/li>\n<li>[ ] أستطيع بناء سلسلة ترحيب وتدفّق سلة متروكة<\/li>\n<li>[ ] أستطيع تشخيص مشكلة في قابلية التسليم<\/li>\n<li>[ ] أستطيع إعداد أحداث GA4 وUTM ولوحة أساسية<\/li>\n<li>[ ] أستطيع صياغة فرضية CRO من البحث وأعرف متى يكون اختبار A/B صالحًا أو غير صالح<\/li>\n<li>[ ] أستطيع تصميم نموذج تسجيل عملاء وتدفّق دورة حياة<\/li>\n<li>[ ] أستطيع بناء ميزانية من الخلف انطلاقًا من هدف إيراد<\/li>\n<li>[ ] أستطيع شرح حدود الإسناد لمدير تنفيذي دون مصطلحات<\/li>\n<\/ul>\n<p><strong>52–65:<\/strong> مسار الخبراء. <strong>39–51:<\/strong> متوسط قوي. <strong>أقل من 39:<\/strong> أصبحت تعرف بالضبط أي فصول تراجعها — وهذا هو الهدف.<\/p>\n<blockquote>\n<p>المعرفة هي ما تستطيع شرحه؛ والمهارة هي ما تستطيع تنفيذه تحت القيود. كل حالة اختبار هنا ظهرت بشكل ما كسؤال مقابلة حقيقي أو مشكلة صباح اثنين حقيقية.<\/p>\n<\/blockquote>"}, {"id": "prac-16", "num": 16, "title": "Copywriting — Examples & Test Cases", "title_ar": "كتابة الإعلان — أمثلة وحالات", "html": "<h3>🔧 Worked Example — Same product, three frameworks<\/h3>\n<p>Product: time-tracking app for freelancers.\n- <strong>PAS:<\/strong> \"Still guessing your billable hours? Every untracked minute is money you earned and never invoiced — freelancers lose thousands a year this way. TrackR logs your time automatically, so every minute gets billed.\"\n- <strong>BAB:<\/strong> \"Right now, Friday means reconstructing your week from memory. Imagine invoices that build themselves while you work. TrackR is the bridge — install it once, never fill a timesheet again.\"\n- <strong>FAB:<\/strong> \"Automatic app-based tracking (feature) means zero manual entry (advantage) — so you bill for 100% of your work without lifting a finger (benefit).\"<\/p>\n<h3>🧪 Test Case — Fix this ad copy<\/h3>\n<p><strong>Given:<\/strong> \"We are a leading innovative solutions provider leveraging cutting-edge technology to empower businesses to achieve synergistic growth.\"<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Every classic sin: about-us framing, zero specificity, jargon, no reader, no proof, no CTA. Rewrite (for the same fictional company, a logistics SaaS): \"Your warehouse team wastes 11 hours a week on manual stock counts. ShipFlow cuts that to 20 minutes — see how 340 warehouses did it. Book a 15-min demo.\" (Reader's problem, specific number, proof, single CTA.)<\/p><\/details><h3>🧪 Test Case — Match copy to awareness stage<\/h3>\n<p><strong>Given:<\/strong> Three audiences for a sleep supplement: (a) people googling \"why do I wake up at 3am\", (b) people comparing melatonin vs. magnesium, (c) past visitors who viewed your product twice.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>(a) Problem-aware → educate: content/ad about the cortisol spike behind 3am waking, product mentioned as one fix. (b) Solution-aware → differentiate: comparison content \"melatonin vs. magnesium vs. [Product]\" with evidence. (c) Product-aware/most-aware → just the offer: retargeting ad with social proof + first-order discount + guarantee. Same product, three completely different messages.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Find 10 real customer reviews of any product. Highlight exact phrases describing pains and outcomes. Write one PAS ad using ONLY language taken from those reviews — voice-of-customer copy nearly always beats invented copy.<\/p>", "html_ar": "<h3>🔧 مثال محلول — منتج واحد، ثلاثة أطر<\/h3>\n<p>المنتج: تطبيق لتتبّع الوقت للمستقلين.\n- <strong>PAS:<\/strong> «لسه بتخمّن ساعاتك القابلة للفوترة؟ كل دقيقة مش متتبّعة فلوس كسبتها وما فوترتهاش — والمستقلين بيخسروا آلاف كل سنة بالشكل ده. TrackR بيسجّل وقتك تلقائيًا، فكل دقيقة تتفوتر.»\n- <strong>BAB:<\/strong> «دلوقتي يوم الجمعة يعني تحاول تفتكر أسبوعك كله. تخيّل فواتير بتتعمل لوحدها وأنت شغّال. TrackR هو الجسر — نزّله مرة، وما تملاش جدول ساعات تاني أبدًا.»\n- <strong>FAB:<\/strong> «تتبّع تلقائي حسب التطبيق (الخاصية) يعني صفر إدخال يدوي (الميزة) — فتفوتر 100% من شغلك من غير مجهود (المنفعة).»<\/p>\n<h3>🧪 حالة اختبار — أصلح هذا الإعلان<\/h3>\n<p><strong>المعطى:<\/strong> «نحن مزوّد حلول مبتكرة رائد نستفيد من أحدث التقنيات لتمكين الشركات من تحقيق نمو تآزري.»<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>كل الأخطاء الكلاسيكية: الحديث عن أنفسنا، صفر تحديد، مصطلحات فارغة، لا قارئ، لا دليل، لا دعوة. إعادة الكتابة (للشركة الخيالية نفسها، برنامج لوجستيات): «فريق مخزنك يضيّع 11 ساعة أسبوعيًا في الجرد اليدوي. ShipFlow يختصرها إلى 20 دقيقة — شوف إزاي عملها 340 مخزنًا. احجز عرضًا من 15 دقيقة.» (مشكلة القارئ، رقم محدّد، دليل، دعوة واحدة.)<\/p><\/details><h3>🧪 حالة اختبار — طابق النص مع مرحلة الوعي<\/h3>\n<p><strong>المعطى:<\/strong> ثلاثة جماهير لمكمّل نوم: (أ) من يبحثون «ليه بصحى الساعة 3 الفجر»، (ب) من يقارنون الميلاتونين بالمغنيسيوم، (ج) زوّار سابقون شاهدوا منتجك مرتين.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>(أ) واعٍ بالمشكلة ← علّمه: محتوى أو إعلان عن ارتفاع الكورتيزول وراء الاستيقاظ في الثالثة، والمنتج كأحد الحلول. (ب) واعٍ بالحلول ← ميّز نفسك: محتوى مقارنة «ميلاتونين مقابل مغنيسيوم مقابل [المنتج]» بأدلّة. (ج) واعٍ بالمنتج/الأكثر وعيًا ← العرض فقط: إعلان إعادة استهداف بدليل اجتماعي + خصم أول طلب + ضمان. منتج واحد وثلاث رسائل مختلفة تمامًا.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اعثر على 10 مراجعات حقيقية لأي منتج. ظلّل العبارات الحرفية التي تصف الآلام والنتائج. اكتب إعلان PAS واحدًا باستخدام <strong>لغة المراجعات فقط<\/strong> — نص «صوت العميل» يتفوّق دائمًا تقريبًا على النص المخترع.<\/p>"}, {"id": "prac-17", "num": 17, "title": "Mobile & App Marketing", "title_ar": "تسويق الجوال والتطبيقات", "html": "<h3>🔧 Worked Example — CPI vs. LTV for an app<\/h3>\n<p>Fitness app: cost per install $2.40. 6% of installs subscribe at $8/month; subscribers stay 7 months on average.\n- LTV per install = 0.06 × $8 × 7 = <strong>$3.36<\/strong> → LTV:CPI = <strong>1.4:1<\/strong> — too thin to scale.\n- Raising trial-to-paid from 6% to 9% with a better onboarding flow → <strong>$5.04 per install (2.1:1)<\/strong> without spending more on acquisition.<\/p>\n<h3>🧪 Test Case — ASO diagnosis<\/h3>\n<p><strong>Given:<\/strong> The app ranks top 10 for its keywords and gets 50,000 store-page views a month, but only 12% install (category average ~30%). Rating is 3.4★; screenshots are raw UI captures with no captions.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Visibility is fine — the store page is the leak. Lift the rating (in-app review prompts after positive moments, fix the most-complained bugs, reply to negative reviews), redesign screenshots as captioned benefit panels, add a preview video, and A/B test with store listing experiments. Moving install rate from 12% to 24% doubles installs at zero media cost.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Pick an app you use. Rewrite its first three screenshots as benefit headlines, and list 10 keywords for its title, subtitle, and keyword field.<\/p>", "html_ar": "<h3>🔧 مثال محلول — تكلفة التثبيت مقابل LTV لتطبيق<\/h3>\n<p>تطبيق لياقة: تكلفة التثبيت 2.40$. 6% من المثبّتين يشتركون بـ8$ شهريًا؛ ويبقى المشترك 7 أشهر في المتوسط.\n- LTV لكل تثبيت = 0.06 × 8 × 7 = <strong>3.36$<\/strong> ← نسبة LTV:CPI = <strong>‏1.4:1<\/strong> — هامش أضعف من أن يتوسّع.\n- رفع التحويل من التجربة للدفع من 6% إلى 9% بتدفّق إعداد أفضل ← <strong>5.04$ لكل تثبيت (‏2.1:1)<\/strong> دون إنفاق إضافي على الاكتساب.<\/p>\n<h3>🧪 حالة اختبار — تشخيص ASO<\/h3>\n<p><strong>المعطى:<\/strong> التطبيق ضمن أول 10 لكلماته ويحصل على 50,000 مشاهدة لصفحة المتجر شهريًا، لكن 12% فقط يثبّتون (متوسط الفئة ~30%). التقييم 3.4★؛ ولقطات الشاشة صور واجهة خام بلا نصوص.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>الظهور جيد — صفحة المتجر هي التسريب. ارفع التقييم (طلبات مراجعة داخل التطبيق بعد اللحظات الإيجابية، أصلح أكثر الأخطاء شكوى، ردّ على المراجعات السلبية)، أعد تصميم اللقطات كلوحات منافع بعناوين، أضف فيديو معاينة، واختبر A/B بتجارب صفحة المتجر. رفع التثبيت من 12% إلى 24% يضاعف التثبيتات بلا تكلفة وسائط.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اختر تطبيقًا تستخدمه. أعد كتابة أول 3 لقطات شاشة كعناوين منافع، واكتب 10 كلمات للعنوان والعنوان الفرعي وحقل الكلمات.<\/p>"}, {"id": "prac-18", "num": 18, "title": "Digital PR & Reputation", "title_ar": "العلاقات العامة الرقمية والسمعة", "html": "<h3>🔧 Worked Example — Data-driven PR<\/h3>\n<p>A budgeting app surveys 2,000 people about \"money secrets kept from partners,\" publishes a one-page report with charts and regional splits, and pitches 60 journalists with localized angles. Typical result: 25 articles, 40 new referring domains, and a visible lift in branded search — far cheaper than buying equivalent links or ads.<\/p>\n<h3>🧪 Test Case — Crisis response<\/h3>\n<p><strong>Given:<\/strong> A TikTok showing a customer's damaged product and a rude support reply hits 400,000 views in 12 hours. Comments are piling up; the team wants to stay silent until it blows over.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Silence reads as indifference. Within hours: acknowledge publicly on the same platform, apologize specifically, state the fix (replacement already sent, support process changed), contact the customer privately, give support a holding statement, and monitor sentiment. Follow up publicly once resolved. Don't delete critical comments or argue in them.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Search your favorite brand's name. Classify page one into owned, earned, neutral, and negative results, then write three actions to improve it.<\/p>", "html_ar": "<h3>🔧 مثال محلول — علاقات عامة مبنية على البيانات<\/h3>\n<p>تطبيق ميزانية يستطلع 2,000 شخص عن «أسرار مالية يخفونها عن الشريك»، وينشر تقريرًا من صفحة برسوم وتقسيمات إقليمية، ويتواصل مع 60 صحفيًا بزوايا محلية. نتيجة معتادة: 25 مقالًا، 40 نطاقًا محيلًا جديدًا، وارتفاع ملحوظ في بحث العلامة — أرخص بكثير من شراء روابط أو إعلانات مكافئة.<\/p>\n<h3>🧪 حالة اختبار — الردّ على الأزمة<\/h3>\n<p><strong>المعطى:<\/strong> فيديو تيك توك يُظهر منتجًا تالفًا وردًّا وقحًا من الدعم يصل إلى 400 ألف مشاهدة في 12 ساعة. التعليقات تتراكم؛ والفريق يريد الصمت حتى تهدأ.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>الصمت يُقرأ كلامبالاة. خلال ساعات: أقرّ علنًا على المنصّة نفسها، اعتذر بشكل محدّد، أعلن الإصلاح (البديل أُرسل بالفعل، وعُدّلت آلية الدعم)، تواصل مع العميل بشكل خاص، زوّد الدعم ببيان مؤقت، وراقب الانطباع. تابع علنًا بعد الحل. لا تحذف التعليقات الناقدة ولا تجادل فيها.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>ابحث عن اسم علامتك المفضّلة. صنّف الصفحة الأولى إلى نتائج مملوكة ومكتسبة ومحايدة وسلبية، ثم اكتب 3 إجراءات لتحسينها.<\/p>"}, {"id": "prac-19", "num": 19, "title": "B2B, ABM & Growth Frameworks", "title_ar": "B2B والتسويق بالحسابات وأطر النمو", "html": "<h3>🔧 Worked Example — Pipeline math, backward<\/h3>\n<p>Target: $1.2M new annual revenue; average deal $30,000 → <strong>40 deals<\/strong>. Win rate 25% → <strong>160 opportunities<\/strong>. SQL-to-opportunity 50% → <strong>320 SQLs<\/strong>. MQL-to-SQL 30% → <strong>~1,067 MQLs a year (~89/month)<\/strong>. Marketing's lead target now comes from revenue, not guesswork.<\/p>\n<h3>🧪 Test Case — AARRR diagnosis<\/h3>\n<p><strong>Given (monthly SaaS funnel):<\/strong> 20,000 visitors → 1,000 signups (5%) → 200 activate (20%) → 60% of activated users retain in month 2 → 3% refer. Revenue is flat.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>The constraint is activation — only 20% of signups reach the \"aha\" moment, so more acquisition just pours users into a leaky step. Fix onboarding first: shorten time-to-value, guided setup, activation emails, and human help for high-fit accounts. Doubling activation to 40% doubles everything downstream.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Write an ICP for a B2B product you know: industry, company size, buying-committee roles, trigger events, and three disqualifiers.<\/p>", "html_ar": "<h3>🔧 مثال محلول — حسابات خط الأنابيب من الخلف<\/h3>\n<p>الهدف: 1.2 مليون دولار إيراد سنوي جديد؛ متوسط الصفقة 30,000$ ← <strong>40 صفقة<\/strong>. معدّل الفوز 25% ← <strong>160 فرصة<\/strong>. تحويل SQL إلى فرصة 50% ← <strong>320 SQL<\/strong>. تحويل MQL إلى SQL ‏30% ← <strong>~1,067 MQL سنويًا (~89 شهريًا)<\/strong>. هدف العملاء المحتملين للتسويق أصبح مشتقًا من الإيراد لا من التخمين.<\/p>\n<h3>🧪 حالة اختبار — تشخيص AARRR<\/h3>\n<p><strong>المعطى (قمع SaaS شهري):<\/strong> 20,000 زائر ← 1,000 تسجيل (5%) ← 200 يتفعّلون (20%) ← 60% من المفعّلين يبقون في الشهر الثاني ← 3% يحيلون. الإيراد ثابت.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>القيد هو التفعيل — 20% فقط يصلون للحظة «آها»، فمزيد من الاكتساب يصبّ المستخدمين في خطوة مسرّبة. أصلح الإعداد أولًا: اختصر الوقت حتى القيمة، إعداد موجّه، رسائل تفعيل، ومساعدة بشرية للحسابات عالية الملاءمة. مضاعفة التفعيل إلى 40% تضاعف كل ما بعده.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اكتب ICP لمنتج B2B تعرفه: القطاع، حجم الشركة، أدوار لجنة الشراء، أحداث التحفيز، وثلاثة معايير استبعاد.<\/p>"}, {"id": "prac-20", "num": 20, "title": "Privacy & Compliance", "title_ar": "الخصوصية والامتثال", "html": "<h3>🧪 Test Case — Consent audit<\/h3>\n<p><strong>Given:<\/strong> An EU-facing store fires Meta and Google Ads tags on page load before the cookie banner is answered. The banner shows a big \"Accept\" button and a small grey \"Settings\" link. The newsletter box at checkout is pre-ticked.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Three problems. (1) Tags must wait for consent or run in consent mode — firing before a choice is non-compliant. (2) Rejecting must be as easy as accepting, so add an equal \"Reject all\" button. (3) Pre-ticked boxes aren't valid consent under GDPR. Fix with a proper consent platform, consent mode, and an unticked opt-in — expect fewer observed conversions but compliant, modeled measurement.<\/p><\/details><h3>🔧 Worked Example — First-party data plan<\/h3>\n<p>A DTC brand replaces lost targeting signals with a style qu
