<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Digital Marketing Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/e0933df6d715.css" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7;--card:#FFFFFF;--ink:#1B1F2A;--soft:#565D6E;--body:#2A3040;--line:#E5E1D6;--zebra:#FCFBF6;
  --mark:#FFE24A;--mark-soft:#FFF3B8;--swipe:#FFE24A;--blue:#2749D6;--green:#0E7A4F;--amber:#B35C00;--amber-soft:#FFF4E5;
  --danger:#B42318;--ok-soft:#E6F4EC;--bad-soft:#FDECEA;--shadow:rgba(27,31,42,.9);
  --top:58px;--side:292px;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Archivo","Public Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111318;--card:#1A1D25;--ink:#ECEDF1;--soft:#A1A7B6;--body:#D3D7E0;--line:#2B2F3A;--zebra:#1E212B;
  --mark:#FFD60A;--mark-soft:#36311A;--swipe:rgba(255,214,10,.34);--blue:#8FA7FF;--green:#4CD69B;--amber:#FFB35C;--amber-soft:#2B2116;
  --danger:#FF8A80;--ok-soft:#163326;--bad-soft:#3A1E1E;--shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111318;--card:#1A1D25;--ink:#ECEDF1;--soft:#A1A7B6;--body:#D3D7E0;--line:#2B2F3A;--zebra:#1E212B;
  --mark:#FFD60A;--mark-soft:#36311A;--swipe:rgba(255,214,10,.34);--blue:#8FA7FF;--green:#4CD69B;--amber:#FFB35C;--amber-soft:#2B2116;
  --danger:#FF8A80;--ok-soft:#163326;--bad-soft:#3A1E1E;--shadow:rgba(0,0,0,.6);color-scheme:dark}
html[lang="ar"]{--f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--f-head:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--top) + 8px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--f-body);overflow-x:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
::selection{background:var(--mark);color:#1B1F2A}
a{color:var(--blue)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
p,li,h1,h2,h3,h4,td,th,.qtext,.t{overflow-wrap:break-word;word-break:break-word}
.swipe{background-image:linear-gradient(transparent 58%,var(--swipe) 58%,var(--swipe) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px;border-radius:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font:900 17px/1 var(--f-head);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-inline-start:10px}
.tab{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-weight:700;color:var(--soft);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--mark-soft);box-shadow:inset 0 -3px 0 var(--mark)}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.pill{font:12px var(--f-mono);color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);white-space:nowrap}
.pill b{color:var(--ink)}
.icon-btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;height:34px;min-width:34px;padding:0 11px;font-weight:700;font-size:13px}
.icon-btn:hover{border-color:var(--ink)}
.menu-btn{display:none}

/* layout */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.sidebar{border-inline-end:1px solid var(--line);padding:16px 12px 80px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--paper)}
.side-search{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.part-label{font:10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:18px 6px 6px}
html[lang="ar"] .part-label{letter-spacing:0;font-family:var(--f-body);font-size:12px;font-weight:700}
.nav-item{display:flex;align-items:baseline;gap:9px;width:100%;text-align:start;border:0;background:transparent;padding:7px 8px;border-radius:8px;font-size:13.8px;line-height:1.4}
.nav-item:hover{background:var(--mark-soft)}
.nav-item.active{background:var(--mark-soft);box-shadow:inset 3px 0 0 var(--mark);font-weight:700}
html[dir="rtl"] .nav-item.active{box-shadow:inset -3px 0 0 var(--mark)}
.nav-item .n{font:11px var(--f-mono);color:var(--soft);min-width:22px;flex-shrink:0}
.nav-item.done .n{color:var(--green);font-weight:600}
.nav-item.done .t{background-image:linear-gradient(transparent 62%,var(--swipe) 62%,var(--swipe) 92%,transparent 92%)}
.snip{display:block;font-size:11.5px;color:var(--soft);font-weight:400;margin-top:2px}
.side-empty{font-size:13px;color:var(--soft);padding:8px}

/* content */
.content{padding:34px clamp(16px,5vw,64px) 120px;max-width:880px;width:100%;min-width:0}
.eyebrow{font:12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-family:var(--f-body);font-weight:600}
h1.doc{font:900 clamp(24px,4.4vw,38px)/1.2 var(--f-head);letter-spacing:-.015em;margin:.35em 0 .55em}
html[lang="ar"] h1.doc{letter-spacing:0;line-height:1.45}
.section-body h3{font:700 21px/1.35 var(--f-head);margin:1.6em 0 .5em}
.section-body h4{font:700 17px/1.4 var(--f-head);margin:1.4em 0 .4em}
.section-body p,.section-body li{color:var(--body)}
.section-body strong{color:var(--ink)}
.section-body blockquote{margin:1.2em 0;padding:14px 18px;border-inline-start:4px solid var(--mark);background:var(--mark-soft);border-radius:0 10px 10px 0}
html[dir="rtl"] .section-body blockquote{border-radius:10px 0 0 10px}
.section-body blockquote p{margin:.3em 0;color:var(--ink)}
.table-wrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line);border-radius:10px}
.section-body table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--card)}
.section-body th{background:var(--ink);color:var(--paper);text-align:start;padding:9px 12px;font:600 11.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
html[lang="ar"] .section-body th{font:700 13px var(--f-body);letter-spacing:0}
.section-body td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;color:var(--body)}
.section-body tr:nth-child(even) td{background:var(--zebra)}
.section-body code{font-family:var(--f-mono);font-size:.88em;background:var(--mark-soft);padding:1px 5px;border-radius:4px;color:var(--ink)}
.section-body ul,.section-body ol{padding-inline-start:22px}
.section-body input[type=checkbox]{accent-color:var(--green);margin-inline-end:6px}
.note{font-size:14px;line-height:1.65;color:var(--body);background:var(--mark-soft);border-inline-start:4px solid var(--mark);border-radius:8px;padding:10px 14px;margin:0 0 12px}
.note strong{color:var(--ink)}
.fallback{font-size:13px;color:var(--ink);background:var(--mark-soft);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.en-pill{display:inline-block;font:600 10px var(--f-mono);background:var(--line);color:var(--soft);border-radius:4px;padding:1px 5px;margin-inline-start:6px;vertical-align:middle}

.sec-footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:40px;padding-top:20px;border-top:1px dashed var(--line)}
.pager{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font-weight:700;font-size:14.5px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line)}
.btn.done{background:var(--mark);border-color:#1B1F2A;color:#1B1F2A}
.mini{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--soft)}
.mini:hover{border-color:var(--ink);color:var(--ink)}

/* practice */
details.solution{margin:1em 0;border:2px dashed var(--amber);border-radius:10px;background:var(--amber-soft)}
details.solution summary{cursor:pointer;padding:10px 14px;font:700 13px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--amber);list-style:none}
html[lang="ar"] details.solution summary{font-family:var(--f-body);letter-spacing:0;font-size:14px}
details.solution summary::-webkit-details-marker{display:none}
details.solution summary::before{content:"▸ ";display:inline-block}
html[dir="rtl"] details.solution summary::before{content:"◂ "}
details.solution[open] summary::before{content:"▾ "}
details.solution > :not(summary){margin:0 16px 12px}

/* knowledge check */
.check{margin-top:36px;border:2px solid var(--ink);border-radius:14px;padding:18px;background:var(--card);box-shadow:5px 5px 0 var(--mark)}
html[dir="rtl"] .check{box-shadow:-5px 5px 0 var(--mark)}
.check-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.check-head b{font:900 17px var(--f-head)}
.check-head span{font:13px var(--f-mono);color:var(--soft)}
.check-head .mini{margin-inline-start:auto}
.mcq{padding:12px 0;border-top:1px dashed var(--line)}
.mcq:first-of-type{border-top:0}
.mq{font-weight:700;margin:0 0 10px;color:var(--ink)}
.mopts{display:grid;gap:7px}
.mopt{text-align:start;border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;font-size:14.5px;color:var(--ink)}
.mopt:hover:not([disabled]){border-color:var(--ink)}
.mopt[disabled]{cursor:default;opacity:.75}
.mopt.right{border-color:var(--green);background:var(--ok-soft);opacity:1;font-weight:700}
.mopt.wrong{border-color:var(--danger);background:var(--bad-soft);opacity:1}
.mwhy{margin:10px 0 0;font-size:14px;color:var(--body)}

/* interview */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.lvl[aria-pressed="true"]{background:var(--mark);border-color:#1B1F2A;color:#1B1F2A}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 20px}
.isearch{flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.count{font:12.5px var(--f-mono);color:var(--soft)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
.qcard.known{border-color:var(--green)}
.qhead{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;padding:13px 15px}
.qhead:hover{background:var(--mark-soft)}
.qnum{font:12px var(--f-mono);color:var(--soft);padding-top:3px;min-width:42px;flex-shrink:0}
.qtext{font-weight:700;font-size:15.5px;line-height:1.5;flex:1}
.qtag{display:block;font:10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--soft);margin-bottom:3px}
html[lang="ar"] .qtag{font:600 11.5px var(--f-body);letter-spacing:0}
.qstars{color:var(--amber);font-size:13px;letter-spacing:2px;padding-top:2px;white-space:nowrap}
.qbody,.qact{display:none;padding:0 15px 13px;padding-inline-start:69px}
.qbody{color:var(--body);font-size:15px;border-top:1px dashed var(--line)}
.qcard.open .qbody{display:block}.qcard.open .qact{display:flex}
.qcard.known .mini.know{background:var(--green);border-color:var(--green);color:var(--paper)}
.mastery{margin:6px 0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.mastery summary{cursor:pointer;padding:11px 16px;font-weight:700;font-size:14px}
.m-grid{padding:2px 16px 14px}
.m-row{display:grid;grid-template-columns:minmax(110px,240px) 1fr 56px;gap:10px;align-items:center;margin:7px 0}
.m-label{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--paper);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.m-count{font:11px var(--f-mono);color:var(--soft);text-align:end}

/* quiz */
.stage{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:28px clamp(18px,4vw,42px);margin-top:18px;box-shadow:6px 6px 0 var(--mark)}
html[dir="rtl"] .stage{box-shadow:-6px 6px 0 var(--mark)}
.stage-q{font:700 clamp(19px,2.6vw,24px)/1.45 var(--f-head);margin:12px 0 8px}
.stage-a{display:none;border-top:1px dashed var(--line);margin-top:16px;padding-top:12px;color:var(--body)}
.stage.rev .stage-a{display:block}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.meta{font:12px var(--f-mono);color:var(--soft)}
.score{display:flex;gap:18px;margin-top:14px;font:13px var(--f-mono)}
.score .ok{color:var(--green)}.score .no{color:var(--danger)}

/* home */
.hero h1{font:900 clamp(30px,6vw,54px)/1.08 var(--f-head);letter-spacing:-.02em;margin:.25em 0 .35em}
html[lang="ar"] .hero h1{letter-spacing:0;line-height:1.35}
.lede{font-size:18px;color:var(--soft);max-width:62ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:18px 0}
.card h3{font:700 17px var(--f-head);margin:0 0 10px}
.prow{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.prow b{font:600 12px var(--f-mono);text-align:end}
.reset-row{margin-top:26px;text-align:end}

/* visuals */
.viz{margin:20px 0 26px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;color:var(--ink)}
.viz-cap{font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
html[lang="ar"] .viz-cap{letter-spacing:0;font:600 13px var(--f-body)}
.viz svg{max-width:100%;height:auto;display:block;margin:0 auto;font-family:var(--f-body)}
.eq-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.eq-tile{flex:1;min-width:110px;text-align:center;border:2px solid var(--ink);border-radius:12px;padding:13px 8px;background:var(--paper)}
.eq-tile b{display:block;font:900 15px var(--f-head)}
.eq-tile span{font-size:11.5px;color:var(--soft)}
.eq-tile.result{background:var(--mark);border-color:#1B1F2A;color:#1B1F2A;box-shadow:4px 4px 0 var(--shadow)}
.eq-tile.result span{color:#3B4150}
.eq-op{align-self:center;font:900 24px var(--f-head);color:var(--soft)}
.funnel{display:flex;flex-direction:column;align-items:center;gap:5px}
.fstage{color:#fff;text-align:center;padding:9px 6px;border-radius:8px;font-weight:700;font-size:13.5px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;align-items:baseline}
.fstage small{font-weight:400;font-size:11.5px;opacity:.92}
.pillars{display:flex;gap:10px;flex-wrap:wrap}
.roof{width:100%;text-align:center;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px;font:700 15px var(--f-head)}
.pillar{flex:1;min-width:100px;border:2px solid var(--ink);border-radius:10px 10px 4px 4px;padding:12px 8px;text-align:center;background:var(--paper)}
.pillar b{display:block;font-size:13.5px}.pillar span{font-size:11.5px;color:var(--soft)}
.tree{display:flex;flex-direction:column;align-items:center}
.tnode{border:2px solid var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px;background:var(--paper);text-align:center}
.tnode small{display:block;font-weight:400;font-size:11px;color:var(--soft)}
.tnode.root{background:var(--ink);color:var(--paper)}.tnode.root small{color:var(--paper);opacity:.8}
.tnode.leaf{background:var(--mark);border-color:#1B1F2A;color:#1B1F2A}.tnode.leaf small{color:#3B4150}
.tbranch{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tline{width:2px;height:16px;background:var(--soft)}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 0}
.fnode{border:2px solid var(--ink);border-radius:10px;padding:8px 11px;background:var(--paper);text-align:center;min-width:96px;max-width:170px}
.fnode b{display:block;font-size:12.5px}.fnode span{font-size:11px;color:var(--soft)}
.fnode.hot{background:var(--mark);border-color:#1B1F2A;color:#1B1F2A}.fnode.hot span{color:#3B4150}
.fnode.win{border-color:var(--green)}.fnode.win b{color:var(--green)}
.farrow{font:900 16px var(--f-head);color:var(--soft);padding:0 7px}
html[dir="rtl"] .farrow{transform:scaleX(-1)}
@media (max-width:640px){.flow{flex-direction:column}.farrow,html[dir="rtl"] .farrow{transform:rotate(90deg);padding:1px 0}.fnode{max-width:none;width:100%}}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:5px}
.pyr{color:#fff;text-align:center;padding:9px;border-radius:8px;font-weight:700;font-size:13px}
.pyr small{display:block;font-weight:400;font-size:11px;opacity:.92}
.phases{display:flex;flex-direction:column;gap:10px}
.phase{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:center}
.plabel{font-size:12px;color:var(--soft)}
.pbar{min-height:34px;border-radius:8px;display:flex;align-items:center;padding:4px 12px;color:#fff;font-weight:700;font-size:12.5px;line-height:1.35;min-width:44px}
@media (max-width:640px){.phase{grid-template-columns:1fr;gap:4px}}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.bookc{border-radius:10px;padding:15px 13px;color:#fff;min-height:145px;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--shadow)}
.bookc b{font:900 15px/1.3 var(--f-head)}.bookc i{font-style:normal;font-size:12px;opacity:.9;margin-top:6px}
.bookc em{font-style:normal;margin-top:auto;padding-top:12px;font-size:11px;opacity:.95;text-transform:uppercase;letter-spacing:.06em}

/* mobile */
.overlay{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .topbar{padding:0 12px;gap:8px}
  .brand{font-size:15px}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center}
  .pill{display:none}
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;margin:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;gap:6px;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1;text-align:center;font-size:13.5px;padding:9px 4px;border-radius:10px}
  .tab[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--mark)}
  .content{padding:22px 16px 150px}
  .sidebar{position:fixed;inset-inline-start:0;top:calc(env(safe-area-inset-top,0px) + var(--top));width:min(320px,86vw);height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .22s;z-index:70;box-shadow:8px 0 30px rgba(0,0,0,.18)}
  html[dir="rtl"] .sidebar{transform:translateX(105%)}
  .sidebar.open,html[dir="rtl"] .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(10,12,18,.4);z-index:65}
  .sec-footer{flex-direction:column;align-items:stretch}

<script>
const DATA = {"guide": [{"id": "sec-1", "num": 1, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Introduction: What Is Digital Marketing?", "title_ar": "مقدمة: ما هو التسويق الرقمي؟", "html": "<p>Digital marketing is the practice of promoting products, services, or brands through digital channels — search engines, websites, social media, email, mobile apps, and video platforms. Unlike traditional marketing (TV, print, billboards), digital marketing is:<\/p><div class=\"viz\"><div class=\"viz-cap\">The core equation — every discipline moves one lever<\/div><div class=\"eq-row\"><div class=\"eq-tile\"><b>Traffic<\/b><span>SEO · Ads · Social<\/span><\/div><div class=\"eq-op\">×<\/div><div class=\"eq-tile\"><b>Conversion<\/b><span>CRO · Copy · Offer<\/span><\/div><div class=\"eq-op\">×<\/div><div class=\"eq-tile\"><b>Value<\/b><span>AOV · LTV · Email<\/span><\/div><div class=\"eq-op\">=<\/div><div class=\"eq-tile result\"><b>Revenue<\/b><span>The scoreboard<\/span><\/div><\/div><\/div>\n<ul>\n<li><strong>Measurable<\/strong> — nearly every click, view, and conversion can be tracked.<\/li>\n<li><strong>Targetable<\/strong> — you can reach specific audiences by demographics, interests, behavior, and intent.<\/li>\n<li><strong>Iterative<\/strong> — campaigns can be tested, adjusted, and optimized in real time.<\/li>\n<li><strong>Scalable<\/strong> — a strategy that works for $100/day can often be scaled to $10,000/day.<\/li>\n<\/ul>\n<p><strong>The core equation of all digital marketing:<\/strong><\/p>\n<blockquote>\n<p>Traffic × Conversion Rate × Customer Value = Revenue<\/p>\n<\/blockquote>\n<p>Every discipline in this guide improves one of those three levers.<\/p>", "html_ar": "<p>التسويق الرقمي هو ممارسة الترويج للمنتجات أو الخدمات أو العلامات التجارية عبر القنوات الرقمية — محركات البحث والمواقع ومواقع التواصل والبريد الإلكتروني والتطبيقات ومنصات الفيديو. وبخلاف التسويق التقليدي (التلفزيون والمطبوعات واللوحات)، يتميّز التسويق الرقمي بأنه:<\/p><div class=\"viz\"><div class=\"viz-cap\">المعادلة الجوهرية — كل تخصص يحرّك رافعة واحدة<\/div><div class=\"eq-row\"><div class=\"eq-tile\"><b>الزيارات<\/b><span>سيو · إعلانات · تواصل<\/span><\/div><div class=\"eq-op\">×<\/div><div class=\"eq-tile\"><b>التحويل<\/b><span>CRO · كتابة · عرض<\/span><\/div><div class=\"eq-op\">×<\/div><div class=\"eq-tile\"><b>القيمة<\/b><span>متوسط الطلب · LTV · بريد<\/span><\/div><div class=\"eq-op\">=<\/div><div class=\"eq-tile result\"><b>الإيراد<\/b><span>لوحة النتائج<\/span><\/div><\/div><\/div>\n<ul>\n<li><strong>قابل للقياس<\/strong> — يمكن تتبّع كل نقرة ومشاهدة وتحويل تقريبًا.<\/li>\n<li><strong>قابل للاستهداف<\/strong> — يمكنك الوصول لجمهور محدّد حسب الديموغرافيا والاهتمامات والسلوك والنيّة.<\/li>\n<li><strong>قابل للتكرار<\/strong> — يمكن اختبار الحملات وتعديلها وتحسينها في الوقت الحقيقي.<\/li>\n<li><strong>قابل للتوسّع<\/strong> — الاستراتيجية التي تنجح بـ١٠٠ دولار يوميًا يمكن غالبًا توسيعها إلى ١٠٬٠٠٠ دولار يوميًا.<\/li>\n<\/ul>\n<p><strong>المعادلة الجوهرية لكل تسويق رقمي:<\/strong><\/p>\n<blockquote><p>الزيارات × معدّل التحويل × قيمة العميل = الإيراد<\/p><\/blockquote>\n<p>كل تخصص في هذا الدليل يحسّن واحدًا من هذه الروافع الثلاثة.<\/p>"}, {"id": "sec-2", "num": 2, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "The Digital Marketing Ecosystem at a Glance", "title_ar": "منظومة التسويق الرقمي في لمحة", "html": "<p>Digital marketing channels fall into three buckets (the <strong>POE model<\/strong>):<\/p><div class=\"viz\"><div class=\"viz-cap\">The customer journey every channel feeds<\/div><div class=\"funnel\"><div class=\"fstage\" style=\"width:100%;background:#2A3040\"><span>Awareness<\/span><small>SEO · social · ads · PR<\/small><\/div><div class=\"fstage\" style=\"width:84%;background:#2749D6\"><span>Consideration<\/span><small>content · reviews · retargeting<\/small><\/div><div class=\"fstage\" style=\"width:66%;background:#B35C00\"><span>Conversion<\/span><small>landing pages · offers · CRO<\/small><\/div><div class=\"fstage\" style=\"width:50%;background:#0E7A4F\"><span>Retention<\/span><small>email · loyalty · community<\/small><\/div><div class=\"fstage\" style=\"width:36%;background:#6B3FC7\"><span>Advocacy<\/span><small>referrals · UGC · reviews<\/small><\/div><\/div><\/div><div class=\"viz\"><div class=\"viz-cap\">The POE model — three kinds of media<\/div><svg viewBox=\"0 0 570 210\" role=\"img\" aria-label=\"POE\"><circle cx=\"170\" cy=\"105\" r=\"88\" fill=\"#2749D6\" opacity=\".92\"/><circle cx=\"285\" cy=\"105\" r=\"88\" fill=\"#FFE24A\" opacity=\".92\"/><circle cx=\"400\" cy=\"105\" r=\"88\" fill=\"#0E7A4F\" opacity=\".92\"/><text x=\"148\" y=\"100\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"17\" fill=\"#fff\">PAID<\/text><text x=\"148\" y=\"121\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">ads · sponsorships<\/text><text x=\"285\" y=\"100\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"17\" fill=\"#1B1F2A\">OWNED<\/text><text x=\"285\" y=\"121\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1B1F2A\">site · email · app<\/text><text x=\"422\" y=\"100\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"17\" fill=\"#fff\">EARNED<\/text><text x=\"422\" y=\"121\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">SEO · PR · shares<\/text><\/svg><\/div>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Definition<\/th>\n<th>Examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Paid Media<\/strong><\/td>\n<td>Traffic you buy<\/td>\n<td>Google Ads, Meta Ads, TikTok Ads, sponsorships<\/td>\n<\/tr>\n<tr>\n<td><strong>Owned Media<\/strong><\/td>\n<td>Assets you control<\/td>\n<td>Website, blog, email list, app<\/td>\n<\/tr>\n<tr>\n<td><strong>Earned Media<\/strong><\/td>\n<td>Attention you earn<\/td>\n<td>SEO rankings, shares, PR, reviews, word-of-mouth<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The customer journey (funnel)<\/strong> that all channels feed:<\/p>\n<ol>\n<li><strong>Awareness<\/strong> — the prospect discovers you (SEO, social, ads, PR)<\/li>\n<li><strong>Consideration<\/strong> — they evaluate you (content, email nurture, reviews, retargeting)<\/li>\n<li><strong>Conversion<\/strong> — they buy or sign up (landing pages, CRO, offers)<\/li>\n<li><strong>Retention<\/strong> — they stay and buy again (email, loyalty, community)<\/li>\n<li><strong>Advocacy<\/strong> — they refer others (referral programs, UGC, reviews)<\/li>\n<\/ol>\n<p>An expert marketer thinks in <strong>full-funnel systems<\/strong>, not isolated channels.<\/p>", "html_ar": "<p>تنقسم قنوات التسويق الرقمي إلى ثلاث فئات (نموذج <strong>POE<\/strong>):<\/p><div class=\"viz\"><div class=\"viz-cap\">رحلة العميل التي تغذّيها كل القنوات<\/div><div class=\"funnel\"><div class=\"fstage\" style=\"width:100%;background:#2A3040\"><span>الوعي<\/span><small>سيو · تواصل · إعلانات · علاقات عامة<\/small><\/div><div class=\"fstage\" style=\"width:84%;background:#2749D6\"><span>التفكير<\/span><small>محتوى · مراجعات · إعادة استهداف<\/small><\/div><div class=\"fstage\" style=\"width:66%;background:#B35C00\"><span>التحويل<\/span><small>صفحات هبوط · عروض · CRO<\/small><\/div><div class=\"fstage\" style=\"width:50%;background:#0E7A4F\"><span>الاحتفاظ<\/span><small>بريد · ولاء · مجتمع<\/small><\/div><div class=\"fstage\" style=\"width:36%;background:#6B3FC7\"><span>الترويج<\/span><small>إحالات · محتوى المستخدمين<\/small><\/div><\/div><\/div><div class=\"viz\"><div class=\"viz-cap\">نموذج POE — ثلاثة أنواع من الوسائط<\/div><svg viewBox=\"0 0 570 210\" role=\"img\" aria-label=\"POE\"><circle cx=\"170\" cy=\"105\" r=\"88\" fill=\"#2749D6\" opacity=\".92\"/><circle cx=\"285\" cy=\"105\" r=\"88\" fill=\"#FFE24A\" opacity=\".92\"/><circle cx=\"400\" cy=\"105\" r=\"88\" fill=\"#0E7A4F\" opacity=\".92\"/><text x=\"148\" y=\"100\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"17\" fill=\"#fff\">مدفوعة<\/text><text x=\"148\" y=\"121\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">إعلانات · رعاية<\/text><text x=\"285\" y=\"100\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"17\" fill=\"#1B1F2A\">مملوكة<\/text><text x=\"285\" y=\"121\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1B1F2A\">موقع · بريد · تطبيق<\/text><text x=\"422\" y=\"100\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"17\" fill=\"#fff\">مكتسبة<\/text><text x=\"422\" y=\"121\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">سيو · علاقات · مشاركات<\/text><\/svg><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>النوع<\/th><th>التعريف<\/th><th>أمثلة<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>وسائط مدفوعة<\/strong><\/td><td>زيارات تشتريها<\/td><td>إعلانات جوجل وميتا وتيك توك والرعاية<\/td><\/tr>\n<tr><td><strong>وسائط مملوكة<\/strong><\/td><td>أصول تتحكّم بها<\/td><td>الموقع والمدوّنة وقائمة البريد والتطبيق<\/td><\/tr>\n<tr><td><strong>وسائط مكتسبة<\/strong><\/td><td>انتباه تكسبه<\/td><td>ترتيب السيو والمشاركات والعلاقات العامة والمراجعات<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>رحلة العميل (القمع)<\/strong> التي تغذّيها كل القنوات:<\/p>\n<ol>\n<li><strong>الوعي<\/strong> — يكتشفك العميل (سيو، تواصل، إعلانات، علاقات عامة).<\/li>\n<li><strong>التفكير<\/strong> — يقيّمك (محتوى، تنمية بريدية، مراجعات، إعادة استهداف).<\/li>\n<li><strong>التحويل<\/strong> — يشتري أو يسجّل (صفحات هبوط، تحسين تحويل، عروض).<\/li>\n<li><strong>الاحتفاظ<\/strong> — يبقى ويشتري ثانيةً (بريد، ولاء، مجتمع).<\/li>\n<li><strong>الترويج<\/strong> — يرشّحك للآخرين (برامج إحالة، محتوى المستخدمين، مراجعات).<\/li>\n<\/ol>\n<p>المسوّق الخبير يفكّر في <strong>منظومات كاملة القمع<\/strong>، لا قنوات منعزلة.<\/p>"}, {"id": "sec-3", "num": 3, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Stage 1 — Beginner Foundations (Months 0–3)", "title_ar": "المرحلة ١ — أساسيات المبتدئ (شهر ٠–٣)", "html": "<div class=\"viz\"><div class=\"viz-cap\">The road from zero to expert<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">Months 0–3<\/span><div class=\"pbar\" style=\"width:42%;background:#2749D6\">Foundations — build, publish, measure<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Months 3–12<\/span><div class=\"pbar\" style=\"width:70%;background:#B35C00\">Practitioner — go deep, real budgets<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Year 1–3+<\/span><div class=\"pbar\" style=\"width:100%;background:#2A3040\">Expert — strategy, economics, teams<\/div><\/div><\/div><\/div><h3>What to learn first<\/h3>\n<ol>\n<li><strong>Marketing fundamentals<\/strong> — the 4 Ps (Product, Price, Place, Promotion), segmentation, targeting, positioning (STP), and value propositions.<\/li>\n<li><strong>Buyer psychology<\/strong> — pain points, motivations, objections, and the difference between features and benefits.<\/li>\n<li><strong>How the web works<\/strong> — websites, domains, hosting, landing pages, cookies, pixels, and tracking basics.<\/li>\n<li><strong>Writing<\/strong> — copywriting is the single most transferable digital marketing skill. Every channel runs on words.<\/li>\n<\/ol>\n<h3>Beginner milestones<\/h3>\n<ul>\n<li>Build a simple website or blog (WordPress, Webflow, Wix, or Carrd).<\/li>\n<li>Set up Google Analytics 4 and Google Search Console on it.<\/li>\n<li>Write and publish 5–10 pieces of content.<\/li>\n<li>Run one tiny paid campaign ($50–100 budget) to feel how ad platforms work.<\/li>\n<li>Build an email list of even 20–50 people and send a newsletter.<\/li>\n<\/ul>\n<h3>Free foundational courses<\/h3>\n<ul>\n<li><strong>Google Digital Garage<\/strong> — Fundamentals of Digital Marketing (free, certified)<\/li>\n<li><strong>HubSpot Academy<\/strong> — Inbound Marketing, Content Marketing, Email Marketing certifications<\/li>\n<li><strong>Meta Blueprint<\/strong> — free courses on Facebook/Instagram advertising<\/li>\n<li><strong>Google Skillshop<\/strong> — Google Ads and GA4 certifications<\/li>\n<li><strong>Semrush Academy<\/strong> — free SEO and content courses<\/li>\n<\/ul>", "html_ar": "<h3>ما الذي تتعلّمه أولًا<\/h3>\n<ol>\n<li><strong>أساسيات التسويق<\/strong> — العناصر الأربعة (المنتج، السعر، المكان، الترويج) والتقسيم والاستهداف والتموضع (STP) وعروض القيمة.<\/li>\n<li><strong>سيكولوجيا المشتري<\/strong> — نقاط الألم والدوافع والاعتراضات، والفرق بين الخصائص والمنافع.<\/li>\n<li><strong>كيف يعمل الويب<\/strong> — المواقع والنطاقات والاستضافة وصفحات الهبوط والكوكيز والتتبّع.<\/li>\n<li><strong>الكتابة<\/strong> — كتابة الإعلان أهم مهارة قابلة للنقل في التسويق الرقمي؛ كل قناة تقوم على الكلمات.<\/li>\n<\/ol>\n<h3>محطّات المبتدئ<\/h3>\n<ul>\n<li>ابنِ موقعًا أو مدوّنة بسيطة (ووردبريس، Webflow، Wix، أو Carrd).<\/li>\n<li>ثبّت Google Analytics 4 وSearch Console عليه.<\/li>\n<li>اكتب وانشر ٥–١٠ قطع محتوى.<\/li>\n<li>شغّل حملة مدفوعة صغيرة (٥٠–١٠٠ دولار) لتشعر بكيفية عمل منصّات الإعلان.<\/li>\n<li>ابنِ قائمة بريدية ولو ٢٠–٥٠ شخصًا وأرسل نشرة.<\/li>\n<\/ul>\n<h3>دورات تأسيسية مجانية<\/h3>\n<p>Google Digital Garage، أكاديمية HubSpot، Meta Blueprint، Google Skillshop، وأكاديمية Semrush — كلها مجانية ومعتمدة.<\/p><div class=\"viz\"><div class=\"viz-cap\">الطريق من الصفر إلى الخبرة<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">شهر ٠–٣<\/span><div class=\"pbar\" style=\"width:42%;background:#2749D6\">الأساسيات — ابنِ وانشر وقِس<\/div><\/div><div class=\"phase\"><span class=\"plabel\">شهر ٣–١٢<\/span><div class=\"pbar\" style=\"width:70%;background:#B35C00\">الممارس — تعمّق في قناة بميزانيات حقيقية<\/div><\/div><div class=\"phase\"><span class=\"plabel\">سنة ١–٣+<\/span><div class=\"pbar\" style=\"width:100%;background:#2A3040\">الخبير — استراتيجية واقتصاديات وفرق<\/div><\/div><\/div><\/div>"}, {"id": "sec-4", "num": 4, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #1: Search Engine Optimization (SEO)", "title_ar": "المكوّن ١: تحسين محركات البحث (SEO)", "html": "<p><strong>What it is:<\/strong> Improving your website so it ranks higher in organic (unpaid) search results on Google, Bing, and increasingly in AI-powered search experiences.<\/p><div class=\"viz\"><div class=\"viz-cap\">SEO stands on four pillars<\/div><div class=\"pillars\"><div class=\"roof\">Rankings &amp; qualified organic traffic<\/div><div class=\"pillar\"><b>Keyword research<\/b><span>demand + intent<\/span><\/div><div class=\"pillar\"><b>On-page<\/b><span>content · tags · E-E-A-T<\/span><\/div><div class=\"pillar\"><b>Technical<\/b><span>speed · crawl · index<\/span><\/div><div class=\"pillar\"><b>Off-page<\/b><span>links · authority · PR<\/span><\/div><\/div><\/div>\n<h3>The four pillars of SEO<\/h3>\n<p><strong>1. Keyword research<\/strong>\n- Find the words your audience actually types (and speaks) into search engines.\n- Understand <strong>search intent<\/strong>: informational (\"how to...\"), navigational (\"brand name login\"), commercial (\"best CRM for small business\"), transactional (\"buy running shoes\").\n- Target a mix of head terms (high volume, high competition) and long-tail keywords (lower volume, easier to rank, higher intent).<\/p>\n<p><strong>2. On-page SEO<\/strong>\n- Title tags, meta descriptions, header structure (H1–H3), internal linking.\n- Content quality: depth, originality, E-E-A-T (Experience, Expertise, Authoritativeness, Trustworthiness).\n- Image optimization (alt text, compression), schema markup / structured data.<\/p>\n<p><strong>3. Technical SEO<\/strong>\n- Site speed and Core Web Vitals.\n- Mobile-friendliness, crawlability, XML sitemaps, robots.txt.\n- Fixing broken links, redirects, duplicate content, and canonical tags.<\/p>\n<p><strong>4. Off-page SEO (authority building)<\/strong>\n- Backlinks from relevant, trusted websites remain a major ranking factor.\n- Tactics: digital PR, guest posting, creating linkable assets (original research, free tools, definitive guides), unlinked mention reclamation.<\/p>\n<h3>Key tools<\/h3>\n<p>Google Search Console (free, essential), Ahrefs, Semrush, Moz, Screaming Frog (technical audits), Surfer SEO / Clearscope (content optimization), AlsoAsked &amp; AnswerThePublic (question research).<\/p>\n<h3>Key metrics<\/h3>\n<p>Organic traffic, keyword rankings, click-through rate (CTR), backlinks/referring domains, domain authority, conversions from organic.<\/p>\n<h3>Expert-level SEO<\/h3>\n<p>Programmatic SEO, international/multilingual SEO, entity-based optimization, optimizing for AI answer engines (AEO/GEO), log-file analysis, and large-site architecture.<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> تحسين موقعك ليظهر أعلى في نتائج البحث المجانية على جوجل وبينج، وبشكل متزايد في تجارب البحث المدعومة بالذكاء الاصطناعي.<\/p><div class=\"viz\"><div class=\"viz-cap\">يقوم السيو على أربعة أركان<\/div><div class=\"pillars\"><div class=\"roof\">الترتيب والزيارات العضوية المؤهّلة<\/div><div class=\"pillar\"><b>بحث الكلمات<\/b><span>الطلب + النيّة<\/span><\/div><div class=\"pillar\"><b>السيو الداخلي<\/b><span>محتوى · وسوم · E-E-A-T<\/span><\/div><div class=\"pillar\"><b>التقني<\/b><span>سرعة · زحف · فهرسة<\/span><\/div><div class=\"pillar\"><b>الخارجي<\/b><span>روابط · سلطة<\/span><\/div><\/div><\/div>\n<h3>أركان السيو الأربعة<\/h3>\n<h4>١. بحث الكلمات المفتاحية<\/h4>\n<p>اعثر على الكلمات التي يكتبها جمهورك فعلًا، وافهم <strong>نيّة البحث<\/strong>: معلوماتية («كيف…»)، تنقّلية («تسجيل دخول علامة»)، تجارية («أفضل CRM للشركات الصغيرة»)، شرائية («اشترِ حذاء جري»). استهدف مزيجًا من الكلمات الرئيسية والكلمات الطويلة الأقل منافسة والأعلى نيّة.<\/p>\n<h4>٢. السيو الداخلي (On-page)<\/h4>\n<p>عناوين الصفحات والأوصاف والبنية (H1–H3) والروابط الداخلية، وجودة المحتوى وعمقه وأصالته، وإطار E-E-A-T (الخبرة والاختصاص والموثوقية والثقة)، وتحسين الصور والبيانات المنظّمة.<\/p>\n<h4>٣. السيو التقني<\/h4>\n<p>سرعة الموقع ومؤشرات Core Web Vitals، والتوافق مع الجوال، وقابلية الزحف، وخرائط الموقع، وإصلاح الروابط المكسورة والتحويلات والمحتوى المكرّر.<\/p>\n<h4>٤. السيو الخارجي (بناء السلطة)<\/h4>\n<p>الروابط الخلفية من مواقع موثوقة وذات صلة تبقى عاملًا رئيسيًا. الأساليب: العلاقات العامة الرقمية، والمقالات الضيفة، وإنشاء أصول تستحق الربط (أبحاث أصلية، أدوات مجانية، أدلّة شاملة).<\/p>\n<h3>أدوات ومقاييس أساسية<\/h3>\n<p>الأدوات: Search Console (مجاني وأساسي)، Ahrefs، Semrush، Screaming Frog، Surfer. المقاييس: الزيارات العضوية، ترتيب الكلمات، معدّل النقر، الروابط الخلفية، التحويلات من العضوي.<\/p>"}, {"id": "sec-5", "num": 5, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #2: Search Engine Marketing (SEM / PPC)", "title_ar": "المكوّن ٢: التسويق عبر محركات البحث (SEM / PPC)", "html": "<p><strong>What it is:<\/strong> Paying to appear in search results and across ad networks. You pay per click (PPC), per thousand impressions (CPM), or per action (CPA).<\/p><div class=\"viz\"><div class=\"viz-cap\">Anatomy of a paid account<\/div><div class=\"tree\"><div class=\"tnode root\">Campaign<small>budget · geo · bid strategy<\/small><\/div><div class=\"tline\"><\/div><div class=\"tbranch\"><div class=\"tnode\">Ad group: Hot intent<small>exact/phrase<\/small><\/div><div class=\"tnode\">Ad group: Research<small>broad + negatives<\/small><\/div><div class=\"tnode\">Ad group: Brand<small>protect + capture<\/small><\/div><\/div><div class=\"tline\"><\/div><div class=\"tnode leaf\">Ads &amp; assets<small>headlines · sitelinks · message match<\/small><\/div><\/div><\/div>\n<h3>Main platforms<\/h3>\n<ul>\n<li><strong>Google Ads<\/strong> — Search, Performance Max, Shopping, Display, YouTube.<\/li>\n<li><strong>Microsoft (Bing) Ads<\/strong> — cheaper clicks, older/professional demographics.<\/li>\n<li><strong>Meta Ads<\/strong> (Facebook/Instagram), <strong>TikTok Ads<\/strong>, <strong>LinkedIn Ads<\/strong> (B2B), <strong>Amazon Ads<\/strong> (e-commerce) — technically \"paid social/retail,\" but managed with the same PPC skill set.<\/li>\n<\/ul>\n<h3>Core concepts<\/h3>\n<ul>\n<li><strong>Campaign structure:<\/strong> Campaign → Ad Group/Ad Set → Ads → Keywords/Audiences.<\/li>\n<li><strong>Match types<\/strong> (broad, phrase, exact) and <strong>negative keywords<\/strong> to control what triggers ads.<\/li>\n<li><strong>Quality Score / Ad relevance<\/strong> — better ads pay less per click.<\/li>\n<li><strong>Bidding strategies:<\/strong> manual CPC, target CPA, target ROAS, maximize conversions.<\/li>\n<li><strong>Retargeting/remarketing:<\/strong> showing ads to people who already visited your site — usually the highest-ROI campaign type.<\/li>\n<li><strong>Landing page alignment:<\/strong> the ad's promise must match the page it leads to.<\/li>\n<\/ul>\n<h3>Key metrics<\/h3>\n<p>CTR, CPC (cost per click), CPA (cost per acquisition), ROAS (return on ad spend), conversion rate, impression share.<\/p>\n<h3>Key tools<\/h3>\n<p>Google Ads Editor, Google Keyword Planner, Optmyzr, Unbounce/Instapage (landing pages), SpyFu &amp; Meta Ads Library (competitor research).<\/p>\n<h3>Expert-level PPC<\/h3>\n<p>Full-funnel account architecture, server-side tracking and conversion APIs, incrementality testing, media-mix modeling, feed optimization for Shopping, and creative testing frameworks.<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> الدفع للظهور في نتائج البحث وعبر شبكات الإعلان. تدفع لكل نقرة (PPC) أو لكل ألف ظهور (CPM) أو لكل إجراء (CPA).<\/p><div class=\"viz\"><div class=\"viz-cap\">تشريح الحساب الإعلاني<\/div><div class=\"tree\"><div class=\"tnode root\">الحملة<small>ميزانية · جغرافيا · مزايدة<\/small><\/div><div class=\"tline\"><\/div><div class=\"tbranch\"><div class=\"tnode\">نيّة ساخنة<small>مطابقة تامة/عبارة<\/small><\/div><div class=\"tnode\">بحثية<small>واسعة + سلبية<\/small><\/div><div class=\"tnode\">العلامة<small>حماية + التقاط<\/small><\/div><\/div><div class=\"tline\"><\/div><div class=\"tnode leaf\">الإعلانات والأصول<small>عناوين · روابط · تطابق مع صفحة الهبوط<\/small><\/div><\/div><\/div>\n<h3>المنصّات الرئيسية<\/h3>\n<p>إعلانات جوجل (بحث، Performance Max، تسوّق، عرض، يوتيوب)، إعلانات مايكروسوفت (بينج)، وميتا وتيك توك ولينكدإن (B2B) وأمازون.<\/p>\n<h3>المفاهيم الجوهرية<\/h3>\n<ul>\n<li><strong>بنية الحملة:<\/strong> حملة ← مجموعة إعلانية ← إعلانات ← كلمات/جماهير.<\/li>\n<li><strong>أنواع المطابقة<\/strong> (واسعة، عبارة، تامة) و<strong>الكلمات السلبية<\/strong> للتحكّم فيما يُشغّل الإعلان.<\/li>\n<li><strong>نقاط الجودة<\/strong> — الإعلانات الأفضل تدفع أقل لكل نقرة.<\/li>\n<li><strong>استراتيجيات المزايدة:<\/strong> يدوية، هدف CPA، هدف ROAS، تعظيم التحويلات.<\/li>\n<li><strong>إعادة الاستهداف:<\/strong> عرض إعلانات لمن زار موقعك — غالبًا أعلى عائد.<\/li>\n<li><strong>توافق صفحة الهبوط:<\/strong> يجب أن يطابق وعد الإعلان الصفحة التي يقود إليها.<\/li>\n<\/ul>\n<h3>المقاييس<\/h3>\n<p>معدّل النقر، تكلفة النقرة (CPC)، تكلفة الاكتساب (CPA)، العائد على الإنفاق الإعلاني (ROAS)، معدّل التحويل، نسبة الظهور.<\/p>"}, {"id": "sec-6", "num": 6, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #3: Content Marketing", "title_ar": "المكوّن ٣: التسويق بالمحتوى", "html": "<p><strong>What it is:<\/strong> Creating and distributing valuable, relevant content to attract and retain a clearly defined audience — and ultimately drive profitable action. Content is the fuel for SEO, social, and email.<\/p><div class=\"viz\"><div class=\"viz-cap\">Hub &amp; spoke: how topical authority is built<\/div><svg viewBox=\"0 0 460 252\" role=\"img\" aria-label=\"hub\"><g stroke=\"#8A90A0\" stroke-width=\"2\"><line x1=\"230\" y1=\"125\" x2=\"80\" y2=\"45\"/><line x1=\"230\" y1=\"125\" x2=\"230\" y2=\"30\"/><line x1=\"230\" y1=\"125\" x2=\"380\" y2=\"45\"/><line x1=\"230\" y1=\"125\" x2=\"80\" y2=\"205\"/><line x1=\"230\" y1=\"125\" x2=\"230\" y2=\"222\"/><line x1=\"230\" y1=\"125\" x2=\"380\" y2=\"205\"/><\/g><circle cx=\"230\" cy=\"125\" r=\"52\" fill=\"#FFE24A\" stroke=\"#1B1F2A\" stroke-width=\"3\"/><text x=\"230\" y=\"121\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"13\" fill=\"#1B1F2A\">PILLAR<\/text><text x=\"230\" y=\"137\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1B1F2A\">complete guide<\/text><g font-size=\"10.5\" text-anchor=\"middle\"><circle cx=\"80\" cy=\"45\" r=\"34\" fill=\"#2749D6\"/><text x=\"80\" y=\"45\" fill=\"#fff\">how-to<\/text><text x=\"80\" y=\"58\" fill=\"#fff\">article<\/text><circle cx=\"230\" cy=\"30\" r=\"28\" fill=\"#2749D6\"/><text x=\"230\" y=\"34\" fill=\"#fff\">FAQ<\/text><circle cx=\"380\" cy=\"45\" r=\"34\" fill=\"#2749D6\"/><text x=\"380\" y=\"45\" fill=\"#fff\">comparison<\/text><text x=\"380\" y=\"58\" fill=\"#fff\">(BOFU)<\/text><circle cx=\"80\" cy=\"205\" r=\"34\" fill=\"#2749D6\"/><text x=\"80\" y=\"205\" fill=\"#fff\">checklist<\/text><text x=\"80\" y=\"218\" fill=\"#fff\">magnet<\/text><circle cx=\"230\" cy=\"222\" r=\"28\" fill=\"#2749D6\"/><text x=\"230\" y=\"226\" fill=\"#fff\">mistakes<\/text><circle cx=\"380\" cy=\"205\" r=\"34\" fill=\"#2749D6\"/><text x=\"380\" y=\"205\" fill=\"#fff\">case<\/text><text x=\"380\" y=\"218\" fill=\"#fff\">study<\/text><\/g><\/svg><\/div><div class=\"viz\"><div class=\"viz-cap\">Create less, distribute more<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">Creation<\/span><div class=\"pbar\" style=\"width:22%;background:#2749D6\">20%<\/div><\/div><div class=\"phase\"><span class=\"plabel\">Distribution<\/span><div class=\"pbar\" style=\"width:88%;background:#B35C00\">80% — SEO · social · email · repurposing<\/div><\/div><\/div><\/div>\n<h3>The strategy layer<\/h3>\n<ol>\n<li><strong>Audience personas<\/strong> — who exactly are you helping?<\/li>\n<li><strong>Content mission statement<\/strong> — \"We help [audience] achieve [outcome] through [content type].\"<\/li>\n<li><strong>Content pillars<\/strong> — 3–5 core topics you want to own.<\/li>\n<li><strong>Formats<\/strong> — blog posts, guides, case studies, whitepapers, podcasts, video, newsletters, webinars, infographics, interactive tools.<\/li>\n<li><strong>Distribution<\/strong> — the 20/80 rule: spend 20% of effort creating, 80% distributing (SEO, social, email, communities, repurposing).<\/li>\n<\/ol>\n<h3>Proven content frameworks<\/h3>\n<ul>\n<li><strong>Hub &amp; Spoke (Topic Clusters):<\/strong> one pillar page + many supporting articles interlinked.<\/li>\n<li><strong>The Content Flywheel:<\/strong> publish → distribute → analyze → update → repurpose.<\/li>\n<li><strong>They Ask, You Answer:<\/strong> answer every question customers actually ask (pricing, comparisons, problems, reviews, best-of).<\/li>\n<li><strong>Repurposing pyramid:<\/strong> one long-form piece → clips, threads, carousels, emails, shorts.<\/li>\n<\/ul>\n<h3>Key metrics<\/h3>\n<p>Traffic, engagement (time on page, scroll depth), leads/subscribers generated, assisted conversions, share of voice.<\/p>\n<h3>Key tools<\/h3>\n<p>Notion/Airtable (content calendars), Grammarly/Hemingway (editing), Canva/Figma (design), Descript/CapCut (video), BuzzSumo (topic research), WordPress/Webflow/Ghost (publishing).<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> إنشاء وتوزيع محتوى قيّم وذي صلة لجذب جمهور محدّد والاحتفاظ به، ودفعه في النهاية لإجراء مربح. المحتوى وقود السيو والتواصل والبريد.<\/p><div class=\"viz\"><div class=\"viz-cap\">المحور والأذرع: كيف تُبنى السلطة الموضوعية<\/div><svg viewBox=\"0 0 460 252\" role=\"img\" aria-label=\"hub\"><g stroke=\"#8A90A0\" stroke-width=\"2\"><line x1=\"230\" y1=\"125\" x2=\"80\" y2=\"45\"/><line x1=\"230\" y1=\"125\" x2=\"230\" y2=\"30\"/><line x1=\"230\" y1=\"125\" x2=\"380\" y2=\"45\"/><line x1=\"230\" y1=\"125\" x2=\"80\" y2=\"205\"/><line x1=\"230\" y1=\"125\" x2=\"230\" y2=\"222\"/><line x1=\"230\" y1=\"125\" x2=\"380\" y2=\"205\"/><\/g><circle cx=\"230\" cy=\"125\" r=\"52\" fill=\"#FFE24A\" stroke=\"#1B1F2A\" stroke-width=\"3\"/><text x=\"230\" y=\"121\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"13\" fill=\"#1B1F2A\">الركيزة<\/text><text x=\"230\" y=\"137\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1B1F2A\">الدليل الشامل<\/text><g font-size=\"10.5\" text-anchor=\"middle\"><circle cx=\"80\" cy=\"45\" r=\"34\" fill=\"#2749D6\"/><text x=\"80\" y=\"45\" fill=\"#fff\">دليل<\/text><text x=\"80\" y=\"58\" fill=\"#fff\">كيف<\/text><circle cx=\"230\" cy=\"30\" r=\"28\" fill=\"#2749D6\"/><text x=\"230\" y=\"34\" fill=\"#fff\">أسئلة<\/text><circle cx=\"380\" cy=\"45\" r=\"34\" fill=\"#2749D6\"/><text x=\"380\" y=\"45\" fill=\"#fff\">مقارنة<\/text><text x=\"380\" y=\"58\" fill=\"#fff\">BOFU<\/text><circle cx=\"80\" cy=\"205\" r=\"34\" fill=\"#2749D6\"/><text x=\"80\" y=\"205\" fill=\"#fff\">قائمة<\/text><text x=\"80\" y=\"218\" fill=\"#fff\">مغناطيس<\/text><circle cx=\"230\" cy=\"222\" r=\"28\" fill=\"#2749D6\"/><text x=\"230\" y=\"226\" fill=\"#fff\">أخطاء<\/text><circle cx=\"380\" cy=\"205\" r=\"34\" fill=\"#2749D6\"/><text x=\"380\" y=\"205\" fill=\"#fff\">دراسة<\/text><text x=\"380\" y=\"218\" fill=\"#fff\">حالة<\/text><\/g><\/svg><\/div><div class=\"viz\"><div class=\"viz-cap\">أنشئ أقل، ووزّع أكثر<\/div><div class=\"phases\"><div class=\"phase\"><span class=\"plabel\">الإنشاء<\/span><div class=\"pbar\" style=\"width:22%;background:#2749D6\">٢٠٪<\/div><\/div><div class=\"phase\"><span class=\"plabel\">التوزيع<\/span><div class=\"pbar\" style=\"width:88%;background:#B35C00\">٨٠٪ — سيو · تواصل · بريد · إعادة توظيف<\/div><\/div><\/div><\/div>\n<h3>طبقة الاستراتيجية<\/h3>\n<ol>\n<li><strong>شخصيات الجمهور<\/strong> — من الذي تساعده بالضبط؟<\/li>\n<li><strong>بيان رسالة المحتوى<\/strong> — «نساعد [الجمهور] على تحقيق [النتيجة] عبر [نوع المحتوى].»<\/li>\n<li><strong>ركائز المحتوى<\/strong> — ٣–٥ مواضيع أساسية تريد امتلاكها.<\/li>\n<li><strong>الصيغ<\/strong> — مقالات، أدلّة، دراسات حالة، بودكاست، فيديو، نشرات، ندوات، إنفوجرافيك.<\/li>\n<li><strong>التوزيع<\/strong> — قاعدة ٢٠/٨٠: ٢٠٪ إنشاء و٨٠٪ توزيع (سيو، تواصل، بريد، مجتمعات، إعادة توظيف).<\/li>\n<\/ol>\n<h3>أطر مُثبتة<\/h3>\n<p><strong>المحور والأذرع:<\/strong> صفحة ركيزة + مقالات داعمة مترابطة. <strong>يسألون فتجيب:<\/strong> أجب عن كل سؤال يطرحه العملاء فعلًا (الأسعار، المقارنات، المشكلات، المراجعات). <strong>هرم إعادة التوظيف:<\/strong> قطعة طويلة واحدة ← مقاطع، خيوط، كاروسيل، رسائل بريدية.<\/p>"}, {"id": "sec-7", "num": 7, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #4: Social Media Marketing", "title_ar": "المكوّن ٤: التسويق عبر مواقع التواصل", "html": "<p><strong>What it is:<\/strong> Building audience, community, and demand on social platforms — both organically and through paid amplification.<\/p><div class=\"viz\"><div class=\"viz-cap\">Where short-form video lives or dies<\/div><div class=\"flow\"><div class=\"fnode hot\"><b>0–3 sec<\/b><span>the hook — decided here<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>3–15 sec<\/b><span>setup + stakes<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>15s–end<\/b><span>payoff · open loops<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>Saves + shares<\/b><span>the algorithm's favorite signals<\/span><\/div><\/div><\/div>\n<h3>Platform strategy (choose 1–2 to master first)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Platform<\/th>\n<th>Best for<\/th>\n<th>Content style<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Instagram<\/strong><\/td>\n<td>B2C, lifestyle, e-commerce<\/td>\n<td>Reels, carousels, Stories<\/td>\n<\/tr>\n<tr>\n<td><strong>TikTok<\/strong><\/td>\n<td>Reach, younger demos, discovery<\/td>\n<td>Short-form native video<\/td>\n<\/tr>\n<tr>\n<td><strong>LinkedIn<\/strong><\/td>\n<td>B2B, personal branding, hiring<\/td>\n<td>Text posts, documents, thought leadership<\/td>\n<\/tr>\n<tr>\n<td><strong>YouTube<\/strong><\/td>\n<td>Search-driven, evergreen video<\/td>\n<td>Long-form + Shorts<\/td>\n<\/tr>\n<tr>\n<td><strong>X (Twitter)<\/strong><\/td>\n<td>Tech, news, community<\/td>\n<td>Threads, real-time commentary<\/td>\n<\/tr>\n<tr>\n<td><strong>Facebook<\/strong><\/td>\n<td>Communities, local, older demos<\/td>\n<td>Groups, events, ads<\/td>\n<\/tr>\n<tr>\n<td><strong>Pinterest<\/strong><\/td>\n<td>E-commerce, DIY, visual search<\/td>\n<td>Pins with strong SEO<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Core principles<\/h3>\n<ul>\n<li><strong>Native-first:<\/strong> each platform rewards content made for it, not cross-posted.<\/li>\n<li><strong>Hook, retain, reward:<\/strong> the first 1–3 seconds decide everything in short video.<\/li>\n<li><strong>Consistency beats virality:<\/strong> algorithms reward regular posting and engagement velocity.<\/li>\n<li><strong>Community management:<\/strong> replying to comments and DMs is part of the job, not an afterthought.<\/li>\n<li><strong>Social listening:<\/strong> monitor brand mentions, competitor activity, and trends.<\/li>\n<\/ul>\n<h3>Key metrics<\/h3>\n<p>Reach, engagement rate, follower growth, saves/shares (strongest signals), click-throughs, and — most importantly — conversions attributed to social.<\/p>\n<h3>Key tools<\/h3>\n<p>Buffer, Hootsuite, Later, Sprout Social (scheduling &amp; analytics), Brandwatch/Mention (listening), CapCut/InShot (mobile editing), Metricool (all-in-one reporting).<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> بناء جمهور ومجتمع وطلب على منصّات التواصل — عضويًا ومدفوعًا.<\/p><div class=\"viz\"><div class=\"viz-cap\">أين يعيش الفيديو القصير أو يموت<\/div><div class=\"flow\"><div class=\"fnode hot\"><b>٠–٣ ثوانٍ<\/b><span>الخطّاف — يُحسم هنا<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>٣–١٥ ثانية<\/b><span>التمهيد والرهان<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>١٥ث–النهاية<\/b><span>المكافأة · حلقات مفتوحة<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>حفظ + مشاركة<\/b><span>إشارات الخوارزمية المفضّلة<\/span><\/div><\/div><\/div>\n<h3>استراتيجية المنصّات (أتقن ١–٢ أولًا)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>المنصّة<\/th><th>الأفضل لـ<\/th><th>أسلوب المحتوى<\/th><\/tr><\/thead><tbody>\n<tr><td>إنستجرام<\/td><td>B2C، نمط الحياة، التجارة<\/td><td>ريلز، كاروسيل، ستوري<\/td><\/tr>\n<tr><td>تيك توك<\/td><td>الوصول، الأصغر سنًا، الاكتشاف<\/td><td>فيديو قصير أصلي<\/td><\/tr>\n<tr><td>لينكدإن<\/td><td>B2B، العلامة الشخصية<\/td><td>منشورات نصية، قيادة فكرية<\/td><\/tr>\n<tr><td>يوتيوب<\/td><td>بحثي، فيديو دائم<\/td><td>طويل + Shorts<\/td><\/tr>\n<tr><td>فيسبوك<\/td><td>مجتمعات، محلي، أكبر سنًا<\/td><td>مجموعات، فعاليات، إعلانات<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>مبادئ جوهرية<\/h3>\n<ul>\n<li><strong>الأصالة أولًا:<\/strong> كل منصّة تكافئ المحتوى المصمّم لها.<\/li>\n<li><strong>الخطّاف ثم الاحتفاظ ثم المكافأة:<\/strong> أول ١–٣ ثوانٍ تحسم كل شيء في الفيديو القصير.<\/li>\n<li><strong>الاستمرارية تغلب الانتشار:<\/strong> الخوارزميات تكافئ النشر المنتظم.<\/li>\n<li><strong>الاستماع الاجتماعي:<\/strong> راقب ذكر علامتك والمنافسين والاتجاهات.<\/li>\n<\/ul>"}, {"id": "sec-8", "num": 8, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #5: Email Marketing", "title_ar": "المكوّن ٥: التسويق بالبريد الإلكتروني", "html": "<p><strong>What it is:<\/strong> The highest-ROI channel in digital marketing (commonly cited at ~$36–40 return per $1 spent) because you own the list — no algorithm controls your reach.<\/p><div class=\"viz\"><div class=\"viz-cap\">Abandoned cart: three emails, written once, paid forever<\/div><div class=\"flow\"><div class=\"fnode\"><b>Cart abandoned<\/b><span>trigger<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Email 1<\/b><span>+1h · reminder<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Email 2<\/b><span>+24h · objections + reviews<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>Email 3<\/b><span>+72h · expiring incentive<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>~8% recovered<\/b><span>pure margin<\/span><\/div><\/div><\/div>\n<h3>The system<\/h3>\n<ol>\n<li><strong>List building<\/strong> — lead magnets (checklists, templates, mini-courses), pop-ups, embedded forms, gated content, quiz funnels.<\/li>\n<li><strong>Welcome sequence<\/strong> — 3–7 automated emails that introduce your brand, deliver the lead magnet, and make a first offer.<\/li>\n<li><strong>Newsletters<\/strong> — regular value-driven sends that keep the list warm.<\/li>\n<li><strong>Automation/flows<\/strong> — abandoned cart, browse abandonment, post-purchase, win-back, birthday, re-engagement.<\/li>\n<li><strong>Segmentation &amp; personalization<\/strong> — behavior-based segments dramatically outperform \"batch and blast.\"<\/li>\n<\/ol>\n<h3>Deliverability essentials<\/h3>\n<p>Authenticate your domain (SPF, DKIM, DMARC), keep lists clean (remove inactives), avoid spam-trigger practices, warm up new domains, monitor sender reputation.<\/p>\n<h3>Key metrics<\/h3>\n<p>Open rate, click rate (CTR), click-to-open rate, conversion rate, unsubscribe rate, list growth rate, revenue per email.<\/p>\n<h3>Key tools<\/h3>\n<p>Klaviyo (e-commerce), Mailchimp &amp; MailerLite (beginners), ConvertKit/Kit (creators), ActiveCampaign &amp; HubSpot (automation/CRM), beehiiv &amp; Substack (newsletters).<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> أعلى قناة عائدًا في التسويق الرقمي (يُذكر غالبًا ~٣٦–٤٠ دولارًا لكل دولار) لأنك تملك القائمة — لا خوارزمية تتحكّم في وصولك.<\/p><div class=\"viz\"><div class=\"viz-cap\">السلة المتروكة: ثلاث رسائل تُكتب مرة وتربح دائمًا<\/div><div class=\"flow\"><div class=\"fnode\"><b>ترك السلة<\/b><span>المُشغِّل<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>رسالة ١<\/b><span>بعد ساعة · تذكير<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>رسالة ٢<\/b><span>بعد ٢٤ س · اعتراضات + مراجعات<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>رسالة ٣<\/b><span>بعد ٧٢ س · حافز ينتهي<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode win\"><b>~٨٪ مُستردّة<\/b><span>هامش صافٍ<\/span><\/div><\/div><\/div>\n<h3>المنظومة<\/h3>\n<ol>\n<li><strong>بناء القائمة<\/strong> — مغناطيسات جذب (قوائم، قوالب، دورات مصغّرة)، نوافذ منبثقة، محتوى مغلق.<\/li>\n<li><strong>سلسلة الترحيب<\/strong> — ٣–٧ رسائل آلية تعرّف بعلامتك وتسلّم المغناطيس وتقدّم أول عرض.<\/li>\n<li><strong>النشرات<\/strong> — إرسال منتظم قيّم يبقي القائمة دافئة.<\/li>\n<li><strong>الأتمتة/التدفّقات<\/strong> — سلة متروكة، تصفّح متروك، ما بعد الشراء، استعادة.<\/li>\n<li><strong>التقسيم والتخصيص<\/strong> — الشرائح السلوكية تتفوّق بوضوح على «الإرسال الجماعي».<\/li>\n<\/ol>\n<h3>أساسيات التسليم<\/h3>\n<p>وثّق نطاقك (SPF وDKIM وDMARC)، ونظّف القوائم، وتجنّب ممارسات السبام، وسخّن النطاقات الجديدة، وراقب سمعة المُرسِل.<\/p>\n<h3>المقاييس والأدوات<\/h3>\n<p>معدّل الفتح، معدّل النقر، معدّل التحويل، معدّل إلغاء الاشتراك، الإيراد لكل رسالة. الأدوات: Klaviyo، MailerLite، ConvertKit، ActiveCampaign، beehiiv.<\/p>"}, {"id": "sec-9", "num": 9, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #6: Video & YouTube Marketing", "title_ar": "المكوّن ٦: تسويق الفيديو ويوتيوب", "html": "<p><strong>What it is:<\/strong> Video is the dominant content format across the internet. YouTube is both the #2 search engine and a long-term compounding asset.<\/p><div class=\"viz\"><div class=\"viz-cap\">Two different games<\/div><div class=\"eq-row\"><div class=\"eq-tile\"><b>Short-form<\/b><span>discovery · hooks · retention<\/span><\/div><div class=\"eq-op\">vs<\/div><div class=\"eq-tile\"><b>Long-form (YouTube)<\/b><span>search · trust · CTR × watch time<\/span><\/div><\/div><\/div>\n<h3>Two distinct games<\/h3>\n<ul>\n<li><strong>Short-form (TikTok, Reels, Shorts):<\/strong> discovery, reach, top-of-funnel. Optimized for hooks and retention curves.<\/li>\n<li><strong>Long-form (YouTube):<\/strong> trust, depth, search traffic, monetization. Optimized for click-through (thumbnails/titles) and watch time.<\/li>\n<\/ul>\n<h3>YouTube fundamentals<\/h3>\n<ul>\n<li>Keyword + interest research (what people search AND what they browse).<\/li>\n<li>Packaging first: decide the title and thumbnail <strong>before<\/strong> making the video.<\/li>\n<li>Retention editing: cut dead air, use open loops, deliver on the promise fast.<\/li>\n<li>End screens, playlists, and series to increase session time.<\/li>\n<\/ul>\n<h3>Key tools<\/h3>\n<p>TubeBuddy &amp; vidIQ (YouTube research), Descript, CapCut, DaVinci Resolve, Premiere Pro (editing), Riverside (recording), Canva/Photoshop (thumbnails).<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> الفيديو هو الصيغة المهيمنة على الإنترنت. يوتيوب هو ثاني أكبر محرك بحث وأصل تراكمي طويل الأمد.<\/p><div class=\"viz\"><div class=\"viz-cap\">لعبتان مختلفتان<\/div><div class=\"eq-row\"><div class=\"eq-tile\"><b>القصير<\/b><span>اكتشاف · خطّافات · احتفاظ<\/span><\/div><div class=\"eq-op\">مقابل<\/div><div class=\"eq-tile\"><b>الطويل (يوتيوب)<\/b><span>بحث · ثقة · نقر × مشاهدة<\/span><\/div><\/div><\/div>\n<h3>لعبتان مختلفتان<\/h3>\n<ul>\n<li><strong>الفيديو القصير (تيك توك، ريلز، Shorts):<\/strong> اكتشاف ووصول وأعلى القمع. يُحسّن للخطّافات ومنحنيات الاحتفاظ.<\/li>\n<li><strong>الفيديو الطويل (يوتيوب):<\/strong> ثقة وعمق وزيارات بحثية وتحقيق دخل. يُحسّن لمعدّل النقر (الصور المصغّرة والعناوين) ووقت المشاهدة.<\/li>\n<\/ul>\n<h3>أساسيات يوتيوب<\/h3>\n<p>بحث الكلمات والاهتمامات، والتغليف أولًا (قرّر العنوان والصورة المصغّرة <strong>قبل<\/strong> صناعة الفيديو)، ومونتاج الاحتفاظ، وشاشات النهاية وقوائم التشغيل لزيادة وقت الجلسة. الأدوات: TubeBuddy، vidIQ، Descript، CapCut.<\/p>"}, {"id": "sec-10", "num": 10, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #7: Affiliate & Influencer Marketing", "title_ar": "المكوّن ٧: التسويق بالعمولة والمؤثرين", "html": "<h3>Affiliate marketing<\/h3>\n<p>Others promote your product for a commission (or you promote others' products for income).\n- <strong>As a merchant:<\/strong> set up a program via Awin (which absorbed ShareASale in 2025), Impact, CJ, or PartnerStack; recruit publishers; provide creatives and tracking links.\n- <strong>As an affiliate:<\/strong> build an audience (blog, YouTube, newsletter), recommend products you trust, disclose relationships (FTC requirement).\n- <strong>Key metrics:<\/strong> EPC (earnings per click), conversion rate, average order value, program ROI.<\/p>\n<h3>Influencer marketing<\/h3>\n<p>Paying or partnering with creators who have the trust of your target audience.\n- <strong>Tiers:<\/strong> nano (1K–10K), micro (10K–100K), macro (100K–1M), mega (1M+). Nano/micro often deliver the best engagement and ROI.\n- <strong>Models:<\/strong> flat fee, gifting, affiliate/commission hybrid, UGC licensing (content for your own ads).\n- <strong>Process:<\/strong> identify → vet (engagement quality, audience fit, fake-follower check) → brief → track with unique codes/links → measure.\n- <strong>Tools:<\/strong> Upfluence, Modash, GRIN, Aspire, Creator.co; TikTok Creator Marketplace; Instagram brand tools.<\/p>", "html_ar": "<h3>التسويق بالعمولة<\/h3>\n<p>يروّج آخرون لمنتجك مقابل عمولة (أو تروّج أنت لمنتجات غيرك مقابل دخل).<\/p>\n<ul>\n<li><strong>كتاجر:<\/strong> أنشئ برنامجًا عبر ShareASale أو Impact أو PartnerStack، جنّد ناشرين، وفّر إبداعات وروابط تتبّع.<\/li>\n<li><strong>كمُسوّق بالعمولة:<\/strong> ابنِ جمهورًا، أوصِ بمنتجات تثق بها، وأفصح عن العلاقة (شرط قانوني).<\/li>\n<\/ul>\n<h3>التسويق بالمؤثرين<\/h3>\n<p>الشراكة مع صنّاع محتوى يملكون ثقة جمهورك المستهدف.<\/p>\n<ul>\n<li><strong>الفئات:<\/strong> نانو (١–١٠ آلاف)، مايكرو (١٠–١٠٠ ألف)، ماكرو، ميجا. غالبًا يحقّق النانو/المايكرو أفضل تفاعل وعائد.<\/li>\n<li><strong>النماذج:<\/strong> رسم ثابت، إهداء، عمولة، ترخيص محتوى المستخدمين لإعلاناتك.<\/li>\n<li><strong>العملية:<\/strong> تحديد ← فحص (جودة التفاعل، ملاءمة الجمهور، كشف المتابعين الوهميين) ← إحاطة ← تتبّع بأكواد فريدة ← قياس.<\/li>\n<\/ul>"}, {"id": "sec-11", "num": 11, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #8: Conversion Rate Optimization (CRO)", "title_ar": "المكوّن ٨: تحسين معدل التحويل (CRO)", "html": "<p><strong>What it is:<\/strong> The science of turning more visitors into leads and customers. Doubling conversion rate has the same effect as doubling traffic — usually at far lower cost.<\/p><div class=\"viz\"><div class=\"viz-cap\">The CRO loop — it never ends, that's the point<\/div><svg viewBox=\"0 0 480 220\" role=\"img\" aria-label=\"CRO loop\" style=\"color:var(--ink)\"><defs><marker id=\"ar0\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#8A90A0\"/><\/marker><\/defs><g fill=\"none\" stroke=\"#8A90A0\" stroke-width=\"2.5\" marker-end=\"url(#ar0)\"><path d=\"M150,52 H295\"/><path d=\"M366,80 V150\"/><path d=\"M330,174 H185\"/><path d=\"M112,150 V82\"/><\/g><g text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\"><rect x=\"52\" y=\"30\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#2749D6\"/><text x=\"112\" y=\"57\" fill=\"#fff\">Research<\/text><rect x=\"300\" y=\"30\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#2A3040\"/><text x=\"360\" y=\"57\" fill=\"#fff\">Hypothesize<\/text><rect x=\"306\" y=\"152\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#B35C00\"/><text x=\"366\" y=\"179\" fill=\"#fff\">Test (A/B)<\/text><rect x=\"56\" y=\"152\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#0E7A4F\"/><text x=\"116\" y=\"179\" fill=\"#fff\">Learn &amp; ship<\/text><\/g><text x=\"240\" y=\"114\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"15\" fill=\"currentColor\">ICE-prioritized<\/text><text x=\"240\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\" opacity=\".7\">impact × confidence × ease<\/text><\/svg><\/div>\n<h3>The CRO process<\/h3>\n<ol>\n<li><strong>Research:<\/strong> analytics review, heatmaps, session recordings, user surveys, customer interviews.<\/li>\n<li><strong>Hypothesize:<\/strong> \"Because we observed X, we believe changing Y will improve Z.\"<\/li>\n<li><strong>Prioritize:<\/strong> ICE score (Impact × Confidence × Ease) or PIE framework.<\/li>\n<li><strong>Test:<\/strong> A/B tests (with sufficient traffic) or iterative redesigns (low traffic).<\/li>\n<li><strong>Learn &amp; repeat.<\/strong><\/li>\n<\/ol>\n<h3>High-impact levers<\/h3>\n<p>Headlines and value propositions, social proof (reviews, logos, testimonials), friction reduction (fewer form fields, guest checkout), page speed, clear CTAs, risk reversal (guarantees, free trials), urgency/scarcity used honestly.<\/p>\n<h3>Key tools<\/h3>\n<p>Microsoft Clarity (free heatmaps + recordings), Hotjar, VWO, Optimizely, Convert, Google Analytics 4, Unbounce (landing page testing).<\/p>\n<h3>Key metrics<\/h3>\n<p>Conversion rate by page/source/device, form abandonment, cart abandonment, average order value, revenue per visitor.<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> علم تحويل نسبة أكبر من الزوّار إلى عملاء. مضاعفة معدّل التحويل تعادل مضاعفة الزيارات — بتكلفة أقل بكثير.<\/p><div class=\"viz\"><div class=\"viz-cap\">حلقة تحسين التحويل — لا تنتهي، وهذا هو المقصود<\/div><svg viewBox=\"0 0 480 220\" role=\"img\" aria-label=\"CRO loop\" style=\"color:var(--ink)\"><defs><marker id=\"ar1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#8A90A0\"/><\/marker><\/defs><g fill=\"none\" stroke=\"#8A90A0\" stroke-width=\"2.5\" marker-end=\"url(#ar1)\"><path d=\"M298,52 H176\"/><path d=\"M110,80 V150\"/><path d=\"M180,174 H300\"/><path d=\"M362,150 V82\"/><\/g><g text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\"><rect x=\"300\" y=\"30\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#2749D6\"/><text x=\"360\" y=\"57\" fill=\"#fff\">البحث<\/text><rect x=\"52\" y=\"30\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#2A3040\"/><text x=\"112\" y=\"57\" fill=\"#fff\">الفرضية<\/text><rect x=\"56\" y=\"152\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#B35C00\"/><text x=\"116\" y=\"179\" fill=\"#fff\">الاختبار A/B<\/text><rect x=\"306\" y=\"152\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#0E7A4F\"/><text x=\"366\" y=\"179\" fill=\"#fff\">التعلّم والإطلاق<\/text><\/g><text x=\"240\" y=\"114\" text-anchor=\"middle\" font-weight=\"900\" font-size=\"15\" fill=\"currentColor\">مرتّبة بـICE<\/text><text x=\"240\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\" opacity=\".7\">الأثر × الثقة × السهولة<\/text><\/svg><\/div>\n<h3>عملية CRO<\/h3>\n<ol>\n<li><strong>البحث:<\/strong> مراجعة التحليلات، خرائط الحرارة، تسجيلات الجلسات، الاستبيانات، مقابلات العملاء.<\/li>\n<li><strong>الفرضية:<\/strong> «لأننا لاحظنا X، نعتقد أن تغيير Y سيحسّن Z.»<\/li>\n<li><strong>الأولوية:<\/strong> نتيجة ICE (الأثر × الثقة × السهولة).<\/li>\n<li><strong>الاختبار:<\/strong> اختبارات A/B (بزيارات كافية) أو إعادة تصميم تكرارية.<\/li>\n<li><strong>التعلّم والتكرار.<\/strong><\/li>\n<\/ol>\n<h3>روافع عالية الأثر<\/h3>\n<p>العناوين وعروض القيمة، الدليل الاجتماعي (مراجعات، شعارات، شهادات)، تقليل الاحتكاك (حقول أقل، دفع كضيف)، سرعة الصفحة، دعوات واضحة للإجراء، عكس المخاطرة (ضمانات، تجربة مجانية).<\/p>\n<p>الأدوات: Microsoft Clarity (مجاني)، Hotjar، VWO، Optimizely.<\/p>"}, {"id": "sec-12", "num": 12, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #9: Analytics & Data", "title_ar": "المكوّن ٩: التحليلات والبيانات", "html": "<p><strong>What it is:<\/strong> The discipline that separates professionals from amateurs. If you can't measure it, you can't improve it.<\/p><div class=\"viz\"><div class=\"viz-cap\">The metrics hierarchy — always optimize toward the base<\/div><div class=\"pyramid\"><div class=\"pyr\" style=\"width:40%;background:#5B6273\">Vanity<small>followers · impressions<\/small><\/div><div class=\"pyr\" style=\"width:64%;background:#2749D6\">Engagement<small>CTR · saves · time on page<\/small><\/div><div class=\"pyr\" style=\"width:88%;background:#2A3040\">Business<small>leads · revenue · CAC:LTV<\/small><\/div><\/div><\/div>\n<h3>The measurement stack<\/h3>\n<ul>\n<li><strong>Google Analytics 4 (GA4):<\/strong> traffic sources, user behavior, conversions, funnels.<\/li>\n<li><strong>Google Search Console:<\/strong> search queries, rankings, indexing health.<\/li>\n<li><strong>Google Tag Manager:<\/strong> deploy tracking without touching code.<\/li>\n<li><strong>Ad platform analytics:<\/strong> Meta Events Manager, Google Ads conversions (with server-side tracking / Conversion APIs increasingly essential as browser tracking erodes).<\/li>\n<li><strong>Dashboards:<\/strong> Looker Studio (free), Tableau, Power BI.<\/li>\n<li><strong>Product/behavior analytics:<\/strong> Mixpanel, Amplitude (for apps/SaaS).<\/li>\n<\/ul>\n<h3>Core concepts to master<\/h3>\n<ul>\n<li><strong>UTM parameters<\/strong> — tag every link so you know what drives results.<\/li>\n<li><strong>Attribution models<\/strong> — first-click, last-click, linear, data-driven; understand that all models are imperfect stories.<\/li>\n<li><strong>Cohorts &amp; LTV<\/strong> — customer lifetime value determines how much you can spend to acquire a customer (CAC).<\/li>\n<li><strong>The metrics hierarchy:<\/strong> vanity metrics (followers, impressions) → engagement metrics → business metrics (leads, revenue, CAC:LTV ratio). Always optimize toward the bottom.<\/li>\n<li><strong>Statistical significance<\/strong> — don't declare A/B test winners on 50 visitors.<\/li>\n<\/ul>", "html_ar": "<p><strong>ما هو:<\/strong> التخصص الذي يفصل المحترفين عن الهواة. إن لم تستطع قياسه، لن تستطيع تحسينه.<\/p><div class=\"viz\"><div class=\"viz-cap\">هرم المقاييس — حسّن دائمًا نحو القاعدة<\/div><div class=\"pyramid\"><div class=\"pyr\" style=\"width:40%;background:#5B6273\">مقاييس زائفة<small>متابعون · ظهور<\/small><\/div><div class=\"pyr\" style=\"width:64%;background:#2749D6\">التفاعل<small>نقر · حفظ · وقت<\/small><\/div><div class=\"pyr\" style=\"width:88%;background:#2A3040\">الأعمال<small>عملاء · إيراد · CAC:LTV<\/small><\/div><\/div><\/div>\n<h3>حزمة القياس<\/h3>\n<p>Google Analytics 4 (المصادر والسلوك والتحويلات)، Search Console (الاستعلامات والترتيب)، Google Tag Manager (نشر التتبّع بلا كود)، تحليلات المنصّات الإعلانية، لوحات المعلومات (Looker Studio مجاني، Tableau، Power BI).<\/p>\n<h3>مفاهيم يجب إتقانها<\/h3>\n<ul>\n<li><strong>معاملات UTM<\/strong> — وسم كل رابط لتعرف ما الذي يحقّق النتائج.<\/li>\n<li><strong>نماذج الإسناد<\/strong> — أول نقرة، آخر نقرة، خطّي، مبني على البيانات؛ كلها قصص ناقصة.<\/li>\n<li><strong>الأفواج وLTV<\/strong> — قيمة عمر العميل تحدّد كم يمكنك إنفاقه لاكتسابه (CAC).<\/li>\n<li><strong>هرم المقاييس:<\/strong> مقاييس زائفة ← تفاعل ← أعمال (عملاء، إيراد، نسبة CAC:LTV). حسّن دائمًا نحو القاع.<\/li>\n<li><strong>الدلالة الإحصائية<\/strong> — لا تعلن فائز اختبار A/B على ٥٠ زائرًا.<\/li>\n<\/ul>"}, {"id": "sec-13", "num": 13, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Core Component #10: Marketing Automation & AI", "title_ar": "المكوّن ١٠: الأتمتة والذكاء الاصطناعي", "html": "<p><strong>What it is:<\/strong> Using software and AI to scale personalized marketing beyond what humans can do manually.<\/p><div class=\"viz\"><div class=\"viz-cap\">A lifecycle workflow in one line<\/div><div class=\"flow\"><div class=\"fnode\"><b>Trigger<\/b><span>signup · cart · score ≥ 50<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Branch<\/b><span>acted within 48h?<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>Action<\/b><span>email · alert sales · audience<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>Measure<\/b><span>conversion per branch<\/span><\/div><\/div><\/div>\n<h3>Automation fundamentals<\/h3>\n<ul>\n<li><strong>CRM as the hub:<\/strong> HubSpot, Salesforce, Pipedrive — one source of truth for every contact.<\/li>\n<li><strong>Lead scoring:<\/strong> rank prospects by fit + behavior; route hot leads to sales.<\/li>\n<li><strong>Lifecycle workflows:<\/strong> trigger emails/ads/tasks based on user actions.<\/li>\n<li><strong>Chatbots &amp; conversational marketing:<\/strong> Intercom, Drift, ManyChat.<\/li>\n<li><strong>Integration glue:<\/strong> Zapier, Make, n8n — connect tools without code.<\/li>\n<\/ul>\n<h3>AI in modern marketing (now a core skill)<\/h3>\n<ul>\n<li><strong>Content assistance:<\/strong> drafting, repurposing, and editing with AI (Claude, ChatGPT, Jasper) — with human strategy, fact-checking, and voice on top.<\/li>\n<li><strong>Creative:<\/strong> AI image/video generation for ads and social (Midjourney, Runway, Canva AI).<\/li>\n<li><strong>Analysis:<\/strong> summarizing reviews, clustering keywords, analyzing survey data.<\/li>\n<li><strong>Personalization &amp; prediction:<\/strong> AI-driven product recommendations, send-time optimization, predictive audiences in ad platforms.<\/li>\n<li><strong>Optimizing for AI search:<\/strong> structuring content so AI assistants and answer engines cite you (an emerging discipline often called GEO/AEO).<\/li>\n<\/ul>\n<p><strong>The expert stance:<\/strong> AI multiplies good marketers; it doesn't replace judgment, positioning, or creativity.<\/p>", "html_ar": "<p><strong>ما هو:<\/strong> استخدام البرمجيات والذكاء الاصطناعي لتوسيع التسويق المخصّص أبعد مما يفعله البشر يدويًا.<\/p><div class=\"viz\"><div class=\"viz-cap\">تدفّق دورة حياة في سطر واحد<\/div><div class=\"flow\"><div class=\"fnode\"><b>المُشغِّل<\/b><span>تسجيل · سلة · نقاط ≥ ٥٠<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>التفرّع<\/b><span>هل تصرّف خلال ٤٨ س؟<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode hot\"><b>الإجراء<\/b><span>بريد · تنبيه مبيعات · جمهور<\/span><\/div><div class=\"farrow\" aria-hidden=\"true\">→<\/div><div class=\"fnode\"><b>القياس<\/b><span>تحويل لكل فرع<\/span><\/div><\/div><\/div>\n<h3>أساسيات الأتمتة<\/h3>\n<ul>\n<li><strong>الـCRM كمركز:<\/strong> HubSpot، Salesforce، Pipedrive — مصدر واحد للحقيقة لكل جهة اتصال.<\/li>\n<li><strong>تسجيل العملاء المحتملين:<\/strong> رتّبهم حسب الملاءمة + السلوك، ووجّه الساخن للمبيعات.<\/li>\n<li><strong>تدفّقات دورة الحياة:<\/strong> شغّل رسائل/إعلانات/مهام بناءً على أفعال المستخدم.<\/li>\n<li><strong>روبوتات المحادثة:<\/strong> Intercom، Drift، ManyChat.<\/li>\n<li><strong>غراء التكامل:<\/strong> Zapier، Make، n8n.<\/li>\n<\/ul>\n<h3>الذكاء الاصطناعي في التسويق الحديث<\/h3>\n<p>مساعدة في المحتوى والصياغة وإعادة التوظيف، وإبداع بصري للإعلانات، وتحليل المراجعات، وتخصيص وتنبّؤ (توصيات، توقيت إرسال أمثل)، وتحسين للظهور في بحث الذكاء الاصطناعي (GEO/AEO).<\/p>\n<blockquote><p>الموقف الخبير: الذكاء الاصطناعي يضاعف المسوّقين الجيّدين؛ لكنه لا يستبدل الحكم أو التموضع أو الإبداع.<\/p><\/blockquote>"}, {"id": "sec-14", "num": 14, "part": "Part I — Core Curriculum", "part_ar": "الجزء الأول — المنهج الأساسي", "title": "Stage 2 — Intermediate Practitioner (Months 3–12)", "title_ar": "المرحلة ٢ — الممارس المتوسط (شهر ٣–١٢)", "html": "<p><strong>Goal:<\/strong> Go from \"knows the concepts\" to \"has produced measurable results.\"<\/p>\n<h3>What this stage looks like<\/h3>\n<ol>\n<li><strong>Pick a T-shape:<\/strong> go deep in ONE channel (SEO, PPC, email, or social) while staying broad across the rest.<\/li>\n<li><strong>Run real projects:<\/strong> your own niche site, a freelance client, a nonprofit, or your employer's campaigns. Real budgets and real stakes teach 10x faster than courses.<\/li>\n<li><strong>Master the analytics layer:<\/strong> GA4, GTM, UTMs, and one dashboard tool. You should be able to answer \"what's working and why?\" with data.<\/li>\n<li><strong>Learn funnel building end-to-end:<\/strong> traffic source → landing page → email sequence → offer → upsell.<\/li>\n<li><strong>Develop copywriting seriously:<\/strong> study direct-response principles (headlines, offers, objections, proof).<\/li>\n<li><strong>Build a portfolio:<\/strong> case studies with before/after numbers (\"Grew organic traffic 214% in 6 months\") are the currency of marketing careers.<\/li>\n<\/ol>\n<h3>Intermediate milestones<\/h3>\n<ul>\n<li>Managed at least $1,000+ in ad spend profitably, or ranked pages for competitive keywords, or grown an email list to 1,000+.<\/li>\n<li>Comfortable building reports and explaining ROI to a stakeholder.<\/li>\n<li>Earned 2–3 recognized certifications (Google Ads, GA4, HubSpot).<\/li>\n<\/ul>", "html_ar": "<p><strong>الهدف:<\/strong> الانتقال من «أعرف المفاهيم» إلى «حقّقت نتائج قابلة للقياس».<\/p>\n<h3>كيف تبدو هذه المرحلة<\/h3>\n<ol>\n<li><strong>اختر شكل حرف T:<\/strong> تعمّق في قناة <strong>واحدة<\/strong> (سيو، إعلانات، بريد، أو تواصل) مع إلمام واسع بالباقي.<\/li>\n<li><strong>نفّذ مشاريع حقيقية:<\/strong> موقعك المتخصص، عميل حر، جمعية خيرية، أو حملات جهة عملك. الميزانيات الحقيقية تعلّم أسرع بعشر مرات من الدورات.<\/li>\n<li><strong>أتقن طبقة التحليلات:<\/strong> GA4 وGTM وUTM وأداة لوحات واحدة. يجب أن تجيب بالبيانات: «ما الذي ينجح ولماذا؟»<\/li>\n<li><strong>تعلّم بناء القمع كاملًا:<\/strong> مصدر الزيارات ← صفحة الهبوط ← سلسلة بريدية ← العرض ← البيع الإضافي.<\/li>\n<li><strong>طوّر كتابة الإعلان بجدية:<\/strong> ادرس مبادئ الاستجابة المباشرة (العناوين، العروض، الاعتراضات، الدليل).<\/li>\n<li><strong>ابنِ ملف أعمال:<\/strong> دراسات الحالة بأرقام قبل/بعد («نمّيت الزيارات العضوية ٢١٤٪ في ٦ أشهر») هي عملة المسار المهني.<\/li>\n<\/ol>\n<h3>محطّات المستوى المتوسط<\/h3>\n<ul>\n<li>أدرت إنفاقًا إعلانيًا ١٬٠٠٠ دولار+ بربحية، أو رتّبت صفحات لكلمات تنافسية، أو نمّيت قائمة بريدية إلى ١٬٠٠٠+.<\/li>\n<li>مرتاح في بناء التقارير وشرح العائد لصاحب القرار.<\/li>\n<li>حصلت على ٢–٣ شهادات معترف بها (Google Ads، GA4، HubSpot).<\/li>\n<\/ul>"}, {"id": "sec-15", "num": 15, "pa
