iz (zero-party data), account-creation incentives, loyalty points, server-side tracking that sends consented conversions to ad platforms, and customer-list audiences for retargeting and lookalikes.<\/p>\n<h3>🏋️ Exercise<\/h3>\n<p>Review the cookie banner and email signup on any site. List what's compliant, what isn't, and how you'd fix each.<\/p>", "html_ar": "<h3>🧪 حالة اختبار — تدقيق الموافقة<\/h3>\n<p><strong>المعطى:<\/strong> متجر يستهدف أوروبا يشغّل وسوم ميتا وإعلانات جوجل عند تحميل الصفحة قبل الرد على لافتة الكوكيز. اللافتة بها زر «قبول» كبير ورابط رمادي صغير «الإعدادات». ومربّع النشرة عند الدفع محدّد مسبقًا.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>ثلاث مشكلات. (1) الوسوم يجب أن تنتظر الموافقة أو تعمل بوضع الموافقة — التشغيل قبل الاختيار مخالف. (2) الرفض يجب أن يكون بسهولة القبول، فأضف زر «رفض الكل» مساويًا. (3) المربّعات المحدّدة مسبقًا ليست موافقة صحيحة وفق GDPR. أصلح بمنصّة موافقة مناسبة ووضع الموافقة ومربّع اشتراك غير محدّد — وتوقّع تحويلات مرصودة أقل لكن قياسًا ممتثلًا ومنمذجًا.<\/p><\/details><h3>🔧 مثال محلول — خطة بيانات الطرف الأول<\/h3>\n<p>علامة مباشرة للمستهلك تعوّض إشارات الاستهداف المفقودة باختبار أسلوب (بيانات طرف صفري)، وحوافز إنشاء الحساب، ونقاط ولاء، وتتبّع من الخادم يرسل التحويلات الموافَق عليها للمنصّات، وجماهير قوائم العملاء لإعادة الاستهداف والجماهير المشابهة.<\/p>\n<h3>🏋️ تمرين<\/h3>\n<p>راجع لافتة الكوكيز ونموذج الاشتراك في أي موقع. اكتب ما هو ممتثل وما ليس كذلك، وكيف تصلح كل بند.<\/p>"}, {"id": "prac-21", "num": 21, "title": "AI Search (GEO)", "title_ar": "بحث الذكاء الاصطناعي (GEO)", "html": "<h3>🔧 Worked Example — Rewriting for answer engines<\/h3>\n<p><strong>Before:<\/strong> a 2,000-word post titled \"Our Thoughts on CRM Software\" that reaches a definition in paragraph six.\n<strong>After:<\/strong> heading \"What is the best CRM for small businesses?\" → 50-word direct answer → comparison table (price, best for, limits) → original data (\"we analyzed 120 small-business CRM setups\") → FAQ with schema → visible last-updated date. The page becomes extractable, quotable, and current — the three traits AI engines favor.<\/p>\n<h3>🧪 Test Case — Visibility gap<\/h3>\n<p><strong>Given:<\/strong> Your brand ranks #3 on Google for \"best project tool for agencies,\" yet across 30 buyer prompts in major AI assistants it appears in only 2 answers. A competitor ranked #6 appears in 21.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>AI engines weigh third-party consensus, not just rankings. Find where the competitor is cited — review sites, listicles, Reddit threads, comparison articles — and close the gap with digital PR, review generation, inclusion in industry roundups, clearer entity information, and answer-first comparison content. Re-run the same prompt set monthly to track progress.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Ask three AI assistants the same five questions a customer in your niche would ask. Log which brands are mentioned and which sources are cited.<\/p>", "html_ar": "<h3>🔧 مثال محلول — إعادة الكتابة لمحركات الإجابة<\/h3>\n<p><strong>قبل:<\/strong> مقال من 2,000 كلمة بعنوان «أفكارنا حول برامج CRM» يصل للتعريف في الفقرة السادسة.\n<strong>بعد:<\/strong> عنوان «ما أفضل CRM للشركات الصغيرة؟» ← إجابة مباشرة من 50 كلمة ← جدول مقارنة (السعر، الأنسب لـ، القيود) ← بيانات أصلية («حلّلنا 120 إعدادًا لشركات صغيرة») ← أسئلة شائعة ببيانات منظّمة ← تاريخ آخر تحديث ظاهر. الصفحة تصبح قابلة للاستخراج والاقتباس وحديثة — السمات الثلاث التي تفضّلها محركات الذكاء الاصطناعي.<\/p>\n<h3>🧪 حالة اختبار — فجوة الظهور<\/h3>\n<p><strong>المعطى:<\/strong> علامتك في المركز 3 على جوجل لـ«أفضل أداة مشاريع للوكالات»، لكنها تظهر في إجابتين فقط من 30 سؤال مشترٍ عبر المساعدات الرئيسية. منافس في المركز 6 يظهر في 21.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>محركات الذكاء الاصطناعي تزن إجماع الطرف الثالث لا الترتيب فقط. اعثر على أماكن الاستشهاد بالمنافس — مواقع المراجعات، القوائم، نقاشات Reddit، مقالات المقارنة — وسدّ الفجوة بالعلاقات العامة الرقمية وتوليد المراجعات والإدراج في تجميعات القطاع ووضوح معلومات الكيان ومحتوى مقارنة يبدأ بالإجابة. أعد تشغيل مجموعة الأسئلة نفسها شهريًا لتتبّع التقدّم.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>اسأل ثلاثة مساعدات ذكاء اصطناعي الأسئلة الخمسة نفسها التي يسألها عميل في تخصصك. سجّل العلامات المذكورة والمصادر المستشهد بها.<\/p>"}, {"id": "prac-22", "num": 22, "title": "MENA Markets", "title_ar": "أسواق المنطقة العربية", "html": "<h3>🔧 Worked Example — COD economics in Egypt<\/h3>\n<p>A store receives 1,000 cash-on-delivery orders a month at EGP 600 average order value. 25% are refused at the door, and each failed delivery costs EGP 60.\n- Loss: 250 × EGP 60 = <strong>EGP 15,000/month<\/strong> in pure cost, plus stuck inventory.\n- Fix: WhatsApp confirmation within an hour of ordering, a small prepaid-discount incentive, and blocking repeat refusers. If refusals fall to 15%, that's <strong>EGP 6,000 saved monthly and 100 more delivered orders.<\/strong><\/p>\n<h3>🧪 Test Case — Ramadan media plan<\/h3>\n<p><strong>Given:<\/strong> A Saudi food-delivery brand keeps its usual daytime posting schedule and flat daily budgets through Ramadan. Performance drops by day 5.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>Behavior shifts in Ramadan — attention and ordering concentrate around Iftar and late night through Suhoor. Move budgets and posting to evening and night hours, switch creative to Iftar/Suhoor and family themes in Saudi dialect, prepare several creative variants to fight fatigue over 30 days, plan a pre-Eid push, and staff support for night-time demand.<\/p><\/details><h3>🏋️ Exercise<\/h3>\n<p>Take one English ad you like and transcreate it into Egyptian dialect and into MSA. Note what changed beyond the words.<\/p>", "html_ar": "<h3>🔧 مثال محلول — اقتصاديات الدفع عند الاستلام في مصر<\/h3>\n<p>متجر يستقبل 1,000 طلب دفع عند الاستلام شهريًا بمتوسط 600 جنيه. 25% يُرفضون عند الباب، وكل توصيل فاشل يكلّف 60 جنيهًا.\n- الخسارة: 250 × 60 = <strong>15,000 جنيه شهريًا<\/strong> تكلفة صافية، فضلًا عن المخزون العالق.\n- الإصلاح: تأكيد عبر واتساب خلال ساعة من الطلب، حافز خصم صغير للدفع المسبق، وحظر الرافضين المتكرّرين. إن هبط الرفض إلى 15% فهذا <strong>توفير 6,000 جنيه شهريًا و100 طلب مُسلَّم إضافي.<\/strong><\/p>\n<h3>🧪 حالة اختبار — خطة وسائط رمضان<\/h3>\n<p><strong>المعطى:<\/strong> علامة توصيل طعام سعودية تُبقي جدول النشر النهاري المعتاد وميزانيات يومية ثابتة طوال رمضان. الأداء يتراجع بحلول اليوم الخامس.<\/p><details class=\"solution\"><summary>{{REVEAL}}<\/summary><p>السلوك يتغيّر في رمضان — الانتباه والطلبات تتركّز حول الإفطار والليل المتأخر حتى السحور. انقل الميزانيات والنشر لساعات المساء والليل، غيّر الإبداع لمواضيع الإفطار والسحور والعائلة باللهجة السعودية، جهّز نسخًا إبداعية متعدّدة ضد الملل على مدى 30 يومًا، خطّط دفعة قبل العيد، ووفّر خدمة عملاء للطلب الليلي.<\/p><\/details><h3>🏋️ تمرين<\/h3>\n<p>خذ إعلانًا إنجليزيًا يعجبك وأعد إبداعه باللهجة المصرية وبالفصحى. دوّن ما تغيّر أبعد من الكلمات.<\/p>"}], "questions": [{"n": 1, "level": 1, "section": "Marketing Fundamentals", "q": "What is digital marketing?", "a": "<p>Promoting products, services, or brands through digital channels — search, social, email, websites, apps, and video — with the advantages of measurability, targeting, and real-time optimization.<\/p>", "q_ar": "ما هو التسويق الرقمي؟", "a_ar": "<p>الترويج للمنتجات أو الخدمات أو العلامات عبر القنوات الرقمية — بحث وتواصل وبريد ومواقع وتطبيقات وفيديو — بمزايا القياس والاستهداف والتحسين الفوري.<\/p>"}, {"n": 2, "level": 1, "section": "Marketing Fundamentals", "q": "What's the difference between inbound and outbound marketing?", "a": "<p>Inbound attracts customers who are already looking (SEO, content, social) — they come to you. Outbound pushes messages at people who weren't looking (cold ads, cold email, cold calls).<\/p>", "q_ar": "ما الفرق بين التسويق الداخلي والخارجي؟", "a_ar": "<p>الداخلي يجذب من يبحث أصلًا (سيو، محتوى، تواصل) فيأتون إليك. الخارجي يدفع الرسائل لمن لا يبحث (إعلانات باردة، بريد بارد، اتصالات باردة).<\/p>"}, {"n": 3, "level": 1, "section": "Marketing Fundamentals", "q": "Explain the POE model.", "a": "<p>Paid media (traffic you buy — ads), Owned media (assets you control — website, email list), Earned media (attention you earn — SEO rankings, shares, PR, reviews).<\/p>", "q_ar": "اشرح نموذج POE.", "a_ar": "<p>وسائط مدفوعة (زيارات تشتريها)، مملوكة (أصول تتحكّم بها: موقع، قائمة بريد)، مكتسبة (انتباه تكسبه: ترتيب سيو، مشاركات، علاقات عامة، مراجعات).<\/p>"}, {"n": 4, "level": 1, "section": "Marketing Fundamentals", "q": "What are the stages of a marketing funnel?", "a": "<p>Awareness → Consideration → Conversion → Retention → Advocacy. Top-of-funnel (TOFU) builds awareness, middle (MOFU) nurtures, bottom (BOFU) converts.<\/p>", "q_ar": "ما مراحل قمع التسويق؟", "a_ar": "<p>الوعي ← التفكير ← التحويل ← الاحتفاظ ← الترويج. أعلى القمع يبني الوعي، ووسطه يغذّي، وقاعه يحوّل.<\/p>"}, {"n": 5, "level": 1, "section": "Marketing Fundamentals", "q": "What is a buyer persona?", "a": "<p>A semi-fictional profile of your ideal customer built from data and research — demographics, goals, pain points, objections, and buying behavior — used to guide targeting and messaging.<\/p>", "q_ar": "ما شخصية المشتري؟", "a_ar": "<p>ملف شبه خيالي لعميلك المثالي مبني على بيانات وأبحاث — الديموغرافيا والأهداف ونقاط الألم والاعتراضات وسلوك الشراء — يوجّه الاستهداف والرسائل.<\/p>"}, {"n": 6, "level": 1, "section": "Marketing Fundamentals", "q": "Features vs. benefits — what's the difference?", "a": "<p>A feature is what the product has (\"256GB storage\"); a benefit is what the customer gets (\"never delete a photo again\"). Marketing sells benefits.<\/p>", "q_ar": "الخصائص مقابل المنافع — ما الفرق؟", "a_ar": "<p>الخاصية ما يملكه المنتج («سعة ٢٥٦ جيجا»)؛ والمنفعة ما يحصل عليه العميل («لن تحذف صورة أبدًا»). التسويق يبيع المنافع.<\/p>"}, {"n": 7, "level": 1, "section": "Marketing Fundamentals", "q": "What is a USP / value proposition?", "a": "<p>The clear statement of what you offer, for whom, and why it's better or different than alternatives. It answers: \"Why should I buy from you instead of anyone else — or doing nothing?\"<\/p>", "q_ar": "ما عرض القيمة الفريد (USP)؟", "a_ar": "<p>البيان الواضح لما تقدّمه، ولمن، ولماذا هو أفضل أو مختلف عن البدائل. يجيب: «لماذا أشتري منك لا من غيرك — أو لا أفعل شيئًا؟»<\/p>"}, {"n": 8, "level": 1, "section": "Marketing Fundamentals", "q": "What is STP?", "a": "<p>Segmentation (divide the market into groups), Targeting (choose which groups to serve), Positioning (define how you want to be perceived by them).<\/p>", "q_ar": "ما هو STP؟", "a_ar": "<p>التقسيم (تجزئة السوق لمجموعات)، الاستهداف (اختيار المجموعات التي تخدمها)، التموضع (كيف تريد أن تُرى لديهم).<\/p>"}, {"n": 9, "level": 1, "section": "Marketing Fundamentals", "q": "B2B vs. B2C marketing — key differences?", "a": "<p>B2B: longer sales cycles, buying committees, rational + risk-driven decisions, channels like LinkedIn/webinars/ABM, pipeline metrics. B2C: individual buyers, shorter cycles, emotion-driven, channels like Instagram/TikTok/search, ROAS metrics.<\/p>", "q_ar": "B2B مقابل B2C — الفروق الرئيسية؟", "a_ar": "<p>B2B: دورات بيع أطول، لجان شراء، قرارات عقلانية وحذرة، قنوات مثل لينكدإن والندوات وABM، ومقاييس خط الأنابيب. B2C: مشترون أفراد، دورات أقصر، قرارات عاطفية، قنوات مثل إنستجرام وتيك توك والبحث، ومقاييس ROAS.<\/p>"}, {"n": 10, "level": 1, "section": "Marketing Fundamentals", "q": "What is a KPI, and how does it differ from a metric?", "a": "<p>All KPIs are metrics, but a KPI is a metric tied directly to a business objective (e.g., CAC, MQLs, ROAS). Followers is a metric; revenue per email subscriber can be a KPI.<\/p>", "q_ar": "ما KPI وكيف يختلف عن المقياس؟", "a_ar": "<p>كل KPI مقياس، لكن KPI مرتبط مباشرة بهدف عمل (CAC، MQLs، ROAS). عدد المتابعين مقياس؛ والإيراد لكل مشترك بريدي قد يكون KPI.<\/p>"}, {"n": 11, "level": 1, "section": "Marketing Fundamentals", "q": "What is CAC and how is it calculated?", "a": "<p>Customer Acquisition Cost = total sales &amp; marketing spend ÷ number of new customers acquired in the same period.<\/p>", "q_ar": "ما هي CAC وكيف تُحسب؟", "a_ar": "<p>تكلفة اكتساب العميل = إجمالي إنفاق التسويق والمبيعات ÷ عدد العملاء الجدد في الفترة نفسها.<\/p>"}, {"n": 12, "level": 1, "section": "Marketing Fundamentals", "q": "What is LTV and why does the CAC:LTV ratio matter?", "a": "<p>Lifetime Value is the total profit a customer generates over their relationship with you. A healthy ratio is ≥1:3 — LTV determines the maximum you can afford to spend on acquisition.<\/p>", "q_ar": "ما هي LTV ولماذا تهمّ نسبة CAC:LTV؟", "a_ar": "<p>قيمة عمر العميل هي إجمالي الربح المتوقّع منه. النسبة الصحية ≥ ١:٣ — وقيمة LTV تحدّد أقصى ما يمكنك إنفاقه على الاكتساب.<\/p>"}, {"n": 13, "level": 1, "section": "Marketing Fundamentals", "q": "What is a conversion?", "a": "<p>Any desired action a visitor completes — purchase, signup, download, call, form fill. \"Conversion\" should always be defined per campaign.<\/p>", "q_ar": "ما التحويل؟", "a_ar": "<p>أي إجراء مرغوب يكمله الزائر — شراء، تسجيل، تنزيل، اتصال، تعبئة نموذج. يجب تعريف «التحويل» لكل حملة.<\/p>"}, {"n": 14, "level": 1, "section": "Marketing Fundamentals", "q": "What is a landing page and how does it differ from a homepage?", "a": "<p>A landing page is built for one campaign, one audience, one action — minimal navigation and one CTA. A homepage serves many audiences and paths.<\/p>", "q_ar": "ما صفحة الهبوط وكيف تختلف عن الرئيسية؟", "a_ar": "<p>صفحة الهبوط مبنية لحملة واحدة وجمهور واحد وإجراء واحد — تنقّل قليل ودعوة واحدة. الصفحة الرئيسية تخدم جماهير ومسارات كثيرة.<\/p>"}, {"n": 15, "level": 1, "section": "Marketing Fundamentals", "q": "What is a CTA?", "a": "<p>Call to Action — the instruction telling the user what to do next (\"Start free trial\"). Strong CTAs are specific, action-oriented, and value-loaded.<\/p>", "q_ar": "ما الدعوة لاتخاذ إجراء (CTA)؟", "a_ar": "<p>التعليمة التي تخبر المستخدم بالخطوة التالية («ابدأ التجربة المجانية»). الدعوات القوية محدّدة وفعلية ومحمّلة بالقيمة.<\/p>"}, {"n": 16, "level": 1, "section": "Marketing Fundamentals", "q": "What is a lead magnet?", "a": "<p>Free value (template, checklist, mini-course, tool) exchanged for contact information — the standard mechanism for building email lists.<\/p>", "q_ar": "ما مغناطيس الجذب؟", "a_ar": "<p>قيمة مجانية (قالب، قائمة، دورة مصغّرة، أداة) مقابل بيانات التواصل — الآلية القياسية لبناء قوائم البريد.<\/p>"}, {"n": 17, "level": 1, "section": "Marketing Fundamentals", "q": "Define impression, reach, and frequency.", "a": "<p>Impression = one display of your content/ad. Reach = unique people who saw it. Frequency = average impressions per person (impressions ÷ reach).<\/p>", "q_ar": "عرّف مرات الظهور والوصول والتكرار.", "a_ar": "<p>الظهور = عرض واحد لمحتواك أو إعلانك. الوصول = الأشخاص الفريدون الذين رأوه. التكرار = متوسط مرات الظهور لكل شخص (الظهور ÷ الوصول).<\/p>"}, {"n": 18, "level": 1, "section": "Marketing Fundamentals", "q": "What is CTR and what does a low CTR indicate?", "a": "<p>Click-through rate = clicks ÷ impressions. Low CTR signals weak relevance — wrong audience, weak creative/headline, or poor offer.<\/p>", "q_ar": "ما معدّل النقر وماذا يعني انخفاضه؟", "a_ar": "<p>CTR = النقرات ÷ مرات الظهور. انخفاضه يشير لضعف الملاءمة — جمهور خاطئ، إبداع أو عنوان ضعيف، أو عرض ضعيف.<\/p>"}, {"n": 19, "level": 1, "section": "Marketing Fundamentals", "q": "What is bounce rate / engagement rate in GA4?", "a": "<p>GA4 flipped the metric: an \"engaged session\" lasts 10+ seconds, has a conversion, or has 2+ pageviews. Bounce rate is simply the percentage of non-engaged sessions.<\/p>", "q_ar": "ما معدّل الارتداد/التفاعل في GA4؟", "a_ar": "<p>GA4 قلب المقياس: «الجلسة المتفاعلة» تدوم ١٠ ثوانٍ+ أو بها تحويل أو صفحتان+. معدّل الارتداد ببساطة نسبة الجلسات غير المتفاعلة.<\/p>"}, {"n": 20, "level": 1, "section": "Marketing Fundamentals", "q": "What is remarketing/retargeting?", "a": "<p>Showing ads to people who already interacted with you (site visitors, video viewers, cart abandoners). It typically has the highest ROAS because the audience is warm.<\/p>", "q_ar": "ما إعادة الاستهداف؟", "a_ar": "<p>عرض إعلانات لمن تفاعل معك سابقًا (زوّار الموقع، مشاهدو الفيديو، تاركو السلة). غالبًا أعلى ROAS لأن الجمهور دافئ.<\/p>"}, {"n": 21, "level": 1, "section": "Marketing Fundamentals", "q": "What is A/B testing?", "a": "<p>Comparing two versions of an asset (page, subject line, ad) by splitting traffic randomly and measuring which converts better, with statistical significance.<\/p>", "q_ar": "ما اختبار A/B؟", "a_ar": "<p>مقارنة نسختين من أصل (صفحة، عنوان بريد، إعلان) بتقسيم الزيارات عشوائيًا وقياس أيهما يحوّل أفضل، بدلالة إحصائية.<\/p>"}, {"n": 22, "level": 1, "section": "Marketing Fundamentals", "q": "What is UGC?", "a": "<p>User-Generated Content — content created by customers/users (reviews, photos, videos). It converts well because it's authentic social proof.<\/p>", "q_ar": "ما UGC؟", "a_ar": "<p>المحتوى الذي ينشئه المستخدمون — مراجعات وصور وفيديوهات العملاء. يحوّل جيدًا لأنه دليل اجتماعي أصيل.<\/p>"}, {"n": 23, "level": 1, "section": "Marketing Fundamentals", "q": "What's the difference between organic and paid traffic?", "a": "<p>Organic is unpaid traffic earned through SEO, content, and social reach; paid is bought through ads. Organic compounds over time; paid scales instantly but stops when spend stops.<\/p>", "q_ar": "ما الفرق بين الزيارات العضوية والمدفوعة؟", "a_ar": "<p>العضوية مجانية مكتسبة عبر السيو والمحتوى والوصول الاجتماعي؛ والمدفوعة مشتراة بالإعلانات. العضوية تتراكم مع الوقت؛ والمدفوعة تتوسّع فورًا وتتوقّف بتوقّف الإنفاق.<\/p>"}, {"n": 24, "level": 1, "section": "Marketing Fundamentals", "q": "What is brand marketing vs. performance marketing?", "a": "<p>Brand builds long-term memory, trust, and demand (harder to measure); performance drives immediate, trackable actions. Mature companies invest in both — brand makes performance cheaper.<\/p>", "q_ar": "تسويق العلامة مقابل تسويق الأداء؟", "a_ar": "<p>العلامة تبني ذاكرة وثقة وطلبًا طويل الأمد (أصعب قياسًا)؛ والأداء يقود إجراءات فورية قابلة للتتبّع. الشركات الناضجة تستثمر في الاثنين — العلامة تجعل الأداء أرخص.<\/p>"}, {"n": 25, "level": 1, "section": "Marketing Fundamentals", "q": "What is word-of-mouth marketing and can it be engineered?", "a": "<p>Customers recommending you to others. Yes — through remarkable products, referral programs, shareable content (STEPPS framework), and community.<\/p>", "q_ar": "ما التسويق الشفهي وهل يمكن هندسته؟", "a_ar": "<p>العملاء يوصون بك لغيرهم. نعم — بمنتجات لافتة وبرامج إحالة ومحتوى قابل للمشاركة (إطار STEPPS) ومجتمع.<\/p>"}, {"n": 26, "level": 1, "section": "Marketing Fundamentals", "q": "What is a marketing qualified lead (MQL) vs. sales qualified lead (SQL)?", "a": "<p>MQL: a lead showing enough fit/engagement to be worth nurturing. SQL: a lead vetted as ready for direct sales contact. The handoff criteria should be agreed between marketing and sales.<\/p>", "q_ar": "ما الفرق بين MQL وSQL؟", "a_ar": "<p>MQL: عميل محتمل يُظهر ملاءمة وتفاعلًا يستحقّان التغذية. SQL: عميل تمّ التحقّق من جاهزيته للتواصل المباشر من المبيعات. معايير التسليم يجب أن يتّفق عليها التسويق والمبيعات.<\/p>"}, {"n": 27, "level": 1, "section": "Marketing Fundamentals", "q": "What is churn?", "a": "<p>The rate at which customers stop buying/subscribing. Reducing churn raises LTV, which allows higher CAC and faster growth.<\/p>", "q_ar": "ما معدّل التسرّب (Churn)؟", "a_ar": "<p>معدّل توقّف العملاء عن الشراء أو الاشتراك. خفضه يرفع LTV، ما يسمح بـCAC أعلى ونمو أسرع.<\/p>"}, {"n": 28, "level": 1, "section": "Marketing Fundamentals", "q": "What is positioning, in one sentence?", "a": "<p>Owning a distinct, valuable place in the customer's mind relative to alternatives — the strategic decision every message should reinforce.<\/p>", "q_ar": "ما التموضع في جملة واحدة؟", "a_ar": "<p>امتلاك مكان مميّز وقيّم في ذهن العميل مقارنة بالبدائل — القرار الاستراتيجي الذي يجب أن تعزّزه كل رسالة.<\/p>"}, {"n": 29, "level": 1, "section": "Marketing Fundamentals", "q": "Name the 4 Ps and their digital equivalents.", "a": "<p>Product (offer/features), Price (pricing/discounts/freemium), Place (website, app stores, marketplaces), Promotion (all digital channels).<\/p>", "q_ar": "اذكر العناصر الأربعة (4Ps) ومقابلها الرقمي.", "a_ar": "<p>المنتج (العرض/الخصائص)، السعر (التسعير/الخصومات/المجاني)، المكان (الموقع، المتاجر، الأسواق)، الترويج (كل القنوات الرقمية).<\/p>"}, {"n": 30, "level": 1, "section": "Marketing Fundamentals", "q": "How would you explain ROI vs. ROAS?", "a": "<p>ROAS = revenue ÷ ad spend (channel-level efficiency). ROI = (profit − total cost) ÷ total cost (true business return, including product costs, tools, and labor). A 3x ROAS can still be unprofitable.<\/p>", "q_ar": "كيف تشرح الفرق بين ROI وROAS؟", "a_ar": "<p>ROAS = الإيراد ÷ الإنفاق الإعلاني (كفاءة القناة). ROI = (الربح − إجمالي التكلفة) ÷ التكلفة (العائد الحقيقي شاملًا تكلفة المنتج والأدوات والعمل). قد يكون ROAS ٣× وما زال خاسرًا.<\/p>"}, {"n": 31, "level": 1, "section": "SEO", "q": "What is SEO?", "a": "<p>Optimizing a website's content, technical health, and authority so it ranks higher in organic search results and earns more qualified traffic.<\/p>", "q_ar": "ما هو السيو؟", "a_ar": "<p>تحسين محتوى الموقع وصحته التقنية وسلطته ليظهر أعلى في نتائج البحث المجانية ويكسب زيارات مؤهّلة أكثر.<\/p>"}, {"n": 32, "level": 1, "section": "SEO", "q": "What are the main types of SEO?", "a": "<p>On-page (content and HTML), technical (crawlability, speed, structure), and off-page (backlinks and authority signals). Local SEO is a fourth specialization.<\/p>", "q_ar": "ما الأنواع الرئيسية للسيو؟", "a_ar": "<p>الداخلي (المحتوى وHTML)، التقني (الزحف والسرعة والبنية)، والخارجي (الروابط وإشارات السلطة). السيو المحلي تخصص رابع.<\/p>"}, {"n": 33, "level": 1, "section": "SEO", "q": "What is a SERP?", "a": "<p>Search Engine Results Page — including organic listings, ads, featured snippets, map packs, People Also Ask, images, and AI-generated overviews.<\/p>", "q_ar": "ما SERP؟", "a_ar": "<p>صفحة نتائج محرك البحث — تشمل النتائج العضوية والإعلانات والمقتطفات المميّزة وحزم الخرائط و«أسئلة يطرحها الناس» والصور وملخّصات الذكاء الاصطناعي.<\/p>"}, {"n": 34, "level": 1, "section": "SEO", "q": "What is search intent and what are its four types?", "a": "<p>The goal behind a query: informational (learn), navigational (find a site), commercial (compare before buying), transactional (buy now). Matching intent is ranking requirement #1.<\/p>", "q_ar": "ما نيّة البحث وأنواعها الأربعة؟", "a_ar": "<p>الهدف وراء الاستعلام: معلوماتية (يتعلّم)، تنقّلية (يجد موقعًا)، تجارية (يقارن قبل الشراء)، شرائية (يشتري الآن). مطابقة النيّة شرط الترتيب الأول.<\/p>"}, {"n": 35, "level": 1, "section": "SEO", "q": "What is a long-tail keyword?", "a": "<p>A longer, more specific query (\"best trail running shoes for flat feet\") — lower volume but less competition and higher intent than head terms (\"running shoes\").<\/p>", "q_ar": "ما الكلمة المفتاحية الطويلة؟", "a_ar": "<p>استعلام أطول وأكثر تحديدًا («أفضل حذاء جري للقدم المسطّحة») — حجم أقل لكن منافسة أقل ونيّة أعلى من الكلمات الرئيسية («حذاء جري»).<\/p>"}, {"n": 36, "level": 1, "section": "SEO", "q": "What are title tags and meta descriptions?", "a": "<p>The title tag is the clickable headline in search results (a direct ranking factor); the meta description is the snippet below (not a ranking factor, but drives CTR).<\/p>", "q_ar": "ما وسوم العنوان والأوصاف التعريفية؟", "a_ar": "<p>وسم العنوان هو العنوان القابل للنقر في النتائج (عامل ترتيب مباشر)؛ والوصف هو المقتطف تحته (ليس عامل ترتيب لكنه يرفع النقر).<\/p>"}, {"n": 37, "level": 1, "section": "SEO", "q": "What is a backlink and why does it matter?", "a": "<p>A link from another website to yours. Backlinks act as votes of trust; links from relevant, authoritative sites remain among the strongest ranking signals.<\/p>", "q_ar": "ما الرابط الخلفي ولماذا يهمّ؟", "a_ar": "<p>رابط من موقع آخر إلى موقعك. الروابط الخلفية أصوات ثقة؛ والروابط من مواقع موثوقة وذات صلة تبقى من أقوى إشارات الترتيب.<\/p>"}, {"n": 38, "level": 1, "section": "SEO", "q": "What is E-E-A-T?", "a": "<p>Experience, Expertise, Authoritativeness, Trustworthiness — Google's quality framework, especially critical for YMYL (Your Money or Your Life) topics like health and finance.<\/p>", "q_ar": "ما E-E-A-T؟", "a_ar": "<p>الخبرة والاختصاص والسلطة والموثوقية — إطار جودة جوجل، حاسم خاصة لمواضيع «مالك أو حياتك» كالصحة والمال.<\/p>"}, {"n": 39, "level": 2, "section": "SEO", "q": "White hat vs. black hat SEO?", "a": "<p>White hat follows guidelines (quality content, earned links). Black hat manipulates rankings (link buying, cloaking, keyword stuffing) and risks penalties or deindexing.<\/p>", "q_ar": "السيو الأبيض مقابل الأسود؟", "a_ar": "<p>الأبيض يتبع الإرشادات (محتوى جيد، روابط مكتسبة). الأسود يتلاعب بالترتيب (شراء روابط، إخفاء، حشو كلمات) ويخاطر بالعقوبات أو الإزالة من الفهرس.<\/p>"}, {"n": 40, "level": 2, "section": "SEO", "q": "What is keyword cannibalization and how do you fix it?", "a": "<p>Multiple pages on your site competing for the same query, splitting signals. Fix by consolidating pages (merge + 301 redirect), differentiating intent, or adjusting internal links and canonicals.<\/p>", "q_ar": "ما تنافس الكلمات الداخلي وكيف تصلحه؟", "a_ar": "<p>صفحات متعدّدة في موقعك تتنافس على الاستعلام نفسه فتتشتّت الإشارات. أصلحه بدمج الصفحات (دمج + تحويل 301)، أو تمييز النيّة، أو ضبط الروابط الداخلية والوسوم القانونية.<\/p>"}, {"n": 41, "level": 2, "section": "SEO", "q": "What are canonical tags?", "a": "<p><code>rel=\"canonical\"<\/code> tells search engines which version of duplicate/similar pages is the primary one to index and rank.<\/p>", "q_ar": "ما الوسوم القانونية (canonical)؟", "a_ar": "<p>تخبر محركات البحث أي نسخة من الصفحات المكرّرة أو المتشابهة هي الأساسية للفهرسة والترتيب.<\/p>"}, {"n": 42, "level": 2, "section": "SEO", "q": "What's the difference between a 301 and 302 redirect?", "a": "<p>301 = permanent (passes link equity, use for migrations). 302 = temporary (signals the original will return).<\/p>", "q_ar": "ما الفرق بين تحويل 301 و302؟", "a_ar": "<p>301 = دائم (ينقل قيمة الروابط، استخدمه في نقل المواقع). 302 = مؤقت (يشير لعودة الأصل).<\/p>"}, {"n": 43, "level": 2, "section": "SEO", "q": "What are Core Web Vitals?", "a": "<p>Google's UX metrics: LCP (loading — largest element under 2.5s), INP (interactivity — response under 200ms), CLS (visual stability — layout shift under 0.1).<\/p>", "q_ar": "ما مؤشرات Core Web Vitals؟", "a_ar": "<p>مقاييس تجربة المستخدم من جوجل: LCP (التحميل — أكبر عنصر خلال ٢٫٥ ثانية)، INP (التفاعل — استجابة أقل من ٢٠٠ مللي ثانية)، CLS (الثبات البصري — إزاحة أقل من ٠٫١).<\/p>"}, {"n": 44, "level": 2, "section": "SEO", "q": "What is schema markup / structured data?", "a": "<p>Code (usually JSON-LD) that labels your content (product, review, FAQ, recipe) so search engines understand it and can display rich results.<\/p>", "q_ar": "ما البيانات المنظّمة (Schema)؟", "a_ar": "<p>كود (غالبًا JSON-LD) يصنّف محتواك (منتج، مراجعة، أسئلة، وصفة) لتفهمه محركات البحث وتعرض نتائج غنية.<\/p>"}, {"n": 45, "level": 2, "section": "SEO", "q": "How do you do keyword research, step by step?", "a": "<p>Seed terms → expand with tools (Keyword Planner, Ahrefs/Semrush) and SERP mining (People Also Ask, autocomplete) → group by intent and topic → prioritize by volume, difficulty, business value → map each cluster to a page.<\/p>", "q_ar": "كيف تجري بحث الكلمات خطوة بخطوة؟", "a_ar": "<p>كلمات بذرية ← توسيع بالأدوات وتنقيب النتائج (أسئلة الناس، الإكمال التلقائي) ← تجميع حسب النيّة والموضوع ← ترتيب حسب الحجم والصعوبة وقيمة العمل ← ربط كل مجموعة بصفحة.<\/p>"}, {"n": 46, "level": 2, "section": "SEO", "q": "What is a topic cluster / hub-and-spoke model?", "a": "<p>One comprehensive pillar page targeting a broad topic, supported by interlinked articles targeting subtopics — building topical authority and clean internal linking.<\/p>", "q_ar": "ما عنقود المواضيع (المحور والأذرع)؟", "a_ar": "<p>صفحة ركيزة شاملة لموضوع عريض، تدعمها مقالات مترابطة لمواضيع فرعية — تبني السلطة الموضوعية وربطًا داخليًا نظيفًا.<\/p>"}, {"n": 47, "level": 2, "section": "SEO", "q": "How would you SEO-audit a website?", "a": "<p>Crawl it (Screaming Frog) for technical issues; check indexation (Search Console); review Core Web Vitals; audit content quality/intent match; analyze backlink profile; benchmark against top competitors; deliver prioritized fixes by impact/effort.<\/p>", "q_ar": "كيف تدقّق سيو موقع؟", "a_ar": "<p>ازحفه (Screaming Frog) للمشكلات التقنية؛ افحص الفهرسة (Search Console)؛ راجع Core Web Vitals؛ دقّق جودة المحتوى وتطابق النيّة؛ حلّل الروابط الخلفية؛ قارن بالمنافسين؛ وسلّم إصلاحات مرتّبة حسب الأثر والجهد.<\/p>"}, {"n": 48, "level": 2, "section": "SEO", "q": "What is internal linking and why is it powerful?", "a": "<p>Links between your own pages — they distribute authority, establish topical relationships, and guide both crawlers and users. It's the most underused free SEO lever.<\/p>", "q_ar": "ما الربط الداخلي ولماذا هو قوي؟", "a_ar": "<p>روابط بين صفحاتك — توزّع السلطة وتحدّد العلاقات الموضوعية وتوجّه الزواحف والمستخدمين. أكثر رافعة سيو مجانية مُهملة.<\/p>"}, {"n": 49, "level": 2, "section": "SEO", "q": "How do you earn backlinks ethically?", "a": "<p>Linkable assets (original data, free tools, definitive guides), digital PR, expert commentary for journalists, guest contributions, unlinked mention reclamation, and broken-link outreach.<\/p>", "q_ar": "كيف تكسب روابط خلفية بأخلاق؟", "a_ar": "<p>أصول تستحق الربط (بيانات أصلية، أدوات مجانية، أدلّة شاملة)، علاقات عامة رقمية، تعليقات خبراء للصحفيين، مساهمات ضيفة، استعادة الإشارات بلا روابط، والتواصل بشأن الروابط المكسورة.<\/p>"}, {"n": 50, "level": 2, "section": "SEO", "q": "What is robots.txt vs. a noindex tag?", "a": "<p>robots.txt blocks crawling of paths (but blocked pages can still be indexed if linked); noindex allows crawling but forbids indexing. To remove a page from search, use noindex — not robots.txt.<\/p>", "q_ar": "robots.txt مقابل وسم noindex؟", "a_ar": "<p>robots.txt يمنع الزحف لمسارات (لكن الصفحات الممنوعة قد تُفهرس إن رُبطت)؛ وnoindex يسمح بالزحف ويمنع الفهرسة. لإزالة صفحة من البحث استخدم noindex.<\/p>"}, {"n": 51, "level": 2, "section": "SEO", "q": "What is an XML sitemap?", "a": "<p>A file listing your important URLs to help search engines discover and prioritize crawling — submitted via Search Console.<\/p>", "q_ar": "ما خريطة موقع XML؟", "a_ar": "<p>ملف يسرد روابطك المهمة لمساعدة محركات البحث على اكتشافها وترتيب زحفها — يُرسل عبر Search Console.<\/p>"}, {"n": 52, "level": 2, "section": "SEO", "q": "How do you measure SEO success?", "a": "<p>Qualified organic traffic, rankings for money keywords, organic conversions/revenue, referring domain growth, and share of voice — reported against targets, not in isolation.<\/p>", "q_ar": "كيف تقيس نجاح السيو؟", "a_ar": "<p>الزيارات العضوية المؤهّلة، ترتيب الكلمات المربحة، التحويلات والإيراد العضوي، نمو النطاقات المحيلة، وحصّة الصوت — مقابل أهداف لا بمعزل.<\/p>"}, {"n": 53, "level": 3, "section": "SEO", "q": "A site's traffic dropped 40% overnight. Walk me through your diagnosis.", "a": "<p>Check: (1) tracking breakage (GA4/tag issues), (2) Search Console for manual actions or indexing errors, (3) algorithm update timing (industry trackers), (4) recent site changes/migrations (redirects, robots, noindex accidents), (5) SERP feature changes or new competitors, (6) seasonality. Isolate whether the drop is site-wide or page/section-specific before acting.<\/p>", "q_ar": "انخفضت زيارات موقع ٤٠٪ فجأة. اشرح تشخيصك.", "a_ar": "<p>افحص: (١) عطل التتبّع، (٢) Search Console لإجراءات يدوية أو أخطاء فهرسة، (٣) توقيت تحديث الخوارزمية، (٤) تغييرات حديثة بالموقع (تحويلات، noindex بالخطأ)، (٥) منافسون جدد، (٦) الموسمية. حدّد أولًا إن كان الانخفاض شاملًا أم في قسم بعينه.<\/p>"}, {"n": 54, "level": 3, "section": "SEO", "q": "How does SEO change with AI search (AI Overviews, chat assistants)?", "a": "<p>Zero-click results grow, so optimize for being cited: clear entity-rich content, structured data, strong E-E-A-T, digital PR for brand mentions, and measuring visibility in AI answers (GEO/AEO) — while doubling down on bottom-funnel and brand queries AI can't fully absorb.<\/p>", "q_ar": "كيف يتغيّر السيو مع بحث الذكاء الاصطناعي؟", "a_ar": "<p>تزداد النتائج بلا نقر، فحسّن لتُستشهد: محتوى واضح غني بالكيانات، بيانات منظّمة، E-E-A-T قوي، علاقات عامة لإشارات العلامة، وقياس الظهور في إجابات الذكاء الاصطناعي — مع مضاعفة التركيز على استعلامات أسفل القمع والعلامة.<\/p>"}, {"n": 55, "level": 3, "section": "SEO", "q": "What is programmatic SEO and when is it appropriate?", "a": "<p>Generating many pages from structured data templates (e.g., \"X vs Y\" comparisons, city pages). Appropriate when each page serves genuine unique search demand with real value — dangerous (thin content) when it doesn't.<\/p>", "q_ar": "ما السيو البرمجي ومتى يناسب؟", "a_ar": "<p>توليد صفحات كثيرة من قوالب بيانات منظّمة (مقارنات «X مقابل Y»، صفحات المدن). يناسب حين تخدم كل صفحة طلب بحث فعليًا بقيمة حقيقية — وخطير (محتوى رقيق) حين لا تفعل.<\/p>"}, {"n": 56, "level": 3, "section": "SEO", "q": "How do you prioritize SEO work with limited resources?", "a": "<p>Impact × effort scoring: quick technical wins first (broken redirects, indexation bugs), then optimizing existing pages ranking positions 5–15 (striking distance), then new content for validated demand, then long-horizon authority building.<\/p>", "q_ar": "كيف ترتّب أعمال السيو بموارد محدودة؟", "a_ar": "<p>تقييم الأثر × الجهد: مكاسب تقنية سريعة أولًا، ثم تحسين صفحات في المراكز ٥–١٥، ثم محتوى جديد لطلب مثبت، ثم بناء سلطة طويل الأمد.<\/p>"}, {"n": 57, "level": 3, "section": "SEO", "q": "How do you handle SEO for a site migration?", "a": "<p>Full URL inventory → 1:1 301 redirect map → preserve content/titles/internal links → staging crawl → launch with Search Console monitoring → track rankings/traffic by section for 8–12 weeks. Expect temporary flux; panic only if losses persist.<\/p>", "q_ar": "كيف تتعامل مع السيو عند نقل موقع؟", "a_ar": "<p>جرد كامل للروابط ← خريطة تحويل 301 واحد لواحد ← الحفاظ على المحتوى والعناوين والروابط الداخلية ← زحف بيئة الاختبار ← إطلاق مع مراقبة Search Console ← تتبّع الترتيب والزيارات لكل قسم ٨–١٢ أسبوعًا.<\/p>"}, {"n": 58, "level": 2, "section": "SEO", "q": "What is domain authority — is it a Google factor?", "a": "<p>DA/DR are third-party (Moz/Ahrefs) estimates of link authority. Google doesn't use them, but they're useful comparative proxies.<\/p>", "q_ar": "ما سلطة النطاق — هل هي عامل في جوجل؟", "a_ar": "<p>DA/DR تقديرات من أطراف ثالثة (Moz/Ahrefs) لسلطة الروابط. جوجل لا تستخدمها، لكنها مفيدة كمؤشرات مقارنة.<\/p>"}, {"n": 59, "level": 2, "section": "SEO", "q": "What is duplicate content and does it cause a penalty?", "a": "<p>Substantially identical content at multiple URLs. Usually not a penalty — Google just filters duplicates — but it wastes crawl budget and splits signals. Fix with canonicals, redirects, or consolidation.<\/p>", "q_ar": "ما المحتوى المكرّر وهل يسبّب عقوبة؟", "a_ar": "<p>محتوى متطابق تقريبًا في روابط متعدّدة. غالبًا ليس عقوبة — جوجل تصفّي المكرّر فقط — لكنه يهدر ميزانية الزحف ويشتّت الإشارات. أصلحه بالوسوم القانونية أو التحويل أو الدمج.<\/p>"}, {"n": 60, "level": 2, "section": "SEO", "q": "How do images affect SEO?", "a": "<p>Descriptive filenames and alt text (accessibility + image search), compression and next-gen formats for speed, and lazy loading — plus images earn traffic via image search and featured results.<\/p>", "q_ar": "كيف تؤثّر الصور في السيو؟", "a_ar": "<p>أسماء ملفات ونصوص بديلة وصفية (إتاحة + بحث الصور)، ضغط وصيغ حديثة للسرعة، تحميل كسول — والصور تجلب زيارات من بحث الصور.<\/p>"}, {"n": 61, "level": 1, "section": "SEO", "q": "What is local SEO's \"map pack\"?", "a": "<p>The 3 map listings shown for local-intent queries — ranked mainly by relevance, distance, and prominence (reviews, GBP completeness, citations).<\/p>", "q_ar": "ما «حزمة الخريطة» في السيو المحلي؟", "a_ar": "<p>القوائم الثلاث على الخريطة لاستعلامات النيّة المحلية — تُرتّب أساسًا بالصلة والمسافة والبروز (المراجعات، اكتمال الملف، الاقتباسات).<\/p>"}, {"n": 62, "level": 2, "section": "SEO", "q": "What are the top local ranking factors?", "a": "<p>Google Business Profile optimization (categories, completeness), review quantity/recency/rating, NAP-consistent citations, on-page local signals, and local backlinks.<\/p>", "q_ar": "ما أهم عوامل الترتيب المحلي؟", "a_ar": "<p>تحسين ملف النشاط على جوجل (الفئات، الاكتمال)، عدد المراجعات وحداثتها وتقييمها، اقتباسات NAP متّسقة، إشارات محلية في الصفحة، وروابط محلية.<\/p>"}, {"n": 63, "level": 3, "section": "SEO", "q": "Client asks: \"Guarantee me #1 on Google.\" Your response?", "a": "<p>No one can guarantee rankings — anyone who does is a red flag. I commit to a process (technical health, content targeting validated demand, authority building) and to leading indicators, with traffic/revenue goals set from a baseline audit.<\/p>", "q_ar": "عميل يقول: «اضمن لي المركز الأول في جوجل». ردّك؟", "a_ar": "<p>لا أحد يضمن الترتيب — ومن يفعل علامة تحذير. ألتزم بعملية (صحة تقنية، محتوى لطلب مثبت، بناء سلطة) وبمؤشرات مبكرة، مع أهداف زيارات وإيراد من تدقيق أساسي.<\/p>"}, {"n": 64, "level": 2, "section": "SEO", "q": "What is crawl budget and who should care?", "a": "<p>The number of pages search engines will crawl on your site in a period. Only large sites (100k+ URLs) usually need to manage it — via robots rules, faceted-navigation control, and log-file analysis.<\/p>", "q_ar": "ما ميزانية الزحف ومن يهتم بها؟", "a_ar": "<p>عدد الصفحات التي تزحفها محركات البحث في موقعك خلال فترة. المواقع الكبيرة فقط (١٠٠ ألف رابط+) تحتاج إدارتها — عبر قواعد robots والتحكّم في التصفّح المتعدّد وتحليل السجلات.<\/p>"}, {"n": 65, "level": 2, "section": "SEO", "q": "How long does SEO take to show results?", "a": "<p>Typically 3–6 months for meaningful movement, 6–12+ for competitive terms — depending on site authority, competition, and content velocity. Quick wins can come sooner from technical fixes and striking-distance optimization.<\/p>", "q_ar": "كم يستغرق السيو ليُظهر نتائج؟", "a_ar": "<p>عادة ٣–٦ أشهر لحركة ملموسة، و٦–١٢+ للكلمات التنافسية — حسب سلطة الموقع والمنافسة وسرعة المحتوى. المكاسب السريعة قد تأتي أبكر من الإصلاحات التقنية.<\/p>"}, {"n": 66, "level": 1, "section": "PPC / Paid Media", "q": "What is PPC?", "a": "<p>Pay-per-click advertising — you bid to show ads and pay when users click (or per impression/action, depending on the model).<\/p>", "q_ar": "ما هو PPC؟", "a_ar": "<p>الإعلان بالدفع لكل نقرة — تزايد لعرض الإعلانات وتدفع عند النقر (أو لكل ظهور/إجراء حسب النموذج).<\/p>"}, {"n": 67, "level": 1, "section": "PPC / Paid Media", "q": "Explain CPC, CPM, CPA, and CPL.", "a": "<p>CPC = cost per click; CPM = cost per 1,000 impressions; CPA = cost per acquisition/action; CPL = cost per lead.<\/p>", "q_ar": "اشرح CPC وCPM وCPA وCPL.", "a_ar": "<p>CPC = تكلفة النقرة؛ CPM = تكلفة الألف ظهور؛ CPA = تكلفة الاكتساب/الإجراء؛ CPL = تكلفة العميل المحتمل.<\/p>"}, {"n": 68, "level": 1, "section": "PPC / Paid Media", "q": "What is ROAS and what's a \"good\" ROAS?", "a": "<p>Revenue ÷ ad spend. \"Good\" depends on margins: a 4x ROAS is great at 50% margins, unprofitable at 20%. Always answer \"it depends on unit economics.\"<\/p>", "q_ar": "ما هو ROAS وما «الجيّد» منه؟", "a_ar": "<p>الإيراد ÷ الإنفاق الإعلاني. «الجيّد» يعتمد على الهوامش: ٤× ممتاز عند هامش ٥٠٪، وخاسر عند ٢٠٪. الجواب دائمًا: «يعتمد على اقتصاديات الوحدة».<\/p>"}, {"n": 69, "level": 1, "section": "PPC / Paid Media", "q": "What is Quality Score in Google Ads?", "a": "<p>A 1–10 diagnostic of ad relevance based on expected CTR, ad relevance, and landing page experience. Higher scores lower your effective CPC and improve position.<\/p>", "q_ar": "ما نقاط الجودة في إعلانات جوجل؟", "a_ar": "<p>تقييم من ١–١٠ لملاءمة الإعلان مبني على معدّل النقر المتوقّع وملاءمة الإعلان وتجربة صفحة الهبوط. النقاط الأعلى تخفض تكلفة نقرتك الفعلية.<\/p>"}, {"n": 70, "level": 1, "section": "PPC / Paid Media", "q": "What are keyword match types?", "a": "<p>Broad (related searches — widest), phrase (meaning of your phrase included), exact (same meaning/intent). Modern match types are intent-based, not literal.<\/p>", "q_ar": "ما أنواع مطابقة الكلمات؟", "a_ar": "<p>واسعة (عمليات بحث مرتبطة — الأوسع)، عبارة (تتضمّن معنى العبارة)، تامة (نفس المعنى والنيّة). المطابقة الحديثة قائمة على النيّة لا الحرف.<\/p>"}, {"n": 71, "level": 1, "section": "PPC / Paid Media", "q": "What are negative keywords?", "a": "<p>Terms you exclude so ads don't show for irrelevant searches (\"free,\" \"jobs,\" competitor names you don't want). Essential for controlling broad match waste.<\/p>", "q_ar": "ما الكلمات السلبية؟", "a_ar": "<p>مصطلحات تستبعدها حتى لا تظهر إعلاناتك لعمليات بحث غير ذات صلة («مجاني»، «وظائف»). ضرورية للتحكّم في هدر المطابقة الواسعة.<\/p>"}, {"n": 72, "level": 1, "section": "PPC / Paid Media", "q": "Describe the Google Ads account structure.", "a": "<p>Account → Campaigns (budget, geography, bid strategy) → Ad Groups (theme/keywords/audiences) → Ads + Assets (extensions). Meta is Campaign → Ad Set → Ads.<\/p>", "q_ar": "صِف بنية حساب إعلانات جوجل.", "a_ar": "<p>حساب ← حملات (ميزانية، جغرافيا، مزايدة) ← مجموعات إعلانية (موضوع/كلمات/جماهير) ← إعلانات وأصول. في ميتا: حملة ← مجموعة إعلانية ← إعلانات.<\/p>"}, {"n": 73, "level": 1, "section": "PPC / Paid Media", "q": "What is an impression share?", "a": "<p>The percentage of eligible auctions where your ad actually showed. Lost IS (budget) means raise budget; lost IS (rank) means improve bids/quality.<\/p>", "q_ar": "ما نسبة الظهور؟", "a_ar": "<p>نسبة المزادات المؤهّلة التي ظهر فيها إعلانك. فقدان بسبب الميزانية يعني ارفعها؛ وبسبب الترتيب يعني حسّن المزايدة أو الجودة.<\/p>"}, {"n": 74, "level": 2, "section": "PPC / Paid Media", "q": "Manual vs. automated (smart) bidding — when to use which?", "a": "<p>Automated (tCPA, tROAS, max conversions) needs conversion volume (roughly 30–50/month per campaign) to learn; below that, manual/enhanced CPC gives control. Experts feed smart bidding better data (values, server-side signals) rather than fighting it.<\/p>", "q_ar": "المزايدة اليدوية مقابل الآلية — متى تستخدم كلًّا؟", "a_ar": "<p>الآلية (tCPA، tROAS) تحتاج حجم تحويلات (~٣٠–٥٠ شهريًا لكل حملة) لتتعلّم؛ دون ذلك اليدوية تمنح تحكّمًا. الخبراء يغذّون المزايدة الذكية ببيانات أفضل بدل محاربتها.<\/p>"}, {"n": 75, "level": 2, "section": "PPC / Paid Media", "q": "What is Performance Max?", "a": "<p>Google's goal-based campaign type serving across Search, Shopping, YouTube, Display, Gmail, Maps from one asset group — powerful but low-transparency; success depends on feed quality, creative assets, and clean conversion data.<\/p>", "q_ar": "ما Performance Max؟", "a_ar": "<p>حملة جوجل القائمة على الهدف تخدم البحث والتسوّق ويوتيوب والعرض وجيميل والخرائط من مجموعة أصول واحدة — قوية لكن قليلة الشفافية؛ نجاحها يعتمد على جودة الخلاصة والأصول وبيانات التحويل النظيفة.<\/p>"}, {"n": 76, "level": 2, "section": "PPC / Paid Media", "q": "How do you structure a search campaign for a new client?", "a": "<p>Segment by intent and margin: brand campaign (protect + cheap conversions), high-intent non-brand (exact/phrase, tight themes), competitor (optional), broad/discovery with strong negatives — plus remarketing. Separate budgets so brand doesn't mask non-brand performance.<\/p>", "q_ar": "كيف تبني حملة بحث لعميل جديد؟", "a_ar": "<p>قسّم حسب النيّة والهامش: حملة علامة (حماية + تحويلات رخيصة)، حملة نيّة عالية (مطابقة تامة/عبارة بمواضيع ضيقة)، منافسين (اختياري)، حملة واسعة مع سلبيات قوية — وإعادة استهداف. افصل الميزانيات حتى لا تُخفي العلامة أداء غيرها.<\/p>"}, {"n": 77, "level": 2, "section": "PPC / Paid Media", "q": "What is ad rank?", "a": "<p>Google's auction score ≈ bid × quality score (+ asset/extension impact + context). It determines whether and where your ad shows — meaning better ads can beat bigger budgets.<\/p>", "q_ar": "ما ترتيب الإعلان؟", "a_ar": "<p>نتيجة مزاد جوجل ≈ المزايدة × نقاط الجودة (+ أثر الأصول + السياق). يحدّد ظهور إعلانك وموقعه — فالإعلانات الأفضل قد تغلب الميزانيات الأكبر.<\/p>"}, {"n": 78, "level": 2, "section": "PPC / Paid Media", "q": "What's a good CTR for search ads?", "a": "<p>Rough benchmark: 3–6% for search (brand much higher, display ~0.5–1%). But CTR is diagnostic, not the goal — a high-CTR ad attracting the wrong clicks loses money.<\/p>", "q_ar": "ما معدّل النقر الجيد لإعلانات البحث؟", "a_ar": "<p>مرجع تقريبي: ٣–٦٪ للبحث (العلامة أعلى بكثير، العرض ~٠٫٥–١٪). لكن النقر مؤشر تشخيصي لا هدف — إعلان بنقر عالٍ يجذب نقرات خاطئة يخسر مالًا.<\/p>"}, {"n": 79, "level": 2, "section": "PPC / Paid Media", "q": "How do you write a high-performing search ad?", "a": "<p>Mirror the query in the headline, lead with the differentiated benefit, include proof (numbers, ratings), add urgency or offer, strong CTA, and use all headline/description slots + assets (sitelinks, callouts) for real estate.<\/p>", "q_ar": "كيف تكتب إعلان بحث عالي الأداء؟", "a_ar": "<p>اعكس الاستعلام في العنوان، ابدأ بالمنفعة المميّزة، أضف دليلًا (أرقام، تقييمات)، استعجالًا أو عرضًا، دعوة قوية، واستخدم كل خانات العناوين والأوصاف والأصول.<\/p>"}, {"n": 80, "level": 2, "section": "PPC / Paid Media", "q": "What is frequency capping and why does it matter?", "a": "<p>Limiting how often one person sees your ad. Past a point (often 3–5+/week for cold audiences), added frequency raises cost and annoyance without adding conversions — creative fatigue.<\/p>", "q_ar": "ما حدّ التكرار ولماذا يهم؟", "a_ar": "<p>تحديد عدد مرات رؤية الشخص لإعلانك. بعد حدّ معيّن (غالبًا ٣–٥+ أسبوعيًا للجماهير الباردة) يرفع التكرار التكلفة والإزعاج دون تحويلات إضافية — إرهاق الإبداع.<\/p>"}, {"n": 81, "level": 2, "section": "PPC / Paid Media", "q": "How does the Meta ads learning phase work?", "a": "<p>Ad sets need ~50 optimization events in 7 days to exit learning; frequent edits reset it. Structure for consolidation (fewer ad sets, bigger audiences) so the algorithm gets enough signal.<\/p>", "q_ar": "كيف تعمل مرحلة التعلّم في إعلانات ميتا؟", "a_ar": "<p>تحتاج المجموعة الإعلانية ~٥٠ حدث تحسين خلال ٧ أيام للخروج من التعلّم؛ التعديلات المتكرّرة تعيدها. اجمع الهيكل (مجموعات أقل، جماهير أكبر) ليحصل الخوارزم على إشارة كافية.<\/p>"}, {"n": 82, "level": 2, "section": "PPC / Paid Media", "q": "What is broad targeting vs. interest targeting on Meta today?", "a": "<p>Post-iOS14, Meta's algorithms often outperform manual interest stacks when fed good creative + conversion signals (via Conversions API). Creative is the new targeting.<\/p>", "q_ar": "الاستهداف الواسع مقابل استهداف الاهتمامات في ميتا اليوم؟", "a_ar": "<p>بعد iOS14، غالبًا تتفوّق خوارزميات ميتا على تكديس الاهتمامات يدويًا حين تُغذّى بإبداع جيد وإشارات تحويل (عبر Conversions API). الإبداع هو الاستهداف الجديد.<\/p>"}, {"n": 83, "level": 2, "section": "PPC / Paid Media", "q": "What is the Conversions API (CAPI) / server-side tracking?", "a": "<p>Sending conversion events from your server to ad platforms directly, bypassing browser limitations (ad blockers, iOS privacy, cookie loss) — improving attribution accuracy and algorithm learning.<\/p>", "q_ar": "ما Conversions API / التتبّع من الخادم؟", "a_ar": "<p>إرسال أحداث التحويل من خادمك للمنصّات مباشرة متجاوزًا قيود المتصفح (مانعات الإعلانات، خصوصية iOS، فقدان الكوكيز) — لتحسين دقة الإسناد وتعلّم الخوارزم.<\/p>"}, {"n": 84, "level": 2, "section": "PPC / Paid Media", "q": "What's a good structure for testing ad creative?", "a": "<p>Isolate one variable at a time (hook, format, angle, offer), test 3–5 concepts per round with equal delivery where possible, kill losers fast, iterate on winners' components — a continuous creative pipeline, not one-off tests.<\/p>", "q_ar": "ما البنية الجيدة لاختبار الإبداع الإعلاني؟", "a_ar": "<p>اعزل متغيّرًا واحدًا (الخطّاف، الصيغة، الزاوية، العرض)، اختبر ٣–٥ مفاهيم لكل جولة، أوقف الخاسر بسرعة، وكرّر على مكوّنات الفائز — خط إبداع مستمر لا اختبارات منفردة.<\/p>"}, {"n": 85, "level": 2, "section": "PPC / Paid Media", "q": "How do you reduce CPA without cutting volume?", "a": "<p>Improve Quality Score/relevance, tighten negatives, improve landing page conversion rate, shift budget to best segments/dayparts, test creative, use value-based bidding — CPA = CPC ÷ CVR, so attack both levers.<\/p>", "q_ar": "كيف تخفض CPA دون خفض الحجم؟", "a_ar": "<p>حسّن نقاط الجودة والملاءمة، أحكم السلبيات، ارفع تحويل صفحة الهبوط، انقل الميزانية لأفضل الشرائح والأوقات، اختبر الإبداع، واستخدم المزايدة على القيمة — CPA = CPC ÷ معدّل التحويل.<\/p>"}, {"n": 86, "level": 2, "section": "PPC / Paid Media", "q": "What is dayparting and geotargeting?", "a": "<p>Scheduling ads by time/day and targeting by location. Both concentrate budget where conversion data shows efficiency (e.g., a plumber pausing 1–5 a.m., bidding up in high-value zip codes).<\/p>", "q_ar": "ما الجدولة الزمنية والاستهداف الجغرافي؟", "a_ar": "<p>جدولة الإعلانات حسب الوقت واليوم والاستهداف حسب الموقع. كلاهما يركّز الميزانية حيث تُظهر البيانات الكفاءة (سبّاك يوقف ١–٥ فجرًا ويرفع المزايدة في الأحياء ذات القيمة).<\/p>"}, {"n": 87, "level": 2, "section": "PPC / Paid Media", "q": "Brand bidding — should you bid on your own brand name?", "a": "<p>Usually yes when competitors bid on it, SERP ads push organic down, or you need message control; it's cheap and high-converting. Test incrementality (pause geo experiments) if you suspect it just cannibalizes organic.<\/p>", "q_ar": "هل تزايد على اسم علامتك؟", "a_ar": "<p>غالبًا نعم حين يزايد المنافسون عليه أو تدفع الإعلانات النتائج العضوية للأسفل أو تحتاج تحكّمًا في الرسالة؛ رخيص وعالي التحويل. اختبر الزيادة الفعلية إن شككت أنه يأكل العضوي فقط.<\/p>"}, {"n": 88, "level": 3, "section": "PPC / Paid Media", "q": "How do you measure incrementality?", "a": "<p>Geo holdout tests (pause spend in matched regions and compare), conversion lift studies (platform-run randomized holdouts), or MMM. The question: \"How many of these conversions would have happened anyway?\"<\/p>", "q_ar": "كيف تقيس الزيادة الفعلية (incrementality)؟", "a_ar": "<p>اختبارات حجب جغرافي (أوقف الإنفاق في مناطق متطابقة وقارن)، دراسات رفع التحويل (حجب عشوائي من المنصّة)، أو MMM. السؤال: كم من هذه التحويلات كان سيحدث على أي حال؟<\/p>"}, {"n": 89, "level": 3, "section": "PPC / Paid Media", "q": "Your ROAS looks great but revenue is flat. What's happening?", "a": "<p>Likely attribution inflation: platform is claiming organic/brand/retention conversions (view-through, brand-search capture, retargeting existing buyers). Check blended MER, new-vs-returning customer split, and run incrementality tests.<\/p>", "q_ar": "ROAS ممتاز لكن الإيراد ثابت. ما الذي يحدث؟", "a_ar": "<p>غالبًا تضخّم إسناد: المنصّة تنسب لنفسها تحويلات عضوية/علامة/احتفاظ. افحص MER المدمج، ونسبة العملاء الجدد مقابل العائدين، وأجرِ اختبارات زيادة فعلية (incrementality).<\/p>"}, {"n": 90, "level": 3, "section": "PPC / Paid Media", "q": "How would you scale a winning campaign 5x?", "a": "<p>Gradually (≤20–30% budget steps to protect learning), expand horizontally (new audiences, geos, placements, platforms), feed more creative volume, raise the ceiling with better LTV/offers, and accept efficiency decay — scale to marginal CPA targets, not average ROAS.<\/p>", "q_ar": "كيف توسّع حملة رابحة ٥ أضعاف؟", "a_ar": "<p>تدريجيًا (خطوات ميزانية ≤٢٠–٣٠٪ لحماية التعلّم)، توسّع أفقي (جماهير وجغرافيات ومنصّات جديدة)، إبداع أكثر، رفع السقف بعروض وLTV أفضل، وتقبّل تراجع الكفاءة — توسّع حتى أهداف CPA الحدّية لا متوسط ROAS.<\/p>"}, {"n": 91, "level": 2, "section": "PPC / Paid Media", "q": "What are UTM parameters and why do paid marketers live by them?", "a": "<p>URL tags (source, medium, campaign, content, term) that let analytics attribute sessions/conversions to exact ads — without them, cross-platform reporting is guesswork.<\/p>", "q_ar": "ما معاملات UTM ولماذا يعيش بها المسوّقون؟", "a_ar": "<p>وسوم روابط (المصدر، الوسيط، الحملة، المحتوى، الكلمة) تتيح للتحليلات نسب الجلسات والتحويلات لإعلانات بعينها — بدونها التقارير عبر المنصّات تخمين.<\/p>"}, {"n": 92, "level": 2, "section": "PPC / Paid Media", "q": "What is view-through conversion?", "a": "<p>A conversion credited to someone who saw (but didn't click) an ad. Useful signal, easily inflated — always report click-through and view-through separately.<\/p>", "q_ar": "ما تحويل ما بعد المشاهدة؟", "a_ar": "<p>تحويل يُنسب لشخص رأى الإعلان (دون نقر). إشارة مفيدة سهلة التضخيم — افصل دائمًا تقارير النقر عن المشاهدة.<\/p>"}, {"n": 93, "level": 1, "section": "PPC / Paid Media", "q": "What is retargeting audience segmentation?", "a": "<p>Splitting warm audiences by intent depth: all visitors &lt; product viewers &lt; cart abandoners &lt; past buyers — with distinct messages and bids for each (deeper intent = higher bid, more direct offer).<\/p>", "q_ar": "ما تقسيم جماهير إعادة الاستهداف؟", "a_ar": "<p>تقسيم الجماهير الدافئة حسب عمق النيّة: كل الزوّار &lt; مشاهدو المنتج &lt; تاركو السلة &lt; المشترون السابقون — برسائل ومزايدات مختلفة (نيّة أعمق = مزايدة أعلى وعرض أوضح).<\/p>"}, {"n": 94, "level": 2, "section": "PPC / Paid Media", "q": "What are LinkedIn Ads best used for, and what's the catch?", "a": "<p>Precise B2B targeting (title, company, industry) for lead gen and ABM. The catch: high CPCs ($8–20+), so it needs high-LTV offers and strong middle-funnel content.<\/p>", "q_ar": "فيمَ تُستخدم إعلانات لينكدإن وما العائق؟", "a_ar": "<p>استهداف B2B دقيق (المسمّى، الشركة، القطاع) لتوليد العملاء وABM. العائق: نقرات مرتفعة التكلفة، فتحتاج عروضًا عالية LTV ومحتوى قويًا لوسط القمع.<\/p>"}, {"n": 95, "level": 2, "section": "PPC / Paid Media", "q": "What KPIs would you report weekly for a paid account?", "a": "<p>Spend, conversions, CPA/ROAS vs. target, CTR and CVR trends, impression share/frequency, top movers by campaign — plus one insight and one action, not just numbers.<\/p>", "q_ar": "ما المؤشرات التي تقرّرها أسبوعيًا لحساب مدفوع؟", "a_ar": "<p>الإنفاق، التحويلات، CPA/ROAS مقابل الهدف، اتجاهات النقر والتحويل، نسبة الظهور/التكرار، أكبر التحرّكات حسب الحملة — مع بصيرة وإجراء واحد، لا أرقام فقط.<\/p>"}, {"n": 96, "level": 3, "section": "PPC / Paid Media", "q": "Google Shopping: what actually moves performance?", "a": "<p>Feed quality (titles front-loaded with keywords, accurate GTINs, attributes), competitive pricing, images, review stars, and campaign segmentation by margin/performance — the feed is the keyword.<\/p>", "q_ar": "إعلانات التسوّق: ما الذي يحرّك الأداء فعلًا؟", "a_ar": "<p>جودة الخلاصة (عناوين تبدأ بالكلمات، GTIN دقيق، سمات)، تسعير تنافسي، صور، نجوم المراجعات، وتقسيم الحملات حسب الهامش والأداء — الخلاصة هي الكلمة المفتاحية.<\/p>"}, {"n": 97, "level": 2, "section": "PPC / Paid Media", "q": "What is an ad auction, in simple terms?", "a": "<p>Every impression is auctioned in milliseconds; platforms rank bidders by bid × predicted relevance/quality, and the winner pays just enough to beat the runner-up (second-price-like dynamics).<\/p>", "q_ar": "ما المزاد الإعلاني ببساطة؟", "a_ar": "<p>كل ظهور يُزايَد عليه في أجزاء من الثانية؛ تُرتّب المنصّات المزايدين بالمزايدة × الملاءمة المتوقّعة، ويدفع الفائز ما يكفي فقط لتجاوز التالي.<\/p>"}, {"n": 98, "level": 2, "section": "PPC / Paid Media", "q": "How do iOS privacy changes (ATT) affect paid social?", "a": "<p>Reduced device-level tracking → smaller retargeting pools, modeled/delayed conversions, less granular attribution. Responses: CAPI, first-party data, broad targeting + creative testing, incrementality measurement.<\/p>", "q_ar": "كيف تؤثّر تغييرات خصوصية iOS (ATT) على الإعلانات الاجتماعية؟", "a_ar": "<p>تتبّع أقل على مستوى الجهاز ← جماهير إعادة استهداف أصغر، تحويلات منمذجة ومتأخّرة، إسناد أقل دقة. الحلول: CAPI، بيانات الطرف الأول، استهداف واسع + اختبار إبداع، وقياس الزيادة الفعلية.<\/p>"}, {"n": 99, "level": 3, "section": "PPC / Paid Media", "q": "When would you tell a client NOT to run paid ads?", "a": "<p>When unit economics can't support CAC (low LTV/margins), the landing page/offer converts poorly (fix CRO first), no conversion tracking exists, or budget is too small to generate learnable signal — ads amplify what exists, good or bad.<\/p>", "q_ar": "متى تنصح عميلًا بعدم تشغيل إعلانات مدفوعة؟", "a_ar": "<p>حين لا تدعم اقتصاديات الوحدة CAC (LTV أو هوامش منخفضة)، أو صفحة الهبوط تحوّل بشكل سيئ (أصلح CRO أولًا)، أو لا تتبّع للتحويل، أو الميزانية أصغر من أن تولّد إشارة — الإعلانات تضخّم الموجود، جيدًا أو سيئًا.<\/p>"}, {"n": 100, "level": 3, "section": "PPC / Paid Media", "q": "How do you decide budget split across channels?", "a": "<p>Start from goals and unit economics, use historical marginal CPA per channel, apply 70/20/10 (proven/promising/experimental), rebalance monthly toward marginal efficiency, and protect always-on capture (brand search, retargeting) before scaling demand generation.<\/p>", "q_ar": "كيف تقرّر توزيع الميزانية على القنوات؟", "a_ar": "<p>ابدأ من الأهداف واقتصاديات الوحدة، استخدم CPA الحدّي التاريخي لكل قناة، طبّق ٧٠/٢٠/١٠، أعد التوازن شهريًا نحو الكفاءة الحدّية، واحمِ الالتقاط الدائم (بحث العلامة، إعادة الاستهداف) قبل توسيع توليد الطلب.<\/p>"}, {"n": 101, "level": 1, "section": "Content Marketing", "q": "What is content marketing?", "a": "<p>Creating and distributing valuable, relevant content to attract and retain a defined audience — earning trust that converts into business over time, rather than pitching directly.<\/p>", "q_ar": "ما هو التسويق بالمحتوى؟", "a_ar": "<p>إنشاء وتوزيع محتوى قيّم لجذب جمهور محدّد والاحتفاظ به — كسب ثقة تتحوّل لاحقًا إلى أعمال، بدل البيع المباشر.<\/p>"}, {"n": 102, "level": 1, "section": "Content Marketing", "q": "What is a content strategy vs. a content plan?", "a": "<p>Strategy = why and for whom (audience, mission, pillars, goals). Plan = what and when (calendar, formats, owners, deadlines). Strategy without a plan is theory; a plan without strategy is noise.<\/p>", "q_ar": "استراتيجية المحتوى مقابل خطة المحتوى؟", "a_ar": "<p>الاستراتيجية = لماذا ولمن (الجمهور، الرسالة، الركائز، الأهداف). الخطة = ماذا ومتى (التقويم، الصيغ، المسؤولون، المواعيد). استراتيجية بلا خطة نظرية؛ وخطة بلا استراتيجية ضجيج.<\/p>"}, {"n": 103, "level": 1, "section": "Content Marketing", "q": "What are content pillars?", "a": "<p>The 3–5 core topics a brand commits to owning — every piece of content maps to a pillar, building topical authority and consistent audience expectations.<\/p>", "q_ar": "ما ركائز المحتوى؟", "a_ar": "<p>٣–٥ مواضيع أساسية تلتزم العلامة بامتلاكها — كل قطعة ترتبط بركيزة، فتبني السلطة الموضوعية وتوقّعات جمهور متّسقة.<\/p>"}, {"n": 104, "level": 1, "section": "Content Marketing", "q": "What is evergreen vs. topical content?", "a": "<p>Evergreen stays relevant for years (how-tos, guides) and compounds via SEO; topical rides current events/trends for spikes of attention. Healthy programs mix both.<\/p>", "q_ar": "المحتوى الدائم مقابل الآني؟", "a_ar": "<p>الدائم يبقى صالحًا لسنوات (أدلّة، شروحات) ويتراكم عبر السيو؛ والآني يركب الأحداث والاتجاهات لقفزات انتباه. البرامج الصحية تمزج الاثنين.<\/p>"}, {"n": 105, "level": 2, "section": "Content Marketing", "q": "What is the TOFU/MOFU/BOFU content split?", "a": "<p>TOFU educates and attracts (\"what is X\"); MOFU builds consideration (comparisons, case studies, webinars); BOFU converts (pricing pages, demos, testimonials). Most teams over-produce TOFU and under-produce BOFU — the reverse of revenue impact.<\/p>", "q_ar": "ما توزيع محتوى TOFU/MOFU/BOFU؟", "a_ar": "<p>TOFU يعلّم ويجذب؛ MOFU يبني التفكير (مقارنات، دراسات حالة، ندوات)؛ BOFU يحوّل (صفحات الأسعار، العروض التوضيحية، الشهادات). معظم الفرق تُفرط في TOFU وتُهمل BOFU — عكس أثر الإيراد.<\/p>"}, {"n": 106, "level": 2, "section": "Content Marketing", "q": "How do you generate content ideas systematically?", "a": "<p>Keyword/SERP research, sales-call and support-ticket mining, customer interviews, community/Reddit listening, competitor gap analysis, and the \"They Ask, You Answer\" big five: pricing, problems, comparisons, reviews, best-of.<\/p>", "q_ar": "كيف تولّد أفكار محتوى بشكل منهجي؟", "a_ar": "<p>بحث الكلمات والنتائج، تنقيب مكالمات المبيعات وتذاكر الدعم، مقابلات العملاء، الاستماع للمجتمعات، تحليل فجوات المنافسين، وأسئلة «يسألون فتجيب» الخمسة: الأسعار، المشكلات، المقارنات، المراجعات، الأفضل.<\/p>"}, {"n": 107, "level": 2, "section": "Content Marketing", "q": "What is content repurposing?", "a": "<p>Turning one asset into many: a webinar → blog post → 5 clips → carousel → email series → infographic. It multiplies distribution without multiplying creation cost.<\/p>", "q_ar": "ما إعادة توظيف المحتوى؟", "a_ar": "<p>تحويل أصل واحد لكثير: ندوة ← مقال ← ٥ مقاطع ← كاروسيل ← سلسلة بريد ← إنفوجرافيك. يضاعف التوزيع دون مضاعفة تكلفة الإنشاء.<\/p>"}, {"n": 108, "level": 2, "section": "Content Marketing", "q": "How do you measure content marketing ROI?", "a": "<p>Tie content to pipeline: organic traffic → conversions (subscribers, leads, sales) with UTM and attribution, assisted conversions, content-influenced revenue, plus leading indicators (rankings, engagement). Report cost per lead from content vs. paid.<\/p>", "q_ar": "كيف تقيس عائد التسويق بالمحتوى؟", "a_ar": "<p>اربطه بخط الأنابيب: زيارات عضوية ← تحويلات (مشتركون، عملاء، مبيعات) بـUTM والإسناد، التحويلات المساعدة، الإيراد المتأثّر بالمحتوى، ومؤشرات مبكرة. قارن تكلفة العميل من المحتوى بالمدفوع.<\/p>"}, {"n": 109, "level": 2, "section": "Content Marketing", "q": "What makes a headline effective?", "a": "<p>Specificity, clear benefit or curiosity gap, numbers, and matching search/scroll intent — the headline determines whether the other 99% gets read. Write 5–10 options per piece.<\/p>", "q_ar": "ما الذي يجعل العنوان فعّالًا؟", "a_ar": "<p>التحديد، منفعة واضحة أو فجوة فضول، أرقام، ومطابقة نيّة البحث أو التمرير — العنوان يحدّد هل تُقرأ بقية القطعة. اكتب ٥–١٠ خيارات لكل قطعة.<\/p>"}, {"n": 110, "level": 2, "section": "Content Marketing", "q": "What is a content audit and when do you run one?", "a": "<p>Inventorying all content and scoring it (traffic, conversions, rankings, freshness) to decide: keep, update, consolidate, or delete. Run annually or when a site has years of accumulated content — updating old winners often beats writing new posts.<\/p>", "q_ar": "ما تدقيق المحتوى ومتى تجريه؟", "a_ar": "<p>جرد كل المحتوى وتقييمه (زيارات، تحويلات، ترتيب، حداثة) لتقرّر: إبقاء، تحديث، دمج، أو حذف. سنويًا أو حين تتراكم سنوات من المحتوى — تحديث الفائزين القدامى غالبًا يغلب كتابة جديد.<\/p>"}, {"n": 111, "level": 2, "section": "Content Marketing", "q": "What role does storytelling play in content?", "a": "<p>Stories create emotional engagement and memorability that facts alone can't — frameworks like problem→struggle→resolution and customer-hero case studies outperform feature lists.<\/p>", "q_ar": "ما دور السرد القصصي في المحتوى؟", "a_ar": "<p>القصص تصنع تفاعلًا عاطفيًا وتذكّرًا لا تصنعه الحقائق وحدها — أطر مثل مشكلة ← صراع ← حل ودراسات حالة يكون العميل بطلها تتفوّق على قوائم الخصائص.<\/p>"}, {"n": 112, "level": 2, "section": "Content Marketing", "q": "How should AI be used in content production?", "a": "<p>For research synthesis, outlines, drafts, repurposing, and editing speed — with humans owning strategy, original insight, fact-checking, examples, and voice. Publishing raw AI output at scale risks quality, differentiation, and search performance.<\/p>", "q_ar": "كيف يُستخدم الذكاء الاصطناعي في إنتاج المحتوى؟", "a_ar": "<p>لتجميع الأبحاث والمخطّطات والمسودّات وإعادة التوظيف والتحرير بسرعة — مع امتلاك البشر للاستراتيجية والبصيرة الأصلية والتحقّق والأمثلة والصوت. نشر مخرجات خام على نطاق واسع يخاطر بالجودة والتميّز والأداء.<\/p>"}, {"n": 113, "level": 2, "section": "Content Marketing", "q": "What is thought leadership content?", "a": "<p>Content presenting original opinions, data, or frameworks that shape how an industry thinks — it earns links, PR, and trust that commodity how-to content can't.<\/p>", "q_ar": "ما محتوى القيادة الفكرية؟", "a_ar": "<p>محتوى يقدّم آراء أو بيانات أو أطرًا أصلية تشكّل تفكير القطاع — يكسب روابط وتغطية وثقة لا يكسبها محتوى الشروحات العادي.<\/p>"}, {"n": 114, "level": 3, "section": "Content Marketing", "q": "How do you build a content engine for a startup with no audience?", "a": "<p>Pick one channel + one format you can sustain, target BOFU and striking-distance SEO first (fastest revenue), publish founder-led opinion content for reach, repurpose everything, borrow audiences (guest posts, podcasts, communities), and build the email list from day one.<\/p>", "q_ar": "كيف تبني محرّك محتوى لشركة ناشئة بلا جمهور؟", "a_ar": "<p>اختر قناة وصيغة واحدة يمكنك الاستمرار عليها، استهدف BOFU وكلمات قريبة الترتيب أولًا، محتوى رأي من المؤسس للوصول، أعد توظيف كل شيء، استعر الجماهير (مقالات ضيفة، بودكاست، مجتمعات)، وابنِ قائمة البريد من اليوم الأول.<\/p>"}, {"n": 115, "level": 2, "section": "Content Marketing", "q": "What is a content calendar and what should it include?", "a": "<p>The operational schedule: topic, pillar, funnel stage, format, target keyword/audience, owner, status, publish date, and distribution checklist.<\/p>", "q_ar": "ما تقويم المحتوى وماذا يتضمّن؟", "a_ar": "<p>الجدول التشغيلي: الموضوع، الركيزة، مرحلة القمع، الصيغة، الكلمة/الجمهور، المسؤول، الحالة، تاريخ النشر، وقائمة التوزيع.<\/p>"}, {"n": 116, "level": 2, "section": "Content Marketing", "q": "Gated vs. ungated content — how do you decide?", "a": "<p>Gate high-value, high-intent assets (templates, research, courses) to capture leads; ungate content meant for reach, SEO, and trust. Test: gating trades audience size for lead capture.<\/p>", "q_ar": "المحتوى المغلق مقابل المفتوح — كيف تقرّر؟", "a_ar": "<p>أغلق الأصول عالية القيمة والنيّة (قوالب، أبحاث، دورات) لالتقاط العملاء؛ وافتح المحتوى المخصّص للوصول والسيو والثقة. الإغلاق يقايض حجم الجمهور بالتقاط العملاء.<\/p>"}, {"n": 117, "level": 3, "section": "Content Marketing", "q": "Your blog gets 100k visits/month but few conversions. Diagnose.", "a": "<p>Likely intent mismatch: traffic is TOFU/informational with no conversion paths. Fix with contextual CTAs and content upgrades, BOFU content targeting commercial intent, retargeting the readership, and email capture to nurture — measure conversion per post, not just traffic.<\/p>", "q_ar": "مدوّنتك تجذب ١٠٠ ألف زيارة شهريًا بتحويلات قليلة. شخّص.", "a_ar": "<p>غالبًا عدم تطابق النيّة: الزيارات معلوماتية بلا مسارات تحويل. أصلح بدعوات سياقية وترقيات محتوى، ومحتوى BOFU لنيّة تجارية، وإعادة استهداف القرّاء، والتقاط البريد للتغذية — وقِس التحويل لكل مقال.<\/p>"}, {"n": 118, "level": 1, "section": "Content Marketing", "q": "What is a case study and why does it convert?", "a": "<p>A customer success story structured as problem → solution → measurable results. It's proof, not promise — the highest-converting MOFU/BOFU asset in B2B.<\/p>", "q_ar": "ما دراسة الحالة ولماذا تحوّل؟", "a_ar": "<p>قصة نجاح عميل: مشكلة ← حل ← نتائج مقيسة. إنها دليل لا وعد — أعلى أصل تحويلًا في وسط وأسفل القمع في B2B.<\/p>"}, {"n": 119, "level": 2, "section": "Content Marketing", "q": "What is original research as a content play?", "a": "<p>Publishing proprietary data (surveys, internal benchmarks) that journalists and bloggers cite — the most reliable way to earn backlinks and authority at scale.<\/p>", "q_ar": "ما الأبحاث الأصلية كلعبة محتوى؟", "a_ar": "<p>نشر بيانات خاصة (استبيانات، معايير داخلية) يستشهد بها الصحفيون والمدوّنون — أكثر طريقة موثوقة لكسب الروابط والسلطة على نطاق واسع.<\/p>"}, {"n": 120, "level": 2, "section": "Content Marketing", "q": "How often should a company publish?", "a": "<p>As often as it can maintain quality and distribution — consistency beats volume. One excellent, well-distributed piece weekly outperforms five thin daily posts.<\/p>", "q_ar": "كم مرة يجب أن تنشر الشركة؟", "a_ar": "<p>بقدر ما تستطيع مع الحفاظ على الجودة والتوزيع — الاستمرارية تغلب الكمية. قطعة ممتازة موزّعة جيدًا أسبوعيًا تتفوّق على خمس قطع رقيقة يومية.<\/p>"}, {"n": 121, "level": 1, "section": "Social Media Marketing", "q": "What is social media marketing?", "a": "<p>Building audience, community, and demand on social platforms through organic content, engagement, and paid amplification.<\/p>", "q_ar": "ما التسويق عبر مواقع التواصل؟", "a_ar": "<p>بناء الجمهور والمجتمع والطلب على منصّات التواصل عبر محتوى عضوي وتفاعل وتضخيم مدفوع.<\/p>"}, {"n": 122, "level": 1, "section": "Social Media Marketing", "q": "What is engagement rate and how is it calculated?", "a": "<p>Interactions (likes, comments, shares, saves) ÷ reach or followers × 100. Engagement per reach is the more honest modern measure.<\/p>", "q_ar": "ما معدّل التفاعل وكيف يُحسب؟", "a_ar": "<p>التفاعلات (إعجاب، تعليق، مشاركة، حفظ) ÷ الوصول أو المتابعين × ١٠٠. التفاعل لكل وصول هو المقياس الحديث الأصدق.<\/p>"}, {"n": 123, "level": 1, "section": "Social Media Marketing", "q": "Which engagement signals matter most and why?", "a": "<p>Shares and saves — they signal high value and drive algorithmic distribution more than likes, which are low-effort.<\/p>", "q_ar": "أي إشارات التفاعل أهم ولماذا؟", "a_ar": "<p>المشاركة والحفظ — تدلّان على قيمة عالية وتقودان التوزيع الخوارزمي أكثر من الإعجاب منخفض الجهد.<\/p>"}, {"n": 124, "level": 1, "section": "Social Media Marketing", "q": "What is social listening?", "a": "<p>Monitoring mentions of your brand, competitors, and industry terms across platforms to find insights, trends, complaints, and opportunities to engage.<\/p>", "q_ar": "ما الاستماع الاجتماعي؟", "a_ar": "<p>مراقبة ذكر علامتك ومنافسيك ومصطلحات قطاعك عبر المنصّات لاكتشاف البصائر والاتجاهات والشكاوى وفرص التفاعل.<\/p>"}, {"n": 125, "level": 2, "section": "Social Media Marketing", "q": "How do short-form video algorithms decide distribution?", "a": "<p>Primarily retention (watch time %, rewatches) and engagement velocity in the first hours — content is tested on small audiences and scaled if it performs; follower count matters less than per-post performance.<\/p>", "q_ar": "كيف تقرّر خوارزميات الفيديو القصير التوزيع؟", "a_ar": "<p>أساسًا بالاحتفاظ (نسبة المشاهدة، إعادة المشاهدة) وسرعة التفاعل في الساعات الأولى — يُختبر المحتوى على جماهير صغيرة ويتوسّع إن نجح؛ عدد المتابعين أقل أهمية من أداء كل منشور.<\/p>"}, {"n": 126, "level": 2, "section": "Social Media Marketing", "q": "What makes a strong hook?", "a": "<p>The first 1–3 seconds must create an open loop: a bold claim, surprising visual, direct callout of the target viewer (\"If you run Facebook ads...\"), or pattern interrupt. Retention graphs show most drop-off happens immediately.<\/p>", "q_ar": "ما الذي يصنع خطّافًا قويًا؟", "a_ar": "<p>أول ١–٣ ثوانٍ يجب أن تفتح حلقة: ادعاء جريء، صورة مفاجئة، نداء مباشر للمشاهد المستهدف («لو بتشغّل إعلانات فيسبوك…»)، أو كسر نمط.<\/p>"}, {"n": 127, "level": 2, "section": "Social Media Marketing", "q": "How do you choose which platforms a brand should be on?", "a": "<p>Where the audience actually is + where the brand can produce native content sustainably + where competitors are winning or absent. Master 1–2 platforms before expanding.<\/p>", "q_ar": "كيف تختار المنصّات المناسبة للعلامة؟", "a_ar": "<p>حيث يتواجد الجمهور فعلًا + حيث تستطيع العلامة إنتاج محتوى أصلي باستمرار + حيث يفوز المنافسون أو يغيبون. أتقن ١–٢ قبل التوسّع.<\/p>"}, {"n": 128, "level": 2, "section": "Social Media Marketing", "q": "Organic social vs. paid social — how do they work together?", "a": "<p>Organic builds trust, community, and creative testing ground; paid scales proven creative to precise audiences. Winning organic posts become winning ads (boosting validated content).<\/p>", "q_ar": "كيف يعمل العضوي والمدفوع معًا في التواصل؟", "a_ar": "<p>العضوي يبني الثقة والمجتمع وساحة اختبار الإبداع؛ والمدفوع يوسّع الإبداع المثبت لجماهير دقيقة. المنشورات العضوية الرابحة تصبح إعلانات رابحة.<\/p>"}, {"n": 129, "level": 2, "section": "Social Media Marketing", "q": "What is a social media style guide?", "a": "<p>Documented voice, tone, visual identity, hashtag use, response protocols, and dos/don'ts — ensuring consistency across posts and team members.<\/p>", "q_ar": "ما دليل أسلوب التواصل الاجتماعي؟", "a_ar": "<p>الصوت والنبرة والهوية البصرية واستخدام الوسوم وبروتوكولات الرد الموثّقة — لضمان الاتساق عبر المنشورات وأعضاء الفريق.<\/p>"}, {"n": 130, "level": 2, "section": "Social Media Marketing", "q": "How do you handle negative comments or a complaint publicly?", "a": "<p>Respond fast, empathetically, and publicly acknowledge; move resolution to DM/private; never delete legitimate criticism (only spam/abuse). Public handling is a trust performance for onlookers.<\/p>", "q_ar": "كيف تتعامل مع تعليق سلبي أو شكوى علنية؟", "a_ar": "<p>ردّ بسرعة وتعاطف وإقرار علني؛ انقل الحل للرسائل الخاصة؛ لا تحذف النقد المشروع (فقط السبام والإساءة). التعامل العلني عرض ثقة للمتابعين.<\/p>"}, {"n": 131, "level": 2, "section": "Social Media Marketing", "q": "What is community management vs. social media management?", "a": "<p>SMM = publishing and growth strategy; community management = the conversations — replies, DMs, groups, advocacy. Communities retain; content attracts.<\/p>", "q_ar": "إدارة المجتمع مقابل إدارة التواصل؟", "a_ar": "<p>إدارة التواصل = النشر واستراتيجية النمو؛ وإدارة المجتمع = المحادثات — الردود والرسائل والمجموعات والترويج. المجتمعات تحتفظ؛ والمحتوى يجذب.<\/p>"}, {"n": 132, "level": 2, "section": "Social Media Marketing", "q": "What KPIs matter for social beyond vanity metrics?", "a": "<p>Reach growth, engagement per post, profile visits → link clicks → conversions (UTM-tracked), share of voice, and DMs/leads generated. Follower count alone is the weakest signal.<\/p>", "q_ar": "ما المؤشرات المهمة في التواصل أبعد من المقاييس الزائفة؟", "a_ar": "<p>نمو الوصول، التفاعل لكل منشور، زيارات الملف ← نقرات الروابط ← التحويلات (بـUTM)، حصّة الصوت، والرسائل والعملاء المحتملون. عدد المتابعين أضعف إشارة.<\/p>"}, {"n": 133, "level": 2, "section": "Social Media Marketing", "q": "What is employee advocacy?", "a": "<p>Employees sharing company content or their own work stories — collectively their networks dwarf brand pages, and people trust people more than logos. Especially powerful on LinkedIn.<\/p>", "q_ar": "ما ترويج الموظفين؟", "a_ar": "<p>مشاركة الموظفين لمحتوى الشركة أو قصص عملهم — شبكاتهم مجتمعة تتجاوز صفحات العلامة، والناس يثقون بالناس أكثر من الشعارات. قوي خاصة على لينكدإن.<\/p>"}, {"n": 134, "level": 2, "section": "Social Media Marketing", "q": "How does LinkedIn organic differ from other platforms?", "a": "<p>Rewards personal profiles over company pages, dwell time on text/document posts, early comments, and niche professional insight — B2B's highest-ROI organic channel.<\/p>", "q_ar": "كيف يختلف العضوي على لينكدإن عن غيره؟", "a_ar": "<p>يكافئ الملفات الشخصية أكثر من صفحات الشركات، ووقت البقاء على المنشورات النصية والمستندات، والتعليقات المبكرة، والبصيرة المهنية المتخصصة — أعلى قناة عضوية عائدًا في B2B.<\/p>"}, {"n": 135, "level": 3, "section": "Social Media Marketing", "q": "How would you grow an account from 0 to 10k followers in 6 months?", "a": "<p>Niche positioning + one repeatable format, 3–5 native posts/week, hook-first short video, engage 30 min/day in the niche (comments on larger accounts), collaborations/duets, analyze weekly and double down on outliers — growth follows outlier posts, not averages.<\/p>", "q_ar": "كيف تنمّي حسابًا من صفر إلى ١٠ آلاف متابع في ٦ أشهر؟", "a_ar": "<p>تموضع متخصص + صيغة واحدة قابلة للتكرار، ٣–٥ منشورات أصلية أسبوعيًا، فيديو قصير يبدأ بالخطّاف، تفاعل ٣٠ دقيقة يوميًا في التخصص، تعاونات، وتحليل أسبوعي ومضاعفة المنشورات الشاذة — النمو يتبع الاستثناءات لا المتوسطات.<\/p>"}, {"n": 136, "level": 2, "section": "Social Media Marketing", "q": "What is UGC strategy for brands?", "a": "<p>Systematically generating customer content: post-purchase prompts, hashtags, contests, creator seeding — then licensing the best as ad creative (UGC-style ads often out-convert studio creative).<\/p>", "q_ar": "ما استراتيجية UGC للعلامات؟", "a_ar": "<p>توليد محتوى العملاء بشكل منهجي: طلبات بعد الشراء، وسوم، مسابقات، بذر صنّاع المحتوى — ثم ترخيص الأفضل كإبداع إعلاني (إعلانات بأسلوب UGC غالبًا تتفوّق على إنتاج الاستوديو).<\/p>"}, {"n": 137, "level": 2, "section": "Social Media Marketing", "q": "What is influencer vetting?", "a": "<p>Checking audience authenticity (fake-follower analysis), engagement quality (real comments), audience demographics fit, content quality, brand safety history, and past sponsored performance before paying.<\/p>", "q_ar": "ما فحص المؤثرين؟", "a_ar": "<p>التحقّق من أصالة الجمهور (تحليل المتابعين الوهميين)، جودة التفاعل (تعليقات حقيقية)، ملاءمة ديموغرافيا الجمهور، جودة المحتوى، سجل أمان العلامة، والأداء الإعلاني السابق قبل الدفع.<\/p>"}, {"n": 138, "level": 2, "section": "Social Media Marketing", "q": "How do you measure influencer ROI?", "a": "<p>Unique codes/links per creator, dedicated landing pages, affiliate tracking, before/after branded search lift, and content licensing value — set the KPI (awareness vs. conversions) before the campaign.<\/p>", "q_ar": "كيف تقيس عائد المؤثرين؟", "a_ar": "<p>أكواد وروابط فريدة لكل صانع محتوى، صفحات هبوط مخصّصة، تتبّع العمولة، ارتفاع بحث العلامة قبل/بعد، وقيمة ترخيص المحتوى — حدّد المؤشر (وعي أم تحويل) قبل الحملة.<\/p>"}, {"n": 139, "level": 3, "section": "Social Media Marketing", "q": "A post goes viral but sales don't move. What do you tell leadership?", "a": "<p>Virality reached a broad, low-intent audience — valuable for awareness and follower growth, not immediate revenue. Show the funnel plan to capture the attention (retargeting the viewers/engagers, email capture) and set expectations: virality is a top-funnel input, not a sales event.<\/p>", "q_ar": "منشور انتشر بقوة لكن المبيعات لم تتحرّك. ماذا تقول للإدارة؟", "a_ar": "<p>الانتشار وصل لجمهور واسع منخفض النيّة — قيّم للوعي ونمو المتابعين لا للإيراد الفوري. اعرض خطة التقاط الانتباه (إعادة استهداف المشاهدين، التقاط البريد) وحدّد التوقّعات: الانتشار مُدخل أعلى القمع لا حدث مبيعات.<\/p>"}, {"n": 140, "level": 2, "section": "Social Media Marketing", "q": "What is a social media crisis protocol?", "a": "<p>Pre-agreed severity tiers, response owners, holding statements, approval chain, and monitoring cadence — respond quickly with facts, empathy, and one consistent voice; silence and defensiveness both escalate.<\/p>", "q_ar": "ما بروتوكول أزمة التواصل الاجتماعي؟", "a_ar": "<p>مستويات خطورة متّفق عليها، مسؤولو الرد، بيانات مؤقتة، سلسلة موافقات، وإيقاع مراقبة — ردّ بسرعة بحقائق وتعاطف وصوت واحد؛ الصمت والدفاعية كلاهما يصعّد.<\/p>"}, {"n": 141, "level": 1, "section": "Email Marketing", "q": "Why is email considered the highest-ROI channel?", "a": "<p>You own the list (no algorithm gatekeeper), it's nearly free to send, and it reaches people who already opted in — commonly cited returns are ~$36–40 per $1 spent.<\/p>", "q_ar": "لماذا يُعدّ البريد أعلى القنوات عائدًا؟", "a_ar": "<p>تملك القائمة (لا حارس خوارزمي)، والإرسال شبه مجاني، ويصل لمن اشترك فعلًا — والعائد المذكور غالبًا ~٣٦–٤٠ دولارًا لكل دولار.<\/p>"}, {"n": 142, "level": 1, "section": "Email Marketing", "q": "What is a welcome sequence?", "a": "<p>The automated 3–7 email series new subscribers receive: deliver the lead magnet, introduce the brand story, provide value, and make a first offer — welcome emails get the highest open rates you'll ever see.<\/p>", "q_ar": "ما سلسلة الترحيب؟", "a_ar": "<p>سلسلة آلية من ٣–٧ رسائل يتلقّاها المشترك الجديد: تسليم المغناطيس، قصة العلامة، قيمة، وأول عرض — رسائل الترحيب تحقّق أعلى معدّلات فتح على الإطلاق.<\/p>"}, {"n": 143, "level": 1, "section": "Email Marketing", "q": "Open rate vs. click rate vs. CTOR?", "a": "<p>Open rate = opens ÷ delivered (inflated by Apple privacy — directional only). Click rate = clicks ÷ delivered. CTOR = clicks ÷ opens (measures content effectiveness among openers).<\/p>", "q_ar": "معدّل الفتح مقابل النقر مقابل CTOR؟", "a_ar": "<p>الفتح = الفتحات ÷ المُسلَّم (مضخّم بخصوصية أبل — تقريبي فقط). النقر = النقرات ÷ المُسلَّم. CTOR = النقرات ÷ الفتحات (يقيس فعالية المحتوى بين من فتحوا).<\/p>"}, {"n": 144, "level": 1, "section": "Email Marketing", "q": "What is list segmentation?", "a": "<p>Dividing subscribers by behavior, purchase history, engagement, or attributes to send relevant messages — segmented campaigns consistently outperform batch-and-blast on every metric.<\/p>", "q_ar": "ما تقسيم القائمة؟", "a_ar": "<p>تقسيم المشتركين حسب السلوك أو تاريخ الشرا
