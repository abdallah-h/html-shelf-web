<a name="2-sql-cookbook"></a>
# 2. SQL Cookbook — Anthony Molinaro

**What it is:** a problem-and-solution reference. Each entry states a problem, gives solutions across multiple engines, and — the valuable part — explains *why* the solution works, step by step. Not a book to read front to back; a book to consult and then study the discussion.

**Prerequisites:** comfortable with joins and grouping.
**Read it when:** you keep hitting problems you can't express in SQL.
**What makes it distinctive:** it teaches you to *think in sets* rather than translating procedural logic into SQL.

## Territory It Covers

### Retrieval fundamentals
Starts deceptively simple — selecting, filtering, concatenating, using `CASE`, limiting rows, sampling randomly, handling NULLs — but establishes the multi-engine framing that runs throughout. Seeing the same problem solved four ways in four dialects teaches you which parts of SQL are standard and which are vendor decoration.

### Sorting
Sorting by substrings and computed expressions, sorting mixed alphanumeric data, handling NULLs first or last, and — the genuinely useful trick — using `CASE` inside `ORDER BY` to impose a custom, business-defined ordering that has no natural sort.

### Working with multiple tables
Joins revisited, plus set operations, plus the operations SQL doesn't give you directly. The standout topic here is **determining which rows are missing** (the anti-join, expressed several ways) and **retaining values from one table when the other has no match**. Also covered: identifying and eliminating the Cartesian products that appear when joins are underspecified.

### Insert, update, delete
Bulk insertion, insertion into multiple tables, copying between tables, blocking inserts to certain columns, updating from one table into another, and the merge/upsert problem. The recurring lesson: set-based modification (one statement affecting many rows) beats row-at-a-time loops by orders of magnitude.

### Metadata queries
Querying the data dictionary — listing tables, columns, constraints, foreign keys, indexes. Underrated skill: the ability to generate SQL from metadata lets you write one query that produces a thousand statements, which is how large refactors actually get done.

### String manipulation
Walking a string character by character, counting occurrences of a character, removing unwanted characters, separating numeric from character data, parsing delimited lists, and creating delimited lists from rows. Many solutions here depend on a **pivot table** (a helper table of sequential integers) — an idea worth internalizing, since a numbers table turns whole categories of impossible problems into ordinary joins.

### Working with numbers
Averages, min/max, running totals, running products and differences, mode and median, percentages of a total, aggregation with NULLs, and moving averages. This chapter is where window functions earn their keep, and where you learn to compute cumulative and relative measures in a single pass.

### Date arithmetic and date manipulation
Adding and subtracting intervals, counting business days, determining months or years between dates, and handling overlaps. Then: determining leap years, generating date ranges, finding the first or last day of a period, counting occurrences of a weekday in a year, and identifying overlapping date ranges. Dates are where dialects diverge most, and this material is the best portable treatment of them.

### Range problems — gaps and islands
The chapter with the highest ratio of value to page count. Locating ranges of consecutive values, finding differences between rows in the same group, and filling gaps. The core technique — deriving a constant grouping key from the difference between a sequence value and a row number — solves an entire family of problems: streaks, sessionization, uptime windows, consecutive wins, contiguous ID ranges.

### Advanced searching
Paginating results, skipping every Nth row, incorporating OR logic into outer joins, reversing a result set, and ranking within groups. Also the technique of "simulating" features one engine has and another lacks.

### Reporting and reshaping
Pivoting rows into columns and back, creating sparse or dense reports, suppressing repeating values, grouping by hierarchies, and producing subtotals with `ROLLUP`/`CUBE`. This chapter is essentially "how to make SQL produce something a human wants to look at."

### Hierarchical queries
Expressing parent-child trees, listing all ancestors or descendants, showing leaf nodes, and rendering an indented hierarchy — via recursive CTEs and via engine-specific constructs.

### Miscellaneous and appendices
Odds and ends, plus appendix material on window functions and common table expressions that functions as a compact reference.

## The Ideas Worked Through

### The numbers table, and why it unlocks so much

Many problems require rows that don't exist yet. SQL can only select from what's there — so you need a source of rows to manufacture them from.

```sql
-- Build one once, or generate on the fly
WITH RECURSIVE n(i) AS (
    SELECT 1 UNION ALL SELECT i+1 FROM n WHERE i < 1000
)
SELECT * FROM n;
```

Now three previously awkward problems become ordinary joins:

```sql
-- 1. Generate a date range
SELECT DATE('2024-01-01') + INTERVAL (i-1) DAY AS d FROM n WHERE i <= 366;

-- 2. Explode a quantity into individual units (one row per item shipped)
SELECT o.order_id, o.product_id, n.i AS unit_number
FROM order_items o JOIN n ON n.i <= o.quantity;

-- 3. Walk a string character by character
SELECT n.i AS pos, SUBSTRING(word, n.i, 1) AS ch
FROM words JOIN n ON n.i <= CHAR_LENGTH(word);
```

The transferable insight: **when a problem seems to need a loop, ask what set of rows the loop would iterate over, then produce that set and join to it.**

### Counting occurrences without iterating

```sql
-- How many commas are in this string?
SELECT CHAR_LENGTH(s) - CHAR_LENGTH(REPLACE(s, ',', '')) AS comma_count FROM t;
```

Length before minus length after removal equals the count. It's a small trick, but it exemplifies the method: express the answer as an arithmetic relationship between whole-set operations rather than as a per-character procedure.

### Gaps and islands, derived rather than memorized

Don't memorize the formula — derive it once and you'll never forget it.

```
login_date   ROW_NUMBER()   date - row_number
2024-03-01   1              2024-02-29   ┐
2024-03-02   2              2024-02-29   ├ island A (constant)
2024-03-03   3              2024-02-29   ┘
2024-03-07   4              2024-03-03   ┐ island B (value jumped)
2024-03-08   5              2024-03-03   ┘
```

Consecutive dates increase by one per row; `ROW_NUMBER` also increases by one per row. Their difference is therefore **invariant within a run** and shifts at every gap. That invariant is a free grouping key.

```sql
WITH g AS (
    SELECT user_id, login_date,
           login_date - INTERVAL ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY login_date) DAY AS island
    FROM (SELECT DISTINCT user_id, login_date FROM logins) d
)
SELECT user_id, MIN(login_date) AS start, MAX(login_date) AS finish, COUNT(*) AS days
FROM g GROUP BY user_id, island;
```

**Variants worth knowing:** for a gap threshold other than 1 (sessionizing events with a 30-minute inactivity gap), the technique changes — use `LAG` to detect a new session start, then a running `SUM` of that flag as the group key.

```sql
WITH marked AS (
    SELECT user_id, event_time,
           CASE WHEN event_time - LAG(event_time) OVER (PARTITION BY user_id ORDER BY event_time)
                     > INTERVAL 30 MINUTE
                 OR LAG(event_time) OVER (PARTITION BY user_id ORDER BY event_time) IS NULL
                THEN 1 ELSE 0 END AS is_new_session
    FROM events
)
SELECT user_id, SUM(is_new_session) OVER (PARTITION BY user_id ORDER BY event_time) AS session_id, event_time
FROM marked;
```
The running sum of a 0/1 flag as a group identifier is a pattern worth adding to your permanent vocabulary.

### Half-open intervals, and why every date bug traces back to them

```sql
-- ❌ Loses anything on the 31st after 00:00:00
WHERE order_date BETWEEN '2024-01-01' AND '2024-01-31'

-- ✅ Correct at any precision, including microseconds
WHERE order_date >= '2024-01-01' AND order_date < '2024-02-01'
```

The same principle governs overlap detection. Two half-open ranges `[a1, a2)` and `[b1, b2)` overlap when:
```sql
WHERE a1 < b2 AND b1 < a2
```
With closed intervals you need `<=` and adjacent ranges falsely "overlap" at the shared boundary. Adopt half-open ranges everywhere and a whole family of off-by-one bugs disappears.

### Pivoting: why the portable form is the good form

```sql
-- Conditional aggregation — works everywhere
SELECT region,
       SUM(CASE WHEN quarter = 'Q1' THEN amount ELSE 0 END) AS q1,
       SUM(CASE WHEN quarter = 'Q2' THEN amount ELSE 0 END) AS q2
FROM sales GROUP BY region;
```

Mechanism: within each group, the `CASE` zeroes out non-matching rows so each `SUM` sees only its subset. Once you see it this way, you can put *any* aggregate in there — `MAX` to pick a value, `COUNT` to tally, `AVG` for a per-cell mean — which the `PIVOT` keyword doesn't let you do as freely.

The reason a true dynamic pivot is impossible in pure SQL: a query's output columns are fixed at parse time, but a dynamic pivot's column list depends on values known only at execution. It fundamentally requires generating SQL text in a prior step.

## Misconceptions This Book Corrects

| Common belief | Reality |
|---|---|
| "Some problems just need a loop" | Almost none do; the loop's iteration set can usually be produced as rows |
| "`BETWEEN` is fine for date ranges" | It's a closed interval and silently truncates the final day when a time component exists |
| "String manipulation belongs in the application" | Set-based string operations avoid transferring the data at all |
| "Recipes are for copying" | The discussion explaining *why* is the transferable part; the SQL is disposable |
| "The `PIVOT` keyword is the proper way" | Conditional aggregation is portable, more flexible, and shows you the mechanism |

## Apply It This Week

1. Build a permanent numbers table and a calendar table in your database. You'll use both within a month.
2. Find one report with missing rows for empty periods and fix it with a calendar left join.
3. Convert every closed date range in your codebase to half-open form.
4. Solve one gaps-and-islands problem from your own data — streaks, sessions, or contiguous ranges.

## If You Remember Only Five Things

1. A numbers table converts generation problems into joins.
2. `value − ROW_NUMBER()` is constant within a consecutive run — that's gaps and islands.
3. A running `SUM` of a 0/1 flag makes a group identifier for arbitrary session boundaries.
4. Half-open intervals `[start, end)` eliminate a whole class of date bugs.
5. Conditional aggregation pivots portably and works with any aggregate function.

## Questions & Answers — SQL Cookbook

**1. What does "thinking in sets" mean, concretely?**
Expressing a transformation as one statement over an entire collection rather than iterating row by row. Instead of "for each customer, find their max order," you write one query that partitions and ranks all rows at once — letting the optimizer parallelize and avoid round trips.

**2. Why is a numbers/pivot table so useful?**
Many problems need rows that don't exist yet: generating a date range, splitting a string into characters, exploding a quantity into individual units. A table of sequential integers gives you a source of rows to join against, converting generation problems into ordinary joins.

**3. How do you impose a custom, non-alphabetical sort order?**
Put a `CASE` expression in `ORDER BY` mapping each value to a sort position. This works because `ORDER BY` is evaluated last and can reference arbitrary expressions.

**4. How do you control whether NULLs sort first or last?**
Some engines offer `NULLS FIRST`/`NULLS LAST`; portably, sort by a computed flag first — `ORDER BY CASE WHEN col IS NULL THEN 1 ELSE 0 END, col`.

**5. What is an anti-join and name two ways to express it.**
A query returning rows in one table with no counterpart in another. Express it as a left outer join filtered on the right key being NULL, or with `NOT EXISTS`. `NOT IN` also works but is unsafe when NULLs are possible.

**6. How do you detect an accidental Cartesian product?**
The result row count equals (or approaches) the product of the input row counts, and values repeat in a regular pattern. The cause is a missing or insufficient join condition.

**7. Why is set-based update faster than looping in application code?**
One statement means one round trip, one parsing, one plan, and the engine can optimize the whole operation. A loop of N statements means N round trips, and the network latency alone dominates everything else.

**8. What's the general shape of "update one table from another"?**
Join the target to the source on a key and set the target's columns from the source's, with dialect differences in whether the join appears in `FROM`, `USING`, or the `UPDATE` clause itself.

**9. What does an upsert do, and why isn't it just an insert with error handling?**
It inserts or updates depending on whether a matching row exists, atomically. Doing it as a check-then-insert in application code introduces a race window where two sessions both see "not present" and both insert.

**10. Why is querying the data dictionary a professional skill?**
It lets you inspect and reason about a schema you didn't write, audit constraints and indexes, and — most powerfully — generate SQL programmatically, so a change across hundreds of tables becomes one query that writes the statements.

**11. How do you count occurrences of a character in a string, without a loop?**
Compare the string's length to its length with that character removed; the difference is the count. It's a good example of solving a procedural-feeling problem declaratively.

**12. How do you split a delimited list into rows?**
Join against a numbers table to generate one row per position, then extract the substring between the (n−1)th and nth delimiter. Modern engines offer built-in split functions, but the numbers-table technique is portable and explains what those functions do.

**13. How do you build a delimited list from rows?**
String aggregation — `GROUP_CONCAT` in MySQL, `STRING_AGG` in SQL Server and PostgreSQL, `LISTAGG` in Oracle — with an explicit `ORDER BY` inside so the output is deterministic.

**14. How is a running total computed, and what determines its correctness?**
A window aggregate: `SUM(x) OVER (ORDER BY key)`. Correctness depends entirely on the `ORDER BY` being total — with ties, which rows fall inside the frame is arbitrary, so add a unique tiebreaker.

**15. Why is median harder than average in SQL?**
Average is a simple aggregate; median requires knowing each value's position in the sorted order and then handling even-count cases by averaging two middle values. Some engines have `PERCENTILE_CONT`; otherwise it's a window-function construction.

**16. How do you compute each row's percentage of the total in a single pass?**
Use a window aggregate with an empty frame — `x * 100.0 / SUM(x) OVER ()`. The empty `OVER()` means "the whole result set," so no second query or self-join is needed.

**17. What's the difference between a moving average and a running average?**
A running average includes everything up to the current row (an expanding window). A moving average uses a fixed-size sliding window — `ROWS BETWEEN n PRECEDING AND CURRENT ROW`.

**18. Why do date problems dominate a chapter of this book?**
Dates have irregular arithmetic (variable month lengths, leap years, week boundaries, business days), and every engine implements the functions differently with different argument orders. They are the least portable and most error-prone part of practical SQL.

**19. How do you count business days between two dates?**
Generate every date in the range (numbers table or recursive CTE), exclude weekends by weekday, and left join to a holidays table to exclude those too. Formula-based approximations break on holidays and regional calendars.

**20. How do you detect overlapping date ranges?**
Two ranges overlap when each starts before the other ends: `a.start < b.end AND b.start < a.end`. Getting the inclusive/exclusive boundaries right is where most bugs live — prefer half-open intervals `[start, end)`.

**21. Explain the gaps-and-islands technique.**
For a sequence, subtract a row number (ordered by the sequence) from the value. Within a consecutive run both increase in lockstep, so the difference is constant; at a gap it jumps. Group by that constant and each group is one island.

**22. Name three real problems the gaps-and-islands technique solves.**
Consecutive-day login streaks; sessionizing events separated by more than N minutes of inactivity; finding contiguous ranges of allocated IDs or free inventory slots.

**23. How do you find missing values in a sequence?**
Compare each row to the next using `LEAD`; wherever the difference exceeds one, the gap runs from the current value plus one to the next value minus one.

**24. What's the problem with deep `OFFSET` pagination?**
The engine still has to produce and discard every skipped row, so cost grows linearly with the offset. Keyset pagination — `WHERE id > :last_seen ORDER BY id LIMIT n` — is constant cost regardless of depth.

**25. How do you pivot rows into columns portably?**
Conditional aggregation: one aggregate per output column, each wrapping a `CASE` that selects only the relevant rows. It works everywhere, unlike the `PIVOT` keyword.

**26. Why can't SQL pivot dynamically?**
A query's result shape is fixed at parse time, but a dynamic pivot's column list depends on data values only known at execution. It requires generating SQL text in a second step.

**27. How do you unpivot columns into rows?**
`UNION ALL` one query per source column, each emitting a label and the value — or use `UNPIVOT`/`CROSS APPLY`/`LATERAL` where available.

**28. What do `ROLLUP` and `CUBE` do?**
`ROLLUP` adds subtotals along a hierarchy of grouping columns plus a grand total. `CUBE` adds subtotals for every combination of grouping columns. Both save you from unioning many separate aggregate queries.

**29. How do you produce an indented hierarchy display?**
A recursive CTE that carries a depth counter and a path string; then repeat a padding string depth times in the output and sort by the path so children follow their parents.

**30. Why sort by a path string rather than by depth?**
Sorting by depth groups all level-2 nodes together regardless of parent, scrambling the tree. A path string like `/Rosa/Sam/Umar` sorts children immediately under their parent, reproducing the tree order.

**31. What's the danger of a recursive CTE without a depth guard?**
Cyclic data (A manages B, B manages A) causes infinite recursion. Bound it with a level counter in the recursive member's `WHERE`, and consider tracking the path to detect revisits.

**32. Why does this book show every problem in multiple dialects?**
To make explicit which capabilities are ANSI standard and which are vendor extensions, so you can tell portable technique from local convenience — and so you can translate when you change jobs.

**33. What's the best way to actually use this book?**
Don't read it linearly. When you hit a problem, find the recipe, then read the *discussion* rather than copying the solution — the explanation of why it works is where the transferable skill lives.

**34. What single technique from this book generalizes furthest?**
Deriving a grouping key from an expression rather than a stored column. Gaps-and-islands, sessionization, hierarchy paths, and bucketing all rest on it — once you see that `GROUP BY` accepts any expression, a whole class of problems opens up.

<a name="3-sql-antipatterns"></a>
# 3. SQL Antipatterns — Bill Karwin

**What it is:** a catalogue of database design mistakes, each presented as "the objective," "the antipattern," "how to recognize it," "when it's legitimately acceptable," and "the better solution." It teaches judgment rather than syntax, and it's the book most likely to change how you build things.

**Prerequisites:** you've designed at least one schema and regretted something.
**Read it when:** Stage 2–4, and again after your first year of professional work.
**Structure:** four parts — logical database design, physical design, query design, and application development.

## Territory It Covers

### Part I — Logical Database Design Antipatterns

**Storing lists in a single column.** A comma-separated `tags` column looks convenient and destroys everything: you cannot index it, you cannot enforce referential integrity, aggregate queries become string surgery, and pattern matching produces false positives (searching for "sql" matches "nosql"). The fix is an intersection table — one row per association. The rare legitimate exception is data you never query into, such as an opaque payload you only ever read whole.

**Naive tree storage.** Using only a `parent_id` column makes single-level queries trivial and arbitrary-depth queries painful without recursive CTEs. The alternatives — path enumeration, nested sets, and closure tables — each trade write cost for read power. A closure table (one row per ancestor-descendant pair, including self) makes every hierarchy question a simple join at the price of extra rows on insert.

**Always using an auto-increment integer primary key regardless of context.** The antipattern isn't surrogate keys; it's applying them thoughtlessly — adding an `id` to an intersection table that already has a perfectly good composite key, or ignoring a genuine natural key and then failing to constrain it. The result is duplicate rows that the schema permits.

**Omitting foreign key constraints.** Usually justified as "we enforce it in the application" or "constraints are slow." In practice, every application will eventually have a second writer — a migration script, an admin tool, a bulk import, a different service — and orphan rows appear. The database is the only place a rule can be enforced universally.

**Entity-Attribute-Value.** Storing arbitrary attributes as rows in an `(entity, attribute, value)` table to achieve schema flexibility. You lose data types, `NOT NULL`, referential integrity, and readable queries — reconstructing one logical row requires a join per attribute. The alternatives: single-table inheritance, concrete-table inheritance, class-table inheritance, or a semi-structured column (JSON/JSONB) which at least preserves types and indexability.

**Polymorphic associations.** A `comments` table with `commentable_type` and `commentable_id` pointing at either `articles` or `photos`. No foreign key can be declared, because the target table varies per row. Fixes: an exclusive-arc design with one nullable FK per target plus a check constraint, or a common supertable that all targets reference.

**Multi-column attributes.** `tag1`, `tag2`, `tag3` columns. Searching means checking every column, adding a fourth tag means an `ALTER TABLE`, and uniqueness across the set is unenforceable. Same fix as the comma-separated list: a dependent table.

**Table or column splitting by value.** Creating `orders_2023`, `orders_2024`, `orders_2025` manually, or adding a column per year. Queries across the split require `UNION` of a list that changes annually, and constraints can't span tables. Use the engine's declarative partitioning instead — it gives the same physical benefits while keeping one logical table.

**Using FLOAT for exact values.** Binary floating point cannot represent most decimal fractions exactly, so equality comparisons fail unpredictably and sums drift. Use `NUMERIC`/`DECIMAL` for money and any value where exactness is part of the definition.

**Specifying valid values only in a column definition.** Encoding an enumeration in a `CHECK` constraint or `ENUM` type means adding a value requires altering the table, and you can't attach metadata (display order, description, deprecation) to a value. A lookup table with a foreign key is more flexible and self-documenting.

**Storing files' paths versus storing files.** Both have failure modes. External paths mean files and rows can diverge — deletes and transaction rollbacks don't propagate to the filesystem. Storing blobs keeps them transactional but bloats backups and buffer pools. The decision hinges on whether transactional consistency or storage efficiency matters more for your use case.

**Creating indexes without a strategy.** Three failure modes: no indexes at all; indexing every column indiscriminately; and indexes that don't match the actual queries. The discipline is to measure, analyze plans, then index specific query shapes — and to review indexes for usage periodically, since every index taxes every write.

### Part II — Query Antipatterns

**Treating NULL as an ordinary value, or avoiding it entirely.** Two opposite mistakes. One is forgetting that NULL propagates through arithmetic and comparisons. The other is using magic sentinels like `-1`, `'N/A'`, or `9999-12-31` to avoid NULL, which corrupts aggregates and sorts and requires every consumer to know the convention.

**Referencing non-grouped columns in a grouped query.** Selecting a column that is neither aggregated nor in `GROUP BY` produces an arbitrary value from the group. Some engines reject it; MySQL historically returned nonsense silently. When you want the row associated with a group's maximum, you need a window function or a join to the aggregate, not a bare column.

**Fetching random rows with a full sort.** `ORDER BY RAND()` assigns a random value to every row and sorts the entire table — fine on thousands of rows, catastrophic on millions. Better: pick a random key value within the known range, use `TABLESAMPLE`, or filter with a random threshold.

**Pattern matching as a search engine.** `LIKE '%term%'` cannot use a B-tree index and degrades linearly with table size, while also matching substrings you didn't intend. Use the engine's full-text search, or a dedicated search index, when text search is a real feature rather than an occasional convenience.

**Simplifying a complex report into one query.** Combining unrelated aggregations across multiple joined tables produces Cartesian-product inflation, so counts and sums multiply each other. The fix is separate queries, or derived tables aggregated independently at the right grain before joining, or window functions.

**Using shorthand that hides intent.** `SELECT *` breaks when columns are added or reordered, prevents covering indexes, and hides which columns a query actually depends on — making refactoring unsafe.

### Part III — Application Development Antipatterns

**Storing passwords in readable form.** Plaintext or reversibly encrypted passwords mean a database read equals total account compromise. Store a salted hash from a deliberately slow algorithm, and never implement password recovery that reveals the original.

**Building SQL by concatenating user input.** The canonical injection vulnerability. Escaping is a losing arms race; parameterized queries fix it structurally by separating the query's parsed structure from its values. Where parameters can't apply — identifiers such as table and column names — use a whitelist.

**Assuming keys generated in one place are safe to reuse.** Reading a sequence's current value and assuming no one else consumed one, or reusing gaps left by deleted rows, both create race conditions and duplicate-key errors under concurrency.

**Ignoring or swallowing errors.** Empty catch blocks and unchecked return values turn a loud failure into silent data corruption discovered months later.

**Coupling application logic so tightly to SQL that it can't be tested or reviewed.** SQL scattered through the codebase as string literals is invisible to review, untestable in isolation, and impossible to audit. Consolidate data access, and treat SQL as code that gets reviewed and version controlled.

**Magic beans — the model that is nothing but a table row.** Making domain objects into thin wrappers around table rows couples the application's design to the storage schema, so every schema change ripples outward and the domain logic has nowhere to live.

**Trusting that the schema documents itself.** Cryptic table and column names, undocumented conventions, and undeclared constraints mean the rules exist only in the heads of people who will leave.

## The Ideas Worked Through

### The book's actual method

Each antipattern follows the same five-part shape, and the third and fourth parts are what make it more than a list of rules:

1. **Objective** — the legitimate goal you were trying to achieve
2. **Antipattern** — the tempting solution, presented sympathetically
3. **How to recognize it** — the smells, including the phrases people say when defending it
4. **When it's legitimate** — the genuine exceptions
5. **Solution** — what to do instead

The fourth part is the reason this book teaches judgment rather than dogma. Every antipattern has a context where it's the right call, and knowing which context is the actual skill.

### The comma-separated list, quantified

```sql
-- The tempting design
CREATE TABLE posts (post_id INT PRIMARY KEY, title VARCHAR(200), tags VARCHAR(255));
INSERT INTO posts VALUES (1, 'Indexing Basics', 'sql,database,performance');
```

Now try the ordinary things:

```sql
-- Find posts tagged 'sql'
WHERE tags LIKE '%sql%'          -- ❌ also matches 'nosql', 'mysql', 'sqlite'
WHERE FIND_IN_SET('sql', tags)   -- correct, but cannot use an index — full scan always

-- Count posts per tag                    → requires splitting the string first
-- Rename a tag across all posts          → string surgery on every row
-- Guarantee a tag exists                 → impossible; no foreign key can apply
-- Prevent duplicate tags within a post   → impossible
```

```sql
-- The fix: a junction table
CREATE TABLE tags (tag_id INT PRIMARY KEY, name VARCHAR(50) NOT NULL UNIQUE);
CREATE TABLE post_tags (
    post_id INT, tag_id INT,
    PRIMARY KEY (post_id, tag_id),
    FOREIGN KEY (post_id) REFERENCES posts(post_id),
    FOREIGN KEY (tag_id)  REFERENCES tags(tag_id)
);
```
Every previously impossible operation is now an indexed join or a one-row update.

**The legitimate exception:** a value the database never looks inside — an opaque serialized blob you always read and write whole. The moment you write a query that searches within it, you've left the exception.

### EAV, and why the alternatives are better

```sql
-- The antipattern
CREATE TABLE attributes (
    entity_id INT, attr_name VARCHAR(50), attr_value VARCHAR(255)
);
```

To reconstruct one product with six attributes you need six self-joins, every value is a string regardless of its true type, and no constraint can say "price must be a positive number" because the column holds prices, colours, and dates simultaneously.

```sql
-- Reconstructing one row — and this is only three attributes
SELECT e.id,
       a1.attr_value AS colour,
       a2.attr_value AS size,
       CAST(a3.attr_value AS DECIMAL(10,2)) AS price
FROM entities e
LEFT JOIN attributes a1 ON a1.entity_id=e.id AND a1.attr_name='colour'
LEFT JOIN attributes a2 ON a2.entity_id=e.id AND a2.attr_name='size'
LEFT JOIN attributes a3 ON a3.entity_id=e.id AND a3.attr_name='price';
```

The four alternatives, with their trade-offs:

| Approach | Structure | Wins | Loses |
|---|---|---|---|
| **Single-table inheritance** | One table, nullable columns for all subtypes | Simple, no joins | Many NULLs; can't require subtype fields |
| **Concrete-table inheritance** | One table per subtype, no shared table | Constraints per subtype | No easy query across all types |
| **Class-table inheritance** | Base table + per-subtype tables | Normalized, constrained, queryable across types | A join per access |
| **Semi-structured column** | Real columns + a `JSONB` column | Types and constraints on the stable part, flexibility for the rest | JSON part still needs indexing discipline |

For genuinely open-ended attributes, the JSON column is the modern answer: it preserves types, supports validation, and can be indexed — everything EAV throws away.

### Polymorphic associations, both fixes shown

```sql
-- ❌ The antipattern: no foreign key is possible
CREATE TABLE comments (
    id INT PRIMARY KEY,
    commentable_type VARCHAR(20),  -- 'article' or 'photo'
    commentable_id INT             -- points into a table named by the column above
);
```

```sql
-- ✅ Fix 1: exclusive arc — one nullable FK per target, plus a constraint
CREATE TABLE comments (
    id INT PRIMARY KEY,
    article_id INT NULL REFERENCES articles(id),
    photo_id   INT NULL REFERENCES photos(id),
    body TEXT NOT NULL,
    CHECK ((article_id IS NOT NULL)::INT + (photo_id IS NOT NULL)::INT = 1)
);
```

```sql
-- ✅ Fix 2: common supertable — one real FK, extensible to new types
CREATE TABLE commentables (commentable_id INT PRIMARY KEY);
CREATE TABLE articles (article_id INT PRIMARY KEY REFERENCES commentables(commentable_id), ...);
CREATE TABLE photos   (photo_id   INT PRIMARY KEY REFERENCES commentables(commentable_id), ...);
CREATE TABLE comments (
    id INT PRIMARY KEY,
    commentable_id INT NOT NULL REFERENCES commentables(commentable_id),
    body TEXT NOT NULL
);
```
Fix 1 is simpler with few fixed types; Fix 2 scales to new types without DDL on `comments`.

### The rebuttals, stated plainly

These are the arguments you'll actually have, so it's worth having the counters ready:

| "We don't need constraints because…" | Response |
|---|---|
| "The application enforces it" | There is never one writer for long — migrations, imports, admin tools, other services, and manual fixes all bypass it |
| "Foreign keys are slow" | The check is an indexed lookup; the alternative is periodic orphan cleanup and defensive queries everywhere |
| "Constraints make development harder" | They make *incorrect* development harder, which is the point; they fail loudly at the moment of the mistake |
| "We'll add them later" | Later means after bad data exists, at which point adding the constraint requires a cleanup project |
| "We might need flexibility" | Flexibility in *what the data means* is real; flexibility in *whether it's valid* is just deferred debugging |

## Misconceptions This Book Corrects

| Common belief | Reality |
|---|---|
| "Surrogate keys are always right" | They're usually right, but adding one without a unique constraint on the natural key actively permits duplicates |
| "Normalization is the goal" | Correctness is the goal; normalization is one tool, and the book is as hard on over-normalizing (EAV) as under- |
| "An ENUM is the clean way to constrain values" | A lookup table is more flexible, carries metadata, and needs no DDL to extend |
| "Storing files in the database is always wrong" | It's a real trade-off — blobs stay transactional, paths diverge from rows on rollback |
| "More indexes is safer than fewer" | Every index taxes every write and can confuse the optimizer |
| "Escaping input prevents injection" | Escaping is an arms race; parameterization removes the parsing step entirely |

## Apply It This Week

1. Open your schema and list every table without a foreign key that logically should have one. That list is your integrity debt.
2. Find one comma-separated column and write the migration to a junction table, even if you don't run it yet.
3. Check whether any table has a surrogate key but no unique constraint on its natural key — then add one.
4. Grep for string-concatenated SQL. Every hit is a vulnerability until proven otherwise.
5. Audit password storage: if it isn't bcrypt, scrypt, or Argon2 with a salt, that's the highest-priority item you have.

## If You Remember Only Five Things

1. Ask what the schema *permits*, not what the application *does* — anything permitted will eventually happen.
2. A list in a column is never worth it unless the database never looks inside.
3. Every antipattern has a legitimate context; knowing which is the skill, not memorizing the rule.
4. Application-level integrity fails because there is never exactly one writer for long.
5. Parameterization is not a mitigation for injection — it removes the vulnerability class.

## Questions & Answers — SQL Antipatterns

**1. What are the four specific costs of storing a comma-separated list in a column?**
No index usability (so searches scan), no referential integrity (values can reference nothing), no aggregation without string parsing, and false-positive matches from substring searching.

**2. When is storing a delimited list actually acceptable?**
When the value is opaque to the database — you always read and write the whole thing, never search inside it, never join on it, and never aggregate it. An external system's serialized payload can qualify.

**3. Compare adjacency list, path enumeration, nested sets, and closure table.**
Adjacency list (`parent_id`) is simple and correct with cheap writes but needs recursion for deep reads. Path enumeration stores an ancestor string, giving fast subtree reads but expensive moves. Nested sets give very fast reads and very expensive writes, since inserting renumbers much of the tree. Closure tables store every ancestor-descendant pair, giving fast queries in both directions at the cost of extra rows per insert.

**4. What's the actual antipattern regarding auto-increment primary keys?**
Not their use, but their unconsidered use: adding a meaningless `id` to a table that already has a natural composite key, and then omitting the unique constraint — so the schema now permits duplicate logical rows.

**5. Should an intersection table have its own surrogate key?**
Usually no. The pair of foreign keys is already unique and is the natural primary key. Adding an `id` without also declaring a unique constraint on the pair actively permits duplicate associations.

**6. Rebut "we enforce referential integrity in the application."**
There is never exactly one writer for long. Migrations, admin tools, bulk imports, other services, and manual fixes all bypass the application. Only a database constraint applies to every writer, including the ones that don't exist yet.

**7. Rebut "foreign keys are too slow."**
The check is an indexed lookup, typically negligible. The alternative — periodic integrity scans, defensive queries, and cleanup of orphans discovered in production — costs far more, in both compute and engineering time.

**8. What exactly do you lose with an EAV design?**
Data types, `NOT NULL` and other constraints, referential integrity on values, sane indexing, and query readability. Reconstructing one logical entity requires one join per attribute, and the plan degrades as attributes grow.

**9. What are the legitimate alternatives to EAV?**
Single-table inheritance (one table, nullable columns per subtype), concrete-table inheritance (one table per subtype), class-table inheritance (a base table plus per-subtype tables), or a semi-structured column (JSONB) — which keeps types, validation, and indexing while allowing variability.

**10. Why can't a polymorphic association have a foreign key?**
A foreign key names exactly one referenced table. If the target table varies per row based on a type column, no single constraint can express the relationship, so the database cannot validate it.

**11. Describe the exclusive-arc fix for polymorphic associations.**
Give the child one nullable foreign key column per possible parent table, then add a check constraint requiring exactly one to be non-NULL. Integrity is enforced, at the cost of a wider table.

**12. Describe the supertable fix.**
Create a common parent table whose rows represent "commentable things"; each concrete type has a one-to-one relationship with it, and the child references the supertable. One real foreign key, one join to reach the concrete type.

**13. What's wrong with `tag1, tag2, tag3` columns?**
Searching requires checking every column with `OR`, adding a fourth value requires DDL, uniqueness across the set can't be enforced, and aggregating tag popularity requires unpivoting. It's a fixed-size list pretending not to be a list.

**14. Why is manual table splitting by year worse than partitioning?**
Cross-year queries require a `UNION` whose text changes annually, constraints and foreign keys can't span the tables, and every consumer must know the naming convention. Declarative partitioning gives the same physical isolation while presenting one logical table.

**15. Give a concrete failure of FLOAT for money.**
Summing many values that individually round produces totals that disagree with a hand calculation by cents, and equality tests like `WHERE total = 10.00` fail because the stored value is 9.999999999. Reconciliation then becomes impossible.

**16. Why prefer a lookup table over an ENUM or CHECK for valid values?**
Adding a value becomes an insert rather than a schema change, values can carry metadata (labels, sort order, active flag, translations), and other tables can reference them with a real foreign key.

**17. What's the trade-off between storing file paths and storing blobs?**
Paths keep the database small and let a web server or CDN serve files directly, but files and rows diverge — a rollback or delete doesn't reach the filesystem. Blobs stay transactional and get backed up with the data, but inflate backups and consume buffer pool.

**18. What are the three indexing failure modes?**
No indexes (everything scans), indiscriminate indexes (writes suffer and the optimizer gets confused), and mismatched indexes (they exist but don't match query predicates, so they're never used).

**19. What's the disciplined approach to indexing?**
Identify the actual queries and their frequency, read their execution plans, create indexes matching real predicates and ordering, verify the plan changed, and periodically audit index usage statistics to drop the dead weight.

**20. Why are magic sentinel values worse than NULL?**
They participate in aggregates and sorts as if real, so `AVG` and `MIN` become wrong; every consumer must know the convention; and a value like `-1` may become legitimate later. NULL at least has defined semantics the engine understands.

**21. When *is* a sentinel value defensible?**
When "unknown" and "not applicable" must be distinguished, or when the column is part of a key and cannot be NULL. Even then, the convention needs a constraint and documentation.

**22. What actually happens when you select a non-grouped column?**
The engine must produce one row per group but has many candidate values, so it returns an arbitrary one — not necessarily from the row that produced the aggregate. Strict engines reject the query outright; the ones that allow it silently return misleading data.

**23. How do you correctly return the whole row associated with a group's maximum?**
Rank rows within each group with a window function and filter to rank 1, or join the table back to a derived table containing the per-group maximum. Never select a bare column alongside the aggregate.

**24. Why is `ORDER BY RAND()` a scaling disaster?**
It computes a random value for every row in the table and then fully sorts them, so cost is O(n log n) over the entire table regardless of how few rows you want.

**25. What are the better ways to sample randomly?**
Generate a random key within the known range and seek to it; use `TABLESAMPLE` where supported; or filter with a probability threshold and take the first n.

**26. Why is `LIKE '%term%'` unusable as a search feature?**
A leading wildcard makes the predicate non-sargable, forcing a full scan, and it matches substrings inside unrelated words. Real search needs an inverted index — full-text search in the engine or a dedicated search service.

**27. Why does combining unrelated aggregates in one query produce wrong numbers?**
Each join multiplies rows, so the second aggregate sums values that the first join already duplicated. The counts inflate by the cardinality of the other branch.

**28. How do you fix that report correctly?**
Aggregate each branch independently in its own derived table or CTE at its own grain, then join the pre-aggregated results — or use window functions that don't multiply rows.

**29. Give three reasons `SELECT *` is unsafe in application code.**
It breaks when column order or set changes; it prevents index-only scans by requesting columns the index doesn't cover; and it hides the query's real dependencies, making schema refactoring unsafe.

**30. Why is a fast hash like MD5 or SHA-1 wrong for passwords?**
They're designed to be fast, so an attacker with the hash file can try billions of candidates per second. Password hashing needs a deliberately slow, salted, memory-hard algorithm such as bcrypt, scrypt, or Argon2.

**31. Why is escaping input inferior to parameterization?**
Escaping tries to neutralize dangerous characters, and every encoding edge case is a potential bypass. Parameterization sends the query structure and the values separately, so a value is never parsed as SQL at all — the vulnerability class disappears rather than being patched.

**32. What do you do when you must vary a table or column name at runtime?**
Parameters cannot bind identifiers, so validate the value against an explicit whitelist of allowed names before interpolating it. Never pass user input through directly.

**33. What's the danger of reading a sequence's current value?**
Between your read and your insert, another session may consume values, so the number you read may not be the one you get — producing duplicate-key errors or, worse, rows associated with the wrong parent.

**34. Why does swallowing database errors cause more damage than crashing?**
A crash is discovered immediately and fixed. A swallowed error means the write silently didn't happen, so the corruption spreads through downstream systems and reports until someone notices months later, when the original context is gone.

**35. What's the "magic beans" problem in one sentence?**
When a domain model is nothing but a row wrapper, business logic has no home and every schema change propagates directly into the application's design.

**36. What's the single most valuable habit this book teaches?**
Asking "what does the schema *permit*?" rather than "what does the application *do*?" — because anything the schema permits will eventually happen.

# 4. SQL Performance Explained — Markus Winand

**What it is:** roughly 200 pages, engine-agnostic (covering Oracle, SQL Server, PostgreSQL, MySQL side by side), entirely about indexing and how SQL performance actually works. The best value-per-page in the whole list. The same material is available free at use-the-index-luke.com.

**Prerequisites:** you can write joins and aggregates.
**Read it when:** Stage 5, or the first time a query is too slow.
**Core thesis:** performance is a development concern, not an administration concern — it is determined by the code and the index design, and no amount of hardware or DBA effort compensates for a query the index can't serve.

## Territory It Covers

### Anatomy of an index
An index is not a magic accelerator; it is a specific data structure — a doubly linked list of sorted leaf nodes plus a balanced search tree over them. The tree lets you descend to a leaf in a few page reads; the linked list lets you scan a range once you're there. Understanding these two components explains almost every index behavior: why equality lookups are fast, why range scans are fast, why sorting can come for free, and why some predicates can't use an index at all.

Tree depth grows logarithmically, so millions of rows are reached in three or four levels — which is why index lookups feel constant-time even as tables grow.

### The three performance factors of a lookup
Finding a leaf node is only the first step. The other two are **scanning the leaf node chain** (if many entries match, you read many leaves) and **fetching the table rows** (each match may require a separate table access). A "slow index lookup" is almost always one of the latter two, not the tree descent. This reframing is the book's most useful contribution — it explains why an index that "exists" still doesn't help.

### The equality predicate and concatenated indexes
Column order in a multi-column index is a design decision with large consequences. The index is sorted by the first column, then the second within that, and so on — so a predicate on the second column alone can't use the tree, because the entries for a given second-column value are scattered throughout. The leading columns are the entry point.

The design rule follows directly: put equality predicates first, ranges after. A range predicate ends the "seek" portion — everything after it in the index can only be used to filter, not to navigate.

### Functions and non-sargable predicates
Wrapping an indexed column in a function makes the index unusable, because the index stores the column's values, not the function's results. The fixes are to rewrite the predicate so the column stands alone, or to create an index on the expression itself (a function-based index) — which stores exactly the results the query compares against.

Implicit type conversion is the invisible version of this problem: comparing a string column to a number makes the engine convert every stored value, which is a function call in disguise.

### Bind parameters
Reusing a query plan for different values saves parsing and planning. The subtlety: with a bind parameter, the optimizer plans without knowing the value, so it can't use value-specific distribution knowledge. For most queries this is a win; for queries where selectivity varies enormously by value (a status column where one value is 99% of rows), it can produce a bad plan reused everywhere.

### Searching for ranges
Range predicates use the index differently from equality: the tree finds the start, then the leaf chain is scanned to the end of the range. This is efficient, but only one range can be used for navigation — a second range column can only filter. It also explains why `LIKE 'abc%'` uses the index (it's a range) while `LIKE '%abc'` cannot (there is no starting point in sorted order).

### Partial indexes and obfuscated conditions
Where supported, indexing only the rows that matter (`WHERE active = true`) shrinks the index dramatically and speeds both reads and writes. The chapter also catalogues ways conditions get accidentally obfuscated — dates wrapped in conversions, numeric strings, concatenated columns, smart logic with `OR` — each of which quietly disables an index.

### Joins and their algorithms
Nested loops (drive from one side, look up the other — needs an index on the lookup side, good for small drives), hash join (build a hash of the smaller input and probe with the larger — good for large unsorted equality joins, indexes on the join column don't help but indexes on the filter predicates do), and sort-merge (sort both and walk them — good when inputs are already ordered). Knowing which algorithm your plan uses tells you which index would actually change anything.

### Clustering data
Reducing table access cost by keeping related rows physically together. Index-only scans are the extreme case: if the index contains every column the query needs, the table is never touched at all. Adding a column to an index solely to enable this is a deliberate, often dramatic optimization — and the reason `SELECT *` is expensive is precisely that it defeats it.

Clustered indexes (SQL Server) and index-organized tables (Oracle) store the table rows inside the index itself, so a lookup by the clustering key needs no separate table access — but secondary index lookups then need an extra step.

### Sorting and grouping
An index's leaves are already sorted, so a query whose `ORDER BY` matches an index's order can skip sorting entirely — and, importantly, can return the first rows *immediately* rather than after processing everything. This is what makes indexed top-N queries fast. The same principle applies to grouping: sorted input allows a streaming group-by rather than a hash.

Direction matters: an index can be read backwards, so a descending sort on a single column is free, but mixed directions across columns require the index to be defined that way.

### Partial results — top-N and pagination
Fetching only the first rows is a different optimization goal than fetching all rows, and the optimizer treats it as such. The chapter covers why offset-based pagination degrades linearly (skipped rows are still produced) and why keyset pagination — remembering the last value seen and seeking past it — stays fast at any depth, at the cost of not being able to jump to an arbitrary page number.

### Insert, delete, update
The write side of indexing. Every index makes every write more expensive: an insert must add an entry to each index, an update must maintain each index whose columns changed, and a delete must remove entries everywhere. This is the cost side of the ledger that makes "just add an index" a decision rather than a reflex. Deletes and updates also need indexes to *find* the rows they modify — a `DELETE` with an unindexed `WHERE` scans the whole table while holding locks.

### Execution plans
The final chapters cover reading plans in each of the four engines — the operations, the cost estimates, the difference between estimated and actual row counts, and what specific operators indicate. The recurring diagnostic: when estimates and actuals diverge wildly, the statistics are stale or the predicate is one the optimizer can't estimate, and the plan is built on a false premise.

## The Ideas Worked Through

### Why the index is two structures, and what each one buys

```
                       ┌─────────┐
        TREE           │    M    │              ← root: one page read
        (locates)   ┌──┴──┬──────┴──┐
                 ┌──┴──┐        ┌───┴───┐        ← branch: one page read
                 │ D│H │        │ R│V   │
                 └──┬──┘        └───┬───┘
    ┌───────┬───────┴──┬─────────┐  │
  ┌─▼──┐ ┌──▼─┐  ┌────▼┐  ┌──────▼┐               ← leaves: sorted, doubly linked
  │A..C│◄►│D..G│◄►│H..L │◄►│M..Q   │◄► ...
  └────┘ └────┘  └─────┘  └───────┘
        LEAF CHAIN (scans ranges)
```

**The tree** answers "where does this value live?" in three or four page reads regardless of table size, because branching factor is high and depth is logarithmic.

**The leaf chain** answers "give me everything from here to there" in one sequential walk, because leaves are sorted and linked.

Almost every index behaviour follows from these two facts:
- Equality lookups are fast → tree descent
- Range scans are fast → leaf chain walk
- `ORDER BY` can be free → leaves are already sorted
- `LIKE 'abc%'` works, `LIKE '%abc'` doesn't → the first defines a starting point in sort order, the second doesn't
- The leftmost-prefix rule exists → the tree is navigated by comparing keys from the left

### The three costs, and diagnosing which one you have

This reframing is the book's most useful single contribution. "The index isn't working" is almost never about the tree.

| Cost | What it looks like in a plan | Fix |
|---|---|---|
| **1. Tree traversal** | A few page reads. Essentially never the problem | — |
| **2. Leaf node scan** | Many index entries examined, few returned | Make the index more selective; add columns; reconsider the predicate |
| **3. Table access** | A key/bookmark lookup repeated per matching row | Make the index *covering* so no table access is needed |

```sql
-- Diagnosis: 50,000 index entries scanned, 50,000 table lookups, 3 rows returned
SELECT order_id, order_date, total
FROM orders
WHERE status = 'pending'          -- low selectivity: 50,000 rows match
  AND total > 10000;              -- the real filter, applied after fetching

-- Fix: put the selective column in the index, and cover the output
CREATE INDEX idx_orders_status_total ON orders(status, total) INCLUDE (order_date);
-- Now: seek to status='pending', range-scan total>10000 within it, no table access
```

### Column order, worked through completely

```sql
CREATE INDEX idx ON employees(department, hire_date, salary);
```

| Predicate | Can the index navigate? | Why |
|---|---|---|
| `department = 'Eng'` | ✅ Full seek on column 1 | Leading column |
| `department = 'Eng' AND hire_date = '2024-01-01'` | ✅ Seek on both | Both equality, in order |
| `department = 'Eng' AND hire_date > '2024-01-01'` | ✅ Seek on 1, range on 2 | Equality then range |
| `department = 'Eng' AND salary = 90000` | ⚠️ Seek on 1, filter salary | Column 2 skipped |
| `department = 'Eng' AND hire_date > '2024-01-01' AND salary = 90000` | ⚠️ Seek + range; salary only filters | The range ends navigation |
| `hire_date = '2024-01-01'` | ❌ Cannot use the tree | Leading column absent |

**Why the range ends navigation:** within a range of `hire_date`, the `salary` values cycle through all their possibilities repeatedly — they are not in one sorted run, so there's no contiguous region to seek to.

**Therefore the design rule:** all equality columns first (order among them barely matters for seeking, though it matters for which *other* queries the index serves), then the single range column, then columns present only for sorting or coverage.

### Sargability, with the reason attached

```sql
❌ WHERE UPPER(last_name) = 'SMITH'
```
The index stores `Smith`, `smith`, `SMITH` in *their* sort order. `UPPER()`'s output has a different ordering the index knows nothing about, so there's no region to seek to. Two fixes:

```sql
✅ CREATE INDEX idx ON people (UPPER(last_name));   -- index the expression itself
✅ -- or use a case-insensitive collation so no function is needed
```

```sql
❌ WHERE varchar_id = 12345
```
This is the invisible version: the engine must convert the *column* to a number for every row. It's a function call that doesn't appear in the query text. Compare like to like: `WHERE varchar_id = '12345'`.

```sql
❌ WHERE price * quantity > 1000     ✅ store a generated column and index it
❌ WHERE created_at + INTERVAL 7 DAY > NOW()     ✅ WHERE created_at > NOW() - INTERVAL 7 DAY
```
The last one is the general move: **get the column alone on one side; do the arithmetic on the constant side.**

### Why sorting matters more than people expect

```sql
SELECT * FROM orders ORDER BY order_date DESC LIMIT 10;
```

Without a matching index: read every row, sort all of them, discard all but ten. The sort is a **blocking operation** — it cannot emit its first row until it has consumed its last input row.

With `INDEX(order_date)`: walk the leaf chain backwards, emit ten rows, stop. Roughly ten row reads instead of millions plus a sort.

This is why "the query returns only 10 rows so it must be fast" is wrong reasoning, and why indexed top-N queries are one of the largest available wins.

**Direction subtlety:** an index can be read backwards, so a single-column descending sort is free from an ascending index. But `ORDER BY a ASC, b DESC` needs an index defined with those directions — reading backwards would invert *both*.

### Pagination, and the two strategies

```sql
-- Offset: cost grows linearly with page depth
SELECT * FROM orders ORDER BY order_date DESC LIMIT 20 OFFSET 10000;
-- The engine produces and discards 10,000 rows to return 20

-- Keyset: constant cost at any depth
SELECT * FROM orders
WHERE (order_date, order_id) < ('2024-03-15', 5821)   -- last row of previous page
ORDER BY order_date DESC, order_id DESC
LIMIT 20;
```

Keyset pagination uses a row-value comparison so ties in `order_date` are handled correctly. The trade-off is real: you can go next/previous, but you cannot jump to page 500 — because page 500's starting key isn't known without traversing there.

## Misconceptions This Book Corrects

| Common belief | Reality |
|---|---|
| "Performance is the DBA's job" | It's determined by query shape and index design, both of which developers control |
| "The index exists, so the query is optimized" | Existence is not use, and use is not efficiency — check the plan |
| "More indexes make things faster" | They make reads faster and every write slower; unused indexes are pure cost |
| "The optimizer ignored my index, so it's broken" | Above roughly 5–20% selectivity a scan genuinely is cheaper than random lookups |
| "Bind parameters are always better" | They enable plan reuse but prevent value-specific optimization; on badly skewed columns this backfires |
| "Sorting 10 rows is cheap" | The sort must consume the entire input first; only an index avoids that |
| "Hardware will fix it" | A missing index changes complexity class; hardware changes a constant factor |

## Apply It This Week

1. Take your slowest query and read its actual plan. Identify which of the three costs dominates.
2. Find one query with a function on an indexed column and rewrite it sargably. Measure both.
3. Convert one deep-offset pagination endpoint to keyset pagination.
4. Look for a query doing many key lookups and try making its index covering.
5. Run your engine's unused-index query and drop something.

## If You Remember Only Five Things

1. Slow "indexed" queries are almost always leaf scanning or table access — not tree traversal.
2. Equality columns first, one range column next, covering columns last.
3. Any function on an indexed column disables the index, including invisible type conversions.
4. A matching index can eliminate a sort entirely, which is what makes top-N queries fast.
5. Every index is a tax on every write — audit and drop the ones nothing uses.

## Questions & Answers — SQL Performance Explained

**1. What two data structures make up a B-tree index, and what does each do?**
A doubly linked list of sorted leaf nodes holding the indexed values and row pointers, and a balanced search tree above it. The tree finds a starting leaf quickly; the linked list allows efficient range scanning from there.

**2. Why does index lookup cost grow so slowly with table size?**
Tree depth is logarithmic in row count with a very high branching factor, so going from a thousand to a billion rows adds only a few levels.

**3. What are the three factors that determine index lookup performance?**
The tree traversal, the number of leaf entries scanned, and the number of table rows fetched. Slowness almost always comes from the last two.

**4. An index exists on the column in your `WHERE` clause and the query is still slow. Give three possible reasons.**
The predicate matches a large fraction of rows so many leaves are scanned; each match requires a separate table access and there are thousands of them; or the predicate is non-sargable and the index isn't actually being used.

**5. Why can't a predicate on the second column of a two-column index use the tree?**
The index is sorted by the first column first, so entries for a given second-column value are scattered across the whole index. There is no single starting point to descend to.

**6. What's the design rule for column order in a concatenated index?**
Equality predicates first, then the range predicate, then columns needed only for sorting or covering. Only the leading equality columns and one range can drive navigation.

**7. Why does a range predicate "stop" the usable portion of an index?**
After a range, the remaining columns are not in a single sorted run — within the range, later columns cycle through all their values. They can filter rows already found, but not narrow the search.

**8. Why does wrapping a column in a function disable its index?**
The index stores the raw column values in sorted order. The function's output has a different ordering that the index knows nothing about, so the engine cannot use the tree to locate matching results.

**9. What is a function-based (expression) index?**
An index built on the result of an expression rather than a bare column, so predicates using that exact expression can be served by it. It's the way to keep an index while keeping the function.

**10. How is implicit type conversion the same problem?**
Comparing a character column to a numeric value makes the engine apply a conversion function to the column, silently — same effect as an explicit function, but invisible in the query text.

**11. What's the trade-off with bind parameters?**
They enable plan reuse and prevent injection, but the optimizer plans without the actual value, so it cannot exploit value-specific distribution statistics. For columns with wildly skewed selectivity, one cached plan may be badly wrong for some values.

**12. Why does `LIKE 'abc%'` use an index while `LIKE '%abc'` cannot?**
A trailing wildcard defines a contiguous range in sorted order beginning at 'abc'. A leading wildcard has no defined starting point, since matching values are distributed throughout the sort order.

**13. What is a partial (filtered) index and when is it valuable?**
An index covering only rows matching a condition. It's valuable when queries always include that condition and the qualifying rows are a small minority — the index becomes far smaller, faster to search, and cheaper to maintain.

**14. Name four ways a condition gets accidentally obfuscated.**
Applying a function or cast to the column, comparing across mismatched types, combining columns in an expression, and using `OR` across different columns in ways the optimizer can't decompose.

**15. When is a nested loop join the right algorithm?**
When the driving side produces few rows and the other side has an index on the join column, so each lookup is cheap. It degrades badly when the driving side is large.

**16. When does a hash join win?**
Large equality joins where neither input is usefully sorted or indexed for the join. The smaller input is hashed once and the larger streams past it, so cost is linear rather than a lookup per row.

**17. Does an index on the join column help a hash join?**
Not directly — the hash join doesn't navigate the index. Indexes still matter for the *filter* predicates that reduce each input before hashing.

**18. When is a sort-merge join preferable?**
When both inputs are already sorted on the join key — often because they're being read in index order — so the merge is a single linear pass with no hashing.

**19. What is an index-only scan and why is it so fast?**
When every column the query needs exists in the index, the engine never touches the table. It eliminates the most expensive step of a lookup, often turning thousands of random reads into one sequential index range scan.

**20. What is a covering index?**
An index deliberately designed to contain all columns a specific query needs, enabling an index-only scan. Some engines let you add non-key columns purely for coverage.

**21. Why does `SELECT *` specifically hurt this optimization?**
It requests every column, so no reasonable index can cover it, guaranteeing a table access for every matching row.

**22. How does a clustered index differ from a secondary index?**
A clustered index stores the table rows in its leaves, so a lookup by the clustering key requires no separate table access. Secondary indexes store the clustering key as their pointer, so they need an extra step to reach the row.

**23. How can an index eliminate a sort?**
Its leaves are stored in sorted order, so reading them in order produces sorted output directly. If the query's `ORDER BY` matches the index order, the sort operation disappears from the plan.

**24. Why does eliminating a sort matter so much for top-N queries?**
A sort must consume its entire input before producing the first row. Index-ordered reading produces rows immediately, so `LIMIT 10` genuinely reads about ten rows rather than sorting a million and discarding almost all of them.

**25. Can one index serve `ORDER BY a ASC, b DESC`?**
Only if it was created with those directions (or their exact inverse, since an index can be read backwards). A plain ascending two-column index cannot produce mixed directions without a sort.

**26. Why does offset pagination get slower on later pages?**
The engine must generate and discard every skipped row, so the work grows linearly with the offset, even though the returned page size stays constant.

**27. How does keyset pagination fix that, and what does it cost?**
By remembering the last row's sort key and seeking past it, so each page is a fresh indexed range scan of constant cost. The cost is losing the ability to jump directly to an arbitrary page number.

**28. What is the write-side cost of an index?**
Every insert adds an entry to every index; every update maintains every index whose columns changed; every delete removes entries everywhere. Index maintenance often dominates write cost on heavily indexed tables.

**29. Why can a `DELETE` be catastrophically slow without an index?**
It scans the entire table to find matching rows, and holds locks while doing so — turning a small logical operation into a long blocking one.

**30. What does a large gap between estimated and actual row counts in a plan tell you?**
The optimizer built the plan on a false premise — usually stale statistics, correlated predicates it assumes are independent, or an expression it can't estimate. Fixing the estimate often fixes the plan without touching the query.

**31. What's the book's central claim about who owns performance?**
Developers, not administrators. Indexing is a design activity tied to the queries being written, and the person writing the query is the only one who knows its access pattern and intent.

**32. Why is "add more hardware" usually the wrong first response?**
A missing or unusable index changes complexity class — a scan of millions of rows versus a handful of page reads. Hardware improves the constant factor by a small multiple; indexing improves it by orders of magnitude.

**33. What single diagnostic habit does this book instill?**
Always look at the execution plan, and specifically at where the rows are coming from and how many are being touched at each step — rather than guessing from the query text.
