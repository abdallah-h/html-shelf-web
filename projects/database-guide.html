/* ═══ Exam mode: scored assessment, self-graded, with a topic breakdown ═══ */
let examQ=[], examI=0, examScore=[], examOn=false, examStart=0;
function startExam(n){
  const pool=[...CARDS];
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  examQ=pool.slice(0,n); examI=0; examScore=[]; examOn=true; examStart=Date.now();
  deck.classList.add('on'); openDialog(deck);
  deck.classList.add('exam');
  showExamCard();
}
function showExamCard(){
  const c=examQ[examI];
  $('flip').classList.remove('flipped');
  if(!c){ return finishExam(); }
  $('cardSrc').textContent='Exam · '+(c.src.length>34?c.src.slice(0,34)+'…':c.src);
  $('cardBox').textContent='';
  $('cardQ').textContent=c.q;
  $('cardA').innerHTML=marked.parse(c.a); highlightIn($('cardA'));
  $('deckMeta').textContent=`Question ${examI+1} of ${examQ.length}  ·  ${examScore.filter(Boolean).length} correct so far`;
  $('barK').style.width=(examScore.filter(Boolean).length/examQ.length*100)+'%';
  $('barA').style.width=(examScore.filter(x=>x===false).length/examQ.length*100)+'%';
}
function gradeExam(ok){
  if(!examQ[examI]) return;
  examScore.push(ok);
  const c=examQ[examI];
  const cur=srs[c.id]||{box:0};
  srs[c.id]= ok ? {box:Math.min(cur.box+1,INTERVALS.length-1),due:Date.now()+INTERVALS[Math.min(cur.box+1,INTERVALS.length-1)]*DAY,seen:Date.now()}
                : {box:0,due:Date.now(),seen:Date.now()};
  ok?known.add(c.id):(known.delete(c.id),again.add(c.id));
  store.set('srs',srs); store.set('known',[...known]); store.set('again',[...again]);
  examI++; showExamCard();
}
function finishExam(){
  const right=examScore.filter(Boolean).length, total=examScore.length||1;
  const pct=Math.round(right/total*100);
  const mins=Math.max(1,Math.round((Date.now()-examStart)/60000));
  // per-topic breakdown
  const byTopic={};
  examQ.slice(0,examScore.length).forEach((c,i)=>{
    const k = /^Questions & Answers/.test(c.src) ? (c.part||c.src) : c.src;
    byTopic[k]=byTopic[k]||{r:0,n:0};
    byTopic[k].n++; if(examScore[i]) byTopic[k].r++;
  });
  const rowsHtml=Object.entries(byTopic).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n)
    .map(([k,v])=>{const p=Math.round(v.r/v.n*100);
      return `<tr><td>${escapeHtml(k.length>44?k.slice(0,44)+'…':k)}</td>
        <td style="white-space:nowrap"><span class="mini"><i style="width:${p}%;background:${p<60?'var(--stamp)':'var(--accent)'}"></i></span> ${v.r}/${v.n}</td></tr>`;}).join('');
  const verdict = pct>=85?'Strong — you could sit an interview on this.'
    : pct>=65?'Solid, with gaps. Work the weakest topics below.'
    : 'Keep going. Review the weakest topics, then retake.';
  $('cardSrc').textContent='Result';
  $('cardBox').textContent='';
  $('cardQ').innerHTML=`<div style="font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1">${pct}%</div>
    <div style="font-size:15px;color:var(--muted);margin-top:6px;font-weight:400">${right} of ${total} correct · ${mins} min</div>
    <div style="font-size:16px;margin-top:16px;font-weight:500">${verdict}</div>`;
  $('cardA').innerHTML=`<div style="font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Weakest topics first</div>
    <table style="width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px">${rowsHtml}</table>`;
  const missed = examQ.slice(0,examScore.length).filter((_,i)=>!examScore[i]);
  const acts=document.createElement('div');
  acts.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:18px';
  if(missed.length){
    const b=document.createElement('button'); b.className='dbtn again';
    b.textContent=`Review the ${missed.length} I missed`;
    b.onclick=()=>{ examOn=false; deck.classList.remove('exam');
      deckFilter='__weak__'; deckMode='all'; buildScope();
      const ss=$('deckScope');
      if(ss && ![...ss.options].some(o=>o.value==='__weak__')){
        const o=document.createElement('option'); o.value='__weak__'; o.textContent='Cards you keep missing'; ss.prepend(o); }
      if(ss) ss.value='__weak__';
      buildQueue(); };
    acts.appendChild(b);
  }
  const rb=document.createElement('button'); rb.className='dbtn';
  rb.textContent='Retake with new questions'; rb.onclick=()=>startExam(examQ.length);
  acts.appendChild(rb);
  const xb=document.createElement('button'); xb.className='dbtn primary';
  xb.textContent='Back to the deck'; xb.onclick=exitExam;
  acts.appendChild(xb);
  $('cardA').appendChild(acts);
  $('flip').classList.add('flipped');
  $('deckMeta').textContent=`Exam complete · ${pct}%`;
  examOn=false;
  announce(`Exam complete. ${pct} percent.`);
}
function exitExam(){ examOn=false; deck.classList.remove('exam'); buildScope(); buildQueue(); }


/* ═══ Cheat sheet: the rules worth carrying, on one printable page ═══ */
const CHEATS = [
 ['Clause order', [
   ['Logical execution','FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT'],
   ['Alias rule','Usable in ORDER BY (runs after SELECT), not in WHERE (runs before)'],
   ['Filter placement','WHERE filters rows, HAVING filters groups. Neither does the other\u2019s job'],
   ['Window functions','Computed at SELECT, so they cannot be filtered in WHERE — wrap in a CTE'],
 ]],
 ['NULL', [
   ['Meaning','Unknown, not zero and not empty string'],
   ['Comparison','Always IS NULL / IS NOT NULL — never = NULL'],
   ['NOT IN trap','One NULL in the list makes the whole predicate UNKNOWN → zero rows. Use NOT EXISTS'],
   ['Aggregates','Ignore NULLs, so AVG divides by the non-NULL count'],
   ['Safe division','x / NULLIF(y, 0)'],
 ]],
 ['Joins', [
   ['Mechanism','One output row per matching PAIR — that is why totals inflate'],
   ['Outer join filters','Conditions on the optional table go in ON, not WHERE'],
   ['Anti-join','LEFT JOIN … WHERE right.key IS NULL, or NOT EXISTS'],
   ['Inflated SUM','Join fan-out. Pre-aggregate each branch to its own grain, then join'],
   ['DISTINCT','Never the fix for duplicates from a join — it hides the symptom, the SUM stays wrong'],
 ]],
 ['Indexes', [
   ['Structure','Balanced tree for the seek, sorted linked leaves for the range scan'],
   ['Column order','Equality columns first, one range column next, covering columns last'],
   ['Leftmost prefix','A predicate on a later column alone cannot enter the tree'],
   ['Non-sargable','Function on the column, type coercion, leading %, arithmetic on the column'],
   ['Covering index','Contains every column the query needs → no table access at all'],
   ['Cost','Every index is a tax on every insert, update and delete'],
 ]],
 ['Transactions', [
   ['ACID','Atomicity, Consistency, Isolation, Durability'],
   ['Anomalies','Dirty read · non-repeatable read · phantom · lost update · write skew'],
   ['Write skew','Snapshot isolation does NOT prevent it — needs SERIALIZABLE or explicit locks'],
   ['Deadlocks','Lock in a consistent order, keep transactions short, retry with backoff'],
   ['NOLOCK','Is READ UNCOMMITTED. Can return rows twice or skip them. Not a performance feature'],
 ]],
 ['Types and data', [
   ['Money','DECIMAL or integer minor units — never FLOAT'],
   ['Time','Store UTC, convert at the presentation layer'],
   ['MySQL text','utf8mb4, never the legacy 3-byte utf8'],
   ['Date ranges','Half-open: >= start AND < end. BETWEEN silently truncates the last day'],
   ['Integer division','5/2 = 2 in most engines. Multiply by 1.0 or cast'],
 ]],
 ['Habits', [
   ['Before UPDATE/DELETE','Run the same WHERE as SELECT COUNT(*) first, inside a transaction'],
   ['Never in production','SELECT * — it breaks covering indexes and hides dependencies'],
   ['User input','Parameterize, always. Whitelist identifiers, which cannot be parameterized'],
   ['Optimize by','Total time (calls × duration), not worst single duration'],
   ['Before tuning','Read the execution plan. Guessing wastes more time than reading it'],
 ]],
];
window.showCheatSheet = showCheatSheet;
function showCheatSheet(){
  const ix = SECTIONS.length; // virtual
  results.classList.remove('on'); content.style.display='';
  content.innerHTML = `<div class="eyebrow">Reference · one page</div><h2>Cheat sheet</h2>

  CHEATS.forEach(([title, rows])=>{

  const bb=document.createElement('button'); bb.className='navbtn'; bb.textContent='← Back to the guide';
  bb.onclick=()=>go(cursor); p.appendChild(bb);
  content.appendChild(p);
  buildToc(content); window.scrollTo({top:0,behavior:'instant'});
  announce('Cheat sheet');
}

/* ═══ Focus management for dialogs ═══ */
let lastFocus = null;
const FOCUSABLE = 'button,select,textarea,input,a[href],[tabindex]:not([tabindex="-1"])';
function trapFocus(e){
  const box = deck.classList.contains('on') ? deck : (sp.classList.contains('on') ? sp : null);
  if(!box || e.key !== 'Tab') return;
  const f=[...box.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null||x===document.activeElement);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
addEventListener('keydown', trapFocus, true);
function openDialog(box){ lastFocus=document.activeElement; setTimeout(()=>box.querySelector(FOCUSABLE)?.focus(),40); }
function closeDialog(){ lastFocus?.focus?.(); lastFocus=null; }

/* ═══ Chrome ═══ */
function syncVolButtons(){ document.querySelectorAll('.vol-switch button').forEach(b=>b.setAttribute('aria-pressed', (+b.dataset.vol===curVol)+'')); }
document.querySelectorAll('.vol-switch button').forEach(b=>{
  b.onclick = ()=>{ go(SECTIONS.findIndex(s=>s.vol===+b.dataset.vol)); };
});
$('sqlBtn').onclick = ()=> openConsole();
const toTop=document.getElementById('toTop');
toTop.onclick=()=>scrollTo({top:0,behavior:'smooth'});
const railq=document.getElementById('railq');
railq.addEventListener('input',()=>{
  const q=railq.value.trim().toLowerCase();
  spine.querySelectorAll('.grpwrap').forEach(wr=>{
    let shown=0;
    wr.querySelectorAll('.navitem').forEach(n=>{
      const hit = !q || n.textContent.toLowerCase().includes(q);
      n.style.display = hit?'':'none'; if(hit) shown++;
    });
    const head = wr.querySelector('.partlink,.part');
    const headHit = !q || (head && head.textContent.toLowerCase().includes(q));
    wr.style.display = (shown||headHit) ? '' : 'none';
    if(q && shown) wr.classList.add('open');
  });
  spine.querySelectorAll('.volhead').forEach(v=>{ v.style.display = q?'none':''; });
});
railq.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape'){ railq.value=''; railq.dispatchEvent(new Event('input')); } });
document.getElementById('railToggle').onclick=()=>{
  const anyClosed=[...spine.querySelectorAll('.grpwrap')].some(w=>!w.classList.contains('open'));
  spine.querySelectorAll('.grpwrap').forEach(w=>w.classList.toggle('open',anyClosed));
};
const SIZES=[15,17,19,21];
let sizeIx=1;
function applySize(){ document.documentElement.style.setProperty('--body-size', SIZES[sizeIx]+'px'); }
$('sizeBtn').onclick = ()=>{ sizeIx=(sizeIx+1)%SIZES.length; applySize(); store.set('fontsize',sizeIx);
  announce('Text size '+SIZES[sizeIx]+' pixels'); };
$('helpBtn').onclick = ()=> toggleHelp();
$('themeBtn').onclick = ()=>{ const t = document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; store.set('theme',t); };
$('revealBtn').onclick = ()=>{ const on = document.body.classList.toggle('reveal-all'); $('revealBtn').classList.toggle('hot',on); content.querySelectorAll('.qa').forEach(d=>d.open=on); };
const scrim = document.getElementById('scrim');
function drawer(open){ spine.classList.toggle('open',open); scrim.classList.toggle('on',open); }
$('menuBtn').onclick = ()=> drawer(!spine.classList.contains('open'));
scrim.onclick = ()=> drawer(false);

addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - innerHeight;
  $('readbar').style.width = (h>0 ? Math.min(100, scrollY/h*100) : 0)+'%';
  toTop.classList.toggle('on', scrollY > 900);
  const cs = SECTIONS[cursor]; if(cs) scrollMem[cs.id] = scrollY;
  let act=null;
  content.querySelectorAll('h3,h4').forEach(x=>{ if(x.getBoundingClientRect().top < 120) act = x.id; });
  tocEl.querySelectorAll('a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#'+act));
});

addEventListener('keydown', e=>{
  if(deck.classList.contains('on')){
    if(e.key===' '){ e.preventDefault(); $('flip').classList.toggle('flipped'); }
    if(e.key==='ArrowRight') examOn?gradeExam(true):grade(true);
    if(e.key==='ArrowLeft')  examOn?gradeExam(false):grade(false);
    if(e.key==='Escape'){ deck.classList.remove('on'); closeDialog(); }
    return;
  }
  if(e.key==='/' && document.activeElement!==searchEl){ e.preventDefault(); searchEl.focus(); }
  if(e.key==='Escape' && document.activeElement===searchEl){ searchEl.value=''; runSearch(); searchEl.blur(); }
  if(document.activeElement===searchEl) return;
  if(e.key==='?'){ e.preventDefault(); toggleHelp(); return; }
  if(e.key==='Escape'){ toggleHelp(false); }
  if(e.key==='r'){ e.preventDefault(); openConsole(); return; }
  if(e.key==='c'){ e.preventDefault(); openChallenge(chIndex); return; }
  if(e.key==='e'){ e.preventDefault(); startExam(25); return; }
  if(e.key==='x'){ e.preventDefault(); showCheatSheet(); return; }
  if(e.key==='t'){ const th=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=th; store.set('theme',th); return; }
  if(e.key==='m'){ const b=content.querySelector('.markread'); b?.click(); return; }
  if(e.key==='q'){ e.preventDefault(); const sec=SECTIONS[cursor];
    if(CARDS.some(c=>c.id.startsWith(sec.id+'q'))) startSectionQuiz(sec); else announce('No questions in this section'); return; }
  if(e.key==='Escape' && sp.classList.contains('on')){ closeConsole(); return; }
  if(e.key==='j') go(cursor+1);
  if(e.key==='k') go(cursor-1);
  if(e.key==='s'){ deck.classList.add('on'); buildScope(); buildQueue(); }
});

/* ═══ Boot ═══ */
(async ()=>{
  const t = await store.get('theme'); if(t) document.documentElement.dataset.theme = t;
  read  = new Set(await store.get('read')  || []);
  known = new Set(await store.get('known') || []);
  again = new Set(await store.get('again') || []);
  srs   = await store.get('srs') || {};
  streak = await store.get('streak') || {days:0,last:null};
  const fs0 = await store.get('fontsize'); if(fs0!=null){ sizeIx=fs0; } applySize();
  chSolved = new Set(await store.get('solved') || []);
  buildSpine();
  const h = location.hash.slice(1);
  const idx = SECTIONS.findIndex(s=>s.id===h);
  if(idx >= 0) go(idx, false);
  else if(h && followAnchor('#'+h)) {}
  else go(0, false);
})();
