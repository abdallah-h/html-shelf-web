## 19. Set Operators

| Operator | Result | Duplicates |
|---|---|---|
| `UNION` | Rows from both | Removed (requires a sort — slower) |
| `UNION ALL` | Rows from both | Kept (**faster — prefer when you know there are no dupes**) |
| `INTERSECT` | Rows in both | Removed |
| `EXCEPT` / `MINUS` | In first, not in second | Removed |

Requirements: same number of columns, compatible types, same order. Column names come from the first query. `ORDER BY` goes only at the very end.

```sql
SELECT name, email FROM customers
UNION ALL
SELECT name, email FROM leads
ORDER BY name;
```

MySQL added `INTERSECT`/`EXCEPT` in 8.0.31; older versions emulate them with joins and `NOT EXISTS`. Oracle uses `MINUS` instead of `EXCEPT`.

## 20. Indexes — How They Really Work

An index is a sorted auxiliary structure (usually a **B+ tree**) that lets the engine find rows without scanning the whole table — like a book's index versus reading every page.

### Cost/benefit

✅ Speeds up: `WHERE`, `JOIN`, `ORDER BY`, `GROUP BY`, uniqueness checks
❌ Costs: disk space, and slower `INSERT`/`UPDATE`/`DELETE` (every index must be maintained)

### Index types

| Type | Description |
|---|---|
| **Clustered** | Determines the *physical* row order. **One per table.** In MySQL/InnoDB the PK is always the clustered index; in SQL Server you choose |
| **Non-clustered / secondary** | Separate structure pointing back to rows. Many per table |
| **Unique** | Enforces uniqueness as well as speeding lookups |
| **Composite** | Multiple columns — order matters enormously |
| **Covering** | Contains every column the query needs → no table lookup ("index-only scan") |
| **Filtered / partial** | Indexes only a subset of rows |
| **Full-text** | Word-based text search |
| **Hash** | Equality only, no ranges (MEMORY engine, Postgres) |

```sql
CREATE INDEX idx_orders_customer ON orders(customer_id);
CREATE UNIQUE INDEX idx_users_email ON users(email);
CREATE INDEX idx_orders_cust_date ON orders(customer_id, order_date DESC);

-- Covering index (SQL Server INCLUDE columns are stored at leaf level only)
CREATE INDEX idx_cover ON orders(customer_id) INCLUDE (order_date, total);

-- Filtered / partial
CREATE INDEX idx_active ON users(last_login) WHERE is_active = 1;  -- SQL Server/Postgres

DROP INDEX idx_name ON table_name;     -- MySQL/SQL Server
DROP INDEX idx_name;                   -- PostgreSQL
```

### The leftmost prefix rule (composite indexes)

Given `INDEX(a, b, c)`, the index can be used for:

| Query predicate | Usable? |
|---|---|
| `WHERE a = ?` | ✅ |
| `WHERE a = ? AND b = ?` | ✅ |
| `WHERE a = ? AND b = ? AND c = ?` | ✅ fully |
| `WHERE b = ?` | ❌ (skips the leftmost column) |
| `WHERE b = ? AND c = ?` | ❌ |
| `WHERE a = ? AND c = ?` | ⚠️ partially — only `a` |

**Design rule:** put equality columns first, then range columns, then columns used only for sorting. A range predicate (`>`, `<`, `BETWEEN`, `LIKE 'x%'`) stops the index from using subsequent columns for seeking.

### What makes a query non-sargable (index-defeating)

```sql
❌ WHERE YEAR(order_date) = 2024          ✅ WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'
❌ WHERE UPPER(name) = 'JOHN'             ✅ Use a case-insensitive collation, or index the expression
❌ WHERE price * 2 > 100                  ✅ WHERE price > 50
❌ WHERE name LIKE '%son'                 ✅ WHERE name LIKE 'son%'  (or a full-text/reverse index)
❌ WHERE varchar_col = 123                ✅ WHERE varchar_col = '123'
❌ WHERE col1 + col2 > 10                 ✅ Store a computed/generated column and index it
```

### 🔬 How a B-tree actually finds your row

A table with 1,000,000 rows and `INDEX(last_name)`. You run `WHERE last_name = 'Osei'`.

**Without the index — full table scan:** read all 1,000,000 rows, test each one. Cost ≈ 1,000,000 row reads.

**With the index — B-tree seek:**

```
                    [ M ]                       ← root page
                   /     \
            [ D | H ]     [ R | V ]             ← branch pages
           /    |    \
   [A..C] [D..G] [H..L]  ...                    ← leaf pages (sorted, linked)
                    ↓
          'Osei' → row pointer → fetch the row
```

Each level is one page read. A B-tree with a fanout of a few hundred keys per page reaches a million rows in **3–4 levels**. So the cost is roughly 4 reads instead of 1,000,000 — a 250,000× reduction. That is why indexing is the highest-leverage skill in this guide.

**Two more things the diagram explains:**
- Leaf pages are stored **in sorted order and linked**, which is why an index also satisfies `ORDER BY last_name` and range scans like `BETWEEN 'D' AND 'G'` for free.
- The tree is navigated by **prefix comparison from the left**, which is exactly why the leftmost-prefix rule exists — you cannot enter the tree in the middle of a key.

### 🔬 Measure it yourself

```sql
-- 1. Generate a large table (MySQL 8 / adapt as needed)
CREATE TABLE bench (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(50), val INT);
INSERT INTO bench (name, val)
SELECT CONCAT('user', n), FLOOR(RAND()*10000)
FROM (WITH RECURSIVE seq(n) AS (SELECT 1 UNION ALL SELECT n+1 FROM seq WHERE n < 500000)
      SELECT n FROM seq) t;

-- 2. Time it with no index
EXPLAIN SELECT * FROM bench WHERE name = 'user250000';   -- type: ALL, rows: ~500000

-- 3. Add the index and compare
CREATE INDEX idx_bench_name ON bench(name);
EXPLAIN SELECT * FROM bench WHERE name = 'user250000';   -- type: ref, rows: 1

-- 4. Now break it deliberately and watch the plan regress
EXPLAIN SELECT * FROM bench WHERE UPPER(name) = 'USER250000';   -- back to a full scan
```

Do this once and the sargability rules stop being abstract advice.

### 🔬 Composite index design, worked

You have these three queries against `orders`:

```sql
-- Q1
SELECT * FROM orders WHERE customer_id = 42;
-- Q2
SELECT * FROM orders WHERE customer_id = 42 AND order_date >= '2024-01-01';
-- Q3
SELECT * FROM orders WHERE order_date >= '2024-01-01';
```

**Naive answer:** three indexes. **Better answer:** two.

`INDEX(customer_id, order_date)` serves Q1 (leftmost prefix) and Q2 (equality then range) — one index, two queries. It does **not** serve Q3, which skips the leading column, so Q3 needs `INDEX(order_date)`.

**Why that column order and not `(order_date, customer_id)`?** With the range column first, the index can seek to the start of the date range but must then scan every row in it to test `customer_id`. Equality columns first narrow the tree to a single point, and the range then reads a contiguous run. **Rule: equality columns first, range columns last, and columns used only for sorting after that.**

**Finding unused indexes** (every index you don't need is a tax on every write):
```sql
-- MySQL 8
SELECT * FROM sys.schema_unused_indexes;
-- SQL Server
SELECT * FROM sys.dm_db_index_usage_stats WHERE user_seeks + user_scans = 0;
-- PostgreSQL
SELECT relname, indexrelname, idx_scan FROM pg_stat_user_indexes WHERE idx_scan = 0;
```

### When indexes *don't* help
- Small tables (a full scan is cheaper than tree traversal)
- Low-cardinality columns alone (a `gender` or `is_active` boolean) — unless combined or filtered
- When the query returns a large fraction of rows (>~20%) — the engine will choose a scan anyway
- Write-heavy tables with rarely-used indexes

### Maintenance
```sql
-- Find fragmentation / rebuild
ALTER INDEX idx_name ON table_name REBUILD;         -- SQL Server
OPTIMIZE TABLE table_name;                           -- MySQL
REINDEX TABLE table_name;                            -- PostgreSQL

-- Update statistics (critical for good plans)
UPDATE STATISTICS table_name;                        -- SQL Server
ANALYZE TABLE table_name;                            -- MySQL
ANALYZE table_name;                                  -- PostgreSQL
```

## 21. Transactions, ACID, and Isolation Levels

A **transaction** is a unit of work that either fully succeeds or fully fails.

### ACID

| Property | Meaning | Mechanism |
|---|---|---|
| **A**tomicity | All or nothing | Undo log / rollback segment |
| **C**onsistency | Constraints hold before and after | Constraints, triggers, cascades |
| **I**solation | Concurrent transactions don't corrupt each other | Locks or MVCC |
| **D**urability | Committed data survives a crash | Write-ahead log, fsync |

```sql
-- MySQL / PostgreSQL
START TRANSACTION;
    UPDATE accounts SET balance = balance - 500 WHERE account_id = 1;
    UPDATE accounts SET balance = balance + 500 WHERE account_id = 2;
COMMIT;        -- or ROLLBACK;

-- SQL Server
BEGIN TRANSACTION;
BEGIN TRY
    UPDATE accounts SET balance = balance - 500 WHERE account_id = 1;
    UPDATE accounts SET balance = balance + 500 WHERE account_id = 2;
    COMMIT TRANSACTION;
END TRY
BEGIN CATCH
    ROLLBACK TRANSACTION;
    THROW;
END CATCH;
```

### Savepoints
```sql
START TRANSACTION;
    INSERT INTO orders VALUES (...);
    SAVEPOINT after_order;
    INSERT INTO order_items VALUES (...);
    ROLLBACK TO SAVEPOINT after_order;   -- undo only the items
COMMIT;
```

### Concurrency problems

| Problem | What happens |
|---|---|
| **Dirty read** | You read data another transaction wrote but hasn't committed (it may vanish) |
| **Non-repeatable read** | You read the same row twice and get different values (someone committed an UPDATE between) |
| **Phantom read** | You run the same range query twice and get different *row counts* (someone INSERTed) |
| **Lost update** | Two transactions read-modify-write; one overwrites the other |

### Isolation levels

| Level | Dirty read | Non-repeatable | Phantom | Default in |
|---|---|---|---|---|
| `READ UNCOMMITTED` | ✅ possible | ✅ | ✅ | — |
| `READ COMMITTED` | ❌ | ✅ | ✅ | **SQL Server, PostgreSQL, Oracle** |
| `REPEATABLE READ` | ❌ | ❌ | ✅* | **MySQL/InnoDB** |
| `SERIALIZABLE` | ❌ | ❌ | ❌ | — |

\* InnoDB's gap locking prevents most phantoms even at REPEATABLE READ.

```sql
SET TRANSACTION ISOLATION LEVEL READ COMMITTED;
SET SESSION TRANSACTION ISOLATION LEVEL SERIALIZABLE;   -- MySQL
```

**Practical guidance:** higher isolation = more correctness, less concurrency. `READ COMMITTED` is the right default for most applications. Reach for `SERIALIZABLE` only for critical invariants (inventory decrements, financial ledgers), and be prepared to retry on serialization failures. Avoid `READ UNCOMMITTED` (and SQL Server's `WITH (NOLOCK)` hint, which is the same thing) — it can return rows twice, skip rows, or read data that never existed.

### Locking & deadlocks

```sql
SELECT * FROM inventory WHERE id = 5 FOR UPDATE;         -- exclusive lock (MySQL/Postgres)
SELECT * FROM inventory WHERE id = 5 FOR SHARE;          -- shared lock
SELECT * FROM inventory WITH (UPDLOCK) WHERE id = 5;     -- SQL Server
SELECT ... FOR UPDATE SKIP LOCKED;                       -- job-queue pattern
```

A **deadlock** occurs when transaction A holds a lock B wants while B holds one A wants. The engine detects the cycle and kills one as the "victim."

**How to avoid deadlocks:**
1. Always access tables/rows in the **same order** across all code paths.
2. Keep transactions **short** — never wait for user input inside one.
3. Use the lowest workable isolation level.
4. Index your `WHERE` clauses so fewer rows get locked.
5. Add retry logic for the victim (deadlock errors are usually transient).

### 🔬 A deadlock, in slow motion

Two transfers running at the same moment:

```
Time  Transaction A                          Transaction B
────  ─────────────────────────────────────  ─────────────────────────────────────
t1    BEGIN                                  BEGIN
t2    UPDATE accounts SET bal=bal-100
        WHERE id=1        ← locks row 1
t3                                           UPDATE accounts SET bal=bal-50
                                               WHERE id=2      ← locks row 2
t4    UPDATE accounts SET bal=bal+100
        WHERE id=2        ← BLOCKED, B holds row 2
t5                                           UPDATE accounts SET bal=bal+50
                                               WHERE id=1      ← BLOCKED, A holds row 1
t6    ══════════ DEADLOCK: each waits for the other, forever ══════════
t7    Engine detects the cycle, kills one transaction as the "victim"
```

**The fix is one line of discipline:** always lock rows in a consistent order. If both transactions touch accounts in ascending ID order, A takes row 1 then row 2, and B waits for row 1 rather than holding row 2 — no cycle, just a brief wait.

```sql
-- Enforce ordering in application code
UPDATE accounts SET bal = bal + CASE id WHEN :from THEN -:amt ELSE :amt END
WHERE id IN (:from, :to)
ORDER BY id;          -- or simply issue the two UPDATEs sorted by id
```

**Retry logic is mandatory, not optional** — deadlocks are a normal condition under concurrency, not a bug:

```python
for attempt in range(3):
    try:
        run_transfer(); break
    except DeadlockError:
        time.sleep(0.05 * (2 ** attempt))   # exponential backoff
```

### 🔬 See an isolation anomaly for yourself

Open **two** client sessions side by side and run these interleaved:

```sql
-- Session 1                          -- Session 2
SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;
BEGIN;
SELECT bal FROM accounts WHERE id=1;  -- returns 500
                                      BEGIN;
                                      UPDATE accounts SET bal=999 WHERE id=1;
                                      COMMIT;
SELECT bal FROM accounts WHERE id=1;  -- returns 999  ← non-repeatable read!
COMMIT;
```

Now repeat the whole thing with `REPEATABLE READ` in session 1. The second `SELECT` still returns 500 — session 1 sees a consistent snapshot from when its transaction began. Running this once teaches isolation levels better than any table.

### MVCC vs locking
PostgreSQL, MySQL/InnoDB, and Oracle use **Multi-Version Concurrency Control**: writers create new row versions instead of blocking readers, so *readers never block writers and writers never block readers*. SQL Server uses pessimistic locking by default but offers MVCC-like behavior via `READ_COMMITTED_SNAPSHOT` — an option worth enabling on most SQL Server workloads.

## 22. Views, Stored Procedures, Functions, Triggers

### Views — saved queries

```sql
CREATE VIEW v_customer_summary AS
SELECT c.customer_id, c.name,
       COUNT(o.order_id) AS order_count,
       COALESCE(SUM(o.amount), 0) AS lifetime_value
FROM customers c
LEFT JOIN orders o ON c.customer_id = o.customer_id
GROUP BY c.customer_id, c.name;

SELECT * FROM v_customer_summary WHERE lifetime_value > 5000;
```

Uses: simplify complex joins, enforce security (grant on the view, not the base tables), provide a stable interface while the schema evolves.

**Materialized views** physically store the results and must be refreshed — great for expensive aggregations.
```sql
CREATE MATERIALIZED VIEW mv_sales AS SELECT ...;   -- PostgreSQL / Oracle
REFRESH MATERIALIZED VIEW mv_sales;
CREATE VIEW v WITH SCHEMABINDING AS ...; CREATE UNIQUE CLUSTERED INDEX ... -- SQL Server "indexed view"
-- MySQL has no materialized views; emulate with a summary table + scheduled event
```

### Stored procedures

```sql
-- MySQL
DELIMITER //
CREATE PROCEDURE transfer_funds(IN from_id INT, IN to_id INT, IN amt DECIMAL(10,2))
BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
    BEGIN ROLLBACK; RESIGNAL; END;

    START TRANSACTION;
        UPDATE accounts SET balance = balance - amt WHERE account_id = from_id;
        UPDATE accounts SET balance = balance + amt WHERE account_id = to_id;
    COMMIT;
END //
DELIMITER ;

CALL transfer_funds(1, 2, 500.00);
```

```sql
-- SQL Server (T-SQL)
CREATE PROCEDURE dbo.TransferFunds
    @FromId INT, @ToId INT, @Amount DECIMAL(10,2)
AS
BEGIN
    SET NOCOUNT ON;
    BEGIN TRY
        BEGIN TRANSACTION;
            UPDATE accounts SET balance = balance - @Amount WHERE account_id = @FromId;
            UPDATE accounts SET balance = balance + @Amount WHERE account_id = @ToId;
        COMMIT;
    END TRY
    BEGIN CATCH
        IF @@TRANCOUNT > 0 ROLLBACK;
        THROW;
    END CATCH
END;

EXEC dbo.TransferFunds @FromId = 1, @ToId = 2, @Amount = 500.00;
```

**Pros:** encapsulation, reduced network round-trips, precompiled plans, permission granularity.
**Cons:** business logic outside version control (unless you're disciplined), harder testing, vendor lock-in.

### User-defined functions

```sql
-- MySQL scalar function
DELIMITER //
CREATE FUNCTION calc_discount(price DECIMAL(10,2), pct INT)
RETURNS DECIMAL(10,2) DETERMINISTIC
BEGIN
    RETURN price - (price * pct / 100);
END //
DELIMITER ;

SELECT product_name, calc_discount(price, 15) AS sale_price FROM products;
```

```sql
-- SQL Server: table-valued function (inline TVFs perform far better than scalar UDFs)
CREATE FUNCTION dbo.GetOrdersByCustomer (@CustomerId INT)
RETURNS TABLE
AS
RETURN (SELECT order_id, order_date, amount FROM orders WHERE customer_id = @CustomerId);

SELECT * FROM dbo.GetOrdersByCustomer(42);
```

> ⚠️ **Scalar UDFs in a `SELECT` list run once per row** and historically blocked parallelism — a notorious SQL Server performance killer. Prefer inline table-valued functions or plain expressions. (SQL Server 2019+ can inline some scalar UDFs automatically.)

**Procedure vs function**

| | Stored Procedure | Function |
|---|---|---|
| Returns | Zero or many result sets, output params | One value or one table |
| Callable in SELECT | No | Yes |
| Can modify data | Yes | Generally no |
| Can manage transactions | Yes | No |
| Invoked by | `CALL` / `EXEC` | Inside an expression |

### Triggers

```sql
-- MySQL: audit trail
CREATE TRIGGER trg_products_price_audit
AFTER UPDATE ON products
FOR EACH ROW
BEGIN
    IF OLD.price <> NEW.price THEN
        INSERT INTO price_history(product_id, old_price, new_price, changed_at)
        VALUES (NEW.product_id, OLD.price, NEW.price, NOW());
    END IF;
END;
```

```sql
-- SQL Server: uses the inserted/deleted pseudo-tables, fires ONCE PER STATEMENT (set-based!)
CREATE TRIGGER trg_ProductAudit ON products
AFTER UPDATE
AS
BEGIN
    SET NOCOUNT ON;
    INSERT INTO price_history(product_id, old_price, new_price, changed_at)
    SELECT i.product_id, d.price, i.price, GETDATE()
    FROM inserted i JOIN deleted d ON i.product_id = d.product_id
    WHERE i.price <> d.price;
END;
```

| Reference | MySQL | SQL Server |
|---|---|---|
| Old values | `OLD.col` | `deleted` table |
| New values | `NEW.col` | `inserted` table |
| Granularity | Per row | Per statement |

> ⚠️ Triggers are invisible side effects — they surprise developers, complicate debugging, and can cascade. Use them for auditing and integrity that constraints can't express; keep business logic in the application.

## 23. Query Optimization & Execution Plans

### Read the plan first, guess second

```sql
EXPLAIN SELECT ...;                    -- MySQL (add FORMAT=JSON or ANALYZE in 8.0.18+)
EXPLAIN ANALYZE SELECT ...;            -- MySQL 8.0.18+, PostgreSQL (actually runs it)
SET SHOWPLAN_ALL ON;                   -- SQL Server text plan
-- SQL Server: press Ctrl+M in SSMS for the actual graphical execution plan
```

### What to look for

| Sign | Meaning | Fix |
|---|---|---|
| `ALL` / Table Scan / Seq Scan | Reading the whole table | Add or fix an index |
| `index` / Index Scan | Reading the whole index | Narrow the predicate |
| `ref` / `range` / Index Seek | Good — targeted lookup | ✅ |
| `Using filesort` | Sorting in memory/disk | Index matching `ORDER BY` |
| `Using temporary` | Building a temp table | Simplify GROUP BY / DISTINCT |
| Huge estimated vs actual rows | Stale statistics | `ANALYZE` / `UPDATE STATISTICS` |
| Key Lookup / Bookmark Lookup | Index found row, but needs more columns | Make it a covering index |
| Nested loop over millions of rows | Bad join choice | Check stats, indexes, join order |

### Optimization checklist

1. **Select only the columns you need** — `SELECT *` blocks covering indexes and wastes I/O.
2. **Filter early and narrowly.** Push `WHERE` down; reduce rows before joining.
3. **Keep predicates sargable** (no functions on indexed columns).
4. **Index your join keys** — every FK should almost always have an index (MySQL creates one automatically; SQL Server does **not**).
5. **`UNION ALL` over `UNION`** when duplicates are impossible.
6. **`EXISTS` over `IN`** for large correlated subqueries; **`NOT EXISTS` over `NOT IN`** always.
7. **Avoid `SELECT DISTINCT` as a bug fix** — it usually masks a bad join producing duplicates.
8. **Batch large writes** into chunks (e.g. 10k rows) to avoid lock escalation and log bloat.
9. **Keep statistics fresh**; the optimizer is only as good as its row estimates.
10. **Watch for the N+1 query problem** in ORMs — one query per row in a loop. Use a join or eager loading.
11. **Parameterize queries** — reused plans + SQL-injection safety in one move.
12. **Measure.** Use the slow query log (MySQL), Query Store (SQL Server 2016+), or `pg_stat_statements` (Postgres).

### Before/after example

```sql
-- ❌ Before: function on column, SELECT *, correlated subquery per row
SELECT * FROM orders o
WHERE YEAR(o.order_date) = 2024
  AND (SELECT name FROM customers c WHERE c.id = o.customer_id) LIKE 'A%';

-- ✅ After: sargable range, explicit columns, join
SELECT o.order_id, o.order_date, o.amount, c.name
FROM orders o
JOIN customers c ON c.id = o.customer_id
WHERE o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'
  AND c.name LIKE 'A%';
-- with: INDEX(orders.order_date), INDEX(customers.name)
```

## 24. Security, Users, and Permissions

### Creating users and granting rights

```sql
-- MySQL
CREATE USER 'app_user'@'localhost' IDENTIFIED BY 'StrongPassw0rd!';
GRANT SELECT, INSERT, UPDATE ON shop.* TO 'app_user'@'localhost';
REVOKE INSERT ON shop.* FROM 'app_user'@'localhost';
FLUSH PRIVILEGES;
SHOW GRANTS FOR 'app_user'@'localhost';

-- SQL Server
CREATE LOGIN app_login WITH PASSWORD = 'StrongPassw0rd!';
USE shop;
CREATE USER app_user FOR LOGIN app_login;
GRANT SELECT, INSERT ON SCHEMA::dbo TO app_user;
ALTER ROLE db_datareader ADD MEMBER app_user;
DENY DELETE ON dbo.orders TO app_user;    -- DENY always wins over GRANT

-- PostgreSQL
CREATE ROLE app_user LOGIN PASSWORD 'StrongPassw0rd!';
GRANT SELECT, INSERT ON ALL TABLES IN SCHEMA public TO app_user;
```

### Principle of least privilege
Give each application its own account with only the rights it needs. A read-only reporting service should never hold `DELETE`. Never let an app connect as `root`/`sa`.

### SQL injection — the #1 database vulnerability

```python
# ❌ NEVER: string concatenation
cursor.execute("SELECT * FROM users WHERE email = '" + user_input + "'")
# input: ' OR '1'='1  → returns every user
# input: '; DROP TABLE users;--  → catastrophe

# ✅ ALWAYS: parameterized queries / prepared statements
cursor.execute("SELECT * FROM users WHERE email = %s", (user_input,))
```

```java
// Java
PreparedStatement ps = conn.prepareStatement("SELECT * FROM users WHERE email = ?");
ps.setString(1, userInput);
```

**What the attack actually looks like, step by step**

Vulnerable code builds this string:
```sql
SELECT * FROM users WHERE email = '<INPUT>' AND active = 1
```

| Attacker enters | Resulting SQL | Effect |
|---|---|---|
| `x' OR '1'='1` | `... email = 'x' OR '1'='1' AND active = 1` | Returns rows it shouldn't — auth bypass |
| `x'--` | `... email = 'x'--' AND active = 1` | Comments out the rest; disables the active check |
| `x' UNION SELECT card_no,1,1 FROM payments--` | Appends a second result set | **Data exfiltration** |
| `x'; DROP TABLE users;--` | Two statements | Destruction (if the driver allows stacked queries) |
| `x' AND (SELECT SLEEP(5))--` | Timing side channel | **Blind injection** — extracts data one bit at a time even with no visible output |

**Why parameterization actually fixes it:** a prepared statement sends the query *structure* to the server first, then the values separately. The value is never parsed as SQL — it is data by construction, so `'; DROP TABLE users;--` is stored or compared as that literal 26-character string. Escaping functions try to sanitize the string and lose to encoding tricks; parameterization removes the parsing step entirely.

**The one case parameters can't cover:** identifiers. You cannot parameterize a table or column name.
```python
# ❌ Injectable
query = f"SELECT * FROM orders ORDER BY {sort_column}"

# ✅ Whitelist
ALLOWED = {"order_date", "amount", "status"}
if sort_column not in ALLOWED:
    raise ValueError("invalid sort column")
query = f"SELECT * FROM orders ORDER BY {sort_column}"
```

**Defense in depth:**
1. Parameterized queries everywhere (the actual fix — everything else is backup).
2. Validate and whitelist input, especially anything that becomes an identifier (table/column names can't be parameterized — use a whitelist).
3. Least-privilege accounts.
4. Stored procedures *only if* they don't build dynamic SQL by concatenation internally.
5. Never expose raw database errors to users.

### Other essentials
- **Encrypt at rest** (TDE — Transparent Data Encryption in SQL Server/MySQL Enterprise) and **in transit** (TLS on the connection).
- **Hash passwords** with bcrypt/Argon2 in the application — never store plaintext, never use MD5/SHA1 alone.
- **Audit** sensitive access; keep an append-only log.
- **Mask/redact PII** in non-production environments.
- **Row-Level Security**: SQL Server 2016+ and PostgreSQL support policies restricting which rows a user sees.

## 25. Backup & Recovery

### Backup types

| Type | Contains | Restore speed | Storage |
|---|---|---|---|
| **Full** | Everything | Simple | Large |
| **Differential** | Changes since last full | Full + latest diff | Medium |
| **Incremental / Log** | Changes since last backup of any type | Full + chain | Small |
| **Logical (dump)** | SQL statements | Slow, portable | Medium |
| **Physical (files)** | Raw data files | Fast, same-version only | Large |

```bash
# MySQL logical backup
mysqldump -u root -p --single-transaction --routines --triggers --events shop > shop.sql
mysql -u root -p shop < shop.sql                       # restore

# MySQL all databases
mysqldump -u root -p --all-databases > all.sql

# PostgreSQL
pg_dump -U postgres -Fc shop > shop.dump
pg_restore -U postgres -d shop shop.dump
```

```sql
-- SQL Server
BACKUP DATABASE shop TO DISK = 'D:\backups\shop_full.bak' WITH INIT, COMPRESSION;
BACKUP DATABASE shop TO DISK = 'D:\backups\shop_diff.bak' WITH DIFFERENTIAL;
BACKUP LOG shop TO DISK = 'D:\backups\shop_log.trn';

RESTORE DATABASE shop FROM DISK = 'D:\backups\shop_full.bak' WITH NORECOVERY;
RESTORE LOG shop FROM DISK = 'D:\backups\shop_log.trn'
    WITH STOPAT = '2024-06-01 14:30:00', RECOVERY;    -- point-in-time recovery
```

### Key concepts
- **RPO** (Recovery Point Objective) — how much data you can afford to lose. Drives backup frequency.
- **RTO** (Recovery Time Objective) — how long you can be down. Drives backup strategy and replication.
- **Point-in-time recovery** requires log backups (SQL Server FULL recovery model) or binary logs (MySQL `log_bin`).
- **3-2-1 rule:** 3 copies, on 2 different media, 1 offsite.

> 🚨 **An untested backup is not a backup.** Schedule regular restore drills into a scratch environment. The number of organizations that discover their backups were empty *during* an outage is not small.

## 26. Engine Comparison

### At a glance

| | **MySQL** | **SQL Server** | **PostgreSQL** | **Oracle** | **SQLite** |
|---|---|---|---|---|---|
| Vendor | Oracle (open source) | Microsoft | Community (open source) | Oracle | Public domain |
| License | GPL / commercial | Commercial (free Express/Developer) | PostgreSQL (permissive) | Commercial | Public domain |
| Dialect | MySQL SQL | **T-SQL** | PL/pgSQL | **PL/SQL** | SQL |
| Default port | 3306 | 1433 | 5432 | 1521 | (file) |
| Platforms | All | Windows, Linux, containers | All | All | Embedded everywhere |
| Auto-increment | `AUTO_INCREMENT` | `IDENTITY(1,1)` | `SERIAL`/identity | Sequence | `AUTOINCREMENT` |
| String concat | `CONCAT()` | `+` or `CONCAT()` | `\|\|` | `\|\|` | `\|\|` |
| Limit rows | `LIMIT n` | `TOP n` / `FETCH NEXT` | `LIMIT n` | `FETCH FIRST` | `LIMIT n` |
| Identifier quotes | `` `backticks` `` | `[brackets]` | `"double quotes"` | `"double quotes"` | any |
| Default isolation | REPEATABLE READ | READ COMMITTED | READ COMMITTED | READ COMMITTED | SERIALIZABLE |
| MVCC | Yes (InnoDB) | Optional (RCSI) | Yes | Yes | — |
| Best known for | Web apps, LAMP stack | Enterprise + MS ecosystem | Standards, extensibility | Large enterprise | Embedded/mobile |

### MySQL

**Strengths:** enormous community, easy setup, extremely fast reads, everywhere in web hosting, powers WordPress/Drupal/countless SaaS backends. **MariaDB** is a drop-in fork with extra features.

**Storage engines** (a MySQL-specific concept — pluggable per table):

| Engine | Transactions | Locking | Use |
|---|---|---|---|
| **InnoDB** (default) | ✅ ACID, FKs | Row-level | **Almost always the right choice** |
| MyISAM | ❌ | Table-level | Legacy, read-only archives |
| MEMORY | ❌ | Table-level | Temp/cache, lost on restart |
| ARCHIVE | ❌ | Row | Compressed cold storage |

**MySQL-specific syntax:**
```sql
SHOW DATABASES;  SHOW TABLES;  DESCRIBE table_name;  SHOW CREATE TABLE t;
SELECT * FROM t LIMIT 10 OFFSET 20;
INSERT ... ON DUPLICATE KEY UPDATE ...;
SELECT IFNULL(col, 'default'), IF(x>0,'pos','neg');
SET @var = 5;  SELECT @var;
```

**Version notes:** MySQL **8.0** added window functions, CTEs, recursive CTEs, `CHECK` constraint enforcement, better JSON, and descending indexes. If you're on 5.7 you're missing most of the modern SQL in this guide — upgrading is usually the single biggest capability win.

**Gotchas:** no `FULL OUTER JOIN`; `utf8` ≠ real UTF-8 (use `utf8mb4`); `GROUP BY` historically allowed non-aggregated columns (fixed by `ONLY_FULL_GROUP_BY` mode, on by default since 5.7.5); DDL auto-commits.

### Microsoft SQL Server

**Strengths:** superb tooling (SSMS, Azure Data Studio), Query Store, columnstore indexes, In-Memory OLTP, SSIS/SSRS/SSAS for ETL/reporting/analysis, deep .NET and Azure integration, excellent optimizer.

**Editions:** Express (free, 10 GB limit), Developer (free, full features, non-production), Standard, Enterprise.

**T-SQL specifics:**
```sql
DECLARE @count INT = 0;
SET @count = (SELECT COUNT(*) FROM orders);
PRINT @count;

SELECT TOP 10 WITH TIES * FROM products ORDER BY price DESC;

-- Temp tables and table variables
CREATE TABLE #temp (id INT);          -- local temp
CREATE TABLE ##global (id INT);       -- global temp
DECLARE @tv TABLE (id INT);           -- table variable

-- Useful system views
SELECT * FROM sys.tables;
SELECT * FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = 'orders';
EXEC sp_help 'orders';
EXEC sp_helpindex 'orders';

-- OUTPUT clause: capture affected rows
DELETE FROM orders OUTPUT deleted.* INTO orders_archive WHERE order_date < '2020-01-01';

-- APPLY: correlated join to a table expression (very powerful)
SELECT c.name, t.order_id, t.amount
FROM customers c
CROSS APPLY (SELECT TOP 3 order_id, amount FROM orders o
             WHERE o.customer_id = c.customer_id ORDER BY amount DESC) t;
-- OUTER APPLY = the LEFT JOIN version

-- PIVOT
SELECT * FROM (SELECT region, quarter, amount FROM sales) src
PIVOT (SUM(amount) FOR quarter IN ([Q1],[Q2],[Q3],[Q4])) AS p;
```

**Gotchas:** `GO` is a batch separator understood by client tools, not a T-SQL statement; four-part naming `server.database.schema.object`; `NVARCHAR` literals need the `N''` prefix; SQL Server does **not** auto-index foreign keys.

### PostgreSQL

**Strengths:** the most standards-compliant, richest type system (arrays, `JSONB`, ranges, custom types), extensions (PostGIS for geospatial, pgvector for AI embeddings, TimescaleDB for time-series), partial and expression indexes, powerful `RETURNING` clause, excellent for complex analytical SQL.

```sql
SELECT data->>'name' FROM events WHERE data @> '{"type":"signup"}';   -- JSONB
INSERT INTO t (a) VALUES (1) RETURNING id;
SELECT * FROM generate_series(1,10);
CREATE INDEX ON orders ((lower(email)));                              -- expression index
```

### Oracle & SQLite in one line each
- **Oracle:** the enterprise heavyweight — RAC clustering, partitioning, PL/SQL, unmatched at extreme scale, and priced accordingly. Note: Oracle treats `''` as NULL.
- **SQLite:** a single file, zero configuration, embedded in every phone and browser. Perfect for local apps, tests, and prototypes; not for high-concurrency writes.

### Which should you learn/choose?

| Situation | Pick |
|---|---|
| Learning SQL fundamentals | **MySQL** or **PostgreSQL** — free, quick to install |
| Web app / startup / LAMP stack | MySQL or PostgreSQL |
| Complex queries, JSON, GIS, AI/vector | **PostgreSQL** |
| .NET shop, Windows/Azure enterprise | **SQL Server** |
| Corporate BI/reporting job market | **SQL Server** (SSRS/Power BI ecosystem) |
| Mobile/embedded/desktop app | **SQLite** |
| Massive legacy enterprise ERP | **Oracle** |

**The good news:** ~80% of SQL is identical across all of them. Learn the ANSI core well and switching engines becomes a weekend of adjusting to dialect quirks — which the next section covers.

## 27. Syntax Translation Cheat Sheet

| Task | MySQL | SQL Server | PostgreSQL |
|---|---|---|---|
| Limit rows | `LIMIT 10` | `TOP 10` | `LIMIT 10` |
| Offset | `LIMIT 10 OFFSET 20` | `OFFSET 20 ROWS FETCH NEXT 10 ROWS ONLY` | `LIMIT 10 OFFSET 20` |
| Auto ID | `AUTO_INCREMENT` | `IDENTITY(1,1)` | `SERIAL` / `GENERATED ALWAYS AS IDENTITY` |
| Last inserted ID | `LAST_INSERT_ID()` | `SCOPE_IDENTITY()` | `RETURNING id` / `CURRVAL()` |
| Concat | `CONCAT(a,b)` | `a + b` | `a \|\| b` |
| Null default | `IFNULL(a,b)` | `ISNULL(a,b)` | `COALESCE(a,b)` |
| Current datetime | `NOW()` | `GETDATE()` | `NOW()` |
| Date add | `DATE_ADD(d,INTERVAL 1 DAY)` | `DATEADD(day,1,d)` | `d + INTERVAL '1 day'` |
| Date diff (days) | `DATEDIFF(d2,d1)` | `DATEDIFF(day,d1,d2)` | `d2 - d1` |
| Format date | `DATE_FORMAT(d,'%Y-%m')` | `FORMAT(d,'yyyy-MM')` | `TO_CHAR(d,'YYYY-MM')` |
| Substring | `SUBSTRING(s,1,3)` | `SUBSTRING(s,1,3)` | `SUBSTRING(s,1,3)` |
| String length | `CHAR_LENGTH(s)` | `LEN(s)` | `LENGTH(s)` |
| Find in string | `LOCATE('x',s)` | `CHARINDEX('x',s)` | `POSITION('x' IN s)` |
| Cast to int | `CAST(x AS SIGNED)` | `CAST(x AS INT)` | `x::INT` |
| Group concat | `GROUP_CONCAT(c)` | `STRING_AGG(c,',')` | `STRING_AGG(c,',')` |
| Upsert | `ON DUPLICATE KEY UPDATE` | `MERGE` | `ON CONFLICT DO UPDATE` |
| Identifier quote | `` `col` `` | `[col]` | `"col"` |
| String quote | `'text'` (or `"text"`) | `'text'` only | `'text'` only |
| Variable | `SET @x = 1;` | `DECLARE @x INT = 1;` | `\set` / PL/pgSQL `DECLARE` |
| List tables | `SHOW TABLES;` | `SELECT * FROM sys.tables;` | `\dt` |
| Describe table | `DESCRIBE t;` | `EXEC sp_help 't';` | `\d t` |
| Random rows | `ORDER BY RAND()` | `ORDER BY NEWID()` | `ORDER BY RANDOM()` |
| Full outer join | *not supported* | `FULL OUTER JOIN` | `FULL OUTER JOIN` |
| Comment | `-- `, `#`, `/* */` | `--`, `/* */` | `--`, `/* */` |

## 28. NoSQL in Brief

### CAP theorem
In a distributed system you can guarantee at most two of:
- **C**onsistency — every read sees the latest write
- **A**vailability — every request gets a response
- **P**artition tolerance — the system survives network splits

Since network partitions are unavoidable in distributed systems, the real choice is **CP** (MongoDB, HBase — refuse writes rather than diverge) vs **AP** (Cassandra, DynamoDB — stay available, reconcile later).

### BASE (the NoSQL counterpart to ACID)
**B**asically **A**vailable, **S**oft state, **E**ventually consistent — trade immediate consistency for scale and availability.

### SQL vs NoSQL comparison

| | SQL | NoSQL |
|---|---|---|
| Schema | Fixed, enforced | Flexible / schemaless |
| Scaling | Vertical (bigger box), harder horizontal | Horizontal (add nodes) |
| Consistency | Strong (ACID) | Often eventual |
| Joins | Native, powerful | Limited or manual |
| Query language | SQL (standardized) | Vendor-specific APIs |
| Best for | Transactions, relationships, reporting | Huge scale, flexible/unstructured data |

```javascript
// MongoDB vs SQL, side by side
db.users.find({ age: { $gt: 25 } })          // SELECT * FROM users WHERE age > 25
db.users.insertOne({ name: "Ada", age: 36 }) // INSERT INTO users(name,age) VALUES('Ada',36)
db.users.updateOne({_id: 1}, {$set:{age:37}})// UPDATE users SET age=37 WHERE id=1
db.users.aggregate([                          // SELECT city, COUNT(*) FROM users
  { $group: { _id: "$city", n: { $sum: 1 } }} //   GROUP BY city
])
```

**Reality check:** most applications should start relational. Modern PostgreSQL and MySQL handle JSON, scale to enormous volumes, and give you transactions for free. Choose NoSQL when you have a specific, measured reason — not by default.

### Schema — build this and query against it

```sql
CREATE TABLE categories (
    category_id INT PRIMARY KEY AUTO_INCREMENT,
    name        VARCHAR(50) NOT NULL UNIQUE
);

CREATE TABLE customers (
    customer_id INT PRIMARY KEY AUTO_INCREMENT,

## 30. SQL Cookbook — Recipes You'll Reuse Forever

These are the patterns that come up again and again in real work and in interviews. Learn the shape of each; the specifics change, the shape doesn't.

### 1. Nth-highest value
```sql
-- Simple: 2nd highest salary
SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);

-- General Nth, handling ties correctly
SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 2;   -- 3rd

-- Window version (also gives you the person, not just the number)
WITH r AS (SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS rk FROM employees)
SELECT name, salary FROM r WHERE rk = 3;
```

### 2. Nth-highest *per group*
```sql
WITH r AS (
    SELECT name, department, salary,
           DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rk
    FROM employees
)
SELECT * FROM r WHERE rk <= 3;
```

### 3. Find duplicates
```sql
SELECT email, COUNT(*) AS n
FROM customers GROUP BY email HAVING COUNT(*) > 1;

-- With the offending rows attached
WITH d AS (SELECT *, COUNT(*) OVER (PARTITION BY email) AS n FROM customers)
SELECT * FROM d WHERE n > 1 ORDER BY email;
```

### 4. Delete duplicates, keeping one
```sql
-- Portable: keep the lowest id
DELETE FROM customers
WHERE customer_id NOT IN (SELECT * FROM (
    SELECT MIN(customer_id) FROM customers GROUP BY email
) AS keep);        -- the extra wrapper works around MySQL's "can't modify the table you read" rule

-- SQL Server / PostgreSQL: cleaner with a CTE
WITH d AS (
    SELECT customer_id, ROW_NUMBER() OVER (PARTITION BY email ORDER BY customer_id) AS rn
    FROM customers
)
DELETE FROM d WHERE rn > 1;    -- PostgreSQL: DELETE FROM customers USING d WHERE ...
```

### 5. Rows with the max value per group ("greatest-n-per-group")
```sql
-- Each customer's most recent order, with full row detail
WITH r AS (
    SELECT o.*, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC, order_id DESC) AS rn
    FROM orders o
)
SELECT * FROM r WHERE rn = 1;

-- Alternative without window functions
SELECT o.* FROM orders o
JOIN (SELECT customer_id, MAX(order_date) AS d FROM orders GROUP BY customer_id) m
  ON o.customer_id = m.customer_id AND o.order_date = m.d;
```

### 6. Running total and running count
```sql
SELECT order_date, amount,
       SUM(amount)  OVER (ORDER BY order_date, order_id) AS running_total,
       COUNT(*)     OVER (ORDER BY order_date, order_id) AS running_count
FROM orders;
```
> Always add a tiebreaker to `ORDER BY` — without it, rows sharing a date produce non-deterministic running totals.

### 7. Period-over-period change
```sql
WITH m AS (
    SELECT DATE_FORMAT(order_date,'%Y-%m') AS mo, SUM(amount) AS rev
    FROM orders GROUP BY 1
)
SELECT mo, rev,
       LAG(rev) OVER (ORDER BY mo) AS prev_rev,
       ROUND(100.0*(rev - LAG(rev) OVER (ORDER BY mo))/NULLIF(LAG(rev) OVER (ORDER BY mo),0), 1) AS pct_change
FROM m ORDER BY mo;
```

### 8. Year-over-year comparison
```sql
WITH m AS (SELECT YEAR(order_date) y, MONTH(order_date) mth, SUM(amount) rev
           FROM orders GROUP BY 1,2)
SELECT mth, rev,
       LAG(rev, 12) OVER (ORDER BY y, mth) AS same_month_last_year,
       rev - LAG(rev, 12) OVER (ORDER BY y, mth) AS yoy_change
FROM m;
```

### 9. Moving average
```sql
SELECT d, orders,
       AVG(orders) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS ma7,
       AVG(orders) OVER (ORDER BY d ROWS BETWEEN 29 PRECEDING AND CURRENT ROW) AS ma30
FROM daily_orders;
```

### 10. Percent of total
```sql
SELECT category,
       SUM(amount) AS rev,
       ROUND(100.0 * SUM(amount) / SUM(SUM(amount)) OVER (), 2) AS pct_of_total
FROM sales GROUP BY category;
```
> The double aggregate `SUM(SUM(x)) OVER ()` looks strange but is correct: the inner `SUM` aggregates per group, the window then sums those group totals.

### 11. Fill date gaps (dense time series)
```sql
WITH RECURSIVE cal AS (
    SELECT DATE('2024-01-01') AS d
    UNION ALL SELECT d + INTERVAL 1 DAY FROM cal WHERE d < '2024-12-31'
)
SELECT cal.d, COALESCE(SUM(o.amount), 0) AS revenue
FROM cal
LEFT JOIN orders o ON o.order_date = cal.d
GROUP BY cal.d ORDER BY cal.d;
```
A permanent `calendar` table is worth building once — it makes fiscal periods, holidays, and week numbers trivial.

### 12. Pivot rows to columns
```sql
-- Portable: conditional aggregation
SELECT category,
       SUM(CASE WHEN QUARTER(order_date)=1 THEN amount ELSE 0 END) AS q1,
       SUM(CASE WHEN QUARTER(order_date)=2 THEN amount ELSE 0 END) AS q2,
       SUM(CASE WHEN QUARTER(order_date)=3 THEN amount ELSE 0 END) AS q3,
       SUM(CASE WHEN QUARTER(order_date)=4 THEN amount ELSE 0 END) AS q4
FROM sales GROUP BY category;
```

### 13. Unpivot columns to rows
```sql
SELECT id, 'q1' AS quarter, q1 AS amount FROM wide
UNION ALL SELECT id, 'q2', q2 FROM wide
UNION ALL SELECT id, 'q3', q3 FROM wide
UNION ALL SELECT id, 'q4', q4 FROM wide;
```

### 14. Gaps and islands (consecutive streaks)
```sql
-- Find consecutive-day login streaks per user
WITH grp AS (
    SELECT user_id, login_date,
           login_date - INTERVAL ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY login_date) DAY AS island
    FROM logins
)
SELECT user_id, MIN(login_date) AS streak_start, MAX(login_date) AS streak_end, COUNT(*) AS streak_len
FROM grp
GROUP BY user_id, island
HAVING COUNT(*) >= 3
ORDER BY streak_len DESC;
```
**The trick:** for consecutive dates, `date − row_number` is constant within a run and changes at every gap. That constant becomes the group key. This one pattern solves a whole family of problems — sessionization, uptime windows, consecutive wins.

### 15. Find missing sequence numbers
```sql
SELECT id + 1 AS gap_start, next_id - 1 AS gap_end
FROM (SELECT id, LEAD(id) OVER (ORDER BY id) AS next_id FROM invoices) t
WHERE next_id - id > 1;
```

### 16. Median (no built-in in MySQL/SQL Server)
```sql
-- Percentile approach (PostgreSQL, Oracle, SQL Server)
SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY salary) OVER () AS median FROM employees;

-- Portable window approach
WITH r AS (
    SELECT salary,
           ROW_NUMBER() OVER (ORDER BY salary) AS rn,
           COUNT(*) OVER () AS n
    FROM employees
)
SELECT AVG(salary) AS median FROM r WHERE rn IN (FLOOR((n+1)/2), CEIL((n+1)/2));
```

### 17. Mode (most frequent value)
```sql
SELECT city FROM customers
GROUP BY city ORDER BY COUNT(*) DESC LIMIT 1;
```

### 18. Cumulative distribution / percentiles / buckets
```sql
SELECT name, salary,
       NTILE(4)       OVER (ORDER BY salary) AS quartile,
       PERCENT_RANK() OVER (ORDER BY salary) AS pct_rank,
       CUME_DIST()    OVER (ORDER BY salary) AS cume_dist
FROM employees;
```

### 19. Cohort retention
```sql
WITH first_order AS (
    SELECT customer_id, MIN(order_date) AS cohort_date FROM orders GROUP BY customer_id
),
activity AS (
    SELECT f.customer_id,
           DATE_FORMAT(f.cohort_date,'%Y-%m') AS cohort,
           TIMESTAMPDIFF(MONTH, f.cohort_date, o.order_date) AS month_offset
    FROM first_order f JOIN orders o ON o.customer_id = f.customer_id
)
SELECT cohort,
       COUNT(DISTINCT CASE WHEN month_offset=0 THEN customer_id END) AS m0,
       COUNT(DISTINCT CASE WHEN month_offset=1 THEN customer_id END) AS m1,
       COUNT(DISTINCT CASE WHEN month_offset=2 THEN customer_id END) AS m2,
       COUNT(DISTINCT CASE WHEN month_offset=3 THEN customer_id END) AS m3
FROM activity GROUP BY cohort ORDER BY cohort;
```

### 20. Funnel conversion
```sql
SELECT
    COUNT(DISTINCT CASE WHEN step='view'     THEN session_id END) AS viewed,
    COUNT(DISTINCT CASE WHEN step='cart'     THEN session_id END) AS carted,
    COUNT(DISTINCT CASE WHEN step='checkout' THEN session_id END) AS checked_out,
    COUNT(DISTINCT CASE WHEN step='purchase' THEN session_id END) AS purchased
FROM events;
```

### 21. RFM segmentation (Recency, Frequency, Monetary)
```sql
WITH rfm AS (
    SELECT customer_id,
           DATEDIFF(CURDATE(), MAX(order_date)) AS recency,
           COUNT(*)                             AS frequency,
           SUM(amount)                          AS monetary
    FROM orders GROUP BY customer_id
)
SELECT customer_id, recency, frequency, monetary,
       NTILE(5) OVER (ORDER BY recency DESC)  AS r_score,
       NTILE(5) OVER (ORDER BY frequency)     AS f_score,
       NTILE(5) OVER (ORDER BY monetary)      AS m_score
FROM rfm;
```

### 22. Rank with ties broken deterministically
```sql
ROW_NUMBER() OVER (ORDER BY score DESC, created_at ASC, id ASC)
```

### 23. Conditional update from another table
```sql
-- MySQL
UPDATE products p JOIN price_updates u ON p.product_id = u.product_id
SET p.price = u.new_price WHERE u.effective_date <= CURDATE();

-- SQL Server
UPDATE p SET p.price = u.new_price
FROM products p JOIN price_updates u ON p.product_id = u.product_id;

-- PostgreSQL
UPDATE products p SET price = u.new_price
FROM price_updates u WHERE p.product_id = u.product_id;
```

### 24. Safe batched delete (avoid locking a huge table)
```sql
-- Repeat until zero rows affected
DELETE FROM audit_log WHERE created_at < '2023-01-01' LIMIT 10000;          -- MySQL
DELETE TOP (10000) FROM audit_log WHERE created_at < '2023-01-01';          -- SQL Server
```

### 25. Random sample
```sql
SELECT * FROM customers ORDER BY RAND() LIMIT 100;              -- MySQL — full sort, slow on big tables
SELECT * FROM customers TABLESAMPLE SYSTEM (1);                 -- SQL Server / PostgreSQL — fast, approximate
SELECT * FROM customers WHERE RAND() < 0.01;                    -- cheap approximate sample
```

## 31. Working with JSON & Semi-Structured Data

Modern relational engines handle JSON well. This is usually the right answer when *some* of your data is genuinely schemaless — better than either EAV tables or a separate document database.

### When JSON columns are appropriate

✅ Good fits: user preferences, feature flags, API response payloads, product attributes that differ per category, event metadata, audit snapshots.
❌ Bad fits: anything you filter, join, or aggregate on constantly; anything with referential integrity; anything with a stable known shape. Those are columns.

> **Rule of thumb:** if you find yourself writing an index on a JSON path *and* joining on it *and* constraining it, you have discovered a column. Promote it.

### Storing and querying

```sql
CREATE TABLE events (
    event_id   INT PRIMARY KEY AUTO_INCREMENT,
    event_type VARCHAR(50) NOT NULL,
    payload    JSON NOT NULL,             -- PostgreSQL: use JSONB
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

INSERT INTO events (event_type, payload) VALUES
('signup', '{"user_id": 42, "plan": "pro", "source": {"campaign": "spring", "medium": "email"}, "tags": ["beta","eu"]}');
```

**Reading values**

| Task | MySQL | SQL Server | PostgreSQL |
|---|---|---|---|
| Extract value | `payload->>'$.plan'` | `JSON_VALUE(payload,'$.plan')` | `payload->>'plan'` |
| Extract object/array | `payload->'$.source'` | `JSON_QUERY(payload,'$.source')` | `payload->'source'` |
| Nested path | `payload->>'$.source.campaign'` | `JSON_VALUE(payload,'$.source.campaign')` | `payload#>>'{source,campaign}'` |
| Array element | `payload->>'$.tags[0]'` | `JSON_VALUE(payload,'$.tags[0]')` | `payload->'tags'->>0` |
| Containment test | `JSON_CONTAINS(payload,'"beta"','$.tags')` | — | `payload @> '{"plan":"pro"}'` |
| Key exists | `JSON_CONTAINS_PATH(payload,'one','$.plan')` | — | `payload ? 'plan'` |
| Expand array to rows | `JSON_TABLE(...)` | `OPENJSON(...)` | `jsonb_array_elements(...)` |
| Modify | `JSON_SET`, `JSON_REMOVE` | `JSON_MODIFY` | `jsonb_set`, `-` operator |
| Validate | `JSON_VALID(x)` | `ISJSON(x)` | type enforces it |

```sql
-- Practical query: pro-plan signups by campaign
SELECT payload->>'$.source.campaign' AS campaign, COUNT(*) AS signups
FROM events
WHERE event_type = 'signup' AND payload->>'$.plan' = 'pro'
GROUP BY 1 ORDER BY signups DESC;
```

### Expanding arrays into rows

```sql
-- MySQL 8
SELECT e.event_id, t.tag
FROM events e,
     JSON_TABLE(e.payload, '$.tags[*]' COLUMNS (tag VARCHAR(50) PATH '$')) AS t;

-- SQL Server
SELECT e.event_id, t.value AS tag
FROM events e CROSS APPLY OPENJSON(e.payload, '$.tags') t;

-- PostgreSQL
SELECT e.event_id, tag
FROM events e, jsonb_array_elements_text(e.payload->'tags') AS tag;
```

### Indexing JSON

```sql
-- MySQL: generated column + index (the standard approach)
ALTER TABLE events
  ADD COLUMN plan VARCHAR(20) AS (payload->>'$.plan') STORED,
  ADD INDEX idx_plan (plan);

-- SQL Server: computed column + index
ALTER TABLE events ADD plan AS JSON_VALUE(payload,'$.plan');
CREATE INDEX idx_plan ON events(plan);

-- PostgreSQL: GIN index covers all keys at once (JSONB only)
CREATE INDEX idx_payload ON events USING GIN (payload);
-- or a targeted B-tree on one path
CREATE INDEX idx_plan ON events ((payload->>'plan'));
```

> ⚠️ **Without an index, every JSON query is a full table scan plus a parse per row.** PostgreSQL's `JSONB` (binary, pre-parsed, indexable) is meaningfully better than `JSON` (text, reparsed each access) — almost always choose `JSONB`.

### Building JSON output

```sql
-- Return an order as a nested document
SELECT JSON_OBJECT(
    'order_id', o.order_id,
    'customer', JSON_OBJECT('id', c.customer_id, 'name', c.name),
    'items', (SELECT JSON_ARRAYAGG(JSON_OBJECT('product', p.name, 'qty', i.quantity))
              FROM order_items i JOIN products p ON p.product_id = i.product_id
              WHERE i.order_id = o.order_id)
) AS doc
FROM orders o JOIN customers c ON c.customer_id = o.customer_id;
```
SQL Server uses `FOR JSON PATH`; PostgreSQL uses `json_build_object` / `json_agg`. This is a clean way to serve an API response in one round trip.

## 32. Data Modeling Patterns

Recurring schema designs worth knowing before you invent your own.

### Soft deletes
```sql
ALTER TABLE customers ADD deleted_at TIMESTAMP NULL;
UPDATE customers SET deleted_at = NOW() WHERE customer_id = 5;   -- "delete"
CREATE VIEW v_customers AS SELECT * FROM customers WHERE deleted_at IS NULL;
```
**Pros:** recoverable, preserves referential integrity and history.
**Cons:** every query must filter (use a view or ORM default scope, or you *will* forget); unique constraints break (two "deleted" rows with the same email now conflict); indexes carry dead weight.
**Mitigation:** a partial/filtered unique index — `CREATE UNIQUE INDEX ... ON customers(email) WHERE deleted_at IS NULL` (PostgreSQL/SQL Server).

### Audit columns and audit tables
```sql
-- Minimum viable auditing on every table
created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
created_by INT,
updated_by INT

-- Full history table
CREATE TABLE customers_history (
    history_id  BIGINT PRIMARY KEY AUTO_INCREMENT,
    customer_id INT NOT NULL,
    name        VARCHAR(100),
    email       VARCHAR(255),
    changed_at  TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    changed_by  INT,
    operation   CHAR(1)      -- I / U / D
);
```
SQL Server 2016+ and MariaDB offer **system-versioned temporal tables** that maintain history automatically:
```sql
CREATE TABLE customers (... ) WITH (SYSTEM_VERSIONING = ON);
SELECT * FROM customers FOR SYSTEM_TIME AS OF '2024-06-01';
```

### Slowly Changing Dimensions (SCD)

| Type | Behavior | Use |
|---|---|---|
| **Type 0** | Never changes | Immutable attributes (birth date) |
| **Type 1** | Overwrite; no history | Corrections of errors |
| **Type 2** | New row per change, with validity dates | **The standard for warehouses** — preserves point-in-time truth |
| **Type 3** | Keep a "previous value" column | Only the last change matters |

```sql
-- Type 2 dimension
CREATE TABLE dim_customer (
    surrogate_key INT PRIMARY KEY AUTO_INCREMENT,
    customer_id   INT NOT NULL,          -- the natural/business key
    name          VARCHAR(100),
    city          VARCHAR(50),
    valid_from    DATE NOT NULL,
    valid_to      DATE NOT NULL DEFAULT '9999-12-31',
    is_current    BOOLEAN NOT NULL DEFAULT TRUE
);
-- Point-in-time lookup
SELECT * FROM dim_customer
WHERE customer_id = 42 AND '2024-06-15' BETWEEN valid_from AND valid_to;
```

### Hierarchies — four approaches

| Model | Structure | Read | Write | Best for |
|---|---|---|---|---|
| **Adjacency list** | `parent_id` column | Recursive CTE | Trivial | Default choice; simple, correct |
| **Path enumeration** | `path = '/1/7/23/'` | `LIKE '/1/%'` — fast | Moves rewrite subtree | Read-heavy, shallow moves |
| **Nested sets** | `lft`, `rgt` integers | Very fast subtree reads | Expensive — renumbers | Read-only trees |
| **Closure table** | Row per ancestor-descendant pair | Fast any-direction | Extra rows per insert | Complex queries, frequent reads |

```sql
-- Closure table
CREATE TABLE category_paths (
    ancestor   INT, descendant INT, depth INT,
    PRIMARY KEY (ancestor, descendant)
);
-- All descendants of category 3, at any depth
SELECT c.* FROM categories c
JOIN category_paths p ON c.category_id = p.descendant
WHERE p.ancestor = 3 AND p.depth > 0;
```

### Multi-tenancy

| Strategy | Isolation | Cost | Notes |
|---|---|---|---|
| **Shared table + `tenant_id`** | Lowest | Cheapest | Every query and index must include `tenant_id`; use Row-Level Security to enforce |
| **Schema per tenant** | Medium | Medium | Clean separation; migrations must run N times |
| **Database per tenant** | Highest | Highest | Easy per-tenant backup/restore; hard at thousands of tenants |

```sql
-- Row-Level Security (PostgreSQL / SQL Server) makes the shared model safe
ALTER TABLE orders ENABLE ROW LEVEL SECURITY;
CREATE POLICY tenant_isolation ON orders
    USING (tenant_id = current_setting('app.tenant_id')::INT);
```

### Status and state machines
```sql
-- ❌ A free-text status column drifts: 'shipped', 'Shipped', 'SHIPPED', 'shiped'
-- ✅ Constrain it
status VARCHAR(20) NOT NULL CHECK (status IN ('pending','paid','shipped','delivered','cancelled'))
-- ✅ Or a lookup table with allowed transitions
CREATE TABLE status_transitions (from_status VARCHAR(20), to_status VARCHAR(20), PRIMARY KEY (from_status,to_status));
```

### Money, quantities, and units
```sql
amount_cents  BIGINT NOT NULL,           -- integer minor units: no rounding drift at all
currency_code CHAR(3) NOT NULL,          -- ISO 4217 — never assume one currency
-- or
amount DECIMAL(19,4) NOT NULL
```
Always store the currency alongside the amount, and store the exchange rate used at transaction time if you convert.

### Internationalization
```sql
CREATE TABLE product_translations (
    product_id  INT,
    locale      VARCHAR(10),       -- 'en-US', 'pt-BR'
    name        VARCHAR(200),
    description TEXT,
    PRIMARY KEY (product_id, locale)
);
```
Also: use `utf8mb4`/`NVARCHAR`, store names as a single field where possible (name structures differ wildly across cultures), and never assume address formats.

### Idempotency for writes
```sql
CREATE TABLE payments (
    payment_id      INT PRIMARY KEY AUTO_INCREMENT,
    idempotency_key VARCHAR(64) NOT NULL UNIQUE,   -- client-generated
    amount          DECIMAL(19,4) NOT NULL
);
```
A retried request with the same key hits the unique constraint instead of charging twice. This one column prevents an entire category of production incident.

### Optimistic concurrency
```sql
ALTER TABLE products ADD version INT NOT NULL DEFAULT 0;

UPDATE products SET price = 99.00, version = version + 1
WHERE product_id = 5 AND version = 3;
-- 0 rows affected → someone else changed it first; reload and retry
```
Cheaper than locking, and it surfaces conflicts rather than silently overwriting them ("lost update").

## 33. Scaling: Partitioning, Replication, Sharding, Caching

### The order to try things

Most teams reach for distributed systems years before they need them. The actual sequence:

1. **Fix the queries and indexes.** A single well-tuned PostgreSQL or MySQL instance handles tens of thousands of transactions per second and terabytes of data. Most "we need to shard" problems are a missing index.
2. **Add caching** for read-heavy hot paths.
3. **Scale up** — more RAM is remarkably effective, since the goal is keeping the working set in the buffer pool.
4. **Add read replicas** to offload reporting and read traffic.
5. **Partition** large tables.
6. **Shard** — only now, and knowing it changes your application permanently.

### Vertical vs horizontal scaling

| | Vertical (scale up) | Horizontal (scale out) |
|---|---|---|
| Method | Bigger machine | More machines |
| Complexity | None | High |
| Ceiling | Hardware limits | Effectively unbounded |
| Cost curve | Steep at the top | Linear-ish |
| App changes | None | Often significant |

### Partitioning

Splitting one logical table into physical pieces. The application still sees one table.

| Type | Split by | Typical use |
|---|---|---|
| **Range** | Value ranges | Dates — the most common by far |
| **List** | Explicit value sets | Region, tenant, country |
| **Hash** | Hash of a key | Even distribution when no natural range exists |
| **Composite** | Combination | Range then hash |

```sql
-- MySQL range partitioning by year
CREATE TABLE orders (
    order_id   INT NOT NULL,
    order_date DATE NOT NULL,
    amount     DECIMAL(10,2),
    PRIMARY KEY (order_id, order_date)      -- the partition key must be in every unique key
)
PARTITION BY RANGE (YEAR(order_date)) (
    PARTITION p2023 VALUES LESS THAN (2024),
    PARTITION p2024 VALUES LESS THAN (2025),
    PARTITION p2025 VALUES LESS THAN (2026),
    PARTITION pmax  VALUES LESS THAN MAXVALUE
);

-- PostgreSQL declarative partitioning
CREATE TABLE orders (order_id INT, order_date DATE, amount NUMERIC)
    PARTITION BY RANGE (order_date);
CREATE TABLE orders_2024 PARTITION OF orders
    FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');
```

**The real wins:**
- **Partition pruning** — a query filtered on the partition key reads only the relevant partitions.
- **Instant archival** — `ALTER TABLE orders DROP PARTITION p2023;` deletes a year of data in milliseconds instead of hours of `DELETE`.
- Smaller, faster per-partition indexes and maintenance.

**The catches:** queries that don't filter on the partition key touch *every* partition and get slower. Unique constraints must include the partition key. Cross-partition joins are more expensive.

### Replication

```
┌──────────┐   binlog / WAL / log shipping   ┌──────────┐
│ PRIMARY  │ ──────────────────────────────► │ REPLICA  │  reads
│ (writes) │ ──────────────────────────────► │ REPLICA  │  reads / reporting
└──────────┘                                 └──────────┘
```

| Mode | Guarantee | Trade-off |
|---|---|---|
| **Asynchronous** | Primary doesn't wait | Fast writes; replicas lag; possible data loss on failover |
| **Semi-synchronous** | At least one replica acknowledged | Balanced — the common production choice |
| **Synchronous** | All replicas acknowledged | No loss; write latency = slowest replica |

**Replication lag is the thing that bites you.** A user updates their profile (primary), the page reloads from a replica that hasn't caught up, and their change appears to have vanished. Mitigations: route reads to the primary for a short window after a write ("read your own writes"), or use a sticky session, or check the replica's lag before using it.

**High availability:** SQL Server Always On availability groups; PostgreSQL with Patroni or repmgr; MySQL Group Replication / InnoDB Cluster or Galera. Managed cloud services (RDS/Aurora, Azure SQL, Cloud SQL) handle failover for you and are the right default unless you have a specific reason otherwise.

### Sharding

Splitting data across independent databases, each holding a subset.

```
shard_id = hash(customer_id) % 4
```

| Strategy | Pros | Cons |
|---|---|---|
| **Hash of key** | Even distribution | Resharding is painful; range queries hit all shards |
| **Range of key** | Range queries efficient | Hot spots (newest shard takes all writes) |
| **Directory/lookup** | Flexible, easy rebalancing | The lookup service is a dependency and a single point of failure |
| **Geographic** | Latency and data residency | Uneven load |

**What sharding costs you:** cross-shard joins (do them in the application, or not at all), cross-shard transactions (you lose ACID across shards — you now need sagas or two-phase commit), global unique IDs (use UUIDs or Snowflake IDs, not auto-increment), rebalancing (use consistent hashing or many virtual shards from day one), and every operational task multiplied by shard count.

> **Choose the shard key once, carefully.** Changing it later means rewriting all of your data and much of your application. Pick the key that appears in the vast majority of your queries — usually `tenant_id` or `user_id`.

### Caching

```
Request → App → Cache (Redis) ─hit→ return
                    └─miss→ Database → store in cache → return
```

| Pattern | How | Notes |
|---|---|---|
| **Cache-aside** | App checks cache, falls back to DB, writes back | Most common; simple |
| **Write-through** | Write to cache and DB together | Consistent, slower writes |
| **Write-behind** | Write cache now, DB later | Fast; risk of loss |
| **Read-through** | Cache library fetches on miss | Cleaner app code |

**Invalidation strategies:** TTL (simplest, accepts staleness), event-based (invalidate on write — correct but easy to miss a path), and versioned keys (`user:42:v7` — change the version instead of deleting).

Also cache *inside* the database: the buffer pool/shared buffers, prepared statement caches, and materialized views are all caching. Sizing the buffer pool to hold your working set is often the single highest-return configuration change available.

## 34. Data Warehousing & ETL/ELT

### Why a warehouse exists

Running analytics on your production OLTP database competes for the same resources your customers need, and the normalized schema is wrong for the job. A warehouse gives analysts a denormalized, columnar, read-optimized copy.

### ETL vs ELT

```
ETL (classic):  Extract → Transform (in a separate engine) → Load
ELT (modern):   Extract → Load (raw) → Transform (inside the warehouse)
```

ELT won because cloud warehouses have cheap, elastic compute — it's easier to load raw data and transform it with SQL than to build and maintain a separate transformation tier. It also preserves the raw data, so you can re-derive everything when requirements change.

### Dimensional modeling — the star schema

```
              ┌────────────┐
              │ dim_date   │
              └─────┬──────┘
┌────────────┐      │      ┌──────────────┐
│dim_customer├──────┼──────┤ dim_product  │
└────────────┘      │      └──────────────┘
              ┌─────┴──────┐
              │ fact_sales │   ← measures + foreign keys, many millions of rows
              └─────┬──────┘
              ┌─────┴──────┐
              │ dim_store  │
              └────────────┘
```

**Facts** hold measurements (quantity, amount, cost) plus foreign keys to dimensions. They're long and narrow, and they grow forever.
**Dimensions** hold descriptive attributes (customer name, product category, date parts). They're wide and comparatively short, and they're deliberately denormalized.

```sql
CREATE TABLE fact_sales (
    sale_id      BIGINT PRIMARY KEY,
    date_key     INT     NOT NULL REFERENCES dim_date(date_key),
    customer_key INT     NOT NULL REFERENCES dim_customer(customer_key),
    product_key  INT     NOT NULL REFERENCES dim_product(product_key),
    quantity     INT     NOT NULL,        -- additive measure
    amount       DECIMAL(19,4) NOT NULL,  -- additive measure
    discount_pct DECIMAL(5,2)             -- non-additive: never SUM this
);
```

**Grain is the first decision.** "One row per line item on an order" is a grain. Write it down before you build anything; mixing grains in one fact table is the most expensive mistake in warehouse design.

**Star vs snowflake:** a snowflake schema normalizes the dimensions (product → category → department as separate tables). It saves a little space and costs joins and clarity. Star is the default; snowflake only when a dimension is genuinely huge or shared.

**Measure types:** additive (sum across all dimensions — revenue), semi-additive (sum across some — account balances sum across accounts but not across time), non-additive (never sum — ratios, percentages; recompute from the components instead).

### A date dimension is non-negotiable
```sql
CREATE TABLE dim_date (
    date_key     INT PRIMARY KEY,     -- 20240315
    full_date    DATE NOT NULL,
    year         SMALLINT, quarter TINYINT, month TINYINT,
    month_name   VARCHAR(10), day_of_month TINYINT, day_of_week TINYINT,
    day_name     VARCHAR(10), week_of_year TINYINT,
    is_weekend   BOOLEAN, is_holiday BOOLEAN,
    fiscal_year  SMALLINT, fiscal_quarter TINYINT
);
```
Generate it once for 20 years. It makes fiscal calendars, holiday exclusions, and week-over-week comparisons trivial instead of painful.

### Columnar storage — why analytics engines are different

Row storage keeps `[id,name,city,amount][id,name,city,amount]…`; column storage keeps `[all ids][all names][all cities][all amounts]`. For `SELECT SUM(amount) FROM sales`, the columnar engine reads only the amount column — a fraction of the I/O — and compresses it far better because adjacent values are similar. That's the whole reason Snowflake, BigQuery, Redshift, ClickHouse, and SQL Server columnstore indexes exist.

### The modern data stack

| Layer | Tools |
|---|---|
| Ingestion | Fivetran, Airbyte, Debezium (CDC), custom extractors |
| Storage | Snowflake, BigQuery, Redshift, Databricks, DuckDB |
| Transformation | **dbt** (SQL models, tests, docs, lineage), Spark |
| Orchestration | Airflow, Dagster, Prefect |
| BI | Power BI, Tableau, Looker, Metabase, Superset |
| Quality | dbt tests, Great Expectations, Monte Carlo |

### Layered modeling (the convention dbt popularized)

```
raw / bronze     → exact copy of source, never modified
staging / silver → cleaned, typed, renamed, deduplicated; one model per source table
marts / gold     → business logic, dimensional models, what analysts query
```
This separation means a source schema change touches one staging model rather than fifty dashboards.

### Data quality tests worth having from day one
- **Uniqueness** on every primary key
- **Not null** on every key and required measure
- **Referential integrity** — every fact FK exists in its dimension
- **Accepted values** for status/enum columns
- **Freshness** — did the source load today?
- **Row count anomaly** — did today's load drop 90%?
- **Reconciliation** — does warehouse revenue match the source system's total?

## 35. Databases in Applications

### Connection pooling

Opening a database connection is expensive (TCP handshake, authentication, session setup). A pool keeps a small set of connections open and hands them out.

```
App threads (200) ──► Pool (20 connections) ──► Database
```

**Sizing:** more is not better. A common starting formula is `connections ≈ (cores × 2) + effective_spindles` — often 10–30 for a single application instance, not hundreds. Too many connections cause context-switching and memory pressure that makes everything slower. Use PgBouncer for PostgreSQL, ProxySQL for MySQL, or your framework's built-in pool (HikariCP, SQLAlchemy's pool).

**Rules:** always return connections (use `with`/`using`/try-with-resources), set a checkout timeout so a leak fails fast instead of hanging, and remember that pool size × instance count is what the database actually sees.

### ORMs — use them, but see through them

| Strength | Weakness |
|---|---|
| Removes boilerplate mapping | Generates surprising SQL |
| Type safety, refactorability | The N+1 problem by default |
| Migrations, validation | Poor at complex analytical queries |
| Portable across engines | Hides cost — a property access can be a query |

```python
# ❌ N+1: 1 + 100 queries
for order in session.query(Order).limit(100):
    print(order.customer.name)

# ✅ Eager load: 1–2 queries
for order in session.query(Order).options(joinedload(Order.customer)).limit(100):
    print(order.customer.name)
```

**The professional posture:** use the ORM for CRUD and simple reads; **log the generated SQL in development** and read it; drop to raw SQL (parameterized) for reporting and anything with window functions or complex joins. An ORM that you can't see through is a liability.

### Migrations

Schema is source code. It belongs in Git, applied by numbered, forward-only scripts.

```
migrations/
  001_create_customers.sql
  002_add_email_index.sql
  003_add_orders_status.sql
```
Tools: Flyway, Liquibase, Alembic (Python), EF Migrations (.NET), Rails/Django built-ins, Atlas.

**Rules that prevent outages**
1. **Never edit an applied migration.** Write a new one.
2. **Make them backward compatible** so the old app version still works during a rolling deploy.
3. **Expand → migrate → contract** for breaking changes:
   - *Expand:* add the new column, nullable, with a default. Deploy code writing to both.
   - *Migrate:* backfill in batches.
   - *Contract:* after all instances use the new column, drop the old one — in a later release.
4. **Backfill in batches**, never one giant `UPDATE` on a live table.
5. **Beware locking DDL.** Adding a column with a default rewrote the whole table in older MySQL/PostgreSQL. Check your version's behavior, and use `pt-online-schema-change`/`gh-ost` (MySQL) or `CREATE INDEX CONCURRENTLY` (PostgreSQL) for large live tables.
6. **Test the rollback**, or explicitly accept forward-only.

### Testing database code

| Approach | Fidelity | Speed |
|---|---|---|
| Mock the data layer | Low — misses real SQL errors | Fastest |
| SQLite in memory | Medium — dialect differs, will lie to you | Fast |
| **Real engine in a container** | High | Moderate — **the right default** |
| Shared test database | High | Slow, flaky, contended |

```python
# Testcontainers: a real PostgreSQL per test run
with PostgresContainer("postgres:16") as pg:
    engine = create_engine(pg.get_connection_url())
    run_migrations(engine)
    # ... tests
```

**Isolation between tests:** wrap each test in a transaction and roll back at the end — fast and perfectly clean. Truncate-and-reseed is the fallback when the code under test manages its own transactions.

Also test: that migrations apply cleanly from empty, that they apply to a copy of production-shaped data, and that your critical queries still use indexes (assert on the plan).

### Observability

Track these four and you'll catch most problems before users do:
- **Query latency percentiles** (p50/p95/p99) — averages hide the pain
- **Slow query log** — MySQL `slow_query_log`, PostgreSQL `log_min_duration_statement`, SQL Server Query Store
- **Connection pool saturation** — waits for a connection mean the pool is too small or a query is too slow
- **Replication lag** and **lock waits / deadlock counts**

```sql
-- Top queries by total time
SELECT * FROM sys.statement_analysis ORDER BY total_latency DESC LIMIT 10;   -- MySQL 8
SELECT query, calls, total_exec_time, mean_exec_time
FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 10;             -- PostgreSQL
SELECT TOP 10 * FROM sys.query_store_runtime_stats ORDER BY avg_duration DESC; -- SQL Server
```

> 💡 Optimize by **total** time (calls × duration), not worst single duration. A 20 ms query running 100,000 times a minute matters far more than a 4-second report someone runs twice a day.

### Security in the application layer

- One database account **per service**, with only the privileges that service needs
- Credentials in a secret manager, never in source or environment files committed to Git
- TLS on every connection, including inside your VPC
- Parameterized queries with no exceptions (see Section 24)
- Never log full query parameters — you will log passwords and PII
- Rotate credentials on a schedule and after any staff change
