<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Database Index — a learning guide</title>
<meta name="description" content="An interactive database and SQL learning guide: 135 sections, 528 spaced-repetition study questions, and a live SQLite console with a preloaded sample database.">
<meta name="theme-color" content="#101E1C">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23101E1C'/%3E%3Cellipse cx='16' cy='9' rx='9' ry='3.4' fill='none' stroke='%230D5C63' stroke-width='2.2'/%3E%3Cpath d='M7 9v14c0 1.9 4 3.4 9 3.4s9-1.5 9-3.4V9' fill='none' stroke='%230D5C63' stroke-width='2.2'/%3E%3Cpath d='M7 16c0 1.9 4 3.4 9 3.4s9-1.5 9-3.4' fill='none' stroke='%230D5C63' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/42977a026ebd.css" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="shelf-vendor:/fonts/17750ae7494f.css" rel="stylesheet"></noscript>
<style>
:root{
  --ink:#101E1C; --paper:#E9EBE5; --card:#F3F4EF; --rule:#C6CBC0;
  --accent:#0D5C63; --accent-soft:#D6E4E2; --stamp:#A63446; --stamp-soft:#F0DCDE;
  --muted:#5C6660; --code-bg:#12201F; --shadow:rgba(16,30,28,.10);
  --sans:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:288px; --toc:220px;
}
html[data-theme="dark"]{
  --ink:#DDE2DA; --paper:#0B1413; --card:#111B1A; --rule:#263634;
  --accent:#5CBFC4; --accent-soft:#122B2C; --stamp:#E0808C; --stamp-soft:#2A1719;
  --muted:#8A968F; --code-bg:#08100F; --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:var(--body-size,17px); line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:3px;font-family:var(--sans);font-size:13px;transition:top .15s}
.skip:focus{top:8px}
::selection{background:var(--accent-soft);color:var(--ink)}
a{color:var(--accent);text-underline-offset:3px}
button{font-family:var(--sans);cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ── Masthead ─────────────────────────────── */
header.masthead{
  position:sticky;top:0;z-index:60;background:var(--paper);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:18px;padding:0 18px;height:60px;
  width:100%;max-width:100vw;overflow:hidden;
}
.abbr{display:none}
.pill{white-space:nowrap;flex-shrink:0}
.mast-actions{flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--sans);white-space:nowrap}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.vol-switch{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.vol-switch button{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;
  padding:7px 13px;color:var(--muted);border-right:1px solid var(--rule);
}
.vol-switch button:last-child{border-right:0}
.vol-switch button[aria-pressed="true"]{background:var(--accent);color:#fff}
.searchwrap{flex:1 1 120px;min-width:0;max-width:440px;position:relative}
#search{
  width:100%;padding:8px 12px 8px 34px;font-family:var(--sans);font-size:13.5px;
  border:1px solid var(--rule);border-radius:2px;background:var(--card);color:var(--ink);
}
#search::placeholder{color:var(--muted)}
.searchwrap svg{position:absolute;left:11px;top:9px;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.mast-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{
  font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.hot{background:var(--stamp);border-color:var(--stamp);color:#fff}
#menuBtn{display:none}

/* progress hairline */
#readbar{position:fixed;top:60px;left:0;height:2px;background:var(--accent);width:0;z-index:59;transition:width .12s linear}

/* ── Shell ────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--toc);gap:0;align-items:start;width:100%;max-width:100vw}
.shell>*{min-width:0}

/* ── Index spine (nav) ────────────────────── */
nav.spine{
  position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;
  border-right:1px solid var(--rule);padding:18px 0 60px;background:var(--paper);
}
.railfilter{display:flex;gap:6px;padding:0 14px 12px}
.railfilter input{flex:1;min-width:0;padding:6px 9px;font-family:var(--sans);font-size:12px;
  border:1px solid var(--rule);border-radius:2px;background:var(--card);color:var(--ink)}
.railbtn{border:1px solid var(--rule);border-radius:2px;padding:0 9px;color:var(--muted);font-size:13px}
.railbtn:hover{border-color:var(--accent);color:var(--accent)}
.spine-head{
  font-family:var(--sans);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);padding:0 20px 10px;
}
.part{
  font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);padding:20px 20px 7px;border-top:1px solid var(--rule);margin-top:10px;font-weight:700;
}
.part:first-of-type{border-top:0;margin-top:0}
.grp{display:none;padding-bottom:6px}
.grpwrap.open>.grp{display:block}
.volhead{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--ink);padding:9px 20px;margin-top:16px;position:sticky;top:0;z-index:3}
.volhead:first-child{margin-top:0}
html[data-theme="dark"] .volhead{color:var(--paper);background:var(--card);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.grpwrap{position:relative}
.chev{position:absolute;left:4px;top:19px;width:18px;height:18px;font-size:9px;line-height:18px;text-align:center;color:var(--muted);border-radius:2px;transition:transform .15s;z-index:2}
.chev:hover{background:var(--card);color:var(--accent)}
.grpwrap.open>.chev{transform:rotate(90deg)}
.part.partlink{display:block;padding-left:24px;width:100%;text-align:left;cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.part.partlink:hover{color:var(--accent)}
.part.partlink[aria-current="true"]{color:var(--accent)}
.part.partlink.done::after{content:" ✓";color:var(--accent)}
.navitem{
  display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:6px 20px 6px 18px;font-family:var(--sans);font-size:13px;line-height:1.4;
  color:var(--muted);border-left:2px solid transparent;
}
.navitem:hover{color:var(--ink);background:var(--card)}
.navitem[aria-current="true"]{color:var(--accent);border-left-color:var(--accent);font-weight:500;background:var(--accent-soft)}
.navitem .num{font-size:10.5px;font-variant-numeric:tabular-nums;opacity:.7;min-width:20px}
.navitem.done .lbl::after{content:"✓";color:var(--accent);margin-left:6px;font-size:11px}

/* ── Reading pane ─────────────────────────── */
main{padding:44px 56px 140px;max-width:820px;margin:0 auto;min-width:0;width:100%;overflow-wrap:break-word}
.eyebrow{
  font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--stamp);margin-bottom:14px;display:flex;gap:12px;align-items:center;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
main h1{font-family:var(--sans);font-size:34px;line-height:1.15;letter-spacing:-.025em;font-weight:700;margin:0 0 18px}
main h2{font-family:var(--sans);font-size:27px;line-height:1.2;letter-spacing:-.02em;font-weight:700;margin:0 0 20px}
main h3{font-family:var(--sans);font-size:19px;letter-spacing:-.01em;font-weight:700;margin:38px 0 12px;padding-top:14px;border-top:1px solid var(--rule)}
main h4{font-family:var(--sans);font-size:15px;font-weight:700;margin:26px 0 8px}
main p{margin:0 0 16px}
main ul,main ol{margin:0 0 16px;padding-left:22px}
main li{margin-bottom:6px}
main hr{border:0;border-top:1px solid var(--rule);margin:34px 0}
main blockquote{
  margin:20px 0;padding:14px 18px;background:var(--card);
  border-left:3px solid var(--accent);font-size:16px;
}
main blockquote p:last-child{margin-bottom:0}
main strong{font-weight:600}
main table{width:100%;border-collapse:collapse;margin:20px 0;font-family:var(--sans);font-size:13.5px;display:block;overflow-x:auto}
main th{text-align:left;padding:9px 12px;border-bottom:2px solid var(--ink);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
main td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
main tbody tr:hover{background:var(--card)}
main code{font-family:var(--mono);font-size:.855em;background:var(--card);padding:1px 5px;border-radius:2px;border:1px solid var(--rule)}
main pre{
  background:var(--code-bg);border-radius:3px;padding:16px 18px;overflow-x:auto;
  margin:20px 0;position:relative;border:1px solid var(--rule);
}
main pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.6;color:#d8e0dd}
.t-c{color:#6f8a84;font-style:italic}
.t-s{color:#9ed6a6}
.t-n{color:#e8c07d}
.t-k{color:#6ec8d0;font-weight:500}
.t-f{color:#c9a6e8}
.t-o{color:#a8b5b1}
.copy{
  position:absolute;top:8px;right:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;background:rgba(255,255,255,.09);color:#c3ccc8;border-radius:2px;opacity:0;transition:opacity .15s;
}
pre:hover .copy{opacity:1}
.copy:hover{background:var(--accent);color:#fff}

/* Q&A cards inline */
.qa{border:1px solid var(--rule);border-radius:3px;margin:0 0 10px;background:var(--card);overflow:hidden}
.qa summary{
  list-style:none;cursor:pointer;padding:12px 16px;font-family:var(--sans);font-size:14.5px;
  font-weight:500;display:flex;gap:12px;align-items:flex-start;
}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"Show";margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex-shrink:0;padding-top:3px}
.qa[open] summary::after{content:"Hide"}
.qa summary:hover{background:var(--accent-soft)}
.qa .qn{color:var(--stamp);font-variant-numeric:tabular-nums;flex-shrink:0}
.qa .ans{padding:0 16px 14px 46px;font-size:16px;border-top:1px solid var(--rule);padding-top:12px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin:18px 0 8px}
.bcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:15px 16px 13px;border:1px solid var(--rule);border-radius:3px;background:var(--card);position:relative;overflow:hidden}
.bcard:hover{border-color:var(--accent);transform:translateY(-2px);transition:.15s}
.bnum{font-family:var(--mono);font-size:10.5px;color:var(--stamp)}
.btitle{font-family:var(--sans);font-weight:700;font-size:15px;line-height:1.25;letter-spacing:-.015em}
.bauth{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.bfor{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--sans);font-size:10.5px;color:var(--muted)}
.bstars{color:var(--stamp);letter-spacing:1px}
.btrack{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rule)}
.btrack i{display:block;height:100%;background:var(--accent)}

/* section footer */
.secfoot{display:flex;gap:12px;align-items:center;margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);flex-wrap:wrap}
.markread{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--accent);color:var(--accent);border-radius:2px;
}
.markread.on{background:var(--accent);color:#fff}
.navbtn{font-family:var(--sans);font-size:12px;padding:9px 14px;border:1px solid var(--rule);border-radius:2px;color:var(--muted)}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.navbtn.next{margin-left:auto}

/* ── On this page ─────────────────────────── */
aside.toc{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:44px 20px 60px;border-left:1px solid var(--rule)}
.toc-head{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.toc a{display:block;font-family:var(--sans);font-size:12px;line-height:1.4;color:var(--muted);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid var(--rule)}
.toc a:hover,.toc a.active{color:var(--accent);border-left-color:var(--accent)}
.toc a.sub{padding-left:20px;font-size:11.5px}

/* ── Search results ───────────────────────── */
#results{display:none}
#results.on{display:block}
.hit{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--rule);border-radius:3px;margin-bottom:8px;background:var(--card)}
.hit:hover{border-color:var(--accent)}
.hit .ht{font-family:var(--sans);font-weight:600;font-size:14.5px;margin-bottom:3px}
.hit .hv{font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);margin-bottom:6px}
.hit .hx{font-size:14px;color:var(--muted)}
.hit mark{background:var(--accent-soft);color:var(--ink);padding:0 2px}

.persistnote{font-size:14px;color:var(--muted);margin:-18px 0 30px}
.partindex{display:flex;flex-direction:column;gap:6px;margin:14px 0 8px}
.pitem{display:flex;gap:12px;align-items:baseline;text-align:left;padding:11px 14px;border:1px solid var(--rule);
  border-radius:3px;background:var(--card);font-family:var(--sans);color:var(--ink)}
.pitem:hover{border-color:var(--accent)}
.pinum{font-family:var(--mono);font-size:10.5px;color:var(--stamp);flex-shrink:0}
.pititle{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.pimeta{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.readmeta{font-family:var(--sans);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:-8px 0 22px}
#toTop{position:fixed;right:18px;bottom:18px;z-index:58;width:40px;height:40px;border-radius:50%;
  background:var(--ink);color:var(--paper);font-size:16px;line-height:40px;text-align:center;
  box-shadow:0 4px 14px var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{background:var(--accent)}
body.sqlopen #toTop,body.deckopen #toTop{display:none}
.qhead{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:6px 0 8px}
.hit-q{border-left:3px solid var(--stamp)}
.qa.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}


.chonly{display:none}
#sqlpanel.challenge .chonly{display:inline-block}
.chbar{display:none;gap:12px;align-items:baseline;padding:11px 16px;background:var(--accent-soft);
  border-bottom:1px solid var(--rule);font-family:var(--sans);flex-wrap:wrap}
#sqlpanel.challenge .chbar{display:flex}
.chbar.solved{background:var(--accent);color:#fff}
.chnum{font-family:var(--mono);font-size:11px;color:var(--stamp);flex-shrink:0}
.chbar.solved .chnum{color:#fff}
.chq{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.chdone{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.verdict{font-family:var(--sans);font-weight:700;font-size:15px;padding:12px 14px;border-radius:3px;margin-bottom:10px}
.verdict.good{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.verdict.bad{background:var(--stamp-soft);color:var(--stamp);border:1px solid var(--stamp)}


.viz{border:1px solid var(--accent);border-radius:4px;padding:18px 20px;margin:26px 0;background:var(--card)}
.vizhead{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.vizbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.vzbtn{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;padding:7px 12px;border:1px solid var(--rule);
  border-radius:2px;color:var(--muted);background:var(--paper)}
.vzbtn:hover{border-color:var(--accent);color:var(--accent)}
.vzbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vizgrid{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
.vizlbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:5px}
.vzt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;display:table}
.vzt th{text-align:left;padding:4px 8px;border-bottom:1.5px solid var(--ink);font-size:10px;
  font-family:var(--sans);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.vzt td{padding:4px 8px;border-bottom:1px solid var(--rule)}
.vzt tr.miss{opacity:.32}
.vzt tr.hit{background:var(--accent-soft)}
.vzt td.null{color:var(--muted);font-style:italic}
.vzr tbody tr{background:var(--paper)}
.viznote{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.vzsql{background:var(--code-bg);border-radius:3px;padding:14px 16px;font-family:var(--mono);font-size:12.5px;
  line-height:1.7;color:#7d8d89;margin:0 0 14px;overflow-x:auto}
.vzline{display:block;transition:.2s}
.vzline b{color:#5d6d69}
.vzline.done{color:#9aa8a4}
.vzline.done b{color:#9aa8a4}
.vzline.active{color:#eaf2ef;background:rgba(110,200,208,.14);margin:0 -16px;padding:0 16px}
.vzline.active b{color:#6ec8d0}
@media(max-width:860px){.vizgrid{grid-template-columns:1fr}.viz{padding:14px}}


#help{position:fixed;inset:0;z-index:250;background:rgba(16,30,28,.5);display:none;place-items:center;padding:20px}
#help.on{display:grid}
.helpcard{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:26px 30px;
  max-width:440px;width:100%;box-shadow:0 20px 60px var(--shadow);max-height:86vh;overflow:auto}
.helphead{font-family:var(--sans);font-weight:700;font-size:16px;margin-bottom:16px}
.helptbl{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13.5px}
.helptbl td{padding:7px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.helptbl td:first-child{width:104px;white-space:nowrap}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:2px 6px;background:var(--card)}

.quizcta{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border:1px solid var(--accent);border-radius:4px;padding:16px 18px;margin:30px 0;background:var(--accent-soft)}
.qzt{font-family:var(--sans);font-weight:700;font-size:15px}
.qzm{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:3px}
.featgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0 26px}

This is two volumes bound into one interface.

**Volume I — Practice** is the working reference: 36 sections and 7 appendices covering database fundamentals, every SQL function family, indexing, transactions, scaling, warehousing, and application integration. It includes a loadable sample database, 40 graded exercises, and worked solutions to all of them.

**Volume II — Bookshelf** is a study companion to the ten essential database books. Each one gets a map of what it covers, its core ideas worked through with code, the misconceptions it corrects, and 30+ questions with answers.

### How to use this

| If you are… | Start at |
|---|---|

## 1. What a Database Actually Is

A **database** is an organized collection of data stored so it can be efficiently retrieved, updated, and managed. A **DBMS** (Database Management System) is the software that sits between you and the data files, handling storage, concurrency, integrity, and security.

**Why not just use spreadsheets or files?**

| Problem with flat files | How a DBMS solves it |
|---|---|
| Data duplicated in many places | Normalization + foreign keys |
| Two people edit at once → corruption | Locking, MVCC, transactions |
| No guarantee a value is valid | Constraints, data types, checks |
| Slow searching in large files | Indexes (B-trees, hashes) |
| Crash mid-write leaves garbage | Write-ahead logging, ACID |
| Anyone can read everything | Users, roles, GRANT/REVOKE |

**Mental model:** think of a DBMS as a librarian. You don't walk into the stacks yourself — you describe *what* you want (declarative SQL), and the librarian figures out *how* to fetch it (the query planner).

### The three-schema architecture

```
┌───────────────────────────────────────┐
│ EXTERNAL LEVEL   (views per user)     │  What each app/user sees
├───────────────────────────────────────┤
│ CONCEPTUAL LEVEL (logical schema)     │  Tables, columns, constraints
├───────────────────────────────────────┤
│ INTERNAL LEVEL   (physical storage)   │  Files, pages, indexes
└───────────────────────────────────────┘
```

This separation is why you can add an index (internal) without rewriting a single query (conceptual/external). It's called **data independence**.

| Type | Model | Examples | Best for |

| **Relational (RDBMS)** | Tables with rows/columns, SQL | MySQL, PostgreSQL, SQL Server, Oracle, SQLite | Structured data, transactions, reporting |
| **Document** | JSON-like documents | MongoDB, CouchDB, Firestore | Flexible/evolving schemas, content |
| **Key-Value** | Simple key → value | Redis, DynamoDB, Memcached | Caching, sessions, ultra-low latency |
| **Column-family** | Wide sparse columns | Cassandra, HBase, ScyllaDB | Massive writes, time-series at scale |
| **Graph** | Nodes + edges | Neo4j, ArangoDB, Neptune | Social networks, fraud rings, routing |

### OLTP vs OLAP — the most important distinction

| | OLTP (Transactional) | OLAP (Analytical) |
|---|---|---|
| Purpose | Run the business | Understand the business |
| Typical query | `UPDATE accounts SET balance...` | `SUM(sales) GROUP BY region, quarter` |
| Rows touched | 1–100 | Millions |
| Storage | Row-oriented | Column-oriented |
| Normalization | High (3NF) | Low (star/snowflake schema) |
| Examples | MySQL, SQL Server, Postgres | Snowflake, BigQuery, ClickHouse |

## 3. The Relational Model — Core Vocabulary

Invented by **E. F. Codd** (IBM, 1970). Everything is a *relation* (table) — an unordered set of *tuples* (rows).

| Formal term | Everyday term | Meaning |
|---|---|---|
| Relation | Table | A set of rows sharing the same columns |
| Tuple | Row / Record | One entity instance |
| Attribute | Column / Field | One property |
| Domain | Data type | Allowed values for a column |
| Cardinality | Row count | How many rows |
| Degree | Column count | How many columns |

### Relational algebra — the math behind SQL

Every SQL query decomposes into these operations. Knowing them makes optimization intuitive.

| Operation | Symbol | SQL equivalent | Meaning |
|---|---|---|---|
| Selection | σ (sigma) | `WHERE` | Pick **rows** matching a condition |
| Projection | π (pi) | `SELECT col1, col2` | Pick **columns** |
| Rename | ρ (rho) | `AS` | Rename a relation/attribute |
| Union | ∪ | `UNION` | Rows in A or B |
| Intersection | ∩ | `INTERSECT` | Rows in both |
| Difference | − | `EXCEPT` / `MINUS` | Rows in A not in B |
| Cartesian product | × | `CROSS JOIN` | Every combination |
| Natural join | ⋈ | `JOIN ... ON` | Product + selection on matching keys |
| Division | ÷ | (no direct syntax) | "Find X related to *all* Y" |

**Example:** "Names of employees in Sales earning over 50k"

```
π name ( σ dept='Sales' ∧ salary>50000 (Employee) )
```

```sql
SELECT name FROM Employee WHERE dept = 'Sales' AND salary > 50000;
```

**Practical takeaway:** filter (σ) as early and as narrowly as possible — that's the single biggest lever on query speed, because every later operation processes fewer rows.

## 4. Keys and Relationships

### Key types

| Key | Definition |
|---|---|
| **Super key** | Any set of columns that uniquely identifies a row |
| **Candidate key** | A minimal super key (no removable column) |
| **Primary key (PK)** | The chosen candidate key. Unique + NOT NULL. One per table |
| **Alternate key** | Candidate keys not chosen as PK |
| **Composite key** | A key made of 2+ columns |
| **Foreign key (FK)** | Column(s) referencing a PK in another table |
| **Surrogate key** | Meaningless auto-generated ID (`id INT AUTO_INCREMENT`) |
| **Natural key** | Real-world identifier (email, ISBN, SSN) |

**Surrogate vs natural — the practical rule:** use a surrogate PK for stability (real-world values change: people change emails, countries change codes), and add a `UNIQUE` constraint on the natural key to preserve the business rule.

```sql
CREATE TABLE users (
    user_id  INT PRIMARY KEY AUTO_INCREMENT,   -- surrogate
    email    VARCHAR(255) NOT NULL UNIQUE,     -- natural key, still enforced
    username VARCHAR(50)  NOT NULL UNIQUE
);
```

### Relationship cardinalities

**One-to-One (1:1)** — split rarely-used or sensitive columns off.
```sql
CREATE TABLE user_profile (
    user_id INT PRIMARY KEY,
    bio     TEXT,
    FOREIGN KEY (user_id) REFERENCES users(user_id)
);
```

**One-to-Many (1:N)** — the most common. FK lives on the "many" side.
```sql
CREATE TABLE orders (
    order_id INT PRIMARY KEY,
    user_id  INT NOT NULL,
    FOREIGN KEY (user_id) REFERENCES users(user_id)
);
```

**Many-to-Many (M:N)** — requires a **junction / bridge table**.
```sql
CREATE TABLE order_items (
    order_id   INT,
    product_id INT,
    quantity   INT NOT NULL DEFAULT 1,
    unit_price DECIMAL(10,2) NOT NULL,
    PRIMARY KEY (order_id, product_id),          -- composite PK
    FOREIGN KEY (order_id)   REFERENCES orders(order_id),
    FOREIGN KEY (product_id) REFERENCES products(product_id)
);
```

**Self-referencing** — hierarchy in one table.
```sql
CREATE TABLE employees (
    emp_id    INT PRIMARY KEY,
    name      VARCHAR(100),
    manager_id INT NULL,
    FOREIGN KEY (manager_id) REFERENCES employees(emp_id)
);
```

### Referential integrity actions

```sql
FOREIGN KEY (user_id) REFERENCES users(user_id)
    ON DELETE CASCADE      -- delete children too
    ON UPDATE CASCADE;     -- propagate key changes
```

| Action | Effect on child rows when parent is deleted/updated |
|---|---|
| `RESTRICT` / `NO ACTION` | Block the operation (default, safest) |
| `CASCADE` | Apply the same delete/update to children |
| `SET NULL` | Set the FK column to NULL (column must be nullable) |
| `SET DEFAULT` | Set to the column's default (limited support) |

⚠️ `ON DELETE CASCADE` is convenient and dangerous — one delete can silently wipe out thousands of rows across many tables. Prefer `RESTRICT` plus explicit soft deletes (`is_deleted` flag) in business systems.

### Constraints summary

```sql
CREATE TABLE products (
    product_id  INT PRIMARY KEY,                                  -- PRIMARY KEY
    sku         VARCHAR(40)  NOT NULL UNIQUE,                      -- NOT NULL, UNIQUE
    price       DECIMAL(10,2) NOT NULL CHECK (price >= 0),         -- CHECK
    stock       INT NOT NULL DEFAULT 0,                            -- DEFAULT
    category_id INT REFERENCES categories(category_id)             -- FOREIGN KEY
);
```

## 5. Normalization (1NF → BCNF)

**Goal:** eliminate redundancy and update anomalies by ensuring every fact is stored exactly once.

### The three anomalies normalization prevents

Given a bad table `Orders(order_id, customer_name, customer_city, product, price)`:

- **Insertion anomaly** — can't record a new customer until they place an order.
- **Update anomaly** — a customer moves city → must update every one of their order rows; miss one and the data contradicts itself.
- **Deletion anomaly** — deleting the last order erases the customer entirely.

### Functional dependency

`A → B` reads "A determines B": if two rows share the same A, they must share the same B. `order_id → order_date` is a functional dependency. Normalization is essentially the discipline of making sure every FD's left side is a key.

### First Normal Form (1NF)
**Rule:** atomic values only — no repeating groups, no comma-separated lists, no arrays in a cell.

❌ Violates 1NF:
| order_id | products |
|---|---|
| 1 | "Laptop, Mouse, Keyboard" |

✅ 1NF:
| order_id | product |
|---|---|
| 1 | Laptop |
| 1 | Mouse |
| 1 | Keyboard |

### Second Normal Form (2NF)
**Rule:** 1NF + no *partial dependency* — no non-key column depends on only part of a composite key.

❌ `OrderItems(order_id, product_id, quantity, product_name)`
`product_name` depends only on `product_id`, half the key.

✅ Split: `OrderItems(order_id, product_id, quantity)` + `Products(product_id, product_name)`

*Note: if the PK is a single column, 2NF is automatic.*

### Third Normal Form (3NF)
**Rule:** 2NF + no *transitive dependency* — non-key columns must not depend on other non-key columns.

❌ `Employees(emp_id, name, dept_id, dept_name)`
`dept_name` depends on `dept_id`, which is not a key. (`emp_id → dept_id → dept_name`)

✅ Split: `Employees(emp_id, name, dept_id)` + `Departments(dept_id, dept_name)`

> **Memorize this:** "Every non-key attribute must depend on **the key** (1NF), **the whole key** (2NF), and **nothing but the key** (3NF) — so help me Codd."

### Boyce-Codd Normal Form (BCNF)
**Rule:** stricter 3NF — for every dependency `A → B`, A must be a super key. Catches rare cases with overlapping candidate keys.

### 4NF and 5NF
4NF removes multi-valued dependencies (an employee's independent set of skills *and* set of languages stored in one table produces a spurious cross-product). 5NF handles join dependencies. Both are rare in practice.

### 🔬 Worked walkthrough: normalizing a real mess

Here is a spreadsheet a small shop actually used. Watch it decompose step by step.

**Step 0 — the original "table"**

| OrderID | Customer | CustEmail | CustCity | Products | Qtys | UnitPrices | Supplier | SupplierPhone |
|---|---|---|---|---|---|---|---|---|
| 1001 | Ana Ruiz | ana@x.com | Lisbon | Laptop, Mouse | 1, 2 | 900, 25 | TechCo | 555-0101 |
| 1002 | Ben Osei | ben@y.com | Accra | Mouse | 3 | 25 | TechCo | 555-0101 |
| 1003 | Ana Ruiz | ana@x.com | Lisboa | Monitor | 1 | 300 | ViewMax | 555-0202 |

Problems visible already: `Lisbon` vs `Lisboa` for the same customer (an update anomaly that already happened), lists inside cells, and TechCo's phone number stored twice.

**Step 1 → 1NF: make every cell atomic**

| OrderID | Customer | CustEmail | CustCity | Product | Qty | UnitPrice | Supplier | SupplierPhone |
|---|---|---|---|---|---|---|---|---|
| 1001 | Ana Ruiz | ana@x.com | Lisbon | Laptop | 1 | 900 | TechCo | 555-0101 |
| 1001 | Ana Ruiz | ana@x.com | Lisbon | Mouse | 2 | 25 | TechCo | 555-0101 |
| 1002 | Ben Osei | ben@y.com | Accra | Mouse | 3 | 25 | TechCo | 555-0101 |
| 1003 | Ana Ruiz | ana@x.com | Lisboa | Monitor | 1 | 300 | ViewMax | 555-0202 |

The key is now composite: `(OrderID, Product)`. Note the redundancy got *worse* — that's expected; 1NF exposes the problem so the next steps can fix it.

**Step 2 → 2NF: remove partial dependencies**

Which columns depend on only part of `(OrderID, Product)`?
- `Customer`, `CustEmail`, `CustCity` depend on `OrderID` alone.
- `UnitPrice`, `Supplier`, `SupplierPhone` depend on `Product` alone.
- Only `Qty` depends on the whole key.

```
Orders(OrderID, Customer, CustEmail, CustCity)
OrderItems(OrderID, Product, Qty)
Products(Product, UnitPrice, Supplier, SupplierPhone)
```

**Step 3 → 3NF: remove transitive dependencies**

In `Products`, `SupplierPhone` depends on `Supplier`, which is not a key. Split it out. Same logic applies to the customer's city if cities carried attributes of their own.

```
Customers(CustomerID, Name, Email, City)
Orders(OrderID, CustomerID, OrderDate)
Products(ProductID, Name, UnitPrice, SupplierID)
Suppliers(SupplierID, Name, Phone)
OrderItems(OrderID, ProductID, Qty, UnitPriceAtSale)
```

**The final DDL**

```sql
CREATE TABLE suppliers (
    supplier_id INT PRIMARY KEY AUTO_INCREMENT,
    name        VARCHAR(100) NOT NULL UNIQUE,
    phone       VARCHAR(20)
);
CREATE TABLE customers (
    customer_id INT PRIMARY KEY AUTO_INCREMENT,
    name        VARCHAR(100) NOT NULL,
    email       VARCHAR(255) NOT NULL UNIQUE,
    city        VARCHAR(50)
);
CREATE TABLE products (
    product_id  INT PRIMARY KEY AUTO_INCREMENT,
    name        VARCHAR(100) NOT NULL,
    unit_price  DECIMAL(10,2) NOT NULL CHECK (unit_price >= 0),
    supplier_id INT REFERENCES suppliers(supplier_id)
);
CREATE TABLE orders (
    order_id    INT PRIMARY KEY AUTO_INCREMENT,
    customer_id INT NOT NULL REFERENCES customers(customer_id),
    order_date  DATE NOT NULL
);
CREATE TABLE order_items (
    order_id          INT REFERENCES orders(order_id),
    product_id        INT REFERENCES products(product_id),
    qty               INT NOT NULL CHECK (qty > 0),
    unit_price_at_sale DECIMAL(10,2) NOT NULL,   -- ← deliberate "redundancy"
    PRIMARY KEY (order_id, product_id)
);
```

**Why `unit_price_at_sale` isn't a normalization violation:** the current price and the price this customer paid in 2023 are *two different facts*. If you join to `products.unit_price` to reprint an old invoice, the total changes every time you run a price update. Historical snapshots are always stored, never derived.

**What each anomaly cost, and what fixed it**

| Anomaly in the original | Now prevented by |
|---|---|
| "Lisbon"/"Lisboa" for one customer | City stored once, in `customers` |
| Can't add a supplier with no products yet | `suppliers` is its own table |
| Deleting order 1003 erases ViewMax entirely | Supplier lives independently |
| TechCo's phone change requires editing many rows | One row in `suppliers` |
| Can't query "how many mice sold?" | `order_items` is queryable, not a text list |

### When to *denormalize*

Normalization optimizes writes and integrity; it costs joins on reads. Denormalize deliberately when:
- Read-heavy reporting/analytics (star schemas are intentionally denormalized)
- A join is provably the bottleneck in a hot path
- You need a stored snapshot: an invoice must keep the **price at the time of sale**, not the current price — that's not redundancy, it's a different fact.

Always denormalize *after* measuring, and document why.

## 6. Data Types Across Engines

### Numeric

| Category | MySQL | SQL Server | PostgreSQL | Notes |
|---|---|---|---|---|
| Tiny int | `TINYINT` (1B) | `TINYINT` (0–255) | `SMALLINT` | MySQL's is signed −128..127 |
| Small int | `SMALLINT` (2B) | `SMALLINT` | `SMALLINT` | ±32,767 |
| Integer | `INT` (4B) | `INT` | `INTEGER`/`INT4` | ±2.1 billion |
| Big int | `BIGINT` (8B) | `BIGINT` | `BIGINT` | ±9.2 quintillion |
| Exact decimal | `DECIMAL(p,s)` | `DECIMAL(p,s)`/`NUMERIC` | `NUMERIC(p,s)` | **Use for money** |
| Float | `FLOAT`/`DOUBLE` | `FLOAT`/`REAL` | `REAL`/`DOUBLE PRECISION` | Approximate |
| Auto-increment | `AUTO_INCREMENT` | `IDENTITY(1,1)` | `SERIAL`/`GENERATED AS IDENTITY` | |
| Boolean | `BOOLEAN` (=TINYINT(1)) | `BIT` | `BOOLEAN` | |

> 💰 **Never store money in FLOAT.** `0.1 + 0.2 != 0.3` in binary floating point. Use `DECIMAL(19,4)` — or store integer cents.

### Character

| Type | Meaning | Use when |
|---|---|---|
| `CHAR(n)` | Fixed length, space-padded | Always exactly n chars (country codes, hashes) |
| `VARCHAR(n)` | Variable, up to n | Default choice for text |
| `TEXT` / `VARCHAR(MAX)` | Large text | Articles, descriptions |
| `NCHAR`/`NVARCHAR` | Unicode (SQL Server) | Non-ASCII text in SQL Server |

In SQL Server, prefix Unicode literals with `N`: `WHERE name = N'محمد'`. In MySQL/Postgres, use `utf8mb4` encoding and no prefix is needed. **Always choose `utf8mb4` in MySQL** — the legacy `utf8` is a 3-byte subset that cannot store emoji or some CJK characters.

### Date & time

| Type | MySQL | SQL Server | PostgreSQL |
|---|---|---|---|
| Date only | `DATE` | `DATE` | `DATE` |
| Time only | `TIME` | `TIME` | `TIME` |
| Date+time | `DATETIME` | `DATETIME2` | `TIMESTAMP` |
| With timezone | `TIMESTAMP` (converts to UTC) | `DATETIMEOFFSET` | `TIMESTAMPTZ` |
| Year | `YEAR` | — | — |

> 🕐 **Store timestamps in UTC**, convert to local time in the application or presentation layer. Prefer `DATETIME2` over the legacy `DATETIME` in SQL Server (better range and precision).

### Other important types

| Type | MySQL | SQL Server | PostgreSQL |
|---|---|---|---|
| JSON | `JSON` | `NVARCHAR` + `JSON_VALUE` | `JSON` / `JSONB` (indexable) |
| UUID | `CHAR(36)` / `BINARY(16)` | `UNIQUEIDENTIFIER` | `UUID` |
| Binary | `BLOB` | `VARBINARY(MAX)` | `BYTEA` |
| Array | — | — | `INTEGER[]` (native) |
| Enum | `ENUM('a','b')` | CHECK constraint | `CREATE TYPE ... AS ENUM` |
| Spatial | `GEOMETRY` | `GEOGRAPHY` | PostGIS extension |

## 7. The SQL Language Families

| Family | Full name | Commands | Transactional? |
|---|---|---|---|
| **DDL** | Data Definition | `CREATE`, `ALTER`, `DROP`, `TRUNCATE`, `RENAME` | Auto-commits in MySQL/Oracle; rollback-able in SQL Server/Postgres |
| **DML** | Data Manipulation | `INSERT`, `UPDATE`, `DELETE`, `MERGE` | Yes |
| **DQL** | Data Query | `SELECT` | n/a |
| **DCL** | Data Control | `GRANT`, `REVOKE`, `DENY` | — |
| **TCL** | Transaction Control | `COMMIT`, `ROLLBACK`, `SAVEPOINT`, `BEGIN` | — |

### DDL essentials

```sql
-- CREATE
CREATE TABLE customers (
    customer_id INT PRIMARY KEY AUTO_INCREMENT,
    name        VARCHAR(100) NOT NULL,
    email       VARCHAR(255) UNIQUE,
    created_at  TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- ALTER
ALTER TABLE customers ADD COLUMN phone VARCHAR(20);
ALTER TABLE customers MODIFY COLUMN name VARCHAR(150);      -- MySQL
ALTER TABLE customers ALTER COLUMN name VARCHAR(150);       -- SQL Server
ALTER TABLE customers ALTER COLUMN name TYPE VARCHAR(150);  -- PostgreSQL
ALTER TABLE customers DROP COLUMN phone;
ALTER TABLE customers ADD CONSTRAINT chk_email CHECK (email LIKE '%@%');

-- DROP / TRUNCATE
DROP TABLE customers;         -- removes table + data + structure
TRUNCATE TABLE customers;     -- removes all rows, keeps structure, resets identity
```

### DELETE vs TRUNCATE vs DROP

| | DELETE | TRUNCATE | DROP |
|---|---|---|---|
| Type | DML | DDL | DDL |
| `WHERE` clause | Yes | No | No |
| Speed | Slow (row by row) | Very fast (deallocates pages) | Fast |
| Logs each row | Yes | Minimal logging | n/a |
| Fires triggers | Yes | No | No |
| Resets identity/auto-increment | No | Yes | n/a |
| Rollback-able | Yes | Engine-dependent | Engine-dependent |
| Keeps table structure | Yes | Yes | **No** |

### DML essentials

```sql
-- INSERT single & multiple
INSERT INTO customers (name, email) VALUES ('Ada Lovelace', 'ada@example.com');
INSERT INTO customers (name, email) VALUES
    ('Alan Turing',  'alan@example.com'),
    ('Grace Hopper', 'grace@example.com');

-- INSERT from a query
INSERT INTO archived_orders SELECT * FROM orders WHERE order_date < '2020-01-01';

-- UPDATE (always test the WHERE with a SELECT first!)
UPDATE products SET price = price * 1.10 WHERE category_id = 3;

-- DELETE
DELETE FROM orders WHERE status = 'cancelled' AND order_date < '2023-01-01';

-- UPSERT
-- MySQL:
INSERT INTO stock (product_id, qty) VALUES (5, 100)
ON DUPLICATE KEY UPDATE qty = qty + VALUES(qty);
-- PostgreSQL:
INSERT INTO stock (product_id, qty) VALUES (5, 100)
ON CONFLICT (product_id) DO UPDATE SET qty = stock.qty + EXCLUDED.qty;
-- SQL Server:
MERGE stock AS t
USING (SELECT 5 AS product_id, 100 AS qty) AS s ON t.product_id = s.product_id
WHEN MATCHED THEN UPDATE SET t.qty = t.qty + s.qty
WHEN NOT MATCHED THEN INSERT (product_id, qty) VALUES (s.product_id, s.qty);
```

> 🛑 **Safety habit:** before any `UPDATE`/`DELETE`, run the same `WHERE` as a `SELECT COUNT(*)`. Wrap in an explicit transaction so you can `ROLLBACK`. In MySQL Workbench, keep *Safe Updates* mode on.

## 8. SELECT — The Logical Order of Execution

You **write** SQL in one order but the engine **evaluates** it in another. This single table explains most beginner errors.

| Written order | Logical execution order | |
|---|---|---|
| `SELECT` | 5 | |
| `FROM` | **1** | Build the source rows |
| `JOIN ... ON` | **2** | Combine tables |
| `WHERE` | **3** | Filter individual rows |
| `GROUP BY` | **4a** | Collapse into groups |
| `HAVING` | **4b** | Filter groups |
| `SELECT`/window fns | **5** | Compute output columns |
| `DISTINCT` | 6 | |
| `ORDER BY` | 7 | Sort |
| `LIMIT`/`TOP`/`OFFSET` | 8 | Trim |

**Consequences you must internalize:**

1. **You can't use a `SELECT` alias in `WHERE`** — `WHERE` runs before `SELECT`.
   ```sql
   SELECT price * qty AS total FROM items WHERE total > 100;  -- ❌ error
   SELECT price * qty AS total FROM items WHERE price*qty>100; -- ✅
   ```
   (You *can* use it in `ORDER BY`, which runs last.)

2. **`WHERE` filters rows; `HAVING` filters groups.**
   ```sql
   SELECT department, AVG(salary) AS avg_sal
   FROM employees
   WHERE status = 'active'          -- before grouping: drops inactive people
   GROUP BY department
   HAVING AVG(salary) > 60000       -- after grouping: drops whole departments
   ORDER BY avg_sal DESC;
   ```

3. **Window functions can't go in `WHERE`** — they're computed at step 5. Wrap in a CTE/subquery and filter outside.

### 🔬 Trace it with real rows

Take this `employees` table:

| emp_id | name | department | salary | status |
|---|---|---|---|---|
| 1 | Ana | Sales | 80,000 | active |
| 2 | Ben | Sales | 55,000 | active |
| 3 | Cal | Sales | 60,000 | **inactive** |
| 4 | Dia | Eng | 95,000 | active |
| 5 | Eli | Eng | 85,000 | active |
| 6 | Fay | HR | 45,000 | active |

And this query:

```sql
SELECT   department, AVG(salary) AS avg_sal
FROM     employees
WHERE    status = 'active'
GROUP BY department
HAVING   AVG(salary) > 60000
ORDER BY avg_sal DESC;
```

**Phase 1 — `FROM`:** load all 6 rows.

**Phase 3 — `WHERE status = 'active'`:** Cal (row 3) is dropped. 5 rows remain.

| emp_id | department | salary |
|---|---|---|
| 1 | Sales | 80,000 |
| 2 | Sales | 55,000 |
| 4 | Eng | 95,000 |
| 5 | Eng | 85,000 |
| 6 | HR | 45,000 |

**Phase 4a — `GROUP BY department`:** three groups form. Individual rows are no longer addressable.

| department | rows in group |
|---|---|
| Sales | 80,000 / 55,000 |
| Eng | 95,000 / 85,000 |
| HR | 45,000 |

**Phase 4b — `HAVING AVG(salary) > 60000`:** Sales averages 67,500 ✅. Eng averages 90,000 ✅. HR averages 45,000 ❌ — the whole group disappears.

**Phase 5 — `SELECT`:** compute the output columns and apply the alias `avg_sal`.

**Phase 7 — `ORDER BY avg_sal DESC`:** the alias is legal here because `SELECT` already ran.

**Final result**

| department | avg_sal |
|---|---|
| Eng | 90,000 |
| Sales | 67,500 |

**Now notice what changes if you move the filter.** Putting `status='active'` in `HAVING` instead is not just wrong — it's a syntax error (`status` isn't grouped or aggregated). And putting `AVG(salary) > 60000` in `WHERE` fails too, because at phase 3 no groups exist yet to average. Each filter can only live where its data exists.

> 💡 **Mnemonic for the order:** **F**rom **J**oin **W**here **G**roup **H**aving **S**elect **D**istinct **O**rder **L**imit → "**F**riendly **J**anitors **W**ash **G**iant **H**ouses **S**o **D**ust **O**ften **L**ingers."

🧠 **Check yourself (8.1)**
1. Why does `SELECT price*qty AS total FROM items WHERE total > 100` fail, while the same query with `ORDER BY total` works?
2. You want the average salary of active employees, but only for departments with more than 3 people *total* (including inactive ones). Can one query with `WHERE status='active'` do this? Why not?
3. In which phase is `DISTINCT` applied, and why does that make `SELECT DISTINCT ... ORDER BY <column not in SELECT>` an error in strict engines?

### Full syntax skeleton

```sql
SELECT   DISTINCT column_list
FROM     table_a a
JOIN     table_b b ON a.id = b.a_id
WHERE    condition
GROUP BY grouping_columns
HAVING   group_condition
ORDER BY sort_columns ASC|DESC
LIMIT    n OFFSET m;      -- MySQL/Postgres
```

### Row limiting by engine

```sql
SELECT * FROM products ORDER BY price DESC LIMIT 10;              -- MySQL, PostgreSQL, SQLite
SELECT TOP 10 * FROM products ORDER BY price DESC;                -- SQL Server
SELECT * FROM products ORDER BY price DESC OFFSET 0 ROWS FETCH NEXT 10 ROWS ONLY;  -- ANSI SQL: SQL Server 2012+, Postgres, Oracle 12c+
SELECT * FROM products WHERE ROWNUM <= 10;                        -- Oracle (legacy)
```

Pagination:
```sql
LIMIT 20 OFFSET 40;                              -- MySQL/Postgres — page 3, 20 per page
OFFSET 40 ROWS FETCH NEXT 20 ROWS ONLY;          -- SQL Server (requires ORDER BY)
```
> ⚡ Deep `OFFSET` is slow (the engine still reads and discards skipped rows). For large datasets use **keyset pagination**: `WHERE id > :last_seen_id ORDER BY id LIMIT 20`.

## 9. Operators and Predicates

### Comparison
`=` `<>` (or `!=`) `<` `>` `<=` `>=`

### Logical
`AND`, `OR`, `NOT` — precedence: `NOT` > `AND` > `OR`. **Always parenthesize mixed conditions:**
```sql
WHERE status='active' AND (plan='pro' OR plan='enterprise')   -- ✅ intended
WHERE status='active' AND plan='pro' OR plan='enterprise'     -- ❌ returns all enterprise
```

### BETWEEN / IN / LIKE

```sql
WHERE price BETWEEN 10 AND 50            -- inclusive on both ends
WHERE country IN ('US','CA','MX')
WHERE country NOT IN ('US','CA')         -- ⚠️ returns nothing if the list contains NULL
```

### LIKE wildcards

| Pattern | Meaning |
|---|---|
| `%` | Any sequence of characters (including none) |
| `_` | Exactly one character |
| `[abc]` | Any one of a, b, c — **SQL Server only** |
| `[a-f]` | Range — SQL Server only |
| `[^abc]` | Not one of — SQL Server only |

```sql
WHERE name LIKE 'A%'          -- starts with A       ✅ can use an index
WHERE name LIKE '%son'        -- ends with son       ❌ index unusable
WHERE name LIKE '%ann%'       -- contains ann        ❌ index unusable
WHERE code LIKE 'A_2%'        -- A, any char, then 2
WHERE name LIKE '100\%' ESCAPE '\'   -- literal percent sign
```

For case-insensitive and full-text search:
```sql
WHERE LOWER(name) LIKE '%smith%'                       -- portable, but kills the index
WHERE name ILIKE '%smith%'                             -- PostgreSQL
MATCH(body) AGAINST('database' IN NATURAL LANGUAGE MODE)  -- MySQL full-text
WHERE CONTAINS(body, 'database')                       -- SQL Server full-text
WHERE to_tsvector(body) @@ to_tsquery('database')      -- PostgreSQL full-text
```

### Regular expressions
```sql
WHERE email REGEXP '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$'   -- MySQL
WHERE email ~ '^[A-Za-z0-9._%+-]+@'                                      -- PostgreSQL
-- SQL Server has no native regex; use LIKE patterns or CLR functions
```

### EXISTS vs IN vs JOIN

```sql
-- EXISTS: stops at first match, handles NULLs correctly, great for large subqueries
SELECT c.name FROM customers c
WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id);

-- IN: fine for small, static lists
SELECT name FROM customers WHERE customer_id IN (1, 2, 3);

-- NOT IN with NULLs — the classic trap
SELECT * FROM a WHERE id NOT IN (SELECT b_id FROM b);  -- ❌ empty if any b_id is NULL
SELECT * FROM a WHERE NOT EXISTS (SELECT 1 FROM b WHERE b.b_id = a.id);  -- ✅ correct
```

**Why?** `NOT IN (1, NULL)` evaluates to `id<>1 AND id<>NULL` → `TRUE AND UNKNOWN` → `UNKNOWN` → row excluded. Always prefer `NOT EXISTS`.

## 10. Joins — Every Kind

```
Table A          Table B
┌───┬───┐      ┌───┬─────┐
│ 1 │ a │      │ 1 │ xxx │
│ 2 │ b │      │ 2 │ yyy │
│ 3 │ c │      │ 4 │ zzz │
└───┴───┘      └───┴─────┘
```

| Join | Returns | Result from above |
|---|---|---|
| `INNER JOIN` | Only matching rows | 1, 2 |
| `LEFT JOIN` | All of A + matches from B (NULLs where none) | 1, 2, 3(null) |
| `RIGHT JOIN` | All of B + matches from A | 1, 2, 4(null) |
| `FULL OUTER JOIN` | Everything from both | 1, 2, 3(null), 4(null) |
| `CROSS JOIN` | Every combination (3 × 3 = 9 rows) | Cartesian product |
| `SELF JOIN` | Table joined to itself | Hierarchies |

```sql
-- INNER
SELECT o.order_id, c.name
FROM orders o
INNER JOIN customers c ON o.customer_id = c.customer_id;

-- LEFT (find customers with NO orders — the "anti-join" pattern)
SELECT c.name
FROM customers c
LEFT JOIN orders o ON c.customer_id = o.customer_id
WHERE o.order_id IS NULL;

-- FULL OUTER (MySQL lacks it — emulate with UNION)
SELECT * FROM a LEFT  JOIN b ON a.id=b.id
UNION
SELECT * FROM a RIGHT JOIN b ON a.id=b.id;

-- SELF JOIN: employee + manager
SELECT e.name AS employee, m.name AS manager
FROM employees e
LEFT JOIN employees m ON e.manager_id = m.emp_id;

-- Multi-table join
SELECT c.name, o.order_date, p.product_name, oi.quantity
FROM customers c
JOIN orders      o  ON c.customer_id = o.customer_id
JOIN order_items oi ON o.order_id    = oi.order_id
JOIN products    p  ON oi.product_id = p.product_id
WHERE o.order_date >= '2024-01-01';
```

### 🔬 Every join, with actual output

Two small tables:

**`customers`**

| id | name |
|---|---|
| 1 | Ana |
| 2 | Ben |
| 3 | Cal |

**`orders`**

| order_id | cust_id | amount |
|---|---|---|
| 101 | 1 | 50 |
| 102 | 1 | 75 |
| 103 | 2 | 20 |
| 104 | **9** | 30 |

Note: Cal has no orders, and order 104 points to a customer that doesn't exist (an orphan — this is exactly what a foreign key would have prevented).

```sql
SELECT c.name, o.order_id, o.amount
FROM customers c
INNER JOIN orders o ON c.id = o.cust_id;
```
| name | order_id | amount |
|---|---|---|
| Ana | 101 | 50 |
| Ana | 102 | 75 |
| Ben | 103 | 20 |

→ **3 rows.** Cal vanishes (no orders). Order 104 vanishes (no customer). Ana appears **twice** — one row per match, not one row per customer.

```sql
LEFT JOIN orders o ON c.id = o.cust_id
```
| name | order_id | amount |
|---|---|---|
| Ana | 101 | 50 |
| Ana | 102 | 75 |
| Ben | 103 | 20 |
| Cal | NULL | NULL |

→ **4 rows.** Every customer is preserved; Cal gets NULLs. Order 104 still vanishes.

```sql
RIGHT JOIN orders o ON c.id = o.cust_id
```
| name | order_id | amount |
|---|---|---|
| Ana | 101 | 50 |
| Ana | 102 | 75 |
| Ben | 103 | 20 |
| NULL | 104 | 30 |

→ **4 rows.** Every order preserved; the orphan surfaces with a NULL name. This is a useful data-quality audit.

```sql
FULL OUTER JOIN orders o ON c.id = o.cust_id
```
| name | order_id | amount |
|---|---|---|
| Ana | 101 | 50 |
| Ana | 102 | 75 |
| Ben | 103 | 20 |
| Cal | NULL | NULL |
| NULL | 104 | 30 |

→ **5 rows.** Nothing is lost from either side.

```sql
CROSS JOIN orders o
```
→ **12 rows** (3 × 4). Every customer paired with every order, meaningfully or not.

```sql
-- Anti-join: customers with no orders
LEFT JOIN orders o ON c.id = o.cust_id WHERE o.order_id IS NULL
```
| name |
|---|
| Cal |

→ **1 row.** The `WHERE ... IS NULL` keeps only the rows the LEFT JOIN padded — i.e. the non-matches. Memorize this pattern; it answers a huge class of "find the missing ones" questions.

### ⚠️ Why your row count exploded

The single most common confusion in SQL: **a join multiplies rows.** If a customer has 3 orders and you join, that customer's name appears 3 times. If you then join to `order_items` and one of those orders has 4 items, you get 12 rows for that customer.

```sql
-- ❌ This double-counts! Each order's amount repeats once per item.
SELECT c.name, SUM(o.amount)
FROM customers c
JOIN orders o      ON c.id = o.cust_id
JOIN order_items i ON o.order_id = i.order_id
GROUP BY c.name;
```

```sql
-- ✅ Aggregate at the right grain: pre-aggregate, then join
SELECT c.name, t.total
FROM customers c
JOIN (SELECT cust_id, SUM(amount) AS total FROM orders GROUP BY cust_id) t
  ON c.id = t.cust_id;
```

> **Diagnostic habit:** if a `SUM` looks too big, run the query without the aggregate and count the rows. Inflated totals are almost always fan-out from a join, not bad data. `SELECT DISTINCT` will *hide* the symptom while leaving the `SUM` wrong — never use it as the fix.

1. Using the tables above, how many rows does `customers LEFT JOIN orders ON 1=1` return, and why?
2. Write a query returning orders whose `cust_id` matches no customer, without using `RIGHT JOIN`.
3. A `LEFT JOIN` returns exactly as many rows as the left table has. What does that tell you about the relationship between the two tables?

### The most common join bug

Putting a filter on the right table in `WHERE` silently converts a `LEFT JOIN` into an `INNER JOIN`:

```sql
-- ❌ Drops customers with no orders — WHERE runs after the join and rejects NULLs
LEFT JOIN orders o ON c.customer_id = o.customer_id
WHERE o.status = 'shipped';

-- ✅ Put the condition in ON so it applies during matching
LEFT JOIN orders o ON c.customer_id = o.customer_id AND o.status = 'shipped';
```

**Rule:** conditions on the *outer* (preserved) table go in `WHERE`; conditions on the *optional* table go in `ON`.

### Join algorithms (what the optimizer picks)

| Algorithm | How it works | Best when |
|---|---|---|
| **Nested loop** | For each row in A, scan B | Small A, indexed B |
| **Hash join** | Build hash table on smaller side, probe with larger | Large unsorted sets, equality joins |
| **Merge join** | Sort both, walk in parallel | Both inputs already sorted/indexed |

MySQL historically only had nested loop (plus hash join since 8.0.18). SQL Server and PostgreSQL use all three.

## 11. Aggregate Functions

Aggregates collapse many rows into one value. They **ignore NULLs** (except `COUNT(*)`).

| Function | Returns |
|---|---|
| `COUNT(*)` | Number of rows, NULLs included |
| `COUNT(col)` | Number of **non-NULL** values in col |
| `COUNT(DISTINCT col)` | Number of distinct non-NULL values |
| `SUM(col)` | Total |
| `AVG(col)` | Mean (of non-NULL values only) |
| `MIN(col)` / `MAX(col)` | Smallest / largest (works on text and dates too) |
| `STDDEV` / `STDEV` | Standard deviation (MySQL/Postgres / SQL Server) |
| `VARIANCE` / `VAR` | Variance |
| `GROUP_CONCAT(col)` | Concatenate values — **MySQL** |
| `STRING_AGG(col, ',')` | Concatenate — **SQL Server 2017+, PostgreSQL** |

```sql
SELECT
    category_id,
    COUNT(*)              AS product_count,
    COUNT(discount)       AS products_with_discount,   -- excludes NULLs!
    SUM(stock)            AS total_stock,
    ROUND(AVG(price), 2)  AS avg_price,
    MIN(price)            AS cheapest,
    MAX(price)            AS priciest,
    MAX(price)-MIN(price) AS price_range
FROM products
WHERE discontinued = 0
GROUP BY category_id
HAVING COUNT(*) >= 5
ORDER BY avg_price DESC;
```

### 🔬 Why COUNT has three forms

Given this `reviews` table:

| id | product_id | rating |
|---|---|---|
| 1 | 10 | 5 |
| 2 | 10 | 5 |
| 3 | 10 | NULL |
| 4 | 20 | 3 |

```sql
SELECT COUNT(*)               AS a,   -- 4  : every row
       COUNT(rating)          AS b,   -- 3  : non-NULL ratings only
       COUNT(DISTINCT rating) AS c,   -- 2  : the values 5 and 3
       SUM(rating)            AS d,   -- 13 : NULL contributes nothing
       AVG(rating)            AS e    -- 4.33 (13/3), NOT 3.25 (13/4)
FROM reviews;
```

The gap between `COUNT(*)` = 4 and `COUNT(rating)` = 3 is your missing-data count — a free data-quality check:

```sql
SELECT COUNT(*) - COUNT(rating) AS missing_ratings,
       ROUND(100.0*(COUNT(*)-COUNT(rating))/COUNT(*), 1) AS pct_missing
FROM reviews;
```

> 💡 `COUNT(1)` and `COUNT(*)` are identical in every modern engine — the old folklore that one is faster is untrue. Use `COUNT(*)`.

### The AVG + NULL trap
`AVG(col)` divides by the count of *non-NULL* values, not by the row count. If NULL should mean zero, be explicit:
```sql
AVG(COALESCE(rating, 0))     -- treats missing as 0
SUM(rating) / COUNT(*)       -- same effect, explicit denominator
```

### Conditional aggregation (pivoting without PIVOT)
An extremely useful pattern — put a `CASE` inside the aggregate:
```sql
SELECT
    region,
    COUNT(*)                                              AS total_orders,
    SUM(CASE WHEN status='shipped'   THEN 1 ELSE 0 END)   AS shipped,
    SUM(CASE WHEN status='cancelled' THEN 1 ELSE 0 END)   AS cancelled,
    SUM(CASE WHEN status='shipped' THEN amount ELSE 0 END) AS shipped_revenue,
    ROUND(100.0 * SUM(CASE WHEN status='shipped' THEN 1 ELSE 0 END)/COUNT(*), 1) AS pct_shipped
FROM orders
GROUP BY region;
```

### String aggregation
```sql
-- MySQL
SELECT order_id, GROUP_CONCAT(product_name ORDER BY product_name SEPARATOR ', ') AS items
FROM order_view GROUP BY order_id;

-- SQL Server 2017+ / PostgreSQL
SELECT order_id, STRING_AGG(product_name, ', ') WITHIN GROUP (ORDER BY product_name) AS items
FROM order_view GROUP BY order_id;   -- (WITHIN GROUP is SQL Server; Postgres uses STRING_AGG(x, ',' ORDER BY x))
```

### GROUP BY extensions

```sql
-- ROLLUP: adds subtotals and a grand total
SELECT region, product, SUM(amount)
FROM sales GROUP BY ROLLUP(region, product);        -- SQL Server/Postgres
GROUP BY region, product WITH ROLLUP;               -- MySQL syntax

-- CUBE: every combination of subtotals
GROUP BY CUBE(region, product);                     -- SQL Server/Postgres

-- GROUPING SETS: exactly the combinations you name
GROUP BY GROUPING SETS ((region), (product), ());
```

| Task | MySQL | SQL Server | PostgreSQL |

| Length | `LENGTH()` (bytes), `CHAR_LENGTH()` | `LEN()` (ignores trailing spaces) | `LENGTH()`, `CHAR_LENGTH()` |
| Upper / lower | `UPPER()` / `LOWER()` | `UPPER()` / `LOWER()` | `UPPER()` / `LOWER()` |
| Concatenate | `CONCAT()`, `CONCAT_WS()` | `CONCAT()`, `+`, `CONCAT_WS()` | `CONCAT()`, `\|\|` |
| Substring | `SUBSTRING(s,pos,len)` | `SUBSTRING(s,pos,len)` | `SUBSTRING(s FROM p FOR l)` |
| Left / right | `LEFT()`, `RIGHT()` | `LEFT()`, `RIGHT()` | `LEFT()`, `RIGHT()` |
| Trim | `TRIM()`, `LTRIM()`, `RTRIM()` | `TRIM()`, `LTRIM()`, `RTRIM()` | `TRIM()`, `BTRIM()` |
| Replace | `REPLACE()` | `REPLACE()` | `REPLACE()` |
| Find position | `LOCATE()`, `INSTR()`, `POSITION()` | `CHARINDEX()`, `PATINDEX()` | `POSITION()`, `STRPOS()` |
| Reverse | `REVERSE()` | `REVERSE()` | `REVERSE()` |
| Pad | `LPAD()`, `RPAD()` | `REPLICATE()`+concat | `LPAD()`, `RPAD()` |
| Repeat | `REPEAT()` | `REPLICATE()` | `REPEAT()` |
| Split | `SUBSTRING_INDEX()` | `STRING_SPLIT()` | `SPLIT_PART()` |
| Format number | `FORMAT()` | `FORMAT()` | `TO_CHAR()` |

> ⚠️ **String indexes start at 1 in SQL, not 0.**

```sql
-- Practical cleaning examples
SELECT
    CONCAT(first_name, ' ', last_name)                AS full_name,
    CONCAT_WS(', ', city, state, zip)                 AS address,   -- skips NULLs
    UPPER(LEFT(first_name,1))                         AS initial,
    LENGTH(TRIM(email))                               AS email_len,
    SUBSTRING(phone, 1, 3)                            AS area_code,
    REPLACE(REPLACE(phone,'-',''),' ','')             AS digits_only,
    LPAD(CAST(id AS CHAR), 8, '0')                    AS padded_id,
    SUBSTRING_INDEX(email, '@', -1)                   AS domain      -- MySQL
FROM contacts;
```

Common recipes:
```sql
-- Proper Case
CONCAT(UPPER(LEFT(name,1)), LOWER(SUBSTRING(name,2)))

-- Extract domain from email (portable)
SUBSTRING(email, POSITION('@' IN email) + 1)

-- Everything before the first space
LEFT(full_name, LOCATE(' ', full_name) - 1)

-- Mask a card number
CONCAT(REPEAT('*', 12), RIGHT(card_number, 4))
```

## 13. Numeric & Math Functions

| Function | Meaning | Example → Result |
|---|---|---|
| `ABS(x)` | Absolute value | `ABS(-7)` → 7 |
| `CEIL(x)` / `CEILING(x)` | Round up | `CEIL(4.1)` → 5 |
| `FLOOR(x)` | Round down | `FLOOR(4.9)` → 4 |
| `ROUND(x, d)` | Round to d decimals | `ROUND(3.14159, 2)` → 3.14 |
| `TRUNCATE(x,d)` / `TRUNC` | Chop, don't round | `TRUNCATE(3.99, 1)` → 3.9 |
| `MOD(x,y)` or `x % y` | Remainder | `MOD(10,3)` → 1 |
| `POWER(x,y)` | Exponent | `POWER(2,10)` → 1024 |
| `SQRT(x)` | Square root | `SQRT(16)` → 4 |
| `EXP(x)`, `LOG(x)`, `LOG10(x)` | Exponential/logarithms | |
| `SIGN(x)` | −1, 0, or 1 | `SIGN(-5)` → −1 |
| `PI()` | 3.14159… | |
| `RAND()` / `RANDOM()` / `NEWID()` | Random value | MySQL / Postgres / SQL Server |
| `GREATEST()`, `LEAST()` | Max/min of a list | MySQL/Postgres (SQL Server 2022+) |

```sql
-- Percentage of total (beware integer division!)
SELECT
    category,
    SUM(amount) AS revenue,
    ROUND(100.0 * SUM(amount) / (SELECT SUM(amount) FROM sales), 2) AS pct_of_total
FROM sales GROUP BY category;
```

> ➗ **Integer division trap:** in most engines `5/2 = 2`, not 2.5. Multiply by `1.0` or cast: `1.0 * a / b` or `CAST(a AS DECIMAL(10,2)) / b`.

> ➗ **Divide by zero:** guard with `NULLIF`: `SUM(profit) / NULLIF(SUM(revenue), 0)` returns NULL instead of erroring.

## 14. Date & Time Functions

### Getting "now"

| | MySQL | SQL Server | PostgreSQL |
|---|---|---|---|
| Date+time | `NOW()`, `CURRENT_TIMESTAMP` | `GETDATE()`, `SYSDATETIME()` | `NOW()`, `CURRENT_TIMESTAMP` |
| UTC | `UTC_TIMESTAMP()` | `GETUTCDATE()` | `NOW() AT TIME ZONE 'UTC'` |
| Date only | `CURDATE()` | `CAST(GETDATE() AS DATE)` | `CURRENT_DATE` |

### Extracting parts

```sql
-- Portable ANSI
EXTRACT(YEAR FROM order_date)
EXTRACT(MONTH FROM order_date)

-- MySQL
YEAR(d), MONTH(d), DAY(d), HOUR(d), MINUTE(d), QUARTER(d),
DAYNAME(d), MONTHNAME(d), DAYOFWEEK(d), WEEK(d), DAYOFYEAR(d)

-- SQL Server
DATEPART(year, d), DATEPART(quarter, d), DATENAME(month, d), DATENAME(weekday, d)

-- PostgreSQL
DATE_PART('year', d), TO_CHAR(d, 'Month'), DATE_TRUNC('month', d)
```

### Arithmetic

```sql
-- MySQL
DATE_ADD(d, INTERVAL 7 DAY)      DATE_SUB(d, INTERVAL 1 MONTH)
d + INTERVAL 1 YEAR
DATEDIFF(d1, d2)                          -- difference in DAYS
TIMESTAMPDIFF(MONTH, start, end)          -- any unit

-- SQL Server
DATEADD(day, 7, d)               DATEADD(month, -1, d)
DATEDIFF(day, d1, d2)                     -- note: arg order is (unit, start, end)

-- PostgreSQL
d + INTERVAL '7 days'            d - INTERVAL '1 month'
AGE(d1, d2)                               -- symbolic interval
(d2 - d1)                                 -- integer days for DATE type
```

> ⚠️ `DATEDIFF` argument order differs! MySQL: `DATEDIFF(later, earlier)`. SQL Server: `DATEDIFF(unit, earlier, later)`.

### Formatting

```sql
DATE_FORMAT(d, '%Y-%m-%d %H:%i:%s')       -- MySQL
FORMAT(d, 'yyyy-MM-dd HH:mm:ss')          -- SQL Server 2012+
CONVERT(VARCHAR, d, 120)                  -- SQL Server style codes (120 = ODBC)
TO_CHAR(d, 'YYYY-MM-DD HH24:MI:SS')       -- PostgreSQL / Oracle
```

### Truncation & bucketing

```sql
-- First day of the month
DATE_FORMAT(d, '%Y-%m-01')                       -- MySQL
DATEFROMPARTS(YEAR(d), MONTH(d), 1)              -- SQL Server
DATE_TRUNC('month', d)                           -- PostgreSQL

-- Monthly revenue report (MySQL)
SELECT DATE_FORMAT(order_date, '%Y-%m') AS month, SUM(amount) AS revenue
FROM orders GROUP BY 1 ORDER BY 1;
```

### Age calculation done correctly
```sql
-- MySQL
TIMESTAMPDIFF(YEAR, birth_date, CURDATE())
-- SQL Server (DATEDIFF(year,...) is wrong — it counts calendar year boundaries)
DATEDIFF(YEAR, birth_date, GETDATE())
  - CASE WHEN MONTH(birth_date)*100 + DAY(birth_date) > MONTH(GETDATE())*100 + DAY(GETDATE())
         THEN 1 ELSE 0 END
```

### 🔴 The single biggest date performance mistake

```sql
-- ❌ Function on the column = index cannot be used (non-sargable)
WHERE YEAR(order_date) = 2024
WHERE DATE(created_at) = '2024-05-01'

-- ✅ Range predicate = index seek
WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'
WHERE created_at >= '2024-05-01' AND created_at < '2024-05-02'
```

**Sargable** ("Search ARGument ABLE") means the predicate can use an index. Keep the column bare on the left side of the comparison.

## 15. NULL Handling & Conditional Logic

### What NULL means
NULL is **unknown**, not zero and not empty string. Any arithmetic or comparison with NULL yields NULL/UNKNOWN.

```sql
NULL = NULL        -- UNKNOWN (not TRUE!)
NULL + 5           -- NULL
'' = NULL          -- UNKNOWN
WHERE col = NULL   -- ❌ never matches
WHERE col IS NULL  -- ✅ correct
```

### Three-valued logic

| AND | TRUE | FALSE | NULL |
|---|---|---|---|
| **TRUE** | TRUE | FALSE | NULL |
| **FALSE** | FALSE | FALSE | FALSE |
| **NULL** | NULL | FALSE | NULL |

| OR | TRUE | FALSE | NULL |
|---|---|---|---|
| **TRUE** | TRUE | TRUE | TRUE |
| **FALSE** | TRUE | FALSE | NULL |
| **NULL** | TRUE | NULL | NULL |

Only rows where `WHERE` evaluates to **TRUE** are returned — UNKNOWN rows are dropped.

### 🔬 Watch NULL propagate

```sql
SELECT 5 + NULL              AS a,   -- NULL  (arithmetic)
       'abc' = NULL          AS b,   -- NULL  (comparison)
       NULL = NULL           AS c,   -- NULL  (not TRUE!)
       NULL <> NULL          AS d,   -- NULL
       CONCAT('a', NULL)     AS e,   -- MySQL: NULL / SQL Server: 'a'  ⚠️ differs!
       COALESCE(NULL, 0) + 5 AS f;   -- 5     (handled)
```

**Where it bites in real queries:**

```sql
-- ❌ Silently excludes every employee whose bonus is NULL
SELECT * FROM employees WHERE salary + bonus > 100000;

-- ✅ Treat missing bonus as zero
SELECT * FROM employees WHERE salary + COALESCE(bonus, 0) > 100000;
```

```sql
-- ❌ Does NOT return rows where status is NULL — those are "unknown", not "not shipped"
SELECT * FROM orders WHERE status <> 'shipped';

-- ✅ Be explicit about what you mean
SELECT * FROM orders WHERE status <> 'shipped' OR status IS NULL;
```

**NULL-safe equality** (useful when comparing two nullable columns, where you want NULL=NULL to be true):
```sql
WHERE a <=> b                                    -- MySQL null-safe operator
WHERE a IS NOT DISTINCT FROM b                   -- PostgreSQL / ANSI
WHERE (a = b) OR (a IS NULL AND b IS NULL)       -- portable
```

**Three ways to represent "no value" — pick deliberately**

| Representation | Means | Sorts / aggregates as |
|---|---|---|
| `NULL` | Unknown or not applicable | Excluded from aggregates |
| `''` (empty string) | Known to be empty | A real value, counted |
| `0` / `-1` sentinel | A value you chose | Distorts `AVG` and `MIN` |

Mixing these in one column is a common source of bugs. Decide once per column and enforce it with `NOT NULL` + `DEFAULT` where appropriate.

### NULL functions

| Function | Engines | Behavior |
|---|---|---|
| `COALESCE(a,b,c,…)` | All (ANSI) | First non-NULL argument |
| `IFNULL(a,b)` | MySQL | 2-arg version |
| `ISNULL(a,b)` | SQL Server | 2-arg version |
| `NVL(a,b)` | Oracle | 2-arg version |
| `NULLIF(a,b)` | All | NULL if a=b, else a |

```sql
SELECT
    COALESCE(nickname, first_name, 'Anonymous')  AS display_name,
    COALESCE(phone, mobile, email, 'no contact') AS contact,
    revenue / NULLIF(orders, 0)                  AS avg_order_value   -- safe division
FROM customers;
```

### CASE — SQL's if/else

```sql
-- Searched CASE (most flexible)
SELECT name, salary,
    CASE
        WHEN salary >= 100000 THEN 'Senior'
        WHEN salary >=  60000 THEN 'Mid'
        WHEN salary >=  40000 THEN 'Junior'
        ELSE 'Entry'
    END AS level
FROM employees;

-- Simple CASE (equality only)
CASE status
    WHEN 'A' THEN 'Active'
    WHEN 'I' THEN 'Inactive'
    ELSE 'Unknown'
END
```
Rules: evaluated top-down, first match wins; without `ELSE` unmatched rows get NULL; all branches must return compatible types.

Shorthand equivalents:
```sql
IF(condition, true_val, false_val)     -- MySQL
IIF(condition, true_val, false_val)    -- SQL Server 2012+
```

`CASE` also works in `ORDER BY` (custom sort order) and `UPDATE`:
```sql
ORDER BY CASE priority WHEN 'high' THEN 1 WHEN 'med' THEN 2 ELSE 3 END;

UPDATE products
SET price = CASE
    WHEN category='electronics' THEN price * 0.90
    WHEN category='clothing'    THEN price * 0.80
    ELSE price
END;
```

## 16. Conversion & Casting

```sql
CAST(expr AS type)                 -- ANSI standard, portable
CONVERT(type, expr)                -- SQL Server (note reversed argument order!)
CONVERT(expr, type)                -- MySQL
expr::type                         -- PostgreSQL shorthand
TRY_CAST(expr AS type)             -- SQL Server: NULL instead of error
TRY_CONVERT(type, expr)            -- SQL Server
```

```sql
SELECT
    CAST('123'      AS SIGNED)         AS num,       -- MySQL: SIGNED/UNSIGNED
    CAST('123'      AS INT)            AS num2,      -- SQL Server/Postgres
    CAST(price      AS CHAR)           AS price_txt,
    CAST('2024-01-15' AS DATE)         AS dt,
    CAST(19.99 AS DECIMAL(10,2))       AS money_val;
```

**Implicit conversion is a hidden performance killer.** Comparing a `VARCHAR` column to an integer literal forces the engine to convert *every row* of the column, defeating the index:
```sql
WHERE varchar_id = 12345      -- ❌ implicit conversion, index scan
WHERE varchar_id = '12345'    -- ✅ index seek
```

## 17. Window (Analytic) Functions

Window functions compute across a set of rows **without collapsing them** — the crucial difference from aggregates. This is the most valuable "intermediate → advanced" SQL skill.

### Syntax
```sql
function() OVER (
    PARTITION BY col     -- optional: restart per group
    ORDER BY col         -- optional: ordering within the partition
    ROWS BETWEEN ...     -- optional: frame
)
```

### 🔬 The core idea, made visible

Compare what `GROUP BY` does to what `OVER()` does on the same data.

**Input:**

| name | dept | salary |
|---|---|---|
| Ana | Sales | 80,000 |
| Ben | Sales | 55,000 |
| Cal | Sales | 55,000 |
| Dia | Eng | 95,000 |
| Eli | Eng | 85,000 |

```sql
-- AGGREGATE: 5 rows in, 2 rows out. Detail is destroyed.
SELECT dept, AVG(salary) FROM employees GROUP BY dept;
```
| dept | avg |
|---|---|
| Sales | 63,333 |
| Eng | 90,000 |

```sql
-- WINDOW: 5 rows in, 5 rows out. Detail is preserved AND enriched.
SELECT name, dept, salary,
       AVG(salary) OVER (PARTITION BY dept) AS dept_avg,
       salary - AVG(salary) OVER (PARTITION BY dept) AS diff_from_avg
FROM employees;
```
| name | dept | salary | dept_avg | diff_from_avg |
|---|---|---|---|---|
| Ana | Sales | 80,000 | 63,333 | +16,667 |
| Ben | Sales | 55,000 | 63,333 | −8,333 |
| Cal | Sales | 55,000 | 63,333 | −8,333 |
| Dia | Eng | 95,000 | 90,000 | +5,000 |
| Eli | Eng | 85,000 | 90,000 | −5,000 |

**That's the whole idea.** `PARTITION BY` is "GROUP BY that doesn't collapse." Everything else is variations on which rows the window includes.

### Ranking functions compared on ties

```sql
SELECT name, salary,
       ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn,
       RANK()       OVER (ORDER BY salary DESC) AS rnk,
       DENSE_RANK() OVER (ORDER BY salary DESC) AS dr
FROM employees WHERE dept = 'Sales';
```

| name | salary | rn | rnk | dr |
|---|---|---|---|---|
| Ana | 80,000 | 1 | 1 | 1 |
| Ben | 55,000 | 2 | **2** | **2** |
| Cal | 55,000 | 3 | **2** | **2** |

Ben and Cal are tied. `ROW_NUMBER` breaks the tie arbitrarily (2 and 3 — and which one gets 2 may change between runs!). `RANK` gives both 2 and would give the next person 4. `DENSE_RANK` gives both 2 and the next person 3.

**Choosing:** need exactly one row per group (deduplication, pagination)? `ROW_NUMBER`. Reporting a leaderboard where ties genuinely tie? `RANK` or `DENSE_RANK`. Need deterministic `ROW_NUMBER`? Add a tiebreaker: `ORDER BY salary DESC, emp_id`.

### 🔬 Running totals and LAG, step by step

```sql
SELECT month, revenue,
       SUM(revenue) OVER (ORDER BY month)                    AS running_total,
       LAG(revenue)  OVER (ORDER BY month)                   AS prev_month,
       revenue - LAG(revenue) OVER (ORDER BY month)          AS change
FROM monthly_sales;
```

| month | revenue | running_total | prev_month | change |
|---|---|---|---|---|
| 2024-01 | 100 | 100 | NULL | NULL |
| 2024-02 | 150 | 250 | 100 | +50 |
| 2024-03 | 120 | 370 | 150 | −30 |
| 2024-04 | 200 | 570 | 120 | +80 |

Read row by row: `running_total` at March is 100+150+120 because the default frame with `ORDER BY` is "everything from the start up to the current row." `prev_month` is NULL in January because there is no earlier row — always guard the growth calculation with `NULLIF` and expect a NULL first row.

### Frames, illustrated

For the row `2024-03` in the table above:

```
ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW   → Jan, Feb, Mar    (default; cumulative)
ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING           → Feb, Mar, Apr    (centered 3-row window)
ROWS BETWEEN 2 PRECEDING AND CURRENT ROW           → Jan, Feb, Mar    (trailing 3-month average)
ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING → all 4      (whole partition)
```

> ⚠️ **`ROWS` vs `RANGE`:** `ROWS` counts physical rows. `RANGE` counts logical values — with ties, `RANGE` includes *all* peer rows with the same `ORDER BY` value. If two rows share a date, `ROWS 1 PRECEDING` takes one of them; `RANGE` takes both. When in doubt, use `ROWS`.

🧠 **Check yourself (17.1)**
1. You need the top 2 earners per department. Which ranking function, and where does the `<= 2` filter go?
2. Why does `LAST_VALUE(x) OVER (ORDER BY d)` return the current row's value instead of the last one?
3. What's the difference between `SUM(x) OVER ()` and `SUM(x)` with no `GROUP BY`?

### Ranking functions

| Function | Ties get | Gaps after ties? |
|---|---|---|
| `ROW_NUMBER()` | Different numbers (arbitrary) | n/a |
| `RANK()` | Same number | Yes → 1,2,2,4 |
| `DENSE_RANK()` | Same number | No → 1,2,2,3 |
| `NTILE(n)` | Split into n buckets | — |
| `PERCENT_RANK()`, `CUME_DIST()` | Relative position 0–1 | — |

```sql
SELECT name, department, salary,
    ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS rn,
    RANK()       OVER (PARTITION BY department ORDER BY salary DESC) AS rnk,
    DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS dense,
    NTILE(4)     OVER (ORDER BY salary DESC)                         AS quartile
FROM employees;
```

**Top-N per group** — the killer use case:
```sql
WITH ranked AS (
    SELECT name, department, salary,
           ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS rn
    FROM employees
)
SELECT name, department, salary FROM ranked WHERE rn <= 3;
```
(Remember: you can't filter on `rn` in `WHERE` directly — window functions are computed after `WHERE`.)

### Aggregate window functions

```sql
SELECT order_date, amount,
    SUM(amount)  OVER (ORDER BY order_date)                          AS running_total,
    SUM(amount)  OVER (PARTITION BY customer_id)                     AS customer_total,
    AVG(amount)  OVER (ORDER BY order_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS moving_avg_7,
    amount * 100.0 / SUM(amount) OVER ()                             AS pct_of_grand_total,
    COUNT(*)     OVER (PARTITION BY customer_id)                     AS orders_by_customer
FROM orders;
```

### Offset functions — comparing to other rows

```sql
SELECT month, revenue,
    LAG(revenue, 1)  OVER (ORDER BY month)          AS prev_month,
    LEAD(revenue, 1) OVER (ORDER BY month)          AS next_month,
    revenue - LAG(revenue) OVER (ORDER BY month)    AS mom_change,
    ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))
          / NULLIF(LAG(revenue) OVER (ORDER BY month), 0), 2) AS mom_pct,
    FIRST_VALUE(revenue) OVER (ORDER BY month)      AS first_month_rev,
    LAST_VALUE(revenue)  OVER (ORDER BY month
        ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS last_month_rev
FROM monthly_sales;
```

### Frame clauses

```sql
ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW      -- default with ORDER BY: cumulative
ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING              -- 5-row sliding window
ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING  -- whole partition
RANGE BETWEEN INTERVAL '7' DAY PRECEDING AND CURRENT ROW  -- value-based
```

> ⚠️ **`LAST_VALUE` gotcha:** with `ORDER BY` the default frame ends at the current row, so `LAST_VALUE` returns the current row. Always add the explicit `UNBOUNDED FOLLOWING` frame.

### Named windows (cleaner, less repetition)
```sql
SELECT name, salary,
    RANK()       OVER w AS rnk,
    SUM(salary)  OVER w AS dept_total
FROM employees
WINDOW w AS (PARTITION BY department ORDER BY salary DESC);
```

**Support:** SQL Server 2005+ (frames 2012+), PostgreSQL 8.4+, MySQL **8.0+** (not in 5.7), SQLite 3.25+, Oracle 8i+.

## 18. Subqueries, CTEs, and Recursion

### Subquery types

```sql
-- Scalar (returns one value)
SELECT name, salary, (SELECT AVG(salary) FROM employees) AS company_avg FROM employees;

-- Row/column list (with IN)
SELECT * FROM products WHERE category_id IN (SELECT id FROM categories WHERE active=1);

-- Derived table (subquery in FROM — must be aliased)
SELECT dept, avg_sal FROM (
    SELECT department AS dept, AVG(salary) AS avg_sal
    FROM employees GROUP BY department
) AS t
WHERE avg_sal > 70000;

-- Correlated (references the outer query; runs per outer row — can be slow)
SELECT e.name, e.salary
FROM employees e
WHERE e.salary > (SELECT AVG(salary) FROM employees WHERE department = e.department);
```

### CTEs (Common Table Expressions)

`WITH` clauses give subqueries a name. They make complex queries readable and reusable within a statement.

```sql
WITH monthly AS (
    SELECT DATE_FORMAT(order_date,'%Y-%m') AS mo, SUM(amount) AS revenue
    FROM orders GROUP BY 1
),
with_growth AS (
    SELECT mo, revenue,
           LAG(revenue) OVER (ORDER BY mo) AS prev
    FROM monthly
)
SELECT mo, revenue, prev,
       ROUND(100.0*(revenue-prev)/NULLIF(prev,0), 1) AS growth_pct
FROM with_growth
WHERE prev IS NOT NULL
ORDER BY mo;
```

**CTE vs subquery vs temp table**

| | CTE | Derived table | Temp table |
|---|---|---|---|
| Readability | Best | Poor when nested | Good |
| Reusable in same query | Yes | No | Yes |
| Persisted | No | No | Yes (session) |
| Can be indexed | No | No | Yes |
| Good for | Clarity, recursion | Quick one-offs | Large intermediate sets reused many times |

### Recursive CTEs

For hierarchies (org charts, categories, bills of materials) and generated sequences.

```sql
WITH RECURSIVE org_chart AS (          -- MySQL/PostgreSQL need RECURSIVE; SQL Server omits it
    -- Anchor: the top of the tree
    SELECT emp_id, name, manager_id, 1 AS level, CAST(name AS CHAR(500)) AS path
    FROM employees
    WHERE manager_id IS NULL

    UNION ALL

    -- Recursive member: joins back to the CTE
    SELECT e.emp_id, e.name, e.manager_id, oc.level + 1,
           CONCAT(oc.path, ' > ', e.name)
    FROM employees e
    JOIN org_chart oc ON e.manager_id = oc.emp_id
    WHERE oc.level < 10                -- ⚠️ always bound the recursion
)
SELECT level, path FROM org_chart ORDER BY path;
```

Generate a date series (useful for filling gaps in reports):
```sql
WITH RECURSIVE dates AS (
    SELECT DATE '2024-01-01' AS d
    UNION ALL
    SELECT d + INTERVAL 1 DAY FROM dates WHERE d < '2024-12-31'
)
SELECT * FROM dates;
```
SQL Server caps recursion at 100 levels by default — override with `OPTION (MAXRECURSION 1000)`.
