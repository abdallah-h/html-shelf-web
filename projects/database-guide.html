## 36. Learning Path

This is a complete, self-paced curriculum. Six stages, roughly twelve weeks at 6–10 hours per week, then specialization. Each stage lists **what to learn**, **what to build**, **how to know you're done**, and **the mistakes almost everyone makes**.

**How to use it:** don't read ahead. Each stage assumes fluency in the one before it. The single biggest predictor of whether someone actually learns SQL is whether they typed the queries themselves against a database they set up. Reading is not practice.

### Before you start: set up your environment (half a day)

Pick **one** engine and stay with it for the first two months. Switching dialects while learning fundamentals doubles the confusion for no benefit.

| If you want… | Install | Client tool |
|---|---|---|
| The easiest possible start | **SQLite** | DB Browser for SQLite, or the `sqlite3` CLI |
| Web/general purpose | **MySQL 8.0+** (or MariaDB) | MySQL Workbench, DBeaver, or `mysql` CLI |
| Standards + advanced features | **PostgreSQL 14+** | pgAdmin, DBeaver, or `psql` |
| Windows/.NET/enterprise career | **SQL Server Developer Edition** (free) | SQL Server Management Studio (SSMS) or Azure Data Studio |

**Recommendation for beginners:** MySQL 8.0 or PostgreSQL. Both are free, install in minutes, and everything in this guide works on them. SQLite is fine for the first two stages but lacks window functions in older builds, stored procedures, and user management — you'll outgrow it by Stage 4.

Setup checklist:
- [ ] Server installed and running
- [ ] A GUI client connected (DBeaver works with every engine — a good single investment)
- [ ] A scratch database created: `CREATE DATABASE practice;`
- [ ] The practice schema from [Section 29](#29-practice-schema--exercises) loaded
- [ ] A folder of `.sql` files under Git, so you can review your own progress

> 💡 Also load a real public dataset early — the Sakila (MySQL), Chinook (any engine), AdventureWorks (SQL Server), or Northwind sample databases. Practicing on 20 rows you invented teaches nothing about performance or messy data.

---

### Stage 1 — Foundations: reading data (weeks 1–2)

**Goal:** query a single table fluently without looking anything up.

**Topics**
1. What a database and DBMS are; tables, rows, columns
2. Connecting to a server; databases vs schemas
3. `SELECT` — columns, `*`, aliases with `AS`
4. `WHERE` — comparison operators, `AND`/`OR`/`NOT`, parentheses
5. `BETWEEN`, `IN`, `LIKE` with `%` and `_`
6. `IS NULL` / `IS NOT NULL` and why `= NULL` fails
7. `ORDER BY` (ASC/DESC, multiple columns)
8. `LIMIT` / `TOP` and pagination basics
9. `DISTINCT`
10. Basic data types: integers, decimals, varchar, dates, booleans
11. `CREATE TABLE`, `INSERT`, simple `UPDATE`/`DELETE`
12. Comments and formatting conventions

**Practice:** exercises 1–6 in Section 29, plus SQLBolt lessons 1–6 and SQLZoo tutorials 0–3.

**Build:** a personal tracker — books read, workouts, expenses. One table, at least 30 rows you typed yourself, and ten queries answering real questions about it.

**Done when you can, without references:**
- [ ] Write a query filtering on three conditions with correct parenthesization
- [ ] Explain why `WHERE bonus = NULL` returns nothing
- [ ] Sort by one column ascending and another descending in the same query
- [ ] Find all rows where a text column starts with, ends with, or contains a substring
- [ ] Create a table with sensible types and constraints and populate it

**Common beginner mistakes**
- Using `=` with NULL instead of `IS NULL`
- Forgetting that `AND` binds tighter than `OR` → wrong result sets that look plausible
- Running `UPDATE`/`DELETE` without a `WHERE` (turn on safe-update mode *now*)
- Using `SELECT *` habitually — start the good habit early
- Confusing `LIKE 'a%'` (starts with) and `LIKE '%a'` (ends with)

---

### Stage 2 — Relationships: multiple tables (weeks 3–4)

**Goal:** design a normalized schema and query across it.

**Topics**
1. Primary keys — surrogate vs natural
2. Foreign keys and referential integrity; `ON DELETE`/`ON UPDATE` actions
3. Cardinality: 1:1, 1:N, M:N and junction tables
4. `INNER JOIN` — the workhorse
5. `LEFT`/`RIGHT`/`FULL OUTER JOIN` and when each is right
6. The anti-join pattern (`LEFT JOIN … WHERE right.id IS NULL`)
7. Self joins for hierarchies
8. `CROSS JOIN` and accidental cartesian products
9. Table aliases and multi-table joins
10. Normalization: 1NF, 2NF, 3NF (and why you'd denormalize)
11. Constraints: `NOT NULL`, `UNIQUE`, `CHECK`, `DEFAULT`
12. Entity-relationship diagrams

**Practice:** exercises 13–18 in Section 29; SQLZoo tutorials on JOIN and "More JOIN operations."

**Build:** design a schema from scratch for a domain you know — a library, a gym, a small restaurant, a school. Requirements: at least 5 tables, one M:N relationship, one self-reference, all FKs declared, normalized to 3NF. Draw the ERD before writing any DDL. Then write 15 queries that would actually be useful to whoever runs that business.

**Done when you can:**
- [ ] Explain the difference between `INNER` and `LEFT JOIN` with a concrete example
- [ ] Find records in table A with no match in table B
- [ ] Explain what breaks 2NF and 3NF and fix a violating table
- [ ] Model a many-to-many relationship correctly on the first try
- [ ] Say why a filter on the right table belongs in `ON`, not `WHERE`, for a `LEFT JOIN`

**Common mistakes**
- Putting a right-table filter in `WHERE` and silently turning a `LEFT JOIN` into an `INNER JOIN` (see Section 10 — this trips up experienced people too)
- Forgetting a join condition → cartesian explosion
- Reaching for `SELECT DISTINCT` to hide duplicates caused by a bad join, instead of fixing the join
- Storing comma-separated lists in a column (a 1NF violation that costs you for years)
- Over-normalizing tiny lookup tables to the point of unreadability

---

### Stage 3 — Aggregation & built-in functions (weeks 5–6)

**Goal:** turn raw rows into a report.

**Topics**
1. `GROUP BY` mechanics — what actually happens to the rows
2. `COUNT(*)` vs `COUNT(col)` vs `COUNT(DISTINCT col)`
3. `SUM`, `AVG`, `MIN`, `MAX`; how NULLs affect each
4. `HAVING` vs `WHERE` — the difference that defines this stage
5. Grouping by multiple columns; grouping by expressions
6. Conditional aggregation with `CASE` inside `SUM`/`COUNT` (pivoting)
7. String functions: concat, substring, trim, replace, position, case conversion, padding
8. Numeric functions: rounding family, modulo, power, integer-division traps
9. Date functions: extraction, arithmetic, formatting, truncation to month/week
10. `CASE` expressions — searched and simple forms
11. NULL functions: `COALESCE`, `NULLIF`, `IFNULL`/`ISNULL`
12. `CAST`/`CONVERT` and implicit conversion pitfalls
13. `ROLLUP` / `GROUPING SETS` for subtotals

**Practice:** exercises 7–12 and 19–24 in Section 29; HackerRank's "Aggregation" track.

**Build:** a monthly business report from the practice schema — revenue by month, top 10 customers, revenue by category with each category's share of total, order status breakdown as percentages, and a cohort of new vs returning customers. Deliver it as a single `.sql` file with commented sections.

**Done when you can:**
- [ ] State from memory which clauses run before `GROUP BY` and which after
- [ ] Explain why an alias from `SELECT` can't be used in `WHERE` but can in `ORDER BY`
- [ ] Compute a percentage-of-total correctly, avoiding integer division and divide-by-zero
- [ ] Pivot rows to columns using conditional aggregation without a `PIVOT` keyword
- [ ] Bucket dates into months/quarters and produce a gapless-looking time series

**Common mistakes**
- Putting an aggregate in `WHERE` (`WHERE COUNT(*) > 5`) instead of `HAVING`
- Selecting a non-aggregated column that isn't in `GROUP BY` (MySQL before 5.7.5 permitted it and returned an arbitrary value; `ONLY_FULL_GROUP_BY`, the default since 5.7.5, rejects it)
- Assuming `AVG` divides by the row count — it divides by non-NULL count
- `5/2 = 2` integer division silently corrupting percentages
- Wrapping a date column in `YEAR()` in `WHERE` and destroying index usage

---

### Stage 4 — Intermediate SQL: composition & window functions (weeks 7–9)

**Goal:** express genuinely complex logic clearly. This is the stage that separates people who "know SQL" from people who are good at it.

**Week 7 — Composition**
1. Scalar, list, and derived-table subqueries
2. Correlated subqueries — and their performance cost
3. `EXISTS` / `NOT EXISTS`; why `NOT IN` breaks with NULLs
4. CTEs (`WITH`) — naming, chaining, readability
5. Multiple CTEs in one query; refactoring a nested mess into a pipeline
6. Recursive CTEs — hierarchies, date series, bounded recursion
7. Set operators: `UNION`, `UNION ALL`, `INTERSECT`, `EXCEPT`
8. Views and materialized views

**Week 8–9 — Window functions (spend real time here)**
9. The `OVER()` clause: `PARTITION BY`, `ORDER BY`, frames
10. `ROW_NUMBER` vs `RANK` vs `DENSE_RANK` vs `NTILE`
11. The top-N-per-group pattern
12. Aggregate windows: running totals, moving averages, percent of partition
13. `LAG` / `LEAD` for period-over-period comparison
14. `FIRST_VALUE` / `LAST_VALUE` and the default-frame gotcha
15. `ROWS` vs `RANGE` frames
16. Named windows (`WINDOW w AS (…)`)
17. Gaps-and-islands: detecting streaks and consecutive runs
18. Transactions: `BEGIN`/`COMMIT`/`ROLLBACK`, savepoints

**Practice:** exercises 25–32 and 34–37 in Section 29; StrataScratch and DataLemur medium/hard problems, which are almost all window-function problems.

**Build:** an analytics dashboard query set — running revenue, month-over-month growth, customer rank by lifetime value, each customer's first and most recent order, 7-day moving average of orders, and top 3 products per category. Every query written as a CTE pipeline with comments explaining each step.

**Done when you can:**
- [ ] Write a top-N-per-group query from memory
- [ ] Explain why you can't filter on a window function in `WHERE`, and what to do instead
- [ ] Choose correctly between `ROW_NUMBER`, `RANK`, and `DENSE_RANK` for a given requirement
- [ ] Write a running total and a 7-row moving average, and explain the frame clause
- [ ] Write a recursive CTE for an org chart with a depth limit
- [ ] Refactor a triple-nested subquery into readable chained CTEs

**Common mistakes**
- `LAST_VALUE` returning the current row because the default frame ends there
- Forgetting `PARTITION BY` and computing across the whole table
- Filtering a window result in `WHERE` (it's computed at step 5) instead of wrapping in a CTE
- Using `NOT IN` against a subquery that can contain NULL
- `UNION` where `UNION ALL` was correct, paying for an unnecessary sort
- Treating CTEs as guaranteed-materialized temp tables — optimizers may inline them

---

### Stage 5 — Performance, integrity & administration (weeks 10–12)

**Goal:** take a slow query and make it fast, and be able to explain precisely why it was slow.

**Week 10 — Indexing and plans**
1. B-tree structure — why lookups are logarithmic
2. Clustered vs non-clustered indexes
3. Composite indexes and the leftmost-prefix rule
4. Covering indexes and index-only scans
5. Sargability — every pattern in Section 20 that defeats an index
6. Reading execution plans: `EXPLAIN`, `EXPLAIN ANALYZE`, SSMS actual plans
7. Scan vs seek; key lookups; filesort; temporary tables
8. Statistics and cardinality estimation
9. Index maintenance: fragmentation, rebuilds, unused-index detection
10. When *not* to index

**Week 11 — Concurrency and integrity**
11. ACID in depth
12. Isolation levels and the anomalies each prevents
13. Locking, MVCC, `SELECT … FOR UPDATE`
14. Deadlocks — causes, detection, prevention, retry logic
15. Transaction scope and keeping transactions short
16. Stored procedures, functions, triggers — and when they're a bad idea

**Week 12 — Operations and security**
17. Users, roles, `GRANT`/`REVOKE`, least privilege
18. SQL injection: how it works, parameterized queries, defense in depth
19. Backup types; RPO/RTO; point-in-time recovery
20. Restore drills — actually perform one
21. Migrations and schema version control
22. Monitoring: slow query log, Query Store, `pg_stat_statements`

**Practice:** exercises 33 and 38–40 in Section 29. Then: load 1M+ rows into a table (generate them), write a deliberately slow query, read its plan, add an index, and measure the before/after. Do this five times with different anti-patterns.

**Build:** a performance case study document — five slow queries, each with the original plan, the diagnosis, the fix, the new plan, and timings. This is also an excellent portfolio piece and a common interview topic.

**Done when you can:**
- [ ] Read an execution plan and identify the most expensive operator
- [ ] Explain the leftmost-prefix rule and predict which queries an index serves
- [ ] List five things that make a predicate non-sargable
- [ ] Explain the four concurrency anomalies and which isolation level stops each
- [ ] Describe how to prevent deadlocks in application code
- [ ] Write an injection-safe query in your primary programming language
- [ ] Perform a restore from backup into a scratch database

**Common mistakes**
- Adding indexes by guesswork instead of by plan
- Indexing every column ("more indexes = faster") and crushing write performance
- Optimizing before measuring
- Leaving statistics stale and blaming the optimizer
- Using `WITH (NOLOCK)` as a performance fix — it's `READ UNCOMMITTED` and can return wrong data
- Long transactions that hold locks while waiting on application or user work
- Trusting a backup that has never been restored

### Stage 6 — Specialize (month 4 onward)

By now the core is done. Pick **one** track and go deep; the others stay available later.

#### Track A — Backend / application developer
The database is a dependency of your service.
- ORMs (SQLAlchemy, Entity Framework, Hibernate, Prisma) — and knowing when to drop to raw SQL
- The N+1 query problem and eager loading
- Connection pooling and pool sizing
- Schema migrations (Flyway, Liquibase, Alembic, EF Migrations) in CI/CD
- Soft deletes, audit columns, optimistic locking with version columns
- Caching layers (Redis) and cache invalidation
- Read replicas and read/write splitting
- Testing against real databases with containers (Testcontainers)

**Project:** a REST API with a normalized schema, migrations under version control, integration tests, and a documented indexing strategy.

#### Track B — Data analyst / BI
The database is the source of truth for decisions.
- Advanced window functions and analytic patterns
- Dimensional modeling: facts, dimensions, star and snowflake schemas
- Slowly changing dimensions (Type 1/2)
- Cohort, funnel, retention, and attribution analysis
- BI tools: Power BI, Tableau, Looker, Metabase
- Warehouses: Snowflake, BigQuery, Redshift, and columnar storage
- Writing SQL that a stakeholder can read and trust

**Project:** an end-to-end dashboard — raw tables to modeled marts to a published report — with documented metric definitions.

#### Track C — Data engineer
You move and shape data at scale.
- ETL vs ELT; batch vs streaming
- Orchestration: Airflow, Dagster, Prefect
- Transformation: dbt (models, tests, documentation, lineage)
- File formats: Parquet, Avro, ORC; partitioning and clustering
- Spark and distributed processing
- CDC (change data capture), Debezium, Kafka
- Data quality testing and contracts
- Cost and performance tuning on cloud warehouses

**Project:** an ingestion pipeline from an API to a warehouse, transformed with dbt, orchestrated on a schedule, with data-quality tests that fail loudly.

#### Track D — DBA / platform engineer
You keep it alive, fast, and safe.
- Replication: async/sync, primary-replica, multi-primary
- High availability: Always On availability groups, Patroni, Galera, failover clustering
- Partitioning and sharding strategies
- Capacity planning, storage layout, memory configuration
- Deep tuning: buffer pool, WAL/redo, checkpoints, parallelism settings
- Comprehensive backup/DR strategy and runbooks
- Security hardening, encryption at rest and in transit, auditing
- Upgrades and zero-downtime migrations
- Cloud managed services: RDS/Aurora, Azure SQL, Cloud SQL

**Project:** a documented HA setup with replication, an automated backup schedule, a monitoring dashboard, and a written failover runbook you have actually rehearsed.

#### Track E — Multi-engine fluency
If you learned MySQL, now spend two weeks in SQL Server (or vice versa). Use Section 27's translation table as your map. Then add PostgreSQL for `JSONB`, arrays, and extensions. Being credible in two engines noticeably widens the jobs you can take.

### Study method that actually works

1. **Type every query.** Copy-paste teaches your clipboard, not you.
2. **Predict before you run.** Write down what you expect the result to be, then run it. The gap between prediction and reality is the learning.
3. **Break things on purpose.** Remove a join condition, add a NULL, drop an index. Understanding failure modes is most of expertise.
4. **Explain out loud.** If you can't explain `HAVING` to a non-technical friend, you don't know it yet.
5. **Keep an error journal.** Every error message you hit, plus the cause and fix. It becomes the most valuable document you own.
6. **Spaced repetition.** Redo Stage 2 exercises during Stage 4. Retrieval beats rereading.
7. **20 minutes daily beats 3 hours weekly.** SQL rewards accumulated pattern recognition.
8. **Read other people's SQL** — open-source projects, dbt repos, Stack Overflow answers. Steal good patterns.

### Interview preparation checklist

If you're learning SQL for a job, these come up repeatedly:

**Concepts you'll be asked to explain**
- [ ] Difference between `WHERE` and `HAVING`
- [ ] All join types, with a whiteboard example
- [ ] `DELETE` vs `TRUNCATE` vs `DROP`
- [ ] Normalization through 3NF, and when to denormalize
- [ ] What an index is and its trade-offs
- [ ] Clustered vs non-clustered index
- [ ] ACID properties
- [ ] What a deadlock is and how to prevent one
- [ ] `UNION` vs `UNION ALL`
- [ ] Primary key vs unique key
- [ ] How SQL injection works and how to prevent it

**Queries you should be able to write cold**
- [ ] Second-highest salary (and Nth-highest)
- [ ] Nth-highest per department
- [ ] Find and delete duplicate rows
- [ ] Running total
- [ ] Month-over-month growth percentage
- [ ] Top N per group
- [ ] Employees earning more than their manager
- [ ] Customers with no orders
- [ ] Consecutive-day streaks (gaps and islands)
- [ ] Pivot rows into columns

**How to answer a live query question:** restate the requirement, clarify edge cases (ties? NULLs? empty groups?), say your approach out loud before typing, write it in readable formatting, then mention indexes or performance considerations unprompted. That last step is what separates a good candidate from an adequate one.

### Habits that compound

1. **Read execution plans regularly**, not just when something is slow — you'll spot problems before users do.
2. **`SELECT` before you `UPDATE`/`DELETE`** — always. Same `WHERE`, run as a `SELECT COUNT(*)` first.
3. **Wrap risky DML in an explicit transaction** so `ROLLBACK` is available.
4. **Name things consistently** — pick `snake_case`, pick singular or plural table names, use `idx_`/`fk_`/`chk_` prefixes, and never deviate.
5. **Version-control your schema** with numbered migration files; the database schema is source code.
6. **Comment the *why*, not the *what***, in complex queries. `-- exclude test accounts, see TICKET-4412` is worth more than a paragraph describing the join.
7. **Format for readability** — one clause per line, keywords aligned, consistent indentation. Future you will thank present you.
8. **Never `SELECT *` in production code** — it breaks covering indexes, wastes I/O, and silently changes behavior when someone adds a column.
9. **Parameterize every query touching user input**, without exception, even for internal tools.
10. **Store timestamps in UTC and money in `DECIMAL`** — two decisions that are painful to reverse later.
11. **Keep a personal snippets file** of patterns you've solved. You will need the gaps-and-islands query again.
12. **Test your restores.** Quarterly, into a scratch environment, with a stopwatch.

## Quick Reference Card

```sql
-- The shape of every query
SELECT   cols            -- 5. what to show
FROM     table           -- 1. source
JOIN     other ON ...    -- 2. combine
WHERE    row_filter      -- 3. filter rows
GROUP BY cols            -- 4a. collapse
HAVING   group_filter    -- 4b. filter groups
ORDER BY cols            -- 7. sort
LIMIT    n;              -- 8. trim

-- Ten rules worth memorizing
1. WHERE filters rows, HAVING filters groups.
2. NULL is unknown: use IS NULL, never = NULL.
3. Prefer NOT EXISTS over NOT IN (NULL safety).
4. Never put a function on an indexed column in WHERE.
5. LEFT JOIN filters belong in ON, not WHERE.
6. Money is DECIMAL, never FLOAT.
7. Timestamps are stored in UTC.
8. Always parameterize user input.
9. UNION ALL unless you truly need dedup.
10. Read the execution plan before optimizing.
```

<a name="appendix-b-error-messages-decoded"></a>
## Appendix B. Error Messages Decoded

The fastest way to get unstuck is recognizing what the engine is actually complaining about.

### Constraint and integrity errors

| Message (varies by engine) | What it means | Fix |
|---|---|---|
| `Duplicate entry 'x' for key 'email'` / `Violation of UNIQUE KEY constraint` | You inserted a value that already exists in a unique column | Check first, or use an upsert (`ON DUPLICATE KEY UPDATE` / `ON CONFLICT` / `MERGE`) |
| `Cannot add or update a child row: a foreign key constraint fails` | The FK value has no matching parent row | Insert the parent first, or fix the ID. Check for typos and case sensitivity |
| `Cannot delete or update a parent row` | Child rows still reference this row | Delete children first, or define `ON DELETE CASCADE` deliberately |
| `Column 'x' cannot be null` | `NOT NULL` violated | Supply a value or add a `DEFAULT` |
| `Check constraint 'chk_price' is violated` | Value failed a `CHECK` | The data is wrong, or the rule is |
| `Data too long for column 'name'` / `String or binary data would be truncated` | Value exceeds the declared length | Widen the column or truncate/validate input |
| `Out of range value for column` | Numeric overflow (e.g. 40,000 into `SMALLINT`) | Use a wider type |

### Query errors

| Message | Meaning | Fix |
|---|---|---|
| `Unknown column 'total' in 'where clause'` | Using a `SELECT` alias in `WHERE` | Repeat the expression, or wrap in a subquery/CTE |
| `Expression #1 of SELECT list is not in GROUP BY clause and contains a nonaggregated column` | Selecting a column that is neither grouped nor aggregated | Add it to `GROUP BY` or wrap it in an aggregate |
| `Invalid use of group function` / `An aggregate may not appear in the WHERE clause` | Aggregate in `WHERE` | Move it to `HAVING` |
| `Subquery returns more than 1 row` | A scalar context got multiple rows | Add `LIMIT 1`, an aggregate, or use `IN`/`EXISTS` |
| `Every derived table must have its own alias` | Subquery in `FROM` with no alias | Add `AS t` |
| `Ambiguous column name 'id'` | Two joined tables both have that column | Qualify it: `c.id` |
| `Operand should contain 1 column(s)` | Column-count mismatch, often in a subquery or `UNION` | Match the column lists |
| `Windowed functions can only appear in the SELECT or ORDER BY clauses` | Window function in `WHERE`/`HAVING` | Wrap the query in a CTE and filter outside |
| `Conversion failed when converting the varchar value 'abc' to data type int` | Implicit cast failed | Use `TRY_CAST`/`TRY_CONVERT`, or clean the data |
| `Incorrect datetime value: '2024-13-01'` | Invalid date literal | Use ISO format `YYYY-MM-DD` and validate |
| `Division by zero` | A denominator was 0 | Guard with `NULLIF(denom, 0)` |
| `Maximum recursion 100 has been exhausted` | Recursive CTE ran away | Add a depth guard; check for cycles; `OPTION (MAXRECURSION n)` |

### Concurrency and connection errors

| Message | Meaning | Fix |
|---|---|---|
| `Deadlock found when trying to get lock; try restarting transaction` | Lock cycle; your transaction was the victim | Retry with backoff; order your locks consistently |
| `Lock wait timeout exceeded` | Waited too long for a lock someone else holds | Shorten transactions; find the blocker; check for an uncommitted session |
| `Too many connections` | Connection pool or limit exhausted | Fix pool sizing, close connections, raise `max_connections` |
| `Access denied for user 'x'@'host'` | Auth or host-matching failure | Check credentials and the host portion of the MySQL user spec |
| `The transaction log for database is full` | Log growth outran backups (SQL Server) | Back up the log; check the recovery model |

> 💡 **Habit:** keep an error journal. Every message you hit, plus the cause and the fix, in one file. Within a few months it becomes the single most valuable document you own — most errors you hit are ones you've hit before.

<a name="appendix-c-anti-pattern-gallery"></a>
## Appendix C. Anti-Pattern Gallery

Twelve mistakes that appear in real production code, why they hurt, and what to do instead.

### 1. Comma-separated values in a column
```sql
-- ❌
tags VARCHAR(255)  -- 'sql,database,tutorial'
WHERE tags LIKE '%sql%'   -- also matches 'nosql', can't index, can't count
-- ✅ A junction table
CREATE TABLE post_tags (post_id INT, tag_id INT, PRIMARY KEY (post_id, tag_id));
```
**Cost:** no integrity, no index, no aggregation, false matches. This one violation compounds for years.

### 2. `SELECT *` in application code
```sql
-- ❌ SELECT * FROM orders
-- ✅ SELECT order_id, order_date, status FROM orders
```
**Cost:** defeats covering indexes, ships unused bytes over the network, and silently changes your result shape when someone adds a column — breaking positional code and ORM mappings.

### 3. `DISTINCT` used to hide a join bug
```sql
-- ❌ SELECT DISTINCT c.name FROM customers c JOIN orders o ... JOIN items i ...
-- ✅ Fix the grain: use EXISTS, or pre-aggregate
SELECT c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id=c.customer_id);
```
**Cost:** an expensive sort that masks the real problem — and any `SUM` in the same query is still wrong.

### 4. Storing money as FLOAT
```sql
-- ❌ price FLOAT           → 0.1 + 0.2 = 0.30000000000000004
-- ✅ price DECIMAL(19,4)   → exact
```
**Cost:** cents that vanish, totals that don't reconcile, and an auditor's very bad day.

### 5. Entity-Attribute-Value ("the one true lookup table")
```sql
-- ❌ attributes(entity_id, attr_name, attr_value VARCHAR)
```
**Cost:** every query becomes a self-join pile, no types, no constraints, unusable indexes. Use real columns; if the schema is genuinely dynamic, use a `JSONB`/`JSON` column, which at least supports indexing and validation.

### 6. Not indexing foreign keys
MySQL/InnoDB creates FK indexes automatically. **SQL Server does not.** Every `JOIN` and every cascading delete then scans the child table.
```sql
CREATE INDEX idx_orders_customer ON orders(customer_id);   -- do this for every FK
```

### 7. The N+1 query problem
```python
# ❌ 1 query + 1 per row = 101 round trips
orders = db.query("SELECT * FROM orders LIMIT 100")
for o in orders:
    o.customer = db.query("SELECT * FROM customers WHERE id=?", o.customer_id)
# ✅ 1 query
db.query("SELECT o.*, c.name FROM orders o JOIN customers c ON c.id=o.customer_id LIMIT 100")
```
**Cost:** the single most common ORM performance disaster. Latency multiplies by row count.

### 8. Functions on indexed columns
```sql
-- ❌ WHERE YEAR(order_date) = 2024
-- ✅ WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'
```
**Cost:** full scan instead of a seek. See Section 20.

### 9. `NOT IN` with a nullable subquery
```sql
-- ❌ WHERE id NOT IN (SELECT parent_id FROM child)   -- returns NOTHING if any parent_id is NULL
-- ✅ WHERE NOT EXISTS (SELECT 1 FROM child WHERE child.parent_id = t.id)
```
**Cost:** silently empty results — the worst kind of bug, because it looks like "no matching data."

### 10. Business logic buried in triggers
**Cost:** invisible side effects, cascading fires, untestable behavior, and a new developer who cannot explain why a row changed. Use triggers for auditing and integrity that constraints can't express; keep decisions in the application.

### 11. `WITH (NOLOCK)` sprinkled everywhere (SQL Server)
It is `READ UNCOMMITTED` in disguise. It can return rows twice, skip rows entirely, and read data that gets rolled back. **Cost:** wrong numbers in reports, discovered months later. Enable `READ_COMMITTED_SNAPSHOT` instead and get MVCC.

### 12. Long-running transactions
```sql
-- ❌ BEGIN; ... wait for a user to click something ... COMMIT;
```
**Cost:** locks held for seconds or minutes, blocking chains, lock escalation, log growth. Read data, close the transaction, then open a short one for the write — with optimistic concurrency (`WHERE version = :expected`) to catch conflicts.

<a name="appendix-d-quiz-answers"></a>
## Appendix D. Answers to the Check-Yourself Quizzes

### 8.1 — Logical execution order

**1.** `WHERE` runs at phase 3, before `SELECT` at phase 5, so the alias `total` does not exist yet. `ORDER BY` runs at phase 7, *after* `SELECT`, so by then the alias is defined. Repeat the expression in `WHERE`, or wrap the query in a CTE.

**2.** No. `WHERE status='active'` removes inactive employees at phase 3, so by the time groups form at phase 4 the engine can no longer count them. You need conditional aggregation instead:
```sql
SELECT department,
       AVG(CASE WHEN status='active' THEN salary END) AS avg_active_salary
FROM employees
GROUP BY department
HAVING COUNT(*) > 3;          -- COUNT(*) still sees everyone
```
(Note `CASE` without `ELSE` yields NULL, and `AVG` ignores NULLs — exactly what's wanted.)

**3.** `DISTINCT` is applied at phase 6, after `SELECT` has produced the output columns and before `ORDER BY`. Once duplicates are collapsed, a column that isn't in the select list no longer has a single well-defined value per output row — so sorting by it is ambiguous and strict engines reject it.

### 10.1 — Joins

**1.** 12 rows. `ON 1=1` is always true, so every one of the 3 customers matches all 4 orders — the join degenerates into a cross join. Since every left row matched, the `LEFT` part adds nothing.

**2.**
```sql
SELECT o.* FROM orders o
WHERE NOT EXISTS (SELECT 1 FROM customers c WHERE c.id = o.cust_id);
```
(`LEFT JOIN customers ... WHERE c.id IS NULL` with the tables reversed also works.)

**3.** Every left row matched **at most one** right row — the relationship is one-to-one or one-to-zero-or-one in this direction. If any left row had matched twice, the count would exceed the left table's row count. This is a quick integrity check worth running after any join you're unsure about.

### 11.1 — Aggregates

**1.** `COUNT(*)` = 100 (all rows). `COUNT(discount)` = 70 (non-NULL only). `AVG(discount)` = the sum of the 70 real discounts divided by **70**, not 100 — so it is the average *among products that have a discount*, which is a different question from the average discount across the catalog. For the latter, use `AVG(COALESCE(discount,0))`.

**2.** The `WHERE` removes rows before grouping, so departments with no high earners disappear entirely. Move the condition inside the aggregate:
```sql
SELECT dept, SUM(CASE WHEN salary > 50000 THEN 1 ELSE 0 END) AS high_earners
FROM emp GROUP BY dept;
```
(Or `LEFT JOIN` from a departments table.)

**3.** `SUM` adds 1 for each matching row and 0 for the rest, giving a count of matches. With `ELSE NULL`, `SUM` ignores the NULLs and produces the same number — and `COUNT(CASE WHEN x THEN 1 END)` works for the same reason. All three are correct; the `ELSE 0` form is clearest about intent.

### 17.1 — Window functions

**1.** `ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC)`, and the filter must go **outside** the window computation — wrap it in a CTE or subquery and filter `WHERE rn <= 2`. Window functions are computed at phase 5, after `WHERE` at phase 3, so you cannot filter on them in the same query level. (Use `RANK` instead if you want ties to both be included, which may return more than 2 rows.)

**2.** With `ORDER BY` present and no explicit frame, the default frame is `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` — the window ends at the current row, so the "last value" in it *is* the current row. Fix it with an explicit frame:
```sql
LAST_VALUE(x) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)
```

**3.** `SUM(x)` with no `GROUP BY` collapses the entire result to **one row** containing the total. `SUM(x) OVER ()` keeps **every row** and attaches the grand total to each — which is exactly what you need to compute each row's percentage of the whole in a single pass.

### 20.1 — Indexes

**1.** (a) ✅ uses the leading column. (b) ❌ skips `country`, the index can't be entered. (c) ⚠️ partially — it seeks on `country`, then must filter `postcode` by scanning, because `city` was skipped. (d) ✅ best case — equality on `country`, range on `city`, and since `LIKE 'Lis%'` is a range, `postcode` can only be used as a filter, not a seek. Still very efficient.

**2.** Move the arithmetic to the literal side so the column stays bare:
```sql
WHERE created_at >= DATEADD(day, -7, CAST(GETDATE() AS DATE))
```

**3.** Using the index means: traverse the tree, get a row pointer, then jump to the table for each row (a key lookup). Doing that 600,000 times in random I/O order is far more expensive than reading the table sequentially once. Optimizers switch to a scan above roughly 5–20% selectivity. The index isn't wrong — it's just the wrong tool for a query that wants most of the table. If you truly need it fast, make the index *covering* so no table lookup is required.

<a name="appendix-e-glossary"></a>
## Appendix E. Glossary

**ACID** — Atomicity, Consistency, Isolation, Durability; the guarantees a transactional database provides.
**Anti-join** — A query returning rows in A with no match in B, typically `LEFT JOIN … WHERE b.key IS NULL` or `NOT EXISTS`.
**B-tree** — The balanced tree structure behind most indexes; gives logarithmic lookup.
**Cardinality** — The number of rows in a set, or the number of distinct values in a column. High cardinality (many distinct values) makes a column a good index candidate.
**Clustered index** — An index that determines the physical row order; one per table.
**Composite key** — A key made of two or more columns.
**Correlated subquery** — A subquery referencing the outer query, evaluated per outer row.
**Covering index** — An index containing every column a query needs, so the table itself is never read.
**CTE** — Common Table Expression; a named subquery introduced with `WITH`.
**DDL / DML / DCL / TCL** — Definition / Manipulation / Control / Transaction Control sublanguages of SQL.
**Deadlock** — Two transactions each holding a lock the other needs; the engine kills one.
**Denormalization** — Deliberately reintroducing redundancy to speed up reads.
**Derived table** — A subquery in the `FROM` clause.
**Fan-out** — Row multiplication caused by joining to a table with multiple matches; the usual cause of inflated `SUM`s.
**Foreign key** — A column referencing another table's primary key, enforcing referential integrity.
**Functional dependency** — `A → B`: knowing A determines B. The basis of normalization.
**Gaps and islands** — The problem class of finding consecutive runs (streaks) and the breaks between them.
**Grain** — The level of detail one row represents. Mismatched grain is the root of most aggregation bugs.
**Idempotent** — An operation safe to run more than once with the same result.
**Index seek vs scan** — Targeted lookup vs reading the whole structure.
**Isolation level** — How much concurrent transactions can see of each other's work.
**Junction table** — The bridge table implementing a many-to-many relationship.
**Materialized view** — A view whose results are physically stored and refreshed.
**MVCC** — Multi-Version Concurrency Control; readers see a snapshot instead of blocking on writers.
**N+1 problem** — Issuing one query per row of a result set instead of one query total.
**Normalization** — Structuring tables to eliminate redundancy and update anomalies.
**OLTP / OLAP** — Transaction processing vs analytical processing.
**Optimizer / query planner** — The component that chooses how to execute your declarative query.
**Partition (window)** — The subset of rows a window function operates over; distinct from table partitioning.
**Predicate** — A condition evaluating to true/false/unknown.
**Referential integrity** — The guarantee that every foreign key value points to a real parent row.
**RPO / RTO** — Recovery Point Objective (acceptable data loss) / Recovery Time Objective (acceptable downtime).
**Sargable** — A predicate the optimizer can satisfy with an index seek.
**Scalar function** — Returns one value; contrast with table-valued.
**Schema** — The structure of a database (and, in some engines, a namespace within it).
**Selectivity** — The fraction of rows a predicate returns; low fraction = highly selective = good for an index.
**Statistics** — Stored distribution data the optimizer uses to estimate row counts.
**Surrogate key** — A meaningless generated identifier, as opposed to a natural key.
**Transaction** — An all-or-nothing unit of work.
**Trigger** — Code that fires automatically on `INSERT`/`UPDATE`/`DELETE`.
**Upsert** — Insert-or-update in one statement.
**View** — A stored query usable like a table.
**WAL** — Write-Ahead Log; changes are written to a log before data files, providing durability.
**Window function** — A function computed across a set of related rows without collapsing them.

<a name="appendix-f-worked-solutions"></a>
## Appendix F. Worked Solutions to All 40 Exercises

Written against the sample data in [Appendix A](#appendix-a-sample-data), in MySQL 8 syntax. Where a solution teaches something beyond the answer, there's a note. **Try each one yourself first** — reading a solution you haven't attempted produces the feeling of understanding without the substance.

### Beginner

**1. All products priced over 100, most expensive first.**
```sql
SELECT name, price FROM products
WHERE price > 100
ORDER BY price DESC;
```

**2. Customers who signed up in 2024.**
```sql
SELECT name, signup_date FROM customers
WHERE signup_date >= '2024-01-01' AND signup_date < '2025-01-01'
ORDER BY signup_date;
```
> Note the sargable range instead of `YEAR(signup_date) = 2024`. Build this habit now; it becomes reflex.

**3. Products with "pro" anywhere in the name (case-insensitive).**
```sql
SELECT name FROM products WHERE name LIKE '%pro%';
```
> MySQL's default collation is case-insensitive, so this works as-is. In a case-sensitive collation (or PostgreSQL) use `ILIKE` or `LOWER(name) LIKE '%pro%'` — accepting that the latter defeats an index.

**4. The 5 cheapest products.**
```sql
SELECT name, price FROM products ORDER BY price ASC LIMIT 5;
```

**5. Customers whose city is unknown.**
```sql
SELECT name, country FROM customers WHERE city IS NULL;
```
> Returns Fay Costa. `WHERE city = NULL` returns nothing — the single most common beginner error.

**6. All distinct countries.**
```sql
SELECT DISTINCT country FROM customers ORDER BY country;
```

### Aggregation

**7. Count of products per category.**
```sql
SELECT c.name AS category, COUNT(p.product_id) AS product_count
FROM categories c
LEFT JOIN products p ON p.category_id = c.category_id
GROUP BY c.category_id, c.name
ORDER BY product_count DESC;
```
> `LEFT JOIN` + `COUNT(p.product_id)` shows "Software" with 0. `COUNT(*)` would wrongly show 1, because the LEFT JOIN produces one padded row. **Count the column, not the row, when counting through a LEFT JOIN.**

**8. Average price per category, only categories averaging over 50.**
```sql
SELECT c.name, ROUND(AVG(p.price), 2) AS avg_price
FROM categories c JOIN products p ON p.category_id = c.category_id
GROUP BY c.category_id, c.name
HAVING AVG(p.price) > 50
ORDER BY avg_price DESC;
```

**9. Total stock value across all products.**
```sql
SELECT ROUND(SUM(price * stock), 2) AS total_inventory_value FROM products;
```

**10. Highest and lowest salary per department.**
```sql
SELECT department, MAX(salary) AS highest, MIN(salary) AS lowest,
       MAX(salary) - MIN(salary) AS spread
FROM employees GROUP BY department ORDER BY highest DESC;
```

**11. Number of orders per status.**
```sql
SELECT status, COUNT(*) AS n,
       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct
FROM orders GROUP BY status ORDER BY n DESC;
```
> The `SUM(COUNT(*)) OVER ()` trick gives percentages without a second pass over the table.

**12. Monthly order counts for 2024.**
```sql
SELECT DATE_FORMAT(order_date, '%Y-%m') AS month, COUNT(*) AS orders
FROM orders
WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'
GROUP BY 1 ORDER BY 1;
```
> Months with zero orders are missing entirely. See exercise 34 for the fix.

### Joins

**13. Each order with its customer's name.**
```sql
SELECT o.order_id, o.order_date, o.status, c.name AS customer
FROM orders o JOIN customers c ON c.customer_id = o.customer_id
ORDER BY o.order_date;
```

**14. Products with their category name, including uncategorized.**
```sql
SELECT p.name AS product, COALESCE(c.name, '(uncategorized)') AS category
FROM products p
LEFT JOIN categories c ON c.category_id = p.category_id
ORDER BY category, product;
```
> `LEFT JOIN` keeps "Orphan Gadget"; `COALESCE` makes the NULL readable.

**15. Customers who have never placed an order.**
```sql
-- Anti-join
SELECT c.name, c.country FROM customers c
LEFT JOIN orders o ON o.customer_id = c.customer_id
WHERE o.order_id IS NULL;

-- Equivalent, often faster and NULL-safe
SELECT name, country FROM customers c
WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id);
```
> Returns Gus, Hana, Ivan, Jo.

**16. Each employee with their manager's name.**
```sql
SELECT e.name AS employee, e.department, COALESCE(m.name, '(none)') AS manager
FROM employees e
LEFT JOIN employees m ON m.emp_id = e.manager_id
ORDER BY manager, employee;
```

**17. Full order detail with line totals.**
```sql
SELECT o.order_id, o.order_date, c.name AS customer,
       p.name AS product, i.quantity, i.unit_price,
       ROUND(i.quantity * i.unit_price, 2) AS line_total
FROM orders o
JOIN customers   c ON c.customer_id = o.customer_id
JOIN order_items i ON i.order_id    = o.order_id
JOIN products    p ON p.product_id  = i.product_id
ORDER BY o.order_id, p.name;
```

**18. Categories with no products.**
```sql
SELECT c.name FROM categories c
WHERE NOT EXISTS (SELECT 1 FROM products p WHERE p.category_id = c.category_id);
```
> Returns "Software".

### Intermediate

**19. Customers who have spent more than 1,000 in total.**
```sql
SELECT c.name, ROUND(SUM(i.quantity * i.unit_price), 2) AS lifetime_value
FROM customers c
JOIN orders      o ON o.customer_id = c.customer_id
JOIN order_items i ON i.order_id    = o.order_id
WHERE o.status <> 'cancelled'
GROUP BY c.customer_id, c.name
HAVING SUM(i.quantity * i.unit_price) > 1000
ORDER BY lifetime_value DESC;
```
> Excluding cancelled orders is a judgment call — state assumptions like this explicitly in an interview; it's often what's being tested.

**20. Best-selling product by quantity.**
```sql
SELECT p.name, SUM(i.quantity) AS units_sold
FROM order_items i JOIN products p ON p.product_id = i.product_id
GROUP BY p.product_id, p.name
ORDER BY units_sold DESC
LIMIT 1;
```
> ⚠️ `LIMIT 1` silently hides ties. To include them: `WITH r AS (SELECT ..., RANK() OVER (ORDER BY SUM(i.quantity) DESC) rk ...) SELECT * FROM r WHERE rk = 1`.

**21. Each customer's most recent order date.**
```sql
SELECT c.name, MAX(o.order_date) AS last_order
FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id
GROUP BY c.customer_id, c.name
ORDER BY last_order DESC;
```
> For the whole most-recent *row* rather than just the date, use the greatest-n-per-group pattern (Cookbook recipe 5).

**22. Products priced above their category's average.**
```sql
-- Correlated subquery
SELECT p.name, p.price, c.name AS category
FROM products p JOIN categories c ON c.category_id = p.category_id
WHERE p.price > (SELECT AVG(p2.price) FROM products p2 WHERE p2.category_id = p.category_id);

-- Window function version — usually faster, one pass
SELECT name, price, category FROM (
    SELECT p.name, p.price, c.name AS category,
           AVG(p.price) OVER (PARTITION BY p.category_id) AS cat_avg
    FROM products p JOIN categories c ON c.category_id = p.category_id
) t WHERE price > cat_avg;
```

**23. Percentage of orders cancelled, per month.**
```sql
SELECT DATE_FORMAT(order_date, '%Y-%m') AS month,
       COUNT(*) AS total,
       SUM(status = 'cancelled') AS cancelled,
       ROUND(100.0 * SUM(status = 'cancelled') / COUNT(*), 1) AS pct_cancelled
FROM orders GROUP BY 1 ORDER BY 1;
```
> `SUM(status='cancelled')` works in MySQL because booleans are 1/0. The portable form is `SUM(CASE WHEN status='cancelled' THEN 1 ELSE 0 END)`.

**24. Employees earning more than their department's average.**
```sql
SELECT e.name, e.department, e.salary, ROUND(d.avg_sal, 2) AS dept_avg
FROM employees e
JOIN (SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department) d
  ON d.department = e.department
WHERE e.salary > d.avg_sal
ORDER BY e.department, e.salary DESC;
```

### Window functions

**25. Rank employees by salary within each department.**
```sql
SELECT name, department, salary,
       DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rank_in_dept
FROM employees
ORDER BY department, rank_in_dept;
```
> The sample data has deliberate ties (92,000 twice in Engineering; 64,000 twice in Sales) — run all three ranking functions side by side and compare.

**26. Top 3 products by revenue in each category.**
```sql
WITH rev AS (
    SELECT p.category_id, p.name, SUM(i.quantity * i.unit_price) AS revenue
    FROM order_items i JOIN products p ON p.product_id = i.product_id
    GROUP BY p.category_id, p.product_id, p.name
),
ranked AS (
    SELECT c.name AS category, rev.name AS product, rev.revenue,
           ROW_NUMBER() OVER (PARTITION BY rev.category_id ORDER BY rev.revenue DESC) AS rn
    FROM rev JOIN categories c ON c.category_id = rev.category_id
)
SELECT category, product, ROUND(revenue,2) AS revenue
FROM ranked WHERE rn <= 3
ORDER BY category, rn;
```
> Two CTEs: aggregate first, then rank. Trying to do both in one step fails, because you can't rank an aggregate you haven't computed yet.

**27. Running total of daily revenue.**
```sql
WITH daily AS (
    SELECT o.order_date, SUM(i.quantity * i.unit_price) AS revenue
    FROM orders o JOIN order_items i ON i.order_id = o.order_id
    GROUP BY o.order_date
)
SELECT order_date, ROUND(revenue,2) AS revenue,
       ROUND(SUM(revenue) OVER (ORDER BY order_date), 2) AS running_total
FROM daily ORDER BY order_date;
```

**28. Month-over-month revenue growth percentage.**
```sql
WITH m AS (
    SELECT DATE_FORMAT(o.order_date,'%Y-%m') AS month,
           SUM(i.quantity * i.unit_price) AS revenue
    FROM orders o JOIN order_items i ON i.order_id = o.order_id
    GROUP BY 1
)
SELECT month, ROUND(revenue,2) AS revenue,
       ROUND(LAG(revenue) OVER (ORDER BY month), 2) AS prev_month,
       ROUND(100.0*(revenue - LAG(revenue) OVER (ORDER BY month))
             / NULLIF(LAG(revenue) OVER (ORDER BY month), 0), 1) AS growth_pct
FROM m ORDER BY month;
```
> `NULLIF` guards against a zero-revenue month. The first row is NULL by definition — that's correct, not a bug.

**29. Each order's amount versus that customer's average order.**
```sql
WITH o AS (
    SELECT o.order_id, o.customer_id, SUM(i.quantity*i.unit_price) AS amount
    FROM orders o JOIN order_items i ON i.order_id = o.order_id
    GROUP BY o.order_id, o.customer_id
)
SELECT c.name, o.order_id, ROUND(o.amount,2) AS amount,
       ROUND(AVG(o.amount) OVER (PARTITION BY o.customer_id), 2) AS cust_avg,
       ROUND(o.amount - AVG(o.amount) OVER (PARTITION BY o.customer_id), 2) AS diff
FROM o JOIN customers c ON c.customer_id = o.customer_id
ORDER BY c.name, o.order_id;
```

**30. 7-day moving average of order counts.**
```sql
WITH d AS (SELECT order_date, COUNT(*) AS n FROM orders GROUP BY order_date)
SELECT order_date, n,
       ROUND(AVG(n) OVER (ORDER BY order_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), 2) AS ma7
FROM d ORDER BY order_date;
```
> ⚠️ This averages the last 7 *rows with data*, not the last 7 calendar days. For a true 7-day window, join to a calendar table first (exercise 34) so gap days count as zero.

### Advanced

**31. Full org chart with indentation level.**
```sql
WITH RECURSIVE org AS (
    SELECT emp_id, name, department, manager_id, 1 AS lvl,
           CAST(name AS CHAR(500)) AS path
    FROM employees WHERE manager_id IS NULL
    UNION ALL
    SELECT e.emp_id, e.name, e.department, e.manager_id, o.lvl + 1,
           CONCAT(o.path, ' > ', e.name)
    FROM employees e JOIN org o ON e.manager_id = o.emp_id
    WHERE o.lvl < 10
)
SELECT CONCAT(REPEAT('    ', lvl - 1), name) AS org_chart, department, lvl, path
FROM org ORDER BY path;
```

**32. Cohort retention: customers who ordered again within 90 days of signup.**
```sql
WITH first_o AS (
    SELECT c.customer_id, c.signup_date, MIN(o.order_date) AS first_order
    FROM customers c JOIN orders o ON o.customer_id = c.customer_id
    GROUP BY c.customer_id, c.signup_date
),
repeat_o AS (
    SELECT f.customer_id,
           MAX(CASE WHEN o.order_date > f.first_order
                     AND o.order_date <= f.first_order + INTERVAL 90 DAY
                    THEN 1 ELSE 0 END) AS retained
    FROM first_o f JOIN orders o ON o.customer_id = f.customer_id
    GROUP BY f.customer_id
)
SELECT DATE_FORMAT(f.signup_date,'%Y-%m') AS cohort,
       COUNT(*) AS cohort_size,
       SUM(r.retained) AS retained_90d,
       ROUND(100.0 * SUM(r.retained) / COUNT(*), 1) AS retention_pct
FROM first_o f JOIN repeat_o r ON r.customer_id = f.customer_id
GROUP BY 1 ORDER BY 1;
```

**33. Find and remove exact duplicates, keeping the lowest ID.**
```sql
-- Find first — ALWAYS look before you delete
SELECT email, COUNT(*) n, MIN(customer_id) keep_id, GROUP_CONCAT(customer_id) all_ids
FROM customers GROUP BY email HAVING COUNT(*) > 1;

-- Then delete
DELETE FROM customers
WHERE customer_id NOT IN (
    SELECT keep FROM (SELECT MIN(customer_id) AS keep FROM customers GROUP BY email) t
);
```
> The nested derived table works around MySQL's restriction on reading the table you're modifying. `email` is `UNIQUE` in the sample schema, so this finds nothing — that's the point of a unique constraint.

**34. Revenue per day, including days with zero orders.**
```sql
WITH RECURSIVE cal AS (
    SELECT DATE('2024-01-01') AS d
    UNION ALL SELECT d + INTERVAL 1 DAY FROM cal WHERE d < '2024-12-31'
),
daily AS (
    SELECT o.order_date AS d, SUM(i.quantity*i.unit_price) AS revenue
    FROM orders o JOIN order_items i ON i.order_id = o.order_id
    GROUP BY o.order_date
)
SELECT cal.d, ROUND(COALESCE(daily.revenue, 0), 2) AS revenue
FROM cal LEFT JOIN daily ON daily.d = cal.d
ORDER BY cal.d;
```
> The calendar must be the **left** table. Reverse them and you're back to gaps.

**35. Customers whose spending dropped more than 50% year over year.**
```sql
WITH yearly AS (
    SELECT o.customer_id, YEAR(o.order_date) AS yr,
           SUM(i.quantity * i.unit_price) AS revenue
    FROM orders o JOIN order_items i ON i.order_id = o.order_id
    GROUP BY o.customer_id, YEAR(o.order_date)
),
paired AS (
    SELECT customer_id, yr, revenue,
           LAG(revenue) OVER (PARTITION BY customer_id ORDER BY yr) AS prev_revenue
    FROM yearly
)
SELECT c.name, p.yr, ROUND(p.prev_revenue,2) AS last_year,
       ROUND(p.revenue,2) AS this_year,
       ROUND(100.0*(p.revenue - p.prev_revenue)/NULLIF(p.prev_revenue,0), 1) AS change_pct
FROM paired p JOIN customers c ON c.customer_id = p.customer_id
WHERE p.prev_revenue IS NOT NULL
  AND p.revenue < p.prev_revenue * 0.5
ORDER BY change_pct;
```

**36. Pivot: revenue by category (rows) × quarter (columns).**
```sql
SELECT c.name AS category,
       ROUND(SUM(CASE WHEN QUARTER(o.order_date)=1 THEN i.quantity*i.unit_price ELSE 0 END),2) AS q1,
       ROUND(SUM(CASE WHEN QUARTER(o.order_date)=2 THEN i.quantity*i.unit_price ELSE 0 END),2) AS q2,
       ROUND(SUM(CASE WHEN QUARTER(o.order_date)=3 THEN i.quantity*i.unit_price ELSE 0 END),2) AS q3,
       ROUND(SUM(CASE WHEN QUARTER(o.order_date)=4 THEN i.quantity*i.unit_price ELSE 0 END),2) AS q4,
       ROUND(SUM(i.quantity*i.unit_price),2) AS total
FROM orders o
JOIN order_items i ON i.order_id = o.order_id
JOIN products    p ON p.product_id = i.product_id
JOIN categories  c ON c.category_id = p.category_id
WHERE o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'
GROUP BY c.category_id, c.name
ORDER BY total DESC;
```
> SQL requires a fixed column list, so a true dynamic pivot needs generated SQL. Conditional aggregation is portable and usually preferable.

**37. Consecutive-day order streaks per customer (gaps and islands).**
```sql
WITH dates AS (
    SELECT DISTINCT customer_id, order_date FROM orders
),
grouped AS (
    SELECT customer_id, order_date,
           order_date - INTERVAL ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date) DAY AS island
    FROM dates
)
SELECT c.name, MIN(g.order_date) AS streak_start, MAX(g.order_date) AS streak_end,
       COUNT(*) AS streak_days
FROM grouped g JOIN customers c ON c.customer_id = g.customer_id
GROUP BY c.customer_id, c.name, g.island
HAVING COUNT(*) > 1
ORDER BY streak_days DESC;
```
> Understand *why* `date − row_number` is constant within a run: consecutive dates increase by 1 per row and so does `ROW_NUMBER`, so their difference is fixed until a gap shifts it.

**38. Products never ordered in the last 12 months.**
```sql
SELECT p.name, p.price, p.stock
FROM products p
WHERE NOT EXISTS (
    SELECT 1 FROM order_items i JOIN orders o ON o.order_id = i.order_id
    WHERE i.product_id = p.product_id
      AND o.order_date >= CURDATE() - INTERVAL 12 MONTH
)
ORDER BY p.stock * p.price DESC;
```
> Sorting by tied-up capital turns a list into a recommendation.

**39. Second-highest salary per department, without LIMIT/TOP.**
```sql
SELECT department, salary AS second_highest FROM (
    SELECT department, salary,
           DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rk
    FROM (SELECT DISTINCT department, salary FROM employees) d
) t WHERE rk = 2;
```
> `DISTINCT` first so that two people on the same top salary don't push the "second highest" to third place. Whether that's the desired behavior is exactly the clarifying question to ask in an interview.

**40. Given a slow query's plan, propose an index and justify it.**

Suppose this is slow:
```sql
SELECT o.order_id, o.order_date, c.name
FROM orders o JOIN customers c ON c.customer_id = o.customer_id
WHERE o.status = 'shipped' AND o.order_date >= '2024-06-01'
ORDER BY o.order_date DESC;
```
`EXPLAIN` shows `type: ALL` on `orders` plus `Using filesort`.

**Proposal:**
```sql
CREATE INDEX idx_orders_status_date ON orders(status, order_date DESC);
```
**Justification:**
- `status` is an **equality** predicate → it goes first, so the tree narrows to a single point.
- `order_date` is a **range** predicate → second, so the matching rows form one contiguous run.
- Because index leaves are stored in order, `ORDER BY order_date DESC` is satisfied by reading the run backwards — the filesort disappears.
- `customer_id` is already indexed for the join (`idx_orders_customer_date`), and `customers.customer_id` is the primary key, so the join side is fine.
- **Trade-off:** one more index to maintain on every write to `orders`. Justified if this query is frequent; check `sys.schema_unused_indexes` in a few weeks to confirm it's earning its keep.
- **Verify, don't assume:** re-run `EXPLAIN` and confirm `type` becomes `range` and `Using filesort` is gone.

### Meta-commands cheat sheet

| Task | MySQL | PostgreSQL (`psql`) | SQL Server (`sqlcmd`) | SQLite |
|---|---|---|---|---|
| List databases | `SHOW DATABASES;` | `\l` | `SELECT name FROM sys.databases;` | `.databases` |
| Switch database | `USE db;` | `\c db` | `USE db;` | (reopen file) |
| List tables | `SHOW TABLES;` | `\dt` | `SELECT * FROM sys.tables;` | `.tables` |
| Describe table | `DESCRIBE t;` | `\d t` | `EXEC sp_help 't';` | `.schema t` |

| List indexes | `SHOW INDEX FROM t;` | `\di` | `EXEC sp_helpindex 't';` | `.indexes t` |
| Execute a file | `SOURCE f.sql;` | `\i f.sql` | `:r f.sql` | `.read f.sql` |
| Output to file | `tee out.txt` | `\o out.txt` | `:OUT out.txt` | `.output out.txt` |
| Timing | `SET profiling=1;` | `\timing` | `SET STATISTICS TIME ON;` | `.timer on` |
| Show plan | `EXPLAIN q;` | `EXPLAIN ANALYZE q;` | `SET SHOWPLAN_ALL ON;` | `EXPLAIN QUERY PLAN q;` |
| Quit | `\q` / `exit` | `\q` | `QUIT` | `.quit` |

### Import and export

```bash
# CSV import — MySQL
mysql> LOAD DATA INFILE '/path/data.csv' INTO TABLE t
       FIELDS TERMINATED BY ',' ENCLOSED BY '"' IGNORE 1 ROWS;

# CSV import — PostgreSQL
psql> \copy t FROM 'data.csv' WITH (FORMAT csv, HEADER true);

# CSV import — SQLite
sqlite> .mode csv
sqlite> .import data.csv t

# Export
mysql -e "SELECT * FROM t" -B practice > out.tsv
psql -c "\copy (SELECT * FROM t) TO 'out.csv' CSV HEADER"

```

# 1. Learning SQL — Alan Beaulieu

**What it is:** the standard first book. Roughly 350 pages, MySQL-based, moves from "what is a database" to window functions and transactions without ever leaving you behind. If you read one book to start, this is it.

**Prerequisites:** none.
**Read it when:** you're at Stage 1–3 of the learning path.
**What it deliberately skips:** administration, performance tuning at depth, engine internals.

## Territory It Covers

### Foundations — the relational model and why it won
The opening establishes why data ended up in tables. Before the relational model, data was stored hierarchically (a tree, where each child has one parent) or as a network (children with multiple parents). Both encoded the *access path* into the structure — you could traverse the data efficiently in the direction the designer anticipated, and painfully in any other. Codd's insight was to separate the logical structure from physical access entirely: express *what* you want in a declarative language and let the system find the path. Every table gets a key; relationships are expressed by matching values rather than pointers.

The practical consequence you feel every day: you can add an index, reorganize storage, or move to different hardware without changing a single query. That's data independence, and it is why SQL code from 1995 still runs.

### Creating and populating a database
Covers `CREATE TABLE`, data types (character, numeric, temporal), and `INSERT`/`UPDATE`/`DELETE`. The critical judgment introduced here is **type selection**: choosing a type is choosing a set of guarantees. `DECIMAL` guarantees exact arithmetic; `FLOAT` guarantees only approximation. `DATE` guarantees a valid calendar date; `VARCHAR` holding "2024-02-31" guarantees nothing. Every constraint you decline to declare becomes a bug your application must prevent, forever, in every code path.

### Query mechanics — the six clauses
The core of the book. `SELECT`, `FROM`, `WHERE`, `GROUP BY`, `HAVING`, `ORDER BY`, each examined for what it does and — crucially — *when* it runs. The distinction between the order you write clauses and the order the engine evaluates them explains most beginner errors: why an alias defined in `SELECT` isn't available in `WHERE`, why `WHERE` can't contain an aggregate, why `HAVING` exists at all.

### Filtering
Condition types (equality, range, membership, matching), the wildcard characters, and regular expressions. The treatment of NULL here is what separates competent from confused: NULL means *unknown*, so comparisons involving it return unknown rather than true or false, and only true rows survive a `WHERE`. This is three-valued logic, and it is the source of a permanent class of bugs — `NOT IN` against a set containing NULL returns nothing at all.

### Joins
Inner joins first, then the mechanism (the Cartesian product filtered by the join condition), then self-joins, then outer joins. The mental model worth carrying: a join produces one output row per *matching pair*, which is why joining a customer to their three orders yields three rows with the customer repeated. Once you internalize that joins multiply, the mysterious inflated `SUM` stops being mysterious.

### Sets
`UNION`, `INTERSECT`, `EXCEPT`, and the rules for compatibility. The important distinction is `UNION` (deduplicates, requiring a sort) versus `UNION ALL` (concatenates, cheap). Choosing `UNION` reflexively costs you a sort you may not need.

### Functions and grouping
Character, numeric, and temporal functions, then aggregate functions and grouping. Key insight: aggregates ignore NULLs, which means `AVG` divides by the count of non-NULL values, not the row count — so "average rating" answers a subtly different question depending on whether missing ratings should count as zero or be excluded.

### Subqueries
Treated as a first-class topic and rightly so. The taxonomy: **noncorrelated** subqueries execute once and are independent; **correlated** subqueries reference the outer query and conceptually execute per outer row. Scalar subqueries return one value, and using one where multiple rows come back is a runtime error. `EXISTS` is presented as the tool for existence questions, since it stops at the first match and behaves correctly with NULLs.

### Views
A view is a stored query, not stored data. It buys simplification (hide a nasty join), security (grant access to a view instead of the base tables), and insulation (change the underlying schema while keeping the view's interface stable). Updatable views work only under restrictive conditions — a view with aggregation or grouping cannot be written through.

### Transactions
Why they exist (concurrent access to shared data), what they guarantee, and the mechanics of `COMMIT`, `ROLLBACK`, and savepoints. Locking granularity and the trade-off between concurrency and consistency get an introduction here.

### Indexes and constraints
A conceptual introduction rather than a tuning manual: indexes are a separate sorted structure that speeds reads and slows writes; constraints declare rules the engine enforces so your application doesn't have to.

### Analytic (window) functions
The later editions cover these properly, and they're the highest-value chapter for anyone doing reporting. The core idea: `OVER()` lets you compute across a set of rows without collapsing them, so you can put a row and its group's average side by side.

### Large databases and SQL/NoSQL context
Closing material on partitioning, clustering, sharding, and where non-relational stores fit. Appropriately brief — it's orientation, not instruction.

## The Ideas Worked Through

### Three-valued logic, made concrete

The single hardest adjustment for anyone coming from a programming language is that SQL conditions have three outcomes, not two.

```sql
SELECT 1 = 1     AS a,   -- TRUE
       1 = 2     AS b,   -- FALSE
       1 = NULL  AS c,   -- NULL (unknown)
       NULL = NULL AS d; -- NULL (unknown) — not TRUE
```

The rule that makes it usable: **`WHERE` returns only rows evaluating to TRUE.** UNKNOWN rows are discarded exactly like FALSE ones — which is why a filter that looks like it should catch everything can silently lose rows.

```sql
-- These two do NOT partition your data. Rows with NULL status vanish from both.
SELECT * FROM orders WHERE status = 'shipped';
SELECT * FROM orders WHERE status <> 'shipped';
```

The complete partition requires an explicit third branch:
```sql
SELECT * FROM orders WHERE status <> 'shipped' OR status IS NULL;
```

**Where this bites in practice:** aggregates, `CHECK` constraints (which pass on UNKNOWN, unlike `WHERE`), and `NOT IN`. That last one deserves a full derivation:

```sql
-- Suppose the subquery returns (1, 2, NULL)
WHERE id NOT IN (1, 2, NULL)
-- expands to
WHERE id <> 1 AND id <> 2 AND id <> NULL
-- for id = 5: TRUE AND TRUE AND UNKNOWN  →  UNKNOWN  →  row dropped
-- Every row evaluates to UNKNOWN. The query returns nothing, silently.
```

Note the asymmetry: `IN` with a NULL still works (a match returns TRUE regardless of other UNKNOWN terms, because `TRUE OR UNKNOWN` is TRUE). Only the negated form fails. This is why `NOT EXISTS` should be your reflex.

### Why joins multiply, demonstrated

```
customers          orders
id  name           id   cust_id
1   Ana            101  1
2   Ben            102  1
                   103  2
```

```sql
SELECT c.name, o.id FROM customers c JOIN orders o ON o.cust_id = c.id;
```
```
Ana  101
Ana  102     ← Ana appears twice: two matching pairs
Ben  103
```

Three rows, not two. Now add a third table where order 101 has four line items, and Ana's name appears five times. This is the mechanism behind almost every "my SUM is too big" bug, and it's why the correct fix is aggregating each branch to its own grain before joining — not `DISTINCT`.

### Correlated vs noncorrelated, and why it matters for cost

```sql
-- Noncorrelated: self-contained, conceptually runs once
SELECT name FROM employees
WHERE salary > (SELECT AVG(salary) FROM employees);

-- Correlated: references e from the outer query, conceptually runs per outer row
SELECT name FROM employees e
WHERE salary > (SELECT AVG(salary) FROM employees WHERE dept = e.dept);
```

The test for which you have: **can you run the subquery on its own?** If yes, noncorrelated. Modern optimizers frequently rewrite correlated subqueries into joins or window functions, but the semantic distinction still governs correctness — and when the optimizer can't rewrite, the cost difference is enormous.

### Views as an interface, not a shortcut

The valuable framing is contractual. A view is a promise about what columns and semantics consumers can rely on, decoupled from how the underlying tables are arranged.

```sql
CREATE VIEW v_active_customers AS
SELECT customer_id, name, email, city FROM customers WHERE deleted_at IS NULL;
```

Now: the soft-delete convention is enforced in one place rather than remembered in fifty queries; you can restructure `customers` freely as long as the view still produces those four columns; and you can grant read access to the view without exposing columns the consumer shouldn't see.

## Misconceptions This Book Corrects

| Common belief | Reality |
|---|---|
| "The rows come back in insertion order" | Without `ORDER BY` there is no guaranteed order at all; what you observe is an artifact of the current plan |
| "NULL is like zero or empty string" | It's *unknown* — it propagates through arithmetic and makes comparisons UNKNOWN |
| "`COUNT(*)` and `COUNT(col)` are the same" | They differ by exactly the number of NULLs in `col` |
| "A join returns one row per left row" | It returns one row per matching *pair* |
| "`WHERE` and `ON` are interchangeable" | Only for inner joins; for outer joins they produce different results |
| "A view stores data" | It stores a query; only a *materialized* view stores results |
| "`DISTINCT` fixes duplicate rows" | It hides them; if a join caused them, your aggregates are already wrong |

## Apply It This Week

1. Take a query you've written and rewrite every `NOT IN` as `NOT EXISTS`. Note whether any result changed — if it did, you had a live bug.
2. Find a `LEFT JOIN` in your codebase with a condition on the right table in `WHERE`. Decide whether it was meant to be an inner join.
3. Add `NOT NULL` and a `CHECK` to one column whose rule currently lives only in application code.
4. Rewrite a nested subquery as a chain of CTEs and see whether it reads better.

## If You Remember Only Five Things

1. `WHERE` runs before `SELECT`; `ORDER BY` runs after. Almost every "unknown column" error follows from this.
2. NULL means unknown, so `= NULL` never matches and `NOT IN` with a NULL returns nothing.
3. A join emits one row per matching pair — that's why totals inflate.
4. `WHERE` filters rows, `HAVING` filters groups, and neither can do the other's job.
5. A window function computes across rows without collapsing them; that's the entire difference from an aggregate.

## Questions & Answers — Learning SQL

**1. What problem did the relational model solve that hierarchical and network models did not?**
They baked the access path into the data structure, so queries the designer didn't anticipate were expensive or impossible. The relational model separated logical structure from physical access, letting you ask any question declaratively and letting the system choose how to answer it.

**2. What is data independence and why does it matter practically?**
The ability to change physical storage (indexes, file layout, hardware) without changing logical queries. It's why adding an index doesn't require rewriting application code, and why decades-old SQL still runs.

**3. Why is `DECIMAL` required for money rather than `FLOAT`?**
Floating point stores binary approximations, so values like 0.1 cannot be represented exactly and errors accumulate across arithmetic. `DECIMAL` stores exact decimal values, so totals reconcile.

**4. What does a `NOT NULL` constraint actually buy you?**
A guarantee enforced at the storage layer, in every code path, forever. Without it, every application, script, and ad-hoc import must independently remember the rule — and one of them won't.

**5. Why can't you use a `SELECT` alias in the `WHERE` clause?**
`WHERE` is evaluated before `SELECT` in the logical processing order, so at the time `WHERE` runs the alias does not yet exist. `ORDER BY` runs after `SELECT`, which is why the alias works there.

**6. Explain the difference between `WHERE` and `HAVING`.**
`WHERE` filters individual rows before grouping; `HAVING` filters groups after they're formed. A condition on a raw column belongs in `WHERE`; a condition on an aggregate belongs in `HAVING`.

**7. What is three-valued logic and why does SQL have it?**
Conditions can evaluate to true, false, or unknown, because NULL means "unknown value" and comparisons with an unknown yield an unknown result. `WHERE` returns only rows evaluating to true, so unknown rows are silently dropped.

**8. Why does `WHERE col = NULL` never match anything?**
Comparing anything to an unknown yields unknown, not true — even `NULL = NULL`. You need `IS NULL`, which tests for the marker rather than comparing values.

**9. Why does `NOT IN (SELECT x FROM t)` return zero rows when any `x` is NULL?**
`NOT IN` expands to a chain of `<>` comparisons joined by `AND`. One comparison against NULL returns unknown, and `true AND unknown` is unknown, so no row ever evaluates to true. Use `NOT EXISTS` instead.

**10. What is the mechanical definition of an inner join?**
The Cartesian product of two tables, filtered by the join condition. Every pairing is considered; only matching pairs survive.

**11. Why does a customer appear multiple times when joined to their orders?**
A join emits one row per matching pair, not per left-side row. Three orders means three pairs, so the customer's columns repeat three times.

**12. What's the difference between an inner and a left outer join, in terms of what's preserved?**
Inner keeps only rows with a match on both sides. Left outer preserves every row from the left table, padding the right side with NULLs where no match exists.

**13. Why does putting a condition on the right table in `WHERE` break a left join?**
The join runs first, producing NULLs for unmatched rows; `WHERE` then evaluates those NULLs as unknown and discards them, converting the outer join into an inner join. Put the condition in `ON` instead.

**14. When is a self-join the right tool?**
When rows in one table relate to other rows in the same table — employees to managers, categories to parent categories, comparing a row to its neighbor. You alias the table twice and treat the aliases as separate tables.

**15. What is the difference between `UNION` and `UNION ALL`?**
`UNION` removes duplicates, requiring a sort or hash pass. `UNION ALL` concatenates without deduplication and is meaningfully faster. Use `UNION ALL` unless duplicates are actually possible and unwanted.

**16. What rules must queries satisfy to be combined with a set operator?**
Same number of columns, in the same order, with compatible data types. Column names come from the first query, and `ORDER BY` may appear only once, at the very end.

**17. Why does `AVG` sometimes give a surprising result?**
It divides by the count of non-NULL values, not the row count. If half your ratings are missing, `AVG(rating)` is the average among rated items, which answers a different question than "average across all items."

**18. What's the difference between `COUNT(*)`, `COUNT(col)`, and `COUNT(DISTINCT col)`?**
`COUNT(*)` counts rows including those with NULLs. `COUNT(col)` counts non-NULL values in that column. `COUNT(DISTINCT col)` counts distinct non-NULL values. The gap between the first two is your missing-data count.

**19. Distinguish correlated from noncorrelated subqueries.**
A noncorrelated subquery is independent — it can be run on its own and executes once. A correlated subquery references a column from the outer query, so conceptually it re-executes for each outer row.

**20. When should you prefer `EXISTS` over `IN`?**
When the subquery may be large, when you only care whether a match exists (not what it is), and whenever NULLs may be present. `EXISTS` short-circuits at the first match and has no NULL pathology.

**21. What is a scalar subquery and what breaks it?**
One that returns a single value, usable anywhere a value is expected. It fails at runtime if it returns more than one row, which is why an aggregate or a limit is often necessary.

**22. What is a view, and what does it store?**
A named stored query. It stores the query definition, not the data; the query runs when the view is referenced. (A *materialized* view is the exception — it stores results and must be refreshed.)

**23. Give three legitimate reasons to create a view.**
Simplifying a complex join for repeated use; restricting access by granting on the view rather than base tables; providing a stable interface so the underlying schema can change without breaking consumers.

**24. Why are some views not updatable?**
If the view aggregates, groups, uses `DISTINCT`, or joins in ways that make the mapping from view row to base row ambiguous, the engine cannot determine which base rows a write should affect.

**25. What are the four ACID properties, in one sentence each?**
Atomicity: all or nothing. Consistency: constraints hold before and after. Isolation: concurrent transactions don't corrupt each other's view. Durability: committed data survives a crash.

**26. What does a savepoint let you do?**
Roll back part of a transaction to a named marker without abandoning the whole thing, which is useful when a later step is optional or may fail recoverably.

**27. What's the fundamental trade-off an index represents?**
Faster reads for slower writes plus storage. Every index must be updated on every insert, update, and delete touching its columns.

**28. Why does a window function let you show a row and its group's aggregate together?**
Because `OVER()` defines a set of related rows to compute across *without* collapsing the result. `GROUP BY` reduces many rows to one; a window function keeps all rows and attaches the computed value to each.

**29. What does `PARTITION BY` do, and how does it differ from `GROUP BY`?**
It divides rows into groups for the window computation — the same partitioning logic as `GROUP BY`, but the rows survive. Think of it as "GROUP BY that doesn't collapse."

**30. Why does `ROW_NUMBER` need a tiebreaker in its `ORDER BY`?**
With ties, the assignment among tied rows is arbitrary and may differ between executions, making results non-deterministic. Adding a unique column to the `ORDER BY` makes it stable.

**31. What's the practical difference between `RANK` and `DENSE_RANK`?**
Both give tied rows the same rank. `RANK` then skips numbers (1, 2, 2, 4); `DENSE_RANK` does not (1, 2, 2, 3). Use `RANK` when position among all rows matters, `DENSE_RANK` when distinct levels matter.

**32. Why does the book cover subqueries before window functions?**
Window functions cannot be filtered in the same query level, so nearly every real use requires wrapping them in a subquery or CTE. You need subquery fluency to use windows at all.

**33. If you finish this book, what are you still missing?**
Performance tuning at depth, execution plan reading, index design, concurrency in production, administration, and engine internals. Beaulieu gets you to competent query writing; Winand and the engine-specific books take it from there.
