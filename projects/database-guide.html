<a name="8-high-performance-mysql"></a>
# 8. High Performance MySQL — Schwartz, Zaitsev, Tkachenko, Botros, Tinley

**What it is:** the operational and performance bible for MySQL. The 4th edition is substantially rewritten around MySQL 8.0 and cloud/containerized deployment. Less a tutorial than a reference for people responsible for MySQL working well under load.

**Prerequisites:** working MySQL knowledge.
**Read it when:** you run MySQL in production, or you're preparing for a role that does.

## Territory It Covers

### Architecture and the storage engine layer
MySQL's distinguishing structure: a server layer (connection handling, parsing, optimization) sitting above a pluggable storage engine layer. The engine determines locking granularity, transaction support, index implementation, and crash recovery. InnoDB is the answer for essentially all modern use — row-level locking, MVCC, foreign keys, crash-safe recovery, and a clustered primary key. MyISAM's table-level locking makes it unsuitable for concurrent writes; MEMORY loses data on restart.

### InnoDB specifics that shape everything else
InnoDB's clustered index means table rows physically live in the primary key's leaves. Two consequences you feel constantly: primary key order determines physical insert locality (a random UUID primary key causes page splits and fragmentation across the whole table, while a monotonically increasing key appends), and every secondary index stores the primary key as its row pointer — so a wide primary key inflates every secondary index.

### Reliability and monitoring
What can go wrong (hardware, replication, corruption, human error) and how to observe the system: the performance schema, sys schema views, slow query log, and the metrics that actually predict trouble. The emphasis is on measuring before changing.

### Operating system and hardware
CPU, memory, storage, and network as they specifically affect MySQL. Memory matters most because the goal is keeping the working set in the buffer pool; storage matters next, with the distinction between sequential and random I/O being decisive for different workloads.

### Configuration and optimization
A deliberately conservative message: most tuning parameters should be left alone, and the ones that matter are few. `innodb_buffer_pool_size` dominates — sized to hold the working set, commonly around 70% of RAM on a dedicated server. Log file sizing, flush behaviour (the durability-versus-throughput setting), and connection limits follow. The book actively warns against copying tuning scripts from the internet, which typically set dozens of parameters based on nothing.

### Schema design and data types
Choosing the smallest type that correctly represents the data, because smaller rows mean more rows per page, which means fewer pages read and better cache utilization. Integer sizing, the real cost of `VARCHAR` versus `CHAR`, `DATETIME` versus `TIMESTAMP`, why `ENUM` has surprising behaviour, and why `NULL`able columns complicate indexes.

### Indexing for high performance
The most-used chapter. Index types in InnoDB, how the clustered index affects secondary index design, covering indexes, index selectivity and prefix indexes for long strings, multi-column index ordering, redundant and duplicate indexes (which cost writes and buy nothing), and using the optimizer's output to verify an index is actually used.

### Query performance optimization
How the parser, preprocessor, and optimizer process a query; how to profile; the classic slow patterns (retrieving unnecessary rows or columns, correlated subqueries the optimizer can't flatten, `SELECT *`, deep offset pagination, `ORDER BY RAND()`), and specific rewrites. Also optimizer hints and when they're justified — rarely, and always with a documented reason.

### Replication
Statement-based versus row-based versus mixed binary logging, and why row-based is the safer default (statement-based can produce different results on the replica for non-deterministic statements). Replication topologies, GTIDs and how they simplify failover, semi-synchronous replication, replication lag causes and mitigation, and the failure modes — replicas drifting silently out of sync, a replica applying changes single-threaded and falling behind, and the split-brain risk during failover.

### Scaling
Read scaling with replicas, functional partitioning, sharding strategies and their costs, and the honest observation that vertical scaling plus good indexing carries most applications much further than teams expect.

### High availability and cloud
Failure classification, redundancy, failover mechanisms, Group Replication and InnoDB Cluster, and the operational differences when running in managed cloud services versus self-managed instances.

### Backup and recovery
Logical versus physical backups, their respective restore characteristics, binary logs for point-in-time recovery, the distinction between backup and replication (a replica is not a backup — it faithfully replicates your accidental `DELETE`), and the insistence that untested backups don't count.

### Security and MySQL in the cloud
Account management, privilege design, encryption at rest and in transit, and the tradeoffs of managed services.

## The Ideas Worked Through

### The clustered index — the fact that explains most of InnoDB

```
InnoDB table = the primary key index. There is no separate heap.

PRIMARY KEY (clustered)              SECONDARY INDEX on (email)
┌──────────────────────────┐         ┌────────────────────────┐
│ leaf pages contain THE   │         │ leaf pages contain     │
│ ENTIRE ROW, ordered by PK│◄────────│ email → PRIMARY KEY    │
└──────────────────────────┘         └────────────────────────┘
                                      (then a second lookup into the clustered index)
```

Four consequences follow directly, and together they explain most InnoDB performance advice:

**1. Primary key order determines insert locality.**
```sql
-- ✅ Monotonic: every insert appends to the rightmost page. Dense, no splits.
id BIGINT AUTO_INCREMENT PRIMARY KEY

-- ❌ Random UUID: inserts land anywhere, splitting pages across the whole table.
id CHAR(36) PRIMARY KEY   -- fragmentation, poor cache locality, inflated size
```

**2. Primary key width is paid by every secondary index.**
A `CHAR(36)` UUID primary key adds 36 bytes to *every entry of every secondary index*. With five secondary indexes and ten million rows, that's roughly 1.8 GB of pure overhead.

```sql
-- If you need UUIDs, at minimum store them compactly
id BINARY(16) PRIMARY KEY          -- 16 bytes instead of 36
-- Better: auto-increment PK + UUID as a unique secondary key
-- Or: a time-ordered UUID variant so inserts stay roughly sequential
```

**3. Every secondary index lookup is two lookups** — find the primary key, then descend the clustered index to get the row. This is why covering indexes matter so much in InnoDB: they skip the second descent entirely.

**4. Range scans on the primary key are sequential I/O**, because the rows are physically in that order. `WHERE id BETWEEN 1000 AND 2000` reads contiguous pages.

### What to actually configure, and what to leave alone

The book's most useful operational message is a negative one: **most parameters should be left at their defaults.** Tuning scripts that set forty variables are worse than doing nothing, because they obscure causation.

| Parameter | Why it matters | Rough guidance |
|---|---|---|
| `innodb_buffer_pool_size` | Dominates everything. This is the cache holding data and index pages | ~70% of RAM on a dedicated server; the real target is "holds the working set" |
| `innodb_log_file_size` | Larger logs mean less frequent checkpointing and smoother writes | Large enough for ~1 hour of writes |
| `innodb_flush_log_at_trx_commit` | The durability/throughput dial | `1` for real durability; `2` trades up to a second of committed data for speed |
| `max_connections` | Too high causes thrashing, not throughput | Set to what your pool actually needs, not a big round number |
| `innodb_flush_method` | Avoids double-buffering with the OS cache | `O_DIRECT` on Linux |

**How to change any of these:** one at a time, with a measurement before and after, on a representative workload. If you can't measure the difference, revert it.

### Row size, and why the smallest correct type compounds

```sql
-- ❌ Careless: 8 + 8 + 255 + 255 + 8 = 534 bytes/row
id BIGINT, user_id BIGINT, status VARCHAR(255), country VARCHAR(255), created DATETIME

-- ✅ Deliberate: 4 + 4 + 1 + 2 + 4 = 15 bytes/row
id INT UNSIGNED, user_id INT UNSIGNED, status TINYINT UNSIGNED,
country CHAR(2), created TIMESTAMP
```

At a 16 KB page: roughly 30 rows per page versus roughly 1,000. That's a 30× difference in how much of the table fits in the buffer pool, and therefore in how often a query hits disk. The effect compounds across every scan, every index, and every backup.

### Index selectivity and prefix indexes

```sql
-- Check selectivity before indexing
SELECT COUNT(DISTINCT country)/COUNT(*) AS sel FROM users;   -- 0.0001 → poor alone
SELECT COUNT(DISTINCT email)/COUNT(*)   AS sel FROM users;   -- 1.0000 → ideal

-- For long strings, find the shortest prefix that retains selectivity
SELECT COUNT(DISTINCT LEFT(url, 8))/COUNT(*),
       COUNT(DISTINCT LEFT(url, 12))/COUNT(*),
       COUNT(DISTINCT LEFT(url, 20))/COUNT(*)
FROM pages;
-- Pick the shortest length whose ratio approaches the full-column ratio
CREATE INDEX idx_url ON pages (url(20));
```

**The prefix index trade-off:** the index is much smaller and faster, but it can't be used for covering scans or for `ORDER BY` on the full column, because it doesn't contain the complete value. And it's useless when the leading characters are all similar — indexing the first 20 characters of URLs that all start with `https://www.example.com/` retains no selectivity at all.

### Replication: what actually goes wrong

```
PRIMARY ──binlog──► REPLICA
```

| Failure | Mechanism | Mitigation |
|---|---|---|
| **Silent drift** | Statement-based replication replayed a non-deterministic statement differently | Use row-based binlog format; verify with checksum tooling |
| **Lag under write load** | Replica applies changes with less parallelism than the primary generated them | Parallel replication workers; reduce transaction size |
| **Lag from reporting** | Analytical queries on the replica starve the apply thread | Dedicate a replica; limit query resources |
| **Read-your-writes failure** | User writes to primary, reads from lagging replica, change appears lost | Route reads to primary briefly after a write |
| **Split brain on failover** | Two nodes both accept writes after a partition | Proper fencing; GTIDs; an orchestration layer that enforces one primary |

**Why row-based is the safer default:** statement-based logs the SQL text and replays it. Anything non-deterministic — `NOW()`, `RAND()`, `UUID()`, an `UPDATE ... LIMIT` without a total order, a trigger with a side effect — can produce a different result on the replica, and the divergence is silent.

**What GTIDs fix:** without them, repointing a replica to a new primary means manually determining the correct binlog file and position — error-prone, and wrong values cause silent data loss or duplication. With GTIDs each transaction has a globally unique ID, so a replica can simply declare what it has and receive the rest.

### The backup message, stated bluntly

Three claims the book makes repeatedly:

1. **A replica is not a backup.** It faithfully replicates `DROP TABLE users`. Replicas protect against hardware failure; backups protect against logical error, which is far more common.
2. **A backup you haven't restored is not a backup.** It's a file you hope is useful. Restore drills, on a schedule, into a scratch environment.
3. **Time the restore.** Your RTO isn't a policy document, it's however long the restore actually takes plus however long it takes to notice and decide. Most teams discover theirs during an outage.

```bash
# Logical: portable, slow to restore, works across versions
mysqldump --single-transaction --routines --triggers --set-gtid-purged=ON db > db.sql

# Physical: fast restore, version-locked
xtrabackup --backup --target-dir=/backup/full

# Point-in-time recovery needs binlogs retained alongside the backup
mysqlbinlog --start-datetime="2024-06-01 09:00" --stop-datetime="2024-06-01 14:29" \
    binlog.000042 | mysql
```

## Misconceptions This Book Corrects

| Common belief | Reality |
|---|---|
| "Tune MySQL by applying a config template" | Almost all defaults are fine; a handful of settings matter and each needs measurement |
| "A UUID primary key is just a wider integer" | In InnoDB it fragments the clustered index and inflates every secondary index |
| "We have replicas, so we're backed up" | Replicas reproduce your mistakes faithfully and instantly |
| "More connections means more throughput" | Beyond a modest number it causes context switching and contention |
| "Bigger types are safer, disk is cheap" | Row size determines rows per page, which determines cache efficiency — it's a memory problem, not a disk one |
| "Statement-based replication is fine" | It silently diverges on non-deterministic statements |
| "Optimize the slowest query" | Optimize by total time; a fast query run constantly consumes more capacity |

## Apply It This Week

1. Check your buffer pool size against your data size and against RAM. This is the highest-leverage number on the server.
2. Verify your binlog format is `ROW` and GTIDs are enabled.
3. Run a real restore into a scratch instance and time it. Write the number down — that's your actual RTO.
4. Query the sys schema for unused indexes and drop one.
5. Look at your widest table's row size and see whether any column is oversized for its actual domain.

## If You Remember Only Five Things

1. InnoDB's clustered index means primary key choice affects insert locality, secondary index size, and lookup cost.
2. `innodb_buffer_pool_size` is the setting that matters; most others should stay at their defaults.
3. Row size determines rows per page, which determines cache hit rate — small correct types compound.
4. Row-based binlog plus GTIDs; statement-based replication diverges silently.
5. A replica is not a backup, and an untested backup is not a backup.

## Questions & Answers — High Performance MySQL

**1. What is MySQL's pluggable storage engine architecture?**
A server layer handling connections, parsing, and optimization sits above interchangeable storage engines that implement actual data storage, locking, indexing, and recovery. The engine is chosen per table.

**2. Why is InnoDB effectively the only correct choice today?**
It provides row-level locking, MVCC, ACID transactions, foreign key enforcement, and crash-safe recovery. The alternatives lack transactions or use table-level locking that collapses under concurrent writes.

**3. What does it mean that InnoDB's primary key is clustered?**
The table rows are physically stored in the primary key index's leaf pages. There is no separate heap — the primary key index *is* the table.

**4. Why is a random UUID a poor InnoDB primary key?**
Inserts land at random positions throughout the clustered index, causing page splits, fragmentation, and poor cache locality, instead of appending to the end as a monotonically increasing key does.

**5. Why does a wide primary key inflate every secondary index?**
Secondary indexes store the primary key value as the pointer to the row. A 36-character UUID primary key adds those bytes to every entry of every secondary index.

**6. What's the practical fix if you need UUIDs?**
Store them as `BINARY(16)` rather than `CHAR(36)`, and consider a time-ordered UUID variant so inserts remain roughly sequential — or use an auto-increment primary key with the UUID as a unique secondary key.

**7. Which configuration parameter matters most, and how is it sized?**
`innodb_buffer_pool_size`. On a dedicated server it's commonly set around 70% of RAM, with the real target being "large enough to hold the working set."

**8. Why does the book warn against internet tuning scripts?**
They set many parameters based on no knowledge of your workload, often to values that are worse than the defaults, and they obscure which change caused which effect. Tuning should be one measured change at a time.

**9. Why does choosing the smallest correct data type matter?**
Smaller rows pack more rows per page, so fewer pages are read for the same data and the buffer pool caches more of the table. The effect compounds across every query.

**10. What's the difference between `DATETIME` and `TIMESTAMP` in MySQL?**
`TIMESTAMP` uses 4 bytes, converts to and from UTC based on the session time zone, and has a limited range. `DATETIME` uses more space, stores the literal value with no zone conversion, and has a much wider range.

**11. Why can `NULL`able columns complicate indexing?**
They add per-row overhead, complicate the optimizer's estimates, and mean some optimizations can't be applied. Where a value is genuinely always present, declaring `NOT NULL` is both clearer and marginally cheaper.

**12. What is index selectivity and why does it matter?**
The ratio of distinct values to total rows. High selectivity means a lookup narrows to few rows, which is what makes an index worth using. A column with two distinct values across a million rows is poor as a leading index column alone.

**13. What is a prefix index and when is it appropriate?**
An index on the first n characters of a long string column. It keeps the index small while retaining most selectivity — appropriate when the leading characters are distinctive, and unhelpful when they're all similar (URLs beginning with the same domain).

**14. What's the cost of a prefix index?**
It cannot be used for covering scans or for `ORDER BY` on the full column, since the index doesn't contain the complete value.

**15. What is a redundant index and why does it matter?**
An index whose leading columns are already the prefix of another index — `(a)` when `(a, b)` exists. It's rarely useful, and it adds write cost and buffer pool pressure for nothing.

**16. How do you find unused indexes in MySQL 8?**
Query the sys schema's unused-index view, which surfaces indexes with no recorded reads since the last server restart — noting the caveat that infrequent-but-critical queries may not have run yet.

**17. Why is `SELECT *` specifically expensive in InnoDB?**
It defeats covering indexes, forcing a clustered index lookup per row, and it transfers columns (including large text and blob values) that the application never uses.

**18. Why does deep `LIMIT ... OFFSET` degrade, and what's the fix?**
The server must generate and discard every skipped row. Use keyset pagination — remember the last row's key and seek past it — or, if you must keep offsets, use a deferred join that offsets over a covering index and joins back for the full rows.

**19. Why is `ORDER BY RAND()` unacceptable at scale?**
It generates a random value for every row in the table and sorts them all, regardless of how few rows you want.

**20. Compare statement-based and row-based replication.**
Statement-based logs the SQL and replays it, which is compact but can diverge for non-deterministic statements. Row-based logs the actual row changes, which is larger but reproduces the exact result. Row-based is the safer default.

**21. What problem do GTIDs solve?**
Global transaction identifiers give each transaction a unique ID across the topology, so a replica can be repointed to a new primary and automatically determine which transactions it still needs — removing the error-prone manual log-file-and-position bookkeeping.

**22. What is semi-synchronous replication?**
The primary waits for at least one replica to acknowledge receipt of a transaction before returning success to the client, bounding potential data loss on failover at the cost of some write latency.

**23. Name three causes of replication lag.**
A long-running or large transaction on the primary that must be applied serially, single-threaded apply on the replica for a write-heavy workload, and resource contention on the replica (often from reporting queries running against it).

**24. Why is a replica not a backup?**
It faithfully reproduces everything the primary does, including an accidental `DROP TABLE` or a bad `UPDATE`. Backups protect against logical errors; replicas protect against hardware failure.

**25. What does a binary log enable that a full backup doesn't?**
Point-in-time recovery — restoring the last full backup and then replaying the log up to a chosen moment, such as just before a destructive statement.

**26. Compare logical and physical backups.**
Logical backups (`mysqldump`) produce portable SQL, are slow to restore at scale, and work across versions. Physical backups copy data files, restore much faster, and are tied to a compatible version and configuration.

**27. What single practice makes a backup strategy real rather than theoretical?**
Regularly performing a full restore into a scratch environment and verifying the result — including timing it, so your recovery time objective is a measurement rather than a hope.

**28. What does the performance schema give you that the slow query log doesn't?**
Continuous, aggregated instrumentation of statements, waits, locks, and stages across the whole workload, rather than only the individual queries exceeding a duration threshold.

**29. Why optimize by total time rather than worst single execution?**
A query taking 20 ms but running 200,000 times an hour consumes far more capacity than a 5-second report run twice a day. Total time (calls × duration) identifies what's actually consuming the server.

**30. What is functional partitioning and how does it differ from sharding?**
Functional partitioning splits different *tables* or feature areas onto different servers. Sharding splits the *rows of the same table* across servers. Functional partitioning is far simpler and often sufficient.

**31. What does sharding cost you?**
Cross-shard joins and transactions, global unique ID generation, rebalancing complexity, and multiplication of every operational task. It also permanently constrains your query patterns around the shard key.

**32. What's the book's overall stance on scaling out?**
Exhaust indexing, query optimization, schema design, caching, and vertical scaling first. A well-tuned single instance handles far more than most teams assume, and distribution is a permanent architectural cost.

**33. Why does the 4th edition emphasize cloud and automation?**
Because most new MySQL deployments are managed services or containerized, which changes what you control (many parameters are fixed), what you must monitor, and how failover and backups are performed.

<a name="9-designing-data-intensive-applications"></a>
# 9. Designing Data-Intensive Applications — Martin Kleppmann

**What it is:** the best general book on data systems written in the last decade. Not a SQL book — it's about the properties, guarantees, and failure modes of storage and processing systems, and how to reason about them when choosing and combining tools.

**Prerequisites:** general software engineering experience.
**Read it when:** Stage 6, or any time you're making an architecture decision involving data.

## Territory It Covers

### Part I — Foundations of Data Systems

**Reliable, scalable, maintainable applications.** Definitions that do real work. *Reliability* is continuing to function correctly in the face of faults — distinguishing a fault (a component deviating from spec) from a failure (the system as a whole stopping). *Scalability* is not a binary property but a question: which load parameters grow, and what happens to which performance metrics as they do? Percentiles rather than averages, because averages hide the tail that users actually experience. *Maintainability* decomposes into operability, simplicity, and evolvability.

**Data models and query languages.** The relational model versus document and graph models, and the observation that the right choice depends on the shape of your relationships. Documents suit one-to-many trees loaded together; the relational model suits many-to-many; graph models suit highly interconnected data where traversal depth varies. Also the impedance mismatch between objects and tables, schema-on-write versus schema-on-read, and declarative versus imperative query languages.

**Storage and retrieval.** Hash indexes, SSTables and LSM trees, B-trees, and their comparative properties. Then the OLTP/OLAP divide, column-oriented storage, compression, and materialized aggregates. This is where a developer learns why their transactional database is the wrong tool for a scan of a billion rows.

**Encoding and evolution.** Serialization formats (JSON, Protocol Buffers, Avro, Thrift) and — the important part — how schemas evolve. Backward compatibility (new code reads old data) and forward compatibility (old code reads new data) are what make rolling deployments possible, and getting them wrong causes outages during deploys rather than after them.

### Part II — Distributed Data

**Replication.** Single-leader, multi-leader, and leaderless architectures. Synchronous versus asynchronous, and the consequences of replication lag: reading your own writes (you update and then don't see it), monotonic reads (you see a value and then an older one), and consistent prefix reads (you see effects before causes). Each has a specific mitigation.

**Partitioning.** By key range versus by hash, the hot-spot problem, secondary index partitioning (local versus global), rebalancing strategies, and request routing.

**Transactions.** The clearest treatment available of what isolation levels actually guarantee. Read committed, snapshot isolation, and serializable — plus the specific anomalies each prevents: dirty reads, dirty writes, read skew, lost updates, write skew, and phantoms. Write skew in particular is the anomaly people don't know they're exposed to: two transactions each read a set, each verify a constraint holds, and each write — after which the constraint is violated even though neither transaction alone broke it. The implementations of serializability — actual serial execution, two-phase locking, and serializable snapshot isolation — get honest treatments of their costs.

**The trouble with distributed systems.** Unreliable networks, unreliable clocks (both time-of-day and monotonic, and why clock skew makes "last write wins" dangerous), process pauses (garbage collection stopping a node long enough for it to lose its lease), and the fencing token technique for making a stale leader's writes harmless.

**Consistency and consensus.** Linearizability and its cost, ordering guarantees, causality and Lamport timestamps, total order broadcast, and consensus algorithms. The chapter carefully separates *linearizability* (a recency guarantee about single objects) from *serializability* (an isolation property about transactions) — two things routinely confused.

### Part III — Derived Data

**Batch processing.** MapReduce, its dataflow successors, joins in a batch context, and the philosophy of immutable inputs producing derived outputs — which makes reruns safe and debugging tractable.

**Stream processing.** Event streams, message brokers versus logs, change data capture, event sourcing, and the hard parts: windowing, handling events that arrive late or out of order, and the distinction between event time and processing time.

**The future of data systems.** Combining specialized systems coherently, the "unbundled database" idea, exactly-once semantics via idempotence and end-to-end argument, and a substantive closing discussion of the ethics of data systems — predictive analytics, bias, privacy, and the responsibility of the people who build these things.

## The Ideas Worked Through

### Percentiles, and why averages lie

```
1000 requests. 990 take 10 ms. 10 take 5000 ms.
Mean = 59.9 ms   ← describes nobody's experience
p50  = 10 ms
p99  = 5000 ms   ← describes the experience of your most-affected users
```

Two further points that make this operationally important:

**Tail latency amplification.** If one user request fans out to 20 backend calls, and each has a 1% chance of hitting the tail, the probability that *at least one* does is about 18%. Fan-out converts a rare backend problem into a common user problem.

**The people in the tail are disproportionately your best users.** They have the most data, make the most requests, and have been with you longest — so they hit the slow paths most. Optimizing the mean optimizes for people who barely use the product.

### Replication lag anomalies, each with its mitigation

These three are worth memorizing because they're what users actually report as bugs:

```
1. READ YOUR OWN WRITES
   User updates profile (→ primary), page reloads (→ lagging replica), change gone.
   User's reaction: "it didn't save."
   Fix: route reads to the primary for N seconds after that user's write,
        or track the user's last-write position and require a replica at least that current.

2. MONOTONIC READS
   Read 1 hits an up-to-date replica: sees the new comment.
   Read 2 hits a lagging replica: comment is gone.
   User's reaction: "the data is flickering."
   Fix: pin each user to one replica (by hash of user ID, not randomly).

3. CONSISTENT PREFIX READS
   Partitioned system delivers the answer before the question.
   User's reaction: "this conversation makes no sense."
   Fix: ensure causally related writes go to the same partition, or track causality explicitly.
```

### Write skew — the anomaly you're probably exposed to right now

This is the most important thing in the book for working developers, because snapshot isolation is the *default* in several major databases and does not prevent it.

```
Constraint: at least one doctor must remain on call.
Currently on call: Alice, Bob.

  Transaction A (Alice)                  Transaction B (Bob)
  ─────────────────────────────          ─────────────────────────────
  BEGIN                                  BEGIN
  SELECT COUNT(*) FROM oncall
    WHERE on_call = true;   → 2
                                         SELECT COUNT(*) FROM oncall
                                           WHERE on_call = true;   → 2
  -- 2 >= 2, safe to leave
  UPDATE oncall SET on_call = false
    WHERE name = 'Alice';
                                         -- 2 >= 2, safe to leave
                                         UPDATE oncall SET on_call = false
                                           WHERE name = 'Bob';
  COMMIT                                 COMMIT

  Result: nobody is on call. Neither transaction wrote what the other read,
  so there is no write-write conflict for snapshot isolation to detect.
```

The pattern is always the same: **read a set → check a condition → write something that changes the condition for the other transaction.** Booking systems, inventory reservation, username claiming, meeting-room allocation, and account balance checks all have this shape.

Three fixes:
```sql
-- 1. Serializable isolation (SSI in PostgreSQL) — detects and aborts one; needs retry logic
SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;

-- 2. Materialize the conflict: lock the rows the decision depends on
SELECT * FROM oncall WHERE shift_id = 5 FOR UPDATE;

-- 3. Make it a real constraint the database can enforce
--    (exclusion constraint, unique index, or a check on a maintained counter)
```

### The three ways to achieve serializability

| Approach | How | Wins when | Costs |
|---|---|---|---|
| **Actual serial execution** | One transaction at a time, single-threaded, in memory | Transactions are short and the dataset fits in RAM | Throughput capped at one core; long transactions block everything |
| **Two-phase locking** | Acquire locks in a growing phase, release in a shrinking phase | General purpose, pessimistic | Blocking, deadlocks, unpredictable latency under contention |
| **Serializable snapshot isolation** | Optimistic — proceed on a snapshot, detect conflicts at commit, abort | Contention is low | Aborts and retries under high contention; your code *must* retry |

The practical implication: if you turn on serializable isolation, you have taken on the obligation to handle serialization failures with retry logic. A system that turns it on and doesn't retry has traded silent corruption for visible errors — an improvement, but not a finished one.

### Clocks, and why "last write wins" loses data

```
Node A clock: 12:00:00.100    writes X = 1
Node B clock: 12:00:00.050    writes X = 2     ← actually happened LATER in real time
                                                  but B's clock is 50ms behind

Last-write-wins resolution compares timestamps → keeps X = 1.
The later write is discarded, silently, with no error reported anywhere.
```

NTP synchronization typically leaves tens of milliseconds of skew, and can be far worse with a misconfigured or unreachable server. Clocks can also jump backwards during a correction.

The lessons:
- **Never use wall-clock timestamps to order events across machines** for correctness purposes.
- Use monotonic clocks for measuring *durations* on one machine; time-of-day clocks only for display and rough ordering.
- For conflict resolution, use version vectors, sequence numbers from a single source, or explicit application-level merge logic.
- Google's Spanner is instructive: it uses atomic clocks and GPS to bound uncertainty, then *deliberately waits out* the uncertainty interval before committing. Even with extraordinary hardware, the solution is to acknowledge uncertainty rather than assume it away.

### Process pauses and fencing tokens

```
Client 1 acquires a lease on resource X (valid 30s)
   ↓
Client 1 enters a garbage collection pause for 40 seconds
   ↓
Lease expires. Client 2 acquires it and writes.
   ↓
Client 1 resumes, unaware that any time passed, and writes —
   corrupting Client 2's work with no error anywhere.
```

The fix is not "make pauses shorter" — you cannot bound them. The fix is **fencing tokens**:

```
Lock service issues a monotonically increasing token with each lease:
   Client 1 gets token 33
   Client 2 gets token 34

Storage layer records the highest token it has accepted.
   Client 2 writes with token 34 → accepted, high-water mark = 34
   Client 1 resumes, writes with token 33 → REJECTED (33 < 34)
```

The insight generalizes: **you cannot make distributed components behave correctly by assuming timing; you must make incorrect behaviour impossible at the point of effect.**

### Event time vs processing time

```
Real world:  ████ events occur 14:00–14:05
Network/outage:                              (delay)
System sees:                                 ████ arrives 14:20

Windowed by PROCESSING time → a spike at 14:20 that never happened
Windowed by EVENT time      → correctly attributed to 14:00–14:05
```

This is why stream processing needs watermarks (an estimate of "we've probably seen everything up to time T") and a policy for late arrivals: drop them, emit a correction, or hold the window open longer. Every real streaming system makes you choose, and choosing "processing time" because it's simpler produces dashboards that lie after every incident.

## Misconceptions This Book Corrects

| Common belief | Reality |
|---|---|
| "Average latency is a good SLA metric" | It hides the tail; p95/p99 describe actual user experience |
| "Snapshot isolation is basically serializable" | It permits write skew, which is the anomaly most business rules are exposed to |
| "Eventual consistency means a short delay" | There's no bound, and concurrent writes need an explicit resolution strategy |
| "Timestamps can order distributed events" | Clock skew routinely exceeds event spacing; last-write-wins silently loses data |
| "Locks and leases make distributed access safe" | Not without fencing — a paused node can resume holding an expired lease |
| "Exactly-once delivery is achievable" | Exactly-once *effect* is, via idempotence at the point the effect lands |
| "Schemaless means no schema" | The schema moved into application code, implicitly and unvalidated |
| "CAP means choose two of three" | It constrains behaviour only during a partition |

## Apply It This Week

1. Find a read-modify-write in your codebase that checks a condition before writing. Ask whether two concurrent runs could both pass the check.
2. Check what isolation level your application actually runs at — most people are surprised.
3. Look at your monitoring: if you alert on average latency, add p95 and p99.
4. Find any place ordering events by wall-clock timestamp across machines and consider what skew would do.
5. Identify one dashboard windowed by processing time and check what it showed after your last outage.

## If You Remember Only Five Things

1. Measure latency in percentiles; averages describe nobody, and fan-out amplifies the tail.
2. Write skew is real, snapshot isolation doesn't prevent it, and most business constraints have its shape.
3. Clocks are untrustworthy across machines — never use them to order events for correctness.
4. Fencing tokens, not timing assumptions, make leases safe against process pauses.
5. Exactly-once effect comes from idempotence at the destination, not from delivery guarantees in transit.

## Questions & Answers — Designing Data-Intensive Applications

**1. Distinguish a fault from a failure.**
A fault is one component deviating from its specification. A failure is the system as a whole ceasing to provide its service. Reliability engineering is about preventing faults from becoming failures.

**2. Why measure latency in percentiles rather than averages?**
An average is dominated by the common case and conceals the tail. The p99 describes the experience of your most-affected requests — often your most valuable users, since heavy users make more requests and thus hit the tail more often.

**3. What is tail latency amplification?**
When one user request fans out into many backend calls, the slowest backend determines the user's experience. As fan-out grows, the probability that at least one call hits the tail approaches certainty.

**4. What are the three components of maintainability?**
Operability (easy to run), simplicity (easy to understand — managing complexity through good abstractions), and evolvability (easy to change).

**5. When does a document model fit better than a relational one?**
When the data is a self-contained tree loaded as a unit, with one-to-many relationships and few references between documents. The locality advantage is real; the cost appears when you need many-to-many relationships.

**6. When does a graph model win?**
When relationships are the primary object of interest, connections are many-to-many, and traversal depth varies — social graphs, recommendation, fraud rings, routing.

**7. What is schema-on-read, and what does it actually change?**
The data's structure is interpreted by the reader rather than enforced by the writer. The schema hasn't disappeared — it's moved into the application code, implicitly, where it can't be validated centrally.

**8. What's the difference between backward and forward compatibility?**
Backward compatibility: new code can read data written by old code. Forward compatibility: old code can read data written by new code. Rolling deployments need both, since two versions run simultaneously.

**9. Why is forward compatibility harder?**
Old code must ignore fields it doesn't understand rather than choke on them, which requires the format and the code to have been designed for it in advance.

**10. Name the three replication architectures and their essential trade-off.**
Single-leader (simple, no write conflicts, leader is a bottleneck and a failover concern), multi-leader (writes accepted anywhere, conflict resolution required), leaderless (quorum-based, highly available, weaker guarantees).

**11. What is the read-your-own-writes problem?**
A user makes a write to the leader, then reads from a lagging replica and doesn't see their own change — appearing as data loss. Mitigate by routing reads to the leader for a period after a write, or by tracking the user's last write timestamp.

**12. What is a monotonic reads violation?**
A user sees a value and then, on a later read from a further-behind replica, sees an older value — time appearing to move backwards. Mitigate by pinning each user to a consistent replica.

**13. What is consistent prefix reads?**
The guarantee that if writes happen in a causal order, anyone reading them sees them in that order. Violations make effects appear before their causes — an answer visible before the question.

**14. Why does key-range partitioning risk hot spots?**
Access patterns often correlate with key order — timestamps being the worst case, since all current writes land in the newest partition while the others sit idle.

**15. Compare local and global secondary indexes in a partitioned system.**
A local (document-partitioned) index covers only its partition, making writes cheap but reads scatter-gather across all partitions. A global (term-partitioned) index is partitioned by the indexed term, making reads targeted but writes cross-partition.

**16. What is a dirty read and which level prevents it?**
Reading data another transaction has written but not committed. Read committed prevents it.

**17. What is read skew (non-repeatable read), and what prevents it?**
Seeing different parts of the database at different points in time within one transaction — for example, a balance transfer observed after the debit but before the credit. Snapshot isolation prevents it by giving the transaction a consistent point-in-time view.

**18. How does snapshot isolation work?**
Through multi-version concurrency control: writes create new versions, and each transaction reads the versions that were committed as of its start, so readers never block and always see a consistent snapshot.

**19. What is a lost update and name two solutions.**
Two transactions read a value, both modify it, and the second overwrites the first's change. Solutions: atomic read-modify-write operations in the database, explicit locking (`SELECT FOR UPDATE`), or compare-and-set / optimistic concurrency with a version column.

**20. Explain write skew with a concrete example.**
Two doctors are on call; each independently checks "is at least one other doctor on call?" (yes), and each then goes off call. Both transactions read a set, verified a constraint, and wrote — and the constraint is now violated even though neither wrote what the other read.

**21. Why is write skew so dangerous in practice?**
Snapshot isolation — the default in several major databases — does not prevent it, and it's invisible in testing because it requires specific concurrent timing. Preventing it requires serializable isolation or explicit materialized locks.

**22. What is a phantom, and how does it relate to write skew?**
A write in one transaction changes the result of a search query in another. Write skew is typically caused by a phantom: the constraint check queried a set that another transaction concurrently changed.

**23. Name the three ways to implement serializability and their costs.**
Actual serial execution (simple and correct, limits throughput to one core and requires short transactions), two-phase locking (correct, but locks cause blocking, deadlocks, and unpredictable latency), and serializable snapshot isolation (optimistic, good performance under low contention, aborts and retries under high contention).

**24. Distinguish linearizability from serializability.**
Linearizability is a recency guarantee on individual objects: reads always return the most recent write. Serializability is an isolation property on transactions: the result is equivalent to some serial order. A system can provide one without the other.

**25. Why are clocks untrustworthy in distributed systems?**
Time-of-day clocks are synchronized by NTP and can jump forwards or backwards; skew between machines can exceed the duration of the events you're ordering. Using timestamps to resolve write conflicts can silently discard data.

**26. What's the danger of "last write wins" conflict resolution?**
It uses timestamps to pick a winner, so clock skew means the "later" write may actually have happened first — and the discarded write is lost with no error reported.

**27. What is a process pause and why does it break assumptions?**
A garbage collection cycle or a hypervisor suspension can stop a process for seconds. During that time its lease may expire and another node may take leadership; when it resumes, it doesn't know and may act as if it's still the leader.

**28. What is a fencing token?**
A monotonically increasing number issued with each lock or lease grant. The storage system rejects any write carrying a token lower than the highest it has seen, so a resumed stale leader's writes are refused rather than accepted.

**29. What makes immutable inputs so valuable in batch processing?**
Reruns are safe and produce identical results, bugs can be fixed by rerunning rather than repairing state, and you can experiment against production data without risk. It converts data processing into something debuggable.

**30. What is change data capture?**
Reading a database's replication log as a stream of change events, so derived systems — search indexes, caches, warehouses — stay in sync without dual-writes and their consistency problems.

**31. What is event sourcing and how does it differ from CDC?**
Event sourcing records immutable domain events as the system of record, deriving current state from them. CDC extracts changes from a database whose current state is the system of record. Event sourcing is an application design choice; CDC is an integration technique.

**32. What's the difference between event time and processing time, and why does it matter?**
Event time is when something happened; processing time is when the system handled it. They diverge with network delays, buffering, and outages, so windowed aggregations by processing time produce wrong results — a spike after an outage recovery is an artifact, not a real event.

**33. What is the end-to-end argument as applied to exactly-once semantics?**
Guarantees provided by individual components don't compose into an end-to-end guarantee. True exactly-once effect requires idempotence at the point where the effect actually lands — typically a deduplication key in the final write — rather than delivery guarantees in the transport.

**34. Why does the book close on ethics?**
Because these systems make consequential decisions about people — credit, employment, policing, insurance — and the engineers building them are among the few who understand the mechanisms well enough to see the failure modes. Kleppmann treats that as a professional responsibility rather than an afterthought.

**35. What's the single most valuable takeaway for someone who won't build a distributed database?**
The vocabulary and precision to evaluate the guarantees a system claims — to read "eventually consistent" or "highly available" and know exactly what has been given up, rather than accepting marketing terms at face value.

<a name="10-the-data-warehouse-toolkit"></a>
# 10. The Data Warehouse Toolkit — Ralph Kimball & Margy Ross

**What it is:** the reference for dimensional modeling. Half of it is method; half is a set of worked industry case studies (retail, inventory, procurement, order management, accounting, CRM, HR, finance, telecom, transportation, education, healthcare, e-commerce, insurance) that each introduce new techniques in context.

**Prerequisites:** SQL and basic modeling.
**Read it when:** you're building or querying an analytics layer.

## Territory It Covers

### Why dimensional modeling exists
Third normal form is optimal for transaction processing and hostile to analysis: a business question spans a dozen tables, the join is unreadable, and query performance is unpredictable. Dimensional modeling optimizes for a different set of goals — understandability by business users and predictable query performance — by organizing data into facts (measurements) and dimensions (context).

The claim isn't that normalization is wrong; it's that the warehouse serves a different purpose than the source system and therefore deserves a different structure.

### The four-step design process
Applied to every case study in the book: (1) **select the business process** to model, (2) **declare the grain** — exactly what one fact row represents, (3) **identify the dimensions** that describe that grain, (4) **identify the facts** — the numeric measurements consistent with that grain. Declaring the grain first and precisely is the step teams skip and the one that determines whether the model works.

### Facts
Measurements, typically numeric and additive. Three types: **additive** (summable across all dimensions — sales amount), **semi-additive** (summable across some but not time — inventory levels and account balances), and **non-additive** (never summable — ratios and percentages, which must be recomputed from their components). Fact tables also come in three flavours: transaction grain (one row per event), periodic snapshot (one row per entity per period), and accumulating snapshot (one row per process instance, updated as it progresses through milestones).

**Factless fact tables** record events with no measurement — a student attending a class, a promotion being in effect — where the existence of the row is the fact.

### Dimensions
Wide, descriptive, deliberately denormalized tables providing the "by" in every question — sales *by* product *by* region *by* month. Key techniques: surrogate keys (never reuse the operational key, so history is protected from source-system changes), conformed dimensions (the same dimension shared across fact tables, which is what makes cross-process analysis possible), role-playing dimensions (one date dimension viewed as order date, ship date, and due date), degenerate dimensions (an order number living in the fact table with no dimension table of its own), junk dimensions (bundling scattered low-cardinality flags), and outriggers (a limited normalized attachment to a dimension).

### Slowly changing dimensions
The core technique for handling attributes that change over time. Type 1 overwrites, losing history. Type 2 adds a new row with validity dates and a current flag, preserving point-in-time truth — the workhorse. Type 3 adds a "previous value" column for a single alternate view. Types 0, 4, 5, 6, and 7 cover the remaining combinations (immutable, mini-dimension, hybrid approaches). The decision is a business question, not a technical one: does the organization need to see history as it was, or as it is now?

### The enterprise data warehouse bus architecture
The framework that makes incremental delivery possible. Rather than a monolithic multi-year project, you build one business process at a time — but you enforce **conformed dimensions** across them, so a customer dimension built for orders is the same one used later by support and marketing. The bus matrix (business processes as rows, dimensions as columns) is a one-page plan and communication tool.

This is the architectural argument against Inmon-style top-down normalized warehousing, and the practical reason Kimball-style modeling dominates in practice.

### Case-study techniques
Each industry chapter introduces specific problems and techniques: allocating shared costs down to the fact grain, handling multi-valued dimensions with bridge tables, many-to-many relationships between facts and dimensions, handling hierarchies of variable depth, header/line relationships, financial period comparisons, and consolidated fact tables that combine measurements from multiple processes at a common grain.

### ETL subsystems
An extensive catalogue of what an ETL system must actually do beyond "move data": change data capture, data quality screening, error event handling, audit dimensions, deduplication, conforming, surrogate key management, slowly changing dimension processing, late-arriving data, job scheduling, and lineage. It's a useful checklist against which to evaluate any pipeline.

## The Ideas Worked Through

### Declaring the grain — the step everyone skips

The grain is a single sentence stating exactly what one fact row represents. It must be written before any modeling and it must be atomic.

```
✅ "One row per product per line item on a retail sales transaction."
✅ "One row per account per day, capturing the closing balance."
✅ "One row per insurance claim, updated as it moves through processing stages."

❌ "Sales data."                       — not a grain
❌ "One row per order."                — ambiguous: order header or line?
❌ "Daily and monthly sales totals."   — two grains in one table
```

**Why mixing grains is catastrophic:** if a fact table contains both line-level rows and order-level shipping charges, every `SUM(amount)` double-counts — and the error is proportional to line count, so it's not a constant offset anyone would notice. People make decisions on the numbers for months before someone reconciles against the source system.

The correct handling for an order-level charge at line grain is to **allocate it down** — spread the shipping cost across the lines proportionally — so every fact row is at the same grain and every sum is correct.

### The three fact table types

```
TRANSACTION GRAIN — one row per event, inserted once, never updated
  fact_sales(date_key, product_key, store_key, quantity, amount)
  → "What was sold, when, where?"  Most common. Highest detail.

PERIODIC SNAPSHOT — one row per entity per interval, capturing state
  fact_inventory_daily(date_key, product_key, store_key, qty_on_hand, value)
  → "What was the level at each point?"  Semi-additive: sums across products, NOT across days.

ACCUMULATING SNAPSHOT — one row per process instance, UPDATED as it progresses
  fact_order_fulfillment(order_key, order_date_key, ship_date_key, deliver_date_key,
                         order_to_ship_days, ship_to_deliver_days)
  → "How long does each stage take?"  The row is revisited as milestones complete.
```

Most warehouses need all three for the same business process, answering different questions from the same underlying activity.

### Additivity — the property that determines what you may sum

```
ADDITIVE:      sales_amount, quantity_sold, cost
               → SUM across every dimension. Safe everywhere.

SEMI-ADDITIVE: account_balance, inventory_on_hand, headcount
               → SUM across products/stores/customers ✅
               → SUM across DAYS ❌  (summing Monday's and Tuesday's balance is nonsense)
               → Use AVG, or take the period-ending value, across time.

NON-ADDITIVE:  unit_price, margin_percent, conversion_rate
               → Never SUM. Never AVG the ratios either.
               → Store the numerator and denominator as additive facts,
                 sum each, then divide at query time.
```

That last rule is worth stating explicitly because it's violated constantly:

```sql
-- ❌ Wrong: the average of percentages is not the overall percentage
SELECT region, AVG(margin_percent) FROM fact_sales GROUP BY region;

-- ✅ Right: sum the components, then divide
SELECT region, SUM(margin_amount) / NULLIF(SUM(revenue_amount), 0) AS margin_pct
FROM fact_sales GROUP BY region;
```

### Slowly Changing Dimension Type 2, mechanically

A customer moves from Lisbon to Berlin. What should last year's sales report show?

```
Type 1 (overwrite): all historical sales now appear under Berlin.
   "Sales by city" for last year silently changes. Useful when correcting an error;
   wrong when the historical attribution mattered.

Type 2 (new row): historical sales stay attributed to Lisbon; new sales go to Berlin.
```

```sql
-- The dimension before
surrogate_key | customer_id | name     | city   | valid_from | valid_to   | is_current
------------- | ----------- | -------- | ------ | ---------- | ---------- | ----------
1042          | 501         | Ana Ruiz | Lisbon | 2023-01-15 | 9999-12-31 | TRUE

-- The Type 2 change: close the old row, insert a new one with a NEW surrogate key
UPDATE dim_customer SET valid_to = '2024-05-31', is_current = FALSE
WHERE surrogate_key = 1042;

INSERT INTO dim_customer (customer_id, name, city, valid_from, valid_to, is_current)
VALUES (501, 'Ana Ruiz', 'Berlin', '2024-06-01', '9999-12-31', TRUE);
-- → surrogate_key 2871
```

**Why the surrogate key is essential:** fact rows loaded before June point at 1042; fact rows after point at 2871. Each fact is permanently bound to the customer's state at the time of the event. Joining on `customer_id` would destroy this — which is precisely why you never use the operational key as the dimension's primary key.

```sql
-- Historical truth: comes free from the join
SELECT d.city, SUM(f.amount)
FROM fact_sales f JOIN dim_customer d ON d.surrogate_key = f.customer_key
GROUP BY d.city;

-- Current truth: filter to the current row and join on the business key
SELECT d.city, SUM(f.amount)
FROM fact_sales f
JOIN dim_customer h ON h.surrogate_key = f.customer_key
JOIN dim_customer d ON d.customer_id = h.customer_id AND d.is_current
GROUP BY d.city;
```

Both questions are answerable from the same model. That's the payoff for the extra machinery.

### Conformed dimensions and the bus matrix

The bus matrix is one page and it does more work than any other artifact in a warehouse project.

```
                    │ Date │ Product │ Customer │ Store │ Employee │ Promotion │
────────────────────┼──────┼─────────┼──────────┼───────┼──────────┼───────────┤
Retail Sales        │  X   │    X    │    X     │   X   │    X     │     X     │
Inventory Snapshot  │  X   │    X    │          │   X   │          │           │
Purchase Orders     │  X   │    X    │          │   X   │    X     │           │
Customer Support    │  X   │    X    │    X     │       │    X     │           │
Marketing Campaigns │  X   │         │    X     │       │          │     X     │
```

Reading it: rows are business processes (each becomes a fact table), columns are dimensions, and an X means that process uses that dimension. Shared columns must be **conformed** — literally the same dimension table, same keys, same attribute definitions.

Why this matters more than anything else in the method: conformity is what lets you ask "how does support contact volume correlate with sales, by customer segment?" If sales and support each built their own customer dimension with different definitions of "segment," that question is unanswerable without a reconciliation project.

It's also a delivery plan. You build one row at a time and ship it — but the columns constrain you to build in a way that composes.

### Why you must never join two fact tables

```
fact_sales:   1,000 rows for customer X
fact_returns:    50 rows for customer X

Direct join on customer_key → 50,000 rows.
Every sale duplicated 50 times, every return duplicated 1,000 times.
Both sums are catastrophically wrong.
```

The correct technique is **drilling across**: aggregate each fact table separately to a common conformed grain, then join the *results*.

```sql
WITH s AS (SELECT customer_key, SUM(amount) AS sales   FROM fact_sales   GROUP BY customer_key),
     r AS (SELECT customer_key, SUM(amount) AS returns FROM fact_returns GROUP BY customer_key)
SELECT d.name, COALESCE(s.sales,0) AS sales, COALESCE(r.returns,0) AS returns
FROM dim_customer d
LEFT JOIN s ON s.customer_key = d.surrogate_key
LEFT JOIN r ON r.customer_key = d.surrogate_key;
```

### The dimension toolkit

| Technique | What it is | When you need it |
|---|---|---|
| **Role-playing** | One date dimension referenced as order date, ship date, due date (via views) | Almost every fact table |
| **Degenerate** | An operational ID in the fact table with no dimension of its own (order number) | Grouping lines back to their parent |
| **Junk** | Scattered low-cardinality flags bundled into one dimension of observed combinations | When a fact table accumulates many small indicator columns |
| **Bridge** | Resolves many-to-many between fact and dimension, usually with a weighting factor | Multiple diagnoses per visit, multiple authors per book |
| **Outrigger** | A limited normalized attachment to a dimension | Sparingly — it's controlled snowflaking |
| **Mini-dimension** | Rapidly changing attributes split from a large dimension | When Type 2 on a big dimension would explode row counts |

## Misconceptions This Book Corrects

| Common belief | Reality |
|---|---|
| "Normalize the warehouse like any database" | The warehouse serves a different purpose and deserves a different structure |
| "Denormalized means sloppy" | Dimensional denormalization is deliberate, rule-governed, and serves comprehension and performance |
| "One big table is simpler" | Mixed grain is the single most damaging warehouse error, and it produces wrong numbers silently |
| "You can average percentages" | You must sum the components and divide; averaging ratios is arithmetically meaningless |
| "Use the source system's key as the dimension key" | It destroys the ability to keep history and exposes you to source-system renumbering |
| "Dates are computable, so no date dimension" | Fiscal calendars, holidays, and business-day flags aren't derivable from a date function |
| "Cloud warehouses made Kimball obsolete" | Compute got cheaper; grain, conformity, and history remain semantic problems |

## Apply It This Week

1. Take any existing report table and write down its grain in one sentence. If you can't, that's the finding.
2. Check whether any of your fact tables mix grains. Sum a measure two ways and reconcile against the source.
3. Find a percentage stored as a measure and replace it with its numerator and denominator.
4. Build a date dimension for the next ten years, including your organization's fiscal calendar.
5. Draw the bus matrix for your organization on one page. The gaps and conflicts will be immediately visible.

## If You Remember Only Five Things

1. Declare the grain in one sentence before anything else, and never mix grains in one fact table.
2. Additive, semi-additive, non-additive — know which each measure is before anyone sums it.
3. Surrogate keys are what make Type 2 history possible; never use the operational key.
4. Conformed dimensions are the discipline that makes an incrementally built warehouse coherent.
5. Never join two fact tables — aggregate each to a common grain and join the results.

## Questions & Answers — The Data Warehouse Toolkit

**1. Why not just run analytics on the normalized OLTP schema?**
Business questions span many tables, producing joins that are unreadable and unpredictable in performance, and the analytical load competes with production traffic. The two workloads have opposing optimal structures.

**2. What are the two goals dimensional modeling optimizes for?**
Understandability by business users, and predictable query performance. Everything else is subordinate to those.

**3. State the four-step dimensional design process.**
Select the business process; declare the grain; identify the dimensions; identify the facts.

**4. Why is declaring the grain the critical step?**
Everything else depends on it. Dimensions must apply at that grain and facts must be consistent with it. A model with mixed grain double-counts, and the error is usually discovered only after people have made decisions from it.

**5. Give an example of a precisely stated grain.**
"One row per product per line item on a retail sales transaction." Note what it excludes — it's not "one row per transaction" and not "one row per day."

**6. Define additive, semi-additive, and non-additive facts with examples.**
Additive: sums correctly across every dimension (sales revenue). Semi-additive: sums across some dimensions but not time (inventory on hand, account balance). Non-additive: never sums (unit price, margin percentage) — store the components and recompute.

**7. Why can't you sum a percentage across rows?**
Because a percentage is a ratio whose denominator differs per row. Summing them is arithmetically meaningless; you must sum numerator and denominator separately and divide.

**8. Describe the three fact table types.**
Transaction grain: one row per event, at the moment it occurs. Periodic snapshot: one row per entity per regular interval, capturing state. Accumulating snapshot: one row per process instance, updated in place as it moves through defined milestones.

**9. When is an accumulating snapshot the right choice?**
For processes with a defined set of milestones and a predictable lifecycle — order fulfilment, claims processing, admissions — where you want lag times between stages readily available.

**10. What is a factless fact table?**
One recording that an event or condition occurred, with no numeric measure. Attendance, coverage, eligibility, and promotion-in-effect are typical; the count of rows is the measurement.

**11. Why use surrogate keys in dimensions rather than the operational key?**
To insulate the warehouse from source system changes (recycled keys, re-numbering, mergers), to permit Type 2 history where the same business entity has multiple rows, and to keep fact table keys narrow and uniform.

**12. What is a conformed dimension and why does it matter more than anything else?**
A dimension used identically across multiple fact tables and business processes. It's what makes cross-process analysis possible — comparing sales and returns and support tickets by the same customer definition — and it's the discipline that keeps an incrementally built warehouse coherent.

**13. What is a role-playing dimension?**
One physical dimension referenced multiple times from a fact table in different roles — a single date dimension serving as order date, ship date, and delivery date, usually exposed through views with distinct column names.

**14. What is a degenerate dimension?**
An operational identifier that lives in the fact table with no corresponding dimension table, because it has no attributes of its own — an order number or ticket number, useful for grouping line items back to their parent.

**15. What is a junk dimension?**
A dimension assembled from several scattered low-cardinality flags and indicators, combined into one table of their observed combinations, to avoid cluttering the fact table with many small columns.

**16. What is a bridge table and what problem does it solve?**
A table resolving a many-to-many relationship between a fact and a dimension — multiple diagnoses per hospital visit, multiple authors per book. It usually carries a weighting factor so allocations can be made without double-counting.

**17. Describe SCD Types 0 through 3.**
Type 0: the attribute never changes. Type 1: overwrite, keeping only current truth. Type 2: add a new row with validity dates and a current flag, preserving full history. Type 3: add a column holding the prior value, giving one alternate view.

**18. What are the mechanics of a Type 2 change?**
Close the existing row by setting its end date and clearing its current flag, then insert a new row with a new surrogate key, the new attribute values, an effective date, an open-ended expiry, and the current flag set.

**19. How do you query a Type 2 dimension for point-in-time truth?**
Join on the surrogate key stored in the fact row (which already reflects the state at the time of the event), or filter the dimension where the date of interest falls between the validity dates.

**20. What determines the SCD type to use?**
A business requirement, not a technical preference: does the organization need to see historical facts attributed to the attribute values as they were at the time, or restated under current values?

**21. What is the enterprise bus architecture?**
An approach where the warehouse is built incrementally, one business process at a time, held together by a shared set of conformed dimensions rather than by a single up-front monolithic design.

**22. What is the bus matrix and what is it used for?**
A grid with business processes as rows and dimensions as columns, marking which dimensions each process uses. It's simultaneously a delivery plan, a scope tool, and a communication artifact for stakeholders.

**23. Star versus snowflake — what's the actual trade-off?**
Snowflaking normalizes dimensions into sub-tables, saving some storage and easing certain maintenance. It costs additional joins, harms query performance, and makes the model harder for business users to understand. Star is the default; snowflake for specific justified cases.

**24. Why is a date dimension worth building even though dates are computable?**
Because fiscal calendars, holidays, seasons, week numbering, and business-day flags are organization-specific and not derivable from a date function. Precomputing them once makes every downstream query simpler and consistent.

**25. What is drilling across?**
Querying two or more fact tables separately at a common conformed dimension grain and combining the results, rather than joining the fact tables directly — which would produce a Cartesian inflation.

**26. Why must you never join two fact tables directly?**
Their grains multiply, so each measure is duplicated by the cardinality of the other. Aggregate each to a common grain first, then join on the conformed keys.

**27. What is an aggregate fact table and what must be true for it to be safe?**
A pre-summarized fact table at a coarser grain, used to speed common queries. It must be built from conformed dimensions and kept consistent with the base fact table, and the query layer must know when it can substitute one for the other.

**28. What are audit dimensions for?**
Attaching lineage and quality metadata to fact rows — which ETL run produced them, which version of the logic, what quality screens they passed — so anomalies in a report can be traced to their processing origin.

**29. What is late-arriving data and why is it hard?**
Fact rows that arrive after the dimension state they should be associated with has already changed, or dimension changes learned about after facts referencing that period were loaded. Handling it correctly requires retroactively inserting dimension rows and reassigning surrogate keys.

**30. Why does the book present so many industry case studies?**
Because dimensional modeling is a judgment skill, and judgment is built by seeing many concrete situations. Each case study introduces techniques in the context where they are actually needed rather than as abstract patterns.

**31. Is Kimball's method still relevant in the cloud warehouse era?**
The physical justifications have weakened — columnar storage and elastic compute make joins cheaper — but the modeling discipline holds. Declaring grain, conforming dimensions, and handling history correctly are semantic problems that no amount of compute solves.

**32. What's the most common failure in real-world warehouse projects, per this method?**
Not declaring the grain precisely, or allowing mixed grains into one fact table — which produces numbers that are subtly wrong in ways nobody catches until a decision has been made on them.

**33. What single artifact would you produce first on a new warehouse project?**
The bus matrix — because it forces the conversation about which processes matter and which dimensions must be shared, before anyone writes DDL.

<a name="11-also-worth-your-time"></a>
# 11. Also Worth Your Time

Shorter treatments of books that belong on the shelf without needing a full chapter here.

### SQL Queries for Mere Mortals — John Viescas
**What it is:** exceptionally thorough on the mechanics of translating a plain-English request into a correct query. Slower and more patient than Beaulieu, with a distinctive method: write the request as a sentence, then transform it clause by clause.
**Best for:** people who understand each SQL clause individually but freeze when facing a blank editor and a business question.
**Key idea worth stealing:** the "request statement" technique — restate the requirement in a rigid template ("Select the *what* from the *where* that satisfies *which conditions*") before writing any SQL. It surfaces ambiguities and missing joins before you've written a line.

### Joe Celko's SQL for Smarties — Joe Celko
**What it is:** deep, opinionated, occasionally cranky, and unmatched on set-based thinking and the theory underneath SQL. Covers modeling techniques (nested sets for hierarchies is Celko's signature), advanced queries, and the philosophical case against procedural habits.
**Caveats:** some material is dated, the tone is combative, and the code style is idiosyncratic.
**Best for:** experienced practitioners who want to be argued with. Read *Trees and Hierarchies in SQL for Smarties* if hierarchies are your specific problem.

### Head First SQL — Lynn Beighley
**What it is:** highly visual, repetitive by design, aimed at absolute beginners.
**Best for:** people who bounce off conventional technical prose. If Beaulieu feels dense on page 40, start here and return.

### Database Design for Mere Mortals — Michael Hernandez
**What it is:** a step-by-step design methodology that is entirely engine-agnostic and covers no SQL at all — purely how to get from a business domain to a correct schema.
**Best for:** anyone who has learned to query but has never designed a database from a blank page.

### T-SQL Querying / T-SQL Window Functions — Itzik Ben-Gan
**What they are:** the advanced follow-ups to *T-SQL Fundamentals*. *Querying* covers the optimizer, plan analysis, and query tuning in depth. *Window Functions* is the definitive treatment of the topic, and useful well beyond SQL Server.
**Best for:** after *Fundamentals*, when performance becomes your problem.

### PostgreSQL: Up and Running / PostgreSQL 16 Administration Cookbook
**What they are:** the practical operational companions to Fontaine's more philosophical book — setup, configuration, monitoring, backup, replication, upgrades.
**Best for:** running PostgreSQL rather than writing queries against it.

### Fundamentals of Data Engineering — Reis & Housley
**What it is:** the architectural overview of the data engineering discipline — the lifecycle from generation through ingestion, storage, transformation, and serving, deliberately tool-agnostic.
**Best for:** orienting yourself before picking up specific tools, and for anyone moving from analytics into engineering.

### Streaming Systems — Akidau, Chernyak & Lax
**What it is:** the definitive treatment of stream processing semantics — event time versus processing time, windowing, watermarks, and triggers. It's the depth behind Kleppmann's stream processing chapter.
**Best for:** anyone building real-time pipelines.

### Refactoring Databases — Ambler & Sadalage
**What it is:** a catalogue of evolutionary database design techniques — how to change a schema in production, safely, incrementally, with the application still running.
**Best for:** teams doing continuous delivery against a shared database.
