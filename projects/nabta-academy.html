<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>أكاديمية نبتة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="shelf-vendor:/fonts/ef571b0c0ca2.css">
<style>
/* Layout: a bright toy-box — confetti-dotted sky page, a big green "garden" hero, every stage and subject owns a saturated crayon colour, chunky 3D buttons sized for small thumbs */
:root{
  --bg:#F5F8FF; --paper:#FFFFFF; --soft:#EEF3FF; --ink:#152042; --muted:#5A6688; --line:#E0E7F6;
  --brand:#10B26C; --brand-d:#078A52; --brand-ink:#FFFFFF;
  --sun:#FFC21A; --sun-d:#D99A00; --coral:#FF5C5C; --sky:#2F8CFF; --berry:#F2468F; --tang:#FF8A1F; --grape:#8A5CF6; --teal:#12B5A6;
  --ok:#17A862; --bad:#E5484D;
  --c-code:#2F7BFF; --c-think:#F2468F; --c-sci:#12B5A6; --c-ar:#F57C00; --c-en:#8A5CF6; --c-math:#FF5C5C; --c-life:#B7791F; --c-de:#475569; --c-soc:#0E7490;
  --hero1:#0FB36E; --hero2:#0A9E9B;
  --f-display:"Lalezar","Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-body:"Baloo Bhaijaan 2","Segoe UI",Tahoma,Arial,sans-serif;
  --shadow:0 3px 0 var(--line),0 14px 30px -18px rgba(21,32,66,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1326; --paper:#182040; --soft:#1F2A50; --ink:#EEF2FF; --muted:#A6B1D1; --line:#2B3762;
  --brand:#25CF86; --brand-d:#0F9A5E; --brand-ink:#04281A;
  --sun:#FFCF3F; --sun-d:#C99512; --coral:#FF7676; --sky:#5AA6FF; --berry:#FF6AAA; --tang:#FFA04A; --grape:#A585FF; --teal:#2DD4C3;
  --ok:#35D07F; --bad:#FF6B6E;
  --c-code:#5C98FF; --c-think:#FF6AAA; --c-sci:#2DD4C3; --c-ar:#FFA04A; --c-en:#A585FF; --c-math:#FF7676; --c-life:#E0A84A; --c-de:#A3B3C9; --c-soc:#4FC3DB;
  --hero1:#0B8F58; --hero2:#0A7472;
  --shadow:0 3px 0 var(--line),0 16px 34px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1326; --paper:#182040; --soft:#1F2A50; --ink:#EEF2FF; --muted:#A6B1D1; --line:#2B3762;
  --brand:#25CF86; --brand-d:#0F9A5E; --brand-ink:#04281A;
  --sun:#FFCF3F; --sun-d:#C99512; --coral:#FF7676; --sky:#5AA6FF; --berry:#FF6AAA; --tang:#FFA04A; --grape:#A585FF; --teal:#2DD4C3;
  --ok:#35D07F; --bad:#FF6B6E;
  --c-code:#5C98FF; --c-think:#FF6AAA; --c-sci:#2DD4C3; --c-ar:#FFA04A; --c-en:#A585FF; --c-math:#FF7676; --c-life:#E0A84A; --c-de:#A3B3C9; --c-soc:#4FC3DB;
  --hero1:#0B8F58; --hero2:#0A7472;
  --shadow:0 3px 0 var(--line),0 16px 34px -20px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;min-height:100%;
  background-image:
   radial-gradient(circle at 6% 14%,color-mix(in srgb,var(--sun) 22%,transparent) 0 70px,transparent 71px),
   radial-gradient(circle at 96% 38%,color-mix(in srgb,var(--berry) 14%,transparent) 0 90px,transparent 91px),
   radial-gradient(circle at 4% 72%,color-mix(in srgb,var(--sky) 14%,transparent) 0 80px,transparent 81px),
   radial-gradient(circle at 92% 92%,color-mix(in srgb,var(--grape) 12%,transparent) 0 70px,transparent 71px),
   radial-gradient(color-mix(in srgb,var(--muted) 18%,transparent) 1.2px,transparent 1.3px);
  background-size:100% 100%,100% 100%,100% 100%,100% 100%,24px 24px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--c-math),var(--c-ar),var(--sun),var(--c-sci),var(--c-code),var(--c-en),var(--c-think))}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo .mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--hero1),var(--hero2));display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 4px 0 var(--brand-d)}
.logo b{font-family:var(--f-display);font-size:30px;font-weight:400;color:var(--ink);line-height:1}
.logo small{color:var(--muted);font-size:13px;display:block;line-height:1.2}
.logo span.t{display:grid;text-align:start}
.nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--soft)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.chip-stars{display:flex;align-items:center;gap:6px;background:var(--sun);color:#3A2A00;border-radius:999px;padding:4px 14px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--sun-d)}
.star{color:#fff;font-size:1.1em;line-height:1;text-shadow:0 1px 0 var(--sun-d)}
.iconbtn{border:2px solid var(--line);background:var(--paper);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;padding:0}

main{padding-block:26px 72px}
.section{display:grid;gap:20px;margin-bottom:44px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:800}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,4vw,38px)}
.sh h2 .u{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--sun) 55%,transparent) 62%);padding:0 4px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:34px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;box-shadow:0 18px 40px -22px color-mix(in srgb,var(--hero1) 80%,#000)}
.hero .deco{position:absolute;pointer-events:none}
.hero .d1{width:180px;height:180px;border-radius:50%;background:var(--sun);top:-60px;left:-40px;opacity:.95}
.hero .d2{width:0;height:0;border-left:46px solid transparent;border-right:46px solid transparent;border-bottom:80px solid var(--berry);bottom:26px;left:34%;transform:rotate(18deg);opacity:.9}
.hero .d3{width:90px;height:90px;border-radius:24px;background:var(--sky);bottom:-30px;right:8%;transform:rotate(20deg);opacity:.9}
.hero .d4{width:26px;height:26px;border-radius:50%;background:#fff;top:40px;left:42%;opacity:.5}
.hero .d5{width:14px;height:14px;border-radius:50%;background:var(--sun);top:70%;right:46%;opacity:.9}
.hero-in{position:relative;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;padding:36px}
.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.hero h1{font-size:clamp(36px,5.4vw,60px);margin-top:12px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p.lead{margin-top:10px;max-width:56ch;color:rgba(255,255,255,.92);font-size:18px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stats div{background:rgba(255,255,255,.15);border-radius:16px;padding:6px 14px;display:grid;line-height:1.2}
.stats b{font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stats small{font-size:13px;opacity:.9}
.profile{display:grid;gap:10px;background:var(--paper);color:var(--ink);border-radius:26px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.profile h3{font-size:24px}
.profile label{font-weight:700;font-size:15px}
.profile .row{display:flex;gap:10px;flex-wrap:wrap}
.profile input,.profile select{flex:1;min-width:0;font:inherit;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.ages{display:flex;flex-wrap:wrap;gap:6px}
.ages button{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--soft);font-weight:800;font-variant-numeric:tabular-nums}
.ages button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun-d);color:#3A2A00}

.btn{border:0;border-radius:16px;padding:12px 22px;font-weight:800;font-size:17px;background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d)}
.btn.sun{background:var(--sun);color:#3A2A00;box-shadow:0 5px 0 var(--sun-d)}
.btn.white{background:#fff;color:#0A6B45;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.ghost,.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:14px;padding:8px 14px;font-weight:700}

/* stages */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stage{--s:var(--brand);background:var(--paper);border:0;border-radius:26px;padding:0;text-align:start;display:grid;grid-template-rows:auto 1fr;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s}
.stage:hover{transform:translateY(-4px) rotate(-.4deg)}
.stage .art{background:var(--s);position:relative;padding:14px 14px 0;display:grid}
.stage .art::after{content:"";position:absolute;inset:auto 0 0;height:22px;background:var(--paper);border-radius:22px 22px 0 0}
.stage .art svg{width:100%;height:110px;position:relative;z-index:1}
.stage .agechip{position:absolute;top:12px;inset-inline-start:12px;background:var(--paper);color:var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;z-index:2}
.stage .body{padding:4px 18px 18px;display:grid;gap:8px;align-content:start}
.stage h3{font-size:30px;color:var(--s)}
.stage p{color:var(--muted);font-size:15px}
.stage .prog{height:10px;border-radius:9px;background:var(--soft);overflow:hidden}
.stage .prog i{display:block;height:100%;background:var(--s);border-radius:9px}
.stage[aria-current="true"]{outline:4px solid var(--s);outline-offset:3px}
.stage .here{font-size:12px;font-weight:800;color:var(--s)}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.subj{--c:var(--brand);display:grid;gap:8px;justify-items:start;background:var(--c);color:#fff;border-radius:24px;padding:16px;text-align:start;border:0;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 65%,#000);position:relative;overflow:hidden;transition:transform .15s}
.subj:hover{transform:translateY(-3px)}
.subj::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14);bottom:-30px;left:-24px}
.subj .gl{font-family:var(--f-display);font-size:34px;direction:ltr;line-height:1}
.subj b{font-size:18px}
.subj small{font-size:13px;line-height:1.4;opacity:.92}
.glyph{--c:var(--brand);width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:800;font-size:19px;direction:ltr;transform:rotate(-5deg);flex:none;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.note{--c:var(--brand);background:var(--paper);border-radius:22px;padding:18px;display:grid;gap:6px;box-shadow:var(--shadow);border-top:6px solid var(--c)}
.note h3{font-size:22px;color:var(--c)}
.note p{color:var(--muted);font-size:15.5px}

/* stage page */
.stagehead{--s:var(--brand);display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:var(--s);color:#fff;border-radius:30px;padding:22px 26px;box-shadow:0 16px 34px -22px var(--s);position:relative;overflow:hidden}
.stagehead::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);top:-90px;left:-60px}
.stagehead .pot{background:var(--paper);border-radius:26px;width:120px;height:120px;display:grid;place-items:center;position:relative}
.stagehead svg{width:100px;height:100px}
.stagehead h1{font-size:clamp(34px,4.5vw,50px)}
.stagehead .eyebrow,.stagehead p{color:rgba(255,255,255,.92)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
.headbtns{display:grid;gap:10px;position:relative}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{--c:var(--brand);border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 16px 6px 12px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.tab .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.tab[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.tab[aria-pressed="true"] .dot{background:#fff}
.tab small{font-variant-numeric:tabular-nums}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lesson{--c:var(--brand);background:var(--paper);border:0;border-radius:24px;padding:0;display:grid;grid-template-rows:auto 1fr auto;text-align:start;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.lesson:hover{transform:translateY(-4px)}
.lesson .lhead{background:color-mix(in srgb,var(--c) 14%,var(--paper));display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:3px dashed color-mix(in srgb,var(--c) 35%,var(--paper))}
.lesson .glyph{width:44px;height:44px;font-size:16px;border-radius:13px}
.lesson .lsub{font-weight:800;color:var(--c);font-size:14px;flex:1}
.lesson .lbody{padding:12px 16px;display:grid;gap:4px;align-content:start}
.lesson h3{font-size:22px}
.lesson .sk{color:var(--muted);font-size:14.5px;line-height:1.5}
.lesson .lf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 14px}
.lesson .meth{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:8px;padding:2px 8px}
.lesson .lgo{font-weight:800;color:var(--c);font-size:15px}
.stars3{letter-spacing:1px;font-size:18px;color:color-mix(in srgb,var(--muted) 35%,var(--paper));white-space:nowrap}
.stars3 .on{color:var(--sun)}
.tipbox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:color-mix(in srgb,var(--sun) 20%,var(--paper));border:2px dashed var(--sun-d);border-radius:22px;padding:16px 18px}
.tipbox .bulb{width:46px;height:46px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:#3A2A00}
.tipbox h3{font-size:20px}

/* player */
.player{--c:var(--brand);max-width:840px;margin:0 auto;display:grid;gap:14px}
.ptop{display:flex;align-items:center;gap:12px}
.ptitle{font-weight:800;color:var(--c);font-size:15px}
.pbar{flex:1;display:flex;gap:5px}
.pbar i{flex:1;height:12px;border-radius:9px;background:var(--line)}
.pbar i.done{background:var(--c)}
.pbar i.now{background:var(--sun)}
.pcount{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.qcard{background:var(--paper);border-radius:30px;padding:26px;box-shadow:var(--shadow);display:grid;gap:18px;border-top:8px solid var(--c)}
.qcard.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.qhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qtext{font-family:var(--f-body);font-weight:800;font-size:clamp(21px,3vw,28px);line-height:1.5}
.qtext b{color:var(--c)}
.say{flex:none;width:50px;height:50px;border-radius:50%;border:0;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
.big{font-size:clamp(40px,8vw,64px);line-height:1.25;text-align:center;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;background:var(--soft);border-radius:22px;padding:16px}
.big .huge{font-family:var(--f-display);font-size:1.5em;color:var(--c);direction:ltr;display:inline-block}
.grp{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:340px}
.grp i{font-style:normal}
.grp.sm{font-size:32px;max-width:200px}
.shadowbox{display:inline-grid;place-items:center;width:140px;height:140px;border-radius:50%;background:#E6EEFF}
.shadowbox span{filter:brightness(0);opacity:.85;font-size:84px;line-height:1}
.passage{background:color-mix(in srgb,var(--sun) 14%,var(--paper));border-inline-start:6px solid var(--sun);border-radius:16px;padding:14px 18px;font-size:18px;line-height:1.95}
.passage[dir="ltr"]{border-inline-start:0;border-left:6px solid var(--sun)}
pre.code{margin:0;direction:rtl;text-align:right;font-family:var(--f-body);font-size:19px;font-weight:600;background:#131B36;color:#E9EEFF;border-radius:18px;padding:16px 20px;white-space:pre-wrap;line-height:1.85;overflow-x:auto;border-inline-start:6px solid var(--c-code)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{--o:var(--sky);min-height:74px;border:3px solid color-mix(in srgb,var(--o) 45%,var(--line));background:color-mix(in srgb,var(--o) 9%,var(--paper));border-radius:20px;padding:10px 14px;font-size:21px;font-weight:700;display:grid;place-items:center;text-align:center;line-height:1.35;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,var(--line));transition:transform .1s}
.opt:nth-child(4n+2){--o:var(--berry)}.opt:nth-child(4n+3){--o:var(--tang)}.opt:nth-child(4n+4){--o:var(--grape)}
.opts.emo .opt{font-size:48px;min-height:104px}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt.ok{--o:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--paper))}
.opt.bad{--o:var(--bad);border-color:var(--bad);opacity:.6}
.dotc{display:inline-block;width:62px;height:62px;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
.frac{display:inline-grid;font-family:var(--f-display);font-size:34px;line-height:1;text-align:center}
.frac b{font-weight:400;border-bottom:3px solid currentColor;padding:0 6px 4px}
.frac i{font-style:normal;padding-top:4px}
.clock,.fig{width:min(220px,70vw);height:auto}
.fig.wide{width:min(320px,85vw)}

.ansbox{min-height:78px;border:3px dashed var(--c);border-radius:20px;display:grid;place-items:center;font-family:var(--f-display);font-size:46px;color:var(--c);max-width:260px;width:100%;margin:0 auto;font-variant-numeric:tabular-nums;background:var(--soft)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:460px;width:100%;margin:0 auto}
.keypad button{min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:26px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.keypad button:active{transform:translateY(3px);box-shadow:none}
.keypad .go{grid-column:span 3;background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-size:21px;box-shadow:0 4px 0 var(--brand-d)}
.keypad .del{grid-column:span 2;font-size:19px}

.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.slot{min-width:92px;min-height:64px;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;padding:6px 10px;font-weight:700;color:var(--muted);font-size:18px;text-align:center}
.slot.f{border-style:solid;border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,var(--paper))}
.slot.letter,.tile.letter{font-family:var(--f-display);font-size:34px;min-width:68px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{border:3px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--paper);border-radius:16px;padding:10px 14px;font-weight:700;font-size:18px;min-height:56px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 30%,var(--line))}

.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:10px;align-content:start}
.mi{border:3px solid var(--line);background:var(--paper);border-radius:16px;min-height:60px;padding:8px 12px;font-weight:700;font-size:19px;box-shadow:0 3px 0 var(--line)}
.mi.emo{font-size:32px}
.mi.sel{border-color:var(--sun-d);background:color-mix(in srgb,var(--sun) 30%,var(--paper))}
.mi.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--paper));opacity:.7}
.mi.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper))}

.sortpool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px}
.sortpool button{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 14px;font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--line)}
.sortpool button.sel{border-color:var(--sun-d);background:color-mix(in srgb,var(--sun) 30%,var(--paper));transform:translateY(-3px)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bucket{--o:var(--sky);border:3px solid var(--o);background:color-mix(in srgb,var(--o) 9%,var(--paper));border-radius:22px;padding:10px;display:grid;gap:8px;align-content:start;min-height:130px;text-align:center}
.bucket:nth-child(2){--o:var(--berry)}.bucket:nth-child(3){--o:var(--tang)}
.bucket b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--o)}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bucket .in span{background:var(--paper);border-radius:10px;padding:2px 8px;font-size:15px;font-weight:700}
.bucket.flash{border-color:var(--bad);animation:shake .35s}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto;width:100%}
.mem.c3{grid-template-columns:repeat(3,1fr);max-width:400px}
.card{aspect-ratio:1;max-width:100%;border-radius:18px;border:0;font-size:40px;display:grid;place-items:center;background:linear-gradient(145deg,var(--grape),var(--berry));color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--grape) 60%,#000);transition:transform .2s}
.card:nth-child(3n+2){background:linear-gradient(145deg,var(--sky),var(--teal))}
.card:nth-child(3n+3){background:linear-gradient(145deg,var(--tang),var(--sun))}
.card.up{background:var(--paper);color:var(--ink);transform:rotateY(180deg);box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}
.card.up span{transform:rotateY(180deg)}
.card.got{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border-color:var(--ok)}
.card .back{font-family:var(--f-display);font-size:30px}

.robot{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.grid{direction:ltr;display:grid;gap:4px;background:color-mix(in srgb,var(--c-code) 25%,var(--line));padding:5px;border-radius:18px;width:min(330px,86vw)}
.cell{aspect-ratio:1;background:var(--paper);border-radius:10px;display:grid;place-items:center;font-size:clamp(18px,4.4vw,30px)}
.cell:nth-child(odd){background:color-mix(in srgb,var(--c-code) 5%,var(--paper))}
.cell.wall{background:color-mix(in srgb,var(--coral) 35%,var(--paper))}
.cell.path{background:color-mix(in srgb,var(--sun) 45%,var(--paper))}
.rpanel{display:grid;gap:12px;min-width:0}
.cmds{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmds button{min-height:58px;border-radius:16px;border:0;background:var(--c-code);color:#fff;font-size:24px;font-weight:800;display:grid;line-height:1.1;padding:4px;box-shadow:0 4px 0 color-mix(in srgb,var(--c-code) 60%,#000)}

.mults{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mults button{border:0;background:var(--c-think);color:#fff;border-radius:12px;padding:5px 14px;font-weight:800;box-shadow:0 3px 0 color-mix(in srgb,var(--c-think) 60%,#000)}
.rprog{direction:ltr;display:flex;flex-wrap:wrap;gap:6px;min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;background:var(--soft)}
.rprog span{background:var(--c-code);color:#fff;border-radius:10px;padding:4px 10px;font-weight:800;font-size:19px}
.rprog span.cur{background:var(--sun);color:#3A2A00}
.rprog em{color:var(--muted);font-style:normal;font-size:14px;align-self:center;direction:rtl}
.rinfo{font-size:14.5px;color:var(--muted)}

.fb{border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;border:3px solid;font-weight:800;font-size:19px}
.fb.good{background:color-mix(in srgb,var(--ok) 15%,var(--paper));border-color:var(--ok)}
.fb.try{background:color-mix(in srgb,var(--sun) 22%,var(--paper));border-color:var(--sun-d)}
.fb.bad{background:color-mix(in srgb,var(--bad) 10%,var(--paper));border-color:var(--bad)}
.fb small{display:block;font-weight:500;color:var(--muted);font-size:15px}

.result{max-width:660px;margin:0 auto;text-align:center;background:var(--paper);border-radius:34px;padding:0 0 30px;box-shadow:var(--shadow);display:grid;gap:14px;justify-items:center;overflow:hidden}
.result .rtop{width:100%;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:26px 20px 20px;display:grid;gap:4px}

.result .bigstars{font-size:70px;letter-spacing:6px;color:rgba(255,255,255,.3);line-height:1.1}
.result .bigstars .on{color:var(--sun);text-shadow:0 4px 0 var(--sun-d)}
.result h1{font-size:40px;padding:0 16px}
.result p{padding:0 16px}
.result .score{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

.panel{background:var(--paper);border-radius:26px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.panel h2{font-size:28px}
.bars{display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-weight:700}
.barrow .track{height:16px;background:var(--soft);border-radius:9px;overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:9px;background:var(--c)}
.barrow span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:4px;justify-items:center;text-align:center;opacity:.5;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--paper))}
.badge .medal{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--sun) 60%,var(--sun-d));display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:#3A2A00;box-shadow:0 4px 0 var(--sun-d)}
.badge small{color:var(--muted);font-size:13px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
table.plan{width:100%;border-collapse:collapse;font-size:15px}
table.plan th,table.plan td{border-bottom:1px solid var(--line);padding:12px 8px;text-align:start;vertical-align:top}
table.plan th{font-size:13px;color:var(--muted);letter-spacing:.03em}
.tscroll{overflow-x:auto}
.lvpick{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))!important}
.cmb{font-weight:800;color:var(--tang);min-width:2.5em;font-variant-numeric:tabular-nums}.cmb.pop{animation:pop .35s}
.qtimer{height:10px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:-8px}.qtimer i{display:block;height:100%;width:100%;background:var(--tang);border-radius:9px;transition:width .1s linear}.qtimer i.low{background:var(--bad)}
.revchip{justify-self:start;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--berry) 14%,var(--paper));color:var(--berry);border-radius:999px;padding:2px 12px}
.extras{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.combo{font-size:14px;background:color-mix(in srgb,var(--tang) 20%,var(--paper));border-radius:999px;padding:2px 10px;animation:pop .4s}.combo.fast{background:color-mix(in srgb,var(--sky) 20%,var(--paper))}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg) scale(1.05);opacity:.92;box-shadow:0 12px 24px -8px rgba(0,0,0,.35)}
.dragsrc{opacity:.35}
.scw{display:grid;place-items:center;touch-action:none;cursor:pointer}.scw .clock{width:min(240px,72vw)}
.nlw{touch-action:none;cursor:pointer;display:grid;place-items:center}
.fps{cursor:pointer;transition:fill .15s}.fps:hover{opacity:.85}
.balance{display:grid;justify-items:center;padding:10px 0}
.beam{width:min(380px,76vw);display:grid;grid-template-columns:1fr 1fr;gap:24px;border-bottom:6px solid var(--ink);border-radius:4px;padding-bottom:6px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.pan{min-height:64px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:end;background:color-mix(in srgb,var(--sun) 18%,var(--paper));border:3px solid var(--sun-d);border-radius:0 0 40px 40px;padding:6px}
.pan em{color:var(--muted);font-size:13px;font-style:normal}
.stand{font-size:30px;line-height:1;color:var(--ink)}
.wt{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:800;font-family:sans-serif;padding:0 6px}
.wt[role=button]{cursor:pointer}.wt.w2{background:var(--sky)}.wt.w5{background:var(--grape)}.wt.w10{background:var(--coral);min-width:44px;height:40px}.wt.gift{background:none;font-size:30px}
.wbtn{border:0;border-radius:12px;padding:8px 14px;font-weight:800;background:var(--ink);color:var(--paper);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 60%,#000)}.wbtn.w2{background:var(--sky)}.wbtn.w5{background:var(--grape)}.wbtn.w10{background:var(--coral)}
.tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:var(--soft);border-radius:14px;padding:8px}
.bt{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.btcol{display:grid;gap:8px;justify-items:center;background:var(--soft);border-radius:16px;padding:10px}
.btpile{min-height:90px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-end;justify-content:center;width:100%}
.btpile i{display:block;background:var(--c-math);border:1.5px solid var(--ink);border-radius:2px}
.btpile.k1 i{width:12px;height:12px}.btpile.k10 i{width:10px;height:70px;background:var(--sky);background-image:repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,0,0,.25) 6px 7px)}
.btpile.k100 i{width:46px;height:46px;background:var(--grape);background-image:repeating-linear-gradient(0deg,transparent 0 4px,rgba(0,0,0,.2) 4px 5px),repeating-linear-gradient(90deg,transparent 0 4px,rgba(0,0,0,.2) 4px 5px)}
.btpile.k1000 i{width:54px;height:54px;background:var(--tang);box-shadow:5px -5px 0 color-mix(in srgb,var(--tang) 60%,#000)}
.lab{display:grid;gap:10px}
.labst{min-height:120px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--soft);border-radius:18px;font-size:40px}
.labst .wire{width:46px;height:5px;background:var(--ink);border-radius:3px}
.bulb{filter:grayscale(1) brightness(.6)}.bulb.on{filter:none;text-shadow:0 0 22px #FFD84D;animation:pop .4s}
.tank{width:180px;height:110px;border:4px solid var(--ink);border-top:0;border-radius:0 0 18px 18px;background:linear-gradient(transparent 22%,color-mix(in srgb,var(--sky) 45%,var(--paper)) 22%);position:relative}
.tank .lab-it{position:absolute;left:50%;transform:translateX(-50%);transition:top .6s ease-in}.tank .top{top:2px}.tank .bot{top:60px}
.lab-it{display:inline-block;transition:transform .5s}.lab-it.pull{transform:translateX(-40px)}
.labitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.labbtn{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:8px;display:grid;justify-items:center;gap:2px;box-shadow:0 3px 0 var(--line)}
.labbtn span{font-size:30px}.labbtn small{font-weight:700;font-size:13px}.labbtn em{font-style:normal;font-size:12px;color:var(--muted)}.labbtn.done{border-color:var(--ok)}
.bed{--c:var(--brand);background:var(--paper);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border-top:6px solid var(--c);display:grid;gap:10px}
.bed h3{color:var(--c);font-size:22px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.plot{border:0;border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:4px;background:linear-gradient(transparent 55%,color-mix(in srgb,#8B5A2B 30%,var(--paper)) 55%);cursor:pointer}
.plot .pl{font-size:38px;line-height:1;position:relative}.plot .pl i{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:18px;font-style:normal}
.plot.l0 .pl{opacity:.45}.plot small{font-size:11.5px;font-weight:700;line-height:1.3;text-align:center}
.plot.wig .pl{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

.studio{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
#ttc{width:min(330px,84vw);height:auto;aspect-ratio:1;max-width:100%;background:var(--paper);border:3px solid color-mix(in srgb,var(--c-code) 35%,var(--line));border-radius:18px}
.tpanel{display:grid;gap:10px;min-width:0}
.tpal{display:flex;flex-wrap:wrap;gap:6px}
.tpal button{border:0;border-radius:12px;padding:8px 12px;font-weight:800;background:var(--c-code);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c-code) 60%,#000)}
.tpal button:nth-child(n+4){background:var(--c-think);box-shadow:0 3px 0 color-mix(in srgb,var(--c-think) 60%,#000)}
.tpal button:nth-child(n+6){background:var(--tang);box-shadow:0 3px 0 color-mix(in srgb,var(--tang) 60%,#000)}
.tprog{display:grid;gap:6px;min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px;background:var(--soft);max-height:260px;overflow:auto}

.tb{background:var(--c-code);color:#fff;border-radius:10px;padding:4px 12px;font-weight:800;width:fit-content}
.tb.rep{background:color-mix(in srgb,var(--tang) 22%,var(--paper));color:var(--ink);border:2px solid var(--tang);width:auto}
.tin{display:grid;gap:4px;padding:6px 0 2px;padding-inline-start:16px}
.writebox{display:grid;gap:10px}
.writebox textarea{font:inherit;font-size:19px;line-height:1.8;padding:12px 14px;border-radius:16px;border:3px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--paper);color:var(--ink);resize:vertical;width:100%}

.checks2 input{width:20px;height:20px;accent-color:var(--brand)}
.poem{font-family:var(--f-body);font-weight:800;font-size:clamp(19px,3.2vw,24px);line-height:2.1;text-align:center}
@media (max-width:900px){.studio{grid-template-columns:1fr;justify-items:center}.tpanel{width:100%}}

.gmap{border-collapse:collapse;font-size:clamp(22px,5vw,30px)}
.gmap th{font-size:15px;color:var(--muted);padding:2px 6px;font-family:var(--f-body)}
.gmap td{width:1.9em;height:1.9em;text-align:center;border:2px solid color-mix(in srgb,var(--c-soc) 40%,var(--line));background:color-mix(in srgb,var(--c-soc) 6%,var(--paper))}
.compass{display:inline-grid;justify-items:center;gap:4px;font-size:15px}.compass>span{display:flex;align-items:center;gap:10px}.compass i{font-style:normal;font-size:44px}.compass b{background:var(--paper);border-radius:8px;padding:0 6px;color:var(--c-soc)}

.opts.one{grid-template-columns:1fr}.opts.one .opt{font-size:17px;min-height:56px;text-align:start;justify-items:start;line-height:1.6}
.irs{font-family:var(--f-body);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.8}

.lsub small.dom{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.inbox{display:inline-grid;place-items:center;width:1.7em;height:1.5em;border:5px solid #B7791F;border-top:0;border-radius:0 0 12px 12px;background:color-mix(in srgb,#B7791F 18%,var(--paper))}
.sym{font-family:Georgia,"Times New Roman",serif;font-size:44px;font-weight:700}
.bits{display:inline-flex;gap:10px}.bits span{display:grid;justify-items:center;gap:4px}.bits b{font-size:42px;line-height:1}.bits small{font-size:16px;font-weight:800;color:var(--muted);font-family:sans-serif}
.cstat{background:rgba(255,255,255,.2);border-radius:14px;padding:6px 14px;display:grid;line-height:1.2;text-align:center}.cstat b{font-family:var(--f-display);font-weight:400;font-size:26px}.cstat small{font-size:12px}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.currsub{border-top:6px solid var(--c)}
.cshead{display:flex;gap:12px;align-items:center}.cshead h2{color:var(--c)}
.strand{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.sthead b{display:block;font-size:17px}.sthead small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.stl{display:flex;flex-wrap:wrap;gap:8px;align-content:start}
.lchip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.lchip.p{border-color:var(--sun-d);background:color-mix(in srgb,var(--sun) 22%,var(--paper))}

.arr{display:inline-grid;justify-items:center;line-height:1.05;font-size:1.1em}.arr.row{display:inline-flex;gap:6px;align-items:end}
.queue{display:inline-flex;gap:10px;padding:6px 14px;border-bottom:4px solid var(--line)}
.lbar{display:inline-block;height:26px;border-radius:13px;max-width:100%}
.opts .opt .lbar{height:22px}
.grpbox{display:inline-flex;border:3px dashed var(--line);border-radius:16px;padding:6px;margin:4px}

.picto small{color:var(--muted)}
table.latin{border-collapse:collapse;font-size:clamp(24px,6vw,36px)}

.tierchip{font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;color:#fff}.tierchip.t0{background:var(--brand)}.tierchip.t1{background:var(--sky)}.tierchip.t2{background:var(--grape)}
.tierhead{--c:var(--brand);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-top:8px;padding:12px 16px;border-radius:20px;background:color-mix(in srgb,var(--c) 10%,var(--paper));border:2px solid color-mix(in srgb,var(--c) 35%,var(--line))}

.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}

.lv .lic{font-size:34px;line-height:1}.lv b{color:var(--c);font-size:18px}.lv small{color:var(--muted);font-size:12.5px;line-height:1.45}

.hintup{background:color-mix(in srgb,var(--sun) 20%,var(--paper));border:2px dashed var(--sun-d);border-radius:16px;padding:8px 14px;font-weight:600}

@media (max-width:640px){.ladder,.lvpick{grid-template-columns:1fr}.rung:nth-child(n){margin-bottom:0}.tierhead{grid-template-columns:auto 1fr}.tierhead .tcount{display:none}}

.tracewrap{display:grid;place-items:center}
#tc{width:min(300px,78vw);height:auto;aspect-ratio:1;max-width:100%;background:var(--soft);border-radius:24px;border:3px dashed color-mix(in srgb,var(--c) 45%,var(--line));touch-action:none;cursor:crosshair}

.cert{--s:var(--brand);background:linear-gradient(135deg,var(--s),var(--sun));padding:10px;border-radius:30px;box-shadow:var(--shadow)}

.hero-in.one{grid-template-columns:1fr}

.subj .sbar{width:100%;height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}

.guide .note:nth-child(6n+1){--c:var(--berry)}.guide .note:nth-child(6n+2){--c:var(--sky)}.guide .note:nth-child(6n+3){--c:var(--tang)}.guide .note:nth-child(6n+4){--c:var(--grape)}.guide .note:nth-child(6n+5){--c:var(--teal)}.guide .note:nth-child(6n+6){--c:var(--coral)}

<script>
/* ============ helpers ============ */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ar=n=>String(n);
const N=(k,f)=>Array.from({length:k},(_,i)=>f(i));
function nums(n,lo,hi,k){const s=new Set();let g=0;while(s.size<k&&g++<300){const x=rnd(lo,hi);if(x!==n)s.add(x)}return[...s]}
function mc(q,a,w,o={}){const ws=[...new Set(w.map(String))].filter(x=>x!==String(a));return Object.assign({t:'mcq',q,a:String(a),opts:shuffle([String(a),...ws])},o)}
function others(list,item,k){return shuffle(list.filter(x=>x!==item)).slice(0,k)}
function bank(list,k,f){return shuffle(list).slice(0,k).map(x=>f(x,list))}
const fromQ=(list,k=5,o={})=>()=>bank(list,k,x=>mc(x[0],x[1],x[2],Object.assign({},o,x[3]||{})));
const grp=(e,n,cls='')=>`<span class="grp ${cls}">${`<i>${e}</i>`.repeat(n)}</span>`;
const strip=s=>String(s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();

/* ============ figures ============ */
function clock(h,m){
  let s=`<svg class="clock" viewBox="0 0 120 120" role="img" aria-label="ساعة"><circle cx="60" cy="60" r="55" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>`;
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${60+43*Math.sin(a)}" y="${60-43*Math.cos(a)+4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="Baloo Bhaijaan 2,sans-serif">${ar(i)}</text>`}
  const ha=((h%12)+m/60)*Math.PI/6, ma=m*Math.PI/30;
  s+=`<line x1="60" y1="60" x2="${60+40*Math.sin(ma)}" y2="${60-40*Math.cos(ma)}" stroke="var(--c-code)" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<line x1="60" y1="60" x2="${60+26*Math.sin(ha)}" y2="${60-26*Math.cos(ha)}" stroke="var(--coral)" stroke-width="7" stroke-linecap="round"/><circle cx="60" cy="60" r="5" fill="var(--ink)"/></svg>`;
  return s;
}
function pie(n,d){
  let s=`<svg class="fig" viewBox="0 0 120 120" role="img" aria-label="دائرة مقسمة"><circle cx="60" cy="60" r="54" fill="var(--paper)"/>`;
  for(let i=0;i<d;i++){const a0=i/d*2*Math.PI-Math.PI/2,a1=(i+1)/d*2*Math.PI-Math.PI/2;
    s+=`<path d="M60 60 L${60+54*Math.cos(a0)} ${60+54*Math.sin(a0)} A54 54 0 0 1 ${60+54*Math.cos(a1)} ${60+54*Math.sin(a1)} Z" fill="${i<n?'var(--c-math)':'var(--paper)'}" stroke="var(--ink)" stroke-width="2.5"/>`}
  return s+`</svg>`;
}
const frac=(n,d)=>`<span class="frac"><b>${ar(n)}</b><i>${ar(d)}</i></span>`;
function rect(w,h){const c=22,W=w*c,H=h*c;let s=`<svg class="fig wide" viewBox="-6 -6 ${W+12} ${H+12}" role="img" aria-label="مستطيل">`;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)s+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="color-mix(in srgb,var(--c-math) 22%,var(--paper))" stroke="var(--c-math)" stroke-width="1.5"/>`;
  return s+`<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="var(--ink)" stroke-width="3"/></svg>`}
function angle(a){const r=a*Math.PI/180,vx=80,vy=95,L=70;const x2=vx+L*Math.cos(r),y2=vy-L*Math.sin(r);
  let mark=a===90?`<path d="M${vx+16} ${vy} V${vy-16} H${vx}" fill="none" stroke="var(--coral)" stroke-width="3"/>`:
  `<path d="M${vx+22} ${vy} A22 22 0 0 0 ${vx+22*Math.cos(r)} ${vy-22*Math.sin(r)}" fill="none" stroke="var(--coral)" stroke-width="3"/>`;
  return `<svg class="fig wide" viewBox="0 0 170 110" role="img" aria-label="زاوية"><line x1="${vx}" y1="${vy}" x2="160" y2="${vy}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><line x1="${vx}" y1="${vy}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>${mark}<circle cx="${vx}" cy="${vy}" r="4" fill="var(--ink)"/></svg>`}
function plant(i){const h=[18,34,52,70][i],leaves=[1,2,3,4][i];
  let s=`<svg viewBox="0 0 120 110" aria-hidden="true"><path d="M38 84h44l-6 22H44z" fill="var(--coral)"/><rect x="34" y="78" width="52" height="9" rx="3" fill="color-mix(in srgb,var(--coral) 70%,#000)"/>`;
  s+=`<path d="M60 80V${80-h}" stroke="var(--brand)" stroke-width="5" stroke-linecap="round"/>`;
  for(let k=0;k<leaves;k++){const y=80-h*(k+1)/(leaves+.4),side=k%2?1:-1,sz=10+i*2;
    s+=`<path d="M60 ${y} q${side*sz} ${-sz} ${side*sz*2} ${-sz*.3} q${-side*sz} ${sz*.9} ${-side*sz*2} ${sz*.3}z" fill="${k%2?'var(--brand)':'color-mix(in srgb,var(--brand) 70%,var(--sun))'}"/>`}
  if(i===3)s+=`<circle cx="60" cy="${80-h-6}" r="11" fill="var(--sun)"/><circle cx="60" cy="${80-h-6}" r="5" fill="var(--coral)"/>`;
  return s+`</svg>`}

/* ============ subjects & stages ============ */
const SUBJ={
  code:{name:'البرمجة',glyph:'{ }',c:'var(--c-code)',d:'تسلسل، خوارزميات، حلقات وشروط'},
  think:{name:'التفكير',glyph:'?!',c:'var(--c-think)',d:'ذاكرة، أنماط، منطق وتفكير ناقد'},
  sci:{name:'العلوم',glyph:'H₂O',c:'var(--c-sci)',d:'استكشاف الطبيعة والجسم والفضاء'},
  ar:{name:'العربية',glyph:'ض',c:'var(--c-ar)',d:'حروف، حركات، قراءة وقواعد'},
  en:{name:'English',glyph:'Aa',c:'var(--c-en)',d:'Phonics, words, grammar, reading'},
  math:{name:'الرياضيات',glyph:'+÷',c:'var(--c-math)',d:'عدّ، عمليات، كسور، هندسة وقياس'}
};
const STAGES=[
 {id:'s1',name:'براعم',ages:'1–2 سنة',lo:1,hi:2,desc:'اكتشاف حسّي: ألوان وأصوات وأشكال وكلمات أولى، بمشاركة أحد الوالدين.',
  skills:['التمييز البصري','الاستماع والتسمية','العدّ حتى 3','السبب والنتيجة','التآزر بين العين واليد'],
  tip:'اجلس مع طفلك، واقرأ السؤال بصوتك، وسمِّ الأشياء معه. جلسة من 5 إلى 10 دقائق تكفي، ثم انتقلوا للعب حقيقي بالمكعبات والصور.'},
 {id:'s2',name:'زهور',ages:'3–4 سنوات',lo:3,hi:4,desc:'حروف عربية وإنجليزية، عدّ حتى 10، أنماط وتصنيف، وأول روبوت.',
  skills:['الوعي الصوتي','العدّ والمقارنة','الأنماط والتصنيف','الحواس والطقس','التسلسل المنطقي'],
  tip:'اطلب من طفلك أن يشرح لك لماذا اختار الإجابة. الكلام عن التفكير يبني اللغة والمنطق معاً.'},
 {id:'s3',name:'مستكشفون',ages:'5–7 سنوات',lo:5,hi:7,desc:'جمع وطرح، ساعة، حركات وتركيب كلمات، دورات حياة، وخوارزميات بعوائق.',
  skills:['الطلاقة الحسابية','القراءة بالحركات','الصوتيات الإنجليزية','الملاحظة العلمية','تصحيح الأخطاء (Debugging)'],
  tip:'شجّع المحاولة لا الكمال. قل «جهدك واضح» بدلاً من «أنت ذكي»، فهذا يبني عقلية النمو.'},
 {id:'s4',name:'مبتكرون',ages:'8–10 سنوات',lo:8,hi:10,desc:'ضرب وقسمة وكسور ومساحات، قواعد وفهم مقروء، أنظمة الجسم والفضاء، وحلقات وشروط.',
  skills:['حل المسائل متعددة الخطوات','الفهم القرائي','التفكير الناقد','الحلقات والمتغيرات','الاستدلال العلمي'],
  tip:'اطلب من طفلك أن يؤلف سؤالاً بنفسه بعد كل درس. تأليف السؤال من أعلى مستويات الفهم.'}
];

/* ============ content banks ============ */

const COLS=['#2F7BFF','#F2468F','#FF8A1F','#12B5A6','#8A5CF6'];
function barChart(items){const W=300,H=170,mx=Math.max(...items.map(i=>i[1])),step=mx<=10?2:5,max=Math.ceil(mx/step)*step,bw=W/items.length;
  let s=`<svg class="fig wide" viewBox="-30 -12 ${W+40} ${H+52}" role="img" aria-label="رسم بياني">`;
  for(let v=0;v<=max;v+=step){const y=H-v/max*H;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1.5"/><text x="-8" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="sans-serif">${v}</text>`}
  items.forEach(([l,v],i)=>{const h=v/max*H,x=i*bw+bw*.2;s+=`<rect x="${x}" y="${H-h}" width="${bw*.6}" height="${h}" rx="5" fill="${COLS[i%5]}"/><text x="${x+bw*.3}" y="${H+30}" text-anchor="middle" font-size="24">${l}</text>`});
  return s+`</svg>`}
function ruler(a,b){const c=22,W=13*c;let s=`<svg class="fig wide" viewBox="-10 0 ${W+20} 96" role="img" aria-label="مسطرة">`;
  s+=`<rect x="${a*c}" y="8" width="${(b-a)*c}" height="22" rx="11" fill="var(--c-math)"/><text x="${(a+b)/2*c}" y="25" text-anchor="middle" font-size="14" fill="#fff" font-family="sans-serif">✏️</text>`;
  s+=`<rect x="0" y="40" width="${W}" height="46" rx="6" fill="color-mix(in srgb,var(--sun) 35%,var(--paper))" stroke="var(--ink)" stroke-width="1.5"/>`;
  for(let i=0;i<=12;i++){s+=`<line x1="${i*c}" x2="${i*c}" y1="40" y2="${i%1===0?58:50}" stroke="var(--ink)" stroke-width="2"/><text x="${i*c}" y="76" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="sans-serif">${i}</text>`;if(i<12)s+=`<line x1="${i*c+c/2}" x2="${i*c+c/2}" y1="40" y2="50" stroke="var(--ink)" stroke-width="1"/>`}
  s+=`<line x1="${a*c}" x2="${a*c}" y1="30" y2="40" stroke="var(--coral)" stroke-width="2" stroke-dasharray="3 2"/><line x1="${b*c}" x2="${b*c}" y1="30" y2="40" stroke="var(--coral)" stroke-width="2" stroke-dasharray="3 2"/>`;
  return s+`</svg>`}
function latin(n,syms){let rows=N(n,r=>N(n,c=>syms[(r+c)%n]));rows=shuffle(rows);const perm=shuffle(N(n,i=>i));return rows.map(r=>perm.map(i=>r[i]))}
function latinQ(n,syms,extra){const g=latin(n,syms);const r0=rnd(0,n-1),c0=rnd(0,n-1),ans=g[r0][c0];const blanks=new Set();let tries=0;
  const rowFull=Math.random()<.5;while(blanks.size<extra&&tries++<200){const r=rnd(0,n-1),c=rnd(0,n-1);if(r===r0&&c===c0)continue;if(rowFull?r===r0:c===c0)continue;blanks.add(r+','+c)}
  const html=`<table class="latin" dir="ltr">${g.map((row,r)=>`<tr>${row.map((v,c)=>`<td class="${r===r0&&c===c0?'ask':''}">${r===r0&&c===c0?'❓':blanks.has(r+','+c)?'':v}</td>`).join('')}</tr>`).join('')}</table>`;
  return{html,ans}}

const ALLFULL=[...new Set(SENT.flatMap(s=>s.w.map(w=>w[2])))],ALLROLE=[...new Set(SENT.flatMap(s=>s.w.map(w=>w[1])))];
function mutate(s){const out=new Set();const cs=['مرفوع وعلامة رفعه','منصوب وعلامة نصبه','مجرور وعلامة جره'];for(const c of cs)if(s.includes(c))for(const d of cs)if(d!==c)out.add(s.replace(c,d));
  const sg=['الضمة','الفتحة','الكسرة','الألف','الواو','الياء'];for(const a of sg)if(s.includes(a))for(const b of sg)if(b!==a)out.add(s.replace(a,b));
  const bn=['مبني على الفتح','مبني على السكون','مبني على الضم','مبني على الكسر'];for(const a of bn)if(s.includes(a))for(const b of bn)if(b!==a)out.add(s.replace(a,b));out.delete(s);return[...out]}
function irabQ(st,i){const w=st.w[i];const big=`<span class="irs">${st.w.map((x,j)=>j===i?`<mark>${x[0]}</mark>`:x[0]).join(' ')}.</span>`;
  if(LV===1)return mc('ما موقع الكلمة الملوّنة في الجملة؟',w[1],shuffle(ALLROLE.filter(r=>r!==w[1])).slice(0,3),{big,hint:'اسأل: من فعل؟ (فاعل) · ماذا وقع عليه الفعل؟ (مفعول به) · بمن بدأت الجملة الاسمية؟ (مبتدأ)'});
  const m=shuffle(mutate(w[2])),o=shuffle(ALLFULL.filter(f=>f!==w[2]));const wr=LV===3?[...m.slice(0,2),...o].slice(0,3):[...o.slice(0,2),...m].slice(0,3);
  return mc('أعرب الكلمة الملوّنة إعراباً كاملاً:',w[2],wr,{big,irab:1,hint:'حدّد الموقع أولاً، ثم الحالة (رفع، نصب، جر، جزم)، ثم العلامة'})}
const irabLesson=(gs,k=6)=>()=>{const pool=SENT.filter(s=>gs.includes(s.g));const qs=[];let g=0;while(qs.length<k&&g++<50){const st=pick(pool),i=rnd(0,st.w.length-1);const q=irabQ(st,i);if(!qs.some(x=>x.big===q.big))qs.push(q)}return qs};

function traceRobotQ(size,steps){for(let g=0;g<200;g++){const s=[rnd(0,size-1),rnd(0,size-1)];let p=[...s];const prog=[];for(let i=0;i<steps;i++){const ok=Object.keys(DIRS).filter(d=>{const n=[p[0]+DIRS[d][0],p[1]+DIRS[d][1]];return n[0]>=0&&n[1]>=0&&n[0]<size&&n[1]<size});const d=pick(ok);prog.push(d);p=[p[0]+DIRS[d][0],p[1]+DIRS[d][1]]}
  if(p[0]===s[0]&&p[1]===s[1])continue;const fr=shuffle(['🍎','🍌','🍇','🍓']).slice(0,3);const cells={};cells[p.join()]=fr[0];let k=1,t=0;while(k<3&&t++<100){const c=[rnd(0,size-1),rnd(0,size-1)].join();if(c!==s.join()&&!cells[c]){cells[c]=fr[k++]}}if(k<3)continue;
  const html=`<div class="grid" style="grid-template-columns:repeat(${size},1fr);width:min(${size*62}px,80vw)">${N(size*size,i=>{const c=[Math.floor(i/size),i%size].join();return `<div class="cell">${c===s.join()?'🤖':cells[c]||''}</div>`}).join('')}</div><div class="rprog">${prog.map(d=>`<span>${DIRS[d][2]}</span>`).join('')}</div>`;
  return mc('نفّذ البرنامج بعقلك: عند أي فاكهة يتوقف الروبوت 🤖؟',fr[0],fr.slice(1),{big:html,emo:1,three:1,hint:'حرّك إصبعك على الشبكة خطوة لكل سهم'})}return null}

  const r0=rnd(0,2),c0=rnd(0,2),ans=M[r0][c0];const bl=new Set();let t=0;while(bl.size<LVR(0,1,3)&&t++<50){const r=rnd(0,2),c=rnd(0,2);if(r!==r0)bl.add(r+','+c)}

const TT_START={c:[3,7],p:[5,5]};
function ttRun(prog,start){let x=start[0],y=start[1],d=0;const segs=[],path=[];let out=false;const DX=[0,1,0,-1],DY=[-1,0,1,0];
  const ex=list=>{for(const b of list){if(out)return;if(b.c==='F'){for(let i=0;i<b.n;i++){const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>10||ny>10){out=true;return}segs.push([x,y,nx,ny]);path.push([nx,ny]);x=nx;y=ny}}else if(b.c==='R')d=(d+1)%4;else if(b.c==='L')d=(d+3)%4;else if(b.c==='REP')for(let k=0;k<b.n;k++)ex(b.body)}};ex(prog);return{segs,out,end:[x,y,d]}}
const segKey=s=>{const a=s[0]+','+s[1],b=s[2]+','+s[3];return a<b?a+'|'+b:b+'|'+a};
const segSet=segs=>new Set(segs.map(segKey));
const countBlocks=p=>p.reduce((a,b)=>a+1+(b.c==='REP'?countBlocks(b.body):0),0);
const F=n=>({c:'F',n}),RT={c:'R'},Lf={c:'L'},REP=(n,body)=>({c:'REP',n,body});
const TT_TARGETS=[
 {name:'مربع صغير',prog:[F(2),RT,F(2),RT,F(2),RT,F(2)],start:'c',lim:[10,8,5],rep:[REP(4,[F(2),RT])]},
 {name:'مستطيل',prog:[F(3),RT,F(2),RT,F(3),RT,F(2)],start:'c',lim:[10,8,6],rep:[REP(2,[F(3),RT,F(2),RT])]},
 {name:'درج',prog:[F(1),RT,F(1),Lf,F(1),RT,F(1),Lf,F(1),RT,F(1)],start:'c',lim:[12,10,6],rep:[REP(3,[F(1),RT,F(1),Lf])]},
 {name:'زاوية',prog:[F(3),RT,F(3)],start:'c',lim:[6,4,3]},
 {name:'مربع كبير',prog:[F(4),RT,F(4),RT,F(4),RT,F(4)],start:'c',lim:[10,8,4],rep:[REP(4,[F(4),RT])]},
 {name:'علامة زائد',prog:[F(2),RT,RT,F(2),Lf,F(2),RT,RT,F(2),Lf,F(2),RT,RT,F(2),Lf,F(2),RT,RT,F(2)],start:'p',lim:[24,20,7],rep:[REP(4,[F(2),RT,RT,F(2),Lf])]}];
function ttTarget(t){const r=ttRun(t.prog,TT_START[t.start]);return{segs:r.segs,key:[...segSet(r.segs)].sort().join(';')}}
function turtleLesson(names,loops){return()=>names.map(nm=>{const t=TT_TARGETS.find(x=>x.name===nm);const lim=t.lim[LV-1];return{t:'turtle',q:`ارسم ${t.name} بالأوامر${loops?` في ${lim} قطع أو أقل`:''}`,target:t.name,start:t.start,lim:loops?lim:24,loops,hint:loops&&t.rep?'ابحث عن الجزء الذي يتكرر، وضعه داخل «كرر»':'السلحفاة تبدأ متجهة لأعلى. «يمين» تديرها ربع دورة مع عقارب الساعة'}})}
const freeStudio=()=>[{t:'turtle',q:'المرسم الحر: ارسم أي شكل تتخيله بالأوامر، ثم شغّله',free:true,start:'p',lim:30,loops:true,hint:'جرّب: كرر 4 [تقدّم 3، يمين] ثم أضف شكلاً آخر'}];
function drawTurtle(){const q=cur();P.tt=P.tt||{prog:[],stack:[],drawn:[]};const T=P.tt;
  const pal=[['F1','⬆️ تقدّم 1'],['F2','⬆️ تقدّم 2'],['F3','⬆️ تقدّم 3'],['R','↻ يمين'],['L','↺ يسار']].concat(q.loops?[['REP2','🔁 كرر 2'],['REP3','🔁 كرر 3'],['REP4','🔁 كرر 4'],['END','⏹ نهاية التكرار']]:[]);
  const render=(list,depth)=>list.map(b=>b.c==='REP'?`<div class="tb rep"><b>🔁 كرر ${b.n}</b><div class="tin">${render(b.body,depth+1)||'<em>أضف أوامر هنا</em>'}</div></div>`:`<div class="tb">${b.c==='F'?'⬆️ تقدّم '+b.n:b.c==='R'?'↻ يمين':'↺ يسار'}</div>`).join('');
  const n=countBlocks(T.prog);
  $('#qbody').innerHTML=`<div class="studio"><canvas id="ttc" width="330" height="330" aria-label="لوحة الرسم"></canvas>
   <div class="tpanel"><div class="tpal">${pal.map(p=>`<button onclick="ttAdd('${p[0]}')">${p[1]}</button>`).join('')}</div>
    <div class="rinfo">البرنامج: ${n} قطعة${q.free?'':` (الحد ${q.lim})`}${T.stack.length?' · أنت داخل «كرر» الآن':''}</div>
    <div class="tprog">${render(T.prog,0)||'<em>اضغط الأوامر لتبني برنامجك</em>'}</div>
    <div class="center" style="justify-content:flex-start"><button class="btn" onclick="ttGo()">▶ شغّل</button><button class="ghost" onclick="ttUndo()">تراجع</button><button class="ghost" onclick="ttClear()">امسح الكل</button></div></div></div>`;ttPaint(T.drawn)}
function ttPaint(drawn,pos){const c=$('#ttc');if(!c)return;const q=cur(),x=c.getContext('2d'),g=30,o=15;const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();x.clearRect(0,0,330,330);
  x.strokeStyle=col('--line');x.lineWidth=1;for(let i=0;i<=10;i++){x.beginPath();x.moveTo(o+i*g,o);x.lineTo(o+i*g,o+10*g);x.stroke();x.beginPath();x.moveTo(o,o+i*g);x.lineTo(o+10*g,o+i*g);x.stroke()}
  if(!q.free){const t=ttTarget(TT_TARGETS.find(z=>z.name===q.target));x.strokeStyle=col('--sun-d');x.lineWidth=6;x.setLineDash([6,6]);x.globalAlpha=.6;for(const s of t.segs){x.beginPath();x.moveTo(o+s[0]*g,o+s[1]*g);x.lineTo(o+s[2]*g,o+s[3]*g);x.stroke()}x.setLineDash([]);x.globalAlpha=1}
  x.strokeStyle=col('--c-code');x.lineWidth=5;x.lineCap='round';for(const s of drawn){x.beginPath();x.moveTo(o+s[0]*g,o+s[1]*g);x.lineTo(o+s[2]*g,o+s[3]*g);x.stroke()}
  const st=pos||[...TT_START[q.start],0];x.font='22px sans-serif';x.textAlign='center';x.textBaseline='middle';x.save();x.translate(o+st[0]*g,o+st[1]*g);x.rotate(st[2]*Math.PI/2);x.fillText('🐢',0,0);x.restore()}
function ttCur(){const T=P.tt;let list=T.prog;for(const i of T.stack)list=list[i].body;return list}
function ttAdd(k){if(P.locked||P.ttRun)return;const q=cur(),T=P.tt;if(k==='END'){if(T.stack.length)T.stack.pop();drawTurtle();return}
  if(countBlocks(T.prog)>=q.lim){showFb('try',`وصلت للحد (${q.lim} قطع). ${q.loops?'استخدم «كرر» لتختصر البرنامج.':''}`,'',false);return}
  const list=ttCur();if(k[0]==='F')list.push(F(+k[1]));else if(k==='R')list.push({c:'R'});else if(k==='L')list.push({c:'L'});else if(k.startsWith('REP')){if(T.stack.length){showFb('try','لا يمكن وضع «كرر» داخل «كرر» هنا. اضغط «نهاية التكرار» أولاً.','',false);return}list.push(REP(+k[3],[]));T.stack.push(list.length-1)}T.drawn=[];drawTurtle()}
function ttUndo(){if(P.locked||P.ttRun)return;const T=P.tt,list=ttCur();if(list.length)list.pop();else if(T.stack.length){T.stack.pop();ttCur().pop()}T.drawn=[];drawTurtle()}
function ttClear(){if(P.locked||P.ttRun)return;P.tt={prog:[],stack:[],drawn:[]};drawTurtle()}
function ttGo(){if(P.locked||P.ttRun)return;const q=cur(),T=P.tt;if(!T.prog.length)return;$('#fb').hidden=true;const r=ttRun(T.prog,TT_START[q.start]);P.ttRun=true;let i=0;const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step=()=>{if(!P||V.view!=='play'||cur()!==q)return;T.drawn=r.segs.slice(0,i);const s=r.segs[i-1];ttPaint(T.drawn,s?[s[2],s[3],i===r.segs.length?r.end[2]:0]:null);if(i<r.segs.length){i++;setTimeout(step,red?20:140)}else{P.ttRun=false;ttPaint(T.drawn,r.end);ttDone(r)}};step()}
function ttDone(r){const q=cur();if(r.out){cur().hint='خرجت السلحفاة من اللوحة. اختصر الخطوات أو غيّر الاتجاه.';return bad(()=>{})}
  if(q.free){if(r.segs.length>=3){cur().hint='';return good('رسمة رائعة يا مبرمج! 🎨')}showFb('try','أضف أوامر أكثر لترسم شكلاً كاملاً.','',false);return}
  const t=ttTarget(TT_TARGETS.find(z=>z.name===q.target));const mine=[...segSet(r.segs)].sort().join(';');
  if(mine===t.key){cur().hint='';return good(countBlocks(P.tt.prog)<=4&&q.loops?'برنامج قصير وذكي! 🌟':'رسمتها تماماً! 🐢✨')}
  if(P.lv===3||P.tries>=1){}cur().hint=r.segs.length<t.segs.length?'الرسم ناقص: قارن خطك الأزرق بالخط المنقّط.':'رسمت خطوطاً زائدة أو في مكان مختلف عن المنقّط.';bad(()=>{const s=TT_TARGETS.find(z=>z.name===q.target);P.tt={prog:JSON.parse(JSON.stringify(q.loops&&s.rep?s.rep:s.prog)),stack:[],drawn:[]};cur().hint='هذا برنامج صحيح يرسم الشكل. اقرأه أمراً أمراً.';drawTurtle()})}

  $('#qbody').innerHTML=`<div class="writebox"><textarea id="wr" rows="6" ${en?'dir="ltr"':''} placeholder="${en?'Write here…':'اكتب هنا…'}" oninput="P.wr.text=this.value;document.getElementById('wc').textContent=this.value.trim()?this.value.trim().split(/\\s+/).length:0">${esc(W.text)}</textarea>

   <div class="checks2"><b>${en?'Check your writing:':'راجع كتابتك:'}</b>${q.checks.map((c,i)=>`<label ${en?'dir="ltr"':''}><input type="checkbox" id="ck${i}" ${W.ck[i]?'checked':''} onchange="P.wr.ck[${i}]=this.checked"> ${c}</label>`).join('')}</div>
   <div class="center"><button class="btn" onclick="wrSubmit()">${en?'Submit':'سلّم كتابتي'}</button></div></div>`}
function wrSubmit(){if(P.locked)return;const q=cur(),W=P.wr,en=q.lang==='en';const wc=W.text.trim()?W.text.trim().split(/\s+/).length:0;
  if(wc<q.min){showFb('try',en?`Write a little more: at least ${q.min} words.`:`اكتب أكثر قليلاً: ${q.min} كلمات على الأقل.`,'',false);return}
  if(q.checks.some((_,i)=>!W.ck[i])){showFb('try',en?'Read your writing again and tick every item you did.':'اقرأ ما كتبته مرة أخرى، وضع علامة على كل بند فعلته.','',false);return}
  q.hint=(en?'Example of a strong answer: ':'مثال لإجابة قوية: ')+q.model;good(en?'Great writing! ✍️':'كتابة رائعة! ✍️')}

const DIRS={u:[-1,0,'↑','فوق'],d:[1,0,'↓','تحت'],l:[0,-1,'←','يسار'],r:[0,1,'→','يمين']};
function bfs(size,W,s,g){const key=p=>p[0]+','+p[1];const prev={};prev[key(s)]=null;const Q=[s];while(Q.length){const p=Q.shift();if(p[0]===g[0]&&p[1]===g[1]){const path=[];let k=key(p);while(k){path.unshift(k.split(',').map(Number));k=prev[k]&&key(prev[k])}return path}
  for(const d of Object.values(DIRS)){const n=[p[0]+d[0],p[1]+d[1]];if(n[0]<0||n[1]<0||n[0]>=size||n[1]>=size||W.has(key(n))||key(n) in prev)continue;prev[key(n)]=p;Q.push(n)}}return null}
function genRobot(o){for(let t=0;t<400;t++){const W=new Set();while(W.size<o.walls)W.add(rnd(0,o.size-1)+','+rnd(0,o.size-1));const s=[rnd(0,o.size-1),rnd(0,o.size-1)],g=[rnd(0,o.size-1),rnd(0,o.size-1)];if(W.has(s.join())||W.has(g.join()))continue;const p=bfs(o.size,W,s,g);if(!p)continue;const len=p.length-1;if(len<o.min||len>o.max)continue;
  let runs=0,last='';for(let i=1;i<p.length;i++){const dd=(p[i][0]-p[i-1][0])+','+(p[i][1]-p[i-1][1]);if(dd!==last){runs++;last=dd}}
  return{t:'robot',q:o.loops?`أوصل الروبوت إلى النجمة باستخدام ${ar(runs)} أوامر أو أقل. استخدم ×2 ×3 للتكرار.`:'اكتب أوامر توصل الروبوت 🤖 إلى النجمة ⭐',size:o.size,walls:[...W],start:s,goal:g,path:p,limit:o.loops?runs:12,loops:!!o.loops,say:'أوصل الروبوت إلى النجمة'}}
  return{t:'robot',q:'أوصل الروبوت إلى النجمة',size:3,walls:[],start:[1,0],goal:[1,2],path:[[1,0],[1,1],[1,2]],limit:12}}
