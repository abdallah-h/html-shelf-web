     <p class="muted">${LEVELS.map(L=>`${L.ic} ${L.name}: ${L2.filter(l=>(D.best[l.id]||0)>=L.n).length} درساً`).join(' · ')}</p><p>${strong.length?`<b>نقطة القوة:</b> ${strong[0][0]}. ${strong.length>1?`<b>تحتاج دعماً:</b> ${strong[strong.length-1][0]}.`:''}`:'ابدأ أول درس لتظهر هنا نقاط القوة والدعم.'}</p>
     ${hard.length?`<p><b>دروس وصفها طفلك بالصعبة:</b> ${hard.map(l=>l.title).join('، ')}. راجعوها معاً مع نشاط «جرّبوا في البيت».</p>`:''}
     <button class="ghost" onclick="resetAsk(this)">مسح تقدّم هذه المرحلة</button></div></div>
   ${certBlock(st)}
   <div class="panel"><h2>الأوسمة</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${b[2](L2)?'on':''}"><span class="medal">${b[3]}</span><b>${b[0]}</b><small>${b[1]}</small></div>`).join('')}</div></div></section>`}
function certBlock(st){const max=LESSONS[st.id].length*3,got=stageStars(st.id),need=Math.max(0,Math.ceil(max*.6)-got);
  if(need>0)return `<div class="panel certlock"><h2>شهادة مرحلة ${st.name}</h2><p class="muted">تُفتح الشهادة عند جمع 60% من نجوم المرحلة. باقي <b>${need}</b> نجمة.</p><div class="barrow" style="--c:${st.c}"><span>التقدّم</span><div class="track"><i style="width:${got/Math.ceil(max*.6)*100}%"></i></div><span>${got}/${Math.ceil(max*.6)}</span></div></div>`;
  let dt='';try{dt=new Date().toLocaleDateString('ar-EG-u-nu-latn',{year:'numeric',month:'long',day:'numeric'})}catch(e){dt=new Date().toDateString()}
  return `<div class="cert" style="--s:${st.c}"><div class="cin"><span class="eyebrow">شهادة إتمام مرحلة</span><h2>أكاديمية نبتة</h2><p>تشهد الأكاديمية بأن البطل</p><div class="cname">${esc(D.name||'بطلنا الصغير')}</div><p>أتمّ مرحلة <b>${st.name}</b> (${st.ages}) بجدّ واجتهاد، وجمع <b>${got}</b> نجمة في ${LESSONS[st.id].filter(l=>D.best[l.id]).length} درساً.</p><div class="cfoot"><span>${dt}</span><span class="seal">★</span><span>إدارة الأكاديمية</span></div></div></div>`}
function resetAsk(b){if(b.dataset.c){LESSONS[D.stage].forEach(l=>{delete D.best[l.id];delete D.feel[l.id]});delete D.exams[D.stage];save();render()}else{b.dataset.c=1;b.textContent='اضغط مرة أخرى للتأكيد';b.style.borderColor='var(--bad)'}}

/* ============ parents guide (this stage) ============ */
const STAGE_GUIDE={
 s1:{len:'5–10 دقائق، مرة أو مرتين يومياً، بجوار أحد الكبار دائماً',role:'اقرأ السؤال بصوتك، أشِر إلى الصور، وسمِّ كل شيء. حوّل كل سؤال إلى حوار قصير.',screen:'توصي منظمة الصحة العالمية والأكاديمية الأمريكية لطب الأطفال بتقليل الشاشات قدر الإمكان قبل عمر السنتين، ويُفضَّل أن تكون المشاهدة مشتركة مع الكبار. لذلك صُمّمت «براعم» لجلسات قصيرة جداً مع الوالدين، والهدف الأساسي هو اللعب الحقيقي خارج الشاشة.',signs:['يشير إلى الصورة الصحيحة عند سماع اسمها','يقلّد أصوات الحيوانات','يعدّ معك حتى 3','يرتّب خطوتين من روتينه اليومي']},
 s2:{len:'10–15 دقيقة، مع الحديث حول الإجابات',role:'اطلب منه أن يشرح لماذا اختار الإجابة. الكلام عن التفكير يبني اللغة والمنطق معاً.',screen:'بين 2 و5 سنوات يُنصح بألا يزيد وقت الشاشة على ساعة يومياً من محتوى جيد، ويفضل أن يشارك فيه أحد الكبار.',signs:['يتعرّف على معظم الحروف العربية بأصواتها','يعدّ حتى 10 بدقة','يكمل نمطاً بسيطاً','يعطي أوامر متتابعة لروبوت أو شخص']},
 s3:{len:'15–20 دقيقة، مقسّمة على درسين أو ثلاثة',role:'شجّع المحاولة لا الكمال. قل «جهدك واضح» بدلاً من «أنت ذكي»، واسأله: كيف عرفت؟',screen:'ضعوا معاً قواعد واضحة لوقت الشاشة، واجعلوا التعلّم الرقمي جزءاً من يوم فيه لعب وحركة وقراءة ورقية.',signs:['يجمع ويطرح حتى 20 دون أصابع','يقرأ كلمات قصيرة بالحركات','يقرأ الساعة والنصف','يجد خطأً في سلسلة أوامر ويصلحه']},
 s4:{len:'20–30 دقيقة، مع درس من كل مادة على مدار الأسبوع',role:'اطلب منه أن يؤلّف سؤالاً أو برنامجاً بنفسه ويختبرك به. تأليف السؤال من أعلى مستويات الفهم.',screen:'شجّعوا الاستخدام المُنتِج للشاشة (البرمجة، التصميم، القراءة) أكثر من الاستهلاك، واتفقوا على أوقات خالية من الأجهزة.',signs:['يحفظ جدول الضرب ويستخدمه في المسائل','يلخّص نصاً قصيراً بأفكاره الرئيسة','يميّز الحقيقة من الرأي','يكتب برنامجاً فيه تكرار وشرط']}};
function vParents(){const s=ST(),G=STAGE_GUIDE[s.id];return `<section class="section"><div class="sh"><div><span class="eyebrow">دليل الأسرة · ${s.name} · ${s.ages}</span><h2>كيف تساعد طفلك <span class="u">يتعلّم ويفهم</span></h2></div></div>
  <div class="two"><div class="panel"><h2>الجلسة المثالية</h2><p><b>المدة:</b> ${G.len}</p><p><b>دورك:</b> ${G.role}</p><p><b>رحلة كل درس:</b> فكرة ← مثال ← تدريب بتلميحات ← محاولة ثانية ← تقييم ذاتي ← نشاط في البيت. هذه الدورة تنقل الطفل من الحفظ إلى الفهم.</p></div>
   <div class="panel"><h2>علامات التقدّم في هذه المرحلة</h2><ul class="checks">${G.signs.map(x=>`<li>${x}</li>`).join('')}</ul><p class="muted">كل طفل له إيقاعه. إذا لم تظهر علامة بعد، ارجع إلى دروس المادة وأنشطة البيت.</p></div></div>
  <div class="panel"><h2>أنشطة خارج الشاشة لكل مادة</h2><div class="guide">${Object.entries(SUBJ).map(([k,x])=>`<div class="note" style="--c:${x.c}"><h3>${x.name}</h3><p><b>نتعلّم:</b> ${STAGE_SUBJ[s.id][k]}</p><p><b>في البيت:</b> ${HOMEACT[s.id][k]}</p></div>`).join('')}</div></div>
  <div class="guide">
   <div class="note"><h3>متوافق مع مناهج المدارس</h3><p>دروس كل مرحلة مقسّمة على مجالات المناهج المعتمدة: المنهج المصري، وCommon Core، وCambridge Primary، وNGSS، وCSTA. افتح صفحة «المنهج» لترى ما يغطيه طفلك في كل مجال.</p></div>
   <div class="note"><h3>التدرّج في الصعوبة</h3><p>الدروس مرتبة في 3 مراحل (الأساسيات ← البناء ← التحدي)، ولكل درس 5 مستويات (بذرة ← نبتة ← شجرة ← ثمرة ← تاج). المستوى التالي يُفتح بعد نجمتين، فيتقدّم الطفل بثقة دون إحباط.</p></div>
   <div class="note"><h3>التعلّم باللعب</h3><p>المهارة تأتي في صورة لعبة: روبوت يصل لنجمة، بطاقات ذاكرة، أو ترتيب قصة، فيبقى الطفل متحمساً.</p></div>
   <div class="note"><h3>التغذية الراجعة الفورية</h3><p>كل إجابة تُصحَّح فوراً مع تلميح يشرح السبب، لأن التصحيح المتأخر يفقد معظم أثره عند الصغار.</p></div>
   <div class="note"><h3>عقلية النمو</h3><p>نمدح الجهد والاستراتيجية لا الذكاء، والنجوم تكافئ التحسّن، ودائماً هناك فرصة ثانية.</p></div>
   <div class="note"><h3>التكرار المتباعد</h3><p>الصفحة الرئيسية تقترح الدروس التي تحتاج مراجعة بعد أيام، بأسئلة جديدة في كل مرة.</p></div>
   <div class="note"><h3>التقييم الذاتي</h3><p>بعد كل درس يقيّم الطفل صعوبته. هذا يبني الوعي بطريقة التعلّم، ويعطيك مؤشراً لما يحتاج دعماً.</p></div>
   <div class="note"><h3>عن وقت الشاشة</h3><p>${G.screen}</p></div>
  </div></section>`}
/* ============ play engine ============ */
const cur=()=>P.qs[P.i];
function vPlay(){if(!P)return vStage();const q=cur();const en=q.lang==='en'||q.lang==='de';
  const showSay=q.say&&canSpeak();
  let head=q.sightWord&&!canSpeak()?`Find the word: <b>${q.sightWord}</b>`:q.q;
  const pc=SUBJ[P.lesson.subj]?SUBJ[P.lesson.subj].c:(stageOf(P.lesson.stage)||{}).c||'var(--brand)';
  return `<section class="player" style="--c:${pc}">
   <div class="ptop"><button class="ghost" onclick="go('stage')">خروج</button><span class="ptitle">${P.lesson.title}${P.lv&&!P.lesson.kind?` · ${LEVELS[P.lv-1].ic} ${LEVELS[P.lv-1].name}`:''}</span><div class="pbar" aria-hidden="true">${P.qs.map((_,k)=>`<i class="${k<P.i?'done':k===P.i?'now':''}"></i>`).join('')}</div><span class="pcount">${ar(P.i+1)} / ${ar(P.qs.length)}</span><span class="cmb" id="cmb">${P.combo>=2?'🔥 '+P.combo:''}</span></div>
   <div class="qcard" id="qcard">
    ${P.lv===4&&!P.lesson.kind&&TLIM[q.t]?'<div class="qtimer"><i id="qt"></i></div>':''}${q.review?`<span class="revchip">🔁 مراجعة من درس «${q.review}»</span>`:''}
    <div class="qhead"><h2 class="qtext" ${en?'dir="ltr" style="text-align:left"':''}>${head}</h2>${showSay?`<button class="say" onclick="sayQ()" aria-label="استمع">${SPK}</button>`:''}</div>
    ${q.p?`<div class="passage" ${en?'dir="ltr"':''}>${q.p}</div>`:''}
    ${q.code?`<pre class="code">${q.code}</pre>`:''}
    ${q.big?`<div class="big">${q.big}</div>`:''}
    ${q.sightWord&&canSpeak()?`<div class="center"><button class="btn sun" onclick="sayQ()">${SPK} استمع للكلمة</button></div>`:''}
    ${P.lv===1&&q.hint?`<div class="hintup">💡 ${q.hint}</div>`:''}
    <div id="qbody"></div>
   </div><div class="fb" id="fb" hidden></div></section>`}
function sayQ(){const q=cur();speak(q.say||q.q,q.lang)}
function afterPlay(){const q=cur();P.locked=false;P.tries=0;drawBody();
  const autoSay=(P.lesson.stage==='s1'||P.lesson.stage==='s2'||q.sightWord)&&D.sound;if(autoSay&&q.say)setTimeout(()=>speak(q.say,q.lang),250)}
function drawBody(){const q=cur(),b=$('#qbody');if(!b)return;
  if(q.t==='mcq')b.innerHTML=`<div class="opts ${q.three||q.opts.length===3?'three':''} ${q.emo?'emo':''} ${q.irab?'one':''}" ${(q.lang==='en'||q.lang==='de')?'dir="ltr"':''}>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pickOpt(this)">${o}</button>`).join('')}</div>`;
  else if(q.t==='input'){P.inp=P.inp||'';b.innerHTML=`<div class="ansbox" id="ans">${P.inp?ar(P.inp):'؟'}</div><div class="keypad" dir="ltr">${[1,2,3,4,5,6,7,8,9,0].map(k=>`<button onclick="kp('${k}')">${ar(k)}</button>`).join('')}<button class="del" onclick="kp('del')" aria-label="مسح">⌫ مسح</button><button class="go" onclick="kp('ok')">تحقّق</button></div>`}
  else if(q.t==='order'){P.ord=P.ord||[];q._sh=q._sh||shuffle(q.items.map((_,i)=>i));const lc=q.letters?'letter':'';
    b.innerHTML=`<div class="slots" ${(q.lang==='en'||q.lang==='de')?'dir="ltr"':''}>${q.items.map((_,k)=>{const v=P.ord[k];return `<div class="slot ${v!=null?'f':''} ${lc}">${v!=null?q.items[v]:ar(k+1)}</div>`}).join('')}</div>
     <div class="tiles" ${(q.lang==='en'||q.lang==='de')?'dir="ltr"':''}>${q._sh.map(ix=>`<button class="tile ${lc}" ${P.ord.includes(ix)?'disabled':''} onclick="ordTap(${ix})">${q.items[ix]}</button>`).join('')}</div>
     <div class="center"><button class="ghost" onclick="ordReset()">ابدأ الترتيب من جديد</button></div>`}
  else if(q.t==='match'){P.m=P.m||{sel:null,done:[],miss:0};q._L=q._L||shuffle(q.pairs.map((_,i)=>i));q._R=q._R||shuffle(q.pairs.map((_,i)=>i));const emo=s=>/^\p{Extended_Pictographic}/u.test(s)&&s.length<=4;
    b.innerHTML=`<div class="match" ${(q.lang==='en'||q.lang==='de')?'dir="ltr"':''}><div class="col">${q._L.map(i=>`<button class="mi ${emo(q.pairs[i][0])?'emo':''} ${P.m.done.includes(i)?'done':''} ${P.m.sel===i?'sel':''}" ${P.m.done.includes(i)?'disabled':''} onclick="mTap('L',${i})">${q.pairs[i][0]}</button>`).join('')}</div>
     <div class="col">${q._R.map(i=>`<button class="mi ${P.m.done.includes(i)?'done':''}" id="mr${i}" ${P.m.done.includes(i)?'disabled':''} onclick="mTap('R',${i})">${q.pairs[i][1]}</button>`).join('')}</div></div>
     <p class="muted" style="text-align:center;font-size:14px">${q.lang==='en'?'Tap a picture/word, then its partner.':'اضغط على عنصر من العمود الأول ثم على ما يناسبه.'}</p>`}
  else if(q.t==='memory'){P.mem=P.mem||{open:[],done:[],moves:0};q._c=q._c||shuffle([...q.cards,...q.cards]);const n=q._c.length;
    b.innerHTML=`<div class="mem ${n<=6?'c3':''}">${q._c.map((c,i)=>{const up=P.mem.open.includes(i)||P.mem.done.includes(i);return `<button class="card ${up?'up':''} ${P.mem.done.includes(i)?'got':''}" onclick="flip(${i})" aria-label="بطاقة">${up?`<span>${c}</span>`:'<span class="back">؟</span>'}</button>`}).join('')}</div><p class="muted" style="text-align:center">المحاولات: ${ar(P.mem.moves)}</p>`}
  else if(q.t==='sort'){P.so=P.so||{sel:null,placed:{},miss:0};const so=P.so;
    b.innerHTML=`<div class="sortpool" ${(q.lang==='en'||q.lang==='de')?'dir="ltr"':''}>${q.items.map((it,i)=>so.placed[i]!=null?'':`<button class="${so.sel===i?'sel':''}" onclick="sTap(${i})">${it[0]}</button>`).join('')||'<span class="muted">أحسنت، صنّفت كل البطاقات!</span>'}</div>
     <div class="buckets">${q.cats.map((c,k)=>`<button class="bucket" id="bk${k}" onclick="sDrop(${k})"><b>${c}</b><div class="in">${q.items.map((it,i)=>so.placed[i]===k?`<span>${it[0]}</span>`:'').join('')}</div></button>`).join('')}</div>
     <p class="muted" style="text-align:center;font-size:14px">اختر بطاقة، ثم اضغط على المجموعة التي تنتمي إليها.</p>`}
  else if(q.t==='turtle')drawTurtle();
  else if(q.t==='write')drawWrite();
  else if(q.t==='trace')drawTrace();
  else if(q.t==='robot')drawRobot();
}

/* feedback */
const PRAISE=['أحسنت! 🌟','رائع جداً!','ممتاز، استمر!','عمل عظيم!','برافو!','إجابة ذكية!'];
const PRAISE_EN=['Great job! 🌟','Excellent!','Well done!','Super!','Amazing!'];
function good(msg){P.locked=true;if(P.tries===0)P.score++;tone(true);const en=cur().lang==='en';showFb('good',msg||pick(en?PRAISE_EN:PRAISE),P.tries?(en?'You got it on the second try. That’s how we learn!':'وصلت إليها بعد محاولة. هكذا نتعلّم!'):(cur().hint?'💡 '+cur().hint:''),true)}
function bad(reveal){P.tries++;tone(false);const q=cur();const c=$('#qcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  if(P.tries>=(P.lv>=3?1:2)){P.locked=true;reveal&&reveal();showFb('bad',q.lang==='en'?'Here is the right answer. Look at it carefully.':'هذه هي الإجابة الصحيحة. تأملها جيداً، وستتذكرها المرة القادمة.',q.hint||'',true)}
  else showFb('try',q.lang==='en'?'Almost! Try once more.':'قرّبت! جرّب مرة أخرى.',q.hint||'',false)}
function showFb(kind,msg,sub,next){const f=$('#fb');f.hidden=false;f.className='fb '+kind;const last=P.i===P.qs.length-1;const en=cur().lang==='en';
  f.innerHTML=`<div>${msg}${sub?`<small>${sub}</small>`:''}</div>${next?`<button class="btn" onclick="nextQ()">${last?(en?'See results':'النتيجة'):(en?'Next':'التالي')}</button>`:''}`;
  if(next)setTimeout(()=>f.querySelector('button')?.focus({preventScroll:true}),50);
  if(D.sound&&kind==='good'&&(P.lesson.stage==='s1'||P.lesson.stage==='s2'))speak(strip(msg),cur().lang)}
function nextQ(){P.i++;P.inp='';P.ord=null;P.m=null;P.mem=null;P.prog=null;P.run=null;P.so=null;P.showPath=false;P.tr=null;P.showGuide=false;P.tt=null;P.ttRun=false;P.wr=null;if(P.i>=P.qs.length)return finish();render();$('#qcard')?.scrollIntoView({block:'nearest'})}

/* mcq */
function pickOpt(b){if(P.locked||b.disabled)return;const q=cur(),o=q.opts[b.dataset.i];
  if(o===q.a){b.classList.add('ok');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);good()}
  else{b.classList.add('bad');b.disabled=true;bad(()=>{document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.opts[x.dataset.i]===q.a)x.classList.add('ok')})})}}
/* input */
function kp(k){if(P.locked)return;const q=cur();if(k==='del')P.inp=P.inp.slice(0,-1);else if(k==='ok'){if(!P.inp)return;if(+P.inp===q.a){good();$('#ans').style.borderColor='var(--ok)'}else{P.inp='';bad(()=>{P.inp=String(q.a);$('#ans').textContent=ar(q.a)});if(!P.locked)$('#ans').textContent='؟';return}}else if(P.inp.length<5)P.inp+=k;$('#ans').textContent=P.inp?ar(P.inp):'؟'}
/* order */
function ordTap(ix){if(P.locked)return;const q=cur();if(P.ord.includes(ix))return;P.ord.push(ix);drawBody();
  if(P.ord.length===q.items.length){const ok=P.ord.every((v,k)=>q.items[v]===q.items[k]);if(ok)good();else{bad(()=>{P.ord=q.items.map((_,i)=>i);drawBody()});if(!P.locked)setTimeout(()=>{if(!P.locked){P.ord=[];drawBody()}},900)}}}
function ordReset(){if(P.locked)return;P.ord=[];drawBody()}
/* match */
function mTap(side,i){if(P.locked)return;const q=cur();if(side==='L'){P.m.sel=i;drawBody();return}
  if(P.m.sel==null)return;if(P.m.sel===i){P.m.done.push(i);P.m.sel=null;tone(true);drawBody();if(P.m.done.length===q.pairs.length){if(P.m.miss<=1)good();else{P.locked=true;showFb('try',q.lang==='en'?'All matched! Try with fewer mistakes next time.':'أكملت التوصيل! حاول بأخطاء أقل في المرة القادمة.','',true)}}}
  else{P.m.miss++;tone(false);const el=$('#mr'+i);el.classList.add('no');setTimeout(()=>el&&el.classList.remove('no'),500)}}
/* memory */
function flip(i){if(P.locked)return;const m=P.mem,q=cur();if(m.open.length===2||m.open.includes(i)||m.done.includes(i))return;m.open.push(i);drawBody();
  if(m.open.length===2){m.moves++;const[a,b]=m.open;if(q._c[a]===q._c[b]){m.done.push(a,b);m.open=[];tone(true);setTimeout(()=>{drawBody();if(m.done.length===q._c.length)good(`أنهيتها في ${ar(m.moves)} محاولة!`)},250)}else setTimeout(()=>{m.open=[];drawBody()},850)}}
/* robot */
function drawRobot(){const q=cur();P.prog=P.prog||[];P.run=P.run||{pos:q.start,step:-1,trail:[]};const W=new Set(q.walls);const showPath=P.showPath;
  let g=`<div class="grid" style="grid-template-columns:repeat(${q.size},1fr)">`;
  for(let r=0;r<q.size;r++)for(let c=0;c<q.size;c++){const k=r+','+c;const isR=P.run.pos[0]===r&&P.run.pos[1]===c,isG=q.goal[0]===r&&q.goal[1]===c;const onPath=showPath&&q.path.some(p=>p[0]===r&&p[1]===c);
    g+=`<div class="cell ${W.has(k)?'wall':''} ${onPath||P.run.trail.includes(k)?'path':''}">${isR?'🤖':isG?'⭐':W.has(k)?'🧱':''}</div>`}
  g+='</div>';
  const cmds=['u','l','r','d'].map(d=>`<button onclick="rCmd('${d}')" aria-label="${DIRS[d][3]}">${DIRS[d][2]}<small>${DIRS[d][3]}</small></button>`).join('');
  const prog=P.prog.length?P.prog.map((p,k)=>`<span class="${P.run.step===k?'cur':''}">${DIRS[p.d][2]}${p.n>1?' ×'+p.n:''}</span>`).join(''):'<em>البرنامج فارغ، اضغط الأسهم</em>';
  $('#qbody').innerHTML=`<div class="robot">${g}<div class="rpanel">
    <div class="cmds">${cmds}</div>
    ${q.loops?`<div class="mults"><span class="rinfo">كرّر آخر أمر:</span>${[2,3,4,5].map(n=>`<button onclick="rMul(${n})">×${ar(n)}</button>`).join('')}</div>`:''}
    <div class="rinfo">البرنامج (${ar(P.prog.length)} / ${ar(q.limit)} أوامر):</div>
    <div class="rprog">${prog}</div>
    <div class="center" style="justify-content:flex-start"><button class="btn" onclick="rRun()">▶ شغّل</button><button class="ghost" onclick="rUndo()">تراجع</button><button class="ghost" onclick="rClear()">امسح الكل</button></div>
   </div></div>`}
function rCmd(d){if(P.locked||P.running)return;const q=cur();if(P.prog.length>=q.limit){showFb('try',`الحد الأقصى ${ar(q.limit)} أوامر.${q.loops?' استخدم ×2 أو ×3 لتكرار الأمر بدل كتابته مرة أخرى.':''}`,'',false);return}P.prog.push({d,n:1});P.run={pos:q.start,step:-1,trail:[]};drawRobot()}
function rMul(n){if(P.locked||P.running||!P.prog.length)return;P.prog[P.prog.length-1].n=n;drawRobot()}
function rUndo(){if(P.locked||P.running)return;P.prog.pop();P.run={pos:cur().start,step:-1,trail:[]};drawRobot()}
function rClear(){if(P.locked||P.running)return;P.prog=[];P.run={pos:cur().start,step:-1,trail:[]};drawRobot()}
function rRun(){if(P.locked||P.running||!P.prog.length)return;const q=cur(),W=new Set(q.walls);$('#fb').hidden=true;
  const steps=[];P.prog.forEach((p,k)=>{for(let j=0;j<p.n;j++)steps.push({d:p.d,k})});
  P.running=true;P.run={pos:q.start,step:-1,trail:[q.start.join()]};let i=0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick=()=>{if(!P||V.view!=='play')return;if(i>=steps.length){P.running=false;return end(P.run.pos[0]===q.goal[0]&&P.run.pos[1]===q.goal[1]?'ok':'short')}
    const s=steps[i++],d=DIRS[s.d];const n=[P.run.pos[0]+d[0],P.run.pos[1]+d[1]];P.run.step=s.k;
    if(n[0]<0||n[1]<0||n[0]>=q.size||n[1]>=q.size){P.running=false;drawRobot();return end('out')}
    if(W.has(n.join())){P.running=false;drawRobot();return end('wall')}
    P.run.pos=n;P.run.trail.push(n.join());drawRobot();setTimeout(tick,reduce?60:380)};
  const end=(r)=>{if(r==='ok')return good('وصل الروبوت إلى النجمة! برنامجك يعمل 🎉');
    const msg={short:'توقف الروبوت قبل النجمة.',out:'خرج الروبوت من اللوحة!',wall:'اصطدم الروبوت بالجدار!'}[r];
    cur().hint=msg+' عدّل البرنامج وجرّب مجدداً.';
    bad(()=>{P.showPath=true;P.run={pos:q.start,step:-1,trail:[]};drawRobot()});
    if(!P.locked)setTimeout(()=>{if(P&&!P.locked&&!P.running){P.run={pos:q.start,step:-1,trail:[]};drawRobot()}},900)};
  drawRobot();setTimeout(tick,300)}

/* sort */
function sTap(i){if(P.locked)return;P.so.sel=i;drawBody()}
function sDrop(k){if(P.locked)return;const q=cur(),so=P.so;if(so.sel==null){showFb('try','اختر بطاقة أولاً ثم ضعها في مجموعتها.','',false);return}
  if(q.items[so.sel][1]===k){so.placed[so.sel]=k;so.sel=null;tone(true);drawBody();if(Object.keys(so.placed).length===q.items.length){if(so.miss<=1)good();else{P.locked=true;showFb('try','صنّفت الكل! حاول بأخطاء أقل في المرة القادمة.',q.hint||'',true)}}}
  else{so.miss++;tone(false);const el=$('#bk'+k);el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');if(q.hint)showFb('try','ليست هذه مجموعتها. فكّر مرة أخرى.',q.hint,false)}}
/* trace (handwriting) */
function drawTrace(){const q=cur();$('#qbody').innerHTML=`<div class="tracewrap"><canvas id="tc" width="300" height="300" aria-label="لوحة الكتابة"></canvas></div>
  <div class="center"><button class="ghost" onclick="tClear()">${q.lang==='en'?'Clear':'امسح'}</button><button class="btn" onclick="tCheck()">${q.lang==='en'?'Check':'تحقّق'}</button></div>
  <p class="muted" style="text-align:center;font-size:14px">${q.lang==='en'?'Use your finger or mouse to write over the light shape.':'مرّر إصبعك أو الفأرة فوق الشكل الفاتح لتكتبه.'}</p>`;setupTrace()}
function setupTrace(){const q=cur(),c=$('#tc');if(!c)return;const W=300,H=300;const mk=()=>{const o=document.createElement('canvas');o.width=W;o.height=H;return o};
  const cs=getComputedStyle(document.documentElement);const col=n=>cs.getPropertyValue(n).trim()||'#888';
  const g=mk(),tol=mk(),u=mk();const font=`700 ${q.size||210}px "Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif`;
  for(const [cv,stroke] of [[g,0],[tol,1]]){const x=cv.getContext('2d');x.font=font;x.textAlign='center';x.textBaseline='middle';x.direction=q.lang==='en'||/^\d+$/.test(q.text)?'ltr':'rtl';x.fillStyle='#000';x.fillText(q.text,W/2,H/2+(q.lang==='en'||/^\d+$/.test(q.text)?6:-10));if(stroke){x.lineWidth=34;x.lineJoin='round';x.strokeStyle='#000';x.strokeText(q.text,W/2,H/2+(q.lang==='en'||/^\d+$/.test(q.text)?6:-10))}}
  P.tr={c,g,tol,u,W,H,col:col('--c-ar')};const st=getComputedStyle($('.player')).getPropertyValue('--c').trim();P.tr.ink=st.startsWith('var')?col(st.slice(4,-1)):st||'#2F7BFF';P.tr.soft=col('--line');
  const ctx=c.getContext('2d'),uc=u.getContext('2d');uc.lineCap='round';uc.lineJoin='round';uc.lineWidth=20;
  const paint=()=>{ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;ctx.drawImage(g,0,0);ctx.globalCompositeOperation='source-in';ctx.fillStyle=P.tr.ink;ctx.globalAlpha=P.showGuide?.55:[.34,.2,.1][(P.lv||2)-1];ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    ctx.drawImage(u,0,0)};P.tr.paint=paint;
  let down=false,last=null;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  c.onpointerdown=e=>{if(P.locked)return;down=true;try{c.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);uc.strokeStyle=P.tr.ink;uc.beginPath();uc.arc(last[0],last[1],9,0,7);uc.fillStyle=P.tr.ink;uc.fill();paint()};
  c.onpointermove=e=>{if(!down)return;const p=pos(e);uc.beginPath();uc.moveTo(last[0],last[1]);uc.lineTo(p[0],p[1]);uc.stroke();last=p;paint()};
  c.onpointerup=c.onpointercancel=()=>{down=false};paint()}
function tClear(){if(P.locked||!P.tr)return;P.tr.u.getContext('2d').clearRect(0,0,P.tr.W,P.tr.H);P.tr.paint()}
function tCheck(){if(P.locked||!P.tr)return;const{g,tol,u,W,H}=P.tr;const G=g.getContext('2d').getImageData(0,0,W,H).data,T=tol.getContext('2d').getImageData(0,0,W,H).data,U=u.getContext('2d').getImageData(0,0,W,H).data;
  let gc=0,cov=0,uc=0,on=0;for(let i=3;i<G.length;i+=12){const gi=G[i]>40,ui=U[i]>40;if(gi){gc++;if(ui)cov++}if(ui){uc++;if(T[i]>40)on++}}
  const en=cur().lang==='en';if(uc<gc*.15){showFb('try',en?'Write the shape first, then press Check.':'اكتب الشكل أولاً، ثم اضغط تحقّق.','',false);return}
  const c1=cov/gc,p1=on/uc;cur().hint=c1<.45?(en?'Cover more of the light shape.':'غطِّ الشكل الفاتح كله بخطّك.'):(en?'Stay inside the light shape.':'حاول أن تبقى داخل الشكل الفاتح.');
  if(c1>=(P.lv===1?.4:.45)&&p1>=(P.lv>=3?.8:.72))good(en?'Beautiful writing! ✍️':'خط جميل! ✍️');else bad(()=>{P.showGuide=true;P.tr.paint()});if(!P.locked){P.tr.u.getContext('2d').clearRect(0,0,W,H);P.tr.paint()}}

/* fluency race (60 seconds) */
let R=null;
function startRace(){if(R&&R.timer)clearInterval(R.timer);R={score:0,miss:0,t:60,q:RACEGEN[D.stage](raceLv()),inp:'',on:true,flash:''};go('race');R.timer=setInterval(()=>{if(!R)return;R.t--;const e=$('#rt');if(e)e.textContent=R.t;const b=$('#rbar');if(b)b.style.width=(R.t/60*100)+'%';if(R.t<=0)endRace()},1000)}
function endRace(){clearInterval(R.timer);R.on=false;D.race=D.race||{};const prev=D.race[D.stage]||0;R.best=R.score>prev;D.race[D.stage]=Math.max(prev,R.score);save();if(V.view==='race'){render();if(R.best&&R.score>0)confetti()}}
function vRace(){const s=ST();if(!R)return vHome();if(!R.on){const acc=R.score+R.miss?Math.round(R.score/(R.score+R.miss)*100):0;return `<section class="result"><div class="rtop"><span class="eyebrow">سباق الحساب · ${s.name}</span><div class="bigstars" style="font-size:64px;color:#fff">${R.score}</div><p>إجابة صحيحة في 60 ثانية</p></div>
   <h1>${R.best&&R.score?'رقم قياسي جديد!':R.score>=10?'سرعة رائعة!':'تمرين ممتاز!'}</h1><p class="muted">الدقة: ${acc}% · أفضل نتيجة لك: ${(D.race||{})[s.id]||0}</p><p class="muted">التدريب اليومي القصير يجعل الحقائق الحسابية تلقائية، فيتفرغ العقل لحل المسائل الأصعب.</p>
   <div class="center"><button class="btn" onclick="startRace()">سباق جديد</button><button class="btn ghost" onclick="go('home')">الرئيسية</button></div></section>`}
  return `<section class="player" style="--c:var(--c-math)"><div class="ptop"><button class="ghost" onclick="stopRace()">إنهاء</button><span class="ptitle">سباق الحساب</span><div class="pbar"><i class="now" id="rbar" style="flex:none;width:${R.t/60*100}%;background:var(--c-math)"></i></div><span class="pcount"><span id="rt">${R.t}</span> ث</span></div>
   <div class="qcard"><div class="racehead"><span>✓ <b>${R.score}</b></span><span class="muted">المستوى ${LEVELS[raceLv()-1].ic} ${LEVELS[raceLv()-1].name}</span><span class="muted">✗ ${R.miss}</span></div>
    <div class="big ${R.flash}"><span class="huge">${R.q.t}</span></div>
    <div class="ansbox" id="ans">${R.inp||'؟'}</div>
    <div class="keypad" dir="ltr">${[1,2,3,4,5,6,7,8,9,0].map(k=>`<button onclick="rk('${k}')">${k}</button>`).join('')}<button class="del" onclick="rk('del')">⌫ مسح</button><button class="go" onclick="rk('ok')">أدخل</button></div>
    <p class="muted" style="text-align:center;font-size:14px">يمكنك الكتابة من لوحة المفاتيح أيضاً، واضغط Enter.</p></div></section>`}
function rk(k){if(!R||!R.on)return;if(k==='del')R.inp=R.inp.slice(0,-1);else if(k==='ok'){if(!R.inp)return;if(+R.inp===R.q.a){R.score++;tone(true);R.flash='okf'}else{R.miss++;tone(false);R.flash='badf'}R.inp='';R.q=RACEGEN[D.stage](raceLv());render();return}else if(R.inp.length<3)R.inp+=k;const a=$('#ans');if(a)a.textContent=R.inp||'؟'}
function stopRace(){if(R){clearInterval(R.timer);R=null}go('home')}

/* physical keyboard for number pads */

  if(V.view==='race'&&R&&R.on){e.preventDefault();rk(map)}else if(V.view==='play'&&P&&cur().t==='input'&&!P.locked){e.preventDefault();kp(map)}});

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='confetti';const cols=['var(--sun)','var(--coral)','var(--brand)','var(--c-code)','var(--c-think)'];
  for(let i=0;i<60;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[i%5];s.style.animationDelay=Math.random()*.6+'s';s.style.transform=`rotate(${rnd(0,90)}deg)`;c.appendChild(s)}document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}

/* ============ level engine ============ */
const passedLevels=id=>{const v=(D.lv||{})[id]||{};let k=0;while(k<MAXLV&&(v[k+1]||0)>=2)k++;return k};
const unlockedLevel=id=>Math.min(MAXLV,passedLevels(id)+1);
const qk=q=>strip(q.q||'')+'|'+(q.a??'')+'|'+(q.text||'')+'|'+strip(q.big||'').slice(0,40);
function adapt(qs,lv){qs=qs.map(q0=>{const q=Object.assign({},q0);
  if(q.t==='mcq'&&lv===1&&q.opts.length>3){const w=q.opts.filter(o=>o!==q.a);const drop=w[rnd(0,w.length-1)];q.opts=q.opts.filter(o=>o!==drop)}
  if(q.t==='memory'){if(lv===1)q.cards=q.cards.slice(0,Math.max(2,q.cards.length-1));if(lv===3)q.cards=[...q.cards,...shuffle(MANY.filter(e=>!q.cards.includes(e))).slice(0,2)]}
  if(q.t==='match'&&lv===1&&q.pairs.length>3)q.pairs=q.pairs.slice(0,3);
  if(q.t==='sort'){const k=lv===1?4:lv===2?6:99;if(q.items.length>k){const by=q.cats.map((_,c)=>q.items.filter(it=>it[1]===c));const out=[];let r=0;while(out.length<k){const b=by[r%by.length];if(b.length)out.push(b.shift());r++;if(r>200)break}q.items=shuffle(out)}}
  return q});
  if(lv===1&&qs.length>4&&qs.every(q=>['mcq','input','trace'].includes(q.t)))qs=qs.slice(0,4);
  return qs}
function openLesson(id){const l=findLesson(id);V.lid=id;V.lvSel=unlockedLevel(id);if(!LEARN[l.title])return startLesson(id,V.lvSel);go('learn')}
function startLesson(id,lv){const l=findLesson(id);lv=Math.min(lv||unlockedLevel(id),unlockedLevel(id));const gl=Math.min(lv,3);LV=gl;let qs=l.make();const want=lv>=5?10:lv>=3?8:0;
  if(want&&qs.length>=4&&qs.length<want&&qs.every(q=>['mcq','input','trace'].includes(q.t))){const seen=new Set(qs.map(qk));for(let g=0;g<10&&qs.length<want;g++)for(const q of l.make()){if(qs.length>=want)break;const k=qk(q);if(!seen.has(k)){seen.add(k);qs.push(q)}}}
  if(lv===5){const ls=LESSONS[l.stage],idx=ls.indexOf(l);let prev=ls.slice(0,idx).filter(x=>x.subj===l.subj);if(!prev.length)prev=ls.filter(x=>x.subj===l.subj&&x!==l);for(const p of shuffle(prev).slice(0,3)){LV=3;const pq=p.make().filter(q=>['mcq','input'].includes(q.t));if(pq.length)qs.splice(rnd(1,qs.length),0,Object.assign({},pick(pq),{review:p.title}))}LV=gl;qs.forEach(q=>{q.hint=''})}
  qs=adapt(qs,gl);P={lesson:l,lv,qs,i:0,score:0,tries:0,locked:false,combo:0};go('play')}
function startMix(kind){const ls=LESSONS[D.stage];let qs=[];
  if(kind==='exam'){LV=2;for(const k of Object.keys(SUBJ)){const pool=shuffle(ls.filter(l=>l.subj===k));let got=0;for(const l of pool){const q=l.make().filter(q=>q.t!=='memory');if(q.length){qs.push(...adapt(q.slice(0,1),2));got++}if(got>=2)break}}}
  else{for(const l of shuffle(ls).slice(0,6)){LV=Math.min(3,unlockedLevel(l.id));const q=l.make().filter(q=>q.t!=='memory');if(q.length)qs.push(...adapt([q[0]],LV))}}
  qs=shuffle(qs);const st=ST();
  P={lesson:{id:st.id+'-'+kind,title:kind==='exam'?'الاختبار الشامل لمرحلة '+st.name:'تحدّي اليوم',subj:'all',stage:st.id,kind},lv:2,qs,i:0,score:0,tries:0,locked:false};go('play')}
function finish(){const n=P.qs.length,pct=P.score/n;const stars=pct>=.9?3:pct>=.6?2:1;const l=P.lesson,id=l.id;let newBest=false,unlocked=0;
  if(!l.kind){D.last[id]=Date.now();D.lv=D.lv||{};D.lv[id]=D.lv[id]||{};const pv=D.lv[id][P.lv]||0;newBest=stars>pv;D.lv[id][P.lv]=Math.max(pv,stars);const before=D.best[id]||0;D.best[id]=passedLevels(id);if(D.best[id]>before&&D.best[id]<MAXLV)unlocked=D.best[id]+1}
  if(l.kind==='exam')D.exams[l.stage]=Math.max(D.exams[l.stage]||0,Math.round(pct*100));
  save();P.result={stars,pct,newBest,unlocked};V.view='result';render();if(stars===3)confetti()}
function nextLesson(){const ls=[...LESSONS[D.stage]].sort((a,b)=>a.tier-b.tier);return ls.find(l=>!D.best[l.id])||ls.find(l=>(D.best[l.id]||0)<MAXLV)||ls[0]}
function lessonCard(l){const sj=SUBJ[l.subj],st=D.best[l.id]||0;return `<button class="lesson" style="--c:${sj.c}" onclick="openLesson('${l.id}')">

     <div class="lbody"><h3>${l.title}</h3><p class="sk">${l.skill}</p></div>
     <div class="lf"><span class="tierchip t${l.tier}">${TIERS[l.tier]}</span><span class="lgo">${st>=MAXLV?'👑 أُتقن':st?'مستوى '+LEVELS[Math.min(st,MAXLV-1)].name:'ابدأ'} ←</span></div></button>`}
function vStage(){const s=ST(),i=STAGES.indexOf(s);const ls=LESSONS[s.id].filter(l=>V.filter==='all'||l.subj===V.filter);
  const groups=[0,1,2].map(t=>ls.filter(l=>l.tier===t));const TD=['ابدأ من هنا: المهارات الأساسية في كل مادة.','بعد الأساسيات: مهارات تبني على ما تعلّمه الطفل.','للتحدي: تطبيق المهارات في مواقف أعمق.'];

   <div><span class="eyebrow">أكاديمية ${s.name} · ${s.ages} · ${LESSONS[s.id].length} درساً</span><h1>الدروس</h1><p>الدروس مرتّبة من الأسهل إلى الأصعب في 3 مراحل، ولكل درس 5 مستويات: 🌱 بذرة ← 🌿 نبتة ← 🌳 شجرة ← 🍎 ثمرة ← 👑 تاج.</p><div class="chips">${s.skills.map(k=>`<span>${k}</span>`).join('')}</div></div>
   <div class="headbtns"><button class="btn sun" onclick="startMix('exam')">الاختبار الشامل</button><button class="btn white" onclick="startMix('daily')">تحدّي اليوم</button>${RACEGEN[s.id]?'<button class="btn glass" onclick="startRace()">⏱ سباق الحساب</button>':''}</div></div>
   <div class="tabs" role="toolbar" aria-label="المواد"><button class="tab" style="--c:var(--ink)" aria-pressed="${V.filter==='all'}" onclick="setFilter('all')"><span class="dot"></span>كل المواد</button>${Object.entries(SUBJ).map(([k,x])=>`<button class="tab" style="--c:${x.c}" aria-pressed="${V.filter===k}" onclick="setFilter('${k}')"><span class="dot"></span>${x.name}</button>`).join('')}</div>
   ${V.filter!=='all'?`<p class="muted"><b style="color:${SUBJ[V.filter].c}">${SUBJ[V.filter].name} في ${s.name}:</b> ${STAGE_SUBJ[s.id][V.filter]}.</p>`:''}
   ${groups.map((g,t)=>g.length?`<div class="tierhead" style="--c:${LEVELS[t].c}"><span class="tnum">${t+1}</span><div><h3>${TIERS[t]}</h3><p class="muted">${TD[t]}</p></div><span class="tcount">${g.filter(l=>D.best[l.id]).length}/${g.length}</span></div><div class="lessons">${g.map(lessonCard).join('')}</div>`:'').join('')}</section>`}
function vLearn(){const l=findLesson(V.lid),sj=SUBJ[l.subj],L2=LEARN[l.title];const en=l.subj==='en'||l.subj==='de';const ul=unlockedLevel(l.id);if(!V.lvSel||V.lvSel>ul)V.lvSel=ul;const sel=LEVELS[V.lvSel-1];
  return `<section class="player" style="--c:${sj.c}"><div class="ptop"><button class="ghost" onclick="go('stage')">رجوع</button><span class="ptitle">${sj.name} · ${domainOf(l)} · ${TIERS[l.tier]}</span></div>
   <div class="qcard learn">
    <div class="qhead"><div><span class="eyebrow">${l.method}</span><h1 class="ltitle" ${en?'dir="ltr" style="text-align:left"':''}>${l.title}</h1></div>${canSpeak()?`<button class="say" onclick="speak(LEARN[findLesson(V.lid).title][0],'ar')" aria-label="استمع للشرح">${SPK}</button>`:''}</div>
    <div class="lsteps">
     <div class="lstep"><span class="lnum">فكرة</span><p>${L2[0]}</p></div>
     <div class="lstep ex"><span class="lnum">مثال</span><p class="exm">${L2[1]}</p></div>
     <div class="lstep"><span class="lnum">مهارة</span><p>${l.skill}</p></div>
    </div>
    <div><b>اختر المستوى</b><div class="lvpick">${LEVELS.map(L=>{const lock=L.n>ul;const st=((D.lv||{})[l.id]||{})[L.n]||0;return `<button class="lv ${V.lvSel===L.n?'on':''}" style="--c:${L.c}" ${lock?'disabled':''} onclick="V.lvSel=${L.n};render()"><span class="lic">${lock?'🔒':L.ic}</span><b>${L.name}</b><small>${lock?'يُفتح بعد نجمتين في المستوى السابق':L.d}</small><span class="stars3">${N(3,k=>`<span class="${k<st?'on':''}">★</span>`).join('')}</span></button>`}).join('')}</div></div>
    <div class="homeact"><b>جرّبوا في البيت:</b> ${HOMEACT[l.stage][l.subj]}</div>
    <div class="center"><button class="btn" onclick="startLesson('${l.id}',V.lvSel)">ابدأ مستوى ${sel.ic} ${sel.name} ←</button></div>
   </div></section>`}
function vResult(){const r=P.result,l=P.lesson,lvl=LEVELS[(P.lv||2)-1];const msgs=[['محاولة جيدة!','كل بطل يبدأ هكذا. اقرأ فكرة الدرس مرة أخرى ثم أعد التدريب، وستلاحظ الفرق.'],['عمل رائع!','أنت تتقدّم بثبات. جولة أخرى وتحصل على النجمة الثالثة.'],['مذهل!','أتقنت هذا المستوى. راجعه بعد 3 أيام ليبقى في ذاكرتك.']];const[m1,m2]=msgs[r.stars-1];
  const ls=LESSONS[l.stage]||[];const idx=ls.findIndex(x=>x.id===l.id);const nx=idx>=0?ls.slice(idx+1).find(x=>x.subj===l.subj)||ls[idx+1]:null;const wrong=P.qs.length-P.score;
  const primary=l.kind?`<button class="btn" onclick="startMix('${l.kind}')">أعد التحدي بأسئلة جديدة</button>`:r.unlocked?`<button class="btn" onclick="startLesson('${l.id}',${r.unlocked})">ابدأ مستوى ${LEVELS[r.unlocked-1].ic} ${LEVELS[r.unlocked-1].name}</button>`:`<button class="btn" onclick="startLesson('${l.id}',${P.lv})">أعد مستوى ${lvl.name} بأسئلة جديدة</button>`;
  return `<section class="result"><div class="rtop"><span class="eyebrow">${l.title}${l.kind?'':' · مستوى '+lvl.ic+' '+lvl.name}</span><div class="bigstars" aria-label="${r.stars} نجوم">${N(3,k=>`<span class="${k<r.stars?'on':''}">★</span>`).join('')}</div></div>
   <h1>${m1}${D.name?' يا '+esc(D.name):''}</h1><p class="muted">${m2}</p>
   <p class="score">صحيح من أول محاولة: ${P.score} من ${P.qs.length}${wrong?` · تعلّمت من ${wrong} ${wrong>2?'أخطاء':'خطأ'}`:''}</p>
   ${r.unlocked?`<p class="unlock">🔓 فتحت مستوى ${LEVELS[r.unlocked-1].ic} ${LEVELS[r.unlocked-1].name}! ${LEVELS[r.unlocked-1].d}.</p>`:''}
   ${!l.kind&&r.stars<2?`<p class="muted">اجمع نجمتين في هذا المستوى ليُفتح المستوى التالي.</p>`:''}
   ${!l.kind&&passedLevels(l.id)===MAXLV&&P.lv===MAXLV&&r.stars>=2?'<p class="unlock">👑 أتقنت الدرس بمستوياته الخمسة!</p>':''}
   ${l.kind?'':`<div class="reflect"><b>كيف كان المستوى؟</b><div class="center">${[['سهل','easy'],['مناسب','ok'],['صعب','hard']].map(([t,v])=>`<button class="ghost ${D.feel[l.id]===v?'on':''}" onclick="feel('${l.id}','${v}')">${t}</button>`).join('')}</div><p class="muted" id="feelmsg">${feelMsg(D.feel[l.id])}</p></div>`}
   <div class="center">${primary}${nx?`<button class="btn sun" onclick="openLesson('${nx.id}')">التالي: ${nx.title}</button>`:''}<button class="btn ghost" onclick="go('home')">الرئيسية</button></div></section>`}
function feelMsg(v){return v==='easy'?'رائع! جرّب المستوى الأعلى، أو الدرس التالي في المسار.':v==='hard'?'لا بأس، الصعب يعني أن عقلك ينمو. ارجع للمستوى الأسهل أو اقرأ الفكرة والمثال مرة أخرى.':v==='ok'?'ممتاز، هذا هو المستوى المثالي للتعلّم. استمر!':'اختيارك يساعدنا نقترح عليك المستوى المناسب.'}
/* race gets harder as the score climbs */
const raceLv=()=>!R?1:R.score<6?1:R.score<14?2:3;
const RACEGEN={
 s2:(lv)=>{const T=[3,5,10][lv-1],a=rnd(0,T),b=rnd(0,Math.max(0,T-a));return{t:`${a} + ${b}`,a:a+b}},
 s3:(lv)=>{const T=[10,20,40][lv-1];if(lv===1||Math.random()<.5){const a=rnd(1,T-1),b=rnd(1,T-a);return{t:`${a} + ${b}`,a:a+b}}const a=rnd(5,T),b=rnd(1,a);return{t:`${a} − ${b}`,a:a-b}},
 s4:(lv)=>{if(lv===1){const a=pick([2,5,10]),b=rnd(1,10);return{t:`${a} × ${b}`,a:a*b}}const M=lv===2?10:12;if(Math.random()<.6){const a=rnd(2,M),b=rnd(2,M);return{t:`${a} × ${b}`,a:a*b}}const b=rnd(2,M),q=rnd(2,M);return{t:`${b*q} ÷ ${b}`,a:q}}};

/* ============ curriculum map view ============ */
function vCurr(){const s=ST(),i=STAGES.indexOf(s);const ls=LESSONS[s.id];const done=ls.filter(l=>D.best[l.id]).length,mast=ls.filter(l=>(D.best[l.id]||0)>=MAXLV).length;const nStr=Object.keys(SUBJ).reduce((a,k)=>a+DOMAINS[k].d.filter(d=>ls.some(l=>l.subj===k&&d[2].includes(l.title))).length,0);
  return `<section class="section"><div class="stagehead" style="--s:${s.c}"><div class="pot">${plant(i)}</div>
   <div><span class="eyebrow">أكاديمية ${s.name} · يعادل ${GRADES[s.id]}</span><h1>خريطة المنهج</h1><p>ما تدرّسه المدارس المعتمدة في هذه المرحلة، مقسّماً إلى مجالات المعايير الوطنية والدولية، وكل درس في الأكاديمية يغطي جزءاً منها.</p>
    <div class="chips"><span>المنهج المصري Edu 2.0</span><span>Common Core</span><span>Cambridge Primary</span><span>NGSS</span><span>CSTA</span><span>CASEL</span></div></div>
   <div class="headbtns"><div class="cstat"><b>${ls.length}</b><small>درساً</small></div><div class="cstat"><b>${nStr}</b><small>مجالاً منهجياً</small></div><div class="cstat"><b>${done}/${mast}</b><small>بدأ / أتقن</small></div></div></div>
   <div class="legend"><span class="lchip">لم يبدأ</span><span class="lchip p">قيد التعلّم</span><span class="lchip m">أُتقن (👑 5 مستويات)</span></div>
   ${Object.entries(SUBJ).map(([k,x])=>{const D2=DOMAINS[k];const rows=D2.d.map(d=>{const items=ls.filter(l=>l.subj===k&&d[2].includes(l.title)).sort((a,b)=>a.tier-b.tier);if(!items.length)return'';return `<div class="strand"><div class="sthead"><b>${d[0]}</b><small>${d[1]}</small></div><div class="stl">${items.map(l=>{const b=D.best[l.id]||0;return `<button class="lchip ${b>=MAXLV?'m':b?'p':''}" onclick="openLesson('${l.id}')">${l.title}${b?`<i>${LEVELS.slice(0,b).map(L=>L.ic).join('')}</i>`:''}</button>`}).join('')}</div></div>`}).join('');
     return rows?`<div class="panel currsub" style="--c:${x.c}"><div class="cshead"><span class="glyph" style="--c:${x.c}">${x.glyph}</span><div><h2>${x.name}</h2><small class="muted">المرجع: ${D2.ref}</small></div></div>${rows}</div>`:''}).join('')}
   <p class="muted">ملاحظة للأسرة: الأكاديمية تدعم ما يتعلمه الطفل في المدرسة وتقوّيه، ولا تغني عن المنهج المدرسي الرسمي أو عن المعلم.</p></section>`}

/* ============ boot ============ */
drawSound();render();
try{speechSynthesis.getVoices()}catch(e){}
</script>
