<script>
COURSE.push(
{
  id:'m9', code:'DS-09', title:'Marketing & Traffic Acquisition', mins:15,
  lede:'Everything else is preparation. This is the part that actually generates revenue — and consumes it.',
  blocks:[
    {h:'The traffic map'},
    {table:{head:['Channel','Cost','Speed','Buyer intent','Difficulty'],rows:[
      ['TikTok organic','Free','Medium','Low → impulse','Low'],
      ['TikTok / Reels ads','Paid','Fast','Low → impulse','Medium'],
      ['Meta (Facebook/Instagram) ads','Paid','Fast','Low → interrupt','Medium-high'],
      ['Google Search & Shopping','Paid','Fast','Very high','Medium-high'],
      ['Pinterest ads','Paid','Medium','Medium, planning-stage','Low-medium'],
      ['Email & SMS','Very low','Medium','Very high (existing buyers)','Low'],
      ['Creator / affiliate partnerships','Variable','Medium','Medium-high','Medium'],
      ['TikTok Shop (native)','Commission','Fast','Impulse, in-app','Medium'],
      ['SEO & content','Free (time)','Very slow','Very high','High']
    ]}},
    {p:'The distinction that matters most is <b>interruption versus intent</b>. Meta and TikTok interrupt someone who was not shopping — you must create desire, so your creative carries the entire result. Google captures someone already searching — your creative matters less, but you compete on price and trust against established retailers.'},
    {h:'Paid social: a testing framework that works'},
    {ladder:[
      {t:'Produce 3–5 distinct creatives','d':'Not colour variations. Genuinely different angles: problem-agitation, before-and-after, unboxing, testimonial, and a founder-to-camera. The angle is the variable, not the button colour.'},
      {t:'Launch broad, one campaign','d':'One campaign, 2–3 ad sets, all creatives inside. Modern algorithms find the audience better than your interest guesses. Budget $10–$20 per ad set per day.'},
      {t:'Wait 3 full days','d':'Do not touch anything. The learning phase needs roughly 50 conversion events to stabilise. Killing an ad on day one is the most common beginner mistake.'},
      {t:'Read the funnel, not the outcome','d':'Low CTR means the creative failed. Good CTR but low add-to-cart means the product page failed. Good add-to-cart but low purchase means checkout or pricing failed. Diagnose the stage, then fix that stage.'},
      {t:'Cut and double down','d':'Kill anything below break-even ROAS after 3–5 days and roughly $50–100 spend. Move that budget to the winner and produce three new creatives in the winning angle.'},
      {t:'Add retargeting only after you have traffic','d':'Retargeting needs volume to work. Below about 1,000 site visitors in 30 days, it will not spend properly.'}
    ]},
    {h:'Benchmarks to judge against'},
    {table:{head:['Metric','Weak','Acceptable','Strong'],rows:[
      ['CTR (link)','under 0.8%','1.0 – 1.5%','over 2.0%'],
      ['CPC','over $1.80','$0.70 – $1.50','under $0.60'],
      ['Add-to-cart rate','under 4%','6 – 9%','over 11%'],
      ['Conversion rate','under 1.2%','1.8 – 3.0%','over 3.5%'],
      ['ROAS','under break-even','1.5 – 2.5x','over 3.0x'],
      ['Thumbstop (3s view rate)','under 20%','25 – 35%','over 40%']
    ]}},
    {callout:'tip',t:'Creative is 80% of paid social performance',x:'Targeting has been largely automated away. Two advertisers with identical settings and different creative will see a 5x difference in results. If a campaign is failing, the answer is almost never a new audience — it is a new angle. Produce more creative than feels reasonable.'},
    {h:'TikTok organic: the free validation channel'},
    {ul:[
      'Post 1–3 times a day. Volume matters more than polish; the algorithm gives every post a chance.',
      'The first two seconds decide everything. Open on the most surprising visual, never on a logo or an intro.',
      'Shoot vertical, natural light, handheld. Over-produced content underperforms on this platform.',
      'Formats that reliably work: problem then solution, unexpected use case, honest review, "things I wish I knew", and satisfying process shots.',
      'Read your comments for product research. "Where did you get that" is your demand signal; "how much" is your pricing research.',
      'Reply to comments with a video. This is the cheapest reach multiplier on the platform.'
    ]},
    {h:'TikTok Shop and native social commerce'},
    {p:'TikTok Shop is now a genuine sales channel rather than a traffic source — the customer buys inside the app and never reaches your site. That changes the economics completely, and it carries one rule that most dropshippers discover too late.'},
    {callout:'warn',t:'This blocks classic dropshipping',x:'As of 2026, US TikTok Shop sellers can no longer ship independently using their own carrier labels. You must use Fulfilled by TikTok, Upgraded TikTok Shipping, or Collections. A supplier in Shenzhen dropshipping direct to your customer does not satisfy that. If you want this channel, you need stock inside the fulfilment network — which means importing in bulk, not dropshipping.'},
    {table:{head:['Cost layer','Typical rate','Note'],rows:[
      ['Referral fee (US)','~6% of order value','5% on some categories; payment processing is included in it'],
      ['Referral fee (UK)','~9%','Materially higher than the US'],
      ['New seller promotion','3% for 30 days','If you make a first sale within 60 days of onboarding'],
      ['Affiliate commission','You set it, 1–80%','US average around 13%; open collaborations typically 10–15%, targeted deals 15–25%+'],
      ['Fulfilment','Per unit, roughly $3–$4','Plus storage if using FBT'],
      ['Content production','$1,500–$25,000/month','To sustain 3–5 fresh videos a week'],
      ['<b>Realistic all-in take</b>','<b>~30% of selling price</b>','Roughly five times the headline referral rate']
    ]}},
    {p:'The headline 6% is the least important number on that table. Model the full stack before committing inventory, because a product that works at 25% platform cost can be a loss at 35%. Note also that payouts are initiated between 1 and 31 days after delivery depending on your settlement tier — another cash-flow consideration on top of the inventory you now have to fund.'},
    {callout:'tip',t:'How to think about it',x:'TikTok Shop is not an easier version of dropshipping. It is a marketplace business that rewards creator relationships and content volume, and it requires real inventory. Treat it as a second business model you graduate into once a product is proven, not as a beginner shortcut.'},
    {h:'AI creative: the bottleneck is dissolving'},
    {p:'Creative volume has always been the real ceiling on paid social. Traditional creator UGC runs roughly $150–$300 a video plus 30–50% for usage rights, so a 20-video test could cost $4,000–$9,000 and take weeks of briefing and revisions. AI generation has collapsed the marginal cost of a variant to near zero, which changes the testing strategy rather than just the budget.'},
    {ul:[
      '<b>Hybrid beats fully synthetic.</b> Real creator footage augmented with AI voiceover, b-roll and editing performs at or near parity with full human production. Fully synthetic talking heads have been measured underperforming real UGC by 30–50% on view-through. Use AI to multiply real footage, not to replace it entirely.',
      '<b>Generate variants, not concepts.</b> Ten hooks, five personas and three openings from one proven angle, then let spend pick the winner and iterate the winner into the next batch.',
      '<b>Platforms permit it.</b> Meta, TikTok and Google allow AI-generated creative in standard ecommerce ads. Meta\'s approach is disclosure rather than prohibition — it auto-applies an AI info label for its own generative tools, and places a more prominent label next to Sponsored when a photorealistic human is generated. Third-party AI tools are detected through industry standards such as C2PA.',
      '<b>Disclosure rules are tightening.</b> TikTok places a labelling duty on the advertiser. The EU AI Act, effective August 2026, requires disclosure when content is AI-generated — so if you advertise into EU markets, label it.',
      '<b>The hard line is fabricated testimonials.</b> FTC guidance treats AI exactly like human creators: an AI avatar captioned as a verified buyer is deceptive advertising. An avatar presented as a brand spokesperson is fine. The distinction is whether you are asserting a false identity or a false experience.'
    ]},
    {callout:'note',t:'Why this matters strategically',x:'Meta has been steadily shifting performance away from targeting and toward creative, with the explicit long-term goal of automating the entire media buying cycle. In that world your only durable inputs are product, offer and creative. Cheap creative volume is no longer a nice efficiency — it is the main lever you still control.'},
    {h:'Email and SMS: the margin channel'},
    {p:'Paid traffic buys the first order. Email and SMS make the second, third and fourth — at near-zero cost. A store doing 25–35% of revenue from owned channels is a fundamentally different business from one at 5%.'},
    {table:{head:['Flow','Trigger','Typical revenue share'],rows:[
      ['Welcome series (3–4 emails)','Email capture','5–10% of email revenue'],
      ['Abandoned cart (3 emails)','Cart not completed','20–30%'],
      ['Abandoned checkout / browse','Checkout started or product viewed','10–15%'],
      ['Post-purchase & review request','Delivery confirmed','5–10%'],
      ['Cross-sell / replenishment','30–60 days after purchase','10–20%'],
      ['Win-back','90+ days inactive','5–10%'],
      ['Campaigns (broadcasts)','Manual','20–30%']
    ]}},
    {callout:'warn',t:'Ad account hygiene',x:'Warm new ad accounts slowly. Verify your business, connect the pixel via Conversions API, avoid absolute health or income claims, and never use before-and-after body imagery on Meta. A banned account can cost you weeks of revenue and is often unrecoverable.'}
  ]
},
{
  id:'m10', code:'DS-10', title:'Customer Service & Operations', mins:10,
  lede:'The unglamorous function that decides whether you keep your payment processor.',
  blocks:[
    {p:'In dropshipping, support is not a cost centre — it is risk management. Chargebacks above roughly 1% of transactions put your payment processing at risk, and the leading cause of chargebacks is a customer who could not get an answer.'},
    {h:'The operating standard'},
    {ul:[
      'Reply to every message within 24 hours. Under 12 is better and is a genuine competitive advantage.',
      'Use a branded address (support@yourdomain.com), never a personal Gmail account.',
      'Set delivery expectations <b>before</b> purchase, on the product page. An honest "ships in 7–12 days" prevents far more disputes than an optimistic promise.',
      'Send proactive updates at dispatch, at customs clearance, and at out-for-delivery. Silence causes disputes.',
      'Build a macro library for the eight questions that make up 80% of your volume.',
      'Refund fast. A $30 refund is always cheaper than a chargeback, which costs the refund plus a $15–25 fee plus a mark against your account.'
    ]},
    {h:'Scenario playbook'},
    {table:{head:['Situation','Correct response','Why'],rows:[
      ['Not arrived, inside stated window','Send tracking, restate the window, apologise for the wait','Sets expectation without over-committing'],
      ['Not arrived, past stated window','Offer immediate choice: reship or full refund','Removes the reason to file a dispute'],
      ['Wrong item received','Ship the correct item free, tell them to keep the wrong one','Return shipping usually exceeds product cost'],
      ['Arrived damaged','Request one photo, refund or reship same day','Photo protects you with the supplier, speed protects you with the customer'],
      ['Customer wants to return, no fault','Honour it. Offer a refund on return, or a partial refund to keep','Fighting costs more than the item'],
      ['Angry public review','Reply publicly, calmly, with a specific remedy','Future buyers read your response, not the complaint'],
      ['Supplier out of stock','Email immediately with alternative or full refund','Delay turns a small problem into a dispute'],
      ['Chargeback filed','Submit tracking, delivery confirmation, terms acceptance, all correspondence','Documentation is the only thing that wins these']
    ]}},
    {callout:'tip',t:'The generosity rule',x:'When the cost of being generous is under about $40, be generous immediately and without negotiation. The refund is cheap. The chargeback, the review, and the story they tell three friends are not.'},
    {h:'Returns and reverse logistics'},
    {p:'Returns are the operational problem dropshipping handles worst, because there is usually nowhere sensible to send the item. Returning a $12 product to China costs more than the product. Decide your policy deliberately rather than improvising per ticket.'},
    {table:{head:['Item value','Best policy','Reasoning'],rows:[
      ['Under $25','Refund, do not request return','Return shipping exceeds product value every time'],
      ['$25–$60','Refund or replace without return; photo evidence for defects','Still cheaper than handling the logistics'],
      ['$60–$150','Return to a domestic address or 3PL if you have one','Worth recovering; consider a restocking approach'],
      ['Over $150','Always accept a return with a prepaid label','The recovery justifies the cost, and buyers at this price expect it']
    ]}},
    {ul:[
      'If you have no domestic return address, say so honestly in your policy and refund without return. Do not invent an address you cannot service.',
      'Track return reasons with codes. Size, quality, not-as-described and changed-mind require completely different fixes.',
      'A spike in "not as described" is a listing problem, not a customer problem. Fix the photos and the size reference.',
      'Once volume justifies it, a domestic 3PL that accepts returns pays for itself in recovered stock and reduced refunds.',
      'Build the return cost into your pricing as a percentage reserve. It is a cost of doing business, not an exception.'
    ]},
    {h:'Fraud and card testing'},
    {p:'New stores are targeted precisely because they are new. Two patterns account for most of the damage, and both are cheap to defend against once you know to look.'},
    {cards:[
      {t:'Card testing','d':'Automated attempts to validate stolen cards using your checkout, often hundreds of small orders in minutes. Each failed attempt can still incur a processor fee, and the authorisation pattern alone can trigger a review of your account.'},
      {t:'Fraudulent orders','d':'A real order placed with a stolen card. You ship, the genuine cardholder disputes, and you lose the goods and the money and take a chargeback mark.'}
    ]},
    {ul:[
      'Enable your platform fraud analysis and actually read the risk flags before fulfilling flagged orders.',
      'Turn on CAPTCHA or bot protection at checkout — this stops most card testing outright.',
      'Enable 3D Secure where available. It shifts liability for disputed transactions to the issuer.',
      'Hold and manually review orders where billing and shipping countries differ, where the order is unusually large for your store, or where several orders share a card or address.',
      'Be suspicious of express shipping requested on a low-value item — speed matters to someone using a stolen card.',
      'Cancel and refund rather than ship when a flag is genuine. A lost sale costs less than the goods plus the chargeback plus the fee.',
      'Never let a suspicious spike run overnight unattended. Card testing at 3am has ended stores.'
    ]},
    {callout:'warn',t:'Fraud counts against your dispute ratio',x:'A chargeback from genuine fraud damages your processor standing exactly like a chargeback from bad service. The processor does not distinguish between the two, which is why prevention matters more than being right.'},
    {h:'Choosing and protecting a payment processor'},
    {p:'Losing payment processing is the single most likely way a working store dies. Treat the processor relationship as infrastructure, not a checkout setting.'},
    {ul:[
      '<b>Run at least two processors.</b> Shopify Payments or Stripe plus PayPal. If one freezes, you can still trade while you resolve it.',
      '<b>Expect a reserve early.</b> New accounts in high-risk categories often face a rolling reserve. Plan cash flow assuming delayed payout, not instant.',
      '<b>Keep your descriptor recognisable.</b> A statement line the customer does not recognise generates disputes for orders they were perfectly happy with.',
      '<b>Match your stated shipping times.</b> Processors weight delivery performance heavily. Honest windows protect the account as much as they protect the customer.',
      '<b>Respond to every dispute with documentation.</b> Tracking, delivery confirmation, terms acceptance, and the full correspondence thread. Unanswered disputes are automatic losses.',
      '<b>Never process for another business.</b> Aggregating someone else\'s sales through your account is grounds for immediate termination and is often the end of the business.'
    ]},
    {h:'Operational systems worth building early'},
    {ladder:[
      {t:'Automated fulfilment','d':'DSers, AutoDS or Zendrop. Manual order pushing stops being feasible somewhere around 20 orders a day and is a reliable source of address errors.'},
      {t:'Tracking page on your own domain','d':'Apps like 17TRACK or Parcel Panel. Keeps the customer on your site and hides supplier origin.'},
      {t:'A real helpdesk','d':'Gorgias or Tidio, with macros. Once you exceed roughly 30 tickets a week, an inbox stops working.'},
      {t:'Refund and dispute log','d':'A simple sheet: date, order, reason, cost, supplier. This is how you discover that 40% of your refunds come from one product.'},
      {t:'Supplier scorecard','d':'Track dispatch time, defect rate, and response time monthly. Data, not feelings, should decide when you switch supplier.'}
    ]},
    {callout:'warn',t:'Watch your dispute ratio like a hawk',x:'Stripe and PayPal typically flag accounts above 0.75–1% chargeback rate. Consequences escalate from a warning to a rolling reserve to termination. Track it weekly and treat any upward trend as an emergency, because recovering a terminated processor account is close to impossible.'}
  ]
},
{
  id:'m11', code:'DS-11', title:'Analytics & Conversion Optimisation', mins:12,
  lede:'Learn to read the funnel. Every problem lives at a specific stage, and each stage has different fixes.',
  blocks:[
    {h:'The metrics that matter'},
    {table:{head:['Metric','Definition','Healthy range'],rows:[
      ['Conversion rate','Orders ÷ sessions','1.8 – 3.5%'],
      ['AOV','Revenue ÷ orders','$45 – $130'],
      ['ROAS','Ad revenue ÷ ad spend','Above break-even; 2.5x+ is comfortable'],
      ['CPA','Ad spend ÷ orders','Under 40% of contribution margin'],
      ['Contribution margin','Retail − COGS − shipping − processing','Above 50% of retail'],
      ['Add-to-cart rate','ATC ÷ sessions','6 – 11%'],
      ['Checkout completion','Orders ÷ checkouts started','55 – 75%'],
      ['Repeat purchase rate','Repeat buyers ÷ total buyers','15 – 30% by month 6'],
      ['Customer LTV','Total revenue ÷ unique customers','1.6x+ first order value'],
      ['Refund rate','Refunds ÷ orders','Under 5%'],
      ['Chargeback rate','Disputes ÷ transactions','Under 0.5%']
    ]}},
    {h:'Funnel diagnosis'},
    {p:'When revenue is disappointing, do not guess. Walk the funnel in order and find the stage where the drop-off is abnormal. Each stage has its own fixes and they are not interchangeable.'},
    {ladder:[
      {t:'Impressions are low or CPM is very high','d':'Audience too narrow, budget too low, or account quality issues. Broaden targeting, raise budget, check account health.'},
      {t:'CTR under ~1%','d':'A creative problem. The hook is not stopping the scroll. New angles, not new audiences.'},
      {t:'Good CTR, add-to-cart under ~4%','d':'A product page problem. Price mismatch with the ad, weak images, missing information, slow load.'},
      {t:'Good ATC, checkout completion under ~50%','d':'A checkout problem. Surprise shipping cost, forced account creation, missing payment method, no trust signals.'},
      {t:'Sales fine, profit poor','d':'A pricing or CPA problem. Raise AOV with bundles and upsells, or lower CPA with better creative.'},
      {t:'Good first sales, no growth','d':'A retention problem. You have no email flows and no repeat purchases, so every dollar of revenue costs a dollar of ads.'}
    ]},
    {formula:'<em>Break-even ROAS</em>       = Retail ÷ (Retail − COGS − Shipping − Processing)\n<em>Break-even CPA</em>        = Contribution margin per order\n<em>Max profitable CPA</em>    = Contribution margin × (1 − target net margin)\n<em>Payback via LTV</em>       = CPA ÷ (Contribution margin × orders per customer)'},
    {h:'Conversion optimisation, ordered by return on effort'},
    {ol:[
      'Add or improve the product video. Single largest lever available.',
      'Collect 20+ reviews with customer photos before scaling ad spend.',
      'Cut mobile load time below 3 seconds. Compress images, remove unused apps.',
      'Rewrite the first screen of the product page to answer the top three objections.',
      'Add a free-shipping threshold slightly above current AOV.',
      'Add a post-purchase one-click upsell.',
      'Add exit-intent email capture with a modest incentive.',
      'Simplify checkout: guest checkout, fewer fields, express payment buttons.',
      'Add genuine scarcity only where it is true. Fake countdown timers damage trust and are increasingly regulated.'
    ]},
    {callout:'note',t:'On A/B testing',x:'Below roughly 200 conversions per variant, your test result is noise. At small scale, do not A/B test — instead make obvious improvements based on session recordings and customer questions. Reserve formal testing for when volume can actually support it.'},
    {callout:'tip',t:'Watch ten session recordings a week',x:'Microsoft Clarity is free. Ten recordings will teach you more about why people are not buying than a month of staring at aggregate dashboards. You will see the exact scroll position where they lose interest.'}
  ]
},
{
  id:'m12', code:'DS-12', title:'Scaling Without Breaking It', mins:11,
  lede:'Scaling amplifies whatever you already have. Amplify a broken system and you get a bigger broken system.',
  blocks:[
    {h:'Readiness gate — all of these, not most'},
    {ul:[
      'ROAS at least 1.25x your own break-even ROAS for 7+ consecutive days — about 2.5x on a typical post-duty product, but use your number, not a generic one.',
      'CPA below 40% of contribution margin.',
      'Site conversion rate above 2%.',
      'At least 20 genuine reviews on the hero product.',
      'Refund rate under 5% and chargeback rate under 0.5%.',
      'Supplier has confirmed capacity for 10x current daily volume.',
      'Cash buffer covering at least 30 days of ad spend and supplier costs.',
      'Support can absorb 5x ticket volume without exceeding 24-hour response.'
    ]},
    {callout:'warn',t:'Scaling a store with a 7% refund rate',x:'…simply produces a larger number of angry customers and a payment processor review. Fix the underlying defect, supplier or expectation problem before you add budget. Scale multiplies problems as efficiently as it multiplies profit.'},
    {h:'The scaling methods'},
    {table:{head:['Method','What you do','When to use','Risk'],rows:[
      ['Vertical','Raise budget on the winning campaign by 20–30% every 2–3 days','ROAS stable and healthy','Resets learning if too aggressive'],
      ['Horizontal','Duplicate the winner into new audiences, placements, countries','Vertical is hitting diminishing returns','Audience overlap, rising CPM'],
      ['Creative','Produce new angles in the proven format','Always. Creative fatigue is inevitable','Time and cost of production'],
      ['Geographic','Expand to comparable English-speaking markets, then localise','Home market saturating','Shipping cost, duties, support hours'],
      ['Catalogue','Add complementary products to the same audience','You have an email list and repeat buyers','Dilution of focus'],
      ['Channel','Add Google Shopping, Pinterest, or creator partnerships','One channel is profitable and maxed','New learning curve'],
      ['Retention','Build flows, loyalty, subscriptions','Always. Cheapest growth available','Slow to compound']
    ]}},
    {h:'Building the operation behind the growth'},
    {ladder:[
      {t:'Automate fulfilment before you need to','d':'The order volume that breaks manual processing arrives faster than you expect, usually during a viral spike.'},
      {t:'Hire support first','d':'A trained virtual assistant at $5–$9 an hour handling tickets buys back the hours you should be spending on creative and sourcing.'},
      {t:'Move to a sourcing agent','d':'At 10+ orders a day, an agent typically cuts 20–35% of unit cost and 7–10 days of delivery time. This is often a bigger profit lever than any ad optimisation.'},
      {t:'Introduce custom packaging','d':'Branded box, insert card, thank-you note. Converts a transaction into a brand and materially raises repeat rate.'},
      {t:'Separate your finances','d':'Business bank account, bookkeeping from month one, and set aside tax. Sellers who skip this discover the problem at year end.'},
      {t:'Document everything','d':'SOPs for fulfilment, support macros, creative briefs, supplier contacts. This is what makes the business sellable and what lets you delegate.'}
    ]},
    {callout:'tip',t:'The 20% rule',x:'Increase ad budget by no more than 20–30% every 48 hours. Larger jumps push the campaign back into the learning phase and typically destroy a week of stable performance. Patience compounds here.'}
  ]
},
{
  id:'m13', code:'DS-13', title:'Advanced: From Store to Brand', mins:12,
  lede:'Where operators separate from sellers. Dropshipping is the on-ramp, not the destination.',
  blocks:[
    {p:'A dropshipping store has no defensibility. Anyone can copy your product, your images, and your angle within a week. A brand has customers who come back, a name that carries meaning, and a product nobody else can list. The advanced game is converting the first into the second.'},
    {h:'The transition path'},
    {ladder:[
      {t:'Validate with dropshipping','d':'Prove demand with zero inventory risk. You are buying data, not building an asset yet.'},
      {t:'Move to an agent and add branding','d':'Custom packaging, insert cards, branded polymailers. Still no inventory commitment.'},
      {t:'Light private label','d':'Your logo on the existing product, minimum order around 300–1,000 units. Unit cost drops sharply and the listing becomes yours.'},
      {t:'Product modification','d':'Change a material, add an accessory, redesign the packaging based on the complaints in your support inbox. Now competitors cannot match you exactly.'},
      {t:'Own product development','d':'Design something that does not exist yet, informed by everything your customers have told you.'},
      {t:'Multi-channel brand','d':'Your own site, Amazon, retail, wholesale. Diversified revenue and a genuinely sellable asset.'}
    ]},
    {h:'Retention economics'},
    {p:'Acquiring a customer costs money. Selling to an existing customer costs an email. If your average customer buys 2.4 times instead of 1.0, you can afford to pay 2.4 times more to acquire them — which means you can outbid every competitor in your niche on every auction, permanently.'},
    {table:{head:['Lever','Mechanism','Typical impact'],rows:[
      ['Post-purchase upsell','One-click offer after checkout','+8–15% AOV'],
      ['Replenishment flow','Timed email for consumables','+10–20% repeat rate'],
      ['Loyalty programme','Points, tiers, early access','+5–15% repeat rate'],
      ['Subscription option','Recurring delivery at a small discount','Predictable revenue, higher LTV'],
      ['SMS list','Around 98% open rate','+5–12% of total revenue'],
      ['Community','Private group, content, expertise','Compounding, hard to copy']
    ]}},
    {h:'Advanced acquisition'},
    {ul:[
      '<b>Lookalike and value-based audiences:</b> upload your highest-LTV customers, not all customers. The algorithm optimises toward whatever you feed it.',
      '<b>Creator whitelisting:</b> run ads from a creator\'s own handle. Consistently outperforms brand-account ads for the same creative.',
      '<b>Advantage+ / Performance Max:</b> algorithmic campaigns that need volume and clean conversion data to work. Not a beginner tool.',
      '<b>Server-side tracking (Conversions API):</b> recovers signal lost to browser privacy changes. Materially improves attribution and optimisation.',
      '<b>Affiliate programme:</b> pay only on results. Excellent margin structure once you have proven conversion rates.',
      '<b>Landing pages over product pages:</b> for cold traffic, a purpose-built advertorial or listicle page frequently doubles conversion.'
    ]},
    {h:'A sensible tool stack'},
    {table:{head:['Function','Tool','When to add'],rows:[
      ['Storefront','Shopify','Day one'],
      ['Fulfilment','DSers / AutoDS / Zendrop','Day one'],
      ['Reviews','Judge.me / Loox','Before first ad'],
      ['Email & SMS','Klaviyo','Week two'],
      ['Analytics','GA4 + Microsoft Clarity','Week two'],
      ['Helpdesk','Gorgias / Tidio','At ~30 tickets/week'],
      ['Upsells','ReConvert / Zipify OCU','At consistent daily orders'],
      ['Tracking page','Parcel Panel / 17TRACK','At consistent daily orders'],
      ['Ad attribution','Triple Whale / Northbeam','Above ~$20k/month spend'],
      ['Research','Meta Ad Library, TikTok Creative Center','Day one, free']
    ]}},
    {callout:'tip',t:'The exit is real',x:'Profitable stores with clean books, documented systems and diversified traffic sell for roughly 2–4x annual net profit on marketplaces like Flippa, Empire Flippers and Acquire. Building the store as a sellable asset from month one changes which decisions you make — and it is why documentation and bookkeeping are not optional busywork.'}
  ]
},
{
  id:'m14', code:'DS-14', title:'Failure Modes & How to Avoid Them', mins:10,
  lede:'Nearly every store dies from one of these fifteen causes. All fifteen are decisions, not accidents.',
  blocks:[
    {h:'Strategic failures'},
    {cards:[
      {t:'01 — No niche','d':'A general store with no identity. Nobody trusts a site selling phone cases and dog beds. Fix: pick one audience and serve it completely.'},
      {t:'02 — Margin too thin','d':'Chose a product with a 2x multiplier and cannot afford ads. Fix: reprice, re-source, bundle, or abandon the product.'},
      {t:'03 — Single product dependency','d':'One winner, one ad account, one supplier. Any single failure zeroes revenue. Fix: three to five products, two ad accounts, backup supplier.'},
      {t:'04 — Copying a competitor exactly','d':'Same product, same images, same copy. You compete only on price and lose. Fix: differentiate on angle, service, or bundle.'}
    ]},
    {h:'Execution failures'},
    {cards:[
      {t:'05 — Never ordered a sample','d':'You discover the quality problem via refund requests. Fix: sample everything, always, before listing.'},
      {t:'06 — Killing ads on day one','d':'The algorithm has not finished learning. Fix: 3–5 days and $50–100 minimum before judging.'},
      {t:'07 — Endless tinkering, no launch','d':'Six weeks on a logo. Fix: set a hard launch date and ship at 80% ready.'},
      {t:'08 — Scaling too fast','d':'Tripled budget overnight, reset learning, destroyed a profitable campaign. Fix: 20–30% every 48 hours.'},
      {t:'09 — Ignoring mobile','d':'Built on desktop, never tested on a phone, where 75% of traffic is. Fix: test the full purchase flow on a real device.'}
    ]},
    {h:'Operational failures'},
    {cards:[
      {t:'10 — Slow support','d':'Unanswered emails become chargebacks, which become a frozen processor. Fix: 24-hour response, always.'},
      {t:'11 — Over-promising delivery','d':'"3–5 days" on a 20-day supplier. Fix: state honest windows on the product page.'},
      {t:'12 — No email capture','d':'Every sale costs full ad price forever. Fix: capture on day one, build three flows in week two.'},
      {t:'13 — No bookkeeping','d':'You do not know if you are profitable and you owe unexpected tax. Fix: separate account, monthly reconciliation.'}
    ]},
    {h:'Fatal-risk failures'},
    {cards:[
      {t:'14 — Trademark infringement','d':'Selling branded or lookalike goods. Result is account seizure and legal exposure. Fix: never touch it.'},
      {t:'15 — Ignoring the dispute ratio','d':'Chargebacks above 1% end payment processing. Fix: monitor weekly, refund early, ship faster.'}
    ]},
    {callout:'warn',t:'The meta-failure',x:'Underneath most of these is a single pattern: treating dropshipping as a shortcut rather than a business. The people who succeed read their data honestly, answer their emails, order samples, and keep going through the unprofitable months. That is genuinely the whole differentiator.'}
  ]
},
{
  id:'m15', code:'DS-15', title:'The 90-Day Execution Plan', mins:9,
  lede:'A week-by-week sequence. Do these in order and do not skip ahead.',
  blocks:[
    {p:'This plan assumes 10–15 hours a week and a budget of roughly $500–$1,500. Adjust the pace, not the order — each phase depends on the one before it.'},
    {h:'Phase 1 — Foundation (Days 1–30)'},
    {ladder:[
      {t:'Week 1 — Decide','d':'Complete every module. Shortlist three niches and score each against the seven filters. Choose one and write a single sentence describing your customer. Register the domain.'},
      {t:'Week 2 — Build','d':'Set up Shopify, install a fast theme, create logo and brand basics. Write all policy pages. Build About and Contact. Configure payments and test a $1 order end to end.'},
      {t:'Week 3 — Source','d':'Identify 8–10 candidate products. Contact 5 suppliers, leading with the DDP and landed-cost question. Identify the HTS code and duty rate for your top candidates. Order samples of your top three products to your own address.'},
      {t:'Week 4 — List','d':'Samples arrive. Photograph and film them yourself. Write original product pages with benefit-led copy. Price from landed cost including duty, not from the supplier invoice. Publish 4–6 products. Install review and email apps. If selling into the EU or UK, sort IOSS, UK VAT and your responsible person before you list.'}
    ]},
    {h:'Phase 2 — Launch and test (Days 31–60)'},
    {ladder:[
      {t:'Week 5 — Organic first','d':'Open TikTok and Instagram accounts. Post daily using your own footage. This is free validation and free creative practice. Set up email capture and the welcome flow.'},
      {t:'Week 6 — First paid test','d':'Produce 3–5 distinct creative angles. Launch one campaign, 2–3 ad sets, $10–20 each per day. Do not touch it for 72 hours.'},
      {t:'Week 7 — Read and cut','d':'Diagnose by funnel stage. Kill losers. Reallocate to the best angle and produce three new creatives in that direction. Fix whichever page stage is leaking.'},
      {t:'Week 8 — Flows and proof','d':'Build abandoned cart, browse abandonment and post-purchase flows. Chase reviews from early buyers. Aim for 10+ reviews with photos.'}
    ]},
    {h:'Phase 3 — Optimise and scale (Days 61–90)'},
    {ladder:[
      {t:'Week 9 — Identify the winner','d':'One product should be outperforming. Concentrate budget there. Watch ten session recordings and fix the three biggest friction points.'},
      {t:'Week 10 — Raise order value','d':'Add a post-purchase upsell, a bundle offer, and a free-shipping threshold above current AOV. This is usually a faster profit gain than lowering CPA.'},
      {t:'Week 11 — Scale carefully','d':'If ROAS is stable above 2.5x, increase budget 20–30% every 48 hours. Duplicate the winner into one new audience. Contact a sourcing agent about your hero product.'},
      {t:'Week 12 — Assess honestly','d':'Reconcile the real numbers: revenue, COGS, ads, refunds, tools, net. Decide with evidence: double down, pivot the product, or pivot the niche. Write the next 90-day plan.'}
    ]},
    {callout:'tip',t:'One store, one niche, one channel',x:'Until you are consistently profitable, resist every temptation to open a second store or add a second traffic channel. Focus is the scarcest resource you have and splitting it is the most common way capable people fail at this.'},
    {callout:'note',t:'What month four looks like',x:'If you complete this plan honestly, by day 90 you will have either a working store or a precise, evidence-based understanding of why it did not work. Both are valuable. The only wasted outcome is not finishing the loop.'}
  ]
}

 {type:'mcq',title:'Research technique',intro:'Five questions on finding products properly.',items:[
  {q:'In Meta Ad Library, what is the single most valuable signal?',o:['Number of ad variations','How long an ad has been running continuously','The advertiser\'s follower count','Number of comments'],a:1,e:'An ad running 30+ days is being funded by profit. Ads that appear and vanish within a week were losers. This one filter outperforms most paid research tools.'},
  {q:'AliExpress order count proves what, exactly?',o:['Western consumer demand','That supply and some level of buyer interest exists','That the product has good margins','That the niche is untapped'],a:1,e:'It confirms the product moves on that platform. It says nothing about whether your target market wants it or what it can be priced at.'},
  {q:'Why is Amazon "New Releases" often more useful than "Best Sellers"?',o:['It updates more frequently','It shows momentum rather than entrenched incumbency','It has fewer products','It includes supplier data'],a:1,e:'Best Sellers shows what already won, usually to competitors with scale. New Releases shows what is gaining, which is where opportunity actually is.'},
  {q:'Why should you never copy the supplier\'s product description?',o:['It breaches AliExpress terms','It is duplicate content, poorly translated, and written for wholesalers not consumers','It is too short','Search engines block it'],a:1,e:'All three problems at once. Original benefit-led copy is one of the cheapest differentiators available to you.'},
  {q:'What is the strongest argument against a single-product store?',o:['It is harder to design','One ad restriction or one saturation event zeroes revenue the same day','Suppliers charge more','It cannot rank in search'],a:1,e:'Single-product stores make great case studies and fragile businesses. A hero plus three to five supporting products in the same niche is far more durable.'}
 ]}
],

m8:[
 {type:'calc',calc:'margin',title:'Pricing & margin calculator',intro:'Work out whether a price can actually fund your advertising.'},
 {type:'mcq',title:'Pricing decisions',intro:'Six questions on setting price correctly.',items:[
  {q:'What is the most common fatal pricing error?',o:['Pricing above competitors','Pricing off product cost instead of off customer acquisition cost','Using charm pricing','Offering free shipping'],a:1,e:'If acquisition costs $22, a $29 product cannot work regardless of how cheap the supplier is. Price must be derived from CPA, not from a multiplier on cost.'},
  {q:'Landed cost $12, target CPA $18, processing $1.50, target net margin 20%. Minimum viable price?',o:['$31.50','$36.00','$39.38','$48.00'],a:2,e:'(12 + 18 + 1.50) ÷ 0.80 = $39.38, so price at $39.99. This formula prevents most beginner pricing failures.'},
  {q:'Why do recommended multipliers fall as product cost rises?',o:['Buyers are more price-sensitive on expensive items','Absolute margin, not percentage, funds advertising','Suppliers cap markups','Shipping costs scale linearly'],a:1,e:'2.5x on a $60 item gives $90 gross margin — far more ad room than 5x on a $4 item giving $16. Percentage is the wrong unit for ad budgeting.'},
  {q:'Which is generally the better offer structure?',o:['33% off everything','Buy 2, get 1 free','A permanent 20% discount','Free gift with any purchase'],a:1,e:'Bundles preserve perceived value while producing similar margin, and they raise AOV. Permanent discounts simply reset the reference price and train buyers to wait.'},
  {q:'Your AOV is $48. Where should you set a free-shipping threshold?',o:['$30','$45','$60','$120'],a:2,e:'Slightly above current AOV. Set it too low and you give away margin; too high and nobody reaches it. Around $60 nudges a meaningful share of orders upward.'},
  {q:'Contribution margin after all direct costs is 38% of retail. What should you do?',o:['Launch and optimise ads carefully','Raise price, re-source, or bundle — 38% is likely too thin to advertise','Reduce the ad budget','Increase the refund reserve'],a:1,e:'Below roughly 50% contribution margin there is not enough room for paid acquisition. Fix the economics before spending, because no amount of ad skill rescues a bad unit.'}
 ]}
],

 {type:'mcq',title:'Traffic and creative',intro:'Six questions on acquisition.',items:[
  {q:'Your ad has a 0.5% CTR. Where is the problem?',o:['The product page','The checkout','The creative — the hook is not stopping the scroll','The pricing'],a:2,e:'CTR is a creative metric. Nobody has reached your site yet, so the page cannot be at fault. New angles, not new audiences.'},
  {q:'Strong CTR but add-to-cart is 2%. Where is the problem?',o:['The creative','The product page — price mismatch, weak images, or slow load','The audience','The ad budget'],a:1,e:'People clicked, so the promise worked. They arrived and left, so the page failed to deliver on it. The usual culprits are a price surprise or missing information.'},
  {q:'Why should you not touch a new campaign for 72 hours?',o:['Meta charges an editing fee','The learning phase needs roughly 50 conversion events to stabilise','Ads only serve after three days','Budgets update on a 3-day cycle'],a:1,e:'Editing resets learning. Killing an ad on day one is the most common and most expensive beginner mistake in paid social.'},
  {q:'What is the key difference between Meta and Google Search traffic?',o:['Cost per click','Interruption versus existing intent','Available creative formats','Audience age'],a:1,e:'Meta interrupts someone not shopping, so creative carries the whole result. Google captures existing intent, so you compete more on price, trust and offer.'},
  {q:'Roughly what share of paid social performance is attributable to creative?',o:['About 20%','About 50%','About 80%','It is entirely targeting'],a:2,e:'Targeting has been largely automated. Two advertisers with identical settings and different creative routinely see multiples of difference in result.'},
  {q:'Which owned channel typically drives the largest share of email revenue?',o:['Welcome series','Abandoned cart flow','Win-back flow','Post-purchase flow'],a:1,e:'Abandoned cart usually accounts for 20–30% of email revenue because it reaches people with the highest possible intent at the lowest possible cost.'}
 ]},
 {type:'mcq',title:'Social commerce & AI creative',intro:'Six questions on the two channels that changed most recently.',items:[
  {q:'Why can classic dropshipping not run on US TikTok Shop in 2026?',o:['Referral fees are too high','Sellers can no longer ship with their own carrier labels — fulfilment must go through TikTok\'s options','TikTok bans imported goods','Payouts are too slow'],a:1,e:'You must use Fulfilled by TikTok, Upgraded TikTok Shipping or Collections. A supplier shipping direct from overseas does not satisfy that, so the channel requires stock inside the network.'},
  {q:'TikTok Shop\'s US referral fee is around 6%. What is the realistic all-in cost of selling there?',o:['About 8%','About 15%','About 30% of selling price','About 50%'],a:2,e:'Stack affiliate commission (US average around 13%), fulfilment, ads and returns on top of the referral fee and the channel take reaches roughly 30% — about five times the headline rate.'},
  {q:'What is the typical US average affiliate commission rate on TikTok Shop?',o:['Around 3%','Around 13%','Around 30%','Around 50%'],a:1,e:'Sellers can set anywhere from 1% to 80%. Open collaborations usually land at 10–15% and targeted deals at 15–25% or higher for proven creators.'},
  {q:'Which AI creative approach performs best according to current testing?',o:['Fully synthetic talking-head avatars','Real creator footage augmented with AI voiceover, b-roll and editing','AI-generated static images only','Avoiding AI entirely'],a:1,e:'Hybrid performs at or near parity with full human production, while fully synthetic talking heads have been measured underperforming real UGC by 30–50% on view-through.'},
  {q:'Which use of an AI avatar crosses into deceptive advertising?',o:['Presenting it as a brand spokesperson','Captioning it as a verified customer from a named city','Using it to demonstrate a product','Using it with an AI disclosure label'],a:1,e:'FTC guidance treats AI exactly like human creators — fabricated first-person testimonials are prohibited either way. A spokesperson is fine; a fake buyer is not.'},
  {q:'You advertise into EU markets using AI-generated video. What is required from August 2026?',o:['Nothing additional','Disclosure that the content is AI-generated','Pre-approval from the platform','A separate ad account'],a:1,e:'The EU AI Act requires disclosure when content is AI-generated. Meta also auto-labels its own generative output and applies a prominent label when a photorealistic human is generated.'}
 ]}
],

m10:[
 {type:'mcq',title:'Support scenarios',intro:'Six real situations. Choose the response that best protects both the customer and the business.',items:[
  {q:'Day 22 of a stated 10–15 day window. Customer is angry and threatening a chargeback. Best response?',o:['Ask them to wait another 10 days','Offer an immediate choice: reship now or full refund now','Explain that customs delays are outside your control','Offer a 10% discount on a future order'],a:1,e:'Past your stated window, you are in the wrong. Giving them control removes the reason to file a dispute — and a refund is always cheaper than a chargeback.'},
  {q:'Customer received the wrong colour. Item cost you $9. Best response?',o:['Request a return, then ship the correct item','Ship the correct item free and let them keep the wrong one','Offer a partial refund','Ask for photo proof before deciding'],a:1,e:'Return shipping typically exceeds a $9 product cost. Immediate replacement without friction costs less and often produces a positive review.'},
  {q:'Why refund quickly rather than negotiate?',o:['Customers rarely ask twice','A chargeback costs the refund plus a fee plus a mark against your processor','Refunds are tax deductible','It improves search ranking'],a:1,e:'Disputes above roughly 0.75–1% put your ability to accept payment at risk. That risk vastly outweighs the value of winning an argument over $30.'},
  {q:'Best way to reduce "where is my order" tickets?',o:['Hide the tracking page','Send proactive updates at dispatch, customs and out-for-delivery','Extend the stated shipping window to 60 days','Disable order confirmation emails'],a:1,e:'Silence causes disputes. Proactive communication removes the single largest category of support volume and the main trigger for chargebacks.'},
  {q:'A customer leaves a public one-star review. Best response?',o:['Ignore it','Request removal from the platform','Reply publicly and calmly with a specific remedy','Reply privately only'],a:2,e:'Future buyers read your response more than the complaint. A calm, specific public remedy converts a liability into evidence that you handle problems well.'},
  {q:'What should you set on the product page to prevent most delivery disputes?',o:['A countdown timer','An honest delivery window','A no-refund policy','A minimum order value'],a:1,e:'Expectation set before purchase is the cheapest possible dispute prevention. Over-promising delivery is one of the most reliable ways to destroy a store.'}
 ]},
 {type:'checklist',title:'Operations readiness',intro:'The systems that keep support from becoming a crisis as volume grows.',items:[
  'Branded support email address in use, not a personal account',
  'Response time under 24 hours, measured not assumed',
  'Honest delivery window stated on every product page',
  'Automated dispatch and delivery notification emails live',
  'Macro library covering the eight most common questions',
  'Automated fulfilment app connected (DSers, AutoDS or Zendrop)',
  'Branded tracking page on your own domain',
  'Helpdesk in place if you exceed ~30 tickets per week',
  'Refund and dispute log maintained with reason codes',
  'Supplier scorecard tracking dispatch time and defect rate',
  'Chargeback rate checked weekly and kept under 0.5%'
 ]}
],

m11:[
 {type:'order',title:'Diagnose in order',intro:'A funnel must be read from the top down. Put these diagnostic checks in the correct sequence.',items:[
  'Impressions and CPM — is the campaign delivering at all?',
  'CTR — is the creative stopping the scroll?',
  'Add-to-cart rate — is the product page delivering on the ad?',
  'Checkout completion — is anything breaking at payment?',
  'Contribution margin versus CPA — is the sale actually profitable?',
  'Repeat purchase rate — is any revenue coming back for free?'
 ]},
 {type:'mcq',title:'Reading the numbers',intro:'Six diagnostic questions.',items:[
  {q:'Conversion rate 3.1%, ROAS 3.4x, net margin 4%. What is wrong?',o:['Traffic quality','Costs elsewhere — tools, refunds, or overhead are eating the margin','The creative','Nothing, this is healthy'],a:1,e:'Strong front-end metrics with weak net means the leak is below the ad line: app subscriptions, refunds, or an understated cost of goods. Audit the P&L, not the ad account.'},
  {q:'Which metric best predicts whether you can outbid competitors long term?',o:['Conversion rate','Customer LTV','CTR','AOV'],a:1,e:'If your customer buys 2.4 times, you can pay up to 2.4 times more for the first order. LTV is the only metric that lets you win auctions permanently.'},
  {q:'When is A/B testing appropriate?',o:['From day one','Once you can get roughly 200+ conversions per variant','Only above $1m revenue','Never in ecommerce'],a:1,e:'Below that, results are noise and you will confidently act on randomness. At small scale, use session recordings and customer questions instead.'},
  {q:'Add-to-cart is healthy at 9% but checkout completion is 38%. Most likely cause?',o:['Weak creative','Surprise shipping cost or forced account creation at checkout','Wrong audience','Product photos'],a:1,e:'They wanted the product. Something at checkout broke the deal — usually an unexpected cost, a missing payment method, or a required account.'},
  {q:'What is break-even ROAS for retail $50, COGS $14, shipping $4, processing $1.75?',o:['1.20x','1.64x','2.50x','3.57x'],a:1,e:'Contribution margin = 50 − 14 − 4 − 1.75 = $30.25. Break-even ROAS = 50 ÷ 30.25 = 1.65x, so roughly 1.64–1.65x.'},
  {q:'What is the cheapest high-value analytics habit for a small store?',o:['Buying an attribution platform','Watching ten session recordings a week','Running daily A/B tests','Building custom dashboards'],a:1,e:'Microsoft Clarity is free and ten recordings will reveal the exact scroll position where interest dies — something no aggregate dashboard can tell you.'}
 ]}
],

m12:[
 {type:'calc',calc:'scale',title:'Scale readiness check',intro:'All gates must pass. Scaling amplifies whatever you already have, including the problems.'},
 {type:'mcq',title:'Scaling judgement',intro:'Five questions.',items:[
  {q:'Safe rate of budget increase on a stable winning campaign?',o:['Double it daily','20–30% every 48 hours','10% weekly','Increase only after 30 days'],a:1,e:'Larger jumps push the campaign back into learning and typically destroy a week of stable performance. Patience compounds here.'},
  {q:'A store with a 7% refund rate wants to triple ad spend. What should happen?',o:['Scale — refunds are a cost of doing business','Fix the underlying defect or expectation problem first','Scale but raise prices to cover refunds','Switch payment processor'],a:1,e:'Scaling a broken system produces more angry customers and a processor review. The refund rate is telling you something specific — find out what.'},
  {q:'Which change is often a bigger profit lever than any ad optimisation?',o:['Changing theme','Moving to a sourcing agent at 10+ orders/day','Adding more products','Redesigning the logo'],a:1,e:'An agent typically cuts 20–35% of unit cost and 7–10 days of delivery simultaneously. That flows straight to contribution margin and reduces refunds.'},
  {q:'What should you hire first?',o:['A media buyer','Customer support','A designer','A bookkeeper'],a:1,e:'Support is the highest-volume, most delegable, most trainable task. Offloading it buys back the hours you should spend on creative and sourcing — the things only you can do well early on.'},
  {q:'What makes a store actually sellable?',o:['High revenue','Clean books, documented systems, diversified traffic','A memorable brand name','Exclusive supplier contracts'],a:1,e:'Buyers pay roughly 2–4x annual net profit for de-risked assets. Documentation and bookkeeping are what convert a job into a business.'}
 ]}
],

  {q:'Why upload only your highest-LTV customers for a lookalike audience?',o:['It processes faster','The algorithm optimises toward whatever you feed it','Meta requires a small list','It reduces cost per click'],a:1,e:'Feed it all customers and you get more average customers. Feed it your best and you get more of those. The quality of the seed set determines the quality of the output.'},
  {q:'What is creator whitelisting?',o:['Approving creators for an affiliate programme','Running ads from the creator\'s own handle rather than your brand account','Giving creators free products','Blocking competitor creators'],a:1,e:'It consistently outperforms brand-account ads for the same creative, because the content arrives with the creator\'s social proof attached.'},
  {q:'Why does a purpose-built landing page often beat a product page for cold traffic?',o:['It loads faster','It can do the persuasion work a product page assumes has already happened','It ranks better in search','It has fewer images'],a:1,e:'A product page assumes intent. Cold traffic has none, so an advertorial or listicle format that builds the problem before the solution frequently doubles conversion.'},
  {q:'What does a subscription option primarily buy you?',o:['Higher first-order margin','Predictable revenue and materially higher LTV','Lower supplier costs','Better ad performance'],a:1,e:'Predictability changes what you can afford to pay for acquisition and makes the business far more valuable to a buyer.'},
  {q:'What multiple do profitable, well-documented stores typically sell for?',o:['0.5x annual revenue','2–4x annual net profit','10x annual net profit','They cannot be sold'],a:1,e:'Clean books, documented systems and diversified traffic are what move a store toward the top of that range — which is why they are worth building from month one.'}
 ]}
],

COURSE.splice(5, 0, {
  id:'m16', code:'DS-06', title:'Duties, Tariffs & Cross-Border Compliance', mins:14,
  lede:'The end of duty-free parcels rewrote dropshipping economics. If you skip this module, every other number in this course is wrong.',
  blocks:[
    {callout:'note',t:'Last reviewed October 2026',x:'Trade rules in this module changed three times between 2025 and 2026 across the US, EU and UK. Verify current rates with official customs sources before relying on any figure here.'},
    {callout:'warn',t:'Read this before you price anything',x:'Until 2025, parcels under $800 entered the United States duty-free under Section 321. That exemption is gone — for China and Hong Kong from May 2025, and for every other country from late August 2025. It was extended again by executive order in February 2026 and put on an indefinite footing in a rule effective June 2026. A legal challenge was rejected by the Court of International Trade in August 2026. Treat it as permanent.'},
    {p:'This is not a footnote. An entire generation of dropshipping was built on the assumption that a $12 parcel from Shenzhen arrived with no duty, no formal customs entry and no paperwork. Every course written before 2025 — including the economics most people still quote — assumed that. It is no longer true, and the sellers who have not repriced are quietly losing money on every order.'},
    {h:'What actually changed'},
    {table:{head:['Before','Now'],rows:[
      ['Parcels under $800 entered duty-free','Every parcel requires a formal customs entry regardless of value'],
      ['No HTS classification needed','A 10-digit HTS code is required per item'],
      ['No broker, no bond, no fees','Duty, plus applicable tariffs, plus brokerage and processing costs'],
      ['Clearance in hours','Slower clearance, more holds, more exceptions'],
      ['Landed cost = product + freight','Landed cost = product + freight + duty + tariff + brokerage']
    ]}},
    {p:'The scale of the disruption is measurable. Sub-$800 parcel volume into the United States fell by roughly half after the suspension took effect, and at one point dozens of national postal operators stopped accepting US-bound parcels entirely because they could not implement duty collection fast enough. Japan Post suspended US merchandise shipments for eight months before resuming with a prepayment system in 2026.'},
    {h:'What this does to your numbers'},
    {p:'Duty is charged on the declared customs value, not your retail price, and the rate depends on the product\'s HTS classification and country of origin. Goods from China may also carry additional tariff layers on top of the base rate. The practical effect is that your landed cost is no longer what the supplier quotes you.'},
    {formula:'<em>Old landed cost</em>  = Product + Freight\n<em>New landed cost</em>  = Product + Freight + Duty + Tariff + Brokerage/processing\n\n<em>Duty</em>              = Declared customs value × HTS rate\n<em>Contribution margin</em> = Retail − Landed cost − Processing'},
    {table:{head:['Line','Pre-2025','Now (illustrative)'],rows:[
      ['Retail price','$49.99','$49.99'],
      ['Product cost','$12.00','$12.00'],
      ['Freight','$4.50','$4.50'],
      ['Duty + tariff','$0.00','$4.20 – $9.00+'],
      ['Brokerage / processing','$0.00','$1.00 – $3.00'],
      ['Payment processing','$1.75','$1.75'],
      ['<b>Contribution margin</b>','<b>$31.74</b>','<b>$18.54 – $26.54</b>'],
      ['<b>Break-even ROAS</b>','<b>1.58x</b>','<b>1.88x – 2.70x</b>']

    {callout:'warn',t:'The consequence in one line',x:'Break-even ROAS rose sharply overnight. Campaigns that were profitable at 1.8x are now losses. If you are running numbers from a pre-2025 course, you are advertising at a loss and your dashboard will not tell you.'},

COURSE.splice(10, 0, {
  id:'m17', code:'DS-11', title:'Agentic Commerce & AI Discovery', mins:12,
  lede:'A growing share of buyers now ask an AI instead of searching. The question is whether it recommends you.',
  blocks:[
    {p:'For twenty years, ecommerce discovery meant search engines and social feeds. A third route has opened: the buyer describes what they want to an AI assistant, and the assistant does the comparing. Sometimes it also does the buying.'},
    {p:'This matters to a small store for an uncomfortable reason. In search you compete for a ranking; in a feed you compete for attention. In an AI recommendation you compete to be one of maybe three options named in a sentence. There is no page two.'},
    {h:'What is actually live'},
    {p:'The infrastructure arrived quickly and is still moving. OpenAI and Stripe published the Agentic Commerce Protocol at the end of September 2025 and switched on checkout inside ChatGPT, with Etsy first and Shopify merchants following. Google announced the Universal Commerce Protocol at NRF in January 2026 alongside Shopify, Etsy, Wayfair and Target, covering discovery through post-purchase. All three major card networks now support agent-initiated payments, and Shopify launched agentic storefronts in January 2026 to get merchant catalogues in front of ChatGPT, Perplexity and Copilot.'},
    {callout:'warn',t:'This area is genuinely unsettled',x:'Reporting conflicts on where in-chat checkout stands. OpenAI expanded buying inside ChatGPT in February 2026, and several sources report it then pulled in-chat checkout in March 2026, keeping discovery and comparison but sending the purchase back to the merchant site. eBay separately barred third-party buy-for-me agents. Do not build a strategy around one product. Build for the part that is stable: being discoverable and having clean product data.'},
    {h:'How big, honestly'},
    {table:{head:['Signal','Figure','Read it as'],rows:[
      ['Adobe on generative-AI traffic to US retail','Up roughly 4,700% year on year to mid-2025','Explosive growth from a tiny base'],
      ['eMarketer on AI platform retail spend','Around $20.9bn in 2026','Real, but small beside total ecommerce'],
      ['Morgan Stanley on adoption by 2030','Near half of online shoppers, roughly a quarter of spend','The reason to prepare now'],
      ['McKinsey on influenced commerce by 2030','$3–5 trillion globally','Directional, not a forecast to bank on']
    ]}},
    {p:'The sensible reading is that this is small today and directionally certain. You should not reorganise your business around it, and you should not be invisible to it either. The preparation is cheap and most of it improves your normal store anyway.'},
    {h:'How to be the store the agent picks'},
    {ladder:[
      {t:'Fix your product data first','d':'Agents read structured attributes, not marketing copy. Complete and accurate specifications, real dimensions and materials, current price, and real-time stock. Vague listings are invisible because the agent cannot verify they match the request.'},
      {t:'Write descriptions that answer constraints','d':'Buyers ask for things like waterproof, under $150, arriving Friday. If your listing never states waterproofing, sizing or a delivery window in plain machine-readable terms, you cannot be matched against those constraints.'},
      {t:'Test your actual visibility','d':'Ask ChatGPT, Perplexity and Google AI Mode to recommend products in your category, exactly as a customer would phrase it. See whether you appear. Most sellers have never checked and assume they do.'},
      {t:'Check your platform supports the protocols','d':'Shopify and the larger platforms are building this in. If you are on something smaller, confirm it has API coverage for catalogue, cart, checkout and orders.'},
      {t:'Publish real specifications and reviews','d':'Agents weight verifiable detail. Structured data, genuine review content and clear policy pages all feed the comparison.'},
      {t:'Do not block the agents you want','d':'Aggressive bot rules can exclude legitimate shopping agents. Visa, Mastercard and Cloudflare have all added ways to distinguish a trusted agent from a scraper — make sure your setup does not treat them identically.'}
    ]},
    {callout:'tip',t:'The dropshipping-specific angle',x:'Agentic comparison rewards exactly what generic dropshipping lacks: accurate specifications, real stock data, honest delivery windows and verifiable reviews. A store listing a supplier photo with a translated description and a vague shipping estimate cannot compete in a comparison it is not even legible to. This is another reason the model rewards branding and domestic fulfilment.'},
    {h:'What it costs and who owns the customer'},
    {ul:[
      '<b>Fees exist.</b> OpenAI has been reported charging merchants a transaction fee in the region of 4% on completed in-chat purchases. Model any agentic channel like a marketplace, not like free traffic.',
      '<b>You usually remain merchant of record.</b> The current protocols are designed so the merchant keeps the transaction, the customer data and the relationship. Verify this for any channel you join rather than assuming.',
      '<b>Attribution will be messy.</b> Agent-driven traffic frequently arrives without conventional referral data, so some of what looks like direct traffic is not.',
      '<b>It does not replace your email list.</b> If anything it raises the value of owned channels, because a channel you do not control can change its rules in a single announcement — as this one already has.'
    ]},
    {callout:'note',t:'A proportionate response',x:'Spend an afternoon, not a quarter. Clean your product data, test whether an assistant can find you, confirm your platform is not a dead end, and revisit in six months. That is the correct amount of effort for a channel that is real, growing and not yet material for most small stores.'}
  ]
});

{q:'Parcel is 7 days past your stated window. Best response?',o:['Ask them to wait','Offer immediate choice: reship or refund','Explain customs delays','Offer a future discount'],a:1,e:'Past your stated window you are in the wrong. Giving control removes the reason to dispute.',m:'DS-12'},
{q:'Wrong colour shipped; item cost you $9. Best response?',o:['Request return first','Ship correct item free, let them keep the wrong one','Partial refund','Demand photo proof'],a:1,e:'Return shipping exceeds a $9 product cost.',m:'DS-12'},

{q:'CVR 3.1%, ROAS 3.4x, net margin 4%. Diagnosis?',o:['Traffic quality','Costs below the ad line — tools, refunds, understated COGS','Creative','Nothing is wrong'],a:1,e:'Strong front-end with weak net means the leak is in the P&L, not the ad account.',m:'DS-13'},
{q:'When is A/B testing appropriate?',o:['Day one','At roughly 200+ conversions per variant','Above $1m revenue','Never'],a:1,e:'Below that you will confidently act on noise.',m:'DS-13'},
{q:'Safe budget increase on a stable winner?',o:['Double daily','20–30% every 48 hours','10% weekly','Only after 30 days'],a:1,e:'Larger jumps reset learning and typically destroy a week of performance.',m:'DS-14'},
{q:'Store has a 7% refund rate and wants to triple spend. Correct move?',o:['Scale anyway','Fix the underlying cause first','Scale and raise prices','Change processor'],a:1,e:'Scaling multiplies problems as efficiently as profit.',m:'DS-14'},
{q:'What should you hire first?',o:['Media buyer','Customer support','Designer','Bookkeeper'],a:1,e:'Highest-volume, most delegable task; it buys back the hours only you can spend well.',m:'DS-14'},
{q:'Why seed a lookalike audience with only your best customers?',o:['Faster processing','The algorithm optimises toward whatever you feed it','Platform requirement','Lower CPC'],a:1,e:'Feed it average customers and you get more average customers.',m:'DS-15'},
{q:'Typical sale multiple for a clean, documented, profitable store?',o:['0.5x revenue','2–4x annual net profit','10x net profit','Not sellable'],a:1,e:'Documentation and bookkeeping are what move a store toward the top of that range.',m:'DS-15'},
{q:'Which is a fatal-category risk rather than a slow leak?',o:['Only four product images','Chargeback rate at 1.4%','No bookkeeping','4-second mobile load'],a:1,e:'Above roughly 1%, loss of payment processing is a realistic and near-unrecoverable outcome.',m:'DS-16'},

{q:'What happened to the US $800 de minimis exemption?',o:['Raised to $2,000','Suspended for China in 2025, then for all countries, and now indefinite','Applies only to postal shipments','Never applied to dropshippers'],a:1,e:'Suspended for China and Hong Kong from May 2025 and all countries from late August 2025, extended in February 2026 and placed on an indefinite footing. A court challenge was rejected in August 2026.',m:'DS-06'},
{q:'Retail $49.99, product $12, freight $4.50, duty $6, brokerage $2, processing $1.75. Contribution margin?',o:['$31.74','$27.24','$23.74','$18.00'],a:2,e:'49.99 − 12 − 4.50 − 6 − 2 − 1.75 = $23.74. The same product returned $31.74 before duty applied.',m:'DS-06'},
{q:'Why is DDP now effectively mandatory for consumer retail?',o:['It is cheaper','Under DDU the carrier bills your customer for duty they never agreed to','Customs mandates it','It is faster'],a:1,e:'Surprise bills at the door produce refused parcels, chargebacks and reviews that blame you rather than the carrier.',m:'DS-06'},
{q:'Under the EU GPSR, why does the responsible person obligation land on the dropshipper?',o:['Dropshippers count as manufacturers','Direct-to-consumer shipping from outside the EU leaves no importer in the chain','Marketplaces require it contractually','The supplier is exempt'],a:1,e:'Every consumer product needs an EU-established economic operator. Shipping direct from outside the EU leaves that role vacant, and there is no low-value exemption.',m:'DS-06'},
{q:'Which strategy best protects margin after the duty change?',o:['Cutting ad spend','Bulk import plus domestic fulfilment','A cheaper Chinese supplier','Longer delivery windows'],a:1,e:'Paying duty once on a consolidated shipment at better rates, then fulfilling locally, now beats direct-from-China on total cost for most products.',m:'DS-06'},
{q:'What is now the most important opening question to a supplier?',o:['Unit price','Whether they ship DDP and the all-in landed cost','Dispatch speed','Custom packaging options'],a:1,e:'Unit price without duty is a meaningless number, and a supplier who cannot state landed cost will surprise your customers at the door.',m:'DS-06'},
{q:'A parcel to Germany worth €60 contains a phone case and a charging cable under different tariff codes. What EU duty applies from July 2026?',o:['None — it is under €150','€3 for the parcel','€6 — €3 per item by tariff line','Full standard tariff rates'],a:2,e:'The interim EU measure charges a flat €3 per item by customs code, not per parcel. Items under the same code in one parcel share a single charge.',m:'DS-06'},
{q:'You are selling into the UK in consignments under £135. What is required?',o:['Nothing, the buyer pays at the border','UK VAT registration, charging VAT at the point of sale','An EU responsible person','A customs bond'],a:1,e:'For consignments up to £135 the seller registers for UK VAT and charges it at checkout rather than leaving it to be collected at the border.',m:'DS-06'},

{q:'TikTok Shop charges roughly 6% referral in the US. What is the realistic total channel cost?',o:['~8%','~15%','~30% of selling price','~50%'],a:2,e:'Affiliate commissions, fulfilment, ads and returns stack on top, bringing the real take to around five times the headline rate.',m:'DS-10'},
{q:'Which AI creative approach currently performs best?',o:['Fully synthetic talking heads','Real footage augmented with AI voiceover, b-roll and editing','AI static images only','No AI at all'],a:1,e:'Hybrid performs at or near parity with human production; fully synthetic avatars have been measured underperforming real UGC by 30–50% on view-through.',m:'DS-10'},
{q:'Which use of an AI avatar is deceptive under FTC guidance?',o:['A branded spokesperson','An avatar captioned as a verified customer','A product demonstration','A labelled AI presenter'],a:1,e:'Fabricated first-person testimonials are prohibited whether the speaker is human or synthetic.',m:'DS-10'},
{q:'A customer wants to return a $20 item and you have no domestic return address. Best policy?',o:['Insist on return to the supplier in China','Refund without requesting the return','Refuse the return','Offer store credit only'],a:1,e:'Return shipping exceeds the product value. Refund, log the reason code, and fix whatever caused it if a pattern emerges.',m:'DS-12'},
{q:'Why run two payment processors?',o:['Lower fees','If one freezes you can keep trading while you resolve it','Better fraud detection','Required by Shopify'],a:1,e:'Losing payment processing is the most likely way a working store dies. Redundancy here is basic risk management, like a backup supplier.',m:'DS-12'},
{q:'Why is an AI recommendation harder to win than a search ranking?',o:['Algorithms are secret','There is no page two — you are one of about three named options or absent','Only paid placement appears','It needs a separate site'],a:1,e:'Search offers a long tail of positions with some traffic. A conversational answer names a handful of products, so visibility is close to binary.',m:'DS-11'},
{q:'What should a store fix first to be discoverable by shopping agents?',o:['Brand storytelling','Structured product data: accurate specs, real dimensions, current price, live stock','Checkout speed','Social following'],a:1,e:'Agents match against verifiable attributes. Unstated specifications are treated as absent, so the listing cannot be matched against a constrained request.',m:'DS-11'},
{q:'How should agentic channel fees be treated?',o:['As free organic traffic','As a marketplace cost inside your unit economics','As ad spend','They do not exist'],a:1,e:'Reported merchant fees around 4% on completed in-chat purchases mean this belongs in your margin model, not in your organic column.',m:'DS-11'},

{q:'Hundreds of tiny failed orders hit your checkout in minutes. What is happening?',o:['A viral post','Card testing with stolen cards','A pricing error','Platform outage'],a:1,e:'Automated validation of stolen cards. Each attempt can incur a fee and the pattern alone can trigger a processor review. CAPTCHA at checkout stops most of it.',m:'DS-12'},
{q:'Does a chargeback from genuine fraud count against you differently from a service-related one?',o:['Yes, fraud is excluded','No — the processor does not distinguish, which is why prevention matters','Only above $500','Only for new accounts'],a:1,e:'Your dispute ratio is what the processor acts on. Being blameless does not protect the account, so 3D Secure and manual review of flagged orders are worth the friction.',m:'DS-12'}

   CASE STUDIES — sequential judgement under real numbers.
   Each choice scores 2 (best), 1 (defensible), 0 (damaging).
