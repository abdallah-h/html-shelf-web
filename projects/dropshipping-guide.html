<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropship Depot — The Complete Learning Guide</title>
<meta name="description" content="A complete dropshipping course: 17 modules covering duty, tariffs, compliance, social and agentic commerce, 38 interactive exercises, 3 decision-based case studies, 5 calculators, a 70-question exam and 63 interview questions with model answers.">
<meta name="theme-color" content="#17242A">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/a77906574590.css" rel="stylesheet">
<style>
/* ============================================================
   DROPSHIP DEPOT — "Freight & Ledger" design system
   Palette drawn from parcel kraft, warehouse concrete,
   verdigris shipping seals and postal-red stamps.
   ============================================================ */
:root{
  --concrete:#E4E0D7;
  --concrete-2:#D6D0C3;
  --paper:#FBF9F4;
  --paper-2:#F3F0E8;
  --ink:#17242A;
  --ink-2:#3B4C53;
  --muted:#6E7C82;
  --line:#CBC5B7;
  --line-2:#B5AE9E;
  --teal:#0E6B60;
  --teal-2:#0A4E45;
  --teal-soft:#DCEBE7;
  --postal:#B02E2A;
  --postal-soft:#F7E4E2;
  --amber:#B8830F;
  --amber-soft:#F8EFD6;
  --rail-w:294px;
  --shadow-1:0 1px 0 rgba(23,36,42,.06), 0 2px 6px rgba(23,36,42,.05);
  --shadow-2:0 2px 0 rgba(23,36,42,.07), 0 10px 26px rgba(23,36,42,.10);
  --r:3px;
  --f-display:'Archivo', system-ui, sans-serif;
  --f-body:'Newsreader', Georgia, serif;
  --f-mono:'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--concrete);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
/* subtle warehouse-floor texture */
body::before{
  content:'';position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(23,36,42,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23,36,42,.022) 1px, transparent 1px);
  background-size:34px 34px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--teal-2);text-underline-offset:3px}

/* ---------- utility type ---------- */
.mono{font-family:var(--f-mono)}
.eyebrow{
  font-family:var(--f-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.12;letter-spacing:-.02em}
h1{font-weight:900;font-size:clamp(30px,4.4vw,50px);text-transform:uppercase;letter-spacing:-.03em}
h2{font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:-.015em}
h3{font-weight:700;font-size:19px;letter-spacing:-.01em}
h4{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- barcode signature ---------- */
.barcode{height:34px;width:100%;opacity:.88}
.barcode.sm{height:22px}

/* ============================================================
   APP FRAME
   ============================================================ */
#app{position:relative;z-index:1;display:flex;min-height:100vh}

/* ---------- LEFT RAIL : the tracking manifest ---------- */
#rail{
  width:var(--rail-w);flex:0 0 var(--rail-w);
  background:var(--ink);color:#DCE4E6;
  position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid #000;
}
#rail::-webkit-scrollbar{width:8px}
#rail::-webkit-scrollbar-thumb{background:#2E4249;border-radius:4px}
.rail-head{padding:22px 22px 16px;border-bottom:1px solid #2A3A41}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:32px;height:32px;flex:0 0 32px;background:var(--teal);
  display:grid;place-items:center;font-family:var(--f-display);
  font-weight:900;font-size:15px;color:#fff;letter-spacing:-.04em;
  clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%);
}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:15.5px;
  text-transform:uppercase;letter-spacing:.03em;color:#fff;line-height:1.1}
.brand-sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#7B9098;margin-top:3px}

.rail-progress{padding:14px 22px 16px;border-bottom:1px solid #2A3A41}
.rp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.rp-label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#7B9098}
.rp-val{font-family:var(--f-display);font-weight:800;font-size:15px;color:#fff}
.rp-bar{height:5px;background:#26363D;overflow:hidden}
.rp-fill{height:100%;background:var(--teal);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

.rail-nav{padding:14px 0 40px}
.nav-group{padding:0 22px;margin:16px 0 8px;display:flex;align-items:center;gap:9px}
.nav-group span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#6C8189;white-space:nowrap}
.nav-group i{flex:1;height:1px;background:#2A3A41}

/* tracking timeline nodes */
.trk{position:relative;display:block;width:100%;text-align:left;
  padding:9px 22px 9px 54px;color:#B7C6CA;font-family:var(--f-display);
  font-weight:600;font-size:13.4px;line-height:1.3;letter-spacing:-.005em;
  transition:background .15s,color .15s}
.trk:hover{background:#1E2E35;color:#fff}
.trk.active{background:#213238;color:#fff}
.trk.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}
/* the vertical line */
.trk::after{content:'';position:absolute;left:29px;top:0;bottom:0;width:1px;background:#33454C}
.trk:first-of-type::after{top:50%}
.trk.last-node::after{bottom:50%}
.trk .node{
  position:absolute;left:23px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;border-radius:50%;background:var(--ink);
  border:1.5px solid #4A5F67;z-index:2;transition:all .3s
}
.trk.done .node{background:var(--teal);border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(14,107,96,.22)}
.trk.done .node::after{content:'';position:absolute;left:3px;top:.5px;
  width:4px;height:7px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.trk.active .node{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,107,96,.28)}
.trk .code{font-family:var(--f-mono);font-size:9.5px;color:#6C8189;
  letter-spacing:.1em;display:block;margin-bottom:1px}
.trk.active .code,.trk.done .code{color:#8FB3AB}

/* plain (non-timeline) nav items */
.navlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 22px;color:#B7C6CA;font-family:var(--f-display);font-weight:600;
  font-size:13.4px;transition:background .15s,color .15s}
.navlink:hover{background:#1E2E35;color:#fff}
.navlink.active{background:#213238;color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.navlink .ic{font-size:14px;width:16px;text-align:center;opacity:.85}
.navlink .badge{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;
  background:#2E4249;color:#9FB4BA;padding:2px 6px;letter-spacing:.06em}

/* ---------- MAIN ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(228,224,215,.93);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:11px 30px;
}
.hamburger{display:none;width:34px;height:34px;border:1px solid var(--line-2);
  background:var(--paper);align-items:center;justify-content:center;flex-direction:column;gap:3px}
.hamburger i{display:block;width:15px;height:1.6px;background:var(--ink)}
.crumb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.topbar-sp{flex:1}
.tb-btn{border:1px solid var(--line-2);background:var(--paper);padding:6px 12px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);transition:.15s;white-space:nowrap}
.tb-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

.view{padding:34px 30px 90px;max-width:920px;width:100%;margin:0 auto}

/* ---------- SHIPPING LABEL (module header) ---------- */
.ship-label{
  background:var(--paper);border:1.5px solid var(--ink);
  box-shadow:var(--shadow-2);margin-bottom:30px;position:relative;overflow:hidden
}
.sl-strip{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink)}
.sl-code{background:var(--ink);color:#fff;padding:9px 16px;font-family:var(--f-mono);
  font-size:12px;font-weight:600;letter-spacing:.16em;display:flex;align-items:center}
.sl-meta{flex:1;display:flex;align-items:center;gap:18px;padding:9px 16px;flex-wrap:wrap}
.sl-meta span{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted)}
.sl-meta span b{color:var(--ink);font-weight:600}
.pill{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:3px 8px;border:1px solid;font-weight:600;display:inline-block}
.pill.wait{color:var(--muted);border-color:var(--line-2);background:var(--paper-2)}
.pill.done{color:var(--teal-2);border-color:var(--teal);background:var(--teal-soft)}
.pill.transit{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.sl-body{padding:22px 22px 18px}
.sl-body h1{margin-bottom:9px}
.sl-lede{font-size:18px;color:var(--ink-2);max-width:60ch;margin:0}
.sl-foot{border-top:1px dashed var(--line-2);padding:10px 22px 12px}

/* ---------- CONTENT BLOCKS ---------- */
.prose{max-width:70ch}
.prose p{margin:0 0 14px}
.prose h3,.prose h2.ph{margin:30px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--ink);
  display:inline-block;font-size:19px;font-weight:700;text-transform:none;letter-spacing:-.01em}
.prose ul{margin:0 0 16px;padding:0;list-style:none}
.prose ul li{position:relative;padding-left:22px;margin-bottom:7px}
.prose ul li::before{content:'';position:absolute;left:3px;top:.72em;width:7px;height:7px;
  background:var(--teal);transform:rotate(45deg)}
.prose ol{margin:0 0 16px;padding-left:22px}
.prose ol li{margin-bottom:7px;padding-left:4px}
.prose ol li::marker{font-family:var(--f-mono);font-size:12px;color:var(--teal-2);font-weight:600}
.prose b,.prose strong{font-weight:600;color:var(--ink)}
.prose code{font-family:var(--f-mono);font-size:.86em;background:var(--paper-2);
  border:1px solid var(--line);padding:1px 5px}

/* callouts */
.callout{border-left:4px solid;padding:13px 16px;margin:18px 0;font-size:16px;line-height:1.55}
.callout .ct{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:600;display:block;margin-bottom:5px}
.callout.tip{background:var(--teal-soft);border-color:var(--teal)}
.callout.tip .ct{color:var(--teal-2)}
.callout.warn{background:var(--postal-soft);border-color:var(--postal)}
.callout.warn .ct{color:var(--postal)}
.callout.note{background:var(--amber-soft);border-color:var(--amber)}
.callout.note .ct{color:var(--amber)}

/* formula plate */
.formula{background:var(--ink);color:#DCE4E6;padding:15px 18px;margin:18px 0;
  font-family:var(--f-mono);font-size:14px;line-height:1.7;overflow-x:auto}
.formula em{color:var(--teal-soft);font-style:normal}

/* tables — manifest style */
.tbl-wrap{overflow-x:auto;margin:18px 0;border:1.5px solid var(--ink);background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px}
thead th{background:var(--ink);color:#fff;font-family:var(--f-display);font-weight:700;
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;text-align:left;
  padding:9px 13px;white-space:nowrap}
tbody td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:var(--paper-2)}
tbody td:first-child{font-weight:600}

/* step ladder */
.ladder{margin:18px 0;border:1.5px solid var(--ink);background:var(--paper)}
.rung{display:flex;gap:0;border-bottom:1px solid var(--line)}
.rung:last-child{border-bottom:none}
.rung-n{flex:0 0 54px;background:var(--paper-2);border-right:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;
  font-size:13px;color:var(--teal-2)}
.rung-b{padding:12px 15px;flex:1}
.rung-b b{display:block;font-family:var(--f-display);font-weight:700;font-size:15px;margin-bottom:2px}
.rung-b span{font-size:15px;color:var(--ink-2);line-height:1.5}

/* fact cards */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;margin:18px 0}
.fcard{background:var(--paper);border:1.5px solid var(--ink);padding:14px 15px;box-shadow:var(--shadow-1)}
.fcard b{display:block;font-family:var(--f-display);font-weight:700;font-size:14.5px;
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.01em}
.fcard span{font-size:14.5px;color:var(--ink-2);line-height:1.5}

/* ============================================================
   PRACTICE / EXERCISE ENGINE
   ============================================================ */
.practice{background:var(--paper);border:1.5px solid var(--ink);
  box-shadow:var(--shadow-2);margin:34px 0}
.pr-head{background:var(--ink);color:#fff;padding:11px 18px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap}
.pr-head .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#7FA9A1}
.pr-head .t{font-family:var(--f-display);font-weight:800;font-size:16px;
  text-transform:uppercase;letter-spacing:.01em}
.pr-head .sp{flex:1}
.pr-head .score{font-family:var(--f-mono);font-size:11px;color:#9FB4BA}
.pr-body{padding:18px}
.pr-intro{font-size:15.5px;color:var(--ink-2);margin:0 0 16px}

/* MCQ */
.q{margin-bottom:22px;padding-bottom:20px;border-bottom:1px dashed var(--line-2)}
.q:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.q-p{display:flex;gap:10px;margin-bottom:11px}
.q-n{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--teal-2);
  background:var(--teal-soft);border:1px solid var(--teal);padding:1px 6px;height:fit-content;
  white-space:nowrap;margin-top:3px}
.q-t{font-weight:500;font-size:16.5px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  border:1.5px solid var(--line-2);background:var(--paper);padding:9px 12px;
  font-size:15.5px;line-height:1.45;transition:.13s}
.opt:hover:not(:disabled){border-color:var(--ink);background:var(--paper-2)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);
  border:1px solid var(--line-2);width:20px;height:20px;flex:0 0 20px;display:grid;
  place-items:center;margin-top:2px}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.right .k{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.wrong{border-color:var(--postal);background:var(--postal-soft)}
.opt.wrong .k{background:var(--postal);color:#fff;border-color:var(--postal)}
.explain{margin-top:11px;padding:11px 13px;background:var(--paper-2);
  border-left:3px solid var(--teal);font-size:15px;line-height:1.5}
.explain b{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;display:block;margin-bottom:4px;color:var(--teal-2)}
.explain.miss{border-left-color:var(--postal)}
.explain.miss b{color:var(--postal)}

/* ORDERING exercise */
.ord-pool,.ord-slots{display:flex;flex-direction:column;gap:8px}
.ord-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ord-col h4{margin-bottom:9px;color:var(--muted)}
.ord-item{border:1.5px solid var(--line-2);background:var(--paper-2);padding:9px 12px;
  font-size:15px;text-align:left;width:100%;line-height:1.4;transition:.13s}
.ord-item:hover{border-color:var(--ink);background:var(--paper)}
.ord-slot{border:1.5px dashed var(--line-2);min-height:44px;padding:9px 12px;
  font-size:15px;display:flex;gap:9px;align-items:center;background:var(--paper);
  text-align:left;width:100%;line-height:1.4}
.ord-slot .sn{font-family:var(--f-mono);font-size:11px;color:var(--teal-2);
  background:var(--teal-soft);border:1px solid var(--teal);padding:1px 6px;flex:0 0 auto}
.ord-slot.filled{border-style:solid;border-color:var(--ink)}
.ord-slot.right{border-color:var(--teal);background:var(--teal-soft)}
.ord-slot.wrong{border-color:var(--postal);background:var(--postal-soft)}

/* SORTING exercise */
.sort-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:40px}
.chip{border:1.5px solid var(--line-2);background:var(--paper-2);padding:7px 12px;
  font-size:14.5px;transition:.13s;line-height:1.3}
.chip:hover{border-color:var(--ink);background:var(--paper)}
.chip.sel{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 2px rgba(14,107,96,.18)}
.chip.right{border-color:var(--teal);background:var(--teal-soft)}
.chip.wrong{border-color:var(--postal);background:var(--postal-soft);text-decoration:line-through}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{border:1.5px solid var(--ink);background:var(--paper);min-height:110px}
.bin-h{background:var(--paper-2);border-bottom:1px solid var(--line);padding:8px 12px;
  font-family:var(--f-display);font-weight:700;font-size:12.5px;text-transform:uppercase;
  letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:8px}
button.bin-h:disabled{opacity:1;color:var(--ink)}
.bin-b{padding:10px;display:flex;flex-wrap:wrap;gap:7px;min-height:60px}
.bin.armed{outline:2px solid var(--teal);outline-offset:2px}
.bin.armed .bin-b{cursor:pointer}

/* CHECKLIST */
.chk{display:flex;flex-direction:column;gap:2px}
.chk-i{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;text-align:left;
  width:100%;border:1px solid transparent;border-bottom:1px solid var(--line);
  font-size:15.5px;line-height:1.45;transition:.13s}
.chk-i:hover{background:var(--paper-2)}
.chk-i .box{width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--line-2);
  margin-top:2px;position:relative;transition:.15s}
.chk-i.on .box{background:var(--teal);border-color:var(--teal)}
.chk-i.on .box::after{content:'';position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.chk-i.on{color:var(--muted)}
.chk-i.on .lb{text-decoration:line-through}

/* CALCULATORS */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:18px}
.field label{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;border:1.5px solid var(--line-2);background:var(--paper);
  padding:9px 11px;font-family:var(--f-mono);font-size:15px;transition:.13s}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(14,107,96,.15)}
.readout{border:1.5px solid var(--ink);background:var(--ink);color:#fff;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.ro{padding:13px 15px;border-right:1px solid #2E4249}
.ro:last-child{border-right:none}
.ro .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:#7FA9A1;display:block;margin-bottom:4px}
.ro .v{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.02em}
.ro .v.good{color:#4FD1BC}.ro .v.bad{color:#FF8A80}.ro .v.mid{color:#FFCF6B}
.verdict{margin-top:14px;padding:12px 15px;border:1.5px solid;font-size:15.5px;line-height:1.5}
.verdict.good{border-color:var(--teal);background:var(--teal-soft)}
.verdict.bad{border-color:var(--postal);background:var(--postal-soft)}
.verdict.mid{border-color:var(--amber);background:var(--amber-soft)}
.verdict b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;
  display:block;margin-bottom:3px;font-size:13px}

/* sliders for scorecard */
.slider-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.slider-row:last-of-type{border-bottom:none}
.sr-l{flex:1;font-size:15.5px;line-height:1.35}
.sr-l small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:1px}
.sr-c{display:flex;align-items:center;gap:10px;flex:0 0 auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:4px;
  background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
  background:var(--teal);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--teal);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;background:var(--teal);
  border:2px solid var(--paper);cursor:pointer}
.sr-v{font-family:var(--f-mono);font-weight:600;font-size:14px;width:26px;text-align:right}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);
  background:var(--ink);color:#fff;padding:9px 18px;font-family:var(--f-display);
  font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;transition:.15s}
.btn:hover{background:var(--teal);border-color:var(--teal)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{padding:6px 12px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ---------- DELIVERY RECEIPT (results) ---------- */
.receipt{position:relative;background:var(--paper);border:1.5px solid var(--ink);
  margin-top:20px;box-shadow:var(--shadow-2);overflow:hidden}
.receipt::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 7px,transparent 7px 14px)}
.rc-b{padding:22px 22px 20px;text-align:center}
.rc-k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px}
.rc-score{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:1;
  letter-spacing:-.04em}
.rc-of{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:6px}
.stamp{display:inline-block;margin-top:16px;border:3px double;padding:6px 20px;
  font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.14em;
  text-transform:uppercase;transform:rotate(-7deg);opacity:.92;
  animation:stampin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes stampin{0%{transform:rotate(-7deg) scale(2.4);opacity:0}
  60%{transform:rotate(-7deg) scale(.94);opacity:1}100%{transform:rotate(-7deg) scale(1)}}
.stamp.pass{color:var(--teal);border-color:var(--teal)}
.stamp.fail{color:var(--postal);border-color:var(--postal)}
.rc-msg{margin-top:16px;font-size:15.5px;color:var(--ink-2);max-width:44ch;
  margin-left:auto;margin-right:auto;line-height:1.5}
.rc-f{border-top:1px dashed var(--line-2);padding:11px 22px;display:flex;
  justify-content:space-between;flex-wrap:wrap;gap:10px}
.rc-f span{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

/* ============================================================
   HOME / DASHBOARD
   ============================================================ */
.hero{background:var(--ink);color:#E4EAEB;border:1.5px solid var(--ink);
  box-shadow:var(--shadow-2);margin-bottom:26px;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:center;
  padding:9px 20px;border-bottom:1px solid #2E4249;flex-wrap:wrap;gap:10px}
.hero-top span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#7FA9A1}
.hero-b{padding:32px 26px 26px}
.hero h1{color:#fff;margin-bottom:14px}
.hero h1 em{font-style:normal;color:#4FD1BC;display:block}
.hero p{font-size:18.5px;color:#AFC0C4;max-width:56ch;margin:0 0 22px;line-height:1.55}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  border-top:1px solid #2E4249}
.hs{padding:15px 20px;border-right:1px solid #2E4249}
.hs:last-child{border-right:none}
.hs .n{font-family:var(--f-display);font-weight:900;font-size:29px;color:#fff;letter-spacing:-.03em}
.hs .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:#7FA9A1;margin-top:3px}

.sec-title{display:flex;align-items:center;gap:13px;margin:36px 0 16px}
.sec-title h2{white-space:nowrap}
.sec-title i{flex:1;height:2px;background:var(--ink)}

.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:13px}
.modcard{background:var(--paper);border:1.5px solid var(--ink);text-align:left;
  padding:0;box-shadow:var(--shadow-1);transition:.16s;display:flex;flex-direction:column}
.modcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.mc-top{display:flex;justify-content:space-between;align-items:center;
  padding:7px 12px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.mc-code{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--teal-2)}
.mc-b{padding:13px 14px 15px;flex:1;display:flex;flex-direction:column}
.mc-b b{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.22;
  display:block;margin-bottom:6px;letter-spacing:-.01em}
.mc-b span{font-size:14.5px;color:var(--ink-2);line-height:1.45;flex:1}
.mc-f{display:flex;gap:12px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line-2)}
.mc-f em{font-family:var(--f-mono);font-size:9.5px;font-style:normal;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

.tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:13px}
.tile{background:var(--paper);border:1.5px solid var(--ink);padding:17px 16px;text-align:left;
  box-shadow:var(--shadow-1);transition:.16s;display:block;width:100%}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);background:var(--teal-soft)}
.tile .ti{font-size:21px;margin-bottom:9px;display:block}
.tile b{font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;
  letter-spacing:.01em;display:block;margin-bottom:5px}
.tile span{font-size:14.5px;color:var(--ink-2);line-height:1.45;display:block}

/* ============================================================
   EXAM
   ============================================================ */
.exam-setup{background:var(--paper);border:1.5px solid var(--ink);padding:22px;
  box-shadow:var(--shadow-2);margin-bottom:22px}
.exam-bar{position:sticky;top:53px;z-index:30;background:var(--ink);color:#fff;
  padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.exam-bar .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#7FA9A1}
.exam-bar .v{font-family:var(--f-display);font-weight:800;font-size:15px}
.exam-bar .track{flex:1;min-width:100px;height:5px;background:#2E4249}
.exam-bar .track i{display:block;height:100%;background:var(--teal);transition:width .3s}

/* ============================================================
   INTERVIEW BANK
   ============================================================ */
.iv-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.search{flex:1;min-width:190px;position:relative}
.search input{width:100%;border:1.5px solid var(--ink);background:var(--paper);
  padding:10px 13px 10px 34px;font-size:15px;font-family:var(--f-body)}
.search input:focus{outline:none;box-shadow:0 0 0 3px rgba(14,107,96,.16)}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;font-size:14px}
.catbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.cat{border:1.5px solid var(--line-2);background:var(--paper);padding:6px 12px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);transition:.13s}
.cat:hover{border-color:var(--ink)}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat .n{opacity:.55;margin-left:5px}
.qa{background:var(--paper);border:1.5px solid var(--ink);margin-bottom:10px;box-shadow:var(--shadow-1)}
.qa-h{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px}
.qa-h:hover{background:var(--paper-2)}
.qa-n{font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--teal-2);
  background:var(--teal-soft);border:1px solid var(--teal);padding:2px 6px;
  flex:0 0 auto;margin-top:3px;letter-spacing:.06em}
.qa-q{flex:1;font-weight:500;font-size:16.5px;line-height:1.4}
.qa-x{font-family:var(--f-mono);font-size:17px;color:var(--muted);flex:0 0 auto;
  transition:transform .2s;line-height:1}
.qa.open .qa-x{transform:rotate(45deg)}
.qa-a{display:none;padding:0 15px 16px 15px;border-top:1px dashed var(--line-2);margin-top:0}
.qa.open .qa-a{display:block;padding-top:14px}
.qa-a p{margin:0 0 11px;font-size:16px;line-height:1.58}
.qa-a p:last-child{margin-bottom:0}
.qa-a ul{margin:0 0 11px;padding:0;list-style:none}
.qa-a li{position:relative;padding-left:19px;margin-bottom:5px;font-size:15.5px;line-height:1.5}
.qa-a li::before{content:'';position:absolute;left:2px;top:.7em;width:6px;height:6px;
  background:var(--teal);transform:rotate(45deg)}
.qa-hit{display:inline-block;margin-left:8px;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);background:var(--amber-soft);
  padding:1px 6px;vertical-align:middle}
.qa-tag{display:inline-block;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);
  padding:2px 6px;margin-top:9px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:16px}

/* flashcard */
.fc-stage{perspective:1400px;margin:0 auto 18px;max-width:560px}
.fc{position:relative;min-height:250px;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-side{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--paper);
  border:1.5px solid var(--ink);box-shadow:var(--shadow-2);padding:26px;
  display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.fc-back{transform:rotateY(180deg);background:var(--paper-2)}
.fc-side .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.fc-side .txt{font-size:18px;line-height:1.5}
.fc-back .txt{font-size:15.5px}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:14px}
.fc-nav .pos{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:64px;text-align:center}

/* ---------- misc ---------- */
.notice{background:var(--amber-soft);border:1.5px solid var(--amber);padding:12px 15px;
  font-size:15px;margin-bottom:20px;line-height:1.5}
.pgnav{display:flex;justify-content:space-between;gap:12px;margin-top:44px;
  padding-top:20px;border-top:2px solid var(--ink)}
.pgnav button{flex:1;max-width:290px;text-align:left;border:1.5px solid var(--ink);
  background:var(--paper);padding:12px 15px;transition:.15s;box-shadow:var(--shadow-1)}
.pgnav button:hover{background:var(--ink);color:#fff}
.pgnav button:hover .pn-k{color:#7FA9A1}
.pgnav button:disabled{opacity:.32;cursor:not-allowed}
.pgnav .pn-k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.pgnav .pn-t{font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.25}
.pgnav .r{text-align:right}
.scrim{display:none;position:fixed;top:0;right:0;bottom:0;left:0;inset:0;
  background:rgba(23,36,42,.55);z-index:49;cursor:pointer;-webkit-tap-highlight-color:transparent}

@media (max-width:980px){
  .ord-wrap{grid-template-columns:1fr}
  .bins{grid-template-columns:1fr}
}
@media (max-width:840px){
  body{font-size:16.5px}
  #rail{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);visibility:hidden;
    transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s linear .28s}
  /* shadow only when open — otherwise it bleeds onto the page edge from off-screen;
     visibility:hidden also keeps the closed drawer out of the tab order */
  #rail.open{transform:translateX(0);visibility:visible;box-shadow:8px 0 30px rgba(0,0,0,.3);
    transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s}
  .scrim.on{display:block}
  .hamburger{display:flex}
  .view{padding:22px 17px 80px}
  .topbar{padding:9px 17px}
  .hero-b{padding:24px 18px 20px}
  .sl-body{padding:17px}
  .pr-body{padding:15px}
  .rc-score{font-size:46px}
  .modgrid{grid-template-columns:1fr}
  .pgnav{flex-direction:column}
  .pgnav button{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  html{scroll-behavior:auto}
}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px}

/* ---------- CASE STUDY ENGINE ---------- */
.case-card{background:var(--paper);border:1.5px solid var(--ink);box-shadow:var(--shadow-1);
  transition:.16s;text-align:left;display:flex;flex-direction:column;width:100%}
.case-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.cc-top{display:flex;justify-content:space-between;align-items:center;padding:7px 13px;
  border-bottom:1px solid var(--line);background:var(--ink);color:#fff}
.cc-top .c{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#7FA9A1}
.cc-b{padding:15px 15px 16px;flex:1;display:flex;flex-direction:column}
.cc-b b{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;
  display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:-.005em}
.cc-b span{font-size:15px;color:var(--ink-2);line-height:1.45;flex:1}
.cc-f{display:flex;gap:12px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-2)}
.cc-f em{font-family:var(--f-mono);font-size:9.5px;font-style:normal;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

.dossier{border:1.5px solid var(--ink);background:var(--paper);margin-bottom:24px;box-shadow:var(--shadow-2)}
.dos-h{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:14px;
  align-items:center;flex-wrap:wrap}
.dos-h .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;color:#7FA9A1}
.dos-h .t{font-family:var(--f-display);font-weight:800;font-size:15px;text-transform:uppercase}
.dos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.dos-cell{padding:11px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.dos-cell .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:3px}
.dos-cell .v{font-family:var(--f-display);font-weight:700;font-size:16px}
.dos-brief{padding:16px}
.dos-brief p{margin:0 0 11px;font-size:16px;line-height:1.55}
.dos-brief p:last-child{margin-bottom:0}

.stage{border:1.5px solid var(--ink);background:var(--paper);margin-bottom:16px;box-shadow:var(--shadow-1)}
.stage.locked{opacity:.45;pointer-events:none}
.st-h{display:flex;align-items:center;gap:12px;padding:9px 15px;background:var(--paper-2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.st-n{font-family:var(--f-mono);font-size:10px;font-weight:600;color:#fff;background:var(--teal);
  padding:2px 8px;letter-spacing:.1em}
.st-when{font-family:var(--f-display);font-weight:700;font-size:13px;text-transform:uppercase;
  letter-spacing:.05em}
.st-b{padding:15px}
.st-q{font-size:17px;font-weight:500;line-height:1.45;margin:0 0 13px}
.st-note{font-size:15px;color:var(--ink-2);line-height:1.5;margin:0 0 13px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
  border:1px solid var(--ink);background:var(--ink);margin-bottom:14px}
.met{padding:10px 12px;border-right:1px solid #2E4249}
.met:last-child{border-right:none}
.met .l{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#7FA9A1;display:block;margin-bottom:3px}
.met .v{font-family:var(--f-display);font-weight:800;font-size:18px;color:#fff;letter-spacing:-.02em}
.met .v.good{color:#4FD1BC}.met .v.bad{color:#FF8A80}.met .v.mid{color:#FFCF6B}

.choice{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  border:1.5px solid var(--line-2);background:var(--paper);padding:11px 13px;margin-bottom:8px;
  font-size:15.5px;line-height:1.45;transition:.13s}
.choice:hover:not(:disabled){border-color:var(--ink);background:var(--paper-2)}
.choice:disabled{cursor:default}
.choice .k{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);
  border:1px solid var(--line-2);width:20px;height:20px;flex:0 0 20px;display:grid;
  place-items:center;margin-top:2px}
.choice.best{border-color:var(--teal);background:var(--teal-soft)}
.choice.best .k{background:var(--teal);color:#fff;border-color:var(--teal)}
.choice.part{border-color:var(--amber);background:var(--amber-soft)}
.choice.part .k{background:var(--amber);color:#fff;border-color:var(--amber)}
.choice.poor{border-color:var(--postal);background:var(--postal-soft)}
.choice.poor .k{background:var(--postal);color:#fff;border-color:var(--postal)}
.choice.dim{opacity:.55}
.fb{margin-top:11px;padding:12px 14px;background:var(--paper-2);border-left:3px solid var(--teal);
  font-size:15.5px;line-height:1.55}
.fb.part{border-left-color:var(--amber)}
.fb.poor{border-left-color:var(--postal)}
.fb .tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;display:block;margin-bottom:5px;color:var(--teal-2)}
.fb.part .tag{color:var(--amber)}
.fb.poor .tag{color:var(--postal)}
.outcome{margin-top:11px;padding:12px 14px;border:1px dashed var(--line-2);background:var(--paper);
  font-size:15.5px;line-height:1.55}
.outcome b{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  display:block;margin-bottom:5px;color:var(--muted)}
.debrief{border:1.5px solid var(--ink);background:var(--teal-soft);padding:18px;margin-top:18px}
.debrief h3{margin-bottom:9px}
.debrief p{margin:0 0 11px;font-size:16px;line-height:1.58}
.debrief p:last-child{margin-bottom:0}

/* footer nav — always reachable at the end of any page */
.footnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:40px;padding:14px 0 4px;
  border-top:1px dashed var(--line-2)}
.footnav .fl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-right:4px}
.footnav button{border:1px solid var(--line-2);background:var(--paper);padding:6px 11px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.footnav button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.footnav .sp{flex:1}
@media print{.footnav{display:none}}

/* skip link */

  padding:10px 16px;font-family:var(--f-display);font-weight:700;font-size:13px;

mark{background:var(--amber-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--amber);
  padding:0 1px;border-radius:1px}

/* sort bin header becomes the keyboard-accessible drop target */
button.bin-h{width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);
  cursor:default;font-family:var(--f-display)}

.bin-h .drop{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;opacity:0}

       rail (z50) above scrim (z49) above main content -->

</div>
<script>
/* ============================================================
   COURSE CONTENT
   ============================================================ */
const COURSE = [
{
  id:'m1', code:'DS-01', title:'What Dropshipping Actually Is', mins:9,
  lede:'Strip away the hype and understand the mechanics, the money, and who really holds the risk.',
  blocks:[
    {p:'Dropshipping is a retail fulfilment method. You sell a product you do not own, stored in a warehouse you do not rent, packed by staff you do not employ. When a customer buys from your store, you forward that order to a supplier, pay them the wholesale price, and they ship the item directly to your customer under your brand.'},
    {p:'The critical thing to understand is what you are actually being paid for. You are <b>not</b> being paid to move boxes — the supplier does that. You are being paid for <b>demand generation and trust</b>: finding the customer, convincing them, and standing behind the purchase. Everything else in this course flows from that single idea.'},
    {h:'The three parties'},
    {table:{head:['Party','Who they are','What they own','What they risk'],rows:[
      ['You (retailer)','Store operator, marketer','The customer relationship, the brand, the storefront','Ad spend, refunds, reputation'],
      ['Supplier','Manufacturer, wholesaler, or agent','Inventory, packing, outbound logistics','Stock capital, production'],
      ['Customer','End buyer','Nothing until delivery','Money, time, disappointment']
    ]}},
    {h:'What makes it different from other models'},
    {table:{head:['Model','Inventory','Upfront cash','Margin','Control'],rows:[
      ['Dropshipping','None','$100–$500','15–40%','Low'],
      ['Wholesale / retail arbitrage','You buy stock','$1,000–$10,000','25–50%','Medium'],
      ['Amazon FBA','You buy + ship to Amazon','$3,000–$20,000','25–45%','Medium'],
      ['Private label','You commission production','$5,000–$50,000','40–70%','High'],
      ['Print on demand','None','$0–$100','20–40%','Medium'],
      ['Affiliate','None','$0','3–50% commission','None']
    ]}},
    {h:'The honest definition'},
    {p:'A useful working definition: <b>dropshipping is buying customer attention at wholesale and selling it at retail.</b> Your true cost of goods is not the $8 you pay the supplier — it is the $8 plus the $14 you spent on advertising to find that buyer. Beginners who forget the second number go bankrupt while their dashboard says "profitable".'},
    {callout:'tip',t:'Frame it correctly from day one',x:'You are running a marketing business with a logistics dependency — not a shop. Every hour you spend on your logo is an hour not spent on the thing that actually generates revenue: understanding and reaching your customer.'},
    {h:'Is it still viable?'},
    {callout:'warn',t:'And then duty-free entry ended',x:'The US $800 de minimis exemption was suspended in 2025 and is now on an indefinite footing. Every parcel entering the United States attracts duty and a formal customs entry regardless of value. This raised break-even ROAS across the board and pushed the model decisively toward domestic fulfilment. Module 06 covers exactly what it does to your numbers — read it before you price anything.'},
    {p:'Yes, but not the 2016 version. The "list 500 random gadgets and run cheap Facebook ads" era is over — ad costs rose, customers grew wary of 30-day shipping, and payment processors tightened rules. What works now is narrower and more disciplined:'},
    {ul:[
      '<b>Branded niche stores</b> rather than general stores with no identity.',
      '<b>Domestic or agent-based fulfilment</b> with 5–10 day delivery, not 30-day epackets.',
      '<b>Content-led acquisition</b> (organic short video, creator partnerships) alongside paid.',
      '<b>Higher average order value</b> through bundles and post-purchase offers, because ad costs demand it.',
      '<b>Duty priced in from the start</b> — landed cost now means product plus freight plus duty plus brokerage.',
      '<b>A real path off the model</b> — using dropshipping to validate demand, then moving winners to private label.'
    ]},
    {callout:'warn',t:'What the gurus leave out',x:'Payment processors can and do hold your funds. Stripe and PayPal reserve the right to freeze payouts for 90–180 days if chargebacks exceed roughly 1%. Slow shipping is the number one cause. Plan your fulfilment speed as a survival issue, not a nice-to-have.'}
  ]
},
{
  id:'m2', code:'DS-02', title:'The Order Flow & The Money', mins:11,
  lede:'Follow one order end to end, then follow the money — including the costs beginners never count.',
  blocks:[
    {h:'One order, start to finish'},
    {ladder:[
      {t:'Customer places the order','d':'They pay you the retail price on your storefront. The money lands in your payment processor, typically released to your bank in 2–7 days.'},
      {t:'Order routes to the supplier','d':'Automatically through an app like DSers, CJ or AutoDS, or manually if you are small. The supplier receives the SKU, quantity, and the customer\'s shipping address.'},
      {t:'You pay the wholesale cost','d':'Charged to your card or supplier wallet. Note the cash-flow gap: you often pay the supplier before the processor releases the customer\'s money to you.'},
      {t:'Supplier picks, packs and ships','d':'Under blind shipping, no supplier branding or invoice goes in the box. A tracking number is pushed back to your store.'},
      {t:'Customer is notified and receives','d':'Your store emails tracking. Delivery lands anywhere from 3 to 30 days depending on supplier location and shipping tier.'},
      {t:'Post-purchase','d':'Review request, support handling, and — if you have done the work — a second purchase. The second sale is where the real margin lives, because it costs you nothing in ads.'}
    ]},
    {h:'The real unit economics'},
    {p:'Here is the calculation almost every beginner gets wrong, done correctly. Assume a product selling at $49.99.'},
    {table:{head:['Line item','Amount','Note'],rows:[
      ['Retail price','$49.99','What the customer pays'],
      ['Product cost','−$12.00','Supplier wholesale'],
      ['Shipping cost','−$4.50','Often quietly included in supplier price'],
      ['Duty + tariff','−$6.00','Since 2025 this line is never zero for imports — see Module 06'],
      ['Brokerage / processing fees','−$1.50','Formal customs entry now applies at any value'],
      ['Payment processing','−$1.75','~2.9% + $0.30'],
      ['<b>Gross profit</b>','<b>$24.24</b>','Before any marketing'],
      ['Advertising (CPA)','−$14.00','The number beginners forget'],
      ['Refunds / disputes reserve','−$1.60','Budget ~5% of revenue'],
      ['Apps & platform (per order)','−$1.20','Shopify, email tool, review app'],
      ['<b>Net profit</b>','<b>$7.44</b>','~15% net margin — workable, but the duty line cost you 7 points']
    ]}},
    {formula:'<em>Landed cost</em>       = Product + Freight + Duty + Tariff + Brokerage\n<em>Contribution margin</em> = Retail − Landed cost − Processing\n<em>Break-even CPA</em>    = Contribution margin\n<em>Net profit</em>         = Contribution margin − CPA − Refund reserve − Overhead\n<em>Break-even ROAS</em>   = Retail price ÷ Contribution margin'},
    {p:'In the example above, contribution margin is $24.24, so break-even ROAS is 49.99 ÷ 24.24 = <b>2.06x</b>. Any ROAS above 2.06 makes money before overhead; below it, you are paying for the privilege of shipping parcels. Note how much that moved — the same product broke even at 1.58x before duty applied.'},
    {callout:'note',t:'The cash-flow trap',x:'You pay suppliers today and get paid by Stripe in 3–7 days. At $500/day in ad spend you may need $5,000–$10,000 in float just to keep operating, even while profitable. Growth consumes cash. Plan the buffer before you scale, not after.'},
    {h:'Where each dollar goes at scale'},
    {table:{head:['Cost bucket','Typical share of revenue','Danger sign'],rows:[
      ['Landed cost (goods + freight + duty)','38–50%','Above 55% — margin too thin to advertise'],
      ['Advertising','20–35%','Above 40% — no room for error'],
      ['Payment processing','3%','Above 4% — check your gateway mix'],
      ['Refunds & chargebacks','2–5%','Above 6% — product or shipping problem'],
      ['Apps, tools, staff','3–8%','Above 12% — you over-bought software'],
      ['<b>Net profit</b>','<b>12–20%</b>','Below 8% — fix pricing or CPA']
    ]}}
  ]
},
{
  id:'m3', code:'DS-03', title:'Reality Check: Risks, Timelines, Numbers', mins:8,
  lede:'What actually happens in months one through eighteen, and the failure modes that end most stores.',
  blocks:[
    {h:'What you genuinely get'},
    {cards:[
      {t:'Low capital risk','d':'You are not sitting on $20,000 of unsold stock. Your worst case is wasted ad spend and time.'},
      {t:'Fast validation','d':'You can test whether a market wants something in 7 days for under $300. No other retail model is that fast.'},
      {t:'Geographic freedom','d':'The operation runs from a laptop. Your supplier, customer, and processor need never meet.'},
      {t:'Real transferable skill','d':'Paid acquisition, conversion optimisation and copywriting are worth six figures a year as employable skills, independent of the store.'}
    ]},
    {h:'What genuinely hurts'},
    {cards:[
      {t:'Thin, fragile margins','d':'A 15% CPM increase can flip a profitable campaign to a loss overnight. You do not control the input price.'},
      {t:'Zero quality control','d':'You find out the product is defective when your customers tell you, in public, in reviews.'},
      {t:'Shipping times you cannot fix','d':'Customs delays, factory holidays, and carrier failures are yours to apologise for and not yours to solve.'},
      {t:'Platform dependency','d':'A Meta ad account ban or a Shopify policy change can remove your entire revenue stream in an afternoon.'},
      {t:'Regulatory exposure','d':'Trade policy can change your unit economics overnight, as the 2025 end of duty-free parcels proved. You have no input and no warning.'}
    ]},
    {h:'A realistic timeline'},
    {table:{head:['Period','What is actually happening','Typical monthly revenue','Typical net'],rows:[
      ['Months 1–3','Learning, building, first tests. Most people lose money here.','$0 – $2,000','−$300 to +$300'],
      ['Months 3–6','First winning product found. Fragile, single-product dependency.','$2,000 – $12,000','$300 – $2,200'],
      ['Months 6–12','Systems, email flows, second and third products, better suppliers.','$12,000 – $50,000','$2,000 – $9,000'],
      ['Months 12–18','Brand, retention, team of 1–3, private-label transition begins.','$50,000 – $150,000','$8,000 – $30,000'],
      ['18 months+','A real company with defensibility, or a store you sell.','Highly variable','Highly variable']
    ]}},
    {callout:'warn',t:'The attrition numbers',x:'Roughly 80–90% of dropshipping stores are abandoned within their first year. The dominant causes are not bad luck: they are quitting during the unprofitable learning phase, under-capitalising ad testing, and choosing products with margins too thin to advertise. All three are avoidable decisions, not accidents.'},
    {h:'Money you should be prepared to lose'},
    {table:{head:['Line','Lean start','Comfortable start'],rows:[
      ['Store platform (3 months)','$117','$237'],
      ['Domain','$12','$12'],
      ['Apps & tools (3 months)','$0','$180'],
      ['Product samples','$60','$220'],
      ['Ad testing budget','$300','$1,500'],
      ['Creative (video, photos)','$0 (self-shot)','$400'],
      ['<b>Total</b>','<b>~$460</b>','<b>~$2,550</b>']
    ]}},
    {callout:'tip',t:'Set the right success metric for month one',x:'Your month-one goal is not profit. It is to complete one full loop: choose a niche, launch a store, run a test, and read the data honestly. People who chase profit in week two quit in week five.'}
  ]
},
{
  id:'m4', code:'DS-04', title:'Choosing a Niche That Can Actually Pay', mins:12,
  lede:'The decision that constrains every other decision. Get it wrong and no amount of ad skill rescues you.',
  blocks:[
    {p:'Your niche determines your competition, your margins, your creative angles, and whether repeat purchases are even possible. It is a structural decision — you cannot out-execute a bad one.'},
    {h:'The seven filters'},
    {ladder:[
      {t:'Identifiable, reachable audience','d':'Can you describe your buyer in one sentence and name three places they gather online? "Women 25–45" is not an audience. "People training for their first marathon" is.'},
      {t:'Price band of $30–$200','d':'Below $30, ad costs eat the margin. Above $200, buyers research heavily and want brands they recognise. This band buys on impulse-plus-consideration.'},
      {t:'Margin of 3x or better','d':'You need retail to be at least three times landed cost. Below that, you cannot afford customer acquisition.'},
      {t:'Not owned by Amazon','d':'Search the product. If Amazon, Walmart and Target occupy the entire first page with the same item cheaper, walk away.'},
      {t:'Repeat or expansion potential','d':'Consumables, accessories, or collectible ranges. A one-purchase-per-lifetime product means you buy every single customer.'},
      {t:'Demonstrable in 15 seconds','d':'If you cannot show the value in a short silent video, paid social will be brutally expensive.'},
      {t:'Stable or rising demand','d':'Check a 5-year Google Trends view. Flat is fine. Sharply declining is a trap dressed as low competition.'}
    ]},
    {h:'Categories that consistently work'},
    {table:{head:['Category','Why it works','Typical margin','Main risk'],rows:[
      ['Pet accessories','Emotional spending, high repeat, strong communities','35–55%','Saturated hero products'],
      ['Home organisation','Visual before/after, broad appeal','30–50%','Low differentiation'],
      ['Hobby & craft supplies','Passionate, high repeat, low Amazon presence','40–60%','Small total market'],
      ['Baby & toddler safety','Urgent need, price-insensitive parents','35–55%','Liability and compliance'],
      ['Fitness & recovery','Problem-driven, seasonal spikes in January','30–50%','Heavy competition'],
      ['Outdoor & camping','High AOV, gear-obsessed buyers','35–55%','Strongly seasonal'],
      ['Beauty tools & skincare','Very high margin, demo-friendly','45–65%','Regulation, claims risk'],
      ['Auto & motorcycle accessories','Fitment data creates a moat, loyal buyers','30–50%','Returns from wrong fitment'],
      ['Adaptive / accessibility aids','Underserved, high intent, low competition','40–60%','Requires genuine expertise']
    ]}},
    {callout:'warn',t:'Categories to avoid as a beginner',x:'Anything ingestible or applied to skin (liability + ad policy), electronics with warranty expectations, branded or counterfeit-adjacent goods, weapons and vape accessories (payment processor bans), and anything where fitment errors are likely without a fitment database.'},
    {h:'How to research properly'},
    {ul:[
      '<b>Google Trends, 5-year view</b> — you are checking direction, not volume. Ignore anything trending sharply down.',
      '<b>Amazon Best Sellers + "New Releases"</b> — New Releases is the more useful list; it shows momentum, not incumbency.',
      '<b>Meta Ad Library</b> — search a keyword, filter to active ads, and look for ads that have been running 30+ days. Long-running ads are profitable ads.',
      '<b>Reddit and Facebook groups</b> — read the complaint threads. Every "does anyone know something that fixes X" is a product brief.',
      '<b>Etsy and Kickstarter</b> — early-signal markets, often 6–12 months ahead of mass ecommerce.',
      '<b>AliExpress order counts</b> — sort by orders, but treat this as proof of supply interest, not proof of an untapped market.'
    ]},
    {callout:'tip',t:'The strongest tie-breaker',x:'When two niches score equally, choose the one where you are closest to the customer. Domain knowledge shows up in your copy, your angles, and the questions you know to answer — and it is the only advantage a competitor cannot buy.'}
  ]
},
{
  id:'m5', code:'DS-05', title:'Suppliers: Sourcing, Vetting, Managing', mins:12,
  lede:'Your supplier is your factory, your warehouse and your delivery promise. Choose like you are hiring.',
  blocks:[
    {h:'The supplier landscape'},
    {table:{head:['Type','Examples','Shipping','Cost','Best for'],rows:[
      ['Open marketplace','AliExpress','7–30 days','Free to use','Testing and validation only'],
      ['Sourcing agent','CJ Dropshipping, Zendrop','5–15 days','Free / tiered','Post-validation, better unit costs'],
      ['Private agent','Found via referral or Alibaba','4–12 days','Negotiated','Proven products at volume'],
      ['Domestic supplier','Spocket, Doba, Modalyst','2–7 days','$25–$100/mo','Premium positioning, fast delivery'],
      ['Brand distributor','Direct wholesale accounts','2–5 days','Requires application','High-ticket, credibility niches'],
      ['Print on demand','Printful, Printify, Gelato','3–8 days','Free','Designs, apparel, zero risk']
    ]}},
    {h:'The vetting protocol'},
    {ladder:[
      {t:'Ask the duty question first','d':'Do you ship DDP to my market, and what is the all-in landed cost per unit including duty and brokerage? A supplier who cannot answer precisely will hand your customers a surprise bill at the door. Since 2025 this outranks price as the opening question.'},
      {t:'Message before you buy','d':'Send three specific questions about lead time, defect policy, and packaging options. Response speed and clarity now predicts their behaviour during a crisis later.'},
      {t:'Order samples to your own address','d':'Order from at least two suppliers for the same product. Time the delivery. Photograph the packaging exactly as it arrives.'},
      {t:'Inspect against the listing','d':'Weight, materials, finish, smell, function. Listing photos are frequently stolen from a better manufacturer.'},
      {t:'Confirm blind shipping in writing','d':'No supplier invoice, no third-party branding, no promotional inserts in the parcel.'},
      {t:'Read the negative reviews only','d':'Filter to 1–2 stars. You are looking for patterns: wrong item, dead on arrival, no tracking. One angry buyer is noise; forty is a supplier profile.'},
      {t:'Test their failure response','d':'Ask what happens if a parcel is lost in transit. A supplier who will not commit to reship or refund is a supplier who will make that your problem.'},
      {t:'Confirm capacity','d':'Ask directly: can you handle 200 units a day? Suppliers who cannot will still say yes, so ask about their current daily volume instead.'}
    ]},
    {h:'Red flags'},
    {ul:[
      'Refuses to send a sample, or wants you to pay full retail plus shipping for one.',
      'Store opened under 6 months ago with implausibly high ratings.',
      'Listing photos have inconsistent branding or visible watermarks from other sellers.',
      'Communication only through a personal messaging app, no company entity.',
      'Requests payment by wire transfer or crypto with no escrow on a first order.',
      'Cannot provide tracking that updates in the destination country.',
      'Price is dramatically below every other supplier for an identical item.'
    ]},
    {callout:'tip',t:'The upgrade path that separates hobbyists from operators',x:'Start on AliExpress to validate cheaply. The moment a product exceeds roughly 10 orders a day, move it to a sourcing agent. You will typically cut 20–35% off unit cost and 10 days off delivery, and gain custom packaging — three margin improvements from one decision.'},
    {h:'Managing the relationship'},
    {ul:[
      'Keep a backup supplier qualified for every product you sell more than 20 units of per week.',
      'Agree a written SLA: dispatch within 48 hours, tracking within 72, defect rate under 3%.',
      'Ask about factory holidays in advance. Chinese New Year shuts production for 2–4 weeks and catches new sellers out every single year.',
      'Negotiate on volume, not on charm. Show them your order history and ask for tiered pricing.',
      'Never let a supplier hold your customer data beyond what fulfilment requires.'
    ]},
    {callout:'warn',t:'Chinese New Year',x:'Factories close for roughly two to four weeks from late January or February, and the backlog takes another two to three weeks to clear. Either stock a small buffer with a fulfilment partner, switch to a domestic supplier for that window, or pause ads. Sellers who ignore this get a wave of refunds and chargebacks in March.'}
  ]
},
{
  id:'m6', code:'DS-06', title:'Building the Store', mins:11,
  lede:'A storefront is a trust machine. Every element either adds confidence or leaks it.',
  blocks:[
    {h:'Platform choice'},
    {table:{head:['Platform','Monthly','Best for','Trade-off'],rows:[
      ['Shopify Basic','$39 monthly / $29 annual','Almost everyone; best app ecosystem','2% fee if not using Shopify Payments'],
      ['Shopify Grow','$105 monthly / $79 annual','Established stores, lower card rate','Only worth it above meaningful volume'],
      ['WooCommerce','$8–$30 hosting','Full control, lower running cost','You are the sysadmin'],
      ['BigCommerce','$29–$79','Larger catalogues, no transaction fees','Smaller app ecosystem'],
      ['Wix eCommerce','$17–$35','Simplest possible setup','Limited at scale'],
      ['Squarespace','$23–$49','Design-forward, small catalogues','Weak dropshipping integrations']
    ]}},
    {p:'For a first store, Shopify Basic is the correct default. Note the billing trap: the headline $29 is the annual rate — paid monthly it is $39. The extra spend buys an app ecosystem that will save you dozens of hours, and the integration path with every supplier tool is already built. Stay on Basic until the lower card rate on Grow actually saves you more than the $66 monthly difference.'},
    {h:'The launch checklist'},
    {ladder:[
      {t:'Domain and brand name','d':'Short, pronounceable, spellable after hearing it once. Avoid hyphens and numbers. A .com signals more legitimacy than a novelty TLD.'},
      {t:'Logo and visual identity','d':'One typeface, two colours, one accent. Spend two hours, not two weeks. A clean wordmark beats a bad illustration every time.'},
      {t:'Fast, focused theme','d':'Shopify Dawn or a lightweight premium theme. Target sub-2.5s load on mobile. Every 100ms of delay measurably costs conversions.'},
      {t:'Product pages that answer objections','d':'Six or more images, one demo video, benefit-led bullets, size or fitment data, and an FAQ that pre-empts the questions support would otherwise field.'},
      {t:'Trust infrastructure','d':'Visible contact page with a real email address, About page with a genuine story, shipping policy stating honest delivery windows, and a plain-language returns policy.'},
      {t:'Legal pages','d':'Privacy policy, terms of service, refund policy, cookie notice. Shopify generates all four free. Missing pages are a common reason for payment processor rejection.'},
      {t:'Payments','d':'Shopify Payments or Stripe, plus PayPal. Adding PayPal alone typically lifts conversion because a segment of buyers will not enter card details on an unfamiliar site.'},
      {t:'Checkout hygiene','d':'Guest checkout on, minimal required fields, shipping cost shown before the final step, trust badges near the pay button.'},
      {t:'Mobile pass','d':'Test the entire purchase flow on a real phone. Roughly 70–80% of your traffic is mobile and it is where every layout bug lives.'}
    ]},
    {callout:'tip',t:'Niche store beats general store',x:'A store selling only equipment for cold-water swimmers converts better than a store selling everything, even with identical products and identical ads. Specificity reads as expertise, and expertise reads as safety to a first-time buyer.'},
    {h:'Conversion elements that measurably matter'},
    {table:{head:['Element','Typical lift','Effort'],rows:[
      ['Product video on the page','+20–80% conversion','Medium'],
      ['20+ authentic reviews with photos','+15–35%','Low, ongoing'],
      ['Free shipping threshold','+8–20% AOV','Trivial'],
      ['Live chat / fast support widget','+5–15%','Low'],
      ['Sub-3-second mobile load','+7% per second saved','Medium'],
      ['Clear returns policy above the fold','+5–12%','Trivial'],
      ['Post-purchase upsell offer','+8–15% AOV','Low']
    ]}},
    {callout:'warn',t:'Do not install twenty apps',x:'Every app adds script weight and slows your store. Slow stores convert worse. Start with fulfilment, reviews, and email only. Add anything else only when you can name the specific metric it should move.'}
  ]
},
{
  id:'m7', code:'DS-07', title:'Product Research & Selection', mins:12,
  lede:'A winning product is not a lucky find. It is a product that satisfies eight testable conditions.',
  blocks:[
    {h:'The eight conditions'},
    {ladder:[
      {t:'Solves a specific, felt problem','d':'Not "nice to have". The buyer should be able to describe the frustration before they see your ad.'},
      {t:'Has a visible demonstration','d':'The value shows on camera in under 15 seconds, ideally without sound.'},
      {t:'Is hard to find locally','d':'If they can get it at a supermarket today, they will not wait a week for yours.'},
      {t:'Sells at 3x landed cost or better','d':'This is the ad budget. Without it you cannot compete for attention.'},
      {t:'Ships small and light','d':'Under 1kg, compact, non-fragile. Reduces cost, damage rate, and returns.'},
      {t:'Is not seasonally dependent','d':'Or if it is, you know the window and plan the year around it.'},
      {t:'Has supplier proof','d':'500+ orders and a 4.5+ rating on the supplier listing, with recent reviews.'},
      {t:'Is not a warranty or safety liability','d':'Avoid electronics with batteries, anything ingestible, and children\'s items without certification.'}
    ]},
    {h:'Research methods, ranked by usefulness'},
    {table:{head:['Method','How to use it','Signal quality'],rows:[
      ['Meta Ad Library','Search niche keywords, filter to active. Ads running 30+ days are proven winners.','Very high'],
      ['TikTok Creative Center','Free official tool showing top-performing ads by country and category.','Very high'],
      ['Amazon "New Releases"','Momentum, not incumbency. Shows what is gaining, not what already won.','High'],
      ['TikTok organic search','Search the niche plus "review" or "haul". Look at comment counts asking where to buy.','High'],
      ['Reddit complaint threads','Search "recommendations" or "does anyone know" within niche subreddits.','High'],
      ['AliExpress order counts','Proves supply exists. Does not prove Western demand.','Medium'],
      ['Paid spy tools (Minea, AdSpy)','Faster aggregation of the above. Useful, not essential at the start.','Medium-high'],
      ['Pinterest Trends','Early signal for home, craft, wedding and interiors niches.','Medium']
    ]}},
    {callout:'tip',t:'The 30-day ad test',x:'In Meta Ad Library, the single most valuable filter is ad start date. A creative that has been running continuously for over 30 days is being funded by profit. Ads that appear and disappear within a week were losers. This one habit is worth more than most paid research tools.'},
    {h:'Writing a product page that sells'},
    {ul:[
      '<b>Lead with the outcome, not the object.</b> "Stop waking at 3am" outperforms "Weighted 7kg blanket".',
      '<b>Answer the top three objections in the first screen.</b> Usually: does it work, will it fit, and what if I hate it.',
      '<b>Use specificity.</b> "Holds 14 pens and two notebooks" beats "spacious and versatile".',
      '<b>Show scale.</b> Include one photo with a hand or a common object for size reference — a huge driver of returns is size surprise.',
      '<b>Photos: 6+ images minimum.</b> White background hero, in-use lifestyle, close-up detail, size reference, what is in the box, and one with a person.',
      '<b>Never copy the supplier description.</b> It is duplicate content, it is badly translated, and it is written for a wholesaler, not a consumer.'
    ]},
    {callout:'warn',t:'Do not build a store around one product',x:'Single-product stores make excellent case studies and fragile businesses. When the ad account gets restricted or the product saturates, revenue goes to zero the same day. Aim for a hero product plus three to five supporting items in the same niche.'}
  ]
},
{
  id:'m8', code:'DS-08', title:'Pricing & Margin Strategy', mins:10,
  lede:'Price is not a number you pick. It is the output of a calculation that has to fund your advertising.',
  blocks:[
    {p:'The single most common fatal error in dropshipping is pricing off product cost instead of pricing off customer acquisition cost. If it costs you $22 to acquire a buyer, a product priced at $29 cannot work no matter how cheap the supplier is.'},
    {formula:'<em>Landed cost</em>         = Product + Freight + Duty + Brokerage\n<em>Minimum viable price</em> = (Landed cost + Target CPA + Processing) ÷ (1 − target net margin)\n\nExample: landed $18 (incl. $6 duty), CPA $18, processing 3%, target net 20%\n= (18 + 18 + 1.5) ÷ 0.80 = <em>$46.88</em> → price at $49.99'},
    {h:'Multiplier guidance by cost band'},
    {callout:'note',t:'Landed cost means landed',x:'Every figure in the table below assumes landed cost includes duty and brokerage, not just the supplier invoice. If you are using the supplier quote alone, your multipliers are roughly 30–50% too generous.'},
    {table:{head:['Landed cost','Multiplier','Retail range','Gross margin'],rows:[
      ['$1 – $5','4–6x','$9.99 – $29.99','65–80%'],
      ['$5 – $15','3.5–5x','$29.99 – $59.99','55–72%'],
      ['$15 – $30','3–4x','$59.99 – $99.99','48–65%'],
      ['$30 – $60','2.5–3.5x','$99.99 – $179.99','42–58%'],
      ['$60 – $120','2.2–3x','$179.99 – $299.99','38–52%']
    ]}},
    {p:'Multipliers fall as cost rises because absolute margin, not percentage, is what pays for advertising. A 2.5x on a $60 item yields $90 of gross margin — far more ad room than a 5x on a $4 item yielding $16.'},
    {h:'Pricing psychology that actually tests well'},
    {ul:[
      '<b>Charm pricing:</b> $39.99 rather than $40. Small effect, free to implement.',
      '<b>Anchoring:</b> show a compare-at price only if it is genuine. Fake anchors are illegal in many jurisdictions and Meta will reject the ad.',
      '<b>Bundle over discount:</b> "Buy 2, get 1 free" preserves perceived value better than "33% off" while producing the same margin.',
      '<b>Free shipping threshold just above AOV:</b> if your AOV is $48, set the threshold at $60. This is the cheapest AOV increase available.',
      '<b>Tiered quantity pricing:</b> 1 for $34.99, 2 for $59.99, 3 for $79.99. Most buyers take the middle tier.',
      '<b>Post-purchase upsell:</b> a one-click add-on after checkout converts at 10–25% and costs zero additional acquisition.'
    ]},
    {callout:'note',t:'Free shipping is not free',x:'Build shipping cost into the product price and advertise free shipping. Buyers reliably prefer $44.99 shipped to $39.99 plus $5 shipping, even though the total is identical. Surprise costs at checkout are the leading cause of cart abandonment.'},
    {h:'When to discount, and when not to'},
    {table:{head:['Situation','Do','Do not'],rows:[
      ['Launching a new product','Offer a limited founding-customer discount for reviews','Discount permanently'],
      ['Cart abandonment','Email a 10% code after 4 hours','Show the code on-site to everyone'],
      ['Slow month','Bundle to raise AOV','Cut prices across the board'],
      ['Competitor undercuts you','Differentiate on service, speed, guarantee','Race to the bottom'],
      ['Excess supplier stock','Not your problem — you hold no stock','Take on inventory to get a discount']
    ]}},
    {callout:'warn',t:'The margin floor',x:'If your contribution margin after product, shipping and processing is under 50% of retail, you almost certainly cannot afford paid advertising. Either raise the price, find a cheaper supplier, bundle to raise order value, or choose a different product. There is no fourth option.'}
  ]
}
];
