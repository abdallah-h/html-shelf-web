/* ---------- CASE STUDIES ---------- */
function caseScore(c){
  const st = S.cases && S.cases[c.id];
  if(!st || !st.picks) return {got:0,max:c.stages.length*2,done:0};
  let got=0, done=0;
  st.picks.forEach((p,i)=>{ if(p!==null && p!==undefined){ got += c.stages[i].opts[p].s; done++; } });
  return {got, max:c.stages.length*2, done};
}
function viewCases(){
  return `
  <div class="ship-label"><div class="sl-strip"><div class="sl-code">CASES</div>
    <div class="sl-meta"><span>Scenarios <b>${CASES.length}</b></span>
    <span>Decisions <b>${CASES.reduce((a,c)=>a+c.stages.length,0)}</b></span>
    <span class="pill transit">Judgement under pressure</span></div></div>
    <div class="sl-body"><h1>Case studies</h1>
      <p class="sl-lede">Three real store situations, played out one decision at a time. You see the numbers the operator saw, choose what to do, and find out what it cost. Unlike the quizzes, these test sequence and priority rather than recall.</p></div>
    <div class="sl-foot">${barcode('case-studies-dd','sm')}</div></div>
  <div class="modgrid">${CASES.map(c=>{
    const sc = caseScore(c);
    const fin = sc.done===c.stages.length;
    return `<button class="case-card" data-go="#/case/${c.id}">
      <div class="cc-top"><span class="c">${c.code}</span>
        <span class="c">${fin?Math.round(sc.got/sc.max*100)+'%':(sc.done?sc.done+'/'+c.stages.length:'Not started')}</span></div>
      <div class="cc-b"><b>${c.title}</b><span>${c.lede}</span>
        <div class="cc-f"><em>${c.mins} min</em><em>${c.stages.length} decisions</em></div></div>
    </button>`;
  }).join('')}</div>
  <div class="callout tip" style="margin-top:22px"><span class="ct">How to use these</span>
    Choose before you read the feedback, and choose what you would actually do rather than what sounds most impressive. A defensible-but-wrong answer teaches you more than a lucky right one.</div>`;
}

function viewCase(id){
  const c = CASES.find(x=>x.id===id);
  if(!c) return `<div class="empty">Case not found. <button class="btn ghost sm" data-go="#/cases">Back to cases</button></div>`;
  S.cases = S.cases || {};
  const st = S.cases[c.id] || {picks:new Array(c.stages.length).fill(null)};
  const sc = caseScore(c);
  const fin = sc.done === c.stages.length;
  let firstOpen = st.picks.findIndex(p=>p===null||p===undefined);
  if(firstOpen<0) firstOpen = c.stages.length;

  return `
  <div class="dossier">
    <div class="dos-h"><span class="k">${c.code}</span><span class="t">${c.title}</span>
      <span class="sp" style="flex:1"></span>
      <span class="k">${sc.done}/${c.stages.length} decisions</span></div>
    <div class="dos-grid">${c.profile.map(p=>
      `<div class="dos-cell"><span class="l">${p[0]}</span><span class="v">${p[1]}</span></div>`).join('')}</div>
    <div class="dos-brief">${c.brief.join('')}</div>
  </div>

  ${c.stages.map((s,i)=>{
    const pick = st.picks[i];
    const answered = pick!==null && pick!==undefined;
    const locked = i>firstOpen;
    if(locked) return `<div class="stage locked"><div class="st-h">
      <span class="st-n">${String(i+1).padStart(2,'0')}</span>
      <span class="st-when">${s.when}</span></div>
      <div class="st-b"><p class="st-note">Complete the previous decision to continue.</p></div></div>`;
    const cls = k => k===2?'best':k===1?'part':'poor';
    const lbl = k => k===2?'Best call':k===1?'Defensible':'Costly';
    return `<div class="stage"><div class="st-h">
      <span class="st-n">${String(i+1).padStart(2,'0')}</span>
      <span class="st-when">${s.when}</span>
      ${answered?`<span class="sp" style="flex:1"></span><span class="pill ${s.opts[pick].s===2?'done':s.opts[pick].s===1?'transit':'wait'}">${lbl(s.opts[pick].s)}</span>`:''}</div>
      <div class="st-b">
        ${s.metrics?`<div class="metrics">${s.metrics.map(m=>
          `<div class="met"><span class="l">${m.l}</span><span class="v ${m.t||''}">${m.v}</span></div>`).join('')}</div>`:''}
        <p class="st-q">${s.q}</p>
        ${s.opts.map((o,oi)=>{
          let k='';
          if(answered){ k = oi===pick ? ' '+cls(o.s) : (o.s===2?' best dim':' dim'); }
          return `<button class="choice${k}" ${answered?'disabled':''} data-case="${c.id}" data-st="${i}" data-o="${oi}">
            <span class="k">${LET[oi]}</span><span>${o.t}</span></button>`;
        }).join('')}
        ${answered?`<div class="fb ${cls(s.opts[pick].s)}"><span class="tag">${lbl(s.opts[pick].s)}</span>${s.opts[pick].fb}</div>
          ${s.after?`<div class="outcome"><b>What happened next</b>${s.after}</div>`:''}`:''}
      </div></div>`;
  }).join('')}

  ${fin?`${(()=>{const pct=Math.round(sc.got/sc.max*100);const pass=pct>=70;return `
    <div class="receipt"><div class="rc-b">
      <div class="rc-k">${c.code} · Decision Record</div>
      <div class="rc-score">${pct}%</div>
      <div class="rc-of">${sc.got} of ${sc.max} judgement points</div>
      <div><span class="stamp ${pass?'pass':'fail'}">${pass?'Sound':'Review'}</span></div>
      <div class="rc-msg">${pct===100?'Every call was the best available one. That is a genuinely strong result on a case designed to punish the obvious answer.'
        :pass?'Solid judgement overall. Re-read the feedback on anything marked defensible — those are the calls that cost money slowly rather than obviously.'
        :'Several calls would have made the situation worse. Work through the debrief below, then reset and try again with the priority order in mind.'}</div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn ghost sm" data-casereset="${c.id}">Reset case</button>
        <button class="btn ghost sm" data-go="#/cases">All cases</button></div>
    </div><div class="rc-f"><span>Dropship Depot</span><span>Ref ${c.code}</span></div></div>
    <div class="debrief"><h3>Debrief</h3>${c.debrief}</div>`;})()}`:''}

  <div class="pgnav"><button data-go="#/cases"><span class="pn-k">← Back</span>
    <span class="pn-t">All case studies</span></button>
    ${fin?`<button class="r" data-go="#/exam"><span class="pn-k">Next →</span>
    <span class="pn-t">Final exam</span></button>`:'<button disabled class="r"><span class="pn-k">Locked</span><span class="pn-t">Finish the case first</span></button>'}</div>`;
}

/* ---------- GLOSSARY ---------- */
const GLOSS = [
 ['Agentic commerce','Buying carried out by an AI agent acting for a person, from discovery through payment.'],
 ['AOV','Average order value. Revenue divided by orders. Raising it is usually faster than lowering CPA.'],
 ['Card testing','Automated use of your checkout to validate stolen cards. Stopped mostly by CAPTCHA at checkout.'],
 ['Brokerage fee','What a customs broker charges to file an entry. Now applies to individual parcels, not just freight.'],
 ['Blind shipping','Supplier ships with no invoice or third-party branding inside the parcel.'],
 ['Break-even CPA','The contribution margin. Spend more than this per order and you lose money.'],
 ['Break-even ROAS','Retail ÷ contribution margin. The minimum return you must achieve.'],
 ['Chargeback','A customer-initiated payment reversal. Above ~1% puts your processor account at risk.'],
 ['Contribution margin','Retail − landed cost − processing. The money available for ads and overhead.'],
 ['Customs value','The declared value duty is assessed on. Not the same as your retail price.'],
 ['CPA','Cost per acquisition. Ad spend ÷ orders.'],
 ['CPC','Cost per click. Ad spend ÷ link clicks.'],
 ['CPM','Cost per thousand impressions. Rising CPM is the earliest signal of saturation.'],
 ['Creative fatigue','Performance decay as an audience sees the same ad repeatedly. Fix with new angles.'],
 ['CRO','Conversion rate optimisation. Improving the share of visitors who buy.'],
 ['CTR','Click-through rate. Clicks ÷ impressions. Primarily a measure of creative quality.'],
 ['CVR','Conversion rate. Orders ÷ sessions.'],
 ['DDP','Delivered Duty Paid. You pay the duty upfront; the customer owes nothing on delivery. The only acceptable option for consumer retail.'],
 ['DDU / DAP','Duty unpaid. The carrier bills your customer before releasing the parcel. Produces refusals and chargebacks.'],
 ['De minimis','A value threshold below which imports enter duty-free. The US $800 threshold was suspended in 2025; the EU €150 duty exemption ended in July 2026; the UK £135 relief ends by March 2029.'],
 ['EU €3 duty','Interim flat customs duty per item, by tariff line, on goods under €150 entering the EU from 1 July 2026.'],
 ['ePacket','A subsidised China-to-West postal service. Cheap, slow, largely superseded by agent lines.'],
 ['GPSR','EU General Product Safety Regulation. Requires an EU-established responsible person for every consumer product.'],
 ['HTS code','Harmonized Tariff Schedule classification. A 10-digit code that determines the duty rate on your product.'],
 ['IOSS','Import One-Stop Shop. Lets you collect EU VAT at checkout and remit it in one return for consignments up to €150.'],
 ['Fulfilment','Picking, packing and shipping. In dropshipping, entirely the supplier\'s job.'],
 ['Landed cost','Product + freight + duty + tariff + brokerage. Since 2025 the duty line is never zero for imports.'],
 ['Learning phase','The period where an ad platform gathers ~50 conversions to stabilise delivery. Do not edit during it.'],
 ['Lookalike audience','An audience built to resemble a customer list you upload. Seed it with your best customers only.'],
 ['LTV','Lifetime value. Total revenue per customer. Determines how much you can afford to pay for acquisition.'],
 ['MOQ','Minimum order quantity. Relevant once you move to private label.'],
 ['Private label','Selling a manufacturer\'s product under your own brand, usually with an MOQ.'],
 ['ROAS','Return on ad spend. Ad revenue ÷ ad spend. Must be read against break-even, never in isolation.'],
 ['Responsible person','Under GPSR, the EU-established operator accountable for a product. Dropshippers usually have to appoint one.'],
 ['Rolling reserve','A processor withholding a share of your revenue as protection against disputes.'],
 ['Section 321','The US provision that created the $800 de minimis exemption. Suspended since 2025.'],
 ['SKU','Stock keeping unit. A unique product variant identifier.'],
 ['Structured product data','Machine-readable attributes — dimensions, materials, price, stock. What shopping agents actually match against.'],
 ['3D Secure','A checkout authentication step that shifts liability for disputed transactions to the card issuer.'],
 ['Sourcing agent','A partner who buys from factories on your behalf, usually cheaper and faster than a marketplace.'],
 ['Thumbstop rate','Share of impressions watched for 3+ seconds. A direct measure of hook strength.'],
 ['Upsell (post-purchase)','A one-click offer shown after checkout. Adds AOV at zero acquisition cost.'],
 ['Whitelisting','Running ads from a creator\'s own handle rather than your brand account.']
];
function viewGlossary(){
  return `
  <div class="ship-label"><div class="sl-strip"><div class="sl-code">REF</div>
    <div class="sl-meta"><span>Terms <b>${GLOSS.length}</b></span><span>Formulas <b>11</b></span><span class="pill done">Reference</span></div></div>
    <div class="sl-body"><h1>Glossary &amp; formulas</h1>
      <p class="sl-lede">Every term and calculation used in the course, in one place.</p></div>
    <div class="sl-foot">${barcode('glossary-dd','sm')}</div></div>
  <div class="prose"><h3>The formulas that matter</h3></div>
  <div class="formula"><em>Landed cost</em>         = Product + Freight + Duty + Tariff + Brokerage
<em>Duty</em>                = Customs value × HTS rate
<em>Contribution margin</em> = Retail − Landed cost − Processing
<em>Break-even CPA</em>      = Contribution margin
<em>Break-even ROAS</em>     = Retail ÷ Contribution margin
<em>Max profitable CPA</em>  = Contribution margin × (1 − target net margin)
<em>Minimum viable price</em>= (Landed cost + Target CPA + Processing) ÷ (1 − target net margin)
<em>Break-even ROAS shift</em> = old BE ROAS × (old margin ÷ new margin after duty)
<em>Net profit per order</em>= Contribution margin − CPA − Refund reserve − Overhead
<em>ROAS</em>                = Ad revenue ÷ Ad spend
<em>LTV</em>                 = Contribution margin × Average orders per customer</div>
  <div class="prose"><h3>Terms</h3></div>
  <div class="tbl-wrap"><table><thead><tr><th scope="col" style="width:22%">Term</th><th scope="col">Meaning</th></tr></thead>
  <tbody>${GLOSS.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td></tr>`).join('')}</tbody></table></div>`;
}

  nav.innerHTML = `

      <span class="node"></span><span class="code">${m.code}</span>${m.title}</button>`).join('')}
    <div class="nav-group"><span>Practice</span><i></i></div>
    <button class="navlink${route==='#/toolkit'?' active':''}" data-go="#/toolkit"><span class="ic">▤</span>Calculators<span class="badge">5</span></button>
    <button class="navlink${route==='#/cases'||route.startsWith('#/case/')?' active':''}" data-go="#/cases"><span class="ic">▨</span>Case studies<span class="badge">${CASES.length}</span></button>
    <button class="navlink${route==='#/exam'?' active':''}" data-go="#/exam"><span class="ic">◉</span>Final exam<span class="badge">${EXAM.length}</span></button>
    <div class="nav-group"><span>Interview prep</span><i></i></div>
    <button class="navlink${route==='#/interview'?' active':''}" data-go="#/interview"><span class="ic">✦</span>Question bank<span class="badge">${INTERVIEWS.length}</span></button>
    <button class="navlink${route==='#/flashcards'?' active':''}" data-go="#/flashcards"><span class="ic">▭</span>Flashcards</button>
    <button class="navlink${route==='#/glossary'?' active':''}" data-go="#/glossary"><span class="ic">§</span>Glossary</button>`;
  const p = progressPct();
  $('#rpVal').textContent = p+'%';
  $('#rpFill').style.width = p+'%';
}

function crumbFor(route){
  if(route==='#/') return 'Dashboard';
  if(route.startsWith('#/m/')){
    const m = COURSE.find(x=>x.id===route.slice(4));
    return m ? `Curriculum / <b>${m.code} — ${m.title}</b>` : 'Curriculum';
  }
  if(route.startsWith('#/case/')){
    const c = CASES.find(x=>x.id===route.slice(7));
    return c ? `Case studies / <b>${c.code} — ${c.title}</b>` : 'Case studies';
  }
  const map = {'#/exam':'Practice / <b>Final exam</b>','#/toolkit':'Practice / <b>Calculators</b>',
    '#/cases':'Practice / <b>Case studies</b>',
    '#/interview':'Interview prep / <b>Question bank</b>','#/flashcards':'Interview prep / <b>Flashcards</b>',
    '#/glossary':'Reference / <b>Glossary</b>'};
  return map[route] || 'Dropship Depot';
}

function render(){
  try{ renderInner(); }
  catch(err){
    console.error('Render failed:', err);
    const v = $('#view');
    if(v) v.innerHTML = `<div class="notice" style="background:var(--postal-soft);border-color:var(--postal)">
      <b>Something went wrong rendering this page.</b><br>
      <span class="mono" style="font-size:12px">${esc(err && err.message ? err.message : String(err))}</span><br><br>
      <button class="btn ghost sm" data-go="#/">Back to dashboard</button></div>`;
  }
}

function footNav(route){
  const items = [['#/','Dashboard'],['#/cases','Cases'],['#/toolkit','Calculators'],
                 ['#/exam','Exam'],['#/interview','Interview'],['#/glossary','Glossary']];
  return `<nav class="footnav" aria-label="Page navigation">
    <span class="fl">Go to</span>
    ${items.filter(i=>i[0]!==route).map(i=>`<button data-go="${i[0]}">${i[1]}</button>`).join('')}
    <span class="sp"></span><button id="toTop" aria-label="Back to top">↑ Top</button></nav>`;
}

function renderInner(){
  const r = ROUTE || '#/';
  let html;
  if(r==='#/') html = viewHome();
  else if(r.startsWith('#/m/')) html = viewModule(r.slice(4));
  else if(r==='#/exam') html = viewExam();
  else if(r==='#/toolkit') html = viewToolkit();
  else if(r==='#/interview') html = viewInterview();
  else if(r==='#/flashcards') html = viewFlash();
  else if(r==='#/cases') html = viewCases();
  else if(r.startsWith('#/case/')) html = viewCase(r.slice(7));
  else if(r==='#/glossary') html = viewGlossary();
  else html = `<div class="empty">Page not found. <button class="btn ghost sm" data-go="#/">Back to dashboard</button></div>`;
  $('#view').innerHTML = html + footNav(r);
  $('#crumb').innerHTML = crumbFor(r);
  renderRail(r);
  document.querySelectorAll('[data-calc]').forEach(el=>runCalc(el.dataset.calc));
  if(document.querySelector('[data-scale]')) runScale();
  if(r.startsWith('#/m/')){ const id=r.slice(4); if(!S.seen[id]){ S.seen[id]=1; save(); } }
}

/* ROUTE is the source of truth. The URL hash is a best-effort mirror so that
   back/forward and deep links work where permitted — but assigning it throws
   in some sandboxed iframes, so navigation must never depend on it. */
let ROUTE = '#/';
let hashUsable = true;

/* Bring the top of the app into view in whichever container is actually scrolling.
   window.scrollTo only moves this document; scrollIntoView also moves an ancestor
   (for example a chat page hosting this app in a content-sized iframe). */
function scrollToTop(){
  /* 'instant' overrides the CSS smooth scrolling, which would otherwise animate
     every page change up through the newly rendered content */
  try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }
  catch(e){ try{ window.scrollTo(0,0); }catch(e2){} }
  /* A zero-height sentinel at the very top. The sticky topbar cannot be used for
     this because its rect is never above the viewport. 'nearest' means: do nothing
     if it is already visible, otherwise scroll whichever ancestor is hiding it —
     including a parent page hosting this app in a content-sized iframe. */
  try{
    const s = document.getElementById('topSentinel');
    if(s && s.scrollIntoView) s.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
  }catch(e){}
}

function setHash(v){
  if(!hashUsable) return;
  try{ if(location.hash !== v) location.hash = v; }
  catch(e){ hashUsable = false; }
}

function nav(h, keepScroll){
  ROUTE = h;
  setHash(h);
  render();
  if(!keepScroll) scrollToTop();
  closeRail();
}
function rerender(keepY){
  const y = window.scrollY;
  render();
  if(keepY) window.scrollTo({top:y,behavior:'instant'});
}
function closeRail(){ $('#rail').classList.remove('open'); $('#scrim').classList.remove('on'); }

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-mcq],[data-ord],[data-ordslot],[data-ordcheck],[data-ordreset],[data-sortpick],[data-sortbin],[data-sortback],[data-sortcheck],[data-sortreset],[data-chk],[data-chkreset],[data-exreset],[data-exam],[data-cat],[data-qa],[data-fcat],[data-scale],[data-case],[data-casereset],#startExam,#submitExam,#submitExam2,#retakeExam,#jumpUnanswered,#fcPrev,#fcNext,#fcShuffle,#fcard,#burger,#scrim,#resetBtn,#exportProg,#importProg,#toTop');
  if(!t) return;
  const d = t.dataset;

  if(t.id==='toTop'){ scrollToTop(); return; }
  if(t.id==='burger'){ $('#rail').classList.add('open'); $('#scrim').classList.add('on'); return; }
  if(t.id==='scrim'){ closeRail(); return; }
  if(t.id==='exportProg'){
    try{
      const blob = new Blob([JSON.stringify({app:'dropship-depot',v:1,saved:new Date().toISOString(),state:S},null,2)],
        {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dropship-depot-progress.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      const m=$('#dataMsg'); if(m) m.textContent='Exported';
    }catch(err){ const m=$('#dataMsg'); if(m) m.textContent='Export failed'; }
    return;
  }
  if(t.id==='importProg'){ $('#importFile')?.click(); return; }
  if(t.id==='resetBtn'){
    if(confirm('Reset all progress, exercise answers and exam results?')){
      S = JSON.parse(JSON.stringify(DEFAULT_STATE)); examState=null; save(); nav('#/');
    } return;
  }
  if(d.go!==undefined){ nav(d.go); return; }

  /* MCQ */
  if(d.mcq!==undefined){
    const k=d.mcq, qi=+d.q, oi=+d.o;
    const [mid,ii] = k.split(':'); const ex = EXERCISES[mid][+ii];
    S.ex[k] = S.ex[k] || {ans:new Array(ex.items.length).fill(null)};
    if(S.ex[k].ans[qi]!==null) return;
    S.ex[k].ans[qi]=oi;
    if(S.ex[k].ans.every(a=>a!==null)) S.ex[k].done=true;
    save(); rerender(true); return;
  }

  /* ORDER */
  if(d.ord!==undefined){
    const k=d.ord, i=+d.i;
    const [mid,ii]=k.split(':'); const ex=EXERCISES[mid][+ii];
    S.ex[k] = S.ex[k] || {placed:new Array(ex.items.length).fill(null)};
    const slot = S.ex[k].placed.indexOf(null);
    if(slot>-1){ S.ex[k].placed[slot]=i; save(); rerender(true); } return;
  }
  if(d.ordslot!==undefined){
    const k=d.ordslot, s=+d.s;
    if(S.ex[k] && S.ex[k].placed[s]!==null){ S.ex[k].placed[s]=null; save(); rerender(true); } return;
  }
  if(d.ordcheck!==undefined){ S.ex[d.ordcheck].done=true; save(); rerender(true); return; }
  if(d.ordreset!==undefined){ delete S.ex[d.ordreset]; save(); rerender(true); return; }

  /* SORT */
  if(d.sortpick!==undefined){
    const k=d.sortpick, i=+d.i;
    S.ex[k]=S.ex[k]||{pl:{}};
    S.ex[k].sel = (S.ex[k].sel===i)?null:i; save(); rerender(true); return;
  }
  if(d.sortbin!==undefined || (t.closest('[data-sortbin]') && d.sortback===undefined)){
    const bin = t.closest('[data-sortbin]'); if(!bin) return;
    const k=bin.dataset.sortbin, b=+bin.dataset.b;
    if(S.ex[k] && S.ex[k].sel!==null && S.ex[k].sel!==undefined){
      S.ex[k].pl[S.ex[k].sel]=b; S.ex[k].sel=null; save(); rerender(true);
    } return;
  }
  if(d.sortback!==undefined){
    const k=d.sortback, i=+d.i;
    if(S.ex[k]){ delete S.ex[k].pl[i]; save(); rerender(true); } return;
  }
  if(d.sortcheck!==undefined){ S.ex[d.sortcheck].done=true; S.ex[d.sortcheck].sel=null; save(); rerender(true); return; }
  if(d.sortreset!==undefined){ delete S.ex[d.sortreset]; save(); rerender(true); return; }

  /* CHECKLIST */
  if(d.chk!==undefined){
    const k=d.chk, j=+d.j;
    S.chk[k]=S.chk[k]||{};
    S.chk[k][j] = !S.chk[k][j];
    if(!S.chk[k][j]) delete S.chk[k][j];
    save();
    /* update in place — a full re-render on every tick loses scroll and feels sluggish */
    t.classList.toggle('on', !!S.chk[k][j]);
    const [mid,ii] = k.split(':');
    const ex = EXERCISES[mid] && EXERCISES[mid][+ii];
    const panel = t.closest('.practice');
    if(ex && panel){
      const n = ex.items.filter((_,x)=>S.chk[k][x]).length;
      const sc = panel.querySelector('.score');
      if(sc) sc.textContent = `${n}/${ex.items.length} complete`;
    }
    renderRail(ROUTE||'#/');
    return;
  }
  if(d.chkreset!==undefined){ delete S.chk[d.chkreset]; save(); rerender(true); return; }
  if(d.exreset!==undefined){ delete S.ex[d.exreset]; save(); rerender(true); return; }

  /* CASE STUDIES */
  if(d.case!==undefined){
    const cid=d.case, si=+d.st, oi=+d.o;
    const c = CASES.find(x=>x.id===cid); if(!c) return;
    S.cases = S.cases || {};
    S.cases[cid] = S.cases[cid] || {picks:new Array(c.stages.length).fill(null)};
    if(S.cases[cid].picks[si]!==null && S.cases[cid].picks[si]!==undefined) return;
    S.cases[cid].picks[si]=oi; save(); rerender(true); return;
  }
  if(d.casereset!==undefined){
    if(S.cases) delete S.cases[d.casereset];
    save(); render(); scrollToTop(); return;
  }

  /* SCALE gate (not persisted — a live tool) */
  if(d.scale!==undefined){
    const i=+d.scale; S.gate = S.gate||{}; S.gate[i] = !S.gate[i];
    if(!S.gate[i]) delete S.gate[i];
    t.classList.toggle('on', !!S.gate[i]); t.setAttribute('aria-pressed', !!S.gate[i]);
    save(); runScale(); return;
  }

  /* EXAM */
  if(t.id==='startExam'){ examState={ans:new Array(EXAM.length).fill(null),submitted:false}; rerender(); scrollToTop(); return; }
  if(d.exam!==undefined){ examState.ans[+d.exam]=+d.o; rerender(true); return; }
  if(t.id==='submitExam'||t.id==='submitExam2'){
    examState.submitted=true;
    const c = EXAM.filter((q,i)=>examState.ans[i]===q.a).length;
    const pct = Math.round(c/EXAM.length*100);
    if(!S.exam || pct>S.exam.pct) S.exam={pct,c,total:EXAM.length};
    save(); rerender(); scrollToTop(); return;
  }
  if(t.id==='jumpUnanswered'){
    const i = examState.ans.findIndex(a=>a===null);
    if(i>-1){
      const el = document.getElementById('eq-'+i);
      if(el){ if(el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'});
        el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1200);
        el.querySelector('.opt')?.focus(); }
    }
    return;
  }
  if(t.id==='retakeExam'){ examState={ans:new Array(EXAM.length).fill(null),submitted:false}; rerender(); scrollToTop(); return; }

  /* INTERVIEW */
  if(d.cat!==undefined){ ivCat=+d.cat; rerender(); return; }
  if(d.qa!==undefined){ const i=+d.qa; ivOpen[i]=!ivOpen[i]; rerender(true); return; }

  /* FLASHCARDS */
  if(d.fcat!==undefined){ fcCat=+d.fcat; fcOrder=null; fcIdx=0; fcFlip=false; rerender(); return; }
  if(t.id==='fcard'){ fcFlip=!fcFlip; document.getElementById('fcard').classList.toggle('flip'); return; }
  if(t.id==='fcPrev'){ const l=fcList(); fcIdx=(fcIdx-1+l.length)%l.length; fcFlip=false; rerender(true); return; }
  if(t.id==='fcNext'){ const l=fcList(); fcIdx=(fcIdx+1)%l.length; fcFlip=false; rerender(true); return; }
  if(t.id==='fcShuffle'){ const l=fcList(); fcOrder=l.map((_,i)=>i);
    for(let i=fcOrder.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [fcOrder[i],fcOrder[j]]=[fcOrder[j],fcOrder[i]]; }
    fcIdx=0; fcFlip=false; rerender(true); return; }
});

document.addEventListener('input', e=>{
  if(e.target.dataset && e.target.dataset.calc) runCalc(e.target.dataset.calc);
  if(e.target.id==='ivSearch'){
    ivQuery = e.target.value;
    const y=window.scrollY; render(); window.scrollTo(0,y);
    const inp=$('#ivSearch'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
  }
});

/* import file */
document.addEventListener('change', e=>{
  if(e.target.id!=='importFile') return;
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      const st = d && d.state ? d.state : d;
      if(!st || typeof st!=='object' || !('ex' in st || 'chk' in st)) throw new Error('bad file');
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), st);
      save(); render();
      const m=$('#dataMsg'); if(m) m.textContent='Imported — '+progressPct()+'% restored';
    }catch(err){
      const m=$('#dataMsg'); if(m) m.textContent='That file could not be read. Use a file exported from this app.';
    }
  };
  fr.readAsText(f);
  e.target.value='';
});

/* keyboard: flashcards + generic role=button */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;

  if(e.target.id==='fcard' && (e.key===' '||e.key==='Enter')){
    e.preventDefault(); fcFlip=!fcFlip;
    e.target.classList.toggle('flip'); e.target.setAttribute('aria-pressed',fcFlip); return;
  }
  if(ROUTE==='#/flashcards'){
    const l = fcList();
    if(e.key==='ArrowRight'){ e.preventDefault(); fcIdx=(fcIdx+1)%l.length; fcFlip=false; rerender(true); $('#fcard')?.focus(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); fcIdx=(fcIdx-1+l.length)%l.length; fcFlip=false; rerender(true); $('#fcard')?.focus(); }
    else if(e.key==='s'||e.key==='S'){ e.preventDefault(); $('#fcShuffle')?.click(); }
    return;
  }
  if(e.key==='Escape' && $('#rail').classList.contains('open')){ closeRail(); $('#burger')?.focus(); }
});

window.addEventListener('pagehide', ()=>{
  if(storeKind==='local'){ try{ clearTimeout(saveTimer); localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
});

window.addEventListener('hashchange', ()=>{
  let hv;
  try{ hv = location.hash || '#/'; }catch(e){ return; }
  if(!hv.startsWith('#/')) return;   /* e.g. the skip link anchor — not a route */
  if(hv === ROUTE) return;           /* our own setHash, already rendered */
  ROUTE = hv;
  render();
  scrollToTop();
  const v = $('#view'); if(v && v.focus) v.focus();
});

/* ============================================================
   BOOT
   ============================================================ */
(async function(){
  await loadState();
  try{
    if(location.hash && location.hash.startsWith('#/')) ROUTE = location.hash;
  }catch(e){ hashUsable = false; }
  setHash(ROUTE);
  render();
})();
