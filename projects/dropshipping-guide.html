const IV_CATS = ['Fundamentals','Product & Niche','Suppliers & Ops','Marketing & Ads','Analytics & Finance','Scaling & Strategy','Situational','Behavioural','Trade & Compliance'];

const INTERVIEWS = [
/* ---------- FUNDAMENTALS ---------- */
{c:0,q:'Explain dropshipping to someone who has never heard of it.',a:'<p>Dropshipping is a retail fulfilment method where the seller never holds inventory. The customer buys from my store, I forward the order and address to a supplier, I pay them the wholesale price, and they ship directly to the customer under my branding.</p><p>The important framing is that I am not being paid to move boxes — the supplier does that. I am being paid for demand generation and for owning the trust relationship. Everything about how the model behaves, including why margins are thinner than wholesale, follows from that.</p>',tag:'Definition'},
{c:0,q:'How does dropshipping differ from Amazon FBA, wholesale and private label?',a:'<ul><li><b>Dropshipping</b> — no inventory, $100–$500 to start, 15–40% margin, lowest control.</li><li><b>Wholesale/arbitrage</b> — you buy stock, $1k–$10k, 25–50%, medium control.</li><li><b>Amazon FBA</b> — you buy and ship into Amazon, $3k–$20k, 25–45%, Amazon owns the customer.</li><li><b>Private label</b> — you commission production, $5k–$50k, 40–70%, highest control and defensibility.</li></ul><p>The trade is consistent: capital and control move together. Dropshipping buys speed and low risk at the cost of margin and control. I treat it as a validation layer, not an end state.</p>',tag:'Comparison'},
{c:0,q:'Is dropshipping still viable, or is it saturated?',a:'<p>The 2016 version is dead — general stores, random gadgets, 30-day epackets, cheap Meta clicks. What replaced it is narrower and more disciplined: branded niche stores, 5–10 day fulfilment through agents or domestic suppliers, content-led acquisition alongside paid, higher AOV through bundling, and a deliberate path toward private label.</p><p>Saturation is real at the product level and false at the market level. Specific hero products saturate within weeks. Categories do not. The defensible position is a brand with an audience, not a listing.</p>',tag:'Market view'},
{c:0,q:'What is the biggest misconception about dropshipping?',a:'<p>That cost of goods is your cost. If a product costs $8 and it takes $16 of advertising to sell one, your real cost per unit is $24. Stores go bankrupt while their revenue dashboard looks healthy, because the dashboard does not show ad spend.</p><p>The correct mental model is that customer acquisition cost is a cost of goods. Once you price that way, most bad product decisions filter themselves out automatically.</p>',tag:'Economics'},
{c:0,q:'What are the main legal and compliance considerations?',a:'<ul><li><b>Business registration and tax</b> — register properly, and understand sales tax or VAT nexus in the markets you sell into.</li><li><b>Required policies</b> — privacy, terms, refunds, cookies. Missing pages are a common cause of payment processor rejection.</li><li><b>Consumer protection</b> — accurate delivery estimates and honest compare-at prices. Fake anchors and fake scarcity are regulated in the EU, UK and increasingly the US.</li><li><b>Product compliance</b> — CE, UKCA, FCC and CPSC requirements depending on category, especially for children\'s items and electronics.</li><li><b>IP</b> — never sell branded or lookalike goods. This is the fastest route to account seizure and legal exposure.</li><li><b>Data</b> — GDPR and CCPA obligations for customer data; suppliers should receive only what fulfilment requires.</li></ul>',tag:'Compliance'},
{c:0,q:'Who actually carries the risk in a dropshipping arrangement?',a:'<p>It splits cleanly. The supplier carries inventory capital and production risk. I carry ad spend, refunds, chargebacks, brand reputation and platform risk. The customer carries only the delivery wait.</p><p>What people miss is that my risk is the more volatile kind. Inventory is a known number. Ad costs, ad account bans, and processor holds are not — they can change without warning and are largely outside my control. That asymmetry is why redundancy in ad accounts, suppliers and products matters so much.</p>',tag:'Risk'},

/* ---------- PRODUCT & NICHE ---------- */
{c:1,q:'Walk me through how you would choose a niche.',a:'<p>I run seven filters, and a niche has to pass all of them:</p><ol><li><b>Identifiable audience</b> — I can describe the buyer in one sentence and name three places they gather.</li><li><b>$30–$200 price band</b> — enough margin to fund ads, low enough consideration to buy from a stranger.</li><li><b>3x landed cost or better</b> — that gap is the ad budget.</li><li><b>Not owned by Amazon</b> — if the first page is Amazon, Walmart and Target with the same item cheaper, I walk.</li><li><b>Repeat or expansion potential</b> — otherwise I pay full price for every single sale forever.</li><li><b>Demonstrable in 15 seconds</b> — if it does not show on silent video, paid social will be brutal.</li><li><b>Stable five-year trend</b> — flat is fine, declining is a trap dressed as low competition.</li></ol><p>When two niches score equally, I take the one I know personally. Domain knowledge shows up in angles and copy, and competitors cannot buy it.</p>',tag:'Process'},
{c:1,q:'What makes a winning product?',a:'<p>Eight conditions, all testable rather than intuitive: it solves a specific felt problem; it demonstrates visually in under 15 seconds; it is hard to buy locally; it sells at 3x landed cost or better; it ships small and light; it is not seasonally dependent; it has supplier proof of roughly 500+ orders at 4.5★ with recent reviews; and it carries no warranty or safety liability.</p><p>The one people skip is the third. If a customer can buy it at a supermarket this afternoon, no amount of ad spend will make them wait a week for yours.</p>',tag:'Selection'},
{c:1,q:'How do you research products without paid tools?',a:'<p>Meta Ad Library is the most valuable free tool that exists. I search niche keywords, filter to active ads, and sort by how long they have been running — anything live for 30+ days is funded by profit. Ads that appear and vanish inside a week were losers.</p><p>Alongside that: TikTok Creative Center for top-performing ads by country, Amazon New Releases for momentum rather than incumbency, TikTok organic search reading comment volume asking where to buy, and Reddit complaint threads — every "does anyone know something that fixes X" is a product brief.</p><p>Paid tools like Minea just aggregate this faster. They are useful, not essential.</p>',tag:'Research'},
{c:1,q:'A niche has almost no competitors. Is that good?',a:'<p>Almost always bad. Absence of competition usually means absence of demand or absence of margin. Healthy competition is evidence that money is being made — my job is differentiation, not avoidance.</p><p>The exception is genuinely underserved segments, like adaptive or accessibility products, where low competition reflects a market that has been overlooked rather than tested and rejected. But I would want direct evidence of demand — search volume, active communities, unmet complaints — before treating an empty market as opportunity.</p>',tag:'Judgement'},
{c:1,q:'Which categories would you avoid, and why?',a:'<ul><li><b>Ingestibles and topicals</b> — liability, regulatory burden, and heavy ad restrictions on health claims.</li><li><b>Electronics with batteries</b> — shipping restrictions, warranty expectations, high defect rates.</li><li><b>Branded or lookalike goods</b> — IP seizure risk.</li><li><b>Weapons, vapes, CBD</b> — payment processor bans.</li><li><b>Children\'s products without certification</b> — safety compliance you cannot verify through a dropship supplier.</li><li><b>Fragile or oversized items</b> — breakage and freight destroy margin.</li><li><b>Anything requiring fitment without a fitment database</b> — return rates become unmanageable.</li></ul>',tag:'Risk'},
{c:1,q:'How do you handle a product becoming saturated?',a:'<p>I expect it, so the response is planned rather than reactive. First, saturation shows up as rising CPM and falling CTR on a stable creative — that is the trigger to act, before ROAS collapses.</p><p>The responses in order of preference: new creative angles targeting a different segment of the same market; bundling to change the offer so a price comparison no longer works; moving to an agent for custom packaging and a version competitors cannot list; and expanding into an adjacent product for the same audience I have already built an email list around.</p><p>What I would not do is cut price. That is a race I cannot win against someone with a better supplier.</p>',tag:'Strategy'},

/* ---------- SUPPLIERS & OPS ---------- */
{c:2,q:'How do you vet a supplier?',a:'<p>Seven steps. I message first with three specific questions on lead time, defect policy and packaging — response speed and clarity now predicts crisis behaviour later. I order samples from at least two competing suppliers for the same product, timing actual delivery and photographing packaging as received. I inspect against the listing, because photos are frequently stolen from a better manufacturer.</p><p>Then I confirm blind shipping in writing, filter reviews to 1–2 stars looking for patterns rather than individual complaints, ask specifically what happens if a parcel is lost, and ask about their current daily volume to gauge real capacity — suppliers who cannot handle scale will still say they can.</p>',tag:'Process'},
{c:2,q:'What are your supplier red flags?',a:'<ul><li>Refuses samples, or wants full retail plus expedited shipping for one.</li><li>Store under six months old with implausibly high ratings.</li><li>Listing photos with inconsistent branding or other sellers\' watermarks.</li><li>Communication only via personal messaging app, no company entity.</li><li>Wire or crypto payment requested with no escrow on a first order.</li><li>Tracking that does not update in the destination country.</li><li>Price dramatically below every other supplier for an identical item.</li><li>Vague or evasive answers about what happens when something goes wrong.</li></ul>',tag:'Red flags'},
{c:2,q:'When and why would you move off AliExpress?',a:'<p>Once a product consistently exceeds about 10 orders a day. At that point a sourcing agent typically cuts 20–35% off unit cost and 7–10 days off delivery, and unlocks custom packaging — three margin improvements from one decision.</p><p>The delivery improvement usually matters more than the cost saving, because faster shipping directly reduces the "where is my order" tickets and chargebacks that threaten payment processing. I would make that move even if unit cost stayed flat.</p>',tag:'Sourcing'},
{c:2,q:'How do you handle Chinese New Year?',a:'<p>I plan for it in November, not February. Factories close for roughly two to four weeks and the backlog takes another two to three weeks to clear, so the real disruption window is closer to six weeks.</p><p>Three options depending on the store: stock a small buffer with a third-party fulfilment partner, switch the hero product to a domestic supplier for the window, or reduce ad spend and communicate extended timelines honestly. What I would not do is keep advertising normal delivery promises — that produces a wave of March refunds and chargebacks, which is exactly when new sellers lose their processor.</p>',tag:'Operations'},
{c:2,q:'How do you keep customer service from becoming a crisis at scale?',a:'<p>By treating it as risk management rather than a cost centre. The standard is a 24-hour response, a branded support address, honest delivery windows stated before purchase, and proactive updates at dispatch, customs and out-for-delivery — silence is what causes disputes.</p><p>Operationally: a macro library covering the eight questions that make up most volume, automated fulfilment before I need it, a branded tracking page to keep customers on my domain, and a real helpdesk once I exceed about 30 tickets a week. I also keep a refund log with reason codes, which is how you discover that 40% of refunds come from one product.</p>',tag:'Support'},
{c:2,q:'What is your policy on refunds?',a:'<p>Generous and fast below roughly $40. A $30 refund is always cheaper than a chargeback, which costs the refund plus a $15–25 fee plus a mark against a processor account I cannot easily replace.</p><p>Specifically: past my stated delivery window, the customer gets an immediate choice of reship or refund. Wrong item, I ship the correct one and let them keep the wrong one if return shipping exceeds product cost. Damaged, one photo and it is resolved the same day. No-fault returns, I honour them or offer a partial refund to keep the item.</p><p>The discipline is that I track every one with a reason code, so generosity does not hide a product problem.</p>',tag:'Policy'},

/* ---------- MARKETING & ADS ---------- */
{c:3,q:'Walk me through how you would test a new product with paid ads.',a:'<ol><li><b>Produce 3–5 genuinely distinct creative angles</b> — problem-agitation, before-and-after, unboxing, testimonial, founder-to-camera. Different angles, not colour variations.</li><li><b>Launch one campaign, 2–3 broad ad sets</b>, all creatives inside, $10–20 per ad set per day. Modern algorithms find the audience better than my interest guesses.</li><li><b>Do not touch it for 72 hours.</b> The learning phase needs roughly 50 conversion events.</li><li><b>Diagnose by funnel stage</b> — CTR, then add-to-cart, then checkout completion. Each stage has different fixes.</li><li><b>Kill below break-even after 3–5 days and $50–100 spend</b>, reallocate to the winner, and produce three new creatives in that winning angle.</li><li><b>Add retargeting only once there is meaningful traffic</b> — below about 1,000 monthly visitors it will not spend properly.</li></ol>',tag:'Framework'},
{c:3,q:'Your CTR is 0.5%. What do you do?',a:'<p>That is a creative problem, definitively — nobody has reached the site, so the page cannot be at fault. The hook is not stopping the scroll.</p><p>I would not change the audience, which is the common reflex. I would produce new angles: different opening frame, different problem framing, different format entirely. I would also check the first two seconds specifically, since that is where the decision is made, and look at the 3-second view rate to separate "the hook failed" from "the whole ad failed".</p>',tag:'Diagnosis'},
{c:3,q:'Good CTR, good add-to-cart, but checkout completion is 38%. What is wrong?',a:'<p>Something at the payment step is breaking the deal. In order of likelihood: an unexpected shipping cost appearing at the final step, forced account creation, a missing payment method the buyer trusts, insufficient trust signals near the pay button, or a mobile-specific bug.</p><p>I would test the flow myself on a real phone first — that finds it more often than analytics does — then check whether express payment options like PayPal, Shop Pay or Apple Pay are enabled, and whether shipping cost is shown before the final step.</p>',tag:'Diagnosis'},
{c:3,q:'How much of paid social performance is creative versus targeting?',a:'<p>Roughly 80% creative. Targeting has been largely automated — broad targeting with good creative consistently beats narrow targeting with weak creative. Two advertisers with identical settings and different creative routinely see multiples of difference in result.</p><p>The practical implication is that creative production volume is the real constraint on growth. If a campaign is failing, the answer is almost never a new audience. I plan for continuous creative output rather than treating it as a one-off launch task.</p>',tag:'Strategy'},
{c:3,q:'What is your view on organic TikTok for a new store?',a:'<p>It is the best free validation channel available and I would use it before spending on ads. Posting daily with my own footage tells me which angles resonate at zero cost and builds a creative library I will reuse in paid.</p><p>The mechanics that matter: the first two seconds decide everything, so open on the most surprising visual and never on a logo. Shoot vertical and handheld — over-produced content underperforms there. Formats that work are problem-then-solution, unexpected use case, honest review, and satisfying process shots. And I read the comments as research: "where did you get that" is demand signal, "how much" is pricing research.</p>',tag:'Channels'},
{c:3,q:'How would you structure email and SMS flows?',a:'<p>Paid traffic buys the first order; owned channels make the rest at near-zero cost. A store at 25–35% of revenue from email and SMS is a fundamentally different business from one at 5%.</p><ul><li><b>Welcome series</b> (3–4 emails) on capture.</li><li><b>Abandoned cart</b> (3 emails) — usually 20–30% of email revenue, the highest-ROI flow.</li><li><b>Abandoned checkout and browse abandonment.</b></li><li><b>Post-purchase and review request</b> triggered on delivery confirmation.</li><li><b>Cross-sell or replenishment</b> at 30–60 days.</li><li><b>Win-back</b> at 90+ days inactive.</li><li><b>Broadcast campaigns</b> for launches and seasonal moments.</li></ul><p>I would build cart abandonment first, because it reaches the highest-intent audience and pays for the tool immediately.</p>',tag:'Retention'},
{c:3,q:'How do you protect against losing an ad account?',a:'<p>Prevention and redundancy. Prevention: verify the business, run the pixel through Conversions API, avoid absolute health or income claims, never use before-and-after body imagery on Meta, warm new accounts slowly rather than launching at high spend, and keep the landing page consistent with the ad claim.</p><p>Redundancy: more than one ad account under a verified business manager, more than one traffic channel, and an email list that is not dependent on any platform. A store whose entire revenue runs through one ad account is one opaque, often unappealable decision away from zero.</p>',tag:'Risk'},

/* ---------- ANALYTICS & FINANCE ---------- */
{c:4,q:'How do you calculate break-even ROAS?',a:'<p>Retail divided by contribution margin, where contribution margin is retail minus product cost, minus shipping, minus payment processing.</p><p>Worked example: retail $80, product $22, shipping $6, processing $2.60. Contribution margin is $49.40. Break-even ROAS is 80 ÷ 49.40 = 1.62x. Below that I lose money on every sale regardless of how good the volume looks.</p><p>The related number is break-even CPA, which is simply the contribution margin — $49.40 here. And maximum profitable CPA at a 20% target net margin is contribution margin × 0.80, so about $39.50 before overhead and refund reserve.</p>',tag:'Calculation'},
{c:4,q:'Which metrics do you track daily, and what are healthy ranges?',a:'<ul><li><b>Conversion rate</b> — 1.8–3.5%</li><li><b>AOV</b> — $45–$130 depending on category</li><li><b>ROAS</b> — above break-even; 2.5x+ is comfortable</li><li><b>CPA</b> — under 40% of contribution margin</li><li><b>Contribution margin</b> — above 50% of retail</li><li><b>Add-to-cart rate</b> — 6–11%</li><li><b>Checkout completion</b> — 55–75%</li><li><b>Refund rate</b> — under 5%</li><li><b>Chargeback rate</b> — under 0.5%, checked weekly</li><li><b>Repeat purchase rate</b> — 15–30% by month six</li></ul><p>The two I would never let drift are chargeback rate, because it threatens the ability to trade at all, and contribution margin, because everything else depends on it.</p>',tag:'Metrics'},
{c:4,q:'Conversion rate is 3.1% and ROAS is 3.4x, but net margin is only 4%. What is wrong?',a:'<p>Nothing above the ad line — those are strong numbers. The leak is below it, so I would audit the P&L rather than the ad account.</p><p>Usual causes: app subscriptions that accumulated without anyone cancelling them, an understated cost of goods because supplier shipping was never fully counted, a refund rate that is not being tracked, currency conversion and cross-border card fees, or overhead that grew with revenue. I would rebuild a full unit economic model from bank statements rather than from the Shopify dashboard, because the dashboard does not show most of those lines.</p>',tag:'Diagnosis'},
{c:4,q:'Why can a profitable store run out of cash?',a:'<p>Because payment processors hold funds for three to seven days while supplier costs are due immediately. The faster you grow, the wider that gap gets. At $500 a day in ad spend and supplier costs, you can easily need $5,000–$10,000 of working capital just to keep operating while genuinely profitable.</p><p>Growth consumes cash. I would model the float requirement before scaling and treat it as a hard constraint — scaling into a cash gap is how solvent businesses fail.</p>',tag:'Cash flow'},
{c:4,q:'When is A/B testing worth doing?',a:'<p>Once I can get roughly 200 conversions per variant. Below that, the result is noise and I would be confidently acting on randomness — which is worse than not testing, because it creates false confidence.</p><p>At small scale I use qualitative signals instead: session recordings in Microsoft Clarity, the questions arriving in support, and the objections in ad comments. Ten session recordings a week will show me the exact scroll position where interest dies, which no aggregate dashboard can.</p>',tag:'Method'},
{c:4,q:'How do you think about customer lifetime value?',a:'<p>LTV is what determines whether I can outbid competitors. If my customer buys 2.4 times and a competitor\'s buys once, I can afford roughly 2.4 times their CPA and still be profitable. That is a permanent structural advantage that no creative optimisation can match.</p><p>Practically it means retention work — email flows, replenishment, bundles, loyalty — is acquisition strategy, not a separate function. It also means I seed lookalike audiences with high-LTV customers rather than all customers, because the algorithm optimises toward whatever I feed it.</p>',tag:'Strategy'},

/* ---------- SCALING & STRATEGY ---------- */
{c:5,q:'When is a store ready to scale?',a:'<p>All of these, not most: ROAS at least 1.25 times my own break-even — around 2.5x on a typical product now that duty is in the landed cost — sustained for seven consecutive days; CPA below 40% of contribution margin; site conversion above 2%; at least 20 genuine reviews on the hero product; refund rate under 5% and chargebacks under 0.5%; supplier confirmed for 10x current volume; a cash buffer covering 30 days; and support able to absorb 5x tickets within a 24-hour response.</p><p>The reason it is a gate rather than a checklist is that scaling amplifies whatever exists. A store with a 7% refund rate that triples spend produces three times the angry customers and a processor review.</p>',tag:'Readiness'},
{c:5,q:'How do you scale a campaign without breaking it?',a:'<p>Vertically at 20–30% every 48 hours while ROAS holds. Larger jumps push the campaign back into the learning phase and typically destroy a week of stable performance.</p><p>When vertical scaling hits diminishing returns, I move horizontally — duplicating the winner into new audiences, placements or comparable countries. Running alongside both, continuously: new creative in the proven angle, because creative fatigue is inevitable and is usually the real ceiling rather than budget.</p>',tag:'Method'},
{c:5,q:'What is the path from dropshipping store to real brand?',a:'<ol><li>Validate demand with zero-inventory dropshipping — buying data, not building an asset.</li><li>Move to a sourcing agent, add branded packaging and inserts. Still no inventory commitment.</li><li>Light private label — your logo, 300–1,000 unit minimum. Unit cost drops and the listing becomes yours.</li><li>Modify the product based on what the support inbox has been telling you. Now competitors cannot match it exactly.</li><li>Develop an original product informed by accumulated customer data.</li><li>Expand multi-channel — own site, Amazon, wholesale — into a diversified, sellable asset.</li></ol><p>The point of the sequence is that each stage is funded by the previous one and de-risked by the data it produced.</p>',tag:'Strategy'},
{c:5,q:'What would you hire for first?',a:'<p>Customer support, at roughly $5–$9 an hour. It is the highest-volume, most delegable and most trainable task, and offloading it buys back the hours I should be spending on creative production and sourcing — the two things that actually move revenue and that nobody can do for me early on.</p><p>Second would be a video editor, because creative volume is the real constraint on paid growth. A media buyer comes much later, and only once there is enough spend for the role to pay for itself.</p>',tag:'Team'},
{c:5,q:'How would you value a dropshipping store for sale?',a:'<p>Typically 2–4x annual net profit on marketplaces like Flippa, Empire Flippers or Acquire. What moves a store toward the top of that range is de-risking: clean books with verifiable numbers, documented SOPs so the operation survives a change of owner, diversified traffic rather than a single ad account, a substantial email list, supplier relationships that transfer, and a brand with repeat customers rather than a single hero product.</p><p>What pushes it down: single-product dependency, single-channel traffic, no documentation, and revenue that is obviously a temporary trend.</p>',tag:'Exit'},
{c:5,q:'How do you decide between doubling down and pivoting?',a:'<p>On evidence, at a scheduled review point rather than emotionally in a bad week. The question I ask is whether the unit economics can work, not whether they currently do.</p><p>If contribution margin is healthy and the problem is CPA, that is fixable with creative and offer work — double down. If contribution margin is structurally too thin, the product cannot support paid acquisition at any level of skill — pivot the product. If multiple products in the niche show the same thin economics or the audience is not reachable, pivot the niche.</p><p>The discipline is to give it enough time to produce real data first, then decide quickly once the data exists.</p>',tag:'Decision'},

/* ---------- SITUATIONAL ---------- */
{c:6,q:'A customer\'s parcel is 10 days past your stated delivery window and they are threatening a chargeback. What do you do?',a:'<p>I would respond within the hour and give them control: an immediate choice between a reshipment sent today or a full refund processed now, their pick, no conditions.</p><p>Past my stated window I am in the wrong, and arguing invites a dispute that costs me the refund plus a fee plus a mark against my processor. Then I check tracking to see whether this is a one-off or a supplier pattern, log it with a reason code, and if it is the third such case that week, I pause ads on that product until fulfilment is fixed rather than continuing to sell a broken promise.</p>',tag:'Support'},
{c:6,q:'Your best-performing ad set suddenly drops from 3.2x to 1.1x ROAS overnight. Walk me through your response.',a:'<p>First, I do not change anything for 24 hours, because a single day is often noise or a tracking delay. I check whether conversions are genuinely down or just attributed late.</p><p>Then I diagnose in order: has CPM spiked (auction pressure or a seasonal event), has CTR fallen (creative fatigue), has add-to-cart fallen (something broke on the site), or has checkout completion fallen (payment issue). Each has a different fix and they are not interchangeable.</p><p>I would also check the obvious operational causes people miss — an out-of-stock variant, a broken product image, a price change, or the store going slow. If it is fatigue, new creative in the same angle. If the site broke, fix it before touching the campaign.</p>',tag:'Diagnosis'},
{c:6,q:'Your supplier goes silent for a week with 60 unfulfilled orders. What do you do?',a:'<p>Immediate priority is the customers, not the supplier. I email all 60 proactively with an honest status and a choice — wait with a specific new date, or take a full refund now. Proactive contact prevents most of those turning into chargebacks.</p><p>In parallel I pause ads on affected products immediately, because adding new orders to a broken pipeline compounds the problem. Then I activate the backup supplier I should already have qualified, and re-route what I can.</p><p>Afterwards, the review: why was there no backup, and what early signal did I miss? A supplier who goes silent for a week under pressure has usually shown smaller warning signs earlier.</p>',tag:'Crisis'},
{c:6,q:'Your chargeback rate has climbed to 1.3%. What is your plan?',a:'<p>I would treat this as an emergency, because the escalation path is warning, rolling reserve, termination — and a terminated processor account is close to unrecoverable.</p><p>Immediate actions: pull every dispute from the last 90 days and code the reasons. Almost always it concentrates in slow shipping and unanswered support. Then: refund proactively for anything past the stated window without waiting to be asked; add proactive shipping updates at dispatch, customs and delivery; extend stated delivery windows to something honest; clear the support backlog even if that means paying for help this week; and pause the worst-performing product entirely.</p><p>Structurally: move the hero product to a faster supplier. Speed is the root cause in most cases, and everything else is a mitigation.</p>',tag:'Crisis'},
{c:6,q:'You have $500 and 30 days. What do you do with it?',a:'<p>Roughly: $30 platform and domain, $80 on samples for two or three candidate products, and the remaining ~$390 on ad testing. Nothing on logos, courses, or premium themes.</p><p>Week one, niche selection and store build on a free theme. Week two, order samples and start posting organic short video immediately — free validation while the samples ship. Week three, samples arrive, I shoot my own creative and write original product pages. Week four, run $30/day for ten days across three angles, read by funnel stage, and finish with a clear answer on whether this product can work.</p><p>The goal at $500 is not profit. It is to complete one honest loop and know exactly what to do differently with the next $500.</p>',tag:'Resourcing'},
{c:6,q:'A competitor launches the identical product at 30% below your price. How do you respond?',a:'<p>Not by matching. If their supplier is cheaper, that is a race I lose; if it is not, they are buying share unprofitably and will stop.</p><p>I would compete on everything price does not cover: faster shipping through an agent, a genuine guarantee, better creative that builds the problem before the solution, a bundle that makes direct comparison impossible, and the email list they do not have. I would also check whether they are actually converting — the Meta Ad Library will show whether those ads are still running in 30 days.</p><p>Longer term, this is exactly the signal to move toward light private label so the product stops being directly comparable.</p>',tag:'Competition'},
{c:6,q:'Your Meta ad account is disabled with no clear reason. What now?',a:'<p>Short term: file the appeal immediately with specifics, but do not depend on it — most appeals fail and the process is opaque. Shift budget to whatever secondary channel exists, usually TikTok or Google Shopping, and lean hard on the email list, which is the one asset no platform can disable.</p><p>Then audit the likely cause: policy-adjacent claims, a landing page inconsistent with the ad, before-and-after imagery, or a shared payment method with a previously flagged account. Fix the cause before running anything from a new asset, or the new one goes too.</p><p>The real answer, though, is that this should never be a single point of failure. If it was, the honest post-mortem is about redundancy, not about the appeal.</p>',tag:'Crisis'},

/* ---------- BEHAVIOURAL ---------- */
{c:7,q:'Tell me about a time a product test failed. What did you learn?',a:'<p>Use a structured answer — situation, action, result, learning. A strong version sounds like:</p><p><i>"I tested a $34 kitchen gadget with a 4x margin and strong AliExpress order volume. I ran three creatives for five days at $20 a day and got a 1.8% CTR but a 2.1% add-to-cart rate. My instinct was to change the audience. Instead I checked the funnel and realised the ad promised a specific outcome the product page never restated — people arrived and lost the thread. I rewrote the first screen to mirror the ad\'s promise and add-to-cart went to 7%. The product still did not clear break-even because the CPA ceiling was too tight, so I killed it — but the lesson was that I had been diagnosing at the wrong stage, and I now always walk the funnel top-down before changing anything."</i></p><p>The point is to show diagnostic discipline and a willingness to kill something, not to invent a success story.</p>',tag:'STAR'},
{c:7,q:'How do you stay motivated during the unprofitable months?',a:'<p>By setting the right success metric. Month one is not a revenue target — it is completing one full build-launch-test-read loop. If I judge myself on profit in week two, I will quit in week five, which is what happens to most people.</p><p>Practically, I track leading indicators I control: creatives produced, suppliers contacted, session recordings watched, pages improved. Those move even when revenue does not, and they are what eventually causes revenue to move. I also set a defined budget and time horizon in advance, so continuing is a plan rather than a hope, and stopping is a decision rather than a collapse.</p>',tag:'Resilience'},
{c:7,q:'Describe a time you had to make a decision with incomplete data.',a:'<p>Frame it around the threshold you set in advance. A strong answer shows that you defined what "enough evidence" meant before looking at the numbers, so the decision was not rationalised after the fact.</p><p>For example: deciding whether to kill a campaign at day four with 22 conversions. Statistically that is thin. The honest reasoning is that ROAS was 0.6x against a break-even of 1.6x — not a marginal miss but a structural one — so waiting for significance would have cost more than the information was worth. I killed it, redirected the budget, and noted the threshold so the next decision was consistent rather than ad hoc.</p>',tag:'STAR'},
{c:7,q:'How do you prioritise when everything feels urgent?',a:'<p>I rank by what threatens the business versus what improves it. Anything touching payment processing — chargebacks, unanswered support, delivery failures — comes first, because those can end the business rather than slow it. Then anything blocking revenue, like a broken checkout or an out-of-stock hero product. Then improvement work: creative, conversion, retention.</p><p>Within improvement work I use effort against expected impact and generally take the boring high-certainty thing over the exciting speculative one. Adding a post-purchase upsell is unglamorous and reliably adds 8–15% AOV; redesigning the homepage feels productive and usually does nothing measurable.</p>',tag:'Judgement'},
{c:7,q:'What would you do differently if you started again?',a:'<p>Three things. First, price off CPA from day one rather than off a cost multiplier — that single error wasted the most money and time. Second, build email capture and the cart abandonment flow before running the first ad, because every sale made before that point cost full acquisition price forever. Third, order samples before listing rather than after the first complaint.</p><p>Underneath all three is the same lesson: the unglamorous infrastructure work has a higher return than the visible creative work, and it is exactly what beginners defer.</p>',tag:'Reflection'},
{c:7,q:'How do you keep learning in a field that changes this fast?',a:'<p>Primary sources over commentary. Meta and TikTok publish their own performance guidance and ad libraries; Shopify and Klaviyo publish benchmark data; the platforms announce policy changes directly. Most of what circulates as "strategy" is a lagging, distorted version of those.</p><p>Beyond that: I read my own data more than I read anyone\'s content, because my funnel tells me things no general article can. And I watch what long-running advertisers in my niche are actually doing in the Ad Library — a competitor running the same creative for 90 days is teaching me more than any course.</p>',tag:'Growth'}
];
/* ---------- TRADE & COMPLIANCE (category 8) ---------- */
INTERVIEWS.push(
{c:8,q:'How has the end of the de minimis exemption changed dropshipping?',a:'<p>Fundamentally, and most sellers have not repriced. Until 2025, parcels under $800 entered the US duty-free under Section 321 — no formal entry, no HTS code, no broker. That was suspended for China and Hong Kong in May 2025, extended to all countries that August, continued by executive order in February 2026 and placed on an indefinite footing. A court challenge was rejected in August 2026.</p><p>Practically: every parcel now needs a formal customs entry with a 10-digit HTS code and full duty payment regardless of value. Landed cost went from product plus freight to product plus freight plus duty plus tariff plus brokerage.</p><p>The number that matters is break-even ROAS. On a typical $50 item it moved from roughly 1.6x to somewhere between 1.9x and 2.7x depending on classification and origin. Campaigns that were profitable are now losses, and the Shopify dashboard does not show it. Sub-$800 parcel volume into the US fell by about half, which tells you how many businesses this broke.</p>',tag:'Policy'},
{c:8,q:'Walk me through how you calculate landed cost now.',a:'<p>Landed cost equals product cost, plus freight, plus duty, plus any additional tariff layers, plus brokerage and entry fees. Duty is assessed on the declared customs value at the rate attached to the product\'s HTS classification, and the rate varies by country of origin — goods from China may carry additional layers on top of the base rate.</p><p>The discipline is that I will not quote a price or judge a campaign off a supplier invoice. I get the all-in landed cost per unit in writing from the supplier or agent, then contribution margin is retail minus landed cost minus payment processing, and break-even ROAS is retail divided by that. Anyone still using product-plus-freight is overstating their margin by roughly 30–50%.</p>',tag:'Calculation'},
{c:8,q:'What is the difference between DDP and DDU, and which would you use?',a:'<p>DDP means delivered duty paid — you or your supplier pay the duty upfront and build it into your price, so the customer receives the parcel with nothing to pay. DDU or DAP means duty unpaid: the carrier bills the customer before releasing the parcel.</p><p>For consumer retail, DDP is the only defensible option. Under DDU your customer gets a bill they never agreed to, from a company they have never heard of, for a purchase they thought was complete. The outcomes are refused parcels, chargebacks, one-star reviews, and eventually a payment processor review — and they blame you, not the carrier.</p><p>So "do you ship DDP to my market, and what is the all-in landed cost?" is now my opening question to any supplier, ahead of unit price. A supplier who cannot answer that precisely is a supplier who will surprise my customers.</p>',tag:'Logistics'},
{c:8,q:'What is the GPSR and why does it matter to a dropshipper?',a:'<p>The EU General Product Safety Regulation has applied since December 2024. Article 16 requires an economic operator established in the EU to be responsible for every consumer product placed on the market — their name and contact details must appear on the product, packaging or accompanying documents, and in the online listing.</p><p>It hits dropshipping hardest because of a structural gap: when goods ship directly from outside the EU to a consumer, nobody in the chain is the importer, so the obligation lands on the seller. There is no low-value exemption. A generic marketplace listing has no responsible person attached, which makes the sale non-compliant unless one is appointed.</p><p>Enforcement is not theoretical — EU safety alerts hit a record in 2025, up around 13%, with recalls and marketplace delistings up roughly 35%. Marketplaces now reject non-compliant listings automatically. An authorised representative service starts around €199 a year, but it requires real manufacturer documentation, which most dropship suppliers cannot produce.</p>',tag:'Regulation'},
{c:8,q:'What VAT obligations apply if you sell into the EU and UK?',a:'<ul><li><b>EU:</b> the low-value import VAT exemption was removed in 2021. VAT is due on every consignment. The Import One-Stop Shop lets you collect VAT at checkout and remit it in a single return for consignments up to €150. Without IOSS, your customer gets billed on delivery — the same problem as DDU.</li><li><b>EU duty:</b> since 1 July 2026 there is also a flat €3 customs duty per item, by tariff line, on goods under €150 — so two products under different codes in one parcel cost €6. It is interim until the EU customs data hub in 2028, when normal classification-based tariffs are expected.</li><li><b>UK:</b> for consignments up to £135, the seller must register for UK VAT and charge it at the point of sale rather than leaving it to the border. The UK low-value duty relief is due to end by March 2029.</li><li><b>US:</b> separately, economic nexus thresholds for sales tax vary by state, and whether your platform collects on your behalf depends on the channel.</li></ul><p>The theme across all three is the same: tax and duty should be settled at checkout, visibly, not sprung on the customer at the door.</p>',tag:'Tax'},
{c:8,q:'Given all of this, is direct-from-China dropshipping still a viable model?',a:'<p>As an operating model, decreasingly. As a validation tool, still excellent.</p><p>Duty plus brokerage on every individual parcel is structurally more expensive than paying duty once on a consolidated shipment, and the delivery time is worse. So for anything with proven demand, bulk import plus domestic third-party fulfilment now wins on total cost as well as on speed — which was not true before 2025.</p><p>What I would do is use dropshipping exactly as it should always have been used: to find out cheaply whether a market wants something, accepting thin or negative margin during the test, then move the winners to a consolidated import and domestic fulfilment as soon as volume justifies it. The policy change did not kill the model so much as compress the window in which pure dropshipping makes sense.</p>',tag:'Strategy'},
{c:3,q:'How would you use AI in creative production, and where is the line?',a:'<p>I would use it to multiply proven angles rather than to invent them. The bottleneck in paid social has always been creative volume — traditional creator UGC runs $150–$300 a video plus usage rights, so a twenty-video test is $4,000–$9,000 and several weeks. AI collapses the marginal cost of a variant to near zero, which means I can generate ten hooks, five personas and three openings from one winning angle and let spend pick.</p><p>On quality, the evidence favours hybrid: real creator footage augmented with AI voiceover, b-roll and editing performs at or near parity with full human production, while fully synthetic talking heads have been measured underperforming real UGC by 30–50% on view-through. So AI multiplies real footage, it does not replace the creator.</p><p>The line is fabricated testimonials. FTC guidance treats AI the same as a human creator — an avatar captioned as a verified buyer from a named city is deceptive advertising. A clearly branded AI spokesperson is fine. Separately, Meta auto-labels its own generative output and labels photorealistic AI humans prominently, TikTok puts a disclosure duty on the advertiser, and the EU AI Act requires disclosure from August 2026. So I label where required and never assert a false identity.</p>',tag:'Creative'},
{c:3,q:'Would you sell on TikTok Shop? Walk me through the economics.',a:'<p>Yes, but not as a dropshipper and not as a first channel. The blocking constraint is that US sellers can no longer ship with their own carrier labels — fulfilment has to run through Fulfilled by TikTok, Upgraded TikTok Shipping or Collections. A supplier shipping direct from overseas does not satisfy that, so the channel requires stock inside the network. That makes it a bulk-import business, not a dropship one.</p><p>On economics, the headline 6% US referral fee is misleading. Stack affiliate commission — US average around 13%, with targeted creator deals running 15–25% or more — plus fulfilment at roughly $3–$4 a unit, plus ad spend, plus returns, and the realistic channel take is around 30% of selling price. Content is a further real cost: sustaining three to five fresh videos a week runs anywhere from $1,500 to $25,000 a month.</p><p>So I would model the full stack before committing inventory. A product that works at 25% channel cost can be a loss at 35%. And payouts run 1 to 31 days after delivery depending on settlement tier, which is a cash-flow consideration on top of the inventory I now have to fund.</p>',tag:'Channels'},
{c:2,q:'How do you handle returns when there is no practical return address?',a:'<p>By value band, decided in advance rather than improvised per ticket. Under about $25 I refund without requesting the return, because return shipping exceeds the product value every time. Between $25 and $60, still refund or replace without return, with photo evidence for defects. Above roughly $60, it becomes worth recovering to a domestic address or 3PL, and above $150 I would always accept a return with a prepaid label because buyers at that price expect it.</p><p>The discipline that matters more than the policy is coding return reasons. Size, quality, not-as-described and changed-mind need completely different fixes. A spike in not-as-described is a listing problem — wrong photos, no size reference — not a customer problem. And I would never publish a return address I cannot actually service; if I have none, the policy says so honestly and I refund.</p>',tag:'Operations'},
{c:3,q:'How would you prepare a store for AI shopping agents?',a:'<p>Proportionately. It is real and growing but not yet material for most small stores, so I would spend an afternoon rather than a quarter — and most of that work improves the normal storefront anyway.</p><p>The priority is product data. Agents match against verifiable structured attributes, not marketing copy. So: complete specifications, real dimensions and materials, current price that matches checkout, live stock, and honest delivery windows stated in specific terms. A buyer asking for something waterproof under $150 arriving Friday is applying four constraints, and any attribute I have not stated is treated as absent rather than unknown.</p><p>Then I would actually test it — ask ChatGPT, Perplexity and Google AI Mode to recommend products in my category the way a customer would phrase it, and see whether I appear. Most sellers have never checked. Finally, confirm my platform has API coverage for catalogue, cart, checkout and orders, and make sure my bot rules are not blocking legitimate shopping agents alongside scrapers.</p><p>What I would not do is build a strategy around one product. The landscape moved twice in six months — in-chat checkout expanded and then reportedly pulled back toward discovery with purchase on the merchant site. The durable part is being discoverable with clean data.</p>',tag:'Emerging'},
{c:4,q:'How do you think about the economics of an agentic channel versus paid social?',a:'<p>I would model it like a marketplace rather than like organic traffic. There is a reported merchant fee in the region of 4% on completed in-chat purchases, which puts it in the same mental category as a referral commission — it belongs in contribution margin, not in a free column.</p><p>The structural difference from paid social is that I do not buy placement, I earn it through data quality and product fit, which means the cost is fixed effort rather than variable spend. That is attractive. The offsetting risks are that attribution is messy — agent traffic often arrives without conventional referral data, so some of what looks like direct is not — and that a channel I do not control can change its rules in a single announcement, which this one already has.</p><p>So I would treat it as a margin-accretive supplement worth preparing for, and would not let it reduce investment in the email list, which is the one channel nobody can change the rules on.</p>',tag:'Channels'},
{c:6,q:'You wake up to 400 failed £1 orders overnight. What is happening and what do you do?',a:'<p>That is card testing — automated attempts to validate stolen cards through my checkout. It is not a traffic spike and it is not a bug.</p><p>Immediately: enable CAPTCHA or bot protection at checkout, which stops most of it outright, and check whether any attempts succeeded and shipped. Then contact my processor proactively rather than waiting for them to contact me, because the authorisation pattern alone can trigger a review, and each failed attempt may carry a fee.</p><p>Then the follow-up: turn on 3D Secure to shift liability for disputed transactions, review fraud flags on anything that did get through, and hold orders where billing and shipping countries differ or several orders share a card or address.</p><p>The point I would make is that a chargeback from genuine fraud damages my processor standing exactly like one from bad service. The processor does not distinguish, so being blameless does not protect the account — prevention is the only thing that does.</p>',tag:'Crisis'},
{c:8,q:'A competitor is advertising much lower prices than you on the same product. How do you interpret that now?',a:'<p>First, I check whether they are shipping DDU. A competitor who has not priced duty in will look 15–25% cheaper and will be generating customer-side duty bills, refused parcels and chargebacks. That is not a price advantage, it is a deferred failure — and I would expect their processor to catch up with them.</p><p>Second, they may have a genuine structural advantage: domestic stock, bulk import at better duty rates, or a classification I have not optimised. That is worth investigating, because HTS classification is legitimate and sometimes a product genuinely fits a lower-duty code.</p><p>Third, they may simply be buying share unprofitably. The Meta Ad Library tells me which — if those ads are still running in 30 days, it is structural and I need to match the structure, not the price.</p>',tag:'Competition'}
);

</script>
<script>
/* ============================================================
   STATE  (in-memory, optionally persisted)
   ============================================================ */
const DEFAULT_STATE = { done:{}, ex:{}, chk:{}, exam:null, seen:{}, gate:{}, cases:{} };
let S = JSON.parse(JSON.stringify(DEFAULT_STATE));
let persistOK = false;

const STORE_KEY = 'dd-progress-v1';
let storeKind = 'memory';   // 'artifact' | 'local' | 'memory'

function localOK(){
  try{ const t='__dd_t'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return true; }
  catch(e){ return false; }
}
function applyLoaded(raw){
  try{ if(raw) S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw)); }catch(e){}
}
async function loadState(){
  /* 1. Claude artifact storage */
  if(window.storage && typeof window.storage.get === 'function'){
    storeKind = 'artifact'; persistOK = true;
    try{ const r = await window.storage.get(STORE_KEY); if(r && r.value) applyLoaded(r.value); }
    catch(e){ /* key not created yet — normal on first run */ }
    return;
  }
  /* 2. Browser localStorage — works when the file is opened directly or hosted */
  if(localOK()){
    storeKind = 'local'; persistOK = true;
    try{ applyLoaded(localStorage.getItem(STORE_KEY)); }catch(e){}
    return;
  }
  /* 3. Memory only */
  storeKind = 'memory'; persistOK = false;
}
let saveTimer=null;
function save(){
  if(!persistOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async()=>{
    const data = JSON.stringify(S);
    try{
      if(storeKind==='artifact') await window.storage.set(STORE_KEY, data);
      else if(storeKind==='local') localStorage.setItem(STORE_KEY, data);
    }catch(e){}
  },400);
}

/* ============================================================
   HELPERS
   ============================================================ */
const $  = s=>document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LET = ['A','B','C','D','E','F'];

function barcode(seed, cls){
  let x = 0; for(let i=0;i<seed.length;i++) x = (x*31 + seed.charCodeAt(i)) % 99991;
  const parts=[]; let pos=0;
  for(let i=0;i<62;i++){
    x = (x*1103515245 + 12345) % 2147483648;
    const w = 1 + (x % 4);
    parts.push(`var(--ink) ${pos}px ${pos+w}px`);
    pos += w;
    x = (x*1103515245 + 12345) % 2147483648;
    const g = 1 + (x % 4);
    parts.push(`transparent ${pos}px ${pos+g}px`);
    pos += g;
  }
  return `<div class="barcode ${cls||''}" aria-hidden="true" style="background:repeating-linear-gradient(90deg,${parts.join(',')});background-size:${pos}px 100%"></div>`;
}

function exKey(mid,i){ return mid+':'+i; }
function moduleComplete(mid){
  const list = EXERCISES[mid]||[];
  if(!list.length) return !!S.seen[mid];
  return list.every((ex,i)=>{
    const k = exKey(mid,i);
    if(ex.type==='checklist'){
      const c = S.chk[k]||{};
      return ex.items.filter((_,j)=>c[j]).length >= Math.ceil(ex.items.length*0.8);
    }
    return !!(S.ex[k] && S.ex[k].done);
  });
}
function progressPct(){
  const done = COURSE.filter(m=>moduleComplete(m.id)).length;
  return Math.round(done / COURSE.length * 100);
}

/* ============================================================
   CONTENT BLOCK RENDERER
   ============================================================ */
function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.h)   return `<h2 class="ph">${b.h}</h2>`;
    if(b.p)   return `<p>${b.p}</p>`;
    if(b.ul)  return `<ul>${b.ul.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    if(b.ol)  return `<ol>${b.ol.map(i=>`<li>${i}</li>`).join('')}</ol>`;
    if(b.formula) return `<div class="formula">${b.formula.replace(/\n/g,'<br>')}</div>`;
    if(b.callout) return `<div class="callout ${b.callout}"><span class="ct">${esc(b.t)}</span>${b.x}</div>`;
    if(b.table) return `<div class="tbl-wrap"><table><thead><tr>${
        b.table.head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${
        b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(b.ladder) return `<div class="ladder">${b.ladder.map((s,i)=>
        `<div class="rung"><div class="rung-n">${String(i+1).padStart(2,'0')}</div>
         <div class="rung-b"><b>${s.t}</b><span>${s.d}</span></div></div>`).join('')}</div>`;
    if(b.cards) return `<div class="cardgrid">${b.cards.map(c=>
        `<div class="fcard"><b>${c.t}</b><span>${c.d}</span></div>`).join('')}</div>`;
    return '';
  }).join('');
}

/* ============================================================
   EXERCISE RENDERERS
   ============================================================ */
function renderExercise(mid, ex, i){
  const k = exKey(mid,i);
  const st = S.ex[k];
  let inner='', score='';
  if(ex.type==='mcq'){
    inner = ex.items.map((q,qi)=>{
      const pick = st && st.ans ? st.ans[qi] : undefined;
      const ansd = pick!==undefined && pick!==null;
      return `<div class="q">
        <div class="q-p"><span class="q-n">Q${qi+1}</span><span class="q-t">${q.q}</span></div>
        <div class="opts">${q.o.map((o,oi)=>{
          let cls='';
          if(ansd){ if(oi===q.a) cls=' right'; else if(oi===pick) cls=' wrong'; }
          return `<button class="opt${cls}" ${ansd?'disabled':''} data-mcq="${k}" data-q="${qi}" data-o="${oi}">
            <span class="k">${LET[oi]}</span><span>${o}</span></button>`;
        }).join('')}</div>
        ${ansd?`<div class="explain${pick===q.a?'':' miss'}"><b>${pick===q.a?'Correct':'Not quite'}</b>${q.e}</div>`:''}
      </div>`;
    }).join('');
    if(st && st.ans){
      const n = st.ans.filter(a=>a!==null&&a!==undefined).length;
      const c = ex.items.filter((q,qi)=>st.ans[qi]===q.a).length;
      score = `${c}/${ex.items.length} correct · ${n}/${ex.items.length} answered`;
      if(st.done) inner += receipt(c, ex.items.length, k);
    }
  }

  if(ex.type==='order'){
    const placed = (st && st.placed) || new Array(ex.items.length).fill(null);
    const checked = st && st.done;
    const used = placed.filter(x=>x!==null);
    inner = `<div class="ord-wrap">
      <div class="ord-col"><h4 class="eyebrow">Available steps</h4><div class="ord-pool">${
        ex.items.map((t,ti)=> used.includes(ti) ? '' :
          `<button class="ord-item" data-ord="${k}" data-i="${ti}">${t}</button>`).join('') ||
          '<div class="eyebrow" style="padding:8px 0">All steps placed</div>'}</div></div>
      <div class="ord-col"><h4 class="eyebrow">Correct sequence</h4><div class="ord-slots">${
        placed.map((v,si)=>{
          let cls = v!==null?' filled':'';
          if(checked && v!==null) cls += (v===si?' right':' wrong');
          return `<button class="ord-slot${cls}" data-ordslot="${k}" data-s="${si}" ${checked?'disabled':''}>
            <span class="sn">${si+1}</span><span>${v!==null?ex.items[v]:'&nbsp;'}</span></button>`;
        }).join('')}</div></div></div>`;
    if(!checked){
      inner += `<div class="btn-row">
        <button class="btn" data-ordcheck="${k}" ${used.length<ex.items.length?'disabled':''}>Check sequence</button>
        <button class="btn ghost sm" data-ordreset="${k}">Clear</button></div>`;
    }else{
      const c = placed.filter((v,si)=>v===si).length;
      score = `${c}/${ex.items.length} in position`;
      inner += receipt(c, ex.items.length, k);
    }
  }

  if(ex.type==='sort'){
    const pl = (st && st.pl) || {};
    const checked = st && st.done;
    const sel = st && st.sel!==undefined ? st.sel : null;
    const unplaced = ex.items.map((it,ii)=>ii).filter(ii=>pl[ii]===undefined);
    inner = `<div class="sort-pool">${
      unplaced.length ? unplaced.map(ii=>
        `<button class="chip${sel===ii?' sel':''}" data-sortpick="${k}" data-i="${ii}" aria-pressed="${sel===ii}">${ex.items[ii].t}</button>`).join('')
      : '<div class="eyebrow" style="padding:6px 0">All items sorted</div>'}</div>
      <div class="bins">${ex.bins.map((bn,bi)=>{
        const inBin = ex.items.map((it,ii)=>ii).filter(ii=>pl[ii]===bi);
        const armed = sel!==null && sel!==undefined && !checked;
        return `<div class="bin${armed?' armed':''}">
          <button class="bin-h${armed?' armed':''}" data-sortbin="${k}" data-b="${bi}"
            ${armed?'':'disabled'} aria-label="Place selected item in ${esc(bn)}">
            <span>${bn}</span><span class="drop">Place here ›</span>
            <span class="mono" style="font-size:10px;opacity:.6">${inBin.length}</span></button>
          <div class="bin-b" data-sortbin="${k}" data-b="${bi}">${inBin.map(ii=>{
            let cls='';
            if(checked) cls = ex.items[ii].b===bi ? ' right' : ' wrong';
            return `<button class="chip${cls}" data-sortback="${k}" data-i="${ii}" ${checked?'disabled':''}>${ex.items[ii].t}</button>`;
          }).join('')}</div></div>`;
      }).join('')}</div>`;
    if(!checked){
      inner += `<div class="btn-row">
        <button class="btn" data-sortcheck="${k}" ${unplaced.length?'disabled':''}>Check answers</button>
        <button class="btn ghost sm" data-sortreset="${k}">Clear</button></div>
        <p class="pr-intro" style="margin:12px 0 0;font-size:14px">Select an item, then choose a column to place it. Select a placed item to send it back. Fully keyboard operable.</p>`;
    }else{
      const c = ex.items.filter((it,ii)=>pl[ii]===it.b).length;
      score = `${c}/${ex.items.length} correct`;
      inner += receipt(c, ex.items.length, k);
    }
  }

  if(ex.type==='checklist'){
    const c = S.chk[k]||{};
    const n = ex.items.filter((_,j)=>c[j]).length;
    score = `${n}/${ex.items.length} complete`;
    inner = `<div class="chk">${ex.items.map((t,j)=>
      `<button class="chk-i${c[j]?' on':''}" data-chk="${k}" data-j="${j}">
        <span class="box"></span><span class="lb">${t}</span></button>`).join('')}</div>
      <div class="btn-row"><button class="btn ghost sm" data-chkreset="${k}">Clear all</button></div>`;
  }

  if(ex.type==='calc'){ inner = CALC[ex.calc](k); }

  return `<section class="practice" id="ex-${i}">
    <div class="pr-head"><span class="k">Practice</span><span class="t">${ex.title}</span>
      <span class="sp"></span><span class="score">${score}</span></div>
    <div class="pr-body">${ex.intro?`<p class="pr-intro">${ex.intro}</p>`:''}${inner}</div>
  </section>`;
}

function receipt(c, total, k){
  const pct = Math.round(c/total*100);
  const pass = pct>=70;
  const msg = pct===100 ? 'Full marks. Move on with confidence.'
    : pass ? 'Cleared. Review the explanations on anything you missed before continuing.'
    : 'Below the 70% pass mark. Re-read the module and try again — this material compounds.';
  return `<div class="receipt"><div class="rc-b">
      <div class="rc-k">Practice Receipt</div>
      <div class="rc-score">${pct}%</div>
      <div class="rc-of">${c} of ${total} correct</div>
      <div><span class="stamp ${pass?'pass':'fail'}">${pass?'Cleared':'Retry'}</span></div>
      <div class="rc-msg">${msg}</div>
      <div class="btn-row" style="justify-content:center"><button class="btn ghost sm" data-exreset="${k}">Try again</button></div>
    </div>
    <div class="rc-f"><span>Dropship Depot</span><span>Ref ${k.toUpperCase().replace(':','-')}</span></div></div>`;
}

/* ============================================================
   CALCULATORS
   ============================================================ */
const num = id => parseFloat($('#'+id)?.value) || 0;
const CALC = {};

CALC.breakeven = k=>`
  <div class="calc-grid">
    <div class="field"><label>Retail price ($)</label><input type="number" id="be-r" value="49.99" step="0.01" data-calc="breakeven"></div>
    <div class="field"><label>Product cost ($)</label><input type="number" id="be-c" value="12" step="0.01" data-calc="breakeven"></div>
    <div class="field"><label>Shipping cost ($)</label><input type="number" id="be-s" value="4.50" step="0.01" data-calc="breakeven"></div>
    <div class="field"><label>Duty + tariff (%)</label><input type="number" id="be-d" value="25" step="0.5" data-calc="breakeven"></div>
    <div class="field"><label>Brokerage / entry ($)</label><input type="number" id="be-b" value="1.50" step="0.01" data-calc="breakeven"></div>
    <div class="field"><label>Processing (%)</label><input type="number" id="be-p" value="2.9" step="0.1" data-calc="breakeven"></div>
  </div>
  <div class="readout" id="be-out" aria-live="polite"></div><div id="be-v" aria-live="polite"></div>`;

CALC.margin = k=>`
  <div class="calc-grid">
    <div class="field"><label>Landed cost incl. duty ($)</label><input type="number" id="mg-c" value="18" step="0.01" data-calc="margin"></div>
    <div class="field"><label>Target CPA ($)</label><input type="number" id="mg-a" value="18" step="0.01" data-calc="margin"></div>
    <div class="field"><label>Processing (%)</label><input type="number" id="mg-p" value="3" step="0.1" data-calc="margin"></div>
    <div class="field"><label>Target net margin (%)</label><input type="number" id="mg-n" value="20" step="1" data-calc="margin"></div>
    <div class="field"><label>Your actual price ($)</label><input type="number" id="mg-r" value="39.99" step="0.01" data-calc="margin"></div>
  </div>
  <div class="readout" id="mg-out" aria-live="polite"></div><div id="mg-v" aria-live="polite"></div>`;

CALC.roas = k=>`
  <div class="calc-grid">
    <div class="field"><label>Ad spend ($)</label><input type="number" id="ra-s" value="600" step="1" data-calc="roas"></div>
    <div class="field"><label>Orders</label><input type="number" id="ra-o" value="34" step="1" data-calc="roas"></div>
    <div class="field"><label>Retail price ($)</label><input type="number" id="ra-r" value="49.99" step="0.01" data-calc="roas"></div>
    <div class="field"><label>Landed cost incl. duty ($)</label><input type="number" id="ra-c" value="22.50" step="0.01" data-calc="roas"></div>
    <div class="field"><label>Sessions</label><input type="number" id="ra-v" value="1850" step="1" data-calc="roas"></div>
    <div class="field"><label>Link clicks</label><input type="number" id="ra-k" value="1980" step="1" data-calc="roas"></div>
    <div class="field"><label>Impressions</label><input type="number" id="ra-i" value="142000" step="100" data-calc="roas"></div>
  </div>
  <div class="readout" id="ra-out" aria-live="polite"></div><div id="ra-v-out" aria-live="polite"></div>`;

const NICHE_Q = [
  ['Identifiable, reachable audience','Can you name the buyer and three places they gather?'],
  ['Price band $30–$200','Does the natural retail price sit in this window?'],
  ['3x landed cost or better','Is there enough gap to fund advertising?'],
  ['Not owned by Amazon','Is the first page free of big retailers selling it cheaper?'],
  ['Repeat or expansion potential','Will a buyer purchase again, or buy accessories?'],
  ['Demonstrable in 15 seconds','Does the value show on silent video?'],
  ['Stable or rising 5-year trend','Is demand flat or growing rather than declining?']
];
CALC.niche = k=>`
  <div id="nc-rows">${NICHE_Q.map((q,i)=>`
    <div class="slider-row">
      <div class="sr-l">${q[0]}<small>${q[1]}</small></div>
      <div class="sr-c"><input type="range" min="0" max="5" value="3" id="nc-${i}" data-calc="niche">
      <span class="sr-v" id="ncv-${i}">3</span></div>
    </div>`).join('')}</div>
  <div class="readout" id="nc-out" style="margin-top:16px" aria-live="polite"></div><div id="nc-v" aria-live="polite"></div>`;

const SCALE_Q = [
  'ROAS at least 1.25x your break-even (≈2.5x typical) for 7+ days',
  'CPA below 40% of contribution margin',
  'Site conversion rate above 2%',
  '20+ genuine reviews on the hero product',
  'Refund rate under 5%',
  'Chargeback rate under 0.5%',
  'Supplier confirmed for 10x current daily volume',
  'Cash buffer covering 30 days of ad spend and supplier costs',
  'Support can absorb 5x tickets within 24-hour response'
];
CALC.scale = k=>`
  <div class="chk" id="sc-rows">${SCALE_Q.map((q,i)=>
    `<button class="chk-i${S.gate&&S.gate[i]?' on':''}" data-scale="${i}" aria-pressed="${!!(S.gate&&S.gate[i])}"><span class="box"></span><span class="lb">${q}</span></button>`).join('')}</div>
  <div id="sc-v" style="margin-top:16px" aria-live="polite"></div>`;

function runCalc(which){
  if(which==='breakeven'){
    const r=num('be-r'), c=num('be-c'), s=num('be-s'), pr=num('be-p')/100;
    const dutyPct=num('be-d')/100, brok=num('be-b');
    const duty = (c + s) * dutyPct;
    const landed = c + s + duty + brok;
    const fee = r*pr + 0.30;
    const cm = r - landed - fee;
    const beR = cm>0 ? r/cm : 0;
    $('#be-out').innerHTML = `
      <div class="ro"><span class="l">Landed cost</span><span class="v">$${landed.toFixed(2)}</span></div>
      <div class="ro"><span class="l">of which duty</span><span class="v ${duty>0?'mid':''}">$${duty.toFixed(2)}</span></div>
      <div class="ro"><span class="l">Contribution margin</span><span class="v ${cm>0?'good':'bad'}">$${cm.toFixed(2)}</span></div>
      <div class="ro"><span class="l">Margin % of retail</span><span class="v ${cm/r>=.5?'good':cm/r>=.4?'mid':'bad'}">${r?((cm/r)*100).toFixed(0):0}%</span></div>
      <div class="ro"><span class="l">Break-even ROAS</span><span class="v">${beR?beR.toFixed(2)+'x':'—'}</span></div>
      <div class="ro"><span class="l">Break-even CPA</span><span class="v">${cm>0?'$'+cm.toFixed(2):'—'}</span></div>`;
    const pctM = r? cm/r : 0;
    let cls='good', t='Workable economics',
      m=`A break-even ROAS of ${beR.toFixed(2)}x is achievable. You can spend up to $${cm.toFixed(2)} per order before losing money, so target a CPA near $${(cm*0.8).toFixed(2)} to keep roughly a 20% net margin.${dutyPct>0?` Duty and brokerage are costing you $${(duty+brok).toFixed(2)} per order — sourcing domestically or importing in bulk is the main lever against that.`:' Set duty to zero only if you are shipping from stock already inside your customer\'s country.'}`;
    if(pctM < 0.4){ cls='bad'; t='Too thin to advertise';
      m='Contribution margin is under 40% of retail. Paid acquisition will not be affordable. Raise the price, find a cheaper supplier, or bundle to lift order value before spending anything on ads.'; }
    else if(pctM < 0.5){ cls='mid'; t='Marginal — proceed carefully';
      m='Between 40% and 50% you have very little room for error. A modest CPM increase flips this to a loss. Prioritise raising average order value before scaling.'; }
    $('#be-v').innerHTML = `<div class="verdict ${cls}"><b>${t}</b>${m}</div>`;
  }

  if(which==='margin'){
    const c=num('mg-c'), a=num('mg-a'), p=num('mg-p')/100, n=num('mg-n')/100, r=num('mg-r');
    const feas = (1-n) > 0.001;
    const minP = feas ? (c + a + (r*p)) / (1-n) : Infinity;
    const cm = r - c - r*p;
    const net = cm - a;
    const netPct = r? net/r : 0;
    $('#mg-out').innerHTML = `
      <div class="ro"><span class="l">Minimum viable price</span><span class="v ${feas?'':'bad'}">${feas?'$'+minP.toFixed(2):'n/a'}</span></div>
      <div class="ro"><span class="l">Your price</span><span class="v ${r>=minP?'good':'bad'}">$${r.toFixed(2)}</span></div>
      <div class="ro"><span class="l">Net per order</span><span class="v ${net>0?'good':'bad'}">$${net.toFixed(2)}</span></div>
      <div class="ro"><span class="l">Net margin</span><span class="v ${netPct>=.15?'good':netPct>0?'mid':'bad'}">${(netPct*100).toFixed(0)}%</span></div>`;
    let cls,t,m;
    if(!feas){ cls='bad'; t='Target margin not achievable';
      m='A target net margin of 100% or more is mathematically impossible — it leaves nothing for cost of goods or advertising. Set a realistic target, usually 15–25%.'; }
    else if(r < minP){ cls='bad'; t='Underpriced';
      m=`At $${r.toFixed(2)} you cannot hit a ${(n*100).toFixed(0)}% net margin with a $${a.toFixed(2)} CPA. Price at $${(Math.ceil(minP)-0.01).toFixed(2)} or reduce acquisition cost.`; }
    else if(netPct < 0.15){ cls='mid'; t='Priced, but tight';
      m=`You clear the minimum but net margin is ${(netPct*100).toFixed(0)}%. Add a bundle or post-purchase upsell rather than raising the headline price further.`; }
    else { cls='good'; t='Priced correctly';
      m=`$${r.toFixed(2)} covers cost, acquisition and your target margin, leaving $${net.toFixed(2)} per order before overhead.`; }
    $('#mg-v').innerHTML = `<div class="verdict ${cls}"><b>${t}</b>${m}</div>`;
  }

  if(which==='roas'){
    const s=num('ra-s'), o=num('ra-o'), r=num('ra-r'), c=num('ra-c'),
          v=num('ra-v'), kk=num('ra-k'), im=num('ra-i');
    const rev = o*r, roas = s? rev/s : 0, cpa = o? s/o : null;
    const cm = r - c, beROAS = cm>0 ? r/cm : 0;
    const netPer = cpa===null ? 0 : cm - cpa, net = netPer*o;
    const ctr = im? kk/im*100 : 0, cvr = v? o/v*100 : 0, cpc = kk? s/kk : 0;
    $('#ra-out').innerHTML = `
      <div class="ro"><span class="l">ROAS</span><span class="v ${roas>=beROAS?'good':'bad'}">${roas.toFixed(2)}x</span></div>
      <div class="ro"><span class="l">Break-even ROAS</span><span class="v">${beROAS.toFixed(2)}x</span></div>
      <div class="ro"><span class="l">CPA</span><span class="v ${cpa===null?'bad':cpa<=cm*0.4?'good':cpa<=cm?'mid':'bad'}">${cpa===null?'—':'$'+cpa.toFixed(2)}</span></div>
      <div class="ro"><span class="l">Net profit</span><span class="v ${net>0?'good':'bad'}">$${net.toFixed(0)}</span></div>
      <div class="ro"><span class="l">CTR</span><span class="v ${ctr>=1.5?'good':ctr>=1?'mid':'bad'}">${ctr.toFixed(2)}%</span></div>
      <div class="ro"><span class="l">Conv. rate</span><span class="v ${cvr>=2?'good':cvr>=1.5?'mid':'bad'}">${cvr.toFixed(2)}%</span></div>
      <div class="ro"><span class="l">CPC</span><span class="v ${cpc<=1?'good':cpc<=1.6?'mid':'bad'}">$${cpc.toFixed(2)}</span></div>`;
    let issues=[];
    if(ctr<1) issues.push('<b>CTR is below 1%</b> — a creative problem. The hook is not stopping the scroll. Produce new angles, not new audiences.');
    if(ctr>=1 && cvr<1.5) issues.push('<b>Conversion rate is weak relative to CTR</b> — a landing page problem. Check price consistency with the ad, image quality, load speed and missing information.');
    if(cpa===null) issues.push(`<b>Zero orders recorded</b> — with spend but no conversions there is no CPA to judge. If spend has passed roughly 2–3x your product price with no sale, the problem is upstream: check CTR first, then the product page.`);
    else if(cpa>cm) issues.push(`<b>CPA of $${cpa.toFixed(2)} exceeds contribution margin of $${cm.toFixed(2)}</b> — you lose money on every sale. Cut the losing ad sets or fix the offer.`);
    else if(cpa>cm*0.4) issues.push(`<b>CPA is above 40% of contribution margin</b> — profitable but with little buffer. Raise AOV with bundles or an upsell rather than pushing budget.`);
    if(cpc>1.6) issues.push('<b>CPC is high</b> — usually a symptom of low CTR or heavy auction competition. Improve the creative before raising budget.');
    let cls = roas>=beROAS*1.5 ? 'good' : roas>=beROAS ? 'mid' : 'bad';
    let t = roas>=beROAS*1.5 ? 'Profitable with headroom' : roas>=beROAS ? 'Marginally profitable' : 'Losing money';
    $('#ra-v-out').innerHTML = `<div class="verdict ${cls}"><b>${t}</b>${
      issues.length ? '<ul style="margin:6px 0 0;padding-left:18px">'+issues.map(i=>`<li style="margin-bottom:5px">${i}</li>`).join('')+'</ul>'
      : 'No structural problems detected. Scale at 20–30% every 48 hours while ROAS holds.'}</div>`;
  }

  if(which==='niche'){
    let tot=0;
    NICHE_Q.forEach((q,i)=>{ const v=num('nc-'+i); tot+=v; const el=$('#ncv-'+i); if(el) el.textContent=v; });
    const max = NICHE_Q.length*5, pct = Math.round(tot/max*100);
    const fails = NICHE_Q.map((q,i)=>({n:q[0],v:num('nc-'+i)})).filter(x=>x.v<=2);
    $('#nc-out').innerHTML = `
      <div class="ro"><span class="l">Total score</span><span class="v ${pct>=75?'good':pct>=55?'mid':'bad'}">${tot}/${max}</span></div>
      <div class="ro"><span class="l">Rating</span><span class="v ${pct>=75?'good':pct>=55?'mid':'bad'}">${pct}%</span></div>
      <div class="ro"><span class="l">Weak filters</span><span class="v ${fails.length===0?'good':fails.length<=1?'mid':'bad'}">${fails.length}</span></div>`;
    let cls,t,m;
    if(fails.length>=2){ cls='bad'; t='Do not proceed';
      m=`Two or more filters score 2 or below (${fails.map(f=>f.n).join('; ')}). These are structural constraints — execution cannot compensate. Find a different niche.`; }
    else if(pct>=75 && fails.length===0){ cls='good'; t='Strong candidate';
      m='This niche clears every filter. Move to product research and start contacting suppliers.'; }
    else if(pct>=55){ cls='mid'; t='Workable with a caveat';
      m= fails.length ? `Everything holds except <b>${fails[0].n}</b>. Either find a way to solve that specifically, or compare against a second niche before committing.`
        : 'Scores are acceptable but nothing is strong. Compare against at least one alternative before committing three months to it.'; }
    else { cls='bad'; t='Too weak';
      m='Overall score is below 55%. Nothing here is decisively good, which usually means either thin margins or an audience you cannot reach affordably.'; }
    $('#nc-v').innerHTML = `<div class="verdict ${cls}"><b>${t}</b>${m}</div>`;
  }
}

function runScale(){
  const on = SCALE_Q.filter((_,i)=>S.gate && S.gate[i]).length;
  const tot = SCALE_Q.length;
  let cls,t,m;
  if(on===tot){ cls='good'; t='Cleared to scale';
    m='Every gate passes. Increase budget 20–30% every 48 hours while ROAS holds, and produce new creative continuously — fatigue, not budget, will be your ceiling.'; }
  else if(on>=tot-2){ cls='mid'; t='Nearly ready';
    m=`${tot-on} gate${tot-on>1?'s':''} still open. Close them before adding budget. Scaling amplifies whatever exists, including the gaps.`; }
  else { cls='bad'; t='Not ready';
    m=`${tot-on} gates are open. Adding budget now multiplies problems as efficiently as profit — most commonly producing more refunds and a payment processor review. Fix the fundamentals first.`; }
  const el = $('#sc-v'); if(el) el.innerHTML = `<div class="verdict ${cls}"><b>${t} — ${on}/${tot} gates passed</b>${m}</div>`;
}
</script>

function hi(text){
  const q = ivQuery.trim();
  if(!q) return text;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return text.replace(new RegExp('('+safe+')','ig'),'<mark>$1</mark>'); }
  catch(e){ return text; }
}
