const CASES = [
{
 id:'c1', code:'CASE-01', title:'The 1.9x Trap', mins:12,
 lede:'A store that looks profitable on every dashboard and loses money on every order. Find the leak before it runs out of cash.',
 profile:[['Niche','Pet accessories'],['Age','Month 5'],['Revenue','$14,200/mo'],['Hero product','Nail grinder'],['Traffic','Meta ads, 90%'],['Team','Owner only']],
 brief:['<p>Priya sells a quiet pet nail grinder at $49.99. Her supplier invoice is $12 a unit and freight is $4.50. She has been running Meta ads for three months and her dashboard shows a steady 1.9x ROAS, which she has been told is profitable because her break-even is 1.58x.</p><p>Revenue is growing. Her bank balance is not. She has started using a credit card to cover supplier payments and does not know why.</p>'],
 stages:[
  {when:'Week 1 — First look', metrics:[{l:'ROAS',v:'1.9x',t:'mid'},{l:'CVR',v:'2.6%',t:'good'},{l:'AOV',v:'$52',t:'good'},{l:'Refunds',v:'3%',t:'good'}],
   q:'Every front-end metric looks healthy but the bank balance is falling. What do you check first?',
   opts:[
    {t:'Rebuild the unit economics from bank statements, not the Shopify dashboard',s:2,fb:'Correct. Strong front-end metrics with weak cash means the leak is below the ad line. The dashboard shows revenue and ad spend; it does not show duty, brokerage, app subscriptions or the real cost of goods. Always reconcile against money that actually moved.'},
    {t:'Test new ad creative to push ROAS above 2x',s:0,fb:'This spends money to solve a problem you have not diagnosed. If the unit is unprofitable, a higher ROAS on a broken unit just loses money faster. Never optimise before you have measured.'},
    {t:'Raise the price by 15% and see what happens',s:1,fb:'Defensible instinct — the price probably is too low — but you are guessing. Change the price after you know the true landed cost, not before, or you will not know whether the new price is actually sufficient.'},
    {t:'Pause all ads until the bank balance recovers',s:1,fb:'It stops the bleeding but teaches you nothing, and you lose the campaign learning. Reasonable as an emergency brake if cash is critical, but diagnosis has to happen either way.'}
   ],
   after:'You pull three months of bank and card statements and rebuild the unit economics line by line.'},

  {when:'Week 1 — The reconciliation', metrics:[{l:'Product',v:'$12.00'},{l:'Freight',v:'$4.50'},{l:'Duty + tariff',v:'$6.20',t:'bad'},{l:'Brokerage',v:'$1.80',t:'bad'},{l:'Processing',v:'$1.75'}],
   q:'Duty and brokerage are $8.00 a unit and were never in her model. What is her actual break-even ROAS?',
   opts:[
    {t:'1.58x — unchanged, duty is a fixed cost not a unit cost',s:0,fb:'Duty is charged per parcel, so it is absolutely a unit cost. This is the exact error that created the problem.'},
    {t:'About 2.10x — contribution margin is $23.74, so 49.99 divided by 23.74',s:2,fb:'Correct. 49.99 − 12 − 4.50 − 6.20 − 1.80 − 1.75 = $23.74. Break-even ROAS is 49.99 ÷ 23.74 = 2.11x. She has been running at 1.9x, which means she loses roughly $2.60 of contribution on every single order and more once overhead is counted.'},
    {t:'About 1.75x',s:0,fb:'Check the arithmetic. Subtract every direct cost from retail to get contribution margin, then divide retail by that figure.'},
    {t:'It depends on the refund rate',s:1,fb:'Refunds matter for net profit but they are not part of break-even ROAS, which uses contribution margin from direct costs only. Keep the two calculations separate or you will confuse yourself later.'}
   ],
   after:'At 1.9x against a 2.11x break-even, every order has been losing money. Revenue growth was making the hole deeper, not shallower.'},

  {when:'Week 2 — The decision', metrics:[{l:'True BE ROAS',v:'2.11x',t:'bad'},{l:'Actual ROAS',v:'1.9x',t:'bad'},{l:'Loss / order',v:'−$2.60',t:'bad'},{l:'Cash runway',v:'6 weeks',t:'bad'}],
   q:'She has six weeks of runway. What is the highest-value move?',
   opts:[
    {t:'Raise price to $59.99 and add a two-pack bundle at $89.99',s:2,fb:'Best move. Raising price to $59.99 lifts contribution margin to about $33.45 and drops break-even ROAS to roughly 1.79x — below her current performance, which makes her immediately profitable. The bundle raises AOV, which spreads the fixed brokerage cost across more units. Pricing is the fastest lever because it requires no new traffic.'},
    {t:'Cut ad spend by half to preserve cash',s:1,fb:'It slows the loss but does not fix it — she still loses money on every remaining order, and she loses campaign momentum too. A reasonable simultaneous action, not a solution.'},
    {t:'Switch to a cheaper Chinese supplier at $9 a unit',s:1,fb:'Saves $3 but duty is charged on customs value, so a cheaper unit reduces duty slightly too. It helps, but it takes weeks to re-sample and re-test, and she has six weeks of runway. Pricing moves today.'},
    {t:'Find new creative to push ROAS to 2.5x',s:0,fb:'Hoping for a 30% performance improvement is not a plan when you have six weeks of cash. Fix the unit economics first; creative improvement is a bonus on top of a working unit, not a substitute for one.'}
   ],
   after:'She reprices to $59.99 with a two-pack at $89.99. Conversion rate drops from 2.6% to 2.3%, but she is now profitable per order.'},

  {when:'Week 6 — Structural fix', metrics:[{l:'ROAS',v:'1.95x',t:'mid'},{l:'BE ROAS',v:'1.79x',t:'good'},{l:'Net/order',v:'+$2.90',t:'good'},{l:'Orders/day',v:'11',t:'good'}],
   q:'She is profitable but thin, and running about 11 orders a day. What is the structural move?',
   opts:[
    {t:'Move to a sourcing agent and negotiate DDP landed pricing',s:2,fb:'Right call at this volume. Above roughly 10 orders a day an agent typically cuts 20–35% of unit cost and 7–10 days of delivery, and can quote an all-in DDP landed cost so there are no more surprises. That is a margin gain, a speed gain and a predictability gain from one decision.'},
    {t:'Scale ad budget aggressively now that she is profitable',s:0,fb:'At a 1.95x ROAS against a 1.79x break-even there is almost no buffer. A modest CPM rise puts her back underwater. Build margin before volume.'},
    {t:'Launch a second store in a different niche',s:0,fb:'Splitting focus before one store is robustly profitable is the classic way capable people fail at this. She has one thin product, not a repeatable system.'},
    {t:'Build email flows to raise repeat purchase rate',s:2,fb:'Also correct, and complementary. Pet accessories have genuine repeat potential, and repeat orders carry no acquisition cost at all, which is the cheapest margin available. Doing this alongside the agent move is the strongest combination.'}
   ],
   after:'She moves to an agent at $9.40 landed all-in DDP and builds three email flows.'}
 ],
 debrief:'<p>Priya was never running a bad store. Her conversion rate, AOV and refund rate were all healthy. She was running a correctly-executed store on an incorrect model — and because the error was in the model rather than the execution, no amount of dashboard-watching would have revealed it.</p><p>Two lessons generalise. First, reconcile against money that actually left your bank account, not against a platform dashboard that only knows what you told it. Second, when the unit is broken, pricing is almost always the fastest lever, because it needs no new traffic, no new supplier and no new creative — it works the same afternoon you change it.</p>'
},

{
 id:'c2', code:'CASE-02', title:'Scaling Into a Wall', mins:12,
 lede:'A profitable store triples its budget and everything fails at once. Triage in the right order.',
 profile:[['Niche','Home organisation'],['Age','Month 9'],['Revenue','$46,000/mo'],['Hero product','Cable organiser'],['Traffic','Meta + TikTok'],['Team','Owner + 1 VA']],
 brief:['<p>Marcus had a genuinely good month. His hero product ran at 3.1x ROAS for eleven straight days on a $400 daily budget, so on a Friday he raised the budget to $1,200 and duplicated the winning ad set into four new audiences.</p><p>By the following Thursday: ROAS 1.4x, his supplier has gone quiet with 80 unfulfilled orders, his chargeback rate has moved from 0.4% to 1.1%, and his VA has a 60-ticket backlog.</p>'],
 stages:[
  {when:'Thursday — Everything at once', metrics:[{l:'ROAS',v:'1.4x',t:'bad'},{l:'Chargebacks',v:'1.1%',t:'bad'},{l:'Unfulfilled',v:'80',t:'bad'},{l:'Ticket backlog',v:'60',t:'bad'}],
   q:'Four things are broken. What do you address first?',
   opts:[
    {t:'The chargeback rate — it threatens your ability to take payment at all',s:2,fb:'Correct triage. Everything else costs money; this one ends the business. Above roughly 1% the escalation path runs warning, then rolling reserve, then termination, and a terminated processor account is close to unrecoverable. Threats to existence outrank threats to profit.'},
    {t:'The ROAS collapse — revenue is the priority',s:1,fb:'Understandable but wrong order. A store with no payment processor has no revenue at any ROAS. Fix what can kill you before you fix what can shrink you.'},
    {t:'The supplier silence — customers are waiting',s:1,fb:'Close. The supplier problem is what is causing the chargebacks, so you will address it immediately after — but the first action is the customer communication that prevents disputes, not the supply chain conversation that fixes fulfilment.'},
    {t:'The ticket backlog — the VA is drowning',s:1,fb:'The backlog matters because unanswered tickets become chargebacks, so you are pointing at the right mechanism. But the specific first action is proactive contact with all 80 affected customers, not working through the queue in order.'}
   ],
   after:'You pause ads on affected products and email all 80 customers proactively with an honest status and a choice.'},

  {when:'Thursday — Customer communication', metrics:[{l:'Affected',v:'80'},{l:'Item value',v:'$34'},{l:'Days late',v:'9',t:'bad'},{l:'Disputes filed',v:'7',t:'bad'}],
   q:'What do you tell the 80 customers?',
   opts:[
    {t:'Honest status, a specific new date, and an immediate choice: wait or take a full refund now',s:2,fb:'Correct. Giving people control removes the reason to file a dispute. Note that this costs you some refunds you might otherwise have avoided — that is the point. A refund is cheaper than a chargeback, which costs the refund plus a fee plus a mark against your account.'},
    {t:'Apologise and ask for ten more days of patience',s:0,fb:'You are asking people who are already nine days late to extend a promise you have already broken once. A meaningful share will go straight to their bank instead, which is the outcome you are trying to prevent.'},
    {t:'Refund all 80 immediately without asking',s:1,fb:'Safe and it does protect the processor, but it destroys about $2,700 of revenue including from customers who would happily have waited. Offering the choice gets most of the protection at a fraction of the cost.'},
    {t:'Say nothing until the supplier responds',s:0,fb:'Silence is the single largest cause of disputes. Every day without contact converts more waiting customers into chargebacks.'}
   ],
   after:'31 customers take the refund, 49 choose to wait. No further disputes are filed.'},

  {when:'Friday — The supplier', metrics:[{l:'Supplier',v:'Silent 6d',t:'bad'},{l:'Backup',v:'None',t:'bad'},{l:'Daily orders',v:'Paused'},{l:'Cash held',v:'$9,400'}],
   q:'The supplier has been silent for six days and you have no backup. What now?',
   opts:[
    {t:'Source and sample two alternative suppliers now, keeping ads paused until one is qualified',s:2,fb:'Correct. Ads stay off because adding new orders to a broken pipeline compounds the problem. Qualifying a backup is the work that should have happened at 20 units a week, and the lesson is to do it before you need it, not during.'},
    {t:'Resume ads and assume the supplier will come back',s:0,fb:'You would be selling something you cannot ship, to customers who will dispute. This is how a recoverable operational problem becomes a terminated processor account.'},
    {t:'Switch to a domestic supplier at higher unit cost',s:2,fb:'Also strong. Higher unit cost but faster delivery, no duty surprises and no overnight silence. Given the chargeback situation, paying more for reliability is a rational trade right now — and post-duty the cost gap is smaller than it looks.'},
    {t:'Wait one more week before acting',s:0,fb:'Six days of silence with 49 customers waiting is already past the point of patience. Every additional day increases the chance the remaining customers dispute too.'}
   ],
   after:'You qualify a domestic supplier at $6 more per unit with three-day delivery, and separately re-establish contact with the original supplier as a secondary.'},

  {when:'Week 3 — The ad account', metrics:[{l:'ROAS',v:'1.4x',t:'bad'},{l:'CPM',v:'+62%',t:'bad'},{l:'CTR',v:'0.7%',t:'bad'},{l:'Prev CTR',v:'1.9%'}],
   q:'With fulfilment fixed, you return to the ad problem. CTR fell from 1.9% to 0.7% and CPM rose 62%. What happened?',
   opts:[
    {t:'Creative fatigue plus audience overlap from duplicating into four audiences at once',s:2,fb:'Correct on both counts. Tripling the budget pushed the campaign back into learning, and four simultaneous duplicates competed against each other in the auction, driving up your own CPM. The CTR collapse is the same creative being shown too often to overlapping people.'},
    {t:'The product has saturated and should be retired',s:0,fb:'Too early to conclude. The metrics changed the week you changed the structure, not gradually over months. Diagnose your own actions before blaming the market.'},
    {t:'Seasonal decline',s:0,fb:'A 62% CPM jump in six days is not seasonality. Look for a cause with the same timing as the effect.'},
    {t:'The pause during the supplier crisis reset everything',s:1,fb:'The pause did reset learning and is part of the picture, but the CTR collapse began before the pause, right when the budget tripled and the duplicates launched.'}
   ],
   after:'You consolidate back to one campaign, return to a $500 daily budget, and brief three new creative angles.'}
 ],
 debrief:'<p>Marcus made one decision on a Friday and it broke four things by Thursday. That is the defining property of scaling: it does not create new problems, it amplifies existing ones at a speed you cannot manually manage. He had no backup supplier, no support capacity headroom and no creative pipeline — all survivable at $400 a day, all simultaneously fatal at $1,200.</p><p>The triage order is the transferable lesson. Payment processing first because it can end the business, customer communication second because it prevents the disputes, supply chain third because it removes the cause, and advertising last because it is only money. Most people do this exactly backwards and work on the ROAS because it is the number they enjoy looking at.</p>'
},

{
 id:'c3', code:'CASE-03', title:'The Plateau', mins:11,
 lede:'Profitable, stable, and stuck at the same number for five months. Find the growth that is already in the business.',
 profile:[['Niche','Outdoor cooking'],['Age','Month 14'],['Revenue','$21,000/mo'],['Net margin','17%'],['Products','1 hero, 2 filler'],['Repeat rate','4%']],
 brief:['<p>Dani sells a compact camping stove at $89. The store has been profitable for eight months at roughly $21,000 a month and has not moved in five. ROAS sits at 2.6x against a 1.9x break-even. Conversion is 2.4%. Refunds are 3%.</p><p>Nothing is wrong. Nothing is growing either. She has been increasing the ad budget but revenue rises and falls back within a fortnight each time.</p>'],
 stages:[
  {when:'Diagnosis', metrics:[{l:'ROAS',v:'2.6x',t:'good'},{l:'CVR',v:'2.4%',t:'good'},{l:'Repeat rate',v:'4%',t:'bad'},{l:'Email revenue',v:'3%',t:'bad'}],
   q:'Acquisition metrics are healthy. Which number explains the plateau?',
   opts:[
    {t:'The 4% repeat rate — every dollar of revenue costs a dollar of advertising, permanently',s:2,fb:'Correct. With a 4% repeat rate she is buying essentially every sale at full price forever. Her revenue is therefore capped by what her ad budget can profitably buy, and since ROAS falls as budget rises, that cap is exactly where she is sitting. This is a retention problem wearing an acquisition problem as a disguise.'},
    {t:'The 2.4% conversion rate — it should be higher',s:1,fb:'2.4% is perfectly healthy for cold paid traffic. Improving it would help marginally, but it is not what is holding the ceiling in place.'},
    {t:'The 2.6x ROAS — she needs better creative',s:1,fb:'2.6x against a 1.9x break-even is a good position. Better creative would let her spend more, but it does not change the fundamental economics of buying every customer once.'},
    {t:'The refund rate',s:0,fb:'3% is well within normal. This is not the constraint.'}
   ],
   after:'You confirm it: 96% of customers buy exactly once, and email accounts for 3% of revenue.'},

  {when:'Move 1 — Order value', metrics:[{l:'AOV',v:'$89',t:'mid'},{l:'Items/order',v:'1.03',t:'bad'},{l:'Upsell',v:'None',t:'bad'},{l:'Free ship',v:'Always',t:'mid'}],
   q:'Almost every order is a single item and there is no upsell. What is the fastest revenue gain?',
   opts:[
    {t:'Add a post-purchase one-click upsell for fuel canisters and a carry case',s:2,fb:'Fastest available gain. Post-purchase upsells convert at 10–25% and cost nothing in acquisition because the customer has already paid. For a camping stove the natural attachments are obvious — fuel, case, cookware — and they also seed the replenishment habit you need for retention.'},
    {t:'Raise the price to $99',s:1,fb:'Possible, but she is not margin-constrained at 17% net and a price rise on a stable product risks the conversion rate that is currently working. Add value before adding price.'},
    {t:'Remove free shipping to recover margin',s:0,fb:'Surprise costs at checkout are a leading cause of abandonment. This would damage the one part of the funnel that is performing.'},
    {t:'Run a sitewide 15% discount to drive volume',s:0,fb:'Discounting a profitable product to chase volume reduces margin without addressing why customers never return. It also trains buyers to wait for sales.'}
   ],
   after:'Upsell attach rate reaches 19%. AOV moves from $89 to $104.'},

  {when:'Move 2 — Retention', metrics:[{l:'AOV',v:'$104',t:'good'},{l:'Repeat rate',v:'4%',t:'bad'},{l:'Email list',v:'2,900'},{l:'Flows live',v:'0',t:'bad'}],
   q:'She has 2,900 email addresses and no flows at all. Which do you build first?',
   opts:[
    {t:'Abandoned cart, then post-purchase, then replenishment for fuel',s:2,fb:'Right order. Abandoned cart typically drives 20–30% of email revenue because it reaches the highest-intent audience at near-zero cost, so it pays for the tool immediately. Post-purchase then captures reviews and seeds the second sale, and fuel replenishment converts a one-time stove buyer into a recurring customer — which is the actual fix for the plateau.'},
    {t:'A weekly newsletter to the whole list',s:1,fb:'Broadcasts do produce revenue, but flows run automatically forever while a newsletter is work every week. Build the automation first, then add broadcasts on top.'},
    {t:'A win-back campaign to everyone who bought over 90 days ago',s:1,fb:'Worth doing, but it is a one-off harvest of an existing list. The flows are the machine that keeps working. Build the machine first.'},
    {t:'A loyalty points programme',s:0,fb:'Loyalty programmes work on stores that already have repeat purchases to reward. At a 4% repeat rate there is almost nothing to build on yet.'}
   ],
   after:'Over three months, email grows from 3% to 24% of revenue and the repeat rate moves from 4% to 16%.'},

  {when:'Move 3 — The new ceiling', metrics:[{l:'Revenue',v:'$34,000',t:'good'},{l:'Repeat rate',v:'16%',t:'good'},{l:'Email rev',v:'24%',t:'good'},{l:'LTV',v:'1.6x AOV',t:'good'}],
   q:'Revenue is up 62% with no increase in ad budget. What does the higher LTV now allow?',
   opts:[
    {t:'Bid more aggressively — a 1.6x LTV means she can afford a materially higher first-order CPA',s:2,fb:'Exactly the point. If a customer is worth 1.6 orders, she can pay up to 1.6 times more to acquire them and remain profitable. That lets her win auctions competitors buying single orders cannot afford, which is a structural advantage no creative optimisation can match. Retention work is acquisition strategy.'},
    {t:'Keep the budget flat and bank the extra profit',s:1,fb:'Defensible if she wants income rather than growth, and a legitimate choice. But she has just earned the ability to outbid her competition and this is the moment it is worth most.'},
    {t:'Launch into a new unrelated niche',s:0,fb:'She has just discovered that her real asset is a list of people who cook outdoors. Abandoning that to start again from zero discards the thing she just built.'},
    {t:'Cut ad spend since email is working',s:0,fb:'Email monetises customers that advertising acquires. Cutting acquisition starves the list that is now producing 24% of revenue.'}
   ],
   after:'She raises target CPA in line with LTV, expands into a second product for the same audience, and begins discussing private label with her agent.'}
 ],
 debrief:'<p>Dani was not stuck because anything was broken. She was stuck because she had built an acquisition machine and no retention machine, and an acquisition-only business has a hard mathematical ceiling: the point at which the next dollar of ad spend stops being profitable. Pushing budget against that ceiling is why revenue kept rising and falling back.</p><p>The sequence matters. Raising AOV first was the fastest gain and required no new customers. Retention second turned one-time buyers into a compounding asset. And only then did the higher LTV unlock the acquisition bidding power, which is the growth everyone tries to buy first and almost nobody can afford until retention pays for it.</p>'
}
];

/* ============================================================
