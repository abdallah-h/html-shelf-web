<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل العتاد · Hardware Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="shelf-vendor:/fonts/8ba6c2606eca.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1A; --surface:#111826; --surface-2:#0D1320;
    --line:#1E2A3D; --line-soft:#172234;
    --ink:#E8EEF6; --muted:#8595AC; --muted-2:#5E6E86;
    --signal:#4FC8E6; --signal-dim:rgba(79,200,230,.14);
    --copper:#D8964F; --copper-dim:rgba(216,150,79,.14);
    --good:#63CE93; --bad:#E07A6E;
    --grid:rgba(79,200,230,.045);
    --radius:14px; --maxw:1180px;
    --disp:"Cairo"; --body:"IBM Plex Sans Arabic";
  }
  html[lang="en"]{--disp:"IBM Plex Sans"; --body:"IBM Plex Sans";}
  body.light{
    --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#E9EFF6;
    --line:#D3DEEA; --line-soft:#E2EAF3;
    --ink:#13202E; --muted:#566679; --muted-2:#8595A8;
    --signal:#1488B0; --signal-dim:rgba(20,136,176,.12);
    --copper:#B26A28; --copper-dim:rgba(178,106,40,.12);
    --good:#2E9E63; --bad:#C8503F;
    --grid:rgba(20,136,176,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
  body{background:var(--bg);color:var(--ink);font-family:var(--body),system-ui,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .25s,color .25s;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px}
  ::selection{background:var(--signal-dim);color:var(--ink)}
  .mono{font-family:"IBM Plex Mono",monospace;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}
  header.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar-inner{max-width:var(--maxw);margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:14px;height:64px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:900;font-family:var(--disp);font-size:1.05rem;letter-spacing:-.01em;flex:none}
  .brand .glyph{width:30px;height:30px;border:1.5px solid var(--signal);border-radius:7px;display:grid;place-items:center;color:var(--signal);position:relative;flex:none}
  .brand .glyph::before,.brand .glyph::after{content:"";position:absolute;background:var(--signal)}
  .brand .glyph::before{width:6px;height:1.5px;right:-6px;top:13px}
  .brand .glyph::after{width:6px;height:1.5px;left:-6px;bottom:13px}
  .brand .glyph i{width:11px;height:11px;border:1.5px solid var(--signal);border-radius:2px;display:block}
  .tabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab-div{width:1px;height:22px;background:var(--line);flex:none;margin:0 6px}
  .tab{font-family:var(--disp);font-weight:700;font-size:.85rem;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:.16s;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px}
  .tab:hover{color:var(--ink);background:var(--surface)}
  .tab[aria-current="true"]{color:#fff;background:var(--signal);border-color:var(--signal)}
  .tab.tool[aria-current="true"]{background:var(--copper);border-color:var(--copper)}
  .tab svg{width:14px;height:14px}
  .actions{display:flex;align-items:center;gap:8px;flex:none}
  .iconbtn{min-width:36px;height:36px;padding:0 9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:9px;cursor:pointer;transition:.14s;font-family:"IBM Plex Mono";font-weight:600;font-size:.8rem}
  .iconbtn:hover{color:var(--signal);border-color:var(--signal)}
  .searchwrap{position:relative;flex:none}
  #search{width:150px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--body);font-size:.86rem;padding-block:8px;padding-inline-start:12px;padding-inline-end:32px;border-radius:9px;transition:.16s}
  #search::placeholder{color:var(--muted-2)}
  #search:focus{border-color:var(--signal);outline:none}
  .searchwrap svg{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none}
  .hero{max-width:var(--maxw);margin:0 auto;padding:60px 22px 28px;position:relative}
  .hero .eyebrow{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.22em;color:var(--signal);text-transform:uppercase;margin-bottom:18px}
  .hero h1{font-family:var(--disp);font-weight:900;line-height:1.18;letter-spacing:-.02em;font-size:clamp(2.1rem,6vw,4rem);margin-bottom:20px}
  .hero h1 .hl{color:var(--signal)}
  .hero p.lead{font-size:clamp(1rem,2.4vw,1.18rem);color:var(--muted);max-width:64ch}
  .hero .meta{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px;padding-top:24px;border-top:1px dashed var(--line)}
  .hero .meta div{font-family:"IBM Plex Mono";font-size:.78rem;color:var(--muted-2)}
  .hero .meta b{display:block;font-family:var(--disp);font-weight:900;font-size:1.6rem;color:var(--copper);line-height:1.1;margin-bottom:2px}
  .reg{position:absolute;width:18px;height:18px;opacity:.4}
  .reg::before,.reg::after{content:"";position:absolute;background:var(--signal)}
  .reg::before{width:100%;height:1px;top:50%}.reg::after{height:100%;width:1px;right:50%}
  .reg.tl{top:30px;inset-inline-start:0}.reg.tr{top:30px;inset-inline-end:6px}
  .shell{max-width:var(--maxw);margin:0 auto;padding:10px 22px 90px;display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:start}
  .shell.tools-mode{grid-template-columns:1fr}
  .shell.tools-mode nav.side{display:none}
  nav.side{position:sticky;top:80px}
  .side-title{font-family:"IBM Plex Mono";font-size:.7rem;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase;padding:0 10px 10px}
  .side a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:.9rem;font-weight:500;cursor:pointer;transition:.14s;border-inline-end:2px solid transparent}
  .side a:hover{color:var(--ink);background:var(--surface)}
  .side a.active{color:var(--signal);background:var(--signal-dim);border-inline-end-color:var(--signal)}
  .side a .num{font-family:"IBM Plex Mono";font-size:.72rem;color:var(--muted-2);min-width:22px}
  .side a.active .num{color:var(--signal)}
  main{min-width:0}
  .section-head{margin-bottom:8px}
  .section-head .kind{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.2em;color:var(--copper);text-transform:uppercase}
  .section-head h2{font-family:var(--disp);font-weight:900;font-size:2rem;letter-spacing:-.02em;margin:6px 0 8px}
  .section-head p{color:var(--muted);max-width:66ch;margin-bottom:30px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden;scroll-margin-top:80px;position:relative}
  .card-top{display:flex;gap:18px;align-items:flex-start;padding:22px 22px 18px;padding-inline-end:52px;border-bottom:1px solid var(--line-soft)}
  .fav-btn{position:absolute;top:16px;inset-inline-end:16px;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;cursor:pointer;color:var(--muted-2);transition:.14s}
  .fav-btn:hover{color:var(--copper);border-color:var(--copper)}
  .fav-btn.on{color:var(--copper);border-color:var(--copper);background:var(--copper-dim)}
  .fav-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
  .fav-btn.on svg{fill:currentColor}
  .schematic{width:78px;height:78px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--signal);position:relative}
  .schematic::after{content:"";position:absolute;inset:6px;border:1px dashed var(--line);border-radius:6px;pointer-events:none}
  .schematic svg{width:46px;height:46px}
  .card-id{flex:1;min-width:0}
  .card-id .code{font-family:"IBM Plex Mono";font-size:.72rem;color:var(--muted-2);letter-spacing:.05em}
  .card-id h3{font-family:var(--disp);font-weight:900;font-size:1.3rem;margin:3px 0 6px;letter-spacing:-.01em}
  .card-id .what{color:var(--muted);font-size:.95rem}
  .card-body{padding:20px 22px 24px}
  .block-label{font-family:"IBM Plex Mono";font-size:.7rem;letter-spacing:.16em;color:var(--copper);text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .block-label::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  .block + .block{margin-top:26px}
  .specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
  .spec{background:var(--surface);padding:13px 15px}
  .spec .k{font-family:var(--disp);font-weight:700;font-size:.9rem;color:var(--ink);display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .spec .k .tag{font-family:"IBM Plex Mono";font-size:.66rem;color:var(--copper);background:var(--copper-dim);padding:1px 6px;border-radius:5px;font-weight:500}
  .spec .v{font-size:.87rem;color:var(--muted);line-height:1.6}
  ul.choose{list-style:none;display:grid;gap:10px}
  ul.choose li{display:flex;gap:11px;align-items:flex-start;font-size:.93rem;color:var(--ink)}
  ul.choose li::before{content:"";flex:none;width:7px;height:7px;margin-top:9px;border-radius:2px;background:var(--signal);transform:rotate(45deg)}
  ul.choose li b{color:var(--signal);font-weight:700}
  .ranges{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
  .rng{display:flex;justify-content:space-between;gap:14px;background:var(--surface);padding:11px 15px;font-size:.9rem}
  .rng .rk{font-family:var(--disp);font-weight:700;color:var(--signal);flex:none}
  .rng .rv{color:var(--muted);text-align:end}
  ul.mistakes{list-style:none;display:grid;gap:8px}
  ul.mistakes li{font-size:.9rem;color:var(--muted);padding-inline-start:22px;position:relative}
  ul.mistakes li::before{content:"✕";position:absolute;inset-inline-start:0;top:0;color:var(--bad);font-family:"IBM Plex Mono";font-weight:600}
  .terms{display:grid;gap:10px}
  .term{border:1px solid var(--line-soft);border-radius:9px;padding:11px 14px;background:var(--surface-2)}
  .term .t{font-family:"IBM Plex Mono";font-weight:600;font-size:.84rem;color:var(--copper);margin-bottom:2px}
  .term .d{font-size:.9rem;color:var(--muted)}
  .pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pc-col h4{font-family:var(--disp);font-weight:700;font-size:.9rem;margin-bottom:8px}
  .pc-col.pro h4{color:var(--good)} .pc-col.con h4{color:var(--bad)}
  .pc-col ul{list-style:none;display:grid;gap:6px}
  .pc-col li{font-size:.87rem;color:var(--muted);padding-inline-start:18px;position:relative}
  .pc-col li::before{position:absolute;inset-inline-start:0;top:0;font-family:"IBM Plex Mono"}
  .pc-col.pro li::before{content:"+";color:var(--good)}
  .pc-col.con li::before{content:"−";color:var(--bad)}
  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .mono{display:block;color:var(--copper);margin-bottom:8px;font-size:.8rem;letter-spacing:.1em}
  .cmp-table{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden}
  .cmp-table h3{font-family:var(--disp);font-weight:900;font-size:1.12rem;padding:18px 20px 14px;border-bottom:1px solid var(--line-soft)}
  .cmp-scroll{overflow-x:auto}
  table.t{width:100%;border-collapse:collapse;min-width:520px}
  table.t th,table.t td{padding:12px 16px;text-align:start;font-size:.89rem;border-bottom:1px solid var(--line-soft)}
  table.t thead th{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.06em;color:var(--copper);text-transform:uppercase;background:var(--surface-2)}
  table.t tbody tr:last-child td{border-bottom:none}
  table.t td:first-child,table.t th:first-child{font-family:var(--disp);font-weight:700;color:var(--ink);background:var(--surface-2)}
  table.t td{color:var(--muted)}
  .build-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
  .build{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
  .build-head{padding:18px 20px;border-bottom:1px solid var(--line-soft);border-top:3px solid var(--signal)}
  .build-head .code{font-family:"IBM Plex Mono";font-size:.7rem;color:var(--muted-2);letter-spacing:.08em}
  .build-head h3{font-family:var(--disp);font-weight:900;font-size:1.28rem;margin:4px 0 4px}
  .build-head .use{font-size:.85rem;color:var(--muted)}
  .build-parts{padding:8px 20px 20px;display:grid;gap:1px}
  .build-parts .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:.87rem}
  .build-parts .row:last-child{border-bottom:none}
  .build-parts .row .pk{color:var(--muted-2);font-weight:600;flex:none}
  .build-parts .row .pv{color:var(--ink);text-align:end}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:var(--disp);font-weight:700;font-size:.9rem;margin-bottom:7px}
  .field select,.glsearch{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--body);font-size:.92rem;padding:10px 12px;border-radius:9px;cursor:pointer}
  .field select:focus,.glsearch:focus{border-color:var(--signal);outline:none}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .ccard .card-top{padding:18px}
  .ccard .schematic{width:56px;height:56px}.ccard .schematic svg{width:34px;height:34px}
  .ccard .card-id h3{font-size:1.05rem}
  .ccard .card-body{padding:16px 18px 20px}
  .result{background:linear-gradient(160deg,var(--copper-dim),transparent 60%);border:1px solid var(--copper);border-radius:var(--radius);padding:24px;text-align:center}
  .result .big{font-family:var(--disp);font-weight:900;font-size:3rem;color:var(--copper);line-height:1}
  .result .big span{font-size:1.2rem}
  .result .sub{color:var(--muted);margin-top:8px;font-size:.92rem}
  .result .draw{font-family:"IBM Plex Mono";font-size:.82rem;color:var(--muted-2);margin-top:14px}
  .pill{display:inline-block;font-family:"IBM Plex Mono";font-size:.74rem;color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);padding:4px 10px;border-radius:20px;margin-top:12px}
  .quiz{max-width:640px;margin:0 auto}
  .qstep .qprog{font-family:"IBM Plex Mono";font-size:.72rem;color:var(--muted-2);letter-spacing:.1em;margin-bottom:10px}
  .qstep h3{font-family:var(--disp);font-weight:900;font-size:1.5rem;margin-bottom:20px}
  .qopts{display:grid;gap:11px}
  .qopt{text-align:start;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--body);font-weight:600;font-size:1rem;padding:15px 18px;border-radius:11px;cursor:pointer;transition:.14s;display:flex;align-items:center;gap:12px}
  .qopt::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--line);transform:rotate(45deg);transition:.14s;flex:none}
  .qopt:hover{border-color:var(--signal);background:var(--signal-dim)}
  .qopt:hover::before{background:var(--signal)}
  .qres h3{font-family:var(--disp);font-weight:900;font-size:1.5rem;color:var(--signal);margin-bottom:6px}
  .qres .lead{color:var(--muted);margin-bottom:18px}
  .qback{margin-top:18px;background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--body);font-weight:600;padding:9px 18px;border-radius:9px;cursor:pointer}
  .qback:hover{border-color:var(--signal);color:var(--ink)}
  .faq details{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
  .faq summary{cursor:pointer;padding:15px 18px;font-family:var(--disp);font-weight:700;font-size:1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";font-family:"IBM Plex Mono";color:var(--signal);font-size:1.3rem;flex:none}
  .faq details[open] summary::after{content:"−"}
  .faq details[open] summary{border-bottom:1px solid var(--line-soft)}
  .faq .ans{padding:14px 18px;color:var(--muted);font-size:.94rem}
  .faq .ans b{color:var(--signal)}
  .steps{list-style:none;counter-reset:s;display:grid;gap:12px}
  .steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px 18px;position:relative;padding-inline-start:62px}
  .steps li::before{content:counter(s,decimal);position:absolute;inset-inline-start:16px;top:16px;width:32px;height:32px;display:grid;place-items:center;background:var(--signal-dim);color:var(--signal);border:1px solid var(--signal);border-radius:8px;font-family:"IBM Plex Mono";font-weight:600}
  .steps li h4{font-family:var(--disp);font-weight:700;font-size:1rem;margin-bottom:3px}
  .steps li p{color:var(--muted);font-size:.9rem}
  .note{background:var(--copper-dim);border:1px solid var(--copper);border-radius:11px;padding:14px 18px;color:var(--ink);font-size:.9rem;margin-bottom:18px}
  .note b{color:var(--copper)}
  footer{border-top:1px solid var(--line);background:var(--surface-2)}
  .foot-inner{max-width:var(--maxw);margin:0 auto;padding:34px 22px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted-2);font-size:.82rem}
  @media(max-width:900px){
    .shell{grid-template-columns:1fr;gap:18px}
    nav.side{position:static;top:auto;margin:0 -22px;padding:6px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
    .side-title{display:none}
    .side .links{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .side a{white-space:nowrap;border-inline-end:none;border-bottom:2px solid transparent;padding:7px 11px}
    .side a.active{border-inline-end:none;border-bottom-color:var(--signal)}
  }
  @media(max-width:560px){
    .tab{padding:7px 9px;font-size:.78rem}
    .bar-inner{flex-wrap:wrap;height:auto;padding-block:8px;row-gap:8px}.brand{flex:1}.actions{order:1}.tabs{order:2;flex-basis:100%}.searchwrap{order:3;flex-basis:100%}#search{width:100%}.card{scroll-margin-top:170px}
    .pc-grid,.form-grid,.compare-cols{grid-template-columns:1fr}
    .schematic{width:58px;height:58px}.schematic svg{width:34px;height:34px}
    .hero{padding-top:44px}
    .result .big{font-size:2.4rem}
    .rng{flex-direction:column;gap:2px}.rng .rv{text-align:start}
  }
  @media print{
    header.bar,footer,nav.side,.searchwrap,.actions,.reg,.hero .meta,.tab-div,.fav-btn{display:none!important}
    body{background:#fff!important;color:#111!important;background-image:none!important}
    .shell{display:block;padding:0;max-width:none}.hero{padding:0 0 16px}
    .card,.cmp-table,.build,.panel,.ccard,.faq details,.steps li,.note{break-inside:avoid;border-color:#ccc!important;background:#fff!important}
    .section-head h2,.card-id h3,.build-head h3,.hero h1{color:#111!important}
    .card-top{padding:16px}
    .spec,.term,.build,.cmp-table,.ranges,.rng{background:#fff!important}
    .spec .v,.card-id .what,.rng .rv,.term .d,ul.mistakes li,.faq .ans,.steps li p{color:#333!important}
    table.t td:first-child,table.t th:first-child,table.t thead th{background:#f3f3f3!important}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="brand"><span class="glyph"><i></i></span> <span id="brandTxt"></span></div>
    <div class="tabs" role="tablist" id="tabs"></div>

   {q:"60Hz ولا 144Hz؟",a:"<b>144Hz</b> فرق واضح في الألعاب لو كارتك بيطلّع إطارات تطابقه. للعمل والتصفّح 60Hz كفاية."},
   {q:"الميجابكسل الأعلى = كاميرا أحسن؟",a:"لأ. <b>حجم الحسّاس والمعالجة البرمجية</b> بيفرقوا أكتر من رقم الميجابكسل."},
   {q:"Android ولا iOS؟",a:"مفيش أفضل مطلق. Android مرونة وتنوّع أسعار، وiOS تكامل واستقرار وتحديثات طويلة. اختر حسب أولوياتك وأجهزتك."},
   {q:"لابتوب ولا ديسكتوب؟",a:"الديسكتوب أداء/سعر أعلى وترقية أسهل وتبريد أوسع. اللابتوب للتنقّل. وانتبه: نفس اسم القطعة بيأدّي مختلف في اللابتوب حسب الطاقة (TGP)."},
   {q:"تبريد هوائي ولا مائي؟",a:"الهوائي يكفي أغلب الناس وموثوق ورخيص. المائي (AIO) للمعالجات الحارة أو لو عايز صوت ومظهر أهدأ."},
   {q:"قد إيه باور أحتاج؟",a:"احسب مجموع استهلاك القطع + هامش 30–40%. استخدم <b>حاسبة الباور</b> في الدليل للتقدير، ويفضّل كفاءة 80+ Gold."},
   {q:"إزاي أتأكد إن القطع متوافقة؟",a:"طابق <b>مقبس المعالج</b> مع اللوحة، <b>جيل الرام</b> (DDR4/5) مع اللوحة، و<b>حجم اللوحة</b> مع الكيسة، وتأكد إن الباور كافٍ ومنافذ الكارت موجودة."}
 ]},
 en:{kind:"HELP · FAQ",title:"Frequently Asked Questions",intro:"Quick answers to the questions that come up most when buying.",
  items:[
   {q:"What's the most important part of a gaming PC?",a:"Usually the <b>graphics card</b> — it sets the frame rate. But you still need a matching CPU, PSU, and cooling to avoid a bottleneck."},
   {q:"Do I need an SSD?",a:"Yes, practically essential. Put the <b>OS on an NVMe</b> and you'll feel a big difference in boot and app speed versus a hard drive."},
   {q:"How much RAM do I need?",a:"<b>16GB</b> is comfortable for use and gaming, and <b>32GB+</b> for heavy work and multitasking. Use two sticks for Dual Channel."},
   {q:"DDR4 or DDR5?",a:"Depends on your board and CPU — they aren't cross-compatible. DDR5 is newer, faster, and pricier; DDR4 is great value for budget builds."},
   {q:"1080p, 1440p, or 4K?",a:"<b>1440p</b> is the sweet spot for most people. 1080p for budget and competitive, and 4K for work and movies (needs a strong card for gaming)."},
   {q:"60Hz or 144Hz?",a:"<b>144Hz</b> is a clear difference in games if your card pushes matching frames. For work and browsing, 60Hz is fine."},
   {q:"Do more megapixels mean a better camera?",a:"No. <b>Sensor size and software processing</b> matter more than the megapixel number."},
   {q:"Android or iOS?",a:"There's no absolute best. Android offers flexibility and price variety; iOS offers integration, stability, and long updates. Choose by your priorities and devices."},
   {q:"Laptop or desktop?",a:"Desktops give higher perf/price, easier upgrades, and more cooling. Laptops are for mobility. Note: the same part name performs differently in a laptop depending on power (TGP)."},
   {q:"Air or liquid cooling?",a:"Air is enough for most people — reliable and cheap. Liquid (AIO) suits hot CPUs or if you want quieter, cleaner looks."},
   {q:"How much PSU wattage do I need?",a:"Add up your parts' draw + a 30–40% margin. Use the <b>PSU calculator</b> in this guide to estimate, and prefer 80+ Gold efficiency."},
   {q:"How do I confirm parts are compatible?",a:"Match the <b>CPU socket</b> to the board, the <b>RAM generation</b> (DDR4/5) to the board, and the <b>board size</b> to the case, and make sure the PSU is enough with the right card connectors."}
 ]}
};

  search.placeholder=T().searchPH;
  document.getElementById('langBtn').textContent=T().langLabel;

  let html='';
  ["pc","laptop","monitor","phone","gadgets"].forEach(r=>{html+=`<div class="tab" role="tab" data-route="${r}">${tb[r]}</div>`;});
  html+=`<div class="tab-div"></div>`;
  TOOLKEYS.forEach(r=>{const star=r==='favorites'?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.7 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.8 1.6 7z"/></svg>`:'';html+=`<div class="tab tool" role="tab" data-route="${r}">${star}${tb[r]}</div>`;});
  tabsEl.innerHTML=html;

function setActiveTab(route){tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.route===route?'true':'false'));}

function go(route){currentRoute=route;if(DATA[route]){shell.classList.remove('tools-mode');return renderGuide(route);}if(TOOLS[route]){shell.classList.add('tools-mode');sidelinks.innerHTML='';setActiveTab(route);TOOLS[route]();bindFavs();topScroll();return;}go('pc');}

function renderGuide(cat){const c=DATA[cat];setActiveTab(cat);
  sidelinks.innerHTML=c.items.map((it,i)=>`<a data-go="${it.id}"><span class="num mono">${String(i+1).padStart(2,'0')}</span>${it.name}</a>`).join('');
  main.innerHTML=`<div class="section-head"><div class="kind mono">${c.kind}</div><h2>${c.title}</h2><p>${c.intro}</p></div><div id="cards">${c.items.map(cardHTML).join('')}</div><div class="empty" id="empty" hidden><span class="mono">NO MATCH</span>${T().noMatch}</div>`;
  bindSide();bindFavs();if(search.value)filter(search.value);topScroll();}
function bindSide(){const links=[...sidelinks.querySelectorAll('a')];links.forEach(a=>{a.tabIndex=0;a.onkeydown=e=>{if(e.key==='Enter')a.click();};});links.forEach(a=>a.onclick=()=>{const el=document.getElementById('c-'+a.dataset.go);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});});const cards=[...document.querySelectorAll('.card')];const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.replace('c-','');links.forEach(l=>l.classList.toggle('active',l.dataset.go===id));}});},{rootMargin:'-20% 0px -70% 0px'});cards.forEach(c=>obs.observe(c));}
function bindFavs(){main.querySelectorAll('.fav-btn').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;const i=FAVS.indexOf(id);if(i>-1)FAVS.splice(i,1);else FAVS.push(id);saveFavs();b.classList.toggle('on');if(currentRoute==='favorites')renderFavorites();});}
function filter(q){q=q.trim().toLowerCase();const cards=[...document.querySelectorAll('.card')];let shown=0;cards.forEach(c=>{const hit=!q||c.dataset.search.includes(q);c.style.display=hit?'':'none';if(hit)shown++;});const empty=document.getElementById('empty');if(empty)empty.hidden=shown>0;}

function renderFavorites(){setActiveTab('favorites');const items=FAVS.map(id=>ALLBYID[id]).filter(Boolean);const f=T().fav;let body=items.length===0?`<div class="empty"><span class="mono">EMPTY</span>${f.empty}</div>`:`<div id="cards">${items.map(cardHTML).join('')}</div>`;main.innerHTML=`<div class="section-head"><div class="kind mono">${f.kind}</div><h2>${f.title}</h2><p>${f.intro}</p></div>${body}`;}
function renderTables(){main.innerHTML=`<div class="section-head"><div class="kind mono">${TABLES.kind}</div><h2>${TABLES.title}</h2><p>${TABLES.intro}</p></div>`+TABLES.tables.map(t=>`<div class="cmp-table"><h3>${t.title}</h3><div class="cmp-scroll"><table class="t"><thead><tr>${t.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');}
function renderBuilds(){main.innerHTML=`<div class="section-head"><div class="kind mono">${BUILDS.kind}</div><h2>${BUILDS.title}</h2><p>${BUILDS.intro}</p></div><div class="build-grid">${BUILDS.list.map(b=>`<div class="build"><div class="build-head" style="border-top-color:${b.accent}"><div class="code mono">${b.code}</div><h3>${b.tier}</h3><div class="use">${b.use}</div></div><div class="build-parts">${b.parts.map(p=>`<div class="row"><span class="pk">${p.k}</span><span class="pv">${p.v}</span></div>`).join('')}</div></div>`).join('')}</div>`;}
function optionsHTML(sel){let h='';Object.keys(DATA).forEach(cat=>{h+=`<optgroup label="${DATA[cat].label}">`+DATA[cat].items.map(it=>`<option value="${cat}:${it.id}" ${cat+':'+it.id===sel?'selected':''}>${it.name}</option>`).join('')+`</optgroup>`;});return h;}
function findItem(v){const a=v.split(':');return DATA[a[0]].items.find(x=>x.id===a[1]);}
function renderCompare(){const c=T().cmp;main.innerHTML=`<div class="section-head"><div class="kind mono">${c.kind}</div><h2>${c.title}</h2><p>${c.intro}</p></div><div class="panel"><div class="form-grid"><div class="field"><label>${c.a}</label><select id="cmpA">${optionsHTML('pc:cpu')}</select></div><div class="field"><label>${c.b}</label><select id="cmpB">${optionsHTML('pc:gpu')}</select></div></div></div><div class="compare-cols" id="cmpOut"></div>`;const A=document.getElementById('cmpA'),B=document.getElementById('cmpB'),out=document.getElementById('cmpOut');function upd(){out.innerHTML=compareCard(findItem(A.value))+compareCard(findItem(B.value));}A.onchange=upd;B.onchange=upd;upd();}
function renderPSU(){const p=T().psu;main.innerHTML=`<div class="section-head"><div class="kind mono">${p.kind}</div><h2>${p.title}</h2><p>${p.intro}</p></div><div class="panel"><div class="form-grid"><div class="field"><label>${p.cpu}</label><select id="pCpu">${[65,95,150,220].map((w,i)=>`<option value="${w}" ${i===1?'selected':''}>${p.cpuOpts[i]}</option>`).join('')}</select></div><div class="field"><label>${p.gpu}</label><select id="pGpu">${[0,130,220,320,450].map((w,i)=>`<option value="${w}" ${i===2?'selected':''}>${p.gpuOpts[i]}</option>`).join('')}</select></div><div class="field"><label>${p.drv}</label><select id="pDrv"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label>${p.fan}</label><select id="pFan"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field"><label>${p.ram}</label><select id="pRam"><option value="2" selected>${p.ramOpts[0]}</option><option value="4">${p.ramOpts[1]}</option></select></div></div></div><div class="result"><div class="mono" style="color:var(--muted-2);font-size:.74rem;letter-spacing:.12em">${p.rec}</div><div class="big" id="pRec">—<span>W</span></div><div class="sub" id="pSub"></div><div class="draw" id="pDraw"></div><span class="pill">${p.pill}</span></div>`;const ids=['pCpu','pGpu','pDrv','pFan','pRam'].map(i=>document.getElementById(i));const sizes=[450,500,550,650,750,850,1000,1200];function calc(){const base=70,cpu=+ids[0].value,gpu=+ids[1].value,drv=+ids[2].value*6,fan=+ids[3].value*2.5,ram=+ids[4].value*4;const est=Math.round(base+cpu+gpu+drv+fan+ram);const rec=sizes.find(s=>s>=est*1.45)||1200;document.getElementById('pRec').innerHTML=rec+'<span>W</span>';document.getElementById('pSub').textContent=p.sub(est);document.getElementById('pDraw').textContent='EST. DRAW ≈ '+est+'W · HEADROOM ≈ '+Math.round((rec/est-1)*100)+'%';}ids.forEach(s=>s.onchange=calc);calc();}
function renderGlossary(){const g=T().gloss;const seen={},terms=[];Object.keys(DATA).forEach(cat=>DATA[cat].items.forEach(it=>(it.terms||[]).forEach(t=>{if(!seen[t.t]){seen[t.t]=1;terms.push(t);}})));EXTRA_TERMS.forEach(t=>{if(!seen[t.t]){seen[t.t]=1;terms.push(t);}});terms.sort((a,b)=>a.t.localeCompare(b.t));main.innerHTML=`<div class="section-head"><div class="kind mono">${g.kind}</div><h2>${g.title}</h2><p>${g.intro}</p></div><div class="panel" style="padding:14px"><input class="glsearch" id="glSearch" placeholder="${g.ph}"></div><div class="terms" id="glList">${terms.map(t=>`<div class="term" data-s="${(t.t+' '+t.d).toLowerCase()}"><div class="t mono">${t.t}</div><div class="d">${t.d}</div></div>`).join('')}</div>`;const inp=document.getElementById('glSearch');inp.oninput=()=>{const q=inp.value.trim().toLowerCase();main.querySelectorAll('#glList .term').forEach(el=>{el.style.display=(!q||el.dataset.s.includes(q))?'':'none';});};}

/* quiz (index-based) */
let Q={dev:null,i2:null,i3:null,step:0},_qcb=null;
const DEVKEYS=['pc','laptop','phone','monitor'];
function devKey(){return DEVKEYS[Q.dev];}
function renderQuiz(){Q={dev:null,i2:null,i3:null,step:0};paintQuiz();}
function paintQuiz(){const q=T().quiz;let inner='';if(Q.step===0)inner=quizStep('1 / 3',QUIZ.device.q,QUIZ.device.opts,i=>{Q.dev=i;Q.step=1;paintQuiz();});else if(Q.step===1){const k=devKey();inner=quizStep('2 / 3',QUIZ[k].q2.q,QUIZ[k].q2.opts,i=>{Q.i2=i;Q.step=2;paintQuiz();});}else if(Q.step===2){inner=quizStep('3 / 3',QUIZ.budget.q,QUIZ.budget.opts,i=>{Q.i3=i;Q.step=3;paintQuiz();});}else inner=quizResult();main.innerHTML=`<div class="section-head"><div class="kind mono">${q.kind}</div><h2>${q.title}</h2><p>${q.intro}</p></div><div class="quiz" id="quizBox">${inner}</div>`;bindQuiz();}
function quizStep(prog,q,opts,cb){_qcb=cb;return `<div class="qstep"><div class="qprog">${prog}</div><h3>${q}</h3><div class="qopts">${opts.map((o,i)=>`<button class="qopt" data-i="${i}">${o}</button>`).join('')}</div>${Q.step>0?`<button class="qback" data-back>${T().quiz.back}</button>`:''}</div>`;}
function bindQuiz(){const box=document.getElementById('quizBox');if(!box)return;box.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{if(_qcb)_qcb(+b.dataset.i);});const back=box.querySelector('[data-back]');if(back)back.onclick=()=>{Q.step=Math.max(0,Q.step-1);paintQuiz();};const r=box.querySelector('[data-restart]');if(r)r.onclick=()=>renderQuiz();}
function quizResult(){const r=RESULTS[devKey()][Q.i2];const note=RESULTS.budget[Q.i3];const pts=r.points.concat([note]);return `<div class="qres"><h3>${r.title}</h3><p class="lead">${T().quiz.lead}</p><ul class="choose">${pts.map(p=>`<li><span>${p}</span></li>`).join('')}</ul><button class="qback" data-restart>${T().quiz.restart}</button></div>`;}

 {q:"الجهاز بيعيش قد إيه، وإمتى أغيّره؟",a:"الكمبيوتر المكتبي بيعيش <b>5–7 سنين</b> وأكتر مع الترقيات، واللابتوب والموبايل <b>3–5 سنين</b> غالباً. غيّر لما الجهاز ميلبّيش احتياجك أو التحديثات الأمنية تقف — مش لمجرد نزول موديل جديد."},
 {q:"إيه هو الـNPU والـAI PC؟ محتاجه؟",a:"الـNPU معالج مخصّص لمهام الذكاء الاصطناعي بكفاءة. مزايا <b>Copilot+ PC</b> بتحتاج 40+ TOPS. لو مش هتستخدم الميزات دي، المعالج والكارت والرام أهم بكتير."},
 {q:"أشتري دلوقتي ولا أستنى الجيل الجديد؟",a:"دايماً فيه جيل جاي. لو محتاج الجهاز دلوقتي اشتري. الاستثناء: لو الإطلاق قريب جداً (أسابيع)، الانتظار ممكن يدّيك أداء أعلى أو تخفيض على الجيل الحالي."},
 {q:"الأنوية الكتير مهمة للألعاب؟",a:"لحد حد معيّن. <b>6–8 أنوية سريعة</b> كفاية لأغلب الألعاب، والتردد والكاش (زي معالجات X3D) بيفرقوا أكتر من عدد أنوية كبير."}
);
FAQS.en.items.push(
 {q:"How long does a device last, and when should I replace it?",a:"A desktop lasts <b>5–7 years</b> or more with upgrades; laptops and phones usually <b>3–5 years</b>. Replace it when it no longer meets your needs or security updates stop — not just because a new model launched."},
 {q:"What is an NPU / AI PC? Do I need one?",a:"An NPU is a processor dedicated to efficient AI tasks. <b>Copilot+ PC</b> features need 40+ TOPS. If you won't use those features, the CPU, GPU, and RAM matter far more."},
 {q:"Buy now or wait for the next generation?",a:"There's always a next generation. If you need the device now, buy. The exception: if a launch is very close (weeks), waiting can get you more performance or a discount on the current generation."},
